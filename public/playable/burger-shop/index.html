<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burger Shop</title>
<style>
:root {
  --bg: #2b1a14;
  --bg2: #1c100c;
  --panel: #45291f;
  --panel-hi: #5a3628;
  --line: #6d4535;
  --text: #fff4e2;
  --muted: #d9bba3;
  --accent: #ffc53d;
  --accent-dark: #c98a12;
  --red: #e8483b;
  --green: #5bbf5a;
  --ink: #3b2418;
  --ink-muted: #85695a;
  --cream: #fff8ec;
  --cream-2: #f6ead2;
  --cream-3: #e2cfab;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --side: 170px;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(ellipse at 50% 0%, #4a2a1d 0%, var(--bg) 55%, var(--bg2) 100%); background-color: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.coin { display: inline-block; flex: none; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff1b0, #ffc53d 55%, #e39c00); box-shadow: inset 0 0 0 1.5px #c88400; vertical-align: -2px; }

/* ---------- Game layout ---------- */
.app { position: fixed; inset: 0; display: grid; gap: 8px; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.app[data-layout="tall"] { grid-template: "hud" 40px "stage" minmax(0, 1fr) / minmax(0, 1fr); }
.app[data-layout="wide"] { grid-template: "hud stage" minmax(0, 1fr) / var(--side) minmax(0, 1fr); }

.hud { grid-area: hud; display: flex; gap: 6px; min-width: 0; min-height: 0; }
.app[data-layout="wide"] .hud { flex-direction: column; }
.hud-row { display: flex; gap: 6px; min-width: 0; flex: none; }
.app[data-layout="tall"] .hud-row { display: contents; }
.icon-btn { flex: none; width: 40px; min-height: 36px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line), 0 3px 0 #120906; display: grid; place-items: center; }
.icon-btn svg { width: 15px; height: 15px; fill: currentColor; }
.icon-btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 1px var(--line); }
.chip { min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 9px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; flex: none; }
.day-chip { flex: 0 1 auto; flex-direction: column; gap: 0; line-height: 1.1; }
.day-chip b { font-size: 16px; }
.day-chip small { display: none; font-size: 11.5px; font-weight: 800; color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.coin-chip { flex: 1 1 auto; flex-direction: column; gap: 3px; padding: 4px 9px; }
.coin-row { display: flex; align-items: center; gap: 5px; line-height: 1; }
.coin-row b { font-size: 17px; }
.coin-row small { font-size: 12.5px; font-weight: 800; color: var(--muted); }
.coin-chip.bump .coin-row b { animation: bump .45s ease-out; display: inline-block; }
@keyframes bump { 30% { transform: scale(1.25); color: var(--accent); } }
.bar { position: relative; width: 100%; height: 6px; border-radius: 6px; background: #1d110c; overflow: hidden; }
.bar[hidden] { display: none; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 6px; background: linear-gradient(90deg, #ff9f3b, var(--accent)); transition: width .25s ease-out; }
.bar.met i { background: linear-gradient(90deg, #4fb35a, #8ee06a); }
.bar em { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff4e2aa; }
.left-chip { flex: 0 1 auto; font-size: 17px; }
.hearts { display: none; gap: 2px; font-size: 16px; color: #ff5b6e; letter-spacing: 1px; }
.hearts i { font-style: normal; }
.hearts i.off { color: #6d4535; }
.left-chip.rush .hearts { display: inline-flex; }
.left-chip.rush .who { display: none; }
.side-stats, .side-keys { display: none; }
.app[data-layout="wide"] .day-chip { flex: 1 1 auto; align-items: flex-start; padding: 4px 10px; }
.app[data-layout="wide"] .day-chip small { display: block; }
.app[data-layout="wide"] .coin-chip { flex: none; align-items: stretch; padding: 8px 10px; gap: 6px; }
.app[data-layout="wide"] .coin-row b { font-size: 20px; }
.app[data-layout="wide"] .left-chip { flex: none; min-height: 38px; justify-content: flex-start; }
.app[data-layout="wide"] .side-stats { display: grid; gap: 3px; padding: 8px 10px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; font-weight: 800; }
.side-stats div { display: flex; justify-content: space-between; gap: 6px; }
.side-stats dt { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.side-stats dd { font-variant-numeric: tabular-nums; }
.app[data-layout="wide"] .side-keys { display: block; margin-top: auto; padding: 8px 10px; border-radius: 12px; background: #1d110c88; font-size: 11.5px; font-weight: 700; line-height: 1.45; color: var(--muted); overflow: hidden; }
@media (max-height: 560px) { .app[data-layout="wide"] .side-keys { display: none; } }
@media (max-height: 380px) {
  .app { gap: 6px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .app[data-layout="wide"] .coin-chip { padding: 5px 9px; gap: 4px; }
  .app[data-layout="wide"] .side-stats { padding: 5px 9px; font-size: 12px; gap: 1px; }
  .app[data-layout="wide"] .left-chip { min-height: 32px; }
  .icon-btn { min-height: 32px; }
}
@media (max-width: 360px) { .chip { padding: 0 6px; gap: 4px; } .coin-chip { padding: 4px 7px; } .day-chip b, .left-chip { font-size: 15px; } .coin-row b { font-size: 16px; } .icon-btn { width: 36px; } }

.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px #00000055, 0 6px 20px #0006; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: max-content; max-width: min(calc(100% - 16px), 440px); padding: 7px 14px; border-radius: 14px; background: #2b1a14ee; color: var(--text); font-size: 14px; font-weight: 800; line-height: 1.35; text-align: center; pointer-events: none; opacity: 0; box-shadow: 0 6px 18px #0007; }
.toast.show { animation: toast 2s ease-out both; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 6px); } 8%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.banner b { padding: 6px 22px; border-radius: 18px; background: #2b1a14cc; color: var(--accent); font-size: clamp(24px, 6vmin, 44px); font-weight: 900; text-shadow: 0 3px 0 #0006; opacity: 0; }
.banner.show b { animation: banner 1.6s ease-out both; }
@keyframes banner { 0% { opacity: 0; transform: scale(.85); } 12%, 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.04); } }

/* ---------- Panels ---------- */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #1c100c80; overflow: hidden; }
.overlay[hidden] { display: none; }
.panel { position: relative; width: min(100%, 400px); max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior: contain; padding: 20px 18px 18px; border-radius: 26px; background: var(--cream); color: var(--ink); text-align: center; box-shadow: 0 0 0 4px #ffffff40, 0 24px 60px #0a0402aa; animation: rise .3s ease-out; }
.panel.wide { width: min(100%, 620px); }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.logo { display: block; width: 150px; height: 84px; margin: 0 auto 2px; }
.panel h1 { font-size: clamp(30px, 9.5vw, 42px); font-weight: 900; letter-spacing: -.04em; line-height: 1.05; }
.panel h1 span { color: var(--red); }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
.panel p { margin-top: 8px; font-size: 14px; line-height: 1.45; color: var(--ink-muted); }
.panel .small { font-size: 12px; }
.panel h3 { margin: 14px 0 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.eyebrow { margin: 0 0 2px !important; font-size: 12px !important; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #c0632f !important; }
.play { width: 100%; margin-top: 16px; padding: 12px 10px 11px; border-radius: 18px; background: var(--accent); color: #3a2400; box-shadow: 0 5px 0 var(--accent-dark); display: grid; gap: 1px; }
.play b { font-size: 22px; font-weight: 900; }
.play small { font-size: 13px; font-weight: 800; opacity: .85; }
.play small:empty { display: none; }
.menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.mode { width: 100%; min-width: 0; padding: 9px 8px; border-radius: 16px; background: var(--cream-2); box-shadow: 0 4px 0 var(--cream-3); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 7px; font-weight: 900; font-size: 15px; line-height: 1.15; }
.mode small { font-size: 12.5px; font-weight: 800; color: #b06a08; }
.mode.rush { grid-column: 1 / -1; background: #ffe2d2; box-shadow: 0 4px 0 #efb99c; }
.help { margin-top: 12px !important; }
.keys { margin-top: 6px !important; font-size: 11.5px !important; }
.play:active, .mode:active, .btn:active, .dayc:active:not(:disabled), .buy:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }

.goalbig { margin-top: 10px !important; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 20px !important; font-weight: 900; color: var(--ink) !important; }
.goalbig .coin { width: 22px; height: 22px; }
.news { margin-top: 4px; }
.news[hidden], .vip[hidden] { display: none; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.ichip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border-radius: 99px; background: var(--cream-2); box-shadow: inset 0 0 0 1px var(--cream-3); font-size: 13.5px; font-weight: 800; }
.ichip img { width: 28px; height: 28px; display: block; }
.vip { color: #b0402a !important; font-weight: 800; }

.days { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; margin-top: 12px; }
.dayc { position: relative; min-width: 0; display: grid; gap: 1px; padding: 7px 2px 6px; border-radius: 13px; background: var(--cream-2); box-shadow: 0 3px 0 var(--cream-3); }
.dayc b { font-size: 17px; font-weight: 900; line-height: 1.1; }
.dayc .ms { font-size: 11px; letter-spacing: 1px; color: #cdbf98; white-space: nowrap; line-height: 1; }
.dayc .ms i { font-style: normal; color: #e09a10; }
.dayc.l0 { background: #fdeccf; }
.dayc.l1 { background: #dff2ee; box-shadow: 0 3px 0 #b7d9d1; }
.dayc.l2 { background: #e6e2f5; box-shadow: 0 3px 0 #c4bde3; }
.dayc.current { box-shadow: 0 0 0 3px #e09a10, 0 3px 0 var(--cream-3); }
.dayc:disabled { opacity: .45; }
.dayc .lock { font-size: 11px; line-height: 1; }
.locrow { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; font-size: 12px; font-weight: 800; color: var(--ink-muted); }
.locrow span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 3px; background: var(--c); vertical-align: -1px; }

.wallet { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 900 !important; color: var(--ink) !important; font-size: 16px !important; }
.ups { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; margin-top: 12px; text-align: left; }
.up { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 16px; background: var(--cream-2); box-shadow: inset 0 0 0 1px var(--cream-3); }
.up .ic { font-size: 26px; line-height: 1; text-align: center; }
.up b { display: block; font-size: 14.5px; font-weight: 900; line-height: 1.2; }
.up small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-muted); line-height: 1.25; }
.pips { display: flex; gap: 3px; margin-top: 3px; }
.pips i { width: 14px; height: 6px; border-radius: 3px; background: var(--cream-3); }
.pips i.on { background: #e09a10; }
.buy { min-width: 70px; min-height: 40px; padding: 6px 9px; border-radius: 12px; background: #3b9e57; color: #fff; font-weight: 900; font-size: 14px; box-shadow: 0 3px 0 #257040; display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
.buy.poor { background: #c9b99a; color: #5e4c37; box-shadow: 0 3px 0 #a8977a; }
.buy:disabled { background: transparent; color: var(--ink-muted); box-shadow: inset 0 0 0 1.5px var(--cream-3); font-size: 12px; white-space: normal; max-width: 92px; line-height: 1.15; }

.emblem { font-size: 46px; line-height: 1.1; }
.stars { margin-top: 4px; font-size: 40px; letter-spacing: 6px; line-height: 1.1; color: #dcd2b8; }
.stars[hidden] { display: none; }
.stars .on { color: #f2a90e; text-shadow: 0 2px 0 #b07408; }
.badge { display: inline-block; margin: 8px 4px 0 !important; padding: 5px 14px; border-radius: 99px; background: var(--accent); color: #3a2400 !important; font-weight: 800; font-size: 13px !important; }
.badge[hidden] { display: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { flex: 1 1 110px; min-height: 44px; padding: 11px 10px; border-radius: 14px; background: #3b9e57; color: #fff; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #257040; }
.btn.alt { background: var(--accent); color: #3a2400; box-shadow: 0 4px 0 var(--accent-dark); }
.btn.ghost { background: var(--cream-2); color: var(--ink); box-shadow: 0 4px 0 var(--cream-3); }
.btn[hidden] { display: none; }

@media (max-height: 640px) { .logo { display: none; } }
@media (max-height: 560px) and (max-aspect-ratio: 4/3) { .keys { display: none; } }
@media (max-width: 420px) { .days { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; } }
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .panel { width: min(100%, 580px); }
  .panel.wide { width: min(100%, 740px); }
  .days { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
  .menu-row.lm { grid-template-columns: 1fr 1fr 1fr; }
  .menu-row.lm .mode.rush { grid-column: auto; }
}
@media (max-height: 420px) {
  .panel { padding: 12px 14px; border-radius: 20px; }
  .panel h1 { font-size: 26px; }
  .panel h2 { font-size: 21px; }
  .panel p { margin-top: 4px; font-size: 13px; }
  .panel h3 { margin: 6px 0 4px; }
  .goalbig { font-size: 17px !important; margin-top: 4px !important; }
  .play { margin-top: 8px; padding: 7px 10px 6px; }
  .play b { font-size: 18px; }
  .mode { padding: 7px; font-size: 14px; }
  .help, .keys { display: none; }
  .emblem { font-size: 30px; }
  .stars { font-size: 28px; margin-top: 0; }
  .actions { margin-top: 10px; }
  .btn { min-height: 38px; padding: 8px 10px; font-size: 15px; }
  .days { margin-top: 8px; }
  .dayc { padding: 4px 2px; }
  .ups { margin-top: 8px; gap: 6px; }
  .up { padding: 5px 8px; }
  .ichip img { width: 22px; height: 22px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .toast.show, .banner.show b { opacity: 1; } }
</style>
</head>
<body>
<main class="app" id="app" data-layout="tall">
  <header class="hud" id="hud">
    <div class="hud-row">
      <button type="button" class="icon-btn" id="pause-btn" data-i18n-label="pause"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.6" height="12" rx="1.2"/><rect x="8.4" y="1" width="3.6" height="12" rx="1.2"/></svg></button>
      <div class="chip day-chip"><b id="hud-day"></b><small id="hud-loc"></small></div>
    </div>
    <div class="chip coin-chip" id="coin-chip" role="img">
      <div class="coin-row"><span class="coin" aria-hidden="true"></span><b id="hud-coins">0</b><small id="hud-goal"></small></div>
      <div class="bar" id="hud-bar"><i id="hud-fill"></i><em id="tick1"></em><em id="tick2"></em></div>
    </div>
    <div class="chip left-chip" id="left-chip" role="img">
      <svg class="who" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3.2" fill="#ffd9b8"/><path d="M2.5 15c0-3.6 2.4-5.6 5.5-5.6s5.5 2 5.5 5.6z" fill="#ef5a3c"/></svg><b class="who" id="hud-left">0</b>
      <span class="hearts" id="hud-hearts" aria-hidden="true"><i>♥</i><i>♥</i><i>♥</i></span>
    </div>
    <dl class="side-stats">
      <div><dt data-i18n="servedStat"></dt><dd id="st-served">0</dd></div>
      <div><dt data-i18n="lostStat"></dt><dd id="st-lost">0</dd></div>
      <div><dt data-i18n="tipsStat"></dt><dd id="st-tips">0</dd></div>
    </dl>
    <p class="side-keys" data-i18n="keys"></p>
  </header>
  <div class="stage" id="stage">
    <canvas id="canvas" tabindex="0" role="application" data-i18n-label="canvasLabel"></canvas>
    <div class="banner" id="banner" aria-hidden="true"><b id="banner-text"></b></div>
    <div class="toast" id="toast" aria-hidden="true"></div>
  </div>
</main>

<div class="overlay" id="menu">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <svg class="logo" viewBox="0 0 150 84" aria-hidden="true">
      <ellipse cx="64" cy="78" rx="48" ry="5" fill="#00000022"/>
      <rect x="24" y="62" width="80" height="13" rx="6" fill="#e9a54b" stroke="#b86f22" stroke-width="2.4"/>
      <rect x="20" y="49" width="88" height="14" rx="7" fill="#6e3a20"/>
      <path d="M20 46 h88 l-6 11 l-5 -6 h-46 l-7 10 l-5 -10 h-19z" fill="#ffcf3a"/>
      <path d="M17 45 q6 7 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" fill="none" stroke="#5cbf3f" stroke-width="7" stroke-linecap="round"/>
      <rect x="23" y="35" width="82" height="8" rx="4" fill="#e8483b"/>
      <path d="M21 36 C21 4 107 4 107 36 Z" fill="#f0a947" stroke="#b86f22" stroke-width="2.4" stroke-linejoin="round"/>
      <g fill="#fff3d6"><ellipse cx="46" cy="20" rx="3.4" ry="1.7" transform="rotate(-20 46 20)"/><ellipse cx="62" cy="15" rx="3.4" ry="1.7"/><ellipse cx="79" cy="19" rx="3.4" ry="1.7" transform="rotate(18 79 19)"/><ellipse cx="55" cy="27" rx="3.4" ry="1.7" transform="rotate(10 55 27)"/><ellipse cx="72" cy="27" rx="3.4" ry="1.7" transform="rotate(-12 72 27)"/><ellipse cx="90" cy="28" rx="3.4" ry="1.7" transform="rotate(25 90 28)"/></g>
      <g fill="#ffd34d" stroke="#d9a51e" stroke-width="1"><rect x="119" y="32" width="4" height="22" rx="1.5" transform="rotate(-8 121 43)"/><rect x="125" y="28" width="4" height="26" rx="1.5"/><rect x="131" y="31" width="4" height="23" rx="1.5" transform="rotate(8 133 42)"/><rect x="128" y="34" width="4" height="20" rx="1.5" transform="rotate(-3 130 44)"/></g>
      <path d="M114 46 h26 l-4 30 h-18z" fill="#e8483b" stroke="#a82f25" stroke-width="2" stroke-linejoin="round"/>
      <path d="M121 58 a6 5 0 0 0 12 0" fill="none" stroke="#ffd34d" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <h1 id="menu-title">Burger <span>Shop</span></h1>
    <p data-i18n="tagline"></p>
    <button type="button" class="play" id="play"><b data-i18n="play"></b><small id="play-info"></small></button>

      if (f.t < 0) continue;
      const k = f.t / f.T;
      if (f.k === 'text') { c.globalAlpha = 1 - k * k; c.font = `900 18px ${FONT}`; c.lineWidth = 4; c.strokeStyle = '#3b2418'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.strokeText(f.text, f.x, f.y - k * 30); label(c, f.text, f.x, f.y - k * 30, 18, f.col); }
      else if (f.k === 'puff') { c.globalAlpha = (1 - k) * .7; ell(c, f.x, f.y, 4 + k * 8, 4 + k * 8); c.fillStyle = '#b8b0a8'; c.fill(); }
      else { c.globalAlpha = 1 - k; c.fillStyle = '#ffd34d'; c.fillRect(f.x - 2, f.y - 2, 4, 4); }
    }
    c.globalAlpha = 1;
  }

  // ---------- Loop ----------
  let last = performance.now(), acc = 0;
  const playing = () => G && G.started && !G.over && !G.paused && !current;
  function frame(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000));
    last = now; vt += dt;
    if (playing()) {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 6) { step(STEP); acc -= STEP; n++; }
      if (n >= 6) acc = 0;
      if (G) refreshHud(false);
    } else {
      acc = 0;
      if (G && G.over) { updateFx(dt); G.overT += dt; if (G.overT > 1.1 && !G.shown) { G.shown = true; refreshHud(true); showResult(); } }
    }
    render();
    requestAnimationFrame(frame);
  }

  // ---------- Input ----------
  function hit(x, y) {
    const Z = view.Z, inR = r => r && x >= r.x && y >= r.y && x <= r.x + r.w && y <= r.y + r.h;
    for (let i = 0; i < SPOTS; i++) if (G.spots[i] && inR(Z.spots[i])) return { kind: 'cust', i };
    for (let i = 0; i < MAXP; i++) if (inR(Z.plates[i])) return { kind: 'plate', i };
    for (let i = 0; i < MAXG; i++) if (inR(Z.grill[i])) return { kind: 'grill', i };
    if (inR(Z.fryer)) return { kind: 'fryer' };
    if (inR(Z.drinks)) return { kind: 'drinks' };
    if (inR(Z.trash)) return { kind: 'trash' };
    for (const k of BINS) if (inR(Z.bins[k])) return { kind: 'bin', id: k };
    return null;
  }
  canvas.addEventListener('pointerdown', e => {
    if (!playing()) return;
    canvas.focus({ preventScroll: true });
    const src = hit(e.offsetX, e.offsetY);
    drag = { id: e.pointerId, x0: e.offsetX, y0: e.offsetY, x: e.offsetX, y: e.offsetY, src, moved: false };
    try { canvas.setPointerCapture(e.pointerId); } catch {}
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse' && G) { hover = playing() ? hit(e.offsetX, e.offsetY) : null; canvas.style.cursor = hover ? 'pointer' : 'default'; }
    if (!drag || drag.id !== e.pointerId) return;
    drag.x = e.offsetX; drag.y = e.offsetY;
    if (!drag.moved && Math.hypot(drag.x - drag.x0, drag.y - drag.y0) > 10 && draggable(drag.src)) drag.moved = true;
  });
  canvas.addEventListener('pointerup', e => {
    if (!drag || drag.id !== e.pointerId) return;
    const d = drag; drag = null;
    if (!playing()) return;
    if (d.moved) drop(d.src, hit(e.offsetX, e.offsetY));
    else if (sameT(d.src, hit(e.offsetX, e.offsetY))) tap(d.src);
  });
  canvas.addEventListener('pointercancel', () => { drag = null; });
  canvas.addEventListener('pointerleave', () => { hover = null; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.ctrlKey || e.metaKey || e.altKey || !playing()) return;
    const k = e.key.toLowerCase(), onBtn = e.target && e.target.closest && e.target.closest('button');
    const bin = BINS.find(b => KEY[b] === k);
    showKeys = true;
    if (bin) tapBin(bin);
    else if (/^[1-4]$/.test(k)) tapPlate(+k - 1);
    else if (k === 'g') grabPatty();
    else if (k === 'f') tapFries();
    else if (k === 'd') tapDrinks();
    else if ((k === 'enter' || k === ' ') && !onBtn) serveActive();
    else if (k === 's') serveActive();
    else if (k === 'x' || k === 'delete' || k === 'backspace') tapTrash();
    else if (k === 'p') pause();
    else if (k === 'arrowleft' || k === 'arrowright') { const n = G.cfg.plateN; G.active = (G.active + (k === 'arrowleft' ? n - 1 : 1)) % n; }
    else return;
    e.preventDefault();
  });

  $('pause-btn').addEventListener('click', pause);
  $('play').addEventListener('click', () => (allClear() ? showDays() : showIntro(frontier)));
  $('go-days').addEventListener('click', showDays);
  $('go-shop').addEventListener('click', () => showShop('menu'));
  $('go-rush').addEventListener('click', startRush);
  $('days-back').addEventListener('click', showMenu);
  $('intro-start').addEventListener('click', beginDay);
  $('intro-shop').addEventListener('click', () => showShop('intro'));
  $('intro-menu').addEventListener('click', showMenu);
  $('shop-done').addEventListener('click', closeShop);
  $('resume').addEventListener('click', resume);
  $('restart').addEventListener('click', restart);
  $('quit').addEventListener('click', () => { G.started = false; showMenu(); });
  $('result-next').addEventListener('click', () => showIntro(Math.min(DAYS, G.day + 1)));
  $('result-retry').addEventListener('click', restart);
  $('result-shop').addEventListener('click', () => showShop('result'));
  $('result-menu').addEventListener('click', showMenu);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', () => { drag = null; });
  new ResizeObserver(() => fitCanvas()).observe(stage);
  window.addEventListener('resize', layout);

  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__burgerShop = {
    state: () => G && {
      mode: G.mode, day: G.day, time: +G.time.toFixed(2), started: G.started, over: G.over, paused: G.paused, coins: G.coins, tips: G.tips, served: G.served, lost: G.lost, strikes: G.strikes, burns: G.burns, wrongs: G.wrongs,
      goals: G.goals && G.goals.slice(), total: G.plan ? G.plan.list.length : 0, next: G.next, cfg: { ...G.cfg }, unlockDay: G.unlockDay,
      spots: G.spots.map(c => c && { st: c.st, type: c.type, burger: c.order.burger && c.order.burger.slice(), fries: c.order.fries, drink: c.order.drink, got: { ...c.got }, pat: +c.pat.toFixed(2), max: +c.max.toFixed(2) }),
      grill: G.grill.map(p => p && { t: +p.t.toFixed(2), st: pState(p) }), plates: G.plates.map(p => p.slice()), active: G.active,
      fries: G.fries, fryT: G.fryT, drinks: G.drinks, pourT: G.pourT, result: G.result, overlay: current, layout: app.dataset.layout, wide: view.Z && view.Z.wide,
      frontier, stars: stars.slice(), wallet, ups: { ...ups }, rushBest, hint: hint(),
    },
    center: (kind, k) => { const r = rectOf(kind === 'bin' ? { kind, id: k } : { kind, i: k }), b = canvas.getBoundingClientRect(); return r && { x: b.left + r.x + r.w / 2, y: b.top + r.y + r.h / 2 }; },
    rect: (kind, k) => { const r = rectOf(kind === 'bin' ? { kind, id: k } : { kind, i: k }), b = canvas.getBoundingClientRect(); return r && { x: b.left + r.x, y: b.top + r.y, w: r.w, h: r.h }; },
    ticket: i => { const s = view.Z.spots[i], g = spotGeo(s), b = canvas.getBoundingClientRect(); return { x: b.left + g.ticket.x, y: b.top + g.ticket.y, w: g.ticket.w, h: g.ticket.h }; },
    tap: (kind, k) => playing() && tap(kind === 'bin' ? { kind, id: k } : kind === 'fryer' || kind === 'drinks' || kind === 'trash' ? { kind } : { kind, i: k }),
    key: k => { if (!playing()) return false; const ev = new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }); document.dispatchEvent(ev); return ev.defaultPrevented; },
    sim: sec => { for (let i = 0, n = Math.round(sec / STEP); i < n && playing(); i++) step(STEP); if (G) refreshHud(true); },
  };

  layout();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
