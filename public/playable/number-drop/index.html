<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Number Drop</title>
<style>
:root {
  --bg: #17123a;
  --panel: #241d58;
  --cell: #2c2468;
  --text: #f6f3ff;
  --muted: #a9a3d6;
  --accent: #ffcf4a;
  --danger: #ff5d7a;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(ellipse at top, #2e2570, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; font-size: clamp(24px, 7.5vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1; }
h1 span { color: var(--accent); }
.icon-btn { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 14px; background: var(--panel); font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 #120e30; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #120e30; }
.hud { display: flex; gap: 6px; align-items: stretch; }
.stat { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 14px; background: var(--panel); text-align: center; position: relative; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.gain { position: absolute; left: 0; right: 0; top: 4px; font-size: 15px; font-weight: 900; color: var(--accent); opacity: 0; pointer-events: none; }
.gain.show { animation: gain .7s ease-out; }
@keyframes gain { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-26px); } }
.next-box { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 5px 10px; }
.chip { min-width: 34px; height: 26px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; font-size: 14px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #0005; box-shadow: inset 0 -3px 0 #0003; }
.swap { flex: 0 0 auto; width: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; background: var(--panel); box-shadow: 0 3px 0 #120e30; }
.swap b { font-size: 20px; line-height: 1.1; }
.swap small { font-size: 11px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.swap:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #120e30; }
.swap:disabled { opacity: .4; cursor: default; }

.stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
canvas { display: block; touch-action: none; cursor: pointer; border-radius: 22px; }
canvas:focus-visible { outline: 2px solid #ffcf4a88; outline-offset: 3px; }
.hint { text-align: center; font-size: 12px; color: var(--muted); }

.overlay { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; background: #17123acc; border-radius: 22px; animation: fade .3s; }
.overlay[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
.panel { width: min(100%, 340px); max-height: 100%; overflow: auto; padding: 24px 20px; border-radius: 26px; background: var(--panel); text-align: center; box-shadow: 0 20px 50px #0007, inset 0 0 0 1px #ffffff14; }
.panel h2 { font-size: clamp(26px, 8vw, 34px); font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
.panel h2 span { color: var(--accent); }
.panel p { margin-top: 10px; color: var(--muted); line-height: 1.45; font-size: 15px; }
.panel .small { font-size: 13px; }
.panel .result { color: var(--text); font-size: 18px; font-weight: 800; }
.demo { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; font-weight: 900; color: var(--muted); }
.demo .chip { min-width: 40px; height: 40px; font-size: 16px; border-radius: 10px; }
.badge { display: inline-block; margin-top: 12px; padding: 5px 14px; border-radius: 99px; background: var(--accent); color: #241a05 !important; font-weight: 800; font-size: 14px !important; }
.badge[hidden] { display: none; }
.cta { margin-top: 20px; width: 100%; padding: 14px; border-radius: 16px; background: var(--accent); color: #241a05; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 #c99a1c; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #c99a1c; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>Number <span>Drop</span></h1>
    <button type="button" class="icon-btn" id="restart" data-i18n-label="restart">↻</button>
  </div>
  <div class="hud">
    <div class="stat"><small data-i18n="score"></small><strong id="score">0</strong><span class="gain" id="gain" aria-hidden="true"></span></div>
    <div class="stat"><small data-i18n="best"></small><strong id="best">0</strong></div>
    <div class="stat next-box"><small data-i18n="next"></small><span class="chip" id="next"></span></div>
    <button type="button" class="swap" id="swap" data-i18n-label="swap"><b aria-hidden="true">⇅</b><small id="swaps">2</small></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="canvas" tabindex="0" role="application" aria-roledescription="Number Drop" aria-describedby="hint"></canvas>
    <div class="overlay" id="intro">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="intro-title">
        <h2 id="intro-title">Number <span>Drop</span></h2>
        <div class="demo" aria-hidden="true"><span class="chip" data-v="2">2</span><span class="chip" data-v="2">2</span><span>→</span><span class="chip" data-v="4">4</span></div>
        <p data-i18n="tagline"></p>
        <p class="small" data-i18n="controls"></p>
        <button type="button" class="cta" id="play" data-i18n="play"></button>
      </div>
    </div>
    <div class="overlay" id="over" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="over-title">
        <h2 id="over-title" data-i18n="over"></h2>
        <p data-i18n="overText"></p>
        <p class="result" id="final"></p>
        <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
        <button type="button" class="cta" id="again" data-i18n="again"></button>
      </div>
    </div>
  </div>
  <p class="hint" id="hint" data-i18n="hint"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<script>
(() => {
  const I18N = {
    en: { tagline: 'Drop numbered blocks into the columns. Equal blocks that touch merge into one bigger block!', controls: 'Tap a column, or use ← → and Space. Swap trades your block for the next one.', play: 'Play', score: 'Score', best: 'Best', next: 'Next', swap: 'Swap current and next block', restart: 'New game', hint: 'Tap a column · ← → to aim, Space to drop', over: 'Game over', overText: 'A column overflowed.', final: (s, m) => `Score ${s} · Biggest block ${m}`, newBest: 'New best!', again: 'Play again', milestone: v => `New biggest block: ${v}!`, aim: (c, v) => `Column ${c}, dropping ${v}`, swapped: (a, b) => `Swapped. Now dropping ${a}, next ${b}.`, combo: n => `Combo ×${n}` },
    vi: { tagline: 'Thả các khối số vào cột. Hai khối bằng nhau chạm nhau sẽ gộp thành một khối lớn hơn!', controls: 'Chạm vào một cột, hoặc dùng ← → và Space. Nút Đổi giúp đổi khối hiện tại với khối kế tiếp.', play: 'Chơi', score: 'Điểm', best: 'Kỷ lục', next: 'Tiếp', swap: 'Đổi khối hiện tại với khối kế tiếp', restart: 'Ván mới', hint: 'Chạm vào cột · ← → để ngắm, Space để thả', over: 'Kết thúc', overText: 'Một cột đã bị tràn.', final: (s, m) => `Điểm ${s} · Khối lớn nhất ${m}`, newBest: 'Kỷ lục mới!', again: 'Chơi lại', milestone: v => `Khối lớn nhất mới: ${v}!`, aim: (c, v) => `Cột ${c}, sắp thả ${v}`, swapped: (a, b) => `Đã đổi. Thả ${a}, tiếp theo ${b}.`, combo: n => `Combo ×${n}` },
    zh: { tagline: '把数字方块投进各列，相同的方块相碰就会合成更大的方块！', controls: '点击某一列，或用 ← → 和空格键。“交换”可把当前方块和下一个对调。', play: '开始', score: '得分', best: '最高分', next: '下一个', swap: '交换当前方块和下一个方块', restart: '新游戏', hint: '点击列投放 · ← → 瞄准，空格投放', over: '游戏结束', overText: '有一列堆满溢出了。', final: (s, m) => `得分 ${s} · 最大方块 ${m}`, newBest: '新纪录！', again: '再玩一次', milestone: v => `新的最大方块：${v}！`, aim: (c, v) => `第 ${c} 列，即将投放 ${v}`, swapped: (a, b) => `已交换。当前 ${a}，下一个 ${b}。`, combo: n => `连击 ×${n}` },
    fr: { tagline: 'Lâchez des blocs numérotés dans les colonnes. Deux blocs égaux qui se touchent fusionnent en un bloc plus grand !', controls: 'Touchez une colonne, ou utilisez ← → et Espace. Échanger inverse votre bloc et le suivant.', play: 'Jouer', score: 'Score', best: 'Record', next: 'Suivant', swap: 'Échanger le bloc actuel et le suivant', restart: 'Nouvelle partie', hint: 'Touchez une colonne · ← → pour viser, Espace pour lâcher', over: 'Partie terminée', overText: 'Une colonne a débordé.', final: (s, m) => `Score ${s} · Plus gros bloc ${m}`, newBest: 'Nouveau record !', again: 'Rejouer', milestone: v => `Nouveau plus gros bloc : ${v} !`, aim: (c, v) => `Colonne ${c}, bloc ${v}`, swapped: (a, b) => `Échangé. Bloc ${a}, puis ${b}.`, combo: n => `Combo ×${n}` },
    th: { tagline: 'ปล่อยบล็อกตัวเลขลงในแต่ละคอลัมน์ บล็อกที่เลขเท่ากันเมื่อแตะกันจะรวมเป็นบล็อกที่ใหญ่ขึ้น!', controls: 'แตะคอลัมน์ หรือใช้ ← → แล้วกด Space ปุ่มสลับใช้แลกบล็อกปัจจุบันกับบล็อกถัดไป', play: 'เล่น', score: 'คะแนน', best: 'สูงสุด', next: 'ถัดไป', swap: 'สลับบล็อกปัจจุบันกับบล็อกถัดไป', restart: 'เกมใหม่', hint: 'แตะคอลัมน์ · ← → เล็ง, Space ปล่อย', over: 'จบเกม', overText: 'มีคอลัมน์ล้นแล้ว', final: (s, m) => `คะแนน ${s} · บล็อกใหญ่สุด ${m}`, newBest: 'สถิติใหม่!', again: 'เล่นอีกครั้ง', milestone: v => `บล็อกใหญ่สุดใหม่: ${v}!`, aim: (c, v) => `คอลัมน์ ${c} กำลังจะปล่อย ${v}`, swapped: (a, b) => `สลับแล้ว ปล่อย ${a} ถัดไป ${b}`, combo: n => `คอมโบ ×${n}` },
    ja: { tagline: '数字ブロックを列に落とそう。同じ数字がくっつくと合体して大きくなる！', controls: '列をタップするか、← → とスペースキーで操作。「入れ替え」で今のブロックと次のブロックを交換。', play: 'プレイ', score: 'スコア', best: 'ベスト', next: 'ネクスト', swap: '今のブロックと次のブロックを入れ替え', restart: '新しいゲーム', hint: '列をタップ · ← → で狙ってスペースで落とす', over: 'ゲームオーバー', overText: '列があふれてしまった。', final: (s, m) => `スコア ${s} · 最大ブロック ${m}`, newBest: '自己ベスト更新！', again: 'もう一度', milestone: v => `最大ブロック更新：${v}！`, aim: (c, v) => `${c}列目、${v} を落とす`, swapped: (a, b) => `入れ替えました。今は ${a}、次は ${b}。`, combo: n => `コンボ ×${n}` },
    ko: { tagline: '숫자 블록을 칸에 떨어뜨리세요. 같은 숫자끼리 닿으면 더 큰 블록으로 합쳐져요!', controls: '열을 탭하거나 ← → 와 Space를 사용하세요. 교환 버튼으로 지금 블록과 다음 블록을 바꿀 수 있어요.', play: '시작', score: '점수', best: '최고', next: '다음', swap: '지금 블록과 다음 블록 바꾸기', restart: '새 게임', hint: '열을 탭 · ← → 로 조준, Space로 떨어뜨리기', over: '게임 오버', overText: '열이 넘쳐 버렸어요.', final: (s, m) => `점수 ${s} · 최대 블록 ${m}`, newBest: '최고 기록!', again: '다시 하기', milestone: v => `최대 블록 갱신: ${v}!`, aim: (c, v) => `${c}번째 열, ${v} 떨어뜨리기`, swapped: (a, b) => `교환 완료. 지금 ${a}, 다음 ${b}.`, combo: n => `콤보 ×${n}` },
  };
  const requested = new URLSearchParams(location.search).get('lang');
  const lang = I18N[requested] ? requested : 'en';
  const t = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t[el.dataset.i18n];
  for (const el of document.querySelectorAll('[data-i18n-label]')) el.setAttribute('aria-label', t[el.dataset.i18nLabel]);

  // Logical field: 5 lanes of 7 rows, plus a launch row above the board (row index ROWS) where the next block waits.
  const COLS = 5, ROWS = 7, CELL = 68, PAD = 12, TOP = 96;
  const W = COLS * CELL + PAD * 2, H = TOP + ROWS * CELL + PAD;
  const STORAGE_KEY = 'milaan.numberDrop.best';
  const MAX_SWAPS = 3;
  const FONT = 'ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const COLORS = ['#ff6b8b', '#ffa94d', '#f5c518', '#5fcf73', '#2fc6a0', '#3fa2f2', '#6f86ff', '#a98bff', '#f06fb0', '#d977f0', '#ffb300', '#ef4f5f', '#1fb5c9', '#8bc34a', '#7e57c2'];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const els = { score: $('score'), gain: $('gain'), best: $('best'), next: $('next'), swap: $('swap'), swaps: $('swaps'), intro: $('intro'), over: $('over'), final: $('final'), newBest: $('new-best'), again: $('again'), announcer: $('announcer') };

  const readBest = () => { try { return Number(localStorage.getItem(STORAGE_KEY)) || 0; } catch { return 0; } };
  const writeBest = value => { try { localStorage.setItem(STORAGE_KEY, String(value)); } catch {} };

  const colorFor = v => COLORS[(Math.log2(v) - 1) % COLORS.length];
  const label = v => (v >= 1048576 ? `${v / 1048576}M` : v >= 16384 ? `${v / 1024}K` : String(v));
  const rowY = r => TOP + (ROWS - 1 - r) * CELL;
  const colX = c => PAD + c * CELL;
  const easeIn = p => p * p;
  const easeOut = p => 1 - (1 - p) * (1 - p);
  const linear = p => p;

  for (const chip of document.querySelectorAll('.demo .chip')) chip.style.background = colorFor(Number(chip.dataset.v));

  // --- Tweens: every animation is a promise so the game logic can simply await it.
  const tweens = new Set();
  function tween(ms, fn, ease = easeOut) {
    return new Promise(resolve => {
      if (reduced || ms <= 0) { fn(1); resolve(); return; }
      tweens.add({ t: 0, ms, fn, ease, resolve });
    });
  }
  function stepTweens(dtMs) {
    for (const tw of [...tweens]) {
      tw.t += dtMs;
      const p = Math.min(1, tw.t / tw.ms);
      tw.fn(tw.ease(p));
      if (p >= 1) { tweens.delete(tw); tw.resolve(); }
    }
  }

  let game;
  let scale = 1;
  let blockId = 0;

  function randomValue() {
    // The spawn pool widens as bigger blocks appear, always favouring small numbers.
    const top = Math.max(3, Math.min(6, Math.floor(Math.log2(Math.max(2, game.highest))) - 3));
    const weights = [];
    for (let e = 1; e <= top; e++) weights.push(top - e + 1.5);
    let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < weights.length; i++) { roll -= weights[i]; if (roll <= 0) return 2 ** (i + 1); }
    return 2;
  }

  function makeBlock(v, c, r) {
    const block = { id: blockId++, v, c, r, x: c, y: r, s: 1, a: 1, flash: 0 };
    game.grid[c][r] = block;
    return block;
  }

  function newGame() {
    game = { grid: Array.from({ length: COLS }, () => Array(ROWS + 1).fill(null)), score: 0, best: readBest(), highest: 2, swaps: 2, aim: 2, busy: false, queued: null, over: false, started: game?.started ?? false, popups: [], dropScale: 1, shake: 0, danger: 0 };
    game.current = randomValue();
    game.next = randomValue();
    tweens.clear();
    els.over.hidden = true;
    els.newBest.hidden = true;
    setScore(0);
    updateHud();
  }

  function setScore(value, gained = 0) {
    game.score = value;
    els.score.firstChild.textContent = String(game.score);
    els.best.textContent = String(Math.max(game.best, game.score));
    if (gained) {
      els.gain.textContent = `+${gained}`;
      els.gain.className = 'gain';
      void els.gain.offsetWidth;
      els.gain.className = 'gain show';
    }
  }

  function updateHud() {
    els.next.textContent = label(game.next);
    els.next.style.background = colorFor(game.next);
    els.swaps.textContent = `×${game.swaps}`;
    els.swap.disabled = game.swaps <= 0 || game.over;
    canvas.setAttribute('aria-label', t.aim(game.aim + 1, game.current));
  }

  const height = c => game.grid[c].findIndex(cell => !cell) === -1 ? ROWS + 1 : game.grid[c].findIndex(cell => !cell);

  function start() {
    els.intro.hidden = true;
    game.started = true;
    canvas.focus({ preventScroll: true });
  }

  async function drop(col) {
    if (!game.started || game.over) return;
    if (game.busy) { game.queued = col; return; }
    game.busy = true;
    game.aim = col;
    const landing = height(col);
    const block = makeBlock(game.current, col, landing);
    block.y = ROWS;
    game.current = game.next;
    game.next = randomValue();
    game.dropScale = 0;
    tween(220, p => { game.dropScale = p; });
    updateHud();
    const gen = game;
    await tween(60 + 38 * (ROWS - landing), p => { block.y = ROWS + (landing - ROWS) * p; }, easeIn);
    if (gen !== game) return;
    squash(block);
    await resolve(block);
    if (gen !== game) return;
    if (game.grid.some(column => column[ROWS])) return gameOver();
    game.busy = false;
    updateHud();
    if (game.queued !== null) { const queued = game.queued; game.queued = null; drop(queued); }
  }

  function squash(block) {
    tween(160, p => { block.s = 1 + Math.sin(p * Math.PI) * 0.08; }, linear);
  }

  const neighbours = (c, r) => [[c - 1, r], [c + 1, r], [c, r - 1], [c, r + 1]].filter(([x, y]) => x >= 0 && x < COLS && y >= 0 && y <= ROWS);

  // Merge the block with every equal neighbour, let the columns fall, then re-check whatever moved.
  async function resolve(first) {
    const gen = game;
    let queue = [first];
    let combo = 0;
    while (queue.length) {
      const block = queue.shift();
      if (block.dead) continue;
      const parts = neighbours(block.c, block.r).map(([x, y]) => game.grid[x][y]).filter(other => other && other.v === block.v);
      if (!parts.length) continue;
      combo += 1;
      for (const part of parts) { game.grid[part.c][part.r] = null; part.dead = true; part.fx = part.x; part.fy = part.y; }
      game.merging = parts;
      await tween(140, p => { for (const part of parts) { part.x = part.fx + (block.c - part.fx) * p; part.y = part.fy + (block.r - part.fy) * p; part.a = 1 - p * 0.5; part.s = 1 - p * 0.25; } }, easeIn);
      if (gen !== game) return;
      game.merging = null;
      block.v *= 2 ** parts.length;
      const gained = block.v * combo;
      setScore(game.score + gained, gained);
      game.popups.push({ text: combo > 1 ? `${t.combo(combo)}` : `+${gained}`, x: colX(block.c) + CELL / 2, y: rowY(block.r), life: 1 });
      block.flash = 1;
      tween(240, p => { block.s = 1 + Math.sin(p * Math.PI) * 0.2; block.flash = 1 - p; }, linear);
      if (block.v > game.highest) newHighest(block.v);
      const moved = await settle();
      if (gen !== game) return;
      queue = [block, ...moved, ...queue.filter(other => other !== block && !moved.includes(other))];
    }
  }

  function newHighest(v) {
    game.highest = v;
    if (v >= 128) els.announcer.textContent = t.milestone(v);
    if (v >= 256 && game.swaps < MAX_SWAPS) { game.swaps += 1; updateHud(); }
  }

  async function settle() {
    const moved = [];
    for (let c = 0; c < COLS; c++) {
      let write = 0;
      for (let r = 0; r <= ROWS; r++) {
        const block = game.grid[c][r];
        if (!block) continue;
        if (r !== write) { game.grid[c][r] = null; game.grid[c][write] = block; block.fy = block.r; block.r = write; moved.push(block); }
        write += 1;
      }
    }
    if (!moved.length) return moved;
    const longest = Math.max(...moved.map(block => block.fy - block.r));
    await tween(70 + 45 * longest, p => { for (const block of moved) block.y = block.fy + (block.r - block.fy) * Math.min(1, p * longest / (block.fy - block.r)); }, easeIn);
    for (const block of moved) { block.y = block.r; squash(block); }
    return moved;
  }

  function gameOver() {
    game.over = true;
    game.shake = 1;
    const isBest = game.score > game.best;
    if (isBest) writeBest(game.score);
    els.final.textContent = t.final(game.score, label(game.highest));
    els.newBest.hidden = !isBest || game.score === 0;
    updateHud();
    els.announcer.textContent = `${t.over}. ${t.overText} ${t.final(game.score, game.highest)}`;
    setTimeout(() => { if (!game.over) return; els.over.hidden = false; els.again.focus({ preventScroll: true }); }, reduced ? 0 : 700);
  }

  function useSwap() {
    if (!game.started || game.over || game.swaps <= 0) return;
    game.swaps -= 1;
    [game.current, game.next] = [game.next, game.current];
    game.dropScale = 0;
    tween(200, p => { game.dropScale = p; });
    updateHud();
    els.announcer.textContent = t.swapped(game.current, game.next);
  }

  function resize() {
    const stage = $('stage').getBoundingClientRect();
    scale = Math.min(stage.width / W, stage.height / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = `${W * scale}px`;
    canvas.style.height = `${H * scale}px`;
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    draw();
  }

  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  function drawBlock(v, x, y, s = 1, a = 1, flash = 0) {
    const inset = 4, size = CELL - inset * 2;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x + CELL / 2, y + CELL / 2);
    ctx.scale(s, s);
    ctx.fillStyle = '#00000040';
    roundRect(-size / 2, -size / 2 + 4, size, size, 14); ctx.fill();
    ctx.fillStyle = colorFor(v);
    roundRect(-size / 2, -size / 2, size, size, 14); ctx.fill();
    ctx.fillStyle = '#ffffff38';
    roundRect(-size / 2 + 5, -size / 2 + 4, size - 10, size * 0.32, 10); ctx.fill();
    ctx.fillStyle = '#0000001f';
    roundRect(-size / 2, size / 2 - 8, size, 8, [0, 0, 14, 14]); ctx.fill();
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`; roundRect(-size / 2, -size / 2, size, size, 14); ctx.fill(); }
    const text = label(v);
    const fontSize = text.length <= 2 ? 28 : text.length === 3 ? 23 : 19;
    ctx.font = `900 ${fontSize}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#00000040';
    ctx.fillText(text, 0, 2.5);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, 0, 1);
    ctx.restore();
  }

  function draw() {
    if (!game) return;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (game.shake > 0 && !reduced) ctx.translate(Math.sin(game.shake * 40) * game.shake * 6, 0);

    ctx.fillStyle = '#241d58';
    roundRect(0, 0, W, H, 22); ctx.fill();
    const boardTop = TOP, boardH = ROWS * CELL;
    for (let c = 0; c < COLS; c++) {
      const full = height(c) >= ROWS;
      ctx.fillStyle = c === game.aim && !game.over ? '#3a3186' : c % 2 ? '#2c2468' : '#2a2262';
      roundRect(colX(c) + 2, boardTop, CELL - 4, boardH, 12); ctx.fill();
      if (full && !game.over) { ctx.fillStyle = '#ff5d7a33'; roundRect(colX(c) + 2, boardTop, CELL - 4, CELL, 12); ctx.fill(); }
    }
    // Danger line marking the top of the board.
    const danger = game.grid.some((column, c) => height(c) >= ROWS);
    ctx.strokeStyle = danger ? '#ff5d7a' : '#ffffff30';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 7]);
    ctx.beginPath(); ctx.moveTo(PAD, boardTop - 3); ctx.lineTo(W - PAD, boardTop - 3); ctx.stroke();
    ctx.setLineDash([]);

    // Ghost of where the waiting block will land.
    if (game.started && !game.over && !game.busy) {
      const landing = height(game.aim);
      if (landing < ROWS) {
        ctx.strokeStyle = `${colorFor(game.current)}aa`;
        ctx.lineWidth = 2.5;
        ctx.setLineDash([6, 5]);
        roundRect(colX(game.aim) + 5, rowY(landing) + 5, CELL - 10, CELL - 10, 13); ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    for (const column of game.grid) for (const block of column) if (block) drawBlock(block.v, colX(block.x), rowY(block.y), block.s, block.a, block.flash);
    for (const part of game.merging || []) drawBlock(part.v, colX(part.x), rowY(part.y), part.s, part.a);

    if (!game.over) {
      const s = 0.6 + game.dropScale * 0.4;
      drawBlock(game.current, colX(game.aim), rowY(ROWS) - 6, s, game.dropScale);
      ctx.fillStyle = '#ffffff80';
      ctx.beginPath();
      const ax = colX(game.aim) + CELL / 2, ay = rowY(ROWS) + CELL - 2;
      ctx.moveTo(ax - 7, ay); ctx.lineTo(ax + 7, ay); ctx.lineTo(ax, ay + 7); ctx.closePath(); ctx.fill();
    }

    for (const pop of game.popups) {
      ctx.globalAlpha = Math.min(1, pop.life * 1.5);
      ctx.font = `900 18px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#00000060';
      ctx.fillText(pop.text, pop.x, pop.y + 2 - (1 - pop.life) * 34);
      ctx.fillStyle = '#ffcf4a';
      ctx.fillText(pop.text, pop.x, pop.y - (1 - pop.life) * 34);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    // Clamp dt so a hidden or stalled tab never jumps animations forward.
    const dt = Math.min(50, now - last);
    last = now;
    stepTweens(dt);
    for (const pop of game.popups) pop.life -= dt / 900;
    game.popups = game.popups.filter(pop => pop.life > 0);
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt / 500);
    draw();
    requestAnimationFrame(frame);
  }

  function aimAt(event) {
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) / scale;
    const col = Math.max(0, Math.min(COLS - 1, Math.floor((x - PAD) / CELL)));
    if (col !== game.aim && !game.over) { game.aim = col; updateHud(); }
  }

  let pointer = null;
  canvas.addEventListener('pointermove', event => { if (game.started && (event.pointerType === 'mouse' || pointer)) aimAt(event); });
  canvas.addEventListener('pointerdown', event => {
    if (!game.started || game.over) return;
    canvas.setPointerCapture(event.pointerId);
    pointer = event.pointerId;
    aimAt(event);
  });
  canvas.addEventListener('pointerup', event => {
    if (pointer !== event.pointerId) return;
    pointer = null;
    aimAt(event);
    drop(game.aim);
  });
  canvas.addEventListener('pointercancel', () => { pointer = null; });

  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || !game.started || game.over) return;
    if (event.target instanceof HTMLButtonElement && (event.key === ' ' || event.key === 'Enter')) return;
    const key = event.key;
    if (key === 'ArrowLeft' || key === 'a' || key === 'A') { game.aim = Math.max(0, game.aim - 1); updateHud(); }
    else if (key === 'ArrowRight' || key === 'd' || key === 'D') { game.aim = Math.min(COLS - 1, game.aim + 1); updateHud(); }
    else if (key === ' ' || key === 'Enter' || key === 'ArrowDown' || key === 's' || key === 'S') drop(game.aim);
    else if (key >= '1' && key <= String(COLS)) { game.aim = Number(key) - 1; updateHud(); drop(game.aim); }
    else if (key === 'x' || key === 'X') useSwap();
    else return;
    event.preventDefault();
  });

  $('play').addEventListener('click', start);
  els.again.addEventListener('click', () => { newGame(); canvas.focus({ preventScroll: true }); });
  $('restart').addEventListener('click', () => { newGame(); if (game.started) canvas.focus({ preventScroll: true }); });
  els.swap.addEventListener('click', useSwap);

  new ResizeObserver(resize).observe($('stage'));
  newGame();
  requestAnimationFrame(frame);
  $('play').focus({ preventScroll: true });
})();
</script>
</body>
</html>
