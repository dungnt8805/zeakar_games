<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Guess</title>
<style>
:root {
  --bg: #1b1730;
  --panel: #262043;
  --line: #40386a;
  --text: #f6f3ff;
  --muted: #aaa2c9;
  --accent: #b892ff;
  --key: #3b3462;
  --correct: #3db27a;
  --present: #e3b23c;
  --absent: #4a4368;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body.hc { --correct: #f5793a; --present: #4fa3e8; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(ellipse at top, #2c2450, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(12px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 6px; }
h1 { flex: 1; display: flex; align-items: center; gap: 8px; font-size: clamp(24px, 7vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
h1 span { color: var(--accent); }
.en { padding: 3px 7px; text-decoration: none; border-radius: 8px; background: var(--accent); color: #1b1730; font-size: 11px; font-weight: 900; letter-spacing: .06em; }
.icon { width: 38px; height: 38px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 12px; background: #ffffff14; border: 1px solid #ffffff14; font-size: 17px; font-weight: 900; }
.icon[aria-pressed="true"] { background: var(--accent); color: #1b1730; }
.icon svg { width: 20px; height: 20px; fill: currentColor; }
.tagline { font-size: 13px; line-height: 1.35; color: var(--muted); text-align: center; }
.modes { display: flex; padding: 4px; gap: 4px; border-radius: 14px; background: #ffffff10; border: 1px solid #ffffff12; }
.modes button { flex: 1; padding: 8px 6px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.2; }
.modes button[aria-pressed="true"] { background: var(--accent); color: #1b1730; }

.board-wrap { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.board-wrap:focus { outline: none; }
.board { --gap: 6px; --t: min(calc((100cqw - 4 * var(--gap)) / 5), calc((100cqh - 5 * var(--gap)) / 6), 64px); display: grid; grid-template-rows: repeat(6, var(--t)); gap: var(--gap); }
.row { display: grid; grid-template-columns: repeat(5, var(--t)); gap: var(--gap); }
.row.shake { animation: shake .45s; }
@keyframes shake { 15%, 55% { transform: translateX(-7px); } 35%, 75% { transform: translateX(7px); } }
.tile { display: grid; place-items: center; border-radius: calc(var(--t) * .14); border: 2px solid var(--line); font-size: calc(var(--t) * .52); font-weight: 900; text-transform: uppercase; line-height: 1; }
.tile.filled { border-color: #7d73ad; }
.tile.pop { animation: pop .1s; }
@keyframes pop { 50% { transform: scale(1.1); } }
.tile.correct, .tile.present, .tile.absent { border-color: transparent; color: #fff; }
.tile.correct { background: var(--correct); }
.tile.present { background: var(--present); }
.tile.absent { background: var(--absent); }
.tile.flip { animation: flip .5s ease-in-out; }
@keyframes flip { 50% { transform: rotateX(90deg); } }
.tile.win { animation: hop .5s calc(var(--d) * 90ms) ease-out; }
@keyframes hop { 40% { transform: translateY(-28%); } 70% { transform: translateY(4%); } }
.toast { position: absolute; top: 4px; left: 50%; z-index: 3; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: var(--text); color: #1b1730; font-size: 14px; font-weight: 800; white-space: nowrap; box-shadow: 0 8px 24px #0006; pointer-events: none; animation: fade .2s; }
.toast[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }

.keyboard { display: grid; gap: 6px; flex: 0 0 auto; touch-action: manipulation; }
.krow { display: flex; gap: 5px; justify-content: center; }
.key { flex: 1 1 0; max-width: 46px; height: clamp(42px, 7.2vh, 56px); display: grid; place-items: center; border-radius: 9px; background: var(--key); font-size: 16px; font-weight: 800; text-transform: uppercase; box-shadow: inset 0 -3px 0 #0003; }
.key:active { transform: translateY(1px); }
.key.wide { flex: 1.6 1 0; max-width: 74px; font-size: 12px; text-transform: none; }
.key.wide svg { width: 22px; height: 22px; fill: currentColor; }
.key.correct { background: var(--correct); color: #fff; }
.key.present { background: var(--present); color: #fff; }
.key.absent { background: #2a2447; color: #7d76a0; }
.spacer { flex: .5 1 0; max-width: 23px; }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: #0d0a1ccc; }
.overlay[hidden], .panel[hidden] { display: none; }
.panel { width: min(100%, 380px); max-height: 100%; overflow-y: auto; background: var(--panel); border-radius: 24px; padding: 22px 20px; text-align: center; box-shadow: 0 20px 50px #0008; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 24px; font-weight: 900; }
.panel .emoji { font-size: 40px; line-height: 1.2; }
.answer { margin-top: 6px; color: var(--muted); font-size: 15px; }
.answer b { color: var(--text); letter-spacing: .08em; }
.how { margin-top: 14px; display: grid; gap: 10px; text-align: start; font-size: 14px; line-height: 1.4; }
.how li { display: flex; align-items: center; gap: 10px; list-style: none; }
.how .tile { --t: 34px; width: 34px; height: 34px; flex: 0 0 auto; font-size: 18px; }
.how p { color: var(--muted); }
.how ul { padding: 0; display: grid; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.stats strong { display: block; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stats small { display: block; font-size: 11px; color: var(--muted); line-height: 1.2; }
.panel h3 { margin-top: 16px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dist { margin-top: 8px; display: grid; gap: 4px; }
.bar { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; }
.bar span { flex: 0 0 auto; width: 12px; }
.bar b { min-width: 24px; padding: 2px 7px; border-radius: 6px; background: var(--absent); text-align: end; font-variant-numeric: tabular-nums; }
.bar.now b { background: var(--correct); }
.countdown { margin-top: 14px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.cta { flex: 1 1 140px; padding: 13px 16px; border-radius: 16px; background: var(--accent); color: #1b1730; font-size: 16px; font-weight: 800; box-shadow: 0 5px 0 #7d5bc4; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #7d5bc4; }
.cta.share { background: var(--correct); color: #fff; box-shadow: 0 5px 0 #0004; }
.cta.ghost { background: transparent; color: var(--text); border: 2px solid var(--line); box-shadow: none; }
.cta[hidden] { display: none; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 600px) { .tagline { display: none; } .app { gap: 8px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>Word <span>Guess</span> <abbr class="en" id="en-badge" title="">EN</abbr></h1>
    <button type="button" class="icon" id="help-btn" data-i18n-label="help">?</button>
    <button type="button" class="icon" id="stats-btn" data-i18n-label="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h3v7H4zM10.5 4h3v16h-3zM17 9h3v11h-3z"/></svg></button>
    <button type="button" class="icon" id="hc-btn" aria-pressed="false" data-i18n-label="contrast"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2v16a8 8 0 0 1 0-16z"/></svg></button>
  </div>
  <p class="tagline" data-i18n="tagline"></p>
  <div class="modes" role="group" data-i18n-label="mode">
    <button type="button" id="mode-daily" aria-pressed="true"></button>
    <button type="button" id="mode-unlimited" aria-pressed="false" data-i18n="unlimited"></button>
  </div>
  <div class="board-wrap" id="board-wrap" tabindex="-1">
    <div class="board" id="board" role="group" data-i18n-label="board"></div>
    <p class="toast" id="toast" role="status" hidden></p>
  </div>
  <div class="keyboard" id="keyboard" role="group" data-i18n-label="keyboard"></div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="panel" id="help-panel" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
    <h2 id="help-title" data-i18n="help"></h2>
    <div class="how">
      <p data-i18n="how1"></p>
      <ul>
        <li><span class="tile correct" aria-hidden="true">L</span><span data-i18n="how2"></span></li>
        <li><span class="tile present" aria-hidden="true">E</span><span data-i18n="how3"></span></li>
        <li><span class="tile absent" aria-hidden="true">T</span><span data-i18n="how4"></span></li>
      </ul>
      <p data-i18n="how5"></p>
    </div>
    <div class="actions"><button type="button" class="cta" id="help-close" data-i18n="start"></button></div>
  </div>
  <div class="panel" id="result-panel" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
    <p class="emoji" id="result-emoji" aria-hidden="true"></p>
    <h2 id="result-title"></h2>
    <p class="answer" id="result-answer"></p>
    <div class="stats">
      <div><strong id="s-played">0</strong><small data-i18n="played"></small></div>
      <div><strong id="s-pct">0</strong><small data-i18n="winPct"></small></div>
      <div><strong id="s-streak">0</strong><small data-i18n="streak"></small></div>
      <div><strong id="s-max">0</strong><small data-i18n="maxStreak"></small></div>
    </div>
    <h3 data-i18n="dist"></h3>
    <div class="dist" id="dist"></div>
    <p class="countdown" id="countdown" hidden></p>
    <div class="actions">
      <button type="button" class="cta share" id="share" data-i18n="share"></button>
      <button type="button" class="cta" id="next" data-i18n="next"></button>
      <button type="button" class="cta" id="try-unlimited" data-i18n="tryUnlimited"></button>
      <button type="button" class="cta ghost" id="close" data-i18n="close"></button>
    </div>
  </div>
</div>

 wraps wrath wreak wreck wring wrist wrong wrote wrung xenon yahoo yards yarns yawns yearn years yells yield yodel yokel yours youse yucky yummy zeros zippy zonal zoned zones'.split(' ')]);
  const WORD = 5, TRIES = 6;
  const EPOCH = Date.UTC(2026, 0, 1);
  const KEY = name => `milaan.wordGuess.${name}`;
  const ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  const RANK = { absent: 1, present: 2, correct: 3 };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const $ = id => document.getElementById(id);
  const els = { board: $('board'), wrap: $('board-wrap'), keyboard: $('keyboard'), toast: $('toast'), announcer: $('announcer'), daily: $('mode-daily'), unlimited: $('mode-unlimited'), overlay: $('overlay'), help: $('help-panel'), result: $('result-panel'), emoji: $('result-emoji'), title: $('result-title'), answer: $('result-answer'), dist: $('dist'), countdown: $('countdown'), share: $('share'), next: $('next'), tryUnlimited: $('try-unlimited'), close: $('close'), hc: $('hc-btn') };

  const read = (name, fallback) => { try { return JSON.parse(localStorage.getItem(KEY(name))) ?? fallback; } catch { return fallback; } };
  const write = (name, value) => { try { localStorage.setItem(KEY(name), JSON.stringify(value)); } catch {} };

  function mulberry32(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  // A fixed shuffle so every player sees the same word on the same local date.
  const DAILY_ORDER = (() => {
    const list = [...ANSWERS], rand = mulberry32(20261112);
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
    return list;
  })();
  const today = () => { const d = new Date(); return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 864e5); };
  const dailyWord = day => DAILY_ORDER[((day % DAILY_ORDER.length) + DAILY_ORDER.length) % DAILY_ORDER.length];
  const randomWord = avoid => { let w; do { w = ANSWERS[Math.floor(Math.random() * ANSWERS.length)]; } while (w === avoid); return w; };

  function score(guess, answer) {
    const result = Array(WORD).fill('absent');
    const left = {};
    for (let i = 0; i < WORD; i++) {
      if (guess[i] === answer[i]) result[i] = 'correct';
      else left[answer[i]] = (left[answer[i]] || 0) + 1;
    }
    for (let i = 0; i < WORD; i++) {
      if (result[i] !== 'correct' && left[guess[i]] > 0) { result[i] = 'present'; left[guess[i]] -= 1; }
    }
    return result;
  }

  function loadDaily() {
    const day = today();
    const saved = read('daily', null);
    const guesses = saved && saved.day === day && Array.isArray(saved.guesses) ? saved.guesses.filter(g => VALID.has(g)).slice(0, TRIES) : [];
    return finishState({ mode: 'daily', day, answer: dailyWord(day), guesses, current: '' });
  }
  function loadUnlimited(fresh) {
    const saved = fresh ? null : read('unlimited', null);
    if (saved && ANSWERS.includes(saved.answer) && Array.isArray(saved.guesses)) {
      const game = finishState({ mode: 'unlimited', answer: saved.answer, guesses: saved.guesses.filter(g => VALID.has(g)).slice(0, TRIES), current: '' });
      if (!game.over) return game;
    }
    const game = { mode: 'unlimited', answer: randomWord(saved?.answer), guesses: [], current: '', over: false, won: false };
    saveGame(game);
    return game;
  }
  function finishState(game) {
    game.won = game.guesses.includes(game.answer);
    game.over = game.won || game.guesses.length >= TRIES;
    return game;
  }
  function saveGame(game) {
    if (game.mode === 'daily') write('daily', { day: game.day, guesses: game.guesses });
    else write('unlimited', { answer: game.answer, guesses: game.guesses });
  }

  const emptyStats = () => ({ played: 0, wins: 0, streak: 0, max: 0, dist: [0, 0, 0, 0, 0, 0], lastWin: null });
  const readStats = mode => ({ ...emptyStats(), ...read(`stats.${mode}`, {}) });
  function currentStreak(mode, stats) {
    // A daily streak only survives if yesterday's (or today's) word was solved.
    if (mode === 'daily' && (stats.lastWin === null || stats.lastWin < today() - 1)) return 0;
    return stats.streak;
  }
  function recordResult(game) {
    const stats = readStats(game.mode);
    stats.played += 1;
    if (game.won) {
      stats.wins += 1;
      stats.dist[game.guesses.length - 1] += 1;
      stats.streak = currentStreak(game.mode, stats) + 1;
      stats.lastWin = game.mode === 'daily' ? game.day : null;
    } else {
      stats.streak = 0;
    }
    stats.max = Math.max(stats.max, stats.streak);
    write(`stats.${game.mode}`, stats);
  }

  let games, game, revealing = false, toastTimer = 0, countdownTimer = 0;
  const tiles = [], rows = [], keys = {};

  function buildBoard() {
    for (let r = 0; r < TRIES; r++) {
      const row = document.createElement('div');
      row.className = 'row';
      row.setAttribute('role', 'img');
      const list = [];
      for (let c = 0; c < WORD; c++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.setAttribute('aria-hidden', 'true');
        tile.style.setProperty('--d', c);
        row.append(tile);
        list.push(tile);
      }
      row.addEventListener('animationend', event => { if (event.target === row) row.classList.remove('shake'); });
      els.board.append(row);
      rows.push(row);
      tiles.push(list);
    }
  }

  function buildKeyboard() {
    const backIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 5H8.4L2 12l6.4 7H22V5zm-3.6 10.6-1.4 1.4-3-3-3 3-1.4-1.4 3-3-3-3L11 7.2l3 3 3-3 1.4 1.4-3 3 3 3z"/></svg>';
    ROWS.forEach((letters, i) => {
      const row = document.createElement('div');
      row.className = 'krow';
      if (i === 1) row.append(Object.assign(document.createElement('span'), { className: 'spacer' }));
      if (i === 2) row.append(makeKey('enter', t.enter, true));
      for (const l of letters) row.append(makeKey(l, l));
      if (i === 1) row.append(Object.assign(document.createElement('span'), { className: 'spacer' }));
      if (i === 2) { const back = makeKey('back', '', true); back.innerHTML = backIcon; back.setAttribute('aria-label', t.del); row.append(back); }
      els.keyboard.append(row);
    });
    // Keep focus off the on-screen keys so a physical Enter never re-presses the last tapped key.
    els.keyboard.addEventListener('mousedown', event => event.preventDefault());
  }

  function makeKey(id, label, wide = false) {
    const key = document.createElement('button');
    key.type = 'button';
    key.className = `key${wide ? ' wide' : ''}`;
    key.textContent = label;
    key.addEventListener('click', () => press(id));
    keys[id] = key;
    return key;
  }

  function paintRow(r, word = '', states = null) {
    tiles[r].forEach((tile, c) => {
      tile.textContent = word[c] || '';
      tile.className = `tile${word[c] ? ' filled' : ''}${states ? ` ${states[c]}` : ''}`;
    });
    rows[r].setAttribute('aria-label', word && states ? t.row(r + 1, describe(word, states)) : `${r + 1}: ${word.toUpperCase().split('').join(' ')}`);
  }

  const describe = (word, states) => word.toUpperCase().split('').map((l, i) => `${l} ${t.states[states[i]]}`).join(', ');

  function render() {
    for (let r = 0; r < TRIES; r++) {
      if (r < game.guesses.length) paintRow(r, game.guesses[r], score(game.guesses[r], game.answer));
      else paintRow(r, r === game.guesses.length && !game.over ? game.current : '');
    }
    paintKeys();
    els.daily.textContent = t.dailyNo(games.daily.day + 1);
    els.daily.setAttribute('aria-pressed', String(game.mode === 'daily'));
    els.unlimited.setAttribute('aria-pressed', String(game.mode === 'unlimited'));
  }

  function paintKeys() {
    const best = {};
    for (const guess of game.guesses) {
      score(guess, game.answer).forEach((state, i) => {
        const l = guess[i];
        if (!best[l] || RANK[state] > RANK[best[l]]) best[l] = state;
      });
    }
    for (const l of ROWS.join('')) {
      keys[l].className = `key${best[l] ? ` ${best[l]}` : ''}`;
      keys[l].setAttribute('aria-label', best[l] ? `${l.toUpperCase()}, ${t.states[best[l]]}` : l.toUpperCase());
    }
  }

  function toast(message, ms = 1600) {
    clearTimeout(toastTimer);
    els.toast.textContent = message;
    els.toast.hidden = false;
    toastTimer = setTimeout(() => { els.toast.hidden = true; }, ms);
  }

  const blocked = () => revealing || !els.overlay.hidden;

  function press(id) {
    if (blocked()) return;
    if (game.over) { if (game.mode === 'daily') toast(t.dailyDone, 2400); return; }
    if (id === 'enter') return submit();
    const r = game.guesses.length;
    if (id === 'back') {
      if (!game.current) return;
      game.current = game.current.slice(0, -1);
      paintRow(r, game.current);
      return;
    }
    if (game.current.length >= WORD) return;
    game.current += id;
    paintRow(r, game.current);
    const tile = tiles[r][game.current.length - 1];
    tile.classList.add('pop');
    tile.addEventListener('animationend', () => tile.classList.remove('pop'), { once: true });
  }

  function reject(message) {
    const row = rows[game.guesses.length];
    row.classList.remove('shake');
    void row.offsetWidth;
    row.classList.add('shake');
    toast(message);
    els.announcer.textContent = message;
  }

  function submit() {
    const guess = game.current;
    if (guess.length < WORD) return reject(t.tooShort);
    if (!VALID.has(guess)) return reject(t.notWord);
    const r = game.guesses.length;
    const states = score(guess, game.answer);
    game.guesses.push(guess);
    game.current = '';
    finishState(game);
    saveGame(game);
    if (game.over) recordResult(game);
    reveal(r, guess, states);
  }

  function reveal(r, guess, states) {
    const step = reduced.matches ? 0 : 280;
    const half = reduced.matches ? 0 : 250;
    const current = game;
    revealing = true;
    tiles[r].forEach((tile, c) => {
      setTimeout(() => {
        tile.classList.add('flip');
        setTimeout(() => { tile.classList.add(states[c]); }, half);
        tile.addEventListener('animationend', () => tile.classList.remove('flip'), { once: true });
      }, c * step);
    });
    setTimeout(() => {
      revealing = false;
      if (current !== game) return;
      paintRow(r, guess, states);
      paintKeys();
      els.announcer.textContent = t.row(r + 1, describe(guess, states));
      if (game.over) afterGame(r);
    }, (WORD - 1) * step + half * 2 + 30);
  }

  function afterGame(r) {
    if (game.won) {
      toast(t.praise[r], 1800);
      tiles[r].forEach(tile => tile.classList.add('win'));
      els.announcer.textContent = `${t.praise[r]} ${t.answer} ${game.answer.toUpperCase()}`;
    } else {
      toast(game.answer.toUpperCase(), 2200);
      els.announcer.textContent = `${t.lost}. ${t.answer} ${game.answer.toUpperCase()}`;
    }
    setTimeout(() => { if (game.over) openResult(); }, reduced.matches ? 600 : 1500);
  }

  function openOverlay(panel, focus) {
    els.help.hidden = panel !== els.help;
    els.result.hidden = panel !== els.result;
    els.overlay.hidden = false;
    focus.focus({ preventScroll: true });
  }
  function closeOverlay() {
    els.overlay.hidden = true;
    clearInterval(countdownTimer);
    els.wrap.focus({ preventScroll: true });
  }

  function openResult() {
    const stats = readStats(game.mode);
    if (game.over) {
      els.emoji.textContent = game.won ? '🎉' : '🫣';
      els.title.textContent = game.won ? t.praise[game.guesses.length - 1] : t.lost;
      els.answer.innerHTML = '';
      els.answer.append(`${t.answer} `, Object.assign(document.createElement('b'), { textContent: game.answer.toUpperCase() }));
    } else {
      els.emoji.textContent = '📊';
      els.title.textContent = t.stats;
      els.answer.textContent = game.mode === 'daily' ? t.dailyNo(game.day + 1) : t.unlimited;
    }
    $('s-played').textContent = stats.played;
    $('s-pct').textContent = stats.played ? Math.round((stats.wins / stats.played) * 100) : 0;
    $('s-streak').textContent = currentStreak(game.mode, stats);
    $('s-max').textContent = stats.max;
    const top = Math.max(1, ...stats.dist);
    els.dist.replaceChildren(...stats.dist.map((count, i) => {
      const bar = document.createElement('div');
      bar.className = `bar${game.over && game.won && game.guesses.length === i + 1 ? ' now' : ''}`;
      bar.innerHTML = `<span>${i + 1}</span><b style="width:calc(24px + ${(count / top) * 80}%)">${count}</b>`;
      return bar;
    }));
    els.share.hidden = !game.over;
    els.next.hidden = !(game.over && game.mode === 'unlimited');
    els.tryUnlimited.hidden = !(game.over && game.mode === 'daily');
    els.countdown.hidden = !(game.over && game.mode === 'daily');
    clearInterval(countdownTimer);
    if (game.mode === 'daily' && game.over) {
      tickCountdown();
      countdownTimer = setInterval(tickCountdown, 1000);
    }
    const focus = [els.next, els.tryUnlimited].find(el => !el.hidden) || els.close;
    openOverlay(els.result, focus);
  }

  function tickCountdown() {
    if (document.hidden) return;
    if (today() !== games.daily.day) return rollover();
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const s = Math.max(0, Math.floor((next - now) / 1000));
    const hms = [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map(n => String(n).padStart(2, '0')).join(':');
    els.countdown.textContent = t.nextIn(hms);
  }

  function rollover() {
    if (today() === games.daily.day || revealing) return;
    games.daily = loadDaily();
    if (game.mode !== 'daily') return render();
    game = games.daily;
    if (!els.overlay.hidden && !els.result.hidden) closeOverlay();
    render();
  }

  function shareText() {
    const marks = document.body.classList.contains('hc') ? { correct: '🟧', present: '🟦', absent: '⬛' } : { correct: '🟩', present: '🟨', absent: '⬛' };
    const label = game.mode === 'daily' ? `#${game.day + 1}` : '∞';
    const grid = game.guesses.map(g => score(g, game.answer).map(s => marks[s]).join('')).join('\n');
    return `Word Guess ${label} ${game.won ? game.guesses.length : 'X'}/${TRIES}\n\n${grid}`;
  }

  async function share() {
    const text = shareText();
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {
      try {
        const area = Object.assign(document.createElement('textarea'), { value: text });
        area.style.cssText = 'position:fixed;opacity:0';
        document.body.append(area);
        area.select();
        ok = document.execCommand('copy');
        area.remove();
      } catch {}
    }
    closeOverlay();
    toast(ok ? t.copied : t.copyFail, 2000);
    els.announcer.textContent = ok ? t.copied : t.copyFail;
  }

  function setMode(mode) {
    if (revealing || game.mode === mode) return;
    write('mode', mode);
    game = games[mode];
    render();
  }

  function setContrast(on) {
    document.body.classList.toggle('hc', on);
    els.hc.setAttribute('aria-pressed', String(on));
    write('contrast', on);
  }

  // Return focus to the board after mouse clicks so physical Enter keeps submitting guesses.
  const refocus = event => { if (event.detail) els.wrap.focus({ preventScroll: true }); };
  els.daily.addEventListener('click', event => { setMode('daily'); refocus(event); });
  els.unlimited.addEventListener('click', event => { setMode('unlimited'); refocus(event); });
  els.hc.addEventListener('click', event => { setContrast(!document.body.classList.contains('hc')); refocus(event); });
  $('help-btn').addEventListener('click', () => openOverlay(els.help, $('help-close')));
  $('stats-btn').addEventListener('click', openResult);
  $('help-close').addEventListener('click', () => { write('seenHelp', true); closeOverlay(); });
  els.close.addEventListener('click', closeOverlay);
  els.share.addEventListener('click', share);
  els.next.addEventListener('click', () => { games.unlimited = loadUnlimited(true); game = games.unlimited; closeOverlay(); render(); });
  els.tryUnlimited.addEventListener('click', () => { closeOverlay(); setMode('unlimited'); });
  els.overlay.addEventListener('click', event => { if (event.target === els.overlay) closeOverlay(); });

  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || !els.overlay.hidden) return;
    const key = event.key;
    const onButton = event.target instanceof HTMLButtonElement && !els.keyboard.contains(event.target);
    if (/^[a-z]$/i.test(key)) { event.preventDefault(); press(key.toLowerCase()); }
    else if (key === 'Enter' && !onButton) { event.preventDefault(); press('enter'); }
    else if (key === 'Backspace') { event.preventDefault(); press('back'); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) rollover(); });

  buildBoard();
  buildKeyboard();
  els.daily.textContent = t.dailyNo(1);
  $('en-badge').title = t.english;
  $('en-badge').setAttribute('aria-label', t.english);
  setContrast(read('contrast', false) === true);
  games = { daily: loadDaily(), unlimited: loadUnlimited(false) };
  game = games[read('mode', 'daily') === 'unlimited' ? 'unlimited' : 'daily'];
  render();
  if (!read('seenHelp', false)) openOverlay(els.help, $('help-close'));
  else els.wrap.focus({ preventScroll: true });
})();
