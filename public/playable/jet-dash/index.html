<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jet Dash</title>
<style>
:root {
  --bg: #141a2e;
  --ink: #17203a;
  --muted: #6b7591;
  --hot: #ff5a3c;
  --hot-dark: #c23a22;
  --cyan: #2fd4e8;
  --cyan-dark: #1695a6;
  --gold: #ffc93c;
  --paper: #f4f7ff;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.app { position: relative; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
canvas:focus-visible { outline: none; }
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); pointer-events: none; }
.app.menu .hud { visibility: hidden; }
.chip { min-width: 56px; padding: 4px 10px; border-radius: 12px; background: #f4f7ffe0; box-shadow: 0 2px 0 #00000050; text-align: center; }
.chip small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.chip strong { display: block; font-size: 17px; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.shield { background: var(--cyan); color: #fff; }
.chip.shield small { color: #fff; }
.chip[hidden] { display: none; }
.grow { flex: 1; }
.iconbtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 12px; background: #f4f7ffe0; box-shadow: 0 2px 0 #00000050; font-size: 16px; font-weight: 900; display: grid; place-items: center; }
.toast { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); padding: 6px 14px; border-radius: 99px; background: var(--ink); color: #fff; font-weight: 900; font-size: 15px; white-space: nowrap; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #0a0f1e80; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 390px); max-height: 100%; overflow-y: auto; padding: 18px 16px; border-radius: 22px; background: var(--paper); box-shadow: 0 7px 0 #8e9bc0, 0 20px 50px #0008; text-align: center; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.title { font-size: clamp(36px, 12vw, 56px); font-weight: 900; letter-spacing: -.02em; line-height: 1; color: var(--hot); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
.title span { color: var(--cyan); }
.tagline { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--muted); }
.stats { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.stat { padding: 5px 12px; border-radius: 12px; background: #e3e9f7; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat small { display: block; font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .03em; }
.btn { flex: 1; padding: 12px; border-radius: 14px; background: #e3e9f7; box-shadow: 0 3px 0 #b8c3de; font-size: 16px; font-weight: 900; }
.btn.primary { background: var(--hot); color: #fff; box-shadow: 0 4px 0 var(--hot-dark); }
.btn.cyan { background: var(--cyan); color: var(--ink); box-shadow: 0 4px 0 var(--cyan-dark); }
.btn:active { transform: translateY(2px); }
.btn:disabled { opacity: .5; cursor: default; }
.big { display: block; width: 100%; margin-top: 14px; font-size: 22px; padding: 14px; }
.row { display: flex; gap: 8px; margin-top: 10px; }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.4; }
.panel h2 { font-size: 26px; font-weight: 900; }
.list { display: grid; gap: 8px; margin-top: 12px; text-align: left; }
.item { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px; background: #e3e9f7; }
.item b { display: block; font-size: 15px; font-weight: 900; }
.item span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
.item .btn { flex: none; padding: 8px 12px; font-size: 14px; min-width: 76px; }
.swatch { width: 34px; height: 34px; border-radius: 10px; margin: 0 auto; box-shadow: inset 0 -5px 0 #0004; }
.sub { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); line-height: 1.35; }
.medal { font-size: 46px; line-height: 1.1; margin-top: 6px; }
.scores { display: flex; justify-content: center; gap: 22px; margin-top: 12px; }
.scores small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.scores strong { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--cyan); color: var(--ink); font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 520px) {
  .panel { padding: 10px 14px; }
  .title { font-size: 34px; }
  .tagline { display: none; }
  .stats { margin-top: 6px; }
  .big { margin-top: 8px; padding: 10px; font-size: 19px; }
  .row { margin-top: 6px; }
  .btn { padding: 9px; }
  .help { margin-top: 6px; }
  .panel h2 { font-size: 20px; }
  .medal { font-size: 30px; }
  .scores { margin-top: 4px; }
  .scores strong { font-size: 20px; }
  .list { margin-top: 8px; gap: 6px; }
  .item { padding: 5px 10px; }
}
@media (max-height: 520px) and (min-aspect-ratio: 3/2) {
  .panel.wide { width: min(100%, 680px); }
  .panel.wide .list { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 900px) and (min-height: 600px) {
  .chip strong { font-size: 22px; }
  .chip { min-width: 72px; padding: 6px 14px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app menu" id="app">
  <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
  <div class="hud">
    <div class="chip"><small data-i18n="dist"></small><strong id="hDist">0 m</strong></div>
    <div class="chip"><small data-i18n="coins"></small><strong id="hCoins">0</strong></div>
    <div class="chip shield" id="hShield" hidden><small data-i18n="shield"></small><strong>🛡</strong></div>
    <div class="grow"></div>
    <button type="button" class="iconbtn" id="mute" data-i18n-label="mute">🔊</button>
    <button type="button" class="iconbtn" id="pause" data-i18n-label="pause">II</button>
  </div>
  <div class="toast" id="toast" aria-hidden="true"></div>

  <div class="overlay" id="menu">
    <div class="panel" role="dialog" aria-labelledby="menu-title">
      <h1 class="title" id="menu-title">Jet <span>Dash</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="stats">
        <div class="stat"><small data-i18n="best"></small><span id="mBest">0</span> m</div>
        <div class="stat"><small data-i18n="bank"></small>🪙 <span id="mBank">0</span></div>
      </div>
      <button type="button" class="btn primary big" id="play" data-i18n="play"></button>
      <div class="row">
        <button type="button" class="btn cyan" id="openShop" data-i18n="shop"></button>
        <button type="button" class="btn" id="mute2"></button>
      </div>
      <p class="help" id="help"></p>
    </div>
  </div>

  <div class="overlay" id="shop" hidden>
    <div class="panel wide" role="dialog" aria-labelledby="shop-title">
      <h2 id="shop-title" data-i18n="shop"></h2>
      <p class="sub">🪙 <span id="sBank">0</span></p>
      <div class="list" id="slist"></div>
      <div class="row"><button type="button" class="btn primary" id="sback" data-i18n="back"></button></div>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="panel" role="dialog" aria-labelledby="paused-title">
      <h2 id="paused-title" data-i18n="paused"></h2>
      <div class="row"><button type="button" class="btn" id="quit" data-i18n="menu"></button><button type="button" class="btn primary" id="resume" data-i18n="resume"></button></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel" role="dialog" aria-labelledby="over-title">
      <h2 id="over-title" data-i18n="gameOver"></h2>
      <p class="medal" id="medal">💥</p>
      <p class="sub" id="oWhy"></p>
      <div class="scores">
        <div><small data-i18n="dist"></small><strong id="oDist">0</strong></div>
        <div><small data-i18n="coins"></small><strong id="oCoins">0</strong></div>
        <div><small data-i18n="best"></small><strong id="oBest">0</strong></div>
      </div>
      <p class="badge" id="newbest" data-i18n="newBest" hidden></p>
      <div class="row"><button type="button" class="btn" id="omenu" data-i18n="menu"></button><button type="button" class="btn cyan" id="oshop" data-i18n="shop"></button></div>
      <div class="row"><button type="button" class="btn primary" id="oretry" data-i18n="retry"></button></div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

    // Lasers
    for (const l of lasers) {
      ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(10, l.y, 9, 0, 7); ctx.arc(W - 10, l.y, 9, 0, 7); ctx.fill();
      if (l.on) {
        ctx.fillStyle = '#ff3b3b88'; ctx.fillRect(10, l.y - 9, W - 20, 18);
        ctx.fillStyle = '#ffe0e0'; ctx.fillRect(10, l.y - 3, W - 20, 6);
      } else {
        ctx.strokeStyle = (Math.floor(S.t * 8) % 2 || reducedMotion) ? '#ff3b3baa' : '#ff3b3b44'; ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(10, l.y); ctx.lineTo(W - 10, l.y); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    for (const o of objs) {
      if (o.k === 'coin') {
        const sq = reducedMotion ? 1 : Math.abs(Math.cos(S.t * 4 + o.x * 0.02)) * 0.7 + 0.3;
        ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.ellipse(o.x, o.y, 8 * sq, 8, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.ellipse(o.x - 2 * sq, o.y - 2, 3 * sq, 3, 0, 0, 7); ctx.fill();
      } else if (o.k === 'shield') {
        ctx.strokeStyle = '#2fd4e8'; ctx.lineWidth = 3; ctx.fillStyle = '#2fd4e855';
        ctx.beginPath(); ctx.arc(o.x, o.y, 14 + Math.sin(S.t * 6) * 2, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = '900 14px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('S', o.x, o.y + 1);
      } else if (o.k === 'zap') {
        const dx = Math.cos(o.a) * o.len / 2, dy = Math.sin(o.a) * o.len / 2;
        ctx.strokeStyle = '#7ef0ff55'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(o.x - dx, o.y - dy); ctx.lineTo(o.x + dx, o.y + dy); ctx.stroke();
        ctx.strokeStyle = '#e8fdff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(o.x - dx, o.y - dy);
        const n = 8;
        for (let i = 1; i < n; i++) { const u = i / n - 0.5, j = reducedMotion ? 0 : rand(-5, 5); ctx.lineTo(o.x + dx * 2 * u - Math.sin(o.a) * j, o.y + dy * 2 * u + Math.cos(o.a) * j); }
        ctx.lineTo(o.x + dx, o.y + dy); ctx.stroke();
        ctx.fillStyle = '#ffc93c'; ctx.strokeStyle = '#17203a'; ctx.lineWidth = 2;
        for (const sgn of [-1, 1]) { ctx.beginPath(); ctx.arc(o.x + dx * sgn, o.y + dy * sgn, 8, 0, 7); ctx.fill(); ctx.stroke(); }
      }
    }
    // Missiles and their warnings.
    for (const m of missiles) {
      if (m.phase === 'warn') {
        const locked = m.t < 0.45, blink = reducedMotion || Math.floor(S.t * (locked ? 14 : 6)) % 2;
        ctx.fillStyle = locked ? '#ff3b3b' : '#ffc93c'; ctx.globalAlpha = blink ? 1 : 0.4;
        ctx.beginPath(); ctx.moveTo(W - 14, m.y); ctx.lineTo(W - 34, m.y - 14); ctx.lineTo(W - 34, m.y + 14); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#17203a'; ctx.font = '900 16px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', W - 27, m.y + 1);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = '#d7dbe6'; ctx.fillRect(m.x - 14, m.y - 5, 28, 10);
        ctx.fillStyle = '#ff5a3c'; ctx.beginPath(); ctx.moveTo(m.x - 22, m.y); ctx.lineTo(m.x - 14, m.y - 5); ctx.lineTo(m.x - 14, m.y + 5); ctx.fill();
        ctx.fillRect(m.x + 10, m.y - 9, 6, 18);
        ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.moveTo(m.x + 14, m.y - 4); ctx.lineTo(m.x + 28 + rand(0, 6), m.y); ctx.lineTo(m.x + 14, m.y + 4); ctx.fill();
      }
    }
    for (const p of parts) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    drawPlayer();
  }
  function drawPlayer() {
    const sk = SKINS[save.skin] || SKINS[0];
    ctx.save(); ctx.translate(P.x, P.y); if (P.dead) ctx.rotate(P.rot);
    if (P.inv > 0 && Math.floor(P.inv * 12) % 2) ctx.globalAlpha = 0.4;
    if (P.thrust && !P.dead) {
      const fl = 16 + (reducedMotion ? 4 : rand(0, 10));
      ctx.fillStyle = sk.f2; ctx.beginPath(); ctx.moveTo(-17, 8); ctx.lineTo(-11, 8 + fl); ctx.lineTo(-5, 8); ctx.fill();
      ctx.fillStyle = sk.f1; ctx.beginPath(); ctx.moveTo(-14, 8); ctx.lineTo(-11, 8 + fl * 0.6); ctx.lineTo(-8, 8); ctx.fill();
    }
    ctx.fillStyle = sk.tank; ctx.fillRect(-19, -10, 12, 20);
    ctx.fillStyle = sk.trim; ctx.fillRect(-19, -4, 12, 4); ctx.fillRect(-17, 8, 8, 3);
    ctx.fillStyle = '#3a5bd9'; ctx.fillRect(-8, -6, 14, 16);
    ctx.fillStyle = '#2a2f45'; ctx.fillRect(-6, 10, 5, 6); ctx.fillRect(1, 10, 5, 6);
    ctx.fillStyle = '#f2c6a0'; ctx.beginPath(); ctx.arc(0, -12, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#5a3a22'; ctx.beginPath(); ctx.arc(-1, -15, 8, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#17203a'; ctx.fillRect(3, -13, 2, 3);
    ctx.globalAlpha = 1;
    if (P.shield) { ctx.strokeStyle = '#2fd4e8'; ctx.lineWidth = 2.5; ctx.fillStyle = '#2fd4e822'; ctx.beginPath(); ctx.arc(-3, -2, 24, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.restore();
  }

  // ---------- UI ----------
  function toast(s) { $('toast').textContent = s; $('toast').classList.add('show'); toastT = 1.4; }
  function updateHud() { $('hDist').textContent = Math.floor(P.dist) + ' m'; $('hCoins').textContent = P.coins; $('hShield').hidden = !P.shield; }
  function hideAll() { for (const id of ['menu', 'shop', 'paused', 'over']) $(id).hidden = true; }
  function showMenu() {
    S.state = 'menu'; hideAll(); app.classList.add('menu'); setThrustSound(false);
    $('mBest').textContent = save.best; $('mBank').textContent = save.bank;
    $('menu').hidden = false; $('play').focus();
  }
  let shopFrom = 'menu';
  function showShop(focusId) {
    if (S.state !== 'shop') shopFrom = S.state;
    S.state = 'shop'; hideAll(); $('shop').hidden = false; $('sBank').textContent = save.bank;
    const el = $('slist'); el.textContent = '';
    SKINS.forEach((sk, i) => {
      const owned = save.owned.includes(i), cur = save.skin === i, name = t['sk' + i];
      const d = document.createElement('div'); d.className = 'item';
      d.innerHTML = `<i class="swatch" style="display:block;background:${sk.tank};border:4px solid ${sk.trim}"></i><div><b></b><span></span></div><button type="button" class="btn"></button>`;
      d.querySelector('b').textContent = name; d.querySelector('span').textContent = owned ? '' : '🪙 ' + sk.price;
      const b = d.querySelector('button'); b.id = 'sk' + i;
      b.textContent = cur ? t.selected : owned ? t.select : t.buy;
      b.disabled = cur || (!owned && save.bank < sk.price);
      if (!b.disabled) b.classList.add('primary');
      b.addEventListener('click', () => {
        if (!owned) { if (save.bank < sk.price) return; save.bank -= sk.price; save.owned.push(i); sfx.buy(); announce(t.bought(name)); }
        else announce(t.equipped(name));
        save.skin = i; persist(); showShop('sk' + i);
      });
      el.appendChild(d);
    });
    const f = focusId && $(focusId); (f && !f.disabled ? f : $('sback')).focus();
  }
  function startRun() {
    audio(); hideAll(); app.classList.remove('menu'); newRun(); updateHud();
    S.state = 'play'; last = performance.now(); canvas.focus({ preventScroll: true });
  }
  function gameOver() {
    S.state = 'over'; setThrustSound(false);
    const m = Math.floor(P.dist), isBest = m > save.best;
    if (isBest) save.best = m;
    save.bank += P.coins; persist();
    $('oDist').textContent = m + ' m'; $('oCoins').textContent = P.coins; $('oBest').textContent = save.best + ' m';
    $('oWhy').textContent = t['why_' + P.why] || '';
    $('medal').textContent = P.why === 'zap' ? '⚡' : P.why === 'laser' ? '🔴' : '💥';
    $('newbest').hidden = !isBest; $('over').hidden = false; $('oretry').focus();
    announce(`${t.gameOver} ${t['why_' + P.why] || ''}. ${t.ran(m, P.coins)}${isBest ? ' ' + t.newBest : ''}`);
  }
  function pause() { if (S.state !== 'play') return; S.state = 'paused'; held = false; setThrustSound(false); $('paused').hidden = false; $('resume').focus(); }
  function resume() { if (S.state !== 'paused') return; S.state = 'play'; $('paused').hidden = true; last = performance.now(); canvas.focus({ preventScroll: true }); }

  $('play').addEventListener('click', startRun);
  $('openShop').addEventListener('click', () => showShop());
  $('oshop').addEventListener('click', () => showShop());
  $('sback').addEventListener('click', () => shopFrom === 'over' ? (hideAll(), S.state = 'over', $('over').hidden = false, $('oretry').focus()) : showMenu());
  $('pause').addEventListener('click', pause);
  $('resume').addEventListener('click', resume);
  $('quit').addEventListener('click', showMenu);
  $('omenu').addEventListener('click', showMenu);
  $('oretry').addEventListener('click', startRun);
  $('mute').addEventListener('click', () => setMuted(!save.muted));
  $('mute2').addEventListener('click', () => setMuted(!save.muted));
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('blur', () => { held = false; });

  const THRUST_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  addEventListener('keydown', e => {
    if (e.code === 'KeyM' && !e.repeat) { setMuted(!save.muted); return; }
    if ((e.code === 'KeyP' || e.code === 'Escape') && (S.state === 'play' || S.state === 'paused')) { S.state === 'play' ? pause() : resume(); e.preventDefault(); return; }
    if (THRUST_KEYS.includes(e.code) && S.state === 'play') { held = true; e.preventDefault(); }
  });
  addEventListener('keyup', e => { if (THRUST_KEYS.includes(e.code)) held = false; });
  const pointers = new Set();
  canvas.addEventListener('pointerdown', e => { if (S.state !== 'play') return; pointers.add(e.pointerId); held = true; try { canvas.setPointerCapture(e.pointerId); } catch {} e.preventDefault(); });
  const up = e => { pointers.delete(e.pointerId); if (!pointers.size) held = false; };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  let last = performance.now(), acc = 0;
  const STEP = 1 / 120;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.state === 'play') {
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; if (S.state !== 'play') { acc = 0; break; } }
      scroll += (P.dead ? 0 : P.speed) * dt;
      setThrustSound(held && !P.dead);
      updateHud();
    } else if (S.state === 'menu' && !reducedMotion) scroll += 60 * dt;
    draw();
    requestAnimationFrame(frame);
  }

  $('help').textContent = matchMedia('(pointer: coarse)').matches ? t.helpTouch : t.helpKeys;
  setMuted(save.muted); $('announcer').textContent = '';
  addEventListener('resize', resize);
  resize(); showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
