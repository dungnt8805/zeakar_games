<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archery</title>
<style>
:root {
  --bg: #0b1c2c;
  --text: #f3f7fb;
  --muted: #9db3c6;
  --gold: #ffc93c;
  --gold-dark: #c7901a;
  --red: #ef4e3e;
  --sky: #38a9e4;
  --panel: #fffaf0;
  --ink: #2a2118;
  --ink-muted: #7b6d5c;
  --line: #eadfca;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(120% 90% at 50% 10%, #1d4560, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: grid; grid-template-areas: "side" "stage"; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
.side { grid-area: side; min-width: 0; min-height: 0; width: 100%; max-width: 560px; justify-self: center; display: flex; flex-direction: column; gap: 5px; }
.logo-side { display: none; align-items: center; gap: 9px; font-size: 22px; font-weight: 900; letter-spacing: -.02em; }
.topbar { display: flex; align-items: center; gap: 6px; min-height: 38px; }
.ibtn { flex: none; width: 40px; height: 38px; border-radius: 12px; background: #ffffff14; box-shadow: inset 0 0 0 1px #ffffff1c; display: grid; place-items: center; font-size: 18px; font-weight: 900; line-height: 1; }
.ibtn:active { transform: translateY(1px); background: #ffffff22; }
.ibtn[aria-pressed="false"] { opacity: .55; }
.lbl { flex: 1; min-width: 0; display: grid; justify-items: center; text-align: center; line-height: 1.15; }
.lbl strong { font-size: 15px; font-weight: 900; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbl small { font-size: 12px; font-weight: 800; color: var(--muted); max-width: 100%; }
.lbl small:empty { display: none; }
.board { display: grid; gap: 4px; min-width: 0; }
.board:empty { display: none; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 6px; padding: 3px 6px 3px 9px; border-radius: 12px; background: #ffffff0d; box-shadow: inset 0 0 0 1px #ffffff12; }
.row.on { box-shadow: inset 0 0 0 2px var(--gold); background: #ffc93c14; }
.row .nm { min-width: 0; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arrs { display: flex; gap: 3px; }
.arrs i { width: 25px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 900; background: #ffffff10; box-shadow: inset 0 0 0 1px #ffffff1a; font-variant-numeric: tabular-nums; }
.arrs i.c-g { background: #ffd43b; color: #3b2a00; }
.arrs i.c-r { background: #e8443a; color: #fff; }
.arrs i.c-b { background: #38a9e4; color: #06233a; }
.arrs i.c-k { background: #26262b; color: #fff; box-shadow: inset 0 0 0 1px #ffffff40; }
.arrs i.c-w { background: #f7f5ee; color: #26262b; }
.arrs i.c-m { background: #5b6878; color: #fff; }
.sum { min-width: 24px; text-align: right; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
.sp { min-width: 28px; height: 24px; padding: 0 6px; border-radius: 99px; background: var(--gold); color: var(--ink); font-weight: 900; display: grid; place-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 4px; min-width: 0; }
.chip { flex: 1 1 0; min-width: 0; padding: 3px 6px; border-radius: 12px; background: #ffffff0d; box-shadow: inset 0 0 0 1px #ffffff12; text-align: center; line-height: 1.15; }
.chip small { display: block; font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip b { display: block; font-size: 16px; font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip b.hearts { color: #ff6b6b; letter-spacing: 1px; }
.faces { display: none; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.faces:empty { display: none !important; }
.face { min-width: 0; padding: 6px; border-radius: 14px; background: #ffffff0a; text-align: center; }
.face svg { display: block; width: 100%; max-width: 170px; margin: 0 auto; }
.face span { display: block; margin-top: 3px; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.help { display: none; margin-top: auto; padding: 8px 10px; border-radius: 12px; background: #ffffff0a; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--muted); }

.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; border-radius: 16px; overflow: hidden; background: #0b1c2c; box-shadow: inset 0 0 0 1px #ffffff14; container-type: size; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#cv:focus-visible { outline: none; }
.stage:has(#cv:focus-visible) { box-shadow: inset 0 0 0 3px #ffc93c99; }
.toast { position: absolute; left: 50%; top: 18%; transform: translate(-50%, -6px); max-width: calc(100% - 16px); width: max-content; padding: 6px 14px; border-radius: 99px; background: #0b1c2cee; color: #fff; font-size: 14px; font-weight: 800; line-height: 1.3; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; box-shadow: 0 6px 20px #0007, inset 0 0 0 1px #ffffff22; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.7); width: max-content; max-width: calc(100% - 20px); padding: 12px 22px; border-radius: 20px; background: #0b1c2cd9; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s, transform .35s cubic-bezier(.2, 1.5, .4, 1); box-shadow: 0 10px 30px #0008; }
.banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.banner strong { display: block; font-size: clamp(22px, 8cqmin, 44px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; color: var(--gold); text-shadow: 0 3px 0 #0006; }
.banner small { display: block; margin-top: 4px; font-size: clamp(13px, 4cqmin, 20px); font-weight: 800; color: #fff; }
.banner small:empty { display: none; }

.ov { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #06121dcc; }
.ov.light { background: #06121d77; }
.ov[hidden] { display: none; }
.panel { width: min(100%, 390px); max-height: calc(100dvh - 16px); overflow-y: auto; padding: 18px 16px; border-radius: 22px; background: var(--panel); color: var(--ink); text-align: center; box-shadow: 0 7px 0 #dccfb4, 0 24px 60px #000b; animation: rise .28s ease-out; overscroll-behavior: contain; }
.panel.xl { width: min(100%, 560px); }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.logo { display: flex; align-items: center; justify-content: center; gap: 10px; }
.logo h1 { font-size: 38px; font-weight: 900; letter-spacing: -.03em; line-height: 1; color: var(--ink); }
.tgt { flex: none; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, #ffd43b 0 20%, #e8443a 21% 40%, #38a9e4 41% 60%, #26262b 61% 80%, #f7f5ee 81%); box-shadow: 0 0 0 2px #f7f5ee, 0 4px 10px #0004; }
.logo-side .tgt { width: 28px; height: 28px; }
.tagline { margin-top: 8px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--ink-muted); }
.modes { margin-top: 14px; display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 2px 10px; padding: 10px 12px; border-radius: 16px; background: #fff; text-align: left; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode .ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; background: var(--c); color: #fff; font-weight: 900; }
.mode strong { font-size: 16px; font-weight: 900; line-height: 1.2; }
.mode small { font-size: 12px; font-weight: 700; color: var(--ink-muted); line-height: 1.3; }
.small { margin-top: 10px; font-size: 12px; font-weight: 700; line-height: 1.4; color: var(--ink-muted); }
.small:empty { display: none; }
.field { margin-top: 14px; text-align: left; }
.label { margin-bottom: 6px; font-size: 12px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #f1e8d6; }
.seg button { flex: 1; min-width: 0; min-height: 36px; padding: 7px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--ink-muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #dccfb4; }
.bracket { margin-top: 10px; padding: 0; list-style: none; display: grid; gap: 4px; text-align: left; }
.bracket li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 12px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 800; }
.bracket li span:last-child { color: var(--ink-muted); white-space: nowrap; }
.cta { display: block; width: 100%; margin-top: 16px; padding: 13px; border-radius: 16px; background: var(--gold); color: var(--ink); font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--gold-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-dark); }
.ghost { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 14px; background: #f1e8d6; color: var(--ink); font-size: 15px; font-weight: 800; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 10px; padding: 9px 12px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); text-align: left; font-size: 15px; font-weight: 800; }
.sw { flex: 0 0 auto; width: 42px; height: 24px; border-radius: 99px; background: #d9ccb4; position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .2s; }
.toggle[aria-checked="true"] .sw { background: #2fb36b; }
.toggle[aria-checked="true"] .sw::after { transform: translateX(18px); }
.medal { font-size: 46px; line-height: 1; }
.medal:empty { display: none; }
.big { margin-top: 8px; font-size: 40px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.big:empty { display: none; }
.sub { margin-top: 6px; font-size: 15px; font-weight: 800; color: var(--ink-muted); line-height: 1.35; }
.sub:empty { display: none; }
.stars { margin-top: 8px; font-size: 34px; letter-spacing: 4px; color: #f2a516; text-shadow: 0 2px 0 #c47c06; }
.stars .off { color: #e3d8c4; text-shadow: none; }
.stars:empty { display: none; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--red); color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.res-list { margin-top: 10px; display: grid; gap: 4px; font-size: 14px; font-weight: 800; color: var(--ink); }
.res-list:empty { display: none; }
.res-list div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 12px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); text-align: left; }
.res-list div.win { box-shadow: inset 0 0 0 2px #2fb36b; }
.res-list div.lose { box-shadow: inset 0 0 0 2px #f0a39b; }
.levels { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }
.lv { position: relative; min-height: 62px; padding: 6px 2px 5px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); display: grid; justify-items: center; align-content: center; gap: 2px; }
.lv em { font-style: normal; font-size: 18px; line-height: 1; }
.lv strong { font-size: 13px; font-weight: 900; line-height: 1; color: var(--ink); }
.lv small { font-size: 10px; letter-spacing: 1px; color: #f2a516; line-height: 1; }
.lv small .off { color: #e3d8c4; }
.lv:disabled { opacity: .4; cursor: default; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Wide frames: the range takes the full height, scores move to a side column. */
@media (min-aspect-ratio: 5/4) {
  .app { grid-template-areas: "stage side"; grid-template-columns: minmax(0, 1fr) clamp(220px, 27vw, 360px); grid-template-rows: minmax(0, 1fr); gap: 8px; }
  .side { max-width: none; min-height: 0; overflow-y: auto; align-self: stretch; }
  .logo-side { display: flex; }
  .faces { display: grid; }
  .help { display: block; }
  .lbl { justify-items: start; text-align: left; }
}
@media (min-aspect-ratio: 5/4) and (min-height: 600px) {
  .row .nm { font-size: 15px; }
  .arrs i { width: 30px; height: 26px; font-size: 14px; }
  .sum { font-size: 17px; }
  .chip b { font-size: 19px; }
  .lbl strong { font-size: 17px; }
  .lbl small { font-size: 13px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 480px) {
  .logo-side, .help, .faces { display: none; }
  .topbar { min-height: 34px; }
  .ibtn { height: 34px; width: 36px; }
}
@media (max-height: 520px) {
  .panel { padding: 12px 14px; border-radius: 18px; }
  .logo h1 { font-size: 30px; }
  .tgt { width: 32px; height: 32px; }
  .tagline { display: none; }
  .modes { margin-top: 10px; gap: 6px; }
  .mode { padding: 7px 10px; }
  .field { margin-top: 10px; }
  .cta { margin-top: 12px; padding: 10px; font-size: 17px; }
  .ghost { margin-top: 8px; padding: 9px; }
  .big { font-size: 32px; }
  .medal { font-size: 36px; }
  .stars { font-size: 28px; }
  .panel h2 { font-size: 23px; }
  .bracket li { padding: 4px 12px; }
}
@media (max-height: 420px) and (min-width: 520px) {
  .panel.wide { width: min(100%, 620px); }
  .panel.wide .modes { grid-template-columns: repeat(3, 1fr); }
  .panel.wide .mode { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .panel.wide .mode .ic { grid-row: auto; width: 28px; height: 28px; font-size: 14px; }
  .panel.wide .mode small { display: none; }
  .panel.wide .small:not(#records) { display: none; }
}
@media (max-height: 420px) {
  .bracket { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .bracket li { flex-direction: column; align-items: center; gap: 0; padding: 4px 2px; font-size: 11px; line-height: 1.2; text-align: center; }
  .panel h2 { font-size: 20px; }
}
@media (max-width: 360px) {
  .arrs i { width: 22px; }
  .row { gap: 4px; padding-left: 7px; }
  .chip b { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <aside class="side" id="side">
    <div class="logo-side" aria-hidden="true"><span class="tgt"></span>Archery</div>
    <div class="topbar">
      <button type="button" class="ibtn" id="menu-btn" data-i18n-label="menuBtn">☰</button>
      <div class="lbl"><strong id="lbl-main">Archery</strong><small id="lbl-sub"></small></div>
      <button type="button" class="ibtn" id="snd-btn" data-i18n-label="soundBtn" aria-pressed="true">🔊</button>
    </div>
    <div class="board" id="board"></div>
    <div class="faces" id="faces"></div>
    <div class="help" id="help"></div>
  </aside>
  <div class="stage" id="stage">
    <canvas id="cv" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
    <div class="toast" id="toast" aria-hidden="true"></div>
    <div class="banner" id="banner" aria-hidden="true"><strong id="banner-t"></strong><small id="banner-s"></small></div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="ov" id="menu" hidden>
  <div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="logo"><span class="tgt" aria-hidden="true"></span><h1 id="menu-title">Archery</h1></div>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="modes">
      <button type="button" class="mode" id="m-tour"><span class="ic" style="--c:#ef4e3e" aria-hidden="true">🏆</span><strong data-i18n="mTour"></strong><small data-i18n="dTour"></small></button>
      <button type="button" class="mode" id="m-chal"><span class="ic" style="--c:#38a9e4" aria-hidden="true">🎈</span><strong data-i18n="mChal"></strong><small id="d-chal"></small></button>
      <button type="button" class="mode" id="m-end"><span class="ic" style="--c:#2fb36b" aria-hidden="true">∞</span><strong data-i18n="mEnd"></strong><small data-i18n="dEnd"></small></button>
    </div>
    <p class="small" id="records"></p>
    <button type="button" class="toggle" id="snd-toggle" role="switch" aria-checked="true"><span data-i18n="sound"></span><span class="sw" aria-hidden="true"></span></button>
    <p class="small" data-i18n="controls"></p>
    <p class="small" data-i18n="keys"></p>
  </div>
</div>

<div class="ov" id="tour" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="tour-title">
    <h2 id="tour-title" data-i18n="mTour"></h2>
    <div class="field"><div class="label" data-i18n="diff"></div>
      <div class="seg" id="diff-seg">
        <button type="button" data-d="amateur" data-i18n="amateur"></button>
        <button type="button" data-d="pro" data-i18n="pro"></button>
        <button type="button" data-d="champion" data-i18n="champion"></button>
      </div>
    </div>
    <p class="small" id="diff-rec"></p>
    <ol class="bracket" id="bracket"></ol>
    <button type="button" class="cta" id="tour-go" data-i18n="start"></button>
    <button type="button" class="ghost" id="tour-back" data-i18n="back"></button>
  </div>
</div>

<div class="ov" id="levels" hidden>
  <div class="panel xl" role="dialog" aria-modal="true" aria-labelledby="lv-title">
    <h2 id="lv-title" data-i18n="mChal"></h2>
    <p class="small" id="lv-stars"></p>
    <div class="levels" id="lv-grid"></div>
    <button type="button" class="ghost" id="lv-back" data-i18n="back"></button>
  </div>
</div>

<div class="ov light" id="result" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="res-title">
    <div class="medal" id="res-medal" aria-hidden="true"></div>
    <h2 id="res-title"></h2>
    <div class="stars" id="res-stars"></div>
    <p class="big" id="res-big"></p>
    <p class="sub" id="res-sub"></p>
    <p class="badge" id="res-badge" hidden></p>
    <div class="res-list" id="res-list"></div>
    <div id="res-btns"></div>
  </div>
</div>

<div class="ov light" id="pause" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <h2 id="pause-title" data-i18n="paused"></h2>
    <button type="button" class="cta" id="p-resume" data-i18n="resume"></button>
    <button type="button" class="ghost" id="p-restart" data-i18n="restart"></button>
    <button type="button" class="ghost" id="p-quit" data-i18n="quit"></button>
  </div>
</div>

<script>
(() => {
  const I18N = {
    en: {
      tagline: 'Draw the bow, read the wind and hit the gold — from 18 m out to 90 m.',
      mTour: 'Tournament', dTour: 'Knockout matches vs CPU archers, 18 m → 90 m',
      mChal: 'Challenges', dChal: n => `Balloons, apples and moving targets · ${n} levels`,
      mEnd: 'Endless', dEnd: 'Distance, wind and moving targets keep growing',
      sound: 'Sound',
      controls: 'Drag down on the range to draw the bow, then move to aim and release to shoot.',
      keys: 'Keys: hold Space to draw · arrows to aim (Shift = fine) · let go to shoot',
      diff: 'Difficulty', amateur: 'Amateur', pro: 'Pro', champion: 'Champion',
      start: 'Start', back: 'Back',
      rounds: ['Round of 32', 'Round of 16', 'Quarterfinal', 'Semifinal', 'Final'],
      vs: n => `vs ${n}`, you: 'You', set: n => `Set ${n}`, shootoff: 'Shoot-off', endN: n => `End ${n}`,

    const main = cfg.objs.find(o => o.kind === 'target' && o.lane === 'me') || cfg.objs.find(o => o.kind === 'balloon' || o.kind === 'apple');
    const p = main ? posAt(main, 0) : { x: 0, y: FACE_Y };

  // ---------- Camera
  function setCam(yaw, pitch, f) {

  function sway() {

  function camera() {

    else if (aim.drawing) { const s = sway(); yaw += s.yaw; pitch += s.pitch; }

    const fFull = view.minD * W.ds / W.span, fIdle = Math.min(fFull * 0.38, view.minD * 2.6);
    setCam(yaw, pitch, fIdle * Math.pow(fFull / fIdle, view.zoom));

  // ---------- Arrow flight (closed form: wind and gravity are constant while an arrow flies)
  const isCollider = o => o.kind !== 'balloon' || !o.popped;
  function fire(yaw, pitch) {
    const lp = pitch + W.elev, cp = Math.cos(lp);
    const v = { x: V0 * Math.sin(yaw) * cp, y: V0 * Math.sin(lp), z: V0 * Math.cos(yaw) * cp };
    const ax = WIND_K * windCross();
    const ev = [];
    for (const o of W.objs) if (o.z > 0 && isCollider(o)) ev.push({ tau: o.z / v.z, o });
    ev.push({ tau: (v.y + Math.sqrt(v.y * v.y + 2 * G * EYE)) / G, ground: true });
    ev.sort((a, b) => a.tau - b.tau);

  }
  function arrowPos(a, tau) { return { x: a.v.x * tau + 0.5 * a.ax * tau * tau, y: EYE + a.v.y * tau - 0.5 * G * tau * tau, z: a.v.z * tau }; }
  function arrowDir(a, tau) { const x = a.v.x + a.ax * tau, y = a.v.y - G * tau, z = a.v.z, l = Math.hypot(x, y, z); return { x: x / l, y: y / l, z: z / l }; }
  function ringScore(r, R) {

    return { s: Math.max(1, 10 - Math.floor(e / (R / 10))), X: false };
  }
  function collide(o, p, T) {
    const c = posAt(o, T), dx = p.x - c.x, dy = p.y - c.y;
    switch (o.kind) {
      case 'target': {
        const r = Math.hypot(dx, dy);
        if (o.lane === 'me' && r <= o.R + ARROW_R) return { stop: true, kind: 'ring', ...ringScore(r, o.R), x: dx / o.R, y: dy / o.R, r: r / o.R };
        if (r <= o.bossR) return { stop: true, kind: 'boss', s: 0 };
        return null;
      }
      case 'balloon': return !o.popped && (dx / (o.r + ARROW_R)) ** 2 + (dy / (o.r * 1.18 + ARROW_R)) ** 2 <= 1 ? { pop: true } : null;
      case 'apple': return !o.hit && Math.hypot(dx, dy) <= o.r + ARROW_R ? { stop: true, kind: 'apple', s: 0 } : null;
      case 'dummy': {
        const torso = Math.abs(dx) <= 0.23 && p.y >= 0.95 && p.y <= 1.55, head = Math.hypot(dx, p.y - 1.68) <= 0.14, arms = Math.abs(dx) <= 0.7 && Math.abs(p.y - 1.42) <= 0.05, pole = Math.abs(dx) <= 0.04 && p.y < 0.95;
        return torso || head || arms || pole ? { stop: true, kind: 'dummy', s: 0 } : null;
      }
      case 'post': return Math.abs(dx) <= o.w / 2 + ARROW_R && p.y <= o.top ? { stop: true, kind: 'post', s: 0 } : null;
      case 'frame': {
        const post = (Math.abs(dx - 0.85) <= 0.05 || Math.abs(dx + 0.85) <= 0.05) && p.y <= 2.65, beam = Math.abs(p.y - 2.62) <= 0.05 && Math.abs(dx) <= 0.9;
        return post || beam ? { stop: true, kind: 'post', s: 0 } : null;
      }
      default: return null;
    }
  }
  function updateArrow(dt) {
    const a = W.flying;
    const nt = a.tau + dt;
    while (a.i < a.ev.length && a.ev[a.i].tau <= nt) {
      const e = a.ev[a.i++], p = arrowPos(a, e.tau), dir = arrowDir(a, e.tau);
      if (e.ground) {
        W.stuck.push({ obj: null, x: p.x, y: 0.02, z: p.z, dir });
        dust(p.x, 0.05, p.z, '#8a6a3f');
        return arrowDone({ kind: 'ground', s: 0 });
      }
      const T = a.T0 + e.tau, res = collide(e.o, p, T);
      if (!res) continue;

      if (res.kind === 'apple') {
        e.o.hit = true;
        W.fx.push({ type: 'apple', x: p.x, y: p.y, z: e.o.z, vx: dir.x * 9, vy: 2.5, vz: dir.z * 9, rot: 0, life: 2.2, dir });
      } else {
        W.stuck.push({ obj: e.o, lx: p.x - c.x, ly: p.y - c.y, z: e.o.z - 0.02, dir });

    a.tau = nt;

  }
  function popBalloon(o, T) {

    popup(t.aPop, o.color, 0.8);
    if (game && game.mode === 'chal') { game.popped++; renderHud(); }
  }
  function dust(x, y, z, col) {
    if (reducedMotion) return;
    for (let i = 0; i < 8; i++) W.fx.push({ type: 'bit', x, y, z, vx: rand(-0.6, 0.6), vy: rand(0, 1), vz: rand(-0.6, 0), life: rand(0.3, 0.6), col, size: 0.015 });
  }
  function arrowDone(res) {

      popup(res.X ? 'X' : String(res.s), ringColor(res.s), 1.3);
      announce(res.X ? t.aX : t.aScore(res.s));
    } else if (res.kind === 'apple') { sfx.gold(); popup(t.aApple, '#ff6b5b', 1.1); announce(t.aApple); }
    else if (res.kind === 'dummy') { sfx.thud(); popup(t.hitDummy, '#ff8a7a', 1); }
    else { if (res.kind !== 'lost') sfx.thud(); if (game.mode !== 'chal' || game.L.k === 's') { popup(t.miss, '#cfd8e3', 1.1); announce(t.miss); } }

    renderHud();
  }
  function ringColor(s) { return s >= 9 ? '#ffd43b' : s >= 7 ? '#ff6b5b' : s >= 5 ? '#5cc2f2' : s >= 3 ? '#e8eef5' : s >= 1 ? '#ffffff' : '#cfd8e3'; }

  // ---------- Modes

  const statLine = st => t.statLine(st.n, st.n ? (st.sum / st.n).toFixed(1) : '0.0', st.x);

  function startTournament(diff) {
    game = { mode: 'tour', diff, round: 0, names: shuffle(NAMES.slice()).slice(0, 5), log: [], stats: { n: 0, sum: 0, x: 0 }, phase: 'intro', timer: 0 };
    startMatch();
  }
  const oppName = () => game.names[game.round];
  function startMatch() {
    const st = STAGES[game.round];
    game.m = { sets: [], pts: [0, 0], me: [], cpu: [], so: false };
    setupStage(st, null, true);
    intro(t.rounds[game.round], `${st.d} m · ${t.vs(oppName())}`, 2, toAim);
  }
  function cpuArrow() {
    const o = W.objs.find(x => x.lane === 'cpu'), band = o.R / 10;
    const s = DIFFS[game.diff] * (1 - 0.05 * game.round) * band * (Math.random() < 0.06 ? 2 : 1) * (0.9 + 0.025 * STAGES[game.round].d / 18);
    const gx = gauss() * s, gy = gauss() * s, r = Math.hypot(gx, gy);

  }
  function cpuShoot() {

    toast(`${oppName()}: ${label}`);
    announce(`${oppName()}: ${res.s ? t.aScore(res.s) : t.miss}`);

  }
  function afterPair() {

      banner(won ? t.soWin : t.soLose, `${a.s}–${b.s}`, 1.8);

  }
  function finishSet() {
    const m = game.m, a = sum(m.me), b = sum(m.cpu);

    const txt = a > b ? t.setWon(a, b) : a < b ? t.setLost(a, b) : t.setTied(a, b);
    announce(`${txt}. ${m.pts[0]}–${m.pts[1]}`);
    if (m.pts[0] >= 6 || m.pts[1] >= 6) {
      banner(txt, `${m.pts[0]}–${m.pts[1]}`, 1.6);
      later(1.7, () => matchOver(m.pts[0] >= 6));
    } else {
      const so = m.sets.length >= 5;
      banner(txt, so ? t.shootoff : `${m.pts[0]}–${m.pts[1]} · ${t.set(m.sets.length + 1)}`, 1.8);
      later(1.9, () => {
        m.me = []; m.cpu = []; m.so = so; m.soMe = null; m.soCpu = null;

  function matchOver(won) {

    const wins = game.round + (won ? 1 : 0);
    if (wins > rec.tour[game.diff]) { rec.tour[game.diff] = wins; }
    if (won && game.round === 4) rec.tour.golds++;
    writeJSON(STORE.tour, rec.tour);
    if (won && game.round < 4) {
      sfx.win();
      const nr = game.round + 1;
      showResult({
        title: t.matchWon(oppName()), medal: '🎯', big: `${m.pts[0]}–${m.pts[1]}`, sub: t.nextUp(t.rounds[nr], STAGES[nr].d, game.names[nr]),
        list: m.sets.map((s, i) => ({ text: `${t.set(i + 1)}`, val: `${s.a}–${s.b}`, cls: s.a > s.b ? 'win' : s.a < s.b ? 'lose' : '' })),
        buttons: [{ label: t.cont, primary: true, fn: () => { game.round = nr; startMatch(); } }, { label: t.quit, fn: openMenu }],
      });

  function tourEnd(won) {
    const champion = won && game.round === 4, final = game.round === 4;

    const title = champion ? t.champ : final ? t.silver : t.tourOver;
    showResult({
      title, medal: champion ? '🥇' : final ? '🥈' : game.round === 3 ? '🥉' : '', big: t.wins(game.log.filter(l => l.won).length),
      sub: `${champion || final ? '' : t.reached(t.rounds[game.round]) + ' · '}${statLine(game.stats)}`,
      list: game.log.map(l => ({ text: `${t.rounds[l.r]} · ${l.name}`, val: `${l.a}–${l.b}`, cls: l.won ? 'win' : 'lose' })),
      buttons: [{ label: t.again, primary: true, fn: () => startTournament(game.diff) }, { label: t.menu, fn: openMenu }],
    });
    announce(`${title}. ${t.wins(game.log.filter(l => l.won).length)}`);
  }

  function startEndless() {

  function startEnd() {

  function goalText(L) {

  function startLevel(i) {

      if (stars > rec.stars[i]) { rec.stars[i] = stars; writeJSON(STORE.stars, rec.stars); }
      sfx.win();
      const btns = [];
      if (i + 1 < LEVELS.length) btns.push({ label: t.next, primary: true, fn: () => startLevel(i + 1) });
      btns.push({ label: t.retry, primary: !btns.length, fn: () => startLevel(i) }, { label: t.levels, fn: openLevels });
      showResult({ title: t.cleared, stars, sub: L.k === 's' ? t.short(game.total, L.need) : `${t.arrows}: ${game.used}/${L.n}`, buttons: btns });

  const MODES = {
    tour: {
      shot(res) {

    },
    end: {

          if (game.cur.length < 3) return toAim();

      },
    },
    chal: {
      shot(res) {

        if (res.kind === 'apple') game.hits++;

  // ---------- Update

  // ---------- Drawing

    const hz = horizonY(), w = view.w, h = view.h;

        const az = ((i * 0.37 + W.anim * 0.004 * (1 + W.wind.speed * 0.3)) % 2.6) - 1.3, el = 0.09 + (i % 3) * 0.05;
        const x = view.cx + view.f * Math.tan(az - view.yaw), y = elevY(el), r = view.f * 0.025;

    ptr.lx = e.clientX; ptr.ly = e.clientY;
  });
  cv.addEventListener('pointerup', e => { if (ptr && e.pointerId === ptr.id) { ptr = null; release(); } });
  cv.addEventListener('pointercancel', () => { cancelDraw(); });

  const KEY_DIRS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  document.addEventListener('keydown', e => {
    if (e.key === 'Shift') keys.fine = true;
    if (!game || overlayOpen() || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target instanceof Element && e.target.closest('button')) return;
    const dir = KEY_DIRS[e.key];
    if (dir) { e.preventDefault(); keys[dir] = true; keyboardUsed = true; return; }
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      ensureAudio();
      if (e.repeat || !canShoot() || aim.drawing) return;
      keyboardUsed = true;
      aim.drawing = true; aim.src = 'key'; aim.drawP = 0; aim.full = false; aim.hold = 0;
    }
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'Shift') keys.fine = false;
    const dir = KEY_DIRS[e.key];
    if (dir) keys[dir] = false;
    if ((e.key === ' ' || e.key === 'Enter') && aim.src === 'key') { e.preventDefault(); release(); }
  });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; cancelDraw(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelDraw(); });

  function setSound(on) {
    soundOn = on; writeJSON(STORE.sound, on);
    els.snd.setAttribute('aria-pressed', String(on)); els.snd.textContent = on ? '🔊' : '🔈';
    els.sndToggle.setAttribute('aria-checked', String(on));
    if (on) ensureAudio();
  }
  els.snd.addEventListener('click', () => setSound(!soundOn));
  els.sndToggle.addEventListener('click', () => setSound(!soundOn));
  $('menu-btn').addEventListener('click', () => { if (game && els.pause.hidden && els.result.hidden) openPause(); else if (!game) openMenu(); });
  $('m-tour').addEventListener('click', openTour);
  $('m-chal').addEventListener('click', openLevels);
  $('m-end').addEventListener('click', () => { showOnly(null); startEndless(); focusCanvas(); });
  for (const b of document.querySelectorAll('#diff-seg button')) b.addEventListener('click', () => { tourDiff = b.dataset.d; renderTour(); });
  $('tour-go').addEventListener('click', () => { showOnly(null); startTournament(tourDiff); focusCanvas(); });
  $('tour-back').addEventListener('click', openMenu);
  $('lv-back').addEventListener('click', openMenu);
  $('p-resume').addEventListener('click', () => { showOnly(null); renderHud(); focusCanvas(); });
  $('p-restart').addEventListener('click', () => { showOnly(null); restartCurrent(); focusCanvas(); });
  $('p-quit').addEventListener('click', openMenu);
  $('d-chal').textContent = t.dChal(LEVELS.length);
  els.help.textContent = `${t.help} ${t.keys}`;

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!document.hidden) {
      let left = dt * timeScale;
      while (left > 1e-6) { const s = Math.min(left, 0.05); update(s); left -= s; }
      draw();
    }
    requestAnimationFrame(frame);
  }

  // Read-only state plus input-equivalent helpers for automated tests.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__archery = {
    state: () => ({
      mode: game && game.mode, phase: game && game.phase, overlay: OVERLAYS.find(id => !els[id].hidden) || null,
      ds: W.ds, elev: W.elev, T: W.T, windAx: WIND_K * windCross(), windSpeed: W.wind.speed, consts: { G, V0, EYE },
      aim: { yaw: aim.yaw, pitch: aim.pitch, drawP: aim.drawP, full: aim.full, drawing: aim.drawing },
      objs: W.objs.map((o, i) => ({ i, kind: o.kind, lane: o.lane, z: o.z, R: o.R, popped: !!o.popped, hit: !!o.hit, ...posAt(o, W.T) })),
      tour: game && game.mode === 'tour' ? { round: game.round, pts: game.m.pts.slice(), sets: game.m.sets.length, so: game.m.so, me: game.m.me.map(r => r.s), cpu: game.m.cpu.map(r => r.s), log: game.log.slice() } : null,
      end: game && game.mode === 'end' ? { end: game.end, hearts: game.hearts, score: game.score, par: game.par } : null,
      chal: game && game.mode === 'chal' ? { li: game.li, left: game.left, used: game.used, popped: game.popped, hits: game.hits, total: game.total } : null,
      stars: rec.stars.slice(), tourRec: { ...rec.tour }, endlessBest: rec.endless, flying: !!W.flying, stuck: W.stuck.length,
    }),
    objAt: (i, T) => posAt(W.objs[i], T),
    shoot: (yaw, pitch) => { if (!canShoot()) return false; aim.yaw = yaw; aim.pitch = pitch; resetAim(); camera(); fire(yaw, pitch); return true; },
    speed: k => { timeScale = clamp(Number(k) || 1, 0.25, 12); },
  };

  new ResizeObserver(resize).observe($('stage'));
  resize();
  openMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
