<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ô Ăn Quan</title>
<style>
:root {
  --ink: #3b2416;
  --muted: #8a6a55;
  --bg: #2a1510;
  --paper: #fff8ec;
  --wood: #e3b574;
  --wood-l: #f3d39c;
  --wood-d: #b98042;
  --wood-dd: #7a4a1f;
  --well: #f7e4bd;
  --well-d: #e2bd82;
  --p0: #f07a2b; --p0d: #b8501a; --p0l: #ffd0ad;
  --p1: #23a998; --p1d: #15776b; --p1l: #b9efe6;
  --gold: #ffc94a;
  --gold-d: #c98d12;
  --red: #c4392a;
  --red-d: #8a2117;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: #fff;
  background-color: var(--bg);
  background-image: radial-gradient(110% 80% at 50% 30%, #5b2d1b 0, transparent 72%), repeating-linear-gradient(90deg, #ffffff05 0 3px, transparent 3px 14px), repeating-linear-gradient(0deg, #00000014 0 3px, transparent 3px 14px);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.ic { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 640px; margin: auto; display: flex; flex-direction: column; gap: 8px; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 6px; }
h1 { flex: 1; min-width: 0; font-size: clamp(20px, 6.6vw, 31px); font-weight: 900; letter-spacing: -.02em; line-height: 1; white-space: nowrap; color: var(--wood-l); text-shadow: 0 2px 0 #0005; }
h1 span, .panel h2 span { color: var(--gold); }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: #ffffff1a; box-shadow: inset 0 0 0 1px #ffffff22, 0 3px 0 #0004; font-weight: 900; }
.icon-btn:active:not(:disabled) { transform: translateY(2px); }
.speed-ic path { opacity: .3; }
.speed-ic[data-s="0"] path:nth-child(1), .speed-ic[data-s="1"] path:nth-child(-n+2), .speed-ic[data-s="2"] path { opacity: 1; }
.status { min-height: 1.3em; text-align: center; font-size: 15px; font-weight: 800; line-height: 1.3; color: #fff; }

.table { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; position: relative; }
.pbar { --pc: var(--p0); --pcd: var(--p0d); width: min(100%, max(var(--bw, 300px), 290px)); margin: 0 auto; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "av who pile pts"; align-items: center; gap: 4px 8px; padding: 6px 10px; border-radius: 16px; background: #ffffff12; box-shadow: inset 0 0 0 1px #ffffff1c; transition: box-shadow .2s, background .2s; }
.pbar[data-p="1"] { --pc: var(--p1); --pcd: var(--p1d); }
.pbar.turn { background: #ffffff24; box-shadow: inset 0 0 0 2px var(--pc), 0 0 18px -4px var(--pc); }
.avatar { grid-area: av; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff8, var(--pc) 55%, var(--pcd)); font-size: 16px; font-weight: 900; box-shadow: 0 2px 0 #0004; }
.who { grid-area: who; min-width: 0; }
.who b, .who small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who b { font-size: 14px; line-height: 1.2; }
.who small { font-size: 11px; font-weight: 700; color: #ffffffa8; min-height: 1.2em; }
.who small.debt { color: #ffb4a0; }
.pile { grid-area: pile; min-width: 0; height: 24px; display: flex; flex-wrap: wrap-reverse; align-content: center; justify-content: flex-end; gap: 2px; overflow: hidden; }
.pile i { width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c9bdac 70%); }
.pile i.q { width: 18px; height: 16px; background: radial-gradient(circle at 35% 30%, #c4f5df, #2f9a74 55%, #1b5c45); }
@media (min-height: 600px) {
  .pbar { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "av who pts" "pile pile pile"; padding: 8px 12px; }
  .pile { height: 32px; justify-content: flex-start; flex-wrap: wrap; align-content: flex-start; gap: 3px; padding: 4px 6px; border-radius: 10px; background: #0000002e; box-shadow: inset 0 2px 4px #0005; }
  .pile i { width: 11px; height: 10px; }
  .pile i.q { width: 26px; height: 22px; }
  .pile:empty::after { content: ''; }
}
.pile[hidden] { display: none; }
.pts { grid-area: pts; min-width: 2.2ch; text-align: right; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.pts small { display: block; font-size: 10px; font-weight: 800; color: #ffffffa0; text-align: right; }
.pts.bump { animation: bump .45s ease-out; }
@keyframes bump { 40% { transform: scale(1.35); color: var(--gold); } }

.board-wrap { flex: 0 0 auto; display: grid; place-items: center; }
.board { position: relative; border-radius: calc(var(--u) * .42); background: linear-gradient(170deg, var(--wood-l), var(--wood) 45%, var(--wood-d)); box-shadow: inset 0 2px 0 #fff7, inset 0 -3px 0 #0002, 0 calc(var(--u) * .09) 0 var(--wood-dd), 0 18px 40px #0009; touch-action: manipulation; }
.board::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: repeating-linear-gradient(93deg, #ffffff10 0 2px, transparent 2px 9px), repeating-linear-gradient(88deg, #7a4a1f12 0 1px, transparent 1px 23px); pointer-events: none; }
.cell { position: absolute; border-radius: calc(var(--u) * .17); background: radial-gradient(ellipse at 50% 42%, #fff4dc, var(--well) 45%, var(--well-d)); box-shadow: inset 0 calc(var(--u) * .06) calc(var(--u) * .1) #7a4a1f66, inset 0 0 0 1px #7a4a1f33; transition: box-shadow .2s, transform .15s, background .2s; overflow: visible; }
.cell.mand.L { border-radius: 100% calc(var(--u) * .17) calc(var(--u) * .17) 100% / 50% calc(var(--u) * .17) calc(var(--u) * .17) 50%; }
.cell.mand.R { border-radius: calc(var(--u) * .17) 100% 100% calc(var(--u) * .17) / calc(var(--u) * .17) 50% 50% calc(var(--u) * .17); }
.cell.store { border-radius: calc(var(--u) * .5); }
.cell.can { cursor: pointer; box-shadow: inset 0 calc(var(--u) * .06) calc(var(--u) * .1) #7a4a1f66, 0 0 0 calc(var(--u) * .045) var(--pc), 0 0 calc(var(--u) * .2) var(--pc); animation: glow 1.1s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: inset 0 calc(var(--u) * .06) calc(var(--u) * .1) #7a4a1f66, 0 0 0 calc(var(--u) * .03) var(--pc), 0 0 calc(var(--u) * .06) var(--pc); } }
.cell.sel { z-index: 3; animation: none; transform: translateY(calc(var(--u) * -.05)); background: radial-gradient(ellipse at 50% 42%, #fff8e6, #ffe7a8 50%, #f2c867); box-shadow: 0 0 0 calc(var(--u) * .06) var(--gold), 0 calc(var(--u) * .08) calc(var(--u) * .2) #0006; }
.cell.target { cursor: pointer; }
.cell.path { background: radial-gradient(ellipse at 50% 42%, #fff6d8, #ffe39a 55%, #f1c463); }
.cell.path::before { content: ''; position: absolute; z-index: 3; left: 50%; top: 50%; width: calc(var(--u) * .16); height: calc(var(--u) * .16); border-radius: 50%; background: var(--gold-d); box-shadow: 0 0 0 2px #fff; transform: translate(-50%, -50%); opacity: .85; }
.cell.path-end { box-shadow: inset 0 0 0 calc(var(--u) * .045) var(--gold-d), inset 0 calc(var(--u) * .06) calc(var(--u) * .1) #7a4a1f66; }
.cell.flash { animation: flash .6s ease-out; }
@keyframes flash { 30% { background: radial-gradient(ellipse at 50% 42%, #fff, #ffe08a 60%, var(--gold)); transform: scale(1.06); } }
.cell.last::after { content: ''; position: absolute; left: 50%; width: calc(var(--u) * .14); height: calc(var(--u) * .14); border-radius: 50%; background: var(--lc, var(--p0)); transform: translateX(-50%); box-shadow: 0 0 0 2px #fff; }
.cell.last.top::after { top: calc(var(--u) * -.1); }
.cell.last.bot::after { bottom: calc(var(--u) * -.1); }
.cell:focus-visible { outline: 3px solid #fff; outline-offset: 2px; z-index: 4; }
.stones { position: absolute; inset: 0; pointer-events: none; }
.peb { position: absolute; width: calc(var(--u) * .23); height: calc(var(--u) * .205); border-radius: 52% 48% 50% 46%; transform: translate(-50%, -50%) rotate(var(--r, 0deg)); background: radial-gradient(circle at 35% 30%, #fff, var(--a) 50%, var(--b)); box-shadow: 0 calc(var(--u) * .02) calc(var(--u) * .02) #0005; }
.peb.k0 { --a: #f2ece2; --b: #a99c88; }
.peb.k1 { --a: #b9c6d1; --b: #67798a; }
.peb.k2 { --a: #e4cba3; --b: #a07c4e; }
.peb.k3 { --a: #d6d0c6; --b: #7e766a; }
.peb.new { animation: plop .24s ease-out; }
@keyframes plop { from { transform: translate(-50%, -160%) scale(1.25); opacity: .3; } }
.quan { position: absolute; top: 50%; width: calc(var(--u) * .66); height: calc(var(--u) * .58); border-radius: 48% 52% 45% 55%; transform: translate(-50%, -50%); background: radial-gradient(circle at 34% 28%, #d4fbe9, #36a57d 50%, #1a5a43); box-shadow: 0 calc(var(--u) * .05) calc(var(--u) * .06) #0007, inset 0 calc(var(--u) * -.04) 0 #0003; z-index: 2; }
.quan[hidden] { display: none; }
.cnt { position: absolute; z-index: 2; right: 5%; bottom: 4%; min-width: 1.5em; padding: 0 .3em; border-radius: 99px; background: #fff9e9d9; color: var(--wood-dd); font-size: max(10px, calc(var(--u) * .19)); font-weight: 900; line-height: 1.35; text-align: center; font-variant-numeric: tabular-nums; pointer-events: none; }
.cell.top .cnt { bottom: auto; top: 4%; }
.cell.end .cnt { right: 50%; transform: translateX(50%); bottom: 5%; }
.cell.zero .cnt { opacity: .45; }
.hand { position: absolute; z-index: 8; left: 0; top: 0; width: calc(var(--u) * .5); height: calc(var(--u) * .5); min-width: 22px; min-height: 22px; border-radius: 50%; display: grid; place-items: center; transform: translate(-50%, -50%); background: var(--pc, var(--p0)); color: #fff; border: 2px solid #fff; font-size: max(11px, calc(var(--u) * .22)); font-weight: 900; box-shadow: 0 4px 10px #0007; pointer-events: none; transition: left var(--hs, .15s) ease, top var(--hs, .15s) ease; }
.hand[hidden] { display: none; }
.dirpick { position: absolute; z-index: 9; display: flex; gap: 8px; transform: translateX(-50%); }
.dirpick[hidden] { display: none; }
.dirpick.up { transform: translate(-50%, -100%); }
.dirpick button { width: 46px; height: 40px; display: grid; place-items: center; border-radius: 13px; background: var(--gold); color: #5a3a00; box-shadow: 0 4px 0 var(--gold-d), 0 6px 14px #0006; }
.dirpick button .ic { width: 24px; height: 24px; stroke-width: 3; }
.dirpick button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-d); }
.dirpick.cpu button { pointer-events: none; opacity: .35; }
.dirpick.cpu button.on { opacity: 1; }
.fly { position: fixed; z-index: 30; left: 0; top: 0; padding: 2px 8px; border-radius: 99px; background: var(--gold); color: #4a3000; font-weight: 900; font-size: 15px; pointer-events: none; box-shadow: 0 4px 10px #0006; }

.log { display: none; list-style: none; }
.foot { text-align: center; font-size: 12px; color: #ffffff99; line-height: 1.45; }
.foot strong { color: #fff; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); background: #1a0b07c4; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 420px); max-height: calc(100dvh - 16px); overflow-y: auto; overscroll-behavior: contain; background: var(--paper); color: var(--ink); border-radius: 26px; padding: 20px 18px; text-align: center; box-shadow: 0 8px 0 #e3cfae, 0 24px 60px #000a; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 29px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; color: var(--ink); }
.panel h2 span { color: var(--red); }
.logo { display: flex; justify-content: center; align-items: center; gap: 5px; margin-bottom: 8px; }
.logo i { width: 14px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c9bdac 70%); box-shadow: 0 1px 1px #0004; }
.logo i.q { width: 30px; height: 26px; background: radial-gradient(circle at 34% 28%, #d4fbe9, #36a57d 50%, #1a5a43); }
.text { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.fields { display: grid; gap: 0 14px; }
.field { margin-top: 11px; text-align: left; min-width: 0; }
.field[hidden], .pair[hidden] { display: none; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 10px; align-items: end; }
.pair .note { grid-column: 1 / -1; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #f3e6d0; }
.seg button { flex: 1; min-width: 0; min-height: 34px; padding: 6px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.15; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #e0caa6; }
.note { margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.3; }
.cta { margin-top: 16px; width: 100%; padding: 14px; border-radius: 18px; background: var(--red); color: #fff; font-size: 19px; font-weight: 900; box-shadow: 0 6px 0 var(--red-d); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--red-d); }
.ghost-btn { margin-top: 10px; width: 100%; padding: 11px; border-radius: 16px; background: #f3e6d0; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #e0caa6; }
.ghost-btn[hidden] { display: none; }
.ghost-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #e0caa6; }
.actions { display: flex; flex-wrap: wrap; column-gap: 8px; }
.actions .ghost-btn { flex: 1 1 0; min-width: 0; }
.rules { margin-top: 10px; text-align: left; padding-left: 1.25em; display: grid; gap: 7px; font-size: 14px; line-height: 1.4; color: var(--ink); }
.rules li::marker { color: var(--red); font-weight: 900; }
.emoji { font-size: 44px; line-height: 1.2; }
.final { margin-top: 12px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.final div { padding: 8px 6px; border-radius: 14px; background: #f3e6d0; min-width: 0; }
.final b { display: block; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.final small { display: block; font-size: 12px; font-weight: 800; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.final .win { background: #ffe9a8; box-shadow: inset 0 0 0 2px var(--gold-d); }
.final i { font-style: normal; font-weight: 900; color: var(--muted); }
.record { margin-top: 10px; font-size: 13px; font-weight: 800; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Narrow / short portrait */
@media (max-width: 380px) { .icon-btn { width: 36px; height: 36px; border-radius: 12px; } .top { gap: 5px; } .pbar { padding: 5px 8px; gap: 6px; } .avatar { width: 28px; height: 28px; font-size: 14px; } .pts { font-size: 20px; } .who b { font-size: 13px; } }
@media (max-height: 700px) { .foot { display: none; } .panel { padding: 16px; } .field { margin-top: 8px; } .cta { margin-top: 12px; padding: 12px; } }
@media (max-height: 560px) {
  .app { gap: 6px; }
  .status { font-size: 14px; }
  .logo { display: none; }
  .panel h2 { font-size: 24px; }
  .text { font-size: 13px; line-height: 1.35; margin-top: 4px; }
  .label { font-size: 11px; margin-bottom: 3px; }
  .seg button { min-height: 32px; padding: 3px; font-size: 13px; }
  .note { font-size: 11px; }
  .emoji { font-size: 32px; }
  .rules { font-size: 13px; gap: 5px; }
}
@media (max-aspect-ratio: 5/4) and (min-height: 680px) {
  .log { display: flex; flex-direction: column; gap: 3px; min-height: 0; height: 96px; overflow: hidden; justify-content: flex-end; font-size: 13px; font-weight: 700; color: #ffffffb0; max-width: 460px; width: 100%; margin: 0 auto; }
}
.log li { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 8px; border-radius: 8px; }
.log li:last-child { background: #ffffff14; color: #fff; }
.log li i { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; }
.log li b { color: var(--gold); }

/* Wide frames: board area at full height on the left, HUD in a side column */
@media (min-aspect-ratio: 5/4) {
  .app { --side: clamp(206px, 24vw, 330px); max-width: 1500px; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "table top" "table status" "table log" "table foot"; column-gap: 18px; row-gap: 10px; }
  .top { grid-area: top; flex-wrap: wrap; row-gap: 8px; }
  .top h1 { flex: 1 0 100%; }
  .status { grid-area: status; text-align: left; padding: 10px 12px; border-radius: 16px; background: #00000030; box-shadow: inset 0 0 0 1px #ffffff14; min-height: 3.2em; display: flex; align-items: center; }
  .table { grid-area: table; }
  .log { grid-area: log; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; overflow: hidden; font-size: 13px; font-weight: 700; color: #ffffffb0; min-height: 0; }
  .foot { grid-area: foot; text-align: left; }
}
@media (min-aspect-ratio: 5/4) and (min-height: 600px) { .foot { display: block; } }
@media (min-aspect-ratio: 5/4) and (max-height: 480px) {
  .app { row-gap: 6px; column-gap: 12px; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  h1 { font-size: 21px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 11px; }
  .icon-btn .ic { width: 18px; height: 18px; }
  .status { font-size: 13px; padding: 6px 9px; min-height: 2.8em; }
  .table { gap: 6px; }
  .pbar { padding: 3px 8px; gap: 6px; border-radius: 12px; }
  .avatar { width: 24px; height: 24px; font-size: 12px; }
  .who b { font-size: 12px; }
  .who small { font-size: 10px; }
  .pile { height: 18px; }
  .pts { font-size: 18px; }
  .log { font-size: 12px; }
  .overlay { padding: 6px; }
  .panel { max-height: calc(100dvh - 12px); padding: 10px 14px; border-radius: 20px; }
  .panel h2 { font-size: 21px; }
  .text { display: none; }
  #setup .panel { width: min(100%, 700px); }
  #setup .fields { grid-template-columns: 1fr 1fr; }
  .actions { flex-wrap: nowrap; align-items: flex-end; }
  .actions .cta { flex: 2 1 0; }
  .field { margin-top: 6px; }
  .note { display: none; }
  .cta { margin-top: 8px; padding: 9px; font-size: 17px; }
  .ghost-btn { margin-top: 6px; padding: 7px; font-size: 15px; }
  #rules .panel { width: min(100%, 720px); }
  .rules { font-size: 12.5px; gap: 3px; margin-top: 6px; }
  #result .panel { width: min(100%, 560px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; align-items: center; }
  #result .panel > * { grid-column: 2; }
  #result .res-head { grid-column: 1; grid-row: 1 / span 4; }
  #result .text { display: block; font-size: 12px; }
  .emoji { font-size: 28px; }
  .final { margin-top: 0; }
  .final b { font-size: 22px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 380px) { .log { display: none; } .who small { display: none; } }
@media (max-height: 480px) and (max-aspect-ratio: 5/4) { .panel .text { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Ô Ăn <span>Quan</span></h1>

    const qi = c => (c === 0 ? 12 : 13);
    const has = (S, c) => S[c] > 0 || (isEnd(c) && S[qi(c)] > 0);
    const step = (c, d) => (c + d + N) % N;
    const rowSum = (S, p) => { let s = 0; for (const c of ROW[p]) s += S[c]; return s; };
    const pts = (S, p) => S[14 + p] + S[16 + p] * quan - S[18 + p] + S[18 + 1 - p];

    function init(first) {
      const S = new Int16Array(24);
      for (const r of ROW) for (const c of r) S[c] = 5;
      S[12] = S[13] = 1;
      S[T] = first;
      return S;
    }
    function moves(S) {
      const out = [];
      for (const c of ROW[S[T]]) if (S[c] > 0) out.push(c * 2, c * 2 + 1);
      return out;
    }
    function end(S, why, ev) {
      S[OVER] = why;
      for (const p of [0, 1]) {
        const n = rowSum(S, p);
        for (const c of ROW[p]) S[c] = 0;
        S[14 + p] += n;
        if (ev && n) ev.push({ t: 'sweep', p, n, cells: ROW[p] });
      }
    }
    function play(S0, m, ev) {
      const S = S0.slice(), p = S[T], d = (m & 1) ? 1 : -1;
      let pos = m >> 1, hand = S[pos], laps = 0;
      S[pos] = 0;
      if (ev) ev.push({ t: 'pick', c: pos, n: hand, p });
      for (;;) {
        while (hand > 0) { pos = step(pos, d); S[pos]++; hand--; if (ev) ev.push({ t: 'drop', c: pos, n: hand, p }); }
        const nx = step(pos, d);
        if (!isEnd(nx) && S[nx] > 0 && ++laps < 80) { hand = S[nx]; S[nx] = 0; pos = nx; if (ev) ev.push({ t: 'pick', c: nx, n: hand, p }); continue; }
        if (isEnd(nx) && has(S, nx)) { if (ev) ev.push({ t: 'stop', why: 'quan' }); break; }
        // nx is empty: capture what lies beyond, repeating across empty/full pairs.
        let e = nx, took = false;
        for (;;) {
          const tg = step(e, d);
          if (!has(S, tg)) { if (ev && !took) ev.push({ t: 'stop', why: 'empty' }); break; }
          if (young && isEnd(tg) && S[qi(tg)] && S[tg] < 5) { if (ev) ev.push({ t: 'stop', why: 'young' }); break; }
          const n = S[tg], q = isEnd(tg) ? S[qi(tg)] : 0;
          S[tg] = 0;
          if (q) S[qi(tg)] = 0;
          S[14 + p] += n; S[16 + p] += q; took = true;
          if (ev) ev.push({ t: 'cap', c: tg, n, q, p });
          const after = step(tg, d);
          if (has(S, after)) break;
          e = after;
        }
        break;
      }
      S[PLY]++;
      if (!has(S, 0) && !has(S, 6)) { end(S, 1, ev); return S; }
      if (S[PLY] >= 300) { end(S, 3, ev); return S; }
      const o = 1 - p;
      S[T] = o;
      if (rowSum(S, o) === 0) {
        const own = Math.min(5, S[14 + o]), borrow = 5 - own;
        if (borrow > S[14 + p]) { end(S, 2, ev); return S; }
        S[14 + o] -= own; S[14 + p] -= borrow; S[18 + o] += borrow;
        if (ev) ev.push({ t: 'pay', p: o, own, borrow });
        for (const c of ROW[o]) { S[c] = 1; if (ev) ev.push({ t: 'drop', c, n: -1, p: o }); }
      }
      return S;
    }
    function applyEv(V, e) {
      if (e.t === 'pick') V[e.c] = 0;
      else if (e.t === 'drop') V[e.c]++;
      else if (e.t === 'cap') { V[e.c] = 0; if (e.q) V[qi(e.c)] = 0; V[14 + e.p] += e.n; V[16 + e.p] += e.q; }
      else if (e.t === 'pay') { V[14 + e.p] -= e.own; V[15 - e.p] -= e.borrow; V[18 + e.p] += e.borrow; }
      else if (e.t === 'sweep') { for (const c of e.cells) V[c] = 0; V[14 + e.p] += e.n; }
    }
    function evaluate(S) {
      const p = S[T], o = 1 - p;
      return pts(S, p) - pts(S, o) + 0.3 * (rowSum(S, p) - rowSum(S, o));
    }
    function terminal(S) {
      const diff = pts(S, S[T]) - pts(S, 1 - S[T]);
      return diff + Math.sign(diff) * 1000;
    }
    // Board placement: end = 'L'/'R' for the big end cells, else column j in row r (0 top, 1 bottom).
    function place(c) {
      if (c === 0) return { end: 'L' };
      if (c === 6) return { end: 'R' };
      return c < 6 ? { j: c - 1, r: 1 } : { j: 11 - c, r: 0 };
    }
    const owner = c => (isEnd(c) ? -1 : c < 6 ? 0 : 1);
    const gain = e => (e.t === 'cap' ? e.n + e.q * quan : 0);
    return { kind: 'oaq', N, T, OVER, PLY, COLS: 5, ROW, END_W: 1.25, init, moves, play, applyEv, evaluate, terminal, pts, rowSum, place, owner, isEnd, qi, has, step, gain, quan };
  }

  // ---- Rules: Mancala (Kalah) ----------------------------------------------------------------
  // 0–5 = player 0 pits (bottom, left→right), 6 = player 0 store (right), 7–12 = player 1 pits
  // (top, right→left), 13 = player 1 store (left). Slots: 14 turn, 15 over, 16 plies.
  function makeKalah({ seeds }) {
    const N = 14, T = 14, OVER = 15, PLY = 16;
    const ROW = [[0, 1, 2, 3, 4, 5], [7, 8, 9, 10, 11, 12]], STORE = [6, 13];
    const rowSum = (S, p) => { let s = 0; for (const c of ROW[p]) s += S[c]; return s; };
    const pts = (S, p) => S[STORE[p]];
    function init(first) {
      const S = new Int16Array(18);
      for (const r of ROW) for (const c of r) S[c] = seeds;
      S[T] = first;
      return S;
    }
    function moves(S) { return ROW[S[T]].filter(c => S[c] > 0); }
    function play(S0, m, ev) {
      const S = S0.slice(), p = S[T];
      let hand = S[m], pos = m;
      S[m] = 0;
      if (ev) ev.push({ t: 'pick', c: m, n: hand, p });
      while (hand > 0) {
        pos = (pos + 1) % N;
        if (pos === STORE[1 - p]) continue;
        S[pos]++; hand--;
        if (ev) ev.push({ t: 'drop', c: pos, n: hand, p });
      }
      if (pos === STORE[p]) { if (ev) ev.push({ t: 'extra', p }); }
      else {
        const opp = 12 - pos;
        if (ROW[p].includes(pos) && S[pos] === 1 && S[opp] > 0) {
          const n = S[pos] + S[opp];
          S[pos] = 0; S[opp] = 0; S[STORE[p]] += n;
          if (ev) ev.push({ t: 'kcap', c: pos, o: opp, n, p, s: STORE[p] });
        }
        S[T] = 1 - p;
      }
      S[PLY]++;
      if (rowSum(S, 0) === 0 || rowSum(S, 1) === 0 || S[PLY] >= 400) {
        S[OVER] = S[PLY] >= 400 ? 3 : 1;
        for (const q of [0, 1]) {
          const n = rowSum(S, q);
          for (const c of ROW[q]) S[c] = 0;
          S[STORE[q]] += n;
          if (ev && n) ev.push({ t: 'sweep', p: q, n, cells: ROW[q], s: STORE[q] });
        }
      }
      return S;
    }
    function applyEv(V, e) {
      if (e.t === 'pick') V[e.c] = 0;
      else if (e.t === 'drop') V[e.c]++;
      else if (e.t === 'kcap') { V[e.c] = 0; V[e.o] = 0; V[e.s] += e.n; }
      else if (e.t === 'sweep') { for (const c of e.cells) V[c] = 0; V[e.s] += e.n; }
    }
    function evaluate(S) {
      const p = S[T], o = 1 - p;
      return pts(S, p) - pts(S, o) + 0.25 * (rowSum(S, p) - rowSum(S, o));
    }
    function terminal(S) {
      const diff = pts(S, S[T]) - pts(S, 1 - S[T]);
      return diff + Math.sign(diff) * 1000;
    }
    function place(c) {
      if (c === 13) return { end: 'L' };
      if (c === 6) return { end: 'R' };
      return c < 6 ? { j: c, r: 1 } : { j: 12 - c, r: 0 };
    }
    const owner = c => (c === 6 ? 0 : c === 13 ? 1 : c < 6 ? 0 : 1);
    const isEnd = c => c === 6 || c === 13;
    const gain = e => (e.t === 'kcap' ? e.n : 0);
    return { kind: 'kalah', N, T, OVER, PLY, COLS: 6, ROW, STORE, END_W: 1.05, init, moves, play, applyEv, evaluate, terminal, pts, rowSum, place, owner, isEnd, gain, seeds };
  }

  // ---- Computer player ------------------------------------------------------------------------
  const TIMEOUT = Symbol('timeout');
  let deadline = Infinity, nodes = 0;

  // Negamax over the side to move; a child where the same side moves again (Mancala extra turn)
  // keeps its sign.
  function negamax(E, S, depth, alpha, beta) {
    if ((++nodes & 255) === 0 && performance.now() > deadline) throw TIMEOUT;
    if (S[E.OVER]) return E.terminal(S);
    if (depth === 0) return E.evaluate(S);
    const T = E.T, me = S[T];
    const kids = E.moves(S).map(m => E.play(S, m));
    if (depth >= 2) {
      const key = k => (k[T] === me ? 1 : -1) * (k[E.OVER] ? E.terminal(k) : E.evaluate(k));
      kids.sort((a, b) => key(b) - key(a));
    }
    let best = -Infinity;
    for (const k of kids) {
      const v = k[T] === me ? negamax(E, k, depth - 1, alpha, beta) : -negamax(E, k, depth - 1, -beta, -alpha);
      if (v > best) best = v;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  function scoreRoot(E, S, depth, ranked) {
    const out = [];
    let best = -Infinity;
    for (const r of ranked) {
      const k = E.play(S, r.m);
      // A window just below the best keeps equal moves exact so ties can be broken at random.
      const v = k[E.T] === S[E.T] ? negamax(E, k, depth - 1, best - 0.01, Infinity) : -negamax(E, k, depth - 1, -Infinity, -(best - 0.01));
      out.push({ m: r.m, v });
      if (v > best) best = v;
    }
    return out.sort((a, b) => b.v - a.v);
  }

  const tick = () => new Promise(res => setTimeout(res, 0));

  // Iterative deepening, one root move per slice so the page never blocks for more than ~40 ms.
  async function deepSearch(E, S, maxDepth, budget, at) {
    const stop = performance.now() + budget;
    let ranked = E.moves(S).map(m => ({ m, v: 0 }));
    if (ranked.length < 2) return ranked;
    for (let depth = 1; depth <= maxDepth; depth++) {
      const scored = [];
      let best = -Infinity, aborted = false;
      for (const r of ranked) {
        await tick();
        if (at !== gen) return ranked;
        if (performance.now() > stop) { aborted = true; break; }
        deadline = Math.min(stop, performance.now() + 40);
        try {
          const k = E.play(S, r.m);
          const v = k[E.T] === S[E.T] ? negamax(E, k, depth - 1, best - 0.01, Infinity) : -negamax(E, k, depth - 1, -Infinity, -(best - 0.01));
          scored.push({ m: r.m, v });
          if (v > best) best = v;
        } catch (error) {
          if (error !== TIMEOUT) throw error;
          aborted = true;
          break;
        } finally { deadline = Infinity; }
      }
      if (aborted) break;
      ranked = scored.sort((a, b) => b.v - a.v);
      if (Math.abs(ranked[0].v) > 500) break;
    }
    return ranked;
  }

  const pickTop = ranked => { const top = ranked.filter(r => r.v >= ranked[0].v - 0.001); return top[Math.floor(Math.random() * top.length)].m; };

  async function chooseMove(E, S, level, at) {
    const ms = E.moves(S);
    if (level === 'easy') {
      if (Math.random() < 0.45) return ms[Math.floor(Math.random() * ms.length)];
      const me = S[E.T];
      return pickTop(ms.map(m => { const k = E.play(S, m); return { m, v: E.pts(k, me) - E.pts(S, me) + Math.random() * 0.5 }; }).sort((a, b) => b.v - a.v));
    }
    if (level === 'medium') {
      const ranked = scoreRoot(E, S, E.kind === 'oaq' ? 3 : 4, ms.map(m => ({ m })));
      const top = ranked.filter(r => r.v >= ranked[0].v - 0.001);
      const second = ranked[top.length];
      // Medium sometimes settles for a slightly worse move.
      if (second && Math.random() < 0.25 && second.v > ranked[0].v - 4 && Math.abs(ranked[0].v) < 500) return second.m;
      return pickTop(ranked);
    }
    return pickTop(await deepSearch(E, S, 18, 1100, at));
  }

  // ---- Game state -----------------------------------------------------------------------------
  let E = null, S = null, V = null, cfg = { ...settings };
  let gen = 0, busy = false, thinking = false, sel = -1, cursor = -1, lastFrom = -1, lastBy = 0;
  let history = [], logItems = [], altNext = 0, playing = false, cells = [], geo = null;

  const isCpu = p => cfg.opp === 'cpu' && p === 1;
  const nameOf = p => (cfg.opp === 'cpu' ? (p === 0 ? t.you : t.cpu) : (p === 0 ? t.p1 : t.p2));
  const levelName = lv => t[lv];
  const humanTurn = () => playing && S && !S[E.OVER] && !busy && !thinking && !isCpu(S[E.T]);
  // Screen order (left→right) of a player's squares.
  const screenRow = p => (p === 0 ? E.ROW[0] : E.ROW[1].slice().reverse());
  // Ring direction for a screen direction from a square: bottom row runs left→right, top row right→left.
  const ringDir = (c, s) => (E.owner(c) === 0 ? s : -s);
  const paused = () => document.hidden || !els.setup.hidden || !els.rules.hidden;

  function wait(ms) {
    return new Promise(res => {
      const go = () => { if (paused()) { setTimeout(go, 150); return; } setTimeout(res, ms); };
      go();
    });
  }
  function delayOf(kind) {
    if (testPace === 0) return 0;
    if (reducedMotion.matches && (kind === 'pick' || kind === 'drop')) return 0;
    return SPEEDS[settings.speed][kind] * testPace;
  }

  // ---- Board ------------------------------------------------------------------------------------
  const hash = n => { n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n = Math.imul(n ^ (n >>> 12), 0x297a2d39); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; };

  function buildBoard() {
    for (const c of cells) c.el.remove();
    cells = [];
    for (let c = 0; c < E.N; c++) {
      const pl = E.place(c);
      const el = document.createElement('button');
      el.type = 'button';
      el.tabIndex = -1;
      const kind = pl.end ? (E.kind === 'oaq' ? 'mand' : 'store') : 'sq';
      el.className = `cell ${kind} ${pl.end ? `end ${pl.end}` : pl.r ? 'bot' : 'top'}`;
      const stones = document.createElement('div');
      stones.className = 'stones';
      const cnt = document.createElement('span');
      cnt.className = 'cnt';
      el.append(stones, cnt);
      let quan = null;
      if (kind === 'mand') {
        quan = document.createElement('i');
        quan.className = 'quan';
        quan.style.left = pl.end === 'L' ? '58%' : '42%';
        el.append(quan);
      }
      el.addEventListener('click', () => onCell(c));
      el.addEventListener('focus', () => { if (E.owner(c) === (S ? S[E.T] : 0) && !E.isEnd(c)) cursor = c; });
      els.board.insertBefore(el, els.hand);
      cells.push({ el, stones, cnt, quan, kind, pl, pebs: [], shown: -1 });
    }
    layout();
  }

  function layout() {
    if (!E || !cells.length) return;
    const tb = els.table, cs = getComputedStyle(tb);
    const gap = parseFloat(cs.rowGap) || 0;
    const bars = $('bar-0').offsetHeight + $('bar-1').offsetHeight + gap * 2;
    const aw = tb.clientWidth - 2, ah = Math.max(60, tb.clientHeight - bars - 6);
    const cols = E.COLS, endF = E.END_W, padF = 0.14;
    const u = Math.max(20, Math.min(aw / (cols + 2 * endF + 2 * padF), ah / (2 * 1.12 + 2 * padF), 150));
    const rh = Math.min(u * 1.45, (ah - 2 * padF * u) / 2);
    const pad = padF * u, endW = endF * u, g = 0.05 * u;
    const bw = cols * u + 2 * endW + 2 * pad, bh = 2 * rh + 2 * pad;
    geo = { u, rh, pad, endW, bw, bh };
    els.board.style.width = `${bw}px`;
    els.board.style.height = `${bh}px`;
    els.board.style.setProperty('--u', `${u}px`);
    tb.style.setProperty('--bw', `${bw}px`);
    cells.forEach((cell, c) => {
      const r = rectOf(c);
      Object.assign(cell.el.style, { left: `${r.x + g}px`, top: `${r.y + g}px`, width: `${r.w - 2 * g}px`, height: `${r.h - 2 * g}px` });
    });
    placeDirpick();
  }

  function rectOf(c) {
    const { u, rh, pad, endW } = geo, pl = E.place(c);
    if (pl.end === 'L') return { x: pad, y: pad, w: endW, h: 2 * rh };
    if (pl.end === 'R') return { x: pad + endW + E.COLS * u, y: pad, w: endW, h: 2 * rh };
    return { x: pad + endW + pl.j * u, y: pad + pl.r * rh, w: u, h: rh };
  }

  // Pebbles sit on a golden-angle spiral (dense in the middle), fixed per cell so they never jump.
  function pebPos(c, k, kind) {
    const max = kind === 'sq' ? 22 : 34;
    const off = kind === 'mand' ? 5 : 0;
    const r = Math.min(1, Math.sqrt((k + 0.6 + off) / (max + off)));
    const a = k * 2.39996 + c * 1.9;
    const j = (hash(c * 131 + k * 7 + 3) - 0.5) * 7;
    let cx = 50, cy = 50, rx = 34, ry = 33;
    if (kind === 'mand') { cx = cells[c].pl.end === 'L' ? 58 : 42; rx = 34; ry = 38; }
    if (kind === 'store') { rx = 30; ry = 42; }
    return [cx + r * rx * Math.cos(a) + j, cy + r * ry * Math.sin(a) + j * 0.8];
  }

  function renderCell(c, fresh = false) {
    const cell = cells[c], n = V[c];
    const cap = cell.kind === 'sq' ? 22 : 34, want = Math.min(n, cap);
    while (cell.pebs.length < want) {
      const k = cell.pebs.length, p = document.createElement('i');
      const [x, y] = pebPos(c, k, cell.kind);
      p.className = `peb k${Math.floor(hash(c * 977 + k * 31) * 4)}${fresh && k === want - 1 ? ' new' : ''}`;
      p.style.left = `${x}%`;
      p.style.top = `${y}%`;
      p.style.setProperty('--r', `${Math.floor(hash(k * 53 + c) * 180)}deg`);
      cell.stones.append(p);
      cell.pebs.push(p);
    }
    while (cell.pebs.length > want) cell.pebs.pop().remove();
    cell.cnt.textContent = String(n);
    const q = cell.quan && V[E.qi(c)] > 0;
    if (cell.quan) cell.quan.hidden = !q;
    cell.el.classList.toggle('zero', n === 0 && !q);
    cell.el.setAttribute('aria-label', cellLabel(c, n, q));
  }

  function cellLabel(c, n, q) {
    const pl = E.place(c);
    if (E.kind === 'oaq') {
      if (pl.end) return `${t.mandarin}, ${t.stones(n)}${q ? `, ${t.withQuan}` : ''}`;
      const p = E.owner(c);
      return `${t.sq(p === 0 ? c : c - 6)} (${nameOf(p)}), ${t.stones(n)}`;
    }
    if (pl.end) return `${t.store(nameOf(E.owner(c)))}, ${t.seedsN(n)}`;
    const p = E.owner(c);
    return `${t.pit(p === 0 ? c + 1 : c - 6)} (${nameOf(p)}), ${t.seedsN(n)}`;
  }

  function renderBars() {
    for (const p of [0, 1]) {
      $(`nm-${p}`).textContent = nameOf(p);
      $(`av-${p}`).textContent = cfg.opp === 'cpu' ? (p === 0 ? '🙂' : '🤖') : String(p + 1);
      $(`pts-${p}`).textContent = String(E.pts(V, p));
      $(`bar-${p}`).classList.toggle('turn', playing && !V[E.OVER] && V[E.T] === p);
      const sub = $(`sub-${p}`), pile = $(`pile-${p}`);
      if (E.kind === 'oaq') {
        const debt = V[18 + p];
        sub.textContent = debt ? t.owes(debt) : `${t.pts}`;
        sub.classList.toggle('debt', debt > 0);
        const small = Math.max(0, V[14 + p]), qs = V[16 + p];
        const key = `${small}/${qs}`;
        if (pile.dataset.key !== key) {
          pile.dataset.key = key;
          const frag = [];
          for (let i = 0; i < qs; i++) { const q = document.createElement('i'); q.className = 'q'; frag.push(q); }
          for (let i = 0; i < Math.min(small, 48); i++) frag.push(document.createElement('i'));
          pile.replaceChildren(...frag);
        }
        pile.hidden = false;
      } else {
        pile.hidden = true;
        sub.textContent = t.storeWord;
        sub.classList.remove('debt');
        pile.replaceChildren();
        pile.dataset.key = '';
      }
    }
  }

  function renderHighlights() {
    const me = S ? S[E.T] : 0, can = humanTurn();
    cells.forEach((cell, c) => {
      const own = !E.isEnd(c) && E.owner(c) === me;
      cell.el.classList.toggle('can', can && sel < 0 && own && V[c] > 0);
      cell.el.classList.toggle('sel', c === sel);
      cell.el.classList.toggle('target', can && sel >= 0 && (c === E.step(sel, 1) || c === E.step(sel, -1)));
      cell.el.classList.toggle('last', c === lastFrom);
      cell.el.style.setProperty('--pc', `var(--p${me})`);
      cell.el.tabIndex = can && own && V[c] > 0 && c === cursor ? 0 : -1;
    });
    if (lastFrom >= 0) cells[lastFrom].el.style.setProperty('--lc', `var(--p${lastBy})`);
    if (can && (cursor < 0 || E.owner(cursor) !== me || !V[cursor])) {
      cursor = screenRow(me).find(c => V[c] > 0) ?? -1;
      if (cursor >= 0) cells[cursor].el.tabIndex = 0;
    }
  }

  function placeDirpick(cpuDir = 0) {
    const show = sel >= 0 && E && E.kind === 'oaq' && (humanTurn() || cpuDir);
    els.dirpick.hidden = !show;
    els.dirpick.classList.toggle('cpu', !!cpuDir);
    els.dirL.classList.toggle('on', cpuDir === -1);
    els.dirR.classList.toggle('on', cpuDir === 1);
    if (!show || !geo) return;
    const r = rectOf(sel), bottom = E.owner(sel) === 0;
    const half = 50;
    const x = Math.max(half, Math.min(geo.bw - half, r.x + r.w / 2));
    els.dirpick.style.left = `${x}px`;
    els.dirpick.style.top = bottom ? `${geo.bh - geo.pad * 0.5 + 4}px` : `${geo.pad * 0.5 - 4}px`;
    els.dirpick.classList.toggle('up', !bottom);
  }

  function clearPath() { for (const cell of cells) cell.el.classList.remove('path', 'path-end'); }
  function showPath(s) {
    clearPath();
    if (sel < 0 || !humanTurn()) return;
    const d = ringDir(sel, s);
    let pos = sel;
    for (let i = 0; i < V[sel]; i++) { pos = E.step(pos, d); cells[pos].el.classList.add('path'); }
    cells[pos].el.classList.add('path-end');
  }

  function moveHand(c, n, p) {
    if (n < 0) { els.hand.hidden = true; return; }
    const r = rectOf(c), pl = E.place(c);
    els.hand.hidden = false;
    els.hand.textContent = String(n);
    els.hand.style.setProperty('--pc', `var(--p${p})`);
    els.hand.style.setProperty('--hs', `${Math.max(40, delayOf('drop') * 0.7)}ms`);
    els.hand.style.left = `${r.x + r.w / 2}px`;
    els.hand.style.top = `${pl.end ? r.y + r.h * 0.18 : pl.r ? r.y + r.h - geo.pad * 0.2 : r.y + geo.pad * 0.2}px`;
  }

  function flash(c) {
    const el = cells[c].el;
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }

  function flyGain(c, p, text) {
    if (reducedMotion.matches || testPace === 0) return;
    const from = cells[c].el.getBoundingClientRect(), to = $(`pts-${p}`).getBoundingClientRect();
    const f = document.createElement('span');
    f.className = 'fly';
    f.textContent = text;
    document.body.append(f);
    const dur = Math.max(350, delayOf('cap') * 1.1);
    f.animate([
      { transform: `translate(${from.left + from.width / 2}px, ${from.top + from.height / 2}px) translate(-50%, -50%) scale(.6)`, opacity: 0 },
      { transform: `translate(${from.left + from.width / 2}px, ${from.top + from.height / 2 - 18}px) translate(-50%, -50%) scale(1.15)`, opacity: 1, offset: 0.3 },
      { transform: `translate(${to.left + to.width / 2}px, ${to.top + to.height / 2}px) translate(-50%, -50%) scale(.7)`, opacity: 0.2 },
    ], { duration: dur, easing: 'ease-in-out' }).onfinish = () => { f.remove(); bump(p); };
  }
  function bump(p) { const el = $(`pts-${p}`); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

  function renderAll() {
    if (!E) return;
    for (let c = 0; c < E.N; c++) renderCell(c);
    renderBars();
    renderHighlights();
    placeDirpick();
    renderStatus();
    renderUndo();
  }

  function renderUndo() { els.undo.disabled = !playing || busy || !history.length || !S || !!S[E.OVER]; }

  function setStatus(text, p = -1) {
    els.status.textContent = text;
    els.status.style.color = p === 0 ? 'var(--p0l)' : p === 1 ? 'var(--p1l)' : '';
  }
  function renderStatus() {
    if (!playing || !S) return;
    const p = S[E.T];
    if (S[E.OVER]) return;
    if (thinking || isCpu(p)) return setStatus(t.thinking, p);
    if (sel >= 0) return setStatus(t.pickDir, p);
    const k = E.kind === 'kalah';
    setStatus(cfg.opp === 'cpu' ? (k ? t.yourTurnK : t.yourTurn) : (k ? t.turnOfK : t.turnOf)(nameOf(p)), p);
  }
  const announce = text => { els.announcer.textContent = text; };

  function renderLog() {
    els.log.replaceChildren(...logItems.slice(-14).map(item => {
      const li = document.createElement('li');
      const dot = document.createElement('i');
      dot.style.background = `var(--p${item.p})`;
      const span = document.createElement('span');
      span.textContent = item.text;
      li.append(dot, span);
      if (item.gain) { const b = document.createElement('b'); b.textContent = `+${item.gain}`; li.append(b); }
      return li;
    }));
  }

  // ---- Turn flow ----------------------------------------------------------------------------------
  function newGame() {
    gen++;
    cfg = { ...settings };
    E = cfg.game === 'oaq' ? makeOaq({ quan: cfg.quan, young: !!cfg.young }) : makeKalah({ seeds: cfg.seeds });
    let first = cfg.first === 'p1' ? 1 : 0;
    if (cfg.first === 'alt') { first = altNext; altNext = 1 - altNext; }
    S = E.init(first);
    V = S.slice();
    history = []; logItems = []; sel = -1; cursor = -1; lastFrom = -1; busy = false; thinking = false; playing = true;
    els.board.classList.toggle('kalah', E.kind === 'kalah');
    buildBoard();
    renderLog();
    els.hint.textContent = E.kind === 'oaq' ? t.hintOaq : t.hintKalah;
    renderRecord();
    els.setup.hidden = true;
    els.result.hidden = true;
    els.hand.hidden = true;
    renderAll();
    announce(t.starts(nameOf(first)));
    nextTurn();
  }

  function nextTurn() {
    sel = -1;
    clearPath();
    renderAll();
    if (S[E.OVER]) return finishGame();
    if (isCpu(S[E.T])) cpuTurn();
  }

  async function cpuTurn() {
    const at = gen;
    thinking = true;
    renderAll();
    const t0 = performance.now();
    const m = await chooseMove(E, S, cfg.level, at);
    if (at !== gen) return;
    const rest = Math.max(0, delayOf('show') - (performance.now() - t0));
    if (rest) await wait(rest);
    if (at !== gen) return;
    thinking = false;
    if (E.kind === 'oaq') {
      // Show which square and direction the computer picked before it sows.
      const c = m >> 1, d = (m & 1) ? 1 : -1;
      sel = c;
      renderHighlights();
      placeDirpick(E.owner(c) === 0 ? d : -d);
      setStatus(t.sowing(nameOf(1)), 1);
      const ms = delayOf('show');
      if (ms) await wait(ms);
      if (at !== gen) return;
    }
    doMove(m);
  }

  function onCell(c) {
    if (!humanTurn()) return;
    const me = S[E.T], own = !E.isEnd(c) && E.owner(c) === me && V[c] > 0;
    if (E.kind === 'kalah') { if (own) humanMove(c); return; }
    if (sel >= 0 && c === sel) return select(-1);
    if (sel >= 0 && (c === E.step(sel, 1) || c === E.step(sel, -1))) return humanMove(sel * 2 + (c === E.step(sel, 1) ? 1 : 0));
    if (own) select(c);
  }

  function select(c) {
    sel = c;
    if (c >= 0) cursor = c;
    clearPath();
    renderHighlights();
    placeDirpick();
    renderStatus();
    if (c >= 0) announce(`${cellLabel(c, V[c], false)} · ${t.pickDir}`);
  }

  function sowScreen(s) {
    if (!humanTurn() || sel < 0) return;
    humanMove(sel * 2 + (ringDir(sel, s) > 0 ? 1 : 0));
  }

  function humanMove(m) {
    if (!humanTurn()) return;
    history.push({ S: S.slice(), log: logItems.length, lastFrom, lastBy });
    if (history.length > 200) history.shift();
    doMove(m);
  }

  async function doMove(m) {
    const at = gen, mover = S[E.T];
    const from = E.kind === 'oaq' ? m >> 1 : m;
    busy = true; sel = -1;
    clearPath();
    els.dirpick.hidden = true;
    lastFrom = from; lastBy = mover;
    renderHighlights();
    renderUndo();
    const ev = [];
    const next = E.play(S, m, ev);
    let gain = 0;
    setStatus(t.sowing(nameOf(mover)), mover);
    for (const e of ev) {
      if (at !== gen) return;
      E.applyEv(V, e);
      if (e.p === mover && e.t !== 'pick') gain += E.kind === 'kalah' ? (e.c === E.STORE[mover] && e.t === 'drop' ? 1 : E.gain(e)) : E.gain(e);
      const kind = showEvent(e, mover);
      const ms = delayOf(kind);
      if (ms) await wait(ms);
    }
    if (at !== gen) return;
    if (!(delayOf('drop'))) await tick();
    if (at !== gen) return;
    S = next;
    V = S.slice();
    busy = false;
    els.hand.hidden = true;
    const d = E.kind === 'oaq' ? ((m & 1) ? 1 : -1) * (E.owner(from) === 0 ? 1 : -1) : 0;
    const num = E.kind === 'oaq' ? (mover === 0 ? from : from - 6) : (mover === 0 ? from + 1 : from - 6);
    logItems.push({ p: mover, gain, text: `${nameOf(mover)} · ${E.kind === 'oaq' ? t.sq(num) : t.pit(num)}${d ? (d > 0 ? ' →' : ' ←') : ''}` });
    renderLog();
    nextTurn();
  }

  // Applies one event to the screen and returns which delay to wait afterwards.
  function showEvent(e, mover) {
    switch (e.t) {
      case 'pick':
        renderCell(e.c);
        moveHand(e.c, e.n, e.p);
        return 'pick';
      case 'drop':
        renderCell(e.c, true);
        if (e.n >= 0) moveHand(e.c, e.n, e.p); else els.hand.hidden = true;
        return 'drop';
      case 'cap': {
        els.hand.hidden = true;
        renderCell(e.c);
        flash(e.c);
        renderBars();
        const g = e.n + e.q * E.quan;
        if (g) flyGain(e.c, e.p, `+${g}`);
        const msg = e.q ? t.tookQuan(nameOf(e.p)) : t.captured(nameOf(e.p), e.n);
        setStatus(msg, e.p);
        announce(msg);
        return 'cap';
      }
      case 'kcap':
        els.hand.hidden = true;
        renderCell(e.c); renderCell(e.o); renderCell(e.s, true);
        flash(e.o); flash(e.s);
        renderBars();
        flyGain(e.o, e.p, `+${e.n}`);
        setStatus(t.captured(nameOf(e.p), e.n), e.p);
        announce(t.captured(nameOf(e.p), e.n));
        return 'cap';
      case 'stop':
        els.hand.hidden = true;
        setStatus(e.why === 'quan' ? t.stopQuan : e.why === 'young' ? t.stopYoung : t.stopEmpty, mover);
        return 'note';
      case 'extra':
        els.hand.hidden = true;
        setStatus(t.extra(nameOf(e.p)), e.p);
        announce(t.extra(nameOf(e.p)));
        return 'note';
      case 'pay': {
        els.hand.hidden = true;
        renderBars();
        const msg = t.pay(nameOf(e.p)) + (e.borrow ? ` · ${t.borrow(nameOf(e.p), e.borrow)}` : '');
        setStatus(msg, e.p);
        announce(msg);
        return 'note';
      }
      case 'sweep':
        els.hand.hidden = true;
        for (const c of e.cells) { renderCell(c); if (V[c] === 0) flash(c); }
        if (e.s !== undefined) renderCell(e.s, true);
        renderBars();
        bump(e.p);
        return 'cap';
    }
    return 'drop';
  }

  function finishGame() {
    playing = true;
    const a = E.pts(S, 0), b = E.pts(S, 1);
    const winner = a > b ? 0 : b > a ? 1 : -1;
    let title, emoji;
    if (winner < 0) { title = t.draw; emoji = '🤝'; }
    else if (cfg.opp === 'cpu') { title = winner === 0 ? t.youWin : t.cpuWins; emoji = winner === 0 ? '🏆' : '🤖'; }
    else { title = t.wins(nameOf(winner)); emoji = '🏆'; }
    const why = S[E.OVER];
    const text = why === 2 ? t.endStuck : why === 3 ? t.endLong : E.kind === 'oaq' ? t.endQuan : t.endSide;
    if (cfg.opp === 'cpu') {
      const key = `${cfg.game}-${cfg.level}`;
      const r = stats[key] || { w: 0, l: 0, d: 0 };
      if (winner === 0) r.w++; else if (winner === 1) r.l++; else r.d++;
      stats[key] = r;
      write(STORE.stats, stats);
    }
    setStatus(title);
    announce(`${title} ${nameOf(0)} ${a} – ${b} ${nameOf(1)}`);
    $('result-emoji').textContent = emoji;
    $('result-title').textContent = title;
    $('result-text').textContent = text;
    const box = (p, v) => `<div class="${winner === p ? 'win' : ''}"><small></small><b>${v}</b></div>`;
    const fin = $('final');
    fin.innerHTML = `${box(0, a)}<i>–</i>${box(1, b)}`;
    fin.querySelectorAll('small')[0].textContent = nameOf(0);
    fin.querySelectorAll('small')[1].textContent = nameOf(1);
    renderRecord();
    $('result-record').textContent = els.recordLine.textContent;
    renderAll();
    const at = gen;
    setTimeout(() => {
      if (at !== gen) return;
      els.result.hidden = false;
      $('again').focus({ preventScroll: true });
    }, testPace === 0 ? 0 : reducedMotion.matches ? 500 : 1200);
  }

  function renderRecord() {
    if (cfg.opp !== 'cpu') { els.recordLine.textContent = ''; return; }
    const r = stats[`${cfg.game}-${cfg.level}`] || { w: 0, l: 0, d: 0 };
    els.recordLine.textContent = t.record(levelName(cfg.level), r.w, r.l, r.d);
  }

  function undo() {
    if (!playing || busy || !history.length || S[E.OVER]) return;
    gen++;
    thinking = false;
    const h = history.pop();
    S = h.S; V = S.slice();
    logItems.length = h.log;
    lastFrom = h.lastFrom; lastBy = h.lastBy;
    els.hand.hidden = true;
    renderLog();
    nextTurn();
  }

  // ---- Setup / panels -----------------------------------------------------------------------------
  function renderSetup() {
    for (const group of document.querySelectorAll('#setup .seg')) {
      for (const btn of group.children) btn.setAttribute('aria-pressed', String(String(settings[group.dataset.key]) === btn.dataset.value));
    }
    $('f-level').hidden = settings.opp !== 'cpu';
    $('f-oaq').hidden = settings.game !== 'oaq';
    $('f-seeds').hidden = settings.game !== 'kalah';
    $('first-p0').textContent = settings.opp === 'cpu' ? t.you : t.p1;
    $('first-p1').textContent = settings.opp === 'cpu' ? t.cpu : t.p2;
    renderSpeed();
  }
  function renderSpeed() {
    els.speedIc.dataset.s = String(settings.speed);
    els.speed.setAttribute('aria-label', t.speedBtn([t.slow, t.normal, t.fast][settings.speed]));
  }
  function openSetup() {
    renderSetup();
    els.result.hidden = true;
    els.resume.hidden = !(playing && S && !S[E.OVER]);
    els.setup.hidden = false;
    els.start.focus({ preventScroll: true });
  }
  function openRules() {
    const k = (els.setup.hidden ? cfg.game : settings.game) === 'kalah';
    $('rules-title').textContent = `${t.rules} · ${k ? t.kalah : t.oaq}`;
    $('rules-list').replaceChildren(...(k ? t.rulesKalah : t.rulesOaq).map(s => { const li = document.createElement('li'); li.textContent = s; return li; }));
    els.rules.hidden = false;
    $('rules-done').focus({ preventScroll: true });
  }

  for (const group of document.querySelectorAll('#setup .seg')) {
    group.addEventListener('click', event => {
      const btn = event.target.closest('button');
      if (!btn) return;
      const key = group.dataset.key, raw = btn.dataset.value;
      settings[key] = typeof CHOICES[key][0] === 'number' ? Number(raw) : raw;
      renderSetup();
      write(STORE.settings, settings);
    });
  }
  els.start.addEventListener('click', () => { write(STORE.settings, settings); newGame(); });
  els.resume.addEventListener('click', () => { els.setup.hidden = true; });
  $('open-rules').addEventListener('click', openRules);
  $('rules-done').addEventListener('click', () => { els.rules.hidden = true; });
  $('help').addEventListener('click', openRules);
  $('menu').addEventListener('click', openSetup);
  $('again').addEventListener('click', newGame);
  $('change').addEventListener('click', openSetup);
  els.undo.addEventListener('click', undo);
  els.speed.addEventListener('click', () => { settings.speed = (settings.speed + 1) % 3; renderSetup(); write(STORE.settings, settings); });
  for (const b of [els.dirL, els.dirR]) {
    const s = Number(b.dataset.s);
    b.addEventListener('click', () => sowScreen(s));
    b.addEventListener('pointerenter', () => showPath(s));
    b.addEventListener('focus', () => showPath(s));
    b.addEventListener('pointerleave', clearPath);
    b.addEventListener('blur', clearPath);
  }

  const overlayOpen = () => !els.setup.hidden || !els.rules.hidden || !els.result.hidden;
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || overlayOpen() || !humanTurn()) return;
    const k = event.key, me = S[E.T], row = screenRow(me);
    const onButton = document.activeElement instanceof HTMLButtonElement && document.activeElement !== document.body;
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      event.preventDefault();
      const s = k === 'ArrowLeft' ? -1 : 1;
      if (sel >= 0) return sowScreen(s);
      const playable = row.filter(c => V[c] > 0);
      let i = playable.indexOf(cursor);
      i = i < 0 ? 0 : Math.max(0, Math.min(playable.length - 1, i + s));
      cursor = playable[i];
      renderHighlights();
      cells[cursor].el.focus({ preventScroll: true });
    } else if (/^[1-6]$/.test(k) && Number(k) <= row.length) {
      event.preventDefault();
      const c = row[Number(k) - 1];
      if (V[c] > 0) { cursor = c; E.kind === 'kalah' ? humanMove(c) : select(c); }
    } else if ((k === 'Enter' || k === ' ') && !onButton) {
      event.preventDefault();
      if (cursor >= 0) onCell(sel >= 0 ? sel : cursor);
    } else if ((k === 'Backspace' || k === 'ArrowUp' || k === 'ArrowDown') && sel >= 0) {
      event.preventDefault();
      select(-1);
    }
  });

  new ResizeObserver(() => layout()).observe(els.table);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) layout(); });

  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__oAnQuan = {
    state: () => S && { kind: E.kind, cells: Array.from(S.slice(0, E.N)), raw: Array.from(S), turn: S[E.T], over: S[E.OVER], pts: [E.pts(S, 0), E.pts(S, 1)], busy, thinking, sel, playing, human: humanTurn(), overlay: !els.setup.hidden ? 'setup' : !els.rules.hidden ? 'rules' : !els.result.hidden ? 'result' : '' },
    cellCenter: c => { const r = cells[c].el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; },
    pace: v => { testPace = v; },
    engine: (kind, opts) => (kind === 'oaq' ? makeOaq(opts) : makeKalah(opts)),
    rank: (kind, opts, raw, depth) => { const e = kind === 'oaq' ? makeOaq(opts) : makeKalah(opts); return scoreRoot(e, Int16Array.from(raw), depth, e.moves(Int16Array.from(raw)).map(m => ({ m }))); },
  };

  // Idle board behind the start panel.
  E = settings.game === 'oaq' ? makeOaq({ quan: settings.quan, young: !!settings.young }) : makeKalah({ seeds: settings.seeds });
  S = E.init(0);
  V = S.slice();
  buildBoard();
  renderAll();
  setStatus('');
  els.hint.textContent = E.kind === 'oaq' ? t.hintOaq : t.hintKalah;
  renderRecord();
  renderSetup();
  els.start.focus({ preventScroll: true });
})();
</script>
</body>
</html>
