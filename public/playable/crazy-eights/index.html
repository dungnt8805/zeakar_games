<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crazy Eights</title>
<style>
:root {
  --bg: #071523;
  --felt: #0f5f6b;
  --felt-dark: #06303a;
  --felt-light: #1f8f96;
  --rail: #3a2a14;
  --rail-light: #f2c46b;
  --text: #f3fbff;
  --muted: #a9d3db;
  --gold: #ffc85a;
  --gold-dark: #c98a17;
  --coral: #ff7a5c;
  --lime: #9be36d;
  --red: #d8263e;
  --ink: #1b2430;
  --plate: linear-gradient(#123a4d, #0a2232);
  --back: radial-gradient(circle at 50% 50%, #ffd47a 0 12%, transparent 13%), repeating-linear-gradient(60deg, #ffffff24 0 2px, transparent 2px 7px), repeating-linear-gradient(-60deg, #ffffff24 0 2px, transparent 2px 7px), linear-gradient(160deg, #ff8a5c, #b0353f);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: radial-gradient(120% 80% at 50% 0%, #11344d, var(--bg) 70%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, .card:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.top { grid-area: top; display: flex; align-items: center; gap: 8px; }
.top h1 { flex: 1; font-size: clamp(18px, 5.4vw, 26px); letter-spacing: .5px; white-space: nowrap; color: var(--gold); text-shadow: 0 2px 0 #0007; }
.top h1 span { color: var(--coral); }
.chip { white-space: nowrap; border: 0; border-radius: 12px; padding: 7px 11px; background: #ffffff1a; font-size: 13px; font-weight: 700; min-height: 34px; }
.chip:hover { background: #ffffff2c; }
.felt { grid-area: felt; flex: 1; min-height: 0; position: relative; container-type: size; display: flex; flex-direction: column; padding: 6px; border-radius: 24px; border: 6px solid var(--rail); background: radial-gradient(#ffffff0a 1px, transparent 1.5px) 0 0 / 7px 7px, radial-gradient(100% 75% at 50% 45%, var(--felt-light), var(--felt) 50%, var(--felt-dark)); box-shadow: inset 0 0 0 2px #00000030, inset 0 0 50px #0008, 0 0 0 2px var(--rail-light), 0 12px 28px #0009; }
.felt { --cw: clamp(36px, min(15cqw, 16cqh), 104px); --ch: calc(var(--cw) * 1.4); }
.opps { display: flex; justify-content: space-around; gap: 4px; }
.seat { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 8px; border-radius: 14px; min-width: 0; flex: 1; max-width: 200px; transition: background .2s; }
.seat.turn { background: #ffc85a2e; box-shadow: 0 0 0 2px var(--gold); }
.seat .nm { font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.seat .sc { font-size: 11px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.fan { position: relative; height: calc(var(--cw) * .78); width: 100%; display: flex; justify-content: center; }
.mini { width: calc(var(--cw) * .55); height: calc(var(--cw) * .78); border-radius: 5px; background: var(--back); border: 2px solid #fff; box-shadow: 0 2px 4px #0006; margin-left: calc(var(--cw) * -.4); }
.mini:first-child { margin-left: 0; }
.cnt { position: absolute; right: 50%; top: 50%; transform: translate(calc(var(--cw) * .7), -50%); background: var(--ink); color: var(--gold); border-radius: 10px; font-size: 12px; font-weight: 800; padding: 1px 7px; border: 2px solid var(--gold); }
.center { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: calc(var(--cw) * .35); position: relative; }
.stock { position: relative; width: var(--cw); height: var(--ch); border: 0; padding: 0; background: none; border-radius: 9px; }
.stock .mini, .stock .bk { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border-radius: 9px; background: var(--back); border: 3px solid #fff; box-shadow: 0 3px 6px #0007; }
.stock .bk:nth-child(2) { transform: translate(-3px, -3px); }
.stock .bk:nth-child(3) { transform: translate(-6px, -6px); }
.stock.can { animation: pulse 1.2s ease-in-out infinite; }
.stock.empty .bk { background: #0003; border: 2px dashed #fff6; box-shadow: none; }
.stock .n { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); }
@keyframes pulse { 50% { filter: drop-shadow(0 0 10px var(--gold)); } }
.pile { position: relative; width: var(--cw); height: var(--ch); }
.pile .card { position: absolute; inset: 0; }
.pile .card.fresh { animation: drop .28s ease-out; }
@keyframes drop { from { transform: translateY(-30px) scale(1.15) rotate(-8deg); opacity: .4; } }
.info { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: calc(var(--cw) * .9); }
.suitNow { width: calc(var(--cw) * .8); height: calc(var(--cw) * .8); border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: calc(var(--cw) * .5); line-height: 1; box-shadow: 0 0 0 3px var(--gold), 0 3px 8px #0008; }
.suitNow.wild { animation: pop .4s ease-out; }
@keyframes pop { from { transform: scale(1.6); } }
.dirIc { font-size: calc(var(--cw) * .32); color: var(--gold); font-weight: 900; }
.pend { font-size: 12px; font-weight: 900; color: #fff; background: var(--red); border-radius: 10px; padding: 1px 8px; }
.msg { min-height: 22px; text-align: center; font-size: 14px; font-weight: 700; color: var(--text); padding: 2px 4px; }
.mine { display: flex; flex-direction: column; gap: 3px; }
.mineHead { display: flex; justify-content: space-between; align-items: center; padding: 0 6px; font-size: 13px; font-weight: 800; }
.mineHead .sc { color: var(--muted); font-size: 12px; }
.mineHead.turn .nm { color: var(--gold); }
.hand { position: relative; height: calc(var(--ch) + 12px); }
.card { position: absolute; top: 10px; width: var(--cw); height: var(--ch); border-radius: 9px; background: linear-gradient(#fff, #f1eee6); color: var(--ink); border: 1px solid #0003; box-shadow: 0 3px 6px #0006; padding: 0; transition: transform .15s, top .15s, filter .15s; display: block; }
.card.red { color: var(--red); }
.card .r { position: absolute; left: 6%; top: 3%; font-weight: 900; font-size: calc(var(--cw) * .3); line-height: 1; text-align: center; }
.card .r small { display: block; font-size: calc(var(--cw) * .26); }
.card .big { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cw) * .56); padding-top: 18%; padding-left: 12%; }
.card.eight { background: linear-gradient(135deg, #fff 0 60%, #ffe7a6); }
.card.eight .big::after { content: '★'; position: absolute; right: 7%; bottom: 4%; font-size: calc(var(--cw) * .22); color: var(--gold-dark); }
.hand .card.ok { top: 0; cursor: pointer; box-shadow: 0 0 0 2px var(--gold), 0 5px 10px #0007; }
.hand .card.ok:hover { top: -4px; }
.hand.mute .card, .hand .card.no { filter: brightness(.72) saturate(.7); }
.hand .card.hint { animation: hintb .8s ease-in-out 3; }
@keyframes hintb { 50% { top: -10px; box-shadow: 0 0 0 4px var(--lime), 0 0 18px var(--lime); } }
.side { grid-area: side; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.board, .log { display: none; }
.controls { display: flex; gap: 6px; }
.btn { flex: 1; border: 0; border-radius: 14px; padding: 10px 8px; min-height: 44px; font-weight: 800; font-size: 15px; background: #ffffff1c; box-shadow: inset 0 -3px 0 #0004; }
.btn.pri { background: linear-gradient(var(--gold), var(--gold-dark)); color: #2a1a00; }
.btn:disabled { opacity: .38; cursor: default; }
.panelWrap { position: fixed; inset: 0; display: grid; place-items: center; background: #020b13b8; z-index: 10; padding: 8px; }
.panelWrap[hidden] { display: none; }
.panel { width: min(420px, 100%); max-height: calc(100% - 16px); overflow-y: auto; background: var(--plate); border: 2px solid #ffc85a66; border-radius: 22px; padding: 18px 18px 16px; box-shadow: 0 20px 50px #000a; text-align: center; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { font-size: 24px; color: var(--gold); }
.panel h2 span { color: var(--coral); }
.panel p { color: var(--muted); font-size: 14px; line-height: 1.4; }
.opt { display: flex; flex-direction: column; gap: 4px; text-align: left; }
.opt > b { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { flex: 1 1 0; min-width: 0; border: 0; border-radius: 10px; padding: 8px 4px; min-height: 36px; font-size: 13px; font-weight: 700; background: #ffffff14; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #2a1a00; }
.stats { font-size: 12px; color: var(--muted); }
.suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.suits button { border: 0; border-radius: 14px; background: #fff; font-size: 34px; padding: 10px 0; min-height: 60px; line-height: 1; color: var(--ink); }
.suits button.red { color: var(--red); }
.suits button small { display: block; font-size: 11px; font-weight: 800; margin-top: 4px; color: #556; }
.suits button:hover { box-shadow: 0 0 0 3px var(--gold); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl td { padding: 5px 6px; border-bottom: 1px solid #ffffff1a; text-align: left; }
.tbl td:last-child { text-align: right; font-weight: 800; }
.tbl tr.me td { color: var(--gold); }
.rules { text-align: left; font-size: 13px; color: var(--muted); padding-left: 18px; line-height: 1.45; }
@media (min-aspect-ratio: 5/4) {
  .app { max-width: 1680px; display: grid; grid-template-columns: minmax(0, 1fr) clamp(210px, 25vw, 320px); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "felt top" "felt side"; column-gap: 12px; row-gap: 8px; }
  .top h1 { font-size: clamp(18px, 2.2vw, 30px); }
  .board { display: block; background: #0006; border-radius: 16px; padding: 8px 10px; }
  .board h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
  .log { display: flex; flex-direction: column; gap: 3px; flex: 1; min-height: 0; overflow: hidden; background: #0004; border-radius: 16px; padding: 8px 10px; font-size: 13px; color: var(--muted); }
  .log div:first-child { color: var(--text); font-weight: 700; }
  .controls { flex-wrap: wrap; }
  .controls .btn { flex: 1 1 40%; }
  .seat .sc, .mineHead .sc { display: none; }
}
@media (max-height: 480px) {
  .app { gap: 4px; padding-top: max(4px, env(safe-area-inset-top)); padding-bottom: max(4px, env(safe-area-inset-bottom)); }
  .felt { border-width: 4px; padding: 3px; border-radius: 16px; }
  .msg { font-size: 12px; min-height: 16px; }
  .btn { min-height: 34px; padding: 6px; font-size: 13px; }
  .seat { padding: 1px 6px; }
  .seat .nm, .mineHead { font-size: 11px; }
  .board { padding: 5px 8px; }
  .tbl td { padding: 2px 4px; font-size: 12px; }
  .panel { padding: 10px 12px; gap: 6px; }
  .panel h2 { font-size: 19px; }
  .seg button { min-height: 32px; padding: 5px 4px; }
  .chip { min-height: 32px; padding: 5px 9px; }
}
@media (min-aspect-ratio: 5/4) {
  .top { flex-wrap: wrap; row-gap: 4px; }
  .top h1 { flex-basis: 100%; }
  .top .chip { flex: 1; }
}
@media (max-height: 380px) and (min-aspect-ratio: 5/4) {
  .log { display: none; }
  .top h1 { font-size: 16px; }
}
@media (max-width: 360px) {
  .chip { padding: 6px 8px; font-size: 12px; }
  .btn { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Crazy <span>Eights</span></h1>
    <button class="chip" id="rulesBtn" data-i18n="rules"></button>
    <button class="chip" id="menuBtn" data-i18n="menu"></button>
  </header>
  <main class="felt" id="felt">
    <div class="opps" id="opps"></div>
    <div class="center">
      <button class="stock" id="stock"><span class="bk"></span><span class="bk"></span><span class="bk"></span><span class="n" id="stockN"></span></button>
      <div class="pile" id="pile" role="img"></div>
      <div class="info"><div class="suitNow" id="suitNow" role="img"></div><div class="dirIc" id="dirIc" aria-hidden="true"></div><div class="pend" id="pend" hidden></div></div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="mine">
      <div class="mineHead" id="mineHead"><span class="nm" data-i18n="you"></span><span class="sc" id="myScore"></span></div>
      <div class="hand" id="hand" role="group"></div>
    </div>
  </main>
  <aside class="side">
    <div class="board"><h3 id="roundLbl"></h3><table class="tbl" id="boardTbl"></table></div>
    <div class="log" id="log" aria-hidden="true"></div>
    <div class="controls">
      <button class="btn pri" id="drawBtn" data-i18n="draw"></button>
      <button class="btn" id="passBtn" data-i18n="pass"></button>
      <button class="btn" id="hintBtn" data-i18n="hint"></button>
    </div>
  </aside>
</div>

<div class="panelWrap" id="lobbyPanel" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="lobbyT">
    <h2 id="lobbyT">Crazy <span>Eights</span></h2>
    <p data-i18n="tagline"></p>
    <div class="opt"><b data-i18n="opponents"></b><div class="seg" id="optOpp"></div></div>
    <div class="opt"><b data-i18n="level"></b><div class="seg" id="optLevel"></div></div>
    <div class="opt"><b data-i18n="target"></b><div class="seg" id="optTarget"></div></div>
    <div class="opt"><b data-i18n="drawRule"></b><div class="seg" id="optDraw"></div></div>
    <div class="opt"><b data-i18n="specials"></b><div class="seg" id="optSpec"></div></div>
    <button class="btn pri" id="startBtn" data-i18n="start"></button>
    <div class="stats" id="statsLine"></div>
  </div>
</div>
<div class="panelWrap" id="suitPanel" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="suitT">
    <h2 id="suitT" data-i18n="chooseSuit"></h2>
    <div class="suits" id="suitBtns"></div>
  </div>
</div>
<div class="panelWrap" id="roundPanel" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="roundT">
    <h2 id="roundT"></h2>
    <p id="roundP"></p>
    <table class="tbl" id="roundTbl"></table>
    <button class="btn pri" id="nextBtn"></button>
    <button class="btn" id="toLobbyBtn" data-i18n="menu"></button>
  </div>
</div>
<div class="panelWrap" id="rulesPanel" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="rulesT">
    <h2 id="rulesT" data-i18n="rules"></h2>
    <ul class="rules" id="rulesList"></ul>
    <button class="btn pri" id="rulesClose" data-i18n="ok"></button>
  </div>
</div>
<div class="sr" aria-live="polite" id="announcer"></div>

<script>

    st.voids[p].delete(suitOf(c));
    const ev = [{ t: r === 8 ? 'eight' : 'play', p, c, s: st.suit }];
    if (!h.length) { st.over = true; st.winner = p; return ev; }
    let step = 1;
    if (r === 2 && st.rules.two) { st.pending += 2; }
    else if (r === 12 && st.rules.queen) { step = 2; ev.push({ t: 'skip', p: nextSeat(st, p) }); }
    else if (r === 1 && st.rules.ace) {
      if (st.n === 2) { step = 2; ev.push({ t: 'skip', p: nextSeat(st, p) }); }
      else { st.dir = -st.dir; ev.push({ t: 'rev' }); }
    }
    st.turn = nextSeat(st, p, step);
    if (h.length === 1) ev.push({ t: 'last', p });
    return ev;
  }
  function passTurn(st, p) {
    st.passes++;
    st.drew = false;
    st.turn = nextSeat(st, p);
    if (st.passes >= st.n * 2 && !st.stock.length) blockRound(st);
  }
  function blockRound(st) {
    st.over = true;
    let best = 0;
    for (let p = 1; p < st.n; p++) if (handValue(st.hands[p]) < handValue(st.hands[best])) best = p;
    st.winner = best;
    st.blocked = true;
  }
  function roundPoints(st) {
    let s = 0;
    for (let p = 0; p < st.n; p++) if (p !== st.winner) s += handValue(st.hands[p]);
    return s;
  }

  // ---------- AI (sees only its own hand, the discard pile, hand sizes and public voids) ----------
  function bestSuitFor(h, exclude) {
    const cnt = [0, 0, 0, 0];
    for (const c of h) if (c !== exclude && rankOf(c) !== 8) cnt[suitOf(c)] += 1 + value(c) / 40;
    return cnt;
  }
  const W = { eight: 40, dump: 0, dumpLow: .15, hurtLow: 16, hurt2: 7, hurt: 4, rev: 2, unseen: .05, keep8: 0, void: 9 };
  function aiChoose(st, p, level) {
    const h = st.hands[p];
    const legal = legalOf(st, p);
    if (!legal.length) return null;
    const cnt0 = bestSuitFor(h);
    const maxSuit = cnt => cnt.indexOf(Math.max(...cnt));
    if (level === 0) {
      const c = legal[Math.floor(Math.random() * legal.length)];
      return { c, s: Math.random() < .5 ? maxSuit(cnt0) : Math.floor(Math.random() * 4) };
    }
    const np = nextSeat(st, p);
    const npLow = st.hands[np].length <= 2;
    const opponentsLow = st.hands.some((x, i) => i !== p && x.length <= 2);
    const seen = [0, 0, 0, 0];
    for (const c of st.discard) seen[suitOf(c)]++;
    let best = null, bestScore = -Infinity;
    for (const c of legal) {
      const r = rankOf(c);
      const suits = r === 8 ? [0, 1, 2, 3] : [suitOf(c)];
      for (const s of suits) {
        const rest = h.filter(x => x !== c);
        const cnt = bestSuitFor(rest);
        let score = cnt[s] * 3 + rest.filter(x => rankOf(x) === r && x !== c).length;
        if (!rest.length) score += 1000;
        else if (r === 8) score -= level === 2 ? W.eight : 10;
        if (level === 2) {
          score += value(c) * (opponentsLow ? W.dumpLow : W.dump);
          const hurts = (r === 2 && st.rules.two) || (r === 12 && st.rules.queen) || (r === 1 && st.rules.ace && st.n === 2);
          if (hurts) score += npLow ? W.hurtLow : st.n === 2 ? W.hurt2 : W.hurt;
          if (npLow && st.voids[np].has(s)) score += W.void;
          if (r === 1 && st.rules.ace && st.n > 2 && st.hands[nextSeat(st, p, -1)].length < st.hands[np].length) score -= W.rev;
          score -= (13 - seen[s] - rest.filter(x => suitOf(x) === s).length) * W.unseen;
          if (rest.length === 1 && rankOf(rest[0]) === 8) score += W.keep8;
        } else if (level === 1) {
          if (r === 2 || r === 12) score += 1;
        }
        if (score > bestScore) { bestScore = score; best = { c, s }; }
      }
    }
    return best;
  }
  // Easy bots sometimes keep a drawn card; normal/hard play it when it is their best move.
  const aiPlaysAfterDraw = level => level > 0 || Math.random() < .7;

  // ---------- UI ----------
  const els = { opps: $('opps'), hand: $('hand'), pile: $('pile'), stock: $('stock'), msg: $('msg'), log: $('log') };
  let S = null, match = null, busy = false, delayScale = 1, humanAuto = null, rigDeck = null, lastPlayed = -1, timer = 0;
  const names = () => [T.you, ...NAMES];
  const nm = p => names()[p];
  const announce = txt => { $('announcer').textContent = ''; setTimeout(() => { $('announcer').textContent = txt; }, 30); };
  const logLines = [];
  function log(txt, speak) {
    logLines.unshift(txt);
    logLines.length = Math.min(logLines.length, 14);
    els.log.innerHTML = logLines.map(l => `<div>${l}</div>`).join('');
    els.msg.textContent = txt;
    if (speak) announce(txt);
  }

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[el.dataset.i18n]; });
    els.hand.setAttribute('aria-label', T.hand);
    $('rulesList').innerHTML = T.rulesList.map(r => `<li>${r}</li>`).join('');
    $('suitBtns').innerHTML = SUITS.map((s, i) => `<button class="${i === 1 || i === 2 ? 'red' : ''}" data-s="${i}" aria-label="${T.suitNames[i]}">${s}<small>${T.suitNames[i]}</small></button>`).join('');
  }
  function segment(id, items, get, set) {
    const box = $(id);
    box.innerHTML = '';
    for (const [val, label] of items) {
      const b = document.createElement('button');
      b.textContent = label;
      b.setAttribute('aria-pressed', String(get() === val));
      b.addEventListener('click', () => { set(val); store.set('settings', settings); buildLobby(); });
      box.appendChild(b);
    }
  }
  function buildLobby() {
    segment('optOpp', [[1, '1'], [2, '2'], [3, '3']], () => settings.opp, v => { settings.opp = v; });
    segment('optLevel', [[0, T.easy], [1, T.normal], [2, T.hard]], () => settings.level, v => { settings.level = v; });
    segment('optTarget', [[100, T.pts(100)], [200, T.pts(200)]], () => settings.target, v => { settings.target = v; });
    segment('optDraw', [['one', T.drawOne], ['until', T.drawUntil]], () => settings.draw, v => { settings.draw = v; });
    const box = $('optSpec');
    box.innerHTML = '';
    for (const [k, label] of [['two', T.sp2], ['queen', T.spQ], ['ace', T.spA]]) {
      const b = document.createElement('button');
      b.textContent = label;
      b.setAttribute('aria-pressed', String(settings[k]));
      b.addEventListener('click', () => { settings[k] = !settings[k]; store.set('settings', settings); buildLobby(); });
      box.appendChild(b);
    }
    $('statsLine').textContent = T.stats(stats.games, stats.wins);
  }

  let openId = null, lastFocus = null;
  function openPanel(id) {
    closePanel();
    lastFocus = document.activeElement;
    openId = id;
    $(id).hidden = false;
    const f = $(id).querySelector('button');
    if (f) f.focus();
  }
  function closePanel() {
    if (!openId) return;
    $(openId).hidden = true;
    openId = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function cardHTML(c) {
    const r = RANKS[rankOf(c)], s = SUITS[suitOf(c)];
    return `<span class="r">${r}<small>${s}</small></span><span class="big">${s}</span>`;
  }
  function cardClass(c) { return `card${isRed(c) ? ' red' : ''}${rankOf(c) === 8 ? ' eight' : ''}`; }

  const humanTurn = () => S && !S.over && S.turn === 0 && !busy && !openId;
  function render() {
    if (!S) return;
    // opponents
    els.opps.innerHTML = '';
    for (let p = 1; p < S.n; p++) {
      const seat = document.createElement('div');
      seat.className = `seat${S.turn === p && !S.over ? ' turn' : ''}`;
      const k = S.hands[p].length;
      const minis = '<span class="mini"></span>'.repeat(Math.min(k, 8));
      seat.innerHTML = `<div class="nm">${nm(p)}</div><div class="fan">${minis}<span class="cnt">${k}</span></div><div class="sc">${T.score(match.scores[p])}</div>`;
      seat.setAttribute('aria-label', `${nm(p)}: ${T.cardsLeft(k)}, ${T.score(match.scores[p])}`);
      els.opps.appendChild(seat);
    }
    // pile
    const t = top(S);
    els.pile.innerHTML = `<div class="${cardClass(t)}${lastPlayed === t ? ' fresh' : ''}">${cardHTML(t)}</div>`;
    lastPlayed = -1;
    els.pile.setAttribute('aria-label', T.top(cardName(t)));
    const sn = $('suitNow');
    sn.textContent = SUITS[S.suit];
    sn.style.color = S.suit === 1 || S.suit === 2 ? 'var(--red)' : 'var(--ink)';
    sn.setAttribute('aria-label', T.suitNow(T.suitNames[S.suit]));
    $('dirIc').textContent = S.n > 2 ? (S.dir === 1 ? '↻' : '↺') : '';
    const pend = $('pend');
    pend.hidden = !S.pending;
    pend.textContent = `+${S.pending}`;
    $('stockN').textContent = S.stock.length;
    els.stock.classList.toggle('empty', !S.stock.length && S.discard.length < 2);
    els.stock.setAttribute('aria-label', `${T.draw} · ${T.stockN(S.stock.length)}`);
    // my hand
    const mine = humanTurn();
    const legal = mine ? new Set(legalOf(S, 0)) : new Set();
    const h = S.hands[0].slice().sort((a, b) => suitOf(a) - suitOf(b) || rankOf(a) - rankOf(b));
    els.hand.innerHTML = '';
    els.hand.classList.toggle('mute', !mine);
    for (const c of h) {
      const b = document.createElement('button');
      b.className = `${cardClass(c)}${mine ? (legal.has(c) ? ' ok' : ' no') : ''}`;
      b.dataset.c = c;
      b.innerHTML = cardHTML(c);
      b.setAttribute('aria-label', cardName(c));
      b.setAttribute('aria-disabled', String(!legal.has(c)));
      els.hand.appendChild(b);
    }
    layoutHand();
    $('mineHead').classList.toggle('turn', mine);
    $('myScore').textContent = T.score(match.scores[0]);
    $('drawBtn').disabled = !(mine && !S.drew);
    els.stock.classList.toggle('can', mine && !S.drew && !legal.size);
    els.stock.disabled = !(mine && !S.drew);
    $('passBtn').disabled = !(mine && (S.drew || (!legal.size && !S.stock.length && S.discard.length < 2)));
    $('hintBtn').disabled = !mine;
    // scoreboard
    $('roundLbl').textContent = T.round(match.round);
    $('boardTbl').innerHTML = scoreRows();
  }
  function scoreRows() {
    return names().slice(0, S.n).map((n, p) => `<tr class="${p === 0 ? 'me' : ''}"><td>${n} · ${T.cardsLeft(S.hands[p].length)}</td><td>${T.score(match.scores[p])}</td></tr>`).join('');
  }
  function layoutHand() {
    const cards = [...els.hand.children];
    if (!cards.length) return;
    const W = els.hand.clientWidth, cw = cards[0].offsetWidth;
    const step = cards.length > 1 ? Math.min(cw + 4, (W - cw) / (cards.length - 1)) : 0;
    const total = step * (cards.length - 1) + cw;
    const x0 = (W - total) / 2;
    cards.forEach((el, i) => { el.style.left = `${x0 + i * step}px`; el.style.zIndex = i; });
  }

  const wait = ms => new Promise(r => { timer = setTimeout(r, ms * delayScale); });

  function newMatch() {
    closePanel();
    match = { scores: Array(settings.opp + 1).fill(0), round: 0, target: settings.target, level: settings.level, over: false };
    logLines.length = 0;
    newRound();
  }
  function newRound() {
    closePanel();
    match.round++;
    const rules = { draw: settings.draw, two: settings.two, queen: settings.queen, ace: settings.ace };
    S = makeState(match.scores.length, rules, rigDeck);
    rigDeck = null;
    S.turn = (match.round - 1) % S.n;
    lastPlayed = top(S);
    log(T.round(match.round));
    step();
  }

  async function step() {
    if (!S || S.over) return;
    const p = S.turn;
    if (S.pending) {
      busy = true;
      render();
      await wait(450);
      const k = S.pending;
      S.pending = 0;
      let got = 0;
      for (let i = 0; i < k; i++) if (drawOne(S, p) != null) got++;
      log(`${T.drawTwo(nm(p), k)}`, p === 0);
      S.turn = nextSeat(S, p);
      busy = false;
      render();
      await wait(450);
      return step();
    }
    if (p === 0 && humanAuto == null) {
      busy = false;
      render();
      els.msg.textContent = T.yourTurn;
      return;
    }
    busy = true;
    render();
    if (p !== 0) els.msg.textContent = T.turnOf(nm(p));
    await wait(700);
    const level = p === 0 ? humanAuto : match.level;
    let mv = aiChoose(S, p, level);
    if (!mv) {
      const n = doDraw(S, p);
      if (n) log(T.drew(nm(p), n));
      render();
      await wait(450);
      mv = aiPlaysAfterDraw(level) ? aiChoose(S, p, level) : null;
    }
    busy = false;
    if (mv) return commitPlay(p, mv.c, mv.s);
    passTurn(S, p);
    log(T.passed(nm(p)));
    if (S.over) return endRound();
    step();
  }

  function commitPlay(p, c, s) {
    const ev = playCard(S, p, c, s);
    lastPlayed = c;
    for (const e of ev) {
      if (e.t === 'play') log(T.played(nm(e.p), cardName(e.c)), e.p !== 0 && S.n === 2);
      else if (e.t === 'eight') { log(T.playedEight(nm(e.p), T.suitNames[e.s]), true); $('suitNow').classList.remove('wild'); void $('suitNow').offsetWidth; $('suitNow').classList.add('wild'); }
      else if (e.t === 'skip') log(T.skipped(nm(e.p)), e.p === 0);
      else if (e.t === 'rev') log(T.reversed);
      else if (e.t === 'last') log(e.p === 0 ? T.youLast : T.lastCard(nm(e.p)), true);
    }
    if (S.over) { render(); return endRound(); }
    render();
    step();
  }

  // Human actions
  let pendingEight = null;
  function humanPlay(c) {
    if (!humanTurn() || !S.hands[0].includes(c) || !canPlay(S, c)) return;
    if (rankOf(c) === 8) { pendingEight = c; openPanel('suitPanel'); return; }
    commitPlay(0, c, suitOf(c));
  }
  function chooseSuit(s) {
    if (pendingEight == null) return;
    const c = pendingEight;
    pendingEight = null;
    closePanel();
    commitPlay(0, c, s);
  }
  function humanDraw() {
    if (!humanTurn() || S.drew) return;
    const n = doDraw(S, 0);
    if (n) log(T.drew(nm(0), n));
    if (!n || !legalOf(S, 0).length && settings.draw === 'until') { passTurn(S, 0); log(T.passed(nm(0))); if (S.over) return endRound(); return step(); }
    render();
    els.msg.textContent = T.afterDraw;
  }
  function humanPass() {
    if (!humanTurn() || $('passBtn').disabled) return;
    passTurn(S, 0);
    log(T.passed(nm(0)));
    if (S.over) return endRound();
    step();
  }
  function hint() {
    if (!humanTurn()) return;
    const mv = aiChoose(S, 0, 2);
    if (!mv) { els.msg.textContent = S.drew ? T.afterDraw : T.hintDraw; return; }
    const el = els.hand.querySelector(`[data-c="${mv.c}"]`);
    if (el) { el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint'); el.focus(); }
  }

  function endRound() {
    render();
    const w = S.winner, pts = roundPoints(S);
    match.scores[w] += pts;
    const done = match.scores[w] >= match.target;
    const title = S.blocked ? T.blocked : w === 0 ? T.youRound : T.roundWin(nm(w));
    $('roundT').textContent = done ? (w === 0 ? T.matchWin : T.matchLose(nm(w))) : title;
    $('roundP').textContent = `${S.blocked ? `${T.roundWin(nm(w))}. ` : ''}${(w === 0 ? T.gainYou(pts) : T.gain(nm(w), pts))}`;
    $('roundTbl').innerHTML = scoreRows();
    $('nextBtn').textContent = done ? T.playAgain : T.nextRound;
    match.over = done;
    if (done) {
      stats.games++;
      if (w === 0) stats.wins++;
      store.set('stats', stats);
    }
    announce(`${$('roundT').textContent}. ${$('roundP').textContent}`);
    render();
    setTimeout(() => openPanel('roundPanel'), 500 * delayScale);
  }

  // ---------- events ----------
  els.hand.addEventListener('click', e => { const b = e.target.closest('.card'); if (b) humanPlay(+b.dataset.c); });
  els.hand.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const cards = [...els.hand.children];
    const i = cards.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    cards[(i + (e.key === 'ArrowRight' ? 1 : -1) + cards.length) % cards.length].focus();
  });
  els.stock.addEventListener('click', humanDraw);
  $('drawBtn').addEventListener('click', humanDraw);
  $('passBtn').addEventListener('click', humanPass);
  $('hintBtn').addEventListener('click', hint);
  $('suitBtns').addEventListener('click', e => { const b = e.target.closest('button'); if (b) chooseSuit(+b.dataset.s); });
  $('startBtn').addEventListener('click', newMatch);
  $('nextBtn').addEventListener('click', () => (match.over ? newMatch() : newRound()));
  $('toLobbyBtn').addEventListener('click', () => { buildLobby(); openPanel('lobbyPanel'); });
  $('menuBtn').addEventListener('click', () => { buildLobby(); openPanel('lobbyPanel'); });
  $('rulesBtn').addEventListener('click', () => openPanel('rulesPanel'));
  $('rulesClose').addEventListener('click', () => { closePanel(); if (!S) { buildLobby(); openPanel('lobbyPanel'); } });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (openId === 'suitPanel' && /^[1-4]$/.test(e.key)) { e.preventDefault(); chooseSuit(+e.key - 1); return; }
    if (openId) return;
    const k = e.key.toLowerCase();
    if (k === 'd') { e.preventDefault(); humanDraw(); }
    else if (k === 'p') { e.preventDefault(); humanPass(); }
    else if (k === 'h') { e.preventDefault(); hint(); }
  });
  new ResizeObserver(layoutHand).observe(els.hand);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  applyI18n();
  buildLobby();
  openPanel('lobbyPanel');

  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__crazyEights = {
    get S() { return S; }, get match() { return match; }, get settings() { return settings; }, get stats() { return stats; }, get openId() { return openId; },
    W, legalOf, aiChoose, makeState, playCard, canPlay, value, handValue,
    speed(x) { delayScale = x; },
    rig(deck) { rigDeck = deck.slice(); },
    autoHuman(level) { humanAuto = level; if (level != null && humanTurn()) step(); },
    setScores(arr) { match.scores = arr.slice(); render(); },
    cardCenter(c) { const el = els.hand.querySelector(`[data-c="${c}"]`); if (!el) return null; const r = el.getBoundingClientRect(); return { x: r.left + 6, y: r.top + r.height / 2 }; },
    // Engine-only rounds between bots; returns wins per seat, illegal plays and rounds that stalled.
    simulate(levels, rounds, rules) {
      const res = { wins: levels.map(() => 0), pts: levels.map(() => 0), illegal: 0, stalled: 0, blocked: 0 };
      for (let k = 0; k < rounds; k++) {
        const st = makeState(levels.length, Object.assign({ draw: 'one', two: true, queen: true, ace: true }, rules));
        st.turn = k % st.n;
        let guard = 0;
        while (!st.over && guard++ < 3000) {
          const p = st.turn;
          if (st.pending) { for (let i = 0; i < st.pending; i++) drawOne(st, p); st.pending = 0; st.turn = nextSeat(st, p); continue; }
          let mv = aiChoose(st, p, levels[p]);
          if (!mv) { doDraw(st, p); mv = aiPlaysAfterDraw(levels[p]) ? aiChoose(st, p, levels[p]) : null; }
          if (mv) { if (!canPlay(st, mv.c) || !st.hands[p].includes(mv.c)) res.illegal++; playCard(st, p, mv.c, mv.s); }
          else passTurn(st, p);
        }
        if (!st.over) { res.stalled++; continue; }
        if (st.blocked) res.blocked++;
        res.wins[st.winner]++;
        res.pts[st.winner] += roundPoints(st);
      }
      return res;
    }
  };
})();
</script>
</body>
</html>
