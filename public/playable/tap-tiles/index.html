<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">

<title>Tap Tiles</title>
<style>
:root {
  --bg: #1b1430;
  --bg-2: #2a1f4a;
  --panel: #2b2150;
  --panel-2: #3a2d68;
  --text: #fbf7ff;
  --muted: #b7acd9;
  --lane: #f6f0e6;
  --ink: #1c1a2e;
  --coral: #ff6f61;
  --mint: #4fe0b6;
  --gold: #ffc94a;
  --sky: #7ab8ff;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(120% 90% at 50% 10%, var(--bg-2), var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "l" "r" "stage"; gap: 6px; max-width: 560px; margin: auto; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.side { min-width: 0; display: flex; align-items: center; gap: 8px; }
.side.l { grid-area: l; }
.side.r { grid-area: r; }
.stage { grid-area: stage; position: relative; min-height: 0; border-radius: 18px; overflow: hidden; background: var(--lane); box-shadow: 0 10px 30px #0008, inset 0 0 0 2px #ffffff22; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.song-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.stat { display: flex; flex-direction: column; align-items: center; min-width: 54px; padding: 3px 10px; border-radius: 12px; background: var(--panel); }
.stat b { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat small { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.stat.score b { color: var(--gold); }
.hearts { font-size: 18px; letter-spacing: 1px; white-space: nowrap; }
.hearts .off { opacity: .25; filter: grayscale(1); }
.prog { flex: 1; min-width: 40px; height: 8px; border-radius: 99px; background: var(--panel); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), var(--sky)); border-radius: inherit; }
.speed { font-size: 13px; font-weight: 900; color: var(--mint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.icon-btn { flex: 0 0 auto; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: var(--panel-2); font-size: 17px; font-weight: 900; box-shadow: 0 3px 0 #120d24; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #120d24; }
.keys, .big-title, .acc-line { display: none; }
.keys { gap: 6px; }
.keys kbd { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--panel-2); font: inherit; font-weight: 900; box-shadow: 0 3px 0 #120d24; }

/* wide: lanes take full height in the centre, HUD lives in the side columns */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: none; grid-template-columns: minmax(0, 1fr) min(64vw, calc((100dvh - 16px) * .66)) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "l stage r"; gap: clamp(8px, 2vw, 28px); }
  .side { flex-direction: column; align-items: stretch; justify-content: center; gap: clamp(6px, 1.6vh, 14px); max-width: 320px; overflow: hidden; }
  .side.l { justify-self: end; width: 100%; }
  .side.r { justify-self: start; width: 100%; }
  .big-title { display: block; font-size: clamp(18px, 3.4vh, 30px); font-weight: 900; letter-spacing: -.02em; line-height: 1; }
  .big-title span { color: var(--coral); }
  .song-name { flex: 0 0 auto; white-space: normal; font-size: clamp(13px, 2.4vh, 18px); line-height: 1.25; }
  .stat { flex-direction: row; justify-content: space-between; gap: 8px; padding: clamp(4px, 1.2vh, 10px) 14px; border-radius: 14px; }
  .stat b { font-size: clamp(18px, 4vh, 32px); }
  .stat small { font-size: clamp(10px, 1.7vh, 13px); }
  .prog { flex: 0 0 auto; height: 10px; }
  .acc-line { display: block; font-size: clamp(11px, 2vh, 14px); font-weight: 800; color: var(--muted); }
  .hearts { font-size: clamp(18px, 4vh, 30px); }
  .keys { display: flex; flex-wrap: wrap; align-items: center; }
  .keys span { width: 100%; font-size: clamp(10px, 1.8vh, 13px); color: var(--muted); font-weight: 700; }
  .btn-row { display: flex; gap: 8px; }
  .speed { font-size: clamp(13px, 2.4vh, 18px); }
}
@media (min-aspect-ratio: 5/4) and (max-height: 420px) { .keys { display: none; } .acc-line { display: none; } .stat { padding: 2px 10px; } }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 10px; background: #120c22d9; }
.panel { width: min(100%, 420px); max-height: calc(100% - 8px); overflow-y: auto; background: var(--panel); border-radius: 26px; padding: 20px 18px 18px; text-align: center; box-shadow: 0 20px 50px #0009, inset 0 0 0 1px #ffffff14; animation: rise .28s ease-out; }
.panel.wide { width: min(100%, 860px); }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.logo { font-size: clamp(34px, 10vw, 46px); font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.logo span { color: var(--coral); }
.mini-tiles { display: flex; justify-content: center; gap: 5px; margin: 10px 0 4px; }
.mini-tiles i { width: 16px; height: 26px; border-radius: 4px; background: var(--lane); }
.mini-tiles i:nth-child(2n) { background: var(--ink); box-shadow: 0 0 0 2px var(--lane); transform: translateY(-6px); }
.tagline { margin-top: 6px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.panel h2 { font-size: 22px; font-weight: 900; }
.panel p { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.4; }
.cta { display: block; margin-top: 14px; width: 100%; padding: 13px; border-radius: 18px; background: var(--coral); color: #2b0d09; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 #b8473c; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8473c; }
.ghost { display: block; margin-top: 10px; width: 100%; padding: 11px; border-radius: 16px; background: var(--panel-2); font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #120d24; }
.ghost:active { transform: translateY(2px); box-shadow: 0 2px 0 #120d24; }
.ghost small, .cta small { display: block; font-size: 12px; font-weight: 700; opacity: .8; }
.row2 { display: flex; gap: 10px; } .row2 > * { flex: 1; }
.toggle { margin-top: 12px; font-size: 14px; font-weight: 800; color: var(--muted); padding: 6px 12px; border-radius: 99px; background: #ffffff10; }
.list-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.list-head h2 { flex: 1; text-align: left; }
.list-head .total { font-size: 14px; font-weight: 900; color: var(--gold); white-space: nowrap; }
.songs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.song { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-height: 64px; padding: 9px 11px; border-radius: 14px; background: var(--panel-2); text-align: left; box-shadow: 0 3px 0 #120d24; }
.song:active { transform: translateY(2px); box-shadow: 0 1px 0 #120d24; }
.song .n { font-size: 11px; font-weight: 900; color: var(--muted); }
.song strong { font-size: 14px; font-weight: 800; line-height: 1.2; }
.song .meta { display: flex; justify-content: space-between; width: 100%; font-size: 13px; }
.song .st { color: var(--gold); letter-spacing: 1px; }
.song .st .off { color: #ffffff30; }
.song .dots { color: var(--mint); font-size: 10px; letter-spacing: 1px; align-self: center; }
.song.locked { opacity: .5; }
.song.locked strong::before { content: "🔒 "; }
.res-stars { margin-top: 6px; font-size: 44px; letter-spacing: 4px; color: var(--gold); line-height: 1.1; }
.res-stars .off { color: #ffffff26; }
.res-score { margin-top: 2px; font-size: clamp(38px, 11vw, 52px); font-weight: 900; letter-spacing: -.03em; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1.05; }
.res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.res-grid div { padding: 6px 2px; border-radius: 12px; background: #ffffff0d; }
.res-grid b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.res-grid small { font-size: 11px; font-weight: 800; color: var(--muted); }
.badge { display: inline-block; margin-top: 8px; padding: 5px 14px; border-radius: 99px; background: var(--gold); color: #2b2200; font-size: 14px; font-weight: 900; }
@media (max-height: 560px) { .panel { padding: 14px 14px; } .mini-tiles { display: none; } .cta { margin-top: 10px; padding: 10px; } .ghost { margin-top: 8px; padding: 9px; } .res-stars { font-size: 34px; } .res-score { font-size: 36px; } .tagline { font-size: 13px; } }
@media (max-height: 420px) { .panel { border-radius: 20px; padding: 10px 14px; } .logo { font-size: 30px; } .res-grid { margin-top: 6px; } .res-grid b { font-size: 15px; } .song { min-height: 52px; padding: 6px 9px; } .row2.land-split { } .panel.result { width: min(100%, 560px); } }
@media (max-height: 420px) and (min-aspect-ratio: 4/3) { .panel.start { width: min(100%, 560px); } .start .row2 .cta, .start .row2 .ghost { margin-top: 10px; } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="side l">
    <div class="big-title">Tap <span>Tiles</span></div>
    <button class="icon-btn" id="pause-btn" type="button" data-i18n-label="pause">❚❚</button>
    <div class="song-name" id="song-name"></div>
    <div class="stat score"><small data-i18n="score"></small><b id="score">0</b></div>
    <div class="stat"><small data-i18n="combo"></small><b id="combo">0</b></div>
    <div class="acc-line" id="acc-line"></div>
  </div>
  <div class="side r">
    <div class="hearts" id="hearts" role="img"></div>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="prog"><i id="prog-bar"></i></div>
    <div class="speed" id="speed">×1.0</div>
    <div class="stat"><small data-i18n="best"></small><b id="best">0</b></div>
    <div class="keys" aria-hidden="true"><span data-i18n="keysHint"></span><kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd></div>
    <button class="icon-btn" id="mute-btn" type="button" data-i18n-label="sound">🔊</button>
  </div>
  <div class="stage" id="stage"><canvas id="cv" role="img"></canvas></div>
</div>

<div class="overlay" id="ov-start">
  <div class="panel start">
    <div class="logo">Tap <span>Tiles</span></div>
    <div class="mini-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="row2">
      <button class="cta" id="btn-songs" type="button"><span data-i18n="songs"></span><small id="stars-total"></small></button>
      <button class="ghost cta-alt" id="btn-endless" type="button" style="margin-top:14px"><span data-i18n="endless"></span><small id="endless-best"></small></button>
    </div>
    <button class="toggle" id="btn-sound" type="button"></button>
  </div>
</div>

<div class="overlay" id="ov-songs" hidden>
  <div class="panel wide">
    <div class="list-head">
      <button class="icon-btn" id="songs-back" type="button" data-i18n-label="back">←</button>
      <h2 data-i18n="songs"></h2>
      <span class="total" id="songs-total"></span>
    </div>
    <div class="songs" id="song-list"></div>
  </div>
</div>

<div class="overlay" id="ov-pause" hidden>
  <div class="panel">
    <h2 data-i18n="paused"></h2>
    <button class="cta" id="btn-resume" type="button" data-i18n="resume"></button>
    <button class="ghost" id="btn-restart" type="button" data-i18n="retry"></button>
    <button class="ghost" id="btn-quit" type="button" data-i18n="quit"></button>
  </div>
</div>

<div class="overlay" id="ov-result" hidden>
  <div class="panel result">
    <h2 id="res-title"></h2>
    <div class="res-stars" id="res-stars"></div>
    <div class="res-score" id="res-score">0</div>
    <div id="res-badge" class="badge" hidden data-i18n="newBest"></div>
    <div class="res-grid" id="res-grid"></div>
    <p id="res-sub"></p>
    <div class="row2">
      <button class="ghost" id="res-retry" type="button" data-i18n="retry"></button>
      <button class="cta" id="res-next" type="button" data-i18n="next"></button>
    </div>
    <button class="ghost" id="res-menu" type="button" data-i18n="menu"></button>
  </div>
</div>
<p class="sr-only" id="announcer" aria-live="polite"></p>

  let bests = store.get('best', {});
  if (!bests || typeof bests !== 'object') bests = {};

  // ---------- audio ----------
  let ac = null, master = null;

  function playNote(midi, vol = .5, sustain = false) {

    const safety = setTimeout(() => release(), 8000);
    function release() {
      if (done) return; done = true; clearTimeout(safety);
      const n = a.currentTime;
      g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value, .001), n);

    o.type = 'sawtooth'; o.frequency.setValueAtTime(140, now); o.frequency.exponentialRampToValueAtTime(70, now + .25);
    g.gain.setValueAtTime(.18, now); g.gain.exponentialRampToValueAtTime(.001, now + .3);
    o.connect(g); g.connect(master); o.start(now); o.stop(now + .32);
  }

  // ---------- charts ----------
  const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function parseSong(s) {
    const ev = [];
    let pos = 0;
    for (const tok of s.n.trim().split(/\s+/)) {
      const m = /^([A-Gr])(#|b)?(\d)?(?::(\d+))?$/.exec(tok);
      if (!m) continue;
      const d = m[4] ? +m[4] : s.u;
      if (m[1] !== 'r') {
        const midi = 12 * (+m[3] + 1 + (s.o || 0)) + NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
        ev.push({ t: pos, d, midi });

    }
    return ev;
  }
  function rng(seed) { let x = seed * 2654435761 >>> 0 || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; }; }
  function mostCommon(arr) { const c = {}; let best = arr[0], bc = 0; for (const v of arr) { c[v] = (c[v] || 0) + 1; if (c[v] > bc) { bc = c[v]; best = v; } } return best; }

  // Turn a song into rows of tiles. Positions are in "rows": one row = the song's most common note length.
  function buildChart(idx, offset, seed) {
    const s = SONGS[idx], ev = parseSong(s);
    const base = mostCommon(ev.map(e => e.d));
    const r = rng(seed);
    const rows = [];
    let lane = Math.floor(r() * LANES), prev = null, lastDbl = false;
    for (const e of ev) {
      if (prev) {
        const diff = e.midi - prev.midi;
        if (diff === 0) { let n; do { n = Math.floor(r() * LANES); } while (n === lane); lane = n; }
        else {
          const step = Math.abs(diff) > 4 ? 2 : 1;
          let n = lane + Math.sign(diff) * step;
          if (n < 0 || n >= LANES) n = lane - Math.sign(diff) * step;
          lane = Math.max(0, Math.min(LANES - 1, n));
        }
      }
      const d = e.d / base, tStart = offset + e.t / base;
      const hold = d >= 3;
      const row = { t: tStart, d, tiles: [], song: idx, acc: e.t % (s.u * 2) === 0 };
      row.tiles.push({ lane, t: tStart, d, midi: e.midi, hold, state: 0 });
      if (s.dbl && !hold && d >= 2 && !lastDbl) {
        let l2; do { l2 = Math.floor(r() * LANES); } while (l2 === lane);
        row.tiles.push({ lane: l2, t: tStart, d, midi: e.midi - 12, hold: false, state: 0 });

      } else lastDbl = false;
      row.tiles.forEach(tl => { tl.row = row; });
      rows.push(row);

    }
    const end = offset + ev.reduce((m, e) => Math.max(m, e.t + e.d), 0) / base;
    return { rows, end };
  }
  function songLevel(i) { const s = SONGS[i]; return Math.min(4, Math.max(1, Math.round((s.sp - 1.3) / .55) + (s.dbl ? 1 : 0))); }

  // ---------- game state ----------
  let G = null;
  let screen = 'start';
  let auto = false, timeScale = 1;
  const holds = new Map(); // input id -> tile
  const fx = []; // ripples and judgement pops
  let flash = null; // {lane, t}

  function newGame(mode, songIdx) {
    closeOverlays();
    holds.clear(); fx.length = 0; flash = null;
    G = { mode, songIdx, rows: [], end: 0, pos: 0, cursor: 0, started: false, paused: false, over: false, hearts: 3, lost: 0,
      score: 0, combo: 0, maxCombo: 0, pts: 0, maxPts: 0, hit: 0, counts: { perfect: 0, great: 0, good: 0, miss: 0 },
      endlessSongs: 0, endlessIdx: 0, endTimer: 0, lastTap: [] };
    if (mode === 'song') {
      const c = buildChart(songIdx, 0, songIdx + 7);
      G.rows = c.rows; G.end = c.end;
    } else {
      G.order = shuffle(SONGS.map((_, i) => i));
      appendEndless();
    }
    G.pos = G.rows[0].t;
    screen = 'play';
    updateHud();
    $('song-name').textContent = mode === 'song' ? names[songIdx] : `∞ ${t.endless}`;
    announce(mode === 'song' ? t.songN(songIdx + 1, names[songIdx]) : t.endless);
    stage.focus?.();
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function appendEndless() {

    const c = buildChart(idx, off, G.endlessIdx * 31 + 5);
    const k = G.endlessIdx;

  }
  // rows per second at a song position
  function speedAt(pos) {

    const row = G.rows[Math.min(G.cursor, G.rows.length - 1)];

  function msTo(tile) { return (tile.t - G.pos) / speedAt(G.pos) * 1000; }

  // ---------- input ----------
  function tapLane(lane, id) {

    if (!row) return;
    const tile = row.tiles.find(tl => tl.lane === lane && tl.state === 0);
    if (!G.started) {

    if (tile) {

  // ---------- update ----------

  // ---------- end / results ----------

  function endGame(cleared) {

      if (cleared && G.score > (bests[i] || 0)) { isBest = true; bests[i] = G.score; store.set('best', bests); }

    G.result = { cleared, stars: n, acc, isBest };

    $('res-stars').hidden = G.mode !== 'song';
    $('res-stars').innerHTML = [0, 1, 2].map(k => `<span class="${k < n ? '' : 'off'}">★</span>`).join('');
    $('res-stars').setAttribute('aria-label', t.starsGot(n));
    $('res-score').textContent = G.mode === 'endless' ? G.hit : G.score;
    $('res-badge').hidden = !isBest;
    const cells = G.mode === 'endless'
      ? [[t.score, G.score], [t.tiles, G.hit], [t.maxCombo, G.maxCombo], [t.accuracy, Math.round(acc * 100) + '%']]
      : [[t.perfect, G.counts.perfect], [t.great, G.counts.great], [t.good, G.counts.good], [t.miss, G.counts.miss]];
    $('res-grid').innerHTML = cells.map(([k, v]) => `<div><b>${v}</b><small>${k}</small></div>`).join('');
    $('res-sub').textContent = G.mode === 'endless' ? `${t.endlessHint(G.endlessSongs)} · ${t.bestN(endlessBest)}`
      : (unlockedName ? t.unlocked(unlockedName) + ' · ' : '') + `${t.accN(Math.round(acc * 100))} · ${t.maxCombo} ${G.maxCombo}` + (n < 3 && cleared ? ` — ${t.starHint}` : '');
    const canNext = G.mode === 'song' && G.songIdx + 1 < SONGS.length && isUnlocked(G.songIdx + 1);

    show('ov-result');

  // ---------- HUD / menus ----------
  function updateHud() {

    $('combo').textContent = G.combo;
    const h = Math.max(0, G.hearts);
    $('hearts').innerHTML = [0, 1, 2].map(k => `<span class="${k < h ? '' : 'off'}">❤️</span>`).join('');
    $('hearts').setAttribute('aria-label', t.heartsN(h));

  }
  function updateMenu() {

    $('songs-total').textContent = `★ ${total} / ${SONGS.length * 3}`;
    $('endless-best').textContent = t.bestN(endlessBest);
    $('btn-sound').textContent = soundOn ? t.soundOn : t.soundOff;
    $('mute-btn').textContent = soundOn ? '🔊' : '🔇';

        + `<span class="n">${i + 1}</span><strong>${names[i]}</strong>`
        + `<span class="meta"><span class="st">${[0, 1, 2].map(k => `<span class="${k < st ? '' : 'off'}">★</span>`).join('')}</span><span class="dots" aria-hidden="true">${'●'.repeat(lv)}${'○'.repeat(4 - lv)}</span></span></button>`;

  function closeOverlays() { document.querySelectorAll('.overlay').forEach(o => { o.hidden = true; }); }
  function show(id) { closeOverlays(); $(id).hidden = false; }
  function toMenu() {

    holds.clear(); G = null; screen = 'start'; show('ov-start'); updateMenu(); $('btn-songs').focus();
  }
  function togglePause(force) {

  function announce(s) { $('announcer').textContent = s; }

  $('btn-songs').addEventListener('click', () => { updateMenu(); screen = 'songs'; show('ov-songs'); const f = $('song-list').querySelector('.song:not(.locked)'); if (f) f.focus(); });
  $('btn-endless').addEventListener('click', () => newGame('endless'));
  $('songs-back').addEventListener('click', toMenu);
  $('song-list').addEventListener('click', e => {

  // ---------- render ----------
  let W = 0, H = 0, dpr = 1;
  function resize() {

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const L = layout(), lw = L.w / LANES, now = performance.now();
    ctx.fillStyle = '#e9e0d2'; ctx.fillRect(0, 0, W, H);
    // lanes
    ctx.fillStyle = '#f6f0e6'; ctx.fillRect(L.x, 0, L.w, H);
    if (flash && now - flash.t < 260) {
      ctx.fillStyle = `rgba(255,111,97,${.35 * (1 - (now - flash.t) / 260)})`;
      ctx.fillRect(L.x + flash.lane * lw, 0, lw, H);
    }
    ctx.fillStyle = '#d8ccbb';
    for (let i = 1; i < LANES; i++) ctx.fillRect(Math.round(L.x + i * lw) - .5, 0, 1, H);
    // hit zone + line
    const zg = ctx.createLinearGradient(0, L.lineY - L.rowH * .6, 0, L.lineY + L.rowH * .3);
    zg.addColorStop(0, 'rgba(79,224,182,0)'); zg.addColorStop(1, 'rgba(79,224,182,.22)');
    ctx.fillStyle = zg; ctx.fillRect(L.x, L.lineY - L.rowH * .6, L.w, L.rowH * .9);
    ctx.fillStyle = '#ff6f61'; ctx.fillRect(L.x, L.lineY - 1.5, L.w, 3);
    if (G) drawTiles(L, lw, now);
    // effects
    for (const f of fx) {
      const age = (now - f.t) / 520;
      if (age > 1) continue;
      const cx = L.x + (f.lane + .5) * lw;
      if (f.j !== 'miss' && !reduced) {
        ctx.strokeStyle = `rgba(79,224,182,${1 - age})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, L.lineY, lw * .2 + age * lw * .45, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1 - age;
      ctx.fillStyle = f.j === 'perfect' ? '#d98a00' : f.j === 'great' ? '#1e9e7a' : f.j === 'good' ? '#3d6fd1' : '#e2483b';
      ctx.font = `900 ${Math.max(12, Math.min(20, lw * .2))}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign = 'center';
      const tw = ctx.measureText(t[f.j]).width / 2 + 4;
      ctx.fillText(t[f.j], Math.max(L.x + tw, Math.min(L.x + L.w - tw, cx)), L.lineY + L.rowH * .45 - (reduced ? 0 : age * 18));
      ctx.globalAlpha = 1;
    }
    if (G && !G.started && screen === 'play') {
      const tile = G.rows[0].tiles[0];
      const cx = L.x + (tile.lane + .5) * lw;
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.font = `900 ${Math.max(11, Math.min(17, lw * .17))}px ${getComputedStyle(document.body).fontFamily}`;
      const y = L.lineY - Math.min(tile.d, 2.2) * L.rowH / 2;
      wrapText(t.tapStart, cx, y, lw * .86);
    }
  }
  function wrapText(s, x, y, maxW) {
    const words = s.split(' ');
    const lines = [];
    let cur = '';
    for (const w of words) { const n = cur ? cur + ' ' + w : w; if (ctx.measureText(n).width > maxW && cur) { lines.push(cur); cur = w; } else cur = n; }
    lines.push(cur);
    const lh = parseInt(ctx.font.match(/(\d+)px/)[1], 10) * 1.15;
    lines.forEach((l, i) => ctx.fillText(l, x, y + (i - (lines.length - 1) / 2) * lh + lh * .35));
  }
  function drawTiles(L, lw, now) {
    const pos = G.pos;
    const from = Math.max(0, G.cursor - 6);
    for (let i = from; i < G.rows.length; i++) {
      const row = G.rows[i];
      const bottom = L.lineY - (row.t - pos) * L.rowH;
      if (bottom < -2) break;
      const h = row.d * L.rowH;
      const top = bottom - h;
      if (top > H) continue;
      for (const tl of row.tiles) {
        const x = L.x + tl.lane * lw + 1.5, w = lw - 3, y = top + 1.5, hh = h - 3;
        if (tl.state === 2 && !tl.hold) {
          const age = Math.min(1, (pos - tl.hitAt) * 3);
          ctx.fillStyle = `rgba(28,26,46,${.16 * (1 - age)})`;
          if (age < 1) { roundRect(x, y, w, hh, 6); ctx.fill(); }
          continue;
        }
        if (tl.state === 3) {
          const blink = flash && flash.tile === tl && Math.floor((now - flash.t) / 120) % 2 === 0;
          ctx.fillStyle = blink ? '#ff6f61' : 'rgba(226,72,59,.55)';
          roundRect(x, y, w, hh, 6); ctx.fill();
          continue;
        }
        const g = ctx.createLinearGradient(0, y, 0, y + hh);
        g.addColorStop(0, '#34304f'); g.addColorStop(1, '#16142a');
        ctx.fillStyle = g; roundRect(x, y, w, hh, 6); ctx.fill();
        if (tl.hold) {
          // centre line, then the filled part of a hold in mint
          ctx.fillStyle = 'rgba(122,184,255,.65)'; ctx.fillRect(x + w / 2 - 2, y + 8, 4, Math.max(0, hh - 16));
          ctx.beginPath(); ctx.arc(x + w / 2, y + hh - 12, 6, 0, Math.PI * 2); ctx.fill();
          if (tl.state >= 1) {
            const frac = tl.state === 2 ? (tl.holdFrac ?? 1) : Math.min(1, Math.max(0, (pos - tl.t) / tl.d));
            const fh = hh * frac;
            const mg = ctx.createLinearGradient(0, y + hh - fh, 0, y + hh);
            mg.addColorStop(0, '#9af5d9'); mg.addColorStop(1, '#4fe0b6');
            ctx.fillStyle = mg; roundRect(x, y + hh - fh, w, fh, 6); ctx.fill();
          }
        }
        if (!G.started && tl === G.rows[0].tiles[0]) {
          ctx.fillStyle = '#ff6f61'; roundRect(x, y, w, hh, 6); ctx.fill();
        }
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000) * timeScale;
    last = now;
    update(dt);
    draw();
    if (G && screen === 'play' && G.started && (now | 0) % 3 === 0) updateHud();
    requestAnimationFrame(frame);
  }

  updateMenu();
  $('btn-songs').focus();
  requestAnimationFrame(frame);

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__tapTiles = {
    state: () => ({ screen, mode: G && G.mode, song: G && G.songIdx, started: G && G.started, paused: G && G.paused, over: G && G.over, pos: G && G.pos, speed: G && speedAt(G.pos),
      hearts: G && G.hearts, score: G && G.score, combo: G && G.combo, hit: G && G.hit, cursor: G && G.cursor, rows: G && G.rows.length, counts: G && { ...G.counts }, result: G && G.result,
      stars: stars.slice(), endlessBest, songs: SONGS.length, holds: holds.size }),
    current: () => { const row = G && currentRow(); return row ? row.tiles.map(tl => ({ lane: tl.lane, hold: tl.hold, d: tl.d, state: tl.state, ms: msTo(tl) })) : []; },
    lanePoint: lane => { const r = cv.getBoundingClientRect(), L = layout(); return { x: r.left + L.x + (lane + .5) * L.w / LANES, y: r.top + L.lineY - 10 }; },
    setAuto: v => { auto = !!v; },
    setTimeScale: k => { timeScale = k; },
    unlockAll: () => { stars = SONGS.map((_, i) => Math.max(1, stars[i] || 0)); updateMenu(); }
  };
})();
</script>
</body>
</html>
