<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nonogram</title>
<style>
:root {
  --bg: #e4efe9;
  --bg-2: #f4f8f1;
  --ink: #26344d;
  --muted: #637087;
  --accent: #f07f67;
  --accent-dark: #c95d47;
  --teal: #1f9e92;
  --teal-dark: #167a70;
  --paper: #fffdf8;
  --line: #d3dbd9;
  --thick: #7f8ea3;
  --fill: #2b3a56;
  --mark: #c98f84;
  --heart: #e8556b;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(ellipse at top, var(--bg-2), transparent 70%), linear-gradient(#26344d08 1px, transparent 1px), linear-gradient(90deg, #26344d08 1px, transparent 1px);
  background-size: 100% 100%, 20px 20px, 20px 20px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.app { height: 100%; max-width: 620px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(14px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; min-width: 0; }
h1 { font-size: clamp(22px, 6.6vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1; }
h1 span { color: var(--teal); }
.chip { min-width: 0; padding: 4px 10px; border-radius: 99px; background: #26344d14; color: var(--teal-dark); font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.new { flex-shrink: 0; padding: 9px 13px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; box-shadow: 0 3px 0 var(--accent-dark); }
.new:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }

.hud { display: flex; gap: 8px; align-items: stretch; }
.stat { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 14px; background: #ffffffa6; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: normal; line-height: 1.15; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }
.hearts { letter-spacing: 1px; color: var(--heart); }
.hearts i { font-style: normal; }
.hearts i.gone { color: #c9cfd8; }
.hearts.hit { animation: thump .4s; }
@keyframes thump { 30% { transform: scale(1.25); } }
.icon-btn { position: relative; flex: 0 0 auto; width: 46px; border-radius: 14px; background: var(--paper); font-size: 20px; font-weight: 900; line-height: 1; box-shadow: 0 3px 0 #c5d2cc; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c5d2cc; }
.icon-btn:disabled { opacity: .45; }
.icon-btn .count { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; font-weight: 900; }

.stage { position: relative; flex: 1; min-height: 0; }
.board-wrap { position: absolute; inset: 0; display: flex; overflow: hidden; touch-action: none; }
.board { --cell: 28px; flex: none; margin: auto; display: grid; grid-template-columns: var(--rw) repeat(var(--n), var(--cell)); grid-template-rows: var(--ch) repeat(var(--n), var(--cell)); touch-action: none; border-radius: 12px; }
.board:focus-visible { outline: 3px solid #f07f6788; outline-offset: 6px; }
.board.pan:focus-visible { outline-offset: -3px; }
.corner { display: grid; place-items: center; padding: 4px; }
.corner canvas { width: calc(min(var(--rw), var(--ch)) - 10px); height: calc(min(var(--rw), var(--ch)) - 10px); border-radius: 4px; background: #ffffffb0; image-rendering: pixelated; }
.cc, .rc { display: flex; gap: calc(var(--cell) * .1); font-size: var(--clue); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; color: var(--ink); transition: color .2s, opacity .2s; }
.cc { flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: calc(var(--cell) * .18); }
.rc { justify-content: flex-end; align-items: center; gap: calc(var(--cell) * .32); padding-right: calc(var(--cell) * .22); }
:where(.cc:nth-child(odd of .cc), .rc:nth-child(odd of .rc)) { background: #ffffff55; }
.cc { border-radius: 8px 8px 0 0; }
.rc { border-radius: 8px 0 0 8px; }
.cc.hl, .rc.hl { background: #f07f6733; }
.cc.done, .rc.done { color: #a2acb9; }
.board.multi .cc { gap: calc(var(--cell) * .08); }
.board.multi .rc { gap: calc(var(--cell) * .1); }
.cl { display: block; min-width: calc(var(--cell) * .62); padding: calc(var(--cell) * .06) calc(var(--cell) * .08); border-radius: calc(var(--cell) * .16); background: var(--c); color: var(--ct); text-align: center; }
.done .cl { opacity: .38; }
/* Zoomed-in boards scroll under clue strips that stay pinned to the top and left edges. */
.board.pan .cc { position: sticky; top: 0; z-index: 2; background: #e8f0eb; }
.board.pan .rc { position: sticky; left: 0; z-index: 2; background: #e8f0eb; }
.board.pan :is(.cc:nth-child(odd of .cc), .rc:nth-child(odd of .rc)) { background: #f3f7f3; }
.board.pan :is(.cc, .rc).hl { background: #f7d9d0 !important; }
.board.pan .corner { position: sticky; top: 0; left: 0; z-index: 3; background: var(--bg); }
.board.pan .cc, .board.pan .rc { border-radius: 0; }
.board-wrap.zoomable { padding-right: 50px; }
.cell { position: relative; background: var(--paper); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transition: background-color .08s; }
.cell.c0 { border-left: 2px solid var(--thick); }
.cell.r0 { border-top: 2px solid var(--thick); }
.cell.c5 { border-right: 2px solid var(--thick); }
.cell.r5 { border-bottom: 2px solid var(--thick); }
.cell.f { background: var(--fc, var(--fill)); }
.cell.x::before, .cell.x::after { content: ''; position: absolute; left: 22%; right: 22%; top: 50%; height: max(2px, calc(var(--cell) * .08)); margin-top: -1px; border-radius: 2px; background: var(--mark); transform: rotate(45deg); }
.cell.x::after { transform: rotate(-45deg); }
.cell.err { background: #fde3dc; animation: shake .3s; }
.cell.err::before, .cell.err::after { background: #e0523a; }
.cell.err.f { background: var(--fc, var(--fill)); box-shadow: inset 0 0 0 3px #e0523a; }
.cell.hinted { box-shadow: inset 0 0 0 2px var(--teal); }
.cell.hinted.f { box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px var(--teal); }
.cell.pop { animation: pop .45s; }
@keyframes shake { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
@keyframes pop { 40% { transform: scale(1.18); z-index: 2; } }
.cell.cursor { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
.board:not(.kb) .cell.cursor { outline: 0; }
.board.won .cell { border-color: transparent; box-shadow: none; transition: background-color .35s var(--d, 0ms), border-color .4s; }
.board.won .cell.x::before, .board.won .cell.x::after { opacity: 0; }
.board.won .cell:not(.f) { background: transparent; }
.board.won .cc, .board.won .rc { opacity: 0; transition-duration: .6s; }

.zoom { position: absolute; right: 4px; bottom: 4px; z-index: 4; display: flex; flex-direction: column; gap: 6px; }
.zoom[hidden] { display: none; }
.zoom button { width: 38px; height: 38px; border-radius: 12px; background: #fffdf8e8; font-size: 22px; font-weight: 900; line-height: 1; box-shadow: 0 2px 0 #c5d2cc, 0 2px 10px #26344d22; }
.zoom button:disabled { opacity: .4; }

.controls { display: flex; align-items: stretch; gap: 8px; }
.tools { flex: 1; min-width: 0; display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: #26344d14; }
.tools button { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border-radius: 12px; font-size: 15px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.tools button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 #c5d2cc; }
.tools .sw { padding: 6px; }
.tools .sw i { display: grid; place-items: center; width: 100%; max-width: 44px; height: 26px; border-radius: 8px; background: var(--c); color: var(--ct); font-style: normal; font-size: 13px; }
.tools .sw[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.tools .mk { flex: 0 0 48px; }
.ico-fill { width: 14px; height: 14px; border-radius: 3px; background: var(--fill); flex: none; }
.ico-x { font-size: 16px; color: var(--accent-dark); }
.controls .icon-btn { width: 50px; }
.tip { text-align: center; font-size: 12px; line-height: 1.35; color: var(--muted); }
@media (max-height: 700px) { .tip { display: none; } }

.overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); background: #1b263a80; overflow: auto; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 400px); max-height: 100%; overflow: auto; background: var(--paper); border-radius: 26px; padding: 22px 18px; text-align: center; box-shadow: 0 20px 50px #0005; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: var(--teal); }
.panel .emoji { font-size: 40px; line-height: 1.2; }
.panel p { margin-top: 6px; color: var(--muted); font-size: 15px; line-height: 1.4; }
.panel .name { margin-top: 4px; font-size: 22px; font-weight: 900; color: var(--teal-dark); }
.panel .result { color: var(--ink); font-size: 17px; font-weight: 800; }
.art { display: block; width: 150px; height: 150px; margin: 12px auto 0; border-radius: 14px; background: #f3efe4; box-shadow: inset 0 0 0 1px #0000000f; }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: #f2a93b; color: #fff !important; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 18px; width: 100%; padding: 15px; border-radius: 16px; background: var(--teal); color: #fff; font-size: 18px; font-weight: 800; box-shadow: 0 5px 0 var(--teal-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--teal-dark); }
.cta[hidden], .secondary[hidden] { display: none; }
.secondary { margin-top: 10px; width: 100%; padding: 12px; border-radius: 14px; border: 2px solid #dfe6e2; font-weight: 800; }

/* Menu: header, mode tabs and options stay put; only the mode's content scrolls. */
#menu .panel { display: flex; flex-direction: column; width: min(100%, 430px); overflow: hidden; padding: 18px 16px 14px; }
.m-head p { font-size: 14px; }
.modes { margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 16px; background: #eef3ef; flex: none; }
.modes button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; border-radius: 12px; font-size: 12px; font-weight: 800; color: var(--muted); line-height: 1.15; min-width: 0; overflow-wrap: break-word; }
.modes button b { font-size: 18px; line-height: 1.2; }
.modes button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.m-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -8px; padding: 2px 8px 6px; }
.m-body section[hidden] { display: none; }
.intro { font-size: 13px !important; line-height: 1.35 !important; }
.tabs { margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 16px; background: #eef3ef; }
.tabs button { padding: 7px 2px; border-radius: 12px; font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 15px; }
.tabs button small { display: block; font-size: 11px; font-weight: 700; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.grid { margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pz { position: relative; aspect-ratio: 1; display: grid; place-items: center; border-radius: 14px; background: #f1f5f2; box-shadow: 0 3px 0 #d7e1db; font-size: 18px; font-weight: 900; color: var(--muted); overflow: hidden; }
.pz svg { position: absolute; inset: 14%; width: 72%; height: 72%; }
.pz.solved { background: #fff6e8; box-shadow: 0 3px 0 #ecd9b8; }
.pz.current { outline: 3px solid var(--accent); outline-offset: 1px; }
.pz .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.pz .tick { position: absolute; right: 4px; bottom: 2px; font-size: 12px; color: var(--teal); }
.pz .sz { position: absolute; left: 5px; bottom: 3px; font-size: 10px; font-weight: 800; color: #8c97a8; }
.pz .dots { position: absolute; left: 50%; bottom: 7px; transform: translateX(-50%); display: flex; gap: 2px; }
.pz .dots i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.field { margin-top: 12px; text-align: left; }
.field > span { display: block; margin: 0 4px 4px; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.seg { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 14px; background: #eef3ef; }
.seg button { padding: 8px 2px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.e-stats { font-weight: 800; color: var(--ink) !important; }
.day { margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: linear-gradient(135deg, #fff1e3, #e6f5ef); text-align: left; }
.cal { flex: none; width: 64px; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 2px 0 #e2d6c6; text-align: center; }
.cal b { display: block; padding: 3px 0; background: var(--accent); color: #fff; font-size: 11px; text-transform: uppercase; }
.cal strong { display: block; padding: 4px 0 6px; font-size: 26px; line-height: 1; }
.day-info { min-width: 0; }
.streak { font-size: 18px; font-weight: 900; color: var(--accent-dark); }
.day-info p { margin-top: 2px; font-size: 13px; }
.week { margin-top: 10px; display: flex; justify-content: center; gap: 6px; }
.week span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #eef3ef; font-size: 11px; font-weight: 800; color: var(--muted); }
.week span.on { background: var(--teal); color: #fff; }
.week span.today { box-shadow: 0 0 0 2px var(--accent); }
.d-status { font-weight: 800; color: var(--ink) !important; }
.opts { flex: none; margin-top: 10px; padding-top: 10px; border-top: 2px dashed #e3e9e5; }
.style-tip { margin-top: 5px !important; font-size: 12px !important; line-height: 1.3 !important; min-height: 2.6em; }
.toggles { margin-top: 8px; display: flex; gap: 6px; }
.tgl { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; padding: 8px 6px; border-radius: 12px; background: #eef3ef; font-size: 13px; font-weight: 800; color: var(--muted); line-height: 1.15; }
.tgl[aria-pressed="true"] { background: var(--teal); color: #fff; }
.tgl[hidden] { display: none; }
.tgl i { font-style: normal; flex: none; }
#menu .secondary { flex: none; margin-top: 10px; }

@media (max-width: 420px) {
  .hud { gap: 6px; }
  .stat { padding: 6px 3px; }
  .stat small { letter-spacing: 0; }
  .icon-btn { width: 40px; }
  .controls { gap: 6px; }
  .controls .icon-btn { width: 44px; }
  .tools button { padding: 10px 4px; gap: 5px; font-size: 14px; }
}
@media (max-height: 640px) {
  .m-head p { display: none; }
  .style-tip { display: none; }
}
@media (max-height: 560px) and (max-aspect-ratio: 4/3) {
  .intro, .week, .field > span { display: none; }
  .day, .field { margin-top: 6px; }
  .e-stats { margin-top: 4px !important; }
}
@media (max-width: 360px) {
  .modes button { font-size: 11px; letter-spacing: -.01em; }
}
@media (max-height: 600px) {
  .overlay { padding: 10px; }
  .panel { padding: 16px 14px; }
  #menu .panel { padding: 14px 12px 10px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 7px; }
  .cta { margin-top: 12px; }
  .modes { margin-top: 8px; }
  .modes button b { font-size: 16px; }
}
@media (max-height: 420px) {
  .overlay { padding: 8px; }
  .panel { width: min(100%, 620px); padding: 12px 16px; border-radius: 20px; }
  .panel h2 { font-size: 21px; }
  .panel p { margin-top: 3px; font-size: 13px; line-height: 1.3; }
  .panel .name { font-size: 18px; }
  .art { width: 96px; height: 96px; margin-top: 6px; }
  .tabs { margin-top: 6px; }
  .tabs button { padding: 4px 2px; }
  .grid { margin-top: 8px; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
  .pz { font-size: 15px; border-radius: 10px; }
  .badge { margin-top: 6px; padding: 4px 12px; }
  .cta { margin-top: 10px; padding: 11px; font-size: 16px; }
  .secondary { margin-top: 8px; padding: 8px; }
  #win .panel, #lose .panel { width: min(100%, 540px); display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 18px; align-items: center; }
  #win .panel > *, #lose .panel > * { grid-column: 2; }
  #win .panel > #win-art, #lose .panel > .emoji { grid-column: 1; grid-row: 1 / span 6; }
  #win .art { width: 120px; height: 120px; margin: 0; }
  #win .badge { justify-self: center; }
  #lose .emoji { font-size: 56px; }
  /* Menu becomes two columns: modes and options on the left, the mode's content on the right. */
  #menu .panel { width: min(100%, 780px); height: 100%; display: grid; grid-template-columns: minmax(230px, 38%) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "head body" "modes body" "opts body" "opts close"; column-gap: 16px; padding: 10px 12px; }
  .m-head { grid-area: head; }
  .modes { grid-area: modes; margin-top: 6px; }
  .modes button { padding: 4px 2px; font-size: 11px; }
  .modes button b { font-size: 15px; }
  .m-body { grid-area: body; margin: 0; padding: 2px 4px 4px; }
  .opts { grid-area: opts; margin-top: 8px; padding-top: 8px; overflow-y: auto; }
  #menu .secondary { grid-area: close; margin-top: 6px; }
  .field { margin-top: 6px; }
  .seg button { padding: 6px 2px; }
  .day { margin-top: 6px; padding: 8px 10px; }
  .week { margin-top: 6px; }
  .tgl { padding: 7px 4px; font-size: 12px; }
}
/* Landscape / short screens: HUD + controls in a side column, the puzzle gets the full height */
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .app { max-width: 1040px; display: grid; grid-template-columns: clamp(200px, 31vw, 270px) minmax(0, 1fr); grid-template-rows: auto auto auto 1fr; grid-template-areas: "top stage" "hud stage" "controls stage" ". stage"; gap: 8px 14px; padding: 6px max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left)); }
  .top { grid-area: top; flex-wrap: wrap; row-gap: 6px; padding-top: 4px; }
  h1 { font-size: 24px; }
  .new { padding: 8px 11px; font-size: 13px; }
  .hud { grid-area: hud; flex-wrap: wrap; gap: 6px; }
  .stat { flex: 1 1 28%; padding: 4px 3px; }
  .stat small { letter-spacing: 0; }
  .stat strong { font-size: 16px; }
  .hud .icon-btn { flex: 1 1 40%; width: auto; height: 36px; }
  .stage { grid-area: stage; height: 100%; }
  .board:focus-visible { outline-offset: 1px; }
  .controls { grid-area: controls; flex-wrap: wrap; gap: 6px; }
  .tools { flex: 1 1 100%; }
  .tools button { padding: 7px 4px; font-size: 14px; }
  .controls .icon-btn { flex: 1 1 40%; height: 38px; }
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>Nono<span>gram</span></h1>
    <span class="chip" id="chip"></span>
    <span class="spacer"></span>
    <button type="button" class="new" id="open-menu" data-i18n="puzzles"></button>
  </div>
  <div class="hud">
    <div class="stat"><small data-i18n="time"></small><strong id="time">0:00</strong></div>

    ['xmastree', '.......y......./......yyy....../.......g......./......ggg....../.....ggygg...../....ggggggg..../.....ggggg...../....gggggyg..../...gyggggggg.../..ggggggggggg../....ggggggg..../...gggyggggggg./.ggggggggyggggg/......nnn....../......nnn......'],
    ['pumpkin', '.......g......./......gg......./...ooooooooo.../.ooooooooooooo./ooooooooooooooo/ooookoooookoooo/oookkkoookkkooo/oooooookooooooo/ooooooooooooooo/ookoooooooookoo/ookkkkkkkkkkkoo/oookkokkkokkooo/.ooooooooooooo./..ooooooooooo../....ooooooo....'],
    ['flowerpot', '.....r.r.r...../.....rrrrr...../....rrrrrrr..../....rrrrrrr..../.....rrrrr...../......rrr....../.......g......./.ggg...g......./..ggg..g..ggg../....gggggggggg./nnnnnnnnnnnnnnn/.nnnnnnnnnnnnn./..nnnnnnnnnnn../..nnnnnnnnnnn../...nnnnnnnnn...'],
  ];
  const PALETTE = { k: '#34303f', w: '#ffffff', s: '#aab3c0', r: '#ef5a5a', p: '#ff9fbf', o: '#ff9f43', y: '#ffd447', n: '#9a6142', t: '#e9bf8c', g: '#45b36b', l: '#9edc6e', b: '#4a8fe7', c: '#8ad7f2', v: '#9b6bd6' };
  const FILL = '#2b3a56';
  const SIZES = [5, 10, 15, 20];
  const DIFFS = ['easy', 'medium', 'hard'];
  const DENSITY = { easy: .65, medium: .58, hard: .5 };
  const STYLES = ['zen', 'timed', 'lives'];
  const MODES = ['classic', 'endless', 'daily', 'color'];
  const KEY = 'milaan.nonogram.';
  const LONG_PRESS = 450, LIVES = 3, MIN_CELL = 20, MAX_CELL = 60;
  const EMPTY = 0, MARK = 9;

  const $ = id => document.getElementById(id);
  const els = { board: $('board'), wrap: $('wrap'), chip: $('chip'), time: $('time'), filled: $('filled'), mistakes: $('mistakes'), thirdLabel: $('third-label'), undo: $('undo'), redo: $('redo'), announcer: $('announcer'), tools: $('tools'), hint: $('hint'), hintCount: $('hint-count'), zoom: $('zoom'), zoomIn: $('zoom-in'), zoomOut: $('zoom-out'), menu: $('menu'), modes: $('modes'), tabs: $('tabs'), grid: $('grid'), cGrid: $('c-grid'), win: $('win'), winName: $('win-name'), winArt: $('win-art'), result: $('result'), newBest: $('new-best'), next: $('next'), lose: $('lose'), styleTip: $('style-tip'), optCheck: $('opt-check'), optAutoX: $('opt-autox') };

  // ---- Storage (every key lives under milaan.nonogram.*) ---------------------
  const load = (name, fallback) => { try { const v = JSON.parse(localStorage.getItem(KEY + name)); return v && typeof v === 'object' ? { ...fallback, ...v } : fallback; } catch { return fallback; } };
  const store = (name, value) => { try { localStorage.setItem(KEY + name, JSON.stringify(value)); } catch {} };
  // "progress" is the original classic save (solved times, boards in progress, last puzzle, check toggle).
  let progress = load('progress', { solved: {}, saves: {}, last: 0, check: false });
  let colorProg = load('color', { solved: {}, saves: {}, last: 0 });
  let endless = load('endless', { cur: null, stats: {} });
  let daily = load('daily', { streak: 0, best: 0, last: '', times: {}, save: null });
  let settings = load('settings', { mode: 'classic', style: 'timed', autoX: false, size: 10, diff: 'medium' });
  if (!STYLES.includes(settings.style)) settings.style = 'timed';
  if (!MODES.includes(settings.mode)) settings.mode = 'classic';
  const saveProgress = () => store('progress', progress);
  const saveSettings = () => store('settings', settings);

  const formatTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  // ---- Puzzles -----------------------------------------------------------------
  // A clue is a list of [colour, length] blocks; one-colour puzzles simply use colour 1.
  function cluesOf(line) {
    const out = []; let col = 0, run = 0;
    for (const v of line) {
      const c = v === MARK ? 0 : v;
      if (c && c === col) run++;
      else { if (col) out.push([col, run]); col = c; run = c ? 1 : 0; }
    }
    if (col) out.push([col, run]);
    return out;
  }

  function buildPuzzle(base, vals, colors, art) {
    const n = Math.round(Math.sqrt(vals.length));
    const rowClues = [], colClues = [];
    for (let i = 0; i < n; i++) {
      rowClues.push(cluesOf(vals.slice(i * n, i * n + n)));
      colClues.push(cluesOf(Array.from({ length: n }, (_, r) => vals[r * n + i])));
    }
    return { ...base, n, sol: vals, k: colors.length - 1, colors, art, rowClues, colClues, total: vals.filter(Boolean).length };
  }

  const classic = PUZZLES.map(([id, rows], index) => {
    const chars = rows.split('/').join('').split('');
    return buildPuzzle({ kind: 'classic', id, index }, Uint8Array.from(chars, ch => (ch === '.' ? 0 : 1)), [null, FILL], chars.map(ch => PALETTE[ch] || null));
  });
  const colored = COLOR_PUZZLES.map(([id, rows], index) => {
    const chars = rows.split('/').join('').split('');
    const letters = [...new Set(chars.filter(ch => ch !== '.'))];
    return buildPuzzle({ kind: 'color', id, index }, Uint8Array.from(chars, ch => letters.indexOf(ch) + 1), [null, ...letters.map(l => PALETTE[l])], chars.map(ch => PALETTE[ch] || null));
  });

  // Line solver over bit masks (bit 0 = empty, bit c = colour c); used to accept generated puzzles.
  function solveLine(clue, mask) {
    const n = mask.length, k = clue.length;
    const f = Array.from({ length: n + 1 }, () => new Uint8Array(k + 1));
    f[n][k] = 1;
    for (let i = n - 1; i >= 0; i--) f[i][k] = mask[i] & 1 && f[i + 1][k] ? 1 : 0;
    const place = (i, j) => {
      const [c, len] = clue[j], e = i + len, bit = 1 << c;
      if (e > n) return -1;
      for (let x = i; x < e; x++) if (!(mask[x] & bit)) return -1;
      if (j + 1 < k && clue[j + 1][0] === c) return e < n && mask[e] & 1 && f[e + 1][j + 1] ? e + 1 : -1;
      return f[e][j + 1] ? e : -1;
    };
    for (let j = k - 1; j >= 0; j--) for (let i = n - 1; i >= 0; i--) f[i][j] = (mask[i] & 1 && f[i + 1][j]) || place(i, j) >= 0 ? 1 : 0;
    if (!f[0][0]) return null;
    const poss = new Array(n).fill(0);
    const reach = Array.from({ length: n + 1 }, () => new Uint8Array(k + 1));
    reach[0][0] = 1;
    for (let i = 0; i < n; i++) for (let j = 0; j <= k; j++) {
      if (!reach[i][j] || !f[i][j]) continue;
      if (mask[i] & 1 && f[i + 1][j]) { poss[i] |= 1; reach[i + 1][j] = 1; }
      const next = j < k ? place(i, j) : -1;
      if (next >= 0) {
        const [c, len] = clue[j];
        for (let x = i; x < i + len; x++) poss[x] |= 1 << c;
        if (next > i + len) poss[i + len] |= 1;
        reach[next][j + 1] = 1;
      }
    }
    return poss;
  }

  function lineSolvable(p) {
    const { n } = p;
    const grid = new Array(n * n).fill((1 << (p.k + 1)) - 1);
    const dirty = new Uint8Array(2 * n).fill(1);
    for (let changed = true; changed;) {
      changed = false;
      for (let L = 0; L < 2 * n; L++) {
        if (!dirty[L]) continue;
        dirty[L] = 0;
        const row = L < n, x = L % n;
        const at = j => (row ? x * n + j : j * n + x);
        const line = Array.from({ length: n }, (_, j) => grid[at(j)]);
        const res = solveLine(row ? p.rowClues[x] : p.colClues[x], line);
        if (!res) return false;
        for (let j = 0; j < n; j++) if (res[j] !== line[j]) { grid[at(j)] = res[j]; dirty[row ? n + j : j] = 1; changed = true; }
      }
    }
    return grid.every(m => !(m & (m - 1)));
  }

  function rng(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hashString = s => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };

  // Random grids are kept only when line logic alone solves them, so the answer is unique.
  function generate(base, n, diff, seed) {
    const rand = rng(seed);
    const hue = Math.floor(rand() * 360);
    const art = Array.from({ length: n * n }, (_, i) => `hsl(${Math.round((hue + ((Math.floor(i / n) + (i % n)) * 140) / (2 * n)) % 360)}, 68%, 58%)`);
    for (let tries = 0; tries < 2000; tries++) {
      const vals = Uint8Array.from({ length: n * n }, () => (rand() < DENSITY[diff] ? 1 : 0));
      const p = buildPuzzle({ ...base, seed, diff }, vals, [null, FILL], art);
      if (p.total && lineSolvable(p)) return p;
    }
    return buildPuzzle({ ...base, seed, diff }, classic[0].sol, [null, FILL], classic[0].art);
  }

  const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const shiftDay = (key, days) => { const [y, m, d] = key.split('-').map(Number); return dayKey(new Date(y, m - 1, d + days)); };
  const dateOf = key => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); };
  const shortDate = key => new Intl.DateTimeFormat(htmlLang, { day: 'numeric', month: 'short' }).format(dateOf(key));
  // Weekend dailies are a bigger 15×15, weekdays a 10×10.
  const dailySize = key => ([0, 6].includes(dateOf(key).getDay()) ? 15 : 10);
  const dailyPuzzle = key => generate({ kind: 'daily', id: `daily-${key}`, date: key }, dailySize(key), 'medium', hashString(`nonogram:${key}`));
  const endlessPuzzle = (n, diff, seed) => generate({ kind: 'endless', id: `endless-${seed}` }, n, diff, seed);
  const liveStreak = () => (daily.last === dayKey() || daily.last === shiftDay(dayKey(), -1) ? daily.streak : 0);

  const textOn = hex => { const v = parseInt(hex.slice(1), 16); return ((v >> 16) * 299 + ((v >> 8) & 255) * 587 + (v & 255) * 114) / 1000 > 150 ? '#26344d' : '#fff'; };

  function pictureSVG(p) {
    const rects = [];
    p.sol.forEach((v, i) => {
      if (v) rects.push(`<rect x="${i % p.n}" y="${Math.floor(i / p.n)}" width="1.02" height="1.02" fill="${p.art[i]}"/>`);
    });
    return `<svg viewBox="0 0 ${p.n} ${p.n}" shape-rendering="crispEdges" aria-hidden="true">${rects.join('')}</svg>`;
  }

  const puzzleName = p => (p.kind === 'classic' ? t.names[p.index] : p.kind === 'color' ? t.cnames[p.index] : p.kind === 'daily' ? t.dailyName(shortDate(p.date)) : `${t.mEndless} ${dims(p.n, t.diffs[DIFFS.indexOf(p.diff)])}`);
  const setOf = p => (p.kind === 'classic' ? classic.filter(q => q.n === p.n) : colored);
  const puzzleNumber = p => setOf(p).indexOf(p) + 1;

  // ---- Saves -------------------------------------------------------------------
  // Classic boards keep the original "0/1/2" cell string (2 = cross); colour boards use "x" for a cross.
  const encode = (p, cells) => Array.from(cells, v => (v === MARK ? (p.k === 1 ? '2' : 'x') : v)).join('');
  const decode = (p, s) => Uint8Array.from(s, ch => (ch === 'x' || (p.k === 1 && ch === '2') ? MARK : +ch));

  function getSave(p) {
    if (p.kind === 'classic') return progress.saves[p.id];
    if (p.kind === 'color') return colorProg.saves[p.id];
    if (p.kind === 'endless') return endless.cur?.seed === p.seed ? endless.cur : null;
    return daily.save?.date === p.date ? daily.save : null;
  }

  function putSave(p, data) {
    if (p.kind === 'classic') { if (data) progress.saves[p.id] = data; else delete progress.saves[p.id]; saveProgress(); }
    else if (p.kind === 'color') { if (data) colorProg.saves[p.id] = data; else delete colorProg.saves[p.id]; store('color', colorProg); }
    else if (p.kind === 'endless') { endless.cur = data ? { seed: p.seed, n: p.n, d: p.diff, ...data } : null; store('endless', endless); }
    else { daily.save = data ? { date: p.date, ...data } : null; store('daily', daily); }
  }

  let mode = 'fill';
  let brush = 1;
  let game = null;
  let menuSize = 5;
  let menuMode = settings.mode;

  const style = () => settings.style;
  const checking = () => style() === 'lives' || (style() === 'timed' && progress.check);
  const hintLimit = n => (n <= 5 ? 1 : n <= 10 ? 2 : n <= 15 ? 3 : 4);

  // ---- Setup & rendering -------------------------------------------------------
  function startPuzzle(p) {
    const save = getSave(p);
    game = { p, cells: new Uint8Array(p.n * p.n), elapsed: 0, mistakes: 0, lives: LIVES, hints: hintLimit(p.n), hinted: new Set(), errs: new Set(), done: false, undo: [], redo: [], cursor: 0, stroke: null, started: false, zoom: 1 };
    if (save?.c?.length === p.n * p.n) {
      game.cells = decode(p, save.c);
      game.elapsed = save.t || 0;
      game.mistakes = save.m || 0;
      game.lives = save.l ?? LIVES;
      game.hints = save.h ?? game.hints;
      game.hinted = new Set(save.hi || []);
      game.started = true;
    }
    settings.mode = p.kind;
    saveSettings();
    if (p.kind === 'classic') { progress.last = p.index; saveProgress(); }
    if (p.kind === 'color') { colorProg.last = p.index; store('color', colorProg); }
    if (p.kind === 'endless' && !save) putSave(p, {});
    if (brush > p.k) brush = 1;
    buildTools();
    buildBoard();
    els.menu.hidden = true;
    els.win.hidden = true;
    els.lose.hidden = true;
    els.chip.textContent = chipText(p);
    els.time.textContent = style() === 'zen' ? '∞' : formatTime(game.elapsed);
    els.announcer.textContent = p.kind === 'classic' ? t.started(puzzleNumber(p), p.n) : t.startedOther(puzzleName(p), p.n);
  }

  function chipText(p) {
    if (p.kind === 'classic') return `${p.n}×${p.n} · #${puzzleNumber(p)}`;
    if (p.kind === 'color') return `🎨 ${p.n}×${p.n} · #${puzzleNumber(p)}`;
    if (p.kind === 'daily') return `📅 ${shortDate(p.date)} · ${p.n}×${p.n}`;
    return `♾️ ${dims(p.n, t.diffs[DIFFS.indexOf(p.diff)])}`;
  }

  function clueHTML(p, clue) {
    if (!clue.length) return '<span>0</span>';
    if (p.k === 1) return clue.map(([, len]) => `<span>${len}</span>`).join('');
    return clue.map(([c, len]) => `<span class="cl" style="--c:${p.colors[c]};--ct:${textOn(p.colors[c])}">${len}</span>`).join('');
  }

  const clueText = (p, clue) => (clue.length ? clue.map(([c, len]) => (p.k === 1 ? len : `${len} ${t.swatch(c)}`)).join(', ') : '0');

  function buildBoard() {
    const { p } = game;
    const { n } = p;
    const board = els.board;
    board.classList.remove('won', 'pan');
    board.classList.toggle('multi', p.k > 1);
    board.style.setProperty('--n', n);
    const parts = [];
    const corner = document.createElement('div');
    corner.className = 'corner';
    corner.innerHTML = '<canvas aria-hidden="true"></canvas>';
    parts.push(corner);
    game.colEls = p.colClues.map((clue, c) => {
      const el = document.createElement('div');
      el.className = 'cc';
      el.innerHTML = clueHTML(p, clue);
      el.setAttribute('aria-label', t.colClue(c + 1, clueText(p, clue)));
      parts.push(el);
      return el;
    });
    game.rowEls = [];
    game.cellEls = [];
    for (let r = 0; r < n; r++) {
      const rc = document.createElement('div');
      rc.className = 'rc';
      rc.innerHTML = clueHTML(p, p.rowClues[r]);
      rc.setAttribute('aria-label', t.rowClue(r + 1, clueText(p, p.rowClues[r])));
      game.rowEls.push(rc);
      parts.push(rc);
      for (let c = 0; c < n; c++) {
        const cell = document.createElement('div');
        const cls = ['cell'];
        if (c === 0) cls.push('c0');
        if (r === 0) cls.push('r0');
        if (c % 5 === 4 || c === n - 1) cls.push('c5');
        if (r % 5 === 4 || r === n - 1) cls.push('r5');
        cell.className = cls.join(' ');
        cell.id = `cell-${r * n + c}`;
        cell.dataset.i = r * n + c;
        cell.setAttribute('role', 'img');
        game.cellEls.push(cell);
        parts.push(cell);
      }
    }
    board.replaceChildren(...parts);
    game.preview = corner.firstChild;
    game.preview.width = game.preview.height = n;
    els.wrap.scrollLeft = els.wrap.scrollTop = 0;
    layout();
    paintAll();
    setCursor(0);
  }

  function buildTools() {
    const { p } = game;
    const buttons = [];
    if (p.k === 1) {
      buttons.push(toolButton('mode-fill', '<span class="ico-fill" aria-hidden="true"></span>', t.fill, () => setMode('fill')));
    } else {
      for (let c = 1; c <= p.k; c++) {
        const b = toolButton(`brush-${c}`, `<i style="--c:${p.colors[c]};--ct:${textOn(p.colors[c])}" aria-hidden="true">${c}</i>`, null, () => { brush = c; setMode('fill'); });
        b.classList.add('sw');
        b.setAttribute('aria-label', t.swatch(c));
        buttons.push(b);
      }
    }
    const mark = toolButton('mode-mark', '<span class="ico-x" aria-hidden="true">✕</span>', p.k === 1 ? t.mark : null, () => setMode('mark'));
    if (p.k > 1) { mark.classList.add('mk'); mark.setAttribute('aria-label', t.mark); }
    buttons.push(mark);
    els.tools.replaceChildren(...buttons);
    setMode(mode);
  }

  function toolButton(id, icon, label, onClick) {
    const b = document.createElement('button');
    b.type = 'button';
    b.id = id;
    b.innerHTML = icon + (label ? `<span>${label}</span>` : '');
    b.addEventListener('click', onClick);
    return b;
  }

  function setMode(next) {
    mode = next;
    for (const b of els.tools.children) {
      const on = b.id === 'mode-mark' ? next === 'mark' : next === 'fill' && (b.id === 'mode-fill' || b.id === `brush-${brush}`);
      b.setAttribute('aria-pressed', String(on));
    }
  }

  // Clue strip sizes in cell units: digits are about .3 cell wide at the clue font size.
  function rowUnits(p) {
    const per = p.k === 1 ? (len => String(len).length * .3 + .32) : (len => Math.max(.62, String(len).length * .3 + .16) + .1);
    return Math.max(1.2, ...p.rowClues.map(c => c.reduce((w, [, len]) => w + per(len), 0) + .45));
  }
  const colUnits = p => Math.max(1.2, ...p.colClues.map(c => Math.max(1, c.length) * (p.k === 1 ? .6 : .74) + .4));

  function layout() {
    if (!game) return;
    const { p } = game;
    const rw = rowUnits(p), ch = colUnits(p);
    let W = els.wrap.clientWidth;
    const H = els.wrap.clientHeight;
    if (!W || !H) return;
    const fitFor = w => Math.floor(Math.min(w / (p.n + rw), H / (p.n + ch), 52));
    // Big or cramped boards get zoom buttons in a strip to the right of the grid.
    const zoomable = (p.n >= 15 && fitFor(W) < 28) || fitFor(W) < MIN_CELL;
    els.wrap.classList.toggle('zoomable', zoomable);
    if (zoomable) W -= 50;
    const fit = fitFor(W);
    // Never shrink below a comfortable touch target; bigger boards pan instead.
    const base = Math.max(fit, MIN_CELL);
    game.maxZoom = Math.max(1, MAX_CELL / base);
    game.zoom = Math.min(Math.max(game.zoom, 1), game.maxZoom);
    const size = Math.round(base * game.zoom);
    game.size = size;
    const board = els.board;
    board.style.setProperty('--cell', `${size}px`);
    board.style.setProperty('--rw', `${Math.ceil(rw * size)}px`);
    board.style.setProperty('--ch', `${Math.ceil(ch * size)}px`);
    board.style.setProperty('--clue', `${Math.max(p.k === 1 ? 9 : 10, Math.round(size * (p.k === 1 ? .5 : .44)))}px`);
    const pan = Math.ceil(rw * size) + p.n * size > W + 1 || Math.ceil(ch * size) + p.n * size > H + 1;
    board.classList.toggle('pan', pan);
    els.zoom.hidden = !zoomable;
    els.zoomOut.disabled = game.zoom <= 1.001;
    els.zoomIn.disabled = game.zoom >= game.maxZoom - .001;
  }

  const panning = () => els.board.classList.contains('pan');

  // Zoom keeping the board point under (cx, cy) in place.
  function zoomTo(z, cx, cy) {
    if (!game) return;
    const before = els.board.getBoundingClientRect();
    const ox = cx - before.left, oy = cy - before.top, s0 = game.size;
    game.zoom = z;
    layout();
    const ratio = game.size / s0;
    const after = els.board.getBoundingClientRect();
    els.wrap.scrollLeft += after.left + ox * ratio - cx;
    els.wrap.scrollTop += after.top + oy * ratio - cy;
  }

  function zoomStep(dir) {
    const r = els.wrap.getBoundingClientRect();
    zoomTo(game.zoom * (dir > 0 ? 1.35 : 1 / 1.35), r.left + r.width / 2, r.top + r.height / 2);
  }

  function paintCell(i) {
    const { p } = game;
    const el = game.cellEls[i], v = game.cells[i];
    const filled = v >= 1 && v <= p.k;
    el.classList.toggle('f', filled);
    el.classList.toggle('x', v === MARK);
    el.classList.toggle('hinted', game.hinted.has(i));
    if (p.k > 1) { if (filled) el.style.setProperty('--fc', p.colors[v]); else el.style.removeProperty('--fc'); }
    if (!game.errs.has(i)) el.classList.remove('err');
    const r = Math.floor(i / p.n), c = i % p.n;
    const state = filled ? (p.k > 1 ? `${t.states[1]}, ${t.swatch(v)}` : t.states[1]) : t.states[v === MARK ? 2 : 0];
    el.setAttribute('aria-label', t.cell(r + 1, c + 1, state));
  }

  function paintAll() {
    game.cells.forEach((_, i) => paintCell(i));
    for (const i of game.errs) game.cellEls[i].classList.add('err');
    refresh();
  }

  const lineDone = (cells, clue) => { const got = cluesOf(cells); return got.length === clue.length && got.every(([c, l], i) => c === clue[i][0] && l === clue[i][1]); };
  const rowCells = (r) => game.cells.slice(r * game.p.n, (r + 1) * game.p.n);
  const colCells = (c) => Array.from({ length: game.p.n }, (_, r) => game.cells[r * game.p.n + c]);

  function refresh() {
    const { p, cells } = game;
    const { n } = p;
    for (let r = 0; r < n; r++) game.rowEls[r].classList.toggle('done', lineDone(rowCells(r), p.rowClues[r]));
    for (let c = 0; c < n; c++) game.colEls[c].classList.toggle('done', lineDone(colCells(c), p.colClues[c]));
    let count = 0;
    for (const v of cells) if (v >= 1 && v <= p.k) count++;
    els.filled.textContent = `${count}/${p.total}`;
    refreshHud();
    const ctx = game.preview.getContext('2d');
    ctx.clearRect(0, 0, n, n);
    cells.forEach((v, i) => { if (v >= 1 && v <= p.k) { ctx.fillStyle = p.colors[v]; ctx.fillRect(i % n, Math.floor(i / n), 1, 1); } });
  }

  function refreshHud() {
    const s = style();
    els.thirdLabel.textContent = s === 'lives' ? t.lives : t.mistakes;
    if (s === 'lives') {
      els.mistakes.classList.add('hearts');
      els.mistakes.innerHTML = Array.from({ length: LIVES }, (_, k) => `<i${k < game.lives ? '' : ' class="gone"'}>♥</i>`).join('');
      els.mistakes.setAttribute('aria-label', t.livesLeft(game.lives));
    } else {
      els.mistakes.classList.remove('hearts', 'hit');
      els.mistakes.removeAttribute('aria-label');
      els.mistakes.textContent = checking() ? String(game.mistakes) : '—';
    }
    els.undo.disabled = !game.undo.length || game.done;
    els.redo.disabled = !game.redo.length || game.done;
    els.hint.disabled = game.done || game.hints <= 0;
    els.hintCount.textContent = game.hints;
    els.hint.setAttribute('aria-label', t.hintBtn(game.hints));
    els.time.textContent = s === 'zen' ? '∞' : formatTime(game.elapsed);
  }

  function setCursor(i) {
    const { n } = game.p;
    game.cellEls[game.cursor]?.classList.remove('cursor');
    game.cursor = i;
    game.cellEls[i].classList.add('cursor');
    els.board.setAttribute('aria-activedescendant', game.cellEls[i].id);
    highlight(Math.floor(i / n), i % n);
  }

  function highlight(r, c) {
    game.rowEls.forEach((el, k) => el.classList.toggle('hl', k === r));
    game.colEls.forEach((el, k) => el.classList.toggle('hl', k === c));
  }

  // Scroll a zoomed board so a cell is not hidden under the pinned clue strips.
  function ensureVisible(i) {
    if (!panning()) return;
    const r = game.cellEls[i].getBoundingClientRect(), w = els.wrap.getBoundingClientRect();
    const left = game.rowEls[0].getBoundingClientRect().right, top = game.colEls[0].getBoundingClientRect().bottom;
    if (r.left < left) els.wrap.scrollLeft -= left - r.left;
    else if (r.right > w.right) els.wrap.scrollLeft += r.right - w.right;
    if (r.top < top) els.wrap.scrollTop -= top - r.top;
    else if (r.bottom > w.bottom) els.wrap.scrollTop += r.bottom - w.bottom;
  }

  // ---- Strokes: one tap or drag is one undoable change -------------------------
  function targetFor(value, strokeMode) {
    if (strokeMode === 'mark') return value === EMPTY ? MARK : EMPTY;
    return value === brush ? EMPTY : value === MARK ? EMPTY : brush;
  }

  function beginStroke(i, strokeMode) {
    const from = game.cells[i];
    game.stroke = { start: i, from, to: targetFor(from, strokeMode), axis: null, changes: new Map(), stopped: false };
    applyTo(i);
  }

  function setCell(i, v, changes) {
    if (game.cells[i] === v) return;
    const prev = changes.get(i);
    changes.set(i, [prev ? prev[0] : game.cells[i], v]);
    game.cells[i] = v;
    paintCell(i);
  }

  function applyTo(i) {
    const s = game.stroke;
    if (s.stopped || s.changes.has(i) || game.cells[i] !== s.from || game.hinted.has(i)) return;
    let to = s.to;
    const { p } = game;
    if (to >= 1 && to <= p.k && checking() && p.sol[i] !== to) {
      // Wrong fill: show the right answer in red, count it and stop the drag there.
      to = p.sol[i] || MARK;
      s.stopped = true;
      game.errs.add(i);
      penalty(i);
    }
    setCell(i, to, s.changes);
    if (game.errs.has(i)) game.cellEls[i].classList.add('err');
    if (!game.started) game.started = true;
  }

  function penalty(i) {
    game.mistakes++;
    if (style() === 'lives') {
      game.lives = Math.max(0, game.lives - 1);
      els.mistakes.classList.remove('hit');
      void els.mistakes.offsetWidth;
      els.mistakes.classList.add('hit');
      els.announcer.textContent = t.lifeLost(game.lives);
      navigator.vibrate?.(40);
    } else {
      els.announcer.textContent = game.p.sol[i] ? t.mistakeColor : t.mistake;
    }
  }

  function extendStroke(i) {
    const s = game.stroke;
    if (!s || i === s.start) return;
    const { n } = game.p;
    const sr = Math.floor(s.start / n), sc = s.start % n, r = Math.floor(i / n), c = i % n;
    s.axis ||= sr === r ? 'row' : sc === c ? 'col' : Math.abs(c - sc) >= Math.abs(r - sr) ? 'row' : 'col';
    // Locked to the first direction dragged, so a wobbly finger still paints a straight line.
    if (s.axis === 'row') { const step = Math.sign(c - sc); for (let k = sc; k !== c + step; k += step) applyTo(sr * n + k); highlight(sr, c); }
    else { const step = Math.sign(r - sr); for (let k = sr; k !== r + step; k += step) applyTo(k * n + sc); highlight(r, sc); }
  }

  function endStroke() {
    const s = game.stroke;
    game.stroke = null;
    if (!s || !s.changes.size) return;
    commit(s.changes);
  }

  // Record a change set (adding auto-crosses), then check for a win or a loss.
  function commit(changes) {
    autoCross(changes);
    if (changes.size) {
      game.undo.push(changes);
      if (game.undo.length > 300) game.undo.shift();
      game.redo = [];
    }
    afterChange();
  }

  function autoCross(changes) {
    if (!settings.autoX) return;
    const { p } = game;
    const { n } = p;
    for (let r = 0; r < n; r++) if (lineDone(rowCells(r), p.rowClues[r])) for (let c = 0; c < n; c++) if (game.cells[r * n + c] === EMPTY) setCell(r * n + c, MARK, changes);
    for (let c = 0; c < n; c++) if (lineDone(colCells(c), p.colClues[c])) for (let r = 0; r < n; r++) if (game.cells[r * n + c] === EMPTY) setCell(r * n + c, MARK, changes);
  }

  function afterChange() {
    refresh();
    if (isSolved()) win();
    else if (style() === 'lives' && game.lives <= 0) lose();
    else save();
  }

  const isSolved = () => game.p.sol.every((v, i) => (game.cells[i] === MARK ? 0 : game.cells[i]) === v);

  function save() {
    if (game.done) return;
    putSave(game.p, { c: encode(game.p, game.cells), t: Math.floor(game.elapsed), m: game.mistakes, l: game.lives, h: game.hints, hi: [...game.hinted] });
  }

  function undo() {
    if (!game.undo.length || game.done) return;
    const changes = game.undo.pop();
    for (const [i, [before]] of changes) if (!game.hinted.has(i)) { game.cells[i] = before; game.errs.delete(i); paintCell(i); }
    game.redo.push(changes);
    afterChange();
  }

  function redo() {
    if (!game.redo.length || game.done) return;
    const changes = game.redo.pop();
    for (const [i, [, after]] of changes) if (!game.hinted.has(i)) { game.cells[i] = after; paintCell(i); }
    game.undo.push(changes);
    afterChange();
  }

  function clearBoard() {
    if (game.done) return;
    const changes = new Map();
    game.cells.forEach((v, i) => { if (v !== EMPTY && !game.hinted.has(i)) changes.set(i, [v, EMPTY]); });
    if (!changes.size) return;
    for (const i of changes.keys()) game.cells[i] = EMPTY;
    game.undo.push(changes);
    game.redo = [];
    game.errs.clear();
    paintAll();
    save();
    els.announcer.textContent = t.cleared;
  }

  // Hints reveal one square the board still gets wrong: a wrong fill first, else a missing fill.
  function useHint() {
    if (!game || game.done || game.hints <= 0) { if (game && !game.done) els.announcer.textContent = t.noHints; return; }
    const { p, cells } = game;
    const wrong = [], missing = [];
    p.sol.forEach((v, i) => {
      const got = cells[i] === MARK ? 0 : cells[i];
      if (got === v || game.hinted.has(i)) return;
      (got && got !== v ? wrong : missing).push(i);
    });
    const pool = wrong.length ? wrong : missing;
    if (!pool.length) return;
    let i = pool[Math.floor(Math.random() * pool.length)];
    // Prefer a square next to the cursor's row or column so the hint lands where the player looks.
    const near = pool.filter(k => Math.floor(k / p.n) === Math.floor(game.cursor / p.n) || k % p.n === game.cursor % p.n);
    if (near.length) i = near[Math.floor(Math.random() * near.length)];
    game.hints--;
    game.hinted.add(i);
    game.errs.delete(i);
    game.cells[i] = p.sol[i] || MARK;
    if (!game.started) game.started = true;
    paintCell(i);
    game.cellEls[i].classList.remove('pop');
    void game.cellEls[i].offsetWidth;
    game.cellEls[i].classList.add('pop');
    setCursor(i);
    ensureVisible(i);
    els.announcer.textContent = t.hintGiven(Math.floor(i / p.n) + 1, (i % p.n) + 1);
    const changes = new Map();
    autoCross(changes);
    if (changes.size) game.undo.push(changes);
    afterChange();
  }

  // ---- Win / lose ----------------------------------------------------------------
  function win() {
    game.done = true;
    const { p } = game;
    const n = p.n;
    const time = Math.floor(game.elapsed);
    const zen = style() === 'zen';
    let better = false, badge = '';
    const record = book => {
      const prev = book.solved[p.id];
      if (prev === undefined || (!zen && time < prev)) book.solved[p.id] = time;
      better = !zen && prev !== undefined && time < prev;
    };
    if (p.kind === 'classic') record(progress);
    if (p.kind === 'color') record(colorProg);
    if (p.kind === 'endless') {
      const key = `${p.n}-${p.diff}`;
      const st = endless.stats[key] || { s: 0, b: null };
      st.s++;
      if (!zen) { better = st.b !== null && time < st.b; if (st.b === null || time < st.b) st.b = time; }
      endless.stats[key] = st;
    }
    if (p.kind === 'daily' && daily.times[p.date] === undefined) {
      daily.times[p.date] = time;
      const keys = Object.keys(daily.times).sort();
      for (const k of keys.slice(0, Math.max(0, keys.length - 40))) delete daily.times[k];
      if (p.date === dayKey()) {
        daily.streak = daily.last === shiftDay(p.date, -1) ? daily.streak + 1 : daily.last === p.date ? daily.streak : 1;
        daily.best = Math.max(daily.best || 0, daily.streak);
        daily.last = p.date;
        badge = t.streakUp(daily.streak);
      }
    }
    putSave(p, null);
    if (p.kind === 'color') store('color', colorProg);
    game.cells.forEach((v, i) => {
      const el = game.cellEls[i];
      el.classList.remove('cursor', 'err', 'hinted');
      el.style.setProperty('--d', `${(Math.floor(i / n) + (i % n)) * 22}ms`);
      if (v >= 1 && v <= p.k) el.style.backgroundColor = p.art[i];
    });
    els.board.classList.add('won');
    highlight(-1, -1);
    refresh();
    const name = puzzleName(p);
    els.winName.textContent = name;
    els.winArt.innerHTML = pictureSVG(p).replace('<svg', '<svg class="art"');
    els.result.textContent = zen ? t.zenResult : t.result(formatTime(time), checking() ? game.mistakes : null);
    if (better) badge = t.newBest;
    els.newBest.textContent = badge;
    els.newBest.hidden = !badge;
    const next = nextPuzzle(p);
    els.next.hidden = !next;
    els.next.textContent = p.kind === 'endless' ? t.newPuzzle : t.next;
    els.announcer.textContent = `${t.won} ${name}. ${els.result.textContent} ${badge}`;
    setTimeout(() => { if (game.p === p && els.menu.hidden) { els.win.hidden = false; (next ? els.next : $('to-menu')).focus({ preventScroll: true }); } }, 2 * n * 22 + 900);
  }

  function lose() {
    game.done = true;
    game.lost = true;
    putSave(game.p, null);
    refresh();
    els.announcer.textContent = `${t.lost} ${t.lostText}`;
    const { p } = game;
    setTimeout(() => { if (game.p === p && game.lost && els.menu.hidden) { els.lose.hidden = false; $('retry').focus({ preventScroll: true }); } }, 700);
  }

  function retry() {
    const { p } = game;
    putSave(p, null);
    if (p.kind === 'endless') putSave(p, {});
    startPuzzle(p);
    els.board.focus({ preventScroll: true });
  }

  // The puzzle the win panel's main button starts, or null.
  function nextPuzzle(p) {
    if (p.kind === 'endless') return () => endlessPuzzle(settings.size, settings.diff, newSeed());
    if (p.kind === 'daily') return null;
    const list = p.kind === 'classic' ? classic : colored;
    const book = p.kind === 'classic' ? progress : colorProg;
    for (let k = 1; k <= list.length; k++) {
      const q = list[(p.index + k) % list.length];
      if (book.solved[q.id] === undefined) return () => q;
    }
    return null;
  }

  const newSeed = () => (Math.random() * 4294967296) >>> 0;

  // ---- Menu ----------------------------------------------------------------------
  function openMenu(which = menuMode) {
    menuMode = which;
    for (const b of els.modes.children) b.setAttribute('aria-pressed', String(b.dataset.mode === which));
    for (const m of MODES) $(`sec-${m}`).hidden = m !== which;
    if (which === 'classic') renderClassic(game?.p.kind === 'classic' ? game.p.n : menuSize);
    if (which === 'color') renderColor();
    if (which === 'endless') renderEndless();
    if (which === 'daily') renderDaily();
    renderOptions();
    els.win.hidden = true;
    els.lose.hidden = true;
    els.menu.hidden = false;
    $('m-body').scrollTop = 0;
    ($(`sec-${which}`).querySelector('.pz.current') || els.modes.querySelector('[aria-pressed="true"]')).focus({ preventScroll: true });
  }

  function renderClassic(size) {
    menuSize = size;
    els.tabs.replaceChildren(...SIZES.map(n => {
      const b = document.createElement('button');
      b.type = 'button';
      const set = classic.filter(q => q.n === n);
      const done = set.filter(q => progress.solved[q.id] !== undefined).length;
      b.innerHTML = `${n}×${n}<small>${t.solvedOf(done, set.length)}</small>`;
      b.setAttribute('aria-pressed', String(n === size));
      b.addEventListener('click', () => { renderClassic(n); b.focus({ preventScroll: true }); });
      return b;
    }));
    els.grid.replaceChildren(...classic.filter(q => q.n === size).map((q, k) => tile(q, k, progress)));
  }

  function renderColor() {
    els.cGrid.replaceChildren(...colored.map((q, k) => tile(q, k, colorProg)));
  }

  function tile(q, k, book) {
    const b = document.createElement('button');
    b.type = 'button';
    const solved = book.solved[q.id] !== undefined;
    const saved = book.saves[q.id];
    b.className = `pz${solved ? ' solved' : ''}${game?.p === q ? ' current' : ''}`;
    const extra = q.kind === 'color' ? `<span class="sz" aria-hidden="true">${q.n}</span>${solved ? '' : `<span class="dots" aria-hidden="true">${q.colors.slice(1).map(c => `<i style="--c:${c}"></i>`).join('')}</span>`}` : '';
    b.innerHTML = (solved ? `${pictureSVG(q)}<span class="tick" aria-hidden="true">✓</span>` : `<span>${k + 1}</span>${saved ? '<i class="dot" aria-hidden="true"></i>' : ''}`) + extra;
    b.setAttribute('aria-label', `${t.puzzle(k + 1)}, ${q.n}×${q.n}, ${solved ? t.solvedAs(puzzleName(q)) : saved ? t.inProgress : t.unsolved}`);
    b.addEventListener('click', () => play(q));
    return b;
  }

  function play(p) {
    startPuzzle(p);
    els.board.focus({ preventScroll: true });
  }

  function segButtons(host, items, current, onPick) {
    host.replaceChildren(...items.map(([value, label]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('aria-pressed', String(value === current));
      b.addEventListener('click', () => { onPick(value); host.querySelectorAll('button')[items.findIndex(it => it[0] === value)]?.focus({ preventScroll: true }); });
      return b;
    }));
  }

  function renderEndless() {
    segButtons($('e-size'), SIZES.map(n => [n, `${n}×${n}`]), settings.size, n => { settings.size = n; saveSettings(); renderEndless(); });
    segButtons($('e-diff'), DIFFS.map((d, k) => [d, t.diffs[k]]), settings.diff, d => { settings.diff = d; saveSettings(); renderEndless(); });
    const st = endless.stats[`${settings.size}-${settings.diff}`] || { s: 0, b: null };
    $('e-stats').textContent = t.endlessStats(st.s, st.b === null ? '—' : formatTime(st.b));
    const cur = endless.cur;
    const resume = $('e-resume');
    resume.hidden = !cur?.seed;
    if (cur?.seed) resume.textContent = `${t.resume} · ${dims(cur.n, t.diffs[DIFFS.indexOf(cur.d)])}`;
    $('e-new').className = cur?.seed ? 'secondary' : 'cta';
  }

  function renderDaily() {
    const today = dayKey();
    const date = dateOf(today);
    $('d-month').textContent = new Intl.DateTimeFormat(htmlLang, { month: 'short' }).format(date);
    $('d-day').textContent = date.getDate();
    $('d-streak').textContent = `🔥 ${t.streak(liveStreak())}`;
    $('d-best').textContent = `${t.bestStreak(daily.best || 0)} · ${dailySize(today)}×${dailySize(today)}`;
    const weekday = new Intl.DateTimeFormat(htmlLang, { weekday: 'narrow' });
    $('d-week').replaceChildren(...Array.from({ length: 7 }, (_, k) => {
      const key = shiftDay(today, k - 6);
      const s = document.createElement('span');
      s.textContent = weekday.format(dateOf(key));
      if (daily.times[key] !== undefined) s.classList.add('on');
      if (k === 6) s.classList.add('today');
      return s;
    }));
    const done = daily.times[today];
    $('d-status').textContent = done === undefined ? t.dailyTodo : t.dailyDone(formatTime(done));
    $('d-play').textContent = done === undefined ? t.playDaily : t.replay;
  }

  function renderOptions() {
    for (const b of $('style').children) b.setAttribute('aria-pressed', String(b.dataset.style === style()));
    els.styleTip.textContent = t.styleTips[STYLES.indexOf(style())];
    els.optCheck.hidden = style() !== 'timed';
    els.optCheck.setAttribute('aria-pressed', String(progress.check));
    els.optAutoX.setAttribute('aria-pressed', String(!!settings.autoX));
  }

  function closeMenu() {
    els.menu.hidden = true;
    if (game.done) {
      const next = nextPuzzle(game.p);
      if (game.lost || !next) startPuzzle(game.p);
      else startPuzzle(next());
    }
    els.board.focus({ preventScroll: true });
  }

  function setStyle(next) {
    settings.style = next;
    saveSettings();
    renderOptions();
    if (game) { if (next === 'lives' && game.lives <= 0) game.lives = LIVES; refresh(); }
  }

  // ---- Timer -----------------------------------------------------------------------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last);
    last = now;
    if (game && game.started && !game.done && !document.hidden && els.menu.hidden) {
      game.elapsed += dt;
      if (style() !== 'zen') els.time.textContent = formatTime(game.elapsed);
    }
    edgeScroll();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { last = performance.now(); if (document.hidden && game && !game.done && game.started) save(); });

  // ---- Pointer input -----------------------------------------------------------------
  const canPlay = () => game && !game.done && els.menu.hidden && els.win.hidden && els.lose.hidden;
  const pointers = new Map();
  let press = null;
  let gesture = null;

  function cellAt(x, y) {
    const first = game.cellEls[0].getBoundingClientRect();
    const size = first.width;
    if (panning()) {
      const w = els.wrap.getBoundingClientRect();
      if (x < game.rowEls[0].getBoundingClientRect().right || y < game.colEls[0].getBoundingClientRect().bottom || x > w.right || y > w.bottom) return -1;
    }
    const c = Math.floor((x - first.left) / size), r = Math.floor((y - first.top) / size);
    const { n } = game.p;
    if (r < 0 || r >= n || c < 0 || c >= n) return -1;
    return r * n + c;
  }

  // While a drag reaches the edge of a zoomed board, keep scrolling and painting.
  function edgeScroll() {
    if (!press?.began || !game?.stroke || !panning()) return;
    const w = els.wrap.getBoundingClientRect();
    const left = game.rowEls[0].getBoundingClientRect().right, top = game.colEls[0].getBoundingClientRect().bottom;
    const edge = Math.max(14, game.size * .6);
    const dx = press.x < left + edge ? -1 : press.x > w.right - edge ? 1 : 0;
    const dy = press.y < top + edge ? -1 : press.y > w.bottom - edge ? 1 : 0;
    if (!dx && !dy) return;
    els.wrap.scrollLeft += dx * 6;
    els.wrap.scrollTop += dy * 6;
    const i = cellAt(Math.min(Math.max(press.x, left + 1), w.right - 1), Math.min(Math.max(press.y, top + 1), w.bottom - 1));
    if (i >= 0) extendStroke(i);
  }

  function dropPress() {
    if (!press) return;
    clearTimeout(press.timer);
    if (press.began) endStroke();
    press = null;
  }

  els.wrap.addEventListener('pointerdown', event => {
    if (!game) return;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    try { els.wrap.setPointerCapture(event.pointerId); } catch {}
    if (pointers.size === 2) {
      // Second finger: pinch to zoom and pan with two fingers.
      dropPress();
      const [a, b] = [...pointers.values()];
      gesture = { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: game.zoom, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      return;
    }
    if (pointers.size > 2 || press) return;
    const i = canPlay() ? cellAt(event.clientX, event.clientY) : -1;
    if (i < 0) {
      if (panning()) gesture = { type: 'pan', x: event.clientX, y: event.clientY };
      return;
    }
    event.preventDefault();
    els.board.classList.remove('kb');
    if (document.activeElement !== els.board) els.board.focus({ preventScroll: true });
    setCursor(i);
    const strokeMode = event.button === 2 ? 'mark' : mode;
    press = { id: event.pointerId, i, x: event.clientX, y: event.clientY, began: false, timer: 0, mode: strokeMode };
    if (event.pointerType === 'mouse') { beginStroke(i, strokeMode); press.began = true; return; }
    // Touch and pen wait a moment so a long-press can become a cross-out instead.
    press.timer = setTimeout(() => {
      if (!press || press.began) return;
      beginStroke(press.i, 'mark');
      press.began = true;
      navigator.vibrate?.(15);
    }, LONG_PRESS);
  });

  els.wrap.addEventListener('pointermove', event => {
    const pt = pointers.get(event.pointerId);
    if (!pt) return;
    const px = pt.x, py = pt.y;
    pt.x = event.clientX; pt.y = event.clientY;
    if (gesture?.type === 'pinch' && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      zoomTo(gesture.z * Math.hypot(a.x - b.x, a.y - b.y) / gesture.d, mx, my);
      els.wrap.scrollLeft -= mx - gesture.mx;
      els.wrap.scrollTop -= my - gesture.my;
      gesture.mx = mx; gesture.my = my;
      return;
    }
    if (gesture?.type === 'pan') { els.wrap.scrollLeft -= event.clientX - px; els.wrap.scrollTop -= event.clientY - py; return; }
    if (!press || press.id !== event.pointerId) return;
    press.x = event.clientX; press.y = event.clientY;
    const i = cellAt(event.clientX, event.clientY);
    if (!press.began) {
      if (i === press.i || i < 0) return;
      clearTimeout(press.timer);
      beginStroke(press.i, press.mode);
      press.began = true;
    }
    if (i >= 0) extendStroke(i);
  });

  function release(event) {
    pointers.delete(event.pointerId);
    if (gesture && (gesture.type === 'pan' || pointers.size < 2)) gesture = null;
    if (!press || press.id !== event.pointerId) return;
    clearTimeout(press.timer);
    if (!press.began && event.type === 'pointerup') beginStroke(press.i, press.mode);
    press = null;
    endStroke();
  }
  els.wrap.addEventListener('pointerup', release);
  els.wrap.addEventListener('pointercancel', release);
  els.wrap.addEventListener('contextmenu', event => event.preventDefault());
  els.wrap.addEventListener('wheel', event => {
    if (!game) return;
    if (event.ctrlKey) { event.preventDefault(); zoomTo(game.zoom * Math.exp(-event.deltaY * .01), event.clientX, event.clientY); return; }
    if (!panning()) return;
    event.preventDefault();
    els.wrap.scrollLeft += event.shiftKey ? event.deltaY : event.deltaX;
    els.wrap.scrollTop += event.shiftKey ? 0 : event.deltaY;
  }, { passive: false });

  // ---- Keyboard ----------------------------------------------------------------------
  els.board.addEventListener('keydown', event => {
    if (!canPlay() || event.altKey || event.metaKey || event.ctrlKey) return;
    const { n, k } = game.p;
    const r = Math.floor(game.cursor / n), c = game.cursor % n;
    const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    els.board.classList.add('kb');
    if (moves[event.key]) {
      event.preventDefault();
      const [dr, dc] = moves[event.key];
      const nr = Math.min(n - 1, Math.max(0, r + dr)), nc = Math.min(n - 1, Math.max(0, c + dc));
      setCursor(nr * n + nc);
      ensureVisible(game.cursor);
      // Shift + arrow paints as you go, like a drag.
      if (event.shiftKey && game.cursor !== r * n + c) {
        if (!game.stroke) beginStroke(r * n + c, mode);
        game.stroke.start = r * n + c; game.stroke.axis = null;
        extendStroke(game.cursor);
      }
      return;
    }
    if (k > 1 && /^[1-3]$/.test(event.key) && +event.key <= k) { event.preventDefault(); brush = +event.key; setMode('fill'); return; }
    if (event.key === '+' || event.key === '=' || event.key === '-') { if (els.zoom.hidden) return; event.preventDefault(); zoomStep(event.key === '-' ? -1 : 1); ensureVisible(game.cursor); return; }
    if (event.key === 'h' || event.key === 'H') { event.preventDefault(); useHint(); return; }
    const keyMode = event.key === ' ' || event.key === 'Enter' ? mode : event.key === 'x' || event.key === 'X' ? 'mark' : null;
    if (!keyMode) return;
    event.preventDefault();
    beginStroke(game.cursor, keyMode);
    endStroke();
    const v = game.cells[game.cursor];
    els.announcer.textContent = t.states[v === MARK ? 2 : v ? 1 : 0];
  });
  els.board.addEventListener('keyup', event => { if (event.key === 'Shift' && game?.stroke && !press) endStroke(); });
  document.addEventListener('keydown', event => {
    if (!(event.ctrlKey || event.metaKey) || !canPlay()) return;
    const key = event.key.toLowerCase();
    if (key === 'z' && !event.shiftKey) { event.preventDefault(); undo(); }
    else if (key === 'y' || (key === 'z' && event.shiftKey)) { event.preventDefault(); redo(); }
  });

  // ---- Buttons -----------------------------------------------------------------------
  els.undo.addEventListener('click', undo);
  els.redo.addEventListener('click', redo);
  els.hint.addEventListener('click', useHint);
  $('clear').addEventListener('click', clearBoard);
  els.zoomIn.addEventListener('click', () => zoomStep(1));
  els.zoomOut.addEventListener('click', () => zoomStep(-1));
  $('open-menu').addEventListener('click', () => openMenu(game?.p.kind || menuMode));
  $('close-menu').addEventListener('click', closeMenu);
  $('to-menu').addEventListener('click', () => openMenu(game.p.kind));
  $('lose-menu').addEventListener('click', () => openMenu(game.p.kind));
  $('retry').addEventListener('click', retry);
  els.next.addEventListener('click', () => { const next = nextPuzzle(game.p); if (next) play(next()); });
  for (const b of els.modes.children) b.addEventListener('click', () => { openMenu(b.dataset.mode); b.focus({ preventScroll: true }); });
  for (const b of $('style').children) b.addEventListener('click', () => setStyle(b.dataset.style));
  els.optCheck.addEventListener('click', () => { progress.check = !progress.check; saveProgress(); renderOptions(); if (game) refresh(); });
  els.optAutoX.addEventListener('click', () => { settings.autoX = !settings.autoX; saveSettings(); renderOptions(); });
  $('e-new').addEventListener('click', () => play(endlessPuzzle(settings.size, settings.diff, newSeed())));
  $('e-resume').addEventListener('click', () => { const cur = endless.cur; if (cur?.seed) play(endlessPuzzle(cur.n, cur.d, cur.seed)); });
  $('d-play').addEventListener('click', () => {
    play(dailyPuzzle(dayKey()));
  });
  new ResizeObserver(() => layout()).observe(els.wrap);

  // Resume whatever was played last, behind the menu.
  function resume() {
    const m = settings.mode;
    if (m === 'color') return startPuzzle(colored[Math.min(colorProg.last || 0, colored.length - 1)]);
    if (m === 'endless' && endless.cur?.seed) return startPuzzle(endlessPuzzle(endless.cur.n, endless.cur.d, endless.cur.seed));
    if (m === 'daily') return startPuzzle(dailyPuzzle(dayKey()));
    startPuzzle(classic[Math.min(progress.last || 0, classic.length - 1)]);
  }
  resume();
  openMenu(game.p.kind);
})();
</script>
</body>
</html>
