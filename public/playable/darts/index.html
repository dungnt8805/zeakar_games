<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darts</title>
<style>
:root {
  --bg: #120e14;
  --text: #f8f1e7;
  --muted: #b9a99a;
  --amber: #ffb627;
  --amber-dark: #c27c06;
  --red: #e2334a;
  --green: #18a058;
  --panel: #fff8ec;
  --ink: #2b1d14;
  --ink-muted: #7d6a58;
  --line: #ecdcc4;
  --p1: #ff5d5d;
  --p2: #3ec1ff;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(120% 90% at 50% 35%, #3a2330, var(--bg) 72%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: grid; grid-template-areas: "side" "stage"; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
.side { grid-area: side; min-width: 0; min-height: 0; width: 100%; max-width: 560px; justify-self: center; display: flex; flex-direction: column; gap: 5px; }
.logo-side { display: none; align-items: center; gap: 9px; font-size: 22px; font-weight: 900; letter-spacing: -.02em; }
.topbar { display: flex; align-items: center; gap: 6px; min-height: 38px; }
.ibtn { flex: none; width: 40px; height: 38px; border-radius: 12px; background: #ffffff14; box-shadow: inset 0 0 0 1px #ffffff1c; display: grid; place-items: center; font-size: 18px; font-weight: 900; line-height: 1; }
.ibtn:active { transform: translateY(1px); background: #ffffff22; }
.ibtn[aria-pressed="false"] { opacity: .55; }
.lbl { flex: 1; min-width: 0; display: grid; justify-items: center; text-align: center; line-height: 1.15; }
.lbl strong { font-size: 15px; font-weight: 900; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbl small { font-size: 12px; font-weight: 800; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbl small:empty { display: none; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 5px; }
.cards:empty { display: none; }
.card { position: relative; min-width: 0; padding: 4px 9px 5px; border-radius: 13px; background: #ffffff0d; box-shadow: inset 0 0 0 1px #ffffff14; line-height: 1.15; }
.card.on { background: color-mix(in srgb, var(--pc) 14%, transparent); box-shadow: inset 0 0 0 2px var(--pc); }
.ch { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ch i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--pc); }
.ch span { flex: 1; min-width: 0; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch em { flex: none; font-style: normal; font-size: 11px; letter-spacing: 1px; color: var(--amber); }
.card b { display: block; font-size: 27px; font-weight: 900; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.card small { display: block; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small.co { color: var(--amber); }

.cric { display: grid; grid-template-columns: 18px repeat(7, minmax(0, 1fr)); gap: 2px; padding: 4px 6px; border-radius: 12px; background: #ffffff0a; box-shadow: inset 0 0 0 1px #ffffff12; text-align: center; font-variant-numeric: tabular-nums; }
.cric[hidden] { display: none; }
.cric span { display: grid; place-items: center; min-height: 20px; font-size: 15px; font-weight: 900; line-height: 1; }
.cric .hd { font-size: 12px; color: var(--muted); }
.cric .hd.dead { text-decoration: line-through; opacity: .5; }
.cric .pd { width: 9px; height: 9px; border-radius: 50%; background: var(--pc); justify-self: center; align-self: center; min-height: 0; }
.cric .mk.dead { opacity: .4; }

.turn { display: flex; align-items: center; gap: 5px; min-height: 32px; }
.slot { flex: 1 1 0; min-width: 0; height: 30px; border-radius: 10px; display: grid; place-items: center; background: #ffffff0a; box-shadow: inset 0 0 0 1px #ffffff14; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; overflow: hidden; }
.slot.next { box-shadow: inset 0 0 0 2px var(--amber); color: var(--amber); }
.slot.done { background: #ffffff16; color: var(--text); }
.slot.miss { color: #ff8f8f; }
.tot { flex: 0 0 auto; min-width: 54px; height: 30px; padding: 0 8px; border-radius: 10px; display: grid; place-items: center; background: var(--amber); color: var(--ink); font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
.tot:empty { display: none; }
.tot.bust { background: var(--red); color: #fff; }
.log { display: none; margin: 0; padding: 0; list-style: none; min-height: 0; flex: 1 1 auto; overflow: hidden; }
.log li { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto 3.2em; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 9px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.log li:nth-child(odd) { background: #ffffff08; }
.log li i { width: 9px; height: 9px; border-radius: 50%; background: var(--pc); }
.log .ld { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log b { color: var(--amber); }
.log b.bust { color: #ff6b7d; }
.log .la { text-align: right; }
.help { display: none; margin-top: auto; padding: 8px 10px; border-radius: 12px; background: #ffffff0a; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--muted); }

.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; border-radius: 16px; overflow: hidden; background: radial-gradient(75% 75% at 50% 50%, #4a2c35, #1c1218 80%); box-shadow: inset 0 0 0 1px #ffffff14; container-type: size; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
#cv:focus-visible { outline: none; }
.stage:has(#cv:focus-visible) { box-shadow: inset 0 0 0 3px #ffb62799; }
.prompt { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); max-width: calc(100% - 16px); width: max-content; padding: 4px 12px; border-radius: 99px; background: #120e14cc; font-size: 12px; font-weight: 800; color: #f3e6d6; text-align: center; pointer-events: none; transition: opacity .25s; }
.prompt:empty { opacity: 0; }
.banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.7); width: max-content; max-width: calc(100% - 20px); padding: 12px 22px; border-radius: 20px; background: #120e14db; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s, transform .35s cubic-bezier(.2, 1.5, .4, 1); box-shadow: 0 10px 30px #0008; }
.banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.banner strong { display: block; font-size: clamp(24px, 9cqmin, 52px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; color: var(--amber); text-shadow: 0 3px 0 #0006; font-variant-numeric: tabular-nums; }
.banner.bad strong { color: #ff6b7d; }
.banner small { display: block; margin-top: 4px; font-size: clamp(13px, 4cqmin, 20px); font-weight: 800; color: #fff; }
.banner small:empty { display: none; }

.ov { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #0d090ecc; }
.ov.light { background: #0d090e77; }
.ov[hidden] { display: none; }
.panel { --pb: 18px; width: min(100%, 390px); max-height: calc(100dvh - 16px); overflow-y: auto; padding: 18px 16px var(--pb); border-radius: 22px; background: var(--panel); color: var(--ink); text-align: center; box-shadow: 0 7px 0 #dfcbad, 0 24px 60px #000b; animation: rise .28s ease-out; overscroll-behavior: contain; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.logo { display: flex; align-items: center; justify-content: center; gap: 10px; }
.logo h1 { font-size: 40px; font-weight: 900; letter-spacing: -.03em; line-height: 1; color: var(--ink); }
.dboard { flex: none; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle, #e2334a 0 9%, #18a058 10% 19%, transparent 20%), repeating-conic-gradient(from -9deg, #1d1a1a 0 18deg, #f1e3c4 18deg 36deg); box-shadow: 0 0 0 3px #1d1a1a, 0 0 0 5px #e2334a, 0 4px 10px #0005; }
.logo-side .dboard { width: 28px; height: 28px; box-shadow: 0 0 0 2px #1d1a1a, 0 0 0 4px #e2334a; }
.tagline { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--ink-muted); }
.modes { margin-top: 14px; display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 2px 10px; padding: 10px 12px; border-radius: 16px; background: #fff; text-align: left; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode .ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: var(--c); color: #fff; font-weight: 900; letter-spacing: -.03em; }
.mode strong { font-size: 16px; font-weight: 900; line-height: 1.2; }
.mode small { font-size: 12px; font-weight: 700; color: var(--ink-muted); line-height: 1.3; }
.small { margin-top: 10px; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--ink-muted); }
.small:empty { display: none; }
.fields { display: grid; gap: 10px; margin-top: 12px; text-align: left; }
.field[hidden] { display: none; }
.label { margin-bottom: 5px; font-size: 12px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #f3e6d1; }
.seg button { flex: 1; min-width: 0; min-height: 36px; padding: 6px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--ink-muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #dfcbad; }
.cta { display: block; width: 100%; margin-top: 16px; padding: 13px; border-radius: 16px; background: var(--amber); color: var(--ink); font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--amber-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--amber-dark); }
.ghost { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 14px; background: #f3e6d1; color: var(--ink); font-size: 15px; font-weight: 800; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 10px; padding: 9px 12px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); text-align: left; font-size: 15px; font-weight: 800; }
.sw { flex: 0 0 auto; width: 42px; height: 24px; border-radius: 99px; background: #dccbb0; position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .2s; }
.toggle[aria-checked="true"] .sw { background: var(--green); }
.toggle[aria-checked="true"] .sw::after { transform: translateX(18px); }
.medal { font-size: 46px; line-height: 1; }
.medal:empty { display: none; }
.big { margin-top: 8px; font-size: 40px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.big:empty { display: none; }
.sub { margin-top: 6px; font-size: 15px; font-weight: 800; color: var(--ink-muted); line-height: 1.35; }
.sub:empty { display: none; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--red); color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.stat { margin-top: 12px; display: grid; gap: 3px; font-size: 14px; font-weight: 800; }
.stat:empty { display: none; }
.stat div { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(var(--n, 1), minmax(0, 1fr)); gap: 6px; align-items: center; padding: 5px 10px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.stat div span { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat div span:first-child { text-align: left; color: var(--ink-muted); font-size: 13px; white-space: normal; }
.stat div.hd { background: none; box-shadow: none; padding-top: 0; padding-bottom: 0; }
.stat div.hd span { font-size: 12px; color: var(--pc, var(--ink)); }
.actions { position: sticky; bottom: calc(-1 * var(--pb)); margin-bottom: calc(-1 * var(--pb)); padding-bottom: var(--pb); background: var(--panel); box-shadow: 0 -12px 10px -6px var(--panel); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Wide frames: the board takes the full height, scores move to a side column. */
@media (min-aspect-ratio: 5/4) {
  .app { grid-template-areas: "stage side"; grid-template-columns: minmax(0, 1fr) clamp(220px, 27vw, 360px); grid-template-rows: minmax(0, 1fr); gap: 8px; }
  .side { max-width: none; min-height: 0; overflow-y: auto; align-self: stretch; }
  .logo-side { display: flex; }
  .help { display: block; }
  .log { display: block; }
  .lbl { justify-items: start; text-align: left; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .card { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: baseline; }
  .card .ch { grid-column: 1 / -1; }
  .card small { text-align: right; }
}
@media (min-aspect-ratio: 5/4) and (min-height: 600px) {
  .card { padding: 7px 11px 8px; }
  .card b { font-size: 36px; }
  .ch span { font-size: 14px; }
  .card small { font-size: 13px; }
  .cric span { min-height: 24px; font-size: 17px; }
  .slot, .tot { height: 36px; font-size: 17px; }
  .lbl strong { font-size: 17px; }
  .lbl small { font-size: 13px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 480px) {
  .logo-side, .help, .log { display: none; }
  .topbar { min-height: 34px; }
  .ibtn { height: 34px; width: 36px; }
  .card b { font-size: 24px; }
}
@media (max-height: 520px) {
  .panel { --pb: 12px; padding: 12px 14px var(--pb); border-radius: 18px; }
  .logo h1 { font-size: 30px; }
  .dboard { width: 32px; height: 32px; }
  .tagline { display: none; }
  .modes { margin-top: 10px; gap: 6px; }
  .mode { padding: 7px 10px; }
  .fields { gap: 7px; margin-top: 8px; }
  .seg button { min-height: 32px; padding: 4px; }
  .cta { margin-top: 12px; padding: 10px; font-size: 17px; }
  .ghost { margin-top: 8px; padding: 9px; }
  .big { font-size: 32px; }
  .medal { font-size: 36px; }
  .panel h2 { font-size: 23px; }
  .stat div { padding: 3px 10px; }
}
@media (max-height: 420px) and (min-width: 520px) {
  .panel.wide { width: min(100%, 640px); }
  .panel.wide .modes { grid-template-columns: repeat(3, 1fr); }
  .panel.wide .mode { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .panel.wide .mode .ic { grid-row: auto; width: 28px; height: 28px; font-size: 11px; }
  .panel.wide .mode small { display: none; }
  .panel.wide .small:not(#records) { display: none; }
  .panel.wide .fields { grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .panel.wide #rules { display: none; }
}
@media (max-height: 560px) and (max-aspect-ratio: 5/4) {
  .card b { font-size: 23px; }
  .card { padding: 3px 8px 4px; }
  .topbar { min-height: 34px; }
  .ibtn { height: 34px; width: 36px; }
  .slot, .tot { height: 27px; }
  .cric span { min-height: 17px; font-size: 13px; }
}
@media (max-height: 420px) and (min-width: 520px) {
  .panel.res { width: min(100%, 660px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); column-gap: 14px; align-items: center; }
  .panel.res .medal { display: none; }
  .panel.res .stat { margin-top: 0; font-size: 13px; }
  .panel.res .stat div { padding: 2px 10px; }
  .panel.res .actions { box-shadow: none; grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .panel.res .actions .cta, .panel.res .actions .ghost { margin-top: 10px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <aside class="side" id="side">
    <div class="logo-side" aria-hidden="true"><span class="dboard"></span>Darts</div>
    <div class="topbar">
      <button type="button" class="ibtn" id="menu-btn" data-i18n-label="menuBtn">☰</button>
      <div class="lbl"><strong id="lbl-main">Darts</strong><small id="lbl-sub"></small></div>
      <button type="button" class="ibtn" id="snd-btn" data-i18n-label="soundBtn" aria-pressed="true">🔊</button>
    </div>
    <div class="cards" id="cards"></div>
    <div class="cric" id="cric" role="table" data-i18n-label="cricTable" hidden></div>
    <div class="turn" id="turn" aria-hidden="true"></div>
    <ol class="log" id="log" aria-hidden="true"></ol>
    <div class="help" id="help"></div>
  </aside>
  <div class="stage" id="stage">
    <canvas id="cv" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
    <div class="prompt" id="prompt" aria-hidden="true"></div>
    <div class="banner" id="banner" aria-hidden="true"><strong id="banner-t"></strong><small id="banner-s"></small></div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="ov" id="menu" hidden>
  <div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="logo"><span class="dboard" aria-hidden="true"></span><h1 id="menu-title">Darts</h1></div>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="modes">
      <button type="button" class="mode" data-mode="x01"><span class="ic" style="--c:#e2334a" aria-hidden="true">501</span><strong data-i18n="mX01"></strong><small data-i18n="dX01"></small></button>
      <button type="button" class="mode" data-mode="cricket"><span class="ic" style="--c:#18a058" aria-hidden="true">⊗</span><strong data-i18n="mCricket"></strong><small data-i18n="dCricket"></small></button>
      <button type="button" class="mode" data-mode="atc"><span class="ic" style="--c:#2f7dd1" aria-hidden="true">🕒</span><strong data-i18n="mAtc"></strong><small data-i18n="dAtc"></small></button>
    </div>
    <p class="small" id="records"></p>
    <button type="button" class="toggle" id="snd-toggle" role="switch" aria-checked="true"><span data-i18n="sound"></span><span class="sw" aria-hidden="true"></span></button>
    <p class="small" data-i18n="controls"></p>
    <p class="small" data-i18n="keys"></p>
  </div>
</div>

<div class="ov" id="setup" hidden>
  <div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <h2 id="setup-title"></h2>
    <div class="fields">
      <div class="field" id="f-start"><div class="label" data-i18n="startScore"></div>
        <div class="seg" data-key="start"><button type="button" data-v="501">501</button><button type="button" data-v="301">301</button></div></div>
      <div class="field" id="f-out"><div class="label" data-i18n="finish"></div>
        <div class="seg" data-key="dout"><button type="button" data-v="1" data-i18n="doubleOut"></button><button type="button" data-v="0" data-i18n="straightOut"></button></div></div>
      <div class="field"><div class="label" data-i18n="opponent"></div>
        <div class="seg" data-key="opp"><button type="button" data-v="cpu" data-i18n="cpu"></button><button type="button" data-v="two" data-i18n="two"></button><button type="button" data-v="solo" data-i18n="solo"></button></div></div>
      <div class="field" id="f-level"><div class="label" data-i18n="level"></div>
        <div class="seg" data-key="level"><button type="button" data-v="easy" data-i18n="easy"></button><button type="button" data-v="medium" data-i18n="medium"></button><button type="button" data-v="hard" data-i18n="hard"></button></div></div>
      <div class="field" id="f-legs"><div class="label" data-i18n="legs"></div>
        <div class="seg" data-key="legs"><button type="button" data-v="1">1</button><button type="button" data-v="3">3</button><button type="button" data-v="5">5</button></div></div>
      <div class="field"><div class="label" data-i18n="sway"></div>
        <div class="seg" data-key="sway"><button type="button" data-v="low" data-i18n="swayLow"></button><button type="button" data-v="normal" data-i18n="swayNormal"></button><button type="button" data-v="high" data-i18n="swayHigh"></button></div></div>
    </div>
    <p class="small" id="rules"></p>
    <div class="actions">

    for (const seg of document.querySelectorAll('#setup .seg')) {
      const k = seg.dataset.key, cur = k === 'dout' ? (settings.dout ? '1' : '0') : String(settings[k]);
      for (const b of seg.children) b.setAttribute('aria-pressed', String(b.dataset.v === cur));
    }
    els.rules.textContent = helpText();
  }
  function openPause() { if (!game || game.over) return; aim.holding = false; showOnly('pause'); $('p-resume').focus({ preventScroll: true }); }
  function startFromSettings() {
    writeJSON(STORE.settings, settings);
    showOnly(null);
    ensureAudio();
    newMatch({ mode: settings.mode, start: settings.start, dout: settings.dout, opp: settings.opp, level: settings.level, legs: settings.legs });
    aim.x = 0; aim.y = settings.mode === 'atc' ? -134 : -103;
    focusCanvas();
  }
  function focusCanvas() { $('cv').focus({ preventScroll: true }); }

  // ---------- Update
  function update(dt) {
    aim.T += dt;
    if (aim.holding) aim.h += dt;
    if (keys.left || keys.right || keys.up || keys.down) {
      const sp = keys.fine ? 30 : 130;
      const dx = (keys.right - keys.left) * sp * dt, dy = (keys.down - keys.up) * sp * dt;
      moveAim(dx, dy);
    }
    for (const p of popups) { p.life -= dt; if (!reducedMotion) p.y -= 14 * dt; }
    popups = popups.filter(p => p.life > 0);
    if (bannerTimer > 0) { bannerTimer -= dt; if (bannerTimer <= 0) els.banner.classList.remove('show'); }
    if (!game || overlayOpen()) return;
    if (cpuAim) {
      cpuAim.t += dt;
      const k = clamp(cpuAim.t / cpuAim.dur, 0, 1), e = 1 - (1 - k) ** 3;
      const wob = (1 - k) * 6 + 2;
      cpuAim.cur = { x: cpuAim.from.x + (cpuAim.to.x - cpuAim.from.x) * e + Math.sin(aim.T * 5.3) * wob, y: cpuAim.from.y + (cpuAim.to.y - cpuAim.from.y) * e + Math.sin(aim.T * 6.1 + 1) * wob };
    }
    if (flight) {
      flight.t += dt;
      if (flight.t >= flight.dur) { const f = flight; flight = null; land(f.x, f.y); }
    }
    for (const tm of timers.slice()) {
      tm.t -= dt;
      if (tm.t <= 0) { timers.splice(timers.indexOf(tm), 1); tm.fn(); }
    }
    if (game && game.phase !== 'cpu' && game.phase !== 'flight') cpuAim = null;
  }
  function moveAim(dx, dy) {
    const nx = aim.x + dx, ny = aim.y + dy, r = Math.hypot(nx, ny), lim = 236;
    const k = r > lim ? lim / r : 1;
    aim.x = nx * k; aim.y = ny * k;
    if (aim.holding) aim.h = Math.max(0, aim.h - Math.hypot(dx, dy) * 0.02);
    aim.show = true;
  }

  // ---------- Drawing
  const cv = $('cv'), ctx = cv.getContext('2d');
  function wedge(c, r0, r1, a0, a1) {
    c.beginPath(); c.arc(0, 0, r1, a0, a1); c.arc(0, 0, r0, a1, a0, true); c.closePath();
  }
  // Draws the board in board units; the caller sets the transform (origin = bull, 1 unit = 1 mm).
  function drawBoard(c, highlight) {
    const BLACK = '#1d1a1a', CREAM = '#f1e3c4', RED = '#e2334a', GREEN = '#18a058';
    const surround = c.createRadialGradient(0, 0, RING.dout, 0, 0, RING.edge);
    surround.addColorStop(0, '#191516'); surround.addColorStop(1, '#0c0a0b');
    c.fillStyle = surround; c.beginPath(); c.arc(0, 0, RING.edge, 0, Math.PI * 2); c.fill();
    c.lineWidth = 5; c.strokeStyle = '#3b2f2a'; c.stroke();
    for (let i = 0; i < 20; i++) {
      const a0 = -Math.PI / 2 + (i - 0.5) * SEG, a1 = a0 + SEG, dark = i % 2 === 0;
      c.fillStyle = dark ? BLACK : CREAM;
      wedge(c, RING.ob, RING.ti, a0, a1); c.fill();
      wedge(c, RING.to, RING.di, a0, a1); c.fill();
      c.fillStyle = dark ? RED : GREEN;
      wedge(c, RING.ti, RING.to, a0, a1); c.fill();
      wedge(c, RING.di, RING.dout, a0, a1); c.fill();
    }
    c.fillStyle = GREEN; c.beginPath(); c.arc(0, 0, RING.ob, 0, Math.PI * 2); c.fill();
    c.fillStyle = RED; c.beginPath(); c.arc(0, 0, RING.ib, 0, Math.PI * 2); c.fill();
    if (highlight) for (const hl of highlight) {
      c.fillStyle = hl.color;
      if (hl.n === 25) { c.beginPath(); c.arc(0, 0, hl.r1, 0, Math.PI * 2); c.fill(); continue; }
      const i = ORDER.indexOf(hl.n), a0 = -Math.PI / 2 + (i - 0.5) * SEG;
      wedge(c, hl.r0, hl.r1, a0, a0 + SEG); c.fill();
    }
    // Spider wire
    c.strokeStyle = '#c9ccd2'; c.lineWidth = 0.9;
    c.beginPath();
    for (const r of [RING.ob, RING.ti, RING.to, RING.di, RING.dout]) { c.moveTo(r, 0); c.arc(0, 0, r, 0, Math.PI * 2); }
    for (let i = 0; i < 20; i++) {
      const a = -Math.PI / 2 + (i - 0.5) * SEG;
      c.moveTo(Math.cos(a) * RING.ob, Math.sin(a) * RING.ob); c.lineTo(Math.cos(a) * RING.dout, Math.sin(a) * RING.dout);
    }
    c.stroke();
    c.beginPath(); c.arc(0, 0, RING.ib, 0, Math.PI * 2); c.stroke();
    // Number ring
    c.font = `900 21px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let i = 0; i < 20; i++) {
      const n = ORDER[i], p = polar(RING.num, i * SEG);
      const dim = highlight && highlight.dim && highlight.dim.has(n);
      c.fillStyle = dim ? '#6b5f58' : highlight && highlight.num === n ? '#ffd23f' : '#f4efe6';
      c.fillText(String(n), p.x, p.y + 1);
    }
  }
  // Board highlights: suggested checkout bed, cricket's dead numbers, the Around the Clock target.
  function boardHighlight() {
    if (!game || !game.turn) return null;
    const g = game, p = curP(), mode = g.cfg.mode, hl = [];
    const bed = (n, m, color) => {
      if (n === 25) hl.push({ n, r1: m === 2 ? RING.ib : RING.ob, color });
      else if (m === 3) hl.push({ n, r0: RING.ti, r1: RING.to, color });
      else if (m === 2) hl.push({ n, r0: RING.di, r1: RING.dout, color });
      else hl.push({ n, r0: RING.to, r1: RING.di, color }, { n, r0: RING.ob, r1: RING.ti, color });
    };
    if (mode === 'x01' && p.human && g.phase === 'aim') {
      const route = p.rem <= 170 ? checkout(p.rem, 3 - g.turn.darts.length, g.cfg.dout) : null;
      if (route) bed(route[0].n, route[0].m, '#ffd23f88');
    } else if (mode === 'cricket') {
      hl.dim = new Set(CRICKET.filter(n => g.players.every(q => q.marks[n] >= 3)));
      for (const n of hl.dim) if (n === 25) hl.push({ n, r1: RING.ob, color: '#00000088' });
      else hl.push({ n, r0: RING.ob, r1: RING.dout, color: '#00000088' });
    } else if (mode === 'atc' && p.idx <= 20) {
      const n = atcTarget(p.idx);
      hl.num = n;
      if (n === 25) hl.push({ n, r1: RING.ob, color: '#ffd23f66' });
      else hl.push({ n, r0: RING.ob, r1: RING.dout, color: '#ffd23f55' });
    }
    return hl;
  }
  function drawDart(c, x, y, color, k = 1, alpha = 1) {
    c.save();
    c.globalAlpha = alpha;
    c.translate(x, y); c.scale(k, k);
    c.fillStyle = '#00000055'; c.beginPath(); c.ellipse(5, 9, 6, 3, 0.6, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#d7dbe2'; c.lineWidth = 1.6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(5, 6); c.stroke();
    c.strokeStyle = '#8f96a3'; c.lineWidth = 3.4;
    c.beginPath(); c.moveTo(4, 5); c.lineTo(11, 14); c.stroke();
    c.strokeStyle = '#2d2a2e'; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(11, 14); c.lineTo(17, 21); c.stroke();
    c.fillStyle = color; c.strokeStyle = '#00000066'; c.lineWidth = 0.6;
    c.beginPath(); c.moveTo(15, 19); c.lineTo(26, 18); c.lineTo(22, 26); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(15, 19); c.lineTo(17, 30); c.lineTo(21, 24); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }
  function drawReticle(c, x, y, unit, color, steady, pulse) {
    const r = 9 * unit;
    c.save();
    c.translate(x, y);
    c.strokeStyle = '#000000aa'; c.lineWidth = 3.2 * unit;
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
    c.strokeStyle = color; c.lineWidth = 1.8 * unit;
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
    c.beginPath();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { c.moveTo(dx * r * 0.45, dy * r * 0.45); c.lineTo(dx * r * 1.5, dy * r * 1.5); }
    c.stroke();
    c.fillStyle = color; c.beginPath(); c.arc(0, 0, 1.3 * unit, 0, Math.PI * 2); c.fill();
    if (steady != null) {
      c.strokeStyle = steady > 0.7 ? '#7cf0a8' : steady > 0.35 ? '#ffd23f' : '#ff8f8f';
      c.lineWidth = 2.6 * unit;
      c.beginPath(); c.arc(0, 0, r + 4 * unit + (pulse || 0), -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(steady, 0.02, 1)); c.stroke();
    }
    c.restore();
  }
  function aimVisible() { return !!game && game.phase === 'aim' && curP().human && (aim.show || aim.holding) && !overlayOpen(); }
  function steadiness() { return clamp(1 - (steadyFactor(aim.holding ? aim.h : 0) - 0.35) / 0.65, 0, 1); }
  function drawLoupe(target, sway, color, steady) {
    // Shrink the loupe until it sits in the free corner beside the board (down to a usable minimum).
    const boardR = RING.edge * view.s;
    let R = clamp(Math.min(view.w, view.h) * 0.17, 46, 120);
    while (R > 46 && Math.hypot(view.cx - R - 8, view.cy - R - 8) < boardR + R + 4) R -= 2;
    const lx = target.x < 0 ? view.w - R - 8 : R + 8, ly = R + 8;
    const zs = Math.max(view.s * 2.8, 2.2);
    ctx.save();
    ctx.beginPath(); ctx.arc(lx, ly, R, 0, Math.PI * 2);
    ctx.fillStyle = '#120e14'; ctx.fill();
    ctx.clip();
    ctx.save();
    ctx.translate(lx - target.x * zs, ly - target.y * zs); ctx.scale(zs, zs);
    drawBoard(ctx, boardHighlight());
    if (game) for (const d of game.board) drawDart(ctx, d.x, d.y, d.color, 0.6);
    ctx.restore();
    drawReticle(ctx, lx + sway.x * zs, ly + sway.y * zs, Math.max(1, zs / 3.2), color, steady);
    ctx.restore();
    ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(lx, ly, R, 0, Math.PI * 2); ctx.stroke();
    const h = scoreAt(target.x + sway.x, target.y + sway.y);
    ctx.font = `900 ${Math.round(clamp(R * 0.26, 12, 22))}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    outlined(hitLabel(h), lx, ly + R - clamp(R * 0.2, 10, 20), '#fff');
  }
  function outlined(text, x, y, fill) {
    ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = '#120e14';
    ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }
  function draw() {
    const { w, h, s, cx, cy } = view;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    // Soft spotlight on the wall behind the board
    const glow = ctx.createRadialGradient(cx, cy, RING.edge * s * 0.8, cx, cy, RING.edge * s * 1.5);
    glow.addColorStop(0, '#ffcf9a22'); glow.addColorStop(1, '#ffcf9a00');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(s, s);
    ctx.shadowColor = '#000a'; ctx.shadowBlur = 30 * s; ctx.shadowOffsetY = 8 * s;
    ctx.fillStyle = '#0c0a0b'; ctx.beginPath(); ctx.arc(0, 0, RING.edge, 0, Math.PI * 2); ctx.fill();
    ctx.shadowColor = 'transparent';
    drawBoard(ctx, boardHighlight());
    ctx.restore();
    const px = (x, y) => ({ x: cx + x * s, y: cy + y * s });
    const dk = clamp(s * 1.1, 0.55, 1.4);
    if (game) for (const d of game.board) { const p = px(d.x, d.y); drawDart(ctx, p.x, p.y, d.color, dk); }
    if (flight) {
      const k = clamp(flight.t / flight.dur, 0, 1), e = k * k;
      const from = { x: cx + w * 0.1, y: h + 40 }, to = px(flight.x, flight.y);
      const x = from.x + (to.x - from.x) * (1 - (1 - k) * (1 - k)), y = from.y + (to.y - from.y) * (1 - (1 - k) * (1 - k)) - Math.sin(k * Math.PI) * 30;
      drawDart(ctx, x, y, flight.color, dk * (2.6 - 1.6 * e));
    }
    ctx.font = `900 ${Math.round(clamp(s * 30, 14, 26))}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of popups) {
      const q = px(p.x, p.y);
      ctx.globalAlpha = clamp(p.life * 2, 0, 1);
      outlined(p.text, q.x, q.y - 22, p.color);
    }
    ctx.globalAlpha = 1;
    if (aimVisible()) {
      const sw = swayOffset(), st = aim.holding ? steadiness() : null;
      const p = px(aim.x + sw.x, aim.y + sw.y);
      drawReticle(ctx, p.x, p.y, 1, curP().color, st, 0);
      drawLoupe({ x: aim.x, y: aim.y }, sw, curP().color, st);
    } else if (cpuAim && game && game.phase === 'cpu') {
      const p = px(cpuAim.cur.x, cpuAim.cur.y);
      drawReticle(ctx, p.x, p.y, 1, cpuAim.color, null);
      drawLoupe({ x: cpuAim.cur.x, y: cpuAim.cur.y }, { x: 0, y: 0 }, cpuAim.color, null);
    }
  }
  function resize() {
    const r = $('stage').getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const s = Math.min(r.width, r.height) / (RING.edge * 2 + 10);
    Object.assign(view, { w: r.width, h: r.height, dpr, cx: r.width / 2, cy: r.height / 2, s });
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    draw();
  }

  // ---------- Input
  let ptr = null;
  const toBoard = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - view.cx) / view.s, y: (e.clientY - r.top - view.cy) / view.s }; };
  cv.addEventListener('pointermove', e => {
    if (ptr && e.pointerId === ptr.id) {
      if (e.pointerType === 'mouse') { const b = toBoard(e); moveAim(b.x - aim.x, b.y - aim.y); }
      else moveAim((e.clientX - ptr.lx) * 0.5 / view.s, (e.clientY - ptr.ly) * 0.5 / view.s);
      ptr.lx = e.clientX; ptr.ly = e.clientY;
      return;
    }
    if (e.pointerType === 'mouse' && !aim.holding && game && game.phase === 'aim') { const b = toBoard(e); moveAim(b.x - aim.x, b.y - aim.y); }
  });
  cv.addEventListener('pointerdown', e => {
    ensureAudio();
    if (!canShoot() || ptr || aim.holding) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch {}
    const b = toBoard(e);
    aim.x = b.x; aim.y = b.y; moveAim(0, 0);
    ptr = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
    aim.holding = true; aim.src = 'ptr'; aim.h = 0;
    els.prompt.textContent = '';
  });
  cv.addEventListener('pointerup', e => { if (ptr && e.pointerId === ptr.id) { ptr = null; release(); renderHud(); } });
  cv.addEventListener('pointercancel', () => { ptr = null; aim.holding = false; aim.src = null; });
  cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !ptr) aim.show = false; });

  const KEY_DIRS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  document.addEventListener('keydown', e => {
    if (e.key === 'Shift') keys.fine = true;
    if (!game || overlayOpen() || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target instanceof Element && e.target.closest('button')) return;
    const dir = KEY_DIRS[e.key];
    if (dir) { e.preventDefault(); keys[dir] = true; aim.show = true; return; }
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      ensureAudio();
      if (e.repeat || !canShoot() || aim.holding) return;
      aim.show = true; aim.holding = true; aim.src = 'key'; aim.h = 0;
      els.prompt.textContent = '';
    }
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'Shift') keys.fine = false;
    const dir = KEY_DIRS[e.key];
    if (dir) keys[dir] = false;
    if ((e.key === ' ' || e.key === 'Enter') && aim.src === 'key') { e.preventDefault(); release(); renderHud(); }
  });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; ptr = null; aim.holding = false; aim.src = null; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { ptr = null; aim.holding = false; aim.src = null; } });

  function setSound(on) {
    soundOn = on; writeJSON(STORE.sound, on);
    els.snd.setAttribute('aria-pressed', String(on)); els.snd.textContent = on ? '🔊' : '🔈';
    els.sndToggle.setAttribute('aria-checked', String(on));
    if (on) ensureAudio();
  }
  els.snd.addEventListener('click', () => setSound(!soundOn));
  els.sndToggle.addEventListener('click', () => setSound(!soundOn));
  $('menu-btn').addEventListener('click', () => { if (game && !game.over && !overlayOpen()) openPause(); else if (!game) openMenu(); });
  for (const b of document.querySelectorAll('#menu .mode')) b.addEventListener('click', () => openSetup(b.dataset.mode));
  for (const seg of document.querySelectorAll('#setup .seg')) for (const b of seg.children) b.addEventListener('click', () => {
    const k = seg.dataset.key, v = b.dataset.v;
    settings[k] = k === 'dout' ? v === '1' : k === 'start' || k === 'legs' ? Number(v) : v;
    renderSetup();
  });
  $('go').addEventListener('click', startFromSettings);
  $('setup-back').addEventListener('click', openMenu);
  $('res-again').addEventListener('click', startFromSettings);
  $('res-menu').addEventListener('click', openMenu);
  $('p-resume').addEventListener('click', () => { showOnly(null); renderHud(); focusCanvas(); });
  $('p-restart').addEventListener('click', startFromSettings);
  $('p-quit').addEventListener('click', openMenu);

  let last = performance.now();
  function frame(now) {
    // Clamp dt so a stalled or hidden tab never fast-forwards the CPU or the sway.
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!document.hidden) {
      let left = dt * timeScale;
      while (left > 1e-6) { const st = Math.min(left, 0.05); update(st); left -= st; }
      draw();
    }
    requestAnimationFrame(frame);
  }

  // Read-only state for automated tests (plus a harmless clock-speed knob for CPU turns).
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__darts = {
    state: () => {
      const r = cv.getBoundingClientRect();
      return {
        overlay: OVERLAYS.find(id => !els[id].hidden) || null,
        mode: game && game.cfg.mode, phase: game && game.phase, cur: game && game.cur, leg: game && game.leg, over: !!(game && game.over),
        players: game ? game.players.map(p => ({ name: p.name, human: p.human, legs: p.legs, rem: p.rem, pts: p.pts, idx: p.idx, marks: { ...p.marks }, legDarts: p.legDarts, st: { ...p.st } })) : [],
        turn: game && game.turn ? { darts: game.turn.darts.map(hitLabel), bust: game.turn.bust } : null,
        aim: { x: aim.x, y: aim.y, holding: aim.holding, h: aim.h, sway: swayOffset() },
        view: { left: r.left + view.cx, top: r.top + view.cy, s: view.s },
        records: JSON.parse(JSON.stringify(rec)),
      };
    },
    speed: k => { timeScale = clamp(Number(k) || 1, 0.25, 8); },
  };

  setSound(soundOn);
  new ResizeObserver(resize).observe($('stage'));
  resize();
  openMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
