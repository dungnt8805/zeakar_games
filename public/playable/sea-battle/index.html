<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sea Battle</title>
<style>
:root {
  --bg: #071c33;
  --bg-2: #0f3a63;
  --text: #eaf6ff;
  --muted: #95bdd9;
  --sea: #1e6e9f;
  --sea-deep: #11507e;
  --sea-line: #ffffff26;
  --accent: #ffd166;
  --accent-dark: #d4a33a;
  --hit: #ff5a3c;
  --hit-dark: #b3261e;
  --coral: #ff7a59;
  --coral-dark: #cf4f2f;
  --paper: #f3f8fd;
  --ink: #0d2742;
  --ink-muted: #5b7490;
  --steel-1: #e2e9f1;
  --steel-2: #a8b8c9;
  --steel-3: #73869b;
  --cell: 30px;
  --lab: 18px;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background-color: var(--bg);
  background-image: radial-gradient(120% 80% at 50% 0%, var(--bg-2), transparent 70%), repeating-radial-gradient(circle at 50% 120%, #ffffff06 0 2px, transparent 2px 26px);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.icon-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.side { display: contents; }
.top { order: 1; display: flex; align-items: center; gap: 8px; }
.status { order: 2; }
.hud { order: 3; }
.play { order: 4; }
.fleets { order: 5; }
.dock-wrap { order: 6; }
.actions { order: 7; }
.tip { order: 8; }

h1 { flex: 1; min-width: 0; font-size: clamp(22px, 6.4vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
h1 span { color: var(--accent); }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: #ffffff1c; font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 #00000045; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #00000045; }

.status { height: 2.6em; display: flex; align-items: center; justify-content: center; padding: 0 4px; text-align: center; font-size: 14px; font-weight: 800; line-height: 1.25; overflow: hidden; }
.status[data-tone="hit"] { color: #ffb08f; }
.status[data-tone="miss"] { color: var(--muted); }
.status[data-tone="win"] { color: var(--accent); }
.status[data-tone="lose"] { color: #ff8a7a; }

.hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stat { min-width: 0; padding: 5px 6px; border-radius: 12px; background: #00000033; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); line-height: 1.2; }
.stat strong { display: block; font-size: 18px; line-height: 1.2; font-variant-numeric: tabular-nums; }

.fleets { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.fleet-row { min-width: 0; padding: 5px 8px; border-radius: 12px; background: #00000029; }
.fleet-row small { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; font-weight: 800; color: var(--muted); line-height: 1.2; }
.fleet-row small b { color: var(--text); font-variant-numeric: tabular-nums; }
.pips { display: flex; flex-wrap: wrap; gap: 3px 5px; margin-top: 4px; }
.pip-ship { display: flex; gap: 1px; }
.pip-ship i { width: 6px; height: 8px; border-radius: 2px; background: var(--steel-2); }
.pip-ship.sunk i { background: var(--hit); opacity: .6; }

.play { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.tabs { display: none; gap: 4px; padding: 4px; border-radius: 14px; background: #00000033; }
.app[data-arr="tabs"] .tabs { display: flex; }
.tabs button { flex: 1; min-width: 0; min-height: 32px; padding: 6px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.15; }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 #00000030; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 14px; }
.app[data-arr="col"] .stage { flex-direction: column; }
.app[data-arr="tabs"] .sea:not(.active), .app[data-phase="place"] #sea-enemy { display: none; }
.app[data-arr="tabs"] .sea-title { display: none; }
.sea { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sea-title { height: 20px; display: flex; align-items: center; font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; transition: color .2s; }
.sea.turn .sea-title { color: var(--accent); }
.frame { display: grid; grid-template-columns: var(--lab) calc(var(--cell) * 10); grid-template-rows: var(--lab) calc(var(--cell) * 10); }
.lab-top { grid-column: 2; display: grid; grid-template-columns: repeat(10, 1fr); }
.lab-left { grid-row: 2; display: grid; grid-template-rows: repeat(10, 1fr); }
.lab-top span, .lab-left span { display: grid; place-items: center; font-size: max(10px, calc(var(--cell) * .34)); font-weight: 800; color: var(--muted); }
.board { grid-column: 2; grid-row: 2; position: relative; border-radius: calc(var(--cell) * .2); background: radial-gradient(circle at 25% 15%, #ffffff17, transparent 45%), repeating-linear-gradient(170deg, #ffffff07 0 3px, transparent 3px 11px), linear-gradient(160deg, var(--sea), var(--sea-deep)); box-shadow: 0 0 0 3px #0a3456, 0 14px 30px #0009; transition: box-shadow .3s; }
.sea.turn .board { box-shadow: 0 0 0 3px var(--accent), 0 0 26px #ffd16650, 0 14px 30px #0009; }
#sea-mine.turn .board { box-shadow: 0 0 0 3px var(--hit), 0 0 26px #ff5a3c50, 0 14px 30px #0009; }
.board.jolt { animation: jolt .35s; }
@keyframes jolt { 25% { transform: translate(-3px, 2px); } 50% { transform: translate(3px, -2px); } 75% { transform: translate(-2px, -1px); } }
.cells { position: absolute; inset: 0; z-index: 1; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); border-radius: inherit; overflow: hidden; touch-action: manipulation; }
.ships { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.app[data-phase="place"] .ships { z-index: 2; }
.app[data-phase="place"] .ships .ship { pointer-events: auto; cursor: grab; touch-action: none; }

.cell { position: relative; padding: 0; box-shadow: inset 0 0 0 .5px var(--sea-line); transition: background-color .15s; }
.cell:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 3; }
.app[data-phase="battle"] #cells-enemy .cell { cursor: crosshair; }
.app[data-phase="battle"] #cells-enemy .cell:not(.miss):not(.hit):not(.clear):hover { background-color: #ffffff22; }
.cell::after { content: ''; position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-radius: 50%; transform: translate(-50%, -50%); }
.cell.miss::after { width: 26%; height: 26%; background: #e3f4ff; box-shadow: 0 0 0 calc(var(--cell) * .07) #ffffff30; }
.cell.clear { background-color: #04294a40; }
.cell.clear::after { width: 13%; height: 13%; background: #ffffff5c; }
.cell.hit::after { width: 56%; height: 56%; background: radial-gradient(circle at 40% 35%, #fff4c2, #ffc04d 28%, var(--hit) 58%, var(--hit-dark)); box-shadow: 0 0 calc(var(--cell) * .28) #ff6b3daa; }
.cell.sunk { background-color: #3c0f1430; }
.cell.sunk::after { width: 42%; height: 42%; background: radial-gradient(circle at 40% 35%, #ffb59a, #e2462c 50%, #7d1a14); box-shadow: none; }
.cell.sel::before { content: ''; position: absolute; inset: 13%; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 0 2px #0005; animation: aim .8s ease-in-out infinite alternate; }
.cell.sel::after { width: 16%; height: 16%; background: var(--accent); }
@keyframes aim { to { transform: scale(.8); } }
.cell.pv { background-color: #ffd16670; }
.cell.pv.bad { background-color: #ff5a3c70; }
.cell.fx-hit::before { content: ''; position: absolute; inset: -25%; z-index: 2; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, #ffe9a0, #ff6a3d 42%, transparent 70%); animation: burst .55s ease-out forwards; }
.cell.fx-miss::before { content: ''; position: absolute; inset: 8%; border-radius: 50%; pointer-events: none; border: 2px solid #e3f4ff; animation: ripple .6s ease-out forwards; }
@keyframes burst { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
@keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }

.ship { position: absolute; left: calc(var(--cell) * var(--c)); top: calc(var(--cell) * var(--r)); padding: calc(var(--cell) * .12); transition: opacity .2s; }
.ship.h { width: calc(var(--cell) * var(--len)); height: var(--cell); }
.ship.v { width: var(--cell); height: calc(var(--cell) * var(--len)); }
.ship b { position: relative; display: block; width: 100%; height: 100%; background: linear-gradient(var(--steel-1), var(--steel-2) 55%, var(--steel-3)); box-shadow: inset 0 0 0 1px #ffffff55, 0 2px 0 #0005; }
.ship.h b { border-radius: calc(var(--cell) * .18) calc(var(--cell) * .62) calc(var(--cell) * .62) calc(var(--cell) * .18) / calc(var(--cell) * .18) 50% 50% calc(var(--cell) * .18); }
.ship.v b { background: linear-gradient(90deg, var(--steel-1), var(--steel-2) 55%, var(--steel-3)); border-radius: 50% 50% calc(var(--cell) * .18) calc(var(--cell) * .18) / calc(var(--cell) * .62) calc(var(--cell) * .62) calc(var(--cell) * .18) calc(var(--cell) * .18); }
.ship b::before, .ship b::after { content: ''; position: absolute; }
.ship b::before { border-radius: 99px; background: #5d7086; }
.ship.h b::before { left: 12%; right: 24%; top: 40%; bottom: 40%; }
.ship.v b::before { top: 24%; bottom: 12%; left: 40%; right: 40%; }
.ship b::after { border-radius: 3px; background: #f4f8fb; box-shadow: 0 1px 0 #0004; }
.ship.h b::after { left: calc(50% - var(--cell) * .17); width: calc(var(--cell) * .34); top: 24%; bottom: 24%; }
.ship.v b::after { top: calc(50% - var(--cell) * .17); height: calc(var(--cell) * .34); left: 24%; right: 24%; }
.ship.sunk b { background: linear-gradient(#a3554b, #6b2a25); }
.ship.sunk.v b { background: linear-gradient(90deg, #a3554b, #6b2a25); }
.ship.sunk b::after { background: #d9b2a8; }
.ship.revealed { opacity: .62; }
.ship.revealed b { outline: 2px dashed #ffffffb0; outline-offset: 1px; }
.ship.sel b { box-shadow: 0 0 0 2px var(--accent), 0 0 14px #ffd166a0; }
.ship.lifted { opacity: .25; }
.ship.ghost { position: fixed; z-index: 60; pointer-events: none; opacity: .9; }
.ship.shake { animation: shake .3s; }
.ship.boom b { animation: sink .8s ease-out; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes sink { 0% { filter: brightness(2.2); transform: scale(1.08); } 100% { filter: none; transform: none; } }

.dock-wrap { display: none; flex-direction: column; gap: 8px; }
.app[data-phase="place"] .dock-wrap { display: flex; }
.app[data-phase="place"] .hud, .app[data-phase="place"] .fleets { display: none; }
.dock { --dc: 18px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 32px; }
.piece { padding: 6px 7px; border-radius: 10px; background: #ffffff16; touch-action: none; cursor: grab; }
.piece[aria-pressed="true"] { background: #ffd16630; box-shadow: 0 0 0 2px var(--accent); }
.ship.mini { --cell: var(--dc); position: relative; left: auto; top: auto; display: block; padding: 2px; }
.dock-done { align-self: center; padding: 6px; font-size: 13px; font-weight: 800; color: var(--accent); text-align: center; }
.tools { display: flex; gap: 6px; }
.tool { flex: 1 1 0; min-width: 0; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 6px 8px; border-radius: 12px; background: #ffffff1c; font-size: 13px; font-weight: 800; line-height: 1.1; box-shadow: 0 3px 0 #00000045; }
.tool:active { transform: translateY(2px); box-shadow: 0 1px 0 #00000045; }
.tool .ico { flex: 0 0 auto; display: inline-block; font-size: 16px; line-height: 1; transition: transform .2s; }
#rotate-btn[data-vert="true"] .ico { transform: rotate(90deg); }
.ready { flex: 1.5 1 0; min-width: 0; min-height: 40px; padding: 6px 10px; border-radius: 12px; background: var(--coral); color: #fff; font-size: 16px; font-weight: 900; box-shadow: 0 4px 0 var(--coral-dark); }
.ready:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--coral-dark); }
.ready:disabled { opacity: .45; transform: none; }

.actions { display: none; }
.app.salvo[data-phase="battle"] .actions { display: flex; }
.fire { flex: 1; min-height: 44px; padding: 8px; border-radius: 14px; background: var(--coral); color: #fff; font-size: 17px; font-weight: 900; box-shadow: 0 4px 0 var(--coral-dark); }
.fire:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--coral-dark); }
.fire:disabled { opacity: .45; transform: none; box-shadow: 0 4px 0 var(--coral-dark); }
.fire.ready-glow { animation: glow .9s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 4px 0 var(--coral-dark), 0 0 22px #ff7a59aa; } }
.tip { display: none; font-size: 12px; line-height: 1.4; color: var(--muted); text-align: center; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); background: #04122299; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 400px); max-height: calc(100% - 4px); overflow-y: auto; background: var(--paper); color: var(--ink); border-radius: 26px; padding: 22px 20px; text-align: center; box-shadow: 0 20px 50px #0008; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.logo { display: block; width: 120px; height: 52px; margin: 0 auto 4px; }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.panel h2 span { color: #1d6fa5; }
.text { margin-top: 6px; font-size: 14px; color: var(--ink-muted); line-height: 1.4; }
.fields { margin-top: 12px; display: grid; gap: 10px; text-align: left; }
.field[hidden] { display: none; }
.label { margin-bottom: 5px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-muted); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #e1ecf7; }
.seg button { flex: 1; min-width: 0; min-height: 34px; padding: 7px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--ink-muted); line-height: 1.15; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #c3d4e6; }
.hint { margin-top: 4px; font-size: 12px; color: var(--ink-muted); line-height: 1.3; }
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn-row > * { margin-top: 0 !important; }
.cta { flex: 2; width: 100%; margin-top: 18px; padding: 14px; border-radius: 16px; background: var(--coral); color: #fff; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--coral-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--coral-dark); }
.ghost-btn { flex: 1; width: 100%; margin-top: 10px; padding: 11px 10px; border-radius: 14px; background: #e1ecf7; color: var(--ink); font-size: 15px; font-weight: 800; box-shadow: 0 4px 0 #c3d4e6; }
.ghost-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c3d4e6; }
.ghost-btn[hidden] { display: none; }
.emoji { font-size: 46px; line-height: 1.2; }
.result-score { margin-top: 10px; font-size: 16px; font-weight: 800; }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: var(--accent); color: #4a3500; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.stats-table { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.stats-table th { padding: 6px 3px; font-size: 11px; font-weight: 800; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .02em; }
.stats-table td { padding: 8px 3px; border-top: 1px solid #dbe6f1; font-weight: 800; }
.stats-table td:first-child { text-align: left; color: #1d6fa5; }
.small { font-size: 12px; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Narrow phones: icon-only placement tools */
@media (max-width: 420px) and (max-aspect-ratio: 5/4) {
  .tool .lbl { display: none; }
  .tool { flex: 0 0 44px; }
  .stat small { letter-spacing: 0; }
}
@media (max-height: 600px) and (max-aspect-ratio: 5/4) {
  .app { gap: 6px; }
  .app[data-phase="battle"] .hud, .app[data-phase="over"] .hud { display: none; }
  h1 { font-size: 22px; }
  .icon-btn { width: 36px; height: 36px; }
  .status { font-size: 13px; }
  .dock { --dc: 15px; gap: 4px; }
  .piece { padding: 5px 6px; }
}
@media (min-height: 820px) and (max-aspect-ratio: 5/4) { .tip { display: block; } }

/* Wide frames: info column on the left, both seas side by side at full height */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: none; display: grid; grid-template-columns: clamp(190px, 24vw, 300px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 16px; }
  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 2px; }
  .status { height: auto; min-height: 3.8em; justify-content: flex-start; text-align: left; padding: 8px 10px; border-radius: 14px; background: #00000033; font-size: 15px; }
  .fleets { grid-template-columns: 1fr; }
  .pip-ship i { width: 8px; height: 10px; }
  .play { min-height: 0; }
  .tip { display: block; margin-top: auto; text-align: left; }
  .tools { flex-wrap: wrap; }
  .ready { flex: 1 1 100%; min-height: 46px; }
  .dock { justify-content: flex-start; }
  #setup .panel { width: min(100%, 660px); }
  #setup .fields { grid-template-columns: 1fr 1fr; column-gap: 14px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 480px) {
  .app { gap: 12px; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .side { gap: 6px; }
  h1 { font-size: 21px; }
  .icon-btn { width: 34px; height: 34px; font-size: 18px; }
  .status { min-height: 2.8em; padding: 5px 8px; font-size: 13px; }
  .stat { padding: 3px 4px; }
  .stat strong { font-size: 15px; }
  .stat small { letter-spacing: 0; }
  .fleet-row { padding: 4px 8px; }
  .tip { display: none; }
  .dock { --dc: 14px; gap: 4px; }
  .piece { padding: 4px 5px; }
  .tools { flex-wrap: nowrap; }
  .tool { flex: 0 0 38px; min-height: 36px; padding: 4px; }
  .tool .lbl { display: none; }
  .ready { flex: 1 1 0; min-height: 36px; font-size: 15px; }
  .fire { min-height: 38px; font-size: 15px; }
}
@media (max-height: 560px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 16px; border-radius: 20px; }
  .logo { width: 90px; height: 38px; margin-bottom: 0; }
  .panel h2 { font-size: 22px; }
  .text { margin-top: 3px; font-size: 13px; line-height: 1.3; }
  .fields { margin-top: 8px; gap: 6px; }
  .label { margin-bottom: 3px; font-size: 11px; }
  .seg button { min-height: 32px; padding: 5px 4px; font-size: 13px; }
  .hint { display: none; }
  .btn-row { margin-top: 10px; }
  .cta { margin-top: 12px; padding: 10px; font-size: 17px; }
  .ghost-btn { margin-top: 8px; padding: 8px; font-size: 14px; }
  .emoji { font-size: 32px; }
  .result-score { margin-top: 6px; font-size: 15px; }
  .stats-table td { padding: 5px 3px; }
}
@media (max-height: 640px) { .logo { display: none; } }
@media (max-height: 520px) { #setup .text { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app" data-phase="place" data-arr="one">
  <div class="side" id="side">
    <header class="top">
      <h1>Sea <span>Battle</span></h1>
      <button type="button" class="icon-btn" id="menu-btn" data-i18n-label="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>

      const o = side.owner[i];
      if (o >= 0 && o !== k) return false;
      if (!touch) for (const j of NB8[i]) { const o2 = side.owner[j]; if (o2 >= 0 && o2 !== k) return false; }
    }
    return true;
  }
  function liftShip(side, k) {
    const ship = side.ships[k];
    for (const i of ship.cells) side.owner[i] = -1;
    ship.cells = [];
  }
  function setShip(side, k, r, c, vert) {
    const ship = side.ships[k];
    liftShip(side, k);
    Object.assign(ship, { r, c, vert, cells: lineCells(r, c, ship.len, vert) });
    for (const i of ship.cells) side.owner[i] = k;
  }
  // Uniform over all legal spots for each ship, biggest first; restart in the rare dead end.
  function autoPlace(side, touch) {
    for (let attempt = 0; attempt < 200; attempt++) {
      side.ships.forEach(s => liftShip(side, s.k));
      let ok = true;
      for (const ship of [...side.ships].sort((a, b) => b.len - a.len)) {
        const options = PLACEMENTS[ship.len].filter(cells => fits(side, ship.k, cells, touch));
        if (!options.length) { ok = false; break; }
        const cells = options[Math.floor(Math.random() * options.length)];
        setShip(side, ship.k, rowOf(cells[0]), colOf(cells[0]), cells.length > 1 && cells[1] - cells[0] === N);
      }
      if (ok) return;
    }
  }
  function fireAt(side, i, touch) {
    const k = side.owner[i];
    if (k < 0) { side.view[i] = MISS; return { i, hit: false, sunk: null }; }
    side.view[i] = HIT;
    const ship = side.ships[k];
    ship.hits++;
    if (ship.hits < ship.len) return { i, hit: true, sunk: null };
    ship.sunk = true;
    for (const j of ship.cells) side.view[j] = SUNK;
    if (!touch) for (const j of ship.cells) for (const n of NB8[j]) if (side.view[n] === UNKNOWN) side.view[n] = CLEAR;
    return { i, hit: true, sunk: ship };
  }

  // ---- Computer player -------------------------------------------------------------------------
  // The AI only ever reads the public view of your waters (misses, hits, sunk ships) plus the list
  // of ship lengths still afloat — never where your ships actually are.
  const pickRandom = arr => arr.length ? arr[Math.floor(Math.random() * arr.length)] : -1;
  const cellsWith = (view, v) => { const out = []; for (let i = 0; i < CELLS; i++) if (view[i] === v) out.push(i); return out; };

  function easyPick(view) {
    const hits = cellsWith(view, HIT);
    if (hits.length && Math.random() < 0.2) {
      const near = hits.flatMap(h => NB4[h]).filter(j => view[j] === UNKNOWN);
      if (near.length) return pickRandom(near);
    }
    return pickRandom(cellsWith(view, UNKNOWN));
  }

  // Hunt at random; after a hit, try its neighbours, preferring cells that extend a line of hits.
  function huntTargetPick(view) {
    const line = [], near = [];
    for (const h of cellsWith(view, HIT)) for (const [dr, dc] of DIR4) {
      const n = step(h, dr, dc);
      if (n < 0 || view[n] !== UNKNOWN) continue;
      const back = step(h, -dr, -dc);
      (back >= 0 && view[back] === HIT ? line : near).push(n);
    }
    return pickRandom(line.length ? line : near.length ? near : cellsWith(view, UNKNOWN));
  }

  function touchesOtherHit(cells, view) {
    for (const i of cells) for (const j of NB8[i]) if (view[j] === HIT && !cells.includes(j)) return true;
    return false;
  }

  // Probability density: count every way each remaining ship could still lie. While there are
  // unsunk hits only layouts through them count, weighted steeply by how many hits they explain.
  function density(view, remaining, touch, useHits = true) {
    const hits = cellsWith(view, HIT);
    const target = useHits && hits.length > 0;
    const blocked = new Uint8Array(CELLS);
    for (let i = 0; i < CELLS; i++) if (view[i] !== UNKNOWN && (view[i] !== HIT || !useHits)) blocked[i] = 1;
    // Ships can't touch: the diagonal neighbours of any hit must be water.
    if (!touch) for (const h of hits) for (const d of DIAG[h]) if (view[d] === UNKNOWN) blocked[d] = 1;
    const w = new Float64Array(CELLS);
    let any = false;
    for (const len of remaining) for (const cells of PLACEMENTS[len]) {
      let h = 0, ok = true;
      for (const i of cells) { if (blocked[i]) { ok = false; break; } if (view[i] === HIT) h++; }
      if (!ok || (target && !h)) continue;
      if (!touch && h && touchesOtherHit(cells, view)) continue;
      const weight = h ? 40 ** h : 1;
      for (const i of cells) if (view[i] === UNKNOWN) { w[i] += weight; any = true; }
    }
    if (!any && target) return density(view, remaining, touch, false);
    return w;
  }

  function densityPick(view, remaining, touch) {
    const w = density(view, remaining, touch);
    let max = 0, ties = [];
    for (let i = 0; i < CELLS; i++) {
      if (w[i] > max * 1.0000001) { max = w[i]; ties = [i]; }
      else if (max > 0 && w[i] >= max * 0.9999999) ties.push(i);
    }
    return ties.length ? pickRandom(ties) : huntTargetPick(view);
  }

  function aiPick(view, remaining, level, touch) {
    if (level === 'easy') return easyPick(view);
    if (level === 'normal') return huntTargetPick(view);
    return densityPick(view, remaining, touch);
  }

  // A salvo is planned on a scratch copy: each chosen cell is marked pending so the next pick spreads out.
  function aiVolley(view, remaining, n, level, touch) {
    const scratch = Uint8Array.from(view), out = [];
    while (out.length < n) {
      const i = aiPick(scratch, remaining, level, touch);
      if (i < 0) break;
      out.push(i);
      scratch[i] = PEND;
    }
    return out;
  }

  // ---- State -----------------------------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const app = $('app');
  const els = {
    play: $('play'), status: $('status'), announcer: $('announcer'), tip: $('tip'), dock: $('dock'),
    rotate: $('rotate-btn'), random: $('random-btn'), clear: $('clear-btn'), ready: $('ready-btn'), fire: $('fire-btn'),
    shots: $('st-shots'), hits: $('st-hits'), acc: $('st-acc'), pipsAi: $('pips-ai'), pipsMe: $('pips-me'), countAi: $('count-ai'), countMe: $('count-me'),
    setup: $('setup'), result: $('result'), stats: $('stats'), start: $('start'), resume: $('resume'),
    resultEmoji: $('result-emoji'), resultTitle: $('result-title'), resultText: $('result-text'), resultScore: $('result-score'), newBest: $('new-best'), again: $('again'),
    tabEnemy: $('tab-enemy'), tabMine: $('tab-mine'),
  };
  const boards = {
    enemy: { sea: $('sea-enemy'), board: $('board-enemy'), cells: $('cells-enemy'), ships: $('ships-enemy'), btns: [] },
    mine: { sea: $('sea-mine'), board: $('board-mine'), cells: $('cells-mine'), ships: $('ships-mine'), btns: [] },
  };

  const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
  const write = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };

  const settings = { mode: 'classic', level: 'normal', fleet: 'classic', bonus: 'off', first: 'you', ...read(STORE.settings, {}) };
  for (const [key, list] of Object.entries(OPTIONS)) if (!list.includes(settings[key])) settings[key] = key === 'level' ? 'normal' : list[0];
  let stats = read(STORE.stats, {});
  if (!stats || typeof stats !== 'object') stats = {};

  let game = null, seq = 0, started = false, pendingRun = null, drag = null, preview = [];
  const lastLayout = {};
  const cursor = { enemy: 44, mine: 44 };

  function newGameState() {
    return {
      id: ++seq, phase: 'place', mode: settings.mode, level: settings.level, fleet: settings.fleet,
      touch: settings.fleet === 'classic', bonus: settings.mode === 'classic' && settings.bonus === 'on',
      me: makeSide(settings.fleet), ai: makeSide(settings.fleet), turn: 'me', busy: false,
      sel: new Set(), selK: 0, vert: false, tab: 'enemy', shots: 0, hits: 0, aiShots: 0, won: null, timers: [],
    };
  }

  // Timers belong to one game; they wait while the tab is hidden so nothing happens unseen.
  function later(ms, fn) {
    const g = game;
    const run = () => {
      if (game !== g) return;
      if (document.hidden) { pendingRun = run; return; }
      fn();
    };
    g.timers.push(setTimeout(run, ms));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !pendingRun) return;
    const run = pendingRun;
    pendingRun = null;
    setTimeout(run, 250);
  });
  function stopTimers() { if (game) game.timers.forEach(clearTimeout); pendingRun = null; }

  const setStatus = (text, tone = '') => { els.status.textContent = text; els.status.dataset.tone = tone; };
  const announce = text => { els.announcer.textContent = text; };
  const accuracy = () => game.shots ? Math.round(game.hits / game.shots * 100) : 0;
  const shotsFor = (attacker, defender) => game.mode === 'salvo' ? Math.min(afloat(attacker), countView(defender.view, UNKNOWN)) : 1;
  const nextUnplaced = () => game.me.ships.findIndex(s => !isPlaced(s));

  // ---- Layout ----------------------------------------------------------------------------------
  const TITLE_H = 24, TABS_H = 46, GAP = 14;
  const fitCell = (w, h) => { const a = Math.min(w, h); return Math.min(a / 10.62, (a - 16) / 10); };
  function layout() {
    const W = els.play.clientWidth, H = els.play.clientHeight;
    if (!W || !H || !game) return;
    let arr, cell;
    if (game.phase === 'place') { arr = 'one'; cell = fitCell(W, H - TITLE_H); }
    else {
      const row = fitCell((W - GAP) / 2, H - TITLE_H);
      const col = fitCell(W, (H - GAP) / 2 - TITLE_H);
      const tabs = fitCell(W, H - TABS_H);
      const both = Math.max(row, col);
      // Show both seas when they stay comfortably tappable; otherwise one big sea with tabs.
      if (both >= 24 || both >= tabs * 0.8) { arr = row >= col ? 'row' : 'col'; cell = both; }
      else { arr = 'tabs'; cell = tabs; }

  // ---- Rendering -------------------------------------------------------------------------------
  function buildBoards() {
    for (const [key, b] of Object.entries(boards)) {
      b.btns = Array.from({ length: CELLS }, (_, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cell';
        btn.dataset.i = i;
        btn.tabIndex = i === cursor[key] ? 0 : -1;
        return btn;
      });
      b.cells.replaceChildren(...b.btns);
      const frame = b.sea.querySelector('.frame');
      frame.querySelector('.lab-top').replaceChildren(...[...LETTERS].map(ch => Object.assign(document.createElement('span'), { textContent: ch })));
      frame.querySelector('.lab-left').replaceChildren(...Array.from({ length: N }, (_, r) => Object.assign(document.createElement('span'), { textContent: r + 1 })));
    }
  }

  function renderBoard(key) {
    const side = key === 'enemy' ? game.ai : game.me;
    const { btns } = boards[key];
    for (let i = 0; i < CELLS; i++) {
      const v = side.view[i], b = btns[i];
      const sel = key === 'enemy' && game.sel.has(i);
      b.classList.toggle('miss', v === MISS);
      b.classList.toggle('hit', v === HIT || v === SUNK);
      b.classList.toggle('sunk', v === SUNK);
      b.classList.toggle('clear', v === CLEAR);
      b.classList.toggle('sel', sel);
      const own = key === 'mine' && side.owner[i] >= 0;
      let st = v === MISS ? t.st.miss : v === HIT ? t.st.hit : v === SUNK ? t.st.sunk : v === CLEAR ? t.st.clear : null;
      if (own) st = st ? `${t.st.ship}, ${st}` : t.st.ship;

      b.setAttribute('aria-label', t.cell(coord(i), st));
    }
  }

  function shipEl(ship, extra = '') {
    const el = document.createElement('div');
    el.className = `ship ${ship.vert ? 'v' : 'h'}${extra}`;
    el.style.cssText = `--r:${ship.r};--c:${ship.c};--len:${ship.len}`;
    el.dataset.k = ship.k;
    el.append(document.createElement('b'));
    return el;
  }

  function renderShips(key) {
    const mine = key === 'mine';
    const side = mine ? game.me : game.ai;
    // Enemy ships only ever reach the DOM once sunk, or when the game is over.
    const list = side.ships.filter(s => isPlaced(s) && (mine || s.sunk || game.phase === 'over'));
    boards[key].ships.replaceChildren(...list.map(s => {
      const el = shipEl(s, `${s.sunk ? ' sunk' : ''}${!mine && !s.sunk ? ' revealed' : ''}${mine && game.phase === 'place' && game.selK === s.k ? ' sel' : ''}`);
      if (mine) el.addEventListener('pointerdown', e => startDrag(e, s.k, 'board'));
      return el;
    }));
  }

  function renderPips(side, el, countEl) {
    el.replaceChildren(...side.ships.map(s => {
      const span = document.createElement('span');
      span.className = `pip-ship${s.sunk ? ' sunk' : ''}`;
      for (let k = 0; k < s.len; k++) span.append(document.createElement('i'));
      return span;
    }));
    countEl.textContent = `${afloat(side)}/${side.ships.length}`;
  }

  function renderDock() {
    if (game.phase !== 'place') return;
    const todo = game.me.ships.filter(s => !isPlaced(s));
    if (!todo.length) {
      const done = document.createElement('p');
      done.className = 'dock-done';
      done.textContent = t.allPlaced;
      els.dock.replaceChildren(done);
    } else {
      els.dock.replaceChildren(...todo.map(s => {

        btn.className = 'piece';

        btn.setAttribute('aria-pressed', String(game.selK === s.k));

  }

  function render() {
    app.dataset.phase = game.phase;
    app.classList.toggle('salvo', game.mode === 'salvo');
    renderBoard('enemy');
    renderBoard('mine');
    renderShips('enemy');
    renderShips('mine');
    renderPips(game.ai, els.pipsAi, els.countAi);
    renderPips(game.me, els.pipsMe, els.countMe);

    els.hits.textContent = String(game.hits);
    els.acc.textContent = game.shots ? `${accuracy()}%` : '–';
    renderDock();
    const myTurn = game.phase === 'battle' && game.turn === 'me';
    const need = game.phase === 'battle' ? shotsFor(game.me, game.ai) : 1;
    els.fire.textContent = t.fireN(need);
    els.fire.disabled = !myTurn || game.busy || game.sel.size !== need;
    els.fire.classList.toggle('ready-glow', !els.fire.disabled);
    boards.enemy.sea.classList.toggle('turn', myTurn);

  function showTab(tab) {
    if (game.tab === tab) return;
    game.tab = tab;
    render();
  }

  function fx(key, i, cls) {
    if (reducedMotion.matches) return;
    const b = boards[key].btns[i];
    b.classList.remove('fx-hit', 'fx-miss');
    void b.offsetWidth;
    b.classList.add(cls);
    setTimeout(() => b.classList.remove(cls), 650);
  }
  function sinkFx(key, k) {
    if (reducedMotion.matches) return;
    boards[key].ships.querySelector(`[data-k="${k}"]`)?.classList.add('boom');
    const board = boards[key].board;
    board.classList.remove('jolt');
    void board.offsetWidth;
    board.classList.add('jolt');
  }

  function setCursor(key, i, focus) {
    const { btns } = boards[key];
    btns[cursor[key]].tabIndex = -1;
    cursor[key] = i;
    btns[i].tabIndex = 0;
    if (focus) btns[i].focus({ preventScroll: true });
  }

  // ---- Placement -------------------------------------------------------------------------------
  function clearPreview() { for (const i of preview) boards.mine.btns[i].classList.remove('pv', 'bad'); preview = []; }
  function showPreview(cells, ok) {
    clearPreview();
    preview = cells;
    for (const i of cells) { boards.mine.btns[i].classList.add('pv'); boards.mine.btns[i].classList.toggle('bad', !ok); }
  }
  // Clamp the origin so a ship dropped near the edge still fits on the grid.
  function originFor(len, i, vert) {
    let r = rowOf(i), c = colOf(i);
    if (vert) r = Math.min(r, N - len); else c = Math.min(c, N - len);
    return { r, c };
  }
  function hoverPreview(i) {
    if (game.phase !== 'place' || game.selK < 0) return clearPreview();
    const ship = game.me.ships[game.selK];
    const vert = isPlaced(ship) ? ship.vert : game.vert;
    const { r, c } = originFor(ship.len, i, vert);
    const cells = lineCells(r, c, ship.len, vert);
    showPreview(cells, fits(game.me, ship.k, cells, game.touch));
  }

  function placeStatus() {
    const left = game.me.ships.filter(s => !isPlaced(s)).length;
    setStatus(left ? t.toPlace(left) : t.allPlaced, left ? '' : 'win');
  }

  function selectShip(k) {
    if (game.phase !== 'place') return;
    game.selK = k;
    render();
  }

  function placeAt(k, i, vert) {
    const ship = game.me.ships[k];
    const { r, c } = originFor(ship.len, i, vert);
    const cells = lineCells(r, c, ship.len, vert);
    if (!fits(game.me, k, cells, game.touch)) { setStatus(t.cantPlace, 'lose'); announce(t.cantPlace); showPreview(cells, false); return false; }
    setShip(game.me, k, r, c, vert);
    game.selK = nextUnplaced();
    clearPreview();
    render();
    placeStatus();
    announce(t.placed(shipName(ship), coord(cells[0])));
    return true;
  }

  function rotateShip(k) {
    const ship = game.me.ships[k], vert = !ship.vert;

      const r = ship.r - (vert ? s : 0), c = ship.c - (vert ? 0 : s);
      const cells = lineCells(r, c, ship.len, vert);
      if (cells && fits(game.me, k, cells, game.touch)) {

        placeStatus();
        announce(t.rotated(shipName(ship)));
        return true;

    announce(t.cantPlace);
    return false;
  }

  function rotateAction() {
    if (game.phase !== 'place') return;
    const k = game.selK;
    if (k >= 0 && isPlaced(game.me.ships[k])) return rotateShip(k);
    game.vert = !game.vert;
    render();

  }

  function onMineCell(i) {
    if (game.phase !== 'place') return;
    const owner = game.me.owner[i];
    if (owner >= 0) {

      const ship = game.me.ships[owner];
      game.vert = ship.vert;

      game.selK = owner;

  }

  function cellAt(x, y) {
    const rect = boards.mine.cells.getBoundingClientRect();
    if (x < rect.left || y < rect.top || x >= rect.right || y >= rect.bottom) return -1;
    return Math.floor((y - rect.top) / rect.height * N) * N + Math.floor((x - rect.left) / rect.width * N);
  }

  function startDrag(e, k, from) {
    if (game.phase !== 'place' || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;

    let off = 0, vert;
    if (from === 'board') {

      const i = cellAt(e.clientX, e.clientY);
      if (i >= 0) off = Math.max(0, Math.min(ship.len - 1, vert ? rowOf(i) - ship.r : colOf(i) - ship.c));

      vert = game.vert;
      const rect = e.currentTarget.querySelector('.ship').getBoundingClientRect();

    drag = { k, from, off, vert, x0: e.clientX, y0: e.clientY, moved: false, id: e.pointerId, src: e.currentTarget, ghost: null, target: null };

  }

  function moveDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const ship = game.me.ships[drag.k];
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
      drag.moved = true;
      const cell = boards.mine.btns[0].getBoundingClientRect().width;
      drag.cell = cell;
      drag.ghost = shipEl({ ...ship, vert: drag.vert, r: 0, c: 0 }, ' ghost');
      drag.ghost.style.setProperty('--cell', `${cell}px`);
      document.body.append(drag.ghost);
      if (drag.from === 'board') drag.src.classList.add('lifted');

    }
    const { cell, off, vert } = drag;
    drag.ghost.style.left = `${e.clientX - (vert ? 0.5 : off + 0.5) * cell}px`;
    drag.ghost.style.top = `${e.clientY - (vert ? off + 0.5 : 0.5) * cell}px`;
    const i = cellAt(e.clientX, e.clientY);
    drag.target = null;
    if (i < 0) return clearPreview();
    const r = rowOf(i) - (vert ? off : 0), c = colOf(i) - (vert ? 0 : off);
    const cells = lineCells(r, c, ship.len, vert);
    if (!cells) {
      const o = originFor(ship.len, Math.max(0, r) * N + Math.max(0, c), vert);
      return showPreview(lineCells(o.r, o.c, ship.len, vert), false);
    }
    const ok = fits(game.me, drag.k, cells, game.touch);
    showPreview(cells, ok);
    if (ok) drag.target = { r, c };
  }

  function endDrag(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    d.ghost?.remove();
    d.src.classList.remove('lifted');
    clearPreview();
    if (game.phase !== 'place') return;
    const ship = game.me.ships[d.k];
    if (!d.moved) {
      if (cancelled) return;
      if (d.from === 'board') rotateShip(d.k); else selectShip(d.k);
      return;
    }
    if (d.target && !cancelled) {
      setShip(game.me, d.k, d.target.r, d.target.c, d.vert);
      game.selK = nextUnplaced();
      announce(t.placed(shipName(ship), coord(ship.cells[0])));
      render();
      placeStatus();
    } else {
      render();
      if (!cancelled) setStatus(t.cantPlace, 'lose');
    }
  }
  window.addEventListener('pointermove', moveDrag);
  window.addEventListener('pointerup', e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  function readyUp() {
    if (game.phase !== 'place' || nextUnplaced() >= 0) return;
    autoPlace(game.ai, game.touch);
    lastLayout[game.fleet] = game.me.ships.map(s => ({ r: s.r, c: s.c, vert: s.vert }));
    game.phase = 'battle';
    game.selK = -1;
    clearPreview();
    const meFirst = settings.first === 'you' || Math.random() < 0.5;
    game.turn = meFirst ? 'me' : 'ai';
    game.tab = meFirst ? 'enemy' : 'mine';
    game.busy = true;
    render();
    layout();
    const msg = meFirst ? t.youFirst : t.aiFirst;
    setStatus(msg);
    announce(msg);
    if (meFirst) later(700, beginMyTurn);
    else later(900, aiTurn);
    if (meFirst) boards.enemy.btns[cursor.enemy].focus({ preventScroll: true });
  }

  // ---- Battle ----------------------------------------------------------------------------------
  function myPrompt() {
    if (game.mode !== 'salvo') return t.yourTurn;
    const need = shotsFor(game.me, game.ai), left = need - game.sel.size;
    return left > 0 ? t.pickMore(left) : t.salvoReady(need);
  }

  function beginMyTurn() {
    game.turn = 'me';
    game.busy = false;
    game.sel.clear();
    game.tab = 'enemy';
    render();
    setStatus(myPrompt());
  }

  function onEnemyCell(i) {
    if (!game || game.phase !== 'battle' || game.turn !== 'me' || game.busy) return;
    if (game.ai.view[i] !== UNKNOWN) return;
    if (game.mode === 'salvo') {
      const need = shotsFor(game.me, game.ai);
      if (game.sel.has(i)) game.sel.delete(i);
      else if (game.sel.size < need) game.sel.add(i);
      else return;
      render();
      setStatus(myPrompt());
      return;
    }
    fireVolley([i]);
  }

  function fireSalvo() {
    if (game.phase !== 'battle' || game.turn !== 'me' || game.busy || game.mode !== 'salvo') return;
    if (game.sel.size !== shotsFor(game.me, game.ai)) return;
    fireVolley([...game.sel]);
  }

  function fireVolley(cells) {
    game.busy = true;
    game.sel.clear();
    let k = 0, hits = 0;
    const sunk = [];
    const shoot = () => {
      const res = fireAt(game.ai, cells[k++], game.touch);
      game.shots++;
      if (res.hit) { hits++; game.hits++; }
      if (res.sunk) sunk.push(res.sunk);
      render();
      fx('enemy', res.i, res.hit ? 'fx-hit' : 'fx-miss');
      if (res.sunk) sinkFx('enemy', res.sunk.k);
      if (cells.length === 1) {
        const msg = res.sunk ? t.youSunk(shipName(res.sunk)) : res.hit ? (game.bonus ? t.again : t.youHit(coord(res.i))) : t.youMiss(coord(res.i));
        setStatus(msg, res.hit ? 'hit' : 'miss');
        announce(msg);
      }
      if (k < cells.length) return later(220, shoot);
      if (cells.length > 1) {
        const msg = [t.salvoResult(hits, cells.length), ...sunk.map(s => t.youSunk(shipName(s)))].join(' · ');
        setStatus(msg, hits ? 'hit' : 'miss');
        announce(msg);
      }
      if (!afloat(game.ai)) return later(700, () => endGame(true));
      if (game.bonus && hits) return later(350, () => { game.busy = false; render(); });
      later(950, aiTurn);
    };
    shoot();
  }

  function aiTurn() {
    game.turn = 'ai';
    game.busy = true;
    game.sel.clear();
    game.tab = 'mine';
    render();
    setStatus(t.aiTurn);
    const picks = aiVolley(game.me.view, remainingLens(game.me), shotsFor(game.ai, game.me), game.level, game.touch);
    let k = 0, hits = 0;
    const sunk = [];
    const shoot = () => {
      const res = fireAt(game.me, picks[k++], game.touch);
      game.aiShots++;
      if (res.hit) hits++;
      if (res.sunk) sunk.push(res.sunk);
      render();
      fx('mine', res.i, res.hit ? 'fx-hit' : 'fx-miss');
      if (res.sunk) sinkFx('mine', res.sunk.k);
      if (picks.length === 1) {
        const msg = res.sunk ? t.aiSunk(shipName(res.sunk)) : res.hit ? t.aiHit(coord(res.i)) : t.aiMiss(coord(res.i));
        setStatus(msg, res.hit ? 'lose' : 'miss');
        announce(msg);
      }
      if (k < picks.length) return later(300, shoot);
      if (picks.length > 1) {
        const msg = [t.aiSalvo(hits, picks.length), ...sunk.map(s => t.aiSunk(shipName(s)))].join(' · ');
        setStatus(msg, hits ? 'lose' : 'miss');
        announce(msg);
      }
      if (!afloat(game.me)) return later(900, () => endGame(false));
      if (game.bonus && hits) return later(850, aiTurn);
      later(1000, beginMyTurn);
    };
    later(650, shoot);
  }

  function recordResult(win) {
    const key = `${game.mode}-${game.fleet}-${game.level}`;
    const s = { p: 0, w: 0, best: 0, shots: 0, hits: 0, ...stats[key] };
    s.p++;
    s.shots += game.shots;
    s.hits += game.hits;
    let newBest = false;
    if (win) {
      s.w++;
      if (!s.best || game.shots < s.best) { s.best = game.shots; newBest = true; }
    }
    stats[key] = s;
    write(STORE.stats, stats);
    return newBest;
  }

  function endGame(win) {
    game.phase = 'over';
    game.busy = true;
    game.won = win;
    game.tab = 'enemy';
    const newBest = recordResult(win);
    render();
    const title = win ? t.youWin : t.youLose;
    const text = win ? t.winText(game.shots) : t.loseText;
    const summary = t.summary(game.shots, game.hits, accuracy());
    setStatus(title, win ? 'win' : 'lose');
    els.resultEmoji.textContent = win ? '🏆' : '🌊';
    els.resultTitle.textContent = title;
    els.resultText.textContent = text;
    els.resultScore.textContent = summary;
    els.newBest.hidden = !newBest;
    announce(`${title} ${text} ${summary}`);
    later(win ? 1100 : 1700, () => {
      els.result.hidden = false;
      els.again.focus({ preventScroll: true });
    });
  }

  // ---- Game flow & panels ----------------------------------------------------------------------
  function startGame(keepLayout) {
    stopTimers();
    if (drag) { drag.ghost?.remove(); drag = null; }
    game = newGameState();
    const saved = keepLayout && lastLayout[game.fleet];
    if (saved) saved.forEach((p, k) => {
      const cells = lineCells(p.r, p.c, game.me.ships[k].len, p.vert);
      if (fits(game.me, k, cells, game.touch)) setShip(game.me, k, p.r, p.c, p.vert);
    });
    game.selK = nextUnplaced();
    started = true;
    els.setup.hidden = els.result.hidden = els.stats.hidden = true;
    clearPreview();
    render();
    layout();
    if (nextUnplaced() < 0) placeStatus(); else setStatus(t.placeHint);
    announce(t.placeHint);
    boards.mine.btns[cursor.mine].focus({ preventScroll: true });
  }

  function renderSetup() {
    for (const group of document.querySelectorAll('#setup .seg')) {
      for (const btn of group.children) btn.setAttribute('aria-pressed', String(settings[group.dataset.key] === btn.dataset.value));
    }
    $('field-bonus').hidden = settings.mode !== 'classic';
    $('h-mode').textContent = settings.mode === 'classic' ? t.classicHint : t.salvoHint;
    $('h-level').textContent = t[`${settings.level}Hint`];
    $('h-fleet').textContent = settings.fleet === 'classic' ? t.fleet5Hint : t.fleet10Hint;
    els.resume.hidden = !started || game.phase === 'over';
  }

  function openSetup() {
    renderSetup();
    els.result.hidden = true;
    els.stats.hidden = true;
    els.setup.hidden = false;
    els.start.focus({ preventScroll: true });
  }

  function openStats() {
    const modeName = settings.mode === 'classic' ? t.classic : t.salvo;
    const fleetName = settings.fleet === 'classic' ? t.fleet5 : t.fleet10;
    $('stats-for').textContent = t.statsFor(modeName, fleetName);
    $('stats-body').replaceChildren(...OPTIONS.level.map(level => {
      const s = stats[`${settings.mode}-${settings.fleet}-${level}`] || { p: 0, w: 0, best: 0, shots: 0, hits: 0 };
      const tr = document.createElement('tr');
      const cells = [t[level], s.p, s.p ? `${s.w} (${Math.round(s.w / s.p * 100)}%)` : '–', s.best || '–', s.shots ? `${Math.round(s.hits / s.shots * 100)}%` : '–'];
      cells.forEach((v, n) => { const td = document.createElement(n ? 'td' : 'th'); if (!n) td.scope = 'row'; td.textContent = String(v); tr.append(td); });
      return tr;
    }));
    els.setup.hidden = true;
    els.stats.hidden = false;
    $('stats-close').focus({ preventScroll: true });
  }

  for (const group of document.querySelectorAll('#setup .seg')) {
    group.addEventListener('click', event => {
      const btn = event.target.closest('button');
      if (!btn) return;
      settings[group.dataset.key] = btn.dataset.value;
      renderSetup();
    });
  }
  els.start.addEventListener('click', () => { write(STORE.settings, settings); startGame(true); });
  els.resume.addEventListener('click', () => { els.setup.hidden = true; });
  $('stats-btn').addEventListener('click', openStats);
  $('stats-close').addEventListener('click', openSetup);
  $('menu-btn').addEventListener('click', openSetup);
  $('new-btn').addEventListener('click', () => startGame(true));
  els.again.addEventListener('click', () => startGame(true));
  $('change').addEventListener('click', openSetup);
  $('view').addEventListener('click', () => { els.result.hidden = true; $('new-btn').focus({ preventScroll: true }); });
  els.rotate.addEventListener('click', rotateAction);
  els.random.addEventListener('click', () => {
    if (game.phase !== 'place') return;
    autoPlace(game.me, game.touch);
    game.selK = -1;
    clearPreview();
    render();
    placeStatus();
  });
  els.clear.addEventListener('click', () => {
    if (game.phase !== 'place') return;
    game.me.ships.forEach(s => liftShip(game.me, s.k));
    game.selK = 0;
    clearPreview();
    render();
    placeStatus();
  });
  els.ready.addEventListener('click', readyUp);
  els.fire.addEventListener('click', fireSalvo);
  for (const tab of [els.tabEnemy, els.tabMine]) tab.addEventListener('click', () => showTab(tab.dataset.tab));

  boards.enemy.cells.addEventListener('click', e => { const b = e.target.closest('.cell'); if (b) onEnemyCell(Number(b.dataset.i)); });
  boards.mine.cells.addEventListener('click', e => { const b = e.target.closest('.cell'); if (b) onMineCell(Number(b.dataset.i)); });
  for (const key of ['enemy', 'mine']) {
    boards[key].cells.addEventListener('focusin', e => {
      const b = e.target.closest('.cell');
      if (!b) return;
      setCursor(key, Number(b.dataset.i), false);
      if (key === 'mine' && !drag) hoverPreview(Number(b.dataset.i));
    });
  }
  boards.mine.cells.addEventListener('pointermove', e => {
    if (drag || e.pointerType === 'touch') return;
    const b = e.target.closest('.cell');
    if (b) hoverPreview(Number(b.dataset.i));
  });
  boards.mine.cells.addEventListener('pointerleave', () => { if (!drag) clearPreview(); });
  boards.mine.cells.addEventListener('focusout', e => { if (!boards.mine.cells.contains(e.relatedTarget) && !drag) clearPreview(); });

  const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  const overlayOpen = () => !els.setup.hidden || !els.result.hidden || !els.stats.hidden;
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || !game || overlayOpen()) return;
    const key = e.key;
    if (ARROWS[key]) {
      const focused = document.activeElement?.closest?.('.cells');
      let bk = focused === boards.enemy.cells ? 'enemy' : focused === boards.mine.cells ? 'mine' : null;
      if (!bk && document.activeElement?.closest?.('.tabs')) return;
      e.preventDefault();
      if (!bk) bk = game.phase === 'place' ? 'mine' : 'enemy';
      if (game.phase !== 'place' && app.dataset.arr === 'tabs' && game.tab !== bk) showTab(bk);
      const [dr, dc] = ARROWS[key];
      const n = focused ? step(cursor[bk], dr, dc) : cursor[bk];
      setCursor(bk, n < 0 ? cursor[bk] : n, true);
      return;
    }
    if (game.phase === 'place') {
      if (key === 'r' || key === 'R') { e.preventDefault(); rotateAction(); }
      else if (/^[0-9]$/.test(key)) {
        const k = key === '0' ? 9 : Number(key) - 1;
        if (k < game.me.ships.length) { e.preventDefault(); selectShip(k); hoverPreview(cursor.mine); }
      } else if ((key === 'Delete' || key === 'Backspace') && game.selK >= 0 && isPlaced(game.me.ships[game.selK])) {
        e.preventDefault();
        liftShip(game.me, game.selK);
        render();
        placeStatus();
      }
    } else if ((key === 'f' || key === 'F') && game.phase === 'battle' && game.mode === 'salvo') {
      e.preventDefault();
      fireSalvo();
    }
  });

  // Read-only state for automated checks, plus an AI benchmark on fresh random fleets.
  // The computer's fleet layout is deliberately not exposed.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__seaBattle = Object.freeze({
    snapshot: () => ({
      phase: game.phase, turn: game.turn, busy: game.busy, mode: game.mode, level: game.level, fleet: game.fleet, bonus: game.bonus,
      shots: game.shots, hits: game.hits, aiShots: game.aiShots, won: game.won, tab: game.tab, arrangement: app.dataset.arr,
      salvoShots: game.phase === 'battle' ? shotsFor(game.me, game.ai) : 0, selected: [...game.sel],
      enemyView: Array.from(game.ai.view), enemyShips: game.ai.ships.map(s => ({ type: s.type, len: s.len, sunk: s.sunk })),
      myView: Array.from(game.me.view), myShips: game.me.ships.map(s => ({ type: s.type, len: s.len, cells: [...s.cells], vert: s.vert, sunk: s.sunk })),
    }),
    simulate(level = 'hard', games = 100, fleet = 'classic') {
      const touch = fleet === 'classic';
      let total = 0, min = Infinity, max = 0;
      for (let g = 0; g < games; g++) {
        const side = makeSide(fleet);
        autoPlace(side, touch);
        let shots = 0;
        while (afloat(side) && shots < CELLS) {
          const i = aiPick(side.view, remainingLens(side), level, touch);
          if (i < 0 || side.view[i] !== UNKNOWN) break;
          fireAt(side, i, touch);
          shots++;
        }
        total += shots; min = Math.min(min, shots); max = Math.max(max, shots);
      }
      return { avg: total / games, min, max };
    },
  });

  buildBoards();
  game = newGameState();
  render();
  layout();
  setStatus(t.placeHint);
  renderSetup();
  els.start.focus({ preventScroll: true });
})();
</script>
</body>
</html>
