<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parking Escape</title>
<style>
:root {
  --ink: #1f2a3a;
  --muted: #5b6b7c;
  --mint: #8fd8c7;
  --mint-dark: #5fb8a5;
  --paper: #fffdf7;
  --curb: #ece4d0;
  --curb-dark: #cfc4a8;
  --asphalt: #464e5e;
  --line: #ffffff1c;
  --yellow: #ffc93c;
  --yellow-dark: #d9a20f;
  --red: #ef4545;
  --star: #f2a93b;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--mint);
  background-image: linear-gradient(135deg, #ffffff22 25%, transparent 25%, transparent 50%, #ffffff22 50%, #ffffff22 75%, transparent 75%);
  background-size: 36px 36px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
header { display: flex; align-items: center; gap: 10px; }
h1 { flex: 1; min-width: 0; font-size: clamp(22px, 7vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; }
h1 span { color: #c22f2f; }
.icon-btn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 14px; background: var(--paper); font-size: 20px; font-weight: 900; box-shadow: 0 4px 0 var(--mint-dark); }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--mint-dark); }
.hud { display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 6px 6px; border-radius: 14px; background: #ffffffb8; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.25; }
.stat strong.over { color: #c22f2f; }
.goal { text-align: center; font-size: 13px; font-weight: 700; color: #2d4a52; line-height: 1.3; }
.goal b { display: inline-block; padding: 1px 8px; margin-right: 4px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 11px; letter-spacing: .03em; }

.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; overflow: hidden; }
/* Everything on the board is measured in cells: a 6-cell lot, a quarter-cell curb and a road stub on the right. */
.stage { --cell: min(calc(100cqw / 7.6), calc(100cqh / 6.6)); position: relative; width: calc(var(--cell) * 7.6); height: calc(var(--cell) * 6.6); }
.yard { position: absolute; left: calc(var(--cell) * .55); top: calc(var(--cell) * .05); width: calc(var(--cell) * 6.5); height: calc(var(--cell) * 6.5); border-radius: calc(var(--cell) * .32); background: var(--curb); box-shadow: 0 calc(var(--cell) * .1) 0 var(--curb-dark), 0 14px 30px #1f2a3a33; }
.exit { position: absolute; left: calc(var(--cell) * 6.75); top: calc(var(--cell) * 2.3); width: calc(var(--cell) * .85); height: var(--cell); border-radius: 0 calc(var(--cell) * .2) calc(var(--cell) * .2) 0; background: var(--asphalt); display: grid; place-items: center; overflow: hidden; }
.exit span { font-size: calc(var(--cell) * .42); font-weight: 900; color: var(--yellow); letter-spacing: -.12em; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(calc(var(--cell) * .08)); } }
.lot {
  position: absolute; left: calc(var(--cell) * .8); top: calc(var(--cell) * .3); width: calc(var(--cell) * 6); height: calc(var(--cell) * 6);
  border-radius: calc(var(--cell) * .18);
  background-color: var(--asphalt);
  background-image: linear-gradient(var(--line) 2px, transparent 2px), linear-gradient(90deg, var(--line) 2px, transparent 2px);
  background-size: var(--cell) var(--cell);
  background-position: -1px -1px;
  touch-action: none;
}
.lot:focus-visible { outline: 3px solid var(--ink); outline-offset: calc(var(--cell) * .3); }
.lane { position: absolute; left: calc(var(--cell) * .2); right: calc(var(--cell) * -.75); top: calc(var(--cell) * 2.5 - 2px); height: 4px; background: repeating-linear-gradient(90deg, #ffc93c66 0 14px, transparent 14px 26px); pointer-events: none; }

.veh { position: absolute; left: 0; top: 0; width: calc(var(--w) * var(--cell)); height: calc(var(--h) * var(--cell)); padding: calc(var(--cell) * .08); transform: translate(calc(var(--x) * var(--cell)), calc(var(--y) * var(--cell))); transition: transform .16s cubic-bezier(.3, 1.3, .6, 1); z-index: 1; touch-action: none; cursor: grab; }
.veh.dragging { transition: none; z-index: 3; cursor: grabbing; }
.veh.leaving { transition: transform .7s cubic-bezier(.5, 0, .9, .5), opacity .3s .45s; opacity: 0; z-index: 3; }
.veh:focus-visible { outline: 3px solid #fff; outline-offset: -1px; border-radius: calc(var(--cell) * .2); }
.body {
  position: relative; display: block; width: 100%; height: 100%;
  border-radius: calc(var(--cell) * .2);
  background: radial-gradient(circle at 30% 25%, #ffffff30, transparent 60%), var(--c);
  box-shadow: 0 calc(var(--cell) * .06) 0 #0000004d, inset 0 0 0 calc(var(--cell) * .035) #00000026;
}
/* Cabin: a lighter roof framed by a big front windshield and a smaller rear window. Cars face right or up. */
.body::after { content: ""; position: absolute; border-radius: calc(var(--cell) * .12); background: var(--c2); border: 0 solid #22324d; }
.veh.h .body::after { left: 18%; right: 14%; top: 13%; bottom: 13%; border-width: 0 calc(var(--cell) * .26) 0 calc(var(--cell) * .17); }
.veh.v .body::after { top: 14%; bottom: 18%; left: 13%; right: 13%; border-width: calc(var(--cell) * .26) 0 calc(var(--cell) * .17) 0; }
.veh.truck .body { background: linear-gradient(var(--dir), var(--c) 0 25%, #00000059 25% 27.5%, var(--c2) 27.5%); }
.veh.truck.h .body { --dir: to left; }
.veh.truck.v .body { --dir: to bottom; }
.veh.truck .body::after { background: #22324d; border: 0; }
.veh.truck.h .body::after { left: auto; right: 6%; width: 9%; top: 14%; bottom: 14%; }
.veh.truck.v .body::after { top: 6%; height: 9%; bottom: auto; left: 14%; right: 14%; }
.veh.truck .body::before { content: ""; position: absolute; border-radius: calc(var(--cell) * .08); }
.veh.truck.h .body::before { left: 6%; right: 32%; top: 18%; bottom: 18%; background: repeating-linear-gradient(90deg, #ffffff4d 0 3px, transparent 3px 14px); }
.veh.truck.v .body::before { top: 32%; bottom: 6%; left: 18%; right: 18%; background: repeating-linear-gradient(0deg, #ffffff4d 0 3px, transparent 3px 14px); }
.veh.hero .body::before { content: "★"; position: absolute; left: 50%; top: 50%; transform: translate(-60%, -50%); font-size: calc(var(--cell) * .36); line-height: 1; color: #fff; z-index: 1; }
.veh.hero.h .body::before { left: 44%; }
.veh.hinted .body { animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.25); box-shadow: 0 0 0 calc(var(--cell) * .06) var(--yellow), 0 calc(var(--cell) * .06) 0 #0000004d; } }
.ghost { position: absolute; left: 0; top: 0; width: calc(var(--w) * var(--cell)); height: calc(var(--h) * var(--cell)); transform: translate(calc(var(--x) * var(--cell)), calc(var(--y) * var(--cell))); padding: calc(var(--cell) * .08); pointer-events: none; z-index: 0; }
.ghost::before { content: ""; display: block; width: 100%; height: 100%; border-radius: calc(var(--cell) * .2); border: 3px dashed var(--yellow); background: #ffc93c22; }
.ghost[hidden] { display: none; }
.lot.won .veh:not(.hero) .body { animation: hop .45s calc(var(--i) * 40ms) both; }
@keyframes hop { 50% { transform: translateY(calc(var(--cell) * -.12)); } }

.tools { display: flex; gap: 8px; }
.tool { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border-radius: 16px; background: var(--paper); box-shadow: 0 4px 0 var(--mint-dark); font-size: 15px; font-weight: 800; }
.tool span:first-child { font-size: 18px; }
.tool span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--mint-dark); }
.tool:disabled { opacity: .5; cursor: default; }
.tool.hint-btn { background: var(--yellow); box-shadow: 0 4px 0 var(--yellow-dark); }
.tool.hint-btn:active:not(:disabled) { box-shadow: 0 1px 0 var(--yellow-dark); }
.help { text-align: center; font-size: 12px; font-weight: 700; color: #2d4a52; }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); background: #1f2a3a73; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 380px); max-height: 100%; overflow: auto; background: var(--paper); border-radius: 28px; padding: 24px 22px; text-align: center; box-shadow: 0 20px 50px #0005; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 26px; font-weight: 900; line-height: 1.15; }
.panel h2 span { color: #c22f2f; }
.panel .emoji { font-size: 46px; line-height: 1.2; }
.panel p { margin-top: 8px; color: var(--muted); line-height: 1.45; }
.panel .small { font-size: 13px; }
.stars { margin-top: 6px; font-size: 38px; letter-spacing: 4px; color: #e3d9bf; }
.stars b { color: var(--star); }
.result { font-size: 18px; font-weight: 700; color: var(--ink) !important; }
.badge { display: inline-block; margin-top: 10px; padding: 5px 14px; border-radius: 99px; background: var(--star); color: #fff !important; font-size: 14px; font-weight: 800; }
.badge[hidden], .note[hidden] { display: none; }
.cta { margin-top: 18px; width: 100%; padding: 15px; border-radius: 18px; background: var(--red); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 #b52b2b; }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 #b52b2b; }
.cta[hidden] { display: none; }
.secondary { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; border: 2px solid #e6dcc0; font-weight: 800; }
.tier { margin-top: 14px; text-align: left; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 6px; }
.level-btn { aspect-ratio: 1; display: grid; place-content: center; gap: 1px; border-radius: 14px; background: #eef7f3; box-shadow: 0 3px 0 #bfe0d6; font-size: 17px; font-weight: 900; }
.level-btn small { font-size: 9px; letter-spacing: 1px; color: var(--star); min-height: 11px; }
.level-btn.current { background: var(--red); color: #fff; box-shadow: 0 3px 0 #b52b2b; }
.level-btn.current small { color: #ffe9a8; }
.level-btn:disabled { opacity: .45; cursor: default; box-shadow: none; }

@media (min-aspect-ratio: 4/3) { .app { max-width: 640px; } }
@media (max-height: 560px) { .help, .goal { display: none; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Parking <span>Escape</span></h1>
    <button type="button" class="icon-btn" id="open-levels" data-i18n-label="levels">☰</button>
  </header>
  <div class="hud">
    <div class="stat"><small data-i18n="level"></small><strong id="level">1</strong></div>
    <div class="stat"><small data-i18n="moves"></small><strong id="moves">0</strong></div>
    <div class="stat"><small data-i18n="optimal"></small><strong id="optimal">–</strong></div>
  </div>
  <p class="goal" id="goal"></p>
  <div class="board-wrap">
    <div class="stage">
      <div class="yard" aria-hidden="true"></div>
      <div class="exit" aria-hidden="true"><span>›››</span></div>
      <div class="lot" id="lot" role="group">
        <div class="lane" aria-hidden="true"></div>
        <div class="ghost" id="ghost" aria-hidden="true" hidden></div>
      </div>
    </div>
  </div>
  <div class="tools">
    <button type="button" class="tool" id="undo"><span aria-hidden="true">↶</span><span data-i18n="undo"></span></button>
    <button type="button" class="tool hint-btn" id="hint"><span aria-hidden="true">💡</span><span data-i18n="hint"></span></button>
    <button type="button" class="tool" id="restart"><span aria-hidden="true">↻</span><span data-i18n="restart"></span></button>
  </div>
  <p class="help" data-i18n="dragHint"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="intro">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <p class="emoji" aria-hidden="true">🚗💨</p>
    <h2 id="intro-title">Parking <span>Escape</span></h2>
    <p data-i18n="tagline"></p>
    <p class="small" data-i18n="controls"></p>
    <button type="button" class="cta" id="play"></button>
    <button type="button" class="secondary" id="intro-levels" data-i18n="chooseLevel"></button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🎉</p>
    <h2 id="win-title"></h2>
    <p class="stars" id="stars"></p>
    <p class="result" id="result"></p>
    <p class="small note" id="win-note"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="next" data-i18n="next"></button>
    <button type="button" class="secondary" id="replay" data-i18n="replay"></button>
  </div>
</div>

<div class="overlay" id="levels" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="levels-title">
    <h2 id="levels-title" data-i18n="chooseLevel"></h2>
    <div id="level-list"></div>
    <button type="button" class="secondary" id="close-levels" data-i18n="close"></button>
  </div>
</div>

  }

  function updateHud() {
    els.level.textContent = `${game.level}/${LEVELS.length}`;
    els.moves.textContent = String(game.history.length);
    els.moves.classList.toggle('over', game.history.length > game.optimal);
    els.optimal.textContent = String(game.optimal);
    els.undo.disabled = !game.history.length || game.done;
    els.hint.disabled = game.done;
  }

  function startLevel(number, restore = null) {
    const vehicles = parseLevel(LEVELS[number - 1]);
    game = { level: number, vehicles, pos: vehicles.map(v => v.start), history: [], hintUsed: false, done: false, els: [], optimal: 0 };
    game.optimal = solve(game.pos.slice()).length;
    if (restore && restore.level === number && restore.pos?.length === vehicles.length) {
      game.pos = restore.pos.slice();
      game.history = restore.history || [];
      game.hintUsed = Boolean(restore.hintUsed);
    }
    lot.classList.remove('won');
    lot.querySelectorAll('.veh').forEach(el => el.remove());
    // Tab order follows reading order of the starting layout.
    const order = vehicles.map((v, i) => i).sort((a, b) => {
      const ra = vehicles[a].h ? vehicles[a].fix : vehicles[a].start, rb = vehicles[b].h ? vehicles[b].fix : vehicles[b].start;
      const ca = vehicles[a].h ? vehicles[a].start : vehicles[a].fix, cb = vehicles[b].h ? vehicles[b].start : vehicles[b].fix;
      return ra - rb || ca - cb;
    });
    vehicles.forEach((v, i) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = `veh ${v.h ? 'h' : 'v'}${v.len === 3 ? ' truck' : ''}${v.hero ? ' hero' : ''}`;
      el.dataset.i = i;
      el.style.setProperty('--w', v.h ? v.len : 1);
      el.style.setProperty('--h', v.h ? 1 : v.len);
      el.style.setProperty('--c', v.color);
      el.style.setProperty('--c2', v.light);
      el.style.setProperty('--i', i);
      el.innerHTML = '<span class="body" aria-hidden="true"></span>';
      game.els[i] = el;
    });
    lot.append(...order.map(i => game.els[i]));
    vehicles.forEach((v, i) => { place(i); label(i); });
    clearHint();
    const tier = tierOf(number);
    els.goal.innerHTML = '';
    const pill = document.createElement('b');
    pill.textContent = t.tiers[tier];
    els.goal.append(pill, t.goal(game.optimal));
    updateHud();
    progress.current = number;
    persist();
    for (const overlay of [els.win, els.levels, els.intro]) overlay.hidden = true;
  }

  function persist() {
    progress.save = game.done ? null : { level: game.level, pos: game.pos, history: game.history, hintUsed: game.hintUsed };
    saveProgress();
  }

  function clearHint() {
    game.els.forEach(el => el.classList.remove('hinted'));
    els.ghost.hidden = true;
  }

  // One move is one vehicle sliding any distance, so consecutive slides of the same vehicle merge into one.
  function commit(i, to, dirName) {
    const from = game.pos[i];
    if (to === from || game.done) return;
    const last = game.history[game.history.length - 1];
    if (last && last.v === i) {
      last.to = to;
      if (last.from === to) game.history.pop();
    } else {
      game.history.push({ v: i, from, to });
    }
    game.pos[i] = to;
    place(i);
    label(i);
    clearHint();
    const v = game.vehicles[i];
    const dir = dirName || (v.h ? (to > from ? 'right' : 'left') : (to > from ? 'down' : 'up'));
    announce(t.moved(t.vname(v.key, v.len === 3), t.dirs[dir]));
    if (i === 0 && to === EXIT_POS) return win();
    updateHud();
    persist();
  }

  function undo() {
    if (game.done || !game.history.length) return;
    const last = game.history.pop();
    game.pos[last.v] = last.from;
    place(last.v);
    label(last.v);
    clearHint();
    updateHud();
    persist();
    announce(t.undone);
  }

  function hint() {
    if (game.done) return;
    const path = solve(game.pos.slice());
    if (!path || !path.length) return;
    const { v: i, to } = path[0];
    const v = game.vehicles[i];
    clearHint();
    game.hintUsed = true;
    persist();
    game.els[i].classList.add('hinted');
    els.ghost.style.setProperty('--w', v.h ? v.len : 1);
    els.ghost.style.setProperty('--h', v.h ? 1 : v.len);
    els.ghost.style.setProperty('--x', v.h ? to : v.fix);
    els.ghost.style.setProperty('--y', v.h ? v.fix : to);
    els.ghost.hidden = false;
    const dir = v.h ? (to > game.pos[i] ? 'right' : 'left') : (to > game.pos[i] ? 'down' : 'up');
    announce(t.hintSay(t.vname(v.key, v.len === 3), t.dirs[dir], path.length));
  }

  function starsFor(moves) {
    const o = game.optimal;
    const stars = moves <= o ? 3 : moves <= o + Math.max(2, Math.ceil(o * 0.5)) ? 2 : 1;
    return game.hintUsed ? Math.min(stars, 2) : stars;
  }

  function win() {
    game.done = true;
    updateHud();
    const moves = game.history.length;
    const stars = starsFor(moves);
    const key = String(game.level);
    const previous = progress.best[key];
    const better = !previous || moves < previous;
    if (better) progress.best[key] = moves;
    progress.stars[key] = Math.max(progress.stars[key] ?? 0, stars);
    progress.unlocked = Math.min(LEVELS.length, Math.max(progress.unlocked, game.level + 1));
    progress.current = Math.min(LEVELS.length, game.level + 1);
    persist();

    const hero = game.els[0];
    hero.classList.add('leaving');
    hero.style.setProperty('--x', 8.2);
    lot.classList.add('won');
    announce(t.escaped);

    const last = game.level === LEVELS.length;
    els.winTitle.textContent = last ? t.allDone : t.won(game.level);
    els.stars.innerHTML = starText(stars);
    els.stars.setAttribute('aria-label', t.starsLabel(stars));
    els.result.textContent = t.result(moves, game.optimal);
    els.winNote.textContent = game.hintUsed ? t.hintUsed : moves <= game.optimal ? t.perfect : '';
    els.winNote.hidden = !els.winNote.textContent;
    els.newBest.hidden = !better || !previous;
    els.next.hidden = last;
    setTimeout(() => {
      if (!game.done) return;
      els.win.hidden = false;
      announce(`${els.winTitle.textContent} ${t.starsLabel(stars)}. ${t.result(moves, game.optimal)}`);
      (last ? $('replay') : els.next).focus({ preventScroll: true });
    }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 150 : 850);
  }

  function openLevels() {
    els.levelList.replaceChildren();
    t.tiers.forEach((name, tier) => {
      const heading = document.createElement('p');
      heading.className = 'tier';
      heading.textContent = name;
      const grid = document.createElement('div');
      grid.className = 'level-grid';
      for (let number = (TIERS[tier - 1] ?? 0) + 1; number <= TIERS[tier]; number++) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `level-btn${number === game.level ? ' current' : ''}`;
        const locked = number > progress.unlocked;
        const stars = progress.stars[number] ?? 0;
        button.disabled = locked;
        button.innerHTML = `<span>${locked ? '🔒' : number}</span><small>${'★'.repeat(stars)}</small>`;
        button.setAttribute('aria-label', `${t.levelN(number)}, ${locked ? t.locked : t.starsLabel(stars)}`);
        button.addEventListener('click', () => { startLevel(number); focusHero(); });
        grid.append(button);
      }
      els.levelList.append(heading, grid);
    });
    els.levels.hidden = false;
    const current = els.levelList.querySelector('.current');
    current?.focus({ preventScroll: true });
    current?.scrollIntoView({ block: 'center' });
  }

  const focusHero = () => game.els[0].focus({ preventScroll: true });
  const overlayOpen = () => !els.win.hidden || !els.levels.hidden || !els.intro.hidden;

  // Dragging: the vehicle follows the pointer inside its free range, then snaps to the nearest cell.
  lot.addEventListener('pointerdown', event => {
    const el = event.target.closest('.veh');
    if (!el || game.done || drag) return;
    const i = Number(el.dataset.i);
    const v = game.vehicles[i];
    const cellPx = lot.getBoundingClientRect().width / N;
    const [min, max] = range(i);
    drag = { i, el, id: event.pointerId, start: v.h ? event.clientX : event.clientY, from: game.pos[i], at: game.pos[i], min, max, cellPx, moved: false };
    el.setPointerCapture(event.pointerId);
  });
  lot.addEventListener('pointermove', event => {
    if (!drag || event.pointerId !== drag.id) return;
    const v = game.vehicles[drag.i];
    const delta = (v.h ? event.clientX : event.clientY) - drag.start;
    if (!drag.moved && Math.abs(delta) < 5) return;
    drag.moved = true;
    drag.el.classList.add('dragging');
    drag.at = Math.max(drag.min, Math.min(drag.max, drag.from + delta / drag.cellPx));
    place(drag.i, drag.at);
  });
  function endDrag(event, cancel) {
    if (!drag || event.pointerId !== drag.id) return;
    const { i, el, at, moved } = drag;
    drag = null;
    el.classList.remove('dragging');
    if (!moved) return;
    if (cancel) { place(i); return; }
    const to = Math.round(at);
    if (to === game.pos[i]) place(i);
    else commit(i, to);
  }
  lot.addEventListener('pointerup', event => endDrag(event, false));
  lot.addEventListener('pointercancel', event => endDrag(event, true));

  function focusNeighbour(i, dr, dc) {
    // Jump to the nearest vehicle whose centre lies in the pressed direction.
    const centre = j => {
      const v = game.vehicles[j];
      return v.h ? [v.fix + 0.5, game.pos[j] + v.len / 2] : [game.pos[j] + v.len / 2, v.fix + 0.5];
    };
    const [r0, c0] = centre(i);
    let best = -1, bestScore = Infinity;
    game.vehicles.forEach((v, j) => {
      if (j === i) return;
      const [r, c] = centre(j);
      const along = dr ? (r - r0) * dr : (c - c0) * dc;
      const across = dr ? Math.abs(c - c0) : Math.abs(r - r0);
      if (along <= 0.25) return;
      const score = along + across * 2;
      if (score < bestScore) { bestScore = score; best = j; }
    });
    if (best >= 0) game.els[best].focus();
  }

  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || overlayOpen() || !game || game.done) return;
    const key = event.key.toLowerCase();
    if (key === 'u') { event.preventDefault(); undo(); return; }
    if (key === 'h') { event.preventDefault(); hint(); return; }
    const step = STEP[event.key];
    if (!step) return;
    const el = document.activeElement?.closest?.('.veh');
    event.preventDefault();
    if (!el) { focusHero(); return; }
    const i = Number(el.dataset.i);
    const v = game.vehicles[i];
    const [dr, dc, dirName] = step;
    if ((v.h && dc) || (!v.h && dr)) {
      const to = game.pos[i] + (dr || dc);
      const [min, max] = range(i);
      if (to >= min && to <= max) commit(i, to, dirName);
    } else {
      focusNeighbour(i, dr, dc);
    }
  });

  els.undo.addEventListener('click', undo);
  els.hint.addEventListener('click', hint);
  $('restart').addEventListener('click', () => {
    const used = game.hintUsed;
    startLevel(game.level);
    game.hintUsed = used;
    persist();
    focusHero();
  });
  $('open-levels').addEventListener('click', openLevels);
  $('intro-levels').addEventListener('click', openLevels);
  $('close-levels').addEventListener('click', () => { els.levels.hidden = true; if (els.intro.dataset.seen) focusHero(); else els.play.focus(); });
  els.next.addEventListener('click', () => { startLevel(game.level + 1); focusHero(); });
  $('replay').addEventListener('click', () => { startLevel(game.level); focusHero(); });
  els.play.addEventListener('click', () => { els.intro.hidden = true; els.intro.dataset.seen = '1'; focusHero(); });

  const first = Math.min(Math.max(1, progress.current || 1), progress.unlocked, LEVELS.length);
  startLevel(first, progress.save);
  els.intro.hidden = false;
  els.play.textContent = t.play(first);
  els.play.focus({ preventScroll: true });
})();
</script>
</body>
</html>
