<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jigsaw Puzzle</title>
<style>
:root {
  --bg: #221812;
  --bg-2: #3d2b1f;
  --text: #fff5e8;
  --muted: #d6bfa6;
  --teal: #2fc4a6;
  --teal-dark: #1b8d76;
  --sun: #ffc24b;
  --sun-dark: #d39126;
  --paper: #fff8ee;
  --ink: #34251c;
  --ink-muted: #7d6858;
  --chip: #00000038;
  --side: clamp(176px, 19vw, 252px);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background-color: var(--bg);
  background-image: radial-gradient(120% 90% at 50% 20%, var(--bg-2), var(--bg) 72%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button, a { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

.app {
  height: 100%; margin: auto;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "hud" "bar" "stage" "tools";
  gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}
.top { grid-area: top; display: flex; align-items: center; gap: 8px; min-width: 0; }
.title { flex: 1; min-width: 0; }
h1 { font-size: clamp(20px, 6.2vw, 28px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; white-space: nowrap; }
h1 span { color: var(--teal); }
.sub { margin-top: 2px; font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { flex: 0 0 auto; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff1c; }
.icon-btn svg, .tool svg, .zoom svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:active, .tool:active, .zoom button:active { transform: translateY(2px); }

.hud { grid-area: hud; display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 4px 6px 5px; border-radius: 12px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff12; text-align: center; }
.stat small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
.bar { grid-area: bar; height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--sun)); transition: width .3s; }
.preview { grid-area: preview; display: none; position: relative; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: #0003; box-shadow: 0 0 0 3px #ffffff18, 0 8px 22px #0006; }
.preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.stage { grid-area: stage; position: relative; min-height: 0; min-width: 0; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 2px #00000040, 0 10px 30px #0005; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.stage canvas:focus { outline: none; }
.stage canvas:focus-visible { outline: 3px solid #ffc24b99; outline-offset: -3px; }
.zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
.zoom button { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: #1c130ecc; color: var(--text); box-shadow: inset 0 0 0 1px #ffffff26, 0 3px 8px #0005; }
.zoom svg { width: 20px; height: 20px; }
.toast { position: absolute; left: 50%; top: 10px; translate: -50% 0; max-width: 80%; padding: 7px 14px; border-radius: 99px; background: #140d09d9; font-size: 13px; font-weight: 800; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 2; }
.toast.show { opacity: 1; }

.tools { grid-area: tools; display: flex; gap: 6px; }
.tool { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; padding: 5px 4px; border-radius: 14px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff14; font-size: 12px; font-weight: 800; }
.tool > span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool[aria-pressed="true"] { background: var(--teal); color: #08241e; box-shadow: 0 3px 0 var(--teal-dark); }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 12px; background: #120b07b8; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; overscroll-behavior: contain; background: var(--paper); color: var(--ink); border-radius: 26px; padding: 22px 20px; text-align: center; box-shadow: 0 22px 54px #0009; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.panel h2 span { color: var(--teal-dark); }
.panel .text { margin-top: 6px; color: var(--ink-muted); font-size: 14px; line-height: 1.4; }
.panel :focus-visible { outline-color: var(--teal-dark); }
.cta { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 13px 10px; border-radius: 18px; background: var(--teal); color: #072a22; font-size: 18px; font-weight: 900; line-height: 1.15; box-shadow: 0 5px 0 var(--teal-dark); }
.cta small { display: block; max-width: 100%; margin-top: 2px; font-size: 12px; font-weight: 700; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cta.alt { background: var(--sun); color: #3b2706; box-shadow: 0 5px 0 var(--sun-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--teal-dark); }
.cta.alt:active { box-shadow: 0 2px 0 var(--sun-dark); }
.ghost { width: 100%; padding: 10px; border-radius: 16px; color: var(--ink); font-size: 15px; font-weight: 800; box-shadow: inset 0 0 0 2px #34251c26; }
.cta[hidden], .ghost[hidden] { display: none; }

.panel.menu { width: min(100%, 560px); height: min(100%, 780px); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "head" "resume" "gallery" "opts" "go"; gap: 10px; text-align: left; overflow: hidden; }
.phead { grid-area: head; display: flex; align-items: center; gap: 12px; }
.logo { flex: 0 0 auto; width: 46px; height: 46px; }
.phead .text { margin-top: 2px; font-size: 13.5px; }
.resume { grid-area: resume; }
.gallery-wrap { grid-area: gallery; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.menu h3 { font-size: 12px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-muted); display: flex; justify-content: space-between; gap: 8px; }
.menu h3 em { font-style: normal; letter-spacing: 0; text-transform: none; font-weight: 700; }
.gallery { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; padding: 3px; align-content: start; }
.pic { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 5px 5px 6px; border-radius: 14px; background: #f3e8d8; box-shadow: 0 3px 0 #e2d2bb; text-align: left; }
.pic canvas { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 9px; background: #e2d2bb; }
.pic b { padding: 0 3px; font-size: 12px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.pic i { position: absolute; top: 9px; right: 9px; padding: 2px 7px; border-radius: 99px; background: var(--teal); color: #072a22; font-size: 11px; font-weight: 900; font-style: normal; box-shadow: 0 2px 4px #0004; }
.pic[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--teal-dark), 0 3px 0 #e2d2bb; background: #e4f6f0; }
.pic:active { transform: translateY(2px); }
.opts { grid-area: opts; display: flex; flex-direction: column; gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; padding: 4px; border-radius: 14px; background: #f0e4d3; }
.seg button { min-width: 0; padding: 8px 2px; border-radius: 10px; font-size: 15px; font-weight: 900; color: #7d6858; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 8px 12px; border-radius: 14px; background: #f0e4d3; font-size: 14px; font-weight: 800; text-align: left; }
.toggle small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-muted); }
.toggle i { position: relative; flex: 0 0 auto; width: 42px; height: 24px; border-radius: 99px; background: #c9bba6; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px #0004; }
.toggle[aria-pressed="true"] i { background: var(--teal); }
.toggle[aria-pressed="true"] i::after { transform: translateX(18px); }
.go { grid-area: go; display: flex; flex-direction: column; gap: 8px; }
.note { font-size: 12px; color: var(--ink-muted); text-align: center; }
.note[hidden] { display: none; }
.keys { font-size: 12px; color: var(--ink-muted); line-height: 1.35; }

.win-pic { display: block; width: min(100%, 260px); aspect-ratio: 4 / 3; margin: 12px auto 0; border-radius: 14px; box-shadow: 0 8px 20px #0003; }
.emoji { font-size: 38px; line-height: 1.15; }
.result { margin-top: 8px; font-size: 18px; font-weight: 900; }
.badge { display: inline-block; margin-top: 8px; padding: 5px 14px; border-radius: 99px; background: var(--sun); color: #3b2706; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 380px) {
  .app { gap: 6px; padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
  h1 { font-size: 20px; }
  .stat { padding: 3px 3px 4px; }
  .stat small { font-size: 10px; letter-spacing: 0; }
  .stat strong { font-size: 16px; }
  .tool { min-height: 46px; font-size: 11px; }
  .tool svg { width: 20px; height: 20px; }
  .icon-btn { width: 40px; height: 40px; }
  .panel.menu { padding: 12px; gap: 8px; }
  .gallery { grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg button { font-size: 13px; }
  .logo { width: 38px; height: 38px; }
}
@media (max-height: 600px) and (max-aspect-ratio: 5/4) {
  .tool { min-height: 42px; flex-direction: row; gap: 5px; }
  .keys { display: none; }
}
@media (max-height: 560px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 16px; border-radius: 22px; }
  .panel h2 { font-size: 22px; }
  .panel .text { margin-top: 4px; font-size: 13px; line-height: 1.3; }
  .emoji { font-size: 30px; }
  .win-pic { width: min(100%, 200px); margin-top: 8px; }
  .actions { margin-top: 10px; gap: 8px; }
  .cta { padding: 10px 8px; font-size: 17px; }
  .ghost { padding: 8px; }
  .panel.menu { padding: 12px; gap: 8px; }
  .keys { display: none; }
}

/* Wide frames: the table takes the full height, HUD, preview and tools move to a side column */
@media (min-aspect-ratio: 5/4) {
  .app { grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto auto auto auto minmax(0, 1fr); grid-template-areas: "stage top" "stage hud" "stage bar" "stage preview" "stage tools" "stage ."; column-gap: 14px; row-gap: 10px; }
  h1 { white-space: normal; font-size: clamp(20px, 2.3vw, 30px); }
  .sub { white-space: normal; font-size: 13px; }
  .top { align-items: flex-start; }
  .hud { flex-direction: column; gap: 6px; }
  .stat { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 7px 12px; text-align: left; }
  .stat small { font-size: 11px; }
  .stat strong { font-size: 20px; }
  .preview { display: block; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tool { min-height: 58px; font-size: 13px; }
  .tool:last-child { grid-column: 1 / -1; flex-direction: row; gap: 6px; min-height: 46px; }
  .panel.menu { width: min(100%, 980px); height: min(100%, 660px); grid-template-columns: minmax(0, 1.5fr) minmax(250px, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-areas: "gallery head" "gallery resume" "gallery opts" "gallery ." "gallery go"; column-gap: 18px; }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); }
  #win .panel { width: min(100%, 620px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 20px; align-items: center; text-align: left; }
  #win .panel > .win-pic { grid-column: 1; grid-row: 1 / span 6; width: 100%; margin: 0; }
  #win .panel > :not(.win-pic) { grid-column: 2; }
  #win .badge { justify-self: start; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  .app { --side: clamp(168px, 25vw, 214px); row-gap: 6px; column-gap: 10px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  h1 { font-size: 19px; }
  .sub { font-size: 11.5px; margin-top: 1px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 12px; }
  .icon-btn svg { width: 20px; height: 20px; }
  .hud { gap: 4px; }
  .stat { padding: 3px 9px; }
  .stat small { font-size: 10px; letter-spacing: .02em; }
  .stat strong { font-size: 16px; }
  .bar { height: 5px; }
  .tools { grid-template-columns: 1fr; gap: 5px; }
  .tool, .tool:last-child { grid-column: auto; min-height: 34px; flex-direction: row; justify-content: flex-start; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 11px; }
  .tool svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .zoom { right: 6px; bottom: 6px; gap: 4px; }
  .zoom button { width: 34px; height: 34px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 470px) { .preview { display: none; } }
@media (min-aspect-ratio: 5/4) and (max-height: 360px) {
  .sub { display: none; }
  .zoom { flex-direction: row; }
}
@media (max-height: 440px) {
  .panel.menu { padding: 10px 12px; gap: 6px; row-gap: 6px; }
  .phead .text { display: none; }
  .logo { width: 32px; height: 32px; }
  .panel h2 { font-size: 20px; }
  .cta { padding: 8px 6px; font-size: 16px; }
  .seg button { padding: 6px 2px; font-size: 14px; }
  .toggle { padding: 5px 10px; font-size: 13px; }
  .toggle small { display: none; }
  .note { display: none; }
  .emoji { display: none; }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  .pic b { font-size: 11px; }
}
@media (pointer: coarse) { .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div class="title">
      <h1>Jigsaw <span>Puzzle</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <button type="button" class="icon-btn" id="menu-btn" data-i18n-label="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg></button>
  </header>
  <div class="hud">
    <div class="stat"><small data-i18n="time"></small><strong id="time">0:00</strong></div>
    <div class="stat"><small data-i18n="progress"></small><strong id="pct">0%</strong></div>
    <div class="stat"><small data-i18n="best"></small><strong id="best">—</strong></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div class="preview" aria-hidden="true"><canvas id="mini"></canvas></div>
  <div class="stage" id="stage">
    <canvas id="table" tabindex="0" role="application" data-i18n-label="table" aria-describedby="keys-help"></canvas>
    <div class="zoom">
      <button type="button" id="zoom-in" data-i18n-label="zoomIn" aria-keyshortcuts="+"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" id="zoom-out" data-i18n-label="zoomOut" aria-keyshortcuts="-"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button type="button" id="zoom-fit" data-i18n-label="fit" aria-keyshortcuts="0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <p class="toast" id="toast" aria-hidden="true"></p>
  </div>
  <div class="tools">
    <button type="button" class="tool" id="ghost" aria-pressed="false" aria-keyshortcuts="G"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></svg><span data-i18n="ghost"></span></button>
    <button type="button" class="tool" id="edges" aria-pressed="false" aria-keyshortcuts="E"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path d="M12 4v2M4 12h2M20 12h-2M12 20v-2" opacity=".6"/></svg><span data-i18n="edges"></span></button>
    <button type="button" class="tool" id="spread" aria-keyshortcuts="S"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M4 4l3 3M20 4l-3 3M4 20l3-3M20 20l-3-3"/><path d="M4 4h3M4 4v3M20 4h-3M20 4v3M4 20h3M4 20v-3M20 20h-3M20 20v-3"/></svg><span data-i18n="spread"></span></button>
  </div>
  <p class="sr-only" id="keys-help" data-i18n="keys"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel menu" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <div class="phead">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 13h10a6 6 0 1 1 12 0h10v10a6 6 0 1 0 0 12v6H29a6 6 0 1 0-12 0H7V31a6 6 0 1 1 0-12z" fill="#2fc4a6" stroke="#1b8d76" stroke-width="2.5" stroke-linejoin="round"/><circle cx="20" cy="24" r="3" fill="#ffc24b"/></svg>
      <div>
        <h2 id="start-title">Jigsaw <span>Puzzle</span></h2>
        <p class="text" data-i18n="tagline"></p>
      </div>
    </div>
    <button type="button" class="cta alt resume" id="resume" hidden><span data-i18n="resume"></span><small id="resume-sub"></small></button>
    <div class="gallery-wrap">
      <h3><span data-i18n="picture"></span><em id="gallery-count"></em></h3>
      <div class="gallery" id="gallery" role="group" data-i18n-label="picture"></div>
    </div>
    <div class="opts">
      <h3 data-i18n="pieces"></h3>
      <div class="seg" id="sizes" role="group" data-i18n-label="pieces"></div>
      <button type="button" class="toggle" id="rotate" aria-pressed="false"><span><span data-i18n="rotate"></span><small data-i18n="rotateSub"></small></span><i aria-hidden="true"></i></button>
      <p class="keys" data-i18n="keys"></p>
    </div>
    <div class="go">
      <p class="note" id="replace-note" data-i18n="replace" hidden></p>
      <button type="button" class="cta" id="play" data-i18n="start"></button>
      <button type="button" class="ghost" id="back" data-i18n="back" hidden></button>
    </div>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <canvas class="win-pic" id="win-pic" width="520" height="390" aria-hidden="true"></canvas>
    <p class="emoji" aria-hidden="true">🧩</p>
    <h2 id="win-title" data-i18n="won"></h2>
    <p class="result" id="result"></p>
    <p class="text" id="best-line"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <div class="actions">
      <button type="button" class="cta" id="next" data-i18n="next"></button>

    if (!list.length) return;
    let k = list.indexOf(G.sel);
    k = k < 0 ? (dir > 0 ? list.length - 1 : 0) : (k + (dir > 0 ? -1 : 1) + list.length) % list.length;
    G.sel = list[k];
    ensureVisible(G.sel);
    announce(t.selected(list.length - k, list.length));
    dirty = true;
  }
  function ensureVisible(g) {
    if (V.s <= V.sFit * 1.01) return;
    const b = bbox(g), vw = V.w / V.s, vh = V.h / V.s;
    if (b.cx < V.ox + vw * .1 || b.cx > V.ox + vw * .9 || b.cy < V.oy + vh * .1 || b.cy > V.oy + vh * .9) { V.ox = b.cx - vw / 2; V.oy = b.cy - vh / 2; clampCamera(); }
  }
  const ARROWS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || !playable()) return;
    const key = e.key, onButton = e.target instanceof HTMLButtonElement;
    if (ARROWS[key]) {
      e.preventDefault();
      if (!G.sel || !G.groups.includes(G.sel)) { selectStep(1); return; }
      const g = G.sel, [dx, dy] = ARROWS[key], step = G.s * (e.shiftKey ? 1 : .25);
      raise(g); g.anim = null; g.x += dx * step; g.y += dy * step;
      if (!G.started) G.started = true;
      const ev = dropGroup(g);
      if (ev === 'placed' && !G.done) selectStep(1);
      else if (G.sel) ensureVisible(G.sel);
      dirty = true;
      return;
    }
    const lower = key.length === 1 ? key.toLowerCase() : key;
    if (lower === 'n' || key === ']') { e.preventDefault(); selectStep(1); }
    else if (lower === 'p' || key === '[') { e.preventDefault(); selectStep(-1); }
    else if (lower === 'r' || (key === ' ' && !onButton)) {
      e.preventDefault();
      if (G.rotOn && G.sel && G.groups.includes(G.sel)) { rotateGroup(G.sel, G.sel.pieces[0]); announce(t.turned); dropGroup(G.sel, true); }
    }
    else if (lower === 'e') { e.preventDefault(); toggleEdges(); }
    else if (lower === 'g') { e.preventDefault(); toggleGhost(); }
    else if (lower === 's') { e.preventDefault(); spread(); }
    else if (key === '+' || key === '=') { e.preventDefault(); zoomAt(1.4); if (G.sel) ensureVisible(G.sel); }
    else if (key === '-' || key === '_') { e.preventDefault(); zoomAt(1 / 1.4); }
    else if (key === '0') { e.preventDefault(); fitCamera(); spriteCheck(); dirty = true; }
  });

  // ---- Tools ----
  function toggleEdges() {
    if (!G) return;
    edgesOnly = !edgesOnly;
    els.edges.setAttribute('aria-pressed', String(edgesOnly));
    if (edgesOnly && G.sel && !G.sel.edge) G.sel = null;
    toast(edgesOnly ? t.edgesOn : t.edgesOff); announce(edgesOnly ? t.edgesOn : t.edgesOff);
    dirty = true;
  }
  function toggleGhost() {
    ghostOn = !ghostOn; prefs.ghost = ghostOn; savePrefs();
    els.ghost.setAttribute('aria-pressed', String(ghostOn));
    announce(ghostOn ? t.ghostOn : t.ghostOff);
    dirty = true;
  }
  function spread() {
    if (!playable()) return;
    const loose = G.groups.filter(g => !(edgesOnly && !g.edge));
    loose.sort((a, b) => a.pieces.length - b.pieces.length);
    scatter(loose, Math.random, true);
    announce(t.spreadSay); toast(t.spreadSay);
    scheduleSave(); dirty = true;
  }
  els.edges.addEventListener('click', () => { if (playable()) toggleEdges(); });
  els.ghost.addEventListener('click', toggleGhost);
  $('spread').addEventListener('click', spread);
  $('zoom-in').addEventListener('click', () => zoomAt(1.4));
  $('zoom-out').addEventListener('click', () => zoomAt(1 / 1.4));
  $('zoom-fit').addEventListener('click', () => { if (G) { fitCamera(); spriteCheck(); dirty = true; } });
  els.ghost.setAttribute('aria-pressed', String(ghostOn));

  $('menu-btn').addEventListener('click', openMenu);
  els.rotate.addEventListener('click', () => { prefs.rot = !prefs.rot; savePrefs(); refreshMenu(); });
  els.play.addEventListener('click', () => {
    edgesOnly = false; els.edges.setAttribute('aria-pressed', 'false');
    startPuzzle(prefs.pic, prefs.size, !!prefs.rot, null);
    closeMenu();
    announce(t.started(t.names[G.pic], G.n));
  });
  els.resume.addEventListener('click', () => {
    const s = loadSave();
    if (!s) { refreshMenu(); return; }
    if (!G || G.done || G.seed !== s.seed) startPuzzle(s.pic, s.size, !!s.rot, s);
    closeMenu();
    announce(t.resumed(progressPct()));
  });
  els.back.addEventListener('click', closeMenu);
  $('next').addEventListener('click', () => {
    const pic = (G.pic + 1) % PICS.length; prefs.pic = pic; savePrefs();
    els.win.hidden = true; edgesOnly = false; els.edges.setAttribute('aria-pressed', 'false');
    startPuzzle(pic, G.sizeIdx, G.rotOn, null);
    els.canvas.focus({ preventScroll: true });
    announce(t.started(t.names[pic], G.n));
  });
  $('choose').addEventListener('click', openMenu);

  // ---- Resize ----
  function onResize() {
    const r = els.stage.getBoundingClientRect();
    V.w = Math.max(1, r.width); V.h = Math.max(1, r.height); V.dpr = Math.min(2, window.devicePixelRatio || 1);
    els.canvas.width = Math.round(V.w * V.dpr); els.canvas.height = Math.round(V.h * V.dpr);
    if (G) { layoutTable(); fitCamera(); relocateStray(); spriteCheck(true); drawMini(); }
    dirty = true;
  }
  new ResizeObserver(onResize).observe(els.stage);

  // ---- Main loop: animations, timer (dt clamped; paused while hidden or in menus) ----
  let last = performance.now(), autoSave = 0;
  function frame(now) {
    const dt = Math.min(50, now - last);
    last = now;
    if (G) {
      for (const g of G.groups.slice()) {
        if (!g.anim) continue;
        const a = g.anim, k = clamp((now - a.t0) / a.dur, 0, 1), e = 1 - (1 - k) ** 3;
        g.x = a.fx + (a.tx - a.fx) * e; g.y = a.fy + (a.ty - a.fy) * e;
        if (k >= 1) { g.anim = null; if (a.then) a.then(); else clampGroup(g); }
        dirty = true;
      }
      if (G.started && !G.done && !document.hidden && !overlayOpen()) {
        G.elapsed += dt;
        if (Math.floor(G.elapsed / 1000) !== shownSec) { shownSec = Math.floor(G.elapsed / 1000); els.time.textContent = formatTime(G.elapsed); }
        autoSave += dt; if (autoSave > 10000) { autoSave = 0; saveGame(); }
      }
    }
    if (dirty || animating(now)) { dirty = false; draw(now); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { last = performance.now(); if (document.hidden) saveGame(); });
  addEventListener('pagehide', saveGame);

  // Read-only hooks for automated tests (no solving or scoring helpers).
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__jigsaw = Object.freeze({
    state: () => G && { pic: G.pic, n: G.n, cols: G.cols, rows: G.rows, rotOn: G.rotOn, groups: G.groups.length, placed: G.board.pieces.length, progress: progressPct(), elapsed: G.elapsed, done: G.done, started: G.started, edgesOnly, ghost: ghostOn, scale: V.s, fit: V.sFit, spriteK: G.spriteK, overlay: !els.start.hidden ? 'start' : !els.win.hidden ? 'win' : null, sel: G.sel ? G.groups.indexOf(G.sel) : -1 },
    pictures: () => PICS.length,
    loose: () => (G ? G.groups.map(g => ({ pieces: g.pieces.slice(), r: g.r, edge: g.edge })) : []),
    pieceScreen: i => { const g = G.owner[i]; const [x, y] = centerOf(i, g); const [sx, sy] = toScreen(x, y); const r = els.canvas.getBoundingClientRect(); return { x: r.left + sx, y: r.top + sy }; },
    homeScreen: i => { const p = G.pieces[i]; const [sx, sy] = toScreen(p.hx + G.cw / 2, p.hy + G.ch / 2); const r = els.canvas.getBoundingClientRect(); return { x: r.left + sx, y: r.top + sy }; },
    topAt: (x, y) => { const r = els.canvas.getBoundingClientRect(); const hit = pieceAt(...toWorld(x - r.left, y - r.top), false); return hit ? hit.i : -1; },
    table: () => ({ ...T }),
  });

  // ---- Boot ----
  buildMenu();
  onResize();
  const saved = loadSave();
  if (saved) { try { startPuzzle(saved.pic, saved.size, !!saved.rot, saved); } catch { G = null; forget(STORE.save); } }
  openMenu();
})();
</script>
</body>
</html>
