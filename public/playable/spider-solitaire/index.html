<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spider Solitaire</title>
<style>
:root {
  --felt: #2e2163;
  --felt-dark: #140d33;
  --text: #f4f1ff;
  --muted: #b9addf;
  --mint: #7cf0c5;
  --mint-dark: #2fae86;
  --amber: #ffc857;
  --violet: #5b3fc4;
  --violet-dark: #3a2690;
  --red: #d7263d;
  --black: #1d1b2e;
  --paper: #fffdf8;
  --chip: #0000003b;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background-color: var(--felt);
  background-image: radial-gradient(#ffffff08 1px, transparent 1.5px), radial-gradient(120% 85% at 50% 0%, #4a36a0, var(--felt) 52%, var(--felt-dark));
  background-size: 6px 6px, 100% 100%;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }

.app {
  height: 100%; max-width: 760px; margin: auto;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "hud" "table" "tools";
  gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}
.top { grid-area: top; display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { flex: 0 0 auto; width: 38px; height: 38px; }
.title { flex: 1; min-width: 0; }
h1 { font-size: clamp(20px, 6.4vw, 28px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; white-space: nowrap; }
h1 span { color: var(--mint); }
.sub { margin-top: 2px; font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub b { color: var(--mint); white-space: nowrap; }
.hud { grid-area: hud; display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 4px 4px 5px; border-radius: 12px; background: var(--chip); text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.25; }

.table { grid-area: table; min-height: 0; min-width: 0; position: relative; isolation: isolate; touch-action: none; border-radius: 10px; }
.table:focus { outline: none; }
.table.kb:focus-visible { outline: 2px solid #7cf0c544; outline-offset: 4px; }
.slot, .card, .cursor { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border-radius: var(--r); }
.slot { display: grid; place-items: center; background: #00000026; box-shadow: inset 0 0 0 1.5px #ffffff22; color: #ffffff33; font-size: calc(var(--cw) * .42); font-weight: 900; }
.slot.found { background: #0000001a; box-shadow: inset 0 0 0 1.5px #ffffff14; font-size: max(10px, calc(var(--cw) * .34)); }
.slot.stock { cursor: pointer; font-size: calc(var(--cw) * .5); }
.slot[hidden] { display: none; }
.card { background: var(--paper); color: var(--black); box-shadow: 0 1px 2px #00000070, 0 0 0 .5px #00000030; transition: transform .22s cubic-bezier(.25, .8, .35, 1); cursor: grab; will-change: transform; overflow: hidden; }
.card.red { color: var(--red); }
.idx { position: absolute; left: 6%; right: 5%; top: 1%; display: flex; align-items: center; justify-content: space-between; font-size: calc(var(--cw) * .38); font-weight: 900; line-height: 1.12; letter-spacing: -.08em; }
.idx svg { width: calc(var(--cw) * .28); height: calc(var(--cw) * .28); flex-shrink: 0; }
.pip { position: absolute; left: 20%; bottom: 8%; width: 60%; height: auto; }
.art { position: absolute; left: 10%; right: 10%; top: 31%; bottom: 6%; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: calc(var(--r) * .7); background: #ece8fb; font-family: Georgia, "Times New Roman", serif; font-size: calc(var(--cw) * .44); font-weight: 700; line-height: 1; }
.red .art { background: #fde8ea; }
.art svg { width: 40%; height: auto; margin-top: 4%; }
.card.down { cursor: default; background: radial-gradient(circle at 50% 50%, #ffffff30 0 6%, transparent 7%), repeating-radial-gradient(circle at 50% 50%, transparent 0 calc(var(--cw) * .12), #ffffff26 calc(var(--cw) * .12) calc(var(--cw) * .135)), repeating-conic-gradient(from 0deg at 50% 50%, #ffffff2e 0 1.2deg, transparent 1.2deg 30deg), linear-gradient(155deg, #8a5ce6, #4b2aa8 60%, #2f1a78); box-shadow: inset 0 0 0 calc(var(--cw) * .055) #f4efff, 0 1px 2px #00000070; }
.card.down > * { display: none; }
.card.dragging { transition: none; cursor: grabbing; box-shadow: 0 12px 24px #00000066, 0 0 0 .5px #00000030; }
.card.hint, .slot.hint { box-shadow: 0 0 0 3px var(--mint), 0 0 18px var(--mint); }
.card.held { box-shadow: 0 0 0 3px var(--amber), 0 6px 16px #0008; }
.card.shake { animation: shake .3s; }
.card.flip { animation: flip .26s ease-out; }
@keyframes shake { 20%, 60% { translate: -4px 0; } 40%, 80% { translate: 4px 0; } }
@keyframes flip { from { scale: 0 1; } }
.table.instant .card { transition: none; }
.cursor { display: none; z-index: 3000; pointer-events: none; box-shadow: 0 0 0 3px var(--mint), 0 0 0 6px #00000080; transition: transform .12s, height .12s; }
.table.kb:focus .cursor { display: block; }
.toast { position: absolute; left: 50%; bottom: 10px; z-index: 3100; translate: -50% 0; max-width: 90%; padding: 8px 14px; border-radius: 99px; background: #000000b8; font-size: 13px; font-weight: 700; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }
.toast.big { color: var(--mint); font-size: 16px; }

.tools { grid-area: tools; display: flex; gap: 6px; }
.tool { position: relative; flex: 1; min-width: 0; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 5px 4px 6px; border-radius: 12px; background: var(--chip); font-size: 11.5px; font-weight: 800; }
.tool > span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .icon { font-size: 18px; line-height: 1.15; }
.tool:disabled { opacity: .4; cursor: default; }
.tool:active:not(:disabled) { transform: translateY(2px); }
.tool.deal { background: #7cf0c529; box-shadow: inset 0 0 0 1.5px #7cf0c55c; }
.count[hidden] { display: none; }
.count { position: absolute; top: 3px; right: 5px; min-width: 18px; padding: 1px 5px; border-radius: 99px; background: var(--mint); color: #0d2a20; font-size: 11px; font-weight: 900; line-height: 1.35; }

.stats-card { grid-area: stats; display: none; padding: 10px 12px; border-radius: 14px; background: var(--chip); }
.stats-card h2 { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.stats-card dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin-top: 6px; font-size: 13px; }
.stats-card dt { color: var(--muted); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats-card dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }

.fx { position: fixed; inset: 0; z-index: 5; width: 100%; height: 100%; pointer-events: none; }
.fx[hidden] { display: none; }
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: #0d0826b8; }
.overlay.light { background: #0d082666; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 380px); max-height: calc(100% - 16px); overflow: auto; background: var(--paper); color: #221c3a; border-radius: 26px; padding: 22px 20px; text-align: center; box-shadow: 0 20px 50px #0008; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 27px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: var(--violet); }
.panel p { margin-top: 8px; color: #5a5376; font-size: 15px; line-height: 1.45; }
.panel .emoji { margin: 0 0 4px; font-size: 44px; line-height: 1.1; }
.panel .head-logo { width: 54px; height: 54px; margin: 0 auto 4px; display: block; }
.panel .pick { margin-top: 14px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #8a83a6; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.choice { min-width: 0; padding: 11px 6px; border-radius: 18px; background: var(--violet); color: #fff; font-size: 17px; font-weight: 900; line-height: 1.15; box-shadow: 0 5px 0 var(--violet-dark); overflow-wrap: anywhere; }
.choice small { display: block; margin-top: 3px; font-size: 12px; font-weight: 700; color: #ddd3ff; }
.choice .rec { color: #a9f5d8; font-size: 11px; }
.choice[aria-current="true"] { box-shadow: 0 5px 0 var(--violet-dark), inset 0 0 0 3px var(--mint); }
.choice:active, .cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--violet-dark); }
.switch { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 14px; padding: 10px 12px; border-radius: 16px; background: #efeaff; color: #221c3a; text-align: left; }
.switch .knob { flex: 0 0 auto; position: relative; width: 42px; height: 24px; border-radius: 99px; background: #bdb4d9; transition: background .2s; }
.switch .knob::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .2s; }
.switch[aria-checked="true"] .knob { background: var(--mint-dark); }
.switch[aria-checked="true"] .knob::after { transform: translateX(18px); }
.switch b { display: block; font-size: 15px; font-weight: 800; }
.switch small { display: block; font-size: 12px; font-weight: 600; color: #6c6589; }
.panel .fine { margin-top: 12px; font-size: 12px; color: #8a83a6; }
.panel .result { font-size: 18px; font-weight: 800; color: #221c3a; }
.panel .record { font-size: 13px; }
.badge { display: inline-block; margin-top: 10px; padding: 5px 14px; border-radius: 99px; background: var(--mint); color: #0d2a20; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.actions.resume { margin-top: 12px; }
.actions[hidden] { display: none; }
.cta { width: 100%; padding: 14px; border-radius: 18px; background: var(--violet); color: #fff; font-size: 18px; font-weight: 800; box-shadow: 0 5px 0 var(--violet-dark); }
.ghost { width: 100%; padding: 10px; border-radius: 16px; color: #221c3a; font-size: 15px; font-weight: 800; box-shadow: inset 0 0 0 2px #221c3a26; }
.panel :focus-visible { outline-color: var(--violet); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 400px) {
  .choices { grid-template-columns: 1fr; gap: 7px; }
  .choice { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; padding: 9px 14px; text-align: left; }
  .choice small { margin-top: 0; text-align: right; }
  .choice .rec { grid-column: 2; }
  .choice > span { grid-row: span 2; }
}
@media (max-width: 360px) {
  .logo { width: 32px; height: 32px; }
  .stat strong { font-size: 15px; }
  .stat small { letter-spacing: 0; }
  .tool { font-size: 11px; }
}
@media (max-height: 560px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 16px; border-radius: 22px; }
  .panel h2 { font-size: 23px; }
  .panel p { margin-top: 6px; font-size: 14px; line-height: 1.35; }
  .panel .emoji { font-size: 34px; }
  .panel .head-logo { width: 40px; height: 40px; }
  .panel .pick { margin-top: 10px; }
  .choice { padding: 9px 6px; font-size: 16px; }
  .switch { margin-top: 10px; padding: 7px 10px; }
  .actions { margin-top: 12px; gap: 8px; }
  .cta { padding: 11px; }
  .ghost { padding: 8px; }
}

/* Wide frames: the table takes the full height on the left, HUD, tools and stats move to a side column */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: none; --side: clamp(190px, 21vw, 290px); grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto auto auto minmax(0, 1fr); grid-template-areas: "table top" "table hud" "table tools" "table stats" "table ."; column-gap: 16px; row-gap: 10px; }
  .top { align-items: flex-start; }
  h1 { white-space: normal; font-size: clamp(20px, 2.3vw, 30px); }
  .sub { white-space: normal; }
  .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { padding: 6px 8px 7px; }
  .stat strong { font-size: 20px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tool { min-height: 58px; font-size: 13px; }
  .stats-card { display: block; }
  .panel.menu { width: min(100%, 560px); }
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  .app { --side: clamp(160px, 25vw, 220px); row-gap: 6px; column-gap: 10px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .logo { width: 30px; height: 30px; }
  h1 { font-size: 18px; }
  .sub { font-size: 11px; margin-top: 1px; }
  .hud { gap: 4px; }
  .stat { padding: 2px 6px 3px; }
  .stat strong { font-size: 15px; }
  .tools { gap: 5px; }
  .tool { min-height: 38px; flex-direction: row; gap: 4px; font-size: 11.5px; padding: 3px 4px; border-radius: 11px; }
  .tool .icon { font-size: 15px; }
  .count { top: -4px; right: -2px; font-size: 10px; }
  .stats-card { padding: 6px 10px; }
  .stats-card dl { font-size: 11.5px; gap: 1px 8px; margin-top: 3px; }
  .stats-card h2 { font-size: 10.5px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 420px) {
  .stats-card dl > :nth-child(n + 9) { display: none; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 340px) {
  .stats-card, .logo { display: none; }
}
@media (max-height: 520px) {
  .panel .intro, .panel .head-logo { display: none; }
}
@media (max-height: 420px) {
  .panel .intro, .panel .fine, .panel .head-logo, .switch small { display: none; }
  .panel .emoji { font-size: 26px; }
  .panel h2 { font-size: 21px; }
  .actions { margin-top: 8px; gap: 6px; }
  .actions.resume { margin-top: 6px; }
  .cta { padding: 9px; font-size: 16px; }
  .ghost { padding: 7px; font-size: 14px; }
  .choice { padding: 7px 6px; font-size: 15px; }
  .switch { padding: 5px 10px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="suit-defs">
  <symbol id="spider" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 26 14 16 6 20M40 26l10-10 8 4M22 32H8l-4 7M42 32h14l4 7M24 38l-9 9 1 10M40 38l9 9-1 10"/></g><ellipse cx="32" cy="36" rx="10" ry="12" fill="currentColor"/><circle cx="32" cy="22" r="7" fill="currentColor"/><circle cx="29.5" cy="21" r="1.6" fill="#fff"/><circle cx="34.5" cy="21" r="1.6" fill="#fff"/><path d="M32 2v13" stroke="currentColor" stroke-width="1.6"/></symbol>
</defs></svg>
<main class="app">
  <div class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true" style="color:var(--mint)"><use href="#spider"/></svg>
    <div class="title">
      <h1>Spider <span>Solitaire</span></h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>
  <div class="hud">
    <div class="stat"><small data-i18n="score"></small><strong id="score">500</strong></div>
    <div class="stat"><small data-i18n="moves"></small><strong id="moves">0</strong></div>
    <div class="stat"><small data-i18n="time"></small><strong id="time">0:00</strong></div>
    <div class="stat"><small data-i18n="runs"></small><strong id="runs">0/8</strong></div>
  </div>
  <div class="table" id="table" tabindex="0" role="application" data-i18n-label="board">
    <div class="cursor" id="cursor"></div>
    <p class="toast" id="toast" aria-hidden="true"></p>
  </div>
  <div class="tools">
    <button type="button" class="tool" id="undo" disabled><span class="icon" aria-hidden="true">↶</span><span data-i18n="undo"></span></button>
    <button type="button" class="tool" id="hint"><span class="icon" aria-hidden="true">✦</span><span data-i18n="hint"></span></button>
    <button type="button" class="tool deal" id="deal"><span class="icon" aria-hidden="true">⇊</span><span data-i18n="deal"></span><b class="count" id="deal-count" aria-hidden="true">5</b></button>
    <button type="button" class="tool" id="menu"><span class="icon" aria-hidden="true">☰</span><span data-i18n="menu"></span></button>
  </div>
  <section class="stats-card" aria-labelledby="stats-title">
    <h2 id="stats-title"></h2>
    <dl id="stats-list"></dl>
  </section>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>
<canvas class="fx" id="fx" hidden aria-hidden="true"></canvas>

<div class="overlay" id="start">
  <div class="panel menu" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <svg class="head-logo" viewBox="0 0 64 64" aria-hidden="true" style="color:var(--violet)"><use href="#spider"/></svg>
    <h2 id="start-title">Spider <span>Solitaire</span></h2>
    <p class="intro" data-i18n="intro"></p>
    <div class="actions resume" id="resume-box" hidden>
      <button type="button" class="cta" id="resume" data-i18n="resume"></button>
    </div>
    <p class="pick" data-i18n="pick"></p>
    <div class="choices">
      <button type="button" class="choice" data-start="1"><span data-i18n="suits1"></span><small data-i18n="lvl1"></small><small class="rec" data-rec="1"></small></button>
      <button type="button" class="choice" data-start="2"><span data-i18n="suits2"></span><small data-i18n="lvl2"></small><small class="rec" data-rec="2"></small></button>
      <button type="button" class="choice" data-start="4"><span data-i18n="suits4"></span><small data-i18n="lvl4"></small><small class="rec" data-rec="4"></small></button>
    </div>
    <button type="button" class="switch" id="winnable" role="switch" aria-checked="true"><span class="knob" aria-hidden="true"></span><span><b data-i18n="winnable"></b><small id="winnable-note"></small></span></button>
    <p class="fine" data-i18n="controls"></p>
  </div>
</div>

<div class="overlay light" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🕸️</p>
    <h2 id="win-title" data-i18n="won"></h2>
    <p class="result" id="win-result"></p>
    <p id="win-points"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <p class="record" id="win-record"></p>
    <div class="actions">
      <button type="button" class="cta" id="again" data-i18n="again"></button>
      <button type="button" class="ghost" id="change-mode" data-i18n="changeMode"></button>
    </div>
  </div>
</div>

<div class="overlay" id="stuck" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="stuck-title">
    <p class="emoji" aria-hidden="true">🕷️</p>
    <h2 id="stuck-title" data-i18n="stuck"></h2>
    <p data-i18n="stuckText"></p>
    <div class="actions">
      <button type="button" class="cta" id="stuck-undo" data-i18n="undo"></button>
      <button type="button" class="ghost" id="stuck-replay" data-i18n="replay"></button>
      <button type="button" class="ghost" id="stuck-new" data-i18n="again"></button>
      <button type="button" class="ghost" id="stuck-keep" data-i18n="keep"></button>
    </div>
  </div>
</div>

<script>
(() => {
  const NUMBERS = ['2', '3', '4', '5', '6', '7', '8', '9', '10'];
  const I18N = {
    en: {
      suits1: '1 suit', suits2: '2 suits', suits4: '4 suits', lvl1: 'Beginner', lvl2: 'Intermediate', lvl4: 'Expert',
      score: 'Score', moves: 'Moves', time: 'Time', runs: 'Runs', undo: 'Undo', hint: 'Hint', deal: 'Deal', menu: 'Menu',
      board: 'Card table. Left and right arrows choose a column or the stock, up and down choose a card, Enter picks up or drops cards, D deals, H shows a hint, U undoes.',
      intro: 'Build eight runs from King down to Ace in a single suit — every finished run leaves the table. Drag cards, or tap one to send it to the best spot.',

  }

  function dealRow() {
    if (state !== 'play') return;
    releaseHeld();
    if (!piles[STOCK].length) { toast(t.noDeals); announce(t.noDeals); return; }
    if (piles.slice(0, COLS).some(pile => !pile.length)) {
      toast(t.cantDeal);
      announce(t.cantDeal);
      shake(top(STOCK));
      return;
    }
    pushUndo();
    const dealt = [];
    for (let c = 0; c < COLS; c++) {
      const card = piles[STOCK].pop();
      card.up = true;
      piles[c].push(card);
      dealt.push(card);
    }
    moves += 1;
    cycle = null;
    startClock();
    stagger(dealt, 45);
    let collected = false;
    for (let c = 0; c < COLS; c++) collected = collectRun(c) || collected;
    layout(dealt);
    if (!collected) announce(`${t.dealt}. ${t.dealsLeft(dealsLeft())}`);
    afterAction();
  }

  // Undo always costs a move, so it can never be used to win back points.
  function undo() {
    if ((state !== 'play' && state !== 'stuck') || !undoStack.length) return;
    const snap = undoStack.pop();
    piles = snap.piles.map(ids => ids.map(id => cards[id]));
    cards.forEach((card, i) => { card.up = snap.up[i] === '1'; });
    moves += 1;
    stuckSnoozed = false;
    if (state === 'stuck') { state = 'play'; els.stuck.hidden = true; clearTimeout(panelTimer); }
    cycle = null;
    releaseHeld();
    clearHint();
    layout();
    updateHud();
    saveSoon();
    announce(t.undone);
  }

  function afterAction() {
    clearHint();
    hintIndex = 0;
    if (runsDone() === 8) return win();
    updateHud();
    saveSoon();
    if (!piles[STOCK].length && !stuckSnoozed && piles.slice(0, COLS).every(pile => pile.length) && !usefulMoves().length) {
      state = 'stuck';
      running = false;
      updateHud();
      announce(`${t.stuck}. ${t.stuckText}`);
      panelTimer = setTimeout(() => { els.stuck.hidden = false; $('stuck-undo').focus({ preventScroll: true }); }, 500);
    }
  }

  // ---------- Hints & dead-end detection ----------

  // Whole runs that make real progress, best first. Moving a run that already sits on the next rank to an off-suit card is left out on purpose.
  function usefulMoves() {
    const list = [];
    for (let from = 0; from < COLS; from++) {
      const i = runStart(from);
      if (i < 0) continue;
      const pile = piles[from], lead = pile[i], under = pile[i - 1];
      const count = pile.length - i;
      let usedEmpty = false;
      for (let to = 0; to < COLS; to++) {
        if (!canMove(from, count, to)) continue;
        const dest = top(to);
        let rank = -1;
        if (!dest) {
          if (usedEmpty || !under || under.up) continue;
          usedEmpty = true;
          rank = 4;
        } else if (dest.suit === lead.suit) rank = under && !under.up ? 0 : 1;
        else if (under && !under.up) rank = 2;
        else if (!under || under.rank !== lead.rank + 1) rank = 3;
        if (rank < 0) continue;
        list.push({ from, count, to, rank });
      }
    }
    return list.sort((a, b) => a.rank - b.rank || b.count - a.count);
  }

  // With an empty column the stock is locked, so the hint points at any stack that can fill it.
  function fillMove() {
    const empty = piles.findIndex((pile, p) => isCol(p) && !pile.length);
    if (empty < 0) return null;
    for (let from = 0; from < COLS; from++) {
      const i = runStart(from);
      if (i > 0) return { from, count: piles[from].length - i, to: empty, fill: true };
    }
    return null;
  }

  function nextHint() {
    const options = usefulMoves();
    if (piles[STOCK].length) {
      const blocked = piles.slice(0, COLS).some(pile => !pile.length);
      if (!blocked) options.push({ deal: true });
      else if (!options.length) { const fill = fillMove(); if (fill) options.push(fill); }
    }
    return options;
  }

  function clearHint() {
    clearTimeout(hintTimer);
    for (const el of table.querySelectorAll('.hint')) el.classList.remove('hint');
  }

  function showHint() {
    if (state !== 'play') return;
    clearHint();
    releaseHeld();
    const options = nextHint();
    if (!options.length) { toast(t.noHint); announce(t.noHint); return; }
    const move = options[hintIndex % options.length];
    hintIndex += 1;
    if (move.deal) {
      (top(STOCK)?.el || slots[STOCK]).classList.add('hint');
      announce(t.hintDeal);
      toast(t.hintDeal);
    } else {
      piles[move.from].slice(-move.count).forEach(card => card.el.classList.add('hint'));
      (top(move.to)?.el || slots[move.to]).classList.add('hint');
      const text = move.fill ? t.hintFill : t.hintMove(cardName(piles[move.from][piles[move.from].length - move.count]), pileName(move.to));
      announce(text);
      if (move.fill) toast(text);
    }
    hintTimer = setTimeout(clearHint, 2200);
  }

  // ---------- Win ----------

  function win() {
    state = 'won';
    running = false;
    const final = score();
    const stats = modeStats(suits);
    stats.won += 1;
    stats.streak += 1;
    stats.bestStreak = Math.max(stats.bestStreak, stats.streak);
    const newBest = final > stats.bestScore;
    stats.bestScore = Math.max(stats.bestScore, final);
    if (!stats.bestTime || elapsed < stats.bestTime) stats.bestTime = Math.round(elapsed);
    saveModeStats(suits, stats);
    drop('save');
    updateHud();
    els.winResult.textContent = t.result(formatTime(elapsed), moves);
    els.winPoints.textContent = t.points(final);
    els.winRecord.textContent = `${modeName(suits)} · ${t.winRecord(stats.won, stats.streak, stats.bestScore)}`;
    els.newBest.hidden = !newBest;
    announce(`${t.won} ${els.winResult.textContent}. ${els.winPoints.textContent}`);
    celebrate();
    panelTimer = setTimeout(() => { els.win.hidden = false; els.again.focus({ preventScroll: true }); }, reduceMotion.matches ? 300 : 2600);
  }

  // Bouncing-card cascade: the finished runs leave the foundations and leave trails on a canvas.
  const SUIT_SHAPES = SUIT_PATHS.map(list => list.map(d => new Path2D(d)));
  const fx = { on: false, queue: [], live: [], spawnIn: 0 };

  function paintSuit(ctx, suit, x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 100, size / 100);
    for (const shape of SUIT_SHAPES[suit]) ctx.fill(shape);
    ctx.restore();
  }

  function paintCard(ctx, card, x, y, w, h) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, w * .1); else ctx.rect(x, y, w, h);
    ctx.fillStyle = '#fffdf8';
    ctx.fill();
    ctx.strokeStyle = 'rgba(29,27,46,.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = card.red ? '#d7263d' : '#1d1b2e';
    ctx.font = `900 ${Math.round(w * .36)}px ${FONT}`;
    ctx.textBaseline = 'top';
    ctx.fillText(RANKS[card.rank - 1], x + w * .07, y + h * .04);
    paintSuit(ctx, card.suit, x + w * .66, y + h * .05, w * .26);
    paintSuit(ctx, card.suit, x + w * .2, y + h * .4, w * .6);
  }

  function celebrate() {
    if (reduceMotion.matches || !m) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    els.fx.width = Math.round(innerWidth * dpr);
    els.fx.height = Math.round(innerHeight * dpr);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    els.fx.hidden = false;
    const rect = table.getBoundingClientRect();
    fx.queue = [];
    for (let r = 12; r >= 0; r--) for (let f = FOUND; f < PILES; f++) {
      const card = piles[f][r];
      if (card) fx.queue.push({ card, x: rect.left + card.x, y: rect.top + card.y, vx: 0, vy: 0 });
    }
    fx.live = [];
    fx.spawnIn = 0;
    fx.on = true;
  }

  function stepFx(dt) {
    fx.spawnIn -= dt;
    if (fx.spawnIn <= 0 && fx.queue.length) {
      const b = fx.queue.shift();
      b.vx = (Math.random() < .5 ? -1 : 1) * (.12 + Math.random() * .22);
      b.vy = -Math.random() * .45;
      b.card.el.style.visibility = 'hidden';
      fx.live.push(b);
      fx.spawnIn = 110;
    }
    const floor = innerHeight - m.ch;
    for (const b of fx.live) {
      b.vy += .0017 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.y > floor) { b.y = floor; b.vy *= -.72; }
      paintCard(fctx, b.card, b.x, b.y, m.cw, m.ch);
    }
    fx.live = fx.live.filter(b => b.x > -m.cw && b.x < innerWidth);
    if (!fx.queue.length && !fx.live.length) fx.on = false;
  }

  function stopFx() {
    fx.on = false;
    fx.queue = [];
    fx.live = [];
    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.clearRect(0, 0, els.fx.width, els.fx.height);
    els.fx.hidden = true;
    cards.forEach(card => { card.el.style.visibility = ''; });
  }

  // ---------- Save & resume ----------

  function saveSoon(delay = 250) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveGame, delay);
  }

  function saveGame() {
    if (state !== 'play' && state !== 'stuck') return;
    write('save', { v: 1, suits, seed, winnable: gameWinnable, moves, elapsed: Math.round(elapsed), started, piles: piles.map(pile => pile.map(card => card.id)), up: cards.map(card => card.up ? 1 : 0).join(''), undo: undoStack.slice(-150) });
  }

  function restoreGame() {
    const s = read('save', null);
    if (!s || s.v !== 1 || !MODES.includes(s.suits) || !Array.isArray(s.piles) || s.piles.length !== PILES || typeof s.up !== 'string' || s.up.length !== 104) return false;
    const ids = s.piles.flat();
    if (ids.length !== 104 || new Set(ids).size !== 104 || ids.some(id => !Number.isInteger(id) || id < 0 || id > 103)) return false;
    suits = s.suits;
    seed = +s.seed || 0;
    gameWinnable = !!s.winnable;
    paintFaces();
    piles = s.piles.map(list => list.map(id => cards[id]));
    cards.forEach((card, i) => { card.up = s.up[i] === '1'; });
    moves = +s.moves || 0;
    elapsed = +s.elapsed || 0;
    started = !!s.started;
    undoStack = Array.isArray(s.undo) ? s.undo.filter(u => u && Array.isArray(u.piles) && u.piles.length === PILES && typeof u.up === 'string') : [];
    state = 'play';
    running = started;
    return true;
  }

  // ---------- HUD, menu & loop ----------

  function renderStats() {
    const st = modeStats(suits);
    els.statsTitle.textContent = t.statsTitle(modeName(suits));
    const rows = [[t.played, st.played], [t.wins, st.won], [t.rate, st.played ? `${Math.round(st.won / st.played * 100)}%` : '—'], [t.bestScore, st.bestScore || '—'], [t.bestTime, st.bestTime ? formatTime(st.bestTime) : '—'], [t.streak, st.streak], [t.bestStreak, st.bestStreak]];
    els.statsList.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  }

  function updateHud() {
    els.score.textContent = String(score());
    els.moves.textContent = String(moves);
    els.time.textContent = formatTime(elapsed);
    els.runs.textContent = `${runsDone()}/8`;
    els.sub.innerHTML = seed ? `${modeName(suits)} · ${t.dealNo(seed)}${gameWinnable ? ` · <b>✓ ${t.solvable}</b>` : ''}` : modeName(suits);
    const left = dealsLeft();
    els.dealCount.textContent = String(left);
    els.dealCount.hidden = state === 'idle';
    els.deal.setAttribute('aria-label', `${t.deal} — ${left ? t.dealsLeft(left) : t.noDeals}`);
    els.undo.disabled = !undoStack.length || (state !== 'play' && state !== 'stuck');
    els.hint.disabled = state !== 'play';
    els.deal.disabled = state !== 'play' || !left;
    renderStats();
  }

  function openMenu() {
    clearTimeout(panelTimer);
    stopFx();
    releaseHeld();
    els.win.hidden = true;
    els.stuck.hidden = true;
    const inGame = state === 'play' || state === 'stuck';
    els.resumeBox.hidden = !inGame;
    for (const btn of document.querySelectorAll('[data-start]')) {
      const mode = +btn.dataset.start;
      const st = modeStats(mode);
      btn.setAttribute('aria-current', String(mode === suits));
      btn.querySelector('[data-rec]').textContent = st.played ? t.record(st.won, st.played) : t.fresh;
    }
    renderWinnable();
    els.start.hidden = false;
    (inGame ? $('resume') : document.querySelector(`[data-start="${suits}"]`)).focus({ preventScroll: true });
  }

  function closeMenu() {
    els.start.hidden = true;
    if (state === 'stuck' && !stuckSnoozed) els.stuck.hidden = false;
    table.focus({ preventScroll: true });
  }

  function renderWinnable() {
    els.winnable.setAttribute('aria-checked', String(winnablePref));
    els.winnableNote.textContent = winnablePref ? t.winnableOn : t.winnableOff;
  }

  const overlayOpen = () => !els.start.hidden || !els.win.hidden || !els.stuck.hidden;

  let last = performance.now();
  function frame(now) {
    // Clamp dt so a stalled tab never teleports the celebration; the clock only drops long stalls.
    const dt = Math.min(50, now - last);
    const clockDt = Math.min(1000, now - last);
    last = now;
    if (running && state === 'play' && !document.hidden && !overlayOpen()) {
      const before = Math.floor(elapsed / 1000);
      elapsed += clockDt;
      if (Math.floor(elapsed / 1000) !== before) {
        els.time.textContent = formatTime(elapsed);
        if (Math.floor(elapsed / 1000) % 5 === 0) saveSoon();
      }
    }
    if (fx.on) stepFx(dt);
    requestAnimationFrame(frame);
  }

  // ---------- Pointer: drag & tap ----------

  let press = null;

  // Tap sends a stack to its best spot (same suit first); tapping the same card again walks on to the next legal spot.
  function destinations(from, count) {
    const lead = piles[from][piles[from].length - count];
    const same = [], other = [];
    let empty = -1;
    for (let k = 1; k < COLS; k++) {
      const to = (from + k) % COLS;
      if (!canMove(from, count, to)) continue;
      const dest = top(to);
      if (!dest) { if (empty < 0) empty = to; } else (dest.suit === lead.suit ? same : other).push(to);
    }
    return [...same, ...other, ...(empty >= 0 ? [empty] : [])];
  }

  function tapCard(card) {
    const p = card.pile;
    if (!isCol(p) || !isRun(p, card.index)) { shake(card); announce(t.illegal); return; }
    const count = piles[p].length - card.index;
    const again = cycle && cycle.id === card.id && cycle.at === p;
    let to = -1;
    if (again) {
      const ring = cycle.ring;
      for (let k = 1; k <= ring.length && to < 0; k++) {
        const cand = ring[(cycle.pos + k) % ring.length];
        if (cand !== p && canMove(p, count, cand)) to = cand;
      }
    } else to = destinations(p, count)[0] ?? -1;
    if (to < 0) { shake(card); announce(t.illegal); return; }
    const ring = again ? cycle.ring : [p, ...destinations(p, count)];
    tryMove(p, count, to);
    if (state === 'play') cycle = { id: card.id, ring, pos: ring.indexOf(to), at: to };
  }

  function dropTarget(stack, from) {
    const lead = stack[0];
    let best = -1, bestArea = 0;
    for (let p = 0; p < COLS; p++) {
      if (!canMove(from, stack.length, p)) continue;
      const [x, y] = slotPos(p);
      const lastCard = top(p);
      const h = (lastCard ? lastCard.y - y : 0) + m.ch;
      const w = Math.min(lead.dragX + m.cw, x + m.cw) - Math.max(lead.dragX, x);
      const v = Math.min(lead.dragY + m.ch, y + h) - Math.max(lead.dragY, y);
      if (w > 0 && v > 0 && w * v > bestArea) { bestArea = w * v; best = p; }
    }
    return best;
  }

  // Hit-test against where cards are going, not where they are drawn, so rapid taps ignore cards still in flight.
  function hitTest(event) {
    const rect = table.getBoundingClientRect();
    const x = event.clientX - rect.left, y = event.clientY - rect.top;
    const inside = (cx, cy) => x >= cx && x < cx + m.cw && y >= cy && y < cy + m.ch;
    let card = null;
    for (const c of cards) if (c.pile >= 0 && inside(c.x, c.y) && (!card || c.z > card.z)) card = c;
    if (card) return { card, p: card.pile };
    for (let p = 0; p <= STOCK; p++) if (inside(...slotPos(p))) return { card: null, p };
    return { card: null, p: -1 };
  }

  table.addEventListener('pointerdown', event => {
    if (state !== 'play' || event.button > 0 || press || !m) return;
    setKb(false);
    releaseHeld();
    table.focus({ preventScroll: true });
    const { card, p } = hitTest(event);
    if (p < 0) return;
    event.preventDefault();
    if (p === STOCK) { press = { stock: true, id: event.pointerId }; return; }
    if (!isCol(p) || !card || !card.up) return;
    const movable = isRun(p, card.index);
    press = { id: event.pointerId, x: event.clientX, y: event.clientY, card, from: p, stack: movable ? piles[p].slice(card.index) : null, dragging: false };
    table.setPointerCapture(event.pointerId);
  });

  table.addEventListener('pointermove', event => {
    if (!press || press.stock || !press.stack || event.pointerId !== press.id) return;
    const dx = event.clientX - press.x, dy = event.clientY - press.y;
    if (!press.dragging) {
      if (Math.hypot(dx, dy) < 6) return;
      press.dragging = true;
      clearHint();
      press.stack.forEach((card, i) => { card.el.classList.add('dragging'); card.el.style.zIndex = 2000 + i; });
    }
    for (const card of press.stack) {
      card.dragX = card.x + dx;
      card.dragY = card.y + dy;
      card.el.style.transform = `translate(${card.dragX}px, ${card.dragY}px)`;
    }
  });

  table.addEventListener('pointerup', event => {
    if (!press || event.pointerId !== press.id) return;
    const done = press;
    press = null;
    if (done.stock) return dealRow();
    if (!done.dragging) return tapCard(done.card);
    done.stack.forEach(card => card.el.classList.remove('dragging'));
    const to = dropTarget(done.stack, done.from);
    if (to < 0 || !tryMove(done.from, done.stack.length, to, done.stack)) layout(done.stack);
  });

  table.addEventListener('pointercancel', () => {
    if (press?.dragging) { press.stack.forEach(card => card.el.classList.remove('dragging')); layout(press.stack); }
    press = null;
  });

  // ---------- Keyboard cursor ----------

  function setKb(on) { table.classList.toggle('kb', on); }

  function clampDepth(p, depth) {
    const pile = piles[p];
    if (!isCol(p) || !pile.length) return Math.max(0, pile.length - 1);
    return Math.min(Math.max(depth, runStart(p)), pile.length - 1);
  }

  function renderCursor() {
    if (!m) return;
    const p = cursor.p, pile = piles[p];
    let [x, y] = slotPos(p), h = m.ch;
    if (pile.length) {
      cursor.depth = clampDepth(p, cursor.depth);
      const lastCard = pile[pile.length - 1], card = isCol(p) ? pile[cursor.depth] : lastCard;
      x = card.x; y = card.y; h = lastCard.y - card.y + m.ch;
    }
    els.cursor.style.transform = `translate(${x}px, ${y}px)`;
    els.cursor.style.height = `${h}px`;
  }

  function describe(p) {
    const pile = piles[p];
    if (p === STOCK) return `${t.stock}: ${pile.length ? t.dealsLeft(dealsLeft()) : t.noDeals}`;
    if (!pile.length) return `${pileName(p)}: ${t.empty}`;
    return `${pileName(p)}: ${cardName(pile[cursor.depth])}`;
  }

  function moveCursor(key) {
    let { p, depth } = cursor;
    if (key === 'ArrowLeft' || key === 'ArrowRight') { p = (p + (key === 'ArrowLeft' ? STOCK : 1)) % (STOCK + 1); depth = Infinity; }
    else if (isCol(p)) depth = key === 'ArrowUp' ? Math.min(depth, piles[p].length - 1) - 1 : depth + 1;
    cursor.p = p;
    cursor.depth = clampDepth(p, depth);
    renderCursor();
    announce(describe(p));
  }

  function markHeld(on) {
    if (!held) return;
    piles[held.p].slice(-held.count).forEach(card => card.el.classList.toggle('held', on));
  }

  function releaseHeld() {
    markHeld(false);
    held = null;
  }

  function activate() {
    if (state !== 'play') return;
    const p = cursor.p;
    if (p === STOCK) { releaseHeld(); return dealRow(); }
    if (!held) {
      const pile = piles[p];
      if (!pile.length) return;
      const i = clampDepth(p, cursor.depth);
      if (!isRun(p, i)) { shake(pile[i]); announce(t.illegal); return; }
      held = { p, count: pile.length - i };
      markHeld(true);
      announce(t.picked(cardName(pile[i]), held.count));
      return;
    }
    const { p: from, count } = held;
    const card = piles[from][piles[from].length - count];
    releaseHeld();
    // Pressing Enter twice on the same column works like a tap: the best destination is chosen.
    if (from === p) return tapCard(card);
    if (!tryMove(from, count, p)) { shake(card); announce(t.illegal); return; }
    cursor.depth = Infinity;
    renderCursor();
  }

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' || overlayOpen() || state === 'idle') return;
    if ((event.ctrlKey || event.metaKey) && !event.altKey && event.key.toLowerCase() === 'z') { event.preventDefault(); undo(); return; }
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    const key = event.key;
    if (key.startsWith('Arrow')) {
      event.preventDefault();
      setKb(true);
      if (document.activeElement !== table) table.focus({ preventScroll: true });
      moveCursor(key);
    } else if ((key === 'Enter' || key === ' ') && (document.activeElement === table || document.activeElement === document.body)) {
      event.preventDefault();
      setKb(true);
      activate();
    } else if (key === 'h' || key === 'H') { event.preventDefault(); showHint(); }
    else if (key === 'u' || key === 'U') { event.preventDefault(); undo(); }
    else if (key === 'd' || key === 'D') { event.preventDefault(); dealRow(); }
  });

  // ---------- Buttons ----------

  els.undo.addEventListener('click', undo);
  els.hint.addEventListener('click', showHint);
  els.deal.addEventListener('click', dealRow);
  $('menu').addEventListener('click', openMenu);
  $('resume').addEventListener('click', closeMenu);
  els.winnable.addEventListener('click', () => { winnablePref = !winnablePref; write('winnable', winnablePref); renderWinnable(); });
  for (const btn of document.querySelectorAll('[data-start]')) {
    btn.addEventListener('click', () => { newGame(+btn.dataset.start); table.focus({ preventScroll: true }); });
  }
  els.again.addEventListener('click', () => { newGame(suits); table.focus({ preventScroll: true }); });
  $('change-mode').addEventListener('click', openMenu);
  $('stuck-undo').addEventListener('click', () => { undo(); table.focus({ preventScroll: true }); });
  $('stuck-replay').addEventListener('click', () => { newGame(suits, seed); table.focus({ preventScroll: true }); });
  $('stuck-new').addEventListener('click', () => { newGame(suits); table.focus({ preventScroll: true }); });
  $('stuck-keep').addEventListener('click', () => { stuckSnoozed = true; state = 'play'; running = true; els.stuck.hidden = true; updateHud(); table.focus({ preventScroll: true }); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

  new ResizeObserver(() => {
    table.classList.add('instant');
    if (measure()) layout();
    requestAnimationFrame(() => requestAnimationFrame(() => table.classList.remove('instant')));
  }).observe(table);

  // Read-only hooks for automated tests (no moves, no stats).
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__spider = {
    state: () => ({ suits, seed, winnable: gameWinnable, state, moves, score: score(), runs: runsDone(), dealsLeft: dealsLeft(), elapsed, started, undo: undoStack.length, overlay: ['start', 'win', 'stuck'].find(id => !els[id].hidden) || null, card: m && { w: m.cw, h: m.ch, wide: m.wide } }),
    columns: () => piles.slice(0, COLS).map(pile => pile.map(card => ({ id: card.id, rank: card.rank, suit: card.suit, up: card.up }))),
    stock: () => piles[STOCK].map(card => card.id),
    // Centre of the visible strip of card i in pile p (or of the empty slot), in client coordinates.
    point: (p, i) => {
      const rect = table.getBoundingClientRect();
      const pile = piles[p], card = pile[i ?? pile.length - 1];
      if (!card) { const [x, y] = slotPos(p); return { x: rect.left + x + m.cw / 2, y: rect.top + y + m.ch / 2 }; }
      const next = pile[card.index + 1];
      const h = next && isCol(p) ? next.y - card.y : m.ch;
      return { x: rect.left + card.x + m.cw / 2, y: rect.top + card.y + Math.min(h, m.ch) / 2 };
    },
    hints: () => nextHint().map(h => ({ ...h })),
    seedCount: mode => (SEEDS[mode] || []).length,
  };

  buildTable();
  if (restoreGame()) {
    if (measure()) layout();
    updateHud();
    openMenu();
  } else {
    paintFaces();
    // Before the first deal the whole double deck waits face down on the stock.
    piles[STOCK] = cards.slice();
    if (measure()) layout();
    updateHud();
    openMenu();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
