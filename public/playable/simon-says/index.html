<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simon Says</title>
<style>
:root {
  --bg: #13122a;
  --panel: #221f45;
  --panel-2: #2c2858;
  --text: #f6f4ff;
  --muted: #a9a4cf;
  --accent: #ffd23f;
  --red: #ef4b5b;
  --green: #2fc77e;
  --blue: #4c8bf5;
  --yellow: #ffcc33;
  --purple: #a66bff;
  --orange: #ff8a3c;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); color: var(--text);
  background: radial-gradient(ellipse at top, #2a2560, var(--bg) 65%);
  overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }

.app { height: 100%; max-width: 560px; margin: auto; display: flex; flex-direction: column; gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 10px; min-height: 40px; }
h1 { flex: 1; min-width: 0; font-size: clamp(24px, 7vw, 32px); font-weight: 900; letter-spacing: -.03em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h1 span { color: var(--accent); }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: var(--panel-2); font-size: 18px; font-weight: 900; box-shadow: 0 3px 0 #0d0b20; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0d0b20; }

.hud { display: flex; gap: 8px; }
.stat { flex: 1; padding: 6px 10px; border-radius: 14px; background: var(--panel); text-align: center; }
.stat small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat b { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat.mode b { font-size: 16px; line-height: 27px; }

.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.board { --size: min(100cqw, 100cqh); width: var(--size); height: var(--size); position: relative; display: grid; gap: calc(var(--size) * .04); padding: calc(var(--size) * .04); border-radius: 50%; background: #0d0b20; box-shadow: 0 10px 40px #0008; grid-template: 1fr 1fr / 1fr 1fr; }
.board.six { border-radius: 16%; grid-template: 1fr 1fr 1fr / 1fr 1fr; }
.board.wide.six { grid-template: 1fr 1fr / 1fr 1fr 1fr; }
.board.fail { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.pad { --c: var(--red); position: relative; display: grid; place-items: center; background: var(--c); filter: brightness(.55) saturate(.8); box-shadow: inset 0 -6px 0 #0004; transition: filter .15s, transform .15s; border-radius: 12%; }
.board:not(.six) .pad:nth-child(1) { border-top-left-radius: 100%; }
.board:not(.six) .pad:nth-child(2) { border-top-right-radius: 100%; }
.board:not(.six) .pad:nth-child(3) { border-bottom-left-radius: 100%; }
.board:not(.six) .pad:nth-child(4) { border-bottom-right-radius: 100%; }
.pad .sym { font-size: calc(var(--size) * .1); line-height: 1; color: #0007; font-weight: 900; pointer-events: none; }
.pad .key { position: absolute; bottom: 8%; font-size: calc(var(--size) * .035); font-weight: 900; color: #0006; pointer-events: none; }
.pad.lit { filter: brightness(1.15) saturate(1.1); transform: scale(1.03); box-shadow: 0 0 calc(var(--size) * .08) var(--c), inset 0 -6px 0 #0003; transition: none; z-index: 1; }
.pad.wrong { --c: #fff; filter: none; }
.board.locked .pad { cursor: default; }
.hub-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 28%; height: 28%; border-radius: 50%; background: #0d0b20; display: grid; place-items: center; text-align: center; pointer-events: none; }
.board.six .hub-center { display: none; }
.hub-center b { font-size: calc(var(--size) * .085); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.status { min-height: 26px; text-align: center; font-size: 17px; font-weight: 800; color: var(--muted); }
.status.go { color: var(--green); }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); background: #0b0a1ccc; }
.panel { width: min(100%, 420px); max-height: calc(100dvh - 24px); overflow: auto; background: var(--panel); border-radius: 28px; padding: 20px; text-align: center; box-shadow: 0 20px 50px #0009, inset 0 0 0 1px #ffffff14; animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 24px; font-weight: 900; }
.panel .lead { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.mode-btn { padding: 12px 10px; border-radius: 18px; background: var(--panel-2); text-align: left; box-shadow: 0 4px 0 #0d0b20; border: 2px solid transparent; }
.mode-btn:hover { border-color: #ffffff22; }
.mode-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0d0b20; }
.mode-btn strong { display: block; font-size: 16px; font-weight: 900; }
.mode-btn span { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); line-height: 1.3; }
.mode-btn small { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 99px; background: #ffffff12; font-size: 12px; font-weight: 800; color: var(--accent); }
.score { margin-top: 4px; font-size: clamp(44px, 13vw, 60px); font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
.sub { font-size: 14px; color: var(--muted); }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: var(--accent); color: #2b2200; font-size: 14px; font-weight: 800; }
.cta { margin-top: 16px; width: 100%; padding: 14px; border-radius: 18px; background: var(--accent); color: #2b2200; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 #b38f17; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #b38f17; }
.ghost-btn { margin-top: 10px; width: 100%; padding: 12px; border-radius: 16px; background: var(--panel-2); font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #0d0b20; }
.hint { margin-top: 12px; font-size: 12px; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 520px) and (min-aspect-ratio: 4/3) {
  .app { max-width: 1000px; display: grid; grid-template-columns: minmax(180px, .35fr) minmax(0, 1fr); grid-template-rows: auto auto 1fr; gap: 8px 16px; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .top { grid-column: 1; } h1 { font-size: clamp(20px, 2.6vw, 28px); white-space: normal; } .hud { grid-column: 1; flex-direction: column; } .status { grid-column: 1; text-align: start; }
  .board-wrap { grid-column: 2; grid-row: 1 / -1; }
  .panel { width: min(100%, 640px); padding: 14px 18px; }
  .modes { grid-template-columns: repeat(4, 1fr); }
  .cta { margin-top: 10px; padding: 11px; } .ghost-btn { margin-top: 8px; padding: 10px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Simon <span>Says</span></h1>
    <button type="button" class="icon-btn" id="mute" data-i18n-label="mute" aria-pressed="false">🔊</button>
    <button type="button" class="icon-btn" id="pause-btn" data-i18n-label="pause">❚❚</button>
  </header>
  <div class="hud">
    <div class="stat mode"><small data-i18n="mode"></small><b id="hud-mode"></b></div>
    <div class="stat"><small data-i18n="score"></small><b id="hud-score">0</b></div>
    <div class="stat"><small data-i18n="best"></small><b id="hud-best">0</b></div>
  </div>
  <div class="board-wrap"><div class="board locked" id="board" role="group" data-i18n-label="pads"></div></div>
  <p class="status" id="status"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="menu">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <h2 id="menu-title">Simon <span style="color:var(--accent)">Says</span></h2>
    <p class="lead" data-i18n="tagline"></p>
    <div class="modes" id="modes"></div>
    <p class="hint" data-i18n="keysHint"></p>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <h2 id="pause-title" data-i18n="paused"></h2>
    <p class="lead" data-i18n="pausedHint"></p>
    <button type="button" class="cta" id="resume" data-i18n="resume"></button>
    <button type="button" class="ghost-btn" id="quit" data-i18n="menu"></button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <h2 id="over-title" data-i18n="gameOver"></h2>
    <p class="score" id="over-score">0</p>
    <p class="sub" id="over-sub"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="again" data-i18n="again"></button>
    <button type="button" class="ghost-btn" id="to-menu" data-i18n="menu"></button>
  </div>
</div>

  ];
  const MODES = ['classic', 'speed', 'reverse', 'expert'];
  const ICON = { classic: '🔴', speed: '⚡', reverse: '🔁', expert: '🧠' };
  const KEY_STORE = 'milaan.simonSays.';
  const INPUT_LIMIT = 5000;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const $ = id => document.getElementById(id);
  const board = $('board');

  const load = (k, d) => { try { const v = localStorage.getItem(KEY_STORE + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(KEY_STORE + k, JSON.stringify(v)); } catch {} };
  let bests = load('best', {}); if (typeof bests !== 'object' || !bests) bests = {};
  let muted = !!load('muted', false);

  const announce = msg => { const a = $('announcer'); a.textContent = ''; setTimeout(() => { a.textContent = msg; }, 30); };

  // Audio
  let ctx = null;
  const ensureAudio = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { ctx = null; } }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
  };
  const tone = (freq, dur, type = 'triangle', vol = .22) => {
    if (muted || !ctx) return;
    try {
      const now = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(vol, now + .015);
      g.gain.setValueAtTime(vol, now + Math.max(.03, dur - .06)); g.gain.linearRampToValueAtTime(0, now + dur);
      o.connect(g).connect(ctx.destination); o.start(now); o.stop(now + dur + .02);
    } catch {}
  };
  const buzz = () => { tone(110, .55, 'sawtooth', .18); tone(116, .55, 'square', .08); };

  // State
  const S = { mode: 'classic', seq: [], idx: 0, phase: 'menu', timers: [], inputTimer: 0, padCount: 4 };
  const clearTimers = () => { S.timers.forEach(clearTimeout); S.timers = []; clearTimeout(S.inputTimer); };
  const later = (fn, ms) => { S.timers.push(setTimeout(fn, ms)); };
  let padEls = [];

  const buildBoard = () => {
    board.innerHTML = '';
    board.classList.toggle('six', S.padCount === 6);
    padEls = [];
    for (let i = 0; i < S.padCount; i++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'pad'; b.style.setProperty('--c', PADS[i].c);
      b.setAttribute('aria-label', `${i + 1}: ${t.colors[i]}`);
      b.innerHTML = `<span class="sym" aria-hidden="true">${PADS[i].sym}</span><span class="key" aria-hidden="true">${i + 1}</span>`;
      b.addEventListener('pointerdown', e => { e.preventDefault(); press(i); });
      b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press(i); } });
      board.appendChild(b); padEls.push(b);
    }
    if (S.padCount === 4) { const c = document.createElement('div'); c.className = 'hub-center'; c.innerHTML = '<b id="center">0</b>'; board.appendChild(c); }
    fitLayout();
  };
  const fitLayout = () => { const r = board.parentElement.getBoundingClientRect(); board.classList.toggle('wide', r.width > r.height * 1.2); };
  addEventListener('resize', fitLayout);

  const stepTime = () => {
    const n = S.seq.length;
    if (S.mode === 'speed') return Math.max(170, 560 - n * 30);
    return Math.max(300, 560 - Math.max(0, n - 5) * 15);
  };
  const flash = (i, ms) => {
    const el = padEls[i]; if (!el) return;
    el.classList.add('lit'); tone(PADS[i].f, ms / 1000);
    later(() => el.classList.remove('lit'), ms);
  };
  const setStatus = (txt, go = false) => { const s = $('status'); s.textContent = txt; s.classList.toggle('go', go); };
  const updateHud = () => {
    const sc = Math.max(0, S.seq.length - 1);
    $('hud-score').textContent = S.phase === 'over' ? S.score : sc;
    $('hud-best').textContent = bests[S.mode] || 0;
    $('hud-mode').textContent = t[S.mode];
    const c = $('center'); if (c) c.textContent = S.seq.length;
  };

  const playSequence = () => {
    clearTimers(); S.phase = 'watch'; S.idx = 0;
    board.classList.add('locked');
    setStatus(t.watch); updateHud();
    announce(`${t.round(S.seq.length)}. ${t.watch}`);
    const st = stepTime(), on = Math.round(st * .7);
    let at = 650;
    S.seq.forEach(p => { later(() => flash(p, on), at); at += st; });
    later(startInput, at);
  };
  const startInput = () => {
    S.phase = 'input'; S.idx = 0; board.classList.remove('locked');
    const msg = S.mode === 'reverse' ? t.yourTurnRev : t.yourTurn;
    setStatus(msg, true); announce(msg); armTimeout();
  };
  const armTimeout = () => { clearTimeout(S.inputTimer); S.inputTimer = setTimeout(() => fail(t.timeout), INPUT_LIMIT); };
  const nextRound = () => { S.seq.push(Math.floor(Math.random() * S.padCount)); playSequence(); };

  const press = i => {
    ensureAudio();
    if (S.phase !== 'input') return;
    const expected = S.mode === 'reverse' ? S.seq[S.seq.length - 1 - S.idx] : S.seq[S.idx];
    if (i !== expected) { padEls[i].classList.add('wrong'); fail(t.wrong, i); return; }
    flash(i, 220); S.idx++;
    if (S.idx >= S.seq.length) {
      clearTimeout(S.inputTimer); S.phase = 'between'; board.classList.add('locked');
      $('hud-score').textContent = S.seq.length;
      setStatus('✓', true);
      later(nextRound, 700);
    } else armTimeout();
  };

  const fail = (why, padIdx) => {
    clearTimers(); S.phase = 'over'; board.classList.add('locked');
    buzz(); setStatus(why);
    if (!reducedMotion.matches) { board.classList.remove('fail'); void board.offsetWidth; board.classList.add('fail'); }
    const correctPad = S.mode === 'reverse' ? S.seq[S.seq.length - 1 - S.idx] : S.seq[S.idx];
    if (padEls[correctPad]) padEls[correctPad].classList.add('lit');
    S.score = S.seq.length - 1;
    const isBest = S.score > (bests[S.mode] || 0);
    if (isBest) { bests[S.mode] = S.score; save('best', bests); }
    updateHud();
    later(() => {
      padEls.forEach(p => p.classList.remove('lit', 'wrong'));
      $('over-score').textContent = S.score;
      $('over-sub').textContent = t.overSub(t[S.mode], S.score);
      $('new-best').hidden = !isBest;
      show('over'); $('again').focus();
      announce(`${t.gameOver}. ${t.overSub(t[S.mode], S.score)}${isBest ? '. ' + t.newBest : ''}`);
    }, 1100);
  };

  const show = id => { for (const o of ['menu', 'pause', 'over']) $(o).hidden = o !== id; };

  const start = mode => {
    ensureAudio(); S.mode = mode; save('lastMode', mode);
    S.padCount = mode === 'expert' ? 6 : 4; S.seq = []; S.score = 0;
    buildBoard(); show(null); updateHud();
    nextRound();
  };
  const pause = () => {
    if (!['watch', 'input', 'between'].includes(S.phase)) return;
    clearTimers(); padEls.forEach(p => p.classList.remove('lit'));
    S.phase = 'paused'; board.classList.add('locked'); setStatus('');
    show('pause'); $('resume').focus(); announce(t.paused);
  };
  const resume = () => { if (S.phase !== 'paused') return; show(null); ensureAudio(); playSequence(); };
  const toMenu = () => { clearTimers(); S.phase = 'menu'; renderMenu(); show('menu'); setStatus(''); const f = document.querySelector('.mode-btn'); f && f.focus(); };

  const renderMenu = () => {
    const wrap = $('modes'); wrap.innerHTML = '';
    for (const m of MODES) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mode-btn'; b.dataset.mode = m;
      b.innerHTML = `<strong>${ICON[m]} ${t[m]}</strong><span>${t[m + 'Desc']}</span><small>${t.bestVal(bests[m] || 0)}</small>`;
      b.addEventListener('click', () => start(m));
      wrap.appendChild(b);
    }
  };

  const setMute = v => { muted = v; save('muted', v); const b = $('mute'); b.textContent = v ? '🔇' : '🔊'; b.setAttribute('aria-pressed', String(v)); };
  $('mute').addEventListener('click', () => { ensureAudio(); setMute(!muted); });
  $('pause-btn').addEventListener('click', () => (S.phase === 'paused' ? resume() : pause()));
  $('resume').addEventListener('click', resume);
  $('quit').addEventListener('click', toMenu);
  $('again').addEventListener('click', () => start(S.mode));
  $('to-menu').addEventListener('click', toMenu);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('blur', pause);
  document.addEventListener('keydown', e => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= S.padCount && S.phase === 'input') { e.preventDefault(); press(n - 1); return; }
    const k = e.key.toLowerCase();
    if (k === 'm') { ensureAudio(); setMute(!muted); }
    else if (k === 'p' || e.key === 'Escape') { if (S.phase === 'paused') resume(); else pause(); }
  });

  setMute(muted);
  S.mode = MODES.includes(load('lastMode', 'classic')) ? load('lastMode', 'classic') : 'classic';
  buildBoard(); updateHud(); renderMenu(); show('menu');
})();
</script>
</body>
</html>
