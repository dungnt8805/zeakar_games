<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw Poker</title>
<style>
:root {
  --bg: #07140e;
  --felt: #1d7048;
  --felt-dark: #0b3522;
  --felt-light: #2a9363;
  --screen: #163a8c;
  --screen-dark: #08194a;
  --pay: #ffe36b;
  --pay-col: #c8323c;
  --rail: #6b3d22;
  --rail-light: #9a5f37;
  --text: #f3f7f4;
  --muted: #a8cbb8;
  --gold: #f6c95b;
  --gold-dark: #b98a22;
  --win: #46d483;
  --lose: #ff6b6b;
  --red: #d22a3f;
  --ink: #1b2130;
  --plate: linear-gradient(#21503a, #11291e);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: radial-gradient(120% 70% at 50% 0%, #14382a, var(--bg) 70%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.sr-only { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; max-width: 560px; margin: auto; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
@media (min-aspect-ratio: 5/4) { .app { max-width: 1120px; } }
.app[data-mode="table"] .vonly, .app[data-mode="video"] .tonly { display: none !important; }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; min-width: 0; font-size: clamp(19px, 6vw, 28px); font-weight: 900; letter-spacing: -.03em; line-height: 1; color: var(--gold); text-shadow: 0 2px 0 #0006; white-space: nowrap; }
.modes { display: flex; flex-shrink: 0; padding: 3px; border-radius: 12px; background: #00000040; }
.modes button { padding: 6px 10px; border-radius: 9px; font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.modes button[aria-pressed="true"] { background: var(--gold); color: #2b1f04; }
.icon { width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; background: #00000040; font-size: 16px; font-weight: 900; color: var(--muted); }
.icon:hover { color: var(--gold); }
.icon svg { width: 18px; height: 18px; }

.hud { display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 4px 4px 5px; border-radius: 12px; background: #00000038; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.stat strong { display: block; font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.stat.bank strong { color: var(--gold); }
.stat.win strong { color: var(--win); }
.stat.bump strong { animation: bump .35s; }
@keyframes bump { 40% { scale: 1.18; } }

/* ---------- cards (shared) ---------- */
.card { position: relative; flex: none; width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1); background: linear-gradient(#fff, #f6f2ea); color: var(--ink); box-shadow: 0 1px 2px #0007, 0 0 0 .5px #0003; transition: translate .25s, filter .25s, box-shadow .25s; }
.card.red { color: var(--red); }
.ci { position: absolute; left: 7%; top: 4%; display: flex; flex-direction: column; align-items: center; font-weight: 900; line-height: .95; font-size: calc(var(--cw) * .3); letter-spacing: -.08em; }
.ci i { font-style: normal; font-size: .82em; letter-spacing: 0; }
.cs { position: absolute; inset: 0; display: grid; place-items: center; padding: 18% 0 0 16%; font-size: calc(var(--cw) * .55); line-height: 1; }
.cs.face { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: calc(var(--cw) * .5); }
.cs.face::after { content: ""; position: absolute; left: 32%; right: 12%; top: 28%; bottom: 10%; border-radius: calc(var(--cw) * .06); border: 1.5px solid currentColor; opacity: .25; }
.card.down { background: repeating-linear-gradient(45deg, #ffffff24 0 2px, transparent 2px 7px), repeating-linear-gradient(-45deg, #ffffff24 0 2px, transparent 2px 7px), linear-gradient(160deg, #3f78d6, #1d3f8f); box-shadow: inset 0 0 0 calc(var(--cw) * .06) #fff, 0 1px 2px #0007; }
.card.down > * { display: none; }
.card.deal { animation: deal .26s cubic-bezier(.2, .8, .3, 1) backwards; }
.card.flip { animation: flip .3s ease-out; }
.card.hl { translate: 0 calc(var(--cw) * -.1); box-shadow: 0 0 0 2px var(--gold), 0 0 16px var(--gold), 0 2px 4px #0008; }
.card.dim { filter: brightness(.5) saturate(.6); }
@keyframes deal { from { opacity: 0; transform: translateY(calc(var(--cw) * -1.2)) rotate(-10deg) scale(.6); } }
@keyframes flip { from { transform: scaleX(0); } }
@keyframes pop { from { scale: .3; opacity: 0; } }

/* ---------- video poker machine ---------- */
.machine { position: relative; flex: 1; min-height: 0; width: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding: 9px 9px 11px; border: 7px solid var(--rail); border-radius: 22px; background: radial-gradient(#ffffff0a 1px, transparent 1.5px) 0 0 / 5px 5px, radial-gradient(110% 80% at 50% 0%, #2152b8, var(--screen) 45%, var(--screen-dark)); box-shadow: inset 0 0 0 2px #00000030, inset 0 0 40px #0007, 0 0 0 2px var(--rail-light), 0 14px 30px #0008; }
.paytable { flex: none; padding: 3px 4px; border-radius: 10px; background: #00000059; box-shadow: inset 0 0 0 1.5px #ffe36b4d; font-size: 13px; font-weight: 900; line-height: 1.32; color: var(--pay); }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) repeat(5, var(--pc, 3.6em)); align-items: center; border-radius: 5px; }
.pn { min-width: 0; padding-left: 5px; white-space: nowrap; overflow: hidden; }
.pv { padding-right: .32em; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pv.on { background: var(--pay-col); color: #fff; }
.pr:first-child .pv.on { border-radius: 5px 5px 0 0; }
.pr:last-child .pv.on { border-radius: 0 0 5px 5px; }
.pr.has { background: #ffffff1f; }
.pr.win { background: var(--pay); color: #10275f; }
.pr.win .pv.on { background: #9a1f29; }
.pr.win.blink { animation: blink .45s 4; }
@keyframes blink { 50% { background: transparent; color: var(--pay); } }
.stage { --resh: 30px; position: relative; flex: 1; min-height: 0; container-type: size; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.vres { flex: none; height: var(--resh); max-width: 100%; display: flex; align-items: center; justify-content: center; gap: .4em; padding: 0 6px; font-size: calc(var(--resh) * .62); font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: var(--pay); text-shadow: 0 2px 0 #0007; white-space: nowrap; overflow: hidden; }
.vres b { color: #fff; }
.vres.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.vcards { --cw: min(17.4cqw, calc((100cqh - var(--resh) - 26px) / 1.4), 140px); display: flex; gap: min(2.2cqw, 14px); }
.vslot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border-radius: calc(var(--cw) * .12); }
.vslot:disabled { color: inherit; }
.vlab { height: 16px; font-size: 11px; font-weight: 900; line-height: 16px; letter-spacing: .06em; text-transform: uppercase; color: var(--pay); white-space: nowrap; }
.vlab:empty { visibility: hidden; }
.vslot .card.hl { translate: 0; }
.vslot.held .card { box-shadow: 0 0 0 2.5px var(--pay), 0 3px 8px #0009; }
.vslot.held .vlab { padding: 0 6px; border-radius: 99px; background: var(--pay); color: #10275f; }
.vslot:not(:disabled):hover .card { translate: 0 -2px; }
.vslot.held:not(:disabled):hover .card { translate: 0; }
.vtoast, .toast { position: absolute; left: 50%; top: 42%; z-index: 20; translate: -50% -50%; max-width: 88%; padding: 8px 14px; border-radius: 99px; background: #000000c4; font-size: 13px; font-weight: 800; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
.vtoast.show, .toast.show { opacity: 1; }

/* ---------- table (5-card draw) ---------- */
/* The felt box is only a positioning frame; the oval table, seats and bets are placed in it by layout(). */
.felt { --cw: 56px; --mw: 26px; --sw: 88px; flex: 1; min-height: 0; position: relative; }
.oval { position: absolute; border-radius: 999px; border: 8px solid var(--rail); background: radial-gradient(#ffffff08 1px, transparent 1.5px) 0 0 / 5px 5px, radial-gradient(90% 80% at 50% 35%, var(--felt-light), var(--felt) 50%, var(--felt-dark)); box-shadow: inset 0 0 0 2px #00000030, inset 0 0 50px #0007, 0 0 0 2px var(--rail-light), 0 14px 30px #0008; }
.oval::after { content: ""; position: absolute; inset: 7%; border-radius: inherit; border: 1.5px solid #f6c95b2e; }
.center { position: absolute; z-index: 5; left: 50%; top: 50%; translate: -50% -50%; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.round { padding: 2px 10px; border-radius: 99px; background: #00000040; font-size: 10.5px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: #f6c95bcc; white-space: nowrap; }
.round:empty { display: none; }
.deck { --cw: 26px; position: relative; height: calc(var(--cw) * 1.4); }
.deck .card { box-shadow: 2px 2px 0 #ffffffb3, 4px 4px 0 #1d3f8f, 0 4px 8px #0007, inset 0 0 0 calc(var(--cw) * .06) #fff; }
.pot { position: relative; display: flex; align-items: center; gap: 6px; padding: 3px 12px 3px 4px; border-radius: 99px; background: #00000066; font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pot small { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pot.empty { visibility: hidden; }
.sides { position: absolute; left: 50%; top: 100%; translate: -50% 0; margin-top: 4px; width: max-content; max-width: var(--smax, 240px); white-space: normal; font-size: 10.5px; font-weight: 800; line-height: 1.3; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.center.showing .pot, .center.showing .deck, .center.showing .round { visibility: hidden; }
.banner { position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: 6; width: max-content; max-width: var(--bmax, 260px); padding: 5px 14px; border-radius: 14px; background: #0f2a1df2; box-shadow: 0 0 0 1.5px var(--gold), 0 6px 16px #0009; text-align: center; font-size: 13px; font-weight: 900; line-height: 1.3; color: var(--gold); animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.banner small { display: block; font-size: 11.5px; font-weight: 800; color: var(--text); }
.banner[hidden] { display: none; }

.seat { position: absolute; left: 0; top: 0; width: var(--sw); translate: -50% -50%; display: flex; flex-direction: column; align-items: center; transition: opacity .4s; }
.seat.gone { opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
.mini { --cw: var(--mw); position: relative; z-index: 0; display: flex; justify-content: center; height: calc(var(--mw) * .9); }
.mini .card + .card { margin-left: calc(var(--cw) * -.62); }
.mini .card:nth-child(1) { rotate: -14deg; top: 3px; }
.mini .card:nth-child(2) { rotate: -7deg; top: 1px; }
.mini .card:nth-child(4) { rotate: 7deg; top: 1px; }
.mini .card:nth-child(5) { rotate: 14deg; top: 3px; }
.seat.shown .mini { --cw: calc(var(--mw) * 1.15); height: calc(var(--mw) * 1.12); }
.seat.shown .mini .card { rotate: 0deg; top: 0; }
.seat.shown .mini .card + .card { margin-left: calc(var(--cw) * -.44); }
.felt.compact .seat.shown .mini { --cw: calc(var(--mw) * 1.08); }
.felt.compact .seat.shown .mini .card + .card { margin-left: calc(var(--cw) * -.6); }
.felt.compact .round, .felt.compact .deck { display: none; }
.felt.compact .plate { gap: 3px; padding: 3px 4px 3px 3px; }
.felt.compact .av { width: 20px; height: 20px; font-size: 13px; }
.felt.compact .who b { font-size: 11.5px; letter-spacing: -.02em; }
.plate { position: relative; z-index: 1; width: 100%; min-height: 36px; display: flex; align-items: center; gap: 5px; padding: 4px 6px 4px 4px; border-radius: 12px; background: var(--plate); box-shadow: 0 0 0 1.5px #ffffff22, 0 4px 10px #0007; transition: box-shadow .2s, opacity .3s; }
.av { width: 28px; height: 28px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: #ffffff1c; font-size: 17px; line-height: 1; }
.who { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.18; }
.who .nm { font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; }
.who .sty { display: none; font-size: 10px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; }
.felt.wide:not(.short) .who .sty { display: block; }
.who b { font-size: 12.5px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { position: absolute; left: 50%; bottom: -9px; z-index: 2; translate: -50% 0; padding: 1px 7px; border-radius: 99px; background: #dfe6ee; color: var(--ink); font-size: 10px; font-weight: 900; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.tag:empty { display: none; }
.tag.st-fold { background: #5b6675; color: #dfe6ee; }
.tag.st-bet, .tag.st-raise { background: var(--gold); color: #2b1f04; }
.tag.st-allin { background: var(--lose); color: #fff; }
.tag.st-win { background: var(--win); color: #062a17; }
.tag.st-hand { background: #fff1c2; color: #2b1f04; }
.tag.st-sb, .tag.st-bb, .tag.st-ante { background: #4f7363; color: var(--text); }
.tag.pop, .drew.pop { animation: pop .3s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.drew { position: absolute; left: 50%; top: -10px; z-index: 2; translate: -50% 0; padding: 1px 7px; border-radius: 99px; background: #3f78d6; color: #fff; font-size: 10px; font-weight: 900; white-space: nowrap; box-shadow: 0 2px 4px #0006; }
.drew:empty { display: none; }
.dots { position: absolute; right: 5px; top: -8px; display: none; gap: 3px; padding: 4px 6px; border-radius: 99px; background: var(--gold); }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: #2b1f04; animation: dot 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 30% { translate: 0 -3px; opacity: .5; } }
.seat.thinking .dots { display: flex; }
.seat.turn .plate, .myplate.turn { box-shadow: 0 0 0 2px var(--gold), 0 0 16px #f6c95b77; }
.seat.thinking .plate { animation: glow 1s infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 0 2px var(--gold), 0 0 22px #f6c95baa; } }
.seat.folded .plate { opacity: .5; }
.seat.won .plate, .myplate.won { box-shadow: 0 0 0 2px var(--win), 0 0 18px #46d48399; }

.me { position: absolute; left: 50%; top: 0; translate: -50% 0; display: flex; flex-direction: column; align-items: center; }
.me .hand { display: flex; justify-content: center; gap: calc(var(--cw) * .06); height: calc(var(--cw) * 1.4); }
.pick { position: relative; padding: 0; border-radius: calc(var(--cw) * .1); }
.pick.disc .card { translate: 0 calc(var(--cw) * .14); filter: brightness(.55) saturate(.5); }
.pick.disc::after { content: attr(data-lab); position: absolute; left: 50%; top: 58%; z-index: 2; translate: -50% -50%; padding: 1px 6px; border-radius: 99px; background: var(--lose); color: #fff; font-size: clamp(9px, calc(var(--cw) * .2), 12px); font-weight: 900; text-transform: uppercase; white-space: nowrap; }
.pick:not(:disabled):hover .card { translate: 0 -3px; }
.pick.disc:not(:disabled):hover .card { translate: 0 calc(var(--cw) * .12); }
.me.folded .hand { opacity: .45; }
.myplate { position: relative; z-index: 1; margin-top: -6px; width: var(--pw, 200px); padding: 5px 12px 6px; border-radius: 14px; background: var(--plate); box-shadow: 0 0 0 1.5px #ffffff22, 0 4px 10px #0007; text-align: center; transition: box-shadow .2s; }
.myplate .l1 { display: flex; justify-content: center; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 900; white-space: nowrap; }
.myplate .l1 b { color: var(--gold); font-variant-numeric: tabular-nums; }
.myplate .l2 { min-height: 16px; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; }
.myplate .tag { left: 12px; bottom: auto; top: -9px; translate: 0; }
.myplate .drew { left: auto; right: 12px; top: -9px; translate: 0; }

.bet { position: absolute; left: 0; top: 0; z-index: 6; translate: -50% -50%; display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border-radius: 99px; background: #00000073; font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bet[hidden] { display: none; }
.felt.compact .bet { gap: 3px; padding-right: 6px; font-size: 11px; }
.felt.compact .bet .chip.sm { width: 15px; height: 15px; }
.bet.pop { animation: pop .3s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.dbtn { position: absolute; left: 0; top: 0; z-index: 4; width: 22px; height: 22px; translate: -50% -50%; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, #fff 60%, #e4e8ee 61%); color: #1b2130; font-size: 11px; font-weight: 900; box-shadow: 0 2px 0 #0006, 0 0 0 1px #0002; transition: left .5s ease, top .5s ease; }
.dbtn[hidden] { display: none; }

.chip { position: relative; width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 900; color: #fff; background: radial-gradient(circle, var(--c) 52%, transparent 53%), repeating-conic-gradient(#fff 0 15deg, var(--c) 15deg 45deg); box-shadow: inset 0 0 0 3px var(--c), 0 3px 0 #0007; text-shadow: 0 1px 0 #0008; transition: translate .15s, box-shadow .15s; }
.chip::before { content: ""; position: absolute; inset: 22%; border-radius: 50%; border: 1.5px dashed #ffffffaa; }
.chip.sm { width: 18px; height: 18px; box-shadow: inset 0 0 0 1.5px var(--c), 0 1px 0 #0007; }
.chip.sm::before { border-width: 1px; }
.chip.fly { position: absolute; z-index: 30; translate: -50% -50%; pointer-events: none; }
button.chip:disabled { opacity: .35; }
button.chip[aria-pressed="true"] { translate: 0 -3px; box-shadow: inset 0 0 0 3px var(--c), 0 0 0 3px var(--gold), 0 0 14px #f6c95b99, 0 5px 0 #0007; }
.c25 { --c: #20915a; }
.c100 { --c: #252a36; }
.c500 { --c: #7a4dd6; }
.c1000 { --c: #d4900f; }
.c5000 { --c: #b23a2c; }

.msg { flex-shrink: 0; min-height: 20px; font-size: 14px; font-weight: 800; text-align: center; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.good { color: var(--win); }
.msg.bad { color: var(--lose); }

.controls { flex-shrink: 0; width: 100%; max-width: 680px; margin: 0 auto; height: 124px; display: grid; }
.app[data-mode="video"] .controls { height: 104px; }
.cbox { grid-area: 1 / 1; display: grid; min-width: 0; }
.bar { grid-area: 1 / 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; min-width: 0; }
.bar[hidden] { display: none; }
.row { display: flex; gap: 6px; }
.row > button { flex: 1; min-width: 0; }
.chips { display: flex; justify-content: center; align-items: center; gap: 8px; }
.chips > .chip { flex: none; }
.ghost { flex: none; height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; border-radius: 10px; background: #ffffff14; font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.ghost b { min-width: 20px; padding: 1px 5px; border-radius: 99px; background: var(--pay-col); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
.ghost:not(:disabled):hover { color: var(--gold); }
.ghost:disabled { opacity: .4; }
.quick button { height: 30px; padding: 0 4px; border-radius: 9px; background: #ffffff14; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quick button:not(:disabled):hover { color: var(--gold); }
.quick button:disabled { opacity: .35; }
.slide { align-items: center; height: 30px; }
.slide > button { flex: none; width: 34px; height: 30px; border-radius: 9px; background: #ffffff14; font-size: 18px; font-weight: 900; line-height: 1; color: var(--muted); }
.slide > button:disabled { opacity: .35; }
input[type="range"] { --p: 0%; flex: 1; min-width: 0; height: 30px; margin: 0 4px; background: transparent; appearance: none; -webkit-appearance: none; touch-action: none; cursor: pointer; }
input[type="range"]:disabled { opacity: .35; cursor: default; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--gold) var(--p), #ffffff26 var(--p)); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--gold) var(--p), #ffffff26 var(--p)); }

  function vDeal(max = false) {
    if (V.state === 'dblOffer') vCollect();
    if (V.state !== 'bet') return;
    if (max) V.credits = 5;
    if (V.bank < MIN_BET) { openPanel('brokePanel'); return; }
    if (V.credits * V.value > V.bank) {
      let vi = VALUES.indexOf(V.value);
      while (vi > 0 && V.bank < VALUES[vi]) vi--;
      V.value = VALUES[vi];
      V.credits = Math.max(1, Math.min(V.credits, Math.floor(V.bank / V.value)));
      vToast(t.lowered);
    }
    V.bank -= V.credits * V.value;
    let order;
    if (V.rig) {
      const fixed = [...V.rig.hand, ...(V.rig.draw || [])].map(parseCard);
      order = fixed.concat(shuffle(DECK.filter(c => !fixed.includes(c))));
      V.rig = null;
    } else order = shuffle(DECK.slice());
    V.deck = order.reverse();
    V.cards = [V.deck.pop(), V.deck.pop(), V.deck.pop(), V.deck.pop(), V.deck.pop()];
    V.cards.forEach(c => fresh.add(c));
    V.view = 'hand';
    V.state = 'hold';
    V.pending = 0;
    V.winRow = -1;
    V.dbl = null;
    V.dealtRow = payRow(V.cards);
    const hint = holdHint(V.cards);
    V.held = settings.hint ? hint : [false, false, false, false, false];
    const text = settings.hint ? hintText(hint) : V.dealtRow >= 0 ? t.vHas(t.pay[V.dealtRow]) : t.vHold;
    vMsg(text);

  function vDraw() {
    if (V.state !== 'hold') return;
    for (let i = 0; i < 5; i++) if (!V.held[i]) { V.cards[i] = V.deck.pop(); fresh.add(V.cards[i]); }
    const row = payRow(V.cards);

    V.winRow = row;
    stats.vHands++;

    if (sc > stats.vBest) { stats.vBest = sc; stats.vBestCards = V.cards.slice(); }
    if (row === 0) stats.vRoyals++;
    if (win) {

  function vCollect() {
    if (!V.pending) return;
    const n = V.pending;
    V.bank += n;
    stats.vBigWin = Math.max(stats.vBigWin, n);
    V.pending = 0;
    V.state = 'bet';
    bump('vBankStat');

  function vDouble() {
    if (V.state !== 'dblOffer') return;

  function vPick(k) {
    if (V.state !== 'dblPick' || k < 1 || k > 4) return;
    const d = V.dbl;
    d.pick = k;
    d.downs.forEach(c => flips.add(c));
    const mine = rankOf(d.downs[k - 1]), theirs = rankOf(d.up);

    if (mine > theirs) {

      V.lastWin = V.pending;

      V.state = 'bet';

  }

  function checkBroke() {
    if (V.state === 'bet' && V.bank < MIN_BET && !V.pending) setTimeout(() => { if (mode === 'video' && V.bank < MIN_BET) openPanel('brokePanel'); }, reduced ? 100 : 900);
  }
  function setValue(v) {

  function betOne() {

  function vAction(role) {

  // ---------- video rendering ----------
  const slots = [];
  function buildVideo() {
    $('paytable').innerHTML = t.pay.map((name, r) => `<div class="pr" role="row"><span class="pn" role="rowheader">${name}</span>${[1, 2, 3, 4, 5].map(k => `<span class="pv" role="cell">${fmt(payout(r, k))}</span>`).join('')}</div>`).join('');

  function renderVideo() {

  // The machine's own result line: the dealt hand, the win, or the double-up result.
  function renderVRes() {
    const el = $('vres');

    else if (V.view === 'hand' && V.winRow >= 0) html = `${t.pay[V.winRow]} <b>${fmt(V.lastWin || V.pending)}</b>`;
    else if (V.view === 'dbl' && V.dbl.pick >= 0) html = V.pending || V.lastWin ? `${t.win} <b>${fmt(V.pending || V.lastWin)}</b>` : '—';
    else if (V.view === 'dbl') html = `${t.doubleUp} <b>${fmt(V.pending)}</b>`;

  function renderPaytable() {

  function renderSlots() {

          enabled = V.state === 'dblPick';

          dim = d.pick >= 0 && d.pick !== i;
          hl = d.pick === i;
        }
      } else aria = t.hidden;
      const sig = `${c}|${down}`;

  function renderVControls() {

    const L = $('vLeft'), R = $('vRight');
    const roles = {
      bet: [['max', t.maxBet, 'M'], ['deal', t.deal, 'Enter']],
      hold: [['hint', t.hint, 'H'], ['draw', t.draw, 'Enter']],
      dblOffer: [['double', t.doubleUp, 'D'], ['collect', t.collect(fmt(V.pending)), 'C']],
      dblPick: [['double', t.doubleUp, 'D'], ['collect', t.collect(fmt(V.pending)), 'C']],
    }[st];

  function fitPaytable() {
    const pt = $('paytable');
    if (!pt.clientWidth) return;
    pt.style.fontSize = '';
    pt.style.removeProperty('--pc');
    let fs = parseFloat(getComputedStyle(pt).fontSize);
    let pc = 3.6;
    const over = () => [...pt.querySelectorAll('.pn')].some(el => el.scrollWidth > el.clientWidth + 0.5);
    // Long hand names first take room from the number columns, then the font shrinks.
    while (over() && (pc > 3.35 || fs > 10)) {
      if (pc > 3.35) { pc -= 0.1; pt.style.setProperty('--pc', `${pc.toFixed(2)}em`); } else { fs -= 0.5; pt.style.fontSize = `${fs}px`; }
    }

  // ---------- table state ----------
  let seats = [];
  let button = -1;
  let handNo = 0;
  let level = 0;
  let hand = null;
  let phase = 'lobby';
  let gen = 0;
  let resolveAction = null;
  let resolveDraw = null;
  let resolveNext = null;
  let armed = false;
  let geo = null;
  let rig = null;
  let aiOverride = null;
  let aiDrawOverride = null;
  let delayScale = 1;
  let autoNext = true;
  let turnSeat = null;
  const ABORT = { abort: true };

  const me = () => seats[0];
  const inHand = s => !s.out && s.cards.length > 0;
  const contenders = () => seats.filter(s => inHand(s) && !s.folded);
  const canAct = s => inHand(s) && !s.folded && !s.allIn;
  const sumBets = () => seats.reduce((sum, s) => sum + s.bet, 0);
  const potTotal = () => (hand ? hand.pot + sumBets() : 0);
  const mul = () => (SPEEDS[settings.speed] || 1) * delayScale;
  const tMsg = (text, tone = '') => setMsg('table', text, tone);
  const tableRunning = () => ['busy', 'you', 'draw', 'between'].includes(phase);
  function nextSeat(i, pred) {
    for (let k = 1; k <= seats.length; k++) { const j = (i + k + seats.length) % seats.length; if (pred(seats[j])) return j; }
    return -1;
  }
  const forcedText = () => {
    const [sb, bb] = hand ? [hand.sb, hand.bb] : LEVELS[level];
    return forced === 'antes' ? t.anteF(fmt(bb / 4)) : t.blindsF(fmt(sb), fmt(bb));
  };

  // ---------- pots (pure, so the tests can call them directly) ----------
  // players: [{ total, folded }] -> [{ amount, eligible: [index] }], main pot first.
  function buildPots(players) {
    const caps = [...new Set(players.filter(p => !p.folded && p.total > 0).map(p => p.total))].sort((a, b) => a - b);
    const pots = [];
    let prev = 0;
    for (const cap of caps) {
      let amount = 0;
      for (const p of players) amount += Math.max(0, Math.min(p.total, cap) - prev);
      const eligible = players.map((p, i) => i).filter(i => !players[i].folded && players[i].total >= cap);
      const last = pots[pots.length - 1];
      if (last && last.eligible.join() === eligible.join()) last.amount += amount;
      else if (amount) pots.push({ amount, eligible });
      prev = cap;
    }
    const leftover = players.reduce((sum, p) => sum + Math.max(0, p.total - prev), 0);
    if (leftover && pots.length) pots[pots.length - 1].amount += leftover;
    return pots;
  }
  // Splits a pot in whole chips; odd chips go one by one starting left of the button.
  function splitPot(amount, winners, btn, seatsN, unit = UNIT) {
    const order = winners.slice().sort((a, b) => ((a - btn - 1 + seatsN) % seatsN) - ((b - btn - 1 + seatsN) % seatsN));
    const share = Math.floor(amount / order.length / unit) * unit;
    const pay = new Map(order.map(w => [w, share]));
    let rest = amount - share * order.length;
    for (const w of order) { if (rest <= 0) break; const g = Math.min(unit, rest); pay.set(w, pay.get(w) + g); rest -= g; }
    return pay;
  }

  // ---------- draws ----------
  // A legal draw swaps at most 3 cards, or 4 when the card kept is an Ace.
  function legalDraw(cards, disc) {
    const d = [...disc];
    if (d.length <= 3) return true;
    return d.length === 4 && cards.some((c, i) => !disc.has(i) && rankOf(c) === 14);
  }
  // Which cards to throw away. With no style it is the plain "default" draw used to model opponents.
  function planDraw(cards, P) {
    const R = cards.map(rankOf), S = cards.map(suitOf);
    const all = [0, 1, 2, 3, 4];
    const toss = keep => all.filter(i => !keep.includes(i));
    const roll = p => (P ? Math.random() < p : p >= 0.5);
    const sc = score(cards);
    const cat = category(sc);
    if (cat >= 4) return [];
    const byRank = r => all.filter(i => R[i] === r);
    const pairs = [...new Set(R)].filter(r => byRank(r).length === 2).sort((a, b) => b - a);
    const byHigh = all.slice().sort((a, b) => R[b] - R[a]);
    if (cat === 3) {
      const keep = byRank(topRank(sc));
      if (P && roll(P.kick)) keep.push(byHigh.find(i => !keep.includes(i)));
      return toss(keep);
    }
    if (cat === 2) return toss([...byRank(pairs[0]), ...byRank(pairs[1])]);
    const fsuit = [0, 1, 2, 3].find(s => S.filter(x => x === s).length === 4);
    const flushKeep = fsuit === undefined ? null : all.filter(i => S[i] === fsuit);
    const straightKeep = open => combos(4).find(ks => straightDraw(R, ks, open)) || null;
    if (cat === 1) {
      const pr = byRank(pairs[0]);
      if (flushKeep && P && pairs[0] < 11 && roll(P.flush * 0.4)) return toss(flushKeep);
      const ace = all.find(i => R[i] === 14 && !pr.includes(i));
      if (P && ace !== undefined && roll(P.kick)) return toss([...pr, ace]);
      return toss(pr);
    }
    if (flushKeep && roll(P ? P.flush : 1)) return toss(flushKeep);
    const open = straightKeep(true);
    if (open && roll(P ? P.straight : 1)) return toss(open);
    const gut = straightKeep(false);
    if (gut && P && roll(P.gut)) return toss(gut);
    if (R[byHigh[0]] === 14) return toss([byHigh[0]]);
    return toss(byHigh.slice(0, 2));
  }

  // Monte-Carlo win share. Before the draw everyone draws by the default plan; after it, each opponent's hand is
  // sampled so that the default plan would have drawn exactly as many cards as they did.
  async function equity(s) {
    const g = gen;
    const opps = contenders().filter(o => o !== s);
    if (!opps.length) return 1;
    const pre = hand.street === 0;
    const known = new Set(s.cards);
    const pool = DECK.filter(c => !known.has(c));
    const n = pool.length;
    const keepMine = pre ? s.cards.filter((c, i) => !(s.plan || []).includes(i)) : s.cards.slice();
    const swapIn = (ptr, k) => { for (let q = 0; q < k && ptr + q < n; q++) { const j = ptr + q + Math.floor(Math.random() * (n - ptr - q)); const tmp = pool[ptr + q]; pool[ptr + q] = pool[j]; pool[j] = tmp; } };
    let total = 0;
    for (let it = 0; it < EQ_ITERS; it++) {
      if (it && it % 40 === 0) { await new Promise(r => setTimeout(r, 0)); if (g !== gen) throw ABORT; }
      let ptr = 0;
      const need = 5 - keepMine.length;
      swapIn(ptr, need);
      const mine = keepMine.concat(pool.slice(ptr, ptr + need));
      ptr += need;
      const my = score(mine);
      let ties = 0, lost = false;
      for (const o of opps) {
        const want = pre ? -1 : o.drew;
        let h, disc;
        for (let tries = 0; ; tries++) {
          swapIn(ptr, 5);
          h = pool.slice(ptr, ptr + 5);
          disc = planDraw(h, null);
          if (want < 0 || disc.length === want || tries >= (want === 0 ? 150 : 40)) break;
          if (want === 0 && Math.random() < 0.06) { disc = []; break; } // a pat bluff
        }
        ptr += 5;
        if (want >= 0 && disc.length !== want) disc = [0, 1, 2, 3, 4].sort((a, b) => rankOf(h[a]) - rankOf(h[b])).slice(0, want);
        for (const i of disc) { if (ptr >= n) break; swapIn(ptr, 1); h[i] = pool[ptr]; ptr++; }
        const v = score(h);
        if (v > my) { lost = true; break; } else if (v === my) ties++;
      }
      if (!lost) total += 1 / (ties + 1);
    }
    return total / EQ_ITERS;
  }

  // ---------- table flow ----------
  function setupTable(size) {
    tableSize = size;
    const pool = shuffle(AI_POOL.slice());
    const styles = shuffle(['tag', 'lp', 'maniac', 'rock']);
    styles.push(styles[0]);
    seats = [{ you: true, name: t.you, avatar: '', style: '' }];
    for (let i = 1; i < size; i++) seats.push({ you: false, ...pool[i - 1], style: styles[(i - 1) % styles.length] });
    seats.forEach((s, i) => Object.assign(s, { i, stack: START, bet: 0, total: 0, cards: [], folded: false, allIn: false, out: false, acted: false, actedAt: 0, status: '', shown: false, won: 0, startStack: START, place: 0, thinking: false, drew: null, disc: new Set(), plan: null, bluff: false }));
    button = -1;
    handNo = 0;
    level = 0;
    hand = null;
    turnSeat = null;
    buildSeatEls();
    layout();
    render();
  }

  function abortFlow() {
    gen++;
    phase = 'lobby';
    turnSeat = null;
    if (resolveAction) { const r = resolveAction; resolveAction = null; r({ type: 'abort' }); }
    if (resolveDraw) { const r = resolveDraw; resolveDraw = null; r('abort'); }
    if (resolveNext) resolveNext('abort');
  }

  function startTable(size) {
    abortFlow();
    forced = lobbyForced;
    limit = lobbyLimit;
    store.set('seats', size);
    store.set('forced', forced);
    store.set('limit', limit);
    setupTable(size);
    stats.tTables++;
    save();
    phase = 'busy';
    runTable(gen);
  }

  async function runTable(g) {
    try {
      for (;;) {
        await playHand();
        const result = finishHand();
        render();
        if (result) {
          await wait(1400);
          phase = 'over';
          render();
          showOver(result);
          return;
        }
        await waitNext();
        if (g !== gen) return;
      }
    } catch (e) {
      if (e !== ABORT) throw e;
    }
  }

  // Waits ms of visible time (scaled by game speed); the table pauses while hidden or while you play video poker.
  const sleep = ms => new Promise(resolve => {
    const tick = () => (document.hidden || mode !== 'table' ? setTimeout(tick, 250) : setTimeout(resolve, ms));
    tick();
  });
  async function wait(ms) {
    const g = gen;
    await sleep(ms * mul());
    if (g !== gen) throw ABORT;
  }

  async function playHand() {
    handNo++;
    const lv = Math.min(LEVELS.length - 1, Math.floor((handNo - 1) / HANDS_PER_LEVEL));
    const levelUp = lv !== level;
    level = lv;
    const [sb, bb] = LEVELS[level];
    for (const s of seats) Object.assign(s, { bet: 0, total: 0, cards: [], folded: false, allIn: false, acted: false, actedAt: 0, status: '', shown: false, won: 0, startStack: s.stack, thinking: false, score: 0, drew: null, disc: new Set(), plan: null, bluff: false });
    const alive = s => !s.out;
    const live = seats.filter(alive);
    button = nextSeat(button < 0 ? Math.floor(Math.random() * seats.length) : button, alive);
    const heads = live.length === 2;
    const sbSeat = heads ? button : nextSeat(button, alive);
    const bbSeat = nextSeat(sbSeat, alive);
    hand = { pot: 0, pots: [], sb, bb, ante: bb / 4, currentBet: 0, minRaise: bb, street: 0, round: 0, sbSeat, bbSeat, hl: null, banner: null, deck: [], muck: [] };
    $('banner').hidden = true;
    tMsg(t.handN(handNo, forcedText()));
    if (levelUp) toast(t.stakesUp(forcedText()), 2200);

    const holes = dealPlan(live);
    if (forced === 'blinds') {
      post(seats[sbSeat], sb, 'sb');
      post(seats[bbSeat], bb, 'bb');
      hand.currentBet = bb;
    } else live.forEach(s => postAnte(s, hand.ante));
    render();
    await wait(MS.post);

    let idx = nextSeat(button, alive);
    for (let round = 0; round < 5; round++) {
      for (let k = 0; k < live.length; k++) {
        const s = seats[idx];
        const c = holes.get(s.i)[round];
        s.cards.push(c);
        fresh.add(c);
        render();
        await wait(MS.deal);
        idx = nextSeat(idx, alive);
      }
    }
    if (!me().out) { stats.tHands++; save(); }

    await bettingRound(forced === 'blinds' ? (heads ? button : nextSeat(bbSeat, alive)) : nextSeat(button, alive));
    tMsg('');
    if (contenders().length >= 2) {
      await endStreet();
      hand.round = 1;
      for (const s of seats) if (!s.folded && !s.allIn) s.status = '';
      render();
      await drawRound();
      hand.street = 1;
      hand.round = 2;
      hand.currentBet = 0;
      hand.minRaise = bb;
      for (const s of seats) {
        s.acted = false;
        s.actedAt = 0;
        if (!s.folded && !s.allIn) s.status = '';
      }
      render();
      if (seats.filter(canAct).length >= 2) { await bettingRound(nextSeat(button, canAct)); tMsg(''); }
    }
    await endStreet();
    hand.round = 3;
    await showdown();
  }

  // Shuffles a deck and decides the starting hands; the test hook can fix hands and the cards drawn in order.
  function dealPlan(live) {
    const holes = new Map();
    const used = new Set();
    let top = [];
    if (rig) {
      for (const [i, five] of Object.entries(rig.hands || {})) {
        const seat = seats[Number(i)];
        if (seat && !seat.out) { const cards = five.map(parseCard); holes.set(seat.i, cards); cards.forEach(c => used.add(c)); }
      }
      top = (rig.deck || []).map(parseCard);
      top.forEach(c => used.add(c));
      rig = null;
    }
    const rest = shuffle(DECK.filter(c => !used.has(c)));
    for (const s of live) if (!holes.has(s.i)) holes.set(s.i, rest.splice(0, 5));
    hand.deck = rest.concat(top.reverse());
    return holes;
  }

  function post(s, amount, tag) {
    const a = Math.min(amount, s.stack);
    s.stack -= a;
    s.bet += a;
    s.total += a;
    if (!s.stack) s.allIn = true;
    s.status = s.allIn ? 'allin' : tag;
    s.betFresh = true;
  }
  // Antes go straight into the pot and never count as a bet to call.
  function postAnte(s, amount) {
    const a = Math.min(amount, s.stack);
    s.stack -= a;
    s.total += a;
    hand.pot += a;
    if (!s.stack) s.allIn = true;
    s.status = s.allIn ? 'allin' : 'ante';
  }

  async function bettingRound(first) {
    let i = first;
    if (i < 0) return;
    for (;;) {
      const live = contenders();
      if (live.length <= 1) return;
      const actors = live.filter(s => !s.allIn);
      const pending = actors.filter(s => !s.acted || s.bet < hand.currentBet);
      if (!pending.length) return;
      if (actors.length === 1 && actors[0].bet >= hand.currentBet) return;
      const s = seats[i];
      if (canAct(s) && (!s.acted || s.bet < hand.currentBet)) {
        const action = s.you ? await askYou(s) : await askAI(s);
        applyAction(s, action);
        render();
        await wait(s.you ? 120 : 260);
      }
      i = (i + 1) % seats.length;
    }
  }

  const toCallOf = s => Math.min(hand.currentBet - s.bet, s.stack);
  const stackTo = s => s.bet + s.stack;
  const minRaiseTo = s => Math.min(hand.currentBet + hand.minRaise, stackTo(s));
  // No-limit: up to your whole stack. Pot-limit: up to the pot after you call.
  const maxTo = s => (limit === 'pl' ? Math.min(stackTo(s), Math.max(minRaiseTo(s), hand.currentBet + potTotal() + toCallOf(s))) : stackTo(s));
  // A player may raise unless only an incomplete all-in raise happened since they last acted.
  function canRaise(s) {
    if (s.stack <= hand.currentBet - s.bet) return false;
    if (s.acted && hand.currentBet - s.actedAt < hand.minRaise) return false;
    return seats.some(o => o !== s && canAct(o));
  }
  function roundTo(v, s) {
    const lo = minRaiseTo(s), hi = maxTo(s);
    const r = Math.round(v / UNIT) * UNIT;
    return clamp(r, lo, hi);
  }

  function applyAction(s, a) {
    const before = hand.currentBet;
    if (a.type === 'fold') {
      s.folded = true;
      s.status = 'fold';
      hand.muck.push(...s.cards);
    } else if (a.type === 'check' && s.bet >= hand.currentBet) {
      s.status = 'check';
    } else if (a.type === 'raise' && canRaise(s)) {
      const to = clamp(a.to, minRaiseTo(s), maxTo(s));
      pay(s, to - s.bet);
      const size = to - before;
      if (size >= hand.minRaise) hand.minRaise = size;
      hand.currentBet = Math.max(before, to);
      s.status = s.allIn ? 'allin' : before === 0 ? 'bet' : 'raise';
    } else {
      pay(s, toCallOf(s));
      s.status = s.allIn ? 'allin' : s.bet === 0 && hand.currentBet === 0 ? 'check' : 'call';
    }
    s.acted = true;
    s.actedAt = hand.currentBet;
    s.tagFresh = true;
    if (!s.you) announce(`${s.name}: ${t.st[s.status]}${s.bet && s.status !== 'fold' ? ` ${fmt(s.bet)}` : ''}`);
  }
  function pay(s, amount) {
    const a = Math.min(amount, s.stack);
    s.stack -= a;
    s.bet += a;
    s.total += a;
    if (a) s.betFresh = true;
    if (!s.stack) s.allIn = true;
  }

  async function askYou(s) {
    phase = 'you';
    turnSeat = s;
    armed = false;
    resetSlider();
    const due = toCallOf(s);
    const text = due ? t.toCall(fmt(due)) : t.yourTurn;
    tMsg(text);
    announce(text);
    render();
    const a = await new Promise(resolve => { resolveAction = resolve; });
    turnSeat = null;
    phase = 'busy';
    armed = false;
    if (a.type === 'abort') throw ABORT;
    return a;
  }

  async function askAI(s) {
    turnSeat = s;
    s.thinking = true;
    tMsg(t.thinking(s.name));
    render();
    const watching = me().folded || me().out || me().allIn;
    const think = (MS.think + Math.random() * MS.think * 0.7) * (watching ? 0.6 : 1);
    if (hand.street === 0 && !s.plan) s.plan = planDraw(s.cards, STYLE[s.style]);
    const [eq] = await Promise.all([aiOverride ? Promise.resolve(0) : equity(s), wait(think)]);
    s.thinking = false;
    turnSeat = null;
    return aiOverride ? forcedPolicy(s) : aiDecide(s, eq);
  }

  // Test-only fixed policies so automated checks can steer hands to showdown.
  function forcedPolicy(s) {
    const due = toCallOf(s);
    if (aiOverride === 'fold') return { type: due ? 'fold' : 'check' };
    if (aiOverride === 'allin' && canRaise(s)) return { type: 'raise', to: maxTo(s) };
    if (aiOverride === 'minraise' && canRaise(s)) return { type: 'raise', to: minRaiseTo(s) };
    return { type: due ? 'call' : 'check' };
  }

  function aiDecide(s, eq) {
    const P = STYLE[s.style];
    const due = toCallOf(s);
    const potAll = potTotal();
    const canR = canRaise(s);
    const rnd = Math.random();
    const bb = hand.bb;
    const call = () => ({ type: due ? 'call' : 'check' });
    const fold = () => ({ type: due ? 'fold' : 'check' });
    const raise = to => (canR ? { type: 'raise', to: roundTo(to, s) } : call());
    const opps = contenders().length - 1;
    // Chance to beat one opponent, so thresholds work the same with any number of opponents.
    const per = Math.pow(eq, 1 / Math.max(1, opps));
    const post = hand.street > 0;
    // A stand-pat bluff keeps the story going after the draw.
    if (post && s.bluff) {
      if (!due && rnd < 0.8) return raise(potAll * (0.6 + Math.random() * 0.3));
      if (due && due <= potAll * 0.7 && rnd < 0.35) return raise(hand.currentBet * 2.5 + potAll * 0.3);
    }
    if (!post && (s.stack + s.bet) / bb <= 10) {
      // Short stacks play push-or-fold before the draw.
      if (per >= P.value - 0.1) return raise(stackTo(s));
      return due <= bb / 2 ? call() : fold();
    }
    if (!due) {
      if (per > P.value && rnd < P.aggr) return raise(Math.max(bb * 2.5, potAll * (0.5 + Math.random() * 0.3)));
      if (rnd < P.bluff) return raise(potAll * (0.45 + Math.random() * 0.2));
      return call();
    }
    const odds = due / (potAll + due);
    const pressure = due / Math.max(1, potAll);
    if (per > P.value + 0.1 && rnd < P.aggr) return raise(hand.currentBet + (potAll + due) * (0.6 + Math.random() * 0.4));
    if (eq >= odds + P.margin + pressure * 0.08) return call();
    if (rnd < P.bluff * 0.25) return raise(hand.currentBet * 2.5);
    return fold();
  }

  function aiDraw(s) {
    if (aiDrawOverride === 'pat') return [];
    if (typeof aiDrawOverride === 'number') return [0, 1, 2, 3, 4].slice(0, aiDrawOverride);
    const P = STYLE[s.style];
    const plan = s.plan || planDraw(s.cards, P);
    if (category(score(s.cards)) === 0 && contenders().length <= 3 && Math.random() < P.patBluff) { s.bluff = true; return []; }
    return plan;
  }

  // Everyone still in (all-in players too) draws once, starting left of the button.
  async function drawRound() {
    const order = [];
    let j = button;
    for (let k = 0; k < seats.length; k++) {
      j = nextSeat(j, o => inHand(o) && !o.folded);
      if (j < 0 || order.includes(j)) break;
      order.push(j);
    }
    for (const i of order) {
      const s = seats[i];
      let disc;
      if (s.you) disc = await askDraw(s);
      else {
        turnSeat = s;
        s.thinking = true;
        tMsg(t.drawing(s.name));
        render();
        const watching = me().folded || me().out;
        await wait(MS.think * (0.6 + Math.random() * 0.5) * (watching ? 0.6 : 1));
        s.thinking = false;
        turnSeat = null;
        disc = aiDraw(s);
      }
      swapCards(s, disc);
      s.drew = disc.length;
      s.drewFresh = true;
      announce(`${s.you ? t.you : s.name}: ${t.drew(disc.length)}`);
      render();
      await wait(MS.draw);
    }
    tMsg('');
  }

  function drawCard() {
    if (!hand.deck.length) {
      // Out of cards: the muck is shuffled into a new stock (folded hands leave the table first).
      hand.deck = shuffle(hand.muck);
      hand.muck = [];
      for (const s of seats) if (s.folded) s.cards = [];
    }
    return hand.deck.pop();
  }
  function swapCards(s, disc) {
    const out = disc.map(i => s.cards[i]);
    for (const i of disc) { const c = drawCard(); s.cards[i] = c; fresh.add(c); }
    hand.muck.push(...out);
    s.disc = new Set();
  }

  function askDraw(s) {
    phase = 'draw';
    turnSeat = s;
    s.disc = new Set();
    tMsg(t.yourDraw);
    announce(t.yourDraw);
    render();
    return new Promise(resolve => { resolveDraw = resolve; }).then(v => {
      turnSeat = null;
      phase = 'busy';
      if (v === 'abort') throw ABORT;
      return v;
    });
  }
  function toggleDisc(i) {
    if (phase !== 'draw') return;
    const s = me();
    const d = new Set(s.disc);
    if (d.has(i)) d.delete(i); else d.add(i);
    if (!legalDraw(s.cards, d)) { toast(t.maxDraw, 1800); return; }
    s.disc = d;
    render();
  }
  function confirmDraw() {
    if (phase !== 'draw' || !resolveDraw) return;
    const r = resolveDraw;
    resolveDraw = null;
    r([...me().disc].sort((a, b) => a - b));
  }

  // Gives back the part of the top bet nobody matched, then sweeps the bets into the pot.
  async function endStreet() {
    const inh = seats.filter(s => s.bet > 0).sort((a, b) => b.bet - a.bet);
    if (inh.length) {
      const top = inh[0];
      const excess = top.bet - (inh[1] ? inh[1].bet : 0);
      if (excess > 0) {
        top.bet -= excess;
        top.total -= excess;
        top.stack += excess;
        if (top.stack > 0) top.allIn = false;
        if (contenders().length > 1) toast(t.uncalled(fmt(excess)), 1300);
      }
    }
    const moving = seats.filter(s => s.bet > 0);
    if (moving.length) {
      moving.forEach(s => flyChips(s.betNode, $('pot'), s.bet, 2));
      seats.forEach(s => { hand.pot += s.bet; s.bet = 0; });
      render();
      await wait(MS.collect);
    }
    hand.pots = buildPots(seats.map(s => ({ total: s.total, folded: s.folded || !inHand(s) })));
    render();
  }

  async function revealAll() {
    for (const s of contenders()) {
      if (!s.shown && !s.you) s.cards.forEach(c => flips.add(c));
      s.shown = true;
    }
    render();
    await wait(MS.reveal);
  }

  async function showdown() {
    const live = contenders();
    turnSeat = null;
    if (live.length === 1) {
      const w = live[0];
      const amount = hand.pot;
      award(w, amount);
      showBanner(w.you ? t.youWin(fmt(amount)) : t.wins(w.name, fmt(amount)), '');
      render();
      await wait(MS.pot * 0.7);
      return;
    }
    await revealAll();
    for (const s of live) s.score = score(s.cards);
    const pots = buildPots(seats.map(s => ({ total: s.total, folded: s.folded || !inHand(s) })));
    for (const pot of pots) {
      const eligible = pot.eligible.map(i => seats[i]);
      const top = Math.max(...eligible.map(s => s.score));
      const winners = eligible.filter(s => s.score === top);
      const pay = splitPot(pot.amount, winners.map(s => s.i), button, seats.length);
      hand.hl = new Set();
      for (const w of winners) makers(w.cards).forEach(c => hand.hl.add(c));
      hand.hlSeats = new Set(winners.map(s => s.i));
      for (const w of winners) award(w, pay.get(w.i));
      const name = handName(top);
      const head = winners.length > 1
        ? t.split(winners.map(s => (s.you ? t.you : s.name)).join(' & '), fmt(pot.amount))
        : winners[0].you ? t.youWin(fmt(pot.amount)) : t.wins(winners[0].name, fmt(pot.amount));
      const label = pots.length > 1 ? `${potLabel(pots.indexOf(pot), pots.length)} · ` : '';
      showBanner(label + head, name);
      render();
      await wait(MS.pot);
    }
  }

  const potLabel = (i, count) => (i ? `${t.side}${count > 2 ? ` ${i}` : ''}` : t.main);

  function award(w, amount) {
    hand.pot -= amount;
    w.stack += amount;
    w.won += amount;
    w.status = 'win';
    w.tagFresh = true;
    flyChips($('pot'), w.you ? $('myplate') : w.el.querySelector('.plate'), amount, 5);
    if (w.you) bump('tBankStat');
  }

  function showBanner(head, sub) {
    hand.banner = { head, sub };
    const el = $('banner');
    el.hidden = false;
    el.innerHTML = '';
    el.append(head);
    if (sub) { const small = document.createElement('small'); small.textContent = sub; el.append(small); }
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    tMsg(sub ? `${head} · ${sub}` : head, (hand.hlSeats && hand.hlSeats.has(0)) || me().won > 0 ? 'good' : '');
    announce(sub ? `${head}. ${sub}` : head);
  }

  // Records stats and removes busted players; returns the table result when the table is over.
  function finishHand() {
    const you = me();
    if (you.won > 0) stats.tWon++;
    const busted = seats.filter(s => !s.out && s.stack === 0).sort((a, b) => b.startStack - a.startStack);
    const aliveAfter = seats.filter(s => !s.out && s.stack > 0).length;
    const gone = [];
    busted.forEach((s, k) => {
      s.out = true;
      s.place = aliveAfter + 1 + k;
      if (!s.you) gone.push(t.out(s.name, s.place));
    });
    if (gone.length) toast(gone.join(' · '), 2600);
    turnSeat = null;
    if (you.out) { save(); return { win: false, place: you.place }; }
    if (aliveAfter === 1) { stats.tTablesWon++; save(); return { win: true }; }
    save();
    return null;
  }

  function waitNext() {
    phase = 'between';
    render();
    const total = Math.max(1, MS.next * mul());
    let left = total;
    return new Promise((resolve, reject) => {
      let timer = 0;
      resolveNext = v => {
        resolveNext = null;
        clearTimeout(timer);
        $('nextFill').style.setProperty('--f', 0);
        if (v === 'abort') reject(ABORT);
        else { phase = 'busy'; resolve(); }
      };
      const tick = () => {
        if (autoNext && !document.hidden && mode === 'table' && !document.querySelector('.overlay:not([hidden])')) left -= 100;
        $('nextFill').style.setProperty('--f', clamp(1 - left / total, 0, 1));
        if (left <= 0) resolveNext('go');
        else timer = setTimeout(tick, 100);
      };
      timer = setTimeout(tick, total < 100 ? total : 100);
    });
  }

  // ---------- your table controls ----------
  function sliderRange() { const s = me(); return { lo: minRaiseTo(s), hi: maxTo(s) }; }
  function resetSlider() { setSlider(sliderRange().lo); }
  function setSlider(v) {
    const sl = $('slider');
    const { lo, hi } = sliderRange();
    sl.min = lo;
    sl.max = hi;
    sl.value = clamp(v, lo, hi);
    paintSlider();
  }
  function paintSlider() {
    const sl = $('slider');
    const lo = Number(sl.min), hi = Number(sl.max);
    sl.style.setProperty('--p', `${hi > lo ? ((Number(sl.value) - lo) / (hi - lo)) * 100 : 100}%`);
  }
  function sliderTo() {
    const s = me();
    const v = Number($('slider').value);
    return v >= maxTo(s) ? maxTo(s) : roundTo(v, s);
  }
  function quick(kind) {
    if (phase !== 'you') return;
    const s = me();
    const due = toCallOf(s);
    const pot = potTotal() + due;
    const target = { min: minRaiseTo(s), half: hand.currentBet + pot * 0.5, three: hand.currentBet + pot * 0.75, pot: hand.currentBet + pot, all: maxTo(s) }[kind];
    setSlider(kind === 'all' ? target : roundTo(target, s));
    armed = true;
    renderControls();
  }
  function nudge(dir) {
    if (phase !== 'you' || !canRaise(me())) return;
    const cur = Number($('slider').value);
    setSlider(Math.round((cur + dir * hand.bb) / UNIT) * UNIT);
    armed = true;
    renderControls();
  }
  function act(kind) {
    if (phase !== 'you' || !resolveAction) return;
    const s = me();
    const due = toCallOf(s);
    let a;
    if (kind === 'fold') { if (!due) return; a = { type: 'fold' }; }
    else if (kind === 'call') a = { type: due ? 'call' : 'check' };
    else { if (!canRaise(s)) return; a = { type: 'raise', to: sliderTo() }; }
    const resolve = resolveAction;
    resolveAction = null;
    resolve(a);
  }

  // ---------- table rendering ----------
  function cardEl(c, down, still = false) {
    const el = document.createElement('div');
    const r = rankOf(c), s = suitOf(c);
    el.className = `card${s === 1 || s === 2 ? ' red' : ''}${down ? ' down' : ''}`;
    el.dataset.c = c;
    if (!still && fresh.has(c)) { el.classList.add('deal'); fresh.delete(c); }
    if (!still && !down && flips.has(c)) { el.classList.add('flip'); flips.delete(c); }
    const rank = sym(r);
    const suit = `${SUITS[s]}︎`;
    const face = r >= 11 && r <= 13;
    el.innerHTML = `<span class="ci"><b>${rank}</b><i>${suit}</i></span><span class="cs${face ? ' face' : ''}">${face ? rank : suit}</span>`;
    return el;
  }
  function syncCards(box, cards, down, label) {
    const sig = `${cards.join()}|${down}`;
    if (box.dataset.sig !== sig) {
      box.dataset.sig = sig;
      box.replaceChildren(...cards.map(c => cardEl(c, down)));
    }
    box.setAttribute('aria-label', cards.length ? `${label}: ${cards.map(c => (down ? t.hidden : cardText(c))).join(', ')}` : label);
    const hl = hand && hand.hl;
    for (const el of box.children) {
      const c = Number(el.dataset.c);
      el.classList.toggle('hl', !!hl && !down && hl.has(c));
      el.classList.toggle('dim', !!hl && !down && !hl.has(c));
    }
  }
  const chipClass = v => (v >= 5000 ? 'c5000' : v >= 1000 ? 'c1000' : v >= 500 ? 'c500' : v >= 100 ? 'c100' : 'c25');

  function buildSeatEls() {
    const box = $('seats');
    const bets = $('bets');
    box.replaceChildren();
    bets.replaceChildren();
    for (const s of seats) {
      const b = document.createElement('div');
      b.className = 'bet';
      b.hidden = true;
      b.innerHTML = '<span class="chip sm" aria-hidden="true"></span><b></b>';
      s.betNode = b;
      bets.append(b);
      if (s.you) continue;
      const el = document.createElement('div');
      el.className = 'seat';
      el.setAttribute('role', 'group');
      el.innerHTML = `<div class="mini"></div><div class="plate"><span class="av" aria-hidden="true">${s.avatar}</span><span class="who"><span class="nm">${s.name}</span><span class="sty"></span><b class="stk"></b></span><span class="tag"></span><span class="drew"></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>`;
      s.el = el;
      box.append(el);
    }
  }

  function render() {
    if (!seats.length) return;
    renderHud();
    renderCenter();

  function layout() {
    const W = felt.clientWidth, H = felt.clientHeight;
    if (!W || !H || !seats.length) return;
    // Wide (landscape) placement needs real width; small portrait frames keep the portrait ring even when short.
    const wide = W / H > 1.3 && W >= 440;
    const short = H < 380;
    felt.classList.toggle('wide', wide);
    felt.classList.toggle('short', short);
    const compact = W < 340 || H < 330;
    felt.classList.toggle('compact', compact);
    const sw = wide ? clamp(W * 0.12, short ? 92 : 100, 150) : clamp(W * 0.235, W < 320 ? 72 : 78, 112);
    const mw = clamp(sw * (wide ? 0.3 : 0.32), 20, 42);
    const plateH = wide && !short ? 44 : 36;
    const seatH = plateH + mw * 0.9 + 6;
    let cw = wide ? clamp(Math.min(H * 0.15, W * 0.075), short ? 34 : 44, 80) : clamp(Math.min(H * 0.115, W * 0.15), short ? 32 : 38, 66);
    cw = Math.min(cw, (W - 16) / 5.4);
    const handW = cw * 5.24;
    const meH = cw * 1.4 + 36;
    const top = seatH / 2 + mw * 0.25 + 2;
    const meTop = H - meH - 2;
    const rx = W / 2 - sw / 2 - 4;
    const ry = Math.max(30, (meTop + seatH * 0.15 - top) / 1.5);
    const cy = top + ry;
    const cx = W / 2;
    const seatsGeo = [], bets = [], dealer = [];
    let free = W;
    const angles = (wide ? ANGLES_WIDE : ANGLES_TALL)[seats.length] || ANGLES_WIDE[6];
    seats.forEach((s, i) => {
      if (s.you) {
        seatsGeo[i] = { x: cx, y: meTop + cw * 0.7 };
        bets[i] = { x: cx, y: meTop - 14 };
        dealer[i] = { x: Math.max(12, cx - handW / 2 - 14), y: meTop + cw * 0.5 };
        return;
      }
      const a = (angles[i - 1] * Math.PI) / 180;
      const x = clamp(cx + rx * Math.cos(a), sw / 2 + 3, W - sw / 2 - 3);
      const y = clamp(cy + ry * Math.sin(a), top, Math.min(H - seatH / 2, meTop - seatH / 2 + (wide ? seatH : 4)));
      seatsGeo[i] = { x, y };
      const side = Math.sign(cx - x);
      if (Math.abs(Math.cos(a)) >= 0.35) free = Math.min(free, 2 * (Math.abs(cx - x) - sw / 2) - 16);
      if (Math.abs(Math.cos(a)) < 0.35) {
        // Top of the table: bet below the seat, button to its left.
        bets[i] = { x, y: y + seatH / 2 + 16 };
        dealer[i] = { x: x - sw / 2 - 16, y: y + 8 };
      } else if (compact && Math.sin(a) < -0.2) {
        // Cramped tables: upper side seats bet below the seat instead of towards the middle.
        bets[i] = { x: x + side * sw * 0.22, y: y + seatH / 2 + 12 };
        dealer[i] = { x: x + side * (sw / 2 + 12), y: y + seatH * 0.3 };
      } else if (Math.sin(a) > 0.2) {
        // Lower side seats sit beside your hand: bet goes above the seat, towards the middle.
        bets[i] = { x: x + side * (sw / 2 - 4), y: y - seatH / 2 - 14 };
        dealer[i] = { x: x + side * (sw / 2 + 13), y: y + seatH * 0.2 };
      } else {
        bets[i] = { x: x + side * (sw / 2 + 36), y: y - 6 };
        dealer[i] = { x: x + side * (sw / 2 + 13), y: y + seatH * 0.36 };
      }
    });
    // Small tables can put two bet pills on top of each other; push overlapping pairs apart sideways.
    const PW = compact ? 52 : 60, PH = compact ? 19 : 22;
    for (let pass = 0; pass < 4; pass++) {
      for (let i = 0; i < bets.length; i++) for (let j = i + 1; j < bets.length; j++) {
        const a = bets[i], c = bets[j];
        if (!a || !c) continue;
        const ox = PW - Math.abs(a.x - c.x), oy = PH - Math.abs(a.y - c.y);
        if (ox <= 0 || oy <= 0) continue;
        const dir = a.x < c.x || (a.x === c.x && seatsGeo[i].x < seatsGeo[j].x) ? -1 : 1;
        a.x = clamp(a.x + (dir * ox) / 2, PW / 2, W - PW / 2);
        c.x = clamp(c.x - (dir * ox) / 2, PW / 2, W - PW / 2);
      }
    }
    const ovalX = wide ? sw * 0.35 : sw * 0.22;
    const oval = $('oval').style;
    oval.left = `${ovalX}px`;
    oval.width = `${W - ovalX * 2}px`;
    oval.top = `${top - 6}px`;
    oval.height = `${meTop + cw * 0.95 - top + 6}px`;
    $('center').style.top = `${cy - (wide ? 4 : 6)}px`;
    felt.style.setProperty('--sw', `${sw}px`);
    felt.style.setProperty('--mw', `${mw}px`);
    felt.style.setProperty('--cw', `${cw}px`);
    felt.style.setProperty('--smax', `${clamp(free, 120, 420)}px`);
    felt.style.setProperty('--bmax', `${clamp(free + 20, 200, 460)}px`);
    felt.style.setProperty('--pw', `${clamp(handW, 170, Math.min(W - 16, 340))}px`);
    geo = { seats: seatsGeo, bets, dealer, meTop };
    render();
  }

  function flyChips(fromEl, toEl, amount, count) {
    if (reduced || delayScale === 0 || mode !== 'table' || !fromEl || !toEl) return;
    const f = felt.getBoundingClientRect();
    const ra = fromEl.getBoundingClientRect(), rb = toEl.getBoundingClientRect();
    if (!ra.width && !ra.height) return;
    const a = { x: ra.left + ra.width / 2 - f.left, y: ra.top + ra.height / 2 - f.top };
    const b = { x: rb.left + rb.width / 2 - f.left, y: rb.top + rb.height / 2 - f.top };
    for (let k = 0; k < count; k++) {
      const chip = document.createElement('span');
      chip.className = `chip sm fly ${chipClass(amount)}`;
      chip.style.left = `${a.x}px`;
      chip.style.top = `${a.y}px`;
      felt.append(chip);
      const jitter = (k - count / 2) * 4;
      const anim = chip.animate(
        [{ transform: 'translate(0, 0)', opacity: 1 }, { transform: `translate(${b.x - a.x + jitter}px, ${b.y - a.y}px)`, opacity: 0.85 }],
        { duration: 480 * Math.max(0.5, mul()), delay: k * 60, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'both' },
      );
      anim.onfinish = () => chip.remove();
    }
  }

    save();
    fillStats();
    $('resetStats').focus({ preventScroll: true });
  });

  function videoKey(e, key, onButton) {
    const st = V.state;
    if (/^[1-5]$/.test(key)) {
      const i = Number(key) - 1;
      if (st === 'hold') { e.preventDefault(); vHold(i); }
      else if (st === 'dblPick' && i > 0) { e.preventDefault(); vPick(i); }
    } else if ((key === 'enter' || key === ' ') && !onButton) {
      e.preventDefault();
      if (st === 'bet') vDeal(); else if (st === 'hold') vDraw(); else if (st === 'dblOffer') vCollect();
    } else if (key === 'b' && (st === 'bet' || st === 'dblOffer')) { e.preventDefault(); betOne(); }
    else if (key === 'm' && (st === 'bet' || st === 'dblOffer')) { e.preventDefault(); vDeal(true); }
    else if (key === 'v' && (st === 'bet' || st === 'dblOffer')) { e.preventDefault(); setValue(VALUES[(VALUES.indexOf(V.value) + 1) % VALUES.length]); }
    else if (key === 'h' && st === 'hold') { e.preventDefault(); vHint(); }
    else if (key === 'd' && st === 'dblOffer') { e.preventDefault(); vDouble(); }
    else if (key === 'c' && st === 'dblOffer') { e.preventDefault(); vCollect(); }
  }
  function tableKey(e, key, onButton) {
    const onSlider = e.target === $('slider');
    if (phase === 'you') {
      if (key === 'f') { e.preventDefault(); act('fold'); }
      else if (key === 'c') { e.preventDefault(); act('call'); }
      else if (key === 'r') {
        e.preventDefault();
        if (armed) act('raise');
        else if (canRaise(me())) { armed = true; renderControls(); }
      } else if (['arrowup', 'arrowright', 'arrowdown', 'arrowleft'].includes(key) && !onSlider) {
        e.preventDefault();
        nudge(key === 'arrowup' || key === 'arrowright' ? 1 : -1);
      } else if (key === 'enter' && !onButton && armed) { e.preventDefault(); act('raise'); }
    } else if (phase === 'draw') {
      if (/^[1-5]$/.test(key)) { e.preventDefault(); toggleDisc(Number(key) - 1); }
      else if ((key === 'enter' && !onButton) || key === 'd') { e.preventDefault(); confirmDraw(); }
    } else if (phase === 'between' && key === 'enter' && !onButton) {
      e.preventDefault();
      if (resolveNext) resolveNext('go');
    }
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector('.overlay:not([hidden])')) return;
    const onButton = e.target instanceof HTMLButtonElement;
    const key = e.key.toLowerCase();
    if (mode === 'video') videoKey(e, key, onButton); else tableKey(e, key, onButton);
  });

  new ResizeObserver(layout).observe(felt);
  new ResizeObserver(fitPaytable).observe($('machine'));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && showOverLater && mode === 'table') { showOverLater = false; openPanel('overPanel'); }
  });
  $('modes').addEventListener('click', () => {
    if (mode === 'table' && showOverLater) { showOverLater = false; openPanel('overPanel'); }
  });

  buildVideo();
  app.dataset.mode = mode;
  document.querySelectorAll('#modes [data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  setupTable(tableSize);
  renderVideo();
  vMsg(t.vReady);
  $('picks').querySelectorAll('[data-pick]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.pick === mode)));
  openPanel('startPanel');
  fitPaytable();

  // Test hook: lets automated checks rig the cards, steer the computer players and speed up timers; harmless for players.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__dp = {
    get mode() { return mode; }, get phase() { return phase; }, get seats() { return seats; }, get hand() { return hand; }, get button() { return button; },
    get handNo() { return handNo; }, get level() { return level; }, get stats() { return stats; }, get V() { return V; }, get settings() { return settings; },
    score, handName, shortName, payRow, payout, holdHint, planDraw, legalDraw, buildPots, splitPot, parseCard, cardText, makers,
    equityFor: i => equity(seats[i]),
    rigVideo(spec) { V.rig = spec; }, rigDouble(cards) { V.dblRig = cards; }, rig(spec) { rig = spec; },
    ai(policy) { aiOverride = policy; }, aiDraw(policy) { aiDrawOverride = policy; }, speed(x) { delayScale = x; }, hold(v) { autoNext = !v; },
    next() { if (resolveNext) resolveNext('go'); }, act, quick, toggleDisc, confirmDraw, setMode, setLimit(v) { limit = lobbyLimit = v; }, setForced(v) { forced = lobbyForced = v; },
    start: startTable, deal: vDeal, draw: vDraw, collect: vCollect, double: vDouble, pick: vPick,
    setBank(n) { V.bank = n; vSave(); renderVideo(); },
  };
})();
</script>
</body>
</html>
