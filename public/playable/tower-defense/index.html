<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tower Defense</title>
<style>
:root {
  --bg: #173328;
  --bg2: #0e2219;
  --panel: #21463a;
  --panel-hi: #2c5a49;
  --line: #3b6d58;
  --text: #fbf6e6;
  --muted: #a9c6b5;
  --accent: #ffbe3b;
  --accent-dark: #c98512;
  --ink: #23392f;
  --ink-muted: #6c7f72;
  --cream: #fffaee;
  --cream-2: #f3ead2;
  --cream-3: #ddd0ad;
  --red: #ff6a55;
  --heart: #ff5b6e;
  --sky: #7fd0ff;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --side: 260px;
  --tray: 116px;
  --top: 40px;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(ellipse at 50% 0%, #24503f 0%, var(--bg) 55%, var(--bg2) 100%); background-color: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.coin { display: inline-block; flex: none; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff1b0, #ffc53d 55%, #e39c00); box-shadow: inset 0 0 0 1.5px #c88400; vertical-align: -2px; }

/* ---------- Game layout ---------- */
.app { position: fixed; inset: 0; display: grid; gap: 8px; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.app[data-layout="tall"] { grid-template: "top" var(--top) "stage" minmax(0, 1fr) "side" var(--tray) / minmax(0, 1fr); }
.app[data-layout="wide"] { grid-template: "stage top" var(--top) "stage side" minmax(0, 1fr) / minmax(0, 1fr) var(--side); }

.top { grid-area: top; display: flex; align-items: stretch; gap: 6px; min-width: 0; }
.icon-btn { flex: none; width: 40px; min-height: 36px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line), 0 3px 0 #0b1d15; display: grid; place-items: center; font-weight: 900; font-size: 15px; }
.icon-btn svg { width: 15px; height: 15px; fill: currentColor; }
.icon-btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 1px var(--line); }
.chip { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-weight: 900; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; flex: none; }
.chip .coin { width: 16px; height: 16px; }
.chip.bump { animation: bump .45s ease-out; }
@keyframes bump { 30% { transform: scale(1.1); background: #8a2f27; } }
.app[data-layout="wide"] .pause-tall { display: none; }
.app[data-layout="tall"] .pause-wide { display: none; }

.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.toast { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: max-content; max-width: min(calc(100% - 16px), 420px); padding: 7px 14px; border-radius: 14px; background: #0f261ced; color: var(--text); font-size: 14px; font-weight: 800; line-height: 1.35; text-align: center; pointer-events: none; opacity: 0; box-shadow: 0 6px 18px #0007; }
.toast small { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.toast.show { animation: toast var(--dur, 2.4s) ease-out both; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 6px); } 8%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.banner b { padding: 6px 20px; border-radius: 18px; background: #0f261caa; color: #fff; font-size: clamp(22px, 5.5vmin, 40px); font-weight: 900; letter-spacing: -.01em; text-shadow: 0 3px 0 #0006; opacity: 0; }
.banner.boss b { color: #ffd2d2; background: #5a1420bb; }
.banner.show b { animation: banner 1.7s ease-out both; }
@keyframes banner { 0% { opacity: 0; transform: scale(.85); } 12%, 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.04); } }

.side { grid-area: side; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.build { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.tw { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; align-items: center; gap: 1px; padding: 4px 2px 5px; border-radius: 14px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line), 0 3px 0 #0b1d15; }
.tw img { width: 34px; height: 34px; max-height: 100%; object-fit: contain; display: block; }
.tw .nm { display: none; }
.tw .desc { display: none; }
.tw .cost { display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
.tw.armed { background: var(--panel-hi); box-shadow: inset 0 0 0 2px var(--accent), 0 3px 0 #0b1d15; }
.tw.poor { opacity: .55; }
.tw.poor .cost { color: #ff9b8d; }
.tw:active { transform: translateY(2px); box-shadow: inset 0 0 0 1px var(--line); }
.tw kbd { position: absolute; top: 3px; left: 5px; font: inherit; font-size: 10px; font-weight: 800; color: var(--muted); opacity: .8; }

.info { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.info[hidden] { display: none; }
.side.has-info .build { display: none; }
.app[data-layout="tall"] .side.has-info .wavebox { display: none; }
.info-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.info-head img { width: 34px; height: 34px; flex: none; }
.info-title { flex: 1; min-width: 0; line-height: 1.2; }
.info-title b { font-size: 15px; font-weight: 900; }
.lvl { margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: var(--accent); color: #3a2400; font-size: 11px; font-weight: 900; vertical-align: 1px; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 9px; margin-top: 2px; font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.stats svg { width: 12px; height: 12px; fill: currentColor; flex: none; }
.stats em { font-style: normal; color: #9df0b5; }
.x { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; }
.x svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.info-desc { display: none; font-size: 13px; line-height: 1.35; color: var(--muted); white-space: pre-line; }
.seg { display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: var(--bg2); }
.seg[hidden] { display: none; }
.seg button { flex: 1; min-width: 0; min-height: 28px; padding: 3px 2px; border-radius: 9px; font-size: 12.5px; font-weight: 800; color: var(--muted); overflow-wrap: anywhere; line-height: 1.1; }
.seg button[aria-checked="true"] { background: var(--sky); color: #0d2a3c; }
.area { min-height: 34px; display: grid; place-items: center; padding: 3px 6px; border-radius: 12px; background: var(--bg2); font-size: 12.5px; font-weight: 800; color: var(--sky); text-align: center; line-height: 1.2; }
.area[hidden] { display: none; }
.info-actions { display: flex; gap: 6px; }
.act { flex: 1 1 0; min-width: 0; min-height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 8px; border-radius: 12px; font-size: 14px; font-weight: 900; line-height: 1.1; }
.act .price { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.act.up { background: #4cc77a; color: #0d2e1a; box-shadow: 0 3px 0 #2b8a4e; }
.act.up:disabled { background: #3a5a4c; color: #9fb8aa; box-shadow: 0 3px 0 #22382e; }
.act.up.poor { background: #4f6e60; color: #d9e6de; box-shadow: 0 3px 0 #2b4238; }
.act.sell { background: #e9dfc3; color: #4c3a10; box-shadow: 0 3px 0 #b6a67c; }
.act.sell.sure { background: var(--red); color: #fff; box-shadow: 0 3px 0 #b33a2a; }
.act:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }

.wavebox { flex: none; display: flex; gap: 6px; height: 40px; min-width: 0; }
.preview { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.preview > small { flex: none; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.preview .final { font-size: 13px; font-weight: 900; color: var(--accent); white-space: nowrap; }
.pv { position: relative; flex: none; display: flex; align-items: center; gap: 1px; font-size: 12.5px; font-weight: 900; font-variant-numeric: tabular-nums; border-radius: 8px; padding: 1px 2px; }
.pv img { width: 24px; height: 24px; display: block; }
.pv.new::after { content: "!"; position: absolute; top: -2px; left: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); color: #fff; font-size: 9px; line-height: 12px; text-align: center; }
.wave-actions { display: flex; gap: 6px; min-width: 0; }
.next { position: relative; overflow: hidden; flex: 1 0 auto; min-width: 98px; padding: 2px 12px; border-radius: 12px; background: var(--accent); color: #3a2400; font-weight: 900; box-shadow: 0 3px 0 var(--accent-dark); display: grid; align-content: center; line-height: 1.1; isolation: isolate; }
.next::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #ffffff55; transform-origin: left; transform: scaleX(var(--p, 0)); }
.next b { font-size: 15px; white-space: nowrap; }
.next small { display: inline-flex; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.next small:empty { display: none; }
.next:disabled { background: #3a5a4c; color: #a9c6b5; box-shadow: 0 3px 0 #22382e; }
.next.pulse:not(:disabled) { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 3px 0 var(--accent-dark), 0 0 0 5px #ffbe3b44; } }
.next:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }

.app[data-layout="tall"] .info { gap: 5px; }
.app[data-layout="tall"] .seg button { min-height: 26px; }
.app[data-layout="tall"] .act { min-height: 34px; }
.app[data-layout="tall"] .area { min-height: 32px; }
.app[data-layout="wide"] .wavebox { height: auto; flex-direction: column; }
.app[data-layout="wide"] .preview { min-height: 40px; flex-wrap: wrap; padding: 5px 8px; row-gap: 3px; }
.app[data-layout="wide"] .wave-actions { height: 44px; }
.app[data-layout="wide"] .next { flex: 1 1 auto; }
.app[data-layout="wide"] .build { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
.app[data-layout="wide"] .tw .nm { display: block; max-width: 100%; font-size: 12px; font-weight: 800; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app[data-layout="wide"] .tw { grid-template-rows: minmax(0, 1fr) auto auto; }
.app[data-layout="wide"] .info { padding: 8px; border-radius: 14px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); overflow-y: auto; }
.app[data-layout="wide"] .info-actions { margin-top: auto; }
.app.narrow-side .seg:not([hidden]) { display: grid; grid-template-columns: 1fr 1fr; }
.app.narrow-side .seg button { overflow-wrap: normal; }
.app.narrow-side .act { flex-direction: column; gap: 0; padding: 3px 4px; font-size: 13px; }
.app.narrow-side .wave-actions .icon-btn { width: 34px; }
.app.narrow-side .next { padding: 2px 6px; min-width: 0; }
.app.narrow-side .next b { font-size: 14px; white-space: normal; }
@media (max-height: 400px) { .app.narrow-side .side.has-info .preview, .app.narrow-side .info-head img { display: none; } }
@media (min-width: 480px) {
  .app[data-layout="tall"] .tw .nm { display: block; max-width: 100%; font-size: 12px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app[data-layout="tall"] .tw { grid-template-rows: minmax(0, 1fr) auto auto; }
}
@media (min-height: 540px) {
  .app[data-layout="wide"] .build { grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 76px); align-content: start; overflow-y: auto; }
  .app[data-layout="wide"] .tw { grid-template: "img nm cost" auto "img desc desc" auto / 46px minmax(0, 1fr) auto; justify-items: start; column-gap: 8px; padding: 6px 10px; text-align: left; }
  .app[data-layout="wide"] .tw img { grid-area: img; width: 44px; height: 44px; }
  .app[data-layout="wide"] .tw .nm { grid-area: nm; font-size: 15px; font-weight: 900; }
  .app[data-layout="wide"] .tw .cost { grid-area: cost; font-size: 14px; }
  .app[data-layout="wide"] .tw .desc { grid-area: desc; display: block; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.25; }
  .app[data-layout="wide"] .info-desc { display: block; }
  .app[data-layout="wide"] .info-head img { width: 44px; height: 44px; }
  .app[data-layout="wide"] .info-title b { font-size: 17px; }
  .app[data-layout="wide"] .stats { font-size: 13px; gap: 3px 10px; }
  .app[data-layout="wide"] .seg button { min-height: 34px; font-size: 13px; }
  .app[data-layout="wide"] .act { min-height: 44px; font-size: 15px; }
  .app[data-layout="wide"] .pv img { width: 28px; height: 28px; }
}
@media (max-height: 380px) {
  .app { gap: 6px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .app[data-layout="wide"] .tw img { width: 28px; height: 28px; }
  .app[data-layout="wide"] .wave-actions { height: 38px; }
  .app[data-layout="wide"] .preview { min-height: 34px; padding: 3px 8px; }
  .chip { font-size: 15px; }
}

/* ---------- Panels ---------- */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #08170f6b; overflow: hidden; }
.overlay[hidden] { display: none; }
.panel { position: relative; width: min(100%, 390px); max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior: contain; padding: 20px 18px 18px; border-radius: 26px; background: var(--cream); color: var(--ink); text-align: center; box-shadow: 0 0 0 4px #ffffff40, 0 24px 60px #04100a88; animation: rise .3s ease-out; }
.panel.wide { width: min(100%, 600px); }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.logo { display: block; width: 132px; height: 76px; margin: 0 auto 2px; }
.panel h1 { font-size: clamp(30px, 9.5vw, 42px); font-weight: 900; letter-spacing: -.04em; line-height: 1.05; }
.panel h1 span { color: #d98a0b; }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
.panel p { margin-top: 8px; font-size: 14px; line-height: 1.45; color: var(--ink-muted); }
.panel .small { font-size: 12px; }
.panel h3 { margin: 14px 0 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.play { width: 100%; margin-top: 16px; padding: 12px 10px 11px; border-radius: 18px; background: var(--accent); color: #3a2400; box-shadow: 0 5px 0 var(--accent-dark); display: grid; gap: 1px; }
.play b { font-size: 22px; font-weight: 900; }
.play small { font-size: 13px; font-weight: 800; opacity: .85; }
.mode { width: 100%; margin-top: 10px; padding: 10px; border-radius: 16px; background: var(--cream-2); box-shadow: 0 4px 0 var(--cream-3); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 900; font-size: 16px; }
.mode small { font-size: 13px; font-weight: 800; color: #b07408; }
.pseg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--cream-2); }
.pseg button { flex: 1; min-width: 0; min-height: 36px; padding: 6px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--ink-muted); overflow-wrap: anywhere; }
.pseg button[aria-checked="true"] { background: #2f6b52; color: #fff; box-shadow: 0 2px 6px #2f6b5255; }
.help { margin-top: 12px !important; }
.keys { margin-top: 6px !important; font-size: 11.5px !important; }
.play:active, .mode:active, .btn:active, .mapc:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }

.maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 9px; margin-top: 12px; }
.mapc { position: relative; min-width: 0; display: grid; gap: 3px; padding: 5px 5px 6px; border-radius: 14px; background: var(--cream-2); box-shadow: 0 3px 0 var(--cream-3); text-align: center; }
.mapc img { display: block; width: 100%; aspect-ratio: 14 / 9; border-radius: 9px; }
.mapc b { min-height: 2.3em; display: grid; place-items: center; font-size: 12px; font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; }
.mapc .ms { font-size: 13px; letter-spacing: 1px; color: #cdbf98; white-space: nowrap; line-height: 1; }
.mapc .ms i { font-style: normal; color: #e09a10; }
.mapc .crown { position: absolute; top: 2px; right: 4px; font-size: 15px; }
.mapc.current { box-shadow: 0 0 0 3px #e09a10, 0 3px 0 var(--cream-3); }
.mapc:disabled img { filter: grayscale(1) opacity(.45); }
.mapc:disabled b { color: #a99f86; }
.mapc .lock { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); font-size: 20px; }

.emblem { font-size: 46px; line-height: 1.1; }
.stars { margin-top: 4px; font-size: 40px; letter-spacing: 6px; line-height: 1.1; color: #dcd2b8; }
.stars[hidden] { display: none; }
.stars .on { color: #f2a90e; text-shadow: 0 2px 0 #b07408; }
.badge { display: inline-block; margin: 8px 4px 0 !important; padding: 5px 14px; border-radius: 99px; background: var(--accent); color: #3a2400 !important; font-weight: 800; font-size: 13px !important; }
.badge[hidden] { display: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { flex: 1 1 110px; min-height: 44px; padding: 11px 10px; border-radius: 14px; background: #2f6b52; color: #fff; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #1d4736; }
.btn.alt { background: var(--accent); color: #3a2400; box-shadow: 0 4px 0 var(--accent-dark); }
.btn.ghost { background: var(--cream-2); color: var(--ink); box-shadow: 0 4px 0 var(--cream-3); }
.btn[hidden] { display: none; }

@media (max-height: 640px) { .logo { display: none; } }
@media (max-height: 540px) and (max-aspect-ratio: 4/3) { .keys { display: none; } }
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .panel { width: min(100%, 560px); }
  .panel.wide { width: min(100%, 720px); }
  .maps { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; }
  .menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
  .menu-row .mode { margin-top: 0; min-height: 44px; }
}
@media (max-height: 420px) {
  .panel { padding: 12px 14px; border-radius: 20px; }
  .panel h1 { font-size: 26px; }
  .panel h2 { font-size: 21px; }
  .panel p { margin-top: 4px; font-size: 13px; }
  .panel h3 { margin: 6px 0 4px; }
  .play { margin-top: 8px; padding: 7px 10px 6px; }
  .play b { font-size: 18px; }
  .mode { padding: 7px; font-size: 15px; }
  .help, .keys { display: none; }
  .emblem { font-size: 30px; }
  .stars { font-size: 28px; margin-top: 0; }
  .actions { margin-top: 10px; }
  .btn { min-height: 38px; padding: 8px 10px; font-size: 15px; }
  .maps { margin-top: 8px; }
  .mapc { padding: 4px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .toast.show, .banner.show b { opacity: 1; } }
</style>
</head>
<body>
<main class="app" id="app" data-layout="tall">

          const q = (o.x - cur.x) ** 2 + (o.y - cur.y) ** 2;
          if (q < nd) { nd = q; nx = o; }
        }
        if (!nx) break;
        hit.push(nx); pts.push([nx.x, nx.y]);
        hurt(nx, d, tw, true, 0);
        cur = nx;
      }
      G.fx.push({ k: 'zap', pts, t: 0, T: .22, seed: G.rnd() * 100 });
    }
  }

  function updateProjectiles(dt) {
    for (const p of G.proj) {
      if (p.k === 'shell') {
        p.t += dt;
        if (p.t >= p.T) {
          p.dead = true;
          for (const e of G.enemies) {
            if (!e.alive || e.def.air) continue;
            const d = Math.hypot(e.x - p.tx, e.y - p.ty);
            if (d <= p.splash + e.def.r * .5) hurt(e, p.dmg * (1 - .45 * Math.min(1, d / p.splash)), p.tw, false, 0);
          }
          G.fx.push({ k: 'boom', x: p.tx, y: p.ty, r: p.splash, t: 0, T: .4 });
          burst(p.tx, p.ty, ['#ffb347', '#ff7a2e', '#ffe08a'], reduced ? 3 : 8, 2.4);
        }

      if (p.e.alive) { p.tx = p.e.x; p.ty = p.e.y; }
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), mv = p.spd * dt;
      p.ang = Math.atan2(dy, dx);

      if (!v) return;
      // Arrow keys follow the screen, which is transposed in portrait.
      const [dx, dy] = view.tall ? [v[1], v[0]] : v;
      if (kbMode) { cursor.x = clamp(cursor.x + dx, 0, COLS - 1); cursor.y = clamp(cursor.y + dy, 0, ROWS - 1); }
      kbMode = true;
      if (document.activeElement !== canvas) canvas.focus({ preventScroll: true });
      e.preventDefault(); return;
    }
    if ((k === 'Enter' || k === ' ') && !onBtn) { kbMode = true; tapCell({ x: cursor.x, y: cursor.y, inside: true }, 'key'); e.preventDefault(); return; }
    if (/^[1-5]$/.test(k)) {
      const type = TYPES[+k - 1];
      if (kbMode && canBuild(cursor.x, cursor.y)) ui.tile = { x: cursor.x, y: cursor.y };
      pressTower(type, 'key'); e.preventDefault(); return;
    }
    const lk = k.toLowerCase();
    if (lk === 'u' && ui.sel) { upgrade(ui.sel); e.preventDefault(); }
    else if ((k === 'Delete' || k === 'Backspace') && ui.sel) { trySell(); e.preventDefault(); }
    else if (lk === 't' && ui.sel && TOWERS[ui.sel.type].mode >= 0) { setMode(ui.sel, (ui.sel.mode + 1) % 4); announce(`${t.targetLabel}: ${t.targets[ui.sel.mode]}`); e.preventDefault(); }
    else if (lk === 'n') { callWave(); e.preventDefault(); }
    else if (lk === 'f') { toggleSpeed(); e.preventDefault(); }
    else if (lk === 'p') { pause(); e.preventDefault(); }
  });

  function toggleSpeed() {
    if (!G) return;
    G.speed = G.speed === 1 ? 2 : 1;
    $('speed').textContent = `${G.speed}×`;
    $('speed').setAttribute('aria-pressed', String(G.speed === 2));
  }

  $('next').addEventListener('click', callWave);
  $('speed').addEventListener('click', toggleSpeed);
  for (const b of document.querySelectorAll('[data-pause]')) b.addEventListener('click', pause);
  $('info-close').addEventListener('click', () => { clearSel(); canvas.focus({ preventScroll: true }); });
  $('upgrade').addEventListener('click', () => upgrade(ui.sel));
  $('upgrade').addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') upHover = true; });
  $('upgrade').addEventListener('pointerleave', () => { upHover = false; });
  $('upgrade').addEventListener('focus', () => { upHover = true; });
  $('upgrade').addEventListener('blur', () => { upHover = false; });
  $('sell').addEventListener('click', trySell);
  $('play').addEventListener('click', () => startGame(frontier()));
  $('go-maps').addEventListener('click', showMaps);
  $('maps-back').addEventListener('click', showMenu);
  $('resume').addEventListener('click', resume);
  $('restart').addEventListener('click', () => startGame(G.mi));
  $('quit').addEventListener('click', showMenu);
  $('result-retry').addEventListener('click', () => startGame(G.mi));
  $('result-next').addEventListener('click', () => startGame(Math.min(MAPS.length - 1, G.mi + 1)));
  $('result-menu').addEventListener('click', showMenu);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', () => { down = null; });
  new ResizeObserver(() => fitCanvas()).observe(stage);
  window.addEventListener('resize', layout);

  // Read-only snapshot and a fast-forward for automated checks.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__towerDefense = {
    state: () => G && {
      map: G.mi, diff: G.diff, active: G.active, wave: G.wave, waves: G.waves.length, spawning: G.spawning, timer: +G.timer.toFixed(2),
      gold: G.gold, lives: G.lives, livesMax: G.livesMax, over: G.over, win: G.win, paused: G.paused, speed: G.speed, kills: G.kills, time: +G.time.toFixed(2),
      enemies: G.enemies.map(e => ({ type: e.type, hp: Math.round(e.hp), max: Math.round(e.max), x: +e.x.toFixed(2), y: +e.y.toFixed(2), air: !!e.def.air, slow: e.slowF < 1, left: +(e.route.len - e.d).toFixed(2) })),
      towers: G.towers.map(tw => ({ type: tw.type, lvl: tw.lvl, x: tw.x, y: tw.y, mode: tw.mode, kills: tw.kills, spent: tw.spent })),
      grid: Array.from(G.map.grid), routes: G.map.routes.map(r => r.pts), counts: G.waves.map(w => w.counts),
      result: G.result, layout: app.dataset.layout, overlay: current, sel: ui.sel ? G.towers.indexOf(ui.sel) : -1, tile: ui.tile, arm: ui.arm, stars: stars.slice(),
    },
    cell: (x, y) => { const r = canvas.getBoundingClientRect(); return { x: r.left + SX(x + .5, y + .5), y: r.top + SY(x + .5, y + .5) }; },
    sim: sec => { for (let i = 0, n = Math.round(sec / STEP); i < n && G && G.active && !G.over && !G.paused; i++) step(STEP); if (G) refreshHud(true); },
  };

  setupBuild();
  setupSeg();
  setupDiff();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
