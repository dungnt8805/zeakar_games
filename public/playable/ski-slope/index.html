<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ski Slope</title>
<style>
:root {
  --bg: #cfe6f5;
  --ink: #17324d;
  --muted: #5b7690;
  --coral: #ff6f59;
  --coral-dark: #d24a36;
  --ice: #3fa7d6;
  --paper: #fbfdff;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

.app { position: relative; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
canvas:focus-visible { outline: none; }

.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); pointer-events: none; }
.app.menu .hud, .app.menu .pad { visibility: hidden; }
.chip { min-width: 58px; padding: 4px 10px; border-radius: 12px; background: #ffffffd9; box-shadow: 0 2px 0 #9cc3dc; text-align: center; }
.chip small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.chip strong { display: block; font-size: 17px; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.warn strong { color: var(--coral-dark); }
.chip[hidden] { display: none; }
.hud .grow { flex: 1; }
.iconbtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 12px; background: #ffffffd9; box-shadow: 0 2px 0 #9cc3dc; font-size: 18px; font-weight: 900; display: grid; place-items: center; }

.toast { position: absolute; left: 50%; bottom: max(96px, 24%); transform: translateX(-50%); padding: 6px 14px; border-radius: 99px; background: var(--ink); color: #fff; font-weight: 900; font-size: 16px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

.pad { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end; padding: 0 max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); pointer-events: none; }
.touch .pad { display: flex; }
.pad .grp { display: flex; gap: 10px; }
.pad button { pointer-events: auto; touch-action: none; width: 64px; height: 64px; border-radius: 50%; background: #ffffffb0; box-shadow: 0 3px 0 #8fb8d3; font-size: 24px; font-weight: 900; color: var(--ink); }
.pad button.on { background: var(--ink); color: #fff; }
.pad .mid { width: 72px; border-radius: 22px; font-size: 13px; }
@media (max-height: 420px) { .pad button { width: 52px; height: 52px; font-size: 20px; } .pad .mid { width: 62px; font-size: 11px; } }

.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8px; background: #17324d26; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 380px); max-height: calc(100% - 8px); overflow-y: auto; padding: 18px 16px; border-radius: 22px; background: var(--paper); box-shadow: 0 7px 0 #a9c9de, 0 20px 50px #0005; text-align: center; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.title { font-size: clamp(34px, 11vw, 54px); font-weight: 900; letter-spacing: -.02em; line-height: 1; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
.title span { color: var(--coral); }
.tagline { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--muted); }
.modes { display: grid; gap: 8px; margin-top: 14px; }
.mode { display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: #e8f3fb; box-shadow: 0 3px 0 #b6d4e8; text-align: left; }
.mode .ic { font-size: 28px; text-align: center; }
.mode b { display: block; font-size: 18px; font-weight: 900; }
.mode span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.3; }
.mode.primary { background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-dark); }
.mode.primary span { color: #fff; opacity: .9; }
.mode:active { transform: translateY(2px); }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.4; }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.01em; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
.cbtn { aspect-ratio: 1; min-height: 44px; border-radius: 14px; background: #e8f3fb; box-shadow: 0 3px 0 #b6d4e8; font-size: 18px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.cbtn i { font-style: normal; font-size: 13px; margin-top: 3px; min-height: 13px; }
.cbtn:disabled { opacity: .45; cursor: default; }
.cbtn.cur { box-shadow: 0 0 0 3px var(--coral), 0 3px 0 #b6d4e8; }
.info { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--muted); min-height: 1.4em; }
.row { display: flex; gap: 8px; margin-top: 14px; }
.btn { flex: 1; padding: 12px; border-radius: 14px; background: #e8f3fb; box-shadow: 0 3px 0 #b6d4e8; font-size: 16px; font-weight: 900; }
.btn.primary { background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-dark); }
.btn:active { transform: translateY(2px); }
.btn[hidden] { display: none; }
.medal { font-size: 46px; line-height: 1.1; margin-top: 6px; }
.medal:empty { display: none; }
.sub { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); line-height: 1.35; }
.sub:empty { display: none; }
.scores { display: flex; justify-content: center; gap: 22px; margin-top: 12px; }
.scores small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.scores strong { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--coral); color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 480px) {
  .panel { padding: 10px 14px; }
  .title { font-size: 32px; }
  .tagline { display: none; }
  .modes { margin-top: 8px; gap: 6px; }
  .mode { padding: 6px 10px; }
  .mode .ic { font-size: 22px; }
  .mode b { font-size: 16px; }
  .help { margin-top: 6px; }
  .panel h2 { font-size: 20px; }
  .medal { font-size: 32px; }
  .scores { margin-top: 6px; }
  .scores strong { font-size: 20px; }
  .row { margin-top: 8px; }
  .btn { padding: 9px; }
}
@media (max-height: 480px) and (min-aspect-ratio: 3/2) {
  .panel.wide { width: min(100%, 640px); }
  .panel.wide .modes { grid-template-columns: repeat(3, 1fr); }
  .panel.wide .mode { grid-template-columns: 1fr; text-align: center; gap: 2px; }
  .panel.wide .grid { grid-template-columns: repeat(8, 1fr); }
  .panel.wide .cbtn { aspect-ratio: auto; height: 44px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app menu" id="app">
  <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
  <div class="hud" id="hud">
    <div class="chip"><small id="h1l"></small><strong id="h1">0</strong></div>
    <div class="chip"><small id="h2l"></small><strong id="h2">0</strong></div>
    <div class="chip" id="c3"><small id="h3l"></small><strong id="h3">0</strong></div>
    <div class="grow"></div>
    <button type="button" class="iconbtn" id="pause" data-i18n-label="pause">II</button>
  </div>
  <div class="toast" id="toast" aria-hidden="true"></div>
  <div class="pad" id="pad">
    <div class="grp"><button type="button" id="tl" data-i18n-label="left">◀</button></div>
    <button type="button" class="mid" id="tm" data-i18n="tuck"></button>
    <div class="grp"><button type="button" id="tr" data-i18n-label="right">▶</button></div>
  </div>

  <div class="overlay" id="menu">
    <div class="panel wide" role="dialog" aria-labelledby="menu-title">
      <h1 class="title" id="menu-title">Ski <span>Slope</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="modes">
        <button type="button" class="mode" id="mode-slalom"><span class="ic">🚩</span><div><b data-i18n="slalom"></b><span data-i18n="slalomDesc"></span></div></button>
        <button type="button" class="mode primary" id="play"><span class="ic">⛷️</span><div><b data-i18n="endless"></b><span data-i18n="endlessDesc"></span></div></button>
        <button type="button" class="mode" id="mode-free"><span class="ic">🏂</span><div><b data-i18n="freestyle"></b><span data-i18n="freestyleDesc"></span></div></button>
      </div>
      <p class="help" id="help"></p>
    </div>
  </div>

  <div class="overlay" id="courses" hidden>
    <div class="panel wide" role="dialog" aria-labelledby="courses-title">
      <h2 id="courses-title" data-i18n="courses"></h2>
      <div class="grid" id="grid"></div>
      <p class="info" id="cinfo"></p>
      <div class="row"><button type="button" class="btn" id="cback" data-i18n="back"></button><button type="button" class="btn primary" id="cgo" data-i18n="go"></button></div>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="panel" role="dialog" aria-labelledby="paused-title">
      <h2 id="paused-title" data-i18n="paused"></h2>
      <div class="row"><button type="button" class="btn" id="quit" data-i18n="menu"></button><button type="button" class="btn primary" id="resume" data-i18n="resume"></button></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel" role="dialog" aria-labelledby="over-title">
      <h2 id="over-title"></h2>
      <p class="medal" id="medal"></p>
      <p class="sub" id="osub"></p>
      <div class="scores">
        <div><small id="o1l"></small><strong id="o1">0</strong></div>
        <div><small id="o2l"></small><strong id="o2">0</strong></div>
      </div>
      <p class="badge" id="newbest" data-i18n="newBest" hidden></p>
      <div class="row"><button type="button" class="btn" id="omenu" data-i18n="menu"></button><button type="button" class="btn" id="oretry" data-i18n="retry"></button><button type="button" class="btn primary" id="onext" data-i18n="next"></button></div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

  function end(why) {

      const key = 'c' + c.i, prev = save.times[key];
      if (!prev || total < prev.t) { save.times[key] = { t: Math.round(total * 100) / 100, m: Math.max(m, prev ? prev.m : 0) }; isBest = !!prev || true; }
      else if (m > prev.m) prev.m = m;
      if (c.i + 1 >= save.unlocked && c.i + 1 < N_COURSES) save.unlocked = c.i + 2;

      title = t.finish; medal = ['', '🥉', '🥈', '🥇'][m];
      sub = (m ? t.medalWon([0, t.bronze, t.silver, t.gold][m]) : t.noMedal) + (P.missed ? ' · ' + t.penalty(P.missed) : '');
      o1l = t.time; o1 = total.toFixed(2); o2l = t.best; o2 = save.times[key].t.toFixed(2);

    } else {
      const k = S.mode === 'endless' ? 'endless' : 'free';
      isBest = P.score > save[k];
      if (isBest) { save[k] = P.score; write(k, P.score); }
      title = why === 'caught' ? t.caught : t.timeUp;
      sub = S.mode === 'endless' ? t.run(Math.floor(Math.max(0, P.y) / 10)) : '';
      o1l = t.score; o1 = P.score; o2l = t.best; o2 = save[k];

    $('o1l').textContent = o1l; $('o1').textContent = o1; $('o2l').textContent = o2l; $('o2').textContent = o2;

  // ---------- effects ----------
  let toastT = 0;
  function toast(s) { const el = $('toast'); el.textContent = s; el.classList.add('show'); toastT = 1.3; }
  function burst(x, y, n) { if (reducedMotion) n = Math.ceil(n / 3); for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 40 + Math.random() * 120; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6 + Math.random() * 0.5 }); } }

  // ---------- render ----------
  function resize() {
    const r = app.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);

    view.touch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;

    $('help').textContent = view.touch ? t.helpTouch : t.helpKeys;
    draw();
  }

  const sx = x => (x - cam.x) * view.s + canvas.width / 2;
  const sy = y => (y - cam.y) * view.s;

  function drawTree(o) {
    const x = sx(o.x), y = sy(o.y), s = view.s;
    ctx.fillStyle = '#9fbfd655'; ctx.beginPath(); ctx.ellipse(x + 6 * s, y + 4 * s, 14 * s, 6 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#7a4b2a'; ctx.fillRect(x - 3 * s, y - 6 * s, 6 * s, 10 * s);

  }
  function drawRock(o) {
    const x = sx(o.x), y = sy(o.y), s = view.s;
    ctx.fillStyle = '#9fbfd655'; ctx.beginPath(); ctx.ellipse(x + 4 * s, y + 4 * s, 15 * s, 6 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#7d8a99'; ctx.beginPath(); ctx.moveTo(x - 14 * s, y + 3 * s); ctx.lineTo(x - 9 * s, y - 9 * s); ctx.lineTo(x + 2 * s, y - 13 * s); ctx.lineTo(x + 13 * s, y - 4 * s); ctx.lineTo(x + 12 * s, y + 4 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - 9 * s, y - 9 * s); ctx.lineTo(x + 2 * s, y - 13 * s); ctx.lineTo(x + 6 * s, y - 9 * s); ctx.lineTo(x - 4 * s, y - 7 * s); ctx.closePath(); ctx.fill();
  }
  function drawRamp(rp) {
    const x = sx(rp.x), y = sy(rp.y), s = view.s, w = rp.w / 2 * s, h = (rp.big ? 30 : 22) * s;
    ctx.fillStyle = '#9fbfd666'; ctx.fillRect(x - w + 4 * s, y - h + 6 * s, w * 2, h);
    ctx.fillStyle = rp.big ? '#ff9f43' : '#7ec8e3'; ctx.fillRect(x - w, y - h, w * 2, h);
    ctx.fillStyle = rp.big ? '#e67e22' : '#3fa7d6'; ctx.fillRect(x - w, y - 4 * s, w * 2, 4 * s);
    ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 2 * s;
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x - w + 3 * s, y - h * i / 4); ctx.lineTo(x + w - 3 * s, y - h * i / 4); ctx.stroke(); }
  }
  function drawGate(g) {
    const s = view.s, y = sy(g.y), col = g.done === 2 ? '#9aa9b8' : g.side < 0 ? '#e94f4f' : '#3478d1';
    if (g.done === 1) { ctx.fillStyle = '#5bd18b33'; ctx.fillRect(sx(g.x - g.w / 2), y - 2 * s, g.w * s, 4 * s); }

      const x = sx(g.x + d * g.w / 2);

  }
  function drawSkier() {

    ctx.fillStyle = '#7fa6c444'; ctx.beginPath(); ctx.ellipse(x + 3 * s + P.z * 0.08 * s, y + 3 * s, 10 * s, 5 * s, 0, 0, 7); ctx.fill();

      ctx.fillStyle = '#2b3a55'; ctx.fillRect(-14 * s, -2 * s, 28 * s, 3 * s); ctx.fillRect(-8 * s, 6 * s, 24 * s, 3 * s);
      ctx.fillStyle = '#ff6f59'; ctx.beginPath(); ctx.ellipse(0, 0, 7 * s, 9 * s, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffd7b5'; ctx.beginPath(); ctx.arc(0, -10 * s, 4.5 * s, 0, 7); ctx.fill();

    const grab = P.air > 0 && input.grab;
    ctx.fillStyle = '#2b3a55';
    for (const d of [-1, 1]) { ctx.save(); ctx.translate(d * 4 * s, 0); if (grab) ctx.rotate(d * 0.35); ctx.fillRect(-1.6 * s, -14 * s, 3.2 * s, 28 * s); ctx.restore(); }

  }
  function drawSnowball() {
    const s = view.s, x = sx(cam.x), y = sy(chase.y), R = 120 * s, rot = reducedMotion ? 0 : chase.y * 0.01;

      if (k > 0) { const g = ctx.createLinearGradient(0, 0, 0, 60 * s); g.addColorStop(0, `rgba(63,167,214,${0.55 * k})`); g.addColorStop(1, 'rgba(63,167,214,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, 60 * s); }
      return;
    }
    ctx.fillStyle = '#ffffffcc'; for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.arc(x + i * 60 * s, y - 30 * s - Math.abs(i) * 8 * s, 50 * s, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#f4fbff'; ctx.beginPath(); ctx.arc(x, y - R * 0.3, R, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c3dcee'; ctx.lineWidth = 4 * s; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x, y - R * 0.3, R * (0.4 + i * 0.15), rot + i, rot + i + 1.3); ctx.stroke(); }
    ctx.fillStyle = '#17324d';
    for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(x + d * 34 * s, y + 22 * s, 11 * s, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + d * 34 * s + 3 * s, y + 25 * s, 4 * s, 0, 7); ctx.fill(); ctx.fillStyle = '#17324d'; }
    ctx.lineWidth = 6 * s; ctx.strokeStyle = '#17324d'; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + d * 52 * s, y + 2 * s); ctx.lineTo(x + d * 20 * s, y + 10 * s); ctx.stroke(); }
    ctx.fillStyle = '#ff6f59'; ctx.beginPath(); ctx.ellipse(x, y + 58 * s, 22 * s, 12 * s, 0, 0, Math.PI); ctx.fill();
  }

  function draw() {
    const W = canvas.width, H = canvas.height, s = view.s;
    ctx.fillStyle = '#eef7fd'; ctx.fillRect(0, 0, W, H);
    if (!P) { drawMenuBg(); return; }
    // subtle snow ripples
    ctx.strokeStyle = '#d6e9f6'; ctx.lineWidth = 2 * s;
    const top = cam.y, bot = cam.y + view.vh;
    for (let yy = Math.floor(top / 90) * 90; yy < bot; yy += 90) { const ox = ((yy * 37) % 140); ctx.beginPath(); for (let xx = cam.x - view.vw / 2 - 140 + ox; xx < cam.x + view.vw / 2 + 140; xx += 140) { ctx.moveTo(sx(xx), sy(yy)); ctx.quadraticCurveTo(sx(xx + 30), sy(yy - 8), sx(xx + 60), sy(yy)); } ctx.stroke(); }

    for (const d of [-1, 1]) { ctx.beginPath(); let first = true; for (const p of trail) { if (p.y < top - 20) continue; const ox = Math.cos(p.a) * d * 4, oy = -Math.sin(p.a) * d * 4; if (first) { ctx.moveTo(sx(p.x + ox), sy(p.y + oy)); first = false; } else ctx.lineTo(sx(p.x + ox), sy(p.y + oy)); } ctx.stroke(); }

    if (S.course) {
      const c = S.course;
      for (const yy of [0, c.L]) { const y = sy(yy); if (y < -20 || y > H + 20) continue; ctx.fillStyle = yy ? '#ff6f59' : '#3fa7d6'; for (let xx = -300; xx < 300; xx += 20) { ctx.globalAlpha = (xx / 20) % 2 ? 0.9 : 0.5; ctx.fillRect(sx(xx), y - 3 * s, 20 * s, 6 * s); } ctx.globalAlpha = 1; }

    }
    for (const rp of near(top - 40, bot + 40, x0, x1, 'ramps')) drawRamp(rp);
    const obs = near(top - 10, bot + 60, x0, x1, 'obs').sort((a, b) => a.y - b.y);

  let menuT = 0;
  function drawMenuBg() {
    const s = view.s, W = canvas.width, H = canvas.height;
    const r = rng(7);
    cam.x = 0; cam.y = menuT * 60;
    for (let i = 0; i < 60; i++) { const o = { x: (r() - 0.5) * view.vw, y: ((r() * 1400 - cam.y) % 1400 + 1400) % 1400 - 100 + cam.y }; drawTree(o); }
    void W; void H; void s;
  }

  function updateHud() {
    if (!P) return;
    const L = [$('h1l'), $('h2l'), $('h3l')], V = [$('h1'), $('h2'), $('h3')];
    $('c3').hidden = false; $('c3').classList.remove('warn');
    if (S.mode === 'slalom') {
      L[0].textContent = t.time; V[0].textContent = (P.time + P.missed * PENALTY).toFixed(1);
      L[1].textContent = t.gate; V[1].textContent = `${P.gate + P.missed}/${S.course.gates.length}`;
      L[2].textContent = t.missed; V[2].textContent = P.missed; $('c3').classList.toggle('warn', P.missed > 0);
    } else if (S.mode === 'endless') {

      L[1].textContent = t.score; V[1].textContent = P.score;
      const gap = Math.max(0, Math.floor((P.y - chase.y - 40) / 10));
      L[2].textContent = t.chaser; V[2].textContent = t.m(gap); $('c3').classList.toggle('warn', gap < 25);

    }
    $('tm').textContent = P.air > 0 ? t.grab : t.tuck;

  // ---------- loop ----------
  let last = performance.now(), acc = 0, hudT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (document.hidden) { requestAnimationFrame(frame); return; }
    if (S.state === 'play') { acc += dt; while (acc >= STEP) { step(STEP); acc -= STEP; } } else acc = 0;
    if (P && S.state !== 'paused') for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    if (P) {
      const tx = S.course && view.vw > 720 ? 0 : P.x + Math.sin(P.dir) * 40;
      cam.x += (tx - cam.x) * Math.min(1, dt * 4);

    if (S.mode === 'endless' && P && P.y - chase.y > 420) S.warned = false;
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- UI ----------
  function hideAll() { for (const id of ['menu', 'courses', 'paused', 'over']) $(id).hidden = true; }
  function showMenu() { S.state = 'menu'; P = null; app.classList.add('menu'); hideAll(); $('menu').hidden = false; $('play').focus(); }
  function showCourses() {
    hideAll(); $('courses').hidden = false; S.state = 'menu';
    const grid = $('grid'); grid.textContent = '';
    for (let i = 0; i < N_COURSES; i++) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'cbtn' + (i === S.ci ? ' cur' : '');
      const rec = save.times['c' + i];
      b.innerHTML = `${i + 1}<i>${rec ? ['', '🥉', '🥈', '🥇'][rec.m] || '✓' : i >= save.unlocked ? '🔒' : ''}</i>`;
      b.disabled = i >= save.unlocked; b.setAttribute('aria-label', t.course(i + 1));

  function pause() { if (S.state !== 'play') return; S.state = 'paused'; $('paused').hidden = false; $('resume').focus(); }

  $('mode-slalom').addEventListener('click', () => { S.ci = Math.min(save.unlocked - 1, S.ci); showCourses(); });
  $('play').addEventListener('click', () => reset('endless'));
  $('mode-free').addEventListener('click', () => reset('free'));
  $('cback').addEventListener('click', showMenu);
  $('cgo').addEventListener('click', () => reset('slalom', S.ci));
  $('pause').addEventListener('click', pause);
  $('resume').addEventListener('click', resume);
  $('quit').addEventListener('click', showMenu);
  $('omenu').addEventListener('click', () => S.mode === 'slalom' ? (P = null, app.classList.add('menu'), showCourses()) : showMenu());
  $('oretry').addEventListener('click', () => reset(S.mode, S.ci));
  $('onext').addEventListener('click', () => reset('slalom', S.ci + 1));
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  const KEYS = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowDown: 'tuck', KeyS: 'tuck', ArrowUp: 'brake', KeyW: 'brake', Space: 'grab' };
  addEventListener('keydown', e => {
    if (e.code === 'KeyP' && (S.state === 'play' || S.state === 'paused')) { S.state === 'play' ? pause() : resume(); e.preventDefault(); return; }
    if (S.state === 'over' && !$('over').hidden && (e.code === 'Space' || e.code === 'Enter') && document.activeElement === document.body) { reset(S.mode, S.ci); e.preventDefault(); return; }

  addEventListener('keyup', e => { const k = KEYS[e.code]; if (!k) return; input[k] = 0; if (k === 'grab') input.tuck = 0; });
  addEventListener('blur', () => { for (const k in input) input[k] = 0; });

  // Pointer zones on the slope: left third / right third steer, middle tucks (and grabs in the air).
  const ptrs = new Map();
  function zones() { input.l = input.r = input.tuck = input.grab = 0; for (const z of ptrs.values()) { input[z] = 1; if (z === 'tuck') input.grab = 1; } }
  canvas.addEventListener('pointerdown', e => { if (S.state !== 'play') return; const r = canvas.getBoundingClientRect(), f = (e.clientX - r.left) / r.width; ptrs.set(e.pointerId, f < 0.36 ? 'l' : f > 0.64 ? 'r' : 'tuck'); canvas.setPointerCapture(e.pointerId); zones(); e.preventDefault(); });
  const up = e => { if (ptrs.delete(e.pointerId)) zones(); };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  for (const [id, z] of [['tl', 'l'], ['tr', 'r'], ['tm', 'tuck']]) {
    const b = $(id);
    b.addEventListener('pointerdown', e => { ptrs.set('b' + e.pointerId + id, z); b.classList.add('on'); zones(); e.preventDefault(); });
    const off = e => { if (ptrs.delete('b' + e.pointerId + id)) { b.classList.remove('on'); zones(); } };
    b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
  }

  new ResizeObserver(resize).observe(app);
  resize();
  requestAnimationFrame(frame);

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__skiSlope = {
    state: () => ({ mode: S.mode, state: S.state, ci: S.ci, p: P && { x: P.x, y: P.y, v: P.v, ang: P.ang, dir: P.dir, air: P.air, z: P.z, fall: P.fall, time: P.time, missed: P.missed, crashes: P.crashes || 0, gate: P.gate, score: P.score, tricks: P.tricks, spin: P.spin }, chase: chase && chase.y, left: S.left, save: JSON.parse(JSON.stringify(save)) }),
    course: i => { const c = COURSES[i]; return { L: c.L, medals: c.medals, gates: c.gates.map(g => ({ x: g.x, y: g.y, w: g.w, done: g.done })), ramps: c.ramps, obs: c.obs.length }; },
    near: (y0, y1, x0, x1) => P ? { obs: near(y0, y1, x0, x1, 'obs'), ramps: near(y0, y1, x0, x1, 'ramps') } : null,
    input,
    // Advance the fixed-step simulation synchronously (deterministic bot runs).
    tick: (sec, policy) => { const n = Math.round(sec / STEP); for (let i = 0; i < n && S.state === 'play'; i++) { if (policy) policy(); step(STEP); } return S.state; },
    start: (mode, ci) => reset(mode, ci),
  };
})();
</script>
</body>
</html>
