<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dots and Boxes</title>
<style>
:root {
  --ink: #26304f;
  --muted: #6b7392;
  --bg: #f2eee3;
  --rule: #dfe5f1;
  --paper: #fffdf8;
  --paper-2: #f3efe4;
  --paper-shadow: #d8d0bd;
  --pen: #3c55d4;
  --pen-dark: #2a3da3;
  --track: #e4e7f0;
  --p0: #12a58f; --p0d: #0b7766; --p0l: #c8efe7;
  --p1: #ea4d84; --p1d: #b92d60; --p1l: #fcd6e4;
  --gold: #ffc53d;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 24px 24px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; }
.ic { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 540px; margin: auto; display: flex; flex-direction: column; gap: 8px; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: clamp(21px, 6.6vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; white-space: nowrap; }
h1 span { color: var(--p1); }
.mark { flex: none; width: 1.05em; height: 1.05em; }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: var(--paper); font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 var(--paper-shadow); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--paper-shadow); }

.scores { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; }
.side { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 16px; background: #ffffffd0; box-shadow: 0 3px 0 #e1dacb; transition: box-shadow .2s; }
.side.p1 { flex-direction: row-reverse; text-align: right; }
.chip { flex: 0 0 auto; min-width: 28px; height: 28px; padding: 0 4px; display: grid; place-items: center; border-radius: 9px; color: #fff; font-size: 14px; font-weight: 900; font-style: normal; line-height: 1; white-space: nowrap; }
.p0 .chip { background: var(--p0); box-shadow: inset 0 -3px 0 var(--p0d); }
.p1 .chip { background: var(--p1); box-shadow: inset 0 -3px 0 var(--p1d); }
.side div { min-width: 0; flex: 1; }
.side small, .mid small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 800; letter-spacing: .03em; color: var(--muted); }
.side strong, .mid strong { display: block; font-size: 21px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.side.turn.p0 { box-shadow: 0 0 0 3px var(--p0), 0 3px 0 #e1dacb; }
.side.turn.p1 { box-shadow: 0 0 0 3px var(--p1), 0 3px 0 #e1dacb; }
.mid { align-self: center; min-width: 50px; text-align: center; }
.bar { height: 8px; display: flex; justify-content: space-between; border-radius: 99px; background: #e6e2d6; overflow: hidden; box-shadow: inset 0 1px 2px #0000001a; }
.bar i { display: block; height: 100%; width: 0; transition: width .35s ease; }
#bar-0 { background: var(--p0); }
#bar-1 { background: var(--p1); }
.status { min-height: 1.3em; text-align: center; font-size: 15px; font-weight: 800; line-height: 1.3; }

.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.card { position: relative; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); border-radius: 22px; background: var(--paper); box-shadow: 0 4px 0 var(--paper-shadow), 0 16px 34px #6b5a3022; touch-action: none; cursor: pointer; }
.card.locked { cursor: default; }
.card:focus-visible { outline-offset: 4px; }
.card svg { display: block; width: 100%; height: 100%; }
.track { stroke: var(--track); stroke-width: 7; stroke-linecap: round; }
.ln { stroke-width: 13; stroke-linecap: round; }
.ln.off { display: none; }
.ln.p0, .pv.p0 { stroke: var(--p0); }
.ln.p1, .pv.p1 { stroke: var(--p1); }
.ln.anim { stroke-dasharray: 1 1; animation: drawin .26s ease-out; }
@keyframes drawin { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.halo { stroke-width: 30; stroke-linecap: round; opacity: .22; }
.halo.p0 { stroke: var(--p0); } .halo.p1 { stroke: var(--p1); }
.pv { stroke-width: 13; stroke-linecap: round; opacity: .45; }
.cur { stroke: var(--pen); stroke-width: 32; stroke-linecap: round; opacity: .16; }
.box rect { fill: transparent; }
.box text { font-weight: 900; text-anchor: middle; dominant-baseline: central; font-family: var(--font); }
.box.p0 rect { fill: var(--p0l); } .box.p0 text { fill: var(--p0d); }
.box.p1 rect { fill: var(--p1l); } .box.p1 text { fill: var(--p1d); }
.box.pop rect, .box.pop text { transform-box: fill-box; transform-origin: center; animation: pop .34s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.dot { fill: var(--ink); }

.tools { display: flex; gap: 8px; }
.tool { flex: 1; min-width: 0; min-height: 42px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 10px; border-radius: 14px; background: var(--paper); font-size: 15px; font-weight: 800; line-height: 1.15; box-shadow: 0 3px 0 var(--paper-shadow); }
.tool:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--paper-shadow); }
.tool .ic { width: 19px; height: 19px; flex: none; }
.meta { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); }
.foot { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.5; }
.foot strong { color: var(--ink); }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: #26304f59; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 400px); max-height: calc(100% - 8px); overflow: auto; background: var(--paper); border-radius: 26px; padding: 22px 20px; text-align: center; box-shadow: 0 20px 50px #26304f55; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 27px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: var(--p1); }
.logo { display: block; width: 64px; height: 44px; margin: 0 auto 6px; }
.text { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.field { margin-top: 12px; text-align: left; }
.field[hidden] { display: none; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--paper-2); }
.seg button { min-width: 0; min-height: 36px; padding: 7px 3px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.15; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #ddd4c0; }
.info { margin-top: 5px; min-height: 2.6em; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.emoji { font-size: 44px; line-height: 1.2; }
.result-score { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 12px; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.result-score .chip { min-width: 32px; height: 32px; font-size: 15px; }
.result-score em { font-style: normal; color: var(--muted); font-size: 18px; }
.small { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.4; }
.small[hidden] { display: none; }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: var(--gold); color: #4a3500; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 18px; width: 100%; padding: 14px; border-radius: 18px; background: var(--pen); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--pen-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--pen-dark); }
.ghost-btn { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; background: var(--paper-2); font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #ddd4c0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (min-width: 640px) and (max-aspect-ratio: 5/4) { .app { max-width: 680px; gap: 10px; } .tool { min-height: 48px; font-size: 16px; } }
@media (max-width: 420px) { .seg.four { grid-auto-flow: row; grid-template-columns: 1fr 1fr; } }
@media (max-width: 380px) {
  .top { gap: 6px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 12px; }
  .side { padding: 5px 7px; gap: 6px; }
  .side small, .mid small { letter-spacing: 0; }
  .side strong { font-size: 19px; }
  .mid { min-width: 40px; }
  .chip { min-width: 24px; height: 24px; font-size: 12px; border-radius: 8px; }
  .tool { font-size: 14px; padding: 7px 6px; }
}
@media (max-height: 700px) { .foot { display: none; } .overlay { padding: 8px; } #setup .logo { display: none; } .field { margin-top: 8px; } .cta { margin-top: 14px; } }
@media (max-height: 560px) and (max-aspect-ratio: 5/4) { #setup .text { display: none; } }
@media (max-height: 560px) {
  .app { gap: 6px; }
  .meta { display: none; }
  .overlay { padding: 8px; }
  .panel { padding: 14px 16px; border-radius: 22px; }
  .logo { width: 48px; height: 32px; margin-bottom: 2px; }
  .panel h2 { font-size: 22px; }
  .text { margin-top: 4px; font-size: 13px; line-height: 1.35; }
  .field { margin-top: 8px; }
  .label { font-size: 11px; margin-bottom: 3px; }
  .seg button { padding: 5px 3px; min-height: 32px; }
  .info { min-height: 0; }
  .emoji { font-size: 32px; }
  .result-score { margin-top: 6px; font-size: 22px; }
  .cta { margin-top: 12px; padding: 11px; font-size: 18px; }
  .ghost-btn { margin-top: 8px; padding: 9px; }
}
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  #setup .panel { width: min(100%, 680px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; align-items: start; }
  #setup .logo, #setup .text { display: none; }
  #setup h2, #setup .cta { grid-column: 1 / -1; }
  #result .panel { width: min(100%, 560px); }
  #result .emoji { display: none; }
}

/* Wide frames: scores and controls in a side column, the board gets the full height. */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: 1240px; display: grid; grid-template-columns: clamp(220px, 27vw, 330px) minmax(0, 1fr); grid-template-rows: auto auto auto auto auto auto 1fr auto; grid-template-areas: "top board" "scores board" "bar board" "status board" "tools board" "meta board" ". board" "foot board"; gap: 12px 24px; padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
  .top { grid-area: top; }
  h1 { font-size: clamp(20px, 2.2vw, 30px); }
  .scores { grid-area: scores; grid-template-columns: 1fr; gap: 8px; }
  .side.p1 { flex-direction: row; text-align: left; }
  .mid { display: none; }
  .bar { grid-area: bar; }
  .status { grid-area: status; text-align: left; }
  .tools { grid-area: tools; flex-direction: column; }
  .tool { flex: none; justify-content: flex-start; padding: 10px 14px; }
  .meta { grid-area: meta; display: block; text-align: left; }
  .foot { grid-area: foot; text-align: left; }
  .board-wrap { grid-area: board; }
}
@media (min-aspect-ratio: 5/4) and (min-height: 600px) { .foot { display: block; } }
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  .app { grid-template-columns: clamp(200px, 30vw, 270px) minmax(0, 1fr); grid-template-rows: auto auto auto auto auto 1fr; grid-template-areas: "top board" "scores board" "bar board" "status board" "tools board" ". board"; gap: 7px 14px; padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  h1 { font-size: 19px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 12px; font-size: 18px; }
  .scores { grid-template-columns: 1fr 1fr; gap: 6px; }
  .side { padding: 4px 7px; gap: 6px; }
  .side small { letter-spacing: 0; }
  .side strong { font-size: 18px; }
  .chip { min-width: 24px; height: 24px; font-size: 12px; border-radius: 8px; }
  .status { font-size: 13px; }
  .tools { flex-direction: row; gap: 6px; }
  .tool { flex: 1; justify-content: center; min-height: 36px; padding: 6px; font-size: 13px; }
  .meta, .foot { display: none; }
  .card { border-radius: 16px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 340px) { .status { min-height: 2.6em; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="#c8efe7"/><path d="M4 4h16M4 4v16M20 4v16" stroke="#12a58f" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M4 20h16" stroke="#ea4d84" stroke-width="3" stroke-linecap="round"/><g fill="#26304f"><circle cx="4" cy="4" r="2.4"/><circle cx="20" cy="4" r="2.4"/><circle cx="4" cy="20" r="2.4"/><circle cx="20" cy="20" r="2.4"/></g></svg>Dots <span>and Boxes</span></h1>
    <button type="button" class="icon-btn" id="settings" data-i18n-label="settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
  </header>
  <div class="scores">
    <div class="side p0" id="side-0"><i class="chip" id="chip-0" aria-hidden="true"></i><div><small id="name-0"></small><strong id="score-0">0</strong></div></div>
    <div class="mid"><small data-i18n="left"></small><strong id="left">0</strong></div>
    <div class="side p1" id="side-1"><i class="chip" id="chip-1" aria-hidden="true"></i><div><small id="name-1"></small><strong id="score-1">0</strong></div></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar-0"></i><i id="bar-1"></i></div>
  <p class="status" id="status"></p>
  <div class="board-wrap" id="wrap">
    <div class="card" id="card" tabindex="0" role="application" data-i18n-label="board">
      <svg id="board" aria-hidden="true">
        <g id="g-boxes"></g><g id="g-tracks"></g><line class="halo" id="halo" visibility="hidden"/><line class="cur" id="cursor" visibility="hidden"/><g id="g-lines"></g><line class="pv" id="preview" visibility="hidden"/><g id="g-dots"></g>
      </svg>
    </div>
  </div>
  <div class="tools">
    <button type="button" class="tool" id="undo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="undo"></span></button>
    <button type="button" class="tool" id="new"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span data-i18n="newGame"></span></button>
  </div>
  <p class="meta" id="meta"></p>
  <p class="foot"><strong id="record"></strong><br><span data-i18n="hint"></span></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="setup">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <svg class="logo" viewBox="0 0 64 44" aria-hidden="true"><rect x="8" y="8" width="24" height="28" rx="3" fill="#c8efe7"/><rect x="32" y="8" width="24" height="28" rx="3" fill="#fcd6e4"/><path d="M8 8h24M8 8v28M8 36h24" stroke="#12a58f" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M32 8h24M56 8v28M32 36h24M32 8v28" stroke="#ea4d84" stroke-width="4" stroke-linecap="round" fill="none"/><g fill="#26304f"><circle cx="8" cy="8" r="3.5"/><circle cx="32" cy="8" r="3.5"/><circle cx="56" cy="8" r="3.5"/><circle cx="8" cy="36" r="3.5"/><circle cx="32" cy="36" r="3.5"/><circle cx="56" cy="36" r="3.5"/></g></svg>
    <h2 id="setup-title">Dots <span>and Boxes</span></h2>
    <p class="text" data-i18n="tagline"></p>
    <div>
      <div class="field"><p class="label" id="mode-label" data-i18n="mode"></p><div class="seg" role="group" aria-labelledby="mode-label" data-key="mode"><button type="button" data-value="cpu" data-i18n="vsCpu"></button><button type="button" data-value="pvp" data-i18n="twoP"></button></div></div>
      <div class="field" id="level-field"><p class="label" id="level-label" data-i18n="level"></p><div class="seg four" role="group" aria-labelledby="level-label" data-key="level"><button type="button" data-value="easy" data-i18n="easy"></button><button type="button" data-value="normal" data-i18n="normal"></button><button type="button" data-value="hard" data-i18n="hard"></button><button type="button" data-value="expert" data-i18n="expert"></button></div><p class="info" id="level-info"></p></div>
    </div>
    <div>
      <div class="field"><p class="label" id="size-label" data-i18n="size"></p><div class="seg" role="group" aria-labelledby="size-label" data-key="size"><button type="button" data-value="3">3×3</button><button type="button" data-value="4">4×4</button><button type="button" data-value="5">5×5</button><button type="button" data-value="6">6×6</button><button type="button" data-value="7">7×7</button></div></div>
      <div class="field"><p class="label" id="first-label" data-i18n="first"></p><div class="seg" role="group" aria-labelledby="first-label" data-key="first"><button type="button" data-value="p0" id="first-p0"></button><button type="button" data-value="p1" id="first-p1"></button><button type="button" data-value="alt" data-i18n="alternate"></button></div></div>
    </div>
    <button type="button" class="cta" id="start" data-i18n="start"></button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <p class="emoji" id="result-emoji" aria-hidden="true"></p>
    <h2 id="result-title"></h2>
    <p class="text" id="result-text"></p>
    <p class="result-score" id="result-score"></p>
    <p class="small" id="result-tally"></p>
    <p class="small" id="result-note" hidden></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="again" data-i18n="playAgain"></button>
    <button type="button" class="ghost-btn" id="change" data-i18n="change"></button>
  </div>
</div>

<script>

      if (!game || game.round !== at || !game.over) return;
      els.result.hidden = false;
      $('again').focus({ preventScroll: true });
    }, reducedMotion.matches ? 500 : 1100);
  }
  function nextStarter() {
    if (settings.first === 'alt') return 1 - starter;
    return settings.first === 'p1' ? 1 : 0;
  }

  // ---- Rendering -------------------------------------------------------------------------
  function setLine(el, id, cls) {
    if (id < 0) { el.setAttribute('visibility', 'hidden'); return; }
    placeLine(el, id);
    el.setAttribute('class', cls);
    el.setAttribute('visibility', 'visible');
  }
  function renderBoard(reset) {
    const animate = !reset && !reducedMotion.matches;
    for (let id = 0; id < geo.L; id++) {
      const by = game.pos.lines[id] ? game.lineBy[id] : -1;
      if (drawnCache[id] === by) continue;
      drawnCache[id] = by;
      lineEls[id].setAttribute('class', by < 0 ? 'ln off' : `ln p${by}${animate && id === game.last ? ' anim' : ''}`);
    }
    const longest = Math.max(markOf(0).length, markOf(1).length);
    const fs = longest > 2 ? 30 : longest === 2 ? 40 : 52;
    for (let b = 0; b < geo.B; b++) {
      const o = game.owner[b];
      boxEls[b].text.setAttribute('font-size', fs);
      if (ownerCache[b] === o) continue;
      ownerCache[b] = o;
      boxEls[b].grp.setAttribute('class', o < 0 ? 'box' : `box p${o}${animate ? ' pop' : ''}`);
      boxEls[b].text.textContent = o < 0 ? '' : markOf(o);
    }
    setLine(els.halo, game.last, `halo p${game.last >= 0 ? game.lineBy[game.last] : 0}`);
    renderPointer();
  }
  function canHuman() { return game && !game.over && !game.thinking && !isCpu(game.turn) && !overlayOpen(); }
  function renderPointer() {
    const live = canHuman();
    els.card.classList.toggle('locked', !live);
    const pv = live ? (preview >= 0 ? preview : kbd && !game.pos.lines[cursor] ? cursor : -1) : -1;
    setLine(els.preview, pv, `pv p${game.turn}`);
    setLine(els.cursor, live && kbd ? cursor : -1, 'cur');
  }
  function renderStatus() {
    let text, color = '';
    if (game.over) text = $('result-title').textContent;
    else if (isCpu(game.turn)) { text = t.thinking; color = 'var(--p1d)'; }
    else {
      const p = game.turn;
      if (settings.mode === 'cpu') text = game.again ? t.youAgain : t.yourTurn;
      else text = game.again ? t.again(nameOf(p)) : t.turnOf(nameOf(p));
      color = p === 0 ? 'var(--p0d)' : 'var(--p1d)';
    }
    els.status.textContent = text;
    els.status.style.color = color;
    for (const p of [0, 1]) $(`side-${p}`).classList.toggle('turn', !game.over && game.turn === p);
    els.undo.disabled = game.over || !(settings.mode === 'cpu' ? game.history.some(m => m.p === 0) : game.history.length);
    renderPointer();
  }
  function renderAll(reset) {
    for (const p of [0, 1]) {
      $(`name-${p}`).textContent = nameOf(p);
      $(`score-${p}`).textContent = String(game.score[p]);
      $(`chip-${p}`).textContent = markOf(p);
      $(`bar-${p}`).style.width = `${(game.score[p] / geo.B) * 100}%`;
    }
    els.left.textContent = String(geo.B - game.score[0] - game.score[1]);
    const size = `${game.n}×${game.n}`;
    els.meta.textContent = settings.mode === 'cpu' ? `${size} · ${t.vsCpu} · ${levelName(settings.level)}` : `${size} · ${t.twoP}`;
    if (settings.mode === 'cpu') {
      const s = statOf(settings.level);
      els.record.textContent = `${t.record(levelName(settings.level), s.w, s.l, s.d)} · ${t.streak(s.streak, s.best)}`;
    } else els.record.textContent = t.rounds(nameOf(0), tally[0], tally[1], nameOf(1));
    renderBoard(reset);
    renderStatus();
    describeCursor(false);
  }
  function describeCursor(speak) {
    const [x1, y1, x2] = ends(cursor);
    const label = x1 === x2 ? t.vLine(y1 + 1, x1 + 1) : t.hLine(y1 + 1, x1 + 1);
    const full = game && game.pos.lines[cursor] ? `${label}, ${t.taken}` : label;
    els.card.setAttribute('aria-label', `${t.board}. ${full}`);
    if (speak) els.announcer.textContent = full;
  }

  // ---- Input -----------------------------------------------------------------------------
  function lineAt(ev) {
    const r = els.svg.getBoundingClientRect(), span = geo.n * U + PAD * 2;
    const x = ((ev.clientX - r.left) / r.width * span - PAD) / U, y = ((ev.clientY - r.top) / r.height * span - PAD) / U;
    let best = -1, bestD = ev.pointerType === 'mouse' ? 0.42 : 0.5;
    for (let id = 0; id < geo.L; id++) {
      if (game.pos.lines[id]) continue;
      const [x1, y1, x2, y2] = ends(id);
      const dx = Math.max(Math.min(x1, x2) - x, 0, x - Math.max(x1, x2)), dy = Math.max(Math.min(y1, y2) - y, 0, y - Math.max(y1, y2));
      const d = Math.hypot(dx, dy);
      if (d < bestD) { bestD = d; best = id; }
    }
    return best;
  }
  els.card.addEventListener('pointerdown', ev => {
    if (!canHuman() || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    kbd = false;
    pointerDown = true;
    try { els.card.setPointerCapture(ev.pointerId); } catch {}
    preview = lineAt(ev);
    renderPointer();
  });
  els.card.addEventListener('pointermove', ev => {
    if (!game) return;
    if (!canHuman()) { if (preview >= 0) { preview = -1; renderPointer(); } return; }
    if (ev.pointerType !== 'mouse' && !pointerDown) return;
    if (ev.pointerType === 'mouse') kbd = false;
    const id = lineAt(ev);
    if (id !== preview) { preview = id; renderPointer(); }
  });
  els.card.addEventListener('pointerup', ev => {
    if (!pointerDown) return;
    pointerDown = false;
    const id = canHuman() ? lineAt(ev) : -1;
    preview = -1;
    if (id >= 0) humanPlay(id); else if (game) renderPointer();
  });
  els.card.addEventListener('pointercancel', () => { pointerDown = false; preview = -1; if (game) renderPointer(); });
  els.card.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse' && !pointerDown && preview >= 0) { preview = -1; renderPointer(); } });

  // Arrow keys hop to the nearest line in that direction; the anchor keeps a straight row or column.
  function moveCursor(dx, dy) {
    const [a1, b1, a2, b2] = ends(cursor);
    const cx = (a1 + a2) / 2, cy = (b1 + b2) / 2;
    let best = -1, bestCost = Infinity;
    for (let id = 0; id < geo.L; id++) {
      if (id === cursor) continue;
      const [x1, y1, x2, y2] = ends(id);
      const ox = (x1 + x2) / 2 - cx, oy = (y1 + y2) / 2 - cy;
      const along = ox * dx + oy * dy;
      if (along <= 0.01) continue;
      const perp = Math.abs(dx ? oy : ox);
      const drift = dx ? Math.abs((y1 + y2) / 2 - anchor.y) : Math.abs((x1 + x2) / 2 - anchor.x);
      const cost = along + perp * 0.5 + drift * 0.01;
      if (cost < bestCost - 1e-9) { bestCost = cost; best = id; }
    }
    if (best < 0) return;
    cursor = best;
    const [x1, y1, x2, y2] = ends(cursor);
    if (dx) anchor.x = (x1 + x2) / 2; else anchor.y = (y1 + y2) / 2;
    describeCursor(true);
  }
  const overlayOpen = () => !els.setup.hidden || !els.result.hidden;
  const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  document.addEventListener('keydown', ev => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey || !game || overlayOpen()) return;
    const onButton = document.activeElement instanceof HTMLButtonElement;
    if (ARROWS[ev.key]) {
      ev.preventDefault();
      if (document.activeElement !== els.card) els.card.focus({ preventScroll: true });
      kbd = true;
      preview = -1;
      moveCursor(...ARROWS[ev.key]);
      renderPointer();
    } else if ((ev.key === 'Enter' || ev.key === ' ') && !onButton) {
      ev.preventDefault();
      if (!kbd) { kbd = true; renderPointer(); describeCursor(true); return; }
      if (game.pos.lines[cursor]) { describeCursor(true); return; }
      humanPlay(cursor);
    } else if (ev.key === 'u' || ev.key === 'U') {
      ev.preventDefault();
      undo();
    }
  });
  els.card.addEventListener('focus', () => { if (game) describeCursor(false); });

  // ---- Setup -----------------------------------------------------------------------------
  function renderSetup() {
    for (const group of document.querySelectorAll('.seg')) {
      for (const btn of group.children) btn.setAttribute('aria-pressed', String(settings[group.dataset.key] === btn.dataset.value));
    }
    els.levelField.hidden = settings.mode !== 'cpu';
    els.levelInfo.textContent = t['info' + settings.level[0].toUpperCase() + settings.level.slice(1)];
    $('first-p0').textContent = settings.mode === 'cpu' ? t.you : t.p1;
    $('first-p1').textContent = settings.mode === 'cpu' ? t.cpu : t.p2;
  }
  function openSetup() {
    if (game) { game.token++; game.thinking = false; }
    renderSetup();
    els.result.hidden = true;
    els.setup.hidden = false;
    els.start.focus({ preventScroll: true });
  }
  for (const group of document.querySelectorAll('.seg')) {
    group.addEventListener('click', ev => {
      const btn = ev.target.closest('button');
      if (!btn) return;
      settings[group.dataset.key] = btn.dataset.value;
      renderSetup();
    });
  }
  els.start.addEventListener('click', () => {
    const key = `${settings.mode}/${settings.level}/${settings.size}`;
    if (key !== els.start.dataset.key) tally = { 0: 0, 1: 0, d: 0 };
    els.start.dataset.key = key;
    write(STORE.settings, settings);
    newRound(settings.first === 'p1' ? 1 : 0);
    els.card.focus({ preventScroll: true });
  });
  $('again').addEventListener('click', () => { newRound(nextStarter()); els.card.focus({ preventScroll: true }); });
  $('change').addEventListener('click', openSetup);
  $('settings').addEventListener('click', openSetup);
  $('new').addEventListener('click', () => newRound(starter));
  els.undo.addEventListener('click', undo);

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__dotsBoxes = {
    state: () => game && { n: game.n, mode: settings.mode, level: settings.level, turn: game.turn, over: game.over, thinking: game.thinking, score: game.score.slice(), lines: Array.from(game.pos.lines), lineBy: Array.from(game.lineBy), owner: Array.from(game.owner), history: game.history.map(m => [m.id, m.p]), last: game.last, cursor, preview, usedUndo: game.usedUndo, overlay: !els.setup.hidden ? 'setup' : !els.result.hidden ? 'result' : null },
    lineCenter: id => { const r = els.svg.getBoundingClientRect(), span = geo.n * U + PAD * 2, [x1, y1, x2, y2] = ends(id); return { x: r.left + (((x1 + x2) / 2) * U + PAD) / span * r.width, y: r.top + (((y1 + y2) / 2) * U + PAD) / span * r.height }; },
    ends: id => ends(id),
  };

  renderSetup();
  els.start.dataset.key = `${settings.mode}/${settings.level}/${settings.size}`;
  game = freshGame(Number(settings.size), settings.first === 'p1' ? 1 : 0);
  renderAll(true);
  els.start.focus({ preventScroll: true });
})();
</script>
</body>
</html>
