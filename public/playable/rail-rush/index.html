<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rail Rush</title>
<style>
:root {
  --bg: #2b1d4a;
  --ink: #2a1840;
  --muted: #76648f;
  --sun: #ffb43a;
  --sun-dark: #d9821a;
  --teal: #20b8a8;
  --teal-dark: #13877b;
  --paper: #fff9f0;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

.app { position: relative; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
canvas:focus-visible { outline: none; }

.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); pointer-events: none; }
.app.menu .hud, .app.menu .powers { visibility: hidden; }
.chip { min-width: 56px; padding: 4px 10px; border-radius: 12px; background: #fff9f0e0; box-shadow: 0 2px 0 #00000040; text-align: center; }
.chip small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.chip strong { display: block; font-size: 17px; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.mult strong { color: var(--sun-dark); }
.hud .grow { flex: 1; }
.iconbtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 12px; background: #fff9f0e0; box-shadow: 0 2px 0 #00000040; font-size: 16px; font-weight: 900; display: grid; place-items: center; }
.powers { position: absolute; left: max(8px, env(safe-area-inset-left)); top: calc(max(6px, env(safe-area-inset-top)) + 50px); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.pw { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 4px; border-radius: 99px; background: #2a1840c0; color: #fff; font-size: 12px; font-weight: 800; }
.pw i { font-style: normal; font-size: 16px; width: 22px; text-align: center; }
.pw b { display: block; width: 46px; height: 6px; border-radius: 3px; background: #ffffff40; overflow: hidden; }
.pw b span { display: block; height: 100%; background: var(--sun); }

.toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); padding: 6px 14px; border-radius: 99px; background: var(--ink); color: #fff; font-weight: 900; font-size: 15px; white-space: nowrap; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8px; background: #1a0f2e70; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 390px); max-height: calc(100% - 8px); overflow-y: auto; padding: 18px 16px; border-radius: 22px; background: var(--paper); box-shadow: 0 7px 0 #c99a5a, 0 20px 50px #0007; text-align: center; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.title { font-size: clamp(36px, 12vw, 56px); font-weight: 900; letter-spacing: -.02em; line-height: 1; color: var(--sun); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
.title span { color: var(--teal); }
.tagline { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--muted); }
.stats { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.stat { padding: 5px 12px; border-radius: 12px; background: #f6ead8; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat small { display: block; font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .03em; }
.btn { flex: 1; padding: 12px; border-radius: 14px; background: #f6ead8; box-shadow: 0 3px 0 #d8c09c; font-size: 16px; font-weight: 900; }
.btn.primary { background: var(--sun); box-shadow: 0 4px 0 var(--sun-dark); }
.btn.teal { background: var(--teal); color: #fff; box-shadow: 0 4px 0 var(--teal-dark); }
.btn:active { transform: translateY(2px); }
.btn:disabled { opacity: .5; cursor: default; }
.big { display: block; width: 100%; margin-top: 14px; font-size: 22px; padding: 14px; }
.row { display: flex; gap: 8px; margin-top: 10px; }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.4; }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.01em; }
.list { display: grid; gap: 8px; margin-top: 12px; text-align: left; }
.item { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px; background: #f6ead8; }
.item .ic { font-size: 26px; text-align: center; }
.item b { display: block; font-size: 15px; font-weight: 900; line-height: 1.25; }
.item span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.3; }
.item.done { background: #d4f3ec; }
.item .btn { flex: none; padding: 8px 12px; font-size: 14px; min-width: 76px; }
.bar { height: 7px; margin-top: 4px; border-radius: 4px; background: #00000018; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); }
.tabs { display: flex; gap: 6px; margin-top: 10px; }
.tab { flex: 1; padding: 8px; border-radius: 12px; background: #f6ead8; font-weight: 900; font-size: 15px; }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; }
.swatch { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto; box-shadow: inset 0 -5px 0 #0003; }
.medal { font-size: 46px; line-height: 1.1; margin-top: 6px; }
.sub { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); line-height: 1.35; }
.scores { display: flex; justify-content: center; gap: 22px; margin-top: 12px; }
.scores small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.scores strong { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--teal); color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 520px) {
  .panel { padding: 10px 14px; }
  .title { font-size: 34px; }
  .tagline { display: none; }
  .stats { margin-top: 6px; }
  .big { margin-top: 8px; padding: 10px; font-size: 19px; }
  .row { margin-top: 6px; }
  .btn { padding: 9px; }
  .help { margin-top: 6px; }
  .panel h2 { font-size: 20px; }
  .medal { font-size: 30px; }
  .scores { margin-top: 4px; }
  .scores strong { font-size: 20px; }
  .list { margin-top: 8px; gap: 6px; }
  .item { padding: 5px 10px; }
}
@media (max-height: 520px) and (min-aspect-ratio: 3/2) {
  .panel.wide { width: min(100%, 680px); }
  .panel.wide .list { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 900px) and (min-height: 600px) {
  .panel.wide { width: min(100%, 560px); }
  .chip strong { font-size: 22px; }
  .chip { min-width: 72px; padding: 6px 14px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app menu" id="app">
  <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
  <div class="hud">
    <div class="chip"><small data-i18n="score"></small><strong id="hScore">0</strong></div>
    <div class="chip"><small data-i18n="coins"></small><strong id="hCoins">0</strong></div>
    <div class="chip mult"><small data-i18n="mult"></small><strong id="hMult">×1</strong></div>
    <div class="grow"></div>
    <button type="button" class="iconbtn" id="pause" data-i18n-label="pause">II</button>
  </div>
  <div class="powers" id="powers"></div>
  <div class="toast" id="toast" aria-hidden="true"></div>

  <div class="overlay" id="menu">
    <div class="panel" role="dialog" aria-labelledby="menu-title">
      <h1 class="title" id="menu-title">Rail <span>Rush</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="stats">
        <div class="stat"><small data-i18n="best"></small><span id="mBest">0</span></div>
        <div class="stat"><small data-i18n="bank"></small>🪙 <span id="mBank">0</span></div>
        <div class="stat"><small data-i18n="mult"></small>×<span id="mMult">1</span></div>
      </div>
      <button type="button" class="btn primary big" id="play" data-i18n="play"></button>
      <div class="row">
        <button type="button" class="btn teal" id="openMissions" data-i18n="missions"></button>
        <button type="button" class="btn" id="openShop" data-i18n="shop"></button>
      </div>
      <p class="help" id="help"></p>
    </div>
  </div>

  <div class="overlay" id="missions" hidden>
    <div class="panel wide" role="dialog" aria-labelledby="missions-title">
      <h2 id="missions-title" data-i18n="missions"></h2>
      <p class="sub" id="msub"></p>
      <div class="list" id="mlist"></div>
      <div class="row"><button type="button" class="btn primary" id="mback" data-i18n="back"></button></div>
    </div>
  </div>

  <div class="overlay" id="shop" hidden>
    <div class="panel wide" role="dialog" aria-labelledby="shop-title">
      <h2 id="shop-title" data-i18n="shop"></h2>
      <p class="sub">🪙 <span id="sBank">0</span></p>
      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" id="tabRunners" aria-selected="true" data-i18n="runners"></button>
        <button type="button" class="tab" role="tab" id="tabUpg" aria-selected="false" data-i18n="upgrades"></button>
      </div>
      <div class="list" id="slist"></div>
      <div class="row"><button type="button" class="btn primary" id="sback" data-i18n="back"></button></div>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="panel" role="dialog" aria-labelledby="paused-title">
      <h2 id="paused-title" data-i18n="paused"></h2>
      <div class="list" id="plist"></div>
      <div class="row"><button type="button" class="btn" id="quit" data-i18n="menu"></button><button type="button" class="btn primary" id="resume" data-i18n="resume"></button></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel" role="dialog" aria-labelledby="over-title">
      <h2 id="over-title"></h2>
      <p class="medal" id="medal">💥</p>
      <div class="scores">
        <div><small data-i18n="score"></small><strong id="oScore">0</strong></div>
        <div><small data-i18n="coins"></small><strong id="oCoins">0</strong></div>
        <div><small data-i18n="best"></small><strong id="oBest">0</strong></div>
      </div>
      <p class="sub" id="oDist"></p>
      <p class="badge" id="newbest" data-i18n="newBest" hidden></p>
      <div class="row"><button type="button" class="btn" id="omenu" data-i18n="menu"></button><button type="button" class="btn primary" id="oretry" data-i18n="retry"></button></div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

      const p = Math.min(m.n, Math.floor(save.mprog[i])), done = p >= m.n;
      const d = document.createElement('div'); d.className = 'item' + (done ? ' done' : '');
      d.innerHTML = `<span class="ic">${done ? '✅' : '🎯'}</span><div><b></b><span>${p} / ${m.n}</span><div class="bar"><i style="width:${p / m.n * 100}%"></i></div></div><span></span>`;
      d.querySelector('b').textContent = t['m_' + m.k](m.n);
      el.appendChild(d);
    });
  }
  function showMissions() { hideAll(); $('missions').hidden = false; $('msub').textContent = t.setInfo(multBase() + 1); missionRows($('mlist')); $('mback').focus(); }
  let shopTab = 'runners';
  function showShop(focusId) {
    hideAll(); $('shop').hidden = false; $('sBank').textContent = save.bank;
    $('tabRunners').setAttribute('aria-selected', shopTab === 'runners'); $('tabUpg').setAttribute('aria-selected', shopTab !== 'runners');
    const el = $('slist'); el.textContent = '';
    const add = (icHtml, title, sub, label, enabled, onClick, id) => {
      const d = document.createElement('div'); d.className = 'item';
      d.innerHTML = `<span class="ic">${icHtml}</span><div><b></b><span class="desc"></span></div><button type="button" class="btn${enabled ? ' primary' : ''}"></button>`;
      d.querySelector('b').textContent = title; d.querySelector('.desc').textContent = sub;
      const b = d.querySelector('button'); b.textContent = label; b.disabled = !enabled; b.id = id; b.addEventListener('click', onClick);
      el.appendChild(d);
    };
    if (shopTab === 'runners') RUNNERS.forEach((R, i) => {
      const owned = save.owned.includes(i), cur = save.char === i;
      add(`<i class="swatch" style="display:block;background:${R.body};border:4px solid ${R.hat}"></i>`, R.name, owned ? '' : '🪙 ' + R.price,
        cur ? t.selected : owned ? t.select : t.buy, !cur && (owned || save.bank >= R.price), () => {
          if (!owned) { save.bank -= R.price; save.owned.push(i); }
          save.char = i; persist(); showShop('r' + i);
        }, 'r' + i);
    });
    else POWER_KEYS.forEach(k => {
      const lvl = save.upg[k], maxed = lvl >= 5, cost = maxed ? 0 : upgCost(lvl);
      add(POWERS[k].ic, t[k], t.level(lvl, powerTime(k)) + (maxed ? '' : ' · 🪙 ' + cost), maxed ? t.max : t.buy, !maxed && save.bank >= cost, () => {
        save.bank -= cost; save.upg[k]++; persist(); showShop('u' + k);
      }, 'u' + k);
    });
    const f = focusId && $(focusId); (f && !f.disabled ? f : $('sback')).focus();
  }
  function pause() { if (S.state !== 'play') return; S.state = 'paused'; missionRows($('plist')); $('paused').hidden = false; $('resume').focus(); }
  function resume() { if (S.state !== 'paused') return; S.state = 'play'; $('paused').hidden = true; last = performance.now(); canvas.focus({ preventScroll: true }); }

  $('play').addEventListener('click', () => startRun());
  $('openMissions').addEventListener('click', showMissions);
  $('openShop').addEventListener('click', () => showShop());
  $('mback').addEventListener('click', showMenu);
  $('sback').addEventListener('click', showMenu);
  $('tabRunners').addEventListener('click', () => { shopTab = 'runners'; showShop('tabRunners'); });
  $('tabUpg').addEventListener('click', () => { shopTab = 'upg'; showShop('tabUpg'); });
  $('pause').addEventListener('click', pause);
  $('resume').addEventListener('click', resume);
  $('quit').addEventListener('click', () => { persist(); showMenu(); });
  $('omenu').addEventListener('click', showMenu);
  $('oretry').addEventListener('click', () => startRun());
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  const KEYS = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', ArrowDown: 'roll', KeyS: 'roll' };
  addEventListener('keydown', e => {
    if (e.code === 'KeyP' && (S.state === 'play' || S.state === 'paused')) { S.state === 'play' ? pause() : resume(); e.preventDefault(); return; }
    const a = KEYS[e.code]; if (!a || S.state !== 'play') return;
    e.preventDefault(); if (!e.repeat) act(a);
  });

  // Swipes anywhere on the track; a plain tap jumps.
  const swipe = new Map();
  canvas.addEventListener('pointerdown', e => { if (S.state !== 'play') return; swipe.set(e.pointerId, { x: e.clientX, y: e.clientY, done: false }); try { canvas.setPointerCapture(e.pointerId); } catch {} e.preventDefault(); });
  canvas.addEventListener('pointermove', e => {
    const s = swipe.get(e.pointerId); if (!s || s.done) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y, th = Math.max(18, Math.min(view.w, view.h) * 0.05);
    if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
    s.done = true; act(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'jump' : 'roll'));
  });
  const up = e => { const s = swipe.get(e.pointerId); if (s && !s.done && e.type === 'pointerup') act('jump'); swipe.delete(e.pointerId); };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__railRush = {
    state: () => ({ state: S.state, p: P && { lane: P.lane, x: P.x, y: P.y, z: P.z, v: P.v, roll: P.roll, ground: P.ground, power: { ...P.power }, stumbleT: P.stumbleT, score: P.score, coins: P.coins, dead: P.dead, why: P.why }, save: JSON.parse(JSON.stringify(save)), missions: missions.map(m => ({ k: m.k, n: m.n })) }),
    ahead: d => objs.filter(o => o.z0 + o.len > P.z - 1 && o.z0 < P.z + d).map(o => ({ k: o.k, lane: o.lane, z0: o.z0, len: o.len, sp: o.sp, ramp: o.ramp, top: o.top })),
    coinsAhead: d => coins.filter(c => c.z > P.z && c.z < P.z + d).length,
    act,
    give: k => { P.power[k] = powerTime(k); },
    // Advance the fixed-step simulation synchronously (deterministic bot runs).
    tick: (sec, policy) => { const n = Math.round(sec / STEP); for (let i = 0; i < n && S.state === 'play'; i++) { if (policy && i % 6 === 0) policy(); step(STEP); } return S.state; },
    start: seed => startRun(seed),
  };

  new ResizeObserver(resize).observe(app);
  newWorld(12345);
  resize();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
