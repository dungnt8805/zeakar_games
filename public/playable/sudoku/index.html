<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku</title>
<style>
:root {
  --bg: #e9edfb;
  --ink: #262a45;
  --muted: #6c7294;
  --paper: #ffffff;
  --accent: #4f5fd9;
  --accent-dark: #3a48b5;
  --line: #ccd3ee;
  --line-strong: #3b4272;
  --peer: #e2e7fc;
  --same: #c3cdfa;
  --selected: #aebcf8;
  --wrong: #e5484d;
  --wrong-bg: #ffe3e3;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: linear-gradient(#dfe4f8 1px, transparent 1px), linear-gradient(90deg, #dfe4f8 1px, transparent 1px);
  background-size: 26px 26px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button, a { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; }
h1 { font-size: clamp(24px, 7vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1; }
h1 span { color: var(--accent); }
.chip { padding: 4px 10px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; }
.spacer { flex: 1; }
.chip:empty { display: none; }
.new { flex-shrink: 0; padding: 9px 13px; border-radius: 12px; background: var(--paper); color: var(--accent-dark); font-size: 14px; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.new:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

.hud { display: flex; gap: 8px; }
.stat { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 14px; background: #ffffffc0; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.25; }
.stat.danger strong { color: var(--wrong); }
.pause { flex: 0 0 auto; width: 48px; border-radius: 14px; background: #ffffffc0; display: grid; place-items: center; }
.pause svg { width: 20px; height: 20px; }

.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.board { --size: min(100cqw, 100cqh); width: var(--size); height: var(--size); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 3px; padding: 3px; border-radius: 14px; background: var(--line-strong); box-shadow: 0 12px 30px #3b427230; }
.box { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 1px; background: var(--line); overflow: hidden; }
.box:nth-child(1) { border-top-left-radius: 11px; }
.box:nth-child(3) { border-top-right-radius: 11px; }
.box:nth-child(7) { border-bottom-left-radius: 11px; }
.box:nth-child(9) { border-bottom-right-radius: 11px; }
.cell { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; background: var(--paper); font-size: calc(var(--size) * .066); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); transition: background-color .12s; }
.cell:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: -3px; }
.cell.peer { background: var(--peer); }
.cell.same { background: var(--same); }
.cell.selected { background: var(--selected); }
.cell.given { color: var(--ink); font-weight: 800; }
.cell.hinted { color: #0f8f7a; }
.cell.wrong { color: var(--wrong); background: var(--wrong-bg); }
.cell.wrong.selected { background: #ffc9c9; }
.cell.pop .v { animation: pop .25s; }
.cell.shake { animation: shake .3s; }
@keyframes pop { 50% { transform: scale(1.3); } }
@keyframes shake { 25% { transform: translateX(-8%); } 75% { transform: translateX(8%); } }
.board.reveal .cell.wrong { animation: flash 1s ease-in-out 2; }
@keyframes flash { 50% { background: #ff9d9d; } }
.notes { position: absolute; inset: 6%; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); font-size: calc(var(--size) * .026); font-weight: 700; color: var(--muted); line-height: 1; }
.notes i { display: grid; place-items: center; font-style: normal; border-radius: 30%; }
.notes i.hit { background: var(--accent); color: #fff; }
.board.won .cell { animation: wave .5s calc(var(--d) * 30ms) both; }
@keyframes wave { 50% { transform: scale(.85); background: #c8f2e6; } }
.board.paused .cell > * { visibility: hidden; }

.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tool { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 6px; border-radius: 14px; background: #ffffffc0; color: var(--muted); font-size: 11px; font-weight: 800; line-height: 1.15; }
.tool svg { width: 22px; height: 22px; color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent); color: #fff; }
.tool[aria-pressed="true"] svg { color: #fff; }
.tool:disabled { opacity: .45; cursor: default; }
.count { position: absolute; top: 4px; right: calc(50% - 24px); min-width: 17px; padding: 1px 4px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 10px; line-height: 15px; }
.tool:active:not(:disabled) { transform: translateY(1px); }

.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
.key { position: relative; height: clamp(46px, 8.5vh, 62px); border-radius: 12px; background: var(--paper); color: var(--accent-dark); font-size: clamp(22px, 6.5vw, 30px); font-weight: 800; box-shadow: 0 3px 0 var(--line); transition: opacity .2s; }
.key small { position: absolute; bottom: 3px; left: 0; right: 0; font-size: 9px; font-weight: 700; color: var(--muted); }
.key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.key.done { opacity: .3; }
.pad.noting .key { color: var(--muted); font-size: clamp(16px, 4.6vw, 21px); }
.endbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 16px; background: var(--paper); }
.endbar[hidden], .tools[hidden], .pad[hidden] { display: none; }
.endbar strong { flex: 1; color: var(--wrong); font-size: 16px; }
.endbar button { padding: 10px 14px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; }
.endbar button.ghost { background: transparent; color: var(--accent-dark); border: 2px solid var(--line); }

.overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); background: #262a4566; overflow: auto; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 380px); background: var(--paper); border-radius: 26px; padding: 24px 20px; text-align: center; box-shadow: 0 20px 50px #0004; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: var(--accent); }
.panel .emoji { font-size: 44px; line-height: 1.2; }
.panel p { margin-top: 8px; color: var(--muted); font-size: 15px; line-height: 1.4; }
.panel .result { color: var(--ink); font-size: 18px; font-weight: 800; }
.levels { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.level { padding: 14px 8px; border-radius: 16px; background: var(--peer); border: 2px solid transparent; }
.level strong { display: block; font-size: 17px; font-weight: 900; color: var(--accent-dark); }
.level small { display: block; margin-top: 3px; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.level:hover { border-color: var(--selected); }
.level.current { border-color: var(--accent); }
.badge { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 99px; background: #f2a93b; color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 20px; width: 100%; padding: 15px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 800; box-shadow: 0 5px 0 var(--accent-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.secondary { margin-top: 10px; width: 100%; padding: 12px; border-radius: 14px; border: 2px solid var(--line); color: var(--accent-dark); font-weight: 800; }
.secondary[hidden] { display: none; }
.panel .keys { margin-top: 14px; font-size: 12px; }
.store-link { display: inline-block; margin-top: 16px; font-size: 14px; font-weight: 700; color: var(--accent-dark); text-underline-offset: 4px; }

.panel { max-height: 100%; overflow-y: auto; }
.notes { font-size: max(8px, calc(var(--size) * .026)); }
.key small { font-size: 10px; bottom: 2px; }
@media (max-width: 380px) {
  .hud { gap: 6px; }
  .stat { padding: 6px 3px; }
  .stat small { letter-spacing: 0; white-space: normal; text-overflow: clip; line-height: 1.15; }
  .pause { width: 42px; }
  .tools { gap: 6px; }
  .tool { padding: 6px 2px 5px; }
  .key { font-size: clamp(22px, 7.2vw, 30px); }
}
@media (max-height: 420px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 16px; border-radius: 20px; }
  .panel h2 { font-size: 22px; }
  .panel .emoji { font-size: 30px; }
  .panel p { margin-top: 4px; font-size: 13px; }
  .levels { margin-top: 10px; gap: 8px; }
  .level { padding: 8px 6px; }
  .level strong { font-size: 15px; }
  .cta { margin-top: 12px; padding: 11px; font-size: 16px; }
  .secondary { margin-top: 8px; padding: 9px; }
  .panel .keys { margin-top: 8px; }
  .store-link { margin-top: 10px; }
}
/* Landscape / short screens: board on the left sized from height, controls in a side column */
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .app { --bs: min(calc(100dvh - 20px), calc(100vw - 290px)); max-width: 980px; display: grid; grid-template-columns: var(--bs) minmax(0, 1fr); grid-template-rows: repeat(5, auto) 1fr; grid-auto-flow: column; gap: 8px 18px; padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
  .board-wrap { grid-column: 1; grid-row: 1 / -1; width: var(--bs); height: var(--bs); align-self: center; }
  .top, .hud, .tools, .pad, .endbar { grid-column: 2; }
  .top { grid-row: 1; } .hud { grid-row: 2; } .tools { grid-row: 3; } .pad { grid-row: 4; } .endbar { grid-row: 5; }
  .endbar { flex-wrap: wrap; }
  .stat strong { font-size: 16px; }
  .top { flex-wrap: wrap; row-gap: 6px; }
  h1 { font-size: 26px; }
  .new { padding: 8px 11px; font-size: 13px; }
  .hud { gap: 6px; }
  .stat { padding: 4px 2px; }
  .stat small { letter-spacing: 0; white-space: normal; text-overflow: clip; line-height: 1.15; }
  .pause { width: 42px; }
  .tools { gap: 6px; }
  .tool { padding: 5px 2px; }
  .tool svg { width: 18px; height: 18px; }
  .pad { grid-template-columns: repeat(5, 1fr); }
  .key { height: 40px; font-size: 22px; }
  .pad.noting .key { font-size: 17px; }
}
@media (max-height: 480px) and (min-aspect-ratio: 4/3) and (min-width: 740px) {
  .app { --bs: min(calc(100dvh - 20px), calc(100vw - 440px)); }
  .tool { flex-direction: row; justify-content: center; gap: 5px; padding: 8px 4px; }
  .count { top: -5px; right: -3px; }
  .pad { grid-template-columns: repeat(9, 1fr); }
  .key { height: 48px; }
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>Su<span>doku</span></h1>
    <span class="chip" id="chip"></span>
    <span class="spacer"></span>
    <button type="button" class="new" id="new" data-i18n="newGame"></button>
  </div>
  <div class="hud">
    <div class="stat" id="mistakes-stat"><small data-i18n="mistakes"></small><strong id="mistakes">0/3</strong></div>
    <div class="stat"><small data-i18n="time"></small><strong id="time">0:00</strong></div>
    <div class="stat"><small data-i18n="best"></small><strong id="best">—</strong></div>
    <button type="button" class="pause" id="pause" data-i18n-label="pause">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
  </div>
  <div class="board-wrap">
    <div class="board" id="board" role="grid" data-i18n-label="board"></div>
  </div>
  <div class="tools" id="tools">
    <button type="button" class="tool" id="undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span data-i18n="undo"></span>
    </button>
    <button type="button" class="tool" id="erase">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20H8.5L4 15.5a2 2 0 0 1 0-2.8L13.2 3.5a2 2 0 0 1 2.8 0l4.5 4.5a2 2 0 0 1 0 2.8L11 20"/><path d="m9 9 7 7"/></svg>
      <span data-i18n="erase"></span>
    </button>
    <button type="button" class="tool" id="notes" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="m14 6 3 3"/></svg>
      <span data-i18n="notes"></span>
    </button>
    <button type="button" class="tool" id="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.9.7 1.4 1.6 1.4 2.7h4.4c0-1.1.5-2 1.4-2.7A6 6 0 0 0 12 3z"/></svg>
      <span data-i18n="hint"></span>
      <b class="count" id="hint-count" aria-hidden="true">3</b>
    </button>
  </div>
  <div class="pad" id="pad"></div>
  <div class="endbar" id="endbar" hidden>
    <strong data-i18n="lost"></strong>
    <button type="button" class="ghost" id="end-retry" data-i18n="retry"></button>
    <button type="button" id="end-new" data-i18n="newGame"></button>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <h2 id="start-title">Su<span>doku</span></h2>
    <p data-i18n="tagline"></p>
    <div class="levels" id="levels" role="group" data-i18n-label="choose"></div>
    <button type="button" class="secondary" id="back" data-i18n="back" hidden></button>
    <p class="keys" data-i18n="keys"></p>
  </div>
</div>

<div class="overlay" id="paused" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="paused-title">
    <p class="emoji" aria-hidden="true">☕</p>
    <h2 id="paused-title" data-i18n="paused"></h2>
    <p class="result" id="paused-time"></p>
    <button type="button" class="cta" id="resume" data-i18n="resume"></button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🎉</p>
    <h2 id="win-title" data-i18n="won"></h2>
    <p class="result" id="win-result"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="again" data-i18n="again"></button>
    <button type="button" class="secondary" id="win-change" data-i18n="change"></button>
    <a class="store-link" href="https://play.google.com/store/apps/details?id=com.zeakar.games.sudoku" target="_blank" rel="noopener noreferrer"><span data-i18n="full"></span> ↗</a>
  </div>
</div>

<div class="overlay" id="lost" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="lost-title">
    <p class="emoji" aria-hidden="true">💥</p>
    <h2 id="lost-title" data-i18n="lost"></h2>
    <p data-i18n="lostText"></p>
    <button type="button" class="cta" id="retry" data-i18n="retry"></button>
    <button type="button" class="secondary" id="lost-new" data-i18n="newGame"></button>
    <button type="button" class="secondary" id="review" data-i18n="review"></button>
    <a class="store-link" href="https://play.google.com/store/apps/details?id=com.zeakar.games.sudoku" target="_blank" rel="noopener noreferrer"><span data-i18n="full"></span> ↗</a>
  </div>
</div>

    }
    for (let d = 1; d <= 9; d++) {
      const left = 9 - placedCount(d);
      keyEls[d].classList.toggle('done', left === 0);
      keyEls[d].lastChild.textContent = left || '';
      keyEls[d].setAttribute('aria-label', t.remaining(d, left));
    }
    els.mistakes.textContent = `${game.mistakes}/${MAX_MISTAKES}`;
    els.mistakesStat.classList.toggle('danger', game.mistakes > 0);
    els.hintCount.textContent = String(game.hints);
    els.hint.disabled = game.hints === 0;
    els.hint.setAttribute('aria-label', `${t.hint}: ${t.hintsLeft(game.hints)}`);
    els.undo.disabled = !game.history.length;
    const best = readBest()[game.level];
    els.best.textContent = best ? formatTime(best) : '—';
  }

  function select(i, focus) {
    if (!game || i < 0) return;
    game.selected = i;
    render();
    if (focus || document.activeElement?.classList.contains('cell')) cellEls[i].focus({ preventScroll: true });
  }

  function animateCell(i, name) {
    const el = cellEls[i];
    el.classList.remove(name);
    void el.offsetWidth;
    el.classList.add(name);
  }

  const isLocked = i => game.fixed[i] || game.value[i] === game.solution[i];
  const snapshot = list => list.map(i => ({ i, value: game.value[i], notes: game.notes[i] }));

  function setNotesMode(on, silent) {
    game.notesMode = on;
    els.notes.setAttribute('aria-pressed', String(on));
    els.pad.classList.toggle('noting', on);
    if (!silent) announce(on ? t.notesOn : t.notesOff);
  }

  function input(d) {
    if (!game || game.state !== 'play' || modal) return;
    const i = game.selected;
    if (i < 0 || isLocked(i)) return;
    const bit = 1 << d;
    if (game.notesMode) {
      if (game.value[i]) return;
      game.history.push(snapshot([i]));
      game.notes[i] ^= bit;
      render();
      return;
    }
    if (game.value[i] === d) return;
    const correct = d === game.solution[i];
    // A correct number also clears that pencil mark from its row, column and box.
    const touched = correct ? [i, ...PEERS[i].filter(j => !game.value[j] && game.notes[j] & bit)] : [i];
    game.history.push(snapshot(touched));
    game.value[i] = d;
    game.notes[i] = 0;
    if (correct) {
      for (const j of touched) game.notes[j] &= ~bit;
      render();
      animateCell(i, 'pop');
      if (placedCount(d) === 9) announce(t.complete(d));
      checkWin();
    } else {
      game.mistakes++;
      render();
      animateCell(i, 'shake');
      announce(t.mistake(game.mistakes));
      if (game.mistakes >= MAX_MISTAKES) lose();
    }
  }

  function erase() {
    if (!game || game.state !== 'play' || modal) return;
    const i = game.selected;
    if (i < 0 || isLocked(i) || (!game.value[i] && !game.notes[i])) return;
    game.history.push(snapshot([i]));
    game.value[i] = 0;
    game.notes[i] = 0;
    render();
  }

  function undo() {
    if (!game || game.state !== 'play' || modal || !game.history.length) return;
    const entry = game.history.pop();
    // Cells filled by a hint since then stay solved.
    for (const s of entry) if (game.fixed[s.i] !== 2) { game.value[s.i] = s.value; game.notes[s.i] = s.notes; }
    game.selected = entry[0].i;
    render();
    cellEls[game.selected].focus({ preventScroll: true });
  }

  function hint() {
    if (!game || game.state !== 'play' || modal) return;
    if (!game.hints) return announce(t.noHints);
    const sel = game.selected;
    let i = sel >= 0 && !isLocked(sel) ? sel : -1;
    if (i < 0) {
      const open = [...Array(81).keys()].filter(j => game.value[j] !== game.solution[j]);
      if (!open.length) return;
      i = open[Math.floor(Math.random() * open.length)];
    }
    const d = game.solution[i];
    game.value[i] = d;
    game.notes[i] = 0;
    game.fixed[i] = 2;
    for (const j of PEERS[i]) game.notes[j] &= ~(1 << d);
    game.hints--;
    select(i, true);
    animateCell(i, 'pop');
    announce(`${t.cell(ROW_OF[i] + 1, COL_OF[i] + 1)}: ${d}. ${t.hintsLeft(game.hints)}`);
    checkWin();
  }

  function checkWin() {
    for (let i = 0; i < 81; i++) if (game.value[i] !== game.solution[i]) return;
    game.state = 'won';
    game.selected = -1;
    render();
    const all = readBest();
    const isBest = !all[game.level] || game.elapsed < all[game.level];
    if (isBest) { all[game.level] = Math.round(game.elapsed); writeBest(all); }
    els.best.textContent = formatTime(all[game.level]);
    els.time.textContent = formatTime(game.elapsed);
    els.winResult.textContent = t.result(t.levels[game.level], formatTime(game.elapsed));
    els.newBest.hidden = !isBest;
    els.board.classList.add('won');
    announce(`${t.won} ${els.winResult.textContent}`);
    setTimeout(() => showOverlay('win', $('again')), 900);
  }

  function lose() {
    game.state = 'lost';
    announce(`${t.lost}. ${t.lostText}`);
    setTimeout(() => showOverlay('lost', $('retry')), 500);
  }

  function reviewBoard() {
    hideOverlays();
    els.tools.hidden = true;
    els.pad.hidden = true;
    els.endbar.hidden = false;
    els.board.classList.remove('reveal');
    void els.board.offsetWidth;
    els.board.classList.add('reveal');
    $('end-retry').focus({ preventScroll: true });
  }

  function retry() { startGame(game.level, { puzzle: game.puzzle, solution: game.solution }); }

  function setPaused(paused) {
    if (!game || game.state !== 'play') return;
    els.board.classList.toggle('paused', paused);
    if (paused) {
      els.pausedTime.textContent = `${t.levels[game.level]} · ${formatTime(game.elapsed)}`;
      showOverlay('paused', $('resume'));
    } else {
      hideOverlays();
      if (game.selected >= 0) cellEls[game.selected].focus({ preventScroll: true });
    }
  }

  function moveSelection(dr, dc) {
    const sel = game.selected >= 0 ? game.selected : 40;
    const r = (ROW_OF[sel] + dr + 9) % 9, c = (COL_OF[sel] + dc + 9) % 9;
    select(game.selected >= 0 ? r * 9 + c : sel, true);
  }

  const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  document.addEventListener('keydown', event => {
    if (!game || game.state !== 'play' || modal || event.altKey) return;
    const key = event.key;
    if ((event.ctrlKey || event.metaKey) && (key === 'z' || key === 'Z')) { event.preventDefault(); undo(); return; }
    if (event.ctrlKey || event.metaKey) return;
    if (/^[1-9]$/.test(key)) { event.preventDefault(); input(Number(key)); }
    else if (ARROWS[key]) { event.preventDefault(); moveSelection(...ARROWS[key]); }
    else if (key === 'Backspace' || key === 'Delete' || key === '0') { event.preventDefault(); erase(); }
    else if (key === 'n' || key === 'N') { event.preventDefault(); setNotesMode(!game.notesMode); }
  });

  els.board.addEventListener('focusin', event => {
    const i = cellEls.indexOf(event.target);
    if (i >= 0 && i !== game?.selected && game?.state === 'play') select(i);
  });
  $('new').addEventListener('click', openStart);
  $('pause').addEventListener('click', () => setPaused(true));
  $('resume').addEventListener('click', () => setPaused(false));
  els.notes.addEventListener('click', () => { if (game?.state === 'play') setNotesMode(!game.notesMode); });
  els.erase.addEventListener('click', erase);
  els.undo.addEventListener('click', undo);
  els.hint.addEventListener('click', hint);
  els.back.addEventListener('click', () => { hideOverlays(); if (game.selected >= 0) cellEls[game.selected].focus({ preventScroll: true }); });
  $('again').addEventListener('click', () => startGame(game.level));
  $('win-change').addEventListener('click', openStart);
  $('retry').addEventListener('click', retry);
  $('end-retry').addEventListener('click', retry);
  $('lost-new').addEventListener('click', openStart);
  $('end-new').addEventListener('click', openStart);
  $('review').addEventListener('click', reviewBoard);

  buildBoard();
  openStart();
})();
</script>
</body>
</html>
