<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>High Low</title>
<style>
:root {
  --bg: #110a1e;
  --felt: #4b2b8f;
  --felt-dark: #1d0e44;
  --felt-light: #6d4cc4;
  --rail: #6b3d22;
  --rail-light: #9a5f37;
  --text: #f6f2ff;
  --muted: #c3b4e4;
  --gold: #f6c95b;
  --gold-dark: #b98a22;
  --win: #46d483;
  --lose: #ff6b6b;
  --hi: #4fdc95;
  --lo: #ff8578;
  --red: #d22a3f;
  --ink: #1b2130;
  --plate: #00000038;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: radial-gradient(120% 70% at 50% 0%, #2a1650, var(--bg) 70%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Portrait: one stacked column. Wide: play column on the left, info column (.side) on the right. */
.app { height: 100%; max-width: min(700px, 100%); margin: auto; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto auto auto auto; grid-template-areas: "top" "hud" "felt" "hist" "track" "msg" "controls"; gap: 6px; padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.side { display: contents; }
.top { grid-area: top; display: flex; align-items: center; gap: 8px; min-width: 0; }
.hud { grid-area: hud; }
.hist { grid-area: hist; }
.track { grid-area: track; }
.felt { grid-area: felt; }
.msg { grid-area: msg; }
.controls { grid-area: controls; }
.ladder { display: none; }

h1 { flex: 1; min-width: 0; font-size: clamp(20px, 6.2vw, 28px); font-weight: 900; letter-spacing: -.03em; line-height: 1; color: var(--gold); text-shadow: 0 2px 0 #0006; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modes { display: flex; padding: 3px; border-radius: 12px; background: #00000040; }
.modes button { padding: 6px 10px; border-radius: 9px; font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.modes button[aria-pressed="true"] { background: var(--gold); color: #2b1f04; }
.modes button:disabled:not([aria-pressed="true"]) { opacity: .45; }
.icon { width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; background: #00000040; font-size: 16px; font-weight: 900; color: var(--muted); }
.icon:hover { color: var(--gold); }
.icon svg { width: 18px; height: 18px; }

.hud { display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 4px 4px 5px; border-radius: 12px; background: var(--plate); text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat:first-child strong { color: var(--gold); }
.stat.bump strong { animation: bump .35s; }
@keyframes bump { 40% { scale: 1.18; } }

/* ---------- felt ---------- */
.felt { --cw: 90px; position: relative; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px 52px 12px 12px; border: 7px solid var(--rail); border-radius: 30px; background: radial-gradient(#ffffff08 1px, transparent 1.5px) 0 0 / 5px 5px, radial-gradient(110% 90% at 50% 20%, var(--felt-light), var(--felt) 45%, var(--felt-dark)); box-shadow: inset 0 0 0 2px #00000030, inset 0 0 40px #0007, 0 0 0 2px var(--rail-light), 0 14px 30px #0008; overflow: hidden; }
.felt.short { gap: 6px; padding-top: 8px; padding-bottom: 8px; }
.flash { position: absolute; inset: 0; border-radius: 22px; pointer-events: none; opacity: 0; }
.flash.win { animation: flash .75s ease-out; box-shadow: inset 0 0 0 4px var(--win), inset 0 0 70px #46d483aa; }
.flash.lose { animation: flash .75s ease-out; box-shadow: inset 0 0 0 4px var(--lose), inset 0 0 70px #ff6b6baa; }
.flash.gold { animation: flash 1s ease-out; box-shadow: inset 0 0 0 4px var(--gold), inset 0 0 80px #f6c95bbb; }
@keyframes flash { 15% { opacity: 1; } }
.felt.shake { animation: shake .36s; }
@keyframes shake { 20% { translate: -6px 0; } 45% { translate: 5px 0; } 70% { translate: -3px 0; } }

.stage { display: flex; align-items: center; justify-content: center; gap: calc(var(--cw) * .16); }
.pile { position: relative; flex: none; width: calc(var(--cw) * .6); height: calc(var(--cw) * .84); border-radius: calc(var(--cw) * .07); background: repeating-linear-gradient(45deg, #ffffff22 0 2px, transparent 2px 6px), linear-gradient(160deg, #22b8a8, #0c6f69); box-shadow: inset 0 0 0 calc(var(--cw) * .035) #fff, 2px 2px 0 #e9e4da, 3px 3px 0 #0c6f69, 5px 5px 0 #e9e4da, 6px 6px 0 #0c6f69, 0 8px 14px #0007; }
.pile.empty { background: none; box-shadow: inset 0 0 0 2px #ffffff40; }
.pile b { position: absolute; left: 50%; top: 50%; translate: -50% -50%; min-width: 28px; padding: 2px 7px; border-radius: 99px; background: #170c33e6; font-size: clamp(11px, calc(var(--cw) * .13), 15px); font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
.slot { position: relative; flex: none; width: var(--cw); height: calc(var(--cw) * 1.4); perspective: calc(var(--cw) * 7); }
.ph { width: 100%; height: 100%; display: grid; place-items: center; border-radius: calc(var(--cw) * .1); border: 2px dashed #ffffff40; font-size: calc(var(--cw) * .42); font-weight: 900; color: #ffffff38; }
.slot.cur .ph { font-size: calc(var(--cw) * .16); padding: 8%; text-align: center; color: #ffffff59; }

.card { position: relative; flex: none; width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1); background: linear-gradient(#fff, #f6f2ea); color: var(--ink); box-shadow: 0 3px 8px #0006, 0 0 0 .5px #0003; }
.card.red { color: var(--red); }
.ci { position: absolute; left: 7%; top: 4%; display: flex; flex-direction: column; align-items: center; font-weight: 900; line-height: .95; font-size: calc(var(--cw) * .3); letter-spacing: -.08em; }
.ci i { font-style: normal; font-size: .82em; letter-spacing: 0; }
.cs { position: absolute; inset: 0; display: grid; place-items: center; padding: 18% 0 0 16%; font-size: calc(var(--cw) * .55); line-height: 1; }
.cs.face { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: calc(var(--cw) * .5); }
.cs.face::after { content: ""; position: absolute; left: 32%; right: 12%; top: 28%; bottom: 10%; border-radius: calc(var(--cw) * .06); border: 1.5px solid currentColor; opacity: .25; }
.card.down { background: repeating-linear-gradient(45deg, #ffffff22 0 2px, transparent 2px 7px), repeating-linear-gradient(-45deg, #ffffff22 0 2px, transparent 2px 7px), linear-gradient(160deg, #22b8a8, #0c6f69); box-shadow: inset 0 0 0 calc(var(--cw) * .06) #fff, 0 3px 8px #0006; }
.card.down > * { display: none; }
.card.ok { box-shadow: 0 0 0 3px var(--win), 0 0 22px #46d48399, 0 3px 8px #0006; }
.card.bad { box-shadow: 0 0 0 3px var(--lose), 0 0 22px #ff6b6b99, 0 3px 8px #0006; }
/* Flip card: the face sits on the front, the back is turned away; rotating the wrapper reveals the face. */
.fc { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .42s cubic-bezier(.3, .7, .3, 1); }
.fc.back { transform: rotateY(180deg); }
.fc > .card { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.fc > .card.down { transform: rotateY(180deg); }
.deal { animation: deal .26s cubic-bezier(.2, .8, .3, 1) backwards; }
.slide { animation: slide .26s cubic-bezier(.2, .8, .3, 1) backwards; }
@keyframes deal { from { opacity: 0; translate: calc(var(--cw) * -1.3) 0; rotate: -8deg; scale: .6; } }
@keyframes slide { from { translate: calc(var(--cw) * 1.16) 0; } }

.res { position: absolute; left: 50%; bottom: calc(var(--cw) * -.1); z-index: 5; translate: -50% 0; padding: 4px 10px; border-radius: 99px; background: #1b2130f0; box-shadow: 0 4px 12px #0008; font-size: clamp(11px, calc(var(--cw) * .13), 17px); font-weight: 900; white-space: nowrap; pointer-events: none; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.res.ok { background: var(--win); color: #062a17; }
.res.bad { background: var(--lose); color: #fff; }
@keyframes pop { from { scale: .3; opacity: 0; } }

.oddsbar { flex: none; display: flex; gap: 2px; width: calc(var(--cw) * 2.92); height: 8px; border-radius: 99px; overflow: hidden; background: #0000004d; }
.oddsbar i { height: 100%; transition: flex-grow .35s; }
.oddsbar .lo { background: var(--lo); }
.oddsbar .sa { background: var(--gold); }
.oddsbar .hi { background: var(--hi); }
.oddsbar[hidden] { display: none; }
.rules { flex: none; max-width: calc(var(--cw) * 3.2); font-size: 11px; font-weight: 800; letter-spacing: .05em; line-height: 1.35; text-align: center; text-transform: uppercase; color: #f6c95bc4; }
.felt.short .rules { display: none; }

.meter { position: absolute; right: 9px; top: 14px; bottom: 14px; width: 36px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.meter b { font-size: 11px; font-weight: 900; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mtrack { position: relative; flex: 1; width: 12px; border-radius: 99px; background: #0000004d; box-shadow: inset 0 0 0 1px #ffffff1f; }
.mfill { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--f, 0) * 100%); min-height: 12px; border-radius: 99px; background: linear-gradient(to top, var(--gold-dark), var(--gold), #fff1b8); box-shadow: 0 0 10px #f6c95b88; transition: height .5s cubic-bezier(.3, 1.3, .5, 1); }
.mtick { position: absolute; left: -4px; right: -4px; bottom: calc(var(--p) * 100%); height: 2px; border-radius: 1px; background: #ffffff59; }
.mtick.best { background: var(--gold); height: 3px; left: -6px; right: -6px; }

.intro { position: absolute; inset: 12px 52px 12px 12px; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px; text-align: center; overflow: hidden; }
.intro[hidden] { display: none; }
.intro h2 { font-size: clamp(20px, 4.4vw, 30px); font-weight: 900; color: var(--gold); text-shadow: 0 2px 0 #0006; }
.intro p { max-width: 400px; font-size: 14px; font-weight: 700; line-height: 1.45; color: var(--text); }
.intro .tags { font-size: 12px; font-weight: 800; letter-spacing: .04em; color: var(--muted); }
.intro .big { font-size: 15px; font-weight: 900; color: var(--gold); }
.felt.short .intro { gap: 4px; padding: 4px; }
.felt.short .intro p { font-size: 12px; line-height: 1.3; }
.felt.tiny .intro p { display: none; }
.felt.idle .stage, .felt.idle .oddsbar, .felt.idle .rules { visibility: hidden; }

.toast { position: absolute; left: 50%; top: 14px; z-index: 20; translate: -50% 0; max-width: 80%; padding: 6px 14px; border-radius: 99px; background: #000000c4; font-size: 13px; font-weight: 800; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

/* ---------- info boxes ---------- */
.box { min-width: 0; border-radius: 12px; background: var(--plate); padding: 5px 6px; }
.box h3 { display: none; margin-bottom: 6px; font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.box h3 span { float: right; color: var(--gold); letter-spacing: 0; }
.strip { display: flex; justify-content: flex-end; gap: 4px; height: 36px; overflow: hidden; }
.strip:empty::before { content: attr(data-empty); align-self: center; margin-right: auto; padding-left: 4px; font-size: 12px; font-weight: 700; color: #c3b4e499; }
.mini { position: relative; flex: none; width: 26px; height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; background: linear-gradient(#fff, #f3efe6); color: var(--ink); font-size: 12px; font-weight: 900; line-height: 1; box-shadow: 0 1px 2px #0007; }
.mini i { font-style: normal; font-size: 11px; }
.mini.red { color: var(--red); }
.mini.ok { box-shadow: inset 0 -4px 0 var(--win), 0 1px 2px #0007; }
.mini.bad { box-shadow: inset 0 -4px 0 var(--lose), 0 1px 2px #0007; }
.mini.skipped { opacity: .45; }
.mini.skipped::after { content: ""; position: absolute; left: 3px; right: 3px; top: 50%; height: 2px; background: #555c; rotate: -30deg; }
.tgrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; }
.tcell { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 0 1px; border-radius: 6px; background: #ffffff12; line-height: 1.1; }
.tcell b { font-size: 12px; font-weight: 900; }
.tcell span { font-size: 11px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.tcell.hi { background: #4fdc9530; }
.tcell.lo { background: #ff857830; }
.tcell.eq { background: #f6c95b3a; box-shadow: inset 0 0 0 1.5px var(--gold); }
.tcell.zero { opacity: .32; }
.track[hidden] { display: none; }

.ladder { flex-direction: column; }
.ladder ol { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3px; padding: 0; list-style: none; overflow: hidden; }
.ladder li { flex: none; display: grid; grid-template-columns: 20px 16px 34px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 8px; background: #ffffff0d; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ladder li:first-child { box-shadow: inset 0 0 0 1.5px #f6c95b99; }
.ladder li .n { font-size: 11px; color: var(--muted); }
.ladder li .g.hi { color: var(--hi); }
.ladder li .g.lo { color: var(--lo); }
.ladder li .g.sa { color: var(--gold); }
.ladder li .c { color: #fff; }
.ladder li .c.red { color: #ff9aa6; }
.ladder li .m { color: var(--muted); font-size: 12px; }
.ladder li b { text-align: right; }
.ladder li.bad { background: #ff6b6b26; }
.ladder li.bad b { color: var(--lose); }
.ladder li.ok b { color: var(--win); }
.ladder li.base { grid-template-columns: minmax(0, 1fr) auto; color: var(--muted); }
.ladder li.base b { color: var(--text); }
.ladder li.empty { display: block; padding: 6px 2px; background: none; box-shadow: none; font-size: 13px; font-weight: 700; color: #c3b4e499; }

/* ---------- controls ---------- */
.msg { min-height: 19px; font-size: 14px; font-weight: 800; text-align: center; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.good { color: var(--win); }
.msg.bad { color: var(--lose); }
.controls { display: grid; container-type: inline-size; }
.bar { grid-area: 1 / 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 7px; }
.bar.off { visibility: hidden; }
.row { display: flex; gap: 7px; }
.row > button { flex: 1; min-width: 0; }
.chips { display: flex; justify-content: center; align-items: center; gap: 7px; }
.chip { position: relative; width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 900; color: #fff; background: radial-gradient(circle, var(--c) 52%, transparent 53%), repeating-conic-gradient(#fff 0 15deg, var(--c) 15deg 45deg); box-shadow: inset 0 0 0 3px var(--c), 0 3px 0 #0007; text-shadow: 0 1px 0 #0008; }
.chip::before { content: ""; position: absolute; inset: 22%; border-radius: 50%; border: 1.5px dashed #ffffffaa; }
.chip:disabled { opacity: .35; }
.chip:not(:disabled):active { translate: 0 2px; box-shadow: inset 0 0 0 3px var(--c), 0 1px 0 #0007; }
.c100 { --c: #252a36; }
.c500 { --c: #7a4dd6; }
.c1000 { --c: #d4900f; }
.c5000 { --c: #b23a2c; }
.c10000 { --c: #168a83; }
.ghost { padding: 0 12px; height: 38px; border-radius: 10px; background: #ffffff14; font-size: 13px; font-weight: 800; color: var(--muted); }
.ghost:not(:disabled):hover { color: var(--gold); }
.ghost:disabled { opacity: .4; }
.btn { height: 46px; padding: 0 8px; border-radius: 12px; font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(#ffd877, var(--gold)); color: #2b1f04; box-shadow: 0 3px 0 var(--gold-dark); }
.btn.small { height: 38px; font-size: 13px; background: #ffffff1c; color: var(--text); box-shadow: 0 2px 0 #00000059; }
.btn.small[aria-pressed="true"] { background: #f6c95b33; color: var(--gold); box-shadow: inset 0 0 0 1.5px var(--gold), 0 2px 0 #00000059; }
.btn.cash { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; background: linear-gradient(#ffd877, var(--gold)); color: #2b1f04; box-shadow: 0 2px 0 var(--gold-dark); }
.btn.cash span, .btn.cash small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.btn.cash small { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.btn:not(:disabled):active { translate: 0 2px; box-shadow: none; }
.btn:disabled { opacity: .35; }
.btn b { margin-left: 4px; padding: 0 5px; border-radius: 99px; background: #00000040; font-size: 12px; }
.btn.pulse { animation: pulse .9s 2; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--gold), 0 0 18px var(--gold); } }
.gbtn { height: 52px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0 4px; border-radius: 12px; font-weight: 900; line-height: 1.1; white-space: nowrap; overflow: hidden; }
.gbtn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: 16px; }
.gbtn small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 800; opacity: .82; font-variant-numeric: tabular-nums; }
.gbtn small:empty { display: none; }
.ar { width: .72em; height: .72em; margin-right: .3em; fill: currentColor; vertical-align: -.03em; }
.ladder .ar { margin: 0; width: 11px; height: 11px; }
@container (max-width: 359px) { .gbtn .pct { display: none; } }
@container (min-width: 520px) and (max-width: 699px) { .gbtn .pct { display: none; } }
.gbtn.hi { background: linear-gradient(#7ff0b4, #34c477); color: #05301b; box-shadow: 0 3px 0 #1d8a50; }
.gbtn.lo { background: linear-gradient(#ffaaa1, #ef6559); color: #3d0905; box-shadow: 0 3px 0 #b2392f; }
.gbtn.sa { flex: .8; background: linear-gradient(#f7f9fc, #d9dfeb); color: var(--ink); box-shadow: 0 3px 0 #8f9ab0; }
.gbtn:not(:disabled):active { translate: 0 2px; box-shadow: none; }
.gbtn:disabled { opacity: .35; }
.idle { justify-content: flex-end; }
.idle .note { min-height: 16px; font-size: 12px; font-weight: 800; text-align: center; color: var(--muted); }
/* Plenty of width: everything on one row. */
@container (min-width: 520px) {
  .bar { flex-direction: row; align-items: stretch; }
  .bar .row { flex: 1; }
  .gbar .row.main { flex: 2.2; }
  .gbar .row:not(.main) { flex: 1.35; }
  .betbar .chips { flex: none; }
  .betbar .btn { flex: 1; height: 50px; }
  .gbar .btn.small { height: 52px; }
  .idle { flex-direction: column; align-items: center; }
  .idle .btn { width: min(420px, 100%); }
}

/* ---------- panels ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 12px; background: #0b0614c9; }
.overlay[hidden] { display: none; }
.panel { width: min(420px, 100%); max-height: calc(100% - 8px); overflow-y: auto; padding: 18px 18px; border-radius: 20px; background: linear-gradient(#2d1a5c, #170c33); box-shadow: 0 0 0 1px #ffffff1a, 0 20px 50px #000a; text-align: center; animation: pop .3s; }
.panel h2 { font-size: 22px; font-weight: 900; color: var(--gold); }
.panel p { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.panel .score { margin-top: 4px; font-size: 40px; font-weight: 900; line-height: 1.1; color: var(--text); font-variant-numeric: tabular-nums; }
.panel .score + p { margin-top: 0; }
.panel .btn { width: 100%; margin-top: 14px; }
.panel h3 { margin-top: 14px; font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-top: 12px; }
.grid div { padding: 6px; border-radius: 10px; background: #00000038; }
.grid small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); }
.grid strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 12px; }
.dots i { width: 12px; height: 12px; border-radius: 3px; background: var(--win); }

    <button type="button" class="icon" id="helpBtn" data-i18n-label="help">?</button>
  </header>

  <section class="felt" id="felt">

    <div class="intro" id="intro" hidden></div>
    <div class="flash" id="flash"></div>
    <div class="toast" id="toast" aria-hidden="true"></div>
  </section>

  <p class="msg" id="msg"></p>

  <div class="controls" id="controls">
    <div class="bar betbar" id="betBar">
      <div class="chips">

        <button type="button" class="gbtn sa" data-g="sa" aria-keyshortcuts="S"><span></span><small></small></button>
        <button type="button" class="gbtn hi" data-g="hi" aria-keyshortcuts="ArrowUp"><span></span><small></small></button>

      <button type="button" class="btn" id="startBtn" aria-keyshortcuts="Enter Space"></button>
    </div>
  </div>

  <aside class="side">

      <div class="stat" id="s1"><small></small><strong></strong></div>
      <div class="stat" id="s2"><small></small><strong></strong></div>
    </div>
    <div class="box ladder" id="ladderBox">

      <ol id="ladderList"></ol>
    </div>
    <div class="box hist">

</div>

<div class="overlay" id="helpPanel" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="helpTitle">

    <ul id="helpList"></ul>
    <button type="button" class="btn" data-close data-i18n="close">Close</button>
  </div>
</div>

<div class="overlay" id="brokePanel" hidden>

  const param = new URLSearchParams(location.search).get('lang');

  const store = {

  const HOUSE = 97; // house factor in percent: payouts are fair odds × 0.97

  const defaultStats = () => ({ rounds: 0, cashOuts: 0, bestCash: 0, bestMult: 0, longest: 0, bestStreak: 0, runs: 0, calls: 0, correct: 0, refills: 0 });

  let bank = Number(store.get('chips', START_BANK));

  let forced = null;

  // ---------- cards and odds ----------
  const rankVal = (r, aceHigh) => (r === 'A' ? (aceHigh ? 14 : 1) : r === 'J' ? 11 : r === 'Q' ? 12 : r === 'K' ? 13 : Number(r));
  const isRed = c => c.s === '♥' || c.s === '♦';
  const cardName = c => `${c.r}${c.s}`;
  function makeDeck(decks) {
    const deck = [];
    for (let d = 0; d < decks; d++) for (const s of SUITS) for (const r of RANKS) deck.push({ r, s });
    return deck;
  }
  function shuffle(deck, rnd = Math.random) {
    for (let i = deck.length - 1; i > 0; i--) {

      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
  }
  // Seeded shuffle for the daily deck: string hash → 32-bit seed → small PRNG.
  function hashSeed(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }

      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;

  }

  const pad2 = n => String(n).padStart(2, '0');

  const today = () => dateKey(new Date());

  function oddsFor(curVal, rest, aceHigh) {
    const o = { n: rest.length, lo: 0, sa: 0, hi: 0 };
    for (const c of rest) {
      const v = rankVal(c.r, aceHigh);
      if (v > curVal) o.hi++; else if (v < curVal) o.lo++; else o.sa++;
    }
    return o;
  }
  const restOf = run => run.deck.slice(run.i);
  const runOdds = run => oddsFor(rankVal(run.cur.r, run.aceHigh), restOf(run), run.aceHigh);

  function newRun(kind) {
    const daily = kind === 'daily';
    const aceHigh = daily ? true : settings.aceHigh;
    const decks = daily ? 1 : settings.decks;
    let deck;
    if (daily) deck = dailyDeck(today());
    else if (forced) { deck = forced; forced = null; }

    return { kind, deck, i: 0, cur: null, seen: [], steps: [], skips: SKIPS, active: true, aceHigh, decks, pending: null, curAnim: '', streak: 0, stake: 0, pot: 0, date: daily ? today() : '' };
  }

  // ---------- daily persistence ----------
  function saveDaily(call = '') {

  function nextDeckText() {

    const mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);

  // ---------- rendering ----------
  function cardEl(c) {

      document.querySelectorAll('.chip').forEach(btn => { btn.disabled = busy || Number(btn.dataset.chip) > bank - stake || stake + Number(btn.dataset.chip) > MAX_BET; });
      $('clearBtn').disabled = busy || !stake;
      $('dealBtn').textContent = stake ? `${t.deal} · ${fmt(stake)}` : t.deal;
      $('dealBtn').disabled = busy;
    }
    if (bar === 'guessBar') renderGuessButtons(run);
    if (bar === 'idleBar') {
      const start = $('startBtn');
      const note = $('idleNote');
      if (mode === 'daily' && dailyDoneToday()) { start.textContent = t.seeResult; note.textContent = nextDeckText(); }
      else if (mode === 'daily') { start.textContent = t.start; note.textContent = `${t.dailyTitle} · ${t.deckInfo(1, true)} · ${t.skipsInfo(SKIPS)}`; }
      else { start.textContent = run ? t.playAgain : t.start; note.textContent = `${t.deckInfo(settings.decks, settings.aceHigh)} · ${t.bestN(fmt(stats.bestStreak))}`; }
      start.disabled = busy;
    }
  }

  function renderIntro(run) {
    const intro = $('intro');
    const show = !run || !run.cur;
    felt.classList.toggle('idle', show);
    intro.hidden = !show;
    if (!show) return;
    let html = '';
    if (mode === 'ladder') html = `<h2>${t.ladder}</h2><p>${t.ladderIntro}</p><div class="tags">${t.deckInfo(settings.decks, settings.aceHigh)} · ${t.skipsInfo(SKIPS)}</div>`;
    else if (mode === 'streak') html = `<h2>${t.streak}</h2><p>${t.streakIntro}</p><div class="tags">${t.deckInfo(settings.decks, settings.aceHigh)} · ${t.skipsInfo(SKIPS)}</div><div class="big">${t.bestN(fmt(stats.bestStreak))}</div>`;
    else if (dailyDoneToday()) html = `<h2>${t.dailyTitle}</h2><div class="tags">${dateLabel()}</div><div class="big">${t.todayScore(fmt(dailyScore(today()) ?? (run ? run.streak : 0)))}</div><p>${t.dailyDone} · ${nextDeckText()}</p>`;
    else html = `<h2>${t.dailyTitle}</h2><div class="tags">${dateLabel()}</div><p>${t.dailyIntro}</p><div class="tags">${t.deckInfo(1, true)} · ${t.skipsInfo(SKIPS)}</div>`;
    intro.innerHTML = html;
  }
  const dateLabel = () => new Date().toLocaleDateString(locale, { weekday: 'long', day: 'numeric', month: 'long' });

  function miniEl(entry) {
    const el = document.createElement('div');
    const c = entry.c;
    el.className = `mini${isRed(c) ? ' red' : ''}${entry.res === 'ok' || entry.res === 'bad' ? ` ${entry.res}` : ''}${entry.skipped ? ' skipped' : ''}`;
    el.setAttribute('role', 'listitem');
    el.setAttribute('aria-label', cardName(c));
    el.innerHTML = `${c.r}<i>${c.s}︎</i>`;
    return el;
  }
  function renderHistory(run) {
    const strip = $('strip');
    strip.dataset.empty = t.noCalls;
    const seen = run ? run.seen.slice(-40) : [];
    strip.replaceChildren(...seen.map(miniEl));
  }

  function renderTracker(run) {
    const box = $('trackBox');
    box.hidden = !settings.tracker;
    if (!settings.tracker) return;
    const aceHigh = run ? run.aceHigh : mode === 'daily' ? true : settings.aceHigh;
    const decks = run ? run.decks : mode === 'daily' ? 1 : settings.decks;
    const counts = {};
    for (const r of RANKS) counts[r] = run && run.cur ? 0 : 4 * decks;
    if (run && run.cur) for (const c of restOf(run)) counts[c.r]++;
    const curVal = run && run.cur && run.active ? rankVal(run.cur.r, run.aceHigh) : 0;
    const order = [...RANKS].sort((a, b) => rankVal(a, aceHigh) - rankVal(b, aceHigh));
    $('tgrid').replaceChildren(...order.map(r => {
      const el = document.createElement('div');
      const v = rankVal(r, aceHigh);
      el.className = `tcell${curVal ? (v > curVal ? ' hi' : v < curVal ? ' lo' : ' eq') : ''}${counts[r] ? '' : ' zero'}`;
      el.innerHTML = `<b>${r}</b><span>${counts[r]}</span>`;
      el.setAttribute('aria-label', `${r}: ${counts[r]}`);
      return el;
    }));
    $('trackN').textContent = fmt(run && run.cur ? run.deck.length - run.i : decks * 52);
  }

  function ladderRow(cls, cells) {
    const li = document.createElement('li');
    li.className = cls;
    li.innerHTML = cells;
    return li;
  }
  function renderLadder(run) {
    const list = $('ladderList');
    $('ladderTitle').textContent = mode === 'ladder' ? t.ladderTitle : t.callsTitle;
    if (!run || !run.steps.length) {
      const rows = [];
      if (mode === 'ladder' && run) rows.push(ladderRow('base', `<span>${t.stake}</span><b>${fmt(run.stake)}</b>`));
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = t.noCalls;
      list.replaceChildren(...rows, empty);
      return;
    }
    const rows = run.steps.map((s, i) => {
      const card = `<span class="c${isRed(s.c) ? ' red' : ''}">${cardName(s.c)}︎</span>`;
      const arrow = `<span class="g ${s.g}">${arrowSvg(s.g)}</span>`;
      const n = `<span class="n">${i + 1}</span>`;
      if (mode === 'ladder') return ladderRow(s.ok ? 'ok' : 'bad', `${n}${arrow}${card}<span class="m">×${fmtX(s.m)}</span><b>${s.ok ? fmtBig(s.pot) : '0'}</b>`);
      return ladderRow(s.ok ? 'ok' : 'bad', `${n}${arrow}${card}<span class="m">${fmtPct(s.p)}</span><b>${s.ok ? '✓' : '✗'}</b>`);
    }).reverse();
    if (mode === 'ladder') rows.push(ladderRow('base', `<span>${t.stake}</span><b>${fmt(run.stake)}</b>`));
    list.replaceChildren(...rows);
  }

  function renderRules(run) {
    $('rules').textContent = mode === 'ladder' ? t.houseRule(nf2.format(HOUSE / 100)).replace('× ', '×\u00a0') : t.tieRule;
    const left = run && run.cur ? run.deck.length - run.i : (mode === 'daily' ? 52 : settings.decks * 52);
    $('pileN').textContent = left;
    $('pile').classList.toggle('empty', !left);
  }

  function render() {
    const run = runs[mode];
    document.querySelectorAll('[data-mode]').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
      b.disabled = busy && b.dataset.mode !== mode;
    });
    renderHud(run);
    renderIntro(run);
    renderSlots(run);
    renderOdds(run);
    renderMeter(run);
    renderRules(run);
    renderHistory(run);
    renderTracker(run);
    renderLadder(run);
    renderControls(run);
  }

  // Card size follows the felt: two full cards + the smaller pile side by side, kept clear of the meter.
  function layout() {
    const cs = getComputedStyle(felt);
    const w = felt.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = felt.clientHeight;
    felt.classList.toggle('short', h < 230);
    felt.classList.toggle('tiny', h < 150);
    const extra = h < 230 ? 18 + (settings.odds ? 14 : 0) : 24 + (settings.odds ? 18 : 0) + 42;
    const cw = Math.max(34, Math.floor(Math.min((h - extra) / 1.4, w / 2.95, 300)));
    felt.style.setProperty('--cw', `${cw}px`);
  }

  let toastTimer = 0;
  function toast(text, ms = 1500) {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms);
  }
  function setMsg(text, tone = '') {
    const el = $('msg');
    el.textContent = text;
    el.className = `msg${tone ? ` ${tone}` : ''}`;
  }
  function say(text) {
    const el = $('sr');
    el.textContent = '';
    setTimeout(() => { el.textContent = text; }, 30);
  }
  function flash(kind) {
    const el = $('flash');
    el.className = 'flash';
    void el.offsetWidth;
    el.className = `flash ${kind}`;
    if (kind === 'lose' && !reduced) {
      felt.classList.remove('shake');
      void felt.offsetWidth;
      felt.classList.add('shake');
    }
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function saveBank() {
    store.set('chips', bank);
    store.set('stake', stake);
  }
  const saveStats = () => store.set('stats', stats);

  // ---------- ladder ----------
  function addChip(v) {
    if (busy || mode !== 'ladder' || (runs.ladder && runs.ladder.active)) return;
    if (stake + v > MAX_BET) { toast(t.maxBet(fmt(MAX_BET))); return; }
    if (stake + v > bank) { toast(t.noChips); return; }
    stake += v;
    saveBank();
    render();
  }
  function clearStake() {
    if (busy || mode !== 'ladder' || (runs.ladder && runs.ladder.active)) return;
    stake = 0;
    saveBank();
    render();
  }
  function startLadder() {
    if (busy) return;
    if (bank < MIN_BET) { openPanel('brokePanel'); return; }
    if (stake < MIN_BET) {
      if (!stake) stake = Math.min(1000, Math.floor(bank / MIN_BET) * MIN_BET);
      if (stake < MIN_BET) { toast(t.minBet(fmt(MIN_BET))); return; }
    }
    if (stake > bank) { toast(t.noChips); stake = Math.floor(bank / MIN_BET) * MIN_BET; render(); return; }
    const run = newRun('ladder');
    run.stake = stake;
    run.pot = stake;
    bank -= stake;
    saveBank();
    runs.ladder = run;
    dealFirst(run);
    bump(0);
    setMsg(t.yourCall);
    say(`${cardName(run.cur)}. ${t.yourCall}`);
    render();
  }
  function endLadder(run, why, reason = '') {
    run.active = false;
    stats.rounds++;
    stats.longest = Math.max(stats.longest, run.steps.filter(s => s.ok).length);
    if (why === 'lost') {
      run.endPot = 0;
      setMsg(`${reason} · ${t.lostMsg(fmtBig(run.pot))}`, 'bad');
      say(`${reason}. ${t.lostMsg(fmt(run.pot))}`);
    } else {
      bank += run.pot;
      run.endPot = run.pot;
      stats.cashOuts++;
      stats.bestCash = Math.max(stats.bestCash, run.pot);
      stats.bestMult = Math.max(stats.bestMult, Math.floor((run.pot * 100) / run.stake));
      const text = why === 'deck' ? t.deckEnd(fmtBig(run.pot)) : why === 'top' ? t.topEnd(fmtBig(run.pot)) : t.cashedMsg(fmtBig(run.pot));
      setMsg(text, 'good');
      say(text);
      flash('gold');
      bump(0);
    }
    if (stake > bank) stake = Math.floor(bank / MIN_BET) * MIN_BET;
    saveBank();
    saveStats();
    if (bank < MIN_BET) setTimeout(() => openPanel('brokePanel'), reduced ? 200 : 900);
  }
  function cashOut() {
    const run = runs.ladder;
    if (busy || mode !== 'ladder' || !run || !run.active) return;
    endLadder(run, 'cash');
    render();
  }

  // ---------- streak / daily ----------
  function startRun() {
    if (busy) return;
    if (mode === 'daily') {
      if (dailyDoneToday()) { showDailyResult(); return; }
      const run = newRun('daily');
      runs.daily = run;
      dealFirst(run);
      saveDaily();
    } else {
      runs.streak = newRun('streak');
      dealFirst(runs.streak);
    }
    setMsg(t.yourCall);
    say(`${cardName(runs[mode].cur)}. ${t.yourCall}`);
    render();
  }
  function endRun(run, why) {
    run.active = false;
    const n = run.streak;
    let isBest = false;
    if (run.kind === 'streak') {
      stats.runs++;
      isBest = n > stats.bestStreak;
      stats.bestStreak = Math.max(stats.bestStreak, n);
    } else {
      const prevBest = Math.max(0, ...dailyScores());
      isBest = n > prevBest;
      dailyLog[run.date] = { s: n, k: run.seen.slice(1).map(e => (e.res === 'ok' ? 1 : e.res === 'bad' ? 0 : 2)) };
      store.set('dailyLog', dailyLog);
      saveDaily();
    }
    saveStats();
    const title = why === 'deck' ? t.cleared : run.kind === 'daily' ? t.dailyTitle : t.runOver;
    setMsg(`${title} · ${fmt(n)} ${t.inARow}`, why === 'deck' ? 'good' : 'bad');
    say(`${title}. ${fmt(n)} ${t.inARow}.${isBest ? ` ${t.newBest}` : ''}`);
    if (why === 'deck') flash('gold');
    setTimeout(() => (run.kind === 'daily' ? showDailyResult() : showStreakResult(run, why, isBest)), reduced ? 150 : 700);
  }

  function dotsHtml(codes) {
    return codes.map(k => `<i class="${k === 1 ? '' : k === 0 ? 'bad' : 'skip'}"></i>`).join('');
  }
  function gridHtml(items) {
    return items.map(([label, value]) => `<div><small>${label}</small><strong>${value}</strong></div>`).join('');
  }
  function showStreakResult(run, why, isBest) {
    $('endTitle').textContent = why === 'deck' ? t.cleared : t.runOver;
    $('endSub').textContent = t.deckInfo(run.decks, run.aceHigh);
    $('endScore').textContent = fmt(run.streak);
    $('endUnit').textContent = isBest ? `${t.inARow} · ${t.newBest}` : t.inARow;
    $('endDots').innerHTML = dotsHtml(run.seen.slice(1).map(e => (e.res === 'ok' ? 1 : e.res === 'bad' ? 0 : 2)));
    $('endGrid').innerHTML = gridHtml([[t.bestStreak, fmt(stats.bestStreak)], [t.accuracy, stats.calls ? fmtPct(stats.correct / stats.calls) : '—']]);
    $('endNext').textContent = '';
    $('endAgain').textContent = t.playAgain;
    $('endAgain').dataset.act = 'again';
    $('endPanel').querySelector('.link').hidden = false;
    openPanel('endPanel');
  }
  function showDailyResult() {
    const key = today();
    const e = dailyLog[key];
    const score = e != null ? dailyScore(key) : runs.daily ? runs.daily.streak : 0;
    const codes = e && typeof e === 'object' && e.k ? e.k : [];
    const scores = dailyScores();
    $('endTitle').textContent = t.dailyTitle;
    $('endSub').textContent = dateLabel();
    $('endScore').textContent = fmt(score);
    $('endUnit').textContent = t.inARow;
    $('endDots').innerHTML = dotsHtml(codes);
    $('endGrid').innerHTML = gridHtml([[t.dailyBest, fmt(scores.length ? Math.max(...scores) : 0)], [t.daysPlayed, fmt(scores.length)], [t.dayStreak, fmt(dayStreak())]]);
    $('endNext').textContent = nextDeckText();
    $('endAgain').textContent = t.close;
    $('endAgain').dataset.act = 'close';
    $('endPanel').querySelector('.link').hidden = true;
    openPanel('endPanel');
  }

  // ---------- one call ----------
  // Applies one call to the run state: reveals the next card, scores it and stores the outcome on run.pending.
  function resolveCall(run, g) {
    const o = runOdds(run);
    const card = run.deck[run.i++];
    const a = rankVal(run.cur.r, run.aceHigh), b = rankVal(card.r, run.aceHigh);
    const ok = g === 'hi' ? b > a : g === 'lo' ? b < a : b === a;
    const p = o[g] / o.n;
    const m = multCents(o[g], o.n);
    stats.calls++;
    if (ok) stats.correct++;
    run.seen.push({ c: card, res: ok ? 'ok' : 'bad' });
    let text, badge;
    if (run.kind === 'ladder') {
      if (ok) run.pot = Math.floor((run.pot * m) / 100);
      run.steps.push({ g, c: card, m, ok, pot: run.pot });
      text = ok ? t.stepMsg(fmtX(m), fmtBig(run.pot)) : a === b ? t.tieLoss : t.wrongMsg;
      badge = ok ? `×${fmtX(m)}` : '✗';
    } else {
      if (ok) run.streak++;
      run.steps.push({ g, c: card, p, ok });
      text = ok ? t.streakMsg(fmt(run.streak)) : a === b ? t.tieLoss : t.wrongMsg;
      badge = ok ? `✓ ${fmt(run.streak)}` : '✗';
    }
    run.pending = { c: card, anim: false, res: ok ? 'ok' : 'bad', badge };
    saveStats();
    return { ok, text };
  }
  function finishCall(run, ok, text) {
    if (!ok) {
      if (run.kind === 'ladder') endLadder(run, 'lost', text); else endRun(run, 'lost');
      return;
    }
    run.cur = run.pending.c;
    run.pending = null;
    run.curAnim = 'slide';
    if (run.i >= run.deck.length) {
      if (run.kind === 'ladder') endLadder(run, 'deck'); else endRun(run, 'deck');
    } else if (run.kind === 'ladder' && run.pot >= run.stake * CAP) {
      endLadder(run, 'top');
    } else if (run.kind !== 'ladder' && [10, 20, 30, 40].includes(run.streak)) {
      toast(`${fmt(run.streak)} ${t.inARow}!`);
    }
    if (run.kind === 'daily') saveDaily();
    if (run.active) setMsg(text, 'good');
  }

  async function call(g) {
    const run = runs[mode];
    if (busy || !run || !run.active || !run.cur || document.querySelector('.overlay:not([hidden])')) return;
    if (!runOdds(run)[g]) return;
    busy = true;
    // The daily call is committed before the reveal, so reloading mid-flip cannot undo it.
    if (run.kind === 'daily') saveDaily(g);
    // The card leaves the tracker and pile count only once it has turned face up.
    run.pending = { c: run.deck[run.i], anim: true, res: '', badge: '' };
    render();
    await wait(T.deal + T.flip);

    const { ok, text } = resolveCall(run, g);
    setMsg(text, ok ? 'good' : 'bad');
    say(`${cardName(run.pending.c)}. ${text}`);
    flash(ok ? 'win' : 'lose');
    if (ok) bump(run.kind === 'ladder' ? 2 : 0);
    if (run.kind === 'daily') saveDaily();
    render();
    await wait(T.hold);

    busy = false;
    finishCall(run, ok, text);
    render();
  }

  function skip() {
    const run = runs[mode];
    if (busy || !run || !run.active || !run.cur) return;
    if (run.skips <= 0) { toast(t.noSkip); return; }
    if (run.deck.length - run.i < 2) return;
    run.skips--;
    run.seen[run.seen.length - 1].skipped = true;
    run.cur = run.deck[run.i++];
    run.seen.push({ c: run.cur, res: 'skip' });
    run.curAnim = 'deal';
    if (run.kind === 'daily') saveDaily();
    setMsg(t.skipped(run.skips));
    say(`${t.skipped(run.skips)}. ${cardName(run.cur)}`);
    render();
  }

  // ---------- panels ----------
  let lastFocus = null;
  function openPanel(id) {
    const el = $(id);
    if (!el.hidden) return;
    if (id === 'statsPanel') fillStats();
    if (id === 'brokePanel') {
      $('brokeText').textContent = t.brokeText(fmt(START_BANK));
      $('rebuyBtn').textContent = t.rebuy(fmt(START_BANK));
    }
    lastFocus = document.activeElement;
    el.hidden = false;
    el.querySelector('.btn').focus({ preventScroll: true });
  }
  function closePanel(el) {
    el.hidden = true;
    if (lastFocus && document.contains(lastFocus) && !lastFocus.closest('[inert]')) lastFocus.focus({ preventScroll: true });
  }
  function fillStats() {
    const scores = dailyScores();
    $('statsGrid').innerHTML = gridHtml([
      [t.rounds, fmt(stats.rounds)], [t.cashOuts, fmt(stats.cashOuts)],
      [t.bestCash, fmtBig(stats.bestCash)], [t.bestMult, stats.bestMult ? `×${fmtX(stats.bestMult)}` : '—'],
      [t.longest, fmt(stats.longest)], [t.bestStreak, fmt(stats.bestStreak)],
      [t.dailyBest, fmt(scores.length ? Math.max(...scores) : 0)], [t.accuracy, stats.calls ? fmtPct(stats.correct / stats.calls) : '—'],
      [t.refills, fmt(stats.refills)],
    ]);
    document.querySelectorAll('[data-ace]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.ace === '1') === settings.aceHigh)));
    document.querySelectorAll('[data-decks]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.decks) === settings.decks)));
    $('trackOpt').setAttribute('aria-pressed', String(settings.tracker));
    $('oddsOpt').setAttribute('aria-pressed', String(settings.odds));
  }
  function saveSettings() {
    store.set('settings', settings);
    fillStats();
    render();
    layout();
  }

  // ---------- events ----------
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    if (busy || b.dataset.mode === mode) return;
    mode = b.dataset.mode;
    store.set('mode', mode);
    if (mode === 'daily' && runs.daily && runs.daily.date !== today() && !runs.daily.active) runs.daily = null;
    const run = runs[mode];
    if (run && run.active) setMsg(t.yourCall);
    else if (mode === 'ladder') setMsg(t.placeStake);
    else setMsg('');
    render();
    layout();
  }));
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => addChip(Number(b.dataset.chip))));
  $('clearBtn').addEventListener('click', clearStake);
  $('dealBtn').addEventListener('click', startLadder);
  $('startBtn').addEventListener('click', startRun);
  document.querySelectorAll('.gbtn').forEach(b => b.addEventListener('click', () => call(b.dataset.g)));
  $('skipBtn').addEventListener('click', skip);
  $('cashBtn').addEventListener('click', cashOut);
  $('oddsBtn').addEventListener('click', () => { settings.odds = !settings.odds; saveSettings(); });
  $('statsBtn').addEventListener('click', () => openPanel('statsPanel'));
  $('helpBtn').addEventListener('click', () => openPanel('helpPanel'));
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closePanel(b.closest('.overlay'))));
  document.querySelectorAll('[data-ace]').forEach(b => b.addEventListener('click', () => { settings.aceHigh = b.dataset.ace === '1'; saveSettings(); }));
  document.querySelectorAll('[data-decks]').forEach(b => b.addEventListener('click', () => { settings.decks = Number(b.dataset.decks); saveSettings(); }));
  $('trackOpt').addEventListener('click', () => { settings.tracker = !settings.tracker; saveSettings(); });
  $('oddsOpt').addEventListener('click', () => { settings.odds = !settings.odds; saveSettings(); });
  $('resetStats').addEventListener('click', () => {
    Object.assign(stats, defaultStats());
    saveStats();
    fillStats();
    render();
  });
  $('rebuyBtn').addEventListener('click', () => {
    bank += START_BANK;
    stats.refills++;
    stake = Math.min(Math.max(stake, 1000), bank, MAX_BET);
    saveBank();
    saveStats();
    closePanel($('brokePanel'));
    bump(0);
    setMsg(t.placeStake);
    render();
    $('dealBtn').focus({ preventScroll: true });
  });
  $('endAgain').addEventListener('click', () => {
    closePanel($('endPanel'));
    if ($('endAgain').dataset.act === 'again') startRun();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector('.overlay:not([hidden])')) return;
    const onButton = e.target instanceof HTMLButtonElement;
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const run = runs[mode];
    if (run && run.active) {
      const g = key === 'ArrowUp' ? 'hi' : key === 'ArrowDown' ? 'lo' : key === 's' ? 'sa' : '';
      if (g) { e.preventDefault(); call(g); }
      else if (key === 'k') { e.preventDefault(); skip(); }
      else if (key === 'c' && mode === 'ladder') { e.preventDefault(); cashOut(); }
      return;
    }
    if (mode === 'ladder' && '12345'.includes(key) && key.length === 1) { e.preventDefault(); addChip(CHIPS[Number(key) - 1]); }
    else if (mode === 'ladder' && key === 'c') { e.preventDefault(); clearStake(); }
    else if ((key === 'Enter' || key === ' ') && !onButton) { e.preventDefault(); if (mode === 'ladder') startLadder(); else startRun(); }
  });

  new ResizeObserver(layout).observe(felt);

  loadDaily();
  stake = Math.min(stake, Math.floor(bank / MIN_BET) * MIN_BET);
  setMsg(mode === 'ladder' ? t.placeStake : runs[mode] && runs[mode].active ? t.yourCall : '');
  render();
  layout();
  if (bank < MIN_BET) openPanel('brokePanel');

  // Test hook: lets automated checks stack the deck and read state; harmless for players.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__hl = {
    get mode() { return mode; }, get bank() { return bank; }, get busy() { return busy; }, get stats() { return stats; },
    run: () => runs[mode], peek: () => { const r = runs[mode]; return r ? r.deck[r.i] : null; },
    stack(cards) { forced = cards.map(([r, s]) => ({ r, s })); },
    fast() { T = { deal: 0, flip: 0, hold: 0 }; },
    setBank(n) { bank = n; stake = Math.min(stake, n); saveBank(); render(); },
    odds: (r, rest, aceHigh = true) => { const o = oddsFor(rankVal(r, aceHigh), rest.map(x => ({ r: x })), aceHigh); return { ...o, m: { lo: multCents(o.lo, o.n), sa: multCents(o.sa, o.n), hi: multCents(o.hi, o.n) } }; },
    dailyDeck: date => dailyDeck(date).map(cardName), today,
  };
})();
</script>
</body>
</html>
