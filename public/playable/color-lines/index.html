<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Color Lines</title>
<style>
:root {
  --ink: #f4f1ff;
  --muted: #a9b0d6;
  --bg: #1b1f45;
  --panel: #fffaf2;
  --panel-ink: #34284f;
  --panel-muted: #7d7096;
  --coral: #ff7a59;
  --coral-dark: #e0573a;
  --sun: #ffd166;
  --chip: #2b3165;
  --chip-edge: #151935;
  --cell: #2a2f63;
  --cell-alt: #262b5b;
  --cell-edge: #1a1e44;
  --path: #ffd16655;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(ellipse at 50% -10%, #3d3f8a, transparent 60%), linear-gradient(#232857, #161937);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.icon { fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 560px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.side { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: center; gap: 7px; }
h1 { flex: 1; min-width: 0; font-size: clamp(20px, 6vw, 28px); font-weight: 900; letter-spacing: -.03em; white-space: nowrap; line-height: 1; }
h1 span { color: var(--coral); }
.stats { display: flex; gap: 8px; align-items: stretch; }
.stat { flex: 1; padding: 5px 8px; border-radius: 14px; background: var(--chip); text-align: center; box-shadow: 0 3px 0 var(--chip-edge); }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.stat strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat.bump strong { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.25); color: var(--sun); } }
.next { flex: 1.3; display: flex; flex-direction: column; align-items: center; }
.next-balls { display: flex; gap: 6px; margin-top: 2px; }
.next-balls .ball { position: relative; width: 22px; height: 22px; }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 14px; background: var(--chip); font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 var(--chip-edge); display: grid; place-items: center; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--chip-edge); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn svg { width: 20px; height: 20px; }
.hint { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.3; }

.board-wrap { flex: 1; min-height: 0; min-width: 0; display: grid; place-items: center; }
.board { position: relative; width: var(--size, 300px); height: var(--size, 300px); border-radius: 16px; padding: 6px; background: var(--cell-edge); box-shadow: 0 10px 30px #0007; touch-action: none; }
.grid { position: absolute; inset: 6px; display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); gap: 3px; }
.grid:focus-visible { outline: none; }
.cell { border-radius: 7px; background: var(--cell); box-shadow: inset 0 -2px 0 #0003; transition: background .15s; }
.cell:nth-child(odd) { background: var(--cell-alt); }
.cell.path { background: var(--path); }
.cell.cursor { outline: 3px solid var(--sun); outline-offset: -3px; }
.cell.nope { animation: nope .3s; }
@keyframes nope { 25% { transform: translateX(-12%); } 75% { transform: translateX(12%); } }
.layer { position: absolute; inset: 6px; pointer-events: none; }
.ball { position: absolute; width: calc((100% - 24px) / 9); height: calc((100% - 24px) / 9); left: 0; top: 0; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 34% 28%, #fff 0 7%, color-mix(in srgb, var(--c) 55%, #fff) 14%, var(--c) 46%, color-mix(in srgb, var(--c) 62%, #000) 100%);
  box-shadow: inset 0 -2px 4px #0004, 0 2px 3px #0005; }
.layer .ball { transform: scale(.82); }
.ball svg { width: 42%; height: 42%; fill: var(--s); margin-top: 4%; }
.ball.sel { animation: hop .6s ease-in-out infinite; }
@keyframes hop { 50% { translate: 0 -14%; } }
.ball.pop { animation: pop .38s ease-in forwards; }
@keyframes pop { 30% { scale: 1.25; } 100% { scale: 0; opacity: 0; } }
.ball.grow { animation: grow .3s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes grow { from { scale: 0; } }
.float { position: absolute; font-weight: 900; font-size: 20px; color: var(--sun); text-shadow: 0 2px 4px #0008; transform: translate(-50%, -50%); animation: float .9s ease-out forwards; pointer-events: none; }
@keyframes float { to { translate: 0 -40px; opacity: 0; } }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #0d102699; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; background: var(--panel); color: var(--panel-ink); border-radius: 28px; padding: 26px 22px; text-align: center; box-shadow: 0 20px 50px #0008; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: var(--coral); }
.panel .emoji { font-size: 44px; line-height: 1.2; }
.panel .text { margin-top: 8px; font-size: 15px; color: var(--panel-muted); line-height: 1.45; }
.panel .result { margin-top: 8px; font-size: 18px; font-weight: 800; }
.panel :focus-visible { outline-color: var(--coral-dark); }
.cta { margin-top: 20px; width: 100%; padding: 15px; border-radius: 18px; background: var(--coral); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--coral-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--coral-dark); }
.ghost { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; background: #fff0c9; color: #8a5a00; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #f3d78e; }
.ghost[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (orientation: landscape) and (max-height: 620px) {
  .app { max-width: none; flex-direction: row; align-items: stretch; gap: 14px; }
  .side { width: min(240px, 36vw); justify-content: center; }
  .stats { flex-wrap: wrap; }
  .stats .next { flex-basis: 100%; }
  .overlay { padding: 8px; }
  .panel { width: min(100%, 520px); padding: 14px 18px; border-radius: 22px; }
  .panel .emoji { display: none; }
  .panel .text { font-size: 14px; margin-top: 4px; }
  .cta { margin-top: 10px; padding: 11px; font-size: 18px; }
  .ghost { margin-top: 8px; padding: 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main class="app">
  <div class="side">
    <header class="top">
      <h1>Color <span>Lines</span></h1>
      <button type="button" class="icon-btn" id="undo" data-i18n-label="undo" aria-keyshortcuts="U"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button type="button" class="icon-btn" id="menu" data-i18n-label="menu">☰</button>
    </header>
    <div class="stats">
      <div class="stat" id="score-box"><small data-i18n="score"></small><strong id="score">0</strong></div>
      <div class="stat"><small data-i18n="best"></small><strong id="best">0</strong></div>
      <div class="stat next"><small data-i18n="next"></small><div class="next-balls" id="next-balls" aria-hidden="true"></div></div>
    </div>
    <p class="hint" data-i18n="hint"></p>
  </div>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board">
      <div class="grid" id="grid" role="grid" data-i18n-label="board" tabindex="0" aria-activedescendant=""></div>
      <div class="layer" id="layer" aria-hidden="true"></div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <p class="emoji" aria-hidden="true">🔴🟡🔵</p>
    <h2 id="start-title">Color <span>Lines</span></h2>
    <p class="text" data-i18n="tagline"></p>
    <p class="text" data-i18n="how"></p>
    <button type="button" class="cta" id="continue" data-i18n="continue" hidden></button>
    <button type="button" class="cta" id="play" data-i18n="play"></button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <p class="emoji" aria-hidden="true">🏁</p>
    <h2 id="over-title" data-i18n="gameOver"></h2>
    <p class="result" id="result"></p>
    <p class="text" id="result-best"></p>
    <button type="button" class="cta" id="again" data-i18n="again"></button>
    <button type="button" class="ghost" id="over-undo" data-i18n="undoLast"></button>
  </div>
</div>

  const els = { wrap: $('wrap'), board: $('board'), grid: $('grid'), layer: $('layer'), score: $('score'), scoreBox: $('score-box'), best: $('best'), next: $('next-balls'), undo: $('undo'), announcer: $('announcer'), start: $('start'), cont: $('continue'), over: $('over'), result: $('result'), resultBest: $('result-best'), overUndo: $('over-undo') };
  const read = (k, fb) => { try { return JSON.parse(localStorage.getItem(KEY + k)) ?? fb; } catch { return fb; } };
  const write = (k, v) => { try { if (v === null) localStorage.removeItem(KEY + k); else localStorage.setItem(KEY + k, JSON.stringify(v)); } catch {} };

  let best = Number(read('best', 0)) || 0;
  let g = null;             // { board: Array(81) of colour|-1, next: [3], score, undo: snapshot|null, over }
  let sel = -1, cursor = 40, busy = false;
  const ballEls = new Array(N * N).fill(null);

  const say = msg => { els.announcer.textContent = ''; requestAnimationFrame(() => { els.announcer.textContent = msg; }); };
  const wait = ms => new Promise(r => setTimeout(r, reduced.matches ? 0 : ms));
  const rnd = n => Math.floor(Math.random() * n);
  const empties = b => b.reduce((a, v, i) => (v < 0 && a.push(i), a), []);
  const colorName = c => t.colors[c];

  function makeBall(c) {
    const el = document.createElement('div');
    el.className = 'ball';
    el.style.setProperty('--c', COLORS[c][0]);
    el.style.setProperty('--s', COLORS[c][1]);
    el.innerHTML = `<svg viewBox="0 0 20 20"><use href="#sym${c}"/></svg>`;
    return el;
  }

  // Board geometry: ball positions are percentages of one cell, gap included.
  function cellXY(i) {
    const size = els.layer.clientWidth, gap = 3, cell = (size - gap * (N - 1)) / N;
    return [(i % N) * (cell + gap), Math.floor(i / N) * (cell + gap), cell];
  }
  function posBall(el, i) {
    const [x, y, cell] = cellXY(i);
    el.style.width = el.style.height = cell + 'px';
    el.style.left = x + 'px'; el.style.top = y + 'px';
  }

  function buildGrid() {
    els.grid.replaceChildren();
    for (let r = 0; r < N; r++) {
      const row = document.createElement('div');
      row.setAttribute('role', 'row');
      row.style.display = 'contents';
      for (let c = 0; c < N; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'cell' + (r * N + c);
        cell.setAttribute('role', 'gridcell');
        cell.dataset.i = r * N + c;
        row.append(cell);
      }
      els.grid.append(row);
    }
  }
  const cellEl = i => $('cell' + i);

  function render() {
    els.layer.replaceChildren();
    ballEls.fill(null);
    g.board.forEach((c, i) => { if (c >= 0) { const b = makeBall(c); ballEls[i] = b; posBall(b, i); els.layer.append(b); } });
    renderNext(); renderStats(); labelCells(); setCursor(cursor);
  }
  function renderNext() { els.next.replaceChildren(...g.next.map(makeBall)); }
  function renderStats() {
    els.score.textContent = g.score; els.best.textContent = best;
    els.undo.disabled = !g.undo || busy;
  }
  function labelCells() {
    for (let i = 0; i < N * N; i++) {
      const c = g.board[i];
      cellEl(i).setAttribute('aria-label', t.cell(Math.floor(i / N) + 1, i % N + 1, c < 0 ? t.empty : t.ball(colorName(c))));
      cellEl(i).setAttribute('aria-selected', String(i === sel));
    }
  }
  function setCursor(i) {
    cellEl(cursor)?.classList.remove('cursor');
    cursor = i;
    if (document.activeElement === els.grid) cellEl(i).classList.add('cursor');
    els.grid.setAttribute('aria-activedescendant', 'cell' + i);
  }
  function layout() {
    const r = els.wrap.getBoundingClientRect();
    const size = Math.max(180, Math.floor(Math.min(r.width, r.height)));
    els.board.style.setProperty('--size', size + 'px');
    if (g) ballEls.forEach((b, i) => b && posBall(b, i));
  }
  new ResizeObserver(layout).observe(els.wrap);

  const snapshot = () => ({ board: g.board.slice(), next: g.next.slice(), score: g.score });
  const save = () => write('game', g.over ? null : { board: g.board, next: g.next, score: g.score, undo: g.undo });
  const newNext = () => Array.from({ length: SPAWN }, () => rnd(COLORS.length));

  function newGame() {
    g = { board: new Array(N * N).fill(-1), next: newNext(), score: 0, undo: null, over: false };
    const free = empties(g.board);
    for (let k = 0; k < START; k++) g.board[free.splice(rnd(free.length), 1)[0]] = rnd(COLORS.length);
    sel = -1; busy = false;
    hideOverlays(); render(); save();
    say(t.nextIs(g.next.map(colorName).join(', ')));
  }
  function hideOverlays() { els.start.hidden = true; els.over.hidden = true; els.grid.focus(); }

  // Breadth-first search for the shortest path between two cells through empty cells.
  function findPath(from, to) {
    const prev = new Array(N * N).fill(-2);
    prev[from] = -1;
    const q = [from];
    while (q.length) {
      const cur = q.shift();
      if (cur === to) break;
      const r = Math.floor(cur / N), c = cur % N;
      for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
        const nr = r + dr, nc = c + dc, ni = nr * N + nc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N || prev[ni] !== -2 || g.board[ni] >= 0) continue;
        prev[ni] = cur; q.push(ni);
      }
    }
    if (prev[to] === -2) return null;
    const path = [];
    for (let i = to; i !== -1; i = prev[i]) path.unshift(i);
    return path;
  }

  // Every cell that belongs to a run of LINE or more equal colours through any of the given cells.
  function linesThrough(cells) {
    const hit = new Set();
    for (const i of cells) {
      const c = g.board[i];
      if (c < 0) continue;
      const r0 = Math.floor(i / N), c0 = i % N;
      for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
        const run = [i];
        for (const s of [1, -1]) {
          let r = r0 + dr * s, cc = c0 + dc * s;
          while (r >= 0 && r < N && cc >= 0 && cc < N && g.board[r * N + cc] === c) { run.push(r * N + cc); r += dr * s; cc += dc * s; }
        }
        if (run.length >= LINE) run.forEach(x => hit.add(x));
      }
    }
    return [...hit];
  }
  const pointsFor = n => 10 + (n - LINE) * 4;

  async function clearCells(cells) {
    const pts = pointsFor(cells.length);
    for (const i of cells) g.board[i] = -1;
    g.score += pts;
    if (g.score > best) { best = g.score; write('best', best); }
    const [x, y, cell] = cellXY(cells[Math.floor(cells.length / 2)]);
    const f = document.createElement('div');
    f.className = 'float'; f.textContent = '+' + pts;
    f.style.left = x + cell / 2 + 'px'; f.style.top = y + cell / 2 + 'px';
    els.layer.append(f); setTimeout(() => f.remove(), 950);
    cells.forEach(i => { ballEls[i]?.classList.add('pop'); });
    els.scoreBox.classList.remove('bump'); void els.scoreBox.offsetWidth; els.scoreBox.classList.add('bump');
    await wait(380);
    cells.forEach(i => { ballEls[i]?.remove(); ballEls[i] = null; });
    renderStats();
    say(t.cleared(cells.length, pts));
  }

  async function spawn() {
    const free = empties(g.board);
    const added = [];
    for (const c of g.next) {
      if (!free.length) break;
      const i = free.splice(rnd(free.length), 1)[0];
      g.board[i] = c; added.push(i);
      const b = makeBall(c); b.classList.add('grow'); ballEls[i] = b; posBall(b, i); els.layer.append(b);
    }
    g.next = newNext(); renderNext();
    await wait(300);
    const hit = linesThrough(added);
    if (hit.length) await clearCells(hit);
    if (!empties(g.board).length) return gameOver();
    say(t.nextIs(g.next.map(colorName).join(', ')));
  }

  function gameOver() {
    g.over = true; save();
    els.result.textContent = t.result(g.score);
    els.resultBest.textContent = g.score >= best && g.score > 0 ? t.newBest : t.bestIs(best);
    els.overUndo.hidden = !g.undo;
    els.over.hidden = false;
    $('again').focus();
    say(t.gameOver + ' ' + t.result(g.score));
  }

  function deselect() { if (sel >= 0) ballEls[sel]?.classList.remove('sel'); sel = -1; }

  async function activate(i) {
    if (busy || !g || g.over) return;
    setCursor(i);
    if (g.board[i] >= 0) {
      deselect(); sel = i; ballEls[i].classList.add('sel'); labelCells();
      say(t.selected(colorName(g.board[i]))); return;
    }
    if (sel < 0) return;
    const path = findPath(sel, i);
    if (!path) { const c = cellEl(i); c.classList.remove('nope'); void c.offsetWidth; c.classList.add('nope'); say(t.noPath); return; }
    busy = true;
    const from = sel, color = g.board[from], ball = ballEls[from];
    g.undo = snapshot();
    deselect();
    g.board[i] = color; g.board[from] = -1; ballEls[i] = ball; ballEls[from] = null;
    renderStats();
    if (!reduced.matches) {
      path.forEach(p => cellEl(p).classList.add('path'));
      const frames = path.map(p => { const [x, y] = cellXY(p); return { left: x + 'px', top: y + 'px' }; });
      const duration = STEP_MS * (path.length - 1);
      const anim = ball.animate(frames, { duration, easing: 'linear' });
      // Hidden tabs may never finish animations, so a timer guarantees the move completes.
      await Promise.race([anim.finished.catch(() => {}), new Promise(r => setTimeout(r, duration + 120))]);
      anim.cancel();
      path.forEach(p => cellEl(p).classList.remove('path'));
    }
    posBall(ball, i);
    say(t.moved(colorName(color)));
    const hit = linesThrough([i]);
    if (hit.length) await clearCells(hit);
    else await spawn();
    busy = false;
    labelCells(); renderStats(); save();
  }

  function undo() {
    if (busy || !g || !g.undo) return;
    Object.assign(g, g.undo, { undo: null, over: false });
    sel = -1; els.over.hidden = true;
    render(); save(); els.grid.focus(); say(t.undone);
  }

  els.grid.addEventListener('pointerdown', e => {
    const cell = e.target.closest('.cell');
    if (cell) { e.preventDefault(); els.grid.focus(); activate(Number(cell.dataset.i)); }
  });
  els.grid.addEventListener('focus', () => cellEl(cursor).classList.add('cursor'));
  els.grid.addEventListener('blur', () => cellEl(cursor).classList.remove('cursor'));
  els.grid.addEventListener('keydown', e => {
    const r = Math.floor(cursor / N), c = cursor % N;
    const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (moves[e.key]) {
      e.preventDefault();
      const nr = Math.min(N - 1, Math.max(0, r + moves[e.key][0])), nc = Math.min(N - 1, Math.max(0, c + moves[e.key][1]));
      setCursor(nr * N + nc);
    } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(cursor); }
    else if (e.key === 'Escape' && sel >= 0) { deselect(); labelCells(); }
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'u' || e.key === 'U' || ((e.ctrlKey || e.metaKey) && e.key === 'z')) && els.start.hidden) { e.preventDefault(); undo(); }
  });
  els.undo.addEventListener('click', undo);
  els.overUndo.addEventListener('click', undo);
  $('play').addEventListener('click', newGame);
  $('again').addEventListener('click', newGame);
  els.cont.addEventListener('click', hideOverlays);
  $('menu').addEventListener('click', () => { if (busy) return; deselect(); els.cont.hidden = !g || g.over; els.start.hidden = false; (g && !g.over ? els.cont : $('play')).focus(); });

  buildGrid();
  const saved = read('game', null);
  if (saved && Array.isArray(saved.board) && saved.board.length === N * N && Array.isArray(saved.next) && saved.board.some(v => v < 0)) {
    g = { board: saved.board.map(Number), next: saved.next.map(Number), score: Number(saved.score) || 0, undo: saved.undo || null, over: false };
    els.cont.hidden = false;
    layout(); render();
    els.cont.focus();
  } else {
    g = { board: new Array(N * N).fill(-1), next: newNext(), score: 0, undo: null, over: false };
    layout(); render();
    $('play').focus();
  }
})();
</script>
</body>
</html>
