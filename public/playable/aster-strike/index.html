#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#mini-cta { position: fixed; left: calc(16px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom));
  padding: 10px 16px; border: 2px solid var(--amber); border-radius: 10px; background: rgba(6, 16, 31, 0.82);
  color: #ffd98a; font: 700 15px "Chakra Petch", sans-serif; letter-spacing: 1px; cursor: pointer; }
#endcard { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  background: radial-gradient(ellipse at 50% 40%, rgba(16, 40, 72, 0.88), rgba(2, 6, 14, 0.94));
  opacity: 0; transition: opacity 0.35s ease; }
#endcard.show { opacity: 1; }
#endcard[hidden] { display: none; }
.card { width: min(360px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
#end-icon { width: min(150px, 34vmin); height: min(150px, 34vmin); border-radius: 26%; cursor: pointer;
  box-shadow: 0 0 0 2px rgba(95, 216, 255, 0.5), 0 10px 40px rgba(95, 216, 255, 0.35); }
#end-title { margin: 4px 0 0; font-size: clamp(30px, 9vmin, 44px); letter-spacing: 3px; color: #fff;
  text-shadow: 0 0 18px rgba(95, 216, 255, 0.6); }
#end-result { font-size: 20px; color: #ffe08a; letter-spacing: 1px; }
#endcard.lost #end-result { color: #ff8f78; }
#end-tagline { margin: 0; font-size: 17px; line-height: 1.35; color: #cfe3f5; }
#end-cta { margin-top: 6px; width: 100%; padding: 16px 20px; border: 0; border-radius: 14px; cursor: pointer;
  background: linear-gradient(180deg, #ffd06a, #ff9a2a); color: #2a1300; font: 700 24px "Chakra Petch", sans-serif;
  letter-spacing: 2px; box-shadow: 0 6px 0 #b45a00, 0 10px 30px rgba(255, 160, 40, 0.45); animation: pulse 1.1s ease-in-out infinite; }
#end-retry { padding: 10px 16px; border: 0; background: none; color: #9fc4e0; font: 700 16px "Chakra Petch", sans-serif;
  text-decoration: underline; cursor: pointer; }
body.ended #mini-cta, body[data-state="tutorial"] #mini-cta { display: none; }
#side-brand { display: none; }
/* Màn ngang đủ rộng: cột trái hiện icon, tên, CTA; nút CTA nhỏ ẩn. */
@media (orientation: landscape) and (min-aspect-ratio: 4/3) {
  #side-brand { position: fixed; top: 0; bottom: 0; left: env(safe-area-inset-left); width: calc((100vw - 100vh * 0.5625) / 2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center;
    pointer-events: none; }
  #side-icon, #side-cta { pointer-events: auto; }
  #side-icon { width: min(110px, 24vh); height: min(110px, 24vh); border-radius: 26%; cursor: pointer;
    box-shadow: 0 0 0 2px rgba(95, 216, 255, 0.5), 0 8px 30px rgba(95, 216, 255, 0.3); }
  #side-title { font-size: clamp(18px, 5vh, 30px); letter-spacing: 2px; text-shadow: 0 0 14px rgba(95, 216, 255, 0.6); }
  #side-tagline { margin: 0; font-size: clamp(12px, 3.4vh, 16px); color: #cfe3f5; }
  #side-cta { padding: 10px 18px; border: 0; border-radius: 12px; cursor: pointer; background: linear-gradient(180deg, #ffd06a, #ff9a2a);
    color: #2a1300; font: 700 clamp(14px, 4.4vh, 20px) "Chakra Petch", sans-serif; letter-spacing: 1px; box-shadow: 0 4px 0 #b45a00; }
  #mini-cta { display: none; }
  body.ended #side-brand { display: none; }
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@media (orientation: landscape) and (max-height: 500px) {
  .card { flex-direction: row; flex-wrap: wrap; justify-content: center; width: min(640px, 100%); gap: 10px 20px; }
  #end-icon { width: 110px; height: 110px; }
  #end-cta { width: auto; }
}
