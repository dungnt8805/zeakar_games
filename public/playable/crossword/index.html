<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Crossword</title>
<style>
:root {
  --bg: #f3f1ea;
  --ink: #1f2430;
  --muted: #6d7384;
  --cell: #ffffff;
  --word: #cfe3ff;
  --active: #ffd25e;
  --blue: #2f6fe0;
  --red: #e0483e;
  --green: #2f9e6e;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; font-size: clamp(22px, 7vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
h1 small { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--muted); }
.timer { padding: 6px 12px; border-radius: 10px; background: #fff; font-weight: 800; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 6px; }
.tool { flex: 1; padding: 9px 6px; border-radius: 10px; background: #fff; border: 1.5px solid #d9d6cc; font-size: 13px; font-weight: 800; }
.tool:active { background: #ece9df; }

.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.board { --cell: min(calc(100cqw / var(--cols)), calc(100cqh / var(--rows)), 52px); display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); grid-template-rows: repeat(var(--rows), var(--cell)); }
.cell { position: relative; margin: -1px 0 0 -1px; border: 2px solid var(--ink); background: var(--cell); display: grid; place-items: center; font-size: calc(var(--cell) * .55); font-weight: 900; text-transform: uppercase; }
.cell .num { position: absolute; top: 1px; left: 3px; font-size: calc(var(--cell) * .24); font-weight: 800; line-height: 1; }
.cell.in-word { background: var(--word); }
.cell.active { background: var(--active); }
.cell.wrong .letter { color: var(--red); }
.cell.revealed .letter { color: var(--blue); }
.cell.done { transition: background .3s; }
.solved .cell { background: #c8f0d9; animation: wave .5s calc(var(--i) * 25ms) both; }
@keyframes wave { 50% { transform: scale(1.12); } }

.clue { display: flex; align-items: center; gap: 6px; min-height: 58px; padding: 6px; border-radius: 14px; background: var(--word); }
.clue button { width: 40px; height: 44px; flex-shrink: 0; border-radius: 10px; font-size: 20px; font-weight: 900; }
.clue button:active { background: #b3d2fb; }
.clue p { flex: 1; text-align: center; font-size: 15px; font-weight: 700; line-height: 1.3; }
.clue b { margin-right: 6px; color: var(--blue); }
.status { min-height: 1.2em; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.status.bad { color: var(--red); }
.status.good { color: var(--green); }

.keyboard { display: grid; gap: 5px; }
.row { display: flex; justify-content: center; gap: 4px; }
.key { flex: 1; max-width: 42px; height: clamp(38px, 6vh, 48px); border-radius: 8px; background: #fff; box-shadow: 0 2px 0 #c9c5b9; font-size: 16px; font-weight: 800; }
.key:active { transform: translateY(2px); box-shadow: none; }
.key.wide { max-width: 64px; flex: 1.5; font-size: 18px; }

.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: #1f243055; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 340px); padding: 26px 22px; border-radius: 22px; background: #fff; text-align: center; box-shadow: 0 20px 50px #0004; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.panel .emoji { font-size: 44px; }
.panel h2 { font-size: 28px; font-weight: 900; }
.panel p { margin-top: 8px; font-size: 16px; color: var(--muted); }
.panel button { margin-top: 20px; width: 100%; padding: 14px; border-radius: 14px; background: var(--blue); color: #fff; font-size: 18px; font-weight: 800; }
.panel .best { font-size: 14px; }
.levels { display: grid; gap: 10px; margin-top: 18px; }
.panel .levels button { margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: #eef4ff; color: var(--ink); border: 2px solid transparent; }
.panel .levels button.current { border-color: var(--blue); }
.levels small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
.levels em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--blue); white-space: nowrap; }
.panel .ghost { background: none; color: var(--muted); margin-top: 12px; padding: 8px; font-size: 15px; }
.diff { padding: 6px 10px; border-radius: 10px; background: #e3ecff; color: var(--blue); font-size: 12px; font-weight: 800; white-space: nowrap; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>Mini Crossword<small data-i18n="tagline"></small></h1>
    <button type="button" class="diff" id="diff"></button>
    <span class="timer" id="timer" aria-hidden="true">0:00</span>
  </div>
  <div class="tools">
    <button type="button" class="tool" id="check" data-i18n="check"></button>
    <button type="button" class="tool" id="reveal" data-i18n="reveal"></button>
    <button type="button" class="tool" id="new" data-i18n="newPuzzle"></button>
  </div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="clue">
    <button type="button" id="prev" data-i18n-label="prevClue">‹</button>
    <p id="clue" aria-live="polite"></p>
    <button type="button" id="next" data-i18n-label="nextClue">›</button>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="keyboard" id="keyboard"></div>
</main>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🧩</p>
    <h2 id="win-title" data-i18n="solved"></h2>
    <p id="win-text"></p>
    <p class="best" id="win-best"></p>
    <button type="button" id="again" data-i18n="newPuzzle"></button>
  </div>
</div>

<div class="overlay" id="choose" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="choose-title">
    <h2 id="choose-title" data-i18n="chooseLevel"></h2>
    <div class="levels" id="levels"></div>
    <button type="button" class="ghost" id="cancel" data-i18n="cancel"></button>
  </div>
</div>

    }
    const { words, grid, bounds } = best;
    const rows = bounds.r1 - bounds.r0 + 1, cols = bounds.c1 - bounds.c0 + 1;
    const cells = new Map();
    for (const [k, cell] of grid) {
      const [r, c] = k.split(',').map(Number);
      cells.set(key(r - bounds.r0, c - bounds.c0), { ...cell, r: r - bounds.r0, c: c - bounds.c0 });
    }
    words.forEach(w => { w.r -= bounds.r0; w.c -= bounds.c0; });
    // Number start cells in reading order, as printed crosswords do.
    let n = 0;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const cell = cells.get(key(r, c));
      if (!cell) continue;
      const starts = words.filter(w => w.r === r && w.c === c);
      if (starts.length) { n++; cell.num = n; starts.forEach(w => { w.num = n; }); }
    }
    const byNum = dir => words.filter(w => w.dir === dir).sort((a, b) => a.num - b.num);
    const ordered = [...byNum('across'), ...byNum('down')];
    return { words: ordered, all: words, cells, rows, cols };
  }

  const $ = id => document.getElementById(id);
  const els = { board: $('board'), clue: $('clue'), status: $('status'), timer: $('timer'), diff: $('diff'), win: $('win'), winText: $('win-text'), winBest: $('win-best'), choose: $('choose'), levels: $('levels'), keyboard: $('keyboard') };
  const readProgress = () => { try { return { difficulty: 'normal', best: {}, ...JSON.parse(localStorage.getItem(STORAGE_KEY)) }; } catch { return { difficulty: 'normal', best: {} }; } };
  const saveProgress = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch {} };
  const progress = readProgress();
  if (!DIFFICULTIES[progress.difficulty]) progress.difficulty = 'normal';

  for (const row of ROWS) {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    for (const letter of row) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = letter === '⌫' ? 'key wide' : 'key';
      button.textContent = letter;
      if (letter === '⌫') button.setAttribute('aria-label', 'Backspace');
      button.addEventListener('click', () => (letter === '⌫' ? erase() : type(letter)));
      rowEl.append(button);
    }
    els.keyboard.append(rowEl);
  }

  let puzzle, state;
  const formatTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  function newPuzzle(difficulty = progress.difficulty) {
    clearInterval(state?.timer);
    progress.difficulty = difficulty;
    saveProgress();
    config = DIFFICULTIES[difficulty];
    els.diff.textContent = t[difficulty];
    els.diff.setAttribute('aria-label', `${t.chooseLevel}: ${t[difficulty]}`);
    els.choose.hidden = true;
    puzzle = generate();
    state = { entries: new Map(), wrong: new Set(), revealed: new Set(), hints: 0, start: performance.now(), timer: 0, word: puzzle.words[0], cell: null, solved: false };
    state.cell = key(state.word.r, state.word.c);
    state.timer = setInterval(() => { els.timer.textContent = formatTime(performance.now() - state.start); }, 500);
    els.timer.textContent = '0:00';
    els.board.style.setProperty('--rows', puzzle.rows);
    els.board.style.setProperty('--cols', puzzle.cols);
    els.board.classList.remove('solved');
    els.board.replaceChildren();
    let i = 0;
    for (let r = 0; r < puzzle.rows; r++) for (let c = 0; c < puzzle.cols; c++) {
      const cell = puzzle.cells.get(key(r, c));
      if (!cell) { els.board.append(document.createElement('span')); continue; }
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'cell';
      el.style.setProperty('--i', i++);
      el.innerHTML = `${cell.num ? `<span class="num">${cell.num}</span>` : ''}<span class="letter"></span>`;
      el.addEventListener('click', () => select(key(r, c), true));
      cell.el = el;
      els.board.append(el);
    }
    els.win.hidden = true;
    els.status.textContent = '';
    render();
  }

  const cellsOf = word => { const [dr, dc] = VEC[word.dir]; return [...word.word].map((_, i) => key(word.r + dr * i, word.c + dc * i)); };

  function select(cellKey, fromTap = false) {
    const cell = puzzle.cells.get(cellKey);
    if (!cell) return;
    const current = state.word.dir;
    const other = current === 'across' ? 'down' : 'across';
    // Tapping the active cell again flips between its across and down words.
    let dir = current;
    if (fromTap && cellKey === state.cell && cell[other] !== undefined) dir = other;
    else if (cell[current] === undefined) dir = other;
    state.cell = cellKey;
    state.word = puzzle.all[cell[dir]];
    render();
  }

  function render() {
    const wordCells = new Set(cellsOf(state.word));
    for (const [k, cell] of puzzle.cells) {
      cell.el.classList.toggle('in-word', wordCells.has(k));
      cell.el.classList.toggle('active', k === state.cell);
      cell.el.classList.toggle('wrong', state.wrong.has(k));
      cell.el.classList.toggle('revealed', state.revealed.has(k));
      cell.el.querySelector('.letter').textContent = state.entries.get(k) ?? '';
      const words = ['across', 'down'].filter(d => cell[d] !== undefined).map(d => `${puzzle.all[cell[d]].num} ${t[d]}`);
      cell.el.setAttribute('aria-label', `${words.join(', ')}: ${state.entries.get(k) ?? '—'}`);
    }
    const label = `${state.word.num} ${t[state.word.dir]}`;
    els.clue.innerHTML = '';
    const b = document.createElement('b');
    b.textContent = label;
    els.clue.append(b, document.createTextNode(state.word.clue));
  }

  function step(delta) {
    const list = cellsOf(state.word);
    const next = list[list.indexOf(state.cell) + delta];
    if (next) state.cell = next;
  }

  function type(letter) {
    if (state.solved) return;
    state.entries.set(state.cell, letter);
    state.wrong.delete(state.cell);
    state.revealed.delete(state.cell);
    step(1);
    els.status.textContent = '';
    render();
    checkComplete();
  }

  function erase() {
    if (state.solved) return;
    if (!state.entries.get(state.cell)) step(-1);
    state.entries.delete(state.cell);
    state.wrong.delete(state.cell);
    render();
  }

  function moveClue(delta) {
    const index = puzzle.words.indexOf(state.word);
    state.word = puzzle.words[(index + delta + puzzle.words.length) % puzzle.words.length];
    const empty = cellsOf(state.word).find(k => !state.entries.get(k));
    state.cell = empty ?? key(state.word.r, state.word.c);
    render();
  }

  function check() {
    state.wrong.clear();
    for (const [k, cell] of puzzle.cells) {
      const entry = state.entries.get(k);
      if (entry && entry !== cell.letter) state.wrong.add(k);
    }
    els.status.className = `status ${state.wrong.size ? 'bad' : 'good'}`;
    els.status.textContent = state.wrong.size ? t.wrong(state.wrong.size) : t.allRight;
    render();
  }

  function reveal() {
    if (state.solved) return;
    const cell = puzzle.cells.get(state.cell);
    if (state.entries.get(state.cell) === cell.letter) { step(1); render(); return; }
    state.entries.set(state.cell, cell.letter);
    state.revealed.add(state.cell);
    state.wrong.delete(state.cell);
    state.hints++;
    step(1);
    render();
    checkComplete();
  }

  function checkComplete() {
    if ([...puzzle.cells.keys()].some(k => !state.entries.get(k))) return;
    const correct = [...puzzle.cells].every(([k, cell]) => state.entries.get(k) === cell.letter);
    if (!correct) { els.status.className = 'status bad'; els.status.textContent = t.notYet; return; }
    state.solved = true;
    clearInterval(state.timer);
    els.board.classList.add('solved');
    const ms = performance.now() - state.start;
    const previous = progress.best[progress.difficulty];
    const better = !state.hints && (!previous || ms < previous);
    if (better) { progress.best[progress.difficulty] = ms; saveProgress(); }
    els.winText.textContent = `${t[progress.difficulty]} · ${t.result(formatTime(ms), state.hints)}`;
    els.winBest.textContent = better && previous ? t.newBest : progress.best[progress.difficulty] ? t.best(formatTime(progress.best[progress.difficulty])) : '';
    setTimeout(() => { els.win.hidden = false; $('again').focus({ preventScroll: true }); }, 700);
  }

  function chooseDifficulty() {
    els.levels.replaceChildren(...Object.keys(DIFFICULTIES).map(level => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = level === progress.difficulty ? 'current' : '';
      const best = progress.best[level];
      button.innerHTML = '<span><span class="name"></span><small></small></span><em></em>';
      button.querySelector('.name').textContent = t[level];
      button.querySelector('small').textContent = t[`${level}Desc`];
      button.querySelector('em').textContent = best ? t.best(formatTime(best)) : '';
      button.addEventListener('click', () => newPuzzle(level));
      return button;
    }));
    els.win.hidden = true;
    els.choose.hidden = false;
    els.levels.querySelector('.current')?.focus({ preventScroll: true });
  }

  function arrow(dir, delta) {
    const cell = puzzle.cells.get(state.cell);
    // An arrow across the current direction first turns to that direction, like newspaper apps.
    if (state.word.dir !== dir && cell[dir] !== undefined) { state.word = puzzle.all[cell[dir]]; render(); return; }
    const [dr, dc] = VEC[dir];
    const [r, c] = state.cell.split(',').map(Number);
    for (let i = 1; i < Math.max(puzzle.rows, puzzle.cols); i++) {
      const k = key(r + dr * delta * i, c + dc * delta * i);
      if (puzzle.cells.has(k)) { select(k); return; }
    }
  }

  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey || !els.win.hidden || !els.choose.hidden) return;
    const letter = event.key.toUpperCase();
    if (/^[A-Z]$/.test(letter)) { event.preventDefault(); type(letter); }
    else if (event.key === 'Backspace' || event.key === 'Delete') { event.preventDefault(); erase(); }
    else if (event.key === 'ArrowRight') { event.preventDefault(); arrow('across', 1); }
    else if (event.key === 'ArrowLeft') { event.preventDefault(); arrow('across', -1); }
    else if (event.key === 'ArrowDown') { event.preventDefault(); arrow('down', 1); }
    else if (event.key === 'ArrowUp') { event.preventDefault(); arrow('down', -1); }
  });
  $('prev').addEventListener('click', () => moveClue(-1));
  $('next').addEventListener('click', () => moveClue(1));
  $('check').addEventListener('click', check);
  $('reveal').addEventListener('click', reveal);
  $('new').addEventListener('click', chooseDifficulty);
  $('again').addEventListener('click', chooseDifficulty);
  els.diff.addEventListener('click', chooseDifficulty);
  $('cancel').addEventListener('click', () => { els.choose.hidden = true; });

  newPuzzle();
})();
</script>
</body>
</html>
