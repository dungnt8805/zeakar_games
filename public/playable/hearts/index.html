<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearts</title>
<style>
:root {
  --bg: #150712;
  --felt: #6a2156;
  --felt-dark: #2c0926;
  --felt-light: #93357a;
  --rail: #2b1230;
  --rail-light: #e597bb;
  --text: #fff2f7;
  --muted: #ebbdd2;
  --rose: #ff7aa5;
  --rose-light: #ffb3cb;
  --rose-dark: #c2406d;
  --mint: #74ebcb;
  --mint-dark: #1f8c70;
  --warn: #ffb070;
  --red: #d61a4b;
  --ink: #26162a;
  --plate: linear-gradient(#5b1a4c, #300b2a);
  --back: radial-gradient(circle at 50% 50%, #ffb3cb 0 9%, transparent 10%), repeating-linear-gradient(45deg, #ffffff22 0 2px, transparent 2px 6px), repeating-linear-gradient(-45deg, #ffffff22 0 2px, transparent 2px 6px), linear-gradient(160deg, #e0517f, #8c1d4a);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: radial-gradient(120% 80% at 50% 0%, #3f0d35, var(--bg) 70%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--rose-light); outline-offset: 3px; }
.sr-only { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; max-width: 720px; margin: auto; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 6px; }
h1 { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: clamp(21px, 6.4vw, 28px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; color: var(--rose-light); text-shadow: 0 2px 0 #0006; white-space: nowrap; overflow: hidden; }
h1 i { font-style: normal; color: var(--rose); }
.pill { height: 34px; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; background: #00000040; font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.pill span { overflow: hidden; text-overflow: ellipsis; }
.pill:hover, .icon:hover { color: var(--rose-light); }
.pill svg { width: 16px; height: 16px; flex-shrink: 0; }
.icon { width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; background: #00000040; font-size: 16px; font-weight: 900; color: var(--muted); }
.icon svg { width: 18px; height: 18px; }

.hud { display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 4px 4px 5px; border-radius: 12px; background: #00000038; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.me strong { color: var(--rose-light); }
.stat.bump strong { animation: bump .35s; }
@keyframes bump { 40% { scale: 1.18; } }

/* The table: three opponents around the trick, your hand along the bottom edge. Card sizes come from layout(). */
.felt { --cw: 48px; --pw: 42px; --sw: 70px; --bw: 18px; flex: 1; min-height: 0; position: relative; display: grid; grid-template-columns: var(--sw) minmax(0, 1fr) var(--sw); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top top top" "left pile right" "mine mine mine"; gap: 4px; padding: 6px; border-radius: 26px; border: 6px solid var(--rail); background: radial-gradient(#ffffff0b 1px, transparent 1.5px) 0 0 / 7px 7px, radial-gradient(100% 75% at 50% 42%, var(--felt-light), var(--felt) 48%, var(--felt-dark)); box-shadow: inset 0 0 0 2px #00000030, inset 0 0 50px #0008, 0 0 0 2px var(--rail-light), 0 12px 28px #0009; }

.card { position: relative; flex: none; width: var(--cw); height: calc(var(--cw) * 1.4); padding: 0; border-radius: calc(var(--cw) * .1); background: linear-gradient(#fffdfb, #f6ebef); color: var(--ink); box-shadow: 0 1px 3px #0008, 0 0 0 .5px #0003; text-align: left; transition: translate .15s, box-shadow .15s, filter .2s; }
.card.red { color: var(--red); }
.card.queen { background: linear-gradient(#fffdfb, #efe2f6); box-shadow: inset 0 0 0 calc(var(--cw) * .035) #9b5bc4, 0 1px 3px #0008; }
.ix { position: absolute; left: 6%; top: 4%; display: flex; flex-direction: column; align-items: center; font-weight: 900; font-size: calc(var(--cw) * .3); line-height: .95; letter-spacing: -.07em; pointer-events: none; }
.ix i { font-style: normal; font-size: .8em; letter-spacing: 0; }
.pip { position: absolute; right: 9%; bottom: 6%; font-size: calc(var(--cw) * .5); line-height: 1; pointer-events: none; }
.card.deal { animation: deal .32s cubic-bezier(.2, .8, .3, 1) backwards; }
@keyframes deal { from { opacity: 0; transform: translateY(-70%) rotate(-8deg) scale(.6); } }

.seat { position: relative; z-index: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: opacity .3s; }
.seat.s1 { grid-area: left; align-self: center; }
.seat.s3 { grid-area: right; align-self: center; }
.seat.s2 { grid-area: top; justify-self: center; flex-direction: row; gap: 8px; }
.backs { position: relative; display: flex; height: calc(var(--bw) * 1.4); }
.backs i { width: var(--bw); height: calc(var(--bw) * 1.4); border-radius: calc(var(--bw) * .14); background: var(--back); box-shadow: inset 0 0 0 1.5px #fff, 0 1px 3px #0008; }
.backs i:first-child { rotate: -8deg; }
.backs i + i { margin-left: calc(var(--bw) * -.55); rotate: 8deg; }
.backs .cnt { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; font-variant-numeric: tabular-nums; }
.backs.none { visibility: hidden; }
.plate { position: relative; width: var(--sw); min-height: 34px; display: flex; align-items: center; gap: 5px; padding: 4px 6px 4px 4px; border-radius: 12px; background: var(--plate); box-shadow: 0 0 0 1.5px #ffffff22, 0 4px 10px #0007; transition: box-shadow .2s; }
.seat.s2 .plate { width: auto; min-width: var(--sw); max-width: 170px; }
.av { width: 26px; height: 26px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: #ffffff1c; font-size: 16px; line-height: 1; }
.who { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.18; }
.who .nm { font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who b { font-size: 12px; font-weight: 900; color: var(--rose-light); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hp { position: absolute; right: -6px; bottom: -9px; z-index: 2; padding: 1px 6px; border-radius: 99px; background: var(--rose); color: #3b0820; font-size: 11px; font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: 0 2px 5px #0007; }
.hp.q { background: #c9a0ff; color: #23083b; }
.hp:empty { display: none; }
.dots { position: absolute; right: 4px; top: -8px; display: none; gap: 3px; padding: 4px 6px; border-radius: 99px; background: var(--rose-light); }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: #3b0820; animation: dot 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 30% { translate: 0 -3px; opacity: .5; } }
.seat.thinking .dots { display: flex; }
.seat.turn .plate { box-shadow: 0 0 0 2px var(--rose-light), 0 0 16px #ff7aa588; }
.felt.big .plate { min-height: 46px; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 14px; }
.felt.big .av { width: 34px; height: 34px; font-size: 21px; }
.felt.big .who .nm { font-size: 14px; }
.felt.big .who b { font-size: 14px; }
.felt.big .hp { font-size: 13px; padding: 2px 8px; }
.felt.big .backs .cnt { font-size: 16px; }
.felt.big .plbl { font-size: 14px; line-height: 20px; padding: 3px 14px; }
.felt:not(.wide) .seat.s1 .plate, .felt:not(.wide) .seat.s3 .plate { flex-direction: column; gap: 2px; padding: 6px 4px 6px; text-align: center; }
.felt:not(.wide) .seat.s1 .who, .felt:not(.wide) .seat.s3 .who { width: 100%; align-items: center; }

.pile { grid-area: pile; position: relative; z-index: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.cross { position: relative; flex: none; width: calc(var(--pw) * 2.8); height: calc(var(--pw) * 3.05); }
.cross.flat { width: calc(var(--pw) * 3.9); height: calc(var(--pw) * 2.3); }
.cross::before { content: ""; position: absolute; inset: 16% 6%; border-radius: 50%; border: 1.5px dashed #ffffff26; pointer-events: none; }
.tc { position: absolute; width: var(--pw); height: calc(var(--pw) * 1.4); }
.tc .card { --cw: var(--pw); }
.t0 { left: 50%; bottom: 0; translate: -50% 0; }
.t1 { left: 0; top: 50%; translate: 0 -50%; rotate: -6deg; }
.t2 { left: 50%; top: 0; translate: -50% 0; }
.t3 { right: 0; top: 50%; translate: 0 -50%; rotate: 6deg; }
.tc .card.win { box-shadow: 0 0 0 2.5px var(--rose-light), 0 0 18px var(--rose), 0 2px 6px #0009; }
.tc .card.fly { animation: fly .3s cubic-bezier(.2, .8, .3, 1) backwards; }
@keyframes fly { from { transform: translate(var(--fx, 0), var(--fy, 0)) scale(.7); opacity: .3; } }
.cross.collect .card { transition: transform .35s ease-in, opacity .35s ease-in; transform: translate(var(--cx, 0), var(--cy, 0)) scale(.45); opacity: 0; }
.arrow { position: absolute; inset: 0; display: none; place-items: center; font-size: calc(var(--pw) * 1.15); font-weight: 900; line-height: 1; color: var(--rose-light); text-shadow: 0 3px 0 #0006; pointer-events: none; }
.pile.passing .arrow { display: grid; animation: nudgeA 1.4s ease-in-out infinite; }
@keyframes nudgeA { 50% { transform: translate(var(--ax, 0), var(--ay, 0)); } }
.plbl { max-width: 100%; min-height: 20px; padding: 2px 10px; border-radius: 99px; background: #00000047; font-size: 12px; font-weight: 800; line-height: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plbl:empty { visibility: hidden; }
.plbl b { color: var(--rose-light); }
.boom { position: absolute; left: 50%; top: 45%; z-index: 9; translate: -50% -50%; font-size: clamp(24px, 8vw, 44px); font-weight: 900; color: var(--rose-light); white-space: nowrap; text-shadow: 0 3px 0 #000a, 0 0 22px var(--rose); pointer-events: none; animation: boom 1.3s ease-out forwards; }
@keyframes boom { 0% { scale: .3; opacity: 0; } 18% { scale: 1.2; opacity: 1; rotate: -5deg; } 30% { scale: 1; rotate: 2deg; } 75% { opacity: 1; } 100% { opacity: 0; scale: 1.08; } }

.mine { grid-area: mine; position: relative; z-index: 2; min-width: 0; }
.hand { display: flex; justify-content: center; min-height: calc(var(--cw) * 1.66); padding-top: calc(var(--cw) * .26); touch-action: none; }
.hand .card { margin-left: calc(var(--step, 30px) - var(--cw)); cursor: pointer; }
.hand .card:first-child { margin-left: 0; }
.hand .card.g { margin-left: calc(var(--step, 30px) - var(--cw) + var(--gap, 0px)); }
.hand .card.sel { translate: 0 calc(var(--cw) * -.24); box-shadow: 0 0 0 2px var(--rose-light), 0 0 14px #ff7aa5aa, 0 4px 10px #0009; }
.hand .card.new:not(.sel) { box-shadow: 0 0 0 2px var(--mint), 0 0 12px #74ebcb99, 0 2px 6px #0008; }
.hand .card.new::after { content: ""; position: absolute; left: 50%; top: -5px; width: 8px; height: 8px; translate: -50% 0; border-radius: 50%; background: var(--mint); box-shadow: 0 0 6px var(--mint); }
.hand .card.off { filter: brightness(.62) saturate(.6); translate: 0 calc(var(--cw) * .08); cursor: not-allowed; }
.hand .card.hint { animation: hintP .9s 3; }
@keyframes hintP { 50% { box-shadow: 0 0 0 3px var(--mint), 0 0 18px var(--mint); } }
.hand .card.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.hand .card:focus-visible { outline-offset: 1px; z-index: 1; }
.mine.turn::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -3px; height: 3px; border-radius: 3px; background: var(--rose-light); box-shadow: 0 0 12px var(--rose); }

.msg { flex-shrink: 0; min-height: 20px; font-size: 14px; font-weight: 800; text-align: center; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.good { color: var(--mint); }
.msg.bad { color: var(--warn); }

.controls { flex-shrink: 0; display: grid; grid-template-columns: repeat(4, auto); gap: 6px; }
.btn { height: 46px; min-width: 0; padding: 0 6px; border-radius: 12px; font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(#ffaac6, var(--rose)); color: #3b0820; box-shadow: 0 3px 0 var(--rose-dark); }
.btn.alt { background: linear-gradient(#fff7fa, #ecd8e2); color: var(--ink); box-shadow: 0 3px 0 #a98b9b; }
.btn:not(:disabled):active { translate: 0 2px; box-shadow: none; }
.btn:disabled { opacity: .38; }
.btn.armed { animation: pulse .9s infinite; }
.btn.nudge { animation: pulse .9s 3; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--rose-light), 0 0 18px var(--rose); } }

/* Side column pieces, only shown in wide frames. */
.board { display: none; min-height: 0; flex-direction: column; gap: 4px; }
.brow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; align-items: center; column-gap: 8px; padding: 4px 8px 4px 4px; border-radius: 12px; background: #00000033; font-size: 13px; font-weight: 800; }
.brow .av { width: 24px; height: 24px; font-size: 15px; }
.brow .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brow .bh { min-width: 34px; text-align: right; color: var(--rose-light); font-variant-numeric: tabular-nums; }
.brow .bt { min-width: 34px; text-align: right; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
.brow.turn { box-shadow: inset 0 0 0 1.5px var(--rose-light); }
.brow.lead .bt::before { content: "♛ "; color: var(--mint); font-size: 12px; }
.bhead { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; column-gap: 8px; padding: 0 8px 0 4px; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.bhead span { min-width: 34px; text-align: right; white-space: nowrap; }
.lastbox { display: none; min-height: 0; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: 14px; background: #00000030; box-shadow: inset 0 0 0 1px #ffffff12; overflow: hidden; }
.lastbox .bl { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lt { --cw: 34px; display: flex; justify-content: center; gap: 6px; }
.lt figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 14px; }
.lt figure.w .card { box-shadow: 0 0 0 2px var(--rose-light), 0 0 10px var(--rose); }
.lt .none { padding: 8px 0; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.lastbox .lw { font-size: 12.5px; font-weight: 800; text-align: center; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lastbox .lw:empty { display: none; }
.seen { display: none; min-height: 0; flex-direction: column; gap: 5px; padding: 8px 10px; border-radius: 14px; background: #00000030; box-shadow: inset 0 0 0 1px #ffffff12; overflow: hidden; }
.seen .bl { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow { display: grid; grid-template-columns: 16px repeat(13, minmax(0, 1fr)); align-items: center; gap: 1px; font-size: 11px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
.srow b { font-size: 13px; }
.srow.r b, .srow.r span { color: #ff8fb0; }
.srow span { padding: 1px 0; border-radius: 4px; color: var(--text); letter-spacing: -.04em; }
.srow span.gone { opacity: .22; text-decoration: line-through; }
.srow span.own { background: #ffffff24; box-shadow: inset 0 -2px 0 var(--rose); }

.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: #14040fc4; }
.overlay[hidden] { display: none; }
.panel { width: min(420px, 100%); max-height: calc(100% - 16px); overflow-y: auto; padding: 20px 18px; border-radius: 20px; background: linear-gradient(#5a1a4d, #2c0a27); box-shadow: 0 0 0 1px #ffffff1c, 0 20px 50px #000a; text-align: center; animation: pop .3s; }
@keyframes pop { from { scale: .3; opacity: 0; } }
.panel h2 { font-size: 22px; font-weight: 900; color: var(--rose-light); }
.panel .sub { margin-top: 2px; font-size: 13px; font-weight: 800; color: var(--text); }
.panel p { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.panel .btn { width: 100%; margin-top: 16px; }
.panel .btn + .btn { margin-top: 10px; }
.panel .lbl { margin-top: 14px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fan { --cw: 40px; display: flex; justify-content: center; height: 60px; margin-bottom: 6px; }
.fan .card:nth-child(1) { rotate: -14deg; translate: 6px 6px; }
.fan .card:nth-child(3) { rotate: 14deg; translate: -6px 6px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: #00000040; }
.seg button { flex: 1; min-width: 0; padding: 8px 4px; border-radius: 9px; font-size: 13.5px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { background: var(--rose); color: #3b0820; }
.panel > .seg { margin-top: 8px; }
#moonSeg button { white-space: normal; line-height: 1.15; overflow-wrap: anywhere; }
.toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #00000038; font-size: 13.5px; font-weight: 800; text-align: left; }
.toggle::after { content: ""; flex-shrink: 0; width: 38px; height: 22px; border-radius: 99px; background: #ffffff2a radial-gradient(circle at 11px 50%, #fff 8px, transparent 8.5px); transition: background .2s; }
.toggle[aria-pressed="true"]::after { background: var(--mint-dark) radial-gradient(circle at 27px 50%, #fff 8px, transparent 8.5px); }
.speedrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 6px 6px 6px 12px; border-radius: 12px; background: #00000038; font-size: 14px; font-weight: 800; text-align: left; }
.speedrow .seg button { flex: none; padding: 5px 9px; font-size: 12.5px; }
.warn { font-size: 12.5px !important; color: var(--warn) !important; }
.warn[hidden] { display: none; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 14px; }
.grid > div { padding: 6px; border-radius: 10px; background: #00000038; }
.grid small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); }
.grid strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.panel ul { margin-top: 12px; padding-left: 18px; text-align: left; font-size: 13px; line-height: 1.55; color: var(--muted); }
.panel li + li { margin-top: 6px; }
.panel .link { margin-top: 12px; font-size: 13px; font-weight: 800; color: var(--muted); text-decoration: underline; }
.big { font-size: 44px; line-height: 1.1; }
.rows { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; text-align: left; }
.rrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; align-items: center; column-gap: 8px; padding: 6px 8px; border-radius: 12px; background: #00000038; }
.rrow.me { box-shadow: inset 0 0 0 1.5px #ffb3cb88; }
.rrow .av { width: 28px; height: 28px; }
.rrow .rn { min-width: 0; font-size: 13.5px; font-weight: 900; line-height: 1.25; }
.rrow .rn span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .rn small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); white-space: normal; }
.rrow .rp { padding: 2px 8px; border-radius: 99px; background: #ffffff1c; font-size: 11px; font-weight: 900; white-space: nowrap; }
.rrow .rp.p0 { background: var(--mint); color: #06291f; }
.rrow .rd { min-width: 48px; text-align: right; font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
.rrow .rd.up { color: var(--warn); }
.rrow .rd.down { color: var(--mint); }
.rrow .rd small { display: block; font-size: 10.5px; font-weight: 800; color: var(--muted); }
.note { margin-top: 10px !important; padding: 6px 10px; border-radius: 10px; background: #74ebcb22; color: var(--mint) !important; font-weight: 800; font-size: 13px !important; }
.note:empty { display: none; }
.sheet { width: 100%; margin-top: 12px; border-collapse: separate; border-spacing: 0 3px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sheet th { padding: 2px 4px; font-size: 11px; color: var(--muted); font-weight: 800; white-space: nowrap; max-width: 60px; overflow: hidden; text-overflow: ellipsis; }
.sheet td { padding: 4px; background: #00000030; }
.sheet td:first-child { border-radius: 8px 0 0 8px; color: var(--muted); }
.sheet td:last-child { border-radius: 0 8px 8px 0; }
.sheet tfoot td { background: #ff7aa533; font-size: 15px; font-weight: 900; }
.sheet .mo { color: var(--mint); }
.sheet-wrap { max-height: 46vh; overflow-y: auto; }
.lastrow { --cw: 46px; display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.lastrow figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: var(--muted); }
.lastrow figure.w .card { box-shadow: 0 0 0 2.5px var(--rose-light), 0 0 14px var(--rose); }
.lastrow figure.w { color: var(--rose-light); }
.choice { display: grid; gap: 8px; margin-top: 14px; }
.choice .btn { margin-top: 0 !important; height: auto; min-height: 46px; padding: 6px 10px; white-space: normal; line-height: 1.2; }
.choice .btn small { display: block; font-size: 12px; font-weight: 800; opacity: .8; }

@media (max-height: 620px) {
  .btn { height: 42px; }
}
/* Small portrait frames: slimmer header, HUD and controls so the table keeps its height. */
@media (max-height: 560px) and (max-aspect-ratio: 5/4) {

}

}

}

}

}
@media (min-aspect-ratio: 5/4) and (max-height: 400px) {
  .lastbox { display: none; }
}

  .top h1 { display: none; }

}
/* Short screens: compact panels so the main button stays reachable. */
@media (max-height: 560px) {
  .overlay { padding: 8px; }

@media (max-height: 480px) and (min-aspect-ratio: 4/3) {

    let html = rows.map(([k, v]) => `<div><small>${t[k]}</small><strong>${v}</strong></div>`).join('');
    html += `<div><small>${t.sAvg}</small><strong>${stats.hands ? (stats.pts / stats.hands).toFixed(1) : t.none}</strong></div>`;
    html += `<div><small>${t.sBest}</small><strong>${stats.best == null ? t.none : stats.best}</strong></div>`;
    $('statsGrid').innerHTML = html;
    $('speedSeg').innerHTML = Object.keys(SPEEDS).map(k => `<button type="button" data-speed="${k}" aria-pressed="${k === settings.speed}">${t.speeds[k]}</button>`).join('');
    $('confirmToggle').setAttribute('aria-pressed', String(!!settings.confirm));
  }
  function fillScores() {
    const tgt = match ? match.target : settings.target;
    $('scoresSub').textContent = t.scoresSub(tgt);
    if (!match || !match.history.length) { $('sheet').innerHTML = `<p>${t.noHands}</p>`; return; }
    const head = `<tr><th>${t.handCol}</th>${NAMES.map((n, p) => `<th>${AVATARS[p]} ${n}</th>`).join('')}</tr>`;
    const body = match.history.map((h, i) => `<tr><td>${i + 1}</td>${h.add.map((a, p) => `<td class="${h.moon === p ? 'mo' : ''}">${h.moon === p ? '🌙' : ''}${a}</td>`).join('')}</tr>`).join('');
    const foot = `<tr><td>${t.total}</td>${match.totals.map(s => `<td>${s}</td>`).join('')}</tr>`;
    $('sheet').innerHTML = `<table class="sheet"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
  }
  function fillLastPanel() {
    const res = S && S.last;
    if (!res) { $('lastRow').innerHTML = ''; $('lastText').textContent = t.lastNone; return; }
    $('lastRow').innerHTML = res.cards.map(x => `<figure class="${x.p === res.winner ? 'w' : ''}" data-c="${x.c}"><span>${AVATARS[x.p]} ${NAMES[x.p]}</span></figure>`).join('');
    fillFigures($('lastRow'));
    $('lastText').textContent = `${t.trickN(res.no + 1)} · ${t.lastWon(NAMES[res.winner], res.pts)}`;
  }
  function showResult(m, add, tieMore) {
    $('resIcon').textContent = m >= 0 ? '🌙' : add[0] === 0 ? '✨' : S.queenBy === 0 ? '♠' : '♥';
    $('resTitle').textContent = t.resTitle(match.handNo);
    $('resText').textContent = m === 0 ? t.resMoonYou : m > 0 ? t.moonBy(NAMES[m]) : t.resYou(S.taken[0]);
    const notes = [];
    if (m >= 0) notes.push(match.history[match.history.length - 1].pick === 'self' ? t.moonSelfNote : t.moonOthersNote);
    if (tieMore) notes.push(t.tieMore);
    $('resNote').textContent = notes.join(' · ');
    const low = Math.min(...match.totals);
    $('resRows').innerHTML = [0, 1, 2, 3].map(p => {
      const d = add[p];
      const dcls = d > 0 ? 'up' : d < 0 ? 'down' : '';
      const sub = `♥ ${S.taken[p] - (S.queenBy === p ? 13 : 0)}${S.queenBy === p ? ' · Q♠' : ''}`;
      const lead = match.totals[p] === low ? `<span class="rp p0">♛</span>` : '<span></span>';
      return `<div class="rrow${p === 0 ? ' me' : ''}"><span class="av">${AVATARS[p]}</span><div class="rn"><span>${NAMES[p]}</span><small>${sub}</small></div>${lead}<b class="rd ${dcls}">${d > 0 ? `+${d}` : d}<small>${t.total} ${match.totals[p]}</small></b></div>`;
    }).join('');
    $('nextBtn').textContent = match.final ? t.toResults : t.next;
    announce(`${$('resTitle').textContent}. ${$('resText').textContent} ${$('resNote').textContent}`);
    openPanel('resPanel');
  }
  function showGameOver() {
    phase = 'over';
    const tot = match.totals;
    const placeOf = p => [0, 1, 2, 3].filter(q => tot[q] < tot[p]).length;
    const ranking = [0, 1, 2, 3].sort((a, b) => tot[a] - tot[b] || a - b);
    const mine = placeOf(0);
    const win = mine === 0;
    stats.games++;
    if (win) { stats.wins++; stats.best = stats.best == null ? tot[0] : Math.min(stats.best, tot[0]); }
    save();
    $('overIcon').textContent = win ? '🏆' : ['', '🥈', '🥉', '🃏'][mine];
    $('overTitle').textContent = win ? t.winTitle : t.loseTitle(t.places[mine]);
    $('overText').textContent = t.overText(tot[0], match.history.length);
    $('overRows').innerHTML = ranking.map(p => {
      const i = placeOf(p);
      return `<div class="rrow${p === 0 ? ' me' : ''}"><span class="av">${AVATARS[p]}</span><div class="rn"><span>${NAMES[p]}</span></div><span class="rp${i === 0 ? ' p0' : ''}">${t.places[i]}</span><b class="rd">${tot[p]}</b></div>`;
    }).join('');
    announce(`${$('overTitle').textContent} ${$('overText').textContent}`);
    render();
    openPanel('overPanel');
  }

  // ---------- input ----------
  function setFocus(i) {
    const n = handEl.children.length;
    if (!n) return;
    focusIdx = clamp(i, 0, n - 1);
    [...handEl.children].forEach((el, k) => { el.tabIndex = k === focusIdx ? 0 : -1; });
    handEl.children[focusIdx].focus({ preventScroll: true });
  }
  handEl.addEventListener('click', e => {
    const el = e.target.closest('.card');
    if (!el) return;
    focusIdx = [...handEl.children].indexOf(el);
    onCard(Number(el.dataset.c));
  });
  handEl.addEventListener('focusin', e => { const el = e.target.closest('.card'); if (el) focusIdx = [...handEl.children].indexOf(el); });

  $('actBtn').addEventListener('click', act);
  $('hintBtn').addEventListener('click', hint);
  $('sortBtn').addEventListener('click', toggleSort);
  $('lastBtn').addEventListener('click', () => openPanel('lastPanel'));
  $('gameBtn').addEventListener('click', () => openPanel('lobbyPanel'));
  $('scoresBtn').addEventListener('click', () => openPanel('scoresPanel'));
  $('statsBtn').addEventListener('click', () => openPanel('statsPanel'));
  $('helpBtn').addEventListener('click', () => openPanel('helpPanel'));
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closePanel(b.closest('.overlay'))));
  const segPick = (id, attr, apply) => $(id).addEventListener('click', e => {
    const b = e.target.closest(`[data-${attr}]`);
    if (!b) return;
    apply(b.dataset[attr]);
    paintLobby();
    $(id).querySelector(`[data-${attr}="${b.dataset[attr]}"]`).focus({ preventScroll: true });
  });
  segPick('lvlSeg', 'level', v => { lobby.level = Number(v); });
  segPick('tgtSeg', 'target', v => { lobby.target = Number(v); });
  segPick('moonSeg', 'moon', v => { lobby.moon = v; });
  $('startBtn').addEventListener('click', () => {
    Object.assign(settings, lobby);
    saveSettings();
    $('lobbyPanel').hidden = true;
    startGame();
    $('actBtn').focus({ preventScroll: true });
  });
  $('cancelBtn').addEventListener('click', () => closePanel($('lobbyPanel')));
  $('nextBtn').addEventListener('click', nextHand);
  $('againBtn').addEventListener('click', () => { $('overPanel').hidden = true; openPanel('lobbyPanel'); });
  const moonPicked = pick => {
    $('moonPanel').hidden = true;
    const r = resolveMoon;
    resolveMoon = null;
    if (r) r(pick);
  };
  $('moonOthersBtn').addEventListener('click', () => moonPicked('others'));
  $('moonSelfBtn').addEventListener('click', () => moonPicked('self'));
  $('speedSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-speed]');
    if (!b) return;
    settings.speed = b.dataset.speed;
    saveSettings();
    fillStats();
    $('speedSeg').querySelector(`[data-speed="${settings.speed}"]`).focus({ preventScroll: true });
  });
  $('confirmToggle').addEventListener('click', () => {
    settings.confirm = !settings.confirm;
    raised = -1;
    saveSettings();
    fillStats();
  });
  $('resetStats').addEventListener('click', () => {
    Object.assign(stats, defaultStats());
    save();
    fillStats();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector('.overlay:not([hidden])')) return;
    const key = e.key.toLowerCase();
    const onCardEl = !!(e.target.closest && e.target.closest('#hand .card'));
    const onButton = e.target instanceof HTMLButtonElement;
    if (key === 'arrowleft' || key === 'arrowright') {
      if (!handEl.children.length) return;
      e.preventDefault();
      setFocus(onCardEl ? focusIdx + (key === 'arrowright' ? 1 : -1) : focusIdx);
    } else if ((key === 'enter' || key === ' ') && !onButton) {
      const el = handEl.children[focusIdx];
      if (phase === 'pass' && key === 'enter' && passSel.size === 3) { e.preventDefault(); confirmPass(); } else if (el && (phase === 'pass' || phase === 'you')) { e.preventDefault(); onCard(Number(el.dataset.c)); }
    } else if (key === 'p') { if (phase === 'pass') { e.preventDefault(); confirmPass(); } }
    else if (key === 'h') { e.preventDefault(); hint(); }
    else if (key === 's') { e.preventDefault(); if (S && S.hands[0].length) toggleSort(); }
    else if (key === 'l') { if (S && S.last) { e.preventDefault(); openPanel('lastPanel'); } }
  });

  for (let p = 1; p < 4; p++) {
    SEATS[p].innerHTML = `<div class="backs" aria-hidden="true"><i></i><i></i><b class="cnt">13</b></div><div class="plate"><span class="av" aria-hidden="true">${AVATARS[p]}</span><span class="who"><span class="nm">${NAMES[p]}</span><b class="pts">0</b></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="hp" aria-hidden="true"></span></div>`;
  }
  $('fan').replaceChildren(...[0, QS, 51].map(c => cardEl(c)));
  $('helpList').innerHTML = t.helpLines.map(l => `<li>${l}</li>`).join('');

  new ResizeObserver(() => { layout(); }).observe(felt);
  layout();
  render();
  openPanel('lobbyPanel');

  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__hearts = {
    get S() { return S; }, get phase() { return phase; }, get match() { return match; }, get stats() { return stats; }, get settings() { return settings; },
    get passSel() { return [...passSel]; }, get intents() { return intents.slice(); },
    legalOf, heur, aiPlay, aiPass, mcPick, viewFor, makeState, playCard, applyPasses, handAdds, moonChoice, util, sampleWorld, CFG,
    rig(deals) { rigQueue = deals.map(d => ({ hands: d.hands.map(h => h.slice()), hold: !!d.hold })); },
    speed(x) { delayScale = x; }, mcBudget(ms) { MC.ms = ms; },
    autoHuman(level) {
      humanAuto = level;
      if (level == null) return;
      if (resolvePass) { const r = resolvePass; resolvePass = null; r(aiPass(S.hands[0], level, null)); }
      if (resolveHuman) { const r = resolveHuman; resolveHuman = null; r(aiPlay(viewFor(S, 0), level)); }
    },
    cardCenter(c) { const el = handEl.querySelector(`[data-c="${c}"]`); if (!el) return null; const r = el.getBoundingClientRect(); return { x: r.left + Math.min(r.width / 2, 8), y: r.top + r.height * 0.3 }; },
    // Engine-only hands between computer players; checks every card is legal and returns per-seat totals.
    simulate(levels, hands) {
      const res = { pts: [0, 0, 0, 0], moons: [0, 0, 0, 0], illegal: 0, bad: 0, maxMs: 0 };
      const saved = intents;
      for (let k = 0; k < hands; k++) {
        const deck = shuffle([...Array(52).keys()]);
        const st = makeState([0, 1, 2, 3].map(i => deck.slice(i * 13, i * 13 + 13)));
        st.passDir = DIRS[k % 4];
        intents = [0, 1, 2, 3].map(p => (levels[p] === 2 && moonHand(st.hands[p]) ? 'shoot' : null));
        if (st.passDir !== 'hold') applyPasses(st, [0, 1, 2, 3].map(p => aiPass(st.hands[p], levels[p], intents[p])));
        st.turn = st.hands.findIndex(h => h.includes(0));
        while (!st.over) {
          const p = st.turn;
          const t0 = now();
          const c = aiPlay(viewFor(st, p), levels[p]);
          res.maxMs = Math.max(res.maxMs, now() - t0);
          if (!legalOf(st.hands[p], st).includes(c)) { res.illegal++; break; }
          playCard(st, p, c);
        }
        if (st.taken.reduce((a, b) => a + b, 0) !== 26) res.bad++;
        const { add, moon } = handAdds(st.taken, 'others');
        if (moon >= 0) res.moons[moon]++;
        for (let p = 0; p < 4; p++) res.pts[p] += add[p];
      }
      intents = saved;
      return res;
    },
  };
})();
</script>
</body>
</html>
