<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candy Rope</title>
<style>
:root {
  --ink: #3d2a3a;
  --muted: #8a6d79;
  --paper: #fffaf2;
  --peach: #ffe4cf;
  --candy: #ff4f7b;
  --candy-dark: #d13560;
  --mint: #6fcf8f;
  --star: #ffb92e;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--peach);
  background-image: radial-gradient(#ffd6bd 2px, transparent 2.5px);
  background-size: 26px 26px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--candy-dark); outline-offset: 3px; }

.app { height: 100%; max-width: 560px; margin: auto; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.hud { display: flex; align-items: center; gap: 8px; }
.hud-mid { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 12px; border-radius: 16px; background: #ffffffb8; }
.hud-mid strong { font-size: 18px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-stars { font-size: 20px; letter-spacing: 2px; color: #e8d5c4; white-space: nowrap; }
.hud-stars b { color: var(--star); text-shadow: 0 1px 0 #c97f00; }
.icon-btn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 14px; background: var(--paper); font-size: 20px; font-weight: 900; box-shadow: 0 4px 0 #e7b99a; }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #e7b99a; }

.stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.board { position: relative; }
canvas { display: block; width: 100%; height: 100%; border-radius: 22px; touch-action: none; cursor: crosshair; background: #fff1df; box-shadow: 0 0 0 3px #fffaf2, 0 14px 30px #b3584a33; }
canvas:focus-visible { outline: 3px solid #d1356066; outline-offset: 4px; }
.hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: max-content; max-width: 88%; padding: 7px 14px; border-radius: 99px; background: #3d2a3ae0; color: #fff; font-size: 14px; font-weight: 800; line-height: 1.3; text-align: center; pointer-events: none; animation: drop .4s ease-out; }
.hint[hidden] { display: none; }
@keyframes drop { from { opacity: 0; transform: translate(-50%, -8px); } }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: #3d2a3a66; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; background: var(--paper); border-radius: 28px; padding: 24px 22px; text-align: center; box-shadow: 0 20px 50px #0005; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h1 { font-size: 36px; font-weight: 900; letter-spacing: -.03em; line-height: 1.05; }
.panel h1 span { color: var(--candy); }
.panel h2 { font-size: 25px; font-weight: 900; line-height: 1.2; }
.panel .emoji { font-size: 46px; line-height: 1.1; }
.panel p { margin-top: 8px; color: var(--muted); line-height: 1.45; }
.panel .small { font-size: 13px; }
.stars { margin-top: 6px; font-size: 40px; letter-spacing: 4px; color: #eadbc9; }
.stars b { color: var(--star); text-shadow: 0 2px 0 #c97f00; }
.badge { display: inline-block; margin-top: 10px; padding: 5px 14px; border-radius: 99px; background: var(--star); color: #fff !important; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 18px; width: 100%; padding: 15px; border-radius: 18px; background: var(--candy); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--candy-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--candy-dark); }
.cta[hidden] { display: none; }
.secondary { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; border: 2px solid #f0d9c6; font-weight: 800; }
.total { font-weight: 800; color: var(--ink) !important; }
.level-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin-top: 14px; }
.level-btn { aspect-ratio: 1; display: grid; place-content: center; gap: 1px; border-radius: 12px; background: #ffeedd; box-shadow: 0 3px 0 #efc7a6; font-size: 16px; font-weight: 900; }
.level-btn small { font-size: 9px; letter-spacing: 0; color: var(--star); min-height: 11px; }
.level-btn.current { background: var(--candy); color: #fff; box-shadow: 0 3px 0 var(--candy-dark); }
.level-btn.current small { color: #ffe9a8; }
.level-btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="hud">
    <button type="button" class="icon-btn" id="open-levels" data-i18n-label="levels">☰</button>
    <div class="hud-mid">
      <strong id="level-name"></strong>
      <span class="hud-stars" id="hud-stars"></span>
    </div>
    <button type="button" class="icon-btn" id="restart" data-i18n-label="restart">↻</button>
  </div>
  <div class="stage" id="stage">
    <div class="board" id="board">
      <canvas id="canvas" tabindex="0" role="application" data-i18n-label="board"></canvas>
      <p class="hint" id="hint" hidden></p>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <p class="emoji" aria-hidden="true">🍬</p>
    <h1 id="start-title">Candy <span>Rope</span></h1>
    <p data-i18n="tagline"></p>
    <p class="small" data-i18n="controls"></p>
    <button type="button" class="cta" id="play" data-i18n="play"></button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">😋</p>
    <h2 id="win-title"></h2>
    <p class="stars" id="win-stars"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="next" data-i18n="next"></button>
    <button type="button" class="secondary" id="replay" data-i18n="replay"></button>
  </div>
</div>

<div class="overlay" id="fail" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="fail-title">
    <p class="emoji" aria-hidden="true">🥺</p>
    <h2 id="fail-title"></h2>
    <p data-i18n="failText"></p>
    <button type="button" class="cta" id="retry" data-i18n="retry"></button>
    <button type="button" class="secondary" id="fail-levels" data-i18n="levels"></button>
  </div>
</div>

<div class="overlay" id="levels" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="levels-title">
    <h2 id="levels-title" data-i18n="chooseLevel"></h2>
    <p class="total" id="total"></p>
    <div class="level-grid" id="level-grid"></div>
    <button type="button" class="secondary" id="close-levels" data-i18n="close"></button>
  </div>
</div>

        cutRope(rope, i);
        cut = true;
        break;
      }
    }
    if (cut) { act(); els.announcer.textContent = t.cut; }
  }

  function tap(p) {
    if (game.held && dist(game.held, p) < BUBBLE_R + 12) { act(); popBubble(); return; }
    const blower = game.blowers.find(b => dist(b, p) < 32);
    if (blower) { act(); blow(blower); }
  }

  // ---- rendering ----
  function resize() {
    const box = els.stage.getBoundingClientRect();
    scale = Math.min(box.width / W, box.height / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    els.board.style.width = `${W * scale}px`;
    els.board.style.height = `${H * scale}px`;
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    draw();
  }

  const DOTS = Array.from({ length: 46 }, (_, i) => ({ x: (i * 97) % W, y: (i * 151) % H, r: 3 + (i % 4) * 2 }));

  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#fff3e3');
    grad.addColorStop(1, '#ffdfe6');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff80';
    for (const d of DOTS) { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); }
  }

  function strokePath(pts, width, color, dash) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.setLineDash(dash || []);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawRope(pts, alpha = 1, highlight = false) {
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (highlight) strokePath(pts, 13, '#ffd23f99');
    strokePath(pts, 5, '#8a5a3c');
    strokePath(pts, 2.5, '#d9a877', [5, 5]);
    ctx.globalAlpha = 1;
  }

  function drawAnchor(a) {
    if (a.period) {
      ctx.strokeStyle = '#3d2a3a1f'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath();
      if (a.orbit) ctx.ellipse(a.bx, a.by, Math.abs(a.mx) || 1, Math.abs(a.my) || 1, 0, 0, Math.PI * 2);
      else { ctx.moveTo(a.bx - a.mx, a.by - a.my); ctx.lineTo(a.bx + a.mx, a.by + a.my); }
      ctx.stroke();
    }
    ctx.fillStyle = '#c4935a';
    ctx.beginPath(); ctx.arc(a.x, a.y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6f4a2b';
    ctx.beginPath(); ctx.arc(a.x, a.y, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawPin(pin, time) {
    if (!pin.used) {
      ctx.strokeStyle = '#8b6cd9aa'; ctx.lineWidth = 2;
      ctx.setLineDash([7, 7]);
      ctx.lineDashOffset = reduceMotion ? 0 : -time * 12;
      ctx.beginPath(); ctx.arc(pin.x, pin.y, pin.r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset = 0;
    }
    ctx.fillStyle = '#8b6cd9';
    ctx.beginPath(); ctx.arc(pin.x, pin.y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e6dcff';
    ctx.beginPath(); ctx.arc(pin.x - 2, pin.y - 2, 3, 0, Math.PI * 2); ctx.fill();
  }

  function starPath(x, y, outer, inner) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? inner : outer, a = -Math.PI / 2 + i * Math.PI / 5;
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.closePath();
  }

  function drawStar(s, time) {
    if (s.got) return;
    const bob = reduceMotion ? 0 : Math.sin(time * 3 + s.x) * 2.5;
    ctx.fillStyle = '#ffe9a033';
    ctx.beginPath(); ctx.arc(s.x, s.y + bob, STAR_R + 7, 0, Math.PI * 2); ctx.fill();
    starPath(s.x, s.y + bob, STAR_R, STAR_R * 0.48);
    ctx.fillStyle = '#ffc93c'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#e8941a'; ctx.stroke();
  }

  function drawSpikes([x1, y1, x2, y2]) {
    const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len, nx = -uy, ny = ux;
    const teeth = Math.max(1, Math.round(len / 11)), step = len / teeth;
    ctx.fillStyle = '#a3a9b6'; ctx.strokeStyle = '#5c6270'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
    for (let i = 0; i < teeth; i++) {
      const cx = x1 + ux * (i + 0.5) * step, cy = y1 + uy * (i + 0.5) * step;
      for (const dir of [1, -1]) {
        ctx.beginPath();
        ctx.moveTo(cx - ux * step / 2, cy - uy * step / 2);
        ctx.lineTo(cx + nx * 9 * dir, cy + ny * 9 * dir);
        ctx.lineTo(cx + ux * step / 2, cy + uy * step / 2);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }
    ctx.lineCap = 'round';
    strokePath([{ x: x1, y: y1 }, { x: x2, y: y2 }], 6, '#6b7180');
  }

  function drawBubble(b, time) {
    if (b.state === 'popped') return;
    const bob = b.state === 'idle' && !reduceMotion ? Math.sin(time * 2 + b.x) * 2 : 0;
    ctx.fillStyle = '#a5dcff40';
    ctx.strokeStyle = '#ffffffe6'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(b.x, b.y + bob, BUBBLE_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(b.x, b.y + bob, BUBBLE_R - 7, Math.PI * 1.1, Math.PI * 1.4); ctx.stroke();
  }

  function drawBlower(b, highlight) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);
    if (highlight) { ctx.fillStyle = '#ffd23f88'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill(); }
    const squash = 1 - b.puff * 0.25;
    ctx.fillStyle = '#ff8fb1'; ctx.strokeStyle = '#d65a85'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(-20, -15 * squash, 30, 30 * squash, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffc2d4';
    ctx.beginPath(); ctx.roundRect(-15, -9 * squash, 8, 18 * squash, 4); ctx.fill();
    ctx.fillStyle = '#d65a85';
    ctx.beginPath(); ctx.moveTo(10, -7); ctx.lineTo(22, -11); ctx.lineTo(22, 11); ctx.lineTo(10, 7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawCandy(c, spin, size = 1) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(spin);
    ctx.scale(size, size);
    ctx.fillStyle = '#ff9fbf';
    for (const dir of [1, -1]) {
      ctx.beginPath();
      ctx.moveTo(dir * (CANDY_R - 3), 0);
      ctx.lineTo(dir * (CANDY_R + 9), -9);
      ctx.lineTo(dir * (CANDY_R + 9), 9);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#ff4f7b';
    ctx.beginPath(); ctx.arc(0, 0, CANDY_R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.arc(0, 0, CANDY_R - 5, k * 2.1, k * 2.1 + 1.1); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#ffffffb0';
    ctx.beginPath(); ctx.ellipse(c.x - 5 * size, c.y - 6 * size, 4 * size, 2.5 * size, -0.6, 0, Math.PI * 2); ctx.fill();
  }

  function drawMonster(m, time) {
    const g = game;
    const { x, y } = m;
    ctx.fillStyle = '#d99b62';
    ctx.beginPath(); ctx.roundRect(x - 36, y + 18, 72, 36, 8); ctx.fill();
    ctx.fillStyle = '#efc08b';
    ctx.fillRect(x - 36, y + 26, 72, 8);
    const breathe = reduceMotion ? 0 : Math.sin(time * 2.4) * 1.2;
    const chew = m.chew > 0 && !reduceMotion ? Math.abs(Math.sin(time * 18)) * 3 : 0;
    ctx.fillStyle = '#6fcf8f';
    ctx.beginPath(); ctx.moveTo(x - 20, y - 22); ctx.lineTo(x - 14, y - 36); ctx.lineTo(x - 6, y - 24); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 20, y - 22); ctx.lineTo(x + 14, y - 36); ctx.lineTo(x + 6, y - 24); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, y + 2 - breathe / 2, 31 + chew / 2, 27 + breathe - chew / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9be3ae';
    ctx.beginPath(); ctx.ellipse(x, y + 12, 18, 11, 0, 0, Math.PI * 2); ctx.fill();
    const c = g.candy;
    const look = g.state === 'won' ? { x: 0, y: 0 } : { x: clamp((c.x - x) / 60, -1, 1) * 3, y: clamp((c.y - y) / 60, -1, 1) * 3 };
    for (const ex of [-11, 11]) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x + ex, y - 9, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2b1d2a';
      ctx.beginPath(); ctx.arc(x + ex + look.x, y - 9 + look.y, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#7a2340';
    if (g.state === 'lost') {
      ctx.strokeStyle = '#2b1d2a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x, y + 14, 7, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else if (m.open > 0.05) {
      ctx.beginPath(); ctx.ellipse(x, y + 7, 8 + m.open * 8, 3 + m.open * 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff7aa0';
      ctx.beginPath(); ctx.ellipse(x, y + 9 + m.open * 5, 5 + m.open * 4, 2 + m.open * 3, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = '#2b1d2a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x, y + 4, 7, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    }
  }

  function draw() {
    if (!game) return;
    const g = game, time = effects.time;
    const list = targets(), sel = list[selected];
    drawBackground();
    for (const pin of g.pins) drawPin(pin, time);
    for (const spike of g.spikes) drawSpikes(spike);
    drawMonster(g.monster, time);
    for (const s of g.stars) drawStar(s, time);
    for (const b of g.blowers) drawBlower(b, sel?.blower === b);
    for (const s of g.scraps) drawRope(s.pts, clamp(s.life / 0.5, 0, 1));
    for (const rope of g.ropes) drawRope(rope.pts, 1, sel?.rope === rope);
    for (const a of g.anchors) drawAnchor(a);
    const c = g.candy;
    if (g.state === 'play') drawCandy(c, g.spin);
    else if (g.state === 'won') {
      const k = clamp((g.t - g.endTime) / 0.25, 0, 1);
      const m = g.monster;
      if (k < 1) drawCandy({ x: c.x + (m.x - c.x) * k, y: c.y + (m.y + 6 - c.y) * k }, g.spin, 1 - k * 0.8);
    } else if (g.reason !== 'spiked') drawCandy(c, g.spin);
    for (const b of g.bubbles) drawBubble(b, time);
    if (sel?.kind === 'bubble') { ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(c.x, c.y, BUBBLE_R + 5, 0, Math.PI * 2); ctx.stroke(); }
    for (const p of effects.particles) {
      ctx.globalAlpha = clamp(p.life * 2, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (trail.length > 1) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let i = 1; i < trail.length; i++) {
        ctx.globalAlpha = clamp(trail[i].life * 4, 0, 1);
        strokePath([trail[i - 1], trail[i]], 5, '#ffffff');
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---- loop & UI ----
  const paused = () => !els.start.hidden || !els.levels.hidden || document.hidden;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (game && !paused()) {
      game.acc += dt;
      while (game.acc >= STEP) { game.acc -= STEP; simStep(); }
      tickEffects(dt);
      if (game.state !== 'play' && !game.shown && game.t - game.endTime > (game.state === 'won' ? 1 : 0.9)) showEnd();
    }
    draw();
    requestAnimationFrame(frame);
  }

  function tickEffects(dt) {
    effects.time += dt;
    const g = game, m = g.monster, c = g.candy;
    const near = g.state === 'play' && Math.hypot(c.x - m.x, c.y - m.y) < 120;
    m.open += ((near ? 1 : 0) - m.open) * Math.min(1, dt * 10);
    if (m.chew > 0) m.chew = Math.max(0, m.chew - dt * 0.9);
    for (const b of g.blowers) b.puff = Math.max(0, b.puff - dt * 4);
    for (const p of effects.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
    effects.particles = effects.particles.filter(p => p.life > 0);
    for (const p of trail) p.life -= dt;
    while (trail.length && trail[0].life <= 0) trail.shift();
  }

  function showEnd() {
    const g = game;
    g.shown = true;
    if (g.state === 'won') {
      const lastLevel = g.level === LEVELS.length;
      els.winTitle.textContent = lastLevel ? t.allDone : t.won(g.level);
      els.winStars.innerHTML = starText(g.got);
      els.winStars.setAttribute('aria-label', t.starsLabel(g.got));
      els.newBest.hidden = !g.record;
      els.next.hidden = lastLevel;
      els.win.hidden = false;
      els.announcer.textContent = `${els.winTitle.textContent} ${t.starsLabel(g.got)}`;
      (lastLevel ? $('replay') : els.next).focus({ preventScroll: true });
    } else {
      els.failTitle.textContent = t[g.reason];
      els.fail.hidden = false;
      els.announcer.textContent = `${t[g.reason]} ${t.failText}`;
      $('retry').focus({ preventScroll: true });
    }
  }

  function startLevel(number) {
    loadLevel(number);
    canvas.focus({ preventScroll: true });
  }

  function openLevels() {
    const earned = Object.values(progress.stars).reduce((sum, n) => sum + n, 0);
    els.total.textContent = t.total(earned, LEVELS.length * 3);
    els.levelGrid.replaceChildren(...LEVELS.map((_, index) => {
      const number = index + 1;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `level-btn${number === game.level ? ' current' : ''}`;
      const locked = number > progress.unlocked;
      const stars = progress.stars[number] ?? 0;
      button.disabled = locked;
      button.innerHTML = `<span>${locked ? '🔒' : number}</span><small>${'★'.repeat(stars)}</small>`;
      button.setAttribute('aria-label', `${t.levelN(number)}, ${locked ? t.locked : t.starsLabel(stars)}`);
      button.addEventListener('click', () => { els.levels.hidden = true; startLevel(number); });
      return button;
    }));
    for (const overlay of [els.win, els.fail]) overlay.hidden = true;
    els.levels.hidden = false;
    els.levelGrid.querySelector('.current')?.focus({ preventScroll: true });
  }

  function toWorld(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left) / scale, y: (event.clientY - rect.top) / scale };
  }

  let pointer = null;
  canvas.addEventListener('pointerdown', event => {
    if (!game || game.state !== 'play') return;
    canvas.setPointerCapture(event.pointerId);
    const p = toWorld(event);
    pointer = { id: event.pointerId, ...p };
    trail.push({ ...p, life: 0.25 });
    tap(p);
  });
  canvas.addEventListener('pointermove', event => {
    if (!pointer || pointer.id !== event.pointerId || game.state !== 'play') return;
    const p = toWorld(event);
    swipe(pointer, p);
    pointer.x = p.x; pointer.y = p.y;
    trail.push({ ...p, life: 0.25 });
  });
  const endPointer = () => { pointer = null; };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // Tab walks through ropes and gadgets on the board, then lets focus leave as usual.
  canvas.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    const list = targets();
    if (event.key === 'Tab') {
      if (!list.length) { selected = -1; return; }
      const next = event.shiftKey ? (selected < 0 ? list.length - 1 : selected - 1) : selected + 1;
      if (next < 0 || next >= list.length) { selected = -1; return; }
      event.preventDefault();
      selected = next;
      els.announcer.textContent = list[selected].label;
    } else if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      if (list[selected]) useTarget(list[selected]);
      else if (list.length) { selected = 0; els.announcer.textContent = list[0].label; }
    }
  });
  canvas.addEventListener('blur', () => { selected = -1; });
  document.addEventListener('keydown', event => {
    if ((event.key === 'r' || event.key === 'R') && !event.ctrlKey && !event.metaKey && !event.altKey && els.start.hidden && els.levels.hidden) {
      event.preventDefault();
      startLevel(game.level);
    }
  });

  $('play').addEventListener('click', () => { els.start.hidden = true; startLevel(game.level); });
  $('restart').addEventListener('click', () => startLevel(game.level));
  $('open-levels').addEventListener('click', openLevels);
  $('fail-levels').addEventListener('click', openLevels);
  $('close-levels').addEventListener('click', () => { els.levels.hidden = true; if (game.state === 'play') canvas.focus({ preventScroll: true }); else showEnd(); });
  els.next.addEventListener('click', () => startLevel(game.level + 1));
  $('replay').addEventListener('click', () => startLevel(game.level));
  $('retry').addEventListener('click', () => startLevel(game.level));
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  new ResizeObserver(resize).observe(els.stage);
  loadLevel(Math.min(progress.unlocked, LEVELS.length));
  requestAnimationFrame(frame);
  $('play').focus({ preventScroll: true });
})();
</script>
</body>
</html>
