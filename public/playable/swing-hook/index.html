<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swing Hook</title>
<style>
:root {
  --bg: #1e1433;
  --ink: #2a1c45;
  --text: #ffffff;
  --muted: #7a6b94;
  --coral: #ff6b4a;
  --coral-dark: #c94a2e;
  --gold: #ffd166;
  --paper: #fff6e6;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.frame { position: relative; width: 100%; height: 100%; overflow: hidden; container-type: size; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
canvas:focus-visible { outline: none; }

.hud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.hud[hidden] { display: none; }
.chip { background: #1e1433b8; border: 1px solid #ffffff22; padding: 6px 12px; border-radius: 99px; font-weight: 800; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip small { font-size: 12px; color: #d9cdf0; font-weight: 700; margin-right: 4px; }
.hud .grow { flex: 1; }
.icon { pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; background: #1e1433b8; border: 1px solid #ffffff22; display: grid; place-items: center; font-size: 18px; font-weight: 900; }
.icon:active { transform: scale(.94); }
.stars-row { color: #ffffff44; letter-spacing: 1px; }
.stars-row b { color: var(--gold); font-weight: 900; }

.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; text-align: center; background: #160e27a6; }
.overlay[hidden] { display: none; }
.title { font-size: clamp(36px, min(13cqw, 13cqh), 84px); font-weight: 900; letter-spacing: -.03em; line-height: 1; color: #fff; text-shadow: 0 4px 0 var(--coral-dark), 0 10px 28px #0008; }
.title span { color: var(--gold); }
.tagline { margin-top: 10px; max-width: 26em; font-size: clamp(13px, 3.6cqw, 17px); font-weight: 700; line-height: 1.4; color: #f3eaff; }
.menu-btns { display: grid; gap: 10px; margin-top: clamp(14px, 5cqh, 34px); width: min(100%, 280px); }
.cta { padding: 14px 26px; border-radius: 99px; background: var(--coral); color: #fff; font-size: 19px; font-weight: 900; box-shadow: 0 5px 0 var(--coral-dark), 0 10px 24px #0005; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--coral-dark); }
.ghost { padding: 11px 22px; border-radius: 99px; background: #ffffff1c; border: 2px solid #ffffff44; font-size: 16px; font-weight: 800; }
.hint { margin-top: 14px; font-size: 13px; font-weight: 700; color: #d9cdf0; max-width: 30em; line-height: 1.4; }
.hint:empty { display: none; }

.panel { width: min(100%, 340px); max-height: calc(100% - 8px); overflow-y: auto; padding: 18px; border-radius: 22px; background: var(--paper); color: var(--ink); box-shadow: 0 8px 0 #e2cfa9, 0 20px 50px #0008; animation: rise .25s ease-out; }
.panel.wide { width: min(100%, 520px); }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
.panel .row { display: flex; gap: 8px; margin-top: 14px; }
.panel .row > * { flex: 1; }
.pbtn { padding: 12px 10px; border-radius: 14px; background: var(--coral); color: #fff; font-size: 16px; font-weight: 900; box-shadow: 0 4px 0 var(--coral-dark); }
.pbtn.alt { background: #eadcc2; color: var(--ink); box-shadow: 0 4px 0 #cdb991; }
.pbtn:active { transform: translateY(2px); box-shadow: none; }
.big-stars { font-size: 44px; letter-spacing: 6px; margin-top: 8px; color: #e4d6bb; line-height: 1; }
.big-stars b { color: #f4b400; text-shadow: 0 2px 0 #c98a00; }
.stats { display: flex; justify-content: center; gap: 22px; margin-top: 10px; }
.stats small { display: block; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stats strong { font-size: 24px; font-variant-numeric: tabular-nums; }
.goal { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.badge { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 99px; background: var(--coral); color: #fff; font-size: 13px; font-weight: 800; }
.badge[hidden] { display: none; }

.world-head { display: flex; align-items: center; gap: 8px; }
.world-head h2 { flex: 1; font-size: 22px; }
.world-head .sub { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
.arrow { width: 40px; height: 40px; border-radius: 50%; background: #eadcc2; font-size: 20px; font-weight: 900; color: var(--ink); }
.arrow:disabled { opacity: .35; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.lvl { aspect-ratio: 1; min-height: 40px; min-width: 0; border-radius: 14px; background: #fff; border: 2px solid #e6d5b5; color: var(--ink); font-weight: 900; font-size: 18px; display: grid; place-content: center; gap: 1px; }
.lvl small { font-size: 11px; letter-spacing: 1px; color: #d8c8a8; }
.lvl small b { color: #f4b400; }
.lvl[data-theme="0"] { border-color: #ffb08f; }
.lvl[data-theme="1"] { border-color: #8fd9a8; }
.lvl[data-theme="2"] { border-color: #9fd8ff; }
.lvl[data-theme="3"] { border-color: #ff9a7a; }
.lvl:disabled { background: #f1e6d2; color: #bba98a; cursor: default; }

.flash { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: clamp(26px, 8cqw, 46px); font-weight: 900; color: #fff; text-shadow: 0 3px 0 var(--coral-dark), 0 8px 20px #0008; pointer-events: none; white-space: nowrap; }
.flash[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 420px) {
  .title { font-size: clamp(30px, 14cqh, 56px); }
  .tagline { margin-top: 4px; font-size: 13px; }
  .menu-btns { margin-top: 10px; grid-template-columns: 1fr 1fr; width: min(100%, 420px); }
  .cta { padding: 10px 18px; font-size: 17px; }
  .ghost { padding: 8px 16px; }
  .hint { margin-top: 8px; font-size: 12px; }
  .panel { padding: 12px 14px; }
  .panel h2 { font-size: 20px; }
  .big-stars { font-size: 30px; margin-top: 2px; }
  .stats { margin-top: 4px; }
  .stats strong { font-size: 20px; }
  .panel .row { margin-top: 8px; }
  .pbtn { padding: 9px 8px; }
  .panel.wide { width: min(100%, 640px); }
  .grid { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .lvl { aspect-ratio: auto; min-height: 50px; font-size: 16px; }
  .icon { width: 36px; height: 36px; }
  .chip { padding: 5px 10px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="frame" id="frame">
    <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
    <div class="hud" id="hud" hidden>
      <span class="chip" id="hud-level"></span>
      <span class="chip"><small data-i18n="time"></small><span id="hud-time">0.0</span></span>
      <span class="grow"></span>
      <button type="button" class="icon" id="btn-restart" data-i18n-label="restart">↻</button>
      <button type="button" class="icon" id="btn-pause" data-i18n-label="pause">❚❚</button>
    </div>
    <p class="flash" id="flash" hidden></p>

    <div class="overlay" id="start">
      <h1 class="title">Swing <span>Hook</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="menu-btns">
        <button type="button" class="cta" id="play"></button>
        <button type="button" class="ghost" id="open-levels" data-i18n="levels"></button>
      </div>
      <p class="hint" data-i18n="controls"></p>
      <p class="hint" id="start-stars"></p>
    </div>

    <div class="overlay" id="levels" hidden>
      <div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="world-name">
        <div class="world-head">
          <button type="button" class="arrow" id="w-prev" data-i18n-label="prevWorld">‹</button>
          <h2><span id="world-name"></span><span class="sub" id="world-stars"></span></h2>
          <button type="button" class="arrow" id="w-next" data-i18n-label="nextWorld">›</button>
        </div>
        <div class="grid" id="grid"></div>
        <div class="row"><button type="button" class="pbtn alt" id="levels-back" data-i18n="back"></button></div>
      </div>
    </div>

    <div class="overlay" id="paused" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="paused-title">
        <h2 id="paused-title" data-i18n="paused"></h2>
        <div class="row"><button type="button" class="pbtn" id="resume" data-i18n="resume"></button></div>
        <div class="row">
          <button type="button" class="pbtn alt" id="pause-restart" data-i18n="restart"></button>
          <button type="button" class="pbtn alt" id="pause-levels" data-i18n="levels"></button>
        </div>
      </div>
    </div>

    <div class="overlay" id="win" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
        <h2 id="win-title"></h2>
        <p class="big-stars" id="win-stars" aria-hidden="true"></p>
        <div class="stats">
          <div><small data-i18n="time"></small><strong id="win-time"></strong></div>
          <div><small data-i18n="best"></small><strong id="win-best"></strong></div>
        </div>
        <p class="goal" id="win-goal"></p>
        <p class="badge" id="win-new" data-i18n="newBest" hidden></p>
        <div class="row">
          <button type="button" class="pbtn alt" id="win-retry" data-i18n="retry"></button>
          <button type="button" class="pbtn" id="win-next" data-i18n="next"></button>
        </div>
        <div class="row"><button type="button" class="pbtn alt" id="win-levels" data-i18n="levels"></button></div>
      </div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<script>
(() => {
  // ---- Engine (pure, deterministic: fixed 1/120 s steps, no randomness) ----
  const STEP = 1 / 120, GRAV = 1300, RANGE = 290, PR = 12, FLOOR_DIE = 660, VMAX = 1500, MIN_SWING = 360, PUMP = 520;
  // Each level is a string of hand-placed chunks; letters are explained in chunk().
  // h hook · g wide gap hook · l low hook · u high hook · p bounce pad (no hook) · s saw under a hook pair
  // m moving hook · w wall to swing over · c hanging ceiling block · z saw on a moving hook · d double saw
  const LEVELS = [
    'hhhh', 'hhhhh', 'hlhuh', 'hhghh', 'hphh', 'hhuhlh', 'hghgh', 'hphph', 'hulhgh', 'hhpghuh',
    'hhwhh', 'hwhgh', 'hshhh', 'hhshwh', 'hphwh', 'hchhh', 'hshch', 'hwphsh', 'hgshwh', 'hchwpsh',
    'hmhh', 'hmhmh', 'hhmsh', 'hpmhh', 'hmwmh', 'hcmhsh', 'hzhh', 'hmzhwh', 'hgmpmh', 'hmsmczh',
    'hdhh', 'hshdh', 'hzdhh', 'hwdph', 'hcdmh', 'hgzdwh', 'hdpdmh', 'hmdczh', 'hsdwzph', 'hzdcmdwh',
  ];
  const THEMES = 4;

  function chunk(ch, cx, y0, L, idx) {
    const H = L.hooks, gap = 245 + Math.min(idx, 39) * 1.2;
    switch (ch) {
      case 'h': H.push({ x: cx + gap, y: y0 }); return cx + gap;
      case 'l': H.push({ x: cx + gap, y: y0 + 70 }); return cx + gap;
      case 'u': H.push({ x: cx + gap, y: y0 - 60 }); return cx + gap;
      case 'g': H.push({ x: cx + gap + 95, y: y0 - 20 }); return cx + gap + 95;
      case 'p': L.pads.push({ x: cx + 140, y: 560, w: 150, power: 1000 }); H.push({ x: cx + 470, y: y0 }); return cx + 470;
      case 's': L.saws.push({ x: cx + gap / 2 + 20, y: y0 + 300, r: 30 }); H.push({ x: cx + gap, y: y0 }); return cx + gap;
      case 'm': H.push({ x: cx + gap, y: y0, ax: 70, ay: 0, per: 3.2 }); return cx + gap;
      case 'w': L.blocks.push({ x: cx + gap / 2 + 10, y: y0 + 230, w: 46, h: 600 }); H.push({ x: cx + gap, y: y0 - 20 }); return cx + gap;
      case 'c': L.blocks.push({ x: cx + gap / 2 - 30, y: -400, w: 60, h: 400 + y0 - 70 }); H.push({ x: cx + gap, y: y0 + 30 }); return cx + gap;
      case 'z': L.saws.push({ x: cx + gap / 2 + 20, y: y0 + 310, r: 28, ax: 60, per: 2.6 }); H.push({ x: cx + gap, y: y0, ax: 0, ay: 40, per: 2.8 }); return cx + gap;
      case 'd': L.saws.push({ x: cx + gap / 2 - 30, y: y0 + 290, r: 26 }, { x: cx + gap / 2 + 70, y: y0 + 320, r: 26 }); H.push({ x: cx + gap, y: y0 }); return cx + gap;
    }
    return cx;
  }

  function buildLevel(idx) {
    const L = { idx, hooks: [], pads: [], blocks: [], saws: [], theme: Math.floor(idx / 10) % THEMES };
    L.blocks.push({ x: -400, y: 420, w: 560, h: 400, start: true });
    let cx = 60;
    const s = LEVELS[idx];
    for (let i = 0; i < s.length; i++) {
      const y0 = 150 + ((i * 37 + idx * 23) % 3) * 22;
      cx = chunk(s[i], cx, y0, L, idx);
    }
    const fx = cx + 200;
    L.finish = { x: fx, y: 400, w: 420, h: 400 };
    L.blocks.push(L.finish);
    L.length = fx;
    // Star times (seconds): 3 stars needs a clean, fluid run.
    L.par3 = Math.round((fx / 470 + 1.2) * 10) / 10;
    L.par2 = Math.round(L.par3 * 1.6 * 10) / 10;
    return L;
  }

  const wave = (a, per, t) => a ? a * Math.sin(t * 2 * Math.PI / per) : 0;
  function hookPos(h, t) { return { x: h.x + wave(h.ax, h.per, t), y: h.y + wave(h.ay, h.per, t) }; }
  function sawPos(s, t) { return { x: s.x + wave(s.ax, s.per, t), y: s.y }; }

  function newState() {
    return { x: 90, y: 400, vx: 330, vy: -480, hook: -1, len: 0, t: 0, dead: false, won: false, ang: 0, spin: 0, ground: false, steps: 0 };
  }

  function pickHook(L, S) {
    let best = -1, bs = Infinity;
    for (let i = 0; i < L.hooks.length; i++) {
      const p = hookPos(L.hooks[i], S.t);
      const dx = p.x - S.x, dy = p.y - S.y, d = Math.hypot(dx, dy);
      if (d > RANGE || p.y > S.y + 20) continue;
      const score = d - dx * 0.5;
      if (score < bs) { bs = score; best = i; }
    }
    return best;
  }

  function collideBlocks(L, S) {
    S.ground = false;
    for (const b of L.blocks) {
      const nx = Math.max(b.x, Math.min(S.x, b.x + b.w)), ny = Math.max(b.y, Math.min(S.y, b.y + b.h));
      const dx = S.x - nx, dy = S.y - ny, d2 = dx * dx + dy * dy;
      if (d2 >= PR * PR) continue;
      if (b === L.finish) { S.won = true; return; }
      let ux, uy, d = Math.sqrt(d2);
      if (d > 1e-6) { ux = dx / d; uy = dy / d; } else { ux = 0; uy = -1; d = 0; }
      S.x += ux * (PR - d); S.y += uy * (PR - d);
      const vn = S.vx * ux + S.vy * uy;
      if (vn < 0) {
        S.vx -= 1.4 * vn * ux; S.vy -= 1.4 * vn * uy;
        if (uy < -0.7) { S.ground = true; S.vx *= 0.96; S.spin *= 0.8; }
      }
    }
  }

  // One fixed step; `hold` is whether the player is pressing.
  function step(L, S, hold) {
    if (S.dead || S.won) return;
    const dt = STEP;
    if (!hold && S.hook >= 0) {
      // Release: keep the swing's angular speed as a tumble.
      S.spin = Math.max(-14, Math.min(14, S.vx / 60));
      S.hook = -1;
    }
    if (hold && S.hook < 0) {
      const h = pickHook(L, S);
      if (h >= 0) {
        const p = hookPos(L.hooks[h], S.t);
        S.hook = h; S.len = Math.max(60, Math.hypot(p.x - S.x, p.y - S.y));
        // Grab assist: a weak swing is topped up so a hook never leaves you stuck hanging.
        const rx = (S.x - p.x) / S.len, ry = (S.y - p.y) / S.len, tx = -ry, ty = rx;
        let vt = S.vx * tx + S.vy * ty;
        if (Math.abs(vt) < MIN_SWING) vt = (Math.sign(vt) || Math.sign(S.vx * tx) || 1) * MIN_SWING;
        S.vx = vt * tx; S.vy = vt * ty;
      } else if (S.ground) { S.vx = 300; S.vy = -520; S.ground = false; }
    }
    S.vy += GRAV * dt;
    if (S.hook >= 0 && S.vx > 0) {
      // Forward pump: swinging toward the goal gains speed, so momentum builds hook to hook.
      const p = hookPos(L.hooks[S.hook], S.t), dx = S.x - p.x, dy = S.y - p.y, d = Math.hypot(dx, dy) || 1;
      let tx = -dy / d, ty = dx / d; if (tx < 0) { tx = -tx; ty = -ty; }
      S.vx += tx * PUMP * dt; S.vy += ty * PUMP * dt;
    }
    S.x += S.vx * dt; S.y += S.vy * dt;
    if (S.hook >= 0) {
      const p = hookPos(L.hooks[S.hook], S.t + dt);
      const dx = S.x - p.x, dy = S.y - p.y, d = Math.hypot(dx, dy);
      if (d > S.len) {
        const ux = dx / d, uy = dy / d;
        S.x = p.x + ux * S.len; S.y = p.y + uy * S.len;
        const vr = S.vx * ux + S.vy * uy;
        if (vr > 0) { S.vx -= vr * ux; S.vy -= vr * uy; }
      }
      S.ang = Math.atan2(S.x - p.x, -(S.y - p.y)) + Math.PI;
    } else {
      S.ang += S.spin * dt;
    }
    const sp = Math.hypot(S.vx, S.vy);
    if (sp > VMAX) { S.vx *= VMAX / sp; S.vy *= VMAX / sp; }
    for (const pd of L.pads) {
      if (S.vy > 0 && S.x > pd.x - 4 && S.x < pd.x + pd.w + 4 && S.y + PR > pd.y && S.y - S.vy * dt + PR <= pd.y + 2) {
        S.y = pd.y - PR; S.vy = -pd.power; S.spin = 9 * Math.sign(S.vx || 1); S.bounced = (S.bounced || 0) + 1;
      }
    }
    collideBlocks(L, S);
    if (S.x < -380) { S.x = -380; S.vx = Math.abs(S.vx); }
    for (const sw of L.saws) {
      const q = sawPos(sw, S.t);
      if (Math.hypot(S.x - q.x, S.y - q.y) < sw.r + PR - 3) { S.dead = 'saw'; break; }
    }
    if (S.y > FLOOR_DIE) S.dead = 'fall';
    S.t += dt; S.steps++;
  }
  const cloneState = S => Object.assign({}, S);

    for (const sw of L.saws) {
      const q = sawPos(sw, S ? S.t : 0);
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(reducedMotion ? 0 : time * 8);
      ctx.fillStyle = '#d7dbe6'; ctx.beginPath();
      for (let k = 0; k < 24; k++) { const a = k * Math.PI / 12, r = k % 2 ? sw.r - 6 : sw.r; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.fill(); ctx.fillStyle = '#7a8195'; ctx.beginPath(); ctx.arc(0, 0, sw.r * 0.35, 0, 7); ctx.fill();
      ctx.restore();
      if (sw.ax) { ctx.strokeStyle = '#ffffff33'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sw.x - sw.ax, sw.y); ctx.lineTo(sw.x + sw.ax, sw.y); ctx.stroke(); }
    }
    // Hooks; the one a press would grab is highlighted.
    const target = S && S.hook < 0 && mode === 'play' ? pickHook(L, S) : -1;
    L.hooks.forEach((h, i) => {
      const p = hookPos(h, S ? S.t : 0);
      if (h.ax || h.ay) { ctx.strokeStyle = '#ffffff30'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(h.x - (h.ax || 0), h.y - (h.ay || 0)); ctx.lineTo(h.x + (h.ax || 0), h.y + (h.ay || 0)); ctx.stroke(); }
      if (i === target) { ctx.strokeStyle = P.hook + '88'; ctx.lineWidth = 3; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.arc(p.x, p.y, 24, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
      ctx.fillStyle = '#00000044'; ctx.beginPath(); ctx.arc(p.x + 2, p.y + 3, 12, 0, 7); ctx.fill();
      ctx.strokeStyle = S && S.hook === i ? '#ffffff' : P.hook; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, 7); ctx.stroke();
    });
    if (S) drawPlayer(time);
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / 0.8); ctx.fillStyle = '#fff'; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawPlayer(time) {
    if (S.hook >= 0) {
      const p = hookPos(L.hooks[S.hook], S.t);
      ctx.strokeStyle = '#f4e9d0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(S.x, S.y); ctx.stroke();
    }
    if (!reducedMotion) { ctx.fillStyle = '#ffffff'; trail.forEach((q, i) => { ctx.globalAlpha = i / trail.length * 0.25; ctx.beginPath(); ctx.arc(q.x, q.y, 4, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1; }
    if (mode === 'dead') return;
    // Stickman around the grab point: body hangs "down" from the hands along S.ang.
    ctx.save(); ctx.translate(S.x, S.y); ctx.rotate(S.ang);
    const sway = Math.sin(time * 9) * (S.hook >= 0 ? 0.25 : 0.6);
    ctx.strokeStyle = '#1b1029'; ctx.lineCap = 'round'; ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-5, -4); ctx.lineTo(0, 10); ctx.moveTo(5, -4); ctx.lineTo(0, 10); // arms up to the hands
    ctx.moveTo(0, 10); ctx.lineTo(0, 34); // torso
    ctx.moveTo(0, 34); ctx.lineTo(-9 - sway * 8, 52); ctx.moveTo(0, 34); ctx.lineTo(9 + sway * 8, 50); // legs
    ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(-5, -4); ctx.lineTo(0, 10); ctx.moveTo(5, -4); ctx.lineTo(0, 10); ctx.moveTo(0, 10); ctx.lineTo(0, 34);
    ctx.moveTo(0, 34); ctx.lineTo(-9 - sway * 8, 52); ctx.moveTo(0, 34); ctx.lineTo(9 + sway * 8, 50);
    ctx.stroke();
    ctx.fillStyle = '#ff6b4a'; ctx.strokeStyle = '#1b1029'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 2, 8, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-8, 0, 16, 3);
    ctx.restore();
  }

  function render(time) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (S && (mode === 'play' || mode === 'dead' || mode === 'paused' || mode === 'won')) {
      const tx = S.x - viewW * 0.32 + Math.max(-60, Math.min(160, S.vx * 0.12));
      const ty = Math.min(0, S.y - 200);
      const k = mode === 'play' ? 0.12 : 0.05;
      camX += (Math.max(-160, tx) - camX) * k; camY += (ty - camY) * k;
    } else {
      camX = -120 + time * 30 % 2000; camY = 0;
    }
    drawWorld(time);
  }

  function frameLoop(now) {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    if (!document.hidden) update(dt);
    render(now / 1000);
    requestAnimationFrame(frameLoop);
  }

  // ---- Input ----
  function press() { if (mode === 'play') holding = true; }
  function releaseHold() { holding = false; }
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } press(); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(ev, releaseHold);
  window.addEventListener('blur', releaseHold);
  document.addEventListener('keydown', e => {
    const k = e.key;
    if ((k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') && mode === 'play') {
      if (e.target.tagName === 'BUTTON' && e.target !== canvas) return;
      e.preventDefault(); if (!e.repeat) press();
    } else if ((k === 'r' || k === 'R') && (mode === 'play' || mode === 'dead' || mode === 'won' || mode === 'paused')) { e.preventDefault(); startLevel(L.idx); }
    else if ((k === 'p' || k === 'P') && (mode === 'play' || mode === 'paused')) { e.preventDefault(); mode === 'play' ? pause() : resume(); }
  });
  document.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') releaseHold(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseHold(); pause(); } });

  $('play').addEventListener('click', () => startLevel(unlockedUpTo()));
  $('open-levels').addEventListener('click', openLevels);
  $('levels-back').addEventListener('click', openMenu);
  $('w-prev').addEventListener('click', () => { world = Math.max(0, world - 1); renderGrid(); });
  $('w-next').addEventListener('click', () => { world = Math.min(3, world + 1); renderGrid(); });
  $('btn-pause').addEventListener('click', pause);
  $('btn-restart').addEventListener('click', () => startLevel(L.idx));
  $('resume').addEventListener('click', resume);
  $('pause-restart').addEventListener('click', () => startLevel(L.idx));
  $('pause-levels').addEventListener('click', openLevels);
  $('win-retry').addEventListener('click', () => startLevel(L.idx));
  $('win-next').addEventListener('click', () => startLevel(Math.min(N - 1, L.idx + 1)));
  $('win-levels').addEventListener('click', openLevels);

  new ResizeObserver(resize).observe(frame);
  resize();
  openMenu();
  requestAnimationFrame(frameLoop);

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__swingHook = {
    levels: N,
    state: () => ({ mode, level: L ? L.idx : -1, x: S && S.x, y: S && S.y, hook: S ? S.hook : -1, t: S && S.t, dead: S && S.dead, won: S && S.won, tries, unlocked: unlockedUpTo(), stars: totalStars() }),
    level: i => { const d = levelData(i); return { par3: d.par3, par2: d.par2, length: d.length }; },
    start: i => startLevel(i),
    play: toggles => { script = toggles; },
    stopScript: () => { script = null; },
  };
})();
</script>
</body>
</html>
