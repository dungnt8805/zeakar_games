<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marble Chain</title>
<style>
:root {
  --bg: #1c120d;
  --bg-2: #3d2416;
  --text: #fff4e4;
  --muted: #d8bf9f;
  --accent: #ff9b42;
  --accent-dark: #c4621a;
  --teal: #35d0bf;
  --panel: #fff6e8;
  --ink: #3a2314;
  --ink-muted: #85654c;
  --line: #ecd9bb;
  --chip: #00000040;
  --side: clamp(150px, 19vw, 236px);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(120% 90% at 50% 20%, var(--bg-2), var(--bg) 72%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: grid; grid-template-areas: "hud" "stage" "bar"; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.hud { grid-area: hud; display: flex; align-items: stretch; gap: 6px; width: 100%; max-width: 640px; justify-self: center; min-width: 0; }
.ibtn { flex: 0 0 auto; width: 44px; min-height: 42px; border-radius: 13px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff1c; display: grid; place-items: center; }
.ibtn svg { width: 20px; height: 20px; fill: currentColor; }
.ibtn:active { transform: translateY(1px); }
.stat { flex: 1; min-width: 0; padding: 4px 9px; border-radius: 13px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff14; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 18px; font-weight: 900; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .hot { color: var(--accent); }
.hint { display: none; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--muted); }

.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#cv:focus-visible { outline: none; }
.stage:has(#cv:focus-visible) { outline: 3px solid #ff9b4277; outline-offset: -3px; border-radius: 18px; }
.toast { position: absolute; left: 50%; top: 8px; transform: translate(-50%, -6px); max-width: calc(100% - 16px); width: max-content; padding: 6px 14px; border-radius: 99px; background: #1c120de8; color: #fff; font-size: 14px; font-weight: 800; line-height: 1.3; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; box-shadow: 0 6px 20px #0007, inset 0 0 0 1px #ffffff1c; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: #b8322af0; }
.toast.good { background: #1f8a77f0; }

.bar { grid-area: bar; display: flex; align-items: center; gap: 8px; width: 100%; max-width: 640px; justify-self: center; min-width: 0; }
.gauge { flex: 1; min-width: 0; }
.gauge .gl { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .03em; white-space: nowrap; overflow: hidden; }
.gauge .gl span { overflow: hidden; text-overflow: ellipsis; }
.gtrack { margin-top: 3px; height: 12px; border-radius: 99px; background: #0000004d; box-shadow: inset 0 0 0 1px #ffffff1a; overflow: hidden; }
.gtrack i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--teal), #f4d35e 60%, var(--accent)); transition: width .3s; }
.powers { display: flex; gap: 4px; flex: 0 0 auto; }
.pw { position: relative; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: #ffffff1a; box-shadow: inset 0 0 0 2px var(--c); overflow: hidden; }
.pw svg { width: 20px; height: 20px; position: relative; z-index: 1; }
.pw b { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--c); }
.swapbtn { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; min-height: 42px; padding: 0 12px; border-radius: 14px; background: var(--chip); box-shadow: inset 0 0 0 2px #ffffff26; font-size: 18px; font-weight: 900; }
.swapbtn:active { transform: translateY(1px); }
.dot { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #fff9 0 14%, var(--c, #888) 48%, color-mix(in srgb, var(--c, #888), #000 38%)); box-shadow: 0 1px 3px #0006; }
.dot.sm { width: 13px; height: 13px; }

.ov { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #140b07b8; }
.ov[hidden] { display: none; }
.panel { width: min(100%, 380px); max-height: calc(100dvh - 16px); overflow-y: auto; overscroll-behavior: contain; padding: 18px 16px; border-radius: 22px; background: var(--panel); color: var(--ink); text-align: center; box-shadow: 0 7px 0 #dcc29b, 0 24px 60px #000b; animation: rise .28s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.logo { display: flex; justify-content: center; gap: 4px; }
.logo i { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #fffb 0 14%, var(--c) 48%, color-mix(in srgb, var(--c), #000 38%)); box-shadow: 0 2px 4px #0004; }
.panel h1 { margin-top: 8px; font-size: 36px; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.panel h1 span { color: var(--accent-dark); }
.tagline { margin-top: 8px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--ink-muted); }
.modes { margin-top: 14px; display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 1px 10px; padding: 10px 12px; border-radius: 16px; background: #fff; text-align: left; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode .ic { grid-row: span 2; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--c); color: #fff; }
.mode .ic svg { width: 24px; height: 24px; fill: currentColor; }
.mode strong { font-size: 17px; font-weight: 900; line-height: 1.2; }
.mode small { font-size: 12px; font-weight: 700; color: var(--ink-muted); line-height: 1.3; }
.small { margin-top: 12px; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--ink-muted); }
.small:empty, .small[hidden] { display: none; }
.cta { display: block; width: 100%; margin-top: 14px; padding: 13px; border-radius: 16px; background: var(--accent); color: #2b1504; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost { display: block; width: 100%; margin-top: 9px; padding: 11px; border-radius: 14px; background: #f1e2c8; color: var(--ink); font-size: 15px; font-weight: 800; }
.ghost:active { transform: translateY(2px); }
.cta[hidden], .ghost[hidden] { display: none; }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; min-width: 0; }
.big { margin-top: 8px; font-size: 34px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.sub { margin-top: 6px; font-size: 15px; font-weight: 800; color: var(--ink-muted); line-height: 1.35; }
.sub:empty { display: none; }
.stars { margin-top: 10px; font-size: 36px; letter-spacing: 4px; line-height: 1; color: #f2a516; text-shadow: 0 2px 0 #c47c06; }
.stars .off { color: #e3d2b2; text-shadow: none; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: #ffd34d; color: #3a2400; font-size: 14px; font-weight: 900; }
.badge[hidden] { display: none; }
.levels { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
.lv { aspect-ratio: 1; min-height: 46px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); display: grid; place-content: center; gap: 2px; }
.lv strong { font-size: 18px; font-weight: 900; line-height: 1; }
.lv small { font-size: 10px; letter-spacing: 1px; line-height: 1; color: #f2a516; }
.lv small .off { color: #e3d2b2; }
.lv:disabled { opacity: .45; cursor: default; }
.lv.cur { box-shadow: 0 3px 0 var(--accent-dark), inset 0 0 0 2px var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Wide frames: HUD and controls move to a side column so the track uses the full height. */
@media (min-aspect-ratio: 5/4) {
  .app { grid-template-areas: "hud stage" "bar stage"; grid-template-columns: var(--side) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 10px; }
  .hud { flex-direction: column; justify-content: flex-start; max-width: none; gap: 8px; min-height: 0; overflow: hidden; }
  .hud .ibtn { width: 100%; min-height: 40px; }
  .stat { flex: 0 0 auto; padding: 7px 12px; }
  .stat small { font-size: 11px; }
  .stat strong { font-size: 24px; }
  .hint { display: block; margin-top: auto; padding: 2px 2px 0; }
  .bar { flex-direction: column; align-items: stretch; max-width: none; gap: 8px; }
  .powers { flex-wrap: wrap; min-height: 0; }
  .powers:empty { display: none; }
  .swapbtn { justify-content: center; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 560px) {
  .hint { display: none; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 420px) {
  :root { --side: clamp(118px, 17vw, 180px); }
  .app { gap: 6px; }
  .hud { gap: 5px; }
  .hud .ibtn { min-height: 34px; }
  .stat { padding: 3px 9px; }
  .stat small { font-size: 10px; }
  .stat strong { font-size: 17px; }
  .bar { gap: 5px; }
  .swapbtn { min-height: 36px; }
  .gtrack { height: 9px; }
}
@media (max-height: 560px) {
  .panel { padding: 12px 14px; border-radius: 18px; }
  .panel h1 { font-size: 28px; }
  .logo i { width: 16px; height: 16px; }
  .tagline { font-size: 13px; margin-top: 6px; }
  .modes { margin-top: 10px; gap: 6px; }
  .mode { padding: 7px 10px; }
  .cta { margin-top: 10px; padding: 10px; font-size: 17px; }
  .ghost { margin-top: 7px; padding: 8px; }
  .big { font-size: 28px; }
  .stars { font-size: 28px; margin-top: 6px; }
  .small { margin-top: 8px; }
}
@media (max-height: 420px) and (min-width: 520px) {
  .panel.wide { width: min(100%, 640px); }
  .panel.wide .modes { grid-template-columns: 1fr 1fr; }
  .panel.wide .tagline { display: none; }
  .levels { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .lv { aspect-ratio: auto; min-height: 40px; }
}
@media (max-width: 480px) {
  .levels { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
  .lv { aspect-ratio: auto; min-height: 50px; }
}
@media (max-width: 360px) {
  .stat { padding: 4px 7px; }
  .stat small { letter-spacing: .01em; }
  .stat strong { font-size: 16px; }
  .ibtn { width: 40px; }
  .swapbtn { padding: 0 9px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="hud">
    <button type="button" class="ibtn" id="pause-btn" data-i18n-label="pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.6"/><rect x="14" y="4" width="5" height="16" rx="1.6"/></svg></button>
    <div class="stat"><small id="lvl-label" data-i18n="levelLabel"></small><strong id="lvl">1</strong></div>
    <div class="stat"><small data-i18n="score"></small><strong class="hot" id="score">0</strong></div>
    <div class="stat"><small data-i18n="best"></small><strong id="best">0</strong></div>
    <p class="hint" data-i18n="controls"></p>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
    <div class="toast" id="toast" aria-hidden="true"></div>
  </div>
  <footer class="bar">
    <div class="gauge"><div class="gl"><span id="gauge-label"></span><span id="gauge-value"></span></div><div class="gtrack"><i id="gauge-fill"></i></div></div>
    <div class="powers" id="powers"></div>
    <button type="button" class="swapbtn" id="swap-btn" data-i18n-label="swap"><span class="dot" id="cur-dot"></span><span aria-hidden="true">⇄</span><span class="dot sm" id="next-dot"></span></button>
  </footer>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="ov" id="menu">
  <div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="logo" aria-hidden="true"><i style="--c:#e8443a"></i><i style="--c:#f5b82e"></i><i style="--c:#2fb36b"></i><i style="--c:#2f86e6"></i><i style="--c:#9b5de5"></i><i style="--c:#25c6b8"></i></div>
    <h1 id="menu-title">Marble <span>Chain</span></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="modes">
      <button type="button" class="mode" id="mode-adv"><span class="ic" style="--c:#e8743a" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/></svg></span><strong data-i18n="adventure"></strong><small id="adv-sub"></small></button>
      <button type="button" class="mode" id="mode-end"><span class="ic" style="--c:#1f9e8f" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 7C3.5 7 1.5 9.3 1.5 12s2 5 5 5c2.4 0 3.9-1.6 5.5-3.6C13.6 15.4 15.1 17 17.5 17c3 0 5-2.3 5-5s-2-5-5-5c-2.4 0-3.9 1.6-5.5 3.6C10.4 8.6 8.9 7 6.5 7zm0 2.6c1.3 0 2.3 1 3.8 2.4-1.5 1.4-2.5 2.4-3.8 2.4-1.4 0-2.4-1.1-2.4-2.4s1-2.4 2.4-2.4zm11 0c1.4 0 2.4 1.1 2.4 2.4s-1 2.4-2.4 2.4c-1.3 0-2.3-1-3.8-2.4 1.5-1.4 2.5-2.4 3.8-2.4z"/></svg></span><strong data-i18n="endless"></strong><small id="end-sub"></small></button>
    </div>
    <p class="small" data-i18n="powerHelp"></p>
    <p class="small" data-i18n="controls"></p>
  </div>
</div>

<div class="ov" id="levels" hidden>
  <div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="levels-title">
    <h2 id="levels-title" data-i18n="chooseLevel"></h2>
    <p class="sub" id="levels-stars"></p>
    <div class="levels" id="level-grid"></div>
    <button type="button" class="ghost" id="levels-back" data-i18n="back"></button>
  </div>
</div>

<div class="ov" id="pause" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <h2 id="pause-title" data-i18n="paused"></h2>
    <p class="sub" id="pause-sub"></p>
    <button type="button" class="cta" id="resume" data-i18n="resume"></button>
    <button type="button" class="ghost" id="restart" data-i18n="restart"></button>
    <div class="row2"><button type="button" class="ghost" id="pause-levels" data-i18n="toLevels"></button><button type="button" class="ghost" id="pause-menu" data-i18n="mainMenu"></button></div>
  </div>
</div>

<div class="ov" id="won" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="won-title">
    <h2 id="won-title" data-i18n="cleared"></h2>
    <p class="stars" id="won-stars" aria-hidden="true"></p>
    <p class="big" id="won-score"></p>
    <p class="sub" id="won-sub"></p>
    <p class="badge" id="won-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="won-next"></button>
    <div class="row2"><button type="button" class="ghost" id="won-replay" data-i18n="replay"></button><button type="button" class="ghost" id="won-levels" data-i18n="toLevels"></button></div>
  </div>
</div>

<div class="ov" id="lost" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="lost-title">
    <h2 id="lost-title"></h2>
    <p class="sub" id="lost-text"></p>
    <p class="big" id="lost-score"></p>
    <p class="sub" id="lost-sub"></p>
    <p class="badge" id="lost-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="lost-retry" data-i18n="retry"></button>
    <div class="row2"><button type="button" class="ghost" id="lost-levels" data-i18n="toLevels"></button><button type="button" class="ghost" id="lost-menu" data-i18n="mainMenu"></button></div>
  </div>
</div>

  const BAND_A = smooth([[-0.95, -0.8], [-0.3, -0.84], [0.3, -0.72], [0.75, -0.84], [0.93, -0.55], [0.72, -0.3], [0.4, -0.38]]);

  // Each level: one or two tracks, the shooter position and a few tuning numbers derived from the index.
  const LEVELS = [
    { tr: [spiral({ r0: 0.94, r1: 0.52, turns: 1.15, a0: PI, dir: 1 })] },
    { tr: [WAVE] },
    { tr: [spiral({ shape: 'square', r0: 0.95, r1: 0.5, turns: 1.3, a0: -PI / 2, dir: -1 })] },
    { tr: [MEANDER], sh: [0, 0.78] },
    { tr: [spiral({ r0: 0.9, r1: 0.5, turns: 1.4, a0: 0, dir: 1, wob: 0.08, k: 3 })] },
    { tr: [spiral({ shape: 'heart', r0: 0.95, r1: 0.56, turns: 1.25, a0: PI, dir: 1 })], sh: [0, 0.05] },
    { tr: twin({}) },
    { tr: [HORSESHOE], sh: [-0.3, -0.2] },
    { tr: [spiral({ cx: 0.1, rx: 0.88, r0: 1, r1: 0.44, turns: 1.6, a0: PI / 2, dir: -1 })], sh: [0.1, 0] },
    { tr: [ROWS], sh: [0, 0.25] },
    { tr: [BAND_A, rot180(BAND_A)] },
    { tr: [spiral({ r0: 0.9, r1: 0.52, turns: 1.5, a0: PI, dir: -1, wob: 0.09, k: 5 })] },
    { tr: [spiral({ shape: 'square', r0: 0.96, r1: 0.44, turns: 1.7, a0: 0, dir: 1 })] },
    { tr: [LOOP2] },
    { tr: twin({ shape: 'square', a0: -PI / 2, dir: 1 }) },
    { tr: [spiral({ shape: 'heart', r0: 0.96, r1: 0.5, turns: 1.55, a0: PI, dir: -1 })], sh: [0, 0.05] },
    { tr: [RIBBON], sh: [0.3, 0.72] },
    { tr: [spiral({ r0: 0.92, r1: 0.46, turns: 1.7, a0: PI / 2, dir: 1, wob: 0.07, k: 4 })] },
    { tr: [ARC, rot180(ARC)] },
    { tr: [spiral({ r0: 0.96, r1: 0.46, turns: 2, a0: PI, dir: -1 })] },
    { tr: [BAND_B, rot180(BAND_B)] },
    { tr: [spiral({ shape: 'square', r0: 0.97, r1: 0.46, turns: 1.9, a0: PI / 2, dir: -1, wob: 0.04, k: 4 })] },
    { tr: twin({ wob: 0.07, k: 3, turns: 1.35 }) },
    { tr: [spiral({ r0: 0.97, r1: 0.44, turns: 2.2, a0: -PI / 2, dir: 1 })] },

      speed: (26 + i * 1.3) * (chains > 1 ? 0.9 : 1),
      cluster: 0.42 - i * 0.005,
      power: i === 0 ? 0 : 0.045,

  /* ---------- World geometry ---------- */
  function worldFor(w, h) {

    const long = Math.sqrt(AREA * asp), short = AREA / long;
    return tr ? { W: short, H: long, tr } : { W: long, H: short, tr };
  }
  function mapper(world) {
    const hx = world.W / 2 - MARGIN, hy = world.H / 2 - MARGIN;
    return world.tr ? (u, v) => [world.W / 2 + v * hx, world.H / 2 + u * hy] : (u, v) => [world.W / 2 + u * hx, world.H / 2 + v * hy];
  }
  function buildPath(norm, map) {
    const raw = norm.map(([u, v]) => map(u, v)), xs = [raw[0][0]], ys = [raw[0][1]];
    let carry = 0;
    for (let i = 1; i < raw.length; i++) {

      let d = STEP - carry;

    const i = clamp(Math.floor(clamp(s, 0, path.len) / STEP), 0, path.xs.length - 2), dx = path.xs[i + 1] - path.xs[i], dy = path.ys[i + 1] - path.ys[i], l = Math.hypot(dx, dy) || 1;

  /* ---------- State ---------- */
  let progress = { stars: readJSON(STORE.stars, []), best: readJSON(STORE.best, []) };
  if (!Array.isArray(progress.stars)) progress.stars = [];
  if (!Array.isArray(progress.best)) progress.best = [];
  let endlessBest = Number(readJSON(STORE.endless, 0)) || 0;
  let game = null, view = { scale: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0 }, world = { W: 900, H: 556, tr: false };
  let sprites = [], gloss = null, bg = null, last = performance.now(), toastTimer = 0;
  const keys = { left: false, right: false };
  let pointer = null;

  const unlocked = i => i === 0 || (progress.stars[i - 1] || 0) > 0;
  const totalStars = () => progress.stars.reduce((a, b) => a + (b || 0), 0);

  function newGame(mode, li) {
    const def = mode === 'endless' ? { tr: [LEVELS[li].tr[0]], sh: LEVELS[li].sh } : LEVELS[li];
    const tune = mode === 'endless' ? { colors: 4, count: Infinity, speed: 28, cluster: 0.4, power: 0.05, powers: ['slow', 'reverse', 'bomb', 'aim'] } : levelTuning(li);
    game = {
      mode, li, def, tune, state: 'play', score: 0, time: 0, combo: 0, streak: 0, maxFrac: 0, danger: false, banner: 1.6, shake: 0, endT: 0,
      chains: def.tr.map(() => ({ m: [], pending: mode === 'endless' ? Infinity : 0, total: 0, rollIn: true, lastC: -1, run: 0, path: null })),
      shooter: { x: 0, y: 0, ang: -PI / 2, cur: 0, next: 1, cool: 0, swapT: 0 },
      shots: [], fx: [], texts: [], powers: { slow: 0, reverse: 0, aim: 0 }, startBest: 0,
    };
    if (mode !== 'endless') {
      const per = Math.floor(tune.count / game.chains.length);
      game.chains.forEach((ch, k) => { ch.pending = ch.total = per + (k < tune.count % game.chains.length ? 1 : 0); });
    }
    layoutWorld(true);
    game.shooter.cur = randomColor(); game.shooter.next = randomColor();
    game.startBest = mode === 'endless' ? endlessBest : progress.best[li] || 0;
  }

  function layoutWorld(force) {
    const rect = els.stage.getBoundingClientRect();
    const next = worldFor(rect.width, rect.height);
    const changed = force || Math.abs(next.W - world.W) > 2 || next.tr !== world.tr;
    if (changed) world = next;
    if (game && (changed || !game.chains[0].path)) {
      const map = mapper(world);
      game.chains.forEach((ch, k) => {
        const old = ch.path, path = buildPath(game.def.tr[k], map);
        if (old) for (const b of ch.m) b.s *= path.len / old.len;
        ch.path = path;
        resolve(ch);
      });
      const [sx, sy] = map(...(game.def.sh || [0, 0]));
      game.shooter.x = sx; game.shooter.y = sy;
      game.shots = [];
    }
    return changed;
  }

  /* ---------- Chain mechanics ---------- */
  const need = (a, b) => D * (a.w + b.w) / 2;
  const touching = (a, b) => a.s - b.s <= need(a, b) + 0.6;
  const visible = (ch, b) => b.s >= 0 && b.s <= ch.path.len;

  function colorsNow() {
    if (game.mode !== 'endless') return game.tune.colors;
    return game.time < 50 ? 4 : game.time < 130 ? 5 : 6;
  }
  function presentColors() {
    const set = new Set();
    for (const ch of game.chains) for (const b of ch.m) if (b.s > -D * 3) set.add(b.c);
    return [...set];
  }
  function randomColor() {
    const list = presentColors();
    return list.length ? list[Math.floor(Math.random() * list.length)] : Math.floor(Math.random() * colorsNow());
  }
  function refreshShooter() {
    const list = presentColors();
    if (!list.length) return;
    if (!list.includes(game.shooter.cur)) game.shooter.cur = randomColor();
    if (!list.includes(game.shooter.next)) game.shooter.next = randomColor();
  }

  function spawnColor(ch) {
    const n = colorsNow();
    let c;
    if (ch.lastC >= 0 && ch.lastC < n && ch.run < 2 && Math.random() < game.tune.cluster) c = ch.lastC;
    else { do c = Math.floor(Math.random() * n); while (c === ch.lastC && n > 1); }
    ch.run = c === ch.lastC ? ch.run + 1 : 1;
    ch.lastC = c;
    return c;
  }
  function spawnPower() {
    if (Math.random() >= game.tune.power) return '';
    let live = 0;
    for (const ch of game.chains) for (const b of ch.m) if (b.p) live++;
    if (live >= 2) return '';
    const list = game.tune.powers;
    return list[Math.floor(Math.random() * list.length)];
  }
  function spawn(ch) {
    while (ch.pending > 0) {
      const tail = ch.m[ch.m.length - 1];
      if (tail && tail.s < 0) break;
      ch.m.push({ c: spawnColor(ch), s: tail ? tail.s - need(tail, { w: 1 }) : 0, w: 1, p: spawnPower(), gb: false, cb: 0, pv: 0 });
      ch.pending--;
    }
  }

  function segments(m) {
    const segs = [];
    let a = 0;
    for (let i = 0; i < m.length; i++) if (i === m.length - 1 || !touching(m[i], m[i + 1])) { segs.push([a, i]); a = i + 1; }

  }
  function resolve(ch) {
    const m = ch.m;
    for (let i = m.length - 2; i >= 0; i--) { const nd = m[i + 1].s + need(m[i], m[i + 1]); if (m[i].s < nd) m[i].s = nd; }
  }
  const frontFrac = ch => (ch.m.length ? Math.max(0, ch.m[0].s) / ch.path.len : 0);
  function chainSpeed(ch) {
    if (ch.rollIn) return ROLL_SPEED;
    if (game.powers.reverse > 0) return -REV_SPEED;
    let v = game.tune.speed + (game.mode === 'endless' ? game.time * 0.12 : 0);
    const f = frontFrac(ch);

    if (game.powers.slow > 0) v *= 0.4;

  function stepChain(ch, h) {
    const m = ch.m;

      b.shot = false;

  // Removes every marble flagged dead (bombs can flag more), scores them and marks the new gaps.
  function popDead(combo, origin) {

        else if (b.p) activatePower(b.p);

      for (const [x, y] of bombs) {
        game.fx.push({ kind: 'ring', x, y, r: BOMB_R, t: 0, color: POWER_COLORS.bomb });
        for (const ch of game.chains) for (const b of ch.m) if (!b.dead && visible(ch, b) && Math.hypot(b.x - x, b.y - y) < BOMB_R) b.dead = true;

    for (const ch of game.chains) {

      let removedBefore = false;
      for (const b of ch.m) {

        if (removedBefore && keep.length) { const front = keep[keep.length - 1]; front.gb = true; front.cb = Math.max(front.cb, combo); }
        removedBefore = false;
        keep.push(b);

      ch.m = keep;

    game.score += gained;

    if (combo > 1) { floatText(origin.x, origin.y - 26, t.combo(combo), '#ff9b42'); showToast(t.combo(combo), 'good'); announce(t.combo(combo)); }

  }

  function activatePower(p) {
    game.powers[p] = POWER_TIME[p];
    showToast(t.power[p], 'good');
    announce(t.power[p]);
    renderPowers();
  }

  /* ---------- Shooting ---------- */
  function shoot() {
    const sh = game.shooter;
    if (game.state !== 'play' || sh.cool > 0) return;
    const speed = SHOT_SPEED * (game.powers.aim > 0 ? 1.45 : 1), dx = Math.cos(sh.ang), dy = Math.sin(sh.ang);
    game.shots.push({ x: sh.x + dx * 30, y: sh.y + dy * 30, vx: dx * speed, vy: dy * speed, c: sh.cur });

  function swap() {

    updateDots();
    announce(t.loaded(t.colors[sh.cur]));

  function hitTest(x, y, reach) {

      if (!visible(ch, b)) continue;

  function insert(ch, j, shot) {

    const nb = { c: shot.c, s: hit.s + (ahead ? R : -R), w: 0, p: '', gb: false, cb: 0, pv: 0, ix: shot.x, iy: shot.y, x: shot.x, y: shot.y, shot: true };
    m.splice(ahead ? j : j + 1, 0, nb);
  }

  /* ---------- Main update ---------- */
  function update(dt) {
    if (!game) return;
    for (const f of game.fx) f.t += dt;
    game.fx = game.fx.filter(f => f.t < (f.kind === 'ring' ? 0.45 : f.life));
    for (const f of game.fx) if (f.kind === 'spark') { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.96; f.vy *= 0.96; }
    for (const tx of game.texts) tx.t += dt;
    game.texts = game.texts.filter(tx => tx.t < 1);
    game.shake = Math.max(0, game.shake - dt);
    game.shooter.swapT = Math.max(0, game.shooter.swapT - dt * 6);
    if (game.state === 'lost') return stepLost(dt);
    if (game.state !== 'play') return;
    game.time += dt;
    game.banner = Math.max(0, game.banner - dt);
    const sh = game.shooter;
    sh.cool = Math.max(0, sh.cool - dt);
    const turn = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (turn) sh.ang += turn * 2.6 * dt;
    for (const k of Object.keys(game.powers)) if (game.powers[k] > 0) game.powers[k] = Math.max(0, game.powers[k] - dt);
    const steps = Math.ceil(dt / (1 / 120));
    for (let i = 0; i < steps && game.state === 'play'; i++) {

      for (const ch of game.chains) { stepChain(ch, h); placeMarbles(ch); }
      stepShots(h);

  }
  function placeMarbles(ch) {
    for (const b of ch.m) {
      const [x, y] = pointAt(ch.path, b.s);
      if (b.w < 1 && b.ix !== undefined) { const e = 1 - (1 - b.w) ** 2; b.x = b.ix + (x - b.ix) * e; b.y = b.iy + (y - b.iy) * e; }

    }
  }
  function trackDanger() {

    game.maxFrac = Math.max(game.maxFrac, f);
    game.frac = f;
    if (f > 0.8 && !game.danger) { game.danger = true; showToast(t.danger, 'bad'); announce(t.danger); }
    else if (f < 0.7) game.danger = false;
  }
  function checkEnd() {
    for (const ch of game.chains) if (ch.m.length && ch.m[0].s >= ch.path.len - 1) return lose();
    if (game.mode === 'endless') return;
    if (game.chains.every(ch => ch.pending === 0 && ch.m.length === 0)) win();
  }

  function win() {
    game.state = 'won';
    game.shots = [];
    const bonus = Math.round((500 + (1 - Math.min(1, game.maxFrac)) * 1500) / 10) * 10;
    game.score += bonus;

    canvas.width = view.cw; canvas.height = view.ch;
    view.scale = Math.min(rect.width / world.W, rect.height / world.H);
    view.ox = (rect.width - world.W * view.scale) / 2;
    view.oy = (rect.height - world.H * view.scale) / 2;
    buildSprites();
    if (game) for (const ch of game.chains) placeMarbles(ch);
    buildBackground();
    draw();
  }

  let lastFrame = performance.now();
  function frame(time) {
    const dt = Math.min(0.05, Math.max(0, (time - lastFrame) / 1000));
    lastFrame = time;
    if (!document.hidden) { update(dt); draw(time); }
    requestAnimationFrame(frame);
  }

  /* ---------- Overlays & flow ---------- */
  const OVERLAYS = ['menu', 'levels', 'pause', 'won', 'lost'];
  function openOverlay(el, focusEl) {
    for (const k of OVERLAYS) els[k].hidden = els[k] !== el;
    if (focusEl) focusEl.focus({ preventScroll: true });
  }
  function closeOverlays() { for (const k of OVERLAYS) els[k].hidden = true; }

  function showMenu() {
    if (game) game.state = 'idle';
    if (!game) { newGame('level', 0); game.state = 'idle'; resize(); }
    $('adv-sub').textContent = t.advSub(totalStars());
    $('end-sub').textContent = t.endSub(endlessBest);
    renderPowers();
    openOverlay(els.menu, $('mode-adv'));
  }
  function nextLevelIndex() {
    for (let i = 0; i < LEVELS.length; i++) if (!progress.stars[i]) return unlocked(i) ? i : Math.max(0, i - 1);
    return LEVELS.length - 1;
  }
  function showLevels() {
    if (game) game.state = 'idle';
    const cur = nextLevelIndex();
    els.levelGrid.innerHTML = '';
    LEVELS.forEach((_, i) => {
      const b = document.createElement('button'), stars = progress.stars[i] || 0, open = unlocked(i);
      b.type = 'button';
      b.className = `lv${i === cur ? ' cur' : ''}`;
      b.disabled = !open;
      b.setAttribute('aria-label', open ? t.levelBtn(i + 1, stars) : t.lockedBtn(i + 1));
      b.innerHTML = `<strong>${open ? i + 1 : '🔒'}</strong><small aria-hidden="true">${[1, 2, 3].map(k => (k <= stars ? '★' : '<span class="off">★</span>')).join('')}</small>`;
      b.addEventListener('click', () => startLevel(i));
      els.levelGrid.append(b);
    });
    $('levels-stars').textContent = t.starsTotal(totalStars());
    openOverlay(els.levels, els.levelGrid.children[cur]);
  }
  function startLevel(i) {
    newGame('level', i);
    begin(t.levelStart(i + 1));
  }
  function startEndless() {
    const singles = LEVELS.map((l, i) => i).filter(i => LEVELS[i].tr.length === 1);
    newGame('endless', singles[Math.floor(Math.random() * singles.length)]);
    begin(t.endlessStart);
  }
  function begin(message) {
    closeOverlays();
    resize();
    powersKey = '';
    renderPowers();
    updateHud();
    announce(message);
    canvas.focus({ preventScroll: true });
  }
  function pauseGame() {
    if (!game || game.state !== 'play') return;
    game.state = 'paused';
    keys.left = keys.right = false;
    $('pause-sub').textContent = game.mode === 'endless' ? `${t.endlessName} · ${t.scoreLine(game.score)}` : `${t.level(game.li + 1)} · ${t.scoreLine(game.score)}`;
    $('pause-levels').hidden = game.mode === 'endless';
    openOverlay(els.pause, $('resume'));
  }
  function resumeGame() {
    if (!game || game.state !== 'paused') return;
    game.state = 'play';
    closeOverlays();
    canvas.focus({ preventScroll: true });
  }
  function retry() { if (game.mode === 'endless') startEndless(); else startLevel(game.li); }

  $('mode-adv').addEventListener('click', showLevels);
  $('mode-end').addEventListener('click', startEndless);
  $('levels-back').addEventListener('click', showMenu);
  $('pause-btn').addEventListener('click', () => (game && game.state === 'play' ? pauseGame() : game && game.state === 'paused' ? resumeGame() : null));
  $('resume').addEventListener('click', resumeGame);
  $('restart').addEventListener('click', retry);
  $('pause-levels').addEventListener('click', showLevels);
  $('pause-menu').addEventListener('click', showMenu);
  $('won-next').addEventListener('click', () => startLevel(game.li + 1));
  $('won-replay').addEventListener('click', () => startLevel(game.li));
  $('won-levels').addEventListener('click', showLevels);
  $('lost-retry').addEventListener('click', retry);
  $('lost-levels').addEventListener('click', showLevels);
  $('lost-menu').addEventListener('click', showMenu);
  $('swap-btn').addEventListener('click', () => { swap(); canvas.focus({ preventScroll: true }); });

  /* ---------- Input ---------- */
  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left - view.ox) / view.scale, y: (e.clientY - r.top - view.oy) / view.scale };
  }
  function aimAt(p) {
    const sh = game.shooter;
    if (Math.hypot(p.x - sh.x, p.y - sh.y) > 8) sh.ang = Math.atan2(p.y - sh.y, p.x - sh.x);
  }
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    if (!game || game.state !== 'play') return;
    if (e.button === 2) { swap(); return; }
    const p = toWorld(e);
    if (Math.hypot(p.x - game.shooter.x, p.y - game.shooter.y) < 40) { pointer = { id: e.pointerId, swap: true }; return; }
    canvas.setPointerCapture(e.pointerId);
    pointer = { id: e.pointerId, swap: false };
    aimAt(p);
  });
  canvas.addEventListener('pointermove', e => {
    if (!game || game.state !== 'play') return;
    if ((pointer && pointer.id === e.pointerId && !pointer.swap) || e.pointerType === 'mouse') aimAt(toWorld(e));
  });
  canvas.addEventListener('pointerup', e => {
    if (!pointer || pointer.id !== e.pointerId) return;
    const wasSwap = pointer.swap;
    pointer = null;
    if (!game || game.state !== 'play') return;
    if (wasSwap) { if (Math.hypot(toWorld(e).x - game.shooter.x, toWorld(e).y - game.shooter.y) < 46) swap(); return; }
    aimAt(toWorld(e));
    shoot();
  });
  canvas.addEventListener('pointercancel', () => { pointer = null; });

  const KEY_DIRS = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
  document.addEventListener('keydown', e => {
    if (!game || e.altKey || e.ctrlKey || e.metaKey) return;
    if ((e.key === 'p' || e.key === 'P') && (game.state === 'play' || game.state === 'paused')) { e.preventDefault(); return game.state === 'play' ? pauseGame() : resumeGame(); }
    if (game.state !== 'play' || (e.target instanceof Element && e.target.closest('button'))) return;
    if (KEY_DIRS[e.key]) { keys[KEY_DIRS[e.key]] = true; e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); if (!e.repeat) shoot(); }
    else if (e.key === 'x' || e.key === 'X' || e.key === 'ArrowDown') { e.preventDefault(); swap(); }
  });
  document.addEventListener('keyup', e => { if (KEY_DIRS[e.key]) keys[KEY_DIRS[e.key]] = false; });
  window.addEventListener('blur', () => { keys.left = keys.right = false; });
  document.addEventListener('visibilitychange', () => { lastFrame = performance.now(); if (document.hidden) pauseGame(); });

  // Read-only hooks for automated tests: snapshots and geometry reports, nothing that changes the game.
  window.__marbleChain = Object.freeze({
    state: () => game && {
      mode: game.mode, level: game.li + 1, state: game.state, score: game.score, time: game.time, maxFrac: game.maxFrac, stars: game.stars || 0, streak: game.streak,
      powers: { ...game.powers }, world: { ...world }, view: { scale: view.scale, ox: view.ox, oy: view.oy },
      shooter: { x: game.shooter.x, y: game.shooter.y, ang: game.shooter.ang, cur: game.shooter.cur, next: game.shooter.next, cool: game.shooter.cool },
      shots: game.shots.length,
      chains: game.chains.map(ch => ({ len: ch.path.len, pending: ch.pending, total: ch.total, rollIn: ch.rollIn, marbles: ch.m.map(b => ({ c: b.c, s: b.s, x: b.x, y: b.y, w: b.w, p: b.p })) })),
      overlay: OVERLAYS.find(k => !els[k].hidden) || null,
    },
    levelCount: LEVELS.length,
    trackReport: aspect => LEVELS.map((def, li) => {
      const w = aspect >= 1 ? worldFor(aspect * 600, 600) : worldFor(600, 600 / aspect), map = mapper(w);
      const paths = def.tr.map(n => buildPath(n, map)), [sx, sy] = map(...(def.sh || [0, 0]));
      let self = Infinity, cross = Infinity, shooter = Infinity, edge = Infinity;
      paths.forEach((p, a) => {
        for (let i = 0; i < p.xs.length; i += 3) {
          shooter = Math.min(shooter, Math.hypot(p.xs[i] - sx, p.ys[i] - sy));
          edge = Math.min(edge, p.xs[i], p.ys[i], w.W - p.xs[i], w.H - p.ys[i]);
          for (let j = i + Math.ceil(R * 6 / STEP); j < p.xs.length; j += 3) self = Math.min(self, Math.hypot(p.xs[i] - p.xs[j], p.ys[i] - p.ys[j]));
          paths.forEach((q, b) => { if (b > a) for (let j = 0; j < q.xs.length; j += 3) cross = Math.min(cross, Math.hypot(p.xs[i] - q.xs[j], p.ys[i] - q.ys[j])); });
        }
      });
      return { level: li + 1, chains: paths.length, len: paths.map(p => Math.round(p.len)), self: Math.round(self), cross: cross === Infinity ? null : Math.round(cross), shooter: Math.round(shooter), edge: Math.round(edge), W: Math.round(w.W), H: Math.round(w.H) };
    }),
  });

  showMenu();
  new ResizeObserver(resize).observe(els.stage);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
