<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
:root {
  --ink: #15403a;
  --muted: #4f7a71;
  --accent: #12a594;
  --accent-dark: #0b7f72;
  --leaf: #34c77b;
  --paper: #fbfffd;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: #d7f3e5;
  background-image: radial-gradient(#c4ecd8 2px, transparent 2.5px);
  background-size: 26px 26px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }

.app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); touch-action: none; }
.hud { display: flex; align-items: stretch; gap: 8px; width: 100%; max-width: 520px; margin: 0 auto; }
.stat { flex: 1; min-width: 0; padding: 5px 8px; border-radius: 14px; background: #ffffffb8; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.25; }
.icon-btn { flex: 0 0 auto; width: 46px; border-radius: 14px; background: var(--paper); color: var(--accent-dark); font-size: 18px; font-weight: 900; box-shadow: 0 4px 0 #9fd9c0; display: grid; place-items: center; }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9fd9c0; }
.icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
.icon-btn[hidden] { display: none; }
.play { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
canvas { display: block; border-radius: 18px; background: #eafbf2; box-shadow: 0 0 0 4px #ffffffa0, 0 16px 34px #0b7f7233; }
canvas:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 4px; }

.dpad { display: none; flex: 0 0 auto; align-self: center; grid-template: repeat(3, 52px) / repeat(3, 52px); gap: 6px; }
body.dpad-on .dpad { display: grid; }
.dpad button { border-radius: 16px; background: var(--paper); color: var(--accent-dark); box-shadow: 0 4px 0 #9fd9c0; display: grid; place-items: center; }
.dpad button:active, .dpad button.hit { transform: translateY(3px); box-shadow: 0 1px 0 #9fd9c0; background: #e2f8ee; }
.dpad svg { width: 24px; height: 24px; fill: currentColor; }
.dpad .up { grid-area: 1 / 2; } .dpad .left { grid-area: 2 / 1; } .dpad .right { grid-area: 2 / 3; } .dpad .down { grid-area: 3 / 2; }
.dpad .up svg { transform: rotate(-90deg); } .dpad .left svg { transform: rotate(180deg); } .dpad .down svg { transform: rotate(90deg); }
@media (orientation: landscape) and (max-height: 620px) { .play { flex-direction: row; } }

.banner { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center; pointer-events: none; }
.banner[hidden] { display: none; }
.banner strong { font-size: clamp(30px, 9vw, 44px); font-weight: 900; color: var(--accent-dark); letter-spacing: -.03em; text-shadow: 0 0 0 #fff, 0 3px 0 #fff, 0 0 18px #fff; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
.banner span { font-size: 15px; font-weight: 800; color: var(--ink); text-shadow: 0 0 10px #fff, 0 0 4px #fff; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: #15403a55; backdrop-filter: blur(2px); touch-action: manipulation; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; padding: 24px 20px; border-radius: 28px; background: var(--paper); text-align: center; box-shadow: 0 20px 50px #0b3b3540; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel .emoji { font-size: 44px; line-height: 1; }
.panel h1 { font-size: clamp(34px, 10vw, 44px); font-weight: 900; letter-spacing: -.04em; line-height: 1.05; color: var(--accent-dark); }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
.panel p { margin-top: 8px; font-size: 15px; line-height: 1.45; color: var(--muted); }
.panel .small { font-size: 12px; }
.modes { display: grid; gap: 10px; margin-top: 16px; }
.mode { display: grid; gap: 2px; padding: 12px 14px; border-radius: 18px; background: var(--accent); color: #fff; text-align: left; box-shadow: 0 5px 0 var(--accent-dark); }
.mode.wrap { background: #2fb36b; box-shadow: 0 5px 0 #1f8a50; }
.mode:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.mode strong { font-size: 19px; font-weight: 900; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.mode strong small { font-size: 12px; font-weight: 800; opacity: .9; white-space: nowrap; }
.mode span { font-size: 13px; line-height: 1.35; opacity: .95; }
.result { margin-top: 10px; font-size: 18px; font-weight: 800; color: var(--ink) !important; }
.badge { display: inline-block; margin-top: 12px !important; padding: 5px 14px; border-radius: 99px; background: #ffc531; color: #4a3600 !important; font-size: 13px !important; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 20px; width: 100%; padding: 15px; border-radius: 18px; background: var(--accent); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 5px 0 var(--accent-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost { margin-top: 10px; width: 100%; padding: 12px; border-radius: 16px; background: #e4f6ee; color: var(--accent-dark); font-size: 16px; font-weight: 800; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 600px) { .panel { padding: 16px; } .panel .emoji { display: none; } .modes { margin-top: 10px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <div class="hud">
    <div class="stat"><small data-i18n="score"></small><strong id="score">0</strong></div>
    <div class="stat"><small data-i18n="level"></small><strong id="level">1</strong></div>
    <div class="stat"><small data-i18n="best"></small><strong id="best">0</strong></div>

  </div>
  <div class="play">
    <div class="stage" id="stage">
      <canvas id="canvas" tabindex="0" role="img"></canvas>
      <div class="banner" id="banner" hidden><strong id="banner-title"></strong><span id="banner-text"></span></div>
    </div>
    <div class="dpad" id="dpad">
      <button type="button" class="up" data-dir="up" data-i18n-label="up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l10 8-10 8z"/></svg></button>
      <button type="button" class="left" data-dir="left" data-i18n-label="left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l10 8-10 8z"/></svg></button>
      <button type="button" class="right" data-dir="right" data-i18n-label="right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l10 8-10 8z"/></svg></button>
      <button type="button" class="down" data-dir="down" data-i18n-label="down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l10 8-10 8z"/></svg></button>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <p class="emoji" aria-hidden="true">🐍</p>

    </div>
    <p class="small" data-i18n="controls"></p>
  </div>
</div>

<div class="overlay" id="paused" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="paused-title">
    <h2 id="paused-title" data-i18n="paused"></h2>
    <p class="result" id="paused-score"></p>
    <button type="button" class="cta" id="resume" data-i18n="resume"></button>
    <button type="button" class="ghost" data-action="menu" data-i18n="changeMode"></button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <p class="emoji" aria-hidden="true">🍎</p>
    <h2 id="over-title" data-i18n="over"></h2>
    <p id="reason"></p>
    <p class="result" id="final"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="again" data-i18n="again"></button>
    <button type="button" class="ghost" data-action="menu" data-i18n="changeMode"></button>
  </div>
</div>

  const ctx = canvas.getContext('2d');
  const els = { score: $('score'), level: $('level'), best: $('best'), pause: $('pause'), dpadToggle: $('dpad-toggle'), banner: $('banner'), bannerTitle: $('banner-title'), bannerText: $('banner-text'), start: $('start'), paused: $('paused'), pausedScore: $('paused-score'), resume: $('resume'), over: $('over'), reason: $('reason'), final: $('final'), newBest: $('new-best'), again: $('again'), announcer: $('announcer') };

  const read = key => { try { return localStorage.getItem(key); } catch { return null; } };
  const write = (key, value) => { try { localStorage.setItem(key, String(value)); } catch {} };
  const readBest = mode => Number(read(STORAGE[mode])) || 0;

  let scale = 1;
  function resize() {
    const stage = $('stage').getBoundingClientRect();
    scale = Math.max(0.1, Math.min(stage.width / W, stage.height / H));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = `${W * scale}px`;
    canvas.style.height = `${H * scale}px`;
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    draw(performance.now());
  }

  let game;
  let mode = read(STORAGE.mode) === 'wrap' ? 'wrap' : 'classic';
  const key = (x, y) => y * COLS + x;

  function newGame(nextMode = mode) {
    mode = nextMode;
    write(STORAGE.mode, mode);
    const y = Math.floor(ROWS / 2) + 2, x = 6;
    const snake = [{ x, y }, { x: x - 1, y }, { x: x - 2, y }];
    game = { snake, oldTail: null, dir: DIRS.right, queue: [], walls: [], wallSet: new Set(), fruit: null, bonus: null, eaten: 0, score: 0, level: 1, grow: 0, acc: 0, state: 'ready', best: readBest(mode), bestBefore: readBest(mode), particles: [], floats: [], deathT: 0, reason: '', time: 0, milestone: 250 };
    game.fruit = emptyCell();
    hideOverlays();
    els.banner.hidden = true;
    updateHud();
    canvas.focus({ preventScroll: true });
  }

  const interval = () => Math.max(MIN_INTERVAL, START_INTERVAL - game.eaten * SPEEDUP);
  const fruitPoints = () => 10 * game.level;

  function occupied(x, y) {
    if (game.wallSet.has(key(x, y))) return true;
    if (game.fruit && game.fruit.x === x && game.fruit.y === y) return true;
    if (game.bonus && game.bonus.x === x && game.bonus.y === y) return true;
    return game.snake.some(s => s.x === x && s.y === y);
  }

  function emptyCell() {
    const free = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!occupied(x, y)) free.push({ x, y });
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  // Wall segments keep a one-cell gap from the edges and from each other, so they can never seal off part of the board.
  function addWallSegment() {
    const length = 2 + Math.min(3, Math.floor(game.level / 2));
    const head = game.snake[0];
    for (let attempt = 0; attempt < 300; attempt++) {
      const horizontal = Math.random() < 0.5;
      const sx = 1 + Math.floor(Math.random() * (COLS - 2 - (horizontal ? length : 1) + 1));
      const sy = 1 + Math.floor(Math.random() * (ROWS - 2 - (horizontal ? 1 : length) + 1));
      const cells = Array.from({ length }, (_, i) => ({ x: sx + (horizontal ? i : 0), y: sy + (horizontal ? 0 : i) }));
      const ok = cells.every(({ x, y }) => {
        if (x < 1 || y < 1 || x > COLS - 2 || y > ROWS - 2 || occupied(x, y)) return false;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (game.wallSet.has(key(x + dx, y + dy))) return false;
        if (Math.max(Math.abs(x - head.x), Math.abs(y - head.y)) < 4) return false;
        // Keep the lane straight ahead of the head clear.
        const ahead = (x - head.x) * game.dir.x + (y - head.y) * game.dir.y;
        const side = Math.abs((x - head.x) * game.dir.y) + Math.abs((y - head.y) * game.dir.x);
        return !(ahead > 0 && ahead < 8 && side < 2);
      });
      if (!ok) continue;
      for (const c of cells) { game.walls.push({ ...c, born: game.time }); game.wallSet.add(key(c.x, c.y)); }
      return true;
    }
    return false;
  }

  function queueDir(name) {
    if (!game || (game.state !== 'ready' && game.state !== 'play')) return;
    const d = DIRS[name];
    const last = game.queue.length ? game.queue[game.queue.length - 1] : game.dir;
    const reverse = d.x === -last.x && d.y === -last.y;
    if (game.state === 'ready') {
      game.state = 'play';
      game.acc = 0;
      els.banner.hidden = true;
    }
    if (game.queue.length >= MAX_QUEUE || reverse || (d.x === last.x && d.y === last.y)) return;
    game.queue.push(d);
  }

  function step() {
    if (game.queue.length) game.dir = game.queue.shift();
    const head = game.snake[0];
    let x = head.x + game.dir.x, y = head.y + game.dir.y;
    if (mode === 'wrap') { x = (x + COLS) % COLS; y = (y + ROWS) % ROWS; }
    else if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return die('wall');
    if (game.wallSet.has(key(x, y))) return die('wall');

    const eatsFruit = game.fruit && game.fruit.x === x && game.fruit.y === y;
    const eatsBonus = game.bonus && game.bonus.x === x && game.bonus.y === y;
    const growing = game.grow > 0 || eatsFruit;
    const body = growing ? game.snake : game.snake.slice(0, -1);
    if (body.some(s => s.x === x && s.y === y)) return die('self');

    game.snake.unshift({ x, y });
    if (eatsFruit) game.grow += 1;
    if (game.grow > 0) { game.grow -= 1; game.oldTail = null; }
    else game.oldTail = game.snake.pop();

    if (eatsFruit) eatFruit(x, y);
    if (eatsBonus) eatBonus(x, y);
  }

  function eatFruit(x, y) {
    const points = fruitPoints();
    game.eaten += 1;
    addScore(points, x, y, '#ff5d73');
    if (game.eaten % FRUITS_PER_LEVEL === 0) levelUp();
    game.fruit = emptyCell();
    if (!game.bonus && game.eaten >= 3 && Math.random() < GOLDEN_CHANCE) {
      const cell = emptyCell();
      if (cell) { game.bonus = { ...cell, ttl: GOLDEN_TIME }; announce(t.golden); }
    }
  }

  function eatBonus(x, y) {
    game.bonus = null;
    addScore(fruitPoints() * 5, x, y, '#ffc531');
  }

  function addScore(points, x, y, color) {
    game.score += points;
    game.floats.push({ x: Math.min(COLS - 1, Math.max(1, x + 0.5)), y: Math.max(1, y + 0.5), text: `+${points}`, life: 0.9, color });
    if (!reduceMotion) for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5;
      game.particles.push({ x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, color });
    }
    if (game.score > game.best) { game.best = game.score; write(STORAGE[mode], game.best); }
    if (game.score >= game.milestone) { announce(t.milestone(game.milestone)); while (game.milestone <= game.score) game.milestone += 250; }
    updateHud();
  }

  function levelUp() {
    game.level += 1;
    let note = t.faster;
    if (mode === 'classic') {
      addWallSegment();
      if (game.level >= 5) addWallSegment();
      note = t.newWalls;
    }
    showBanner(t.levelUp(game.level), note);
    updateHud();
  }

  function die(reason) {
    game.state = 'dying';
    game.reason = reason;
    game.deathT = 0.8;
    game.queue = [];
  }

  function gameOver() {
    game.state = 'over';
    els.reason.textContent = game.reason === 'self' ? t.self : t.wall;
    els.final.textContent = t.final(game.score, game.snake.length);
    els.newBest.hidden = game.score <= game.bestBefore;
    els.over.hidden = false;
    els.again.focus({ preventScroll: true });
    announce(`${t.over}. ${els.reason.textContent} ${els.final.textContent}${els.newBest.hidden ? '' : ` ${t.newBest}`}`);
  }

  function updateHud() {

    els.level.textContent = String(game.level);
    els.best.textContent = String(game.best);

  function announce(text) { els.announcer.textContent = text; }

    hideOverlays();
    els.banner.hidden = true;

    $('best-wrap').textContent = t.bestShort(readBest('wrap'));
    els.start.hidden = false;

  }

  function setPaused(paused) {

  function bodyPoints(p) {

    strokePath(path, CELL * 0.16, '#a6f3c9');

    const head = pts[0];
    const hx = (head.x + 0.5) * CELL, hy = (head.y + 0.5) * CELL;
    const { x: fx, y: fy } = game.dir;
    const sx = -fy, sy = fx;

        ctx.beginPath(); ctx.moveTo(ex - 3, ey - 3); ctx.lineTo(ex + 3, ey + 3); ctx.moveTo(ex + 3, ey - 3); ctx.lineTo(ex - 3, ey + 3); ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, CELL * 0.17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#15403a';
      ctx.beginPath(); ctx.arc(ex + fx * 1.4, ey + fy * 1.4, CELL * 0.09, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex + fx * 1.4 - 1, ey + fy * 1.4 - 1, CELL * 0.035, 0, Math.PI * 2); ctx.fill();

  }

  function drawFruit(cell, time) {
    const cx = (cell.x + 0.5) * CELL, cy = (cell.y + 0.55) * CELL;
    const r = CELL * 0.36 * (reduceMotion ? 1 : 1 + Math.sin(time * 5) * 0.06);

    ctx.beginPath(); ctx.ellipse(cx + 3, cy - r - 1, 4, 2, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff5d73';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffffb0';
    ctx.beginPath(); ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.25, 0, Math.PI * 2); ctx.fill();
  }

  function drawBonus(bonus, time) {
    if (bonus.ttl < 1.5 && Math.floor(time * 8) % 2 === 0) return;
    const cx = (bonus.x + 0.5) * CELL, cy = (bonus.y + 0.5) * CELL;
    const spin = reduceMotion ? 0 : time * 1.5;
    ctx.fillStyle = '#ffc531';
    ctx.strokeStyle = '#e09a00';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = spin + (i * Math.PI) / 5 - Math.PI / 2, rr = i % 2 ? CELL * 0.22 : CELL * 0.5;

    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#e09a00aa';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, CELL * 0.72, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * bonus.ttl) / GOLDEN_TIME); ctx.stroke();
  }

  function draw(time) {
    if (!game) return;
    const now = time / 1000;
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (game.state === 'dying' && !reduceMotion) ctx.translate((Math.random() - 0.5) * 6 * game.deathT, (Math.random() - 0.5) * 6 * game.deathT);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      ctx.fillStyle = (x + y) % 2 ? '#dcf6e8' : '#eafbf2';
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
    if (mode === 'wrap') {
      ctx.strokeStyle = '#12a59466'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]);
      ctx.strokeRect(1.5, 1.5, W - 3, H - 3);
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = '#0b7f72'; ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, W - 4, H - 4);
    }

    for (const wall of game.walls) {
      const grow = reduceMotion ? 1 : Math.min(1, (game.time - wall.born) / 0.4);
      const size = (CELL - 2) * grow, off = (CELL - size) / 2;
      ctx.fillStyle = '#2f6f69';
      ctx.beginPath(); ctx.roundRect(wall.x * CELL + off, wall.y * CELL + off, size, size, 5); ctx.fill();
      ctx.fillStyle = '#4a958c';
      ctx.beginPath(); ctx.roundRect(wall.x * CELL + off + 3, wall.y * CELL + off + 3, Math.max(0, size - 6), 4 * grow, 2); ctx.fill();
    }

    if (game.fruit) drawFruit(game.fruit, now);
    if (game.bonus) drawBonus(game.bonus, now);

    const p = Math.min(1, game.acc / interval());
    const pts = bodyPoints(p);
    drawSnake(pts, now);
    // In wrap mode, draw shifted copies so a body crossing an edge shows on both sides.
    if (mode === 'wrap') for (const [dx, dy] of [[COLS, 0], [-COLS, 0], [0, ROWS], [0, -ROWS]]) {
      if (pts.some(pt => pt.x + dx > -1 && pt.x + dx < COLS && pt.y + dy > -1 && pt.y + dy < ROWS)) drawSnake(pts.map(pt => ({ x: pt.x + dx, y: pt.y + dy })), now);
    }

    for (const q of game.particles) {
      ctx.globalAlpha = Math.max(0, q.life * 2);
      ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(q.x * CELL, q.y * CELL, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 15px ui-rounded, "SF Pro Rounded", system-ui, sans-serif';
    for (const f of game.floats) {
      ctx.globalAlpha = Math.min(1, f.life * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
      ctx.strokeText(f.text, f.x * CELL, f.y * CELL);
      ctx.fillStyle = f.color === '#ffc531' ? '#c98a00' : '#0b7f72';
      ctx.fillText(f.text, f.x * CELL, f.y * CELL);
    }
    ctx.globalAlpha = 1;

    if (game.state === 'ready') {
      ctx.font = '800 15px ui-rounded, "SF Pro Rounded", system-ui, sans-serif';
      const text = t.ready;
      const width = Math.min(W - 24, ctx.measureText(text).width + 28);
      ctx.fillStyle = '#ffffffd9';
      ctx.beginPath(); ctx.roundRect((W - width) / 2, H * 0.3 - 17, width, 34, 17); ctx.fill();
      ctx.fillStyle = '#15403a';
      ctx.fillText(text, W / 2, H * 0.3 + 1, W - 40);
    }
    ctx.restore();
  }

  let last = performance.now();
  function frame(time) {
    // Clamp dt so a stalled or hidden tab never fast-forwards the snake.
    const dt = Math.min(0.05, Math.max(0, (time - last) / 1000));
    last = time;
    if (game) update(dt);
    draw(time);
    requestAnimationFrame(frame);
  }

  // Keyboard
  document.addEventListener('keydown', event => {
    if (!game || event.altKey || event.ctrlKey || event.metaKey) return;
    const dir = KEY_DIRS[event.key];
    if (dir && (game.state === 'ready' || game.state === 'play')) { event.preventDefault(); queueDir(dir); return; }
    const onButton = document.activeElement instanceof HTMLButtonElement;
    if (event.key === 'p' || event.key === 'P' || (event.key === ' ' && !(onButton && game.state !== 'play'))) {
      if (game.state === 'play' || game.state === 'paused') { event.preventDefault(); setPaused(game.state === 'play'); }
    }
  });

  // Swipe anywhere: a turn fires as soon as the finger has moved far enough, so one gesture can chain turns.
  let swipe = null;
  $('app').addEventListener('pointerdown', event => {
    if (event.target.closest('button') || !game || (game.state !== 'ready' && game.state !== 'play')) return;
    swipe = { x: event.clientX, y: event.clientY, id: event.pointerId };
  });
  document.addEventListener('pointermove', event => {
    if (!swipe || swipe.id !== event.pointerId) return;
    const dx = event.clientX - swipe.x, dy = event.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    queueDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    swipe.x = event.clientX; swipe.y = event.clientY;
  });
  const endSwipe = event => { if (swipe && swipe.id === event.pointerId) swipe = null; };
  document.addEventListener('pointerup', endSwipe);
  document.addEventListener('pointercancel', endSwipe);

  // On-screen pad
  for (const button of document.querySelectorAll('.dpad button')) {
    button.addEventListener('pointerdown', event => { event.preventDefault(); queueDir(button.dataset.dir); });
    button.addEventListener('click', event => { if (event.detail === 0) queueDir(button.dataset.dir); });
  }
  const coarse = matchMedia('(any-pointer: coarse)').matches;
  function setDpad(on) {
    document.body.classList.toggle('dpad-on', on);
    els.dpadToggle.setAttribute('aria-pressed', String(on));
  }
  els.dpadToggle.hidden = !coarse;
  setDpad(coarse && read(STORAGE.dpad) !== 'off');
  els.dpadToggle.addEventListener('click', () => {
    const on = !document.body.classList.contains('dpad-on');
    setDpad(on);
    write(STORAGE.dpad, on ? 'on' : 'off');
  });

  els.pause.addEventListener('click', () => { if (game.state === 'play') setPaused(true); else if (game.state === 'paused') setPaused(false); });
  els.resume.addEventListener('click', () => setPaused(false));
  els.again.addEventListener('click', () => newGame(mode));
  for (const button of document.querySelectorAll('[data-mode]')) button.addEventListener('click', () => newGame(button.dataset.mode));
  for (const button of document.querySelectorAll('[data-action="menu"]')) button.addEventListener('click', showMenu);
  document.addEventListener('visibilitychange', () => { if (document.hidden && game?.state === 'play') setPaused(true); });
  window.addEventListener('blur', () => { swipe = null; });

  new ResizeObserver(resize).observe($('stage'));
  newGame(mode);
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
