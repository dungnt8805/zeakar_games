<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Golf</title>
<style>
:root {
  --bg: #12301f;
  --ink: #173524;
  --muted: #5f7a68;
  --accent: #ff6f59;
  --accent-dark: #d1452f;
  --grass: #5cc46a;
  --paper: #fffbef;
  --good: #1f9d55;
  --bad: #d1452f;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: #fff; background: radial-gradient(ellipse at top, #22553a, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid #ffd447; outline-offset: 3px; }

.app { height: 100%; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.stage { width: 100%; height: 100%; min-height: 0; display: grid; place-items: center; }
.frame { position: relative; container-type: size; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px #ffffff18, 0 20px 44px #0009; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
canvas:focus-visible { outline: none; }
.frame:has(canvas:focus-visible) { outline: 3px solid #ffd44788; outline-offset: 3px; }
.card-btn { position: absolute; top: 1.3cqh; right: 2.2cqw; width: 11cqw; height: 6cqh; min-width: 34px; min-height: 30px; border-radius: 10px; background: #ffffff22; font-size: max(16px, 2.8cqh); display: grid; place-items: center; touch-action: manipulation; }
.card-btn[hidden] { display: none; }

.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 7cqh 6cqw 5cqh; text-align: center; pointer-events: none; }
.overlay[hidden] { display: none; }
.overlay button { pointer-events: auto; }
.shade { background: linear-gradient(#12301fcc, #12301f99 45%, #12301fe6); }
.dim { background: #0b1f1477; }
.title { font-size: min(15cqw, 8.5cqh); font-weight: 900; letter-spacing: -.03em; line-height: 1; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 8px 24px #0008; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.title span { color: #ffd447; }
.tagline { margin-top: 1.8cqh; max-width: 30em; font-size: max(13px, min(4.2cqw, 2.5cqh)); font-weight: 700; line-height: 1.4; color: #e7f7ea; }
.spacer { flex: 1; }
.cta { padding: 14px 30px; border-radius: 99px; background: var(--accent); color: #fff; font-size: max(17px, min(5.4cqw, 3.2cqh)); font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark), 0 10px 24px #0005; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.cta.secondary { margin-top: 1.6cqh; background: var(--paper); color: var(--ink); box-shadow: 0 5px 0 #d8cfae, 0 10px 24px #0005; font-size: max(15px, min(4.6cqw, 2.7cqh)); padding: 11px 24px; }
.cta[hidden] { display: none; }
.small { margin-top: 1.5cqh; max-width: 30em; font-size: max(11px, min(3.4cqw, 2cqh)); font-weight: 700; line-height: 1.45; color: #d9efdd; }
.small:empty { display: none; }
.records { margin-top: 1.4cqh; padding: 5px 14px; border-radius: 99px; background: #ffffff1f; font-size: 13px; font-weight: 800; color: #ffd447; }
.records:empty { display: none; }

.center { justify-content: center; }
.panel { pointer-events: auto; width: min(100%, 330px); max-height: 100%; overflow-y: auto; padding: 18px 14px; border-radius: 24px; background: var(--paper); color: var(--ink); box-shadow: 0 8px 0 #d8cfae, 0 20px 50px #0007; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.panel .sub { margin-top: 6px; font-size: 14px; font-weight: 800; color: var(--muted); }
.panel .big { margin-top: 8px; font-size: 40px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.panel .total { margin-top: 8px; font-size: 15px; font-weight: 800; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.panel .again { display: block; width: 100%; margin-top: 14px; padding: 13px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark); }
.panel .again:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.panel .link { display: block; width: 100%; margin-top: 10px; padding: 10px; border-radius: 12px; font-size: 15px; font-weight: 800; color: var(--ink); background: #efe6c8; }
.card { margin-top: 12px; display: grid; gap: 8px; }
.card table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; font-variant-numeric: tabular-nums; }
.card th, .card td { padding: 3px 0; text-align: center; border: 1px solid #e3d9b8; }
.card th { font-weight: 800; color: var(--muted); background: #f6efd6; }
.card th:first-child, .card td:first-child { width: 17%; font-weight: 800; text-align: left; padding-left: 4px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card td.under { color: #fff; background: var(--good); font-weight: 900; }
.card td.over { color: var(--bad); font-weight: 900; }
.card td.cur { outline: 2px solid #ffd447; outline-offset: -2px; }
.card td.sum { font-weight: 900; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="canvas" tabindex="0" role="img"></canvas>
      <button type="button" class="card-btn" id="card-btn" data-i18n-label="card" hidden>📋</button>
      <div class="overlay shade" id="start">
        <h1 class="title">Mini <span>Golf</span></h1>
        <p class="tagline" data-i18n="tagline"></p>
        <p class="records" id="records"></p>
        <div class="spacer"></div>
        <button type="button" class="cta" id="continue" hidden></button>
        <button type="button" class="cta" id="new-round" data-i18n="newRound"></button>
        <p class="small" data-i18n="controls"></p>
        <p class="small" data-i18n="keys"></p>
      </div>
      <div class="overlay center dim" id="hole-done" hidden>
        <div class="panel" role="dialog" aria-modal="true" aria-labelledby="done-title">
          <h2 id="done-title"></h2>
          <p class="sub" id="done-sub"></p>
          <p class="total" id="done-total"></p>
          <p class="badge" id="done-best" data-i18n="holeBest" hidden></p>
          <button type="button" class="again" id="next-hole"></button>
          <button type="button" class="link" id="show-card" data-i18n="card"></button>
        </div>
      </div>
      <div class="overlay center dim" id="card-panel" hidden>
        <div class="panel" role="dialog" aria-modal="true" aria-labelledby="card-title">
          <h2 id="card-title" data-i18n="card"></h2>
          <div class="card" id="card-body"></div>
          <button type="button" class="again" id="close-card" data-i18n="close"></button>
        </div>
      </div>
      <div class="overlay center dim" id="final" hidden>
        <div class="panel" role="dialog" aria-modal="true" aria-labelledby="final-title">
          <h2 id="final-title" data-i18n="roundDone"></h2>
          <p class="big" id="final-total"></p>
          <p class="sub" id="final-sub"></p>
          <p class="badge" id="final-best" data-i18n="newBest" hidden></p>
          <div class="card" id="final-card"></div>
          <button type="button" class="again" id="again" data-i18n="again"></button>
        </div>
      </div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

  function prepareHole(h) {

        game.ripples.push({ x: b.x, y: b.y, life: 0.8 });
        if (result === 'water') {
          game.strokes++;
          popup(t.splash, clamp(b.x, 90, W - 90), b.y - 20, '#bfe9ff', 16, 1.3);
          announce(t.splash);
        }
        updateLabel();
      } else if (result === 'stop') {
        if (game.strokes >= MAX_STROKES) holeFinished(true);
        else game.state = 'aim';
      }
    } else if (game.state === 'sink') {
      const h = HOLES[game.hole];
      game.sink += dt;
      b.x += (h.cup[0] - b.x) * Math.min(1, dt * 12);
      b.y += (h.cup[1] - b.y) * Math.min(1, dt * 12);
      if (game.sink > 0.35) holeFinished(false);
    } else if (game.state === 'splash') {
      game.sink += dt;
      if (game.sink > 0.7) {
        b.x = game.last.x; b.y = game.last.y; b.vx = b.vy = 0;
        if (game.strokes >= MAX_STROKES) holeFinished(true);
        else game.state = 'aim';
      }
    }
  }

  // ---------- drawing ----------
  function tracePoly(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); }
  function traceShape(s) {
    if (s.r) { ctx.beginPath(); ctx.roundRect(s.r[0], s.r[1], s.r[2], s.r[3], 6); }
    else if (s.c) { ctx.beginPath(); ctx.arc(s.c[0], s.c[1], s.c[2], 0, Math.PI * 2); }
    else tracePoly(s.p);
  }
  function shapeBox(s) {
    if (s.r) return s.r;
    if (s.c) return [s.c[0] - s.c[2], s.c[1] - s.c[2], s.c[2] * 2, s.c[2] * 2];
    const xs = s.p.map(p => p[0]), ys = s.p.map(p => p[1]);
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];
  }

  function drawBackground() {
    ctx.fillStyle = '#1d4a2e';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#245a37';
    for (let y = HUD_H; y < H; y += 24) for (let x = (y / 24) % 2 ? 0 : 12; x < W; x += 24) { ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill(); }
  }

  function drawCourse(h) {
    // Rail shadow, then the green.
    ctx.save();
    ctx.translate(0, 4);
    tracePoly(h.bounds);
    ctx.lineJoin = 'round';
    ctx.lineWidth = WALL_T * 2 + 6;
    ctx.strokeStyle = '#00000040';
    ctx.stroke();
    ctx.restore();
    tracePoly(h.bounds);
    ctx.fillStyle = '#5cc46a';
    ctx.fill();
    ctx.save();
    tracePoly(h.bounds);
    ctx.clip();
    ctx.fillStyle = '#54b862';
    for (let y = 60; y < H; y += 44) ctx.fillRect(0, y, W, 22);
    for (const s of h.slopes) drawSlope(s);
    for (const s of h.sand) drawSand(s);
    for (const s of h.water) drawWater(s);
    drawTee(h);
    drawCup(h);
    ctx.restore();
    tracePoly(h.bounds);
    ctx.lineWidth = WALL_T * 2 + 2;
    ctx.strokeStyle = '#9b6a43';
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#c8935f';
    ctx.stroke();
    for (const w of h.walls) {
      tracePoly(w);
      ctx.fillStyle = '#b07c50';
      ctx.fill();
      ctx.lineWidth = WALL_T * 2;
      ctx.strokeStyle = '#9b6a43';
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#d6a36d';
      ctx.stroke();
    }
    ctx.lineCap = 'round';
    for (const line of h.lines) {
      ctx.beginPath();
      line.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.lineWidth = WALL_T * 2 + 2;
      ctx.strokeStyle = '#9b6a43';
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#d6a36d';
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  function drawSlope(s) {
    traceShape(s);
    ctx.fillStyle = '#7ad47f';
    ctx.fill();
    const [x, y, w, hh] = shapeBox(s);
    const ang = Math.atan2(s.a[1], s.a[0]);
    const shift = reducedMotion ? 0 : (game.t * 18) % 28;
    ctx.save();
    traceShape(s);
    ctx.clip();
    ctx.strokeStyle = '#ffffff55';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let gy = y + 14; gy < y + hh; gy += 28) for (let gx = x + 14; gx < x + w; gx += 28) {
      const px = gx + Math.cos(ang) * shift, py = gy + Math.sin(ang) * shift;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(-4, -6); ctx.lineTo(3, 0); ctx.lineTo(-4, 6); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawSand(s) {
    traceShape(s);
    ctx.fillStyle = '#f1d48e';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#e2bd6b';
    ctx.stroke();
    const [x, y, w, hh] = shapeBox(s);
    ctx.fillStyle = '#d9b263';
    for (let i = 0; i < w * hh / 140; i++) {
      const px = x + ((i * 37) % w), py = y + ((i * 53) % hh);
      if (inShape(s, px, py)) ctx.fillRect(px, py, 2, 2);
    }
  }

  function drawWater(s) {
    traceShape(s);
    ctx.fillStyle = '#4fb6ea';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#3496c9';
    ctx.stroke();
    const [x, y, w, hh] = shapeBox(s);
    ctx.save();
    traceShape(s);
    ctx.clip();
    ctx.strokeStyle = '#ffffff66';
    ctx.lineWidth = 1.5;
    const phase = reducedMotion ? 0 : game.t * 2;
    for (let wy = y + 10; wy < y + hh; wy += 14) {
      ctx.beginPath();
      for (let wx = x; wx <= x + w; wx += 6) ctx.lineTo(wx, wy + Math.sin(wx / 9 + phase + wy) * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTee(h) {
    ctx.fillStyle = '#3f9d4e';
    ctx.beginPath(); ctx.roundRect(h.tee[0] - 16, h.tee[1] - 10, 32, 20, 6); ctx.fill();
    ctx.fillStyle = '#ffffff99';
    ctx.beginPath(); ctx.arc(h.tee[0] - 10, h.tee[1], 2, 0, Math.PI * 2); ctx.arc(h.tee[0] + 10, h.tee[1], 2, 0, Math.PI * 2); ctx.fill();
  }

  function drawCup(h) {
    const [x, y] = h.cup;
    ctx.fillStyle = '#86d98c';
    ctx.beginPath(); ctx.arc(x, y, CUP_R + 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#163222';
    ctx.beginPath(); ctx.arc(x, y, CUP_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0b1d13';
    ctx.beginPath(); ctx.arc(x, y + 2, CUP_R - 2, 0, Math.PI * 2); ctx.fill();
  }

  function drawFlag(h) {
    const [x, y] = h.cup, b = game.ball;
    const near = Math.hypot(b.x - x, b.y - y) < 40 ? 0.35 : 1;
    ctx.globalAlpha = near;
    ctx.strokeStyle = '#f4f4f4';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 6, y - 34); ctx.stroke();
    const wave = reducedMotion ? 0 : Math.sin(game.t * 5) * 2;
    ctx.fillStyle = '#ff6f59';
    ctx.beginPath(); ctx.moveTo(x + 6, y - 34); ctx.lineTo(x + 26, y - 29 + wave); ctx.lineTo(x + 5, y - 22); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawMovers(h) {
    for (const [bx, by, br] of h.bumpers) {
      const lit = game.flashes.some(f => f.x === bx && f.y === by);
      ctx.fillStyle = '#00000033';
      ctx.beginPath(); ctx.arc(bx + 2, by + 3, br, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = lit ? '#fff3a6' : '#ff6f8a';
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = lit ? '#ffffff' : '#ffd1da';
      ctx.beginPath(); ctx.arc(bx, by, br * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff6f8a';
      ctx.beginPath(); ctx.arc(bx, by, br * 0.25, 0, Math.PI * 2); ctx.fill();
    }
    for (const bl of h.blockers) {
      const off = blockerOffset(bl, game.t);
      const ax = bl.a[0] + bl.d[0] * off, ay = bl.a[1] + bl.d[1] * off, bx = bl.b[0] + bl.d[0] * off, by = bl.b[1] + bl.d[1] * off;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#00000033'; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(ax + 2, ay + 3); ctx.lineTo(bx + 2, by + 3); ctx.stroke();
      ctx.strokeStyle = '#3e6fd8'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.strokeStyle = '#ffd447'; ctx.lineWidth = 3;
      ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineCap = 'butt';
    }
    for (const m of h.mills) {
      const base = millAngle(m, game.t);
      ctx.lineCap = 'round';
      for (let i = 0; i < m.blades; i++) {
        const a = base + i * Math.PI * 2 / m.blades;
        const tx = m.x + Math.cos(a) * m.len, ty = m.y + Math.sin(a) * m.len;
        ctx.strokeStyle = '#00000033'; ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(m.x + 2, m.y + 3); ctx.lineTo(tx + 2, ty + 3); ctx.stroke();
        ctx.strokeStyle = '#fff6e6'; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.strokeStyle = '#ff6f59'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(m.x + Math.cos(a) * m.len * 0.4, m.y + Math.sin(a) * m.len * 0.4); ctx.lineTo(tx, ty); ctx.stroke();
      }
      ctx.lineCap = 'butt';
      ctx.fillStyle = '#8b5a3c';
      ctx.beginPath(); ctx.arc(m.x, m.y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd447';
      ctx.beginPath(); ctx.arc(m.x, m.y, 3.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  function aimVector() {
    if (game.state !== 'aim') return null;
    if (drag) {
      const dx = drag.sx - drag.x, dy = drag.sy - drag.y, len = Math.hypot(dx, dy);
      if (len < 4) return null;
      return { angle: Math.atan2(dy, dx), power: clamp(len / 140, 0, 1) };
    }
    if (aim.keyboard || aim.charging) return { angle: aim.angle, power: aim.charging ? aim.power : 0 };
    return null;
  }

  function drawBall() {
    const b = game.ball;
    let r = BALL_R;
    if (game.state === 'sink') r = BALL_R * Math.max(0.2, 1 - game.sink / 0.35);
    if (game.state === 'splash' || game.state === 'done' || game.state === 'final') r = 0;
    for (const rp of game.ripples) {
      const k = 1 - rp.life / 0.8;
      ctx.strokeStyle = `rgba(255,255,255,${rp.life})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(rp.x, rp.y, 6 + k * 22, 0, Math.PI * 2); ctx.stroke();
    }
    if (r <= 0) return;
    const v = aimVector();
    if (v) {
      const len = 26 + v.power * 150;
      const col = v.power > 0.85 ? '#ff6f59' : '#ffffff';
      for (let d = 16; d < len; d += 9) {
        ctx.globalAlpha = 0.95 - d / len * 0.7;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(b.x + Math.cos(v.angle) * d, b.y + Math.sin(v.angle) * d, 2.6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (v.power > 0) {
        ctx.strokeStyle = col;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * v.power); ctx.stroke();
      }
    } else if (game.state === 'aim' && !drag) {
      ctx.strokeStyle = '#ffffff88';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R + 6 + (reducedMotion ? 0 : Math.sin(game.t * 5) * 2), 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = '#00000040';
    ctx.beginPath(); ctx.arc(b.x + 1.5, b.y + 2.5, r, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, '#d9dde3');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
  }

  function fitFont(text, maxW, size, weight) {
    let s = size;
    ctx.font = `${weight} ${s}px ${FONT}`;
    while (s > 8 && ctx.measureText(text).width > maxW) { s -= 1; ctx.font = `${weight} ${s}px ${FONT}`; }
  }

  function drawHud() {
    ctx.fillStyle = '#12301f';
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = '#ffffff12';
    ctx.fillRect(0, HUD_H - 1, W, 1);
    const h = HOLES[game.hole];
    const done = game.scores.length;
    const diff = done ? totalDiff(game.scores) : 0;
    const cols = [
      [t.hole, `${game.hole + 1}/${HOLES.length}`, 14, '#ffffff'],
      [t.par, String(h.par), 92, '#ffffff'],
      [t.strokes, String(game.strokes), 152, game.strokes > h.par ? '#ffb3a6' : '#ffffff'],
      [t.total, done ? fmtDiff(diff) : t.even, 232, diff > 0 ? '#ffb3a6' : diff < 0 ? '#9ff0b0' : '#ffffff'],
    ];
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    for (const [label, value, x, color] of cols) {
      ctx.fillStyle = '#a9cdb3';
      fitFont(label.toUpperCase(), 72, 10, 800);
      ctx.fillText(label.toUpperCase(), x, 19);
      ctx.fillStyle = color;
      ctx.font = `900 22px ${FONT}`;
      ctx.fillText(value, x, 43);
    }
  }

  function outlined(text, x, y, size, fill) {
    fitFont(text, W - 30, size, 900);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(3, size / 6);
    ctx.strokeStyle = '#173524';
    const hw = ctx.measureText(text).width / 2;
    const cx = clamp(x, hw + 10, W - hw - 10);
    ctx.strokeText(text, cx, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, cx, y);
  }

  function draw() {
    if (!game) return;
    const h = HOLES[game.hole];
    drawBackground();
    drawCourse(h);
    drawBall();
    drawMovers(h);
    drawFlag(h);
    for (const p of game.popups) { ctx.globalAlpha = clamp(p.life / p.max * 3, 0, 1); outlined(p.text, p.x, p.y, p.size, p.color); }
    ctx.globalAlpha = 1;
    drawHud();
  }

  function resize() {
    const stage = $('stage').getBoundingClientRect();
    scale = Math.min(stage.width / W, stage.height / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    els.frame.style.width = `${W * scale}px`;
    els.frame.style.height = `${H * scale}px`;
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    draw();
  }

  function frame(time) {
    // Clamp dt so a stalled frame never moves the ball or the windmills by more than 50 ms.
    const dt = Math.min(0.05, Math.max(0, (time - last) / 1000));
    last = time;
    if (!document.hidden) {
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      draw();
    }
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function toWorld(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left) / scale, y: (event.clientY - rect.top) / scale };
  }
  canvas.addEventListener('pointerdown', event => {
    if (!game || game.state !== 'aim') return;
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    const p = toWorld(event);
    aim.charging = false;
    aim.keyboard = false;
    drag = { id: event.pointerId, sx: p.x, sy: p.y, x: p.x, y: p.y };
  });
  canvas.addEventListener('pointermove', event => {
    if (!drag || event.pointerId !== drag.id) return;
    const p = toWorld(event);
    drag.x = p.x; drag.y = p.y;
  });
  canvas.addEventListener('pointerup', event => {
    if (!drag || event.pointerId !== drag.id) return;
    const p = toWorld(event);
    drag.x = p.x; drag.y = p.y;
    const v = aimVector();
    drag = null;
    if (v) shoot(v.angle, v.power);
  });
  canvas.addEventListener('pointercancel', () => { drag = null; });

  const ROT = { ArrowLeft: ['rot', -1], ArrowRight: ['rot', 1], ArrowUp: ['fine', -1], ArrowDown: ['fine', 1] };
  document.addEventListener('keydown', event => {
    if (!game || game.state === 'final' || !els.start.hidden || !els.cardPanel.hidden || !els.holeDone.hidden) return;
    if ((event.target instanceof Element && event.target.closest('button')) || event.altKey || event.ctrlKey || event.metaKey) return;
    if (ROT[event.key]) {
      event.preventDefault();
      aim.keyboard = true;
      aim[ROT[event.key][0]] = ROT[event.key][1];
      return;
    }
    if (event.key === ' ' || event.key === 'Enter') {
      event.preventDefault();
      if (event.repeat || game.state !== 'aim' || drag) return;
      aim.keyboard = true;
      aim.charging = true; aim.power = 0; aim.dir = 1;
    }
  });
  document.addEventListener('keyup', event => {
    if (ROT[event.key] && aim[ROT[event.key][0]] === ROT[event.key][1]) aim[ROT[event.key][0]] = 0;
    if ((event.key === ' ' || event.key === 'Enter') && aim.charging) {
      event.preventDefault();
      aim.charging = false;
      shoot(aim.angle, aim.power);
    }
  });
  window.addEventListener('blur', () => { aim.rot = aim.fine = 0; aim.charging = false; drag = null; });

  els.newRound.addEventListener('click', () => { store.remove('progress'); newRound(null); });
  els.cont.addEventListener('click', () => newRound(store.get('progress', null)));
  els.nextHole.addEventListener('click', nextHole);
  els.showCard.addEventListener('click', () => openCard('done'));
  els.cardBtn.addEventListener('click', () => { if (game && game.state !== 'final' && els.holeDone.hidden) openCard('play'); });
  els.closeCard.addEventListener('click', closeCard);
  els.again.addEventListener('click', () => { store.remove('progress'); newRound(null); });

  new ResizeObserver(resize).observe($('stage'));
  game = { hole: 0, scores: [], strokes: 0, ball: { x: HOLES[0].tee[0], y: HOLES[0].tee[1], vx: 0, vy: 0, t: 0, slow: 0 }, last: null, state: 'intro', t: 0, popups: [], ripples: [], flashes: [], sink: 0 };
  updateLabel();
  showStart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
