<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ninja Run</title>
<style>
:root {
  --bg: #141327;
  --ink: #1c1830;
  --muted: #6e6580;
  --paper: #fff4e6;
  --paper-2: #f7e2c4;
  --red: #e8443a;
  --red-dark: #a8261f;
  --gold: #ffc94a;
  --gold-dark: #b8860b;
  --jade: #2fbf8a;
  --sky: #63b7ff;
  --hud: #141327c8;
  --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--paper); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { position: fixed; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.view { position: relative; min-height: 0; overflow: hidden; background: #000; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#game:focus-visible { outline: none; }
.view:has(#game:focus-visible) { box-shadow: inset 0 0 0 3px #ffc94a88; }

.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); pointer-events: none; }
.app.menu .hud { visibility: hidden; }
.chip { display: flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px; border-radius: 10px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff1c; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.dist { color: var(--gold); }
.chip .ico { width: 13px; height: 13px; border-radius: 50%; background: var(--gold); box-shadow: inset -3px 0 0 var(--gold-dark); }
.chip .star { width: 14px; height: 14px; background: #dfe6ef; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
.chip.pw { color: #fff; }
.chip.pw[hidden] { display: none; }
.chip.pw i { display: block; width: 44px; height: 6px; border-radius: 3px; background: #ffffff30; overflow: hidden; }
.chip.pw i b { display: block; height: 100%; width: calc(var(--k, 1) * 100%); background: var(--sky); }
.hud .grow { flex: 1; }
.hbtn { pointer-events: auto; width: 40px; height: 32px; border-radius: 10px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff1c; display: grid; place-items: center; }
.hbtn svg { width: 14px; height: 14px; fill: #fff; }
.banner { position: absolute; left: 50%; top: 24%; transform: translate(-50%, -50%); max-width: calc(100% - 24px); padding: 6px 16px; border-radius: 12px; background: #141327d0; box-shadow: inset 0 0 0 2px #ffffff30; font-size: clamp(15px, 4.4vmin, 26px); font-weight: 900; text-align: center; pointer-events: none; opacity: 0; color: var(--gold); }
.banner.show { animation: banner 1.9s ease-out both; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.9); } 12%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%); } }

.pad { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: linear-gradient(#211d3d, #141327); box-shadow: inset 0 3px 0 #2e2953; touch-action: none; }
.app.menu .pad { visibility: hidden; }
.grp { display: flex; gap: 10px; touch-action: none; }
.key { width: clamp(64px, 21vw, 96px); height: clamp(56px, 11vh, 80px); border-radius: 16px; background: #2e2953; box-shadow: inset 0 0 0 2px #ffffff22, 0 5px 0 #0a0916; color: #fff; display: grid; place-items: center; align-content: center; gap: 2px; touch-action: none; font-size: 11px; font-weight: 900; }
.key svg { width: 26px; height: 26px; fill: currentColor; pointer-events: none; }
.key span { pointer-events: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.key.jump { width: clamp(90px, 30vw, 132px); background: var(--red); box-shadow: inset 0 0 0 2px #ffffff40, 0 5px 0 var(--red-dark); }
.key.on { transform: translateY(4px); box-shadow: inset 0 0 0 2px #ffffff40, 0 1px 0 #0a0916; filter: brightness(1.15); }

.overlay { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #0b0a1a88; }
.overlay[hidden] { display: none; }
.overlay.soft { background: linear-gradient(#0b0a1a22, #0b0a1aaa); }
.panel { width: min(100%, 410px); max-height: calc(100% - 16px); overflow: auto; overscroll-behavior: contain; padding: 20px 18px 18px; border-radius: 16px; background: var(--paper); color: var(--ink); text-align: center; border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink), 0 22px 50px #0008; animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.logo { font-size: clamp(34px, 11vw, 54px); font-weight: 900; line-height: .95; color: var(--ink); text-transform: uppercase; letter-spacing: .02em; }
.logo span { display: block; color: var(--red); text-shadow: 3px 3px 0 var(--ink); }
.mascot { display: block; width: 84px; height: 84px; margin: 0 auto 6px; }
.tag { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.45; color: var(--muted); }
.totals { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.totals span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 9px; background: var(--ink); color: var(--gold); font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { flex: 1 1 120px; min-height: 46px; padding: 9px 12px; border-radius: 11px; background: var(--paper-2); color: var(--ink); font-size: 16px; font-weight: 900; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn.primary { flex-basis: 100%; background: var(--red); color: #fff; text-shadow: 0 2px 0 #0004; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .5; }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; margin-top: 10px; padding: 4px 12px; border-radius: 9px; background: #efdcc0; color: var(--ink); font-size: 13px; font-weight: 800; }
.toggle b { padding: 1px 8px; border-radius: 6px; background: #d4bf9c; font-size: 12px; }
.toggle[aria-pressed="true"] b { background: var(--jade); }
.panel h2 { font-size: 25px; font-weight: 900; line-height: 1.15; }
.panel .sub { margin-top: 4px; font-size: 14px; font-weight: 800; color: var(--muted); }
.mlist { display: grid; gap: 8px; margin-top: 12px; text-align: start; list-style: none; padding: 0; }
.mlist li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 11px; background: #f6e6cc; border: 2px solid #e2cba6; }
.mlist li b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--gold); font-size: 14px; font-weight: 900; }
.mlist li.done { background: #dff7ea; border-color: var(--jade); }
.mlist li.done b { background: var(--jade); color: #fff; }
.mlist p { font-size: 14px; font-weight: 800; line-height: 1.3; }
.mlist small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
.outfits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.of { min-width: 0; padding: 6px 4px 8px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 4px 0 var(--ink); display: grid; justify-items: center; gap: 2px; }
.of canvas { width: 56px; height: 56px; }
.of b { font-size: 13px; font-weight: 900; line-height: 1.15; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.of small { font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.of.sel { background: #fff1c2; }
.of.sel small { color: var(--red-dark); }
.of.locked canvas { filter: grayscale(.8) brightness(.8); }
.of:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.stats div { min-width: 0; padding: 6px 2px; border-radius: 9px; background: #f3e2c6; }
.stats small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats strong { display: block; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge { display: inline-block; margin-top: 10px; padding: 3px 12px; border-radius: 9px; background: var(--gold); font-size: 13px; font-weight: 900; }
.badge[hidden], .done-box[hidden] { display: none; }
.done-box { margin-top: 10px; font-size: 13px; font-weight: 800; color: #17734f; line-height: 1.4; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (min-aspect-ratio: 1/1) {
  .app { grid-template-rows: minmax(0, 1fr); }
  .pad { position: absolute; left: 0; right: 0; bottom: 0; background: none; box-shadow: none; pointer-events: none; padding-top: 0; }
  .grp { pointer-events: auto; }
  .key { width: clamp(58px, 15vh, 92px); height: clamp(52px, 14vh, 80px); background: #1413278c; box-shadow: inset 0 0 0 2px #ffffff55, 0 4px 0 #0006; }
  .key.jump { width: clamp(72px, 20vh, 112px); background: #e8443aa8; }
  html:not(.touch) .pad { display: none; }
  .outfit-panel { width: min(100%, 560px); }
  .outfit-panel .outfits { grid-template-columns: repeat(6, 1fr); }
  .over-panel { width: min(100%, 470px); }
}
@media (min-aspect-ratio: 1/1) and (pointer: coarse) { html .pad { display: flex; } }
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .panel { padding: 12px 16px; }
  .title-panel { width: min(100%, 640px); display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; align-items: center; text-align: start; }
  .title-panel .head { grid-row: span 4; text-align: center; }
  .title-panel .actions { margin-top: 8px; }
  .title-panel .totals { justify-content: flex-start; }
  .title-panel .help, .title-panel .toggle { margin-top: 6px; }
  .mascot { width: 56px; height: 56px; }
  .logo { font-size: 38px; }
  .tag { font-size: 13px; margin-top: 4px; }
  .panel h2 { font-size: 20px; }
  .mlist { margin-top: 8px; gap: 5px; }
  .mlist li { padding: 4px 8px; }
  .outfits { margin-top: 8px; }
  .stats { margin-top: 8px; }
  .btn { min-height: 40px; padding: 6px 10px; }
  .actions { margin-top: 10px; }
  .chip { height: 28px; font-size: 14px; }
  .hbtn { height: 28px; }
}
@media (max-width: 360px) {
  .chip { padding: 0 7px; font-size: 14px; gap: 4px; }
  .hud { gap: 4px; }
  .hbtn { width: 34px; }
  .panel { padding: 16px 12px 14px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-height: 580px) and (max-aspect-ratio: 1/1) {
  .mascot { width: 56px; height: 56px; }
  .logo { font-size: 34px; }
  .tag { margin-top: 6px; font-size: 13px; }
  .key { height: 52px; }
  .pad { padding-top: 7px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .mlist li { padding: 5px 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .banner.show { opacity: 1; } }
</style>
</head>
<body>
<main class="app menu" id="app">
  <div class="view" id="view">
    <canvas id="game" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
    <div class="hud" id="hud">
      <button type="button" class="hbtn" id="pause-btn" data-i18n-label="pause"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="3" height="8"/><rect x="6" y="1" width="3" height="8"/></svg></button>
      <div class="chip dist" id="hud-dist">0 m</div>
      <span class="grow"></span>
      <div class="chip pw" id="hud-pw" hidden><span id="hud-pw-name"></span><i><b id="hud-pw-bar"></b></i></div>
      <div class="chip"><span class="star" aria-hidden="true"></span><span id="hud-ammo">5</span></div>
      <div class="chip"><span class="ico" aria-hidden="true"></span><span id="hud-coins">0</span></div>
    </div>
    <div class="banner" id="banner" aria-hidden="true"></div>

    <div class="overlay soft" id="title-ov">
      <div class="panel title-panel" role="dialog" aria-modal="true" aria-labelledby="game-title">
        <div class="head">
          <canvas class="mascot" id="mascot" width="168" height="168" aria-hidden="true"></canvas>
          <h1 class="logo" id="game-title">Ninja<span>Run</span></h1>
        </div>
        <p class="tag" data-i18n="tagline"></p>
        <div class="totals"><span id="title-best"></span><span id="title-bank"></span></div>
        <div class="actions">
          <button type="button" class="btn primary" id="play-btn" data-i18n="play"></button>
          <button type="button" class="btn" id="missions-btn" data-i18n="missions"></button>
          <button type="button" class="btn" id="outfits-btn" data-i18n="outfits"></button>
        </div>
        <div>
          <p class="help" id="help"></p>
          <button type="button" class="toggle" id="sound-btn" aria-pressed="true"><span data-i18n="sound"></span><b id="sound-state"></b></button>
        </div>
      </div>
    </div>

    <div class="overlay" id="missions-ov" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="missions-h">
        <h2 id="missions-h" data-i18n="missions"></h2>
        <p class="sub" data-i18n="missionsSub"></p>
        <ul class="mlist" id="mlist"></ul>
        <div class="actions"><button type="button" class="btn primary" id="missions-back" data-i18n="back"></button></div>
      </div>
    </div>

    <div class="overlay" id="outfits-ov" hidden>
      <div class="panel outfit-panel" role="dialog" aria-modal="true" aria-labelledby="outfits-h">
        <h2 id="outfits-h" data-i18n="outfits"></h2>
        <p class="sub" id="outfits-bank"></p>
        <div class="outfits" id="outfit-grid"></div>
        <div class="actions"><button type="button" class="btn primary" id="outfits-back" data-i18n="back"></button></div>
      </div>
    </div>

    <div class="overlay" id="pause-ov" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pause-h">
        <h2 id="pause-h" data-i18n="paused"></h2>
        <ul class="mlist" id="pause-mlist"></ul>
        <div class="actions">
          <button type="button" class="btn primary" id="resume-btn" data-i18n="resume"></button>
          <button type="button" class="btn" id="quit-btn" data-i18n="menu"></button>
        </div>
      </div>
    </div>

    <div class="overlay" id="over-ov" hidden>
      <div class="panel over-panel" role="dialog" aria-modal="true" aria-labelledby="over-h">
        <h2 id="over-h"></h2>
        <span class="badge" id="new-best" data-i18n="newBest" hidden></span>
        <div class="stats">
          <div><small data-i18n="dist"></small><strong id="o-dist">0</strong></div>
          <div><small data-i18n="coins"></small><strong id="o-coins">0</strong></div>
          <div><small data-i18n="foes"></small><strong id="o-foes">0</strong></div>
          <div><small data-i18n="best"></small><strong id="o-best">0</strong></div>
        </div>
        <p class="done-box" id="o-done" hidden></p>
        <div class="actions">
          <button type="button" class="btn primary" id="again-btn" data-i18n="again"></button>
          <button type="button" class="btn" id="over-missions" data-i18n="missions"></button>
          <button type="button" class="btn" id="menu-btn" data-i18n="menu"></button>
        </div>
      </div>
    </div>
  </div>
  <div class="pad" id="pad">
    <div class="grp">
      <button type="button" class="key" id="k-slide" data-i18n-label="slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l8 8 8-8-2.5-2.5L12 12 6.5 6.5z"/></svg><span data-i18n="slideShort"></span></button>
      <button type="button" class="key" id="k-throw" data-i18n-label="throw"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg><span data-i18n="throwShort"></span></button>
    </div>
    <div class="grp">
      <button type="button" class="key jump" id="k-jump" data-i18n-label="jump"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15l8-8 8 8-2.5 2.5L12 12l-5.5 5.5z"/></svg><span data-i18n="jumpShort"></span></button>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>
<script>
(() => {
  'use strict';

  const I18N = {
    en: {

      play: 'Chạy!', missions: 'Nhiệm vụ', outfits: 'Trang phục', back: 'Quay lại', paused: 'Tạm dừng', resume: 'Tiếp tục', menu: 'Menu', again: 'Chạy lại',
      best: 'Kỷ lục', coins: 'Xu', dist: 'Quãng đường', foes: 'Hạ địch', newBest: 'Kỷ lục mới!', sound: 'Âm thanh', on: 'Bật', off: 'Tắt',

      levelN: n => `Cấp ${n}`, rewardN: n => `+${n} xu`, missionDone: 'Hoàn thành nhiệm vụ!', doneRun: 'Nhiệm vụ đã xong:',
      m: { dist: n => `Chạy ${n} m trong một lượt`, coins: n => `Nhặt ${n} xu trong một lượt`, foes: n => `Hạ ${n} kẻ địch trong một lượt`, dj: n => `Nhảy kép ${n} lần trong một lượt`, wall: n => `Chạy trên tường ${n} lần trong một lượt`, power: n => `Nhặt ${n} vật phẩm trong một lượt`, gate: n => `Trượt qua ${n} cổng trong một lượt` },

    }
    for (const sp of w.spikes) {
      if (sp.x > right || sp.x + sp.w < left) continue;
      ctx.fillStyle = '#d7dde6';
      const n = Math.max(2, Math.round(sp.w / 10)), ww = sp.w / n;
      for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.moveTo(sp.x + i * ww, sp.top); ctx.lineTo(sp.x + i * ww + ww / 2, sp.top - 16); ctx.lineTo(sp.x + (i + 1) * ww, sp.top); ctx.fill(); }
    }
    for (const gt of w.gates) {
      if (gt.x > right || gt.x + gt.w < left) continue;
      ctx.fillStyle = '#6b4226'; ctx.fillRect(gt.x, gt.top - 300, gt.w, 270);
      ctx.fillStyle = '#8a5a34'; for (let y = gt.top - 290; y < gt.top - 40; y += 24) ctx.fillRect(gt.x + 3, y, gt.w - 6, 14);
      ctx.fillStyle = '#e9d9a8';
      for (let x = gt.x + 10; x < gt.x + gt.w - 6; x += 22) { ctx.fillRect(x, gt.top - 30, 9, 14); }
      ctx.fillStyle = '#c0423a'; ctx.fillRect(gt.x - 4, gt.top - 36, gt.w + 8, 6);
    }
    const tt = w.t;
    for (const c of w.coins) {
      if (c.got || c.x < left || c.x > right) continue;
      const sx = Math.abs(Math.cos(tt * 4 + c.x * 0.02));
      ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 8 * sx + 1.5, 8, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#ffc94a'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 6 * sx + 1, 6, 0, 0, 6.29); ctx.fill();
    }
    for (const it of w.items) {
      if (it.taken || it.x < left || it.x > right) continue;
      const y = it.y + Math.sin(tt * 3 + it.x) * 4;
      if (it.kind === 'ammo') { drawStar(it.x - 6, y, tt * 2, 8); drawStar(it.x + 6, y - 4, tt * 2 + 1, 8); continue; }
      ctx.fillStyle = '#ffffff30'; ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(it.x, y, 15, 0, 6.29); ctx.fill(); ctx.stroke();
      drawPowerIcon(it.kind, it.x, y);
    }
    for (const f of w.foes) {
      if (f.x < left || f.x > right) continue;
      ctx.globalAlpha = f.alive ? 1 : Math.max(0, f.deadT / 0.6);
      if (f.kind === 'guard') drawGuard(f); else drawCrow(f);
      ctx.globalAlpha = 1;
    }
    for (const st of w.stars) drawStar(st.x, st.y, st.rot, 7);
    if (!(p.invT > 0 && Math.floor(tt * 16) % 2)) drawNinja(ctx, p.x, p.y, poseOf(p), OUTFITS[outfit], p.runPhase, tt);
    if (p.shield) { ctx.strokeStyle = '#9fd8ffcc'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(p.x, p.y - pHeight(p) / 2, 30, 0, 6.29); ctx.stroke(); }
    if (p.dashT > 0 && !reducedMotion) { ctx.fillStyle = '#ffffff40'; for (let i = 1; i < 5; i++) ctx.fillRect(p.x - 20 - i * 18, p.y - 36 + i * 5, 14, 3); }
    for (const q of w.parts) {
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      if (q.ring) { ctx.strokeStyle = q.c; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, q.r + (1 - q.life / q.max) * 20, 0, 6.29); ctx.stroke(); }
      else { ctx.fillStyle = q.c; ctx.fillRect(q.x - q.r / 2, q.y - q.r / 2, q.r, q.r); }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function poseOf(p) { if (p.dead) return 'dead'; if (p.wall) return 'wall'; if (p.ground && p.slideT > 0) return 'slide'; if (!p.ground && !p.coyote) return p.jumps === 0 ? 'flip' : 'air'; return 'run'; }
  function drawStar(x, y, rot, r) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = '#dfe6ef'; ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rad = i % 2 ? r * 0.35 : r; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
    ctx.fill(); ctx.fillStyle = '#5a6375'; ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, 6.29); ctx.fill(); ctx.restore();
  }
  function drawPowerIcon(kind, x, y) {
    ctx.lineWidth = 3;
    if (kind === 'magnet') { ctx.strokeStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(x, y - 1, 6, Math.PI, 0); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.fillRect(x - 7.5, y - 1, 3, 5); ctx.fillRect(x + 4.5, y - 1, 3, 5); }
    else if (kind === 'shield') { ctx.fillStyle = '#9fd8ff'; ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.lineTo(x + 8, y - 5); ctx.quadraticCurveTo(x + 7, y + 5, x, y + 9); ctx.quadraticCurveTo(x - 7, y + 5, x - 8, y - 5); ctx.fill(); }
    else { ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.moveTo(x + 2, y - 10); ctx.lineTo(x - 6, y + 1); ctx.lineTo(x, y + 1); ctx.lineTo(x - 2, y + 10); ctx.lineTo(x + 6, y - 2); ctx.lineTo(x, y - 2); ctx.fill(); }
  }
  function drawGuard(f) {
    const x = f.x, y = f.y, bob = Math.sin(f.t * 8) * 1.5;
    ctx.fillStyle = '#5c2a6e'; ctx.fillRect(x - 11, y - 30 + bob, 22, 22);
    ctx.fillStyle = '#3d1b4a'; ctx.fillRect(x - 9, y - 9, 7, 9); ctx.fillRect(x + 2, y - 9, 7, 9);
    ctx.fillStyle = '#f0c49a'; ctx.beginPath(); ctx.arc(x, y - 36 + bob, 8, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#d9b24a'; ctx.beginPath(); ctx.moveTo(x - 15, y - 38 + bob); ctx.lineTo(x, y - 50 + bob); ctx.lineTo(x + 15, y - 38 + bob); ctx.fill();
    ctx.fillStyle = '#1c1830'; ctx.fillRect(x - 5, y - 37 + bob, 3, 2); ctx.fillRect(x - 1, y - 37 + bob, 3, 2);
    ctx.fillStyle = '#9a6a3a'; ctx.fillRect(x - 18, y - 46 + bob, 3, 40);
  }
  function drawCrow(f) {
    const x = f.x, y = f.y, flap = Math.sin(f.t * 14) * 9;
    ctx.fillStyle = '#23202e';
    ctx.beginPath(); ctx.ellipse(x, y, 13, 7, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 2, y - 2); ctx.lineTo(x + 6, y - 4 - flap); ctx.lineTo(x + 12, y - 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 11, y - 3, 5, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(x - 15, y - 4); ctx.lineTo(x - 22, y - 2); ctx.lineTo(x - 15, y - 1); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 13, y - 5, 2, 2);
  }

  // Ninja drawn from shapes; (x, y) is the feet position.
  function drawNinja(c, x, y, pose, o, phase, time) {
    c.save(); c.translate(x, y);
    if (pose === 'slide') { c.rotate(-1.2); c.translate(-6, 6); }
    if (pose === 'wall') c.rotate(-0.15);
    if (pose === 'flip') { c.translate(0, -22); c.rotate(-phase * 0.9 % 6.283); c.translate(0, 22); }
    if (pose === 'dead') c.rotate(0.9);
    const leg = pose === 'run' || pose === 'wall' ? Math.sin(phase) : pose === 'air' ? 0.6 : 0.2;
    // Scarf tail
    c.strokeStyle = o.scarf; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-4, -36);
    const wv = Math.sin(time * 14) * 3;
    c.quadraticCurveTo(-14, -38 + wv, -24, -34 - wv); c.stroke();
    c.lineWidth = 3; c.beginPath(); c.moveTo(-4, -35); c.quadraticCurveTo(-12, -32 - wv, -20, -28 + wv); c.stroke();
    // Legs
    c.strokeStyle = o.suit; c.lineWidth = 6;
    c.beginPath(); c.moveTo(-2, -16); c.lineTo(-2 + leg * 8, -6); c.lineTo(-2 + leg * 10, 0); c.stroke();
    c.beginPath(); c.moveTo(2, -16); c.lineTo(2 - leg * 8, -6); c.lineTo(2 - leg * 10 - (pose === 'air' ? 4 : 0), 0); c.stroke();
    // Body
    c.fillStyle = o.suit; c.beginPath(); c.roundRect ? c.roundRect(-8, -32, 16, 18, 5) : c.rect(-8, -32, 16, 18); c.fill();
    c.fillStyle = o.scarf; c.fillRect(-8, -18, 16, 3);
    // Arms
    c.strokeStyle = o.trim; c.lineWidth = 5;
    c.beginPath(); c.moveTo(0, -28); c.lineTo(8 - leg * 6, -20); c.stroke();
    // Head
    c.fillStyle = o.suit; c.beginPath(); c.arc(1, -38, 8.5, 0, 6.29); c.fill();
    c.fillStyle = o.skin; c.fillRect(-1, -41, 10, 5);
    c.fillStyle = '#1c1830'; c.fillRect(4, -40, 2, 3); c.fillRect(7, -40, 1.6, 3);
    c.fillStyle = o.scarf; c.fillRect(-7, -45, 15, 3);
    c.restore();
  }

  function drawMascot(cv, o) {
    const c = cv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
    const k = cv.width / 64; c.setTransform(k, 0, 0, k, 0, 0);
    c.fillStyle = '#ffffff00';
    drawNinja(c, 30, 58, 'run', o, 1.1, 0.3);
  }

  // ---------- HUD & panels ----------
  const app = $('app');
  const overlays = ['title-ov', 'missions-ov', 'outfits-ov', 'pause-ov', 'over-ov'].map($);
  let returnTo = 'title-ov';
  function show(id) {
    overlays.forEach(o => { o.hidden = o.id !== id; });
    const el = id && $(id);
    if (el) { const b = el.querySelector('.btn.primary'); if (b) setTimeout(() => b.focus({ preventScroll: true }), 30); }
  }
  let hudCache = '';
  function updateHud() {
    if (!W) return;
    const p = W.p, d = Math.floor(p.x / M);
    const pw = p.dashT > 0 ? ['dash', p.dashT / 3] : p.magnetT > 0 ? ['magnet', p.magnetT / 9] : p.shield ? ['shield', 1] : null;
    const key = `${d}|${W.coinsRun}|${W.ammo}|${pw ? pw[0] + Math.round(pw[1] * 40) : ''}`;
    if (key === hudCache) return;
    hudCache = key;
    $('hud-dist').textContent = `${d} m`;
    $('hud-coins').textContent = W.coinsRun;
    $('hud-ammo').textContent = W.ammo;
    $('hud-pw').hidden = !pw;
    if (pw) { $('hud-pw-name').textContent = t[pw[0]]; $('hud-pw-bar').style.setProperty('--k', pw[1].toFixed(3)); }
  }
  let bannerT = 0;
  function banner(text) {
    const b = $('banner'); b.textContent = text; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('show'), 2000);
  }
  function announce(text) { $('announcer').textContent = text; }
  function renderTitle() {
    $('title-best').textContent = t.bestN(best);
    $('title-bank').textContent = t.bankN(bank);
    $('help').textContent = document.documentElement.classList.contains('touch') ? t.helpTouch : t.helpKeys;
    $('sound-btn').setAttribute('aria-pressed', String(soundOn));
    $('sound-state').textContent = soundOn ? t.on : t.off;
    drawMascot($('mascot'), OUTFITS[outfit]);
  }
  function renderOutfits() {
    $('outfits-bank').textContent = t.bankN(bank);
    const grid = $('outfit-grid'); grid.innerHTML = '';
    OUTFITS.forEach((o, i) => {
      const b = document.createElement('button');
      const have = owned.includes(i);
      b.type = 'button'; b.className = 'of' + (i === outfit ? ' sel' : '') + (have ? '' : ' locked');
      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112; cv.setAttribute('aria-hidden', 'true');
      const nm = document.createElement('b'); nm.textContent = t.outfitNames[i];
      const sm = document.createElement('small'); sm.textContent = i === outfit ? t.equipped : have ? t.equip : t.costN(o.cost);
      b.append(cv, nm, sm);
      b.setAttribute('aria-label', `${t.outfitNames[i]}, ${sm.textContent}`);
      b.setAttribute('aria-pressed', String(i === outfit));
      b.addEventListener('click', () => pickOutfit(i));
      grid.appendChild(b);
      drawMascot(cv, o);
    });
  }
  function pickOutfit(i) {
    if (!owned.includes(i)) {
      const cost = OUTFITS[i].cost;
      if (bank < cost) { banner(t.needN(cost - bank)); announce(t.needN(cost - bank)); return; }
      bank -= cost; owned.push(i); save('bank', bank); save('owned', owned);
      banner(t.unlocked(t.outfitNames[i])); announce(t.unlocked(t.outfitNames[i])); sfx.mission();
    }
    outfit = i; save('outfit', outfit);
    renderOutfits();
    const btn = $('outfit-grid').children[i]; if (btn) btn.focus({ preventScroll: true });
  }

  function startRun() {
    newWorld(forcedSeed ?? Math.floor(Math.random() * 1e9));
    mode = 'play'; app.classList.remove('menu'); hudCache = '';
    cam.x = W.p.x - view.vw * 0.27; cam.y = WORLD_H - view.vh;
    ensureWorld(W.p.x + view.vw + 900);
    show(null); updateHud(); canvas.focus({ preventScroll: true });
    actx && actx.state === 'suspended' && actx.resume();
  }
  function gameOver() {
    mode = 'over';
    const d = Math.floor(W.p.x / M);
    bank += W.coinsRun; save('bank', bank);
    const nb = d > best; if (nb) { best = d; save('best', best); }
    $('over-h').textContent = t.deaths[W.p.dead] || t.deaths.fell;
    $('o-dist').textContent = `${d} m`; $('o-coins').textContent = W.coinsRun + (W.bonus || 0); $('o-foes').textContent = W.foesRun; $('o-best').textContent = `${best} m`;
    $('new-best').hidden = !nb;
    $('o-done').hidden = !W.doneRun.length;
    $('o-done').textContent = W.doneRun.length ? `${t.doneRun} ${W.doneRun.join(' · ')}` : '';
    show('over-ov'); announce(`${t.overN(d)}${nb ? ' — ' + t.newBest : ''}`);
  }
  function pause() { if (mode !== 'play') return; mode = 'paused'; renderMissions($('pause-mlist')); show('pause-ov'); }
  function resume() { if (mode !== 'paused') return; mode = 'play'; show(null); last = performance.now(); canvas.focus({ preventScroll: true }); }
  function toMenu() { mode = 'menu'; app.classList.add('menu'); renderTitle(); show('title-ov'); }

  $('play-btn').addEventListener('click', startRun);
  $('again-btn').addEventListener('click', startRun);
  $('missions-btn').addEventListener('click', () => { returnTo = 'title-ov'; renderMissions($('mlist')); show('missions-ov'); });
  $('over-missions').addEventListener('click', () => { returnTo = 'over-ov'; renderMissions($('mlist')); show('missions-ov'); });
  $('missions-back').addEventListener('click', () => { if (returnTo === 'title-ov') renderTitle(); show(returnTo); });
  $('outfits-btn').addEventListener('click', () => { renderOutfits(); show('outfits-ov'); });
  $('outfits-back').addEventListener('click', () => { renderTitle(); show('title-ov'); });
  $('pause-btn').addEventListener('click', pause);
  $('resume-btn').addEventListener('click', resume);
  $('quit-btn').addEventListener('click', toMenu);
  $('menu-btn').addEventListener('click', toMenu);
  $('sound-btn').addEventListener('click', () => { soundOn = !soundOn; save('sound', soundOn); renderTitle(); });

  // ---------- input ----------
  function pressJump() { if (mode !== 'play') return; input.jumpHeld = true; if (!doJump()) W.jumpBuf = 0.12; }
  function releaseJump() { input.jumpHeld = false; }
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (mode === 'play') {
      if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); if (!e.repeat) pressJump(); return; }
      if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); input.slideHeld = true; if (!e.repeat) doSlide(); return; }
      if (k === 'f' || k === 'F' || k === 'x' || k === 'X' || k === 'ArrowRight') { e.preventDefault(); doThrow(); return; }
      if (k === 'p' || k === 'P') { e.preventDefault(); pause(); return; }
    } else if (mode === 'paused' && (k === 'p' || k === 'P')) { e.preventDefault(); resume(); }
  });
  document.addEventListener('keyup', e => {
    const k = e.key;
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') releaseJump();
    if (k === 'ArrowDown' || k === 's' || k === 'S') input.slideHeld = false;
  });
  // Canvas: tap = jump, swipe down = slide, swipe right = throw.
  let touchStart = null;
  canvas.addEventListener('pointerdown', e => {
    if (mode !== 'play') return;
    e.preventDefault();
    touchStart = { x: e.clientX, y: e.clientY, id: e.pointerId, acted: false };
    if (e.pointerType === 'mouse') { touchStart.acted = true; pressJump(); }
  });
  canvas.addEventListener('pointermove', e => {
    if (!touchStart || touchStart.id !== e.pointerId || touchStart.acted || mode !== 'play') return;
    const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    if (dy > 28 && dy > Math.abs(dx)) { touchStart.acted = true; doSlide(); }
    else if (dx > 34 && dx > Math.abs(dy)) { touchStart.acted = true; doThrow(); }
    else if (dy < -28 && -dy > Math.abs(dx)) { touchStart.acted = true; pressJump(); }
  });
  function endPointer(e) {
    if (!touchStart || touchStart.id !== e.pointerId) return;
    if (!touchStart.acted && mode === 'play') { pressJump(); }
    releaseJump(); touchStart = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  function holdKey(id, down, up) {
    const el = $(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ } down(); });
    const off = () => { el.classList.remove('on'); up && up(); };
    el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
    el.addEventListener('click', e => { if (e.detail === 0) { down(); up && up(); } }); // keyboard activation
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  holdKey('k-jump', pressJump, releaseJump);
  holdKey('k-slide', () => { if (mode === 'play') { input.slideHeld = true; doSlide(); } }, () => { input.slideHeld = false; });
  holdKey('k-throw', () => { if (mode === 'play') doThrow(); });
  window.addEventListener('touchstart', () => { if (!document.documentElement.classList.contains('touch')) { document.documentElement.classList.add('touch'); if (mode === 'menu') renderTitle(); } }, { passive: true });
  if (matchMedia('(pointer: coarse)').matches) document.documentElement.classList.add('touch');
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // ---------- main loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (W && !document.hidden) {
      if (mode === 'play') {
        acc += dt;
        let n = 0;
        while (acc >= STEP && n < 8) { step(STEP); acc -= STEP; n++; if (mode !== 'play') break; }
        if (W.p.dead && W.deathT > 0.9 && mode === 'play') gameOver();
        ensureWorld(W.p.x + view.vw + 900);
        updateHud();
      }
      if (mode !== 'paused') camUpdate(mode === 'play' ? dt : 0);
      draw();
    }
    requestAnimationFrame(frame);
  }

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__ninjaRun = {
    state: () => W && { mode, x: W.p.x, y: W.p.y, vy: W.p.vy, ground: W.p.ground, wall: !!W.p.wall, slide: W.p.slideT > 0, dead: W.p.dead, dist: Math.floor(W.p.x / M), speed: speedAt(W.p.x), coins: W.coinsRun, foes: W.foesRun, ammo: W.ammo, dj: W.djRun, walls: W.wallRun, gates: W.gateRun, power: W.powerRun, shield: W.p.shield, dashT: W.p.dashT, magnetT: W.p.magnetT, bank, best, missions: JSON.parse(JSON.stringify(mstate)), done: W.doneRun.slice() },
    world: () => W && JSON.parse(JSON.stringify({ segs: W.segs, walls: W.walls, spikes: W.spikes, gates: W.gates, foes: W.foes.filter(f => f.alive), items: W.items })),
    setSeed: s => { forcedSeed = s; },
    // Pure generator check: builds a fresh world to x and returns its layout (does not touch the live run).
    generate: (seed, toX) => { const keep = W, keepRand = rand; newWorld(seed); while (lastSeg().x1 < toX) genChunk(); const out = JSON.parse(JSON.stringify({ segs: W.segs, walls: W.walls, spikes: W.spikes, gates: W.gates })); W = keep; rand = keepRand; return out; },
    consts: { G, JUMP_V, DJUMP_V, AIR, PW, PH, PH_SLIDE, M, speedAt: x => speedAt(x) },
  };

  renderTitle();
  show('title-ov');
  newWorld(1); cam.x = -60; cam.y = 0;
  new ResizeObserver(resize).observe($('view'));
  resize();
  cam.y = WORLD_H - view.vh;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
