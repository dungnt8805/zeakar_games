<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slope Roll</title>
<style>
:root {
  --bg: #0b0620;
  --ink: #f4f1ff;
  --muted: #b3a8dc;
  --neon: #29f0c8;
  --neon-dark: #129a80;
  --pink: #ff3ea5;
  --paper: #1a1240;
  --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

.app { position: relative; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
canvas:focus-visible { outline: none; }

.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); pointer-events: none; }
.app.menu .hud, .app.menu .pad { visibility: hidden; }
.chip { min-width: 60px; padding: 4px 10px; border-radius: 12px; background: #1a1240cc; border: 1px solid #ffffff22; text-align: center; }
.chip small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.chip strong { display: block; font-size: 17px; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.main strong { color: var(--neon); font-size: 20px; }
.hud .grow { flex: 1; }
.iconbtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 12px; background: #1a1240cc; border: 1px solid #ffffff22; font-size: 16px; font-weight: 900; display: grid; place-items: center; }

.toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); padding: 6px 14px; border-radius: 99px; background: var(--pink); color: #fff; font-weight: 900; font-size: 16px; white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }

.pad { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; padding: 0 max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); pointer-events: none; }
.touch .pad { display: flex; }
.pad span { width: 58px; height: 58px; border-radius: 50%; border: 2px solid #ffffff44; display: grid; place-items: center; font-size: 22px; color: #ffffffaa; transition: background .1s; }
.pad span.on { background: #29f0c855; }
@media (max-height: 420px) { .pad span { width: 46px; height: 46px; font-size: 18px; } }

.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8px; background: #0b062066; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 380px); max-height: calc(100% - 8px); overflow-y: auto; padding: 18px 16px; border-radius: 22px; background: var(--paper); border: 2px solid #29f0c855; box-shadow: 0 0 30px #29f0c833, 0 20px 50px #0008; text-align: center; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.title { font-size: clamp(34px, 11vw, 54px); font-weight: 900; letter-spacing: -.02em; line-height: 1; color: #fff; text-shadow: 0 0 12px var(--neon), 0 3px 0 var(--neon-dark); }
.title span { color: var(--pink); text-shadow: 0 0 12px var(--pink), 0 3px 0 #a0145f; }
.tagline { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--muted); }
.modes { display: grid; gap: 8px; margin-top: 14px; }
.mode { display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: #2a1f5c; box-shadow: 0 3px 0 #120c30; text-align: left; }
.mode .ic { font-size: 26px; text-align: center; }
.mode b { display: block; font-size: 18px; font-weight: 900; }
.mode span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.3; }
.mode.primary { background: var(--neon); color: #0b0620; box-shadow: 0 4px 0 var(--neon-dark); }
.mode.primary span { color: #0b0620; opacity: .8; }
.mode:active, .btn:active { transform: translateY(2px); }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.4; }
.panel h2 { font-size: 26px; font-weight: 900; }
.sub { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
.scores { display: flex; justify-content: center; gap: 26px; margin-top: 12px; }
.scores small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.scores strong { display: block; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--pink); color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.row { display: flex; gap: 8px; margin-top: 14px; }
.btn { flex: 1; padding: 12px; border-radius: 14px; background: #2a1f5c; box-shadow: 0 3px 0 #120c30; font-size: 16px; font-weight: 900; }
.btn.primary { background: var(--neon); color: #0b0620; box-shadow: 0 4px 0 var(--neon-dark); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 480px) {
  .panel { padding: 10px 14px; }
  .title { font-size: 32px; }
  .tagline { display: none; }
  .modes { margin-top: 8px; gap: 6px; }
  .mode { padding: 6px 10px; }
  .mode .ic { font-size: 20px; }
  .mode b { font-size: 16px; }
  .help { margin-top: 6px; }
  .panel h2 { font-size: 20px; }
  .scores { margin-top: 6px; }
  .scores strong { font-size: 22px; }
  .row { margin-top: 8px; }
  .btn { padding: 9px; }
}
@media (min-aspect-ratio: 3/2) {
  .panel.wide { width: min(100%, 660px); }
  .panel.wide .modes { grid-template-columns: repeat(3, 1fr); }
  .panel.wide .mode { grid-template-columns: 1fr; text-align: center; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app menu" id="app">
  <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
  <div class="hud">
    <div class="chip main"><small data-i18n="dist"></small><strong id="hd">0</strong></div>
    <div class="chip"><small data-i18n="speed"></small><strong id="hs">0</strong></div>
    <div class="chip"><small data-i18n="best"></small><strong id="hb">0</strong></div>
    <div class="grow"></div>
    <button type="button" class="iconbtn" id="pause" data-i18n-label="pause">II</button>
  </div>
  <div class="toast" id="toast" aria-hidden="true"></div>
  <div class="pad" aria-hidden="true"><span id="pl">◀</span><span id="pr">▶</span></div>

  <div class="overlay" id="menu">
    <div class="panel wide" role="dialog" aria-labelledby="menu-title">
      <h1 class="title" id="menu-title">Slope <span>Roll</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="modes">

        <button type="button" class="mode" id="m-turbo"><span class="ic">⚡</span><div><b data-i18n="turbo"></b><span id="d-turbo"></span></div></button>
        <button type="button" class="mode" id="m-daily"><span class="ic">📅</span><div><b data-i18n="daily"></b><span id="d-daily"></span></div></button>
      </div>
      <p class="help" id="help"></p>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="panel" role="dialog" aria-labelledby="paused-title">
      <h2 id="paused-title" data-i18n="paused"></h2>
      <div class="row"><button type="button" class="btn" id="quit" data-i18n="menu"></button><button type="button" class="btn primary" id="resume" data-i18n="resume"></button></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel" role="dialog" aria-labelledby="over-title">
      <h2 id="over-title"></h2>
      <p class="sub" id="osub"></p>
      <div class="scores">
        <div><small data-i18n="dist"></small><strong id="od">0</strong></div>
        <div><small data-i18n="best"></small><strong id="ob">0</strong></div>
      </div>
      <p class="badge" id="newbest" data-i18n="newBest" hidden></p>
      <div class="row"><button type="button" class="btn" id="omenu" data-i18n="menu"></button><button type="button" class="btn primary" id="oretry" data-i18n="retry"></button></div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<script>

  const I18N = {
    en: { tagline: 'Roll down an endless neon slope. Dodge red blocks, jump the gaps, go faster and faster.', classic: 'Classic', turbo: 'Turbo', daily: 'Daily', classicDesc: b => `Starts gentle · best ${b} m`, turboDesc: b => `Fast from the start · best ${b} m`, dailyDesc: b => `Same slope for everyone today · best ${b} m`, helpKeys: '← → or A D to steer · P to pause', helpTouch: 'Hold the left or right side of the screen to steer', dist: 'Distance', speed: 'Speed', best: 'Best', paused: 'Paused', resume: 'Resume', menu: 'Menu', retry: 'Retry', crashed: 'Smashed!', fell: 'Off the edge!', crashedSub: 'You hit a red block.', fellSub: 'The ball rolled into the void.', newBest: 'New best!', canvas: 'Neon slope with your rolling ball', pause: 'Pause', milestone: n => `${n} m!`, faster: 'Faster!' },
    vi: { tagline: 'Lăn xuống con dốc neon bất tận. Né khối đỏ, nhảy qua hố, ngày càng nhanh hơn.', classic: 'Cổ điển', turbo: 'Tăng tốc', daily: 'Hằng ngày', classicDesc: b => `Khởi đầu nhẹ nhàng · kỷ lục ${b} m`, turboDesc: b => `Nhanh ngay từ đầu · kỷ lục ${b} m`, dailyDesc: b => `Cùng một con dốc cho mọi người hôm nay · kỷ lục ${b} m`, helpKeys: '← → hoặc A D để lái · P để tạm dừng', helpTouch: 'Giữ nửa trái hoặc nửa phải màn hình để lái', dist: 'Quãng đường', speed: 'Tốc độ', best: 'Kỷ lục', paused: 'Tạm dừng', resume: 'Tiếp tục', menu: 'Menu', retry: 'Chơi lại', crashed: 'Vỡ tan!', fell: 'Rơi khỏi dốc!', crashedSub: 'Bạn đã đâm vào khối đỏ.', fellSub: 'Quả bóng lăn xuống khoảng không.', newBest: 'Kỷ lục mới!', canvas: 'Con dốc neon với quả bóng của bạn', pause: 'Tạm dừng', milestone: n => `${n} m!`, faster: 'Nhanh hơn!' },

    th: { tagline: 'กลิ้งลงทางลาดนีออนไม่รู้จบ หลบบล็อกสีแดง กระโดดข้ามหลุม เร็วขึ้นเรื่อย ๆ', classic: 'คลาสสิก', turbo: 'เทอร์โบ', daily: 'รายวัน', classicDesc: b => `เริ่มแบบสบาย ๆ · สถิติ ${b} ม.`, turboDesc: b => `เร็วตั้งแต่เริ่ม · สถิติ ${b} ม.`, dailyDesc: b => `ทางลาดเดียวกันสำหรับทุกคนวันนี้ · สถิติ ${b} ม.`, helpKeys: '← → หรือ A D เพื่อบังคับ · P เพื่อหยุดชั่วคราว', helpTouch: 'แตะค้างฝั่งซ้ายหรือขวาของจอเพื่อบังคับ', dist: 'ระยะทาง', speed: 'ความเร็ว', best: 'สถิติ', paused: 'หยุดชั่วคราว', resume: 'เล่นต่อ', menu: 'เมนู', retry: 'เล่นอีกครั้ง', crashed: 'แตกกระจาย!', fell: 'ตกขอบ!', crashedSub: 'คุณชนบล็อกสีแดง', fellSub: 'ลูกบอลกลิ้งตกลงไปในความมืด', newBest: 'สถิติใหม่!', canvas: 'ทางลาดนีออนกับลูกบอลของคุณ', pause: 'หยุดชั่วคราว', milestone: n => `${n} ม.!`, faster: 'เร็วขึ้น!' },
    ja: { tagline: '果てしないネオンの坂を転がり落ちよう。赤いブロックをよけ、すき間を飛び越え、どんどん加速。', classic: 'クラシック', turbo: 'ターボ', daily: 'デイリー', classicDesc: b => `ゆっくりスタート · ベスト ${b} m`, turboDesc: b => `最初から高速 · ベスト ${b} m`, dailyDesc: b => `今日はみんな同じ坂 · ベスト ${b} m`, helpKeys: '← → または A D で操作 · P で一時停止', helpTouch: '画面の左側か右側を長押しして操作', dist: '距離', speed: 'スピード', best: 'ベスト', paused: '一時停止中', resume: '再開', menu: 'メニュー', retry: 'もう一度', crashed: '粉々！', fell: '落ちた！', crashedSub: '赤いブロックにぶつかりました。', fellSub: 'ボールが奈落へ転がり落ちました。', newBest: '自己ベスト！', canvas: 'ネオンの坂と転がるボール', pause: '一時停止', milestone: n => `${n} m！`, faster: '加速！' },
    ko: { tagline: '끝없는 네온 경사로를 굴러 내려가세요. 빨간 블록을 피하고 틈을 뛰어넘으며 점점 빨라집니다.', classic: '클래식', turbo: '터보', daily: '데일리', classicDesc: b => `천천히 시작 · 최고 ${b} m`, turboDesc: b => `처음부터 빠르게 · 최고 ${b} m`, dailyDesc: b => `오늘은 모두 같은 경사로 · 최고 ${b} m`, helpKeys: '← → 또는 A D로 조종 · P로 일시정지', helpTouch: '화면 왼쪽이나 오른쪽을 길게 눌러 조종하세요', dist: '거리', speed: '속도', best: '최고', paused: '일시정지', resume: '계속', menu: '메뉴', retry: '다시 하기', crashed: '산산조각!', fell: '추락!', crashedSub: '빨간 블록에 부딪혔어요.', fellSub: '공이 허공으로 굴러떨어졌어요.', newBest: '최고 기록!', canvas: '네온 경사로와 굴러가는 공', pause: '일시정지', milestone: n => `${n} m!`, faster: '더 빠르게!' },
  };
  const requested = new URLSearchParams(location.search).get('lang');
  const lang = I18N[requested] ? requested : 'en';
  const t = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t[el.dataset.i18n];

  // World: track is 5 lanes of 1 unit; +z is downhill (forward), +y up. 1 row = 1 unit = 1 m.
  const STEP = 1 / 120, LANES = 5, R = 0.32, G = 26, BLOCK_H = 0.8, RAMP_H = 0.9, SLOPE = 0.14, VIEW = 64;
  const MODES = {
    classic: { v0: 11, gain: 0.011, vmax: 34 },
    turbo: { v0: 19, gain: 0.014, vmax: 40 },
    daily: { v0: 13, gain: 0.012, vmax: 36 },
  };
  const KEY = s => `milaan.slopeRoll.${s}`;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const app = $('app'), canvas = $('canvas'), ctx = canvas.getContext('2d');

  function load(k, d) { try { const v = localStorage.getItem(KEY(k)); return v == null ? d : JSON.parse(v); } catch { return d; } }

  const best = Object.assign({ classic: 0, turbo: 0 }, load('best', {}));
  const today = (() => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); })();
  let daily = load('daily', null);
  if (!daily || daily.day !== today) daily = { day: today, best: 0 };

  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

  function pushRow(t, b, h0 = 0, h1 = 0) { const i = S.rows.length; S.rows.push({ t, b: b || [0, 0, 0, 0, 0], h0, h1, cx: cxAt(i) }); }

    const i = S.rows.length, d = Math.min(1, i / 2200), v = vAt(i);

  function blocks(d, v) {

      pushRow(full(), b);
      plain(sp);
      free = Math.max(0, Math.min(4, free + ri(3) - 1));

  if (navigator.webdriver) window.__slopeRoll = {
    state: () => ({ mode: S.mode, state: S.state, p: P && { x: P.x, y: P.y, z: P.z, v: P.v, vx: P.vx, air: P.air, dead: P.dead }, best: { ...best, daily: daily.best } }),
    row: i => { const r = row(i); return { t: r.t.slice(), b: r.b.slice(), h0: r.h0, h1: r.h1, cx: r.cx }; },
    cx: z => cxInterp(z),
    input,
    // Advance the fixed-step simulation synchronously (deterministic bot runs).
    tick: (sec, policy) => { const n = Math.round(sec / STEP); for (let i = 0; i < n && S.state === 'play'; i++) { if (policy) policy(); step(STEP); } updateHud(); return S.state; },
    start: mode => reset(mode),
  };
})();
</script>
