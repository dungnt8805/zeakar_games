<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castle Smash</title>
<style>
:root {
  --bg: #1f1830;
  --ink: #3a2216;
  --muted: #8b6a52;
  --accent: #e8484f;
  --accent-dark: #ad2a33;
  --gold: #ffc23a;
  --paper: #fff5e3;
  --paper-edge: #e3c9a3;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: #fff; background: radial-gradient(ellipse at top, #3b2c52, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { height: 100%; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
.frame { position: relative; width: 100%; height: 100%; container-type: size; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px #ffffff18, 0 20px 44px #0009; touch-action: none; background: #8fd0f5; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas:focus-visible { outline: none; }
.frame:has(canvas:focus-visible) { outline: 3px solid #ffc23a99; outline-offset: -3px; }

.hud { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; gap: 8px; padding: 8px; pointer-events: none; }
.hud[hidden] { display: none; }
.grp { display: flex; gap: 6px; flex: none; }
.ib { pointer-events: auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px; background: #fff5e3f0; color: var(--ink); box-shadow: 0 3px 0 var(--paper-edge), 0 6px 14px #0003; }
.ib[hidden] { display: none; }
.ib:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--paper-edge); }
.ib svg { width: 22px; height: 22px; display: block; }
.ib[aria-pressed="true"] { background: var(--gold); }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.pill { display: flex; align-items: center; gap: 10px; padding: 5px 12px; border-radius: 14px; background: #2a170dc2; color: #fff; font-size: 14px; font-weight: 800; white-space: nowrap; box-shadow: 0 4px 12px #0003; }
.pill .lv { color: var(--gold); }
.stat { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.stat svg { width: 16px; height: 16px; }
.score { padding: 2px 10px; border-radius: 10px; background: #2a170d99; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; color: #ffe7b8; }
.tip { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); max-width: min(92%, 420px); padding: 7px 14px; border-radius: 14px; background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 800; line-height: 1.3; text-align: center; box-shadow: 0 4px 0 var(--paper-edge), 0 10px 22px #0004; pointer-events: none; animation: pop .25s ease-out; }
.tip[hidden] { display: none; }
@keyframes pop { from { transform: translate(-50%, -8px); opacity: 0; } }

.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 6cqh 6cqw 4cqh; text-align: center; pointer-events: none; overflow: hidden; }
.overlay[hidden] { display: none; }
.overlay button { pointer-events: auto; }
.shade { background: linear-gradient(#1f1830cc, #1f183066 45%, #1f1830dd); }
.dim { background: #1f183088; pointer-events: auto; }
.title { font-size: min(15cqw, 11cqh); font-weight: 900; letter-spacing: -.03em; line-height: 1; color: #fff; text-shadow: 0 4px 0 var(--ink), 0 10px 26px #0008; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.title span { color: var(--accent); }
.tagline { margin-top: 1.8cqh; max-width: 30em; font-size: max(13px, min(4.2cqw, 2.6cqh)); font-weight: 700; line-height: 1.4; color: #ffeedd; text-shadow: 0 2px 6px #0007; }
.records { margin-top: 1.4cqh; display: inline-flex; padding: 5px 14px; border-radius: 99px; background: #00000040; font-size: 14px; font-weight: 800; color: var(--gold); }
.records:empty { display: none; }
.spacer { flex: 1; min-height: 8px; }
.cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.cta { padding: 14px 30px; border-radius: 99px; background: var(--accent); color: #fff; font-size: max(17px, min(5.4cqw, 3.4cqh)); font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark), 0 10px 24px #0005; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost { padding: 14px 24px; border-radius: 99px; background: var(--paper); color: var(--ink); font-size: max(16px, min(4.8cqw, 3cqh)); font-weight: 900; box-shadow: 0 5px 0 var(--paper-edge), 0 10px 24px #0004; }
.ghost:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--paper-edge); }
.small { margin-top: 1.4cqh; max-width: 34em; font-size: max(11px, min(3.4cqw, 2cqh)); font-weight: 700; line-height: 1.45; color: #f3e6ff; text-shadow: 0 1px 4px #0008; }

.center { justify-content: center; }
.panel { pointer-events: auto; width: min(100%, 320px); max-height: calc(100% - 8px); overflow-y: auto; padding: 18px 18px 16px; border-radius: 24px; background: var(--paper); color: var(--ink); box-shadow: 0 8px 0 var(--paper-edge), 0 20px 50px #0007; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.sub { margin-top: 4px; font-size: 14px; font-weight: 800; color: var(--accent-dark); }
.stars { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.stars svg { width: 46px; height: 46px; }
.stars svg:nth-child(2) { transform: translateY(-8px); }
.scores { display: flex; justify-content: center; gap: 28px; margin-top: 8px; }
.scores small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.scores strong { display: block; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.4; }
.badge { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.again { display: block; width: 100%; margin-top: 14px; padding: 13px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 19px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark); }
.again:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.row2 { display: flex; gap: 8px; margin-top: 10px; }
.link { flex: 1; display: block; width: 100%; padding: 10px; border-radius: 12px; font-size: 15px; font-weight: 800; color: var(--ink); background: #f3e0c4; }

#levels .panel { width: min(100%, 640px); display: flex; flex-direction: column; padding: 14px 14px 12px; }
.lv-head { display: flex; align-items: baseline; justify-content: center; gap: 12px; flex-wrap: wrap; }
.lv-total { font-size: 15px; font-weight: 900; color: #c98a00; }
.lv-list { margin-top: 8px; overflow-y: auto; min-height: 0; flex: 1; padding: 2px 2px 4px; }
.world { margin-top: 6px; text-align: left; font-size: 13px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; margin-top: 5px; }
.level-btn { display: grid; place-items: center; gap: 1px; padding: 5px 0 4px; border-radius: 12px; background: #fff; color: var(--ink); font-size: 16px; font-weight: 900; box-shadow: 0 3px 0 var(--paper-edge); }
.level-btn small { font-size: 10px; letter-spacing: 1px; color: #e0a400; line-height: 1; }
.level-btn small .off { color: #d9c7ad; }
.level-btn:disabled { background: #ecdcc4; color: #b39b80; box-shadow: none; }
.level-btn.cur { outline: 3px solid var(--accent); outline-offset: 1px; }
.link[hidden] { display: none; }
#levels .link { flex: none; margin-top: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@container (min-width: 600px) { .level-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); } }
@media (max-height: 460px) {
  .ib { width: 36px; height: 36px; border-radius: 11px; }
  .ib svg { width: 20px; height: 20px; }
  .tip { top: 52px; font-size: 13px; padding: 5px 12px; }
  .panel { padding: 12px 14px; border-radius: 18px; }
  .panel h2 { font-size: 22px; }
  .stars { margin-top: 4px; }
  .stars svg { width: 34px; height: 34px; }
  .scores strong { font-size: 22px; }
  .stats, .badge { margin-top: 4px; }
  .again { margin-top: 8px; padding: 9px; font-size: 17px; }
  .row2 { margin-top: 6px; }
  .link { padding: 7px; }
  .cta, .ghost { padding: 10px 22px; }
  .small { margin-top: 1cqh; }
}
@media (max-height: 460px) and (min-aspect-ratio: 3/2) {
  .hud { gap: 6px; }
  .info { flex-direction: row; justify-content: center; gap: 6px; align-items: center; }
  #result .panel { width: min(100%, 520px); display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; align-items: center; }
  #result .res-a { grid-column: 1; }
  #result .res-b { grid-column: 2; }
}
@media (max-width: 360px) { .pill { gap: 7px; padding: 4px 9px; font-size: 13px; } .hud { gap: 5px; padding: 6px; } .grp { gap: 5px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="frame" id="frame">
    <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
    <div class="hud" id="hud" hidden>
      <div class="grp">
        <button type="button" class="ib" id="hud-menu" data-i18n-label="menuBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></g></svg></button>
        <button type="button" class="ib" id="hud-restart" data-i18n-label="restartBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 9.5A7 7 0 1 1 5 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M3.5 4.5v6h6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="info">
        <div class="pill">
          <span class="lv" id="hud-level"></span>
          <span class="stat" id="hud-gobs"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5l3 2 1-3 3 1 3-1 1 3 3-2-1 5a6 4.5 0 0 1-12 0z" fill="#7cc74c"/><circle cx="5.8" cy="9" r="1.4" fill="#fff"/><circle cx="10.2" cy="9" r="1.4" fill="#fff"/></svg><b id="hud-gobs-n"></b></span>
          <span class="stat" id="hud-shots"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="#a7a9b4"/><circle cx="6" cy="6" r="2" fill="#d4d6de"/></svg><b id="hud-shots-n"></b></span>
        </div>
        <span class="score" id="hud-score">0</span>
      </div>
      <div class="grp">
        <button type="button" class="ib" id="hud-zoom" aria-pressed="false" data-i18n-label="zoomBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15 15l6 6M7 10h6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <p class="tip" id="tip" hidden></p>

    <div class="overlay shade" id="start">
      <h1 class="title">Castle <span>Smash</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
      <p class="records" id="records"></p>
      <div class="spacer"></div>
      <div class="cta-row">
        <button type="button" class="cta" id="play"></button>
        <button type="button" class="ghost" id="start-levels" data-i18n="levels"></button>
      </div>
      <p class="small" data-i18n="controls"></p>
      <p class="small" data-i18n="keys"></p>
    </div>

    <div class="overlay center dim" id="levels" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="levels-title">
        <div class="lv-head"><h2 id="levels-title" data-i18n="chooseLevel"></h2><span class="lv-total" id="lv-total"></span></div>
        <div class="lv-list" id="level-list"></div>
        <button type="button" class="link" id="levels-back"></button>
      </div>
    </div>

    <div class="overlay center dim" id="result" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="res-title">
        <div class="res-a">
          <h2 id="res-title"></h2>
          <p class="sub" id="res-level"></p>
          <div class="stars" id="res-stars"></div>
          <div class="scores">
            <div><small data-i18n="score"></small><strong id="res-score">0</strong></div>
            <div><small data-i18n="best"></small><strong id="res-best">0</strong></div>
          </div>
        </div>
        <div class="res-b">
          <p class="stats" id="res-stats"></p>
          <p class="badge" id="res-new" data-i18n="newBest" hidden></p>
          <button type="button" class="again" id="res-primary"></button>
          <div class="row2">
            <button type="button" class="link" id="res-replay" data-i18n="replay"></button>
            <button type="button" class="link" id="res-levels" data-i18n="levels"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<script>

  function boxBox(A, B) {
    const cA = Math.cos(A.a), sA = Math.sin(A.a), cB = Math.cos(B.a), sB = Math.sin(B.a);
    const dpx = B.x - A.x, dpy = B.y - A.y;
    const dAx = cA * dpx + sA * dpy, dAy = -sA * dpx + cA * dpy;
    const dBx = cB * dpx + sB * dpy, dBy = -sB * dpx + cB * dpy;
    const a11 = Math.abs(cA * cB + sA * sB), a12 = Math.abs(sA * cB - cA * sB);
    const fAx = Math.abs(dAx) - A.hw - (a11 * B.hw + a12 * B.hh);
    const fAy = Math.abs(dAy) - A.hh - (a12 * B.hw + a11 * B.hh);
    if (fAx > 0 || fAy > 0) return null;
    const fBx = Math.abs(dBx) - (a11 * A.hw + a12 * A.hh) - B.hw;
    const fBy = Math.abs(dBy) - (a12 * A.hw + a11 * A.hh) - B.hh;
    if (fBx > 0 || fBy > 0) return null;
    let axis = 0, sep = fAx, nx = dAx > 0 ? cA : -cA, ny = dAx > 0 ? sA : -sA;
    if (fAy > 0.95 * sep + 0.01 * A.hh) { axis = 1; sep = fAy; nx = dAy > 0 ? -sA : sA; ny = dAy > 0 ? cA : -cA; }
    if (fBx > 0.95 * sep + 0.01 * B.hw) { axis = 2; sep = fBx; nx = dBx > 0 ? cB : -cB; ny = dBx > 0 ? sB : -sB; }
    if (fBy > 0.95 * sep + 0.01 * B.hh) { axis = 3; sep = fBy; nx = dBy > 0 ? -sB : sB; ny = dBy > 0 ? cB : -cB; }
    let fnx = nx, fny = ny, front, snx, sny, negSide, posSide, negEdge, posEdge, inc;
    if (axis === 0) {
      front = A.x * fnx + A.y * fny + A.hw; snx = -sA; sny = cA;
      const side = A.x * snx + A.y * sny; negSide = -side + A.hh; posSide = side + A.hh; negEdge = 3; posEdge = 1;
      inc = incidentEdge(B.hw, B.hh, B.x, B.y, cB, sB, fnx, fny);
    } else if (axis === 1) {
      front = A.x * fnx + A.y * fny + A.hh; snx = cA; sny = sA;
      const side = A.x * snx + A.y * sny; negSide = -side + A.hw; posSide = side + A.hw; negEdge = 2; posEdge = 4;
      inc = incidentEdge(B.hw, B.hh, B.x, B.y, cB, sB, fnx, fny);
    } else if (axis === 2) {
      fnx = -nx; fny = -ny;
      front = B.x * fnx + B.y * fny + B.hw; snx = -sB; sny = cB;
      const side = B.x * snx + B.y * sny; negSide = -side + B.hh; posSide = side + B.hh; negEdge = 3; posEdge = 1;
      inc = incidentEdge(A.hw, A.hh, A.x, A.y, cA, sA, fnx, fny);
    } else {
      fnx = -nx; fny = -ny;
      front = B.x * fnx + B.y * fny + B.hh; snx = cB; sny = sB;
      const side = B.x * snx + B.y * sny; negSide = -side + B.hw; posSide = side + B.hw; negEdge = 2; posEdge = 4;
      inc = incidentEdge(A.hw, A.hh, A.x, A.y, cA, sA, fnx, fny);
    }
    const cp1 = clipSegment(inc, -snx, -sny, negSide, negEdge);
    if (cp1.length < 2) return null;
    const cp2 = clipSegment(cp1, snx, sny, posSide, posEdge);
    if (cp2.length < 2) return null;
    const out = [];
    for (const v of cp2) {
      const s = fnx * v.x + fny * v.y - front;
      if (s > 0) continue;
      const f = axis >= 2 ? v.i2 | v.i1 << 4 | v.o2 << 8 | v.o1 << 12 : v.i1 | v.i2 << 4 | v.o1 << 8 | v.o2 << 12;
      out.push({ x: v.x - s * fnx, y: v.y - s * fny, nx, ny, sep: s, f, pn: 0, pt: 0 });
    }
    return out.length ? out : null;
  }

  // Circle C against box B; the normal points from the box to the circle.
  function boxCircle(B, C) {
    const c = Math.cos(B.a), s = Math.sin(B.a);
    const dx = C.x - B.x, dy = C.y - B.y;
    const lx = c * dx + s * dy, ly = -s * dx + c * dy, r = C.hw;
    let nlx, nly, px, py, sep;
    if (Math.abs(lx) <= B.hw && Math.abs(ly) <= B.hh) {
      const ex = B.hw - Math.abs(lx), ey = B.hh - Math.abs(ly);
      if (ex < ey) { nlx = lx < 0 ? -1 : 1; nly = 0; px = nlx * B.hw; py = ly; sep = -ex - r; }
      else { nlx = 0; nly = ly < 0 ? -1 : 1; px = lx; py = nly * B.hh; sep = -ey - r; }
    } else {
      px = clamp(lx, -B.hw, B.hw); py = clamp(ly, -B.hh, B.hh);
      const ex = lx - px, ey = ly - py, d = Math.hypot(ex, ey);
      if (d > r) return null;
      nlx = ex / d; nly = ey / d; sep = d - r;
    }
    return { x: B.x + c * px - s * py, y: B.y + s * px + c * py, nx: c * nlx - s * nly, ny: s * nlx + c * nly, sep, f: 1, pn: 0, pt: 0 };
  }

  function collide(A, B) {
    if (A.shape === 'box' && B.shape === 'box') return boxBox(A, B);
    if (A.shape === 'box') { const k = boxCircle(A, B); return k && [k]; }
    if (B.shape === 'box') { const k = boxCircle(B, A); if (!k) return null; k.nx = -k.nx; k.ny = -k.ny; return [k]; }
    const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy), sep = d - A.hw - B.hw;
    if (sep > 0) return null;
    const nx = d > 1e-9 ? dx / d : 0, ny = d > 1e-9 ? dy / d : 1;
    return [{ x: A.x + nx * (A.hw + sep / 2), y: A.y + ny * (A.hw + sep / 2), nx, ny, sep, f: 1, pn: 0, pt: 0 }];
  }

  function aabb(b) {
    if (b.shape === 'circle') { b.x0 = b.x - b.hw; b.x1 = b.x + b.hw; b.y0 = b.y - b.hw; b.y1 = b.y + b.hw; return; }
    const c = Math.abs(Math.cos(b.a)), s = Math.abs(Math.sin(b.a));
    const ex = c * b.hw + s * b.hh, ey = s * b.hw + c * b.hh;
    b.x0 = b.x - ex; b.x1 = b.x + ex; b.y0 = b.y - ey; b.y1 = b.y + ey;
  }

  function broadphase(W) {
    const bs = W.bodies, n = bs.length;
    for (const b of bs) aabb(b);
    for (let i = 0; i < n; i++) {
      const A = bs[i];
      for (let j = i + 1; j < n; j++) {
        const B = bs[j];
        if (!A.awake && !B.awake) continue;
        const key = A.id * 65536 + B.id;
        if (A.x0 > B.x1 + 0.01 || B.x0 > A.x1 + 0.01 || A.y0 > B.y1 + 0.01 || B.y0 > A.y1 + 0.01) { W.arbs.delete(key); continue; }
        const cs = collide(A, B);
        let arb = W.arbs.get(key);
        if (!cs) { if (arb) W.arbs.delete(key); continue; }
        if (!arb) { arb = { a: A, b: B, cs: [], mu: Math.sqrt(A.mu * B.mu), e: Math.max(A.e, B.e) }; W.arbs.set(key, arb); }
        for (const c of cs) { const old = arb.cs.find(o => o.f === c.f); if (old) { c.pn = old.pn; c.pt = old.pt; } }
        arb.cs = cs;
      }
    }
  }

  function relNormalVel(A, B, c) {
    const r1x = c.x - A.x, r1y = c.y - A.y, r2x = c.x - B.x, r2y = c.y - B.y;
    const dvx = B.vx - B.w * r2y - A.vx + A.w * r1y, dvy = B.vy + B.w * r2x - A.vy - A.w * r1x;
    return dvx * c.nx + dvy * c.ny;
  }

  function preStep(arb) {
    const A = arb.a, B = arb.b;
    for (const c of arb.cs) {
      const r1x = c.x - A.x, r1y = c.y - A.y, r2x = c.x - B.x, r2y = c.y - B.y;
      c.r1x = r1x; c.r1y = r1y; c.r2x = r2x; c.r2y = r2y;
      const rn1 = r1x * c.nx + r1y * c.ny, rn2 = r2x * c.nx + r2y * c.ny;
      c.mn = 1 / (A.im + B.im + A.ii * (r1x * r1x + r1y * r1y - rn1 * rn1) + B.ii * (r2x * r2x + r2y * r2y - rn2 * rn2));
      const tx = c.ny, ty = -c.nx;
      const rt1 = r1x * tx + r1y * ty, rt2 = r2x * tx + r2y * ty;
      c.mt = 1 / (A.im + B.im + A.ii * (r1x * r1x + r1y * r1y - rt1 * rt1) + B.ii * (r2x * r2x + r2y * r2y - rt2 * rt2));
      c.bias = -BAUMGARTE / STEP * Math.min(0, c.sep + SLOP);
      if (c.vn < -1) c.bias = Math.max(c.bias, -arb.e * c.vn);
      const px = c.pn * c.nx + c.pt * tx, py = c.pn * c.ny + c.pt * ty;
      A.vx -= A.im * px; A.vy -= A.im * py; A.w -= A.ii * (r1x * py - r1y * px);
      B.vx += B.im * px; B.vy += B.im * py; B.w += B.ii * (r2x * py - r2y * px);
    }
  }

  function solve(arb) {
    const A = arb.a, B = arb.b;
    for (const c of arb.cs) {
      const { r1x, r1y, r2x, r2y } = c;
      let dvx = B.vx - B.w * r2y - A.vx + A.w * r1y, dvy = B.vy + B.w * r2x - A.vy - A.w * r1x;
      const vn = dvx * c.nx + dvy * c.ny;
      const pn0 = c.pn;
      c.pn = Math.max(pn0 + c.mn * (-vn + c.bias), 0);
      let d = c.pn - pn0, px = d * c.nx, py = d * c.ny;
      A.vx -= A.im * px; A.vy -= A.im * py; A.w -= A.ii * (r1x * py - r1y * px);
      B.vx += B.im * px; B.vy += B.im * py; B.w += B.ii * (r2x * py - r2y * px);
      dvx = B.vx - B.w * r2y - A.vx + A.w * r1y; dvy = B.vy + B.w * r2x - A.vy - A.w * r1x;
      const tx = c.ny, ty = -c.nx, vt = dvx * tx + dvy * ty;
      const maxPt = arb.mu * c.pn, pt0 = c.pt;
      c.pt = clamp(pt0 - c.mt * vt, -maxPt, maxPt);
      d = c.pt - pt0; px = d * tx; py = d * ty;
      A.vx -= A.im * px; A.vy -= A.im * py; A.w -= A.ii * (r1x * py - r1y * px);
      B.vx += B.im * px; B.vy += B.im * py; B.w += B.ii * (r2x * py - r2y * px);
    }
  }

  function wake(b) { if (b.im && !b.dead) { b.awake = true; b.sleepT = 0; } }

  function kill(W, b, type) {
    if (b.dead) return;
    b.dead = true;
    for (const [k, arb] of W.arbs) if (arb.a === b || arb.b === b) { wake(arb.a === b ? arb.b : arb.a); W.arbs.delete(k); }
    if (type) W.events.push({ type, id: b.id, kind: b.kind, mat: b.mat, gk: b.gk, shape: b.shape, x: b.x, y: b.y, a: b.a, hw: b.hw, hh: b.hh, vx: b.vx, vy: b.vy });
  }

  function hurt(W, b, dmg) {
    if (!b.maxHp || b.dead || dmg <= 0) return;
    b.hp -= dmg;
    b.hurtT = W.t;
    if (dmg > 0.3) W.events.push({ type: 'hit', x: b.x, y: b.y, mat: b.mat, kind: b.kind, power: dmg });
  }

  function stepWorld(W) {
    W.t += STEP;
    broadphase(W);
    // Anything touching an awake body wakes up, so a whole stack wakes (and later sleeps) together.
    for (let changed = true; changed;) {
      changed = false;
      for (const arb of W.arbs.values()) {
        const A = arb.a, B = arb.b;
        if (A.im && B.im && A.awake !== B.awake) { wake(A.awake ? B : A); changed = true; }
      }
    }
    const bs = W.bodies;
    for (const b of bs) if (b.awake) { b.vy += GRAV * STEP; b.contact = false; }
    const active = [], hits = [];
    for (const arb of W.arbs.values()) {
      const A = arb.a, B = arb.b;
      if (!A.awake && !B.awake) continue;
      active.push(arb);
      let impact = 0;
      for (const c of arb.cs) { c.vn = relNormalVel(A, B, c); if (-c.vn > impact) impact = -c.vn; }
      A.contact = B.contact = true;
      if (A.kind === 'shot' && A.hitT < 0) A.hitT = W.t;
      if (B.kind === 'shot' && B.hitT < 0) B.hitT = W.t;
      if (impact > DMG_V) hits.push(arb, impact);
    }
    for (const arb of active) preStep(arb);
    for (let i = 0; i < ITER; i++) for (const arb of active) solve(arb);
    for (const b of bs) {
      if (!b.awake) continue;
      if (b.shape === 'circle' && b.contact) { const d = ROLL * STEP; b.w = Math.abs(b.w) <= d ? 0 : b.w - Math.sign(b.w) * d; }
      b.x += b.vx * STEP; b.y += b.vy * STEP; b.a += b.w * STEP;
    }
    if (W.damage) {
      for (let i = 0; i < hits.length; i += 2) {
        const arb = hits[i], A = arb.a, B = arb.b;
        // Damage grows with the impulse needed to stop the collision (effective mass × closing speed).
        const dmg = (hits[i + 1] - DMG_V) / (A.im + B.im);
        hurt(W, A, dmg * (B.kind === 'shot' ? SHOT_DMG : 1));
        hurt(W, B, dmg * (A.kind === 'shot' ? SHOT_DMG : 1));
      }
    }
    for (const b of bs) {
      if (!b.im || b.dead) continue;
      if (b.maxHp && b.hp <= 0) kill(W, b, b.kind === 'gob' ? 'ko' : 'break');
      else if (b.y < -4 || b.x < -30 || b.x > W.maxX) kill(W, b, b.kind === 'gob' ? 'ko' : 'gone');
    }
    if (bs.some(b => b.dead)) W.bodies = bs.filter(b => !b.dead);
    if (W.sleep) sleepIslands(W);
  }

  function sleepIslands(W) {
    const bs = W.bodies, parent = [];
    bs.forEach((b, i) => {
      b.ix = i; parent.push(i);
      if (!b.awake) return;
      if (b.vx * b.vx + b.vy * b.vy > SLEEP_V * SLEEP_V || b.w * b.w > SLEEP_W * SLEEP_W) b.sleepT = 0;
      else b.sleepT += STEP;
    });
    const find = i => { while (parent[i] !== i) i = parent[i] = parent[parent[i]]; return i; };
    for (const arb of W.arbs.values()) if (arb.a.im && arb.b.im && arb.a.awake && arb.b.awake) parent[find(arb.a.ix)] = find(arb.b.ix);
    const minT = new Map();
    for (const b of bs) if (b.awake) { const r = find(b.ix); minT.set(r, Math.min(minT.has(r) ? minT.get(r) : 1e9, b.sleepT)); }
    for (const b of bs) if (b.awake && minT.get(find(b.ix)) >= SLEEP_T) { b.awake = false; b.vx = b.vy = b.w = 0; }
  }

  function explode(W, x, y) {
    for (const b of W.bodies) {
      if (!b.im || b.dead) continue;
      const dx = b.x - x, dy = b.y - y, d = Math.hypot(dx, dy);
      if (d >= BOMB_R) continue;
      const f = 1 - d / BOMB_R, ux = d > 1e-4 ? dx / d : 0, uy = d > 1e-4 ? dy / d : 1;
      const dv = Math.min(BOMB_J * f * b.im, 14);
      b.vx += ux * dv; b.vy += (uy + 0.35) * dv; b.w += (ux >= 0 ? -1 : 1) * dv * 0.6;
      wake(b);
      if (W.damage) hurt(W, b, BOMB_DMG * f);
    }
    W.events.push({ type: 'boom', x, y });
  }

  // ---------- levels ----------
  // Built in metres; the slingshot stands at x = 0 and the ground top is y = 0.
  function makeBuilder(W) {
    const B = {
      box: (mat, cx, by, w, h) => { addBody(W, 'block', mat, 'box', cx, by + h / 2, w / 2, h / 2); return by + h; },
      post: (mat, cx, by, h = 1.2) => B.box(mat, cx, by, 0.24, h),
      plank: (mat, cx, by, w = 2) => B.box(mat, cx, by, w, 0.24),
      blk: (mat, cx, by, s = 0.6) => B.box(mat, cx, by, s, s),
      stack: (mat, cx, by, n, s = 0.6) => { for (let i = 0; i < n; i++) by = B.blk(mat, cx, by, s); return by; },
      hut: (mat, cx, by, span = 2, h = 1.2, roof = mat) => { B.post(mat, cx - span / 2 + 0.12, by, h); B.post(mat, cx + span / 2 - 0.12, by, h); return B.plank(roof, cx, by + h, span); },
      pyr: (mat, cx, by, n, s = 0.6) => { for (let r = 0; r < n; r++) { for (let i = 0; i < n - r; i++) B.blk(mat, cx + (i - (n - r - 1) / 2) * s, by, s); by += s; } return by; },
      wall: (mat, cx, by, cols, rows, s = 0.6) => { for (let r = 0; r < rows; r++) { for (let i = 0; i < cols; i++) B.blk(mat, cx + (i - (cols - 1) / 2) * s, by, s); by += s; } return by; },
      gob: (cx, by, gk = 'g') => { const g = GOBS[gk], b = addBody(W, 'gob', 'gob', 'box', cx, by + g.s / 2, g.s / 2, g.s / 2); b.gk = gk; b.hp = b.maxHp = g.hp; return by + g.s; },
      ledge: (cx, w, top) => { addBody(W, 'static', 'ledge', 'box', cx, top / 2, w / 2, top / 2); return top; },
    };
    return B;
  }

  const LEVELS = [
    // Green Meadow: wood and glass.
    { shots: 'rrr', par: 1, build: b => { b.hut('wood', 12, 0); b.gob(12, 0); } },
    { shots: 'rrr', par: 2, build: b => { b.hut('wood', 11.5, 0); b.gob(11.5, 0); const y = b.hut('wood', 15, 0); b.gob(15, 0); b.gob(15, y); } },
    { shots: 'rrr', par: 2, build: b => { b.gob(12, b.stack('glass', 12, 0, 3)); const y = b.hut('glass', 15, 0); b.gob(15, 0); b.gob(15, y); } },
    { shots: 'rrr', par: 2, build: b => { const y1 = b.hut('wood', 13, 0, 2.2); b.gob(13, 0); const y2 = b.hut('wood', 13, y1, 2.2); b.gob(13, y1); b.gob(13, y2); } },
    { shots: 'rrrr', par: 2, build: b => { b.wall('wood', 11, 0, 2, 3); const y = b.hut('wood', 14, 0); b.gob(14, 0); b.gob(14, y); b.gob(16.2, 0); } },
    { shots: 'rrrr', par: 2, build: b => { b.gob(13, b.pyr('wood', 13, 0, 4)); const y = b.hut('glass', 16, 0); b.gob(16, 0); b.gob(16, y); } },
    { shots: 'ssr', par: 2, build: b => { b.gob(11, b.stack('glass', 11, 0, 2)); b.gob(13.5, b.stack('glass', 13.5, 0, 3)); b.gob(16, b.stack('glass', 16, 0, 4)); } },
    { shots: 'rrsr', par: 2, build: b => { const y1 = b.hut('wood', 13.5, 0); const y2 = b.hut('wood', 13.5, y1); const y3 = b.hut('wood', 13.5, y2); b.gob(13.5, 0); b.gob(13.5, y2); b.gob(13.1, y3); b.blk('glass', 14, y3, 0.5); } },
    { shots: 'rsr', par: 2, build: b => { const top = b.ledge(16, 3, 2); const y = b.hut('wood', 16, top); b.gob(16, top); b.gob(16, y); b.hut('glass', 12, 0); b.gob(12, 0); } },
    { shots: 'srr', par: 2, build: b => { for (const x of [12, 16]) { const y1 = b.hut('wood', x, 0); b.gob(x, 0); b.hut('wood', x, y1); b.gob(x, y1); } b.plank('wood', 14, 2.88, 6); b.gob(14, 3.12); } },
    { shots: 'rsrs', par: 3, build: b => { b.hut('glass', 11.5, 0); b.gob(11.5, 0); const y1 = b.hut('wood', 14, 0); b.gob(14, 0); b.hut('wood', 14, y1); b.gob(14, y1); b.hut('glass', 16.5, 0); b.gob(16.5, 0); } },
    { shots: 'rrss', par: 3, build: b => { const y1 = b.hut('wood', 14, 0, 3, 1.4); b.gob(14, 0, 'k'); b.hut('wood', 14, y1, 3); b.gob(14, y1); b.gob(11.6, b.stack('wood', 11.6, 0, 2)); b.gob(16.4, b.stack('wood', 16.4, 0, 2)); } },
    // Red Canyon: stone, boulders and helmeted goblins.
    { shots: 'hrr', par: 1, build: b => { b.hut('stone', 12.5, 0); b.gob(12.5, 0); } },
    { shots: 'rhr', par: 2, build: b => { const y1 = b.hut('stone', 12.5, 0); b.gob(12.5, 0); b.hut('wood', 12.5, y1); b.gob(12.5, y1, 'h'); b.gob(15.5, 0, 'h'); } },

    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, gy + 2);
    for (let x = 0; x <= w + 8; x += 8) {

    ctx.lineTo(w, gy + 2); ctx.closePath(); ctx.fill();

  function worldTransform() {

  function drawGround(th) {
    const x0 = cam.x - 1, x1 = cam.x + view.vw + 1, depth = (view.h - view.gy) / view.s + 1;
    ctx.fillStyle = th.soil; ctx.fillRect(x0, -depth, x1 - x0, depth);
    ctx.fillStyle = th.soilDark;

  function drawLedge(b, th) {

    ctx.fillStyle = th.top; rr(b.x - b.hw - 0.05, b.y + b.hh - 0.2, b.hw * 2 + 0.1, 0.24, 0.1); ctx.fill();
  }

  function drawBlock(b) {
    const c = MAT_COL[b.mat], w = b.hw * 2, h = b.hh * 2;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a);
    ctx.fillStyle = c.fill; rr(-b.hw, -b.hh, w, h, 0.06); ctx.fill();
    ctx.lineWidth = 0.05; ctx.strokeStyle = c.edge; ctx.stroke();
    ctx.lineWidth = 0.03; ctx.strokeStyle = c.line;
    ctx.beginPath();
    if (b.mat === 'wood') {
      if (w >= h) for (const k of [-0.3, 0.25]) { ctx.moveTo(-b.hw + 0.1, k * h); ctx.lineTo(b.hw - 0.1, k * h); }
      else for (const k of [-0.3, 0.25]) { ctx.moveTo(k * w, -b.hh + 0.1); ctx.lineTo(k * w, b.hh - 0.1); }
    } else if (b.mat === 'glass') {
      ctx.moveTo(-b.hw + 0.08, -b.hh + h * 0.35); ctx.lineTo(-b.hw + w * 0.35, b.hh - 0.08);

    } else {

    }

        ctx.moveTo(x, y);

      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGoblin(b) {
    const s = b.hw, hurt = M && M.W.t - b.hurtT < 0.7;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a);
    // Pointy ears behind the head.
    ctx.fillStyle = '#5fa83a';
    ctx.beginPath(); ctx.moveTo(-s * 0.7, s * 0.3); ctx.lineTo(-s * 1.45, s * 0.65); ctx.lineTo(-s * 0.75, -s * 0.15); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s * 0.7, s * 0.3); ctx.lineTo(s * 1.45, s * 0.65); ctx.lineTo(s * 0.75, -s * 0.15); ctx.fill();
    ctx.fillStyle = '#7cc74c'; rr(-s, -s, s * 2, s * 2, s * 0.62); ctx.fill();
    ctx.lineWidth = s * 0.09; ctx.strokeStyle = '#3f7a24'; ctx.stroke();
    ctx.fillStyle = '#9bdc6c'; ctx.beginPath(); ctx.ellipse(0, -s * 0.45, s * 0.55, s * 0.35, 0, 0, Math.PI * 2); ctx.fill();

    }

    ctx.beginPath();
    if (hurt) ctx.ellipse(0, -s * 0.42, s * 0.16, s * 0.12, 0, 0, Math.PI * 2);
    else { ctx.moveTo(-s * 0.32, -s * 0.36); ctx.quadraticCurveTo(0, -s * 0.62, s * 0.32, -s * 0.36); }
    ctx.stroke();
    if (!hurt) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(s * 0.06, -s * 0.47); ctx.lineTo(s * 0.18, -s * 0.44); ctx.lineTo(s * 0.13, -s * 0.3); ctx.fill(); }
    if (b.gk === 'h') {
      ctx.fillStyle = '#9aa3b6'; ctx.beginPath(); ctx.ellipse(0, s * 0.62, s * 1.02, s * 0.5, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#c3cad8'; ctx.fillRect(-s * 1.05, s * 0.55, s * 2.1, s * 0.16);
      ctx.fillStyle = '#7b8396'; ctx.fillRect(-s * 0.08, s * 0.7, s * 0.16, s * 0.42);
    } else if (b.gk === 'k') {
      ctx.fillStyle = '#ffc23a'; ctx.beginPath();
      ctx.moveTo(-s * 0.6, s * 0.78); ctx.lineTo(-s * 0.68, s * 1.35); ctx.lineTo(-s * 0.3, s * 1.05); ctx.lineTo(0, s * 1.45); ctx.lineTo(s * 0.3, s * 1.05); ctx.lineTo(s * 0.68, s * 1.35); ctx.lineTo(s * 0.6, s * 0.78); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8484f'; ctx.beginPath(); ctx.arc(0, s * 0.98, s * 0.1, 0, Math.PI * 2); ctx.fill();
    }
    if (b.maxHp && b.hp < b.maxHp) {
      ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = s * 0.1;
      ctx.beginPath(); ctx.moveTo(-s * 0.85, s * 0.05); ctx.lineTo(-s * 0.55, -s * 0.15); ctx.stroke();
    }
    ctx.restore();
  }

  function drawShotBall(type, x, y, r, rot = 0, fuse = false) {
    const c = SHOT_COL[type];
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    const g = ctx.createRadialGradient(-r * 0.35, r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = r * 0.12; ctx.strokeStyle = '#00000040'; ctx.stroke();
    if (type === 'split' || type === 'mini') { ctx.strokeStyle = '#fff3'; ctx.lineWidth = r * 0.18; ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0.3, 2.6); ctx.stroke(); }
    if (type === 'heavy') { ctx.fillStyle = '#9aa1b3'; for (const a of [0.6, 2.7, 4.6]) { ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6, r * 0.12, 0, Math.PI * 2); ctx.fill(); } }
    if (type === 'rock') { ctx.fillStyle = '#ffffff30'; ctx.beginPath(); ctx.arc(-r * 0.3, r * 0.3, r * 0.3, 0, Math.PI * 2); ctx.fill(); }
    if (type === 'bomb') {
      ctx.fillStyle = '#8a8d9c'; ctx.fillRect(-r * 0.22, r * 0.85, r * 0.44, r * 0.3);
      ctx.strokeStyle = '#c9a56b'; ctx.lineWidth = r * 0.12; ctx.beginPath(); ctx.moveTo(0, r * 1.1); ctx.quadraticCurveTo(r * 0.2, r * 1.5, r * 0.5, r * 1.45); ctx.stroke();

  }

  function pouchPos() {
    const p = currentPull();
    return { x: ANCHOR.x + (p ? p.x : 0), y: ANCHOR.y + (p ? p.y : 0) };
  }
  function currentPull() {
    if (!M || M.phase !== 'ready') return null;
    if (drag && drag.pull) return drag.pull;
    if (aim.active) { const v = keyVelocity(); return { x: -v.vx / PULL_K, y: -v.vy / PULL_K }; }
    return null;
  }
  function keyVelocity() { const sp = aim.pow * MAX_V; return { vx: Math.cos(aim.ang) * sp, vy: Math.sin(aim.ang) * sp }; }

  function drawSling(front) {
    const wood = '#8a5a2e', woodDark = '#6a4320';
    const pp = pouchPos(), ready = M.phase === 'ready' && M.queue.length;
    if (!front) {
      ctx.fillStyle = woodDark; rr(-0.14, 0, 0.28, 1.75, 0.08); ctx.fill();
      ctx.strokeStyle = woodDark; ctx.lineWidth = 0.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 1.65); ctx.lineTo(0.32, 2.45); ctx.stroke();
      ctx.strokeStyle = '#5b2a1c'; ctx.lineWidth = 0.1;
      ctx.beginPath(); ctx.moveTo(0.32, 2.4); ctx.lineTo(ready ? pp.x : 0, ready ? pp.y : 2.3); ctx.stroke();
      return;
    }
    if (ready) {
      const type = M.queue[0], r = SHOTS[type].r;
      drawShotBall(type, pp.x, pp.y, r);
      ctx.fillStyle = '#5b2a1c'; rr(pp.x - r - 0.06, pp.y - r * 0.6, 0.16, r * 1.2, 0.06); ctx.fill();

    ctx.beginPath(); ctx.moveTo(-0.3, 2.4); ctx.lineTo(ready ? pp.x - (SHOTS[M.queue[0]].r) : 0, ready ? pp.y : 2.3); ctx.stroke();
    ctx.strokeStyle = wood; ctx.lineWidth = 0.22;

    let x = -0.75;
    for (let i = ready ? 1 : 0; i < M.queue.length; i++) { const r = SHOTS[M.queue[i]].r; drawShotBall(M.queue[i], x - r, r, r); x -= r * 2 + 0.12; }
  }

  function drawPreview() {
    const p = currentPull();
    if (!p || Math.hypot(p.x, p.y) < MIN_PULL) return;
    let x = ANCHOR.x + p.x, y = ANCHOR.y + p.y, vx = -p.x * PULL_K, vy = -p.y * PULL_K;
    ctx.fillStyle = '#ffffff';
    // Only the first part of the arc is shown, so aiming still takes a little judgement.
    for (let i = 1; i <= 66; i++) {
      vy += GRAV * STEP; x += vx * STEP; y += vy * STEP;
      if (i % 6 === 0) { ctx.globalAlpha = 0.9 * (1 - i / 80); ctx.beginPath(); ctx.arc(x, y, 0.1 - i * 0.0009, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (const p of parts) {
      ctx.globalAlpha = clamp(p.life / p.max * 1.4, 0, 1);
      ctx.fillStyle = p.color;
      if (p.kind === 'puff') { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.4 - p.life / p.max * 0.6), 0, Math.PI * 2); ctx.fill(); }
      else if (p.kind === 'star') { drawStarShape(p.x, p.y, p.size, p.rot); }
      else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size, -p.size * 0.45, p.size * 2, p.size * 0.9); ctx.restore(); }
    }
    ctx.globalAlpha = 1;
  }
  function drawStarShape(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5, k = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * k, y + Math.sin(a) * k); }
    ctx.closePath(); ctx.fill();
  }

  function draw() {
    const th = THEMES[M ? worldOf(M.li) : 0];
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    drawSky(th);
    if (!M) return;
    worldTransform();
    drawGround(th);
    for (const b of M.W.bodies) if (b.mat === 'ledge') drawLedge(b, th);
    drawSling(false);
    for (const b of M.W.bodies) {
      if (b.kind === 'block') drawBlock(b);
      else if (b.kind === 'gob') drawGoblin(b);
      else if (b.kind === 'shot') drawShotBall(b.shot, b.x, b.y, b.hw, b.a, b.shot === 'bomb' && !b.used && b.hitT >= 0);
    }
    drawSling(true);
    drawPreview();
    drawParticles();

    const lead = M.phase === 'flight' && M.lead && !M.lead.dead ? M.lead : null;
    if (lead && view.gy - lead.y * view.s < 0) {
      const sx = (lead.x - cam.x) * view.s;
      ctx.fillStyle = '#ffffffdd'; ctx.beginPath(); ctx.moveTo(sx, 66); ctx.lineTo(sx - 8, 80); ctx.lineTo(sx + 8, 80); ctx.fill();
    }

      ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = '#3a2216'; ctx.strokeText(p.text, sx, sy);

  // ---------- effects ----------
  function burst(x, y, color, n, speed, kind = 'chip', size = 0.12) {
    if (reducedMotion) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random() * 0.7);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + speed * 0.3, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, life: 0.6 + Math.random() * 0.5, max: 1.1, color, size: size * (0.6 + Math.random() * 0.8), kind, grav: kind === 'puff' ? -1 : -14 });
    }
  }
  function popup(text, x, y, color, scale = 1) { popups.push({ text, x, y, color, scale, life: 1.2 }); }

  function consumeEvents() {
    if (!M) return;
    for (const ev of M.W.events) {
      if (ev.type === 'break') {
        const c = MAT_COL[ev.mat];
        burst(ev.x, ev.y, ev.mat === 'glass' ? '#d8f4ff' : c.fill, 10, 4);
        burst(ev.x, ev.y, '#ffffffaa', 3, 1, 'puff', 0.25);
        popup(`+${MATS[ev.mat].pts}`, ev.x, ev.y + 0.4, '#fff1c9', 0.75);
      } else if (ev.type === 'ko') {
        burst(ev.x, ev.y, '#ffffffcc', 6, 1.4, 'puff', 0.35);
        burst(ev.x, ev.y, '#ffd23a', 6, 3, 'star', 0.16);
        if (M.phase !== 'won' && M.phase !== 'lost') { popup(`+${GOBS[ev.gk].pts}`, ev.x, ev.y + 0.7, '#ffd23a'); announce(t.ko(Math.max(0, M.gobs))); }
      } else if (ev.type === 'boom') {

        burst(ev.x, ev.y, '#ffb13a', 18, 7, 'chip', 0.14);
        burst(ev.x, ev.y, '#5a5560cc', 8, 2, 'puff', 0.45);
      } else if (ev.type === 'split') {
        burst(ev.x, ev.y, '#ffffffaa', 5, 1.2, 'puff', 0.2);
      } else if (ev.type === 'hit' && ev.power > 1) {

        if (ev.power > 3) shake = Math.max(shake, 0.25);
      }

    updateHud();
  }

  function tickFx(dt) {
    clock += dt;
    for (const p of parts) { p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; if (p.kind === 'puff') { p.vx *= 0.96; p.vy *= 0.96; } }

    for (const p of popups) { p.life -= dt; p.y += dt * 1.1; }
    popups = popups.filter(p => p.life > 0);
    flash = Math.max(0, flash - dt * 3);
    shake = Math.max(0, shake - dt * 2);
  }

  // ---------- game flow ----------
  function hideOverlays() { els.start.hidden = els.levels.hidden = els.result.hidden = true; }

  function startLevel(li) {
    clearTimeout(resultTimer);
    M = startMatch(li);
    progress.last = li; saveProgress();
    parts = []; popups = []; drag = null; aim.active = false; flash = 0; shake = 0;
    hideOverlays();
    screen = 'play'; shownPhase = 'ready';
    els.hud.hidden = false;
    computeCamera();
    cam.manual = null;
    cam.intro = cam.pannable && !reducedMotion ? 1.3 : 0;
    cam.x = cam.intro ? cam.hi : cam.lo;
    updateHud();
    const fresh = [...new Set(M.queue)].find(s => s !== 'rock' && !LEVELS.slice(0, li).some(L => L.shots.includes(s[0])));
    if (fresh) showTip(t.tips[fresh], 5000); else hideTip();
    announce(t.levelStart(li + 1, M.gobs, M.total));
    canvas.focus({ preventScroll: true });
  }

  function updateHud() {
    if (!M) return;
    els.level.textContent = t.level(M.li + 1);
    els.gobsN.textContent = String(Math.max(0, M.gobs));
    els.gobs.setAttribute('aria-label', t.gobs(Math.max(0, M.gobs)));
    const left = M.queue.length;
    els.shotsN.textContent = String(left);
    els.shots.setAttribute('aria-label', t.shotsLeft(left));
    els.score.textContent = numFmt.format(M.score);
  }

  function showTip(text, ms) {
    clearTimeout(tipTimer);
    els.tip.textContent = text; els.tip.hidden = false;
    if (ms) tipTimer = setTimeout(hideTip, ms);
  }
  function hideTip() { clearTimeout(tipTimer); els.tip.hidden = true; }

  function doLaunch(vx, vy, tapAt = -1) {
    if (!M || screen !== 'play' || !launch(M, vx, vy, tapAt)) return false;
    cam.manual = null; cam.intro = 0; aim.active = false;
    const b = M.lead;
    if (b.shot === 'split') showTip(t.tapSplit); else if (b.shot === 'bomb') showTip(t.tapBomb); else hideTip();
    updateHud();
    return true;
  }
  function useAbility() {
    if (!M || !ability(M)) return false;

  }

  // Watches the match phase so the UI reacts once per change.
  function checkPhase() {
    if (!M || M.phase === shownPhase) return;
    shownPhase = M.phase;
    if (M.phase !== 'flight' && !els.tip.hidden && (els.tip.textContent === t.tapSplit || els.tip.textContent === t.tapBomb)) hideTip();
    if (M.phase === 'ready') { cam.manual = null; updateHud(); }
    if (M.phase === 'won' || M.phase === 'lost') {
      const done = M;
      if (M.phase === 'won') recordWin(M);
      clearTimeout(resultTimer);
      resultTimer = setTimeout(() => { if (M === done && screen === 'play') showResult(); }, M.phase === 'won' ? 500 : 300);
    }
  }

  function starSvg(on) {
    return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="${on ? '#ffc23a' : '#e8d6bb'}" stroke="${on ? '#c98a00' : '#d4bf9f'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  }

  // Saved as soon as the level is won, even if the player restarts before the panel appears.
  function recordWin(R) {
    const li = R.li;
    R.isBest = R.score > progress.best[li];
    progress.stars[li] = Math.max(progress.stars[li], R.stars);
    if (R.isBest) progress.best[li] = R.score;
    if (li + 1 < LEVELS.length) progress.last = li + 1;
    saveProgress();
  }

  function showResult() {
    const won = M.phase === 'won', li = M.li, isBest = won && M.isBest;
    els.resTitle.textContent = won ? t.cleared : t.failed;
    els.resLevel.textContent = `${t.level(li + 1)} · ${t.worlds[worldOf(li)]}`;
    els.resStars.innerHTML = [0, 1, 2].map(i => starSvg(won && i < M.stars)).join('');
    els.resStars.setAttribute('aria-label', t.starsA(won ? M.stars : 0));
    els.resStars.setAttribute('role', 'img');
    els.resScore.textContent = numFmt.format(M.score);
    els.resBest.textContent = numFmt.format(Math.max(progress.best[li], won ? M.score : 0));
    const lastLevel = li + 1 >= LEVELS.length;
    els.resStats.textContent = won ? `${t.shotsUsed(M.used, M.total)} · ${t.bonus(numFmt.format(M.bonus))}${lastLevel ? ` ${t.allDone}` : ''}` : t.gobLeft(M.gobs);
    els.resNew.hidden = !(won && isBest && M.score > 0);
    els.resPrimary.textContent = won ? (lastLevel ? t.levels : t.next) : t.retry;
    els.resReplay.hidden = !won;
    els.result.hidden = false;
    screen = 'result';
    hideTip();
    announce(won ? t.winA(M.stars, numFmt.format(M.score)) : t.loseA);
    els.resPrimary.focus({ preventScroll: true });
  }

  function renderLevels() {
    els.lvTotal.textContent = `★ ${totalStars()}/${LEVELS.length * 3}`;
    els.levelList.textContent = '';
    for (let w = 0; w * PER_WORLD < LEVELS.length; w++) {
      const head = document.createElement('p');
      head.className = 'world'; head.textContent = t.worlds[w];
      const grid = document.createElement('div');
      grid.className = 'level-grid';
      for (let i = w * PER_WORLD; i < Math.min(LEVELS.length, (w + 1) * PER_WORLD); i++) {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'level-btn' + (M && M.li === i ? ' cur' : '');
        const open = unlocked(i), st = progress.stars[i];
        btn.disabled = !open;
        btn.innerHTML = `<span>${open ? i + 1 : '🔒'}</span><small>${'★'.repeat(st)}<span class="off">${'★'.repeat(3 - st)}</span></small>`;
        btn.setAttribute('aria-label', open ? t.levelAria(i + 1, st) : t.lockedAria(i + 1));
        btn.addEventListener('click', () => startLevel(i));
        grid.append(btn);
      }
      els.levelList.append(head, grid);
    }
  }

  function openLevels() {
    clearTimeout(resultTimer);
    levelsFrom = screen === 'play' && M && M.phase !== 'won' && M.phase !== 'lost' ? 'play' : 'start';
    renderLevels();
    els.levelsBack.textContent = levelsFrom === 'play' ? t.resume : t.back;
    hideOverlays();
    hideTip();
    els.levels.hidden = false;
    screen = 'levels';
    drag = null;
    const cur = els.levelList.querySelector('.cur') || els.levelList.querySelector('.level-btn:not(:disabled)');
    if (cur) { cur.focus({ preventScroll: true }); cur.scrollIntoView({ block: 'nearest' }); }
  }

  function closeLevels() {
    els.levels.hidden = true;
    if (levelsFrom === 'play' && M) { screen = 'play'; canvas.focus({ preventScroll: true }); }
    else showStart();
  }

  function showStart() {
    hideOverlays();
    screen = 'start';
    els.hud.hidden = true;
    hideTip();
    const stars = totalStars();
    els.records.textContent = stars ? `★ ${stars}/${LEVELS.length * 3}` : '';
    els.play.textContent = stars ? t.cont(firstOpenLevel() + 1) : t.play;
    els.start.hidden = false;
    els.play.focus({ preventScroll: true });
  }
  function firstOpenLevel() {
    const li = progress.last;
    return unlocked(li) ? li : 0;
  }

  function toggleZoom() {
    cam.zoomOut = !cam.zoomOut;
    els.zoom.setAttribute('aria-pressed', String(cam.zoomOut));
    computeCamera();
    cam.x = clamp(cam.x, Math.min(cam.lo, cam.hi), Math.max(cam.lo, cam.hi));
  }

  function resize() {
    const r = els.frame.getBoundingClientRect();
    view.w = Math.max(1, r.width); view.h = Math.max(1, r.height);
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(view.w * view.dpr); canvas.height = Math.round(view.h * view.dpr);
    computeCamera();
    cam.x = clamp(cam.x, Math.min(cam.lo, cam.hi), Math.max(cam.lo, cam.hi));
    draw();
  }

  function frame(now) {
    // Clamp dt so a stalled or hidden tab never fast-forwards the physics.
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!document.hidden) {
      if (M && (screen === 'play' || screen === 'result')) {
        acc += dt;
        while (acc >= STEP) { stepMatch(M); acc -= STEP; }
        consumeEvents();
        checkPhase();
      }
      tickFx(dt);
      updateCamera(dt);
      draw();
    }
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function toWorld(e) {
    const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    return { x: cam.x + px / view.s, y: (view.gy - py) / view.s, px };
  }
  function clampPull(x, y) {
    const d = Math.hypot(x, y);
    return d > MAX_PULL ? { x: x / d * MAX_PULL, y: y / d * MAX_PULL } : { x, y };
  }

  canvas.addEventListener('pointerdown', e => {
    if (!M || screen !== 'play') return;
    e.preventDefault();
    canvas.focus({ preventScroll: true });
    cam.intro = 0;
    if (M.phase === 'flight') { useAbility(); return; }
    const p = toWorld(e);
    const nearPouch = Math.hypot(p.x - ANCHOR.x, p.y - ANCHOR.y) < Math.max(1.1, 40 / view.s);
    canvas.setPointerCapture(e.pointerId);
    if (M.phase === 'ready' && (nearPouch || p.px < view.w * 0.45 || !cam.pannable)) {
      drag = { id: e.pointerId, mode: nearPouch ? 'sling' : 'rel', sx: p.x, sy: p.y, pull: null };
      aim.active = false;
      canvas.style.cursor = 'grabbing';
    } else if (cam.pannable) drag = { id: e.pointerId, mode: 'pan', sx: e.clientX, camX: cam.x };
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (drag.mode === 'pan') {
      cam.manual = clamp(drag.camX - (e.clientX - drag.sx) / view.s, cam.lo, cam.hi);
      cam.x = cam.manual;
      return;
    }
    const p = toWorld(e);
    drag.pull = drag.mode === 'sling' ? clampPull(p.x - ANCHOR.x, p.y - ANCHOR.y) : clampPull(p.x - drag.sx, p.y - drag.sy);
  });
  function endDrag(e, cancel) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    canvas.style.cursor = '';
    if (!cancel && d.pull && Math.hypot(d.pull.x, d.pull.y) >= MIN_PULL) doLaunch(-d.pull.x * PULL_K, -d.pull.y * PULL_K);
  }
  canvas.addEventListener('pointerup', e => endDrag(e, false));
  canvas.addEventListener('pointercancel', e => endDrag(e, true));

  document.addEventListener('keydown', e => {
    if (!M || screen !== 'play') return;
    if ((e.target instanceof Element && e.target.closest('button')) || e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault(); cam.intro = 0;
      aim.ang = clamp(aim.ang + (k === 'ArrowUp' ? 0.02 : -0.02), -0.7, 1.45); aim.active = M.phase === 'ready';
    } else if (k === 'ArrowLeft' || k === 'ArrowRight') {
      e.preventDefault(); cam.intro = 0;
      aim.pow = clamp(aim.pow + (k === 'ArrowRight' ? 0.015 : -0.015), 0.2, 1); aim.active = M.phase === 'ready';
    } else if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      if (e.repeat) return;
      if (M.phase === 'flight') useAbility();
      else if (M.phase === 'ready') { const v = keyVelocity(); doLaunch(v.vx, v.vy); }
    } else if (k === 'r' || k === 'R') startLevel(M.li);
    else if (k === 'z' || k === 'Z') toggleZoom();
  });
  window.addEventListener('blur', () => { drag = null; });

  els.play.addEventListener('click', () => startLevel(firstOpenLevel()));
  els.startLevels.addEventListener('click', openLevels);
  els.levelsBack.addEventListener('click', closeLevels);
  els.menu.addEventListener('click', openLevels);
  els.restart.addEventListener('click', () => M && startLevel(M.li));
  els.zoom.addEventListener('click', toggleZoom);
  els.resPrimary.addEventListener('click', () => {
    if (M.phase !== 'won') startLevel(M.li);
    else if (M.li + 1 < LEVELS.length) startLevel(M.li + 1);
    else openLevels();
  });
  els.resReplay.addEventListener('click', () => startLevel(M.li));
  els.resLevels.addEventListener('click', openLevels);

  if (navigator.webdriver) window.__castleSmash = {
    state: () => M && { level: M.li, phase: M.phase, gobs: M.gobs, gobTotal: M.gobTotal, queue: M.queue.slice(), used: M.used, total: M.total, par: M.par, score: M.score, stars: M.stars, screen, bodies: M.W.bodies.length, awake: M.W.bodies.filter(b => b.awake).length, cam: { x: cam.x, s: view.s, pannable: cam.pannable, zoomOut: cam.zoomOut } },
    screen: () => screen,
    levelCount: LEVELS.length,
    levelInfo: li => ({ shots: LEVELS[li].shots, par: LEVELS[li].par }),
    start: li => startLevel(li),
    fire: (vx, vy, tapAt = -1) => doLaunch(vx, vy, tapAt),
    tap: () => useAbility(),
    advance: secs => { for (let i = 0, n = Math.round(secs / STEP); i < n && M; i++) stepMatch(M); consumeEvents(); checkPhase(); return M && M.phase; },
    sim: (li, shots) => { const R = simulate(li, shots); return { phase: R.phase, gobs: R.gobs, used: R.used, stars: R.stars, score: R.score }; },
    stability: (li, secs) => stabilityCheck(li, secs),
    toScreen: (x, y) => { const r = canvas.getBoundingClientRect(); return { x: r.left + (x - cam.x) * view.s, y: r.top + view.gy - y * view.s }; },
    anchor: { ...ANCHOR }, pullK: PULL_K, maxPull: MAX_PULL,
    progress: () => JSON.parse(JSON.stringify(progress)),
  };

  new ResizeObserver(resize).observe(els.frame);
  resize();
  showStart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
