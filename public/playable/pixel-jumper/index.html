<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Jumper</title>
<style>
:root {
  --bg: #15122b;
  --bg-2: #241e47;
  --ink: #1d1830;
  --muted: #6f6688;
  --paper: #fff7e8;
  --paper-2: #ffe8bf;
  --line: #e9d6b0;
  --gold: #ffcf3f;
  --gold-dark: #c98f00;
  --pink: #ff5e7e;
  --pink-dark: #c93556;
  --mint: #39d6a0;
  --mint-dark: #1f9a70;
  --gem: #4fe3ff;
  --hud: #15122bd0;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--paper); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { position: fixed; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.view { position: relative; min-height: 0; overflow: hidden; background: #000; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; }
#game:focus-visible { outline: none; }
.view:has(#game:focus-visible) { box-shadow: inset 0 0 0 3px #ffcf3f88; }

/* ---------- HUD ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); pointer-events: none; }
.app.menu .hud, .app.menu .boss { visibility: hidden; }
.chip { display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border-radius: 9px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff1f, 0 3px 0 #0006; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.lvl { color: var(--gold); }
.gems i { width: 13px; height: 13px; transform: rotate(45deg); border-radius: 2px; background: #ffffff26; box-shadow: inset 0 0 0 2px #ffffff40; }
.gems i.on { background: var(--gem); box-shadow: inset -3px -3px 0 #1fa3d6, 0 0 8px #4fe3ffaa; }
.coin-ico { width: 13px; height: 15px; border-radius: 50%; background: var(--gold); box-shadow: inset -3px 0 0 var(--gold-dark), 0 0 0 2px #7a5600; }
.hud .grow { flex: 1; }
.hbtn { pointer-events: auto; width: 40px; height: 34px; border-radius: 9px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff1f, 0 3px 0 #0006; display: grid; place-items: center; }
.hbtn svg { width: 14px; height: 14px; fill: #fff; }
.hbtn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px #ffffff1f; }
.boss { position: absolute; left: 50%; top: calc(max(6px, env(safe-area-inset-top)) + 42px); transform: translateX(-50%); width: min(60%, 260px); text-align: center; pointer-events: none; }
.boss[hidden] { display: none; }
.boss small { display: block; font-size: 12px; font-weight: 900; letter-spacing: .04em; text-shadow: 0 2px 0 #000a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.boss .bar { height: 10px; margin-top: 3px; border-radius: 3px; background: #15122bcc; box-shadow: inset 0 0 0 2px #ffffff40; overflow: hidden; }
.boss .bar i { display: block; height: 100%; width: calc(var(--hp, 1) * 100%); background: linear-gradient(#ff8aa1, var(--pink)); transition: width .3s; }
.banner { position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%); max-width: calc(100% - 24px); padding: 6px 16px; border-radius: 10px; background: #15122bcc; box-shadow: inset 0 0 0 2px #ffffff30; font-size: clamp(16px, 4.6vmin, 30px); font-weight: 900; text-align: center; letter-spacing: .02em; text-shadow: 0 3px 0 #000; pointer-events: none; opacity: 0; }
.banner.show { animation: banner 1.8s ease-out both; }
.banner.gold { color: var(--gold); }
.banner.gem { color: var(--gem); }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.9); } 12%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%); } }

/* ---------- touch pad ---------- */
.pad { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); background: linear-gradient(#211b3f, #15122b); box-shadow: inset 0 3px 0 #2f2858; touch-action: none; }
.grp { display: flex; gap: 10px; touch-action: none; }
.key { width: clamp(64px, 21vw, 96px); height: clamp(58px, 12vh, 84px); border-radius: 16px; background: #2f2858; box-shadow: inset 0 0 0 2px #ffffff22, 0 5px 0 #0b0918; color: #fff; display: grid; place-items: center; touch-action: none; }
.key svg { width: 46%; height: 46%; fill: currentColor; pointer-events: none; }
.key.jump { width: clamp(84px, 28vw, 128px); background: var(--pink); box-shadow: inset 0 0 0 2px #ffffff40, 0 5px 0 var(--pink-dark); }
.key.on { transform: translateY(4px); box-shadow: inset 0 0 0 2px #ffffff40, 0 1px 0 #0b0918; filter: brightness(1.15); }

/* ---------- panels ---------- */
.overlay { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #0d0b1c88; }
.overlay[hidden] { display: none; }
.overlay.soft { background: linear-gradient(#0d0b1c22, #0d0b1caa); }
.panel { width: min(100%, 400px); max-height: calc(100% - 16px); overflow: auto; overscroll-behavior: contain; padding: 20px 18px 18px; border-radius: 14px; background: var(--paper); color: var(--ink); text-align: center; border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink), 0 22px 50px #0008; animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.logo { font-size: clamp(34px, 10.5vw, 52px); font-weight: 900; line-height: .95; letter-spacing: .01em; color: var(--pink); text-transform: uppercase; text-shadow: 3px 3px 0 var(--ink); }
.logo span { display: block; color: var(--gold); }
.mascot { display: block; width: 72px; height: 72px; margin: 0 auto 8px; image-rendering: pixelated; }
.tag { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.45; color: var(--muted); }
.total { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 12px; border-radius: 8px; background: var(--ink); color: var(--gem); font-size: 14px; font-weight: 900; }
.total:empty { display: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { flex: 1 1 130px; min-height: 46px; padding: 10px 12px; border-radius: 10px; background: var(--paper-2); color: var(--ink); font-size: 16px; font-weight: 900; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn.primary { background: var(--pink); color: #fff; text-shadow: 0 2px 0 #0004; }
.btn.go { background: var(--mint); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; margin-top: 12px; padding: 4px 12px; border-radius: 8px; background: #efe1c5; color: var(--ink); font-size: 13px; font-weight: 800; }
.toggle b { padding: 1px 8px; border-radius: 6px; background: #d6c49f; font-size: 12px; }
.toggle[aria-pressed="true"] b { background: var(--mint); color: var(--ink); }
.panel h2 { font-size: 26px; font-weight: 900; line-height: 1.15; letter-spacing: -.01em; }
.panel .sub { margin-top: 4px; font-size: 14px; font-weight: 800; color: var(--muted); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.tab { min-width: 0; min-height: 44px; padding: 4px 4px; border-radius: 9px; border: 3px solid var(--ink); background: #efe1c5; font-size: 12px; font-weight: 900; line-height: 1.1; }
.tab small { display: block; font-size: 10px; font-weight: 800; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--gold); box-shadow: 0 3px 0 var(--ink); }
.tab:disabled { opacity: .5; }
.wname { margin-top: 10px; font-size: 15px; font-weight: 900; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.lv { position: relative; min-width: 0; min-height: 64px; padding: 6px 2px; border-radius: 10px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; align-content: center; gap: 3px; }
.lv b { font-size: 19px; font-weight: 900; line-height: 1; white-space: nowrap; }
.lv b span { font-size: 13px; vertical-align: 2px; }
.lv .gm { display: flex; gap: 5px; }
.lv .gm i { width: 9px; height: 9px; transform: rotate(45deg); background: #e4d6b8; }
.lv .gm i.on { background: var(--gem); box-shadow: inset -2px -2px 0 #1fa3d6; }
.lv.boss-lv { background: #ffe2e8; }
.lv.done { background: #e4fff3; }
.lv:disabled { background: #e8dcc4; box-shadow: 0 2px 0 var(--ink); color: #9c8f78; }
.lv .lock { font-size: 15px; line-height: 1; }
.lv:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.stars { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
.stars i { width: 26px; height: 26px; transform: rotate(45deg); border-radius: 3px; background: #e4d6b8; box-shadow: inset -4px -4px 0 #cdbd9a; }
.stars i.on { background: var(--gem); box-shadow: inset -4px -4px 0 #1fa3d6, 0 0 12px #4fe3ff; animation: pop .4s ease-out both; }
.stars i:nth-child(2) { animation-delay: .15s; }
.stars i:nth-child(3) { animation-delay: .3s; }
@keyframes pop { 0% { transform: rotate(45deg) scale(.2); } 70% { transform: rotate(45deg) scale(1.25); } }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; }
.stats div { min-width: 0; padding: 6px 2px; border-radius: 8px; background: #f3e6cb; }
.stats small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats strong { display: block; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge { display: inline-block; margin-top: 10px; padding: 3px 12px; border-radius: 8px; background: var(--gold); font-size: 13px; font-weight: 900; }
.badge[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Landscape: the level fills the whole stage; HUD and thumb buttons float on top of it. */
@media (min-aspect-ratio: 1/1) {
  .app { grid-template-rows: minmax(0, 1fr); }
  .pad { position: absolute; left: 0; right: 0; bottom: 0; background: none; box-shadow: none; pointer-events: none; padding-top: 0; }
  .grp { pointer-events: auto; }
  .key { width: clamp(58px, 15vh, 92px); height: clamp(52px, 14vh, 84px); background: #15122b8c; box-shadow: inset 0 0 0 2px #ffffff55, 0 4px 0 #0006; }
  .key.jump { width: clamp(70px, 19vh, 110px); background: #ff5e7ea6; }
  html:not(.touch) .pad { display: none; }
  .levels-panel { width: min(100%, 620px); }
  .levels-panel .grid { grid-template-columns: repeat(6, 1fr); }
  .clear-panel { width: min(100%, 480px); }
}
@media (min-aspect-ratio: 1/1) and (pointer: coarse) { html .pad { display: flex; } }
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .panel { padding: 12px 16px 12px; }
  .title-panel { width: min(100%, 640px); display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; align-items: center; text-align: start; }
  .title-panel .head { grid-row: span 3; text-align: center; }
  .title-panel .actions { margin-top: 8px; }
  .title-panel .help, .title-panel .toggle { margin-top: 6px; }
  .mascot { width: 48px; height: 48px; margin-bottom: 4px; }
  .logo { font-size: 38px; }
  .tag { font-size: 13px; }
  .panel h2 { font-size: 21px; }
  .tabs { margin-top: 8px; }
  .tab { min-height: 36px; }
  .wname { margin-top: 6px; }
  .lv { min-height: 52px; }
  .stars { margin-top: 6px; }
  .stars i { width: 20px; height: 20px; }
  .stats { margin-top: 8px; }
  .btn { min-height: 40px; padding: 6px 10px; }
  .actions { margin-top: 10px; }
  .chip { height: 30px; font-size: 14px; }
  .hbtn { height: 30px; }
}
@media (max-width: 360px) {
  .chip { padding: 0 7px; font-size: 14px; gap: 4px; }
  .hud { gap: 4px; }
  .hbtn { width: 34px; }
  .panel { padding: 16px 12px 14px; }
  .stats strong { font-size: 14px; }
}
@media (max-height: 560px) and (max-aspect-ratio: 1/1) {
  .mascot { width: 48px; height: 48px; margin-bottom: 4px; }
  .logo { font-size: 32px; }
  .tag { margin-top: 6px; font-size: 13px; }
  .key { height: 54px; }
  .pad { padding-top: 7px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .banner.show { opacity: 1; } }
</style>
</head>
<body>
<main class="app menu" id="app">
  <div class="view" id="view">
    <canvas id="game" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
    <div class="hud" id="hud">
      <button type="button" class="hbtn" id="pause-btn" data-i18n-label="pause"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="3" height="8"/><rect x="6" y="1" width="3" height="8"/></svg></button>
      <div class="chip lvl" id="hud-level">1-1</div>
      <div class="chip gems" id="hud-gems" role="img"><i></i><i></i><i></i></div>
      <span class="grow"></span>
      <div class="chip" id="hud-coins-chip"><span class="coin-ico" aria-hidden="true"></span><span id="hud-coins">0</span></div>
      <div class="chip" id="hud-time">0:00.0</div>
    </div>
    <div class="boss" id="hud-boss" hidden><small id="boss-name"></small><div class="bar"><i id="boss-hp"></i></div></div>
    <div class="banner" id="banner" aria-hidden="true"></div>

    <div class="overlay soft" id="title-ov">
      <div class="panel title-panel" role="dialog" aria-modal="true" aria-labelledby="game-title">
        <div class="head">
          <canvas class="mascot" id="mascot" width="16" height="16" aria-hidden="true"></canvas>
          <h1 class="logo" id="game-title">Pixel<span>Jumper</span></h1>
        </div>
        <p class="tag" data-i18n="tagline"></p>
        <div class="actions">
          <button type="button" class="btn primary" id="play-btn"></button>
          <button type="button" class="btn" id="levels-btn" data-i18n="levels"></button>
        </div>
        <div>
          <p class="total" id="total-gems"></p>
          <button type="button" class="toggle" id="sound-1" aria-pressed="true"><span data-i18n="sound"></span><b></b></button>
          <p class="help" id="help"></p>
        </div>
      </div>
    </div>

    <div class="overlay" id="levels-ov" hidden>
      <div class="panel levels-panel" role="dialog" aria-modal="true" aria-labelledby="levels-title">
        <h2 id="levels-title" data-i18n="levels"></h2>
        <div class="tabs" role="tablist" id="tabs"></div>
        <p class="wname" id="wname"></p>
        <div class="grid" id="grid"></div>
        <div class="actions"><button type="button" class="btn" id="levels-back" data-i18n="back"></button></div>
      </div>
    </div>

    <div class="overlay" id="pause-ov" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <h2 id="pause-title" data-i18n="paused"></h2>
        <p class="sub" id="pause-sub"></p>
        <div class="actions">
          <button type="button" class="btn primary" id="resume-btn" data-i18n="resume"></button>
          <button type="button" class="btn" id="restart-btn" data-i18n="restart"></button>
          <button type="button" class="btn" id="pause-levels" data-i18n="levels"></button>
        </div>
        <button type="button" class="toggle" id="sound-2" aria-pressed="true"><span data-i18n="sound"></span><b></b></button>
      </div>
    </div>

    <div class="overlay" id="clear-ov" hidden>
      <div class="panel clear-panel" role="dialog" aria-modal="true" aria-labelledby="clear-title">
        <h2 id="clear-title"></h2>
        <p class="sub" id="clear-sub"></p>
        <div class="stars" id="clear-stars" role="img"><i></i><i></i><i></i></div>
        <div class="stats">
          <div><small data-i18n="time"></small><strong id="st-time"></strong></div>
          <div><small data-i18n="best"></small><strong id="st-best"></strong></div>
          <div><small data-i18n="coins"></small><strong id="st-coins"></strong></div>
          <div><small data-i18n="retries"></small><strong id="st-retries"></strong></div>
        </div>
        <p class="badge" id="clear-badge" hidden></p>
        <div class="actions">
          <button type="button" class="btn primary" id="next-btn" data-i18n="next"></button>
          <button type="button" class="btn" id="replay-btn" data-i18n="replay"></button>
          <button type="button" class="btn" id="clear-levels" data-i18n="levels"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="pad" id="pad">
    <div class="grp">
      <button type="button" class="key" data-key="l" data-i18n-label="left"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M7 1 2 5l5 4z"/></svg></button>
      <button type="button" class="key" data-key="r" data-i18n-label="right"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l5 4-5 4z"/></svg></button>
    </div>
    <div class="grp">
      <button type="button" class="key jump" data-key="j" data-i18n-label="jump"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 1 6h2.5v3h3V6H9z"/></svg></button>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<script>
(() => {
  const I18N = {
    en: {
      tagline: 'Run, jump and stomp through 24 levels in four worlds. Grab all 3 gems for 3 stars!', play: 'Play', cont: id => `Continue ${id}`, levels: 'Levels', back: 'Back',

      left: 'Run left', right: 'Run right', jump: 'Jump', canvas: 'Pixel Jumper game view', total: n => `◆ ${n} / 72 gems`, gemsAria: n => `${n} of 3 gems`,
      levelAria: (id, name, n, locked) => (locked ? `Level ${id}, ${name}, locked` : `Level ${id}, ${name}, ${n} of 3 gems`), allGems: 'All 3 gems found!',
      start: (id, name) => `Level ${id}: ${name}. Go!`, cleared: (g, time) => `Level clear! ${g} of 3 gems in ${time}.`,
    },

      worlds: ['Đồng cỏ', 'Hang pha lê', 'Đỉnh băng', 'Lâu đài lửa'], bosses: ['Vua Slime', 'Dơi khổng lồ', 'Chạy trốn tuyết lở', 'Vua Lửa'], world: n => `Thế giới ${n}`, locked: 'Chưa mở',

      // Fireballs leap out of the lava on a fixed beat and drop back in.
      const c = (time + e.ph) % 2.4;
      if (c >= 1.2) { epos.on = false; epos.x = e.x0; epos.y = e.y0 + 40; }
      else { const k = c / 1.2; epos.x = e.x0; epos.y = e.y0 - 4 - 92 * 4 * k * (1 - k); epos.face = k < 0.5 ? -1 : 1; }
    }
    return epos;
  }

  function makeBoss(s) {
    const L = s.L, k = L.boss;
    const b = { kind: k.kind, x: k.x, y: k.y, vx: 0, vy: 0, hp: 3, inv: 0, timer: 1.5, st: 0, ground: true, face: -1, dead: false, dt: 0, ph: 0, sx: 0, sy: 0, tx: 0, k: 0, acts: 0 };
    // Arena = the open floor around the boss, between walls.
    const ty = Math.floor((k.y - 1) / TILE);
    let floor = ty;
    while (floor < L.H && !solid(s, Math.floor(k.x / TILE), floor)) floor++;
    let a = Math.floor(k.x / TILE), z = a;
    while (a > 0 && !solid(s, a - 1, floor - 1)) a--;
    while (z < L.W - 1 && !solid(s, z + 1, floor - 1)) z++;
    b.minX = a * TILE + 20; b.maxX = (z + 1) * TILE - 20; b.floor = floor * TILE;
    b.hx = (b.minX + b.maxX) / 2; b.ax = (b.maxX - b.minX) / 2 - 8; b.hy = k.y;
    return b;
  }

  function die(s) {
    const p = s.p;
    if (p.dead || s.done) return;
    p.dead = true; p.dt = 0; p.vy = -260;
    s.deaths++;
    emit(s, 'die', p.x, p.y);
  }

  function stepSim(s, inp) {
    const L = s.L, p = s.p, dt = STEP;
    const t0 = s.t;
    s.t += dt;
    if (s.done) { s.doneT += dt; return; }
    if (p.dead) {
      p.dt += dt;
      p.vy += G_FALL * dt; p.y += p.vy * dt;
      if (p.dt >= RESPAWN) { spawn(s); emit(s, 'respawn', s.p.x, s.p.y); }
      return;
    }
    if (!s.open) s.openT = s.t;
    stepCrumbles(s);

    // Ride moving platforms.
    const a = { x: 0, y: 0 }, b = { x: 0, y: 0 };
    if (p.ride >= 0) {
      const pl = L.plats[p.ride];
      platPos(pl, t0, a); platPos(pl, s.t, b);
      moveX(s, p, PW, PH, b.x - a.x);
      p.y += b.y - a.y;
    }

    // Input: buffered jump, coyote time, variable height.
    const dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
    const pressed = inp.j && !p.pj;
    p.pj = inp.j;
    p.buf = pressed ? BUFFER : Math.max(0, p.buf - dt);
    p.coy = p.ground ? COYOTE : Math.max(0, p.coy - dt);
    if (p.buf > 0 && p.coy > 0) {
      p.vy = -JUMP_V; p.buf = 0; p.coy = 0; p.ground = false; p.ride = -1; p.spring = false;
      emit(s, 'jump', p.x, p.y);
    }
    const ice = p.ground && p.ice;
    if (dir) {
      let acc = p.ground ? (ice ? ICE_ACC : ACC) : AIR_ACC;
      if (p.ground && !ice && p.vx * dir < 0) acc *= 1.7;
      p.vx = Math.max(-RUN, Math.min(RUN, p.vx + dir * acc * dt));
      p.face = dir;
    } else {
      const f = (p.ground ? (ice ? ICE_FRICTION : FRICTION) : AIR_DRAG) * dt;
      p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
    }
    const g = p.vy < 0 ? (p.spring || inp.j ? G_HOLD : G_CUT) : G_FALL;
    p.vy = Math.min(MAX_FALL, p.vy + g * dt);
    if (p.vy >= 0) p.spring = false;

    const prevY = p.y, vyBefore = p.vy, wasGround = p.ground;
    p.ground = false; p.ride = -1;
    if (moveX(s, p, PW, PH, p.vx * dt)) p.vx = 0;
    const hit = moveY(s, p, PW, PH, p.vy * dt, true);
    if (hit === 1) { p.ground = true; p.vy = 0; }
    else if (hit === -1) { p.vy = 0; p.spring = false; }

    // Land on moving platforms (one-way, from above).
    if (vyBefore >= 0) {
      for (let k = 0; k < L.plats.length; k++) {
        const pl = L.plats[k];
        platPos(pl, t0, a); platPos(pl, s.t, b);
        if (p.x + PW <= b.x || p.x - PW >= b.x + 48) continue;
        if (prevY <= Math.max(a.y, b.y) + 1 && p.y >= b.y - 0.01 && (!p.ground || p.y >= b.y)) {
          p.y = b.y; p.vy = 0; p.ground = true; p.ride = k;
          break;
        }
      }
    }
    if (p.ground && !wasGround && vyBefore > 200) emit(s, 'land', p.x, p.y);
    p.air = p.ground ? 0 : p.air + dt;

    // What is under the feet: ice makes it slippery, crumbling blocks start to shake.
    p.ice = false;
    if (p.ground && p.ride < 0) {
      const ty = Math.floor(p.y / TILE) ;
      for (let tx = Math.floor((p.x - PW + 0.01) / TILE); tx <= Math.floor((p.x + PW - 0.01) / TILE); tx++) {
        const v = tileAt(L, tx, ty);
        if (v === T_ICE) p.ice = true;
        if (v === T_CRUMBLE) { const k = L.crumbleAt[ty * L.W + tx]; if (s.crumble[k] < 0) { s.crumble[k] = s.t; emit(s, 'crack', tx * TILE + 8, ty * TILE); } }
      }
    }

    // Springs.
    if (vyBefore > 0) {
      for (let k = 0; k < L.springs.length; k++) {
        const sp = L.springs[k];
        if (Math.abs(p.x - sp.x) < PW + 6 && prevY <= sp.y + 1 && p.y >= sp.y) {
          p.y = sp.y; p.vy = -SPRING_V; p.spring = true; p.ground = false; p.ride = -1; p.coy = 0;
          s.springT[k] = s.t;
          emit(s, 'spring', sp.x, sp.y);
          break;
        }
      }
    }

    collectThings(s);
    if (!p.dead) touchEnemies(s, inp, prevY, vyBefore);
    if (s.boss && !p.dead) stepBoss(s, inp, prevY, vyBefore);
    if (s.shots.length) stepShots(s);
    if (!p.dead) touchHazards(s);
    if (s.wall && !p.dead) {
      const w = s.wall;
      if (w.delay > 0) w.delay -= dt;
      else w.x = Math.max(w.x + AVALANCHE_SPEED * dt, p.x - 15 * TILE);
      if (p.x - PW < w.x + 6) die(s);
    }
    if (p.y > L.H * TILE + 24) die(s);
  }

  function stepCrumbles(s) {
    const L = s.L, p = s.p;
    for (let k = 0; k < s.crumble.length; k++) {
      const t0 = s.crumble[k];
      if (t0 < 0 || s.t - t0 < CRUMBLE_BACK) continue;
      const c = L.crumbles[k];
      // Only come back when the player is not standing inside the block.
      const inside = p.x + PW > c.x * TILE && p.x - PW < (c.x + 1) * TILE && p.y > c.y * TILE && p.y - PH < (c.y + 1) * TILE;
      if (!inside) s.crumble[k] = -1;
    }
  }

  function collectThings(s) {
    const L = s.L, p = s.p;
    for (let k = 0; k < L.items.length; k++) {
      if (s.taken[k]) continue;
      const it = L.items[k];
      if (Math.abs(p.x - it.x) > PW + 6 || p.y < it.y - 6 || p.y - PH > it.y + 6) continue;
      s.taken[k] = 1;
      if (it.gem >= 0) { s.gems++; s.gemMask |= 1 << it.gem; emit(s, 'gem', it.x, it.y, s.gems); }
      else { s.coins++; emit(s, 'coin', it.x, it.y); }
    }
    for (let k = 0; k < L.checks.length; k++) {
      const c = L.checks[k];
      if (k <= s.cp && s.cpMask & (1 << k)) continue;
      if (Math.abs(p.x - c.x) < PW + 6 && p.y > c.y - 32 && p.y - PH < c.y) {
        if (k > s.cp) s.cp = k;
        if (!(s.cpMask & (1 << k))) { s.cpMask |= 1 << k; emit(s, 'check', c.x, c.y); }
      }
    }
    const goal = L.goal;
    if (s.open && goal && Math.abs(p.x - goal.x) < PW + 4 && p.y > goal.y - 56 && p.y - PH < goal.y) {
      s.done = true; s.doneT = 0;
      p.vx = 0;
      emit(s, 'goal', goal.x, goal.y);
    }
  }

  function bounceOff(s, inp, top) {
    const p = s.p;
    p.y = top; p.vy = -(inp.j ? STOMP_HOLD_V : STOMP_V); p.spring = false; p.ground = false; p.ride = -1;
  }

  function touchEnemies(s, inp, prevY, vyBefore) {
    const L = s.L, p = s.p;
    for (let k = 0; k < L.enemies.length; k++) {
      if (s.kills[k] >= 0) continue;
      const e = L.enemies[k], d = ENEMY[e.k], q = enemyPos(e, s.t);
      if (!q.on) continue;
      if (p.x + PW - 1 <= q.x - d.hw || p.x - PW + 1 >= q.x + d.hw || p.y <= q.y - d.h || p.y - PH + 1 >= q.y) continue;
      if (d.stomp && vyBefore > 0 && prevY <= q.y - d.h + 6) {
        s.kills[k] = s.t;
        bounceOff(s, inp, q.y - d.h);
        emit(s, 'stomp', q.x, q.y - d.h / 2);
      } else { die(s); return; }
    }
  }

  function touchHazards(s) {
    const L = s.L, p = s.p;
    const l = Math.floor((p.x - PW + 2) / TILE), r = Math.floor((p.x + PW - 2) / TILE);
    const top = Math.floor((p.y - PH + 2) / TILE), bot = Math.floor((p.y - 0.5) / TILE);
    for (let ty = top; ty <= bot; ty++) for (let tx = l; tx <= r; tx++) {
      const v = tileAt(L, tx, ty);
      if (v === T_SPIKE && p.y > ty * TILE + 9) return die(s);
      if (v === T_SPIKE_DOWN && p.y - PH < ty * TILE + 7) return die(s);
      if (v === T_LIQUID && p.y > ty * TILE + 6) return die(s);
    }
  }

  function stepBoss(s, inp, prevY, vyBefore) {
    const b = s.boss, p = s.p, dt = STEP, D = BOSS[b.kind];
    if (b.dead) { b.dt += dt; return; }
    if (b.inv > 0) b.inv -= dt;
    const angry = 3 - b.hp;
    if (b.kind === 'slime') {
      if (b.ground) {
        b.timer -= dt;
        if (b.timer <= 0) {
          b.face = p.x < b.x ? -1 : 1;
          b.vx = b.face * (55 + angry * 30); b.vy = -(360 + angry * 40); b.ground = false;
        }
      } else airBoss(s, b, D, 1500);
    } else if (b.kind === 'bat') {
      if (b.st === 0) {
        b.ph += dt * (1 + angry * 0.3);
        b.x = b.hx + b.ax * Math.sin(b.ph); b.y = b.hy + 6 * Math.sin(b.ph * 2.3);
        b.face = Math.cos(b.ph) >= 0 ? 1 : -1;
        if ((b.timer -= dt) <= 0) { b.st = 1; b.k = 0; b.sx = b.x; b.sy = b.y; b.tx = Math.max(b.minX, Math.min(b.maxX, p.x)); b.face = b.tx >= b.x ? 1 : -1; }
      } else if (b.st === 1) {
        b.k = Math.min(1, b.k + dt / (0.8 - angry * 0.1));
        const e = b.k * b.k * (3 - 2 * b.k);
        b.x = b.sx + (b.tx - b.sx) * e; b.y = b.sy + (b.floor - 18 - b.sy) * e;
        if (b.k >= 1) { b.st = 2; b.timer = 0.9 - angry * 0.15; }
      } else if (b.st === 2) {
        if ((b.timer -= dt) <= 0) { b.st = 3; b.k = 0; b.sy = b.y; }
      } else {
        b.k = Math.min(1, b.k + dt / 0.8);
        const ph = Math.asin(Math.max(-1, Math.min(1, (b.x - b.hx) / b.ax)));
        const e = b.k * b.k * (3 - 2 * b.k);
        b.y = b.sy + (b.hy + 6 * Math.sin(ph * 2.3) - b.sy) * e;
        if (b.k >= 1) { b.st = 0; b.ph = ph; b.timer = 2.2 - angry * 0.5; }
      }
    } else {
      if (b.ground) {
        if (Math.abs(p.x - b.x) > 6) b.face = p.x < b.x ? -1 : 1;
        b.vx = b.face * (32 + angry * 16);
        if ((b.timer -= dt) <= 0) {
          b.acts++;
          b.timer = 1.7 - angry * 0.35;
          if (b.acts % 3 === 0) { b.vy = -400; b.vx = b.face * 80; b.ground = false; }
          else { s.shots.push({ x: b.x + b.face * 10, y: b.y - 22, vx: b.face * (90 + angry * 20), vy: -250, life: 4, n: 0 }); emit(s, 'shoot', b.x, b.y - 22); }
        }
        if (b.ground) {
          if (moveX(s, b, D.hw, D.h, b.vx * dt)) b.face = -b.face;
          // Walk off a ledge? Fall like anyone else.
          if (!solid(s, Math.floor(b.x / TILE), Math.floor(b.y / TILE))) b.ground = false;
        }
      } else airBoss(s, b, D, 1400);
    }
    // Stomp or get hurt.
    if (b.inv > 0) return;
    if (p.x + PW - 1 <= b.x - D.hw || p.x - PW + 1 >= b.x + D.hw || p.y <= b.y - D.h || p.y - PH + 1 >= b.y) return;
    if (vyBefore > 0 && prevY <= b.y - D.h + 8) {
      b.hp--;
      b.inv = 1.1;
      bounceOff(s, inp, b.y - D.h);
      p.vy = -(inp.j ? 520 : 400);
      if (b.kind === 'king') { b.vy = -260; b.vx = (p.x < b.x ? 1 : -1) * 90; b.ground = false; }
      if (b.kind === 'bat' && b.st !== 3) { b.st = 3; b.k = 0; b.sy = b.y; }
      if (b.hp <= 0) { b.dead = true; b.dt = 0; s.open = true; s.shots = []; emit(s, 'bossDown', b.x, b.y - D.h / 2); }
      else emit(s, 'bossHit', b.x, b.y - D.h, b.hp);
    } else die(s);
  }

  function airBoss(s, b, D, gravity) {
    const dt = STEP;
    b.vy = Math.min(MAX_FALL, b.vy + gravity * dt);
    if (moveX(s, b, D.hw, D.h, b.vx * dt)) b.vx = -b.vx;
    const hit = moveY(s, b, D.hw, D.h, b.vy * dt, false);
    if (hit === 1) {
      b.ground = true; b.vy = 0; b.vx = 0;
      b.timer = b.kind === 'slime' ? 1.1 - (3 - b.hp) * 0.25 : Math.max(b.timer, 0.5);
      emit(s, 'thud', b.x, b.y);
    } else if (hit === -1) b.vy = 0;
    if (b.y > s.L.H * TILE + 40) { b.x = s.L.boss.x; b.y = s.L.boss.y - 40; b.vy = 0; }
  }

  function stepShots(s) {
    const p = s.p, dt = STEP;
    for (const o of s.shots) {
      o.life -= dt;
      o.vy = Math.min(MAX_FALL, o.vy + 900 * dt);
      o.x += o.vx * dt;
      if (solid(s, Math.floor(o.x / TILE), Math.floor(o.y / TILE))) o.life = 0;
      o.y += o.vy * dt;
      if (o.vy > 0 && solid(s, Math.floor(o.x / TILE), Math.floor((o.y + 4) / TILE))) {

      if (!p.dead && Math.abs(o.x - p.x) < PW + 3 && o.y + 4 > p.y - PH && o.y - 4 < p.y) die(s);
    }
    s.shots = s.shots.filter(o => o.life > 0);
  }

    if (e.pointerType === 'touch') document.documentElement.classList.add('touch');
    sound.unlock();
    try { key.closest('.grp').setPointerCapture(e.pointerId); } catch {}
    padKeys.set(e.pointerId, key.dataset.key);
    syncPad();
  });
  els.pad.addEventListener('pointermove', e => {
    if (!padKeys.has(e.pointerId)) return;
    const k = keyUnder(e.clientX, e.clientY);
    if (k && k !== padKeys.get(e.pointerId)) { padKeys.set(e.pointerId, k); syncPad(); }
  });
  const endPad = e => { if (padKeys.delete(e.pointerId)) syncPad(); };
  els.pad.addEventListener('pointerup', endPad);
  els.pad.addEventListener('pointercancel', endPad);
  els.pad.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('touchstart', () => document.documentElement.classList.add('touch'), { passive: true, once: true });

  function pollGamepad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let pad = null;
    for (const g of pads) if (g && g.connected) { pad = g; break; }
    if (!pad) { gp.l = gp.r = gp.j = false; return; }
    const ax = pad.axes[0] || 0, btn = n => !!(pad.buttons[n] && pad.buttons[n].pressed);
    gp.l = ax < -0.4 || btn(14); gp.r = ax > 0.4 || btn(15); gp.j = btn(0) || btn(1);
    const start = btn(9);
    if (start && !gp.start) { if (mode === 'play') pauseGame(); else if (mode === 'paused') resumeGame(); }
    gp.start = start;
    // On menus the A button presses the focused button.
    const a = btn(0);
    if (a && !gp.a && mode !== 'play' && document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.click();
    gp.a = a;
  }

  // ---------- menus ----------
  function refreshTitle() {
    const next = progress.clear.every(Boolean) ? 0 : Math.min(progress.last, LEVELS.length - 1);
    const target = unlocked(next) ? next : 0;
    els.play.textContent = progress.clear.some(Boolean) || target > 0 ? t.cont(levelId(target).replace('-', '\u2011')) : t.play;
    els.play.dataset.level = String(target);
    els.total.textContent = progress.clear.some(Boolean) ? t.total(totalGems()) : '';
    const touch = document.documentElement.classList.contains('touch') || matchMedia('(pointer: coarse)').matches;
    els.help.textContent = touch ? t.touch : t.keys;
    syncSound();
  }
  function openTitle() {
    mode = 'menu';
    loadLevel(Math.min(progress.last, LEVELS.length - 1));
    refreshTitle();
    showOverlay(els.title);
    els.play.focus({ preventScroll: true });
  }
  function openLevels(from) {
    levelsFrom = from;
    if (mode === 'play' || mode === 'paused') mode = 'paused';
    tabWorld = LEVELS[Math.min(levelIdx, LEVELS.length - 1)].w;
    buildLevels();
    showOverlay(els.levels);
    const first = els.grid.querySelector('.lv:not(:disabled)');
    (first || $('levels-back')).focus({ preventScroll: true });
  }
  function buildLevels() {
    els.tabs.textContent = '';
    for (let w = 0; w < 4; w++) {
      const open = unlocked(w * 6);
      const gems = progress.stars.slice(w * 6, w * 6 + 6).reduce((a, n) => a + n, 0);
      const tab = document.createElement('button');
      tab.type = 'button'; tab.className = 'tab'; tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', String(w === tabWorld));
      tab.disabled = !open;
      tab.innerHTML = `${open ? '' : '🔒 '}${w + 1}<small>◆ ${gems}/18</small>`;
      tab.setAttribute('aria-label', `${t.world(w + 1)}: ${t.worlds[w]}${open ? '' : `, ${t.locked}`}`);
      tab.addEventListener('click', () => { tabWorld = w; buildLevels(); els.tabs.children[w].focus({ preventScroll: true }); });
      els.tabs.append(tab);
    }
    els.wname.textContent = `${t.world(tabWorld + 1)} · ${t.worlds[tabWorld]}`;
    els.grid.textContent = '';
    for (let k = 0; k < 6; k++) {
      const i = tabWorld * 6 + k, open = unlocked(i);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `lv${k === 5 ? ' boss-lv' : ''}${progress.clear[i] ? ' done' : ''}`;
      btn.disabled = !open;
      btn.setAttribute('aria-label', t.levelAria(levelId(i), levelName(i), progress.stars[i], !open));
      btn.innerHTML = open ? `<b>${k === 5 ? '<span aria-hidden="true">👑</span> ' : ''}${levelId(i)}</b><span class="gm">${[0, 1, 2].map(n => `<i class="${n < progress.stars[i] ? 'on' : ''}"></i>`).join('')}</span>` : `<b>${levelId(i)}</b><span class="lock" aria-hidden="true">🔒</span>`;
      btn.dataset.level = String(i);
      btn.addEventListener('click', () => startLevel(i));
      els.grid.append(btn);
    }
  }
  function syncSound() {
    for (const id of ['sound-1', 'sound-2']) { const el = $(id); el.setAttribute('aria-pressed', String(sound.on)); el.lastElementChild.textContent = sound.on ? t.on : t.off; }
  }

  els.play.addEventListener('click', () => startLevel(Number(els.play.dataset.level) || 0));
  $('levels-btn').addEventListener('click', () => openLevels('title'));
  $('levels-back').addEventListener('click', () => {
    if (levelsFrom === 'pause') { showOverlay(els.pause); $('resume-btn').focus({ preventScroll: true }); }
    else if (levelsFrom === 'clear') { showOverlay(els.clear); (els.next.hidden ? $('replay-btn') : els.next).focus({ preventScroll: true }); }
    else openTitle();
  });
  $('pause-btn').addEventListener('click', pauseGame);
  $('resume-btn').addEventListener('click', resumeGame);
  $('restart-btn').addEventListener('click', () => startLevel(levelIdx));
  $('pause-levels').addEventListener('click', () => openLevels('pause'));
  $('replay-btn').addEventListener('click', () => startLevel(levelIdx));
  $('clear-levels').addEventListener('click', () => openLevels('clear'));
  els.next.addEventListener('click', () => startLevel(Math.min(levelIdx + 1, LEVELS.length - 1)));
  for (const id of ['sound-1', 'sound-2']) $(id).addEventListener('click', () => { sound.toggle(); syncSound(); });

  // ---------- main loop ----------
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    pollGamepad();
    if (!document.hidden && sim) {
      if (mode === 'play') {
        acc += dt;
        let steps = 0;
        while (acc >= STEP && steps < 8) {
          stepSim(sim, readInput());
          handleEvents();
          acc -= STEP; steps++;
        }
        if (sim.done && !clearAt) clearAt = now;
        if (clearAt && now - clearAt > 1300) { clearAt = 0; finishLevel(); }
        updateHud();
      }
      updateCamera(dt);
      render(dt);
    }
    requestAnimationFrame(frame);
  }

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__pixelJumper = {
    state: () => sim && { mode, level: levelIdx, t: sim.t, x: sim.p.x, y: sim.p.y, vx: sim.p.vx, vy: sim.p.vy, ground: sim.p.ground, dead: sim.p.dead, deaths: sim.deaths, coins: sim.coins, gems: sim.gems, done: sim.done, boss: sim.boss && { hp: sim.boss.hp, dead: sim.boss.dead }, overlay: overlays.find(o => !o.hidden)?.id || null, progress: JSON.parse(JSON.stringify(progress)) },
    count: LEVELS.length,
    sim: {
      create: i => createSim(getLevel(i)), clone: cloneSim, step: (s, l, r, j) => stepSim(s, { l, r, j }),
      info: i => { const L = getLevel(i); return { W: L.W, H: L.H, tiles: Array.from(L.tiles), items: L.items, goal: L.goal, start: L.start, boss: !!L.boss, auto: L.auto, enemies: L.enemies.length, platList: L.plats.map(p => ({ x: p.x, y: p.y, v: p.v, range: p.range })), springs: L.springs }; },
    },
    // Feeds a recorded plan ([dir, jump] per `every` physics steps) into the live game loop instead of the keyboard.
    autoplay: (plan, every) => { autoplay = { plan, every, i: 0 }; },
    toScreen: (wx, wy) => { const r = canvas.getBoundingClientRect(), k = view.ps / Math.min(window.devicePixelRatio || 1, 2); return { x: r.left + (wx - cam.x) * k, y: r.top + (wy - cam.y) * k }; },
  };

  openTitle();
  new ResizeObserver(resize).observe($('view'));
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
