<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beach Volley</title>
<style>
:root {
  --bg: #0b2a3f;
  --panel: #10364f;
  --text: #f6fbff;
  --muted: #a6c4d6;
  --p1: #ff7a45;
  --p2: #36c2a8;
  --accent: #ffd447;
  --accent-dark: #c99a10;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(120% 80% at 50% 0%, #1b5878, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; width: 100%; max-width: 980px; margin: 0 auto; }
.side { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 14px; background: #ffffff0f; box-shadow: inset 0 0 0 1px #ffffff1a; }
.side.right { flex-direction: row-reverse; text-align: right; }
.side small { flex: 1; min-width: 0; font-size: 12px; font-weight: 800; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side strong { font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.side.left strong { color: var(--p1); }
.side.right strong { color: var(--p2); }
.serve-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); visibility: hidden; flex: none; }
.serve-dot.on { visibility: visible; }
.mid { display: flex; align-items: center; gap: 6px; }
.target { min-width: 52px; text-align: center; font-size: 13px; font-weight: 900; padding: 6px 8px; border-radius: 12px; background: #0008; color: var(--muted); }
.icon-btn { width: 36px; height: 34px; display: grid; place-items: center; border-radius: 12px; background: #ffffff18; font-size: 17px; font-weight: 900; }
.stage { flex: 1 1 auto; min-height: 0; position: relative; display: grid; place-items: center; }
canvas { display: block; border-radius: 16px; touch-action: none; box-shadow: 0 0 0 1px #ffffff22, 0 16px 40px #0008; }
.pad { position: absolute; inset: auto 0 0 0; display: flex; justify-content: space-between; padding: 8px; pointer-events: none; opacity: .85; }
.pad[hidden] { display: none; }
.cluster { display: flex; gap: 8px; pointer-events: auto; touch-action: none; }
.pb { width: clamp(46px, 10vmin, 72px); height: clamp(46px, 10vmin, 72px); border-radius: 50%; display: grid; place-items: center; font-size: clamp(18px, 4.5vmin, 26px); font-weight: 900; background: #00000040; box-shadow: inset 0 0 0 2px #ffffff55; touch-action: none; }
.pb.on { background: #ffffff55; }
.pb.jump { background: #ffd44766; }
.pb.p2c { box-shadow: inset 0 0 0 2px #36c2a8; }
.pb.p1c { box-shadow: inset 0 0 0 2px #ff7a45; }
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 8px; background: #04131fb8; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 440px); max-height: calc(100% - 8px); overflow-y: auto; background: var(--panel); border-radius: 24px; padding: 18px; text-align: center; box-shadow: 0 0 0 1px #ffffff22, 0 20px 50px #000a; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.panel h2 { font-size: 30px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.panel h2 span { color: var(--accent); }
.logo { font-size: 34px; line-height: 1; margin-bottom: 4px; }
.text { margin-top: 6px; font-size: 14px; color: #cfe0ec; line-height: 1.45; }
.field { margin-top: 12px; text-align: left; }
.field[hidden] { display: none; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #ffffff12; }
.seg button { flex: 1; min-width: 0; padding: 9px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: #1f6a8c; color: var(--text); box-shadow: inset 0 0 0 1px #ffd447aa; }
.hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.45; }
.final { margin-top: 6px; font-size: 42px; font-weight: 900; font-variant-numeric: tabular-nums; }
.final b:first-child { color: var(--p1); }
.final b:last-child { color: var(--p2); }
.cta { margin-top: 14px; width: 100%; padding: 14px; border-radius: 18px; background: var(--accent); color: #3a2a00; font-size: 19px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost-btn { margin-top: 10px; width: 100%; padding: 11px; border-radius: 16px; background: #ffffff14; font-size: 16px; font-weight: 800; box-shadow: inset 0 0 0 1px #ffffff1c; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 520px) {
  .panel { padding: 12px 14px; border-radius: 18px; }
  .panel h2 { font-size: 22px; }
  .logo, .hint { display: none; }
  .text { font-size: 13px; margin-top: 2px; }
  .field { margin-top: 7px; }
  .seg button { padding: 6px 4px; }
  .cta { margin-top: 10px; padding: 10px; font-size: 17px; }
  .ghost-btn { margin-top: 6px; padding: 8px; }
  .final { font-size: 32px; }
}
@media (max-height: 520px) and (min-aspect-ratio: 4/3) {
  #setup .panel { width: min(100%, 680px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; text-align: left; }
  #setup .panel > .head, #setup .cta { grid-column: 1 / -1; text-align: center; }
}
@media (max-height: 420px) {
  .app { gap: 4px; }
  .side strong { font-size: 20px; }
  .icon-btn { height: 30px; }
}
@media (max-aspect-ratio: 1/1) {
  .stage { flex: 0 1 auto; width: 100%; aspect-ratio: 16 / 9; margin: auto 0; }
  .pad { position: static; padding: 14px 4px; opacity: 1; }
  .pad-wrap { margin-bottom: auto; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="side left"><span class="serve-dot" id="dot0"></span><small id="name0">P1</small><strong id="score0">0</strong></div>
    <div class="mid">
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Sound">🔊</button>
      <span class="target" id="target">7</span>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">II</button>
    </div>
    <div class="side right"><span class="serve-dot" id="dot1"></span><small id="name1">CPU</small><strong id="score1">0</strong></div>
  </header>
  <div class="stage" id="stage"><canvas id="cv" width="960" height="540" aria-label="Beach Volley court" role="img"></canvas></div>
  <div class="pad-wrap"><div class="pad" id="pad" hidden></div></div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</div>

<div class="overlay" id="setup">
  <div class="panel">
    <div class="head">
      <div class="logo" aria-hidden="true">🏐</div>
      <h2>Beach <span>Volley</span></h2>
      <p class="text" data-i18n="intro">Keep the ball off your sand and land it on theirs!</p>
    </div>
    <div class="field"><div class="label" data-i18n="modeL">Mode</div>
      <div class="seg" id="modeSeg"><button type="button" data-v="ai" data-i18n="vsAi">vs CPU</button><button type="button" data-v="pvp" data-i18n="pvp">2 Players</button></div></div>
    <div class="field" id="diffField"><div class="label" data-i18n="diffL">Difficulty</div>
      <div class="seg" id="diffSeg"><button type="button" data-v="0" data-i18n="easy">Easy</button><button type="button" data-v="1" data-i18n="normal">Normal</button><button type="button" data-v="2" data-i18n="hard">Hard</button></div></div>
    <div class="field"><div class="label" data-i18n="pointsL">Points to win</div>
      <div class="seg" id="ptsSeg"><button type="button" data-v="7">7</button><button type="button" data-v="11">11</button></div></div>
    <div class="field"><div class="label" data-i18n="touchL">3-touch rule</div>
      <div class="seg" id="touchSeg"><button type="button" data-v="0" data-i18n="off">Off</button><button type="button" data-v="1" data-i18n="on">On</button></div></div>
    <p class="hint" id="hint"></p>
    <button class="cta" id="playBtn" type="button" data-i18n="play">Play</button>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="panel">
    <h2 data-i18n="paused">Paused</h2>
    <button class="cta" id="resumeBtn" type="button" data-i18n="resume">Resume</button>
    <button class="ghost-btn" id="restartBtn" type="button" data-i18n="restart">Restart</button>
    <button class="ghost-btn" id="menuBtn" type="button" data-i18n="menu">Menu</button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel">
    <div class="logo" aria-hidden="true" id="overIcon">🏆</div>
    <h2 id="overTitle">You win!</h2>
    <div class="final"><b id="f0">0</b> – <b id="f1">0</b></div>
    <p class="text" id="overText"></p>
    <button class="cta" id="againBtn" type="button" data-i18n="again">Play again</button>
    <button class="ghost-btn" id="overMenuBtn" type="button" data-i18n="menu">Menu</button>
  </div>
</div>

  // ---------- AI ----------

  // ---------- physics ----------

    const s = Math.min(r.width / W, r.height / H);
    cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
    const dpr = Math.min(2, devicePixelRatio || 1);
    const pw = Math.round(W * s * dpr), ph = Math.round(H * s * dpr);
    if (cv.width !== pw) { cv.width = pw; cv.height = ph; }
    ctx.setTransform(pw / W, 0, 0, ph / H, 0, 0);
  }
  addEventListener('resize', fit);
  new ResizeObserver(fit).observe($('stage'));

  // ---------- menus ----------
  function bindSeg(id, key, num) {
    const seg = $(id);
    const sync = () => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(String(settings[key]) === b.dataset.v)));
    seg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings[key] = num ? +b.dataset.v : b.dataset.v; sync(); syncSetup(); beep(520, 0.05, 'triangle', 0.03); });
    sync();
  }
  function syncSetup() {
    $('diffField').hidden = settings.mode !== 'ai';
    $('hint').textContent = settings.mode === 'ai' ? t.hintAi : t.hintPvp;
  }
  bindSeg('modeSeg', 'mode', false); bindSeg('diffSeg', 'diff', true); bindSeg('ptsSeg', 'pts', true); bindSeg('touchSeg', 'touch', true);
  syncSetup();

  function pauseGame() { if (game.state !== 'play' && game.state !== 'point') return; game.prev = game.state; game.state = 'paused'; keys.clear(); $('pause').hidden = false; $('resumeBtn').focus(); announce(t.paused); }
  function resumeGame() { game.state = game.prev || 'play'; $('pause').hidden = true; lastT = performance.now(); }
  function toMenu() { game.state = 'menu'; ['pause', 'over'].forEach(id => $(id).hidden = true); $('setup').hidden = false; $('pad').hidden = true; $('playBtn').focus(); }
  $('playBtn').onclick = startMatch;
  $('againBtn').onclick = startMatch;
  $('restartBtn').onclick = startMatch;
  $('resumeBtn').onclick = resumeGame;
  $('menuBtn').onclick = toMenu;
  $('overMenuBtn').onclick = toMenu;
  $('pauseBtn').onclick = () => game.state === 'paused' ? resumeGame() : pauseGame();

  // demo scene behind the menu
  game.players = [makePlayer(0), makePlayer(1)];
  game.ball = { x: 300, y: 220, vx: 0, vy: 0, spin: 0, live: false, wait: 1e9, trail: [] };
  updateHud();
  fit();
  requestAnimationFrame(frame);
  $('playBtn').focus();
})();
</script>
</body>
</html>
