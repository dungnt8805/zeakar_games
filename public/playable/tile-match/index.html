<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tile Match</title>
<style>
:root {
  --ink: #4b3a57;
  --muted: #8a7690;
  --bg: #fdeff4;
  --pink: #ff8fb3;
  --pink-dark: #e06c94;
  --mint: #7fd3b0;
  --mint-dark: #4fb08b;
  --cream: #fffaf6;
  --edge: #f0c9d8;
  --slot: 48px;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(#f8dbe6 2px, transparent 2.5px), linear-gradient(#fdeff4, #f3e8fb);
  background-size: 26px 26px, 100% 100%;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button, a { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink-dark); outline-offset: 3px; }
.tile:focus-visible { outline: none; }
.tile:focus-visible .face { outline: 3px solid var(--pink-dark); outline-offset: -1px; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 7px; }
h1 { flex: 1; min-width: 0; font-size: clamp(21px, 6.4vw, 30px); font-weight: 900; letter-spacing: -.03em; white-space: nowrap; line-height: 1; }
h1 span { color: var(--pink-dark); }
.stat { min-width: 56px; padding: 5px 8px; border-radius: 14px; background: #ffffffc4; text-align: center; box-shadow: 0 3px 0 var(--edge); }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 14px; background: var(--cream); font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 var(--edge); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.icon-btn svg { width: 20px; height: 20px; vertical-align: middle; }
svg { fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }

.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
.board { position: relative; --t: 48px; }
.tile { position: absolute; padding: calc(var(--t) * .035); transform-origin: 0 0; touch-action: manipulation; }
.face {
  display: grid; place-items: center; width: 100%; height: 100%;
  padding-bottom: calc(var(--t) * .07);
  border-radius: 24%;
  border: 1.5px solid #fff;
  background: linear-gradient(170deg, #fffdfb 20%, var(--tint) 115%);
  box-shadow: inset 0 calc(var(--t) * -.075) 0 color-mix(in srgb, var(--tint) 62%, #b98aa0), 0 2px 5px #8a5a7033;
  font-size: calc(var(--t) * .54); line-height: 1;
  transition: filter .2s, transform .15s;
}
.tile.covered { cursor: default; }
.tile.covered .face { filter: brightness(.78) saturate(.6); }
@media (hover: hover) { .tile.free:hover .face { transform: translateY(-4%); } }
.tile.deal .face { animation: deal .35s calc(var(--d) * 6ms) both cubic-bezier(.3, 1.4, .5, 1); }
@keyframes deal { from { transform: translateY(-35%) scale(.5); opacity: 0; } }
.tile.nope .face { animation: nope .3s; }
@keyframes nope { 25% { transform: translateX(-6%); } 75% { transform: translateX(6%); } }
.tile.spin .face { animation: spin .42s ease-in-out; }
@keyframes spin { 50% { transform: scale(.25) rotate(160deg); } }
.tile.clearing .face { animation: vanish .26s ease-in forwards; }
@keyframes vanish { 40% { transform: scale(1.2); } to { transform: scale(0); opacity: 0; } }
.in-tray, .in-hold { transition: left .2s ease; }

.hold, .tray { position: relative; z-index: 10; }
.hold { width: calc(var(--slot) * 3); height: var(--slot); margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); --t: var(--slot); }
.hold i { margin: 4px; border-radius: 24%; border: 2px dashed #e9bfd0; }
.tray { width: min(100%, 460px); margin: 0 auto; padding: 6px; border-radius: 20px; background: #fff6f9; box-shadow: inset 0 3px 0 #f6dbe5, 0 4px 0 var(--edge); transition: box-shadow .2s, background .2s; }
.tray.danger { background: #ffeef0; box-shadow: inset 0 3px 0 #ffd0d6, 0 4px 0 #ff9fa9; }
.slots { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); --t: var(--slot); }
.slots i { aspect-ratio: 1; margin: 3px; border-radius: 24%; background: #f9e4ec; }

.boosters { display: flex; gap: 10px; justify-content: center; }
.booster { position: relative; flex: 1; max-width: 140px; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border-radius: 16px; background: var(--cream); box-shadow: 0 4px 0 var(--edge); font-size: 13px; font-weight: 800; }
.booster svg { flex: 0 0 auto; width: 20px; height: 20px; color: var(--pink-dark); }
.booster span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.booster:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.booster:disabled { opacity: .45; cursor: default; }
.count { position: absolute; top: -7px; right: -5px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 99px; background: var(--mint-dark); color: #fff; font-size: 12px; font-weight: 900; line-height: 22px; text-align: center; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #4b3a5755; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; background: var(--cream); border-radius: 28px; padding: 26px 22px; text-align: center; box-shadow: 0 20px 50px #4b3a5755; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: var(--pink-dark); }
.panel .emoji { font-size: 44px; line-height: 1.2; }
.panel .text { margin-top: 8px; font-size: 15px; color: var(--muted); line-height: 1.45; }
.picker { margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 14px; }
.picker strong { min-width: 120px; font-size: 20px; }
.picker button { width: 42px; height: 42px; border-radius: 50%; background: #fbe3ec; font-size: 22px; font-weight: 900; }
.picker button:disabled { opacity: .35; cursor: default; }
.stars { margin-top: 6px; font-size: 26px; letter-spacing: 4px; color: #ead7df; min-height: 1.3em; }
.stars b { color: #ffc34d; text-shadow: 0 2px 0 #e9a325; display: inline-block; animation: star .4s calc(var(--i) * 150ms + .2s) both cubic-bezier(.3, 1.6, .5, 1); }
@keyframes star { from { transform: scale(0) rotate(-40deg); } }
.result { margin-top: 6px; font-size: 16px; font-weight: 700; }
.cta { margin-top: 20px; width: 100%; padding: 15px; border-radius: 18px; background: var(--pink); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--pink-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--pink-dark); }
.ghost { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; background: #e7f6ef; color: #2f7a5e; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #bfe6d5; }
.ghost[hidden] { display: none; }
.store-link { display: inline-block; margin-top: 16px; font-size: 14px; font-weight: 700; color: var(--pink-dark); text-underline-offset: 4px; line-height: 1.4; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 560px) { .app { gap: 6px; } .booster { padding: 7px 6px; } }
@media (max-width: 380px) {
  .top { gap: 6px; }
  h1 { white-space: normal; font-size: 20px; line-height: 1.02; }
  .stat { min-width: 50px; padding: 5px 5px; }
  .stat small { letter-spacing: 0; }
  .icon-btn { width: 38px; }
  .boosters { gap: 8px; }
  .booster { gap: 4px; padding: 8px 4px; font-size: 12px; }
  .booster svg { width: 18px; height: 18px; }
  .booster span { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.1; text-align: center; }
}
@media (max-height: 420px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 18px; border-radius: 22px; }
  .panel .emoji { font-size: 30px; }
  .panel h2 { font-size: 22px; }
  .panel .text { margin-top: 4px; font-size: 13px; line-height: 1.35; }
  .picker { margin-top: 10px; }
  .picker button { width: 38px; height: 38px; }
  .stars { font-size: 22px; }
  .cta { margin-top: 12px; padding: 11px; font-size: 17px; }
  .ghost { margin-top: 8px; padding: 9px; font-size: 15px; }
  .store-link { margin-top: 10px; }
}
/* Landscape / short screens: tiles on the left with the full height, HUD + tray + boosters in a side column */
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .app { max-width: 1000px; display: grid; grid-template-columns: minmax(0, 1fr) clamp(236px, 38vw, 340px); grid-template-rows: auto 1fr auto auto auto; grid-template-areas: "wrap top" "wrap ." "wrap hold" "wrap tray" "wrap boosters"; gap: 8px 14px; padding: 10px max(14px, env(safe-area-inset-right)) 12px max(14px, env(safe-area-inset-left)); }
  .board-wrap { grid-area: wrap; height: 100%; }
  .top { grid-area: top; gap: 6px; flex-wrap: wrap; }
  h1 { flex: 1 0 100%; font-size: clamp(20px, 3.4vw, 26px); }
  .top .stat { flex: 1; }
  .stat { min-width: 50px; padding: 4px 5px; }
  .stat small { letter-spacing: 0; }
  .stat strong { font-size: 16px; }
  .icon-btn { width: 36px; height: 36px; }
  .hold { grid-area: hold; }
  .tray { grid-area: tray; padding: 4px; border-radius: 16px; }
  .boosters { grid-area: boosters; gap: 8px; }
  .booster { gap: 4px; padding: 7px 4px; font-size: 12px; }
  .booster svg { width: 18px; height: 18px; }
  .booster span { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.1; text-align: center; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <h1>Tile <span>Match</span></h1>
    <div class="stat"><small data-i18n="level"></small><strong id="level">1</strong></div>
    <div class="stat"><small data-i18n="left"></small><strong id="left">0</strong></div>
    <button type="button" class="icon-btn" id="menu" data-i18n-label="levels"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg></button>
    <button type="button" class="icon-btn" id="restart" data-i18n-label="restart">↻</button>

  <div class="board-wrap" id="wrap">

  <div class="hold" id="hold" role="group" data-i18n-label="hold"><i></i><i></i><i></i></div>
  <div class="tray" id="tray-box">
    <div class="slots" id="tray" role="group" data-i18n-label="tray"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="boosters">
    <button type="button" class="booster" id="undo" aria-keyshortcuts="U"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="undo"></span><b class="count" id="undo-count" aria-hidden="true"></b></button>
    <button type="button" class="booster" id="shuffle" aria-keyshortcuts="S"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg><span data-i18n="shuffle"></span><b class="count" id="shuffle-count" aria-hidden="true"></b></button>
    <button type="button" class="booster" id="pop" aria-keyshortcuts="P"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14V3"/><path d="m7 8 5-5 5 5"/><rect x="3" y="15" width="18" height="6" rx="2"/></svg><span data-i18n="pop"></span><b class="count" id="pop-count" aria-hidden="true"></b></button>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <p class="emoji" aria-hidden="true">🍡</p>
    <h2 id="start-title">Tile <span>Match</span></h2>
    <p class="text" data-i18n="tagline"></p>
    <p class="text" data-i18n="how"></p>
    <div class="picker">
      <button type="button" id="prev" data-i18n-label="prev">‹</button>
      <strong id="pick-level" aria-live="polite"></strong>
      <button type="button" id="next" data-i18n-label="next">›</button>
    </div>
    <p class="stars" id="pick-stars"></p>
    <button type="button" class="cta" id="play" data-i18n="play"></button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🎉</p>
    <h2 id="win-title" data-i18n="won"></h2>
    <p class="stars" id="win-stars" role="img"></p>
    <p class="result" id="result"></p>
    <button type="button" class="cta" id="next-level" data-i18n="nextLevel"></button>
    <button type="button" class="ghost" id="replay" data-i18n="replay"></button>
    <a class="store-link" href="https://play.google.com/store/apps/details?id=dev.lamian.games.tilematchpuzzle" target="_blank" rel="noopener noreferrer"><span data-i18n="full"></span> ↗</a>
  </div>
</div>

<div class="overlay" id="lose" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="lose-title">
    <p class="emoji" aria-hidden="true">🥺</p>
    <h2 id="lose-title" data-i18n="lost"></h2>
    <p class="text" data-i18n="lostText"></p>
    <button type="button" class="cta" id="retry" data-i18n="retry"></button>
    <button type="button" class="ghost" id="rescue-undo" data-i18n="rescue"></button>
    <button type="button" class="ghost" id="rescue-pop" data-i18n="rescuePop"></button>
  </div>
</div>

    game.board.push(tile);
    relocate(tile, 'board');
    refresh();
    els.announcer.textContent = t.undone;
  }

  function popTiles() {
    if (game.busy || game.over || !game.boosters.pop || game.hold.length || !game.tray.length) return;
    spend('pop');
    const moving = game.tray.splice(0, HOLD_SIZE);
    game.hold.push(...moving);
    moving.forEach(tile => relocate(tile, 'hold'));
    refresh();
    els.announcer.textContent = t.popped;
  }

  // Re-deal the board along a fresh removal order, finishing the groups already in the tray first.
  function shuffleBoard() {
    if (game.busy || game.over || !game.boosters.shuffle || game.board.length < 2) return;
    spend('shuffle');
    const pool = new Map();
    for (const tile of game.board) pool.set(tile.type, (pool.get(tile.type) || 0) + 1);
    const waiting = new Map();
    for (const tile of [...game.tray, ...game.hold]) waiting.set(tile.type, (waiting.get(tile.type) || 0) + 1);
    const sequence = [];
    const pending = [...waiting].filter(([, c]) => c % 3).sort((a, b) => (b[1] % 3) - (a[1] % 3));
    for (const [type, c] of pending) {
      const need = Math.min(3 - (c % 3), pool.get(type) || 0);
      for (let i = 0; i < need; i++) sequence.push(type);
      pool.set(type, pool.get(type) - need);
    }
    const groups = [];
    for (const [type, c] of pool) for (let i = 0; i < c; i += 3) groups.push(Array(Math.min(3, c - i)).fill(type));
    sequence.push(...shuffle(groups).flat());
    const order = removalOrder(game.board);
    order.forEach((tile, i) => { tile.type = sequence[i]; });
    game.busy = true;
    for (const tile of game.board) {
      tile.el.classList.remove('spin');
      void tile.el.offsetWidth;
      tile.el.classList.add('spin');
    }
    setTimeout(() => {
      game.board.forEach(paintType);
      refresh();
    }, reducedMotion.matches ? 0 : 200);
    setTimeout(() => { game.busy = false; }, reducedMotion.matches ? 0 : 420);
    refresh();
    els.announcer.textContent = t.shuffled;
  }

  function win() {
    game.over = true;
    const stars = game.used === 0 ? 3 : game.used <= 2 ? 2 : 1;
    const saved = read(STORE.stars, {});
    if (!(saved[game.level] >= stars)) { saved[game.level] = stars; write(STORE.stars, saved); }
    highest = Math.max(highest, game.level + 1);
    pickLevel = highest;
    write(STORE.level, highest);
    els.winStars.innerHTML = [0, 1, 2].map(i => (i < stars ? `<b style="--i:${i}">★</b>` : '☆')).join('');
    els.winStars.setAttribute('aria-label', t.starsLabel(stars));
    els.result.textContent = t.result(game.moves, game.used);
    els.announcer.textContent = `${t.won} ${t.starsLabel(stars)}. ${t.result(game.moves, game.used)}`;
    setTimeout(() => { els.win.hidden = false; els.nextLevel.focus({ preventScroll: true }); }, 300);
  }

  function lose() {
    els.rescueUndo.hidden = !(game.boosters.undo && lastUndoable());
    els.rescuePop.hidden = !(game.boosters.pop && !game.hold.length);
    els.lose.hidden = false;
    els.announcer.textContent = `${t.lost} ${t.lostText}`;
    els.retry.focus({ preventScroll: true });
  }

  function rescue(action) {
    els.lose.hidden = true;
    game.over = false;
    action();
  }

  function focusNearest(near) {
    if (!keyboardMode) return;
    const free = game.board.filter(isFree);
    if (!free.length) return;
    const ref = near || free[0];
    const dist = tile => (tile.x - ref.x) ** 2 + (tile.y - ref.y) ** 2 - tile.z;
    free.sort((a, b) => dist(a) - dist(b))[0].el.focus({ preventScroll: true });
  }

  // Arrow keys hop between the uncovered tiles in roughly that direction.
  function moveFocus(dx, dy) {
    const free = game.board.filter(isFree);
    const current = free.find(tile => tile.el === document.activeElement);
    if (!current) return focusNearest();
    let best = null, bestScore = Infinity;
    for (const tile of free) {
      const ddx = tile.x - current.x, ddy = tile.y - current.y;
      const along = ddx * dx + ddy * dy;
      if (along <= 0) continue;
      const score = along + Math.abs(ddx * dy + ddy * dx) * 2;
      if (score < bestScore) { bestScore = score; best = tile; }
    }
    best?.el.focus({ preventScroll: true });
  }

  function fit() {
    const slot = els.tray.clientWidth / TRAY_SIZE;
    els.app.style.setProperty('--slot', `${slot}px`);
    if (!game) return;
    const { spanX, spanY, maxZ } = game.bounds;
    const w = els.wrap.clientWidth, h = els.wrap.clientHeight;
    const size = Math.max(16, Math.min(w / (spanX / 2), h / (spanY / 2 + maxZ * LIFT), MAX_TILE));
    els.board.style.setProperty('--t', `${size}px`);
    els.board.style.width = `${size * spanX / 2}px`;
    els.board.style.height = `${size * (spanY / 2 + maxZ * LIFT)}px`;
  }

  function showStart() {
    pickLevel = Math.min(pickLevel, highest);
    renderPicker();
    els.win.hidden = els.lose.hidden = true;
    els.start.hidden = false;
    els.play.focus({ preventScroll: true });
  }

  function renderPicker() {
    const stars = read(STORE.stars, {})[pickLevel] || 0;
    els.pickLevel.textContent = t.levelN(pickLevel);
    els.pickStars.innerHTML = stars ? [0, 1, 2].map(i => (i < stars ? '<b style="--i:0">★</b>' : '☆')).join('') : '';
    els.pickStars.setAttribute('aria-label', stars ? t.starsLabel(stars) : '');
    els.prev.disabled = pickLevel <= 1;
    els.next.disabled = pickLevel >= highest;
  }

  const overlayOpen = () => !els.start.hidden || !els.win.hidden || !els.lose.hidden;
  const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const HOTKEYS = { u: undo, z: undo, s: shuffleBoard, p: popTiles };
  document.addEventListener('pointerdown', () => { keyboardMode = false; }, true);
  document.addEventListener('keydown', event => {
    keyboardMode = true;
    if (event.altKey || event.ctrlKey || event.metaKey || !game || overlayOpen()) return;
    if (ARROWS[event.key]) {
      event.preventDefault();
      moveFocus(...ARROWS[event.key]);
      return;
    }
    const action = HOTKEYS[event.key.toLowerCase()];
    if (action) { event.preventDefault(); action(); }
  });

  boosterEls.undo.addEventListener('click', undo);
  boosterEls.shuffle.addEventListener('click', shuffleBoard);
  boosterEls.pop.addEventListener('click', popTiles);
  $('restart').addEventListener('click', () => { if (game) startLevel(game.level); });
  $('menu').addEventListener('click', showStart);
  els.prev.addEventListener('click', () => { pickLevel = Math.max(1, pickLevel - 1); renderPicker(); });
  els.next.addEventListener('click', () => { pickLevel = Math.min(highest, pickLevel + 1); renderPicker(); });
  els.play.addEventListener('click', () => {
    if (game && game.level === pickLevel && !game.moves) { els.start.hidden = true; focusNearest(); }
    else startLevel(pickLevel);
  });
  els.nextLevel.addEventListener('click', () => startLevel(game.level + 1));
  $('replay').addEventListener('click', () => startLevel(game.level));
  els.retry.addEventListener('click', () => startLevel(game.level));
  els.rescueUndo.addEventListener('click', () => rescue(undo));
  els.rescuePop.addEventListener('click', () => rescue(popTiles));

  new ResizeObserver(fit).observe(els.app);
  startLevel(pickLevel);
  showStart();
})();
</script>
</body>
</html>
