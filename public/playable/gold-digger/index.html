<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Digger</title>
<style>
:root {
  --bg: #2b1c12;
  --text: #fff7e6;
  --muted: #e2c9a3;
  --gold: #ffc93c;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); }
.hud { display: flex; align-items: center; gap: 6px; max-width: 480px; width: 100%; margin: 0 auto; }
.stat { flex: 1; padding: 5px 8px; border-radius: 10px; background: #00000040; }
.stat small { display: block; font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.25; }
.stat .money { color: var(--gold); }
.stat .low { color: #ff6b5b; }
.dynamite { flex: 0 0 auto; height: 44px; padding: 0 12px; border-radius: 12px; background: #c0392b; font-size: 16px; font-weight: 900; box-shadow: 0 3px 0 #7d2219; }
.dynamite:disabled { opacity: .45; cursor: default; }
.dynamite:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #7d2219; }
.stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
canvas { display: block; border-radius: 16px; touch-action: none; box-shadow: 0 16px 40px #0008; }
canvas:focus-visible { outline: 2px solid #ffc93c66; outline-offset: 3px; }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 320px); padding: 24px 20px; border-radius: 22px; background: #3b2717f2; border: 2px solid #ffc93c55; text-align: center; box-shadow: 0 20px 50px #000a; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.panel h1, .panel h2 { font-size: clamp(30px, 9vw, 40px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; }
.panel h1 span, .panel h2 span { color: var(--gold); }
.panel h2 { font-size: 26px; }
.panel p { margin-top: 10px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.panel .big { font-size: 20px; font-weight: 800; color: var(--text); }
.panel button { margin-top: 18px; width: 100%; padding: 14px; border-radius: 14px; background: var(--gold); color: #3b2717; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 #c99a1e; }
.panel button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c99a1e; }
.legend { display: flex; justify-content: center; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--gold); color: #3b2717 !important; font-weight: 800; }
.badge[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main class="app">
  <div class="hud">
    <div class="stat"><small data-i18n="money"></small><strong class="money" id="money">$0</strong></div>
    <div class="stat"><small data-i18n="goal"></small><strong id="goal">$650</strong></div>
    <div class="stat"><small data-i18n="time"></small><strong id="time">60</strong></div>
    <div class="stat"><small data-i18n="level"></small><strong id="level">1</strong></div>
    <button type="button" class="dynamite" id="dynamite">🧨 <span id="dyn-count">1</span></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="canvas" tabindex="0" aria-label="Gold Digger"></canvas>
    <div class="overlay" id="start">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <h1 id="start-title">Gold <span>Digger</span></h1>
        <p data-i18n="tagline"></p>
        <p data-i18n="controls"></p>
        <div class="legend" aria-hidden="true"><span>🟡 $$</span><span>💎 $$$</span><span>🪨 $</span><span>👜 ?</span></div>
        <button type="button" id="play" data-i18n="play"></button>
      </div>
    </div>
    <div class="overlay" id="between" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="between-title">
        <h2 id="between-title"></h2>
        <p class="big" id="between-text"></p>
        <p id="between-sub"></p>
        <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
        <button type="button" id="continue"></button>
      </div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<script>
(() => {
  const I18N = {
    en: { tagline: 'Swing the claw and reel in gold and diamonds. Reach the goal before time runs out!', controls: 'Tap, Space or ↓ to drop the claw. Use 🧨 (or ↑) to blow up something heavy.', play: 'Start digging', money: 'Money', goal: 'Goal', time: 'Time', level: 'Level', dynamite: 'Use dynamite', cleared: 'Goal reached!', nextGoal: g => `Next goal: $${g}`, bonus: '+1 🧨 for the next level', next: 'Next level', failed: 'Time’s up!', failedText: (m, g) => `$${m} of $${g}`, reached: l => `You reached level ${l}`, best: m => `Best: $${m}`, newBest: 'New best!', again: 'Play again', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    vi: { tagline: 'Đung đưa móc câu, kéo vàng và kim cương lên. Đạt mục tiêu trước khi hết giờ!', controls: 'Chạm, Space hoặc ↓ để thả móc. Dùng 🧨 (hoặc ↑) để phá vật nặng.', play: 'Bắt đầu đào', money: 'Tiền', goal: 'Mục tiêu', time: 'Thời gian', level: 'Màn', dynamite: 'Dùng thuốc nổ', cleared: 'Đạt mục tiêu!', nextGoal: g => `Mục tiêu tiếp theo: $${g}`, bonus: '+1 🧨 cho màn sau', next: 'Màn tiếp theo', failed: 'Hết giờ!', failedText: (m, g) => `$${m} / $${g}`, reached: l => `Bạn đã tới màn ${l}`, best: m => `Kỷ lục: $${m}`, newBest: 'Kỷ lục mới!', again: 'Chơi lại', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    zh: { tagline: '摆动钩爪，把黄金和钻石拉上来。在时间结束前达到目标！', controls: '点击、空格或 ↓ 放下钩爪。用 🧨（或 ↑）炸掉重物。', play: '开始挖矿', money: '金钱', goal: '目标', time: '时间', level: '关卡', dynamite: '使用炸药', cleared: '达成目标！', nextGoal: g => `下一个目标：$${g}`, bonus: '下一关 +1 🧨', next: '下一关', failed: '时间到！', failedText: (m, g) => `$${m} / $${g}`, reached: l => `你到达了第 ${l} 关`, best: m => `最佳：$${m}`, newBest: '新纪录！', again: '再玩一次', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    fr: { tagline: 'Balancez la pince et remontez or et diamants. Atteignez l’objectif avant la fin du temps !', controls: 'Touchez, Espace ou ↓ pour lancer la pince. 🧨 (ou ↑) fait exploser un objet lourd.', play: 'Creuser', money: 'Argent', goal: 'Objectif', time: 'Temps', level: 'Niveau', dynamite: 'Utiliser la dynamite', cleared: 'Objectif atteint !', nextGoal: g => `Prochain objectif : $${g}`, bonus: '+1 🧨 pour le niveau suivant', next: 'Niveau suivant', failed: 'Temps écoulé !', failedText: (m, g) => `$${m} sur $${g}`, reached: l => `Vous avez atteint le niveau ${l}`, best: m => `Record : $${m}`, newBest: 'Nouveau record !', again: 'Rejouer', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    th: { tagline: 'แกว่งตะขอ ดึงทองและเพชรขึ้นมา ทำให้ถึงเป้าหมายก่อนหมดเวลา!', controls: 'แตะ, Space หรือ ↓ เพื่อปล่อยตะขอ ใช้ 🧨 (หรือ ↑) ระเบิดของหนัก', play: 'เริ่มขุด', money: 'เงิน', goal: 'เป้าหมาย', time: 'เวลา', level: 'ด่าน', dynamite: 'ใช้ระเบิด', cleared: 'ถึงเป้าหมายแล้ว!', nextGoal: g => `เป้าหมายถัดไป: $${g}`, bonus: '+1 🧨 สำหรับด่านถัดไป', next: 'ด่านถัดไป', failed: 'หมดเวลา!', failedText: (m, g) => `$${m} จาก $${g}`, reached: l => `คุณไปถึงด่าน ${l}`, best: m => `ดีที่สุด: $${m}`, newBest: 'สถิติใหม่!', again: 'เล่นอีกครั้ง', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    ja: { tagline: 'クローを揺らして金とダイヤを引き上げよう。時間内に目標金額を達成！', controls: 'タップ・スペース・↓ でクローを発射。🧨（または ↑）で重い物を爆破。', play: '採掘スタート', money: '所持金', goal: '目標', time: 'タイム', level: 'レベル', dynamite: 'ダイナマイトを使う', cleared: '目標達成！', nextGoal: g => `次の目標：$${g}`, bonus: '次のレベルで 🧨 +1', next: '次のレベル', failed: 'タイムアップ！', failedText: (m, g) => `$${m} / $${g}`, reached: l => `レベル ${l} まで到達`, best: m => `ベスト：$${m}`, newBest: '自己ベスト更新！', again: 'もう一度', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    ko: { tagline: '집게를 흔들어 금과 다이아몬드를 끌어올리세요. 시간 안에 목표를 달성하세요!', controls: '탭, Space 또는 ↓로 집게를 내려요. 🧨(또는 ↑)로 무거운 물건을 터뜨려요.', play: '채굴 시작', money: '돈', goal: '목표', time: '시간', level: '레벨', dynamite: '다이너마이트 사용', cleared: '목표 달성!', nextGoal: g => `다음 목표: $${g}`, bonus: '다음 레벨 🧨 +1', next: '다음 레벨', failed: '시간 종료!', failedText: (m, g) => `$${m} / $${g}`, reached: l => `레벨 ${l}까지 도달`, best: m => `최고: $${m}`, newBest: '최고 기록!', again: '다시 하기', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
  };
  const requested = new URLSearchParams(location.search).get('lang');
  const lang = I18N[requested] ? requested : 'en';
  const t = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t[el.dataset.i18n];

  // Fixed 360×640 world scaled to fit, like the other arcade canvases.
  const W = 360, H = 640;
  const PIVOT = { x: W / 2, y: 112 };
  const GROUND = 128;
  const REST = 22;
  const LEVEL_TIME = 60;
  const STORAGE_KEY = 'milaan.goldDigger.best';
  const KINDS = {
    goldS: { r: 11, value: 50, weight: 1.2 },
    goldM: { r: 19, value: 150, weight: 2.4 },
    goldL: { r: 32, value: 500, weight: 5 },
    rockS: { r: 14, value: 20, weight: 3 },
    rockL: { r: 25, value: 60, weight: 6 },
    diamond: { r: 9, value: 600, weight: 0.6 },
    bag: { r: 13, value: 0, weight: 1.4 },
  };

  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const els = { money: $('money'), goal: $('goal'), time: $('time'), level: $('level'), dynamite: $('dynamite'), dynCount: $('dyn-count'), start: $('start'), between: $('between'), betweenTitle: $('between-title'), betweenText: $('between-text'), betweenSub: $('between-sub'), newBest: $('new-best'), cont: $('continue'), announcer: $('announcer') };
  els.dynamite.setAttribute('aria-label', t.dynamite);

  const readBest = () => { try { return Number(localStorage.getItem(STORAGE_KEY)) || 0; } catch { return 0; } };
  const writeBest = value => { try { localStorage.setItem(STORAGE_KEY, String(value)); } catch {} };
  const rand = (min, max) => min + Math.random() * (max - min);
  // Cumulative money target: each level asks for a bit more than the last.
  const goalFor = level => 650 * level + 60 * level * (level - 1);

  let scale = 1;
  function resize() {
    const box = $('stage').getBoundingClientRect();
    scale = Math.min(box.width / W, box.height / H);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.style.width = `${W * scale}px`;
    canvas.style.height = `${H * scale}px`;
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }

  function pickKind(level) {
    const table = [['goldS', 6], ['goldM', 4], ['goldL', 1 + level * 0.4], ['rockS', 4], ['rockL', 2.5 + level * 0.3], ['diamond', 0.4 + level * 0.3], ['bag', 1.5]];
    let roll = Math.random() * table.reduce((sum, [, w]) => sum + w, 0);
    for (const [kind, w] of table) if ((roll -= w) <= 0) return kind;
    return 'goldS';
  }

  function buildMine(level, needed) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const items = [];
      const count = 13 + Math.min(level, 5);
      for (let tries = 0; items.length < count && tries < 400; tries++) {
        const kind = pickKind(level);
        const { r } = KINDS[kind];
        // Big nuggets and diamonds sit deeper, so the best loot takes longer to reach.
        const deep = kind === 'goldL' || kind === 'diamond';
        const x = rand(r + 8, W - r - 8);
        const y = rand(deep ? 380 : GROUND + 70, H - r - 10);
        if (Math.hypot(x - PIVOT.x, y - PIVOT.y) < 90) continue;
        if (items.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 8)) continue;
        items.push({ kind, x, y, r, value: KINDS[kind].value, weight: KINDS[kind].weight, angle: rand(0, Math.PI * 2) });
      }
      const total = items.reduce((sum, item) => sum + item.value, 0);
      if (total >= needed * 1.6) return items;
    }
    return buildMine(level, 0);
  }

  let game, best = readBest();

  function newGame() {
    game = { level: 1, money: 0, dynamite: 1, state: 'intro' };
    startLevel();
  }

  function startLevel() {
    const needed = goalFor(game.level) - game.money;
    Object.assign(game, { items: buildMine(game.level, Math.max(needed, 300)), timeLeft: LEVEL_TIME, swing: 0, hook: { state: 'swing', angle: 0, length: REST, item: null }, popups: [], particles: [], state: 'play' });
    els.start.hidden = true;
    els.between.hidden = true;
    updateHud();
    canvas.focus({ preventScroll: true });
  }

  function updateHud() {
    els.money.textContent = `$${game.money}`;
    els.goal.textContent = `$${goalFor(game.level)}`;
    els.time.textContent = String(Math.ceil(game.timeLeft));
    els.time.classList.toggle('low', game.timeLeft <= 10);
    els.level.textContent = String(game.level);
    els.dynCount.textContent = String(game.dynamite);
    els.dynamite.disabled = !game.dynamite || game.hook.state !== 'back' || !game.hook.item;
  }

  const tip = hook => ({ x: PIVOT.x + Math.sin(hook.angle) * hook.length, y: PIVOT.y + Math.cos(hook.angle) * hook.length });

  function drop() {
    if (game?.state === 'play' && game.hook.state === 'swing') game.hook.state = 'out';
  }

  function useDynamite() {
    const hook = game?.hook;
    if (game?.state !== 'play' || !game.dynamite || hook.state !== 'back' || !hook.item) return;
    game.dynamite -= 1;
    burst(hook.item.x, hook.item.y, '#ff8c42', 22);
    hook.item = null;
    updateHud();
  }

  function burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(40, 180);
      game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function collect(item) {
    let text;
    if (item.kind === 'bag') {
      // Mystery bags hold either a stick of dynamite or a random amount of cash.
      if (Math.random() < 0.25) { game.dynamite += 1; text = t.gotDynamite; }
      else { const v = Math.round(rand(3, 70)) * 10; game.money += v; text = t.got(v); }
    } else {
      game.money += item.value;
      text = t.got(item.value);
    }
    game.popups.push({ text, x: PIVOT.x, y: PIVOT.y - 30, life: 1.1 });
    els.announcer.textContent = text;
    updateHud();
  }

  function update(dt) {
    const hook = game.hook;
    game.timeLeft -= dt;
    if (hook.state === 'swing') {
      game.swing += dt * 1.9;
      hook.angle = Math.sin(game.swing) * 1.25;
    } else if (hook.state === 'out') {
      hook.length += 360 * dt;
      const p = tip(hook);
      const hit = game.items.find(item => Math.hypot(item.x - p.x, item.y - p.y) < item.r + 7);
      if (hit) {
        hook.item = hit;
        game.items.splice(game.items.indexOf(hit), 1);
        hook.state = 'back';
      } else if (p.x < 0 || p.x > W || p.y > H) {
        hook.state = 'back';
      }
    } else {
      // Heavier loot reels in more slowly.
      const pull = hook.item ? 430 / (1 + hook.item.weight) : 520;
      hook.length -= pull * dt;
      if (hook.item) { const p = tip(hook); hook.item.x = p.x + Math.sin(hook.angle) * hook.item.r * 0.7; hook.item.y = p.y + Math.cos(hook.angle) * hook.item.r * 0.7; }
      if (hook.length <= REST) {
        hook.length = REST;
        if (hook.item) collect(hook.item);
        hook.item = null;
        hook.state = 'swing';
      }
    }
    for (const p of game.popups) { p.y -= 40 * dt; p.life -= dt; }
    game.popups = game.popups.filter(p => p.life > 0);
    for (const p of game.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.life -= dt; }
    game.particles = game.particles.filter(p => p.life > 0);

    const nothingLeft = !game.items.some(item => item.value > 0 || item.kind === 'bag') && hook.state === 'swing';
    if (game.timeLeft <= 0 || nothingLeft) endLevel();
    els.time.textContent = String(Math.max(0, Math.ceil(game.timeLeft)));
    els.time.classList.toggle('low', game.timeLeft <= 10);
    els.dynamite.disabled = !game.dynamite || hook.state !== 'back' || !hook.item;
  }

  function endLevel() {
    game.state = 'between';
    const goal = goalFor(game.level);
    if (game.money >= goal) {
      game.level += 1;
      game.dynamite += 1;
      els.betweenTitle.textContent = t.cleared;
      els.betweenText.textContent = `$${game.money}`;
      els.betweenSub.textContent = `${t.nextGoal(goalFor(game.level))} · ${t.bonus}`;
      els.newBest.hidden = true;
      els.cont.textContent = t.next;
      els.cont.onclick = startLevel;
    } else {
      const isBest = game.money > best;
      if (isBest) { best = game.money; writeBest(best); }
      els.betweenTitle.textContent = t.failed;
      els.betweenText.textContent = t.failedText(game.money, goal);
      els.betweenSub.textContent = `${t.reached(game.level)} · ${t.best(best)}`;
      els.newBest.hidden = !isBest;
      els.cont.textContent = t.again;
      els.cont.onclick = newGame;
    }
    els.between.hidden = false;
    els.announcer.textContent = `${els.betweenTitle.textContent} ${els.betweenText.textContent}`;
    els.cont.focus({ preventScroll: true });
    updateHud();
  }

  function drawNugget(x, y, r, color, shade, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const rr = r * (0.82 + ((i * 37) % 5) * 0.05);
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.3, r * 0.28, r * 0.18, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawItem(item) {
    const { x, y, r } = item;
    if (item.kind.startsWith('gold')) drawNugget(x, y, r, '#ffc93c', '#fff1b0', item.angle);
    else if (item.kind.startsWith('rock')) drawNugget(x, y, r, '#8a8f98', '#b9bec7', item.angle);
    else if (item.kind === 'diamond') {
      ctx.fillStyle = '#7ff0ff';
      ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y - r * 0.2); ctx.lineTo(x, y + r * 1.1); ctx.lineTo(x - r, y - r * 0.2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e6fdff';
      ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.4, y - r * 0.2); ctx.lineTo(x - r * 0.4, y - r * 0.2); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = '#a0703f';
      ctx.beginPath(); ctx.ellipse(x, y + 2, r, r * 0.9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a5230'; ctx.fillRect(x - r * 0.45, y - r * 0.95, r * 0.9, r * 0.4);
      ctx.fillStyle = '#fff7e6'; ctx.font = `900 ${r}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', x, y + 3);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#7fc8f8'); sky.addColorStop(1, '#cdeeff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND);
    const dirt = ctx.createLinearGradient(0, GROUND, 0, H);
    dirt.addColorStop(0, '#b9834c'); dirt.addColorStop(0.45, '#8f5f33'); dirt.addColorStop(1, '#5b3a1f');
    ctx.fillStyle = dirt; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#6cbf4b'; ctx.fillRect(0, GROUND - 6, W, 8);
    ctx.fillStyle = '#00000014';
    for (let i = 0; i < 40; i++) { const x = (i * 97) % W, y = GROUND + 20 + ((i * 53) % (H - GROUND - 30)); ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2); ctx.fill(); }

    // Miner and winch.
    ctx.fillStyle = '#6b4a2b'; ctx.fillRect(PIVOT.x - 34, PIVOT.y - 12, 68, 14);
    ctx.fillStyle = '#3d6fd6'; ctx.fillRect(PIVOT.x + 18, PIVOT.y - 52, 22, 32);
    ctx.fillStyle = '#ffd7b0'; ctx.beginPath(); ctx.arc(PIVOT.x + 29, PIVOT.y - 62, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.arc(PIVOT.x + 29, PIVOT.y - 66, 12, Math.PI, 0); ctx.fill(); ctx.fillRect(PIVOT.x + 15, PIVOT.y - 67, 28, 4);
    ctx.fillStyle = '#4a4f59'; ctx.beginPath(); ctx.arc(PIVOT.x, PIVOT.y - 18, 13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#b9bec7'; ctx.lineWidth = 3;
    const crank = (game?.hook.state === 'back' ? performance.now() / 80 : 0);
    ctx.beginPath(); ctx.moveTo(PIVOT.x, PIVOT.y - 18); ctx.lineTo(PIVOT.x + Math.cos(crank) * 10, PIVOT.y - 18 + Math.sin(crank) * 10); ctx.stroke();

    if (!game) return;
    for (const item of game.items) drawItem(item);

    const hook = game.hook, p = tip(hook);
    ctx.strokeStyle = '#2d2d2d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(PIVOT.x, PIVOT.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    if (hook.item) drawItem(hook.item);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(-hook.angle);
    ctx.strokeStyle = '#3a3f48'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    const open = hook.item ? 0.25 : 0.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-14 * open - 6, 8, -4, 16); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14 * open + 6, 8, 4, 16); ctx.stroke();
    ctx.fillStyle = '#3a3f48'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    for (const s of game.particles) { ctx.globalAlpha = Math.max(0, s.life / 0.6); ctx.fillStyle = s.color; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const popup of game.popups) {
      ctx.globalAlpha = Math.min(1, popup.life * 2);
      ctx.font = '900 22px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = '#3b2717'; ctx.strokeText(popup.text, popup.x - 70, popup.y);
      ctx.fillStyle = '#ffc93c'; ctx.fillText(popup.text, popup.x - 70, popup.y);
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function frame(now) {
    // Clamp dt so hidden-tab pauses do not burn the level timer.
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (game?.state === 'play') update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointerdown', drop);
  els.dynamite.addEventListener('click', useDynamite);
  document.addEventListener('keydown', event => {
    if (game?.state !== 'play') return;
    if (event.key === ' ' || event.key === 'ArrowDown' || event.key === 'Enter') { event.preventDefault(); drop(); }
    else if (event.key === 'ArrowUp' || event.key === 'x' || event.key === 'X') { event.preventDefault(); useDynamite(); }
  });
  $('play').addEventListener('click', newGame);

  new ResizeObserver(resize).observe($('stage'));
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
