<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Digger</title>
<style>
:root { --bg:#3d2414; --text:#fff4cf; --muted:#e5c58c; --gold:#ffd34f; --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif; }
* { box-sizing:border-box; margin:0; }
html,body { height:100%; }
body { font-family:var(--font); color:var(--text); background:radial-gradient(ellipse at top,#80502a,#352013 80%); overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; }
button { font:inherit; color:inherit; border:0; cursor:pointer; }
:focus-visible { outline:3px solid #fff0a2; outline-offset:3px; }
.app { height:100%; max-width:860px; margin:auto; display:flex; flex-direction:column; gap:8px; padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom)); }
.masthead { display:flex; justify-content:space-between; align-items:center; gap:10px; max-width:520px; width:100%; margin:auto; }
.game-name { color:#ffdc69; font-size:clamp(18px,4vw,25px); font-weight:1000; letter-spacing:.055em; text-shadow:0 2px #4d2811,1px 0 #4d2811; }
.game-name::before { content:'⛏'; margin-right:8px; }
.record { font-size:11px; color:#f6d79c; font-weight:700; white-space:nowrap; }
.hud { display:grid; grid-template-columns:1.35fr 1.35fr 1fr .7fr; gap:5px; width:100%; max-width:520px; margin:0 auto; padding:8px; border:2px solid #a97038; border-radius:9px; background:linear-gradient(#714722,#593418); box-shadow:inset 0 1px #d6a45d,0 3px #28180e; }
.stat { min-width:0; padding:0 7px; border-right:1px solid #ad7d4259; }
.stat:last-child { border:0; }
.stat small { display:block; font-size:10px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; color:#e8c68b; white-space:nowrap; }
.stat strong { display:block; font-size:clamp(18px,4.8vw,24px); font-weight:900; font-variant-numeric:tabular-nums; line-height:1.25; }
.stat .money { color:#ffe270; text-shadow:0 2px #493018; }
.stat .low { color:#ff9a79; }
.goal-track { width:100%; max-width:520px; margin:0 auto; height:7px; border:1px solid #bc8546; background:#301c10; border-radius:8px; overflow:hidden; }
.goal-track span { display:block; width:0; height:100%; background:linear-gradient(#fff3a0,#edac24); transition:width .25s ease; }
.stage { flex:1; min-height:0; position:relative; display:grid; place-items:center; }
canvas { display:block; border:3px solid #a8733b; border-radius:8px; touch-action:none; box-shadow:0 4px #25170d,0 8px 22px #1b100d66; }
.controls { display:grid; grid-template-columns:1fr auto; gap:8px; width:100%; max-width:520px; margin:auto; }
.drop-button { min-height:50px; padding:9px 18px; border:2px solid #ffe391; border-radius:10px; color:#573111; background:linear-gradient(#ffdf77,#eaae32); font-size:17px; font-weight:1000; box-shadow:inset 0 1px #fff5bf,0 4px #9a581d; }
.drop-button .arrow { margin-right:8px; font-size:21px; }
.dynamite { min-height:50px; min-width:76px; padding:8px 14px; border:2px solid #e5a17a; border-radius:10px; color:#fff0d8; background:linear-gradient(#c26040,#9b3b29); font-size:20px; font-weight:900; box-shadow:inset 0 1px #f5b28c,0 4px #5d271b; }
button:disabled { cursor:default; filter:saturate(.45); opacity:.65; }
.controls button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px #68401e; }
.control-hint { text-align:center; font-size:10px; line-height:1.35; color:#e8c38b; }
.overlay { position:absolute; inset:0; display:grid; place-items:center; padding:12px; background:#25180d55; border-radius:8px; }
.overlay[hidden],[hidden] { display:none!important; }
.panel { position:relative; width:min(100%,330px); max-height:100%; overflow:auto; padding:24px 20px 22px; border:4px solid #895329; border-radius:13px; color:#59371e; background:linear-gradient(115deg,#fff2c9,#f3d797); text-align:center; box-shadow:inset 0 0 0 2px #fff8de,0 7px #3c2411,0 14px 32px #24160977; }
@keyframes rise { from { transform:translateY(12px); opacity:0; } }
@media(prefers-reduced-motion:reduce) { .panel { animation:none; }.goal-track span { transition:none; } }
.panel .kicker { margin:0 0 8px; color:#a36d30; font-size:10px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; }
.panel h1,.panel h2 { font-size:clamp(27px,7vw,38px); font-weight:1000; letter-spacing:-.04em; line-height:1.1; color:#75451e; text-shadow:0 1px #fff8de; }
.panel h1 span { color:#ba7a16; }
.panel h2 { font-size:27px; }
.panel p { margin-top:12px; font-size:13px; line-height:1.55; color:#78512d; }
.panel .big { font-size:28px; font-weight:900; color:#a36b12; }
.panel button { margin-top:18px; width:100%; min-height:48px; padding:12px; border:2px solid #fff0b5; border-radius:9px; background:linear-gradient(#ffd976,#edb23e); color:#603b18; font-size:18px; font-weight:900; box-shadow:0 4px #a96b28,0 0 0 1px #bf8a39; }
.panel button:active { transform:translateY(3px); box-shadow:0 1px #a96b28; }
.legend { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:16px; padding:12px 0; border-top:1px dashed #bb965c; border-bottom:1px dashed #bb965c; font-size:11px; font-weight:800; color:#7e582c; }
.legend span { display:grid; gap:4px; }.legend i { font-size:23px; font-style:normal; }
.badge { display:inline-block; margin-top:10px; padding:4px 12px; border-radius:99px; background:#96662a; color:#fff2c7!important; font-weight:800; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media(max-height:550px) and (min-width:550px) { .app { max-width:none; padding:6px 12px; gap:4px; }.masthead { position:absolute; left:14px; top:14px; max-width:140px; flex-direction:column; align-items:flex-start; }.game-name { font-size:16px; }.hud { position:absolute; right:12px; top:12px; width:128px; grid-template-columns:1fr 1fr; gap:10px 3px; }.stat { padding:0 4px; border:0; }.stat small { font-size:10px; letter-spacing:0; white-space:normal; line-height:1.1; }.stat strong { font-size:18px; }.goal-track { position:absolute; right:12px; top:116px; width:128px; }.stage { margin:0 140px; }.controls { position:absolute; right:12px; bottom:32px; width:128px; grid-template-columns:1fr; }.control-hint { position:absolute; bottom:12px; left:14px; right:auto; width:132px; text-align:left; }.drop-button { padding:8px 3px; font-size:13px; }.drop-button .arrow { margin-right:3px; }.dynamite { min-height:44px; }.panel { padding:14px; }.panel h1 { font-size:25px; }.panel p { font-size:11px; margin-top:8px; }.legend { margin-top:10px; padding:6px 0; }.panel button { margin-top:12px; } }
@media(max-height:650px) { .panel { padding:14px; }.panel .kicker { font-size:10px; margin-bottom:6px; }.panel h1,.panel h2 { font-size:24px; }.panel p { font-size:12px; margin-top:8px; }.legend { padding:8px 0; margin-top:10px; }.legend i { font-size:19px; }.panel button { margin-top:12px; padding:10px; min-height:44px; } }
@media(max-width:360px) { .app { padding-left:6px; padding-right:6px; gap:6px; }.hud { padding:6px 3px; }.stat { padding:0 3px; }.stat small { font-size:10px; letter-spacing:0; }.masthead .record { font-size:10px; } }
@media(max-height:650px),(max-width:360px) { .overlay { position:fixed; z-index:20; border-radius:0; padding:8px; } }
@media(max-height:420px) { .panel { padding:10px 14px; }.panel .kicker { margin-bottom:2px; }.panel h1,.panel h2 { font-size:22px; }.panel p { margin-top:5px; line-height:1.4; }.legend { margin-top:6px; padding:4px 0; }.legend i { font-size:17px; }.panel button { margin-top:10px; min-height:40px; padding:8px; } }
@media(max-height:420px) and (min-width:550px) { .panel { width:min(100%,460px); } }
</style>
</head>
<body>
<main class="app">
  <header class="masthead"><h1 class="game-name" id="game-name">Gold Digger</h1><span class="record" id="record"></span></header>
  <div class="hud">
    <div class="stat"><small data-i18n="money"></small><strong class="money" id="money">$0</strong></div>
    <div class="stat"><small data-i18n="goal"></small><strong id="goal">$650</strong></div>
    <div class="stat"><small data-i18n="time"></small><strong id="time">60</strong></div>
    <div class="stat"><small data-i18n="level"></small><strong id="level">1</strong></div>
  </div>
  <div class="goal-track" role="progressbar" id="goal-progress" aria-label="Goal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="goal-fill"></span></div>
  <div class="stage" id="stage">
    <canvas id="canvas" tabindex="0" aria-label="Gold Digger"></canvas>
    <div class="overlay" id="start">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <p class="kicker" id="start-kicker">THE CLASSIC GOLD RUSH</p>
        <h2 id="start-title">Gold <span>Digger</span></h2>
        <p data-i18n="tagline"></p>
        <p data-i18n="controls"></p>
        <div class="legend" aria-hidden="true"><span><i>🟡</i>$50–500</span><span><i>💎</i>$600</span><span><i>🪨</i>$20–60</span><span><i>💰</i>?</span></div>
        <button type="button" id="play" data-i18n="play"></button>
      </div>
    </div>
    <div class="overlay" id="between" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="between-title">
        <h2 id="between-title"></h2>
        <p class="big" id="between-text"></p>
        <p id="between-sub"></p>
        <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
        <button type="button" id="continue"></button>
      </div>
    </div>
  </div>
  <div class="controls"><button type="button" class="drop-button" id="drop" disabled><span class="arrow" aria-hidden="true">↓</span><span id="drop-label"></span></button><button type="button" class="dynamite" id="dynamite" disabled>🧨 <span id="dyn-count">1</span></button></div>
  <p class="control-hint" id="control-hint"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<script>
(() => {
  const I18N = {
    en: { tagline: 'Swing the claw and reel in gold and diamonds. Reach the goal before time runs out!', controls: 'Tap, Space or ↓ to drop the claw. Use 🧨 (or ↑) to blow up something heavy.', play: 'Start digging', money: 'Money', goal: 'Goal', time: 'Time', level: 'Level', dynamite: 'Use dynamite', cleared: 'Goal reached!', nextGoal: g => `Next goal: $${g}`, bonus: '+1 🧨 for the next level', next: 'Next level', failed: 'Time’s up!', failedText: (m, g) => `$${m} of $${g}`, reached: l => `You reached level ${l}`, best: m => `Best: $${m}`, newBest: 'New best!', again: 'Play again', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    vi: { tagline: 'Đung đưa móc câu, kéo vàng và kim cương lên. Đạt mục tiêu trước khi hết giờ!', controls: 'Chạm, Space hoặc ↓ để thả móc. Dùng 🧨 (hoặc ↑) để phá vật nặng.', play: 'Bắt đầu đào', money: 'Tiền', goal: 'Mục tiêu', time: 'Thời gian', level: 'Màn', dynamite: 'Dùng thuốc nổ', cleared: 'Đạt mục tiêu!', nextGoal: g => `Mục tiêu tiếp theo: $${g}`, bonus: '+1 🧨 cho màn sau', next: 'Màn tiếp theo', failed: 'Hết giờ!', failedText: (m, g) => `$${m} / $${g}`, reached: l => `Bạn đã tới màn ${l}`, best: m => `Kỷ lục: $${m}`, newBest: 'Kỷ lục mới!', again: 'Chơi lại', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    zh: { tagline: '摆动钩爪，把黄金和钻石拉上来。在时间结束前达到目标！', controls: '点击、空格或 ↓ 放下钩爪。用 🧨（或 ↑）炸掉重物。', play: '开始挖矿', money: '金钱', goal: '目标', time: '时间', level: '关卡', dynamite: '使用炸药', cleared: '达成目标！', nextGoal: g => `下一个目标：$${g}`, bonus: '下一关 +1 🧨', next: '下一关', failed: '时间到！', failedText: (m, g) => `$${m} / $${g}`, reached: l => `你到达了第 ${l} 关`, best: m => `最佳：$${m}`, newBest: '新纪录！', again: '再玩一次', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    fr: { tagline: 'Balancez la pince et remontez or et diamants. Atteignez l’objectif avant la fin du temps !', controls: 'Touchez, Espace ou ↓ pour lancer la pince. 🧨 (ou ↑) fait exploser un objet lourd.', play: 'Creuser', money: 'Argent', goal: 'Objectif', time: 'Temps', level: 'Niveau', dynamite: 'Utiliser la dynamite', cleared: 'Objectif atteint !', nextGoal: g => `Prochain objectif : $${g}`, bonus: '+1 🧨 pour le niveau suivant', next: 'Niveau suivant', failed: 'Temps écoulé !', failedText: (m, g) => `$${m} sur $${g}`, reached: l => `Vous avez atteint le niveau ${l}`, best: m => `Record : $${m}`, newBest: 'Nouveau record !', again: 'Rejouer', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    th: { tagline: 'แกว่งตะขอ ดึงทองและเพชรขึ้นมา ทำให้ถึงเป้าหมายก่อนหมดเวลา!', controls: 'แตะ, Space หรือ ↓ เพื่อปล่อยตะขอ ใช้ 🧨 (หรือ ↑) ระเบิดของหนัก', play: 'เริ่มขุด', money: 'เงิน', goal: 'เป้าหมาย', time: 'เวลา', level: 'ด่าน', dynamite: 'ใช้ระเบิด', cleared: 'ถึงเป้าหมายแล้ว!', nextGoal: g => `เป้าหมายถัดไป: $${g}`, bonus: '+1 🧨 สำหรับด่านถัดไป', next: 'ด่านถัดไป', failed: 'หมดเวลา!', failedText: (m, g) => `$${m} จาก $${g}`, reached: l => `คุณไปถึงด่าน ${l}`, best: m => `ดีที่สุด: $${m}`, newBest: 'สถิติใหม่!', again: 'เล่นอีกครั้ง', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    ja: { tagline: 'クローを揺らして金とダイヤを引き上げよう。時間内に目標金額を達成！', controls: 'タップ・スペース・↓ でクローを発射。🧨（または ↑）で重い物を爆破。', play: '採掘スタート', money: '所持金', goal: '目標', time: 'タイム', level: 'レベル', dynamite: 'ダイナマイトを使う', cleared: '目標達成！', nextGoal: g => `次の目標：$${g}`, bonus: '次のレベルで 🧨 +1', next: '次のレベル', failed: 'タイムアップ！', failedText: (m, g) => `$${m} / $${g}`, reached: l => `レベル ${l} まで到達`, best: m => `ベスト：$${m}`, newBest: '自己ベスト更新！', again: 'もう一度', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
    ko: { tagline: '집게를 흔들어 금과 다이아몬드를 끌어올리세요. 시간 안에 목표를 달성하세요!', controls: '탭, Space 또는 ↓로 집게를 내려요. 🧨(또는 ↑)로 무거운 물건을 터뜨려요.', play: '채굴 시작', money: '돈', goal: '목표', time: '시간', level: '레벨', dynamite: '다이너마이트 사용', cleared: '목표 달성!', nextGoal: g => `다음 목표: $${g}`, bonus: '다음 레벨 🧨 +1', next: '다음 레벨', failed: '시간 종료!', failedText: (m, g) => `$${m} / $${g}`, reached: l => `레벨 ${l}까지 도달`, best: m => `최고: $${m}`, newBest: '최고 기록!', again: '다시 하기', got: v => `+$${v}`, gotDynamite: '+1 🧨' },
  };
  const requested = new URLSearchParams(location.search).get('lang');
  const lang = I18N[requested] ? requested : 'en';
  const t = I18N[lang];
  const ui = {
    en: ['GOLD DIGGER', 'THE CLASSIC GOLD RUSH', 'Drop claw', 'Reeling in…', 'Space / ↓: drop · ↑ / X: dynamite'],
    vi: ['ĐÀO VÀNG', 'CƠN SỐT VÀNG CỔ ĐIỂN', 'Thả móc', 'Đang kéo…', 'Space / ↓: thả móc · ↑ / X: thuốc nổ'],
    zh: ['黄金矿工', '经典淘金热', '放下钩爪', '收回中…', '空格 / ↓：放钩 · ↑ / X：炸药'],
    fr: ['CHERCHEUR D’OR', 'LA RUÉE VERS L’OR', 'Lancer', 'Remontée…', 'Espace / ↓ : pince · ↑ / X : dynamite'],
    th: ['นักขุดทอง', 'ตื่นทองสุดคลาสสิก', 'ปล่อยตะขอ', 'กำลังดึง…', 'Space / ↓: ปล่อย · ↑ / X: ระเบิด'],
    ja: ['ゴールドマイナー', 'クラシック・ゴールドラッシュ', 'クローを下ろす', '引き上げ中…', 'Space / ↓：クロー · ↑ / X：爆破'],
    ko: ['황금 광부', '클래식 골드 러시', '집게 내리기', '끌어올리는 중…', 'Space / ↓: 집게 · ↑ / X: 폭파'],
  }[lang];
  document.getElementById('game-name').textContent = ui[0];
  document.getElementById('start-title').textContent = ui[0];
  document.getElementById('start-kicker').textContent = ui[1];
  document.getElementById('drop-label').textContent = ui[2];
  document.getElementById('control-hint').textContent = ui[4];
  document.getElementById('goal-progress').setAttribute('aria-label', t.goal);
  document.title = ui[0];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t[el.dataset.i18n];

  // Fixed 360×640 world scaled to fit, like the other arcade canvases.
  const W = 360, H = 640;
  const PIVOT = { x: W / 2, y: 112 };
  const GROUND = 128;
  const REST = 22;
  const LEVEL_TIME = 60;
  const STORAGE_KEY = 'milaan.goldDigger.best';
  const KINDS = {
    goldS: { r: 11, value: 50, weight: 1.2 },
    goldM: { r: 19, value: 150, weight: 2.4 },
    goldL: { r: 32, value: 500, weight: 5 },
    rockS: { r: 14, value: 20, weight: 3 },
    rockL: { r: 25, value: 60, weight: 6 },
    diamond: { r: 9, value: 600, weight: 0.6 },
    bag: { r: 13, value: 0, weight: 1.4 },
  };

  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const els = { money: $('money'), goal: $('goal'), time: $('time'), level: $('level'), dynamite: $('dynamite'), dynCount: $('dyn-count'), start: $('start'), between: $('between'), betweenTitle: $('between-title'), betweenText: $('between-text'), betweenSub: $('between-sub'), newBest: $('new-best'), cont: $('continue'), announcer: $('announcer') };
  els.dynamite.setAttribute('aria-label', t.dynamite);
  canvas.setAttribute('aria-label', ui[0]);
  const dropButton = $('drop'), dropLabel = $('drop-label');
  const progress = $('goal-progress'), progressFill = $('goal-fill');

  const readBest = () => { try { return Number(localStorage.getItem(STORAGE_KEY)) || 0; } catch { return 0; } };
  const writeBest = value => { try { localStorage.setItem(STORAGE_KEY, String(value)); } catch {} };
  const rand = (min, max) => min + Math.random() * (max - min);
  // Cumulative money target: each level asks for a bit more than the last.
  const goalFor = level => 650 * level + 60 * level * (level - 1);

  let scale = 1;
  function resize() {
    const box = $('stage').getBoundingClientRect();
    scale = Math.min(box.width / W, box.height / H);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.style.width = `${W * scale}px`;
    canvas.style.height = `${H * scale}px`;
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }

  function pickKind(level) {
    const table = [['goldS', 6], ['goldM', 4], ['goldL', 1 + level * 0.4], ['rockS', 4], ['rockL', 2.5 + level * 0.3], ['diamond', 0.4 + level * 0.3], ['bag', 1.5]];
    let roll = Math.random() * table.reduce((sum, [, w]) => sum + w, 0);
    for (const [kind, w] of table) if ((roll -= w) <= 0) return kind;
    return 'goldS';
  }

  function buildMine(level, needed) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const items = [];
      const count = 13 + Math.min(level, 5);
      for (let tries = 0; items.length < count && tries < 400; tries++) {
        const kind = pickKind(level);
        const { r } = KINDS[kind];
        // Big nuggets and diamonds sit deeper, so the best loot takes longer to reach.
        const deep = kind === 'goldL' || kind === 'diamond';
        const x = rand(r + 8, W - r - 8);
        const y = rand(deep ? 380 : GROUND + 70, H - r - 10);
        if (Math.hypot(x - PIVOT.x, y - PIVOT.y) < 90) continue;
        if (items.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 8)) continue;
        items.push({ kind, x, y, r, value: KINDS[kind].value, weight: KINDS[kind].weight, angle: rand(0, Math.PI * 2) });
      }
      const total = items.reduce((sum, item) => sum + item.value, 0);
      if (total >= needed * 1.6) return items;
    }
    return buildMine(level, 0);
  }

  let game, best = readBest();
  $('record').textContent = t.best(best);
  const previewItems = [['goldL',65,390],['goldM',275,290],['goldS',80,230],['rockL',160,320],['diamond',295,535],['bag',245,425],['goldM',135,535],['rockS',40,560],['goldS',315,215],['goldM',200,230],['goldL',245,590]].map(([kind,x,y],i) => ({kind,x,y,...KINDS[kind],angle:i*.7}));

  function newGame() {
    game = { level: 1, money: 0, dynamite: 1, state: 'intro' };
    startLevel();
  }

  function startLevel() {
    const needed = goalFor(game.level) - game.money;
    Object.assign(game, { items: buildMine(game.level, Math.max(needed, 300)), timeLeft: LEVEL_TIME, swing: 0, hook: { state: 'swing', angle: 0, length: REST, item: null }, popups: [], particles: [], state: 'play' });
    els.start.hidden = true;
    els.between.hidden = true;
    updateHud();
    canvas.focus({ preventScroll: true });
  }

  function updateHud() {
    els.money.textContent = `$${game.money}`;
    els.goal.textContent = `$${goalFor(game.level)}`;
    els.time.textContent = String(Math.ceil(game.timeLeft));
    els.time.classList.toggle('low', game.timeLeft <= 10);
    els.level.textContent = String(game.level);
    els.dynCount.textContent = String(game.dynamite);
    const percent = Math.min(100, Math.round(game.money / goalFor(game.level) * 100));
    progressFill.style.width = `${percent}%`;
    progress.setAttribute('aria-valuenow', String(percent));
    $('record').textContent = t.best(Math.max(best, game.money));
    updateControls();
    els.dynamite.disabled = game.state !== 'play' || !game.dynamite || game.hook.state !== 'back' || !game.hook.item;
  }

  function updateControls() {
    dropButton.disabled = game?.state !== 'play' || game.hook.state !== 'swing';
    dropLabel.textContent = game?.state === 'play' && game.hook.state !== 'swing' ? ui[3] : ui[2];
  }

  const tip = hook => ({ x: PIVOT.x + Math.sin(hook.angle) * hook.length, y: PIVOT.y + Math.cos(hook.angle) * hook.length });

  function drop() {
    if (game?.state === 'play' && game.hook.state === 'swing') { game.hook.state = 'out'; updateControls(); }
  }

  function useDynamite() {
    const hook = game?.hook;
    if (game?.state !== 'play' || !game.dynamite || hook.state !== 'back' || !hook.item) return;
    game.dynamite -= 1;
    burst(hook.item.x, hook.item.y, '#ff8c42', 22);
    hook.item = null;
    updateHud();
  }

  function burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(40, 180);
      game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function collect(item) {
    let text;
    if (item.kind === 'bag') {
      // Mystery bags hold either a stick of dynamite or a random amount of cash.
      if (Math.random() < 0.25) { game.dynamite += 1; text = t.gotDynamite; }
      else { const v = Math.round(rand(3, 70)) * 10; game.money += v; text = t.got(v); }
    } else {
      game.money += item.value;
      text = t.got(item.value);
    }
    game.popups.push({ text, x: PIVOT.x, y: PIVOT.y - 30, life: 1.1 });
    els.announcer.textContent = text;
    updateHud();
  }

  function update(dt) {
    const hook = game.hook;
    game.timeLeft -= dt;
    if (hook.state === 'swing') {
      game.swing += dt * 1.9;
      hook.angle = Math.sin(game.swing) * 1.25;
    } else if (hook.state === 'out') {
      hook.length += 360 * dt;
      const p = tip(hook);
      const hit = game.items.find(item => Math.hypot(item.x - p.x, item.y - p.y) < item.r + 7);
      if (hit) {
        hook.item = hit;
        game.items.splice(game.items.indexOf(hit), 1);
        hook.state = 'back';
      } else if (p.x < 0 || p.x > W || p.y > H) {
        hook.state = 'back';
      }
    } else {
      // Heavier loot reels in more slowly.
      const pull = hook.item ? 430 / (1 + hook.item.weight) : 520;
      hook.length -= pull * dt;
      if (hook.item) { const p = tip(hook); hook.item.x = p.x + Math.sin(hook.angle) * hook.item.r * 0.7; hook.item.y = p.y + Math.cos(hook.angle) * hook.item.r * 0.7; }
      if (hook.length <= REST) {
        hook.length = REST;
        if (hook.item) collect(hook.item);
        hook.item = null;
        hook.state = 'swing';
      }
    }
    for (const p of game.popups) { p.y -= 40 * dt; p.life -= dt; }
    game.popups = game.popups.filter(p => p.life > 0);
    for (const p of game.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.life -= dt; }
    game.particles = game.particles.filter(p => p.life > 0);

    const nothingLeft = !game.items.some(item => item.value > 0 || item.kind === 'bag') && hook.state === 'swing';
    if (game.timeLeft <= 0 || nothingLeft) endLevel();
    els.time.textContent = String(Math.max(0, Math.ceil(game.timeLeft)));
    els.time.classList.toggle('low', game.timeLeft <= 10);
    els.dynamite.disabled = game.state !== 'play' || !game.dynamite || hook.state !== 'back' || !hook.item;
    updateControls();
  }

  function endLevel() {
    game.state = 'between';
    const goal = goalFor(game.level);
    if (game.money >= goal) {
      game.level += 1;
      game.dynamite += 1;
      els.betweenTitle.textContent = t.cleared;
      els.betweenText.textContent = `$${game.money}`;
      els.betweenSub.textContent = `${t.nextGoal(goalFor(game.level))} · ${t.bonus}`;
      els.newBest.hidden = true;
      els.cont.textContent = t.next;
      els.cont.onclick = startLevel;
    } else {
      const isBest = game.money > best;
      if (isBest) { best = game.money; writeBest(best); }
      els.betweenTitle.textContent = t.failed;
      els.betweenText.textContent = t.failedText(game.money, goal);
      els.betweenSub.textContent = `${t.reached(game.level)} · ${t.best(best)}`;
      els.newBest.hidden = !isBest;
      els.cont.textContent = t.again;
      els.cont.onclick = newGame;
    }
    els.between.hidden = false;
    els.announcer.textContent = `${els.betweenTitle.textContent} ${els.betweenText.textContent}`;
    els.cont.focus({ preventScroll: true });
    updateHud();
  }

  function drawNugget(x, y, r, color, shade, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const gold = color === '#ffc93c';
    const gradient = ctx.createLinearGradient(-r, -r, r, r);
    gradient.addColorStop(0, gold ? '#ffe990' : '#c1b29a');
    gradient.addColorStop(.45, color);
    gradient.addColorStop(1, gold ? '#d28b1d' : '#746957');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const rr = r * (0.82 + ((i * 37) % 5) * 0.05);
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = gold ? '#85501c' : '#514537'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.3, r * 0.28, r * 0.18, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawItem(item) {
    const { x, y, r } = item;
    if (item.kind.startsWith('gold')) drawNugget(x, y, r, '#ffc93c', '#fff1b0', item.angle);
    else if (item.kind.startsWith('rock')) drawNugget(x, y, r, '#9c917f', '#d6c7ab', item.angle);
    else if (item.kind === 'diamond') {
      ctx.fillStyle = '#7ff0ff';
      ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y - r * 0.2); ctx.lineTo(x, y + r * 1.1); ctx.lineTo(x - r, y - r * 0.2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e6fdff';
      ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.4, y - r * 0.2); ctx.lineTo(x - r * 0.4, y - r * 0.2); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = '#a0703f';
      ctx.beginPath(); ctx.ellipse(x, y + 2, r, r * 0.9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a5230'; ctx.fillRect(x - r * 0.45, y - r * 0.95, r * 0.9, r * 0.4);
      ctx.fillStyle = '#fff7e6'; ctx.font = `900 ${r}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', x, y + 3);
    }
  }

  function ellipse(x,y,rx,ry,color) {
    ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill();
  }
  function path(points,fill,stroke='#51331c',width=2) {
    ctx.beginPath(); points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill(); if(stroke) {ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
  }
  function drawLandscape() {
    const sky=ctx.createLinearGradient(0,0,0,GROUND);
    sky.addColorStop(0,'#70b7c8'); sky.addColorStop(1,'#d7e7b5');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND);
    ellipse(56,32,20,20,'#fff1b2'); ellipse(56,32,27,27,'#fff1b22b');
    path([[0,90],[37,51],[64,78],[110,41],[165,96],[218,61],[269,90],[310,49],[360,85],[360,130],[0,130]],'#8ba184',null);
    path([[0,110],[40,90],[87,111],[127,83],[190,114],[249,92],[306,105],[360,84],[360,130],[0,130]],'#b2b585',null);
    [[90,22],[281,25]].forEach(([x,y])=>{ellipse(x,y,21,5,'#fff7dcaf');ellipse(x-7,y-4,11,7,'#fff7dcaf');});
    // Timber fence and a few desert plants leave the rope's path unobstructed.
    ctx.fillStyle='#a7844c';ctx.fillRect(0,106,118,5);ctx.fillRect(252,106,108,5);
    [12,65,112,267,323].forEach(x=>{ctx.fillStyle='#846640';ctx.fillRect(x,99,4,23);});
    ctx.strokeStyle='#617b45';ctx.lineWidth=5;ctx.lineCap='round';
    [[29,97],[332,99]].forEach(([x,y])=>{ctx.beginPath();ctx.moveTo(x,y+22);ctx.lineTo(x,y);ctx.moveTo(x,y+11);ctx.lineTo(x-8,y+11);ctx.lineTo(x-8,y+5);ctx.stroke();});
    const dirt=ctx.createLinearGradient(0,GROUND,0,H);
    dirt.addColorStop(0,'#c98d48');dirt.addColorStop(.2,'#b87939');dirt.addColorStop(.65,'#955a2d');dirt.addColorStop(1,'#724124');
    ctx.fillStyle=dirt;ctx.fillRect(0,GROUND,W,H-GROUND);
    path([[0,124],[43,127],[86,124],[127,128],[179,124],[224,127],[270,124],[318,128],[360,123],[360,139],[315,143],[271,139],[225,144],[179,139],[131,143],[86,139],[43,143],[0,138]],'#714423',null);
    ctx.fillStyle='#d9b36a';ctx.fillRect(0,124,W,4);
    // Deterministic strata and pebbles, without random flicker between frames.
    ctx.strokeStyle='#5c351c22';ctx.lineWidth=2;
    for(let row=0;row<5;row++) {
      const y=209+row*88;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(90,y-14,220,y+17,360,y-5);ctx.stroke();
    }
    for(let i=0;i<76;i++) {
      const x=(i*97+17)%W,y=GROUND+30+((i*53)%(H-GROUND-40));
      ellipse(x,y,1.4+(i%3),1+(i%2),i%3?'#5f391c33':'#efbd7355');
    }
    const shade=ctx.createLinearGradient(0,GROUND,W,GROUND);shade.addColorStop(0,'#3d23152b');shade.addColorStop(.18,'#0000');shade.addColorStop(.82,'#0000');shade.addColorStop(1,'#3d23152b');
    ctx.fillStyle=shade;ctx.fillRect(0,GROUND,W,H-GROUND);
  }
  function drawMiner() {
    const x=PIVOT.x,y=PIVOT.y;
    // Wooden winch, iron wheel, boots and overalls of the classic prospector.
    ellipse(x+30,y+8,43,5,'#543e2944');
    path([[x-26,y-24],[x-35,y+8],[x-26,y+8],[x-16,y-24]],'#94602e');
    path([[x+12,y-24],[x+25,y+8],[x+34,y+8],[x+22,y-24]],'#94602e');
    path([[x-34,y-18],[x+35,y-18],[x+35,y-9],[x-34,y-9]],'#b6803d');
    ctx.fillStyle='#74451f';ctx.fillRect(x-30,y-16,60,2);
    ellipse(x+29,y+4,12,5,'#49352a');ellipse(x+51,y+4,12,5,'#49352a');
    path([[x+22,y-32],[x+57,y-32],[x+54,y+2],[x+43,y+2],[x+40,y-15],[x+35,y+2],[x+25,y+2]],'#426b87');
    path([[x+19,y-54],[x+46,y-58],[x+61,y-40],[x+52,y-25],[x+25,y-24]],'#b84f30');
    path([[x+27,y-52],[x+34,y-52],[x+35,y-35],[x+47,y-35],[x+49,y-53],[x+55,y-49],[x+54,y-23],[x+27,y-23]],'#55839b');
    ellipse(x+31,y-33,2,2,'#f3ca5e');ellipse(x+51,y-33,2,2,'#f3ca5e');
    // Face, ears, great white beard and a broad-brimmed yellow hat.
    ellipse(x+39,y-67,17,19,'#edbc85');ellipse(x+23,y-66,4,6,'#e2a874');
    path([[x+23,y-66],[x+29,y-59],[x+38,y-58],[x+52,y-65],[x+53,y-51],[x+46,y-43],[x+39,y-40],[x+28,y-48]],'#fff1ce','#b7a484',1.5);
    ellipse(x+27,y-67,2,2.5,'#3b3029');ellipse(x+41,y-68,2,2.5,'#3b3029');
    ellipse(x+33,y-61,7,4,'#f2c899');
    ctx.strokeStyle='#b8a78e';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+33,y-52);ctx.quadraticCurveTo(x+39,y-47,x+46,y-54);ctx.stroke();
    path([[x+19,y-78],[x+25,y-96],[x+45,y-99],[x+55,y-79]],'#e7b33b','#755022',2);
    ellipse(x+37,y-78,28,5,'#f6c84c');
    ctx.fillStyle='#98652b';ctx.fillRect(x+23,y-84,30,4);
    // His arm reaches the crank; motion stays in the mechanical wheel.
    ctx.strokeStyle='#6b3f25';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(x+22,y-46);ctx.lineTo(x+8,y-32);ctx.lineTo(x-1,y-28);ctx.stroke();
    ctx.strokeStyle='#edbc85';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(x+20,y-45);ctx.lineTo(x+8,y-32);ctx.lineTo(x-1,y-28);ctx.stroke();
    ellipse(x,y-18,15,15,'#553c29');ellipse(x,y-18,11,11,'#b99b67');ellipse(x,y-18,7,7,'#70502d');
    const crank=game?.hook.state==='back'?performance.now()/80:0;
    ctx.strokeStyle='#e1cf9c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-18);ctx.lineTo(x+Math.cos(crank)*11,y-18+Math.sin(crank)*11);ctx.stroke();
    ellipse(x+Math.cos(crank)*11,y-18+Math.sin(crank)*11,3,3,'#493422');
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawLandscape();
    drawMiner();
    for (const item of game ? game.items : previewItems) drawItem(item);
    if (!game) return;

    const hook = game.hook, p = tip(hook);
    ctx.strokeStyle = '#2d2d2d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(PIVOT.x, PIVOT.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    if (hook.item) drawItem(hook.item);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(-hook.angle);
    ctx.strokeStyle = '#3a3f48'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    const open = hook.item ? 0.25 : 0.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-14 * open - 6, 8, -4, 16); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14 * open + 6, 8, 4, 16); ctx.stroke();
    ctx.fillStyle = '#3a3f48'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    for (const s of game.particles) { ctx.globalAlpha = Math.max(0, s.life / 0.6); ctx.fillStyle = s.color; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const popup of game.popups) {
      ctx.globalAlpha = Math.min(1, popup.life * 2);
      ctx.font = '900 22px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = '#3b2717'; ctx.strokeText(popup.text, popup.x - 70, popup.y);
      ctx.fillStyle = '#ffc93c'; ctx.fillText(popup.text, popup.x - 70, popup.y);
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function frame(now) {
    // Clamp dt so hidden-tab pauses do not burn the level timer.
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (game?.state === 'play') update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointerdown', drop);
  dropButton.addEventListener('click', () => { drop(); canvas.focus({preventScroll:true}); });
  els.dynamite.addEventListener('click', useDynamite);
  document.addEventListener('keydown', event => {
    if (game?.state !== 'play') return;
    if ((event.key === ' ' || event.key === 'Enter') && event.target instanceof Element && event.target.closest('button')) return;
    if (event.key === ' ' || event.key === 'ArrowDown' || event.key === 'Enter') { event.preventDefault(); drop(); }
    else if (event.key === 'ArrowUp' || event.key === 'x' || event.key === 'X') { event.preventDefault(); useDynamite(); }
  });
  $('play').addEventListener('click', newGame);

  new ResizeObserver(resize).observe($('stage'));
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
