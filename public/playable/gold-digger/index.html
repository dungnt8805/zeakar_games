<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Digger</title>
<style>
:root { --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --text:#fff1c9; --gold:#ffd447; --side:64px; --gap:10px; --pad:8px; }
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { font-family:var(--font); color:var(--text); background:radial-gradient(ellipse at 50% 20%,#6e4120,#2a160a 75%); overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
button { font:inherit; color:inherit; border:0; cursor:pointer; }
h1,h2,p { margin:0; }
:focus-visible { outline:3px solid #fff3a8; outline-offset:3px; }
[hidden] { display:none !important; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* Portrait: 4:3 world on top, big touch controls below. */
.app { height:100%; display:grid; grid-template-columns:100%; grid-template-rows:auto auto minmax(0,1fr); grid-template-areas:"brand" "stage" "controls"; gap:8px; padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left)); }
.brand { grid-area:brand; display:flex; align-items:center; gap:10px; min-width:0; }
.game-name { flex:1; min-width:0; line-break:strict; font-size:clamp(17px,5.4vw,25px); font-weight:900; letter-spacing:.04em; line-height:1.1; color:var(--gold); text-shadow:0 2px #3a1d08,1px 0 #3a1d08; overflow-wrap:anywhere; }
.record { font-size:12px; font-weight:800; color:#f3d79c; white-space:nowrap; }
.icon-btn { flex:none; width:40px; height:40px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(#7b4a22,#5c3416); border:2px solid #b07a3c; box-shadow:0 3px #2c1708; }
.icon-btn svg { width:22px; height:22px; }
.icon-btn[aria-pressed="false"] .wave { display:none; }
.icon-btn[aria-pressed="true"] .cross { display:none; }
.stage { grid-area:stage; width:100%; aspect-ratio:4/3; max-height:calc(100vh - 170px); min-height:0; display:grid; place-items:center; }
canvas#canvas { display:block; border-radius:6px; touch-action:none; box-shadow:0 0 0 3px #3a1f0c,0 0 0 5px #a8733b,0 8px 22px #0009; cursor:pointer; }
.controls { grid-area:controls; min-height:0; display:grid; grid-template-columns:1fr minmax(96px,34%); grid-template-rows:minmax(56px,150px) auto; align-content:center; gap:10px; }
.drop-button, .dyn-button { position:relative; display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px; border-radius:14px; font-weight:900; line-height:1.15; text-align:center; transition:transform .08s, filter .15s; }
.drop-button { padding:8px 12px; font-size:clamp(16px,4.6vw,22px); color:#4e2a08; background:linear-gradient(#ffe48a,#f0b030 60%,#d68a18); border:3px solid #fff0b0; box-shadow:inset 0 -4px #b8701299,0 5px #7a4510,0 7px 14px #0006; }
.drop-button .arrow { font-size:1.35em; }
.dyn-button { flex-direction:column; gap:2px; padding:6px 8px; font-size:clamp(17px,5vw,24px); color:#fff2dc; background:linear-gradient(#d65a3a,#a8321e); border:3px solid #f2a582; box-shadow:inset 0 -4px #6e1d1088,0 5px #551a0e,0 7px 14px #0006; }
.dyn-button svg { width:30px; height:30px; }
.dyn-button .lbl { font-size:11px; font-weight:800; letter-spacing:.02em; opacity:.92; }
.drop-button:active:not([aria-disabled="true"]), .dyn-button:active:not([aria-disabled="true"]) { transform:translateY(4px); box-shadow:0 1px #3a2008; }
[aria-disabled="true"] { filter:saturate(.35) brightness(.8); cursor:default; }
.control-hint { grid-column:1/-1; text-align:center; font-size:11px; line-height:1.35; color:#e9c48b; }

/* Wide / landscape: world at full height, side columns for brand and controls. */
@media (min-aspect-ratio: 23/20) {
  :root { --side:clamp(64px,9vw,170px); --gap:clamp(6px,1.4vw,18px); }
  .app { grid-template-columns:minmax(var(--side),1fr) auto minmax(var(--side),1fr); grid-template-rows:minmax(0,1fr); grid-template-areas:"brand stage controls"; gap:var(--gap); }
  .stage { aspect-ratio:auto; height:100%; max-height:none; width:min(calc((100vh - 2 * var(--pad)) * 4 / 3), calc(100vw - 2 * var(--side) - 2 * var(--gap) - 2 * var(--pad))); }
  .brand { flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:10px; padding-top:6px; }
  .game-name { flex:none; font-size:clamp(13px,1vw + 5px,24px); letter-spacing:.02em; }
  .record { white-space:normal; font-size:clamp(11px,.5vw + 7px,15px); }
  .controls { grid-template-columns:100%; grid-template-rows:auto auto auto; align-content:center; justify-items:stretch; gap:clamp(8px,2vh,16px); }
  .drop-button { flex-direction:column; gap:4px; height:clamp(64px,30vh,200px); font-size:clamp(12px,.9vw + 6px,22px); padding:6px; }
  .drop-button .arrow { font-size:1.8em; }
  .dyn-button { height:clamp(56px,17vh,120px); }
  .control-hint { font-size:clamp(10px,.4vw + 6px,13px); }
}
@media (min-aspect-ratio: 23/20) and (max-height:420px) { .dyn-button { flex-direction:row; gap:6px; } .dyn-button svg { width:24px; height:24px; flex:none; } }
@media (min-aspect-ratio: 23/20) and (max-width:620px) { .game-name { font-size:11px; letter-spacing:0; } .dyn-button .lbl { display:none; } .icon-btn { width:34px; height:34px; } }

/* Overlays: wooden boards over the whole frame. */
.overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:8px; background:radial-gradient(ellipse at center,#1c0f0566,#0f0702cc); }
.panel { position:relative; width:min(100%,420px); max-height:100%; overflow:auto; padding:22px 20px 20px; border-radius:14px; text-align:center; color:var(--text); background:repeating-linear-gradient(180deg,#0000 0 34px,#00000026 34px 36px),linear-gradient(100deg,#8c5629,#74431e 55%,#83502a); border:3px solid #3a1f0c; box-shadow:inset 0 0 0 3px #c98b3e,inset 0 0 0 5px #5a3214,0 10px 34px #000b; }
.panel .kicker { font-size:11px; font-weight:900; letter-spacing:.16em; color:#f0c06a; margin-bottom:6px; }
.panel h2 { font-size:clamp(23px,6.5vw,34px); font-weight:900; line-height:1.15; color:var(--gold); text-shadow:0 3px #3a1d08; }
.panel p { margin-top:10px; font-size:14px; line-height:1.5; color:#fbe4b4; }
.panel .big { font-size:30px; font-weight:900; color:#9dff7a; text-shadow:0 2px #1f3a0c; }
.legend { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 12px; margin-top:14px; padding:10px 0; border-top:2px dashed #c98b3e88; border-bottom:2px dashed #c98b3e88; }
.legend span { display:grid; justify-items:center; gap:2px; font-size:12px; font-weight:800; color:#ffe7a8; min-width:44px; }
.legend canvas { width:38px; height:38px; }
.btn-main { display:block; width:100%; margin-top:16px; min-height:50px; padding:10px 14px; border-radius:11px; font-size:19px; font-weight:900; color:#4e2a08; background:linear-gradient(#ffe48a,#f0b030 60%,#d68a18); border:2px solid #fff0b0; box-shadow:0 5px #6e3c0e,0 8px 16px #0006; }
.btn-main:active { transform:translateY(4px); box-shadow:0 1px #6e3c0e; }
.badge { display:inline-block; margin-top:10px; padding:4px 14px; border-radius:99px; background:#2f7d1c; color:#eaffd8 !important; font-weight:900; }

/* Shop */
.shop { width:min(100%,780px); max-height:100%; overflow:auto; display:flex; flex-direction:column; border-radius:14px; border:3px solid #3a1f0c; box-shadow:inset 0 0 0 3px #c98b3e,0 10px 34px #000b; background:#5a3416; }
.shop > * { flex:none; }
.shop-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px; background:linear-gradient(#4a2a10,#3a200b); border-radius:11px 11px 0 0; }
.shop-head h2 { font-size:clamp(20px,4vw,28px); font-weight:900; color:var(--gold); text-shadow:0 2px #1d0e03; }
.shop-money { font-size:clamp(18px,3.6vw,26px); font-weight:900; color:#9dff7a; text-shadow:0 2px #102a06; font-variant-numeric:tabular-nums; }
.shop-scene { position:relative; height:clamp(110px,26vh,230px); }
.shop-scene canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.bubble { position:absolute; left:12px; top:10px; max-width:min(58%,360px); padding:9px 13px; border-radius:14px; background:#fffbe9; color:#4a2a0c; font-size:clamp(12px,2.2vw,16px); font-weight:800; line-height:1.3; box-shadow:0 3px 0 #0003; }
.bubble::after { content:''; position:absolute; right:-10px; top:50%; border:8px solid transparent; border-left:12px solid #fffbe9; transform:translateY(-50%); }
.counter { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:12px 10px 10px; background:linear-gradient(#c58a4a,#a26a33 18%,#8a5527); border-top:6px solid #e3b071; box-shadow:inset 0 3px #0002; }
.item-btn { width:clamp(92px,17%,128px); display:grid; justify-items:center; gap:3px; padding:8px 4px 6px; border-radius:10px; background:#fff3d322; border:2px solid #f6d29c55; color:#fff6dc; }
.item-btn:hover:not(:disabled), .item-btn:focus-visible { background:#fff3d344; border-color:#ffe7a8; }
.item-btn canvas { width:52px; height:52px; }
.item-btn .nm { font-size:12px; font-weight:800; line-height:1.2; min-height:2.4em; display:grid; place-items:center; }
.item-btn .price { font-size:15px; font-weight:900; color:#1e5e10; background:#eaffcf; border-radius:6px; padding:1px 8px; }
.item-btn.poor .price { color:#8a1a0a; background:#ffd9cc; }
.item-btn:disabled { opacity:.45; cursor:default; }
.item-btn:disabled .price { text-decoration:line-through; }
.shop-foot { display:flex; align-items:center; justify-content:flex-end; gap:12px; padding:10px 14px 12px; background:#3a200b; border-radius:0 0 11px 11px; }
.shop-foot .btn-main { width:auto; flex:none; margin:0; padding:10px 20px; }

@media (max-height:650px) { .panel { padding:16px 16px 14px; } .panel p { font-size:13px; margin-top:8px; } .legend { margin-top:10px; padding:6px 0; } .btn-main { margin-top:12px; min-height:44px; } }
@media (max-height:440px) { .panel { width:min(100%,560px); padding:10px 14px; } .panel .kicker { display:none; } .panel h2 { font-size:22px; } .panel p { font-size:12px; margin-top:5px; line-height:1.35; } .panel .big { font-size:24px; } .legend { margin-top:6px; padding:4px 0; } .legend canvas { width:28px; height:28px; } .btn-main { margin-top:8px; min-height:40px; padding:6px 12px; font-size:17px; }
  .shop-head { padding:5px 12px; } .shop-scene { height:clamp(64px,20vh,100px); } .bubble { padding:5px 10px; top:6px; } .counter { padding:6px 8px; gap:6px; } .item-btn { padding:4px 3px; width:clamp(84px,17%,120px); } .item-btn canvas { width:34px; height:34px; } .item-btn .nm { font-size:11px; min-height:0; } .item-btn .price { font-size:13px; } .shop-foot { padding:6px 12px; } }
@media (max-width:420px) { .shop-foot { padding:8px 10px; } .shop-foot .btn-main { width:100%; } .shop-scene { height:100px; } .counter { gap:6px; padding:8px 6px; } .item-btn { width:calc(33.3% - 4px); padding:5px 2px; } .item-btn canvas { width:38px; height:38px; } .item-btn .nm { font-size:11px; } .bubble { left:8px; top:8px; max-width:66%; font-size:12px; padding:6px 10px; } }
@media (max-width:360px) { .app { gap:6px; } .panel { padding:14px 12px; } .panel p { font-size:12px; } .legend span { min-width:38px; font-size:11px; } }
@media (prefers-reduced-motion:reduce) { .drop-button, .dyn-button { transition:none; } }
</style>
</head>
<body>
<main class="app">
  <header class="brand">
    <h1 class="game-name" id="game-name">GOLD DIGGER</h1>
    <p class="record" id="record"></p>
    <button type="button" class="icon-btn" id="mute" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#ffe7a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#ffe7a8"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="cross" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
  </header>
  <div class="stage" id="stage"><canvas id="canvas" tabindex="0" role="img"></canvas></div>
  <div class="controls">
    <button type="button" class="drop-button" id="drop" aria-disabled="true"><span class="arrow" aria-hidden="true">▼</span><span id="drop-label"></span></button>
    <button type="button" class="dyn-button" id="dynamite" aria-disabled="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 6c2-3 5-3 7-1" stroke="#3a2a1a" stroke-width="2" fill="none"/><circle cx="27.5" cy="4.5" r="2.6" fill="#ffd447"/><g transform="rotate(35 16 18)"><rect x="9" y="7" width="7" height="22" rx="2" fill="#e8402a" stroke="#5a1408" stroke-width="1.5"/><rect x="16" y="7" width="7" height="22" rx="2" fill="#cf3320" stroke="#5a1408" stroke-width="1.5"/><rect x="8.5" y="15" width="15" height="4" fill="#3b2a1c"/></g></svg><span><span id="dyn-count">0</span></span><span class="lbl" id="dyn-label"></span></button>
    <p class="control-hint" id="control-hint"></p>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <p class="kicker" id="start-kicker"></p>
    <h2 id="start-title"></h2>
    <p id="tagline"></p>
    <div class="legend" id="legend" aria-hidden="true"></div>
    <p id="controls-text"></p>
    <button type="button" class="btn-main" id="play"></button>
  </div>
</div>
<div class="overlay" id="clear" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="clear-title">
    <h2 id="clear-title"></h2>
    <p class="big" id="clear-money"></p>
    <p id="clear-sub"></p>
    <button type="button" class="btn-main" id="to-shop"></button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <h2 id="over-title"></h2>
    <p id="over-text"></p>
    <p class="big" id="over-money"></p>
    <p id="over-sub"></p>
    <p class="badge" id="new-best" hidden></p>
    <button type="button" class="btn-main" id="again"></button>
  </div>
</div>
<div class="overlay" id="shop" hidden>
  <div class="shop" role="dialog" aria-modal="true" aria-labelledby="shop-title">
    <div class="shop-head"><h2 id="shop-title"></h2><span class="shop-money" id="shop-money"></span></div>
    <div class="shop-scene"><canvas id="shop-canvas" aria-hidden="true"></canvas><p class="bubble" id="bubble"></p></div>
    <div class="counter" id="counter"></div>
    <div class="shop-foot"><button type="button" class="btn-main" id="next-level"></button></div>
  </div>
</div>

  function buildLevel(level, needed) {

        return null;
      };
      const many = (n, kind, yMin, yMax) => { for (let i = 0; i < n; i++) place(kind, yMin, yMax); };
      const late = Math.min(level, 10);
      many(level >= 3 ? 1 + (level >= 6) : 0, 'diamond', 380, 590);
      if (level >= 2 && level % 3 === 2) place('diamond', 380, 590);
      many(1 + (level >= 3) + (level >= 7), 'goldXL', 380, 590);
      many(2 + (level >= 4), 'goldL', 300, 575);
      many(4 - (level >= 5), 'goldM', 200, 520);
      many(Math.max(3, 6 - Math.floor(level / 2)), 'goldS', 175, 470);
      many(2 + Math.floor(late / 3), 'rockL', 190, 580);
      many(3 + Math.floor(late / 3), 'rockS', 175, 580);
      many(1 + (level >= 2) + (level >= 5), 'bag', 200, 580);
      many(level >= 3 ? 1 : 0, 'skull', 320, 585);
      many(level >= 3 ? 1 + (level >= 6) : 0, 'bone', 300, 585);
      if (level >= 3) {
        const prize = items.filter(o => o.kind === 'diamond' || o.kind === 'goldXL');
        for (let i = 0; i < 1 + (level >= 5) + (level >= 8); i++) place('tnt', 260, 585, prize[i % Math.max(1, prize.length)]);
      }
      const mice = level >= 2 ? Math.min(1 + Math.floor((level - 2) / 2), 4) : 0;
      for (let i = 0; i < mice; i++) {
        const kind = level >= 4 && Math.random() < 0.5 ? 'mouseD' : 'mouse';
        const m = makeItem(kind, rand(60, W - 60), rand(250, 560));
        m.speed *= 1 + Math.min(level, 10) * 0.04;
        items.push(m);
      }
      const total = items.reduce((sum, it) => sum + valueOf(it, {}), 0);
      if (total >= needed * 1.4) return items;
      if (total > bestTotal) { bestTotal = total; bestItems = items; }
    }
    return bestItems;
  }

  function valueOf(it, fx) {
    const diamond = fx.polish ? 900 : 600;
    if (it.kind === 'rockS' || it.kind === 'rockL') return KINDS[it.kind].value * (fx.book ? 3 : 1);
    if (it.kind === 'diamond') return diamond;
    if (it.kind === 'mouseD') return 2 + diamond;
    if (it.kind === 'bag') return 150;
    return KINDS[it.kind].value;
  }

  function newWorld(level, money) {
    return { level, money, goal: goalFor(level), dynamite: 1, fx: {}, next: {}, items: buildLevel(level, goalFor(level) - money), timeLeft: LEVEL_TIME, swing: rand(0, 6), crank: 0, hook: { state: 'swing', angle: 0, length: REST, item: null }, popups: [], particles: [], rings: [], blasts: [], shake: 0, state: 'demo', moneyAnchor: { x: 120, y: 28 } };
  }
  let game = null;
  const demo = newWorld(1, 0);

  function updateRecord() { setText('record', t.best(Math.max(best, game ? game.money : 0))); }

  function newGame() {
    audio.unlock();
    game = newWorld(1, 0);
    game.startBest = best;
    prepareLevel(true);
  }

  function prepareLevel(fresh) {
    if (!fresh) {
      Object.assign(game, { goal: goalFor(game.level), fx: game.next, next: {}, timeLeft: LEVEL_TIME, swing: rand(0, 6), hook: { state: 'swing', angle: 0, length: REST, item: null }, popups: [], particles: [], rings: [], blasts: [], shake: 0 });
      game.items = buildLevel(game.level, game.goal - game.money);
    }
    game.state = 'ready';
    game.readyT = 2.4;
    game.goalHit = game.money >= game.goal;
    game.lastSec = LEVEL_TIME + 1;
    for (const id of ['start', 'clear', 'over', 'shop']) $(id).hidden = true;
    announce(`${t.level} ${game.level}. ${t.goal} $${game.goal}`);
    updateButtons(); updateRecord();
    canvas.focus({ preventScroll: true });
  }

  function begin() {
    if (game?.state !== 'ready') return;
    game.state = 'play';
    updateButtons();
  }

  const hookTip = hook => ({ x: PIVOT.x + Math.sin(hook.angle) * hook.length, y: PIVOT.y + Math.cos(hook.angle) * hook.length });
  const clawCentre = hook => { const p = hookTip(hook); return { x: p.x + Math.sin(hook.angle) * 19, y: p.y + Math.cos(hook.angle) * 19 }; };

  function fire() {
    audio.unlock();
    if (game?.state === 'ready') { begin(); return; }
    if (game?.state !== 'play' || game.hook.state !== 'swing') return;
    game.hook.state = 'out';
    audio.play('shoot');
    updateButtons();
  }

  function useDynamite() {
    const hook = game?.hook;
    if (game?.state !== 'play' || !game.dynamite || hook.state !== 'back' || !hook.item) return;
    game.dynamite -= 1;
    blast(hook.item.x, hook.item.y, 0);
    hook.item = null;
    updateButtons();
  }

  function burst(x, y, colors, n, speed = 220) {
    if (reduceMotion) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(speed * 0.25, speed);
      game.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: rand(0.4, 0.9), max: 0.9, size: rand(2, 6), color: colors[i % colors.length] });
    }
  }

  // Explosion; radius > 0 also destroys whatever is nearby (TNT barrels).
  function blast(x, y, radius) {
    audio.play('boom');
    burst(x, y, ['#ffe066', '#ff9a2e', '#ff5a1f', '#6b5a4a', '#3b3029'], radius ? 46 : 26, radius ? 320 : 220);
    game.rings.push({ x, y, r: 8, max: radius || 50, life: 0.55 });
    for (let i = 0; i < (radius ? 7 : 4); i++) game.particles.push({ x: x + rand(-20, 20), y: y + rand(-20, 20), vx: rand(-30, 30), vy: rand(-60, -20), life: 1.1, max: 1.1, size: rand(18, 34), color: '#5a4a3c', smoke: true });
    if (!reduceMotion) game.shake = Math.max(game.shake, radius ? 0.45 : 0.25);
    if (!radius) return;
    for (const it of [...game.items]) {
      if (Math.hypot(it.x - x, it.y - y) > radius + it.r * 0.5) continue;
      game.items.splice(game.items.indexOf(it), 1);
      if (it.kind === 'tnt') game.blasts.push({ x: it.x, y: it.y, delay: 0.15 });
      else burst(it.x, it.y, ['#6b5a4a', '#8a7a68', '#3b3029'], 8, 140);
    }
  }

  function grab(it) {
    const hook = game.hook;
    game.items.splice(game.items.indexOf(it), 1);
    hook.state = 'back';
    if (it.kind === 'tnt') { blast(it.x, it.y, 125); return; }
    hook.item = it;
    audio.play('grab');
    updateButtons();
  }

  function addPopup(text, value, x, y, color = '#1f8f14') {
    game.popups.push({ text, value, x, y, sx: x, sy: y, t: 0, color });
  }

  function collect(it) {
    const at = { x: PIVOT.x - 70, y: PIVOT.y - 10 };
    if (it.kind === 'bag') {
      const lucky = !!game.fx.clover, roll = Math.random();
      if (roll < (lucky ? 0.2 : 0.15)) { game.dynamite += 1; addPopup('+1 🧨', 0, at.x, at.y, '#b0300f'); announce('+1 🧨'); audio.play('small'); updateButtons(); return; }
      if (roll < (lucky ? 0.36 : 0.27)) { game.fx.strength = true; addPopup(t.gotStrength, 0, at.x, at.y, '#1d5fbf'); announce(t.gotStrength); audio.play('goal'); return; }
      const value = lucky ? randInt(300, 500 + game.level * 60) : randInt(5, 160 + game.level * 40);
      addPopup(t.got(value), value, at.x, at.y);
      audio.play('cash');
      return;
    }
    const value = valueOf(it, game.fx);
    addPopup(t.got(value), value, at.x, at.y);
    audio.play(value >= 100 ? 'cash' : 'small');
  }

  function bank(p) {
    game.money += p.value;
    if (!game.goalHit && game.money >= game.goal) { game.goalHit = true; audio.play('goal'); announce(t.goalReached); }
    else announce(p.text);
    updateRecord();
  }
  function flushPopups() { for (const p of game.popups) if (p.value && !p.banked) { p.banked = true; bank(p); } game.popups = []; }

  function updateHook(s, dt) {
    const hook = s.hook;
    if (hook.state === 'swing') {
      s.swing += dt * 2.15;
      hook.angle = Math.sin(s.swing) * MAX_SWING;
      return;
    }
    if (hook.state === 'out') {
      let dist = OUT_SPEED * dt;
      while (dist > 0) {
        const step = Math.min(6, dist); dist -= step; hook.length += step;
        const c = clawCentre(hook);
        const hit = s.items.find(it => Math.hypot(it.x - c.x, it.y - c.y) < it.r + 6);
        if (hit) { if (s === game) grab(hit); else hook.state = 'back'; return; }
        if (c.x < -10 || c.x > W + 10 || c.y > H + 10) { hook.state = 'back'; return; }
      }
      return;
    }
    const strong = s.fx.strength ? 1.6 : 1;
    const speed = hook.item ? REEL * strong / hook.item.weight : EMPTY_REEL;
    hook.length -= speed * dt;
    if (hook.item) {
      const c = clawCentre(hook);
      hook.item.x = c.x + Math.sin(hook.angle) * hook.item.r * 0.6;
      hook.item.y = c.y + Math.cos(hook.angle) * hook.item.r * 0.6;
    }
    if (hook.length <= REST) {
      hook.length = REST;
      if (hook.item && s === game) collect(hook.item);
      hook.item = null;
      hook.state = 'swing';
      if (s === game) updateButtons();
    }
  }

  function updateWorld(s, dt) {
    for (const m of s.items) {
      if (!m.speed) continue;
      m.x += m.dir * m.speed * dt;
      if (m.x < m.r * 2 + 6) { m.x = m.r * 2 + 6; m.dir = 1; }
      if (m.x > W - m.r * 2 - 6) { m.x = W - m.r * 2 - 6; m.dir = -1; }
    }
    for (const b of s.blasts) b.delay -= dt;
    const ready = s.blasts.filter(b => b.delay <= 0);
    s.blasts = s.blasts.filter(b => b.delay > 0);
    ready.forEach(b => blast(b.x, b.y, 110));
    for (const p of s.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.smoke ? -20 * dt : 260 * dt; p.life -= dt; }
    s.particles = s.particles.filter(p => p.life > 0);
    for (const r of s.rings) { r.life -= dt; r.r += (r.max * 1.3 - r.r) * Math.min(1, dt * 12); }
    s.rings = s.rings.filter(r => r.life > 0);
    s.shake = Math.max(0, s.shake - dt);
    // "+$500" rises next to the miner, then flies to the money counter.
    for (const p of s.popups) {
      p.t += dt;
      if (p.t < 0.45) p.y = p.sy - p.t * 40;
      else if (p.value) {
        const k = Math.min(1, (p.t - 0.45) / 0.5), e = k * k * (3 - 2 * k);
        p.x = p.sx + (s.moneyAnchor.x - p.sx) * e;
        p.y = p.sy - 18 + (s.moneyAnchor.y - p.sy + 18) * e;
        if (k >= 1 && !p.banked) { p.banked = true; bank(p); }
      } else p.y -= 30 * dt;
    }
    s.popups = s.popups.filter(p => !p.banked && p.t < 1.4);
  }

  function update(dt) {
    if (game.state === 'ready') {
      game.readyT -= dt;
      game.swing += dt * 2.15; game.hook.angle = Math.sin(game.swing) * MAX_SWING;
      if (game.readyT <= 0) begin();
      updateWorld(game, dt);
      return;
    }
    game.timeLeft -= dt;
    const sec = Math.ceil(game.timeLeft);
    if (sec < game.lastSec) { game.lastSec = sec; if (sec <= 10 && sec > 0) audio.play('tick'); }
    updateHook(game, dt);
    updateWorld(game, dt);
    const empty = !game.items.some(it => it.kind !== 'tnt') && game.hook.state === 'swing' && !game.popups.length && !game.blasts.length;
    if (game.timeLeft <= 0 || empty) endLevel();
  }

  function endLevel() {
    game.timeLeft = Math.max(0, game.timeLeft);
    game.hook = { state: 'swing', angle: game.hook.angle, length: REST, item: null };
    flushPopups();
    if (game.money > best) { best = game.money; store.set('best', best); }
    if (game.money >= game.goal) {
      game.state = 'clear';
      setText('clear-title', t.cleared);
      setText('clear-money', `$${game.money}`);
      setText('clear-sub', t.nextGoal(goalFor(game.level + 1)));
      $('clear').hidden = false;
      $('to-shop').focus({ preventScroll: true });
      announce(`${t.cleared} $${game.money}`);
      audio.play('clear');
    } else {
      game.state = 'over';
      const prevLevel = Number(store.get('bestLevel')) || 0;
      if (game.level > prevLevel) store.set('bestLevel', game.level);
      setText('over-title', t.failed);
      setText('over-text', t.failedText);
      setText('over-money', t.failedMoney(game.money, game.goal));
      setText('over-sub', `${t.reached(game.level)} · ${t.best(best)}`);
      $('new-best').hidden = !(best > game.startBest);
      $('over').hidden = false;
      $('again').focus({ preventScroll: true });
      announce(`${t.failed}. ${t.failedMoney(game.money, game.goal)}`);
      audio.play('fail');
    }
    updateButtons(); updateRecord();
  }

  // ---------- Shop ----------
  const SHOP_PRICES = {
    dynamite: l => randInt(15, 70) + l * 12,
    strength: l => randInt(90, 280) + l * 15,
    clover: l => randInt(30, 120) + l * 10,
    book: l => randInt(10, 60) + l * 6,
    polish: l => randInt(160, 420) + l * 25,
  };
  let stock = [];
  const shopCanvas = $('shop-canvas'), shopCtx = shopCanvas.getContext('2d');

  function openShop() {
    game.level += 1;
    // The HUD behind the shop already shows the new level, so show its goal too.
    game.goal = goalFor(game.level);
    game.state = 'shop';
    const ids = Object.keys(SHOP_PRICES).filter(id => id !== 'polish' || game.level >= 3).sort(() => Math.random() - 0.5);
    stock = ids.slice(0, Math.min(ids.length, randInt(3, 5))).map(id => ({ id, price: SHOP_PRICES[id](game.level), sold: false }));
    $('clear').hidden = true;
    $('shop').hidden = false;
    renderShop();
    paintShop();
    const first = $('counter').querySelector('button:not(:disabled)') || $('next-level');
    first.focus({ preventScroll: true });
    setText('bubble', t.welcome);
  }

  function renderShop() {
    setText('shop-money', `$${game.money}`);
    const counter = $('counter');
    counter.textContent = '';
    for (const entry of stock) {
      const [name, desc] = t.items[entry.id];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item-btn' + (game.money < entry.price && !entry.sold ? ' poor' : '');
      btn.disabled = entry.sold;
      btn.dataset.id = entry.id;
      btn.setAttribute('aria-label', t.buy(name, entry.price));
      const icon = document.createElement('canvas');
      icon.width = icon.height = 104;
      const g = icon.getContext('2d'); g.scale(104 / 64, 104 / 64); drawShopIcon(g, entry.id);
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = name;
      const price = document.createElement('span'); price.className = 'price'; price.textContent = `$${entry.price}`;
      btn.append(icon, nm, price);
      const show = () => setText('bubble', desc);
      btn.addEventListener('pointerenter', show);
      btn.addEventListener('focus', show);
      btn.addEventListener('click', () => buy(entry));
      counter.append(btn);
    }
  }

  function buy(entry) {
    if (entry.sold || game.state !== 'shop') return;
    if (game.money < entry.price) { setText('bubble', t.poor); announce(t.poor); audio.play('deny'); return; }
    game.money -= entry.price;
    entry.sold = true;
    if (entry.id === 'dynamite') game.dynamite += 1;
    else game.next[entry.id] = true;
    audio.play('cash');
    renderShop();
    const next = $('counter').querySelector('button:not(:disabled)') || $('next-level');
    next.focus({ preventScroll: true });
    setText('bubble', t.thanks);
    announce(`${t.items[entry.id][0]} · ${t.thanks}`);
    updateRecord();
  }

  function drawShopIcon(g, id) {
    g.save();
    if (id === 'dynamite') {
      [[-0.35, 24], [0, 32], [0.35, 40]].forEach(([a, x]) => drawStick(g, x, 36, a));
      g.fillStyle = '#3b2a1c'; g.fillRect(20, 38, 24, 4);
      sparkle(g, 33, 14, 6, 1.5);
    } else if (id === 'strength') {
      rrect(g, 22, 22, 20, 34, 6); g.fillStyle = '#3fae3a'; g.fill(); g.strokeStyle = '#174d14'; g.lineWidth = 2; g.stroke();
      g.fillStyle = '#9adf7a'; g.fillRect(27, 12, 10, 12); g.strokeRect(27, 12, 10, 12);
      g.fillStyle = '#7a4a1c'; g.fillRect(26, 8, 12, 5);
      rrect(g, 24, 32, 16, 12, 2); g.fillStyle = '#fff3c8'; g.fill();
      g.strokeStyle = '#c4462c'; g.lineWidth = 3; g.beginPath(); g.moveTo(28, 38); g.lineTo(36, 38); g.moveTo(32, 34); g.lineTo(32, 42); g.stroke();
    } else if (id === 'clover') {
      g.strokeStyle = '#2f6b1e'; g.lineWidth = 3; g.beginPath(); g.moveTo(32, 34); g.quadraticCurveTo(36, 48, 30, 58); g.stroke();
      [[0, -10], [10, 0], [0, 10], [-10, 0]].forEach(([dx, dy]) => { ellipse(g, 32 + dx, 30 + dy, 10, 10, '#3fa63a'); ellipse(g, 32 + dx * 0.9, 30 + dy * 0.9, 4, 4, '#7fd36a'); });
      ellipse(g, 32, 30, 4, 4, '#2f7d24');
    } else if (id === 'book') {
      g.save(); g.translate(32, 34); g.rotate(-0.12);
      rrect(g, -20, -18, 40, 36, 3); g.fillStyle = '#7a3a1c'; g.fill(); g.strokeStyle = '#3a1808'; g.lineWidth = 2; g.stroke();
      g.fillStyle = '#f3e3c0'; g.fillRect(16, -15, 3, 30);
      g.restore();
      drawRock(g, { x: 32, y: 34, r: 10, angle: 0, seed: 77, shape: null });
    } else if (id === 'polish') {
      rrect(g, 18, 26, 26, 30, 7); g.fillStyle = '#5f8fd8'; g.fill(); g.strokeStyle = '#1d3c78'; g.lineWidth = 2; g.stroke();
      g.fillStyle = '#d8d8d8'; g.fillRect(25, 15, 12, 12); g.strokeRect(25, 15, 12, 12);
      drawDiamond(g, 31, 40, 8, 1500, 0);
    }
    g.restore();
  }

  function paintShop() {
    const rect = shopCanvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(rect.width * dpr)), h = Math.max(1, Math.round(rect.height * dpr));
    shopCanvas.width = w; shopCanvas.height = h;
    const g = shopCtx;
    // Plank wall.
    const plank = 60 * dpr;
    for (let x = 0, i = 0; x < w; x += plank, i++) {
      g.fillStyle = i % 2 ? '#7a4a24' : '#83522a'; g.fillRect(x, 0, plank, h);
      g.fillStyle = '#00000030'; g.fillRect(x, 0, 2 * dpr, h);
    }
    const s = h / 200;
    g.save(); g.scale(s, s);
    const vw = w / s;
    // Shelves with jars and tools on the left part of the wall.
    for (const y of [70, 140]) {
      g.fillStyle = '#4a2a10'; g.fillRect(0, y, vw * 0.55, 9);
      for (let x = 20, n = y / 70; x < vw * 0.52; x += 46, n++) {
        const k = n % 4;
        if (k === 0) { rrect(g, x, y - 26, 20, 26, 5); g.fillStyle = '#c8e6f088'; g.fill(); ellipse(g, x + 10, y - 10, 6, 6, '#e9b43a'); }
        else if (k === 1) { rrect(g, x, y - 30, 16, 30, 4); g.fillStyle = '#3f9f4a'; g.fill(); g.fillStyle = '#7a4a1c'; g.fillRect(x + 4, y - 36, 8, 7); }
        else if (k === 2) { ellipse(g, x + 12, y - 9, 13, 9, '#a59e92'); ellipse(g, x + 8, y - 12, 4, 2.5, '#ffffff66'); }
        else { g.save(); g.translate(x + 10, y - 2); g.scale(0.7, 0.7); drawStick(g, 0, -12, 0); drawStick(g, 9, -12, 0); g.restore(); }
      }
    }
    // Shopkeeper behind the counter.
    const cx = vw - 90;
    g.fillStyle = '#5e7f9e'; rrect(g, cx - 46, 120, 92, 90, 26); g.fill();
    g.fillStyle = '#f2ead8'; rrect(g, cx - 26, 124, 52, 86, 10); g.fill();
    ellipse(g, cx, 90, 34, 36, '#f0c294');
    ellipse(g, cx - 33, 92, 7, 10, '#e2a878'); ellipse(g, cx + 33, 92, 7, 10, '#e2a878');
    ellipse(g, cx - 28, 72, 10, 14, '#8c8580'); ellipse(g, cx + 28, 72, 10, 14, '#8c8580');
    ellipse(g, cx, 60, 26, 9, '#f6d0a6');
    g.strokeStyle = '#2a2a2a'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(cx - 12, 86, 9, 0, Math.PI * 2); g.moveTo(cx + 21, 86); g.arc(cx + 12, 86, 9, 0, Math.PI * 2); g.moveTo(cx - 3, 86); g.lineTo(cx + 3, 86); g.stroke();
    ellipse(g, cx - 12, 86, 2.5, 2.5, '#1e1612'); ellipse(g, cx + 12, 86, 2.5, 2.5, '#1e1612');
    ellipse(g, cx, 98, 6, 6, '#df9068');
    ellipse(g, cx - 12, 108, 14, 6, '#6a625c', 0.2); ellipse(g, cx + 12, 108, 14, 6, '#6a625c', -0.2);
    g.strokeStyle = '#7a3a1c'; g.lineWidth = 2; g.beginPath(); g.arc(cx, 112, 8, 0.2, Math.PI - 0.2); g.stroke();
    g.restore();
  }

  // ---------- Rendering ----------
  function draw(now) {
    const s = game || demo;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    let ox = 0, oy = 0;
    if (s.shake > 0) { ox = rand(-1, 1) * s.shake * 14; oy = rand(-1, 1) * s.shake * 14; }
    ctx.setTransform(view, 0, 0, view, ox * view, oy * view);
    drawHud(ctx, s);
    drawReelAndMiner(ctx, s, now);
    for (const it of s.items) drawItem(ctx, it, now);
    const hook = s.hook, p = hookTip(hook);
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(PIVOT.x, PIVOT.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    if (hook.item) drawItem(ctx, hook.item, now);
    drawClaw(ctx, p, hook.angle, hook.item ? 0.15 : hook.state === 'out' ? 1 : 0.6);
    for (const r of s.rings) {
      ctx.globalAlpha = Math.max(0, r.life / 0.55);
      ellipse(ctx, r.x, r.y, r.r, r.r, '#fff2a8aa');
      ctx.strokeStyle = '#ff8a2a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }
    for (const q of s.particles) {
      ctx.globalAlpha = Math.max(0, q.life / q.max) * (q.smoke ? 0.55 : 1);
      if (q.smoke) ellipse(ctx, q.x, q.y, q.size * (1.6 - q.life / q.max), q.size * (1.6 - q.life / q.max), q.color);
      else { ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
    }
    ctx.globalAlpha = 1;
    for (const q of s.popups) {
      const fly = q.value && q.t > 0.45;
      ctx.globalAlpha = q.value ? 1 : Math.max(0, Math.min(1, (1.4 - q.t) * 2));
      ctx.font = `900 ${fly ? 30 : 36}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      outlineText(ctx, q.text, q.x, q.y, q.color, 6);
    }
    ctx.globalAlpha = 1;
    if (s.state === 'ready') drawBanner(ctx, s);
  }

  // ---------- Controls ----------
  const dropBtn = $('drop'), dynBtn = $('dynamite');
  function updateButtons() {
    const playing = game?.state === 'play' || game?.state === 'ready';
    const swinging = playing && game.hook.state === 'swing';
    dropBtn.setAttribute('aria-disabled', String(!swinging));
    setText('drop-label', playing && !swinging ? t.reeling : t.drop);
    const canBlast = game?.state === 'play' && game.dynamite > 0 && game.hook.state === 'back' && !!game.hook.item;
    dynBtn.setAttribute('aria-disabled', String(!canBlast));
    setText('dyn-count', String(game ? game.dynamite : 0));
  }

  canvas.addEventListener('pointerdown', event => { if (event.button === 0 || event.pointerType !== 'mouse') fire(); });
  dropBtn.addEventListener('click', fire);
  dynBtn.addEventListener('click', useDynamite);
  document.addEventListener('keydown', event => {
    if (!game || (game.state !== 'play' && game.state !== 'ready')) return;
    const onButton = event.target instanceof Element && event.target.closest('button');
    if (onButton && (event.key === ' ' || event.key === 'Enter')) return;
    if (event.key === ' ' || event.key === 'ArrowDown') { event.preventDefault(); fire(); }
    else if (event.key === 'ArrowUp' || event.key === 'x' || event.key === 'X') { event.preventDefault(); useDynamite(); }
  });
  $('play').addEventListener('click', newGame);
  $('to-shop').addEventListener('click', openShop);
  $('next-level').addEventListener('click', () => { if (game?.state === 'shop') prepareLevel(false); });
  $('again').addEventListener('click', newGame);
  const muteBtn = $('mute');
  muteBtn.setAttribute('aria-pressed', String(!audio.muted));
  muteBtn.addEventListener('click', () => { muteBtn.setAttribute('aria-pressed', String(!audio.toggle())); });

  // Start-panel legend, drawn with the same art as the mine.
  [['goldL', '$50–500'], ['diamond', '$600'], ['rockL', '$11–20'], ['bag', '?'], ['mouseD', '$602'], ['tnt', '💥']].forEach(([kind, label]) => {
    const span = document.createElement('span'), c = document.createElement('canvas');
    c.width = c.height = 76;
    const g = c.getContext('2d'), it = makeItem(kind, 0, 0);
    const r = KINDS[kind].r, k = 28 / (kind === 'mouseD' ? r * 1.5 : r);
    g.translate(kind === 'mouseD' ? 34 : 38, 38); g.scale(k, k); it.angle = 0; if (it.dir) it.dir = 1;
    drawItem(g, it, 1200);
    span.append(c, label);
    $('legend').append(span);
  });

  updateButtons(); updateRecord();
  new ResizeObserver(resize).observe($('stage'));
  new ResizeObserver(() => { if (!$('shop').hidden) paintShop(); }).observe($('shop'));
  resize();

  let last = performance.now();
  function frame(now) {
    // Clamp dt so a hidden tab never burns the level timer.
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!document.hidden) {
      if (game && (game.state === 'play' || game.state === 'ready')) update(dt);
      else if (!game) { updateHook(demo, dt); updateWorld(demo, dt); }
      draw(now);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Read-only state snapshot plus a few helpers for automated tests.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__goldDigger = {
    state: () => game && { state: game.state, level: game.level, money: game.money, goal: game.goal, time: game.timeLeft, dynamite: game.dynamite, fx: { ...game.fx }, next: { ...game.next }, hook: { ...game.hook, item: game.hook.item && game.hook.item.kind }, items: game.items.map(it => ({ kind: it.kind, x: it.x, y: it.y, r: it.r })), popups: game.popups.length },
    aimAt(x, y) { if (!game) return; const a = Math.atan2(x - PIVOT.x, y - PIVOT.y); game.swing = Math.asin(Math.max(-1, Math.min(1, a / MAX_SWING))); game.hook.angle = a; },
    setTime(sec) { if (game) game.timeLeft = sec; },
    stock: () => stock.map(e => ({ ...e })),
    valueOf: kind => valueOf({ kind }, game ? game.fx : {}),
    spawn(kind, x, y) { if (!game) return null; const it = makeItem(kind, x, y); if (it.speed) it.speed = 0; game.items.push(it); return true; },
    clearItems() { if (game) game.items = []; },
    setMoney(m) { if (game) { game.money = m; updateRecord(); } },
  };
})();
</script>
</body>
</html>
