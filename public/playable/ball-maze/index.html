<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ball Maze</title>
<style>
:root {
  --bg: #2c3b2f;
  --ink: #3a2615;
  --text: #fff8ec;
  --muted: #8a6a4d;
  --wood: #e2ad6b;
  --leaf: #4fbf6a;
  --leaf-dark: #2f9149;
  --paper: #fff8ec;
  --star: #f5b324;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(ellipse at top, #46604a, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid #ffd27a; outline-offset: 3px; }

.app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.hud { display: flex; align-items: stretch; gap: 6px; width: 100%; max-width: 520px; margin: 0 auto; }
.stat { flex: 1; min-width: 0; padding: 5px 6px; border-radius: 14px; background: #ffffff1c; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #d9e8d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }
.stat strong.slow { color: #ffb4a2; }
.goal-stars { color: var(--star); font-size: 12px; letter-spacing: 1px; }
.icon-btn { flex: 0 0 auto; min-width: 46px; padding: 0 8px; border-radius: 14px; background: var(--paper); color: var(--ink); font-size: 19px; font-weight: 900; box-shadow: 0 4px 0 #c79a62; }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c79a62; }
.icon-btn[hidden] { display: none; }
.icon-btn[aria-pressed="true"] { background: var(--leaf); color: #fff; box-shadow: 0 4px 0 var(--leaf-dark); }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.frame { position: relative; container-type: size; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 1px #ffffff18, 0 20px 44px #0008; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas:focus-visible { outline: none; }
.frame:has(canvas:focus-visible) { outline: 3px solid #ffd27a99; outline-offset: 3px; }

.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6cqh 6cqw; text-align: center; background: #2a1c0f88; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 320px); max-height: 100%; overflow: auto; padding: 22px 18px; border-radius: 26px; background: var(--paper); color: var(--ink); box-shadow: 0 8px 0 #d9b98a, 0 20px 50px #0007; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.title { font-size: 40px; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.title span { color: var(--leaf-dark); }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
.panel p { margin-top: 8px; font-size: 14px; line-height: 1.45; color: var(--muted); word-break: auto-phrase; }
.picker { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; }
.picker strong { min-width: 7.5em; font-size: 18px; }
.step-btn { width: 40px; height: 40px; border-radius: 50%; background: #f0dfc4; font-size: 18px; font-weight: 900; color: var(--ink); }
.step-btn:disabled { opacity: .35; cursor: default; }
.stars { margin-top: 8px; font-size: 40px; letter-spacing: 6px; color: #e6d6b8; }
.stars b { color: var(--star); }
.result { font-size: 17px !important; font-weight: 800; color: var(--ink) !important; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--star); color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.primary { display: block; width: 100%; margin-top: 16px; padding: 14px; border-radius: 16px; background: var(--leaf); color: #fff; font-size: 19px; font-weight: 900; box-shadow: 0 5px 0 var(--leaf-dark); }
.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--leaf-dark); }
.secondary { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 14px; background: #f0dfc4; color: var(--ink); font-size: 16px; font-weight: 800; }
.hint { font-size: 12px !important; }
.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 8px 16px; border-radius: 99px; background: #3a2615e6; color: #fff; font-size: 15px; font-weight: 800; white-space: nowrap; pointer-events: none; animation: rise .25s ease-out; }
.toast[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Responsive: narrow portrait — HUD labels may wrap instead of being cut. */
@media (max-width: 380px) {
  .hud { gap: 4px; }
  .stat { padding: 4px 3px; border-radius: 12px; }
  .stat small { font-size: 10px; letter-spacing: 0; white-space: normal; overflow: visible; line-height: 1.1; overflow-wrap: anywhere; }
  .stat strong { font-size: 16px; }
  .goal-stars { font-size: 10px; letter-spacing: 0; }
  .icon-btn { min-width: 40px; padding: 0 6px; font-size: 17px; }
  .title { font-size: clamp(28px, 10vw, 40px); }
}
/* Short screens: overlays cover the whole app (not only the narrow board) and scroll. */
@media (max-height: 520px) {
  .frame { container-type: normal; }
  .overlay { position: fixed; padding: 8px; }
  .panel { width: min(100%, 460px); max-height: calc(100% - 4px); overflow-y: auto; padding: 14px 18px; border-radius: 20px; }
  .title { font-size: 30px; }
  .panel h2 { font-size: 22px; }
  .panel p { margin-top: 4px; font-size: 13px; line-height: 1.35; }
  .picker { margin-top: 8px; }
  .stars { margin-top: 2px; font-size: 30px; }
  .primary { margin-top: 10px; padding: 10px; font-size: 18px; }
  .secondary { margin-top: 8px; padding: 8px; font-size: 15px; }
}
/* Landscape / short: HUD becomes a side column so the board can use the full height. */
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .app { display: grid; grid-template-columns: minmax(118px, 168px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 10px; }
  .hud { flex-direction: column; flex-wrap: nowrap; max-width: none; margin: 0; justify-content: center; }
  .stat { flex: 0 0 auto; padding: 5px 6px; }
  .stat small { white-space: normal; letter-spacing: .02em; }
  .hud .icon-btn { min-height: 40px; }
}
</style>
</head>

    };
  }

  const sizeFor = level => { const cols = Math.min(11, 4 + Math.ceil(level * 0.7)); return { cols, rows: Math.min(16, Math.round(cols * 1.5)) }; };

  // Recursive backtracker (iterative, explicit stack): every cell is reachable and there is exactly one path between any two.
  function carve(cols, rows, rnd) {
    const walls = new Array(cols * rows).fill(N | E | S | Wb);
    const seen = new Uint8Array(cols * rows);
    const stack = [0];
    seen[0] = 1;
    while (stack.length) {
      const cur = stack[stack.length - 1], cx = cur % cols, cy = Math.floor(cur / cols);
      const options = [];
      for (const [dx, dy, bit, opp] of DIRS) {
        const nx = cx + dx, ny = cy + dy;
        if (nx >= 0 && ny >= 0 && nx < cols && ny < rows && !seen[ny * cols + nx]) options.push([ny * cols + nx, bit, opp]);
      }
      if (!options.length) { stack.pop(); continue; }
      const [next, bit, opp] = options[Math.floor(rnd() * options.length)];
      walls[cur] &= ~bit;
      walls[next] &= ~opp;
      seen[next] = 1;
      stack.push(next);
    }
    return walls;
  }

  function bfs(walls, cols, rows, from) {
    const dist = new Array(cols * rows).fill(-1), parent = new Array(cols * rows).fill(-1);
    const queue = [from];
    dist[from] = 0;
    for (let i = 0; i < queue.length; i++) {
      const cur = queue[i], cx = cur % cols, cy = Math.floor(cur / cols);
      for (const [dx, dy, bit] of DIRS) {
        if (walls[cur] & bit) continue;
        const n = (cy + dy) * cols + cx + dx;
        if (dist[n] < 0) { dist[n] = dist[cur] + 1; parent[n] = cur; queue.push(n); }
      }
    }
    return { dist, parent };
  }

  function buildLevel(level) {
    const rnd = seeded(level * 7919 + 1013);
    const { cols, rows } = sizeFor(level);
    const c = Math.min((W - MARGIN * 2) / cols, (H - MARGIN * 2) / rows);
    const ox = (W - c * cols) / 2, oy = (H - c * rows) / 2;
    // Re-roll a few times (deterministically) so every level has a properly winding route.
    let walls, dist, parent, goal;
    for (let attempt = 0; attempt < 10; attempt++) {
      const w = carve(cols, rows, rnd);
      const r = bfs(w, cols, rows, 0);
      // The goal is the farthest cell (by path) within the bottom rows of the board.
      const goalScore = i => r.dist[i] + (Math.floor(i / cols) >= rows * 0.7 ? 1000 : 0);
      let gi = 0;
      for (let i = 1; i < r.dist.length; i++) if (goalScore(i) > goalScore(gi)) gi = i;
      if (!walls || r.dist[gi] > dist[goal]) ({ dist, parent } = r), walls = w, goal = gi;
      if (dist[goal] >= cols * rows * 0.4) break;
    }
    const path = new Set();
    for (let i = goal; i >= 0; i = parent[i]) path.add(i);
    const center = i => ({ x: ox + (i % cols + 0.5) * c, y: oy + (Math.floor(i / cols) + 0.5) * c });

    // Merge collinear wall edges into long bars so joints don't show seams.
    const half = Math.max(2, c * 0.07);
    const rects = [];
    const hasH = (x, j) => j < rows ? walls[j * cols + x] & N : walls[(j - 1) * cols + x] & S;
    const hasV = (i, y) => i < cols ? walls[y * cols + i] & Wb : walls[y * cols + i - 1] & E;
    for (let j = 0; j <= rows; j++) for (let x = 0; x < cols; x++) {
      if (!hasH(x, j)) continue;
      let end = x;
      while (end + 1 < cols && hasH(end + 1, j)) end++;
      rects.push({ x: ox + x * c - half, y: oy + j * c - half, w: (end - x + 1) * c + half * 2, h: half * 2 });
      x = end;
    }
    for (let i = 0; i <= cols; i++) for (let y = 0; y < rows; y++) {
      if (!hasV(i, y)) continue;
      let end = y;
      while (end + 1 < rows && hasV(i, end + 1)) end++;
      rects.push({ x: ox + i * c - half, y: oy + y * c - half, w: half * 2, h: (end - y + 1) * c + half * 2 });
      y = end;
    }

    const holes = [];
    if (level >= 3) {
      // Dead-end side branches next to the true path are the most tempting places to overshoot into.
      const nearPath = i => DIRS.some(([dx, dy, bit]) => !(walls[i] & bit) && path.has(i + dy * cols + dx));
      const candidates = [];
      for (let i = 0; i < walls.length; i++) if (!path.has(i) && dist[i] >= 2) candidates.push({ i, w: (nearPath(i) ? 1 : 0) + rnd() });
      candidates.sort((a, b) => b.w - a.w);
      const count = Math.min(candidates.length, 2 + Math.floor((level - 3) * 1.5), 16);
      for (const { i } of candidates.slice(0, count)) holes.push({ ...center(i), r: c * 0.3 });
    }
    if (level >= 5) {
      // On turning path cells, a smaller hole sits in the outer corner, punishing wide racing lines.
      const corners = [];
      for (const i of path) {
        if (i === 0 || i === goal) continue;
        const open = DIRS.filter(([, , bit]) => !(walls[i] & bit)).map(d => d[2]);
        if (open.length !== 2 || (open[0] | open[1]) === (N | S) || (open[0] | open[1]) === (E | Wb)) continue;
        const sx = open.includes(E) ? 0.27 : 0.73, sy = open.includes(S) ? 0.27 : 0.73;
        corners.push({ x: ox + (i % cols + sx) * c, y: oy + (Math.floor(i / cols) + sy) * c, r: c * 0.2, k: rnd() });
      }
      corners.sort((a, b) => a.k - b.k);
      for (const h of corners.slice(0, Math.min(level - 4, 8))) holes.push({ x: h.x, y: h.y, r: h.r });
    }
    const pathLen = dist[goal];
    return { level, cols, rows, c, ox, oy, walls, rects, holes, start: center(0), goal: center(goal), par: Math.round(pathLen / 2.6 + 3), pathLen };
  }

  let game, scale = 1, acc = 0, last = performance.now(), pickLevel = save.level;
  const input = { keys: { up: false, down: false, left: false, right: false }, joy: null, tilt: null, tiltOn: false, tiltBase: null };

  function setupLevel(level) {
    const m = buildLevel(level);
    game = { ...m, state: 'ready', time: 0, falls: 0, ball: { x: m.start.x, y: m.start.y, vx: 0, vy: 0, z: 1, roll: 0 }, fx: 0, sinkFrom: null };
    els.level.textContent = String(level);
    els.par.textContent = `${m.par}s`;
    els.time.textContent = '0.0';
    els.time.classList.remove('slow');
  }

  // ---------- physics ----------
  function inputVector() {
    let x = (input.keys.right ? 1 : 0) - (input.keys.left ? 1 : 0), y = (input.keys.down ? 1 : 0) - (input.keys.up ? 1 : 0);
    if (input.joy) { x += input.joy.dx / JOY_R; y += input.joy.dy / JOY_R; }
    if (input.tiltOn && input.tilt) { x += input.tilt.x; y += input.tilt.y; }
    const len = Math.hypot(x, y);
    return len > 1 ? { x: x / len, y: y / len } : { x, y };
  }

  function collide(b, r) {
    for (const w of game.rects) {
      if (b.x + r < w.x || b.x - r > w.x + w.w || b.y + r < w.y || b.y - r > w.y + w.h) continue;
      const nx = Math.max(w.x, Math.min(b.x, w.x + w.w)), ny = Math.max(w.y, Math.min(b.y, w.y + w.h));
      let dx = b.x - nx, dy = b.y - ny;
      const d = Math.hypot(dx, dy);
      if (d >= r) continue;
      if (d < 1e-6) { dx = 0; dy = -1; } else { dx /= d; dy /= d; }
      b.x += dx * (r - d);
      b.y += dy * (r - d);
      const vn = b.vx * dx + b.vy * dy;
      if (vn < 0) {
        // Bounce off the wall with a little energy loss.
        b.vx -= 1.35 * vn * dx;
        b.vy -= 1.35 * vn * dy;
        if (-vn > game.c * 2.5) game.fx = Math.min(1, -vn / (game.c * 8));
      }
    }
  }

  function step(dt) {
    const g = game, b = g.ball, c = g.c;
    g.fx = Math.max(0, g.fx - dt * 4);
    if (g.state === 'falling' || g.state === 'sinking') {
      b.z -= dt * 2.4;
      if (g.sinkFrom) { b.x += (g.sinkFrom.x - b.x) * Math.min(1, dt * 12); b.y += (g.sinkFrom.y - b.y) * Math.min(1, dt * 12); }
      if (b.z <= 0) {
        if (g.state === 'sinking') return win();
        Object.assign(b, { x: g.start.x, y: g.start.y, vx: 0, vy: 0, z: 1 });
        g.state = 'play';
        g.sinkFrom = null;
      }
      if (g.state === 'falling') g.time += dt;
      return;
    }
    if (g.state !== 'play') return;
    g.time += dt;
    const v = inputVector();
    const acc = c * 15, maxV = c * 7.5, r = c * 0.26;
    b.vx += v.x * acc * dt;
    b.vy += v.y * acc * dt;
    const damp = Math.exp(-1.3 * dt);
    b.vx *= damp; b.vy *= damp;
    for (const h of g.holes) {
      // Holes have a gentle slope: the ball is pulled in once it rolls over the rim.
      const dx = h.x - b.x, dy = h.y - b.y, d = Math.hypot(dx, dy);
      if (d < h.r && d > 0.001) { const pull = c * 22 * (1 - d / h.r); b.vx += dx / d * pull * dt; b.vy += dy / d * pull * dt; }
    }
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > maxV) { b.vx *= maxV / sp; b.vy *= maxV / sp; }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.roll += sp * dt / r;
    collide(b, r);
    collide(b, r);
    for (const h of g.holes) {
      if (Math.hypot(h.x - b.x, h.y - b.y) < h.r * 0.72) {
        g.state = 'falling';
        g.falls += 1;
        g.sinkFrom = { x: h.x, y: h.y };
        b.vx = b.vy = 0;
        showToast(t.fell);
        announce(t.fell);
        return;
      }
    }
    if (Math.hypot(g.goal.x - b.x, g.goal.y - b.y) < c * 0.24) {
      g.state = 'sinking';
      g.sinkFrom = { x: g.goal.x, y: g.goal.y };
      b.vx = b.vy = 0;
    }
  }

  // ---------- flow ----------
  function updateStartPanel() {
    els.pickLevel.textContent = t.levelN(pickLevel);
    els.prev.disabled = pickLevel <= 1;
    els.nextPick.disabled = pickLevel >= save.level;
    const total = Object.values(save.stars).reduce((a, b) => a + b, 0);
    els.totalStars.textContent = total ? t.totalStars(total) : '';
  }

  function showStart() {
    pickLevel = save.level;
    setupLevel(pickLevel);
    updateStartPanel();
    els.start.hidden = false;
    els.won.hidden = true;
    els.paused.hidden = true;
    els.play.focus({ preventScroll: true });
  }

  function pick(delta) {
    pickLevel = Math.max(1, Math.min(save.level, pickLevel + delta));
    setupLevel(pickLevel);
    updateStartPanel();
  }

  function begin(level) {
    setupLevel(level);
    els.start.hidden = true;
    els.won.hidden = true;
    game.state = 'play';
    canvas.focus({ preventScroll: true });
    announce(t.go(level));
    showToast(game.holes.length && level >= 3 && level <= 4 ? t.holes : t.levelN(level));
  }

  function starsFor(time, par) { return time <= par ? 3 : time <= par * 1.5 ? 2 : 1; }

  function win() {
    const g = game;
    g.state = 'won';
    const time = Math.round(g.time * 10) / 10;
    const stars = starsFor(time, g.par);
    const prevTime = save.times[g.level];
    const record = prevTime !== undefined && time < prevTime;
    save.stars[g.level] = Math.max(save.stars[g.level] || 0, stars);
    if (prevTime === undefined || time < prevTime) save.times[g.level] = time;
    save.level = Math.max(save.level, g.level + 1);
    writeJSON(STARS_KEY, save.stars);
    writeJSON(TIMES_KEY, save.times);
    writeJSON(LEVEL_KEY, save.level);
    els.wonTitle.textContent = t.cleared(g.level);
    els.stars.innerHTML = '';
    for (let i = 0; i < 3; i++) { const s = document.createElement(i < stars ? 'b' : 'span'); s.textContent = '★'; els.stars.append(s); }
    els.stars.setAttribute('aria-label', t.starsAria(stars));
    els.result.textContent = t.timeResult(time.toFixed(1));
    els.falls.textContent = t.fallsN(g.falls);
    els.record.hidden = !record;
    els.won.hidden = false;
    announce(`${t.cleared(g.level)} ${t.starsAria(stars)}. ${t.timeResult(time.toFixed(1))}`);
    els.next.focus({ preventScroll: true });
  }

  function pause() {
    if (game.state !== 'play' && game.state !== 'falling') return;
    game.resumeTo = game.state;
    game.state = 'paused';
    els.paused.hidden = false;
    input.joy = null;
  }

  function resume() {
    if (game.state !== 'paused') return;
    game.state = game.resumeTo || 'play';
    els.paused.hidden = true;
    canvas.focus({ preventScroll: true });
  }

  function showToast(text) {
    els.toast.textContent = text;
    els.toast.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => { els.toast.hidden = true; }, 1400);
  }

  // ---------- drawing ----------
  function drawBoard() {
    const g = game;
    const wood = ctx.createLinearGradient(0, 0, W, H);
    wood.addColorStop(0, '#e9b877');
    wood.addColorStop(1, '#d69a57');
    ctx.fillStyle = wood;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#b97c3f33';
    ctx.lineWidth = 1.2;
    for (let y = 8; y < H; y += 17) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      for (let x = 0; x <= W; x += 30) ctx.lineTo(x, y + Math.sin(x / 47 + y * 0.31) * 3);
      ctx.stroke();
    }
    ctx.fillStyle = '#00000014';
    ctx.fillRect(g.ox, g.oy, g.c * g.cols, g.c * g.rows);
  }

  function drawHole(h) {
    const grad = ctx.createRadialGradient(h.x - h.r * 0.2, h.y - h.r * 0.25, h.r * 0.1, h.x, h.y, h.r);
    grad.addColorStop(0, '#000000');
    grad.addColorStop(0.75, '#1d1209');
    grad.addColorStop(1, '#5a3a1d');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a06a35';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
  }

  function drawGoal(time) {
    const g = game, r = g.c * 0.34;
    ctx.fillStyle = '#4fbf6a55';
    ctx.beginPath(); ctx.arc(g.goal.x, g.goal.y, r * (1.25 + (reducedMotion ? 0 : Math.sin(time * 4) * 0.1)), 0, TAU); ctx.fill();
    const grad = ctx.createRadialGradient(g.goal.x, g.goal.y, 1, g.goal.x, g.goal.y, r);
    grad.addColorStop(0, '#0d3a1a');
    grad.addColorStop(0.8, '#1f6b34');
    grad.addColorStop(1, '#4fbf6a');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(g.goal.x, g.goal.y, r, 0, TAU); ctx.fill();
  }

  function fillRects(color, dx, dy, maxH) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (const w of game.rects) ctx.rect(w.x + dx, w.y + dy, w.w, maxH ? Math.min(w.h, maxH) : w.h);
    ctx.fill();
  }

  function drawFlag() {
    const g = game, r = g.c * 0.34;
    ctx.strokeStyle = '#fff8ec';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(g.goal.x, g.goal.y); ctx.lineTo(g.goal.x, g.goal.y - r * 1.5); ctx.stroke();
    ctx.fillStyle = '#ff5d5d';
    ctx.beginPath(); ctx.moveTo(g.goal.x, g.goal.y - r * 1.5); ctx.lineTo(g.goal.x + r * 0.9, g.goal.y - r * 1.25); ctx.lineTo(g.goal.x, g.goal.y - r); ctx.fill();
  }

  function drawWalls() {
    fillRects('#00000030', 2, 3);
    fillRects('#7b4a22', 0, 0);
    fillRects('#a8703c', 0, 0, 2);
  }

  function drawBall() {
    const g = game, b = g.ball, r = g.c * 0.26 * Math.max(0, b.z);
    if (r <= 0.2) return;
    ctx.fillStyle = '#00000038';
    ctx.beginPath(); ctx.ellipse(b.x + r * 0.25, b.y + r * 0.35, r, r * 0.9, 0, 0, TAU); ctx.fill();
    const grad = ctx.createRadialGradient(b.x - r * 0.35, b.y - r * 0.4, r * 0.1, b.x, b.y, r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.35, '#c9d3dc');
    grad.addColorStop(1, '#5d6b78');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
    // A rolling stripe sells the motion.
    ctx.strokeStyle = '#ffffff55';
    ctx.lineWidth = Math.max(1, r * 0.14);
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.62, b.roll, b.roll + 1.2); ctx.stroke();
  }

  function drawJoystick() {
    if (!input.joy) return;
    const j = input.joy;
    ctx.fillStyle = '#ffffff30';
    ctx.strokeStyle = '#ffffff99';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(j.ox, j.oy, JOY_R, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff8ecdd';
    ctx.beginPath(); ctx.arc(j.ox + j.dx, j.oy + j.dy, 18, 0, TAU); ctx.fill();
  }

  function draw(time = 0) {
    if (!game) return;
    ctx.save();
    if (game.fx > 0 && !reducedMotion) ctx.translate((Math.random() - 0.5) * game.fx * 4, (Math.random() - 0.5) * game.fx * 4);
    drawBoard();
    for (const h of game.holes) drawHole(h);
    drawGoal(time / 1000);
    drawWalls();
    drawFlag();
    drawBall();
    ctx.restore();
    drawJoystick();
  }

  function updateHud() {
    els.time.textContent = game.time.toFixed(1);
    els.time.classList.toggle('slow', game.time > game.par);
  }

  function resize() {
    const stage = $('stage').getBoundingClientRect();
    scale = Math.min(stage.width / W, stage.height / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    els.frame.style.width = `${W * scale}px`;
    els.frame.style.height = `${H * scale}px`;
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    draw(performance.now());
  }

  function frame(time) {
    // Clamp dt so a stalled frame never teleports the ball or burns the timer.
    const dt = Math.min(0.05, Math.max(0, (time - last) / 1000));
    last = time;
    if (!document.hidden) {
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      if (game.state === 'play' || game.state === 'falling') updateHud();
      draw(time);
    }
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  const toWorld = event => { const rect = canvas.getBoundingClientRect(); return { x: (event.clientX - rect.left) / scale, y: (event.clientY - rect.top) / scale }; };
  canvas.addEventListener('pointerdown', event => {
    event.preventDefault();
    if (game.state === 'paused') return resume();
    canvas.setPointerCapture(event.pointerId);
    const p = toWorld(event);
    input.joy = { id: event.pointerId, ox: p.x, oy: p.y, dx: 0, dy: 0 };
  });
  canvas.addEventListener('pointermove', event => {
    if (!input.joy || input.joy.id !== event.pointerId) return;
    const p = toWorld(event);
    let dx = p.x - input.joy.ox, dy = p.y - input.joy.oy;
    const d = Math.hypot(dx, dy);
    if (d > JOY_R) { dx *= JOY_R / d; dy *= JOY_R / d; }
    input.joy.dx = dx; input.joy.dy = dy;
  });
  const endJoy = event => { if (input.joy && input.joy.id === event.pointerId) input.joy = null; };
  canvas.addEventListener('pointerup', endJoy);
  canvas.addEventListener('pointercancel', endJoy);

  const KEY_DIRS = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    const dir = KEY_DIRS[event.key];
    if (!dir || (event.target instanceof Element && event.target.closest('button'))) return;
    event.preventDefault();
    input.keys[dir] = true;
    if (game.state === 'paused') resume();
  });
  document.addEventListener('keyup', event => { const dir = KEY_DIRS[event.key]; if (dir) input.keys[dir] = false; });
  window.addEventListener('blur', () => { for (const k in input.keys) input.keys[k] = false; input.joy = null; });

  function onOrientation(event) {
    if (event.beta == null || event.gamma == null) return;
    if (!input.tiltBase) input.tiltBase = { beta: event.beta, gamma: event.gamma };
    let x = (event.gamma - input.tiltBase.gamma) / 18, y = (event.beta - input.tiltBase.beta) / 18;
    // Rotate the tilt into screen space when the device is held sideways.
    const angle = (screen.orientation && screen.orientation.angle) || 0;
    if (angle === 90) [x, y] = [y, -x];
    else if (angle === 270 || angle === -90) [x, y] = [-y, x];
    else if (angle === 180) [x, y] = [-x, -y];
    input.tilt = { x: Math.max(-1, Math.min(1, x)), y: Math.max(-1, Math.min(1, y)) };
  }

  async function toggleTilt() {
    if (input.tiltOn) {
      input.tiltOn = false;
      window.removeEventListener('deviceorientation', onOrientation);
      els.tilt.setAttribute('aria-pressed', 'false');
      showToast(t.tiltOff);
      return;
    }
    try {
      // iOS needs an explicit permission prompt triggered by a user gesture.
      if (typeof DeviceOrientationEvent.requestPermission === 'function' && await DeviceOrientationEvent.requestPermission() !== 'granted') throw new Error('denied');
    } catch {
      showToast(t.tiltDenied);
      announce(t.tiltDenied);
      return;
    }
    input.tiltOn = true;
    input.tiltBase = null;
    input.tilt = null;
    window.addEventListener('deviceorientation', onOrientation);
    els.tilt.setAttribute('aria-pressed', 'true');
    showToast(t.tiltOn);
    announce(t.tiltOn);
  }

  if ('DeviceOrientationEvent' in window && matchMedia('(pointer: coarse)').matches) els.tilt.hidden = false;
  els.tilt.addEventListener('click', toggleTilt);
  els.restart.addEventListener('click', () => { if (game.state === 'ready') return; begin(game.level); });
  els.prev.addEventListener('click', () => pick(-1));
  els.nextPick.addEventListener('click', () => pick(1));
  els.play.addEventListener('click', () => begin(pickLevel));
  els.resume.addEventListener('click', resume);
  els.next.addEventListener('click', () => begin(game.level + 1));
  els.replay.addEventListener('click', () => begin(game.level));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pause();
    last = performance.now();
    acc = 0;
  });

  showStart();
  new ResizeObserver(resize).observe($('stage'));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
