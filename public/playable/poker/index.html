<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker</title>
<style>
:root {
  --bg: #0a1622;
  --felt: #17577f;
  --felt-dark: #0b2f4a;
  --rail: #6b3d22;
  --rail-light: #9a5f37;
  --text: #f3f6fa;
  --muted: #a9c3d8;
  --gold: #f6c95b;
  --gold-dark: #b98a22;
  --win: #46d483;
  --lose: #ff6b6b;
  --red: #d22a3f;
  --ink: #1b2130;
  --plate: linear-gradient(#20405c, #11263a);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: radial-gradient(120% 70% at 50% 0%, #15314a, var(--bg) 70%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.sr-only { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; max-width: 560px; margin: auto; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
@media (min-aspect-ratio: 5/4) { .app { max-width: 1120px; } }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; min-width: 0; font-size: clamp(21px, 6.4vw, 28px); font-weight: 900; letter-spacing: -.03em; line-height: 1; color: var(--gold); text-shadow: 0 2px 0 #0006; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; background: #00000040; font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.pill:hover { color: var(--gold); }
.pill svg { width: 16px; height: 16px; flex-shrink: 0; }
.icon { width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; background: #00000040; font-size: 16px; font-weight: 900; color: var(--muted); }
.icon:hover { color: var(--gold); }
.icon svg { width: 18px; height: 18px; }

.hud { display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 4px 4px 5px; border-radius: 12px; background: #00000038; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.bank strong { color: var(--gold); }
.stat.bump strong { animation: bump .35s; }
@keyframes bump { 40% { scale: 1.18; } }

/* The felt box is only a positioning frame; the oval table, seats, bets and board are placed in it by layout(). */
.felt { --cw: 56px; --mw: 28px; --bw: 44px; --sw: 88px; flex: 1; min-height: 0; position: relative; }
.oval { position: absolute; border-radius: 999px; border: 8px solid var(--rail); background: radial-gradient(#ffffff08 1px, transparent 1.5px) 0 0 / 5px 5px, radial-gradient(90% 80% at 50% 35%, #2378a8, var(--felt) 50%, var(--felt-dark)); box-shadow: inset 0 0 0 2px #00000030, inset 0 0 50px #0007, 0 0 0 2px var(--rail-light), 0 14px 30px #0008; }
.oval::after { content: ""; position: absolute; inset: 7%; border-radius: inherit; border: 1.5px solid #f6c95b2e; }

.card { position: relative; flex: none; width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1); background: linear-gradient(#fff, #f6f2ea); color: var(--ink); box-shadow: 0 1px 2px #0007, 0 0 0 .5px #0003; transition: translate .25s, filter .25s, box-shadow .25s; }
.card.red { color: var(--red); }
.ci { position: absolute; left: 7%; top: 4%; display: flex; flex-direction: column; align-items: center; font-weight: 900; line-height: .95; font-size: calc(var(--cw) * .3); letter-spacing: -.08em; }
.ci i { font-style: normal; font-size: .82em; letter-spacing: 0; }
.cs { position: absolute; inset: 0; display: grid; place-items: center; padding: 18% 0 0 16%; font-size: calc(var(--cw) * .55); line-height: 1; }
.cs.face { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: calc(var(--cw) * .5); }
.cs.face::after { content: ""; position: absolute; left: 32%; right: 12%; top: 28%; bottom: 10%; border-radius: calc(var(--cw) * .06); border: 1.5px solid currentColor; opacity: .25; }
.card.down { background: repeating-linear-gradient(45deg, #ffffff26 0 2px, transparent 2px 7px), repeating-linear-gradient(-45deg, #ffffff26 0 2px, transparent 2px 7px), linear-gradient(160deg, #e2574c, #a8302e); box-shadow: inset 0 0 0 calc(var(--cw) * .06) #fff, 0 1px 2px #0007; }
.card.down > * { display: none; }
.card.deal { animation: deal .28s cubic-bezier(.2, .8, .3, 1) backwards; }
.card.flip { animation: flip .3s ease-out; }
.card.hl { translate: 0 calc(var(--cw) * -.12); box-shadow: 0 0 0 2px var(--gold), 0 0 16px var(--gold), 0 2px 4px #0008; }
.card.dim { filter: brightness(.5) saturate(.6); }
@keyframes deal { from { opacity: 0; transform: translateY(calc(var(--cw) * -1.2)) rotate(-10deg) scale(.6); } }
@keyframes flip { from { transform: scaleX(0); } }

.center { position: absolute; z-index: 5; left: 50%; top: 50%; translate: -50% -50%; display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; }
.pot { display: flex; align-items: center; gap: 6px; padding: 3px 12px 3px 4px; border-radius: 99px; background: #00000066; font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pot small { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pot.empty { visibility: hidden; }
.pot { position: relative; }
.sides { position: absolute; left: 50%; bottom: 100%; translate: -50% 0; margin-bottom: 4px; width: max-content; max-width: var(--smax, 240px); white-space: normal; font-size: 10.5px; font-weight: 800; line-height: 1.3; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.center.showing .pot { visibility: hidden; }
.board { display: flex; gap: calc(var(--bw) * .1); }
.board .card { --cw: var(--bw); }
.slot { flex: none; width: var(--bw); height: calc(var(--bw) * 1.4); border-radius: calc(var(--bw) * .1); border: 1.5px dashed #ffffff24; }
.banner { position: absolute; bottom: calc(100% - 22px); z-index: 6; max-width: var(--bmax, 260px); padding: 5px 14px; border-radius: 14px; background: #10243af2; box-shadow: 0 0 0 1.5px var(--gold), 0 6px 16px #0009; text-align: center; font-size: 13px; font-weight: 900; line-height: 1.3; color: var(--gold); animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.banner small { display: block; font-size: 11.5px; font-weight: 800; color: var(--text); }
.banner[hidden] { display: none; }
@keyframes pop { from { scale: .3; opacity: 0; } }

.seat { position: absolute; left: 0; top: 0; width: var(--sw); translate: -50% -50%; display: flex; flex-direction: column; align-items: center; transition: opacity .4s; }
.seat.gone { opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
.mini { --cw: var(--mw); position: relative; z-index: 0; display: flex; justify-content: center; height: calc(var(--mw) * .9); }
.mini .card:first-child { rotate: -7deg; }
.mini .card + .card { margin-left: calc(var(--cw) * -.55); rotate: 7deg; }
.seat.shown .mini { --cw: calc(var(--mw) * 1.22); height: calc(var(--mw) * 1.15); }
.seat.shown .mini .card + .card { margin-left: calc(var(--cw) * -.32); }
.plate { position: relative; z-index: 1; width: 100%; min-height: 36px; display: flex; align-items: center; gap: 5px; padding: 4px 6px 4px 4px; border-radius: 12px; background: var(--plate); box-shadow: 0 0 0 1.5px #ffffff22, 0 4px 10px #0007; transition: box-shadow .2s, opacity .3s; }
.av { width: 28px; height: 28px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: #ffffff1c; font-size: 17px; line-height: 1; }
.who { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.18; }
.who .nm { font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .sty { display: none; font-size: 10px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.felt.wide:not(.short) .who .sty { display: block; }
.who b { font-size: 12.5px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { position: absolute; left: 50%; bottom: -9px; z-index: 2; translate: -50% 0; padding: 1px 7px; border-radius: 99px; background: #dfe6ee; color: var(--ink); font-size: 10px; font-weight: 900; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.tag:empty { display: none; }
.tag.st-fold { background: #5b6675; color: #dfe6ee; }
.tag.st-bet, .tag.st-raise { background: var(--gold); color: #2b1f04; }
.tag.st-allin { background: var(--lose); color: #fff; }
.tag.st-win { background: var(--win); color: #062a17; }
.tag.st-sb, .tag.st-bb { background: #ffffff2e; color: var(--text); }
.tag.pop { animation: pop .3s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.dots { position: absolute; right: 5px; top: -8px; display: none; gap: 3px; padding: 4px 6px; border-radius: 99px; background: var(--gold); }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: #2b1f04; animation: dot 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 30% { translate: 0 -3px; opacity: .5; } }
.seat.thinking .dots { display: flex; }
.seat.turn .plate, .myplate.turn { box-shadow: 0 0 0 2px var(--gold), 0 0 16px #f6c95b77; }
.seat.thinking .plate { animation: glow 1s infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 0 2px var(--gold), 0 0 22px #f6c95baa; } }
.seat.folded .plate { opacity: .5; }
.seat.won .plate, .myplate.won { box-shadow: 0 0 0 2px var(--win), 0 0 18px #46d48399; }

.me { position: absolute; left: 50%; top: 0; translate: -50% 0; display: flex; flex-direction: column; align-items: center; }
.me .hand { display: flex; justify-content: center; height: calc(var(--cw) * 1.4); }
.me .hand .card:first-child { rotate: -4deg; }
.me .hand .card + .card { margin-left: calc(var(--cw) * -.22); rotate: 4deg; }
.me.folded .hand { opacity: .45; }
.myplate { position: relative; z-index: 1; margin-top: -8px; width: var(--pw, 200px); padding: 5px 12px 6px; border-radius: 14px; background: var(--plate); box-shadow: 0 0 0 1.5px #ffffff22, 0 4px 10px #0007; text-align: center; transition: box-shadow .2s; }
.myplate .l1 { display: flex; justify-content: center; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 900; white-space: nowrap; }
.myplate .l1 b { color: var(--gold); font-variant-numeric: tabular-nums; }
.myplate .l2 { min-height: 16px; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.myplate .l2 span { overflow: hidden; text-overflow: ellipsis; }
.odds { flex-shrink: 0; padding: 0 6px; border-radius: 99px; background: #46d48333; color: var(--win); font-variant-numeric: tabular-nums; }
.odds:empty { display: none; }
.myplate .tag { bottom: auto; top: -10px; }

.bet { position: absolute; left: 0; top: 0; z-index: 6; translate: -50% -50%; display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border-radius: 99px; background: #00000073; font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bet[hidden] { display: none; }
.felt.compact .bet { gap: 3px; padding-right: 6px; font-size: 11px; }
.felt.compact .bet .chip.sm { width: 15px; height: 15px; }
.bet.pop { animation: pop .3s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.dbtn { position: absolute; left: 0; top: 0; z-index: 4; width: 22px; height: 22px; translate: -50% -50%; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, #fff 60%, #e4e8ee 61%); color: #1b2130; font-size: 11px; font-weight: 900; box-shadow: 0 2px 0 #0006, 0 0 0 1px #0002; transition: left .5s ease, top .5s ease; }
.dbtn[hidden] { display: none; }

.chip { position: relative; width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 900; color: #fff; background: radial-gradient(circle, var(--c) 52%, transparent 53%), repeating-conic-gradient(#fff 0 15deg, var(--c) 15deg 45deg); box-shadow: inset 0 0 0 3px var(--c), 0 3px 0 #0007; }
.chip::before { content: ""; position: absolute; inset: 22%; border-radius: 50%; border: 1.5px dashed #ffffffaa; }
.chip.sm { width: 18px; height: 18px; box-shadow: inset 0 0 0 1.5px var(--c), 0 1px 0 #0007; }
.chip.sm::before { border-width: 1px; }
.chip.fly { position: absolute; z-index: 30; translate: -50% -50%; pointer-events: none; }
.c25 { --c: #20915a; }
.c100 { --c: #252a36; }
.c500 { --c: #7a4dd6; }
.c1000 { --c: #d4900f; }
.c5000 { --c: #b23a2c; }

.toast { position: absolute; left: 50%; top: 40%; z-index: 20; translate: -50% -50%; max-width: 88%; padding: 8px 14px; border-radius: 99px; background: #000000c4; font-size: 13px; font-weight: 800; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

.msg { flex-shrink: 0; min-height: 20px; font-size: 14px; font-weight: 800; text-align: center; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.good { color: var(--win); }
.msg.bad { color: var(--lose); }

.controls { flex-shrink: 0; width: 100%; max-width: 680px; margin: 0 auto; height: 124px; display: grid; }
.bar { grid-area: 1 / 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
.bar[hidden] { display: none; }
.row { display: flex; gap: 6px; }
.row > button { flex: 1; min-width: 0; }
.quick button { height: 30px; padding: 0 4px; border-radius: 9px; background: #ffffff14; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quick button:not(:disabled):hover { color: var(--gold); }
.quick button:disabled { opacity: .35; }
.slide { align-items: center; height: 30px; }
.slide > button { flex: none; width: 34px; height: 30px; border-radius: 9px; background: #ffffff14; font-size: 18px; font-weight: 900; line-height: 1; color: var(--muted); }
.slide > button:disabled { opacity: .35; }
input[type="range"] { --p: 0%; flex: 1; min-width: 0; height: 30px; margin: 0 4px; background: transparent; appearance: none; -webkit-appearance: none; touch-action: none; cursor: pointer; }
input[type="range"]:disabled { opacity: .35; cursor: default; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--gold) var(--p), #ffffff26 var(--p)); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--gold) var(--p), #ffffff26 var(--p)); }
input[type="range"]::-webkit-slider-thumb { width: 24px; height: 24px; margin-top: -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--gold-dark), 0 2px 4px #0008; appearance: none; -webkit-appearance: none; }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--gold-dark), 0 2px 4px #0008; }
.btn { height: 44px; padding: 0 8px; border-radius: 12px; font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(#ffd877, var(--gold)); color: #2b1f04; box-shadow: 0 3px 0 var(--gold-dark); }
.btn.alt { background: linear-gradient(#f7f9fc, #dbe3ec); color: var(--ink); box-shadow: 0 3px 0 #94a3b5; }
.btn.fold { background: linear-gradient(#e86a6a, #c94848); color: #fff; box-shadow: 0 3px 0 #8e2c2c; }
.btn:not(:disabled):active { translate: 0 2px; box-shadow: none; }
.btn:disabled { opacity: .35; }
.btn.armed { animation: pulse .9s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--gold), 0 0 18px var(--gold); } }
.main .btn { flex: 1; }
.main #raiseBtn { flex: 1.3; }
#nextBtn { position: relative; isolation: isolate; }
#nextBtn .fill { position: absolute; inset: auto 0 0 0; z-index: -1; height: 4px; background: #2b1f0466; transform-origin: left; scale: var(--f, 0) 1; }

.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: #050b12c4; }
.overlay[hidden] { display: none; }
.panel { width: min(400px, 100%); max-height: 100%; overflow-y: auto; padding: 20px 18px; border-radius: 20px; background: linear-gradient(#1c3c58, #11263a); box-shadow: 0 0 0 1px #ffffff1a, 0 20px 50px #000a; text-align: center; animation: pop .3s; }
.panel h2 { font-size: 22px; font-weight: 900; color: var(--gold); }
.panel .sub { margin-top: 2px; font-size: 13px; font-weight: 800; color: var(--text); }
.panel p { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.panel .btn { width: 100%; margin-top: 16px; }
.panel .btn + .btn { margin-top: 10px; }
.panel .lbl { margin-top: 14px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sizes { display: grid; grid-template-columns: 1.7fr repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.sizes button { min-width: 0; padding: 8px 2px 7px; border-radius: 12px; background: #00000038; box-shadow: inset 0 0 0 1.5px #ffffff14; }
.sizes strong { display: block; font-size: 18px; font-weight: 900; line-height: 1.1; white-space: nowrap; }
.sizes small { display: block; margin-top: 2px; font-size: 10.5px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sizes button[aria-pressed="true"] { background: var(--gold); color: #2b1f04; box-shadow: none; }
.sizes button[aria-pressed="true"] small { color: #2b1f04b3; }
.warn { font-size: 12.5px !important; color: #ffb27a !important; }
.warn[hidden] { display: none; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 14px; }
.grid > div { padding: 6px; border-radius: 10px; background: #00000038; }
.grid small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); }
.grid strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.grid .wide { grid-column: 1 / -1; }
.besthand { --cw: 30px; display: flex; justify-content: center; gap: 3px; margin: 4px 0 2px; }
.besthand:empty { display: none; }
.grid .wide strong { font-size: 14px; }
.toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: #00000038; font-size: 14px; font-weight: 800; text-align: left; }
.toggle::after { content: ""; flex-shrink: 0; width: 38px; height: 22px; border-radius: 99px; background: #ffffff2a radial-gradient(circle at 11px 50%, #fff 8px, transparent 8.5px); transition: background .2s; }
.toggle[aria-pressed="true"]::after { background: var(--win) radial-gradient(circle at 27px 50%, #fff 8px, transparent 8.5px); }
.speedrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 6px 6px 6px 12px; border-radius: 12px; background: #00000038; font-size: 14px; font-weight: 800; text-align: left; }
.seg { display: flex; padding: 3px; border-radius: 10px; background: #00000040; }
.seg button { padding: 5px 9px; border-radius: 8px; font-size: 12.5px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #2b1f04; }
.panel ul { margin-top: 12px; padding-left: 18px; text-align: left; font-size: 13px; line-height: 1.55; color: var(--muted); }
.panel li + li { margin-top: 6px; }
.panel .link { margin-top: 12px; font-size: 13px; font-weight: 800; color: var(--muted); text-decoration: underline; }
.big { font-size: 46px; line-height: 1.1; }

@media (max-height: 620px) {
  .controls { height: 116px; }
  .btn { height: 40px; }
}
/* Small portrait frames: slimmer header, HUD and controls so the table keeps its height. */
@media (max-height: 560px) and (max-aspect-ratio: 4/3) {
  .app { gap: 6px; }
  .pill, .icon { height: 30px; }
  .icon { width: 30px; }
  .stat { padding: 2px 3px 3px; }
  .stat strong { font-size: 14px; }
  .msg { min-height: 17px; font-size: 12.5px; }
  .controls { height: 104px; }
  .bar { gap: 6px; }
  .quick button { height: 28px; }
  .slide, .slide > button, input[type="range"] { height: 26px; }
  .btn { height: 38px; font-size: 14px; }
}
@media (max-width: 360px) {
  .stat small { letter-spacing: 0; }
  .stat strong { font-size: 14px; }
  .quick button { padding: 0 2px; font-size: 11px; }
  .row { gap: 5px; }

    seats = [{ you: true, name: t.you, avatar: '', style: '' }];
    for (let i = 1; i < size; i++) seats.push({ you: false, ...pool[i - 1], style: styles[(i - 1) % styles.length] });
    seats.forEach((s, i) => Object.assign(s, { i, stack: START_STACK, bet: 0, total: 0, cards: [], folded: false, allIn: false, out: false, acted: false, actedAt: 0, status: '', shown: false, won: 0, startStack: START_STACK, place: 0, thinking: false }));
    button = -1;
    handNo = 0;
    level = 0;
    hand = null;
    turnSeat = null;
    buildSeatEls();
    layout();
    render();
  }

  function abortFlow() {
    gen++;
    // Leave "your turn" before the table is rebuilt, or the next render reads the cleared hand.
    phase = 'busy';
    turnSeat = null;
    if (resolveAction) { const r = resolveAction; resolveAction = null; r({ type: 'abort' }); }
    if (resolveNext) resolveNext('abort');
  }

  function startTable(size) {
    abortFlow();
    store.set('seats', size);
    setupTable(size);
    stats.tables++;
    save();
    phase = 'busy';
    runTable(gen);
  }

  async function runTable(g) {
    try {
      for (;;) {
        await playHand();
        const result = finishHand();
        render();
        if (result) {
          await wait(1400);
          phase = 'over';
          render();
          showOver(result);
          return;
        }
        await waitNext();
        if (g !== gen) return;
      }
    } catch (e) {
      if (e !== ABORT) throw e;
    }
  }

  // Waits ms of visible time (scaled by game speed) and stops the hand if a new table was started meanwhile.
  const sleep = ms => new Promise(resolve => {
    const tick = () => (document.hidden ? setTimeout(tick, 250) : setTimeout(resolve, ms));
    tick();
  });
  async function wait(ms) {
    const g = gen;
    await sleep(ms * mul());
    if (g !== gen) throw ABORT;
  }

  // ---------- one hand ----------
  async function playHand() {
    handNo++;
    const lv = Math.min(LEVELS.length - 1, Math.floor((handNo - 1) / HANDS_PER_LEVEL));
    const levelUp = lv !== level;
    level = lv;
    const [sb, bb] = LEVELS[level];
    for (const s of seats) Object.assign(s, { bet: 0, total: 0, cards: [], folded: false, allIn: false, acted: false, actedAt: 0, status: '', shown: false, won: 0, startStack: s.stack, thinking: false, score: 0 });
    const alive = s => !s.out;
    const live = seats.filter(alive);
    button = nextSeat(button < 0 ? Math.floor(Math.random() * seats.length) : button, alive);
    const heads = live.length === 2;
    const sbSeat = heads ? button : nextSeat(button, alive);
    const bbSeat = nextSeat(sbSeat, alive);
    hand = { board: [], pot: 0, pots: [], sb, bb, currentBet: bb, minRaise: bb, street: 0, sbSeat, bbSeat, hl: null, banner: null };
    myOdds = null;
    $('banner').hidden = true;
    setMsg(t.handN(handNo, fmt(sb), fmt(bb)));
    if (levelUp) toast(t.blindsUp(fmt(sb), fmt(bb)), 2200);

    const plan = dealPlan(live);
    post(seats[sbSeat], sb, 'sb');
    post(seats[bbSeat], bb, 'bb');
    render();
    await wait(MS.post);

    let idx = nextSeat(button, alive);
    for (let round = 0; round < 2; round++) {
      for (let k = 0; k < live.length; k++) {
        const s = seats[idx];
        const c = plan.holes.get(s.i)[round];
        s.cards.push(c);
        fresh.add(c);
        render();
        await wait(MS.deal);
        idx = nextSeat(idx, alive);
      }
    }
    if (!me().out) { stats.hands++; save(); }
    refreshOdds();

    await bettingRound(heads ? button : nextSeat(bbSeat, alive));
    setMsg('');
    for (const [street, count] of [[1, 3], [2, 1], [3, 1]]) {
      if (contenders().length < 2) break;
      await endStreet();
      hand.street = street;
      hand.currentBet = 0;
      hand.minRaise = bb;
      for (const s of seats) {
        s.acted = false;
        s.actedAt = 0;
        if (!s.folded && !s.allIn) s.status = '';
      }
      const runout = seats.filter(canAct).length < 2;
      if (runout && contenders().some(s => !s.shown)) await revealAll();
      for (let k = 0; k < count; k++) {
        const c = plan.board[hand.board.length];
        hand.board.push(c);
        fresh.add(c);
        render();
        await wait(MS.deal * 1.6);
      }
      refreshOdds();
      await wait(MS.street * (runout ? 1.4 : 0.6));
      if (!runout) { await bettingRound(nextSeat(button, canAct)); setMsg(''); }
    }
    await endStreet();
    await showdown();
  }

  // Shuffles a deck and decides every card up front; the test hook can fix some of them.
  function dealPlan(live) {
    const holes = new Map();
    let board = [];
    const used = new Set();
    if (rig) {
      for (const [i, pair] of Object.entries(rig.hole || {})) {
        const seat = seats[Number(i)];
        if (seat && !seat.out) { const cards = pair.map(parseCard); holes.set(seat.i, cards); cards.forEach(c => used.add(c)); }
      }
      board = (rig.board || []).map(parseCard);
      board.forEach(c => used.add(c));
      rig = null;
    }
    const deck = shuffle(DECK.filter(c => !used.has(c)));
    for (const s of live) if (!holes.has(s.i)) holes.set(s.i, [deck.pop(), deck.pop()]);
    while (board.length < 5) board.push(deck.pop());
    return { holes, board };
  }

  function post(s, amount, tag) {
    const a = Math.min(amount, s.stack);
    s.stack -= a;
    s.bet += a;
    s.total += a;
    if (!s.stack) s.allIn = true;
    s.status = s.allIn ? 'allin' : tag;
    s.betFresh = true;
  }

  async function bettingRound(first) {
    let i = first;
    if (i < 0) return;
    for (;;) {
      const live = contenders();
      if (live.length <= 1) return;
      const actors = live.filter(s => !s.allIn);
      const pending = actors.filter(s => !s.acted || s.bet < hand.currentBet);
      if (!pending.length) return;
      if (actors.length === 1 && actors[0].bet >= hand.currentBet) return;
      const s = seats[i];
      if (canAct(s) && (!s.acted || s.bet < hand.currentBet)) {
        const action = s.you ? await askYou(s) : await askAI(s);
        applyAction(s, action);
        render();
        await wait(s.you ? 120 : 260);
      }
      i = (i + 1) % seats.length;
    }
  }

  const toCallOf = s => Math.min(hand.currentBet - s.bet, s.stack);
  const maxTo = s => s.bet + s.stack;
  const minRaiseTo = s => Math.min(hand.currentBet + hand.minRaise, maxTo(s));
  // A player may raise unless only an incomplete all-in raise happened since they last acted.
  function canRaise(s) {
    if (s.stack <= hand.currentBet - s.bet) return false;
    if (s.acted && hand.currentBet - s.actedAt < hand.minRaise) return false;
    return seats.some(o => o !== s && canAct(o));
  }
  function roundTo(v, s) {
    const lo = minRaiseTo(s), hi = maxTo(s);
    const r = Math.round(v / UNIT) * UNIT;
    return clamp(r, lo, hi);
  }

  function applyAction(s, a) {
    const before = hand.currentBet;
    if (a.type === 'fold') {
      s.folded = true;
      s.status = 'fold';
    } else if (a.type === 'check' && s.bet >= hand.currentBet) {
      s.status = 'check';
    } else if (a.type === 'raise' && canRaise(s)) {
      const to = clamp(a.to, minRaiseTo(s), maxTo(s));
      pay(s, to - s.bet);
      const size = to - before;
      if (size >= hand.minRaise) hand.minRaise = size;
      hand.currentBet = Math.max(before, to);
      s.status = s.allIn ? 'allin' : before === 0 ? 'bet' : 'raise';
    } else {
      pay(s, toCallOf(s));
      s.status = s.allIn ? 'allin' : s.bet === 0 && hand.currentBet === 0 ? 'check' : 'call';
    }
    s.acted = true;
    s.actedAt = hand.currentBet;
    s.tagFresh = true;
    if (!s.you) announce(`${s.name}: ${t.st[s.status]}${s.bet && s.status !== 'fold' ? ` ${fmt(s.bet)}` : ''}`);
  }
  function pay(s, amount) {
    const a = Math.min(amount, s.stack);
    s.stack -= a;
    s.bet += a;
    s.total += a;
    if (a) s.betFresh = true;
    if (!s.stack) s.allIn = true;
  }

  async function askYou(s) {
    phase = 'you';
    turnSeat = s;
    armed = false;
    resetSlider();
    const due = toCallOf(s);
    const text = due ? t.toCall(fmt(due)) : t.yourTurn;
    setMsg(text);
    announce(text);
    render();
    refreshOdds();
    const a = await new Promise(resolve => { resolveAction = resolve; });
    turnSeat = null;
    phase = 'busy';
    armed = false;
    if (a.type === 'abort') throw ABORT;
    return a;
  }

  async function askAI(s) {
    turnSeat = s;
    s.thinking = true;
    setMsg(t.thinking(s.name));
    render();
    const watching = me().folded || me().out || me().allIn;
    const think = (MS.think + Math.random() * MS.think * 0.7) * (watching ? 0.6 : 1);
    const opps = contenders().length - 1;
    const [eq] = await Promise.all([
      hand.street > 0 && !aiOverride ? equity(s.cards, hand.board, opps, MC_ITERS) : Promise.resolve(0),
      wait(think),
    ]);
    s.thinking = false;
    turnSeat = null;
    return aiOverride ? forced(s) : aiDecide(s, eq);
  }

  // Test-only fixed policies so automated checks can steer hands to showdown.
  function forced(s) {
    const due = toCallOf(s);
    if (aiOverride === 'fold') return { type: due ? 'fold' : 'check' };
    if (aiOverride === 'allin' && canRaise(s)) return { type: 'raise', to: maxTo(s) };
    if (aiOverride === 'minraise' && canRaise(s)) return { type: 'raise', to: minRaiseTo(s) };
    return { type: due ? 'call' : 'check' };
  }

  function posBonus(s) {
    const order = [];
    let j = button;
    for (let k = 0; k < seats.length; k++) {
      j = nextSeat(j, o => !o.out);
      if (j < 0 || order.includes(j)) break;
      order.push(j);
    }
    const p = order.indexOf(s.i), m = order.length;
    if (p === m - 1) return 1.5;
    if (p === m - 2 && m > 3) return 1;
    if (p === 1) return 0.5;
    if (p === 0) return 0;
    return -0.5;
  }

  function aiDecide(s, eq) {
    const P = STYLE[s.style];
    const due = toCallOf(s);
    const potAll = potTotal();
    const canR = canRaise(s);
    const rnd = Math.random();
    const bb = hand.bb;
    const call = () => ({ type: due ? 'call' : 'check' });
    const fold = () => ({ type: due ? 'fold' : 'check' });
    const raise = to => (canR ? { type: 'raise', to: roundTo(to, s) } : call());
    const opps = contenders().length - 1;
    if (hand.street === 0) {
      const raised = hand.currentBet > bb;
      const str = chen(s.cards) + posBonus(s) + (opps <= 2 ? 1.5 : 0) + (opps === 1 ? 1.5 : 0) + (Math.random() - 0.5) * P.noise;
      if ((s.stack + s.bet) / bb <= 12) {
        // Short stacks play push-or-fold.
        if (str >= P.play + (raised ? 2 : 0)) return raise(maxTo(s));
        return due <= bb / 2 && str >= P.play - 2 ? call() : fold();
      }
      if (str >= P.raise + (raised ? 3 : 0) && rnd < P.aggr + 0.2) {
        if (raised && str >= 16 && hand.currentBet >= bb * 8) return raise(maxTo(s));
        const limpers = seats.filter(o => o.i !== hand.bbSeat && inHand(o) && !o.folded && o.bet === bb).length;
        return raise(raised ? hand.currentBet * (2.6 + Math.random() * 0.6) : bb * (2.5 + Math.random()) + limpers * bb);
      }
      if (!due) return !raised && rnd < P.bluff * 0.5 ? raise(bb * 3) : call();
      const willing = str >= P.play + (raised ? 2 : 0) ? s.stack * (str >= P.raise + 2 ? 1 : P.callFrac) : 0;
      if (due <= willing) return call();
      if (!raised && due <= bb && str >= P.play - 2) return call();
      if (!raised && rnd < P.bluff * 0.4) return raise(bb * 3);
      return fold();
    }
    // Chance to beat one random hand, so thresholds work the same with any number of opponents.
    const per = Math.pow(eq, 1 / Math.max(1, opps));
    if (!due) {
      if (per > P.value && rnd < P.aggr) return raise(potAll * (0.5 + Math.random() * 0.3));
      if (rnd < P.bluff) return raise(potAll * (0.45 + Math.random() * 0.2));
      return call();
    }
    const odds = due / (potAll + due);
    const pressure = due / Math.max(1, potAll);
    if (per > P.value + 0.1 && rnd < P.aggr) return raise(hand.currentBet + (potAll + due) * (0.6 + Math.random() * 0.4));
    if (eq >= odds + P.margin + pressure * 0.08) return call();
    if (rnd < P.bluff * 0.25) return raise(hand.currentBet * 2.5);
    return fold();
  }

  // Gives back the part of the top bet nobody matched, then sweeps the bets into the pot.
  async function endStreet() {
    const inh = seats.filter(s => s.bet > 0).sort((a, b) => b.bet - a.bet);
    if (inh.length) {
      const top = inh[0];
      const excess = top.bet - (inh[1] ? inh[1].bet : 0);
      if (excess > 0) {
        top.bet -= excess;
        top.total -= excess;
        top.stack += excess;
        if (top.stack > 0) top.allIn = false;
        if (contenders().length > 1) toast(t.uncalled(fmt(excess)), 1300);
      }
    }
    const moving = seats.filter(s => s.bet > 0);
    if (moving.length) {
      moving.forEach(s => flyChips(betEl(s), $('pot'), s.bet, 2));
      seats.forEach(s => { hand.pot += s.bet; s.bet = 0; });
      render();
      await wait(MS.collect);
    }
    hand.pots = buildPots(seats.map(s => ({ total: s.total, folded: s.folded || !inHand(s) })));
    render();
  }

  async function revealAll() {
    for (const s of contenders()) {
      if (!s.shown && !s.you) s.cards.forEach(c => flips.add(c));
      s.shown = true;
    }
    render();
    await wait(MS.reveal);
  }

  async function showdown() {
    const live = contenders();
    turnSeat = null;
    if (live.length === 1) {
      const w = live[0];
      const amount = hand.pot;
      award(w, amount);
      showBanner(w.you ? t.youWin(fmt(amount)) : t.wins(w.name, fmt(amount)), '');
      render();
      await wait(MS.pot * 0.7);
      return;
    }
    await revealAll();
    for (const s of live) s.score = score(s.cards.concat(hand.board));
    const pots = buildPots(seats.map(s => ({ total: s.total, folded: s.folded || !inHand(s) })));
    for (const pot of pots) {
      const eligible = pot.eligible.map(i => seats[i]);
      const top = Math.max(...eligible.map(s => s.score));
      const winners = eligible.filter(s => s.score === top);
      const pay = splitPot(pot.amount, winners.map(s => s.i), button, seats.length);
      hand.hl = new Set();
      for (const w of winners) bestFive(w.cards.concat(hand.board)).cards.forEach(c => hand.hl.add(c));
      hand.hlSeats = new Set(winners.map(s => s.i));
      for (const w of winners) award(w, pay.get(w.i));
      const name = handName(top);
      const head = winners.length > 1
        ? t.split(winners.map(s => (s.you ? t.you : s.name)).join(' & '), fmt(pot.amount))
        : winners[0].you ? t.youWin(fmt(pot.amount)) : t.wins(winners[0].name, fmt(pot.amount));
      const label = pots.length > 1 ? `${potLabel(pots.indexOf(pot), pots.length)} · ` : '';
      showBanner(label + head, name);
      render();
      await wait(MS.pot);
    }
  }

  const potLabel = (i, count) => (i ? `${t.side}${count > 2 ? ` ${i}` : ''}` : t.main);

  function award(w, amount) {
    hand.pot -= amount;
    w.stack += amount;
    w.won += amount;
    w.status = 'win';
    w.tagFresh = true;
    flyChips($('pot'), w.you ? $('myplate') : w.el.querySelector('.plate'), amount, 5);
    if (w.you) bump('bankStat');
  }

  function showBanner(head, sub) {
    hand.banner = { head, sub };
    const el = $('banner');
    el.hidden = false;
    el.innerHTML = '';
    el.append(head);
    if (sub) { const small = document.createElement('small'); small.textContent = sub; el.append(small); }
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    setMsg(sub ? `${head} · ${sub}` : head, hand.hlSeats && hand.hlSeats.has(0) || me().won > 0 ? 'good' : '');
    announce(sub ? `${head}. ${sub}` : head);
  }

  // Records stats and removes busted players; returns the table result when the table is over.
  function finishHand() {
    const you = me();
    if (you.won > 0) {
      stats.won++;
      stats.bigPot = Math.max(stats.bigPot, you.won);
    }
    if (inHand(you) && !you.folded && hand.board.length === 5) {
      const best = bestFive(you.cards.concat(hand.board));
      if (best.score > stats.best) { stats.best = best.score; stats.bestCards = best.cards; }
    }
    const busted = seats.filter(s => !s.out && s.stack === 0).sort((a, b) => b.startStack - a.startStack);
    const aliveAfter = seats.filter(s => !s.out && s.stack > 0).length;
    const gone = [];
    busted.forEach((s, k) => {
      s.out = true;
      s.place = aliveAfter + 1 + k;
      if (!s.you) gone.push(t.out(s.name, s.place));
    });
    if (gone.length) toast(gone.join(' · '), 2600);
    turnSeat = null;
    if (you.out) { save(); return { win: false, place: you.place }; }
    if (aliveAfter === 1) { stats.tablesWon++; save(); return { win: true }; }
    save();
    return null;
  }

  function waitNext() {
    phase = 'between';
    render();
    const total = Math.max(1, MS.next * mul());
    let left = total;
    return new Promise((resolve, reject) => {
      let timer = 0;
      resolveNext = v => {
        resolveNext = null;
        clearTimeout(timer);
        $('nextFill').style.setProperty('--f', 0);
        if (v === 'abort') reject(ABORT);
        else { phase = 'busy'; resolve(); }
      };
      const tick = () => {
        if (autoNext && !document.hidden && !document.querySelector('.overlay:not([hidden])')) left -= 100;
        $('nextFill').style.setProperty('--f', clamp(1 - left / total, 0, 1));
        if (left <= 0) resolveNext('go');
        else timer = setTimeout(tick, 100);
      };
      timer = setTimeout(tick, total < 100 ? total : 100);
    });
  }

  // ---------- your controls ----------
  function sliderRange() {
    const s = me();
    return { lo: minRaiseTo(s), hi: maxTo(s) };
  }
  function resetSlider() { setSlider(sliderRange().lo); }
  function setSlider(v) {
    const sl = $('slider');
    const { lo, hi } = sliderRange();
    sl.min = lo;
    sl.max = hi;
    sl.value = clamp(v, lo, hi);
    paintSlider();
  }
  function paintSlider() {
    const sl = $('slider');
    const lo = Number(sl.min), hi = Number(sl.max);
    sl.style.setProperty('--p', `${hi > lo ? ((Number(sl.value) - lo) / (hi - lo)) * 100 : 100}%`);
  }
  function sliderTo() {
    const s = me();
    const v = Number($('slider').value);
    return v >= maxTo(s) ? maxTo(s) : roundTo(v, s);
  }
  function quick(kind) {
    if (phase !== 'you') return;
    const s = me();
    const due = toCallOf(s);
    const pot = potTotal() + due;
    const target = { min: minRaiseTo(s), half: hand.currentBet + pot * 0.5, three: hand.currentBet + pot * 0.75, pot: hand.currentBet + pot, all: maxTo(s) }[kind];
    setSlider(kind === 'all' ? target : roundTo(target, s));
    arm();
    renderControls();
  }
  function nudge(dir) {
    if (phase !== 'you' || !canRaise(me())) return;
    const step = hand.bb;
    const cur = Number($('slider').value);
    setSlider(Math.round((cur + dir * step) / UNIT) * UNIT);
    arm();
    renderControls();
  }
  function arm() { armed = true; }

  function act(kind) {
    if (phase !== 'you' || !resolveAction) return;
    const s = me();
    const due = toCallOf(s);
    let a;
    if (kind === 'fold') { if (!due) return; a = { type: 'fold' }; }
    else if (kind === 'call') a = { type: due ? 'call' : 'check' };
    else { if (!canRaise(s)) return; a = { type: 'raise', to: sliderTo() }; }
    const resolve = resolveAction;
    resolveAction = null;
    resolve(a);
  }

  // ---------- odds for you ----------
  function refreshOdds() {
    const s = me();
    const req = ++oddsReq;
    myOdds = null;
    if (!settings.odds || !inHand(s) || s.folded) { renderMe(); return; }
    const opps = contenders().length - 1;
    if (opps < 1) { renderMe(); return; }
    equity(s.cards, hand.board, opps, MC_ITERS).then(v => {
      if (req !== oddsReq) return;
      myOdds = v;
      renderMe();
    }, () => {});
  }

  // ---------- rendering ----------
  function cardEl(c, down, still = false) {
    const el = document.createElement('div');
    const r = rankOf(c), s = suitOf(c);
    el.className = `card${s === 1 || s === 2 ? ' red' : ''}${down ? ' down' : ''}`;
    el.dataset.c = c;
    if (!still && fresh.has(c)) { el.classList.add('deal'); fresh.delete(c); }
    if (!still && !down && flips.has(c)) { el.classList.add('flip'); flips.delete(c); }
    const rank = sym(r);
    const suit = `${SUITS[s]}︎`;
    const face = r >= 11 && r <= 13;
    el.innerHTML = `<span class="ci"><b>${rank}</b><i>${suit}</i></span><span class="cs${face ? ' face' : ''}">${face ? rank : suit}</span>`;
    return el;
  }
  function syncCards(box, cards, down, label) {
    const sig = `${cards.join()}|${down}`;
    if (box.dataset.sig !== sig) {
      box.dataset.sig = sig;
      box.replaceChildren(...cards.map(c => cardEl(c, down)));
    }
    box.setAttribute('aria-label', cards.length ? `${label}: ${cards.map(c => (down ? t.hidden : cardText(c))).join(', ')}` : label);
    const hl = hand && hand.hl;
    for (const el of box.children) {
      const c = Number(el.dataset.c);
      el.classList.toggle('hl', !!hl && !down && hl.has(c));
      el.classList.toggle('dim', !!hl && !down && !hl.has(c));
    }
  }
  const chipClass = v => (v >= 5000 ? 'c5000' : v >= 1000 ? 'c1000' : v >= 500 ? 'c500' : v >= 100 ? 'c100' : 'c25');

  function buildSeatEls() {
    const box = $('seats');
    const bets = $('bets');
    box.replaceChildren();
    bets.replaceChildren();
    for (const s of seats) {
      const b = document.createElement('div');
      b.className = 'bet';
      b.hidden = true;
      b.innerHTML = '<span class="chip sm" aria-hidden="true"></span><b></b>';
      s.betNode = b;
      bets.append(b);
      if (s.you) continue;
      const el = document.createElement('div');
      el.className = 'seat';
      el.setAttribute('role', 'group');
      el.innerHTML = `<div class="mini"></div><div class="plate"><span class="av" aria-hidden="true">${s.avatar}</span><span class="who"><span class="nm">${s.name}</span><span class="sty">${t.styles[s.style]}</span><b class="stk"></b></span><span class="tag"></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>`;
      s.el = el;
      box.append(el);
    }
  }
  const betEl = s => s.betNode;

  function render() {
    renderHud();
    renderBoard();
    for (const s of seats) if (!s.you) renderSeat(s);
    renderMe();
    renderBets();
    renderControls();
    $('tableLbl').textContent = t.tableLbl(tableSize);
  }

  function renderHud() {
    const [sb, bb] = hand ? [hand.sb, hand.bb] : LEVELS[level];
    $('hudChips').textContent = fmt(seats.length ? me().stack : START_STACK);
    $('hudBlinds').textContent = `${fmt(sb)}/${fmt(bb)}`;
    const left = HANDS_PER_LEVEL * (level + 1) - Math.max(handNo, 1) + 1;
    $('hudLevel').textContent = level >= LEVELS.length - 1 ? '—' : t.inHands(handNo ? left : HANDS_PER_LEVEL);
    $('hudPlayers').textContent = `${seats.filter(s => !s.out).length}/${seats.length}`;
  }

  function renderBoard() {
    const board = $('board');
    const cards = hand ? hand.board : [];
    const sig = `${cards.join()}`;
    if (board.dataset.sig !== sig) {
      board.dataset.sig = sig;
      const els = cards.map(c => cardEl(c, false));
      while (els.length < 5) { const slot = document.createElement('div'); slot.className = 'slot'; els.push(slot); }
      board.replaceChildren(...els);
    }
    board.setAttribute('aria-label', `${t.board}: ${cards.map(cardText).join(', ')}`);
    const hl = hand && hand.hl;
    for (const el of board.children) {
      if (!el.dataset.c) continue;
      const c = Number(el.dataset.c);
      el.classList.toggle('hl', !!hl && hl.has(c));
      el.classList.toggle('dim', !!hl && !hl.has(c));
    }
    const total = potTotal();
    $('pot').classList.toggle('empty', !total);
    $('potAmt').textContent = fmt(total);
    const pots = hand && hand.pots.length > 1 ? hand.pots : [];
    $('sides').textContent = hand && hand.banner ? '' : pots.map((p, i) => `${potLabel(i, pots.length)} ${fmt(p.amount)}`).join(' · ');
    if (!hand || !hand.banner) $('banner').hidden = true;
    $('center').classList.toggle('showing', !$('banner').hidden);
  }

  function setTag(el, s) {
    el.textContent = s.status ? t.st[s.status] : '';
    el.className = `tag${s.status ? ` st-${s.status}` : ''}${s.tagFresh ? ' pop' : ''}`;
    s.tagFresh = false;
  }

  function renderSeat(s) {
    const el = s.el;
    const p = geo && geo.seats[s.i];
    if (p) { el.style.left = `${p.x}px`; el.style.top = `${p.y}px`; }
    el.classList.toggle('gone', s.out);
    el.classList.toggle('folded', s.folded);
    el.classList.toggle('turn', turnSeat === s);
    el.classList.toggle('thinking', s.thinking);
    el.classList.toggle('shown', s.shown && !s.folded);
    el.classList.toggle('won', s.won > 0);
    el.querySelector('.stk').textContent = fmt(s.stack);
    setTag(el.querySelector('.tag'), s);
    const mini = el.querySelector('.mini');
    const cards = s.folded ? [] : s.cards;
    syncCards(mini, cards, !s.shown, s.name);
    el.setAttribute('aria-label', t.seatAria(s.name, t.styles[s.style], fmt(s.stack)) + (s.status ? `, ${t.st[s.status]}` : ''));
  }

  function renderMe() {
    if (!seats.length) return;
    const s = me();
    const box = $('me');
    if (geo) box.style.top = `${geo.meTop}px`;
    box.classList.toggle('folded', s.folded);
    syncCards($('myCards'), s.cards, false, t.you);
    $('myStack').textContent = fmt(s.stack);
    setTag($('myTag'), s);
    const plate = $('myplate');
    plate.classList.toggle('turn', phase === 'you');
    plate.classList.toggle('won', s.won > 0);
    let desc = '';
    if (s.cards.length && hand) desc = handName(score(s.cards.concat(hand.board)));
    $('myHand').textContent = desc;
    const exposed = seats.some(o => !o.you && o.shown);
    $('myOdds').textContent = myOdds != null && settings.odds && !s.folded && !exposed && phase !== 'between' ? `${Math.round(myOdds * 100)}%` : '';
  }

  function renderBets() {
    for (const s of seats) {
      const b = s.betNode;
      const p = geo && geo.bets[s.i];
      if (p) { b.style.left = `${p.x}px`; b.style.top = `${p.y}px`; }
      b.hidden = !s.bet;
      if (!s.bet) continue;
      b.querySelector('.chip').className = `chip sm ${chipClass(s.bet)}`;
      b.querySelector('b').textContent = fmt(s.bet);
      if (s.betFresh) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); s.betFresh = false; }
    }
    const d = $('dbtn');
    d.hidden = button < 0 || !geo || !seats[button];
    if (!d.hidden) { const p = geo.dealer[button]; d.style.left = `${p.x}px`; d.style.top = `${p.y}px`; }
  }

  function renderControls() {
    const between = phase === 'between';
    const hadFocus = $('controls').contains(document.activeElement);
    $('actBar').hidden = between;
    $('nextBar').hidden = !between;
    const mine = phase === 'you';
    const s = seats.length ? me() : null;
    const due = mine ? toCallOf(s) : 0;
    const canR = mine && canRaise(s);
    $('foldBtn').disabled = !mine || !due;
    $('foldBtn').textContent = t.fold;
    $('callBtn').disabled = !mine;
    $('callBtn').textContent = !mine || !due ? t.check : due >= s.stack ? t.allIn(fmt(due)) : t.call(fmt(due));
    const raise = $('raiseBtn');
    raise.disabled = !canR;
    raise.classList.toggle('armed', canR && armed);
    if (canR) {
      const to = sliderTo();
      raise.textContent = to >= maxTo(s) ? t.allIn(fmt(to)) : hand.currentBet ? t.raise(fmt(to)) : t.bet(fmt(to));
    } else raise.textContent = t.raiseWord;
    $('slider').disabled = !canR;
    $('lessBtn').disabled = !canR;
    $('moreBtn').disabled = !canR;
    document.querySelectorAll('[data-q]').forEach(b => { b.disabled = !canR; });
    if (!canR) { $('slider').style.setProperty('--p', '0%'); }
    if (hadFocus && !$('controls').contains(document.activeElement)) (between ? $('nextBtn') : $('callBtn')).focus({ preventScroll: true });
    else if (hadFocus && document.activeElement.disabled) $('callBtn').focus({ preventScroll: true });
  }

  function layout() {
    const W = felt.clientWidth, H = felt.clientHeight;
    if (!W || !H) return;
    // Wide (landscape) placement needs real width; small portrait frames keep the portrait ring even when short.
    const wide = W / H > 1.3 && W >= 440;
    const short = H < 380;
    felt.classList.toggle('wide', wide);
    felt.classList.toggle('short', short);
    const compact = W < 340 || H < 330;
    felt.classList.toggle('compact', compact);
    const sw = wide ? clamp(W * 0.12, short ? 92 : 100, 150) : clamp(W * 0.235, W < 320 ? 72 : 78, 112);
    const mw = clamp(sw * (wide ? 0.3 : 0.33), 22, 44);
    const plateH = wide && !short ? 44 : 36;
    const seatH = plateH + mw * 0.9 + 6;
    const cw = wide ? clamp(Math.min(H * 0.15, W * 0.07), short ? 38 : 44, 84) : clamp(Math.min(H * 0.14, W * 0.16), short ? 36 : 40, 72);
    const meH = cw * 1.4 + 38;
    const top = seatH / 2 + 2;
    const meTop = H - meH - 2;
    const rx = W / 2 - sw / 2 - 4;
    const ry = Math.max(30, (meTop + seatH * 0.15 - top) / 1.5);
    const cy = top + ry;
    const cx = W / 2;
    const seatsGeo = [], bets = [], dealer = [];
    let free = W;
    const angles = ANGLES[seats.length] || ANGLES[6];
    seats.forEach((s, i) => {
      if (s.you) {
        seatsGeo[i] = { x: cx, y: meTop + cw * 0.7 };
        bets[i] = { x: cx, y: meTop - 14 };
        dealer[i] = { x: cx - cw * 0.85 - 18, y: meTop + cw * 0.5 };
        return;
      }
      const a = (angles[i - 1] * Math.PI) / 180;
      const x = clamp(cx + rx * Math.cos(a), sw / 2 + 3, W - sw / 2 - 3);
      const y = clamp(cy + ry * Math.sin(a), top, H - seatH / 2);
      seatsGeo[i] = { x, y };
      const side = Math.sign(cx - x);
      if (Math.abs(Math.cos(a)) >= 0.35) free = Math.min(free, 2 * (Math.abs(cx - x) - sw / 2) - 16);
      if (Math.abs(Math.cos(a)) < 0.35) {
        // Top of the table: bet below the seat, button to its left.
        bets[i] = { x, y: y + seatH / 2 + 16 };
        dealer[i] = { x: x - sw / 2 - 16, y: y + 8 };
      } else if (Math.sin(a) > 0.2 && !wide) {
        // Lower side seats in portrait: bet goes above, towards the middle.
        bets[i] = { x: x + side * 18, y: y - seatH / 2 - 14 };
        dealer[i] = { x: x + side * (sw / 2 + 14), y: y + 10 };
      } else {
        bets[i] = { x: x + side * (sw / 2 + 40), y: y - 6 };
        dealer[i] = { x: x + side * (sw / 2 + 13), y: y + seatH * 0.36 };
      }
    });
    // Small tables can put two bet pills on top of each other; push overlapping pairs apart sideways.
    const PW = compact ? 52 : 60, PH = compact ? 19 : 22;
    for (let pass = 0; pass < 4; pass++) {
      for (let i = 0; i < bets.length; i++) for (let j = i + 1; j < bets.length; j++) {
        const a = bets[i], c = bets[j];
        if (!a || !c) continue;
        const ox = PW - Math.abs(a.x - c.x), oy = PH - Math.abs(a.y - c.y);
        if (ox <= 0 || oy <= 0) continue;
        const dir = a.x < c.x || (a.x === c.x && seatsGeo[i].x < seatsGeo[j].x) ? -1 : 1;
        a.x = clamp(a.x + (dir * ox) / 2, PW / 2, W - PW / 2);
        c.x = clamp(c.x - (dir * ox) / 2, PW / 2, W - PW / 2);
      }
    }
    const bw = wide ? clamp(Math.min(W * 0.062, H * 0.12), short ? 30 : 34, 74) : clamp(Math.min((W - 30) / 5.5, H * 0.11), short ? 28 : 30, 60);
    const ovalX = wide ? sw * 0.35 : sw * 0.22;
    const oval = $('oval').style;
    oval.left = `${ovalX}px`;
    oval.width = `${W - ovalX * 2}px`;
    oval.top = `${top - 6}px`;
    oval.height = `${meTop + cw * 0.95 - top + 6}px`;
    const center = $('center').style;
    center.top = `${cy + (wide ? 0 : 4)}px`;
    felt.style.setProperty('--sw', `${sw}px`);
    felt.style.setProperty('--mw', `${mw}px`);
    felt.style.setProperty('--cw', `${cw}px`);
    felt.style.setProperty('--bw', `${bw}px`);
    felt.style.setProperty('--smax', `${clamp(free, 120, 420)}px`);
    felt.style.setProperty('--bmax', `${Math.max(200, W - sw * 2 + 10)}px`);
    felt.style.setProperty('--pw', `${clamp(cw * 3.3, 160, Math.min(W - 24, 300))}px`);
    geo = { seats: seatsGeo, bets, dealer, meTop };
    render();
  }

  function flyChips(fromEl, toEl, amount, count) {
    if (reduced || delayScale === 0 || !fromEl || !toEl) return;
    const f = felt.getBoundingClientRect();
    const ra = fromEl.getBoundingClientRect(), rb = toEl.getBoundingClientRect();
    if (!ra.width && !ra.height) return;
    const a = { x: ra.left + ra.width / 2 - f.left, y: ra.top + ra.height / 2 - f.top };
    const b = { x: rb.left + rb.width / 2 - f.left, y: rb.top + rb.height / 2 - f.top };
    for (let k = 0; k < count; k++) {
      const chip = document.createElement('span');
      chip.className = `chip sm fly ${chipClass(amount)}`;
      chip.style.left = `${a.x}px`;
      chip.style.top = `${a.y}px`;
      felt.append(chip);
      const jitter = (k - count / 2) * 4;
      const anim = chip.animate(
        [{ transform: 'translate(0, 0)', opacity: 1 }, { transform: `translate(${b.x - a.x + jitter}px, ${b.y - a.y}px)`, opacity: 0.85 }],
        { duration: 480 * Math.max(0.5, mul()), delay: k * 60, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'both' },
      );
      anim.onfinish = () => chip.remove();
    }
  }

  let toastTimer = 0;
  function toast(text, ms = 1600) {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms);
    announce(text);
  }
  function announce(text) { $('sr').textContent = text; }
  function setMsg(text, tone = '') {
    const el = $('msg');
    el.textContent = text;
    el.className = `msg${tone ? ` ${tone}` : ''}`;
  }
  function bump(id) {
    const el = $(id);
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  function save() { store.set('stats', stats); }

  // ---------- panels ----------
  let panelReturn = null;
  function openPanel(id) {
    if (!$(id).hidden) return;
    panelReturn = document.activeElement;
    if (id === 'statsPanel') fillStats();
    if (id === 'lobbyPanel') fillLobby();
    $(id).hidden = false;
    const target = id === 'lobbyPanel' ? $('sitBtn') : $(id).querySelector('button');
    target.focus({ preventScroll: true });
  }
  function closePanel(el) {
    el.hidden = true;
    if (panelReturn && panelReturn.focus && document.contains(panelReturn)) panelReturn.focus({ preventScroll: true });
  }
  const tableRunning = () => phase === 'busy' || phase === 'you' || phase === 'between';
  function fillLobby() {
    lobbyPick = tableSize;
    paintSizes();
    $('leaveWarn').hidden = !tableRunning();
    $('cancelBtn').hidden = !tableRunning();
  }
  function paintSizes() {
    $('sizes').innerHTML = SIZES.map(n => `<button type="button" data-size="${n}" aria-pressed="${n === lobbyPick}"><strong>${n === 2 ? t.tableLbl(2) : n}</strong><small>${n === 2 ? t.heads : t.ppl}</small></button>`).join('');
  }
  function fillStats() {
    const rows = [
      ['sHands', fmt(stats.hands)], ['sWon', fmt(stats.won)], ['sTables', fmt(stats.tables)], ['sTablesWon', fmt(stats.tablesWon)],
    ];
    let html = rows.map(([k, v]) => `<div><small>${t[k]}</small><strong>${v}</strong></div>`).join('');
    html += `<div class="wide"><small>${t.sBigPot}</small><strong>${fmt(stats.bigPot)}</strong></div>`;
    html += `<div class="wide"><small>${t.sBest}</small><div class="besthand" id="bestCards"></div><strong>${stats.best ? handName(stats.best) : t.none}</strong></div>`;
    $('statsGrid').innerHTML = html;
    if (stats.best && Array.isArray(stats.bestCards)) $('bestCards').replaceChildren(...stats.bestCards.map(c => cardEl(c, false, true)));
    $('oddsToggle').setAttribute('aria-pressed', String(settings.odds));
    $('speedSeg').innerHTML = Object.keys(SPEEDS).map(k => `<button type="button" data-speed="${k}" aria-pressed="${k === settings.speed}">${t.speeds[k]}</button>`).join('');
  }
  function showOver(result) {
    const you = me();
    $('overIcon').textContent = result.win ? '🏆' : '🃏';
    $('overTitle').textContent = result.win ? t.winTitle : t.loseTitle;
    $('overText').textContent = result.win ? t.winText(seats.length - 1, handNo) : t.loseText(result.place, seats.length, handNo);
    $('overGrid').innerHTML = [[t.sHands, fmt(stats.hands)], [t.sTablesWon, fmt(stats.tablesWon)]].map(([k, v]) => `<div><small>${k}</small><strong>${v}</strong></div>`).join('');
    announce(`${$('overTitle').textContent} ${$('overText').textContent}`);
    if (result.win) { you.status = 'win'; render(); }
    openPanel('overPanel');
  }

  // ---------- input ----------
  $('foldBtn').addEventListener('click', () => act('fold'));
  $('callBtn').addEventListener('click', () => act('call'));
  $('raiseBtn').addEventListener('click', () => act('raise'));
  $('lessBtn').addEventListener('click', () => nudge(-1));
  $('moreBtn').addEventListener('click', () => nudge(1));
  $('slider').addEventListener('input', () => { arm(); paintSlider(); renderControls(); });
  document.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => quick(b.dataset.q)));
  $('nextBtn').addEventListener('click', () => { if (resolveNext) resolveNext('go'); });
  $('tableBtn').addEventListener('click', () => openPanel('lobbyPanel'));
  $('statsBtn').addEventListener('click', () => openPanel('statsPanel'));
  $('helpBtn').addEventListener('click', () => openPanel('helpPanel'));
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closePanel(b.closest('.overlay'))));
  $('sizes').addEventListener('click', e => {
    const b = e.target.closest('[data-size]');
    if (!b) return;
    lobbyPick = Number(b.dataset.size);
    paintSizes();
    $('sizes').querySelector(`[data-size="${lobbyPick}"]`).focus({ preventScroll: true });
    if (!tableRunning()) setupTable(lobbyPick);
  });
  $('sitBtn').addEventListener('click', () => {
    $('lobbyPanel').hidden = true;
    startTable(lobbyPick);
    $('callBtn').focus({ preventScroll: true });
  });
  $('cancelBtn').addEventListener('click', () => closePanel($('lobbyPanel')));
  $('againBtn').addEventListener('click', () => { $('overPanel').hidden = true; openPanel('lobbyPanel'); });
  $('oddsToggle').addEventListener('click', () => {
    settings.odds = !settings.odds;
    store.set('settings', settings);
    fillStats();
    if (hand) refreshOdds();
  });
  $('speedSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-speed]');
    if (!b) return;
    settings.speed = b.dataset.speed;
    store.set('settings', settings);
    fillStats();
    $('speedSeg').querySelector(`[data-speed="${settings.speed}"]`).focus({ preventScroll: true });
  });
  $('resetStats').addEventListener('click', () => {
    Object.assign(stats, defaultStats());
    save();
    fillStats();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector('.overlay:not([hidden])')) return;
    const onButton = e.target instanceof HTMLButtonElement;
    const onSlider = e.target === $('slider');
    const key = e.key.toLowerCase();
    if (phase === 'you') {
      if (key === 'f') { e.preventDefault(); act('fold'); }
      else if (key === 'c') { e.preventDefault(); act('call'); }
      else if (key === 'r') {
        e.preventDefault();
        if (armed) act('raise');
        else if (canRaise(me())) { arm(); renderControls(); }
      } else if (['arrowup', 'arrowright', 'arrowdown', 'arrowleft'].includes(key) && !onSlider) {
        e.preventDefault();
        nudge(key === 'arrowup' || key === 'arrowright' ? 1 : -1);
      } else if (key === 'enter' && !onButton && armed) { e.preventDefault(); act('raise'); }
    } else if (phase === 'between' && key === 'enter' && !onButton) {
      e.preventDefault();
      if (resolveNext) resolveNext('go');
    }
  });

  new ResizeObserver(layout).observe(felt);

  setupTable(tableSize);
  setMsg('');
  openPanel('lobbyPanel');

  // Test hook: lets automated checks rig the deck, steer the computer players and speed up timers; harmless for players.
  window.__pk = {
    get phase() { return phase; }, get seats() { return seats; }, get hand() { return hand; }, get button() { return button; },
    get handNo() { return handNo; }, get level() { return level; }, get stats() { return stats; },
    score, bestFive, handName, buildPots, splitPot, chen, parseCard, cardText, equity: (h, b, o, n) => equity(h, b, o, n),
    rig(spec) { rig = spec; }, ai(policy) { aiOverride = policy; }, speed(x) { delayScale = x; }, hold(v) { autoNext = !v; },
    next() { if (resolveNext) resolveNext('go'); }, act, quick, start: startTable,
  };
})();
</script>
</body>
</html>
