<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Search</title>
<style>
:root {
  --bg: #fcefe0;
  --bg-2: #fff9f1;
  --ink: #2b2550;
  --muted: #6f6990;
  --accent: #ff7a45;
  --accent-dark: #d65a27;
  --violet: #6b56e8;
  --violet-dark: #4c39c2;
  --paper: #fffdf9;
  --line: #efdcc6;
  --soft: #f7eadb;
  --red: #e5484d;
  --green: #279667;
  --side: clamp(220px, 27vw, 330px);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(circle at 1px 1px, #2b255012 1px, transparent 1.6px), radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 72%);
  background-size: 18px 18px, 100% 100%;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

.app { height: 100%; max-width: 640px; margin: auto; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "top" "hud" "stage" "list"; gap: 10px; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.top { grid-area: top; display: flex; align-items: center; gap: 8px; min-width: 0; }
h1 { flex: none; font-size: clamp(22px, 6.4vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
h1 span { color: var(--accent); }
.chip { min-width: 0; padding: 5px 10px; border-radius: 99px; background: #fff; box-shadow: 0 2px 0 var(--line); color: var(--violet-dark); font-size: 12px; font-weight: 800; line-height: 1.25; white-space: nowrap; }
.spacer { flex: 1; }
.icon-btn { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

.hud { grid-area: hud; display: flex; gap: 8px; }
.stat { flex: 1 1 0; min-width: 0; padding: 5px 6px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line); text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); line-height: 1.2; }
.stat strong { display: block; font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.stat.low strong { color: var(--red); animation: tick 1s infinite; }
@keyframes tick { 50% { opacity: .55; } }
.hint-btn { flex: 0 0 auto; min-width: 72px; padding-inline: 10px; background: var(--accent); box-shadow: 0 3px 0 var(--accent-dark); color: #fff; }
.hint-btn small { color: #fff; opacity: .9; }
.hint-btn strong { font-size: 18px; }
.hint-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }
.hint-btn:disabled { opacity: .5; }

.stage { grid-area: stage; position: relative; min-height: 0; display: grid; place-items: center; container-type: size; }
.board { display: block; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); border-radius: 18px; background: var(--paper); box-shadow: 0 5px 0 var(--line), 0 14px 30px #2b255016; touch-action: none; cursor: crosshair; }
.board:focus-visible { outline-offset: 4px; }
.board .paper { fill: var(--paper); }
.board .guide { fill: #2b255006; }
.board .letters text { font-family: var(--font); font-size: .6px; font-weight: 800; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; transform-box: fill-box; transform-origin: center; }
.board.big .letters text { font-size: .64px; }
.board line { stroke-linecap: round; fill: none; }
.board .found line { stroke-width: .8; opacity: .62; }
.board .sel { stroke-width: .8; opacity: .55; }
.board .bad { stroke: var(--red); stroke-width: .8; opacity: 0; }
.board .bad.on { animation: bad .55s ease-out; }
@keyframes bad { 0% { opacity: .5; } 100% { opacity: 0; } }
.board .miss .o { stroke: var(--red); stroke-width: .84; opacity: .8; }
.board .miss .i { stroke: var(--paper); stroke-width: .68; }
.board .anchor { fill: none; stroke: var(--violet); stroke-width: .09; stroke-dasharray: .2 .12; opacity: 0; }
.board .anchor.on { opacity: 1; }
.board .hint-ring { fill: #ffd23f; stroke: var(--accent); stroke-width: .08; opacity: 0; transform-box: fill-box; transform-origin: center; }
.board .hint-ring.on { animation: ring 1s ease-in-out 3; }
@keyframes ring { 0%, 100% { opacity: .95; transform: scale(1); } 50% { opacity: .35; transform: scale(1.18); } }
.board .cursor { fill: none; stroke: var(--violet); stroke-width: .08; opacity: 0; }
.board.kb .cursor { opacity: 1; }
.board.win .letters text { animation: hop .6s var(--d) both; }
@keyframes hop { 40% { transform: translateY(-.22px) scale(1.28); fill: var(--violet-dark); } }

.toast { position: absolute; left: 50%; top: 10px; z-index: 3; max-width: calc(100% - 24px); padding: 7px 14px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 800; text-align: center; line-height: 1.25; transform: translate(-50%, -8px); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: var(--green); }
.toast.bad { background: var(--red); }
.toast.warn { background: var(--accent-dark); }

.list { grid-area: list; min-height: 0; display: flex; flex-direction: column; }
.list-head { display: none; }
.words { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px 6px; max-height: 27dvh; overflow-y: auto; padding: 2px; }
.words li { position: relative; padding: 3px 9px; border-radius: 9px; background: #ffffffc0; box-shadow: 0 2px 0 var(--line); font-size: 13px; font-weight: 800; letter-spacing: .05em; line-height: 1.3; white-space: nowrap; }
.words li.found { background: var(--hl); box-shadow: none; color: #2b2550a6; text-decoration: line-through; text-decoration-thickness: 2px; }
.words li.hinted { box-shadow: 0 0 0 2px var(--accent); animation: tick 1s 3; }

.overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); background: #2b255070; }
.panel { width: min(100%, 380px); max-height: 100%; overflow: auto; overscroll-behavior: contain; padding: 22px 18px; border-radius: 26px; background: var(--paper); text-align: center; box-shadow: 0 20px 50px #2b255055; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 27px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.panel h2 span { color: var(--accent); }
.panel .emoji { font-size: 42px; line-height: 1.2; }
.panel p { margin-top: 6px; color: var(--muted); font-size: 15px; line-height: 1.4; }
.panel .sub { font-weight: 800; color: var(--violet-dark); }
.panel .result { color: var(--ink); font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stars { margin-top: 8px; font-size: 34px; letter-spacing: 4px; color: #e9dcc9; line-height: 1.1; }
.stars i { font-style: normal; }
.stars i.on { color: #ffb627; text-shadow: 0 2px 0 #d68a00; }
.badge { display: inline-block; margin-top: 8px; padding: 5px 14px; border-radius: 99px; background: var(--accent); color: #fff !important; font-size: 14px; font-weight: 800; }
.cta { display: block; width: 100%; margin-top: 16px; padding: 14px 10px; border-radius: 16px; background: var(--violet); color: #fff; font-size: 18px; font-weight: 900; line-height: 1.15; box-shadow: 0 5px 0 var(--violet-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--violet-dark); }
.secondary { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 14px; font-size: 15px; font-weight: 800; box-shadow: inset 0 0 0 2px #2b255024; }
.panel :focus-visible { outline-color: var(--accent); }

/* Menu: header, modes and buttons stay put; the theme grid scrolls */
.panel.menu { width: min(100%, 460px); display: flex; flex-direction: column; overflow: hidden; padding: 18px 16px 14px; text-align: left; }
.m-head { text-align: center; }
.m-head p { margin-top: 4px; font-size: 14px; }
.modes { flex: none; margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 16px; background: var(--soft); }
.modes button { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; padding: 6px 2px; border-radius: 12px; font-size: 12.5px; font-weight: 800; line-height: 1.15; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
.modes button b { font-size: 18px; line-height: 1.2; }
.modes button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.intro { flex: none; margin-top: 10px !important; font-size: 13px !important; line-height: 1.35 !important; text-align: center; }
.field { flex: none; margin-top: 10px; }
.field > span { display: block; margin: 0 4px 4px; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.f-theme { flex: 0 1 auto; min-height: 96px; display: flex; flex-direction: column; }
.themes { min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: 6px; padding: 2px 2px 4px; }
.themes button { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 7px 8px; border-radius: 12px; background: #fff; box-shadow: 0 2px 0 var(--line), inset 0 0 0 1.5px var(--line); font-size: 13px; font-weight: 800; line-height: 1.15; text-align: left; }
.themes button b { flex: none; font-size: 18px; line-height: 1; }
.themes button span { min-width: 0; overflow-wrap: anywhere; }
.themes button[aria-pressed="true"] { background: #efebff; box-shadow: inset 0 0 0 2.5px var(--violet); color: var(--violet-dark); }
.seg { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 14px; background: var(--soft); }
.seg button { min-width: 0; padding: 7px 2px; border-radius: 10px; font-size: 14px; font-weight: 900; line-height: 1.15; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
.seg button small { display: block; font-size: 11px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.desc { margin: 5px 4px 0 !important; font-size: 12.5px !important; line-height: 1.3 !important; min-height: 2.6em; }
.day { flex: none; margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: linear-gradient(135deg, #fff0e2, #efeaff); }
.cal { flex: none; width: 66px; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 2px 0 var(--line); text-align: center; }
.cal b { display: block; padding: 3px 0; background: var(--accent); color: #fff; font-size: 11px; text-transform: uppercase; }
.cal strong { display: block; padding: 4px 0 6px; font-size: 28px; line-height: 1; }
.day-info { min-width: 0; }
.day-info .d-theme { margin-top: 0; font-size: 16px; font-weight: 900; color: var(--ink); }
.day-info p { margin-top: 3px; font-size: 13px; }
.day-info .d-streak { font-weight: 800; color: var(--accent-dark); }
.day-info .d-status { font-weight: 800; color: var(--ink); }
.m-foot { flex: none; }
.m-foot .cta { margin-top: 12px; }
.m-foot .secondary { margin-top: 8px; }
.m-stats { margin-top: 8px !important; font-size: 12.5px !important; text-align: center; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (min-width: 480px) and (max-aspect-ratio: 5/4) {
  .words li { font-size: 14px; padding: 4px 10px; }
}
@media (max-width: 360px) {
  .hud { gap: 6px; }
  .stat small { letter-spacing: 0; }
  .hint-btn { min-width: 62px; padding-inline: 6px; }
  .words { gap: 4px; }
  .words li { padding: 2px 6px; font-size: 12px; letter-spacing: .02em; }
  .modes button { font-size: 11.5px; }
}
/* Short portrait phones: smaller header, tighter word chips so the grid keeps its size */
@media (max-height: 620px) and (max-aspect-ratio: 5/4) {
  .app { gap: 7px; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  h1 { font-size: 21px; }
  .icon-btn { width: 36px; height: 36px; }
  .stat { padding: 3px 6px; }
  .stat strong { font-size: 16px; }
  .words { max-height: 24dvh; gap: 4px; }
  .words li { padding: 2px 6px; font-size: 12px; letter-spacing: .02em; }
}
@media (max-height: 640px) {
  .m-head p { display: none; }
  .desc { min-height: 0; }
}
@media (max-height: 560px) and (max-aspect-ratio: 5/4) {
  .intro { display: none; }
  .field { margin-top: 6px; }
  .seg button small { display: none; }
}
@media (max-height: 600px) {
  .overlay { padding: 10px; }
  .panel { padding: 16px 14px; }
  .panel.menu { padding: 12px 12px 10px; }
  .cta { margin-top: 12px; padding: 11px; font-size: 17px; }
  .modes { margin-top: 8px; }
  .modes button b { font-size: 16px; }
}

/* Wide frames: the grid fills the height on the left; HUD and word list live in a side column */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: calc(100dvh + var(--side) + 12px); grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "stage top" "stage hud" "stage list"; column-gap: 18px; row-gap: 10px; }
  .top { padding-top: 2px; }
  h1 { font-size: clamp(22px, 2.4vw, 32px); }
  .top .chip { display: none; }
  .list { border-radius: 18px; background: #ffffffa8; box-shadow: 0 3px 0 var(--line); padding: 10px 10px 8px; }
  .list-head { display: flex; align-items: baseline; gap: 8px; padding: 0 4px 8px; margin-bottom: 6px; border-bottom: 2px dashed var(--line); }
  .list-head b { min-width: 0; flex: 1; font-size: 15px; font-weight: 900; color: var(--violet-dark); overflow-wrap: anywhere; }
  .list-head span { flex: none; font-size: 14px; font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; }
  .words { max-height: none; flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; align-content: start; justify-content: stretch; gap: 6px; }
  .words li { font-size: clamp(12px, 1.25vw, 16px); padding: 4px 8px; text-align: center; overflow: hidden; text-overflow: clip; }
  .panel.menu { width: min(100%, 860px); height: min(100%, 600px); display: grid; grid-template-columns: minmax(250px, .85fr) minmax(0, 1.15fr); grid-template-rows: auto auto auto auto auto minmax(0, 1fr) auto; grid-template-areas: "head side" "modes side" "intro side" "size side" "diff side" ". side" "foot side"; column-gap: 18px; padding: 16px 16px 14px; }
  .m-head { grid-area: head; }
  .modes { grid-area: modes; }
  .intro { grid-area: intro; }
  .f-size { grid-area: size; }
  .f-diff { grid-area: diff; }
  .f-theme, .day { grid-area: side; }
  .f-theme { margin-top: 0; min-height: 0; }
  .day { align-self: center; flex-direction: column; text-align: center; padding: 20px; }
  .day .cal { width: 86px; }
  .day .cal strong { font-size: 36px; }
  .m-foot { grid-area: foot; }
  .themes { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
  .panel.menu.is-daily { height: auto; width: min(100%, 720px); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "head side" "modes side" ". side" "foot side"; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  .app { --side: clamp(200px, 30vw, 270px); column-gap: 12px; row-gap: 6px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 12px; }
  .hud { gap: 6px; }
  .stat { padding: 2px 4px; border-radius: 12px; }
  .stat small { font-size: 10px; letter-spacing: 0; }
  .stat strong { font-size: 15px; }
  .hint-btn { min-width: 54px; padding-inline: 6px; }
  .hint-btn strong { font-size: 15px; }
  .list { padding: 6px 6px 4px; border-radius: 14px; }
  .list-head { padding: 0 2px 4px; margin-bottom: 4px; }
  .list-head b { font-size: 13px; }
  .list-head span { font-size: 12px; }
  .words { gap: 4px; }
  .words li { font-size: 12px; padding: 2px 4px; letter-spacing: .02em; }
  .board { border-radius: 14px; }
}
@media (max-height: 420px) {
  .overlay { padding: 8px; }
  .panel { padding: 12px 16px; border-radius: 20px; }
  .panel h2 { font-size: 21px; }
  .panel .emoji { font-size: 28px; }
  .panel p { margin-top: 3px; font-size: 13px; line-height: 1.3; }
  .stars { margin-top: 2px; font-size: 26px; }
  .badge { margin-top: 4px; padding: 3px 12px; font-size: 13px; }
  .cta { margin-top: 8px; padding: 9px; font-size: 16px; }
  .secondary { margin-top: 6px; padding: 7px; font-size: 14px; }
  .panel.menu { padding: 10px 12px; column-gap: 14px; }
  .m-head h2 { font-size: 20px; }
  .modes { margin-top: 6px; }
  .modes button { padding: 3px 2px; font-size: 11px; }
  .modes button b { font-size: 14px; }
  .intro { display: none; }
  .field { margin-top: 5px; }
  .field > span { margin-bottom: 2px; font-size: 10px; }
  .seg button { padding: 5px 2px; font-size: 13px; }
  .seg button small { display: none; }
  .desc { display: none; }
  .themes button { padding: 5px 6px; font-size: 12px; }
  .themes button b { font-size: 15px; }
  .m-foot .cta { margin-top: 6px; }
  .m-foot .secondary { margin-top: 5px; }
  .m-stats { margin-top: 4px !important; font-size: 11px !important; }
  .day { padding: 10px; gap: 8px; }
  .day .cal { width: 64px; }
  .day .cal strong { font-size: 26px; }
  #win .panel, #lose .panel { width: min(100%, 560px); display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 18px; align-items: center; }
  #win .panel > *, #lose .panel > * { grid-column: 2; }
  #win .panel > .emoji, #lose .panel > .emoji { grid-column: 1; grid-row: 1 / span 8; font-size: 52px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .board .hint-ring.on { opacity: .9; } }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>Word <span>Search</span></h1>
    <span class="chip" id="chip"></span>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="open-menu" data-i18n-label="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
  </div>
  <div class="hud">
    <div class="stat" id="time-card"><small id="time-label" data-i18n="time"></small><strong id="time">0:00</strong></div>
    <div class="stat"><small data-i18n="found"></small><strong id="found">0/0</strong></div>
    <button type="button" class="stat hint-btn" id="hint"><small data-i18n="hint"></small><strong aria-hidden="true">💡</strong></button>
  </div>
  <div class="stage">
    <svg class="board" id="board" tabindex="0" role="application" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="toast" id="toast" aria-hidden="true"></div>
  </div>
  <section class="list" aria-labelledby="list-title">
    <div class="list-head"><b id="list-title"></b><span id="list-count"></span></div>
    <ul class="words" id="words"></ul>
  </section>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="menu" hidden>
  <div class="panel menu" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="m-head">
      <h2 id="menu-title">Word <span>Search</span></h2>
      <p data-i18n="tagline"></p>
    </div>
    <div class="modes" id="modes" role="group" data-i18n-label="modeLabel">
      <button type="button" data-mode="classic"><b aria-hidden="true">🔎</b><span data-i18n="mClassic"></span></button>
      <button type="button" data-mode="daily"><b aria-hidden="true">📅</b><span data-i18n="mDaily"></span></button>
      <button type="button" data-mode="timed"><b aria-hidden="true">⏱️</b><span data-i18n="mTimed"></span></button>
    </div>

  }

  const savePrefs = () => store.set('prefs', prefs);
  const saveStats = () => store.set('stats', stats);

  // ---------- game state ----------
  let G = null;
  let drag = null;
  let anchor = null;
  let cursor = 0;
  let lastSave = 0;
  const svg = els.board;
  const svgEl = (tag, attrs, parent) => { const el = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (parent) parent.append(el); return el; };

  const inProgress = () => G && !G.done && !G.lost && (G.found.length > 0 || G.elapsed > 1500 || G.hints > 0);

  function newGame(mode, spec, resume) {
    const puz = generate(spec);
    G = {
      mode, spec, puz, found: [], elapsed: 0, hints: 0, hinted: -1, done: false, lost: false, warned: false,
      practice: mode === 'daily' && !!stats.daily.times[spec.date],
      limit: mode === 'timed' ? puz.words.length * DIFFS[spec.diff].spw * 1000 : 0,

    if (resume) {

  function buildBoard() {
    const n = G.puz.size;

  function win() {

    saveGame();
    renderTime();
    svg.classList.add('win');
    els.winTitle.textContent = G.mode === 'daily' ? t.wonDaily : t.won;
    els.winSub.textContent = `${THEME[G.puz.theme].emoji} ${themeName(G.puz.theme)} · ${G.puz.size}×${G.puz.size} · ${t[G.puz.diff]}`;

  }

    drag = null;

  // ---------- menu ----------

    } else {
      const theme = prefs.theme === 'random' ? pickRandomTheme() : prefs.theme;
      newGame(menuMode, { seed: Math.floor(Math.random() * 2 ** 32), theme, size: prefs.size, diff: prefs.diff });
    }
    hideOverlays();
    lastTick = performance.now();
    svg.focus({ preventScroll: true });
  }
  function pickRandomTheme() {
    const others = THEMES.filter(th => !G || th.id !== G.puz.theme);
    return others[Math.floor(Math.random() * others.length)].id;
  }

  els.modes.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; menuMode = b.dataset.mode; renderMenu(); });
  els.themes.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; prefs.theme = b.dataset.theme; savePrefs(); renderMenu(); });
  els.sizes.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; prefs.size = +b.dataset.size; savePrefs(); renderMenu(); });
  els.diffs.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; prefs.diff = b.dataset.diff; savePrefs(); renderMenu(); });
  els.play.addEventListener('click', () => startFromMenu(false));
  els.resume.addEventListener('click', () => { const target = resumeTarget(); if (target && target.live) { hideOverlays(); lastTick = performance.now(); svg.focus({ preventScroll: true }); } else startFromMenu(true); });
  els.closeMenu.addEventListener('click', () => { hideOverlays(); lastTick = performance.now(); svg.focus({ preventScroll: true }); });
  $('open-menu').addEventListener('click', () => { saveGame(); openMenu(); });
  els.hint.addEventListener('click', hint);
  els.next.addEventListener('click', () => {
    if (G.mode === 'daily') { menuMode = 'classic'; startFromMenu(false); return; }
    menuMode = G.mode;
    startFromMenu(false);
  });
  $('win-menu').addEventListener('click', () => openMenu(G.mode));
  $('retry').addEventListener('click', () => { menuMode = 'timed'; startFromMenu(false); });
  $('lose-menu').addEventListener('click', () => openMenu('timed'));

  // ---------- boot: show the saved or a fresh puzzle behind the menu ----------
  buildMenu();
  const bootSave = saves.classic && saves.classic.spec && THEME[saves.classic.spec.theme] && SIZES.includes(saves.classic.spec.size) && DIFFS[saves.classic.spec.diff] ? saves.classic : null;
  if (bootSave) newGame('classic', bootSave.spec, bootSave);
  else newGame('classic', { seed: Math.floor(Math.random() * 2 ** 32), theme: prefs.theme === 'random' ? pickRandomTheme() : prefs.theme, size: prefs.size, diff: prefs.diff });
  openMenu(prefs.mode);

  // Read-only hooks for automated tests (no way to change the score or solve a puzzle from here).
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__wordSearch = {
    state: () => G && { mode: G.mode, theme: G.puz.theme, size: G.puz.size, diff: G.puz.diff, seed: G.puz.seed, words: G.puz.words.length, found: G.found.length, elapsed: Math.round(G.elapsed), limit: G.limit, hints: G.hints, done: G.done, lost: G.lost, practice: G.practice, anchor, cursor, overlay: overlays.find(o => !o.hidden)?.id || null },
    words: () => G && G.puz.words.map(w => ({ word: w.word, cells: w.cells.slice(), dir: w.dir })),
    grid: () => G && G.puz.grid.join(''),
    cellPoint: i => { const r = svg.getBoundingClientRect(); const span = G.puz.size + 2 * PAD; const [x, y] = center(i); return { x: r.left + (x + PAD) / span * r.width, y: r.top + (y + PAD) / span * r.height }; },
    generate: spec => { const p = generate(spec); return { grid: p.grid.join(''), words: p.words.map(w => ({ word: w.word, cells: w.cells.slice(), dir: w.dir })) }; },
    count: (grid, n, word) => countOccurrences([...grid], n, word),
    themes: () => THEMES.map(th => ({ id: th.id, words: th.words.slice() })),
    dailySpec: key => dailySpec(key),
  };
})();
</script>
</body>
</html>
