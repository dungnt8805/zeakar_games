<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air Hockey</title>
<style>
:root {
  --bg: #060918;
  --text: #f2f4ff;
  --muted: #98a1c9;
  --p1: #ff4fd8;
  --p2: #3be8ff;
  --puck: #fff36b;
  --accent: #ff4fd8;
  --accent-dark: #b52a96;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(ellipse at 50% 100%, #2a0f3f, transparent 60%), radial-gradient(ellipse at 50% 0%, #0c2d45, transparent 60%), var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--p2); outline-offset: 3px; }

.app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; max-width: 480px; width: 100%; margin: 0 auto; }
.side { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 14px; background: #ffffff0c; box-shadow: inset 0 0 0 1px #ffffff16; }
.side.top { flex-direction: row-reverse; text-align: right; }
.side i { flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%; }
.side.bottom i { background: var(--p1); box-shadow: 0 0 10px var(--p1); }
.side.top i { background: var(--p2); box-shadow: 0 0 10px var(--p2); }
.side div { min-width: 0; flex: 1; }
.side small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--muted); }
.side strong { display: block; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.side.bottom strong { text-shadow: 0 0 10px #ff4fd888; }
.side.top strong { text-shadow: 0 0 10px #3be8ff88; }
.mid { display: flex; flex-direction: column; align-items: center; gap: 3px; max-width: 110px; }
.mid small { font-size: 10px; font-weight: 800; color: var(--muted); text-align: center; line-height: 1.2; }
.icon-btn { width: 38px; height: 34px; display: grid; place-items: center; border-radius: 12px; background: #ffffff14; font-size: 18px; font-weight: 900; }
.icon-btn:active { transform: translateY(1px); }
.stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
canvas { display: block; border-radius: 26px; touch-action: none; background: #0a0f26; box-shadow: 0 0 0 1px #8f7dff33, 0 0 50px #8f7dff22, 0 20px 40px #000a; }
canvas:focus-visible { outline: 2px solid #3be8ff88; outline-offset: 4px; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #03050fb0; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; background: #121633f0; border-radius: 26px; padding: 22px 20px; text-align: center; box-shadow: 0 0 0 1px #8f7dff44, 0 0 40px #ff4fd822, 0 20px 50px #000a; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 30px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.panel h2 span { color: var(--p2); text-shadow: 0 0 14px #3be8ff88; }
.logo { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 8px; }
.logo i { width: 30px; height: 30px; border-radius: 50%; border: 4px solid var(--p1); box-shadow: 0 0 12px var(--p1), inset 0 0 8px var(--p1); }
.logo i:last-child { border-color: var(--p2); box-shadow: 0 0 12px var(--p2), inset 0 0 8px var(--p2); }
.logo b { width: 18px; height: 18px; border-radius: 50%; background: var(--puck); box-shadow: 0 0 14px var(--puck); }
.text { margin-top: 6px; font-size: 14px; color: #c9cdea; line-height: 1.45; }
.field { margin-top: 14px; text-align: left; }
.field[hidden] { display: none; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #ffffff10; }
.seg button { flex: 1; min-width: 0; padding: 9px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: #2a2f5c; color: var(--text); box-shadow: inset 0 0 0 1px #3be8ff66, 0 0 12px #3be8ff33; }
.hint { margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.45; }
.final { margin-top: 8px; font-size: 42px; font-weight: 900; font-variant-numeric: tabular-nums; }
.final b:first-child { color: var(--p1); text-shadow: 0 0 14px #ff4fd888; }
.final b:last-child { color: var(--p2); text-shadow: 0 0 14px #3be8ff88; }
.cta { margin-top: 18px; width: 100%; padding: 15px; border-radius: 18px; background: var(--accent); color: #2a0522; font-size: 19px; font-weight: 900; box-shadow: 0 6px 0 var(--accent-dark), 0 0 26px #ff4fd855; }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost-btn { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; background: #ffffff12; font-size: 16px; font-weight: 800; box-shadow: inset 0 0 0 1px #ffffff1c; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

  <div class="hud">
    <div class="side bottom"><i aria-hidden="true"></i><div><small id="name-0"></small><strong id="score-0">0</strong></div></div>

    <div class="side top"><i aria-hidden="true"></i><div><small id="name-1"></small><strong id="score-1">0</strong></div></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>

<div class="overlay" id="setup">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <div class="logo" aria-hidden="true"><i></i><b></b><i></i></div>

    <div class="field"><p class="label" id="mode-label" data-i18n="mode"></p><div class="seg" role="group" aria-labelledby="mode-label" data-key="mode"><button type="button" data-value="cpu" data-i18n="vsCpu"></button><button type="button" data-value="pvp" data-i18n="twoP"></button></div></div>
    <div class="field" id="level-field"><p class="label" id="level-label" data-i18n="difficulty"></p><div class="seg" role="group" aria-labelledby="level-label" data-key="level"><button type="button" data-value="easy" data-i18n="easy"></button><button type="button" data-value="normal" data-i18n="normal"></button><button type="button" data-value="hard" data-i18n="hard"></button></div></div>
    <p class="hint" id="hint"></p>
    <p class="hint" id="record"></p>
    <button type="button" class="cta" id="start" data-i18n="start"></button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="logo" aria-hidden="true"><i></i><b></b><i></i></div>
    <h2 id="result-title"></h2>
    <p class="final" id="final"><b></b> – <b></b></p>
    <p class="hint" id="result-record"></p>
    <button type="button" class="cta" id="rematch" data-i18n="rematch"></button>
    <button type="button" class="ghost-btn" id="change" data-i18n="change"></button>
  </div>
</div>

    th: { tagline: 'สไลด์ ตบแรง แล้วยิงประตูบนโต๊ะนีออนเรืองแสง!', mode: 'โหมด', vsCpu: 'เล่นกับคอม', twoP: '2 ผู้เล่น', difficulty: 'ระดับ', easy: 'ง่าย', normal: 'ปานกลาง', hard: 'ยาก', start: 'เริ่มเกม', controlsCpu: 'ลากไม้ตีในครึ่งล่าง หรือใช้ปุ่มลูกศร / WASD', controls2p: 'ผู้เล่นแต่ละคนลากไม้ตีของตัวเอง รองรับมัลติทัช คีย์บอร์ด: WASD (ฝั่งบน) และปุ่มลูกศร (ฝั่งล่าง)', you: 'คุณ', cpu: 'คอม', p1: 'ผู้เล่น 1', p2: 'ผู้เล่น 2', firstTo: n => `ถึง ${n} แต้มชนะ`, goal: 'ประตู!', goalYou: 'คุณยิงเข้า!', goalCpu: 'คอมยิงเข้า', goalP1: 'ผู้เล่น 1 ยิงเข้า', goalP2: 'ผู้เล่น 2 ยิงเข้า', winYou: 'คุณชนะ!', winCpu: 'คอมชนะ', winP1: 'ผู้เล่น 1 ชนะ!', winP2: 'ผู้เล่น 2 ชนะ!', record: (w, l) => `สถิติในระดับนี้: ชนะ ${w} · แพ้ ${l}`, rematch: 'แข่งอีกรอบ', change: 'เปลี่ยนโหมด', menu: 'เมนู', canvas: 'โต๊ะ Air Hockey', matchPoint: 'แมตช์พอยต์!' },
    ja: { tagline: '光るネオンのテーブルで、すべらせて、打ち込んで、ゴールを決めよう！', mode: 'モード', vsCpu: 'CPU対戦', twoP: '2人対戦', difficulty: '難易度', easy: 'かんたん', normal: 'ふつう', hard: 'むずかしい', start: '試合開始', controlsCpu: '下半分でマレットをドラッグ。矢印キー / WASD でも操作できます。', controls2p: 'それぞれ自分のマレットをドラッグ（マルチタッチ対応）。キーボードは WASD（上）と矢印キー（下）。', you: 'あなた', cpu: 'CPU', p1: 'プレイヤー1', p2: 'プレイヤー2', firstTo: n => `${n}点先取`, goal: 'ゴール！', goalYou: 'あなたのゴール！', goalCpu: 'CPUのゴール', goalP1: 'プレイヤー1のゴール', goalP2: 'プレイヤー2のゴール', winYou: 'あなたの勝ち！', winCpu: 'CPUの勝ち', winP1: 'プレイヤー1の勝ち！', winP2: 'プレイヤー2の勝ち！', record: (w, l) => `この難易度の戦績：${w}勝 ${l}敗`, rematch: '再戦', change: 'モード変更', menu: 'メニュー', canvas: 'Air Hockey のテーブル', matchPoint: 'マッチポイント！' },
    ko: { tagline: '빛나는 네온 테이블에서 밀고, 때리고, 골을 넣으세요!', mode: '모드', vsCpu: '컴퓨터 대전', twoP: '2인 대전', difficulty: '난이도', easy: '쉬움', normal: '보통', hard: '어려움', start: '경기 시작', controlsCpu: '아래쪽 절반에서 말렛을 드래그하거나 방향키 / WASD를 사용하세요.', controls2p: '각자 자기 말렛을 드래그하세요(멀티터치 지원). 키보드: WASD(위), 방향키(아래).', you: '나', cpu: 'CPU', p1: '플레이어 1', p2: '플레이어 2', firstTo: n => `${n}점 선승`, goal: '골!', goalYou: '골인!', goalCpu: 'CPU 골', goalP1: '플레이어 1 골', goalP2: '플레이어 2 골', winYou: '승리!', winCpu: 'CPU 승리', winP1: '플레이어 1 승리!', winP2: '플레이어 2 승리!', record: (w, l) => `이 난이도 전적: ${w}승 ${l}패`, rematch: '재대결', change: '모드 변경', menu: '메뉴', canvas: 'Air Hockey 테이블', matchPoint: '매치 포인트!' },
  };
  const requested = new URLSearchParams(location.search).get('lang');
  const lang = I18N[requested] ? requested : 'en';
  const t = I18N[lang];

  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t[el.dataset.i18n];
  for (const el of document.querySelectorAll('[data-i18n-label]')) el.setAttribute('aria-label', t[el.dataset.i18nLabel]);

  const W = 360, H = 640, EDGE = 12, CORNER = 44, GOAL_W = 116;
  const PUCK_R = 15, MALLET_R = 25;
  const STEP = 1 / 240, FRICTION = 0.28, WALL_E = 0.88, MALLET_E = 0.92, MAX_PUCK = 1500;
  const POINTER_SPEED = 2600, KEY_SPEED = 520;
  const WIN_SCORE = 7;
  const COLORS = ['#ff4fd8', '#3be8ff'];
  const HOME = [{ x: W / 2, y: H - EDGE - 70 }, { x: W / 2, y: EDGE + 70 }];
  // speed: mallet px/s; reaction: seconds between re-plans; error: aim noise in px; attack: puck speed above which it defends instead.
  const AI = { easy: { speed: 330, reaction: 0.24, error: 26, attack: 260 }, normal: { speed: 560, reaction: 0.12, error: 12, attack: 520 }, hard: { speed: 860, reaction: 0.05, error: 5, attack: 900 } };
  const KEY = 'milaan.airHockey.';

  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const rink = document.createElement('canvas');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(KEY + key)) ?? fallback; } catch { return fallback; } };
  const write = (key, value) => { try { localStorage.setItem(KEY + key, JSON.stringify(value)); } catch {} };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  const settings = Object.assign({ mode: 'cpu', level: 'normal' }, read('settings', {}));
  if (!AI[settings.level]) settings.level = 'normal';
  if (settings.mode !== 'pvp') settings.mode = 'cpu';
  const stats = Object.assign({ easy: { w: 0, l: 0 }, normal: { w: 0, l: 0 }, hard: { w: 0, l: 0 } }, read('stats', {}));

  function resize() {
    const stage = $('stage').getBoundingClientRect();
    scale = Math.min(stage.width / W, stage.height / H);

    canvas.style.width = `${W * scale}px`;
    canvas.style.height = `${H * scale}px`;
    canvas.width = rink.width = Math.round(W * scale * dpr);
    canvas.height = rink.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    drawRink();
    draw();
  }

  const keys = [{ up: false, down: false, left: false, right: false }, { up: false, down: false, left: false, right: false }];
  const pointers = new Map();
  let game = newGameState();

  function newGameState() {
    return { mode: settings.mode, level: settings.level, scores: [0, 0], state: 'menu', timer: 0, lastScorer: -1,

  const names = () => (game.mode === 'cpu' ? [t.you, t.cpu] : [t.p1, t.p2]);

  function updateHud() {

  function startMatch() {
    game = newGameState();
    write('settings', settings);
    $('setup').hidden = true;

    updateHud();

  // The player who just conceded gets the puck on their side.
  function dropPuck(side) {
    const p = game.puck;
    p.x = W / 2;
    p.y = H / 2 + (side === 0 ? 90 : -90);
    p.vx = p.vy = 0;
    game.trail = [];
    game.state = 'drop';
    game.timer = 0.6;
    if (game.mode === 'cpu') { game.mallets[1].x = HOME[1].x; game.mallets[1].y = HOME[1].y; }
  }

  // ---- Physics ----
  function malletBounds(i) {
    return { minX: EDGE + MALLET_R, maxX: W - EDGE - MALLET_R, minY: i === 0 ? H / 2 + MALLET_R : EDGE + MALLET_R, maxY: i === 0 ? H - EDGE - MALLET_R : H / 2 - MALLET_R };
  }

  function moveMallet(i, target, maxSpeed, dt) {
    const m = game.mallets[i], b = malletBounds(i);
    const tx = clamp(target.x, b.minX, b.maxX), ty = clamp(target.y, b.minY, b.maxY);
    const dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy);
    const step = Math.min(d, maxSpeed * dt);
    const nx = d ? m.x + dx / d * step : m.x, ny = d ? m.y + dy / d * step : m.y;
    m.vx = (nx - m.x) / dt;
    m.vy = (ny - m.y) / dt;
    m.x = nx;
    m.y = ny;
  }

  function controlMallet(i, dt) {
    const m = game.mallets[i], k = keys[i];
    const kx = (k.right ? 1 : 0) - (k.left ? 1 : 0), ky = (k.down ? 1 : 0) - (k.up ? 1 : 0);
    if (kx || ky) {
      m.target = null;
      const len = Math.hypot(kx, ky);
      moveMallet(i, { x: m.x + kx / len * 100, y: m.y + ky / len * 100 }, KEY_SPEED, dt);
    } else if (m.target) moveMallet(i, m.target, POINTER_SPEED, dt);
    else moveMallet(i, m, 0, dt);
  }

  function sparks(x, y, color, count, speed) {
    if (reducedMotion.matches) count = Math.ceil(count / 3);
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random());
      game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.55), color });
    }
  }

  function bounce(p, nx, ny, e) {
    const vn = p.vx * nx + p.vy * ny;
    if (vn >= 0) return false;
    p.vx -= (1 + e) * vn * nx;
    p.vy -= (1 + e) * vn * ny;
    return -vn > 120;
  }

  function collidePuckWalls() {
    const p = game.puck, r = PUCK_R;
    let loud = false;
    // Rounded corners: keep the puck inside each corner's arc.
    const cx = clamp(p.x, EDGE + CORNER, W - EDGE - CORNER), cy = clamp(p.y, EDGE + CORNER, H - EDGE - CORNER);
    if (cx !== p.x && cy !== p.y) {
      const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy), max = CORNER - r;
      if (d > max) {
        p.x = cx + dx / d * max;
        p.y = cy + dy / d * max;
        loud = bounce(p, -dx / d, -dy / d, WALL_E);
      }
    } else {
      if (p.x < EDGE + r) { p.x = EDGE + r; loud = bounce(p, 1, 0, WALL_E); }
      if (p.x > W - EDGE - r) { p.x = W - EDGE - r; loud = bounce(p, -1, 0, WALL_E); }
      const inMouth = Math.abs(p.x - W / 2) < GOAL_W / 2;
      if (!inMouth && p.y < EDGE + r) { p.y = EDGE + r; loud = bounce(p, 0, 1, WALL_E); }
      if (!inMouth && p.y > H - EDGE - r) { p.y = H - EDGE - r; loud = bounce(p, 0, -1, WALL_E); }
    }
    // Goal posts act as round bumpers.
    for (const px of [W / 2 - GOAL_W / 2, W / 2 + GOAL_W / 2]) for (const py of [EDGE, H - EDGE]) {
      const dx = p.x - px, dy = p.y - py, d = Math.hypot(dx, dy);
      if (d < r && d > 0) { p.x = px + dx / d * r; p.y = py + dy / d * r; loud = bounce(p, dx / d, dy / d, WALL_E) || loud; }
    }
    if (loud) sparks(p.x, p.y, '#b9a8ff', 5, 90);
  }

  function collidePuckMallet(i) {
    const p = game.puck, m = game.mallets[i];
    const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy), min = PUCK_R + MALLET_R;
    if (d >= min || d === 0) return;
    const nx = dx / d, ny = dy / d;
    p.x = m.x + nx * min;
    p.y = m.y + ny * min;
    // The mallet is effectively infinite mass: reflect the puck's velocity relative to the mallet.
    const vn = (p.vx - m.vx) * nx + (p.vy - m.vy) * ny;
    if (vn < 0) {
      p.vx -= (1 + MALLET_E) * vn * nx;
      p.vy -= (1 + MALLET_E) * vn * ny;
      const speed = Math.hypot(p.vx, p.vy);
      if (speed > MAX_PUCK) { p.vx *= MAX_PUCK / speed; p.vy *= MAX_PUCK / speed; }
      if (-vn > 150) { m.flash = 0.15; sparks(m.x + nx * MALLET_R, m.y + ny * MALLET_R, COLORS[i], 8, 160); }
    }
  }

  function stepPuck(dt) {
    const p = game.puck;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const k = Math.exp(-FRICTION * dt);
    p.vx *= k;
    p.vy *= k;
    collidePuckMallet(0);
    collidePuckMallet(1);
    collidePuckWalls();
    if (p.y < EDGE - PUCK_R * 0.7) goal(0);
    else if (p.y > H - EDGE + PUCK_R * 0.7) goal(1);
  }

  function goal(scorer) {
    game.scores[scorer] += 1;
    game.lastScorer = scorer;
    game.state = 'goal';
    game.timer = 1.3;
    sparks(game.puck.x, scorer === 0 ? EDGE : H - EDGE, COLORS[scorer], 36, 260);
    updateHud();
    const label = game.mode === 'cpu' ? (scorer === 0 ? t.goalYou : t.goalCpu) : (scorer === 0 ? t.goalP1 : t.goalP2);
    $('announcer').textContent = `${label} ${game.scores[0]}–${game.scores[1]}`;
    if (game.scores[scorer] >= WIN_SCORE) game.state = 'won';
  }

  function finishMatch() {
    game.state = 'over';
    const winner = game.lastScorer;
    let title;
    if (game.mode === 'cpu') {
      const s = stats[game.level];
      if (winner === 0) s.w += 1; else s.l += 1;
      write('stats', stats);
      title = winner === 0 ? t.winYou : t.winCpu;
      $('result-record').textContent = t.record(s.w, s.l);
    } else {
      title = winner === 0 ? t.winP1 : t.winP2;
      $('result-record').textContent = '';
    }
    $('result-title').textContent = title;
    const [a, b] = $('final').querySelectorAll('b');
    a.textContent = String(game.scores[0]);
    b.textContent = String(game.scores[1]);
    $('result').hidden = false;
    $('announcer').textContent = `${title} ${game.scores[0]}–${game.scores[1]}`;
    $('rematch').focus({ preventScroll: true });
  }

  // ---- Computer opponent (top mallet) ----
  function planAi() {
    const cfg = AI[game.level], ai = game.ai, p = game.puck, m = game.mallets[1];
    const noise = () => rand(-cfg.error, cfg.error);
    const speed = Math.hypot(p.vx, p.vy);
    const goalX = W / 2, goalY = EDGE;
    const defend = () => {
      // Stand on the line between the puck and the middle of our goal.
      const dx = p.x - goalX, dy = Math.max(30, p.y - goalY), d = Math.hypot(dx, dy);
      return { x: goalX + dx / d * 74 + noise(), y: goalY + dy / d * 74 + noise() };
    };
    if (ai.retreat > 0 || game.state !== 'play') { ai.target = { ...HOME[1] }; return; }
    if (p.y > H / 2 + PUCK_R) { ai.target = defend(); return; }
    if (p.vy < -cfg.attack * 0.6 && speed > cfg.attack) { ai.target = defend(); return; }
    // Attack: aim at the far goal (sometimes off a side wall) and swing through the puck from behind.
    if (!ai.aim || ai.aimAge-- <= 0) {
      // A bank shot aims at the goal mirrored in a side wall.
      const tx = W / 2 + rand(-GOAL_W / 3, GOAL_W / 3), roll = Math.random();
      const wallL = EDGE + PUCK_R, wallR = W - EDGE - PUCK_R;
      ai.aim = { x: roll < 0.15 ? 2 * wallL - tx : roll < 0.3 ? 2 * wallR - tx : tx, y: H };
      ai.aimAge = 8;
    }
    let ax = ai.aim.x - p.x, ay = ai.aim.y - p.y;
    const al = Math.hypot(ax, ay);
    ax /= al; ay /= al;
    const behindX = p.x - ax * (PUCK_R + MALLET_R + 6), behindY = p.y - ay * (PUCK_R + MALLET_R + 6);
    const along = (p.x - m.x) * ax + (p.y - m.y) * ay;
    const side = Math.abs((p.x - m.x) * ay - (p.y - m.y) * ax);
    if (along > 0 && side < MALLET_R * 0.8) ai.target = { x: p.x + ax * 40 + noise() * 0.3, y: p.y + ay * 40 };
    else if (m.y > p.y - 4) {
      // We are in front of the puck: loop around it on the far side from the centre.
      const around = p.x < m.x ? 1 : -1;
      ai.target = { x: p.x + around * (PUCK_R + MALLET_R + 10), y: p.y - (PUCK_R + MALLET_R) };
    } else ai.target = { x: behindX + noise(), y: behindY };
  }

  function updateAi(dt) {
    const cfg = AI[game.level], ai = game.ai, p = game.puck;
    // A puck sitting still in our half for too long is probably pinned; back off to free it.
    if (p.y < H / 2 && Math.hypot(p.vx, p.vy) < 25) ai.stuck += dt; else ai.stuck = 0;
    if (ai.stuck > 2.2) { ai.retreat = 0.6; ai.stuck = 0; ai.timer = 0; }
    ai.retreat = Math.max(0, ai.retreat - dt);
    ai.timer -= dt;
    if (ai.timer <= 0) { ai.timer = cfg.reaction; planAi(); }
    moveMallet(1, ai.target, cfg.speed, dt);
  }

  function update(dt) {
    controlMallet(0, dt);
    if (game.mode === 'cpu') updateAi(dt); else controlMallet(1, dt);
    for (const m of game.mallets) m.flash = Math.max(0, m.flash - dt);
    if (game.state === 'play') stepPuck(dt);
    else if (game.state === 'drop') {
      game.timer -= dt;
      collidePuckMallet(0);
      collidePuckMallet(1);
      collidePuckWalls();
      if (game.timer <= 0) game.state = 'play';
    } else if (game.state === 'goal' || game.state === 'won') {
      game.timer -= dt;
      if (game.timer <= 0) { if (game.state === 'won') finishMatch(); else dropPuck(game.lastScorer === 0 ? 1 : 0); }
    }
  }

  function updateEffects(dt) {
    if (game.state === 'play') {
      game.trail.push({ x: game.puck.x, y: game.puck.y });
      if (game.trail.length > (reducedMotion.matches ? 0 : 10)) game.trail.shift();
    } else if (game.trail.length) game.trail.shift();
    for (const p of game.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
    game.particles = game.particles.filter(p => p.life > 0);
  }

  // ---- Drawing ----
  function glowStroke(g, color, blur, width) {
    g.strokeStyle = color;
    g.shadowColor = color;
    g.shadowBlur = blur * scale * dpr;
    g.lineWidth = width;
    g.stroke();
  }

  // The static rink is painted once per resize onto an offscreen canvas.
  function drawRink() {
    const g = rink.getContext('2d');
    g.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0b1a36');
    bg.addColorStop(0.5, '#0d1030');
    bg.addColorStop(1, '#1d0f33');
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);
    g.fillStyle = '#ffffff12';
    for (let y = EDGE + 16; y < H - EDGE; y += 18) for (let x = EDGE + 14 + ((y / 18) % 2) * 9; x < W - EDGE; x += 18) g.fillRect(x - 0.75, y - 0.75, 1.5, 1.5);

    g.beginPath(); g.moveTo(EDGE, H / 2); g.lineTo(W - EDGE, H / 2);
    glowStroke(g, '#b9a8ff88', 8, 2);
    g.beginPath(); g.arc(W / 2, H / 2, 54, 0, Math.PI * 2);
    glowStroke(g, '#b9a8ff66', 8, 2);
    g.beginPath(); g.arc(W / 2, H / 2, 5, 0, Math.PI * 2);
    g.fillStyle = '#b9a8ff88'; g.fill();
    g.beginPath(); g.arc(W / 2, EDGE, 74, 0, Math.PI);
    glowStroke(g, '#3be8ff77', 10, 2);
    g.beginPath(); g.arc(W / 2, H - EDGE, 74, Math.PI, Math.PI * 2);
    glowStroke(g, '#ff4fd877', 10, 2);

    g.beginPath(); g.roundRect(EDGE - 3, EDGE - 3, W - EDGE * 2 + 6, H - EDGE * 2 + 6, CORNER + 3);
    glowStroke(g, '#8f7dff', 12, 4);
    g.shadowBlur = 0;
    // Goal mouths cut through the boards.
    for (const [y, color] of [[0, '#3be8ff'], [H - EDGE - 4, '#ff4fd8']]) {
      g.fillStyle = '#04050d';
      g.fillRect(W / 2 - GOAL_W / 2, y, GOAL_W, EDGE + 4);
      g.beginPath();
      g.moveTo(W / 2 - GOAL_W / 2, y === 0 ? 3 : H - 3);
      g.lineTo(W / 2 + GOAL_W / 2, y === 0 ? 3 : H - 3);
      glowStroke(g, color, 14, 4);
      g.shadowBlur = 0;
      for (const px of [W / 2 - GOAL_W / 2, W / 2 + GOAL_W / 2]) { g.beginPath(); g.arc(px, y === 0 ? EDGE : H - EDGE, 4, 0, Math.PI * 2); g.fillStyle = '#e8e4ff'; g.fill(); }
    }
  }

  function drawMallet(i) {
    const m = game.mallets[i], color = COLORS[i];
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = m.flash > 0 ? 30 : 16;
    ctx.fillStyle = color + '2a';
    ctx.beginPath(); ctx.arc(m.x, m.y, MALLET_R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(m.x, m.y, MALLET_R - 2, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(m.x, m.y, 11, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffffaa';
    ctx.beginPath(); ctx.arc(m.x - 3.5, m.y - 3.5, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (rink.width) ctx.drawImage(rink, 0, 0);
    ctx.restore();

    ctx.font = '900 120px ui-rounded, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff0d';
    ctx.fillText(String(game.scores[0]), W / 2, H * 0.75);
    ctx.save();
    ctx.translate(W / 2, H * 0.25);
    if (game.mode === 'pvp') ctx.rotate(Math.PI);
    ctx.fillText(String(game.scores[1]), 0, 0);
    ctx.restore();

    const trail = game.trail;
    for (let i = 0; i < trail.length; i++) {
      const k = (i + 1) / trail.length;
      ctx.globalAlpha = k * 0.25;
      ctx.fillStyle = '#fff36b';
      ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, PUCK_R * (0.5 + 0.5 * k), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const p of game.particles) { ctx.globalAlpha = Math.min(1, p.life * 3); ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;

    if (game.state === 'play' || game.state === 'drop' || game.state === 'menu') {
      const p = game.puck;
      ctx.save();
      ctx.globalAlpha = game.state === 'drop' ? 0.55 + 0.45 * Math.sin(game.timer * 20) ** 2 : 1;
      ctx.shadowColor = '#fff36b';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#fffbd6';
      ctx.beginPath(); ctx.arc(p.x, p.y, PUCK_R, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#e0c94a';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, PUCK_R - 5, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    drawMallet(0);
    drawMallet(1);

    if (game.state === 'goal' || game.state === 'won') {
      const color = COLORS[game.lastScorer];
      ctx.save();
      ctx.font = '900 54px ui-rounded, system-ui, sans-serif';
      ctx.shadowColor = color;
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#ffffff';
      ctx.translate(W / 2, H / 2);
      if (game.mode === 'pvp' && game.lastScorer === 1) ctx.rotate(Math.PI);
      ctx.fillText(t.goal, 0, 0);
      ctx.restore();
    } else if (game.state === 'drop' && Math.max(...game.scores) === WIN_SCORE - 1) {
      ctx.font = '900 22px ui-rounded, system-ui, sans-serif';
      ctx.fillStyle = '#fff36b';
      ctx.fillText(t.matchPoint, W / 2, H / 2);
    }
  }

  let last = performance.now(), acc = 0;
  function tick(time) {
    // Clamp dt so a stalled frame (tab switch, slow device) never teleports the puck.
    const dt = Math.min(0.05, Math.max(0, (time - last) / 1000));
    last = time;
    if (game.state !== 'menu' && game.state !== 'over') {
      acc += dt;
      while (acc >= STEP) { update(STEP); acc -= STEP; }
    } else acc = 0;
    updateEffects(dt);
    draw();
    requestAnimationFrame(tick);
  }

  // ---- Input ----
  function toWorld(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left) / scale, y: (event.clientY - rect.top) / scale };
  }
  canvas.addEventListener('pointerdown', event => {
    const pos = toWorld(event);
    const side = game.mode === 'cpu' || pos.y > H / 2 ? 0 : 1;
    pointers.set(event.pointerId, side);
    game.mallets[side].target = pos;
    try { canvas.setPointerCapture(event.pointerId); } catch {}
  });
  canvas.addEventListener('pointermove', event => {
    const pos = toWorld(event);
    if (pointers.has(event.pointerId)) game.mallets[pointers.get(event.pointerId)].target = pos;
    else if (event.pointerType === 'mouse' && game.mode === 'cpu') game.mallets[0].target = pos;
  });
  const release = event => pointers.delete(event.pointerId);
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  const ARROWS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  const WASD = { w: 'up', s: 'down', a: 'left', d: 'right' };
  const keyTarget = key => {
    if (ARROWS[key]) return [0, ARROWS[key]];
    const dir = WASD[key.toLowerCase()];
    return dir ? [game.mode === 'cpu' ? 0 : 1, dir] : null;
  };
  const playing = () => $('setup').hidden && $('result').hidden;
  document.addEventListener('keydown', event => {
    const k = keyTarget(event.key);
    if (!k || !playing()) return;
    keys[k[0]][k[1]] = true;
    event.preventDefault();
  });
  document.addEventListener('keyup', event => {
    const k = keyTarget(event.key);
    if (k) keys[k[0]][k[1]] = false;
  });
  const releaseAll = () => { for (const k of keys) k.up = k.down = k.left = k.right = false; pointers.clear(); };
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { releaseAll(); last = performance.now(); });

  // ---- Panels ----
  function syncSetup() {
    for (const group of document.querySelectorAll('.seg')) {
      for (const btn of group.querySelectorAll('button')) btn.setAttribute('aria-pressed', String(settings[group.dataset.key] === btn.dataset.value));
    }
    $('level-field').hidden = settings.mode !== 'cpu';
    $('hint').textContent = settings.mode === 'cpu' ? t.controlsCpu : t.controls2p;
    const s = stats[settings.level];
    $('record').textContent = settings.mode === 'cpu' && (s.w || s.l) ? t.record(s.w, s.l) : '';
  }
  for (const group of document.querySelectorAll('.seg')) {
    group.addEventListener('click', event => {
      const btn = event.target.closest('button');
      if (!btn) return;
      settings[group.dataset.key] = btn.dataset.value;
      syncSetup();
    });
  }
  function openSetup() {
    game.state = 'menu';
    releaseAll();
    $('result').hidden = true;
    $('setup').hidden = false;
    syncSetup();
    $('start').focus({ preventScroll: true });
  }
  $('menu').addEventListener('click', openSetup);
  $('change').addEventListener('click', openSetup);
  $('start').addEventListener('click', startMatch);
  $('rematch').addEventListener('click', startMatch);

  syncSetup();
  updateHud();
  new ResizeObserver(resize).observe($('stage'));
  requestAnimationFrame(tick);
  $('start').focus({ preventScroll: true });
})();
</script>
</body>
</html>
