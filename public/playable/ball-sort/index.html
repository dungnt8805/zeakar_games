<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ball Sort</title>
<style>
:root {
  --ink: #f4f1ff;
  --muted: #a9b0d6;
  --bg: #1d2148;
  --panel: #fffaf2;
  --panel-ink: #34284f;
  --panel-muted: #7d7096;
  --coral: #ff7a59;
  --coral-dark: #e0573a;
  --sun: #ffd166;
  --wood: #c98a52;
  --wood-dark: #8f5a2e;
  --chip: #2b3165;
  --chip-edge: #151935;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(circle at 15% 20%, #ffffff30 0 1.5px, transparent 2px), radial-gradient(circle at 60% 70%, #ffffff22 0 1px, transparent 1.6px), radial-gradient(ellipse at 50% -10%, #3d3f8a, transparent 60%), linear-gradient(#232857, #171a3a);
  background-size: 58px 58px, 37px 37px, 100% 100%, 100% 100%;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button, a { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.icon { fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 7px; }
h1 { flex: 1; min-width: 0; font-size: clamp(21px, 6.4vw, 30px); font-weight: 900; letter-spacing: -.03em; white-space: nowrap; line-height: 1; }
h1 span { color: var(--coral); }
.stat { min-width: 56px; padding: 5px 8px; border-radius: 14px; background: var(--chip); text-align: center; box-shadow: 0 3px 0 var(--chip-edge); }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 14px; background: var(--chip); font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 var(--chip-edge); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--chip-edge); }
.icon-btn svg { width: 20px; height: 20px; vertical-align: middle; }
.hint { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.3; }

.board-wrap { flex: 1; min-height: 0; position: relative; }
.board { position: absolute; inset: 0; --w: 40px; --h: 170px; --d: 34px; --p: 3px; --bw: 2px; }
.tube { position: absolute; left: 0; top: 0; z-index: 2; width: var(--w); height: var(--h); transition: left .3s ease, top .3s ease; touch-action: manipulation; }
.tube:focus-visible { outline: none; }
.tube:focus-visible .glass { outline: 3px solid var(--sun); outline-offset: 4px; }
.glass { position: absolute; inset: 0; border: var(--bw) solid #ffffff4d; border-top-color: transparent; border-radius: calc(var(--w) * .18) calc(var(--w) * .18) calc(var(--w) / 2) calc(var(--w) / 2); background: linear-gradient(90deg, #ffffff1f, #ffffff08 40%, #ffffff05 60%, #ffffff24); box-shadow: inset 0 -6px 14px #0003; transition: box-shadow .2s, border-color .2s; }
.glass::before { content: ""; position: absolute; left: 14%; top: 8%; bottom: 14%; width: 10%; border-radius: 99px; background: #ffffff1f; }
.tube::after { content: ""; position: absolute; left: -16%; right: -16%; bottom: calc(var(--w) * -.2); height: calc(var(--w) * .26); border-radius: 8px; background: linear-gradient(var(--wood), var(--wood-dark)); box-shadow: 0 4px 8px #0006; z-index: -1; }
.tube.selected .glass { border-color: #ffd16699; box-shadow: inset 0 -6px 14px #0003, 0 0 20px #ffd16655; }
.tube.target .glass { border-color: #7ee0b399; }
.tube.landing { z-index: 6; }
.tube.nope { animation: nope .3s; }
@keyframes nope { 25% { transform: translateX(-10%); } 75% { transform: translateX(10%); } }
.ball { position: absolute; left: calc(var(--bw) + var(--p)); bottom: calc(var(--bw) + var(--p) + var(--i) * var(--d)); z-index: 3; width: var(--d); height: var(--d); border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 34% 28%, #fff 0 7%, color-mix(in srgb, var(--c) 55%, #fff) 14%, var(--c) 46%, color-mix(in srgb, var(--c) 62%, #000) 100%); box-shadow: inset 0 -2px 4px #0004, 0 2px 3px #0005; transition: transform .2s cubic-bezier(.3, 1.3, .5, 1); }
.ball svg { width: 38%; height: 38%; fill: var(--s); margin-top: 6%; }
.ball.lift { transform: translateY(calc(-1 * var(--lift))); }
.ball.flying { z-index: 8; }
.lid { position: absolute; z-index: 4; left: -8%; right: -8%; top: calc(var(--w) * -.2); height: calc(var(--w) * .3); border-radius: 50% 50% 22% 22% / 80% 80% 30% 30%; background: linear-gradient(#ffe28f, var(--sun) 50%, #e8a93a); box-shadow: inset 0 -3px 0 #c98a1d, 0 3px 6px #0005; display: none; }
.tube.done .lid { display: block; animation: lid .45s cubic-bezier(.3, 1.6, .5, 1); }
.tube.done .glass { border-color: #ffd16680; box-shadow: inset 0 -6px 14px #0003, 0 0 16px #ffd16640; }
@keyframes lid { from { transform: translateY(-140%) scale(.6); opacity: 0; } }
.spark { position: absolute; z-index: 9; font-size: calc(var(--w) * .4); line-height: 1; color: var(--sun); text-shadow: 0 0 8px #ffb703; pointer-events: none; animation: spark .75s ease-out forwards; }
@keyframes spark { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(80deg); opacity: 0; } }

.boosters { display: flex; gap: 10px; justify-content: center; }
.booster { position: relative; flex: 1; max-width: 160px; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 6px; border-radius: 16px; background: var(--chip); box-shadow: 0 4px 0 var(--chip-edge); font-size: 14px; font-weight: 800; }
.booster svg { flex: 0 0 auto; width: 20px; height: 20px; color: var(--sun); }
.booster span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.booster:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--chip-edge); }
.booster:disabled { opacity: .45; cursor: default; }
.count { position: absolute; top: -7px; right: -5px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 99px; background: var(--coral); color: #fff; font-size: 12px; font-weight: 900; line-height: 22px; text-align: center; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #0d102699; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; background: var(--panel); color: var(--panel-ink); border-radius: 28px; padding: 26px 22px; text-align: center; box-shadow: 0 20px 50px #0008; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: var(--coral); }
.panel .emoji { font-size: 44px; line-height: 1.2; }
.panel .text { margin-top: 8px; font-size: 15px; color: var(--panel-muted); line-height: 1.45; }
.panel :focus-visible { outline-color: var(--coral-dark); }
.picker { margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 14px; }
.picker strong { min-width: 120px; font-size: 20px; }
.picker button { width: 42px; height: 42px; border-radius: 50%; background: #ffe9df; font-size: 22px; font-weight: 900; }
.picker button:disabled { opacity: .35; cursor: default; }
.result { margin-top: 10px; font-size: 17px; font-weight: 700; }
.cta { margin-top: 20px; width: 100%; padding: 15px; border-radius: 18px; background: var(--coral); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--coral-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--coral-dark); }
.ghost { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; background: #fff0c9; color: #8a5a00; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #f3d78e; }
.ghost[hidden] { display: none; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-aspect-ratio: 4/3) { .app { max-width: 860px; } }
@media (max-height: 560px) { .app { gap: 6px; } .booster { padding: 7px 6px; } .hint { display: none; } }
@media (max-width: 400px) {
  .top { flex-wrap: wrap; row-gap: 6px; }
  .top::after { content: ""; order: -1; flex: 0 0 100%; }
  h1 { order: -2; }
  .icon-btn { order: -1; }
  .stat { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 3px 8px; }
  .stat strong { font-size: 16px; }
}
@media (max-height: 520px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 18px; border-radius: 22px; }
  .panel .emoji { font-size: 30px; line-height: 1.1; }
  .panel h2 { font-size: 23px; }
  .panel .text { margin-top: 4px; font-size: 14px; line-height: 1.35; }
  .picker { margin-top: 8px; }
  .picker button { width: 36px; height: 36px; }
  .result { margin-top: 6px; }
  .cta { margin-top: 10px; padding: 11px; font-size: 18px; }
  .ghost { margin-top: 8px; padding: 9px; }
}
@media (max-height: 360px) { .panel .emoji { display: none; } }
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .app { max-width: 1000px; display: grid; grid-template-columns: minmax(0, 1fr) 224px; grid-template-rows: auto 1fr auto; grid-template-areas: "board top" "board ." "board boost"; column-gap: 14px; row-gap: 8px; }
  .top { grid-area: top; flex-wrap: wrap; row-gap: 8px; }
  h1 { flex: 1 0 100%; font-size: 26px; }
  .stat { flex: 1; }
  .hint { display: none; }
  .board-wrap { grid-area: board; }
  .boosters { grid-area: boost; flex-direction: column; gap: 12px; }
  .booster { max-width: none; flex: 0 0 auto; padding: 9px 6px; }
  .panel { width: min(100%, 560px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <h1>Ball <span>Sort</span></h1>
    <div class="stat"><small data-i18n="level"></small><strong id="level">1</strong></div>
    <div class="stat"><small data-i18n="moves"></small><strong id="moves">0</strong></div>
    <button type="button" class="icon-btn" id="menu" data-i18n-label="levels"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg></button>
    <button type="button" class="icon-btn" id="restart" data-i18n-label="restart">↻</button>
  </header>
  <p class="hint" data-i18n="hint"></p>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board" role="group" data-i18n-label="board"></div>
  </div>
  <div class="boosters">
    <button type="button" class="booster" id="undo" aria-keyshortcuts="U"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="undo"></span><b class="count" id="undo-count" aria-hidden="true"></b></button>
    <button type="button" class="booster" id="extra" aria-keyshortcuts="T"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v14a4 4 0 0 0 8 0V3"/><path d="M12 8v6M9 11h6"/></svg><span data-i18n="extra"></span><b class="count" id="extra-count" aria-hidden="true"></b></button>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <p class="emoji" aria-hidden="true">🔮</p>
    <h2 id="start-title">Ball <span>Sort</span></h2>
    <p class="text" data-i18n="tagline"></p>
    <p class="text" data-i18n="how"></p>
    <div class="picker">
      <button type="button" id="prev" data-i18n-label="prev">‹</button>
      <strong id="pick-level" aria-live="polite"></strong>
      <button type="button" id="next" data-i18n-label="next">›</button>
    </div>
    <button type="button" class="cta" id="play" data-i18n="play"></button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🏆</p>
    <h2 id="win-title"></h2>
    <p class="result" id="result"></p>
    <button type="button" class="cta" id="next-level" data-i18n="next"></button>
    <button type="button" class="ghost" id="replay" data-i18n="replay"></button>
  </div>
</div>

<div class="overlay" id="stuck" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="stuck-title">
    <p class="emoji" aria-hidden="true">🤔</p>
    <h2 id="stuck-title" data-i18n="stuck"></h2>
    <p class="text" data-i18n="stuckText"></p>
    <button type="button" class="cta" id="retry" data-i18n="retry"></button>
    <button type="button" class="ghost" id="stuck-undo" data-i18n="undo"></button>
    <button type="button" class="ghost" id="stuck-extra" data-i18n="extraName"></button>
  </div>
</div>

<script>

  const I18N = {

    refresh();
  }

  function nope(i) {
    const el = game.els[i];
    el.classList.remove('nope');
    void el.offsetWidth;
    el.classList.add('nope');
  }

  function onTube(i) {
    if (!game || game.over || game.busy.has(i)) return;
    const tube = game.tubes[i];
    const sel = game.selected;
    if (sel < 0) {
      if (!tube.length || isDone(tube)) return nope(i);
      return select(i);
    }
    if (sel === i) return select(-1);
    if (canMove(game.tubes[sel], tube)) return move(sel, i);
    if (tube.length && !isDone(tube)) return select(i);
    nope(sel);
    select(-1);
  }

  function move(a, b) {
    const src = game.tubes[a], dst = game.tubes[b];
    const n = Math.min(topRun(src), cap - dst.length);
    const color = top(src);
    const wasLifted = game.selected === a;
    const before = dst.length;
    // Top ball goes first and lands lowest, so the moving balls flip order.
    const moving = game.balls[a].splice(game.balls[a].length - n, n).reverse();
    const starts = moving.map((ball, k) => {
      const at = slotXY(a, src.length - 1 - k);
      return { x: at.x, y: at.y - (wasLifted ? liftFor(a) : 0) };
    });
    src.length -= n;
    dst.push(...Array(n).fill(color));
    game.balls[b].push(...moving);
    game.history.push({ a, b, n });
    game.moves += 1;
    game.selected = -1;
    game.busy.add(a).add(b);
    moving.forEach(ball => ball.classList.remove('lift'));
    game.els[b].append(...moving);
    renderTube(a);
    renderTube(b);
    refresh();
    els.announcer.textContent = t.moved(t.colors[color], b + 1);
    game.els[b].classList.add('landing');
    const finish = () => {
      game.els[b].classList.remove('landing');
      game.busy.delete(a);
      game.busy.delete(b);
      renderTube(a);
      renderTube(b);
      if (isDone(dst)) { sparkle(b); els.announcer.textContent = t.done(t.colors[color]); }
      refresh();
      checkEnd();
    };
    if (reducedMotion.matches) return finish();
    Promise.all(moving.map((ball, k) => hop(ball, starts[k], slotXY(b, before + k), Math.min(game.pos[a].y, game.pos[b].y), k))).then(finish);
  }

  // Up out of the source, across above both tubes, then a drop with a small bounce.
  function hop(ball, from, to, topY, k) {
    const { d } = game.size;
    const airY = topY - d * 1.15;
    const offset = (x, y) => `translate(${x - to.x}px, ${y - to.y}px)`;
    ball.classList.add('flying');
    const anim = ball.animate([
      { transform: offset(from.x, from.y), offset: 0 },
      { transform: offset(from.x, airY), offset: 0.3, easing: 'ease-in-out' },
      { transform: offset(to.x, airY), offset: 0.62, easing: 'ease-in' },
      { transform: `${offset(to.x, to.y)} scale(1.08, .9)`, offset: 0.9 },
      { transform: 'translate(0px, 0px)', offset: 1 },
    ], { duration: HOP_MS, delay: k * STAGGER, fill: 'backwards' });
    return anim.finished.then(() => ball.classList.remove('flying'));
  }

  function sparkle(i) {
    if (reducedMotion.matches) return;
    const { w } = game.size;
    const p = game.pos[i];
    for (let k = 0; k < 8; k++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.textContent = k % 2 ? '★' : '✦';
      const angle = (k / 8) * Math.PI * 2 - Math.PI / 2;
      s.style.left = `${p.x + w / 2}px`;
      s.style.top = `${p.y}px`;
      s.style.setProperty('--dx', `${Math.cos(angle) * w * 1.2}px`);
      s.style.setProperty('--dy', `${Math.sin(angle) * w * 1.2}px`);
      s.addEventListener('animationend', () => s.remove());
      els.board.append(s);
    }
  }

  function checkEnd() {
    if (game.busy.size || game.over) return;
    if (solved(game.tubes)) return win();
    if (!hasMove(game.tubes)) stuck();
  }

  function win() {
    game.over = true;
    refresh();
    if (game.level >= highest) { highest = game.level + 1; write(STORE, highest); }
    els.winTitle.textContent = t.won(game.level);
    els.result.textContent = t.result(game.moves);
    els.announcer.textContent = `${t.won(game.level)} ${t.result(game.moves)}`;
    setTimeout(() => { els.win.hidden = false; $('next-level').focus({ preventScroll: true }); }, reducedMotion.matches ? 0 : 750);
  }

  function stuck() {
    els.stuckUndo.hidden = !game.undos || !game.history.length;
    els.stuckExtra.hidden = !game.extras;
    els.announcer.textContent = `${t.stuck}. ${t.stuckText}`;
    setTimeout(() => { if (game.over || game.busy.size || hasMove(game.tubes)) return; els.stuck.hidden = false; $('retry').focus({ preventScroll: true }); }, 400);
  }

  function undo() {
    if (!game || game.over || game.busy.size || !game.undos || !game.history.length) return;
    const { a, b, n } = game.history.pop();
    const color = top(game.tubes[b]);
    game.tubes[b].length -= n;
    game.tubes[a].push(...Array(n).fill(color));
    const back = game.balls[b].splice(game.balls[b].length - n, n);
    game.balls[a].push(...back);
    game.els[a].append(...back);
    game.undos -= 1;
    game.moves -= 1;
    const previous = game.selected;
    game.selected = -1;
    for (const i of new Set([a, b, previous])) if (i >= 0) renderTube(i);
    refresh();
    els.stuck.hidden = true;
    els.announcer.textContent = t.undone;
  }

  function addTube() {
    if (!game || game.over || !game.extras) return;
    game.extras -= 1;
    game.tubes.push([]);
    addTubeEl(game.tubes.length - 1);
    layout();
    refresh();
    els.stuck.hidden = true;
    els.announcer.textContent = t.added;
  }

  function showPicker() {
    pickLevel = Math.min(pickLevel, highest);
    els.pickLevel.textContent = t.levelN(pickLevel);
    els.prev.disabled = pickLevel <= 1;
    els.next.disabled = pickLevel >= highest;
  }

  function openStart() {
    pickLevel = game ? game.level : highest;
    showPicker();
    els.start.hidden = false;
    $('play').focus({ preventScroll: true });
  }

  // Arrow keys walk between tubes; up/down jump to the nearest tube in the next row.
  els.board.addEventListener('keydown', event => {
    const i = game ? game.els.indexOf(document.activeElement) : -1;
    if (i < 0 || event.altKey || event.ctrlKey || event.metaKey) return;
    let next = -1;
    if (event.key === 'ArrowLeft') next = i - 1;
    else if (event.key === 'ArrowRight') next = i + 1;
    else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
      const row = game.pos[i].row + (event.key === 'ArrowUp' ? -1 : 1);
      let bestDist = Infinity;
      game.pos.forEach((p, j) => { const dist = Math.abs(p.x - game.pos[i].x); if (p.row === row && dist < bestDist) { bestDist = dist; next = j; } });
    } else return;
    event.preventDefault();
    if (next >= 0 && next < game.els.length) game.els[next].focus({ preventScroll: true });
  });
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || !els.start.hidden || !els.win.hidden) return;
    const key = event.key.toLowerCase();
    if (key === 'u') { event.preventDefault(); undo(); }
    else if (key === 't') { event.preventDefault(); addTube(); }
  });

  els.undo.addEventListener('click', undo);
  els.extra.addEventListener('click', addTube);
  els.stuckUndo.addEventListener('click', undo);
  els.stuckExtra.addEventListener('click', addTube);
  $('restart').addEventListener('click', () => startLevel(game.level));
  $('retry').addEventListener('click', () => startLevel(game.level));
  $('menu').addEventListener('click', openStart);
  els.prev.addEventListener('click', () => { pickLevel -= 1; showPicker(); });
  els.next.addEventListener('click', () => { pickLevel += 1; showPicker(); });
  $('play').addEventListener('click', () => startLevel(pickLevel));
  $('next-level').addEventListener('click', () => startLevel(game.level + 1));
  $('replay').addEventListener('click', () => startLevel(game.level));
  new ResizeObserver(layout).observe(els.wrap);

  startLevel(highest);
  openStart();
})();
</script>
</body>
</html>
