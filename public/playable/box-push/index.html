<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Box Push</title>
<style>
:root {
  --bg: #2a2340;
  --bg-2: #41355f;
  --ink: #2b2238;
  --muted: #6d6382;
  --cream: #fff8ec;
  --cream-2: #f3e7d1;
  --cream-shadow: #c7b28f;
  --on-bg: #f6eedf;
  --on-bg-muted: #c9bfe0;
  --wood: #e2a457;
  --wood-hi: #f1c27e;
  --wood-dark: #a8642a;
  --teal: #2fc4a4;
  --teal-hi: #86ecd3;
  --teal-dark: #1b8f77;
  --coral: #ff6b4a;
  --coral-dark: #cf4b2e;
  --amber: #ffc23d;
  --amber-dark: #d39818;
  --star: #f2b13b;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--on-bg);
  background-color: var(--bg);
  background-image: radial-gradient(120% 90% at 50% 18%, var(--bg-2), transparent 70%), radial-gradient(#ffffff0d 1.2px, transparent 1.4px);
  background-size: 100% 100%, 22px 22px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

.app { height: 100%; max-width: 560px; margin: auto; display: flex; flex-direction: column; gap: 9px; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
header { display: flex; align-items: center; gap: 10px; min-width: 0; }
h1 { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: clamp(22px, 7vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; white-space: nowrap; }
h1 span { color: var(--amber); }
.logo { flex: none; width: 1.15em; height: 1.15em; border-radius: .22em; background: linear-gradient(45deg, transparent 42%, var(--wood-dark) 42% 58%, transparent 58%), linear-gradient(var(--wood-hi), var(--wood)); box-shadow: inset 0 0 0 .1em var(--wood-dark), 0 .08em 0 #0006; }
.icon-btn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 14px; background: var(--cream); color: var(--ink); font-size: 20px; font-weight: 900; box-shadow: 0 4px 0 var(--cream-shadow); }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--cream-shadow); }

.hud { display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 5px 4px; border-radius: 14px; background: #ffffff14; box-shadow: inset 0 0 0 1px #ffffff1c; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--on-bg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.25; color: var(--cream); white-space: nowrap; }
.stat strong.over { color: #ffb199; }
.goal { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 8px; font-size: 13px; font-weight: 700; color: var(--on-bg-muted); line-height: 1.3; text-align: center; }
.goal b { display: inline-block; padding: 1px 9px; border-radius: 99px; background: var(--amber); color: var(--ink); font-size: 11px; letter-spacing: .03em; }
.goal .cnt { color: var(--teal-hi); font-variant-numeric: tabular-nums; white-space: nowrap; }

.board-wrap { position: relative; flex: 1; min-height: 0; touch-action: none; cursor: pointer; }
.board { --cell: 32px; --spd: 110ms; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 10px; outline: none; }
html.kb .board:focus { box-shadow: 0 0 0 3px var(--amber); }
.board svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.bg .gl { animation: glow 1.8s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .55; } }
.crate, .worker, .marker { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); transform: translate(calc(var(--x) * var(--cell)), calc(var(--y) * var(--cell))); transition: transform var(--spd) linear; pointer-events: none; }
.crate { z-index: 2; padding: calc(var(--cell) * .07); }
.crate i { position: relative; display: block; width: 100%; height: 100%; border-radius: calc(var(--cell) * .14); background: linear-gradient(var(--wood-hi), var(--wood)); box-shadow: inset 0 0 0 calc(var(--cell) * .07) var(--wood-dark), 0 calc(var(--cell) * .07) 0 #00000055; transition: background .25s, box-shadow .25s; }
.crate i::before { content: ""; position: absolute; inset: calc(var(--cell) * .07); border-radius: calc(var(--cell) * .04); background: linear-gradient(45deg, transparent 42%, var(--wood-dark) 42% 58%, transparent 58%), linear-gradient(transparent 48%, #00000018 48% 52%, transparent 52%); }
.crate.on i { background: linear-gradient(var(--teal-hi), var(--teal)); box-shadow: inset 0 0 0 calc(var(--cell) * .07) var(--teal-dark), 0 calc(var(--cell) * .07) 0 #00000055, 0 0 calc(var(--cell) * .35) #2fc4a4aa; }
.crate.on i::before { background: linear-gradient(45deg, transparent 42%, var(--teal-dark) 42% 58%, transparent 58%), linear-gradient(transparent 48%, #00000018 48% 52%, transparent 52%); }
.crate.hinted i { animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.2); box-shadow: inset 0 0 0 calc(var(--cell) * .07) var(--wood-dark), 0 0 0 calc(var(--cell) * .08) var(--amber), 0 calc(var(--cell) * .07) 0 #00000055; } }
.crate.stuck i { animation: wobble .4s 2; }
@keyframes wobble { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
.board.won .crate i { animation: hop .5s calc(var(--i) * 70ms) both; }
@keyframes hop { 45% { transform: translateY(calc(var(--cell) * -.22)) scale(1.04); } }
.worker { z-index: 3; }
.worker svg { display: block; width: 100%; height: 100%; }
.worker .eyes { transform: translate(calc(var(--fx, 0) * 5px), calc(var(--fy, 0) * 3px)); transition: transform .12s; }
.worker .sprite { width: 100%; height: 100%; }
.worker.step .sprite { animation: bob var(--spd) ease-out; }
.worker.step2 .sprite { animation: bob2 var(--spd) ease-out; }
@keyframes bob { 50% { transform: translateY(calc(var(--cell) * -.06)) scaleY(1.04); } }
@keyframes bob2 { 50% { transform: translateY(calc(var(--cell) * -.06)) scaleY(1.04); } }
.worker.bump .sprite { animation: bump .22s ease-out; }
@keyframes bump { 40% { transform: translate(calc(var(--bx) * var(--cell) * .14), calc(var(--by) * var(--cell) * .14)); } }
.board.won .worker .sprite { animation: cheer .6s .2s 2; }
@keyframes cheer { 50% { transform: translateY(calc(var(--cell) * -.3)); } }
.marker { z-index: 1; display: grid; place-items: center; transition: none; }
.marker[hidden] { display: none; }
.marker.from::before { content: ""; width: 70%; height: 70%; border-radius: 50%; border: max(2px, calc(var(--cell) * .07)) dashed var(--amber); animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.marker.arrow { z-index: 4; }
.marker.arrow svg { width: 70%; height: 70%; transform: rotate(var(--rot)); filter: drop-shadow(0 2px 2px #0006); animation: nudge .8s ease-in-out infinite; }
@keyframes nudge { 50% { translate: calc(var(--ax) * var(--cell) * .1) calc(var(--ay) * var(--cell) * .1); } }
.toast { position: absolute; left: 50%; bottom: 6px; z-index: 6; width: max-content; max-width: calc(100% - 12px); transform: translateX(-50%); padding: 7px 14px; border-radius: 99px; background: #1d1830e8; color: var(--cream); font-size: 13px; font-weight: 800; line-height: 1.3; text-align: center; box-shadow: 0 6px 18px #0005; pointer-events: none; animation: toast-in .25s ease-out; }
.toast.warn { background: #b8432ce8; }
.toast[hidden] { display: none; }

.tools { display: flex; gap: 8px; }
.tool { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border-radius: 16px; background: var(--cream); color: var(--ink); box-shadow: 0 4px 0 var(--cream-shadow); font-size: 15px; font-weight: 800; }
.tool span:first-child { font-size: 18px; line-height: 1; }
.tool span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--cream-shadow); }
.tool:disabled { opacity: .5; }
.tool.hint-btn { background: var(--amber); box-shadow: 0 4px 0 var(--amber-dark); }
.tool.hint-btn:active:not(:disabled) { box-shadow: 0 1px 0 var(--amber-dark); }
.tool.busy span:first-child { animation: spin 1s linear infinite; }
.help { text-align: center; font-size: 12px; font-weight: 700; color: var(--on-bg-muted); line-height: 1.35; }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); background: #150f2299; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 390px); max-height: calc(100% - 4px); overflow: auto; background: var(--cream); color: var(--ink); border-radius: 28px; padding: 22px 20px; text-align: center; box-shadow: 0 20px 50px #0007; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
@keyframes toast-in { from { opacity: 0; margin-bottom: -8px; } }
.panel h2 { font-size: 26px; font-weight: 900; line-height: 1.15; letter-spacing: -.02em; }
.panel h2 span { color: var(--coral); }
.panel .emoji { font-size: 44px; line-height: 1.2; }
.panel p { margin-top: 8px; color: var(--muted); line-height: 1.45; }
.panel .small { font-size: 13px; }
.stars { margin-top: 4px; font-size: 38px; letter-spacing: 4px; color: #e5d9bf; }
.stars b { color: var(--star); }
.result { font-size: 18px; font-weight: 800; color: var(--ink) !important; }
.badge { display: inline-block; margin-top: 10px; padding: 5px 14px; border-radius: 99px; background: var(--star); color: #fff !important; font-size: 14px; font-weight: 800; }
.badge[hidden], .note[hidden] { display: none; }
.cta { margin-top: 18px; width: 100%; padding: 15px; border-radius: 18px; background: var(--coral); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--coral-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--coral-dark); }
.cta[hidden] { display: none; }
.secondary { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; border: 2px solid #e6d8bb; font-weight: 800; }
.row2 { display: flex; gap: 10px; }
.row2 .secondary { flex: 1; min-width: 0; }
.legend { margin-top: 12px; display: flex; justify-content: center; gap: 14px; font-size: 13px; font-weight: 700; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 18px; border-radius: 4px; }
.lg-crate { background: linear-gradient(45deg, transparent 40%, var(--wood-dark) 40% 60%, transparent 60%), var(--wood); box-shadow: inset 0 0 0 2px var(--wood-dark); }
.lg-goal { border-radius: 50% !important; border: 3px solid var(--teal); background: radial-gradient(var(--teal) 30%, transparent 34%); }
.lg-done { background: var(--teal); box-shadow: inset 0 0 0 2px var(--teal-dark); }

.lv-head { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.lv-total { font-size: 15px; font-weight: 900; color: var(--star); }
.tier { margin-top: 14px; text-align: left; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 6px; }
.level-btn { aspect-ratio: 1; display: grid; place-content: center; gap: 1px; border-radius: 14px; background: #f6ecd9; box-shadow: 0 3px 0 #dccaa6; font-size: 17px; font-weight: 900; color: var(--ink); }
.level-btn small { font-size: 10px; letter-spacing: 1px; color: var(--star); min-height: 12px; line-height: 12px; }
.level-btn.current { background: var(--coral); color: #fff; box-shadow: 0 3px 0 var(--coral-dark); }
.level-btn.current small { color: #ffe9a8; }
.level-btn:disabled { opacity: .45; box-shadow: none; }
.unlock-tip { font-size: 12px !important; }
#close-levels { position: sticky; bottom: 0; background: var(--cream); box-shadow: 0 10px 0 var(--cream); }

@media (min-width: 640px) and (max-aspect-ratio: 5/4) { .app { max-width: 700px; } }
@media (max-width: 480px) {
  .tool { flex-direction: column; gap: 2px; padding: 7px 4px 6px; font-size: 13px; line-height: 1.15; }
  .tool span:last-child { max-width: 100%; }
}
@media (max-width: 360px) {
  .hud { gap: 4px; }
  .stat { padding: 4px 2px; }
  .stat small { letter-spacing: 0; }
  .stat strong { font-size: 17px; }
  .tools { gap: 6px; }
  .tool { padding: 7px 2px 6px; font-size: 12px; }
}
@media (max-height: 640px) { .help { display: none; } }
@media (max-height: 540px) { .app { gap: 7px; } .goal { font-size: 12px; } }
@media (max-height: 420px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 18px; border-radius: 22px; }
  .panel .emoji { font-size: 30px; }
  .panel h2 { font-size: 21px; }
  .panel p { margin-top: 4px; font-size: 14px; line-height: 1.35; }
  .panel .small { font-size: 12px; }
  .stars { margin-top: 0; font-size: 28px; }
  .badge { margin-top: 6px; padding: 4px 12px; }
  .cta { margin-top: 10px; padding: 11px; font-size: 17px; }
  .secondary { margin-top: 8px; padding: 9px; }
  .legend { margin-top: 6px; }
  .tier { margin-top: 8px; }
  .level-grid { grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
  .level-btn { font-size: 15px; border-radius: 10px; }
  #levels .panel { width: min(100%, 640px); }
  #intro .panel, #win .panel { width: min(100%, 560px); }
}
@media (max-height: 420px) and (min-width: 700px) { .level-grid { grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 5px; } .level-btn { font-size: 14px; } }
@media (max-height: 420px) and (min-width: 520px) and (max-width: 699.98px) { .level-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }

/* Wide frames: HUD and tools in a side column, the warehouse gets the full height. */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: 1240px; display: grid; grid-template-columns: clamp(200px, 25vw, 300px) minmax(0, 1fr); grid-template-rows: auto auto auto auto 1fr auto; grid-template-areas: "top board" "hud board" "goal board" "tools board" ". board" "help board"; gap: 12px 22px; padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
  header { grid-area: top; padding-top: 4px; }
  h1 { font-size: clamp(22px, 2.6vw, 34px); }
  .hud { grid-area: hud; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { padding: 7px 6px; }
  .stat strong { font-size: 22px; }
  .goal { grid-area: goal; justify-content: flex-start; text-align: left; font-size: 14px; }
  .tools { grid-area: tools; flex-direction: column; }
  .tool { flex: none; flex-direction: row; gap: 8px; padding: 11px 10px; font-size: 16px; }
  .help { grid-area: help; display: block; text-align: left; }
  .board-wrap { grid-area: board; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  .app { grid-template-columns: clamp(190px, 30vw, 260px) minmax(0, 1fr); grid-template-rows: auto auto auto auto 1fr; grid-template-areas: "top board" "hud board" "goal board" "tools board" ". board"; gap: 7px 14px; padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  header { padding-top: 0; }
  h1 { font-size: 22px; }
  .icon-btn { width: 38px; height: 38px; font-size: 18px; }
  .hud { gap: 5px; }
  .stat { padding: 3px 4px; }
  .stat small { letter-spacing: 0; }
  .stat strong { font-size: 17px; }
  .goal { font-size: 12px; }
  .tools { gap: 6px; }
  .tool { flex-direction: row; gap: 6px; padding: 6px 6px; border-radius: 12px; font-size: 13px; line-height: 1.15; box-shadow: 0 3px 0 var(--cream-shadow); }
  .tool.hint-btn { box-shadow: 0 3px 0 var(--amber-dark); }
  .tool span:first-child { font-size: 15px; }
  .help { display: none; }
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1><i class="logo" aria-hidden="true"></i><span class="ttl">Box <span>Push</span></span></h1>
    <button type="button" class="icon-btn" id="open-levels" data-i18n-label="levels">☰</button>
  </header>
  <div class="hud">
    <div class="stat"><small data-i18n="level"></small><strong id="level">1</strong></div>
    <div class="stat"><small data-i18n="moves"></small><strong id="moves">0</strong></div>
    <div class="stat"><small data-i18n="pushes"></small><strong id="pushes">0</strong></div>
    <div class="stat"><small data-i18n="optimal"></small><strong id="optimal">–</strong></div>
  </div>
  <p class="goal" id="goal"></p>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board" tabindex="0" role="application"></div>
    <p class="toast" id="toast" hidden></p>
  </div>
  <div class="tools">
    <button type="button" class="tool" id="undo"><span aria-hidden="true">↶</span><span data-i18n="undo"></span></button>
    <button type="button" class="tool hint-btn" id="hint"><span aria-hidden="true">💡</span><span data-i18n="hint"></span></button>
    <button type="button" class="tool" id="retry"><span aria-hidden="true">↻</span><span data-i18n="restart"></span></button>
  </div>
  <p class="help" data-i18n="help"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="intro">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <p class="emoji" aria-hidden="true">📦👷</p>
    <h2 id="intro-title">Box <span>Push</span></h2>
    <p data-i18n="tagline"></p>
    <div class="legend" aria-hidden="true"><span><i class="lg-crate"></i>→</span><span><i class="lg-goal"></i>=</span><span><i class="lg-done"></i>✓</span></div>
    <p class="small" data-i18n="controls"></p>
    <button type="button" class="cta" id="play"></button>
    <button type="button" class="secondary" id="intro-levels" data-i18n="chooseLevel"></button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🎉</p>
    <h2 id="win-title"></h2>
    <p class="stars" id="stars"></p>
    <p class="result" id="result"></p>
    <p class="small" id="opt-line"></p>
    <p class="small note" id="win-note"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="next" data-i18n="next"></button>
    <div class="row2">
      <button type="button" class="secondary" id="replay" data-i18n="replay"></button>
      <button type="button" class="secondary" id="win-levels" data-i18n="levels"></button>
    </div>
  </div>
</div>

<div class="overlay" id="levels" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="levels-title">
    <div class="lv-head"><h2 id="levels-title" data-i18n="chooseLevel"></h2><span class="lv-total" id="lv-total"></span></div>
    <p class="small unlock-tip" data-i18n="unlockTip"></p>
    <div id="level-list"></div>
    <button type="button" class="secondary" id="close-levels" data-i18n="close"></button>
  </div>
</div>

<script>

      clearTimeout(slow);
      if (job.cancelled) return;
      hintJob = null;
      els.hint.classList.remove('busy');
      hideToast();
      if (!result) { showToast(t.noHint, true); announce(t.noHint); return; }
      showHint(result);
    };
    const chunk = () => {
      if (job.cancelled) return;
      const until = performance.now() + 12;
      while (qi < states.length) {
        if (states.length > HINT_CAP) return finish(null);
        const bx = states[qi];
        bx.forEach(b => { occ[b] = 1; });
        flood(players[qi], rmark, ++rstamp);
        for (let bi = 0; bi < bx.length; bi++) {
          const b = bx[bi];
          for (let d = 0; d < 4; d++) {
            const from = nbr[b * 4 + ((d + 2) % 4)];
            if (from < 0 || rmark[from] !== rstamp) continue;
            const to = nbr[b * 4 + d];
            if (to < 0 || occ[to] || !liveF[to]) continue;
            const nb = bx.slice(); nb[bi] = to; nb.sort((x, y) => x - y);
            occ[b] = 0; occ[to] = 1;
            const np = flood(b, mark, ++stamp);
            occ[to] = 0; occ[b] = 1;
            const k = keyOf(nb, np);
            if (seen.has(k)) continue;
            seen.add(k);
            const f = first[qi] || { box: L.fc[b], d, from: L.fc[from] };
            if (nb.every(x => goalF[x])) { bx.forEach(x => { occ[x] = 0; }); return finish({ ...f, left: depth[qi] + 1 }); }
            states.push(nb); players.push(np); first.push(f); depth.push(depth[qi] + 1);
          }
        }
        bx.forEach(b => { occ[b] = 0; });
        qi++;
        if (performance.now() > until) { setTimeout(chunk, 0); return; }
      }
      finish(null);
    };
    chunk();
  }

  function showHint(h) {
    clearHint();
    game.hint = h;
    game.hintUsed = true;
    persist();
    const bi = game.boxAt[h.box];
    if (bi >= 0) game.crateEls[bi].classList.add('hinted');
    setPos(game.fromEl, h.from);
    game.fromEl.hidden = h.from === game.player;
    setPos(game.arrowEl, h.box);
    game.arrowEl.style.setProperty('--rot', `${h.d * 90}deg`);
    game.arrowEl.style.setProperty('--ax', DX[h.d]);
    game.arrowEl.style.setProperty('--ay', DY[h.d]);
    game.arrowEl.hidden = false;
    announce(t.hintSay(t.dirs[h.d], h.left));
  }

  function starsFor(pushes) {
    const o = game.optimal;
    const s = pushes <= o ? 3 : pushes <= o + Math.max(3, Math.ceil(o * 0.25)) ? 2 : 1;
    return game.hintUsed ? Math.min(s, 2) : s;
  }

  function win() {
    game.done = true;
    queue = [];
    cancelHint();
    hideToast();
    updateHud();
    const stars = starsFor(game.pushes);
    const key = String(game.n);
    const prevBest = progress.best[key];
    const better = prevBest === undefined || game.pushes < prevBest || (game.pushes === prevBest && game.moves < (progress.bestMoves[key] ?? Infinity));
    if (better) { progress.best[key] = game.pushes; progress.bestMoves[key] = game.moves; }
    progress.stars[key] = Math.max(progress.stars[key] ?? 0, stars);
    progress.current = Math.min(LEVELS.length, game.n + 1);
    progress.save = null;
    saveProgress();
    els.board.classList.add('won');
    const last = game.n === LEVELS.length;
    els.winTitle.textContent = last ? t.allDone : t.won(game.n);
    els.stars.innerHTML = starText(stars);
    els.stars.setAttribute('aria-label', t.starsLabel(stars));
    els.result.textContent = t.result(game.moves, game.pushes);
    els.optLine.textContent = t.optimalLine(game.optimal);
    els.winNote.textContent = game.hintUsed ? t.hintUsed : game.pushes <= game.optimal ? t.perfect : '';
    els.winNote.hidden = !els.winNote.textContent;
    els.newBest.hidden = !better || prevBest === undefined;
    els.next.hidden = last;
    const n = game.n;
    setTimeout(() => {
      if (!game.done || game.n !== n) return;
      els.win.hidden = false;
      announce(`${els.winTitle.textContent} ${t.starsLabel(stars)}. ${t.result(game.moves, game.pushes)}`);
      (last ? $('replay') : els.next).focus({ preventScroll: true });
    }, reducedMotion.matches ? 150 : 900);
  }

  function openLevels() {
    els.levelList.replaceChildren();
    const total = Object.values(progress.stars).reduce((a, b) => a + b, 0);
    els.lvTotal.textContent = `★ ${total}/${LEVELS.length * 3}`;
    t.tiers.forEach((name, tier) => {
      const heading = document.createElement('p');
      heading.className = 'tier';
      heading.textContent = name;
      const grid = document.createElement('div');
      grid.className = 'level-grid';
      for (let n = (TIERS[tier - 1] ?? 0) + 1; n <= TIERS[tier]; n++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = `level-btn${game && n === game.n ? ' current' : ''}`;
        const locked = !isOpen(n);
        const stars = progress.stars[n] ?? 0;
        b.disabled = locked;
        b.innerHTML = `<span>${locked ? '🔒' : n}</span><small>${'★'.repeat(stars)}</small>`;
        b.setAttribute('aria-label', `${t.levelN(n)}, ${locked ? t.locked : t.starsLabel(stars)}`);
        b.addEventListener('click', () => { startLevel(n); els.board.focus({ preventScroll: true }); });
        grid.append(b);
      }
      els.levelList.append(heading, grid);
    });
    els.win.hidden = true;
    els.intro.hidden = true;
    els.intro.dataset.seen = '1';
    els.levels.hidden = false;
    const current = els.levelList.querySelector('.current');
    current?.focus({ preventScroll: true });
    current?.scrollIntoView({ block: 'center' });
  }

  const overlayOpen = () => !els.win.hidden || !els.levels.hidden || !els.intro.hidden;

  // The board's focus ring only shows for keyboard users.
  document.addEventListener('keydown', e => { if (e.key === 'Tab') document.documentElement.classList.add('kb'); }, true);
  document.addEventListener('pointerdown', () => document.documentElement.classList.remove('kb'), true);

  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || overlayOpen() || !game) return;
    const d = KEY_DIR[e.key] ?? CODE_DIR[e.code];
    if (d !== undefined) {
      e.preventDefault();
      if (game.done) return;
      // Held keys only add a step when the queue has drained, so the worker never overshoots.
      if (e.repeat ? queue.length || busy : queue.length > 1) return;
      enqueue([d]);
      return;
    }
    const k = e.key.toLowerCase();
    if (k === 'u' || k === 'backspace') { e.preventDefault(); undo(); }
    else if (k === 'r') { e.preventDefault(); restart(); }
    else if (k === 'h') { e.preventDefault(); requestHint(); }
  });

  // Pointer: a tap walks or pushes; dragging steps the worker one cell per cell-length of travel.
  let drag = null;
  els.wrap.addEventListener('pointerdown', e => {
    if (!game || game.done || drag) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, moved: false };
    els.wrap.setPointerCapture(e.pointerId);
    els.board.focus({ preventScroll: true });
  });
  els.wrap.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const cell = parseFloat(els.board.style.getPropertyValue('--cell')) || 32;
    const step = Math.max(22, cell * 0.75);
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < step) return;
    drag.moved = true;
    const horiz = Math.abs(dx) > Math.abs(dy);
    const d = horiz ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
    if (queue.length < 2) enqueue([d]);
    drag.x = e.clientX; drag.y = e.clientY;
  });
  const endDrag = (e, cancel) => {
    if (!drag || e.pointerId !== drag.id) return;
    const { moved, x0, y0 } = drag;
    drag = null;
    if (cancel || moved || Math.hypot(e.clientX - x0, e.clientY - y0) > 14) return;
    const r = els.board.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / (r.width / game.L.C)), y = Math.floor((e.clientY - r.top) / (r.height / game.L.R));
    if (x >= 0 && y >= 0 && x < game.L.C && y < game.L.R) tapCell(y * game.L.C + x);
  };
  els.wrap.addEventListener('pointerup', e => endDrag(e, false));
  els.wrap.addEventListener('pointercancel', e => endDrag(e, true));

  els.undo.addEventListener('click', undo);
  els.hint.addEventListener('click', requestHint);
  els.restart.addEventListener('click', restart);
  $('open-levels').addEventListener('click', openLevels);
  $('intro-levels').addEventListener('click', openLevels);
  $('win-levels').addEventListener('click', openLevels);
  $('close-levels').addEventListener('click', () => {
    els.levels.hidden = true;
    if (game && game.done) { els.win.hidden = false; els.next.focus({ preventScroll: true }); }
    else els.board.focus({ preventScroll: true });
  });
  els.next.addEventListener('click', () => { startLevel(game.n + 1); els.board.focus({ preventScroll: true }); });
  $('replay').addEventListener('click', () => { startLevel(game.n); els.board.focus({ preventScroll: true }); });
  els.play.addEventListener('click', () => { els.intro.hidden = true; els.intro.dataset.seen = '1'; els.board.focus({ preventScroll: true }); });

  new ResizeObserver(layout).observe(els.wrap);

  // Read-only hooks for automated tests.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__boxPush = {
    state: () => game && { level: game.n, cols: game.L.C, rows: game.L.R, player: game.player, boxes: game.boxes.slice(), moves: game.moves, pushes: game.pushes, optimal: game.optimal, done: game.done, busy: busy || queue.length > 0, hint: game.hint && { ...game.hint }, hintBusy: !!hintJob, overlay: [els.intro, els.win, els.levels].find(o => !o.hidden)?.id || null },
    levels: () => LEVELS.map(([code, optimal]) => ({ rows: code.split('|'), optimal })),
    cellCenter: cell => { const r = els.board.getBoundingClientRect(); const C = game.L.C; return { x: r.left + (cell % C + 0.5) * r.width / C, y: r.top + (Math.floor(cell / C) + 0.5) * r.height / game.L.R }; },
  };

  const first = Math.min(Math.max(1, progress.current || 1), LEVELS.length);
  startLevel(isOpen(first) ? first : 1, progress.save);
  els.intro.hidden = false;
  els.play.textContent = t.play(game.n);
  els.play.focus({ preventScroll: true });
})();
</script>
</body>
</html>
