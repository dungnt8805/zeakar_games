<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bowling</title>
<style>
:root {
  --bg: #120d24;
  --text: #f4f0ff;
  --muted: #aca2cc;
  --accent: #ff5e7e;
  --accent-dark: #c33859;
  --teal: #37e2c6;
  --panel: #f8f5ff;
  --ink: #241b40;
  --ink-muted: #6f6792;
  --line: #e3dcf4;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(120% 90% at 50% 15%, #2b1f55, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: grid; grid-template-areas: "board" "stage" "ctrl"; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
.board { grid-area: board; min-width: 0; min-height: 0; width: 100%; max-width: 560px; justify-self: center; display: flex; flex-direction: column; gap: 5px; }
.side-title { display: none; align-items: center; gap: 8px; font-size: 22px; font-weight: 900; letter-spacing: -.02em; }
.cards { display: flex; flex-wrap: wrap; gap: 4px; min-height: 0; }
.card { flex: 1 1 0; min-width: 0; padding: 4px 7px; border-radius: 12px; background: #ffffff0d; box-shadow: inset 0 0 0 1px #ffffff17; }
.card.on { order: -1; flex-basis: 100%; background: #37e2c614; box-shadow: inset 0 0 0 2px var(--teal); }
.ch { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 20px; }
.ch .dot { flex: none; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffffaa, var(--c) 50%, #0008); }
.ch .nm { flex: 1; min-width: 0; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch .tot { font-size: 17px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.ch .tag { font-size: 11px; font-weight: 800; color: var(--muted); }
.frames { display: none; grid-template-columns: repeat(9, minmax(0, 1fr)) minmax(0, 1.45fr); margin-top: 4px; border-radius: 8px; overflow: hidden; background: #00000059; }
.card.on .frames { display: grid; }
.fr { min-width: 0; border-left: 1px solid #ffffff1c; }
.fr:first-child { border-left: 0; }
.fr.cur { background: #37e2c633; }
.rl { display: flex; justify-content: flex-end; height: 16px; }
.rl i { flex: 0 0 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 900; line-height: 1; }
.fr.t .rl i { flex-basis: 33.34%; }
.rl i + i { box-shadow: inset 1px -1px 0 #ffffff2b; }
.rl i.x { color: var(--accent); }
.rl i.s { color: var(--teal); }
.rl i.sp b { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 1.5px #ffb347; }
.cm { height: 17px; text-align: center; font-size: 12px; font-weight: 900; line-height: 17px; font-variant-numeric: tabular-nums; }
.side-help { display: none; margin-top: auto; padding: 8px 10px; border-radius: 12px; background: #ffffff0a; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--muted); }
.side-help b { color: var(--text); font-weight: 800; }
.sdesc { margin-top: 3px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.3; }

.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; border-radius: 16px; overflow: hidden; background: #0b0818; box-shadow: inset 0 0 0 1px #ffffff14; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#cv:focus-visible { outline: none; }
.stage:has(#cv:focus-visible) { box-shadow: inset 0 0 0 3px #37e2c699; }
.info { position: absolute; right: 8px; top: 8px; max-width: calc(100% - 90px); padding: 4px 10px; border-radius: 99px; background: #0b0818c9; font-size: 12px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; box-shadow: inset 0 0 0 1px #ffffff1c; }
.info:empty { display: none; }
.toast { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -6px); max-width: calc(100% - 16px); width: max-content; padding: 6px 14px; border-radius: 99px; background: #0b0818ee; color: #fff; font-size: 14px; font-weight: 800; line-height: 1.3; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; box-shadow: 0 6px 20px #0007, inset 0 0 0 1px #ffffff1c; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.6); max-width: calc(100% - 20px); font-size: clamp(30px, 11cqmin, 64px); font-weight: 900; letter-spacing: -.02em; line-height: 1.05; text-align: center; color: #fff; text-shadow: 0 4px 0 #0006, 0 0 24px #0009; pointer-events: none; opacity: 0; transition: opacity .2s, transform .35s cubic-bezier(.2, 1.6, .4, 1); }
.stage { container-type: size; }
.banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.banner.strike { color: #ffd84a; text-shadow: 0 4px 0 #c33859, 0 0 30px #ff5e7e; }
.banner.spare { color: var(--teal); text-shadow: 0 4px 0 #136f63, 0 0 26px #37e2c6aa; }
.banner.small, .banner.long { font-size: clamp(22px, 7cqmin, 40px); }

.ctrl { grid-area: ctrl; display: flex; align-items: stretch; gap: 6px; width: 100%; max-width: 560px; justify-self: center; }
.ibtn { flex: none; width: 46px; min-height: 48px; border-radius: 14px; background: #ffffff14; box-shadow: inset 0 0 0 1px #ffffff1c; display: grid; place-items: center; font-size: 20px; font-weight: 900; line-height: 1; }
.ibtn:active { transform: translateY(1px); background: #ffffff22; }
.curve { flex: none; display: flex; align-items: center; gap: 3px; padding: 3px; border-radius: 14px; background: #ffffff0d; box-shadow: inset 0 0 0 1px #ffffff1c; }
.curve button { width: 36px; height: 100%; min-height: 40px; border-radius: 10px; background: #ffffff14; font-size: 20px; font-weight: 900; line-height: 1; }
.curve button:disabled { opacity: .35; cursor: default; }
.curve .cv { min-width: 62px; display: grid; justify-items: center; gap: 1px; line-height: 1.1; }
.curve .cv small { font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
.curve .cv b { font-size: 15px; font-weight: 900; color: var(--teal); white-space: nowrap; }
.bowl { flex: 1 1 auto; min-width: 96px; min-height: 48px; position: relative; overflow: hidden; border-radius: 16px; background: var(--accent); color: #2b0a15; box-shadow: 0 4px 0 var(--accent-dark); touch-action: none; line-height: 1.1; }
.bowl::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #ffe27a, #ffad42); transform: scaleX(var(--p, 0)); transform-origin: left; }
.bowl span { position: relative; display: block; font-size: 19px; font-weight: 900; }
.bowl small { position: relative; display: block; font-size: 11px; font-weight: 800; opacity: .75; }
.bowl:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-dark); }
.bowl:disabled { opacity: .5; cursor: default; transform: none; box-shadow: 0 4px 0 var(--accent-dark); }

.ov { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #0a0618cc; }
.ov.light { background: #0a061866; }
.ov[hidden] { display: none; }
.panel { width: min(100%, 390px); max-height: calc(100dvh - 16px); overflow-y: auto; padding: 18px 16px; border-radius: 22px; background: var(--panel); color: var(--ink); text-align: center; box-shadow: 0 7px 0 #d5cbec, 0 24px 60px #000b; animation: rise .28s ease-out; overscroll-behavior: contain; }
.panel.xl { width: min(100%, 640px); }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.logo { display: flex; align-items: center; justify-content: center; gap: 10px; }
.logo h1 { font-size: 38px; font-weight: 900; letter-spacing: -.03em; line-height: 1; color: var(--ink); }
.bball { flex: none; position: relative; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #ffb3c4, var(--accent) 45%, #7d1832); box-shadow: 0 4px 10px #0004; }
.bball i { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #3a0d1a; }
.bball i:nth-child(1) { left: 14px; top: 10px; } .bball i:nth-child(2) { left: 22px; top: 12px; } .bball i:nth-child(3) { left: 18px; top: 19px; }
.side-title .bball { width: 26px; height: 26px; }
.side-title .bball i { width: 5px; height: 5px; }
.side-title .bball i:nth-child(1) { left: 9px; top: 6px; } .side-title .bball i:nth-child(2) { left: 15px; top: 8px; } .side-title .bball i:nth-child(3) { left: 11px; top: 13px; }
.tagline { margin-top: 8px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--ink-muted); }
.modes { margin-top: 14px; display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 2px 10px; padding: 10px 12px; border-radius: 16px; background: #fff; text-align: left; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode .ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; background: var(--c); color: #fff; font-weight: 900; }
.mode strong { font-size: 16px; font-weight: 900; line-height: 1.2; }
.mode small { font-size: 12px; font-weight: 700; color: var(--ink-muted); line-height: 1.3; }
.small { margin-top: 10px; font-size: 12px; font-weight: 700; line-height: 1.4; color: var(--ink-muted); }
.small:empty { display: none; }
.field { margin-top: 14px; text-align: left; }
.field[hidden] { display: none; }
.label { margin-bottom: 6px; font-size: 12px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #ebe5f8; }
.seg button { flex: 1; min-width: 0; min-height: 36px; padding: 7px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--ink-muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #d5cbec; }
.cta { display: block; width: 100%; margin-top: 16px; padding: 13px; border-radius: 16px; background: var(--accent); color: #2b0a15; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 14px; background: #ebe5f8; color: var(--ink); font-size: 15px; font-weight: 800; }
.ghost[hidden], .cta[hidden] { display: none; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 8px; padding: 9px 12px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); text-align: left; font-size: 15px; font-weight: 800; }
.toggle span:first-child { min-width: 0; }
.toggle small { display: block; font-size: 11px; color: var(--ink-muted); font-weight: 700; }
.sw { flex: 0 0 auto; width: 42px; height: 24px; border-radius: 99px; background: #d3cbe6; position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .2s; }
.toggle[aria-checked="true"] .sw { background: #22b59c; }
.toggle[aria-checked="true"] .sw::after { transform: translateX(18px); }
.big { margin-top: 8px; font-size: 40px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.sub { margin-top: 6px; font-size: 15px; font-weight: 800; color: var(--ink-muted); line-height: 1.35; }
.stars { margin-top: 8px; font-size: 34px; letter-spacing: 4px; color: #f2a516; text-shadow: 0 2px 0 #c47c06; }
.stars .off { color: #ddd6ea; text-shadow: none; }
.stars:empty { display: none; }
.levels { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.lv { position: relative; min-height: 64px; padding: 6px 2px 5px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); display: grid; justify-items: center; align-content: center; gap: 3px; }
.lv strong { font-size: 13px; font-weight: 900; line-height: 1; color: var(--ink-muted); }
.lv svg { width: 34px; height: 24px; display: block; }
.lv small { font-size: 10px; letter-spacing: 1px; color: #f2a516; line-height: 1; }
.lv small .off { color: #ddd6ea; }
.lv:disabled { opacity: .45; cursor: default; }
.lv.cur { box-shadow: 0 3px 0 var(--accent-dark), inset 0 0 0 2px var(--accent); }
.scorelist { margin-top: 12px; display: grid; gap: 8px; text-align: left; }
.scorelist .card { background: #2a2050; color: var(--text); box-shadow: none; padding: 6px 8px; }
.scorelist .card.on { box-shadow: inset 0 0 0 2px var(--teal); }
.scorelist .frames { display: grid; }
.res-list { margin-top: 8px; display: grid; gap: 4px; font-size: 15px; font-weight: 800; color: var(--ink); }
.res-list:empty { display: none; }
.res-list div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 12px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.res-list div.win { box-shadow: inset 0 0 0 2px var(--teal); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Wide frames: the lane takes the full height, scorecards and controls move to a side column. */
@media (min-aspect-ratio: 5/4) {
  .app { grid-template-areas: "stage board" "stage ctrl"; grid-template-columns: minmax(0, 1fr) clamp(240px, 34vw, 450px); grid-template-rows: minmax(0, 1fr) auto; gap: 8px; }
  .board { max-width: none; min-height: 0; overflow-y: auto; align-self: stretch; }
  .side-title { display: flex; }
  .side-help { display: block; }
  .cards { flex-direction: column; flex-wrap: nowrap; gap: 6px; }
  .card, .card.on { flex: none; order: 0; }
  .card .frames { display: grid; }
  .ctrl { max-width: none; flex-wrap: wrap; align-self: end; }
  .ctrl .bowl { flex-basis: 100%; min-height: 58px; order: 5; }
  .ctrl .curve { flex: 1 1 auto; justify-content: space-between; }
  #scores-btn { display: none; }
}
@media (min-aspect-ratio: 5/4) and (min-height: 560px) {
  .ch .nm { font-size: 15px; }
  .ch .tot { font-size: 20px; }
  .rl { height: 19px; }
  .rl i { font-size: 13px; }
  .cm { height: 21px; line-height: 21px; font-size: 14px; }
}
/* Short landscape screens: only the active player keeps the full scorecard. */
@media (min-aspect-ratio: 5/4) and (max-height: 480px) {
  .side-title, .side-help { display: none; }
  .cards { flex-direction: row; flex-wrap: wrap; gap: 4px; }
  .card { flex: 1 1 0; }
  .card.on { flex-basis: 100%; order: -1; }
  .card:not(.on) .frames { display: none; }
  .ctrl { gap: 5px; }
  .ibtn { min-height: 40px; width: 42px; }
  .curve button { min-height: 34px; }
  .ctrl .bowl { min-height: 46px; }
  #scores-btn { display: grid; }
}
@media (max-height: 520px) {
  .panel { padding: 12px 14px; border-radius: 18px; }
  .logo h1 { font-size: 30px; }
  .bball { width: 32px; height: 32px; }
  .bball i { width: 6px; height: 6px; }
  .bball i:nth-child(1) { left: 11px; top: 8px; } .bball i:nth-child(2) { left: 18px; top: 10px; } .bball i:nth-child(3) { left: 14px; top: 16px; }
  .tagline { display: none; }
  .modes { margin-top: 10px; gap: 6px; }
  .mode { padding: 7px 10px; }
  .field { margin-top: 10px; }
  .cta { margin-top: 12px; padding: 10px; font-size: 17px; }
  .ghost { margin-top: 8px; padding: 9px; }
  .big { font-size: 32px; }
  .stars { font-size: 28px; }
  .res-list { gap: 3px; font-size: 14px; }
  .res-list div { padding: 3px 12px; }
  .panel h2 { font-size: 23px; }
}
@media (max-height: 420px) and (min-width: 520px) {
  .panel.wide { width: min(100%, 620px); }
  .panel.wide .modes { grid-template-columns: 1fr 1fr; }
  .mode small { display: none; }
  .mode { grid-template-columns: 30px 1fr; }
  .mode .ic { width: 28px; height: 28px; grid-row: auto; font-size: 14px; }
}
@media (max-width: 360px) {
  .card { padding: 3px 5px; }
  .rl i { font-size: 10px; }
  .cm { font-size: 11px; }
  .ctrl { gap: 4px; }
  .curve { gap: 2px; }
  .curve .cv { min-width: 44px; }
  .curve button { width: 30px; }
  .ibtn { width: 40px; }
  .bowl { min-width: 76px; }
  .bowl span { font-size: 17px; }
  .bowl small { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <section class="board" id="board">
    <div class="side-title" aria-hidden="true"><span class="bball"><i></i><i></i><i></i></span>Bowling</div>
    <div class="cards" id="cards"></div>
    <div class="side-help" id="side-help"></div>
  </section>
  <div class="stage" id="stage">
    <canvas id="cv" tabindex="0" role="img"></canvas>
    <div class="info" id="info"></div>
    <div class="toast" id="toast" aria-hidden="true"></div>
    <div class="banner" id="banner" aria-hidden="true"></div>
  </div>
  <div class="ctrl" id="ctrl">
    <button type="button" class="ibtn" id="menu-btn" data-i18n-label="menu">☰</button>
    <div class="curve" role="group" id="curve-group">
      <button type="button" id="curve-l" data-i18n-label="curveL">↶</button>
      <div class="cv" aria-hidden="true"><small data-i18n="curve"></small><b id="curve-val"></b></div>
      <button type="button" id="curve-r" data-i18n-label="curveR">↷</button>
    </div>
    <button type="button" class="ibtn" id="scores-btn" data-i18n-label="scores">▦</button>
    <button type="button" class="bowl" id="bowl"><span data-i18n="bowl"></span><small data-i18n="hold"></small></button>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="ov" id="menu">
  <div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="logo"><span class="bball" aria-hidden="true"><i></i><i></i><i></i></span><h1 id="menu-title">Bowling</h1></div>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="modes">
      <button type="button" class="mode" data-mode="solo"><span class="ic" style="--c:#ff5e7e" aria-hidden="true">1</span><strong data-i18n="mSolo"></strong><small data-i18n="dSolo"></small></button>
      <button type="button" class="mode" data-mode="cpu"><span class="ic" style="--c:#3a8dff" aria-hidden="true">⚡</span><strong data-i18n="mCpu"></strong><small data-i18n="dCpu"></small></button>
      <button type="button" class="mode" data-mode="party"><span class="ic" style="--c:#f2a516" aria-hidden="true">4</span><strong data-i18n="mParty"></strong><small data-i18n="dParty"></small></button>
      <button type="button" class="mode" data-mode="spare"><span class="ic" style="--c:#22b59c" aria-hidden="true">★</span><strong data-i18n="mSpare"></strong><small id="spare-sub"></small></button>
    </div>
    <p class="small" id="menu-best"></p>
    <button type="button" class="ghost" id="menu-settings" data-i18n="settings"></button>
    <p class="small" data-i18n="help"></p>
  </div>
</div>

<div class="ov" id="setup" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <h2 id="setup-title"></h2>

    $('result-big').textContent = o.big || '';
    $('result-sub').textContent = o.sub || '';
    $('result-list').innerHTML = (o.list || []).map(([n, s, w]) => `<div class="${w ? 'win' : ''}"><span>${n}</span><b>${s}</b></div>`).join('');
    $('result-main').textContent = o.main;
    $('result-alt').textContent = o.alt || '';
    $('result-alt').hidden = !o.alt;
    resultActions = { main: o.onMain, alt: o.onAlt };
    announce(`${o.title}. ${o.big || ''} ${o.sub || ''}`);
    after(reduced ? 0.2 : 1, () => { if (g && g.phase === 'over') openOverlay('result'); });
  }
  function openMenu() {
    gameSeq++;
    timers = [];
    g = null;
    clearToasts();
    rollSound(false);
    for (const id of OVERLAYS) $(id).hidden = true;
    world = liveWorld(ALL_PINS, 1);
    S.x0 = 0.12; S.angle = -0.003; S.hook = 0; S.charging = false; S.meterT = 0; S.sweep = null; S.sweepY = null; S.lift = 0; S.rackT = 1;
    cam.y = CAM0;
    $('spare-sub').textContent = t.dSpare(SPARES.length, totalStars(), SPARES.length * 3);
    $('menu-best').textContent = stats.high ? t.bestScore(stats.high) : '';
    openOverlay('menu');
  }
  let setupMode = 'solo';
  function openSetup(mode) {
    setupMode = mode;
    $('menu').hidden = true;
    $('setup-title').textContent = { solo: t.mSolo, cpu: t.mCpu, party: t.mParty }[mode];
    $('f-diff').hidden = mode !== 'cpu';
    $('f-players').hidden = mode !== 'party';
    syncSegs();
    openOverlay('setup');
  }
  function syncSegs() {
    for (const seg of document.querySelectorAll('#setup .seg')) for (const b of seg.querySelectorAll('button')) b.setAttribute('aria-pressed', String(String(prefs[seg.dataset.key]) === b.dataset.v));
    $('record').textContent = setupMode === 'cpu' ? t.record(Number(stats.w[prefs.diff]) || 0, Number(stats.l[prefs.diff]) || 0) : setupMode === 'solo' && stats.high ? t.bestScore(stats.high) : '';
  }
  function pinSvg(list) {
    let s = '<svg viewBox="0 0 34 24" aria-hidden="true">';
    SPOTS.forEach(([x, y], i) => { s += `<circle cx="${(17 + x / SP * 4).toFixed(1)}" cy="${(21 - (y - HEAD_Y) / ROW * 6).toFixed(1)}" r="2.6" fill="${list.includes(i + 1) ? '#ff5e7e' : '#ddd6ea'}"/>`; });
    return s + '</svg>';
  }
  function openLevels() {
    for (const id of OVERLAYS) $(id).hidden = true;
    const grid = $('level-grid');
    grid.innerHTML = '';
    SPARES.forEach((lv, i) => {
      const st = starOf(i), locked = i > 0 && !starOf(i - 1) && !st;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'lv'; b.disabled = locked;
      b.innerHTML = `<strong>${i + 1}</strong>${pinSvg(lv)}<small>${'★'.repeat(st)}<span class="off">${'★'.repeat(3 - st)}</span></small>`;
      b.setAttribute('aria-label', `${t.level(i + 1)} · ${lv.join('-')} · ${st}/3 ★`);
      b.addEventListener('click', () => startGame({ mode: 'spare', level: i }));
      grid.appendChild(b);
    });
    $('levels-stars').textContent = t.starsTotal(totalStars(), SPARES.length * 3);
    openOverlay('levels');
    const next = grid.querySelectorAll('.lv:not(:disabled)');
    if (next.length) next[next.length - 1].focus({ preventScroll: true });
  }
  let settingsFromMenu = false;
  function openPause(fromMenu) {
    settingsFromMenu = fromMenu;
    $('menu').hidden = true;
    cancelCharge();
    rollSound(false);
    $('resume').textContent = fromMenu ? t.back : t.resume;
    $('restart').hidden = fromMenu;
    $('to-menu').hidden = fromMenu;
    for (const b of document.querySelectorAll('[data-set]')) b.setAttribute('aria-checked', String(!!settings[b.dataset.set]));
    openOverlay('pause');
  }
  function openScores() {
    if (!g || g.mode === 'spare') return;
    $('score-list').innerHTML = g.players.map((p, i) => cardHtml(p, i === g.cur)).join('');
    openOverlay('scores');
  }

  // ---------- Input
  cv.addEventListener('pointerdown', e => {
    unlockAudio();
    if (!humanCanAim()) return;
    e.preventDefault();
    cv.focus({ preventScroll: true });
    const p = toLane(e);
    const kind = p.y < 1.4 ? 'move' : 'aim';
    S.drag = { id: e.pointerId, kind, sx: e.clientX, x0: S.x0 };
    try { cv.setPointerCapture(e.pointerId); } catch {}
    if (kind === 'aim') aimAt(p);
  });
  function aimAt(p) { if (p.y - BALL_Y0 > 1) setAngle(Math.atan2(p.x - S.x0, p.y - BALL_Y0)); }
  cv.addEventListener('pointermove', e => {
    if (!S.drag || e.pointerId !== S.drag.id || !humanCanAim()) return;
    if (S.drag.kind === 'move') setX0(S.drag.x0 + (e.clientX - S.drag.sx) * (BALL_Y0 - cam.y) / view.f);
    else aimAt(toLane(e));
  });
  const endDrag = e => { if (S.drag && e.pointerId === S.drag.id) S.drag = null; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  els.bowl.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    e.preventDefault();
    startCharge('ptr');
    try { els.bowl.setPointerCapture(e.pointerId); } catch {}
  });
  els.bowl.addEventListener('pointerup', () => { if (S.chargeBy === 'ptr') releaseHuman(); });
  els.bowl.addEventListener('pointercancel', () => { if (S.chargeBy === 'ptr') cancelCharge(); });
  els.bowl.addEventListener('contextmenu', e => e.preventDefault());
  els.curveL.addEventListener('click', () => { if (humanCanAim()) { setHook(S.hook - 1); sfx('click'); } });
  els.curveR.addEventListener('click', () => { if (humanCanAim()) { setHook(S.hook + 1); sfx('click'); } });
  $('menu-btn').addEventListener('click', () => { if (g) openPause(false); else openMenu(); });
  $('scores-btn').addEventListener('click', openScores);
  $('scores-close').addEventListener('click', () => closeOverlay('scores'));

  const isBowlKey = e => e.key === ' ' || e.key === 'Enter';
  const bowlKeyTarget = () => { const a = document.activeElement; return !a || a === document.body || a === cv || a === els.bowl; };
  addEventListener('keydown', e => {
    if (e.key === 'Escape' || overlayOpen() || !g || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === 'p') { e.preventDefault(); openPause(false); return; }
    if (isBowlKey(e) && bowlKeyTarget()) { e.preventDefault(); if (!e.repeat) startCharge('key'); return; }
    if (!humanCanAim()) return;
    const step = e.shiftKey ? 4 : 1;
    if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); setX0(S.x0 + (k === 'ArrowLeft' ? -1 : 1) * BOARD * step); }
    else if (k === 'a' || k === 'd') { e.preventDefault(); setAngle(S.angle + (k === 'a' ? -1 : 1) * 0.0008 * step); }
    else if (k === 'q' || k === 'e') { e.preventDefault(); setHook(S.hook + (k === 'q' ? -1 : 1)); }
  });
  addEventListener('keyup', e => {
    if (!isBowlKey(e) || S.chargeBy !== 'key' || !S.charging) return;
    e.preventDefault();
    releaseHuman();
  });

  for (const b of document.querySelectorAll('[data-mode]')) b.addEventListener('click', () => {
    unlockAudio();
    const m = b.dataset.mode;
    if (m === 'spare') openLevels(); else openSetup(m);
  });
  for (const seg of document.querySelectorAll('#setup .seg')) seg.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    prefs[seg.dataset.key] = Number(b.dataset.v);
    save('prefs', prefs);
    syncSegs();
  });
  $('start').addEventListener('click', () => startGame({ mode: setupMode, diff: prefs.diff, players: prefs.players, oil: prefs.oil }));
  $('setup-back').addEventListener('click', openMenu);
  $('levels-back').addEventListener('click', openMenu);
  $('menu-settings').addEventListener('click', () => openPause(true));
  $('resume').addEventListener('click', () => { if (settingsFromMenu) { $('pause').hidden = true; openMenu(); } else closeOverlay('pause'); });
  $('restart').addEventListener('click', () => { if (g) startGame(g.opts); });
  $('to-menu').addEventListener('click', openMenu);
  $('result-main').addEventListener('click', () => { if (resultActions.main) resultActions.main(); });
  $('result-alt').addEventListener('click', () => { if (resultActions.alt) resultActions.alt(); });
  $('result-menu').addEventListener('click', openMenu);
  for (const b of document.querySelectorAll('[data-set]')) b.addEventListener('click', () => {
    const k = b.dataset.set;
    settings[k] = !settings[k];
    b.setAttribute('aria-checked', String(settings[k]));
    save('settings', settings);
    if (k === 'sound' && settings.sound) unlockAudio();
  });

  // ---------- Main loop
  function update(dt) {
    sfxBudget = 3;
    if (!g || overlayOpen()) return;
    dt *= timeScale;
    runTimers(dt);
    if (!g) return;
    if (S.meterT > 0 && !S.charging) S.meterT -= dt;
    if (S.rackT < 1) S.rackT = Math.min(1, S.rackT + dt / 0.35);
    for (const p of world.pins) if (p.st === 'gone' && p.pit > 0) p.pit = Math.max(0, p.pit - dt * 3);
    const b = world.ball;
    if (g.phase === 'aim') {
      if (S.charging) { S.chargeT += dt; S.power = tri(S.chargeT); setPowerUi(S.power); }
      b.x = S.x0; b.y = BALL_Y0;
    } else if (g.phase === 'cpu') {
      if (g.cpuAnim) animateCpu(dt);
    } else if (g.phase === 'roll') {
      acc += dt;
      let n = 0;
      while (acc >= SIM_DT && n < 2400) { acc -= SIM_DT; stepWorld(world, SIM_DT); n++; }
      rollSound(!b.gone, b.gutter ? 0.05 : 0.04 + Math.hypot(b.vx, b.vy) * 0.022);
      if (settled(world)) rollEnd();
    }
    if (S.sweep) stepSweep(dt);
    if (settings.follow && g && g.phase !== 'aim' && g.phase !== 'cpu') S.camTarget = Math.max(S.camTarget, clamp(b.y - (BALL_Y0 - CAM0), CAM0, HEAD_Y - view.dEnd));
    cam.y += (S.camTarget - cam.y) * Math.min(1, dt * (g && g.phase === 'roll' ? 7 : 3.6));
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!document.hidden) { update(dt); draw(); }
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelCharge(); rollSound(false); } });

  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.

  if (navigator.webdriver) window.__bowling = {
    state: () => ({
      mode: g && g.mode, phase: g && g.phase, cur: g && g.cur, tries: g && g.tries, level: g && g.level, cam: +cam.y.toFixed(2),
      up: world.pins.filter(p => p.st === 'up').map(p => p.n), x0: S.x0, angle: S.angle, hook: S.hook,
      players: g ? g.players.map(p => { const sc = scoreCard(p.rolls); return { name: p.name, cpu: p.cpu, rolls: p.rolls.slice(), total: sc.total, done: sc.done }; }) : [],
    }),
    shoot: (x0, angle, power, hook) => {
      if (!humanCanAim()) return false;
      setX0(x0); setAngle(angle); setHook(hook);
      g.players[g.cur].aim = { x0: S.x0, angle: S.angle, hook: S.hook };
      S.lastPower = power;
      release({ x0: S.x0, angle: S.angle, power, hook: hook / 3 });
      return true;
    },
    aimFor: (x0, tx, power, hook, ty) => aimFor(g ? g.oil : 1, x0, power, hook / 3, tx, ty),
    speed: k => { timeScale = k; },
  };

  makePinSprite();
  new ResizeObserver(resize).observe($('stage'));
  resize();
  openMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
