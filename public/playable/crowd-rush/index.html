<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crowd Rush</title>
<style>
:root {
  --ink: #232650;
  --muted: #6a6f99;
  --paper: #ffffff;
  --blue: #2f6fed;
  --blue-dark: #1d4fb5;
  --red: #ef4444;
  --gold: #ffc531;
  --gold-dark: #d39400;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: #7cc8ff; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.app { position: relative; height: 100%; overflow: hidden; }
.stage { position: absolute; inset: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas:focus-visible { outline: 3px solid #ffffffaa; outline-offset: -6px; }

.hud { position: absolute; top: 0; left: 0; right: 0; max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); pointer-events: none; }
.pill { flex: 0 0 auto; padding: 7px 12px; border-radius: 99px; background: #ffffffe0; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 0 3px 0 #23265022; }
.pill.coins { display: flex; align-items: center; gap: 5px; }
.pill.coins.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.18); } }
.progress { flex: 1; min-width: 40px; height: 12px; border-radius: 99px; background: #ffffff88; overflow: hidden; box-shadow: inset 0 1px 3px #2326502a; }
.progress i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #5d97ff, var(--blue)); }
.icon-btn { pointer-events: auto; flex: 0 0 auto; width: 40px; height: 40px; border-radius: 14px; background: #ffffffe0; font-size: 15px; font-weight: 900; box-shadow: 0 3px 0 #23265022; }
.icon-btn[hidden] { display: none; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #23265022; }

.banner { position: absolute; left: 0; right: 0; top: 20%; text-align: center; pointer-events: none; animation: banner 1.6s ease-out both; padding: 0 16px; }
.banner span { display: inline-block; padding: 8px 22px; border-radius: 99px; background: #232650c4; color: #fff; font-size: clamp(22px, 6.5vw, 34px); font-weight: 900; letter-spacing: -.01em; box-shadow: 0 8px 24px #23265040; }
.banner[hidden] { display: none; }
@keyframes banner { 0% { opacity: 0; transform: scale(.7); } 15% { opacity: 1; transform: scale(1.06); } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.hint { position: absolute; left: 0; right: 0; bottom: max(26px, env(safe-area-inset-bottom)); text-align: center; pointer-events: none; }
.hint span { display: inline-block; padding: 9px 18px; border-radius: 99px; background: #232650cc; color: #fff; font-size: 15px; font-weight: 800; animation: nudge 1.2s ease-in-out infinite; }
.hint[hidden] { display: none; }
@keyframes nudge { 50% { transform: translateX(14px); } }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: #1d215044; }
.overlay[hidden] { display: none; }
.overlay.clear { background: linear-gradient(#1d215000 30%, #1d215055); }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; padding: 24px 20px 20px; border-radius: 28px; background: var(--paper); text-align: center; box-shadow: 0 20px 50px #1d215066; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h1 { font-size: clamp(34px, 11vw, 46px); font-weight: 900; letter-spacing: -.04em; line-height: 1; color: var(--blue); }
.panel h1 span { color: var(--red); }
.panel h2 { font-size: 25px; font-weight: 900; line-height: 1.15; }
.panel p { margin-top: 8px; color: var(--muted); line-height: 1.4; }
.panel .emoji { margin: 0; font-size: 42px; line-height: 1.1; }
.panel .small { font-size: 13px; }
.stars { margin-top: 4px !important; font-size: 40px; letter-spacing: 4px; color: #e5e3f0 !important; line-height: 1.1; }
.stars b { color: var(--gold); }
.result { font-size: 18px; font-weight: 800; color: var(--ink) !important; }
.earned { font-size: 24px; font-weight: 900; color: var(--gold-dark) !important; }
.badge { display: inline-block; margin-top: 8px; padding: 5px 14px; border-radius: 99px; background: var(--gold); color: #3b2a00 !important; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 18px; width: 100%; padding: 15px; border-radius: 18px; background: var(--blue); color: #fff; font-size: 19px; font-weight: 900; box-shadow: 0 6px 0 var(--blue-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-dark); }
.row { display: flex; gap: 10px; margin-top: 12px; }
.secondary { flex: 1; min-width: 0; padding: 12px 8px; border-radius: 16px; border: 2px solid #e2e4f3; font-weight: 800; }
.secondary:active { background: #f1f2fa; }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 16px; }
.level-btn { aspect-ratio: 1; display: grid; place-content: center; gap: 1px; border-radius: 14px; background: #eaf0ff; box-shadow: 0 3px 0 #c5d3f6; font-size: 18px; font-weight: 900; }
.level-btn small { font-size: 9px; letter-spacing: 1px; color: #c9ccdf; }
.level-btn small b { color: var(--gold); font-weight: 900; }
.level-btn.boss { background: #ffe9e9; box-shadow: 0 3px 0 #f4c4c4; }
.level-btn.current { background: var(--blue); color: #fff; box-shadow: 0 3px 0 var(--blue-dark); }
.level-btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.shop-item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-top: 14px; padding: 12px; border-radius: 18px; background: #f3f5ff; text-align: start; }
.shop-item .icon { font-size: 28px; }
.shop-item strong { display: block; font-size: 16px; }
.shop-item span { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
.shop-item .lv { font-weight: 800; color: var(--blue); }
.buy { min-width: 76px; padding: 10px 10px; border-radius: 14px; background: var(--gold); color: #3b2a00; font-weight: 900; font-variant-numeric: tabular-nums; box-shadow: 0 4px 0 var(--gold-dark); white-space: nowrap; }
.buy:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
.buy:disabled { opacity: .45; cursor: default; transform: none; }
.wallet { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: #fff4cf; font-weight: 900; font-variant-numeric: tabular-nums; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="stage" id="stage">
    <canvas id="canvas" tabindex="0" role="img"></canvas>
  </div>
  <div class="hud">
    <div class="pill" id="level-pill"></div>
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    <div class="pill coins" id="coins-pill"><span aria-hidden="true">🪙</span><span id="coins">0</span></div>
    <button type="button" class="icon-btn" id="pause" data-i18n-label="pause" hidden>❚❚</button>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="hint" id="hint" hidden><span><span aria-hidden="true">👆 </span><span data-i18n="steer"></span></span></div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay clear" id="start">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <h1 id="start-title">Crowd <span>Rush</span></h1>
    <p data-i18n="tagline"></p>
    <p class="small" data-i18n="controls"></p>
    <button type="button" class="cta" id="play"></button>
    <div class="row">
      <button type="button" class="secondary" id="open-levels" data-i18n="levels"></button>
      <button type="button" class="secondary" id="open-shop" data-i18n="upgrades"></button>
    </div>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🏆</p>
    <h2 id="win-title"></h2>
    <p class="stars" id="stars"></p>
    <p class="result" id="result"></p>
    <p class="earned" id="earned"></p>
    <p class="small" id="best"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="next" data-i18n="next"></button>
    <div class="row">
      <button type="button" class="secondary" id="replay" data-i18n="replay"></button>
      <button type="button" class="secondary" id="win-menu" data-i18n="menu"></button>
    </div>
  </div>
</div>

<div class="overlay" id="lose" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="lose-title">
    <p class="emoji" aria-hidden="true">💥</p>
    <h2 id="lose-title" data-i18n="lostTitle"></h2>
    <p id="lose-text"></p>
    <button type="button" class="cta" id="retry" data-i18n="retry"></button>
    <div class="row">
      <button type="button" class="secondary" id="lose-shop" data-i18n="upgrades"></button>
      <button type="button" class="secondary" id="lose-menu" data-i18n="menu"></button>
    </div>
  </div>
</div>

<div class="overlay" id="paused" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="paused-title">
    <h2 id="paused-title" data-i18n="paused"></h2>
    <button type="button" class="cta" id="resume" data-i18n="resume"></button>
    <div class="row">
      <button type="button" class="secondary" id="restart" data-i18n="restart"></button>
      <button type="button" class="secondary" id="pause-menu" data-i18n="menu"></button>
    </div>
  </div>
</div>

<div class="overlay" id="levels" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="levels-title">
    <h2 id="levels-title" data-i18n="chooseLevel"></h2>
    <div class="level-grid" id="level-grid"></div>
    <div class="row"><button type="button" class="secondary" id="close-levels" data-i18n="close"></button></div>
  </div>
</div>

<div class="overlay" id="shop" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="shop-title">
    <h2 id="shop-title" data-i18n="upgrades"></h2>
    <p class="wallet"><span aria-hidden="true">🪙 </span><span id="wallet"></span></p>
    <div class="shop-item">
      <span class="icon" aria-hidden="true">👥</span>
      <div><strong data-i18n="startCrowd"></strong><span id="start-desc"></span><span class="lv" id="start-lv"></span></div>
      <button type="button" class="buy" id="buy-start"></button>
    </div>
    <div class="shop-item">
      <span class="icon" aria-hidden="true">💰</span>
      <div><strong data-i18n="income"></strong><span id="income-desc"></span><span class="lv" id="income-lv"></span></div>
      <button type="button" class="buy" id="buy-income"></button>
    </div>
    <div class="row"><button type="button" class="secondary" id="close-shop" data-i18n="close"></button></div>
  </div>
</div>

        project(x + 1.2, SEA_Y, z);

  function quad(x0, x1, y, za, zb) {
    project(x0, y, za); ctx.moveTo(PX, PY);

    project(x, y1, zb); ctx.lineTo(PX, PY);
    project(x, y0, zb); ctx.lineTo(PX, PY);
    ctx.closePath();
  }
  function railBlocked(side, za) {
    for (const p of def.pits) if ((p.side === 0 || p.side === side) && za >= p.z0 - 0.01 && za < p.z1 - 0.01) return true;
    return false;
  }

  function drawRoad() {
    const zNear = camZ + NEAR, zFar = Math.min(camZ + DRAW_DIST, def.roadEnd);
    if (zFar <= zNear) return;
    const zStart = Math.floor(zNear / SEG) * SEG;
    for (let parity = 0; parity < 2; parity++) {
      ctx.fillStyle = parity ? '#efe7d6' : '#fbf6ec';
      ctx.beginPath();
      for (let z = zStart; z < zFar; z += SEG) {
        if ((Math.round(z / SEG) & 1) !== parity) continue;
        quad(-RH, RH, 0, Math.max(z, zNear), Math.min(z + SEG, zFar));
      }
      ctx.fill();
    }
    ctx.fillStyle = '#8b6fe6';
    ctx.beginPath();
    for (let z = zStart; z < zFar; z += SEG) {
      const za = Math.max(z, zNear), zb = Math.min(z + SEG, zFar);
      if (!railBlocked(-1, z)) wall(-RH, 0, RAIL_H, za, zb);
      if (!railBlocked(1, z)) wall(RH, 0, RAIL_H, za, zb);
    }
    ctx.fill();
    ctx.fillStyle = '#b29cff';
    ctx.beginPath();
    for (let z = zStart; z < zFar; z += SEG) {
      const za = Math.max(z, zNear), zb = Math.min(z + SEG, zFar);
      if (!railBlocked(-1, z)) quad(-RH - RAIL, -RH, RAIL_H, za, zb);
      if (!railBlocked(1, z)) quad(RH, RH + RAIL, RAIL_H, za, zb);
    }
    ctx.fill();
    for (const p of def.pits) {
      if (p.z1 < zNear || p.z0 > zFar) continue;
      const za = Math.max(p.z0, zNear), zb = Math.min(p.z1, zFar);
      for (let side = -1; side <= 1; side += 2) {
        if (p.side !== 0 && p.side !== side) continue;
        const inner = side * (RH - p.w), outer = side * (RH + RAIL + 0.05);
        const x0 = Math.min(inner, outer), x1 = Math.max(inner, outer);
        ctx.fillStyle = '#1e6e98'; ctx.beginPath(); quad(x0, x1, 0, za, zb); ctx.fill();
        if (zb === p.z1) { ctx.fillStyle = '#145a7e'; ctx.beginPath(); project(x0, 0, zb); const ax = PX, ay = PY; project(x1, SEA_Y, zb); ctx.rect(ax, ay, PX - ax, PY - ay); ctx.fill(); }
        // Warning stripe along the lip of the hole.
        ctx.strokeStyle = '#ffc531'; ctx.lineWidth = Math.max(2, 0.12 * F / Math.max(NEAR, (za + zb) / 2 - camZ));
        ctx.beginPath(); project(inner, 0.01, za); ctx.moveTo(PX, PY); project(inner, 0.01, zb); ctx.lineTo(PX, PY); ctx.stroke();

    }

      ctx.fillStyle = '#ffffff'; ctx.beginPath(); quad(-RH, RH, 0.005, def.finishZ, def.finishZ + 1.2); ctx.fill();
      ctx.fillStyle = '#2b2d42'; ctx.beginPath();
      for (let r = 0; r < 2; r++) for (let c = 0; c < 10; c++) if ((r + c) & 1) quad(-RH + c, -RH + c + 1, 0.01, def.finishZ + r * 0.6, def.finishZ + r * 0.6 + 0.6);
      ctx.fill();
    }
  }

  const SXB = new Float32Array(CAP), SYB = new Float32Array(CAP), SSB = new Float32Array(CAP);
  function drawCrowd(c, pal, time) {
    const n = c.n;
    if (!n) return;
    project(c.x, c.y, c.z - c.r * c.zs); const yNear = PY;
    project(c.x, c.y, c.z + c.r * c.zs); const yFar = PY;
    project(c.x, c.y, c.z);

    ctx.fillStyle = '#1b2a6614';
    ctx.beginPath(); ctx.ellipse(PX, (yNear + yFar) / 2, c.r * PS, Math.max(3, (yNear - yFar) / 2), 0, 0, TAU); ctx.fill();

      const wz = c.z + c.oz[i] * c.zs;
      if (wz - camZ < NEAR) { SSB[i] = 0; continue; }
      project(c.x + c.ox[i], c.y, wz);
      SXB[i] = PX; SYB[i] = PY; SSB[i] = PS * c.fig;
    }

    ctx.strokeStyle = pal.leg; ctx.lineWidth = Math.max(1, sMid * 0.075);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {

      const hip = y - 0.3 * s, sh = y - 0.48 * s;
      ctx.moveTo(x - 0.05 * s, hip); ctx.lineTo(x - 0.05 * s + sw, y);
      ctx.moveTo(x + 0.05 * s, hip); ctx.lineTo(x + 0.05 * s - sw, y);
      ctx.moveTo(x - 0.12 * s, sh); ctx.lineTo(x - 0.2 * s - sw * 0.6, sh + 0.17 * s);
      ctx.moveTo(x + 0.12 * s, sh); ctx.lineTo(x + 0.2 * s + sw * 0.6, sh + 0.17 * s);
    }
    ctx.stroke();
    ctx.fillStyle = pal.body;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const s = SSB[i];
      if (!s) continue;
      const bob = still ? Math.sin(time * 3 + c.ph[i]) * 0.02 * s : Math.abs(Math.sin(legT + c.ph[i])) * 0.03 * s;
      const cy = SYB[i] - 0.42 * s - bob;

    ctx.fill();
    ctx.fillStyle = pal.head;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const s = SSB[i];
      if (!s) continue;
      const bob = still ? Math.sin(time * 3 + c.ph[i]) * 0.02 * s : Math.abs(Math.sin(legT + c.ph[i])) * 0.03 * s;
      const cy = SYB[i] - 0.66 * s - bob;

    ctx.fill();
  }

  function drawBubble(c, color) {
    if (!c.n && c.count <= 0) return;
    project(c.x, c.y + 0.95, c.z + c.r * c.zs * 0.6);
    if (c.z - camZ < NEAR) return;
    const size = clamp(PS * 0.5, 12, 19) * (1 + c.pop * 0.35);
    ctx.font = `900 ${size.toFixed(1)}px ${CANVAS_FONT}`;
    const w = ctx.measureText(c.label).width + size * 1.1, h = size * 1.45;

    ctx.beginPath(); ctx.moveTo(x - 5, y + h / 2 - 1); ctx.lineTo(x + 5, y + h / 2 - 1); ctx.lineTo(x, y + h / 2 + 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.label, x, y + 1);
  }

  function drawGate(g) {
    for (let side = 0; side < 2; side++) {
      const op = g.ops[side];
      const x0 = side ? 0.12 : -RH + 0.12, x1 = side ? RH - 0.12 : -0.12;
      project(x0, 0, g.z); const left = PX, bottom = PY;
      project(x1, GATE_H, g.z); const right = PX, top = PY, s = PS;
      const good = isGood(op);
      const faded = g.used >= 0 && g.used !== side;
      ctx.globalAlpha = faded ? 0.25 : 1;
      ctx.fillStyle = good ? '#3d8bff8c' : '#ff4d4d8c';
      ctx.fillRect(left, top, right - left, bottom - top);
      if (g.used === side && g.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${(g.flash * 0.7).toFixed(2)})`; ctx.fillRect(left, top, right - left, bottom - top); }
      ctx.fillStyle = good ? '#1d5fe0' : '#d42a2a';
      ctx.fillRect(left, top, right - left, Math.max(2, 0.22 * s));
      ctx.fillStyle = '#fff';
      ctx.font = `900 ${Math.max(8, 0.95 * s).toFixed(1)}px ${CANVAS_FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(op.label, (left + right) / 2, (top + bottom) / 2 + 0.1 * s);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    for (let x = -RH; x <= RH; x += RH) {
      project(x, 0, g.z); const bx = PX, by = PY, s = PS;
      project(x, GATE_H + 0.15, g.z);
      ctx.fillRect(bx - 0.09 * s, PY, 0.18 * s, by - PY);
    }
  }

  function drawBar(h) {
    project(h.x, 0, h.z); const bx = PX, by = PY, s = PS;
    ctx.fillStyle = '#5b4a9e'; ctx.fillRect(bx - 0.18 * s, by - 0.75 * s, 0.36 * s, 0.75 * s);
    project(h.x - h.len * h.ca, 0.5, h.z - h.len * h.sa); const ax = PX, ay = PY, as = PS;
    project(h.x + h.len * h.ca, 0.5, h.z + h.len * h.sa);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#c94a10'; ctx.lineWidth = 0.34 * (as + PS) / 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(PX, PY); ctx.stroke();
    ctx.strokeStyle = '#ff8a3d'; ctx.lineWidth = 0.22 * (as + PS) / 2;
    ctx.beginPath(); ctx.moveTo(ax, ay - 0.04 * as); ctx.lineTo(PX, PY - 0.04 * PS); ctx.stroke();
    ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.arc(bx, by - 0.5 * s, 0.22 * s, 0, TAU); ctx.fill();
  }

  function drawSaw(h, time) {
    project(-RH + 0.4, 0, h.z); const ax = PX, ay = PY, s = PS;
    project(RH - 0.4, 0, h.z);
    ctx.strokeStyle = '#3c3f5c'; ctx.lineCap = 'round'; ctx.lineWidth = 0.16 * s;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(PX, PY); ctx.stroke();

  }

  function drawHammer(h) {
    const top = HAMMER_PIVOT + 0.4;
    ctx.fillStyle = '#5b4a9e';
    for (let side = -1; side <= 1; side += 2) {
      const x = side * (RH + 0.2);
      project(x, 0, h.z); const bx = PX, by = PY, s = PS;
      project(x, top + 0.3, h.z);

    ctx.fillStyle = '#ffffff'; ctx.fillRect(-0.45 * s, -0.45 * s, 0.22 * s, 0.9 * s); ctx.fillRect(0.23 * s, -0.45 * s, 0.22 * s, 0.9 * s);
    ctx.restore();
  }

  function drawFinishArch() {
    ctx.fillStyle = '#ffffff';
    for (let side = -1; side <= 1; side += 2) {
      const x = side * (RH + 0.2);

      project(x, 3.4, def.finishZ);
      ctx.fillRect(bx - 0.13 * s, PY, 0.26 * s, by - PY);

    ctx.fillStyle = '#ffc531'; ctx.fillRect(lx, ly, PX - lx, PY - ly);
    ctx.fillStyle = '#2b2d42';

    ctx.fillText('🏁', (lx + PX) / 2, (ly + PY) / 2 + 0.08 * s);
  }

  function drawStairs() {
    const z0 = def.stairsZ;
    for (let k = STAIRS - 1; k >= 0; k--) {
      const za = z0 + k * STAIR_DEPTH, zb = za + STAIR_DEPTH;
      if (za - camZ > DRAW_DIST || zb - camZ < NEAR) continue;
      const yTop = (k + 1) * STAIR_RISE;
      ctx.fillStyle = STAIR_COLORS[k][1]; ctx.beginPath(); quad(-RH, RH, yTop, za, zb); ctx.fill();
      project(-RH, k * STAIR_RISE, za); const lx = PX, by = PY;
      project(RH, yTop, za); const rx = PX, ty = PY;
      ctx.fillStyle = STAIR_COLORS[k][0]; ctx.fillRect(lx, ty, rx - lx, by - ty);
      project(0, yTop, za + STAIR_DEPTH * 0.35);

        ctx.font = `900 ${(0.62 * PS).toFixed(1)}px ${CANVAS_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#00000026'; ctx.fillText(MULT_LABELS[k], PX, PY + 0.05 * PS);
        ctx.fillStyle = '#ffffff'; ctx.fillText(MULT_LABELS[k], PX, PY);

      if (paid) {
        const shown = Math.min(paid, 9);
        ctx.fillStyle = PLAYER_PAL.body;
        ctx.beginPath();
        for (let j = 0; j < shown; j++) {
          project(-RH + 0.7 + (j + 0.5) * (2 * RH - 1.4) / shown, yTop, za + STAIR_DEPTH * 0.8);
          ctx.moveTo(PX + 0.15 * PS, PY - 0.42 * PS); ctx.arc(PX, PY - 0.42 * PS, 0.15 * PS, 0, TAU);
          ctx.moveTo(PX + 0.12 * PS, PY - 0.68 * PS); ctx.arc(PX, PY - 0.68 * PS, 0.12 * PS, 0, TAU);
          ctx.rect(PX - 0.08 * PS, PY - 0.3 * PS, 0.16 * PS, 0.3 * PS);
        }
        ctx.fill();
      }
    }
  }

  function drawBoss() {
    const b = def.boss, z = b.z;
    // Castle behind the boss.
    const cz = z + 7;
    project(-6.5, 0, cz); const lx = PX, by = PY, s = PS;
    project(6.5, 4.6, cz); const rx = PX, ty = PY;
    ctx.fillStyle = '#efe2ff'; ctx.fillRect(lx, ty, rx - lx, by - ty);
    ctx.fillStyle = '#d6c2fb';

      ctx.fillStyle = '#e23b3b';
      ctx.beginPath(); ctx.moveTo((tl + PX) / 2, PY - 0.5 * s); ctx.lineTo((tl + PX) / 2, PY - 2 * s); ctx.lineTo((tl + PX) / 2 + 0.9 * s, PY - 1.7 * s); ctx.lineTo((tl + PX) / 2, PY - 1.4 * s); ctx.fill();
      ctx.strokeStyle = '#5b4a9e'; ctx.lineWidth = 0.08 * s; ctx.beginPath(); ctx.moveTo((tl + PX) / 2, PY - 0.5 * s); ctx.lineTo((tl + PX) / 2, PY - 2 * s); ctx.stroke();
      ctx.fillStyle = '#d6c2fb';
    }
    for (let k = 0; k < 7; k++) ctx.fillRect(lx + (rx - lx) * k / 6.5, ty - 0.45 * s, (rx - lx) / 13, 0.45 * s);
    ctx.fillStyle = '#5b3f8c';

    project(1.3, 2.6, cz);
    ctx.beginPath(); ctx.roundRect(dl, PY, PX - dl, by - PY, [(PX - dl) / 2, (PX - dl) / 2, 0, 0]); ctx.fill();

    ctx.moveTo(0.06 * gs, -0.3 * gs); ctx.lineTo(0.1 * gs, 0);
    ctx.moveTo(-0.13 * gs, -0.5 * gs); ctx.lineTo(-0.25 * gs, -0.36 * gs + arm * 0.2 * gs);
    ctx.moveTo(0.13 * gs, -0.5 * gs); ctx.lineTo(0.25 * gs, -0.36 * gs - arm * 0.2 * gs);

    ctx.beginPath(); ctx.arc(0, -0.43 * gs, 0.16 * gs, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff6a6a'; ctx.beginPath(); ctx.arc(0, -0.68 * gs, 0.12 * gs, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-0.04 * gs, -0.69 * gs, 0.025 * gs, 0, TAU); ctx.arc(0.04 * gs, -0.69 * gs, 0.025 * gs, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b2d42';
    ctx.fillRect(-0.075 * gs, -0.725 * gs, 0.07 * gs, 0.015 * gs); ctx.fillRect(0.005 * gs, -0.725 * gs, 0.07 * gs, 0.015 * gs);
    ctx.fillStyle = '#ffc531';
    ctx.beginPath(); ctx.moveTo(-0.09 * gs, -0.77 * gs); ctx.lineTo(-0.1 * gs, -0.88 * gs); ctx.lineTo(-0.045 * gs, -0.82 * gs); ctx.lineTo(0, -0.9 * gs); ctx.lineTo(0.045 * gs, -0.82 * gs); ctx.lineTo(0.1 * gs, -0.88 * gs); ctx.lineTo(0.09 * gs, -0.77 * gs); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawBossBar() {
    const b = def.boss;
    if (!b || b.fall >= 1) return;
    project(0, BOSS_SCALE * 0.95, b.z);
    if (b.z - camZ > DRAW_DIST) return;
    const w = 130, h = 16, x = PX - w / 2, y = Math.max(52, PY - 26);
    ctx.fillStyle = '#23265099'; ctx.beginPath(); ctx.roundRect(x - 3, y - 3, w + 6, h + 6, 10); ctx.fill();
    ctx.fillStyle = '#ffffff33'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill();
    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w * b.hp / b.maxHp), h, 8); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = `900 12px ${CANVAS_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`♥ ${b.hp}`, PX, y + h / 2 + 1);
  }

  function drawProp(it, time) {
    const dz = it.z - camZ;
    if (it.type === 'stairs') { drawStairs(); return; }
    if (dz > DRAW_DIST + 10 || dz < NEAR - 4) return;
    if (it.type === 'gate') drawGate(it);
    else if (it.type === 'enemy') { if (it.alive) drawCrowd(it.crowd, ENEMY_PAL, time); }
    else if (it.type === 'bar') drawBar(it);
    else if (it.type === 'saw') drawSaw(it, time);
    else if (it.type === 'hammer') drawHammer(it);
    else if (it.type === 'finish') drawFinishArch();
    else if (it.type === 'boss') drawBoss();
  }

  function drawParticles() {
    let color = -1;
    for (let i = 0; i < particleCount; i++) {
      if (PLIFE[i] <= 0 || PZ_[i] - camZ < NEAR) continue;
      if (PCOL[i] !== color) { color = PCOL[i]; ctx.fillStyle = PARTICLE_COLORS[color]; }
      project(PX_[i], PY_[i], PZ_[i]);
      const r = Math.max(1.2, 0.1 * PS);
      ctx.globalAlpha = Math.min(1, PLIFE[i] * 3);
      ctx.fillRect(PX - r, PY - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawSpeedLines() {
    if (reducedMotion.matches || game.speed < 1 || (game.state !== 'run' && game.state !== 'toBoss')) return;
    const cx = W / 2, cy = horizonY + 40, reach = Math.hypot(W, H) * 0.6;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < LINES; i++) {
      const d = LD[i], r0 = reach * (0.35 + d * 0.8), r1 = r0 + reach * 0.12;
      ctx.globalAlpha = 0.35 * d * (game.speed / RUN_SPEED);
      const ca = Math.cos(LA[i]), sa = Math.sin(LA[i]);
      ctx.beginPath(); ctx.moveTo(cx + ca * r0, cy + sa * r0 * 0.7); ctx.lineTo(cx + ca * r1, cy + sa * r1 * 0.7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function draw(time) {
    let sx = 0, sy = 0;
    if (game.shake > 0) { const a = game.shake * 9; sx = (Math.random() - 0.5) * a; sy = (Math.random() - 0.5) * a; }
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, sx * scale * dpr, sy * scale * dpr);
    drawBackground(time);
    drawRoad();
    // Painter's order: far props first, the player's crowd slots in at its depth.
    let playerDrawn = false;
    const props = def.props;
    for (let i = props.length - 1; i >= 0; i--) {
      const it = props[i];
      if (!playerDrawn && it.z < player.z && it.type !== 'stairs') { drawCrowd(player, PLAYER_PAL, time); playerDrawn = true; }
      drawProp(it, time);
    }
    if (!playerDrawn) drawCrowd(player, PLAYER_PAL, time);
    drawParticles();
    for (const e of def.enemies) if (e.alive && e.crowd.z - camZ < 70 && e.crowd.z - camZ > NEAR + 1) drawBubble(e.crowd, ENEMY_PAL.bubble);
    if (game.state !== 'lost') drawBubble(player, PLAYER_PAL.bubble);
    drawBossBar();
    drawSpeedLines();
    if (game.tint > 0) { ctx.globalAlpha = game.tint * 0.16; ctx.fillStyle = game.tintColor; ctx.fillRect(-20, -20, W + 40, H + 40); ctx.globalAlpha = 1; }
  }

  // ---------- HUD & panels ----------
  let lastProgress = -1;
  function updateProgress() {
    const v = Math.round(clamp(player.z / def.finishZ, 0, 1) * 100);
    if (v !== lastProgress) { lastProgress = v; els.progress.style.width = `${v}%`; }
  }
  function updateHud() {
    els.levelPill.textContent = t.level(def.n);
    els.coins.textContent = String(progress.coins);
    els.coinsPill.setAttribute('aria-label', `🪙 ${progress.coins}`);
    els.play.textContent = t.play(progress.unlocked);
    lastProgress = -1;
    updateProgress();
  }

  function showBanner(text) {
    els.banner.innerHTML = '<span></span>';
    els.banner.firstChild.textContent = text;
    els.banner.hidden = true;
    void els.banner.offsetWidth;
    els.banner.hidden = false;
    announce(text);
    clearTimeout(showBanner.timer);
    showBanner.timer = setTimeout(() => { els.banner.hidden = true; }, 1700);
  }

  function hidePanels() { for (const p of PANELS) p.hidden = true; }
  function openPanel(panel, focusEl) {
    hidePanels();
    panel.hidden = false;
    els.hint.hidden = true;
    (focusEl || panel.querySelector('button')).focus({ preventScroll: true });
  }

  function showWin() {
    const r = game.result, n = def.n;
    els.winTitle.textContent = t.complete(n);
    els.stars.innerHTML = `<b>${'★'.repeat(r.stars)}</b>${'★'.repeat(3 - r.stars)}`;
    els.stars.setAttribute('aria-label', t.stars(r.stars));
    els.result.textContent = def.boss ? t.bossDown : t.mult(r.mult.toFixed(1));
    els.earned.textContent = t.earned(r.coins);
    els.best.textContent = t.best(Math.max(r.prevBest, r.coins));
    els.newBest.hidden = !(r.newBest && r.prevBest > 0);
    updateHud();
    els.coinsPill.classList.remove('bump'); void els.coinsPill.offsetWidth; els.coinsPill.classList.add('bump');
    openPanel(els.win, els.next);
    announce(`${t.complete(n)} ${t.stars(r.stars)}. ${els.result.textContent}. ${t.earned(r.coins)}`);
  }

  function showLose() {
    const text = { gate: t.lostGate, fight: t.lostFight, boss: t.lostBoss, trap: t.lostTrap }[game.loseReason];
    els.loseText.textContent = text;
    openPanel(els.lose, $('retry'));
    announce(`${t.lostTitle} ${text}`);
  }

  function showStart() {
    prepareLevel(progress.unlocked);
    els.pause.hidden = true;
    updateHud();
    openPanel(els.start, els.play);
  }

  function pauseGame() {
    if (!isPlaying() || game.paused) return;
    game.paused = true;
    openPanel(els.paused, $('resume'));
  }
  function resumeGame() {
    game.paused = false;
    hidePanels();
    lastTime = performance.now();
    canvas.focus({ preventScroll: true });
  }
  const isPlaying = () => ['run', 'fight', 'toBoss', 'boss', 'stairs'].includes(game.state);

  function renderLevels() {
    const total = Math.min(99, Math.max(30, progress.unlocked));
    els.levelGrid.textContent = '';
    for (let n = 1; n <= total; n++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'level-btn' + (n % 5 === 0 ? ' boss' : '') + (n === progress.unlocked ? ' current' : '');
      const stars = progress.stars[n] || 0;
      btn.innerHTML = `${n}<small><b>${'★'.repeat(stars)}</b>${'★'.repeat(3 - stars)}</small>`;
      btn.disabled = n > progress.unlocked;
      btn.setAttribute('aria-label', btn.disabled ? t.lockedLabel(n) : t.levelLabel(n, stars));
      btn.addEventListener('click', () => startLevel(n));
      els.levelGrid.append(btn);
    }
  }

  function renderShop() {
    const c = progress.coins;
    els.wallet.textContent = String(c);
    const rows = [
      [progress.upStart, startCost, els.startDesc, els.startLv, els.buyStart, t.startDesc(startCrowdSize()), t.startCrowd],
      [progress.upIncome, incomeCost, els.incomeDesc, els.incomeLv, els.buyIncome, t.incomeDesc(incomeBonus()), t.income],
    ];
    for (const [lv, costFn, desc, lvEl, btn, text, name] of rows) {
      desc.textContent = text;
      lvEl.textContent = t.lv(lv, MAX_UP);
      const maxed = lv >= MAX_UP, cost = costFn(lv);
      btn.textContent = maxed ? t.maxed : `🪙 ${cost}`;
      btn.disabled = maxed || c < cost;
      btn.setAttribute('aria-label', maxed ? `${name}: ${t.maxed}` : t.buyLabel(name, cost));
    }
  }

  function buy(kind) {
    const key = kind === 'start' ? 'upStart' : 'upIncome';
    const cost = (kind === 'start' ? startCost : incomeCost)(progress[key]);
    if (progress[key] >= MAX_UP || progress.coins < cost) return;
    progress.coins -= cost;
    progress[key] += 1;
    saveProgress();
    renderShop();
    updateHud();
    if (game.state === 'ready') prepareLevel(def.n);
    announce(t.bought(kind === 'start' ? t.startCrowd : t.income));
  }

  let shopReturn = null;
  function openShop(from) { shopReturn = from; renderShop(); openPanel(els.shop); }
  function closeShop() { if (shopReturn === els.lose) openPanel(els.lose, $('retry')); else showStart(); }

  // ---------- Input ----------
  const keys = { left: false, right: false };
  const keyDir = () => (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let dragId = null, dragX = 0;
  canvas.addEventListener('pointerdown', event => {
    if (!isPlaying() || game.paused) return;
    dragId = event.pointerId; dragX = event.clientX;
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove', event => {
    if (event.pointerId !== dragId) return;
    // Convert CSS pixels to world units at the crowd's depth so the crowd tracks the finger.
    const dx = (event.clientX - dragX) / scale / (F / camDist) * 1.1;
    dragX = event.clientX;
    if (game.state === 'run' && !game.paused) {
      const limit = Math.max(0, RH - 0.25 - player.r);
      player.tx = clamp(player.tx + dx, -limit, limit);
      if (game.hintTimer > 0 && Math.abs(dx) > 0.02) game.hintTimer = Math.min(game.hintTimer, 0.4);
    }
  });
  const endDrag = event => { if (event.pointerId === dragId) dragId = null; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  const KEY_DIRS = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
  document.addEventListener('keydown', event => {
    if (KEY_DIRS[event.key] && isPlaying() && !game.paused) {
      keys[KEY_DIRS[event.key]] = true; event.preventDefault();
      if (game.hintTimer > 0) game.hintTimer = Math.min(game.hintTimer, 0.4);
    }
    if ((event.key === 'p' || event.key === 'P') && isPlaying()) { event.preventDefault(); game.paused ? resumeGame() : pauseGame(); }
  });
  document.addEventListener('keyup', event => { if (KEY_DIRS[event.key]) keys[KEY_DIRS[event.key]] = false; });
  window.addEventListener('blur', () => { keys.left = keys.right = false; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseGame();
    lastTime = performance.now();
  });

  els.play.addEventListener('click', () => startLevel(progress.unlocked));
  $('open-levels').addEventListener('click', () => { renderLevels(); openPanel(els.levels, els.levelGrid.querySelector('.current') || els.levelGrid.querySelector('button:not(:disabled)')); });
  $('close-levels').addEventListener('click', showStart);
  $('open-shop').addEventListener('click', () => openShop(els.start));
  $('lose-shop').addEventListener('click', () => openShop(els.lose));
  $('close-shop').addEventListener('click', closeShop);
  els.buyStart.addEventListener('click', () => buy('start'));
  els.buyIncome.addEventListener('click', () => buy('income'));
  els.next.addEventListener('click', () => startLevel(def.n + 1));
  $('replay').addEventListener('click', () => startLevel(def.n));
  $('retry').addEventListener('click', () => startLevel(def.n));
  $('win-menu').addEventListener('click', showStart);
  $('lose-menu').addEventListener('click', showStart);
  els.pause.addEventListener('click', pauseGame);
  $('resume').addEventListener('click', resumeGame);
  $('restart').addEventListener('click', () => startLevel(def.n));
  $('pause-menu').addEventListener('click', showStart);

  // ---------- Main loop: fixed 60 Hz simulation, render every frame ----------
  let lastTime = performance.now(), acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    if (!game.paused) {
      acc += dt;
      let steps = 0;
      while (acc >= STEP && steps < 4) { step(STEP); acc -= STEP; steps++; }
      if (steps === 4) acc = 0;
    }
    draw(now / 1000);
  }

  new ResizeObserver(resize).observe($('stage'));
  resize();
  showStart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
