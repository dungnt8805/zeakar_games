<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hill Climber</title>
<style>
:root {
  --bg: #12202c;
  --ink: #1d2b38;
  --muted: #5f7385;
  --paper: #f3f8fc;
  --paper-2: #dbe9f4;
  --red: #e5483b;
  --red-dark: #a92a20;
  --green: #3aa856;
  --green-dark: #23763a;
  --gold: #ffcb2f;
  --gold-dark: #c98f00;
  --hud: #12202ccc;
  --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--paper); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { position: fixed; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.view { position: relative; min-height: 0; overflow: hidden; background: #7cc7ff; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#game:focus-visible { outline: none; }

.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; flex-wrap: wrap; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); pointer-events: none; }
.app.menu .hud { visibility: hidden; }
.chip { display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff22; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.coins { color: var(--gold); }
.chip .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 2px var(--gold-dark); }
.fuel { gap: 7px; }
.fuel .can { width: 14px; height: 16px; border-radius: 3px; background: var(--red); box-shadow: inset 0 0 0 2px #fff4; }
.fuel .bar { width: clamp(56px, 18vw, 120px); height: 12px; border-radius: 6px; background: #ffffff26; overflow: hidden; }
.fuel .bar i { display: block; height: 100%; width: 100%; border-radius: 6px; background: linear-gradient(90deg, #ff5a4a, #ffcb2f 45%, #5cd16e); transform-origin: left; }
.fuel.low .bar { animation: blink .6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.hud .grow { flex: 1; }
.hbtn { pointer-events: auto; width: 40px; height: 34px; border-radius: 10px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff22; display: grid; place-items: center; }
.hbtn svg { width: 15px; height: 15px; fill: #fff; }
.banner { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); max-width: calc(100% - 24px); padding: 6px 16px; border-radius: 12px; background: var(--hud); font-size: clamp(16px, 4.6vmin, 30px); font-weight: 900; text-align: center; color: var(--gold); text-shadow: 0 3px 0 #000; pointer-events: none; opacity: 0; white-space: nowrap; }
.banner.show { animation: banner 1.5s ease-out both; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.9); } 12%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%); } }
.hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 6px 14px; border-radius: 10px; background: var(--hud); font-size: 14px; font-weight: 800; text-align: center; pointer-events: none; }
.hint[hidden] { display: none; }

.pad { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: linear-gradient(#24384a, #12202c); box-shadow: inset 0 3px 0 #33495d; touch-action: none; }
.app.menu .pad { display: none; }
.pedal { width: clamp(90px, 30vw, 150px); height: clamp(60px, 11vh, 86px); border-radius: 16px; display: grid; place-items: center; touch-action: none; color: #fff; font-size: 15px; font-weight: 900; text-shadow: 0 2px 0 #0005; }
.pedal svg { width: 34px; height: 34px; fill: currentColor; pointer-events: none; }
.pedal.brake { background: #4c6276; box-shadow: inset 0 0 0 2px #ffffff30, 0 5px 0 #0a131b; }
.pedal.gas { background: var(--green); box-shadow: inset 0 0 0 2px #ffffff40, 0 5px 0 var(--green-dark); }
.pedal.on { transform: translateY(4px); filter: brightness(1.15); box-shadow: inset 0 0 0 2px #ffffff40, 0 1px 0 #0a131b; }

.overlay { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #0c161f8c; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 400px); max-height: calc(100% - 16px); overflow: auto; overscroll-behavior: contain; padding: 18px 16px 16px; border-radius: 16px; background: var(--paper); color: var(--ink); text-align: center; border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink), 0 22px 50px #0008; animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.logo { font-size: clamp(32px, 10vw, 50px); font-weight: 900; line-height: .95; color: var(--red); text-transform: uppercase; text-shadow: 3px 3px 0 var(--ink); }
.logo span { display: block; color: var(--green); }
.mascot { display: block; width: 130px; height: 72px; margin: 0 auto 6px; }
.tag { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.45; color: var(--muted); }
.bank { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 12px; border-radius: 8px; background: var(--ink); color: var(--gold); font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
.bank::before { content: ""; width: 13px; height: 13px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 2px var(--gold-dark); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { flex: 1 1 120px; min-height: 46px; padding: 8px 12px; border-radius: 12px; background: var(--paper-2); color: var(--ink); font-size: 16px; font-weight: 900; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn.primary { background: var(--red); color: #fff; text-shadow: 0 2px 0 #0004; }
.btn.go { background: var(--green); color: #fff; text-shadow: 0 2px 0 #0004; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; margin-top: 12px; padding: 4px 12px; border-radius: 8px; background: var(--paper-2); color: var(--ink); font-size: 13px; font-weight: 800; }
.toggle b { padding: 1px 8px; border-radius: 6px; background: #b8cadb; font-size: 12px; }
.toggle[aria-pressed="true"] b { background: var(--green); color: #fff; }
.panel h2 { font-size: 25px; font-weight: 900; line-height: 1.15; }
.panel .sub { margin-top: 4px; font-size: 14px; font-weight: 800; color: var(--muted); }
.stages { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.stage { position: relative; min-width: 0; min-height: 104px; padding: 8px 6px; border-radius: 12px; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); display: grid; align-content: end; justify-items: center; gap: 2px; color: #fff; text-shadow: 0 2px 0 #0007; overflow: hidden; }
.stage b { font-size: 16px; font-weight: 900; line-height: 1.1; }
.stage small { font-size: 12px; font-weight: 800; opacity: .95; line-height: 1.2; }
.stage .rec { font-size: 12px; font-weight: 900; color: var(--gold); }
.stage.locked { filter: saturate(.5) brightness(.72); }
.stage b, .stage small { text-shadow: 0 1px 0 #000, 0 0 5px #000c; }
.stage .lock { padding: 2px 8px; border-radius: 7px; background: #0008; color: var(--gold); font-size: 13px; font-weight: 900; }
.stage:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.s0 { background: linear-gradient(#7cc7ff 0 45%, #4caf50 45% 60%, #7a4f2e 60%); }
.s1 { background: linear-gradient(#ffc36b 0 45%, #e9b45a 45% 60%, #b9783a 60%); }
.s2 { background: linear-gradient(#6faee6 0 45%, #dcefff 45% 60%, #5e86aa 60%); }
.s3 { background: linear-gradient(#141a33 0 45%, #b7b7c2 45% 60%, #6b6b78 60%); }
.ups { display: grid; gap: 8px; margin-top: 12px; text-align: left; }
.up { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; background: var(--paper-2); }
.up .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--ink); }
.up .ic svg { width: 26px; height: 26px; }
.up b { display: block; font-size: 15px; font-weight: 900; line-height: 1.15; }
.up small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.25; }
.pips { display: flex; gap: 3px; margin-top: 4px; }
.pips i { flex: 1; height: 7px; border-radius: 3px; background: #b8cadb; }
.pips i.on { background: var(--green); }
.buy { min-width: 76px; min-height: 42px; padding: 4px 8px; border-radius: 10px; border: 3px solid var(--ink); background: var(--gold); box-shadow: 0 3px 0 var(--ink); font-size: 14px; font-weight: 900; color: var(--ink); white-space: nowrap; }
.buy:disabled { background: #cfdbe6; color: #6c8092; box-shadow: 0 1px 0 var(--ink); cursor: default; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.stats div { min-width: 0; padding: 6px 2px; border-radius: 8px; background: var(--paper-2); }
.stats small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats strong { display: block; font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge { display: inline-block; margin-top: 10px; padding: 3px 12px; border-radius: 8px; background: var(--gold); font-size: 13px; font-weight: 900; }
.badge[hidden] { display: none; }
.goal { margin-top: 8px; font-size: 13px; font-weight: 800; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (min-aspect-ratio: 1/1) {
  .app { grid-template-rows: minmax(0, 1fr); }
  .pad { position: absolute; left: 0; right: 0; bottom: 0; background: none; box-shadow: none; pointer-events: none; padding-top: 0; }
  .pedal { pointer-events: auto; width: clamp(80px, 16vh, 130px); height: clamp(52px, 14vh, 90px); }
  .pedal.brake { background: #2a3b4ab0; }
  .pedal.gas { background: #3aa856c0; }
  .stages { grid-template-columns: repeat(4, 1fr); }
  .stages-panel { width: min(100%, 640px); }
  .garage-panel { width: min(100%, 680px); }
  .ups { grid-template-columns: 1fr 1fr; }
  .hint { bottom: auto; top: 50px; }
}
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .panel { padding: 10px 14px; }
  .logo { font-size: 32px; }
  .mascot { width: 84px; height: 46px; margin-bottom: 2px; }
  .tag { margin-top: 6px; font-size: 13px; }
  .actions { margin-top: 10px; }
  .btn { min-height: 40px; padding: 5px 10px; }
  .help { margin-top: 6px; }
  .panel h2 { font-size: 20px; }
  .stage { min-height: 84px; }
  .up { padding: 5px 8px; }
  .stats { margin-top: 8px; }
}
@media (max-height: 360px) { .mascot, .tag, .help { display: none; } }
@media (max-width: 340px) { .chip { padding: 0 7px; font-size: 14px; } .hbtn { width: 36px; } .up { grid-template-columns: 32px minmax(0, 1fr) auto; } .up .ic { width: 32px; height: 32px; } .buy { min-width: 64px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app menu" id="app">
  <div class="view" id="view">
    <canvas id="game" tabindex="0" role="img" data-i18n-aria="canvas"></canvas>
    <div class="hud">
      <div class="chip" id="hudDist">0 m</div>
      <div class="chip coins"><span class="dot"></span><span id="hudCoins">0</span></div>
      <div class="chip fuel" id="hudFuel"><span class="can"></span><span class="bar"><i id="fuelBar"></i></span></div>
      <div class="grow"></div>
      <button class="hbtn" id="btnRestart" data-i18n-aria="restart"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.4 5h3.1A5 5 0 1 0 12 7v3L7 5.5 12 1z"/></svg></button>
      <button class="hbtn" id="btnPause" data-i18n-aria="pause"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="hint" id="hint" hidden data-i18n="hint"></div>

    <div class="overlay" id="ovTitle">
      <div class="panel">
        <svg class="mascot" viewBox="0 0 130 72" aria-hidden="true">
          <path d="M0 70 Q40 50 70 60 T130 52 V72 H0Z" fill="#3aa856"/>
          <path d="M22 44 L30 30 H64 L74 18 H92 L100 34 L112 38 L110 50 H20 Z" fill="#e5483b" stroke="#1d2b38" stroke-width="3" stroke-linejoin="round"/>
          <path d="M77 22 H90 L95 33 H72 Z" fill="#bfe6ff" stroke="#1d2b38" stroke-width="2"/>
          <circle cx="58" cy="20" r="9" fill="#ffcb2f" stroke="#1d2b38" stroke-width="3"/>
          <circle cx="36" cy="52" r="13" fill="#1d2b38"/><circle cx="36" cy="52" r="6" fill="#dbe9f4"/>
          <circle cx="96" cy="52" r="13" fill="#1d2b38"/><circle cx="96" cy="52" r="6" fill="#dbe9f4"/>
        </svg>
        <div class="logo">Hill<span>Climber</span></div>
        <p class="tag" data-i18n="tagline"></p>
        <div class="bank" id="titleBank">0</div>
        <div class="actions">
          <button class="btn primary" id="btnPlay" data-i18n="play"></button>
          <button class="btn" id="btnGarage" data-i18n="garage"></button>
        </div>
        <button class="toggle" id="btnSound" aria-pressed="true"><span data-i18n="sound"></span><b id="soundState"></b></button>
        <p class="help" data-i18n="help"></p>
      </div>
    </div>

    <div class="overlay" id="ovStages" hidden>
      <div class="panel stages-panel">
        <h2 data-i18n="chooseStage"></h2>
        <div class="bank" id="stagesBank">0</div>
        <div class="stages" id="stageList"></div>
        <div class="actions">
          <button class="btn" id="btnStagesGarage" data-i18n="garage"></button>
          <button class="btn" id="btnStagesBack" data-i18n="back"></button>
        </div>
      </div>
    </div>

    <div class="overlay" id="ovGarage" hidden>
      <div class="panel garage-panel">
        <h2 data-i18n="garage"></h2>
        <div class="bank" id="garageBank">0</div>
        <div class="ups" id="upList"></div>
        <div class="actions">
          <button class="btn go" id="btnGarageDrive" data-i18n="drive"></button>
          <button class="btn" id="btnGarageBack" data-i18n="back"></button>
        </div>
      </div>
    </div>

    <div class="overlay" id="ovPause" hidden>
      <div class="panel">
        <h2 data-i18n="paused"></h2>
        <p class="goal" id="pauseInfo"></p>
        <div class="actions">
          <button class="btn primary" id="btnResume" data-i18n="resume"></button>
          <button class="btn" id="btnPauseRestart" data-i18n="restart"></button>
          <button class="btn" id="btnPauseEnd" data-i18n="endRun"></button>
        </div>
        <button class="toggle" id="btnSound2" aria-pressed="true"><span data-i18n="sound"></span><b id="soundState2"></b></button>
      </div>
    </div>

    <div class="overlay" id="ovOver" hidden>
      <div class="panel">
        <h2 id="overTitle"></h2>
        <p class="sub" id="overWhy"></p>
        <span class="badge" id="overRecord" hidden data-i18n="newRecord"></span>
        <div class="stats">
          <div><small data-i18n="distance"></small><strong id="ovDist"></strong></div>
          <div><small data-i18n="coins"></small><strong id="ovCoins"></strong></div>
          <div><small data-i18n="flips"></small><strong id="ovFlips"></strong></div>
        </div>
        <p class="goal" id="ovBest"></p>
        <div class="bank" id="overBank">0</div>
        <div class="actions">
          <button class="btn primary" id="btnRetry" data-i18n="retry"></button>
          <button class="btn" id="btnOverGarage" data-i18n="garage"></button>
          <button class="btn" id="btnOverStages" data-i18n="stages"></button>
        </div>
      </div>
    </div>
  </div>
  <div class="pad" id="pad">
    <button class="pedal brake" data-k="brake" data-i18n-aria="brake"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8V4z"/></svg></button>
    <button class="pedal gas" data-k="gas" data-i18n-aria="gas"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8V4z"/></svg></button>
  </div>
  <div class="sr-only" aria-live="polite" id="announcer"></div>
</div>
<script>
(() => {
  'use strict';
  const I18N = {

      ctx.beginPath(); ctx.arc(vw * 0.82, vh * 0.18, Math.min(vw, vh) * 0.06, 0, 7); ctx.fill();
    }
    for (const [col, par, amp, base, f] of [[st.far, 0.12, 0.08, 0.5, 0.006], [st.near, 0.28, 0.07, 0.62, 0.011]]) {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, vh);
      for (let x = 0; x <= vw + 10; x += 10) {
        const wx = (x + sx * par) / Math.max(zoom, 0.5);
        ctx.lineTo(x, vh * base - vh * amp * (Math.sin(wx * f) + 0.5 * Math.sin(wx * f * 2.3 + 1)));
      }
      ctx.lineTo(vw, vh); ctx.fill();
    }
  }
  function drawWorld(s) {
    const st = s.st, H = s.H;
    const ox = vw / 2 - cam.x * zoom, oy = vh * 0.56 - cam.y * zoom;
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * ox, dpr * oy);
    const x0 = Math.floor((-ox / zoom) / 8) * 8 - 16, x1 = x0 + vw / zoom + 48;
    const bottom = (vh - oy) / zoom + 20;
    // ground body
    ctx.beginPath(); ctx.moveTo(x0, bottom);
    for (let x = x0; x <= x1; x += 8) ctx.lineTo(x, H(x));
    ctx.lineTo(x1, bottom); ctx.closePath();
    ctx.fillStyle = st.soil; ctx.fill();
    // soil stripes
    ctx.save(); ctx.clip();
    ctx.fillStyle = st.soil2;
    for (let x = Math.floor(x0 / 90) * 90; x < x1; x += 90) { const y = H(x); ctx.beginPath(); ctx.arc(x + 30, y + 46 + (x % 7) * 4, 9, 0, 7); ctx.arc(x + 70, y + 92, 6, 0, 7); ctx.fill(); }
    ctx.restore();
    // surface band
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 8) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, H(x) + 7);
    ctx.strokeStyle = st.top2; ctx.lineWidth = 14; ctx.stroke();
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 8) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, H(x) + 3);
    ctx.strokeStyle = st.top; ctx.lineWidth = 7; ctx.stroke();
    // distance signs every 100 m and the stage record flag
    const m0 = Math.ceil((x0 - START_X) / (PX * 100)), m1 = Math.floor((x1 - START_X) / (PX * 100));
    ctx.font = '900 13px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let m = Math.max(1, m0); m <= m1; m++) {
      const x = START_X + m * 100 * PX, y = H(x);
      ctx.fillStyle = '#4a3423'; ctx.fillRect(x - 2, y - 46, 4, 46);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1d2b38'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(x - 26, y - 66, 52, 22, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1d2b38'; ctx.fillText(`${m * 100}m`, x, y - 55);
    }
    const bx = START_X + best[s.stage] * PX;
    if (best[s.stage] > 0 && bx > x0 && bx < x1) {
      const y = H(bx);
      ctx.fillStyle = '#1d2b38'; ctx.fillRect(bx - 2, y - 80, 4, 80);
      ctx.fillStyle = '#ffcb2f'; ctx.beginPath(); ctx.moveTo(bx + 2, y - 80); ctx.lineTo(bx + 34, y - 70); ctx.lineTo(bx + 2, y - 60); ctx.fill();
      ctx.fillStyle = '#1d2b38'; ctx.fillText('★', bx + 13, y - 70);
    }
    // items
    const bob = reduced ? 0 : Math.sin(s.t * 4) * 3;
    for (const it of s.items) {
      if (it.got || it.x < x0 - 20 || it.x > x1 + 20) continue;
      const y = H(it.x);
      if (it.k === 'coin') {
        const cy = y - 40 + bob, r = it.v >= 25 ? 11 : 9;
        ctx.fillStyle = it.v >= 50 ? '#ff8f2f' : it.v >= 25 ? '#ffd84a' : '#ffcb2f';
        ctx.strokeStyle = '#a06c00'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(it.x, cy, r, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#a06c00'; ctx.font = `900 ${r}px sans-serif`; ctx.fillText(String(it.v), it.x, cy + 0.5);
      } else {
        const cy = y - 30 + bob;
        ctx.fillStyle = '#e5483b'; ctx.strokeStyle = '#1d2b38'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.roundRect(it.x - 12, cy - 14, 24, 30, 4); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#1d2b38'; ctx.fillRect(it.x - 4, cy - 20, 8, 6);
        ctx.fillStyle = '#fff'; ctx.fillRect(it.x - 7, cy - 4, 14, 8);
        ctx.fillStyle = '#e5483b'; ctx.font = '900 8px sans-serif'; ctx.fillText('F', it.x, cy);
      }
    }
    drawCar(s);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  function drawCar(s) {
    const c = s.car;
    // suspension struts
    ctx.strokeStyle = '#1d2b38'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (const wh of c.wh) { const [ax, ay] = worldPt(c, wh.lx, ANCH_Y - 4); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(wh.x, wh.y); ctx.stroke(); }
    // body
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.a);
    ctx.fillStyle = '#e5483b'; ctx.strokeStyle = '#1d2b38'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-48, 12); ctx.lineTo(-48, -6); ctx.lineTo(-24, -8); ctx.lineTo(-16, -10); ctx.lineTo(10, -10); ctx.lineTo(18, -24); ctx.lineTo(30, -24); ctx.lineTo(38, -8); ctx.lineTo(48, -5); ctx.lineTo(48, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#bfe6ff'; ctx.beginPath(); ctx.moveTo(20, -21); ctx.lineTo(29, -21); ctx.lineTo(34, -10); ctx.lineTo(15, -10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a92a20'; ctx.fillRect(-44, 2, 88, 4);
    ctx.fillStyle = '#ffcb2f'; ctx.fillRect(43, -3, 5, 5);
    // driver
    ctx.fillStyle = '#2f6db5'; ctx.beginPath(); ctx.roundRect(-14, -26, 14, 18, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd7b0'; ctx.beginPath(); ctx.arc(HEAD[0], HEAD[1], HEAD_R, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffcb2f'; ctx.beginPath(); ctx.arc(HEAD[0], HEAD[1] - 1, HEAD_R, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1d2b38'; ctx.beginPath(); ctx.arc(HEAD[0] + 4, HEAD[1] + 1, 1.6, 0, 7); ctx.fill();
    ctx.restore();
    // wheels
    for (const wh of c.wh) {
      ctx.save(); ctx.translate(wh.x, wh.y); ctx.rotate(wh.ang);
      ctx.fillStyle = '#1d2b38'; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
      ctx.fillStyle = '#9fb3c4'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = '#1d2b38'; ctx.lineWidth = 2.5;
      for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; ctx.beginPath(); ctx.moveTo(-8 * Math.cos(a), -8 * Math.sin(a)); ctx.lineTo(8 * Math.cos(a), 8 * Math.sin(a)); ctx.stroke(); }
      ctx.restore();
    }
  }
  let menuT = 0;
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const st = sim ? sim.st : STAGES[0];
    drawBackground(st, menuT);
    if (sim) drawWorld(sim);
    else {
      // menu backdrop: rolling ground strip
      ctx.fillStyle = st.top2; ctx.beginPath(); ctx.moveTo(0, vh);
      for (let x = 0; x <= vw + 10; x += 10) ctx.lineTo(x, vh * 0.78 - 18 * Math.sin((x + menuT * 80) * 0.01));
      ctx.lineTo(vw, vh); ctx.fill();
    }
  }
  function updateHud() {
    if (!sim) return;
    $('hudDist').textContent = `${fmt(sim.dist)} m`;
    $('hudCoins').textContent = fmt(sim.coins);
    $('fuelBar').style.transform = `scaleX(${sim.fuel.toFixed(3)})`;
    $('hudFuel').classList.toggle('low', sim.fuel < 0.2);
  }
  function handleEvents() {
    for (const ev of sim.events) {
      if (ev.k === 'coin') blip(1250, 0.07, 'square', 0.04);
      else if (ev.k === 'fuel') { blip(440, 0.1, 'triangle', 0.1, 300); banner(T.fuelUp); }
      else if (ev.k === 'flip') { blip(700, 0.12); blip(1050, 0.2); banner(T.flip(ev.n)); say(T.flip(ev.n)); }
      else if (ev.k === 'air') { blip(880, 0.12); banner(T.air); }
      else if (ev.k === 'low') { blip(300, 0.15, 'square', 0.05); banner(T.lowFuel); say(T.lowFuel); }
      else if (ev.k === 'crash') { blip(200, 0.4, 'sawtooth', 0.12, -150); }
    }
    sim.events.length = 0;
  }
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    menuT += dt;
    if (mode === 'play' && sim) {
      acc += dt;
      const inp = autoplay ? autoplay(sim) : input;
      while (acc >= DT) { stepSim(sim, inp); acc -= DT; }
      handleEvents();
      if (sim.over) { overT += dt; if (overT > 0.9) endRun(sim.over); }
      const rev = Math.min(1, Math.abs(sim.car.wh[0].spin) / sim.P.wmax);
      engineSound(sim.fuel > 0 && !sim.over, inp.gas ? 0.4 + rev * 0.6 : rev * 0.5);
      updateCamera(dt); updateHud();
    } else acc = 0;
    render();
    requestAnimationFrame(frame);
  }

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__hillClimber = {
    state: () => ({ mode, stage: stageIdx, bank, ups: { ...ups }, unlocked: [...unlocked], best: [...best], overlay: overlays.find(o => !o.hidden)?.id || null, sim: sim && { t: sim.t, x: sim.car.x, y: sim.car.y, a: sim.car.a, vx: sim.car.vx, dist: sim.dist, coins: sim.coins, flips: sim.flips, fuel: sim.fuel, over: sim.over } }),
    sim: { create: i => createSim(i), step: (s, inp) => stepSim(s, inp), DT },
    autoplay: fn => { autoplay = fn; },
    start: i => startRun(i),
    setBank: n => { bank = n; save('coins', bank); setBanks(); },
    openGarage: () => openGarage('title'), openStages: () => openStages(),
  };

  openTitle();
  new ResizeObserver(resize).observe(view);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
