<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic-Tac-Toe</title>
<style>
:root {
  --paper: #fbf8f1;
  --sheet: #fffdf8;
  --ink: #2d3142;
  --muted: #727788;
  --rule: #d6e0f0;
  --grid: #b9c6dd;
  --x: #f2644f;
  --x-dark: #c9462f;
  --o: #2f7de1;
  --o-dark: #1f5fb3;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(90deg, transparent 38px, #f4b6ae 38px, #f4b6ae 40px, transparent 40px), repeating-linear-gradient(transparent 0 27px, var(--rule) 27px 28px);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; font-size: clamp(26px, 8vw, 34px); font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
h1 .tx { color: var(--x); }
h1 .to { color: var(--o); }
.icon { width: 42px; height: 42px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 14px; background: var(--sheet); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
.icon svg { width: 22px; height: 22px; fill: var(--ink); }
.icon:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.summary { font-size: 13px; color: var(--muted); line-height: 1.3; margin-top: -4px; }
.score { display: flex; gap: 8px; }
.chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 14px; background: var(--sheet); border: 2px solid #2d314222; }
.chip.turn-x { border-color: var(--x); box-shadow: 0 0 0 3px #f2644f26; }
.chip.turn-o { border-color: var(--o); box-shadow: 0 0 0 3px #2f7de126; }
.chip b { font-size: 24px; font-weight: 900; line-height: 1; }
.chip .sx { color: var(--x); }
.chip .so { color: var(--o); }
.chip.draws { flex: 0 0 auto; justify-content: center; }
.chip span { min-width: 0; flex: 1; }
.chip small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip strong { display: block; font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.status { text-align: center; font-size: 16px; font-weight: 800; min-height: 22px; }
.status .sx { color: var(--x); }
.status .so { color: var(--o); }

.board-wrap { flex: 1; min-height: 0; width: 100%; align-self: center; display: grid; place-items: center; container-type: size; }
.app.caro .board-wrap { width: min(calc(100vw - 28px), 720px); }
.board { --size: min(100cqw, 100cqh); --cell: calc(var(--size) / var(--n)); position: relative; width: var(--size); height: var(--size); display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: var(--line); background: var(--grid); }
.board.classic { --line: 4px; background: var(--ink); border-radius: 4px; }
.board.big { --line: 1px; padding: 2px; border-radius: 10px; box-shadow: 0 10px 24px #2d314222; background: var(--grid); outline: 2px solid var(--ink); outline-offset: -1px; }
.cell { position: relative; display: block; background: var(--paper); touch-action: manipulation; }
.board.big .cell { background: var(--sheet); }
.cell:focus-visible { outline: 3px solid #f6c445; outline-offset: -3px; z-index: 2; }
.board.big .cell:not(.x):not(.o):hover { background: #f1f4fb; }
.cell i { position: absolute; inset: 20%; pointer-events: none; }
.board.big .cell i { inset: 16%; }
.cell.x i::before, .cell.x i::after { content: ""; position: absolute; left: -8%; top: 50%; width: 116%; height: max(3px, calc(var(--cell) * .13)); margin-top: calc(max(3px, calc(var(--cell) * .13)) / -2); border-radius: 99px; background: var(--x); transform: rotate(45deg); }
.cell.x i::after { transform: rotate(-45deg); }
.cell.o i::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: max(3px, calc(var(--cell) * .12)) solid var(--o); }
.cell.x i, .cell.o i { animation: draw .2s ease-out; }
@keyframes draw { from { transform: scale(.3); opacity: 0; } }
.cell.last { background: #fff3c4 !important; }
.cell.win { background: #ffe58a !important; }
.cell.win i { animation: cheer .6s ease-in-out 2; }
@keyframes cheer { 50% { transform: scale(1.18); } }
.strike { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.strike line { stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: strike .45s .1s ease-out forwards; opacity: .85; }
@keyframes strike { to { stroke-dashoffset: 0; } }
.board.thinking .cell { cursor: progress; }

.controls { display: flex; gap: 8px; }
.btn { flex: 1; padding: 11px 10px; border-radius: 14px; background: var(--sheet); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .4; cursor: default; transform: none; box-shadow: 0 3px 0 var(--ink); }
.btn.primary { background: var(--o); color: #fff; }
.hint { text-align: center; font-size: 12px; color: var(--muted); }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 14px; background: #2d314266; }
.overlay[hidden], .panel[hidden] { display: none; }
.overlay.sheet { place-items: end center; background: #2d314233; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
.overlay.sheet .panel { padding: 14px 18px 18px; }
.overlay.sheet .emoji { font-size: 34px; }
.panel { width: min(100%, 380px); max-height: 100%; overflow-y: auto; background: var(--sheet); border: 3px solid var(--ink); border-radius: 24px; padding: 20px 18px; text-align: center; box-shadow: 0 8px 0 var(--ink), 0 24px 50px #0004; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 26px; font-weight: 900; }
.panel .emoji { font-size: 44px; line-height: 1.15; }
.field { margin-top: 12px; text-align: start; }
.field > p { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #2d31420f; }
.seg button { flex: 1; min-width: 0; padding: 9px 6px; border-radius: 10px; font-size: 14px; font-weight: 800; line-height: 1.2; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.seg .mx { color: var(--x); font-size: 18px; font-weight: 900; }
.seg .mo { color: var(--o); font-size: 18px; font-weight: 900; }
.seg button[aria-pressed="true"] .mx { color: #ffb3a8; }
.seg button[aria-pressed="true"] .mo { color: #a9cbff; }
.field[hidden] { display: none; }
.record { margin-top: 14px; font-size: 13px; color: var(--muted); }
.result { margin-top: 6px; font-size: 16px; color: var(--muted); }
.badge { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 99px; background: #f6c445; color: var(--ink); font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.actions { margin-top: 18px; display: flex; gap: 10px; }
.cta { flex: 1; padding: 14px 12px; border-radius: 16px; background: var(--x); color: #fff; font-size: 17px; font-weight: 800; border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.cta.ghost { background: var(--sheet); color: var(--ink); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 620px) { .hint, .summary { display: none; } .app { gap: 8px; } }
@media (max-width: 400px), (max-height: 480px) {
  .score { gap: 6px; }
  .chip { padding: 6px 7px; gap: 5px; }
  .chip b { font-size: 20px; }
  .chip small { letter-spacing: 0; }
}
@media (max-height: 560px) {
  .overlay { padding: 8px; }
  .panel { max-height: calc(100% - 8px); padding: 12px 14px; border-radius: 20px; box-shadow: 0 5px 0 var(--ink), 0 18px 40px #0004; }
  .panel h2 { font-size: 21px; }
  .panel .emoji { font-size: 34px; }
  .field { margin-top: 7px; }
  .field > p { font-size: 11px; margin-bottom: 3px; }
  .seg { padding: 3px; }
  .seg button { padding: 6px; min-height: 32px; }
  .record { margin-top: 8px; font-size: 12px; }
  .actions { margin-top: 10px; }
  .cta { padding: 10px 12px; font-size: 16px; }
}
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .app { max-width: 920px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 300px); grid-template-rows: auto auto auto 1fr auto; grid-template-areas: "board top" "board score" "board status" "board ." "board controls"; column-gap: 18px; row-gap: 8px; }
  .top { grid-area: top; }
  .score { grid-area: score; }
  .status { grid-area: status; }
  .board-wrap, .app.caro .board-wrap { grid-area: board; width: 100%; height: 100%; }
  .controls { grid-area: controls; }
  #setup[hidden] { display: none; }
  #setup { width: min(100%, 620px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; align-items: end; }
  #setup h2, #setup .record { grid-column: 1 / -1; }
  #setup .record { order: 9; margin-top: 6px; }
  #setup .actions { margin-top: 0; }
  .field { margin-top: 5px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .strike line { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main class="app" id="app">
  <div class="top">
    <h1><span class="tx">Tic</span>-Tac-<span class="to">Toe</span></h1>
    <button type="button" class="icon" id="settings-btn" data-i18n-label="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11.2a3 3 0 0 1 5.6 0H21v2h-1.2a3 3 0 0 1-5.6 0H3V6zm14 2a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM3 16h1.2a3 3 0 0 1 5.6 0H21v2H9.8a3 3 0 0 1-5.6 0H3v-2zm4 2a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg></button>
  </div>
  <p class="summary" id="summary"></p>
  <div class="score">
    <div class="chip" id="chip-x"><b class="sx" aria-hidden="true">✕</b><span><small id="name-x"></small><strong id="score-x">0</strong></span></div>
    <div class="chip draws"><span><small data-i18n="draws"></small><strong id="score-d">0</strong></span></div>
    <div class="chip" id="chip-o"><b class="so" aria-hidden="true">◯</b><span><small id="name-o"></small><strong id="score-o">0</strong></span></div>
  </div>
  <p class="status" id="status"></p>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board" role="grid" aria-describedby="hint"></div>
  </div>
  <div class="controls">
    <button type="button" class="btn" id="undo" data-i18n="undo"></button>
    <button type="button" class="btn primary" id="restart" data-i18n="newGame"></button>
  </div>
  <p class="hint" id="hint" data-i18n="hint"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="overlay">
  <div class="panel" id="setup" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <h2 id="setup-title" data-i18n="settings"></h2>
    <div class="field"><p id="l-mode" data-i18n="mode"></p><div class="seg" role="group" aria-labelledby="l-mode" data-key="mode">
      <button type="button" data-value="classic" data-i18n="classic"></button>
      <button type="button" data-value="caro" data-i18n="caro"></button>
    </div></div>
    <div class="field"><p id="l-opp" data-i18n="opponent"></p><div class="seg" role="group" aria-labelledby="l-opp" data-key="opponent">
      <button type="button" data-value="cpu" data-i18n="vsCpu"></button>
      <button type="button" data-value="human" data-i18n="twoP"></button>
    </div></div>
    <div class="field" id="f-level"><p id="l-level" data-i18n="level"></p><div class="seg" role="group" aria-labelledby="l-level" data-key="level">
      <button type="button" data-value="easy" data-i18n="easy"></button>
      <button type="button" data-value="medium" id="level-medium"></button>
      <button type="button" data-value="hard" data-i18n="hard"></button>
    </div></div>
    <div class="field" id="f-side"><p id="l-side" data-i18n="youPlay"></p><div class="seg" role="group" aria-labelledby="l-side" data-key="human">
      <button type="button" data-value="x"><span class="mx" aria-hidden="true">✕</span> <span class="sr-only">X</span></button>
      <button type="button" data-value="o"><span class="mo" aria-hidden="true">◯</span> <span class="sr-only">O</span></button>
    </div></div>
    <div class="field"><p id="l-first" data-i18n="first"></p><div class="seg" role="group" aria-labelledby="l-first" data-key="first">
      <button type="button" data-value="x"><span class="mx" aria-hidden="true">✕</span> <span class="sr-only">X</span></button>
      <button type="button" data-value="o"><span class="mo" aria-hidden="true">◯</span> <span class="sr-only">O</span></button>
    </div></div>
    <p class="record" id="record"></p>
    <div class="actions"><button type="button" class="cta" id="play" data-i18n="play"></button></div>
  </div>
  <div class="panel" id="result-panel" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
    <p class="emoji" id="result-emoji" aria-hidden="true"></p>
    <h2 id="result-title"></h2>
    <p class="result" id="result-text"></p>
    <p class="badge" id="hard-badge" hidden></p>
    <div class="actions">
      <button type="button" class="cta ghost" id="result-settings" data-i18n="change"></button>
      <button type="button" class="cta" id="again" data-i18n="again"></button>
    </div>
  </div>
</div>

      for (const j of candidates(b, n)) reply = Math.max(reply, cellValue(b, n, j, opp));
      b[cand.i] = null;
      const value = cand.score - reply * 0.6;
      if (value > bestValue) { bestValue = value; best = cand; }
    }
    return best.i;
  }

  function chooseMove() {
    const me = game.turn;
    const b = [...game.cells];
    return game.n === 3 ? classicMove(b, me) : caroMove(b, game.n, me);
  }

  // ---------- Panels ----------
  function showPanel(panel, focus) {
    els.setup.hidden = panel !== els.setup;
    els.result.hidden = panel !== els.result;
    els.overlay.classList.toggle('sheet', panel === els.result);
    els.overlay.hidden = false;
    focus.focus({ preventScroll: true });
  }
  function hidePanels() { els.overlay.hidden = true; }

  function openSetup() {
    clearTimeout(resultTimer);
    draft = { ...settings };
    paintSetup();
    showPanel(els.setup, $('play'));
  }

  function paintSetup() {
    for (const group of document.querySelectorAll('[data-key]')) {
      for (const btn of group.querySelectorAll('button')) btn.setAttribute('aria-pressed', String(draft[group.dataset.key] === btn.dataset.value));
    }
    $('f-level').hidden = draft.opponent !== 'cpu';
    $('f-side').hidden = draft.opponent !== 'cpu';
    $('level-medium').textContent = levelName(draft.mode, 'medium');
    const wins = { classic: 0, caro: 0, ...read('hardWins', {}) };
    els.record.textContent = t.hardWins(wins.classic, wins.caro);
  }

  for (const group of document.querySelectorAll('[data-key]')) {
    group.addEventListener('click', event => {
      const btn = event.target.closest('button');
      if (!btn) return;
      draft[group.dataset.key] = btn.dataset.value;
      paintSetup();
    });
  }

  $('play').addEventListener('click', () => {
    const changed = ['mode', 'opponent', 'level', 'human'].some(k => draft[k] !== settings[k]);
    Object.assign(settings, draft);
    write('settings', settings);
    if (changed) { tally.x = 0; tally.o = 0; tally.draw = 0; }
    els.app.classList.toggle('caro', settings.mode === 'caro');
    hidePanels();
    newGame();
  });
  $('again').addEventListener('click', () => { hidePanels(); newGame(); });
  $('result-settings').addEventListener('click', openSetup);
  $('settings-btn').addEventListener('click', openSetup);
  $('restart').addEventListener('click', newGame);
  els.undo.addEventListener('click', undo);
  els.overlay.addEventListener('click', event => {
    if (event.target === els.overlay && game && !els.result.hidden) hidePanels();
  });

  // Arrow keys move a cursor over the grid; Enter/Space activate the focused cell button.
  const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  document.addEventListener('keydown', event => {
    const step = ARROWS[event.key];
    if (!step || !game || !els.overlay.hidden || event.altKey || event.ctrlKey || event.metaKey) return;
    const inBoard = els.board.contains(document.activeElement);
    event.preventDefault();
    const n = game.n;
    if (inBoard) {
      const r = Math.min(n - 1, Math.max(0, Math.floor(game.cursor / n) + step[0]));
      const c = Math.min(n - 1, Math.max(0, (game.cursor % n) + step[1]));
      game.cursor = r * n + c;
    }
    syncTabStop();
    cells[game.cursor].focus({ preventScroll: true });
  });

  els.app.classList.toggle('caro', settings.mode === 'caro');
  newGame();
  openSetup();
})();
</script>
</body>
</html>
