<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backgammon</title>
<style>
:root {
  --bg: #13100c;
  --bg2: #2a2017;
  --ink: #fff6ea;
  --muted: #d8c4a6;
  --frame: #6b3f1d;
  --frame-hi: #8d5629;
  --felt: #1f5c45;
  --felt-dk: #174634;
  --tri-a: #e8cf9f;
  --tri-b: #a8382c;
  --gold: #ffcf5a;
  --c0: #f4ead7;
  --c0-dk: #c9b896;
  --c1: #2b2522;
  --c1-dk: #0c0a09;
  --paper: #2e2218;
  --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg) 70%); background-color: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { position: relative; height: 100%; display: flex; flex-direction: column; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.hud { display: flex; align-items: center; gap: 6px; }
.hud .grow { flex: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; background: #00000044; border: 1px solid #ffffff22; font-size: 16px; font-weight: 900; display: grid; place-items: center; flex: none; }
.chip { padding: 4px 10px; border-radius: 12px; background: #00000044; border: 1px solid #ffffff22; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.score { color: var(--gold); }
.app.menu .hud, .app.menu .stage { visibility: hidden; }

.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.wrap { flex: 1; min-height: 0; min-width: 0; display: grid; place-items: center; overflow: hidden; }
.stage > * { min-width: 0; }
.side { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.players { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 7px; font-weight: 900; font-size: 14px; padding: 5px 12px; border-radius: 99px; background: #00000033; border: 2px solid transparent; transition: border-color .2s, background .2s; white-space: nowrap; }
.who .dot { width: 14px; height: 14px; border-radius: 50%; }
.who.p0 .dot { background: var(--c0); box-shadow: inset 0 -2px 0 var(--c0-dk); }
.who.p1 .dot { background: var(--c1); box-shadow: inset 0 -2px 0 #000, 0 0 0 1px #ffffff55; }
.who small { font-weight: 700; color: var(--muted); font-size: 12px; }
.who.on { border-color: var(--gold); background: #ffcf5a22; }
.ctrl { display: flex; gap: 8px; align-items: center; justify-content: center; }
.ctrl .btn { flex: none; min-width: 96px; padding: 9px 14px; }
.status { min-height: 20px; font-size: 14px; font-weight: 800; color: var(--gold); text-align: center; }

.board { position: relative; border-radius: 10px; box-shadow: 0 16px 40px #000a; cursor: default; touch-action: manipulation; }
.board svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 10px; }
.board.pick { cursor: pointer; }
.chk { position: absolute; border-radius: 50%; transition: left .32s cubic-bezier(.3,.7,.3,1), top .32s cubic-bezier(.3,.7,.3,1), height .2s, border-radius .2s; pointer-events: none; z-index: 2; }
.chk.p0 { background: radial-gradient(circle at 50% 42%, #fffaf0 0 34%, var(--c0) 36% 60%, var(--c0-dk) 62%); box-shadow: 0 2px 3px #0008, inset 0 -2px 0 #0002; }
.chk.p1 { background: radial-gradient(circle at 50% 42%, #4a403a 0 34%, var(--c1) 36% 60%, var(--c1-dk) 62%); box-shadow: 0 2px 3px #000a, inset 0 0 0 1px #ffffff30; }
.chk.off { border-radius: 4px; }
.board.noanim .chk { transition: none; }
.chk.moving { z-index: 6; }
.hl { position: absolute; border-radius: 50%; pointer-events: none; z-index: 4; }
.hl.src { box-shadow: 0 0 0 2px var(--gold); }
.hl.sel { box-shadow: 0 0 0 3px #fff, 0 0 14px 3px var(--gold); }
.hl.tgt { background: #ffcf5a55; box-shadow: 0 0 0 2px var(--gold), 0 0 12px var(--gold); animation: pulse 1s ease-in-out infinite alternate; }
.hl.tray { border-radius: 6px; }
.hl.cur { box-shadow: 0 0 0 3px #5fd3ff, 0 0 12px #5fd3ff; z-index: 5; }
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
.cnt { position: absolute; z-index: 3; transform: translate(-50%, -50%); font-weight: 900; pointer-events: none; }
.cnt.p0 { color: #5a3f20; } .cnt.p1 { color: #f4ead7; }

.dice { position: absolute; z-index: 5; display: flex; gap: 6px; align-items: center; justify-content: center; transform: translate(-50%, -50%); }
.die { position: relative; border-radius: 18%; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 14%; box-shadow: 0 3px 6px #0009, inset 0 -3px 0 #0003; transition: opacity .2s, transform .2s; }
.die.d0 { background: #fffaf0; } .die.d0 i { background: #2b2522; }
.die.d1 { background: #3a312c; box-shadow: 0 3px 6px #0009, inset 0 0 0 1px #ffffff40; } .die.d1 i { background: #fffaf0; }
.die i { width: 72%; height: 72%; margin: auto; border-radius: 50%; visibility: hidden; }
.die i.on { visibility: visible; }
.die.used { opacity: .35; transform: scale(.85); }
.die.roll { animation: tumble .14s linear infinite; }
@keyframes tumble { 0% { transform: rotate(0) translateY(0); } 50% { transform: rotate(18deg) translateY(-8%); } 100% { transform: rotate(-12deg) translateY(0); } }
.rollbtn { padding: .5em 1.2em; border-radius: 99px; background: var(--gold); color: #3a2208; font-weight: 900; box-shadow: 0 4px 0 #a87a14, 0 6px 14px #0008; white-space: nowrap; animation: bob 1.1s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-3px); } }

.toast { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%) scale(.9); padding: 8px 18px; border-radius: 99px; background: var(--gold); color: #3a2208; font-weight: 900; font-size: 19px; white-space: nowrap; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 8; box-shadow: 0 8px 20px #0008; }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

.overlay { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 8px; background: #0f0a06a8; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 400px); max-height: calc(100% - 8px); overflow-y: auto; padding: 18px 16px; border-radius: 22px; background: var(--paper); border: 2px solid #ffcf5a55; box-shadow: 0 20px 50px #000a; text-align: center; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.title { font-size: clamp(36px, 11vw, 54px); font-weight: 900; letter-spacing: -.02em; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 var(--frame); }
.tagline { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--muted); }
.label { margin-top: 12px; font-size: 11px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.label[hidden], .seg[hidden] { display: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin-top: 6px; }
.seg button { padding: 9px 6px; border-radius: 14px; background: #463224; box-shadow: 0 3px 0 #1a100a; font-weight: 900; font-size: 15px; line-height: 1.2; }
.seg button small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--gold); color: #3a2208; box-shadow: 0 3px 0 #a87a14; }
.seg button[aria-pressed="true"] small { color: #3a2208; opacity: .8; }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.45; }
.panel h2 { font-size: 25px; font-weight: 900; }
.sub { margin-top: 4px; font-size: 15px; font-weight: 800; color: var(--gold); }
.scores { display: flex; justify-content: center; gap: 26px; margin-top: 12px; }
.scores small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.scores strong { display: block; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; margin-top: 14px; }
.btn { flex: 1; padding: 12px; border-radius: 14px; background: #463224; box-shadow: 0 3px 0 #1a100a; font-size: 16px; font-weight: 900; }
.btn.primary { background: var(--gold); color: #3a2208; box-shadow: 0 4px 0 #a87a14; }
.btn.glow:not(:disabled) { animation: bob .8s ease-in-out infinite alternate; }
.btn:active:not(:disabled), .seg button:active { transform: translateY(2px); }
.record { margin-top: 10px; font-size: 12px; font-weight: 800; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (orientation: landscape) and (max-height: 560px) {
  .stage { flex-direction: row; }
  .side { width: 170px; flex: none; justify-content: center; }
  .players { flex-direction: column; align-items: stretch; }
  .ctrl { flex-direction: column; align-items: stretch; }
  .ctrl .btn { padding: 8px 10px; }
  .panel { padding: 10px 14px; }
  .title { font-size: 32px; }
  .tagline { display: none; }
  .label { margin-top: 8px; }
  .seg button { padding: 6px 6px; }
  .help { margin-top: 6px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app menu" id="app">
  <div class="hud">
    <span class="chip" id="modechip"></span>
    <span class="chip score" id="scorechip"></span>
    <div class="grow"></div>
    <button type="button" class="iconbtn" id="pause" data-i18n-label="pause">II</button>
  </div>
  <div class="stage">
    <div class="wrap" id="wrap">
      <div class="board" id="board" role="group" data-i18n-label="board">
        <svg id="svg" viewBox="0 0 15.4 12.4" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="dice" id="diceL"></div>
        <div class="dice" id="diceR"></div>
      </div>
    </div>
    <div class="side">
      <div class="players">
        <div class="who p1" id="who1"><span class="dot"></span><span id="name1"></span><small id="pip1"></small></div>
        <div class="who p0" id="who0"><span class="dot"></span><span id="name0"></span><small id="pip0"></small></div>
      </div>
      <div class="ctrl">
        <button type="button" class="btn" id="undo" data-i18n="undo" disabled></button>
        <button type="button" class="btn primary glow" id="done" data-i18n="done" disabled></button>
      </div>
      <p class="status" id="status" aria-hidden="true"></p>
    </div>
  </div>
  <div class="toast" id="toast" aria-hidden="true"></div>

  <div class="overlay" id="menu">
    <div class="panel" role="dialog" aria-labelledby="menu-title">
      <h1 class="title" id="menu-title">Backgammon</h1>
      <p class="tagline" data-i18n="tagline"></p>
      <p class="label" data-i18n="opponent"></p>
      <div class="seg" id="seg-mode">
        <button type="button" data-mode="ai" aria-pressed="true"><span data-i18n="vsAI"></span><small data-i18n="vsAIDesc"></small></button>
        <button type="button" data-mode="pvp" aria-pressed="false"><span data-i18n="twoP"></span><small data-i18n="twoPDesc"></small></button>
      </div>
      <p class="label" id="lvl-label" data-i18n="level"></p>
      <div class="seg" id="seg-lvl">
        <button type="button" data-lvl="0" aria-pressed="false" data-i18n="easy"></button>
        <button type="button" data-lvl="1" aria-pressed="true" data-i18n="normal"></button>
        <button type="button" data-lvl="2" aria-pressed="false" data-i18n="hard"></button>
      </div>
      <p class="label" data-i18n="matchLen"></p>
      <div class="seg" id="seg-len">
        <button type="button" data-len="1" aria-pressed="false">1<small class="pw"></small></button>
        <button type="button" data-len="3" aria-pressed="true">3<small class="pw"></small></button>
        <button type="button" data-len="5" aria-pressed="false">5<small class="pw"></small></button>
      </div>
      <div class="row"><button type="button" class="btn primary" id="start" data-i18n="start"></button></div>
      <p class="record" id="record"></p>
      <p class="help" id="help"></p>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="panel" role="dialog" aria-labelledby="paused-title">
      <h2 id="paused-title" data-i18n="paused"></h2>
      <p class="help" data-i18n="rules"></p>
      <div class="row"><button type="button" class="btn" id="quit" data-i18n="menu"></button><button type="button" class="btn primary" id="resume" data-i18n="resume"></button></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel" role="dialog" aria-labelledby="over-title">
      <h2 id="over-title"></h2>
      <p class="sub" id="osub"></p>
      <div class="scores">
        <div><small id="ol0"></small><strong id="os0">0</strong></div>
        <div><small id="ol1"></small><strong id="os1">0</strong></div>
      </div>
      <p class="record" id="orecord"></p>
      <div class="row"><button type="button" class="btn" id="omenu" data-i18n="menu"></button><button type="button" class="btn primary" id="onext"></button></div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

    $('over-title').textContent = title; $('osub').textContent = kind;

    $('orecord').textContent = matchDone && S.ai ? t.record(rec.w, rec.l) : t.score(S.score[0], S.score[1], S.len);
    $('onext').textContent = matchDone ? t.retry : t.next; $('onext').dataset.act = matchDone ? 'retry' : 'next';
    setStatus('', false); $('over').hidden = false; announce(`${title}. ${kind}`); $('onext').focus();
  }
  function toMenu() {
    S.token++; S.phase = 'menu'; S.paused = false; app.classList.add('menu');
    $('paused').hidden = true; $('over').hidden = true; $('menu').hidden = false;
    $('record').textContent = rec.w + rec.l ? t.record(rec.w, rec.l) : '';
    syncMenu(); $('start').focus();
  }
  function setPause(on) {
    if (on && (S.phase === 'menu' || S.phase === 'over')) return;
    S.paused = on; $('paused').hidden = !on; render();
    if (on) $('resume').focus();
  }
  function syncMenu() {
    for (const bt of $('seg-mode').children) bt.setAttribute('aria-pressed', String(bt.dataset.mode === settings.mode));
    for (const bt of $('seg-lvl').children) bt.setAttribute('aria-pressed', String(+bt.dataset.lvl === settings.lvl));
    for (const bt of $('seg-len').children) bt.setAttribute('aria-pressed', String(+bt.dataset.len === settings.len));
    $('seg-lvl').hidden = $('lvl-label').hidden = settings.mode !== 'ai';
  }
  $('seg-mode').addEventListener('click', e => { const bt = e.target.closest('button'); if (!bt) return; settings.mode = bt.dataset.mode; save('settings', settings); syncMenu(); });
  $('seg-lvl').addEventListener('click', e => { const bt = e.target.closest('button'); if (!bt) return; settings.lvl = +bt.dataset.lvl; save('settings', settings); syncMenu(); });
  $('seg-len').addEventListener('click', e => { const bt = e.target.closest('button'); if (!bt) return; settings.len = +bt.dataset.len; save('settings', settings); syncMenu(); });
  $('start').addEventListener('click', startMatch);
  $('onext').addEventListener('click', () => { if ($('onext').dataset.act === 'next') newGame(); else startMatch(); });
  $('omenu').addEventListener('click', toMenu);
  $('quit').addEventListener('click', toMenu);
  $('resume').addEventListener('click', () => setPause(false));
  $('pause').addEventListener('click', () => setPause(!S.paused));
  $('undo').addEventListener('click', undo);
  $('done').addEventListener('click', finishTurn);

  addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'p' || k === 'P' || (k === 'Escape' && S.sel == null)) { if (!$('menu').hidden || !$('over').hidden) return; e.preventDefault(); setPause(!S.paused); return; }
    if (S.paused || S.phase === 'menu' || S.phase === 'over') return;
    if (!human()) return;
    if (S.phase === 'roll' && (k === 'r' || k === 'R' || k === ' ' || k === 'Enter')) { e.preventDefault(); doRoll(); return; }
    if (S.phase !== 'move') return;
    if (k === 'u' || k === 'U' || k === 'Backspace') { e.preventDefault(); undo(); return; }
    if (k === 'Escape') { e.preventDefault(); S.sel = null; render(); return; }
    const done = S.done.length === S.maxLen;
    if (done && (k === 'd' || k === 'D' || k === 'Enter' || k === ' ')) { e.preventDefault(); finishTurn(); return; }
    if (k === 'd' || k === 'D') return;
    const cands = candidates(nextMoves());
    if (!cands.length) return;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault(); kbd = true; S.cur += (k === 'ArrowRight' || k === 'ArrowDown') ? 1 : -1; render(); return;
    }
    if (k === 'Enter' || k === ' ') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement.closest('.ctrl')) return;
      e.preventDefault();
      if (!kbd) { kbd = true; S.cur = 0; render(); return; }
      const c = cands[((S.cur % cands.length) + cands.length) % cands.length];
      clickLoc(c); kbd = true; render();
    }
  });
  addEventListener('blur', () => { if (S.phase !== 'menu' && S.phase !== 'over' && !S.paused) setPause(true); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && S.phase !== 'menu' && S.phase !== 'over' && !S.paused) setPause(true); });
  addEventListener('resize', fit);

  $('help').textContent = coarse ? t.helpTouch : t.helpKeys;
  buildSvg(); buildStacks(S.b);
  if (window.ResizeObserver) new ResizeObserver(fit).observe($('wrap'));
  fit(); toMenu();
})();
</script>
</body>
</html>
