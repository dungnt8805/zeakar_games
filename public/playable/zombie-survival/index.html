<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zombie Survival</title>
<style>
:root {
  --bg: #1b1730;
  --ink: #17122a;
  --panel: #2b2347;
  --panel-2: #372d5c;
  --line: #4d4180;
  --text: #f6f2ff;
  --muted: #b9afdc;
  --lime: #a6f04a;
  --lime-dark: #5a9e1b;
  --pumpkin: #ff9a3c;
  --pumpkin-dark: #c9651a;
  --pink: #ff6f9c;
  --sky: #6fd3ff;
  --hud: #1b1730c4;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.coin { display: inline-block; flex: none; width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, #ffcf3f 55%, #e0a100); box-shadow: inset 0 0 0 1.5px #b37f00; }

.app { position: fixed; inset: 0; overflow: hidden; background: #2f2a4a; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.app.play #game { cursor: crosshair; }

/* ---------- HUD ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "pause hp coins" "wave wave score"; align-items: center; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); pointer-events: none; }
.app.menu .hud, .app.menu .acts, .app.menu .prompt, .app.menu .bossbar { visibility: hidden; }
.hbtn { grid-area: pause; pointer-events: auto; width: 40px; height: 36px; border-radius: 12px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff22, 0 3px 0 #0007; display: grid; place-items: center; }
.hbtn svg { width: 14px; height: 14px; fill: #fff; }
.hbtn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px #ffffff22; }
.chip { height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 12px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff1c, 0 3px 0 #0006; font-weight: 900; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 0; }
.chip small { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.hp { grid-area: hp; width: 100%; max-width: 240px; }
.hp svg { width: 17px; height: 17px; flex: none; fill: var(--pink); }
.hp .bars { flex: 1; min-width: 0; display: grid; gap: 3px; }
.hp .bar { display: block; height: 11px; border-radius: 6px; background: #0007; overflow: hidden; box-shadow: inset 0 0 0 1.5px #ffffff2a; }
.hp .bar i { display: block; height: 100%; width: calc(var(--v, 1) * 100%); background: linear-gradient(#d4ff94, var(--lime)); border-radius: 6px; transition: width .15s; }
.hp.low .bar i { background: linear-gradient(#ffc0d2, var(--pink)); }
.hp.low svg { animation: beat .6s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.25); } }
.hp .bar.armor { height: 5px; }
.hp .bar.armor i { background: var(--sky); }
.hp .bar[hidden] { display: none; }
.hp b { font-size: 14px; min-width: 2.2em; text-align: right; }
#wave-chip { grid-area: wave; justify-self: start; height: 30px; font-size: 15px; }
#wave-chip .left { font-size: 13px; font-weight: 800; color: var(--pumpkin); }
#wave-chip .left:empty { display: none; }
#coins-chip { grid-area: coins; color: #ffe27a; }
#score-chip { grid-area: score; justify-self: end; height: 30px; font-size: 15px; }
.chip.bump { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.12); } }

.weapons { position: fixed; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; }
.wslot { pointer-events: auto; position: relative; width: 64px; height: 50px; border-radius: 12px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff1c, 0 3px 0 #0006; display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; align-items: center; padding: 4px 3px 5px; overflow: hidden; }
.wslot svg { width: 40px; height: 20px; fill: #fff; }
.wslot b { font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
.wslot.on { background: #2f4520d8; box-shadow: inset 0 0 0 2.5px var(--lime), 0 3px 0 #0006; }
.wslot.on svg { fill: var(--lime); }
.wslot.locked { opacity: .38; }
.wslot.empty b { color: var(--pink); }
.wslot kbd { position: absolute; top: 3px; left: 6px; font: inherit; font-size: 10px; font-weight: 800; color: var(--muted); }
.wslot .rl { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--pumpkin); transform-origin: left; transform: scaleX(var(--p, 0)); }
html.touch .wslot kbd { display: none; }
html.touch .wslot.nade { display: none; }

.bossbar { position: absolute; left: 50%; top: calc(max(6px, env(safe-area-inset-top)) + 80px); transform: translateX(-50%); width: min(70%, 320px); text-align: center; pointer-events: none; }
.bossbar[hidden] { display: none; }
.bossbar small { display: block; font-size: 13px; font-weight: 900; color: #ffd36b; text-shadow: 0 2px 0 #000a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bossbar .bar { height: 11px; margin-top: 3px; border-radius: 6px; background: #1b1730d0; box-shadow: inset 0 0 0 2px #ffffff40; overflow: hidden; }
.bossbar .bar i { display: block; height: 100%; width: calc(var(--v, 1) * 100%); background: linear-gradient(#ff9fb7, #e0464f); transition: width .2s; }

.acts { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 50%; transform: translateY(-30%); display: none; flex-direction: column; gap: 12px; }
html.touch .acts { display: flex; }
.act { position: relative; width: 56px; height: 56px; border-radius: 50%; background: #1b1730a8; box-shadow: inset 0 0 0 2.5px #ffffff50, 0 4px 0 #0006; display: grid; place-items: center; touch-action: none; }
.act svg { width: 26px; height: 26px; fill: #fff; pointer-events: none; }
.act b { position: absolute; right: -2px; bottom: -2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--lime); color: var(--ink); font-size: 12px; font-weight: 900; line-height: 20px; pointer-events: none; }
.act.repair { background: #c9651ad0; }
.act[hidden] { display: none; }
.act:active, .act.on { transform: translateY(3px); box-shadow: inset 0 0 0 2.5px #ffffff80; }
.prompt { position: absolute; left: 50%; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 62px); transform: translateX(-50%); padding: 6px 14px; border-radius: 12px; background: #c9651ae6; color: #fff; font-size: 14px; font-weight: 900; white-space: nowrap; pointer-events: none; box-shadow: 0 3px 0 #0006; }
.prompt[hidden] { display: none; }
html.touch .prompt { display: none; }

.banner { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); max-width: calc(100% - 24px); padding: 8px 20px; border-radius: 16px; background: #1b1730c8; box-shadow: inset 0 0 0 2px #ffffff30; font-size: clamp(18px, 5vmin, 34px); font-weight: 900; text-align: center; text-shadow: 0 3px 0 #000; pointer-events: none; opacity: 0; }
.banner.show { animation: banner 2s ease-out both; }
.banner.boss { color: #ffd36b; background: #5a1420cc; }
.banner.good { color: var(--lime); }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.9); } 12%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%); } }
.toast { position: absolute; left: 50%; top: 52%; transform: translateX(-50%); padding: 5px 12px; border-radius: 10px; background: #1b1730d8; font-size: 14px; font-weight: 900; color: var(--pink); pointer-events: none; opacity: 0; white-space: nowrap; }
.toast.show { animation: toast 1.2s ease-out both; }
@keyframes toast { 10%, 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -10px); } }

/* ---------- panels ---------- */
.overlay { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #120e22a8; }
.overlay[hidden] { display: none; }
.overlay.soft { background: linear-gradient(#120e2240, #120e22c8); }
.panel { width: min(100%, 420px); max-height: calc(100% - 8px); overflow: auto; overscroll-behavior: contain; padding: 18px 16px 16px; border-radius: 22px; background: var(--panel); box-shadow: inset 0 0 0 2px var(--line), 0 7px 0 #0e0a1c, 0 24px 60px #000a; text-align: center; animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.brand { display: grid; justify-items: center; }
.mascot { width: 76px; height: 70px; display: block; animation: wobble 2.4s ease-in-out infinite; }
@keyframes wobble { 50% { transform: rotate(-6deg) translateY(-2px); } }
.logo { margin-top: 4px; font-size: clamp(32px, 10vw, 48px); font-weight: 900; line-height: .95; letter-spacing: -.01em; color: var(--lime); text-shadow: 0 4px 0 #2d5a10, 0 0 22px #a6f04a44; text-transform: uppercase; }
.logo span { display: block; color: var(--pumpkin); text-shadow: 0 4px 0 #7a3a0c, 0 0 22px #ff9a3c44; }
.tag { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--muted); }
.lbl { margin: 12px 0 6px; font-size: 12px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.maps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.map { position: relative; min-width: 0; padding: 8px 4px 7px; border-radius: 14px; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 #0e0a1c; display: grid; justify-items: center; align-content: start; gap: 3px; }
.map svg { width: 38px; height: 32px; }
.map b { font-size: 13px; font-weight: 900; line-height: 1.15; }
.map small { font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.map .star { position: absolute; top: 4px; right: 6px; color: #ffd36b; font-size: 13px; }
.map[aria-checked="true"] { background: #354a26; box-shadow: inset 0 0 0 3px var(--lime), 0 3px 0 #0e0a1c; }
.map:active { transform: translateY(2px); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #1b1730; }
.seg button { flex: 1; min-width: 0; min-height: 34px; padding: 4px; border-radius: 10px; font-size: 14px; font-weight: 900; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--pumpkin); color: #3a1a00; }
.toggles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
.toggle { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 4px 12px; border-radius: 12px; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line); font-size: 14px; font-weight: 800; }
.toggle b { padding: 2px 8px; border-radius: 7px; background: #1b1730; color: var(--muted); font-size: 12px; }
.toggle[aria-pressed="true"] b { background: var(--lime); color: var(--ink); }
.cta { width: 100%; margin-top: 14px; min-height: 50px; padding: 12px; border-radius: 16px; background: var(--lime); color: #17300a; font-size: 19px; font-weight: 900; box-shadow: 0 5px 0 var(--lime-dark), 0 0 24px #a6f04a33; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--lime-dark); }
.btn { flex: 1 1 120px; min-height: 46px; padding: 10px 12px; border-radius: 14px; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 #0e0a1c; font-size: 16px; font-weight: 900; }
.btn.primary { background: var(--lime); color: #17300a; box-shadow: 0 4px 0 var(--lime-dark); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0e0a1c; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--muted); }
.panel h2 { font-size: 28px; font-weight: 900; line-height: 1.1; letter-spacing: -.01em; }
.panel .sub { margin-top: 6px; font-size: 14px; font-weight: 700; color: var(--muted); line-height: 1.35; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
.stats div { min-width: 0; padding: 7px 2px; border-radius: 12px; background: var(--panel-2); }
.stats small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats strong { display: block; font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; margin-top: 12px; padding: 4px 14px; border-radius: 10px; background: var(--pumpkin); color: #3a1a00; font-size: 14px; font-weight: 900; }
.badge[hidden] { display: none; }
.big-ico { width: 96px; height: 64px; display: block; margin: 0 auto 6px; }
.over-panel h2 { color: var(--pink); }
.win-panel h2 { color: var(--lime); }

.shop-panel { width: min(100%, 760px); display: flex; flex-direction: column; overflow: hidden; padding: 14px 14px 12px; text-align: left; }
.shop-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.shop-head > div:first-child { flex: 1 1 200px; min-width: 0; }
.shop-head h2 { font-size: 24px; color: var(--lime); }
.shop-head .sub { margin-top: 2px; }
.shop-stats { display: flex; gap: 6px; }
.shop-stats .chip { height: 34px; background: #1b1730; color: #ffe27a; }
.shop-stats .chip svg { width: 16px; height: 16px; fill: var(--pink); }
.shop-stats .chip.hpc { color: var(--text); }
.items { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin-top: 10px; padding: 2px 2px 4px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; align-content: start; }
.item { min-width: 0; display: grid; grid-template-columns: 34px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; row-gap: 5px; align-items: center; padding: 8px; border-radius: 14px; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 #0e0a1c; text-align: left; }
.item .ico { width: 34px; height: 34px; border-radius: 10px; background: #1b1730; display: grid; place-items: center; }
.item .ico svg { width: 28px; height: 18px; fill: var(--lime); }
.item .ico svg.sq { width: 22px; height: 22px; }
.item .txt { min-width: 0; line-height: 1.2; }
.item .txt b { display: block; font-size: 14px; font-weight: 900; }
.item .txt em { display: inline-block; white-space: nowrap; font-style: normal; margin-left: 4px; padding: 0 6px; border-radius: 6px; background: #1b1730; color: var(--sky); font-size: 11px; vertical-align: 1px; }
.item .txt small { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.item .price { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 28px; border-radius: 9px; background: var(--pumpkin); color: #3a1a00; font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; }
.item.poor .price { background: #4a3f6b; color: #c9bfe6; }
.item.done .price { background: #1b1730; color: var(--lime); }
.item:disabled { box-shadow: inset 0 0 0 2px var(--line); }
.item:disabled .txt, .item:disabled .ico { opacity: .6; }
.item:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--line); }
.item.bought { animation: bought .4s ease-out; }
@keyframes bought { 40% { background: #4c6b2c; } }
.shop-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.shop-foot .tip { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 700; line-height: 1.35; color: var(--muted); }
.shop-foot .cta { width: auto; flex: 0 0 auto; min-width: 180px; margin-top: 0; padding: 10px 18px; font-size: 17px; }

/* Landscape / wide: two-column title, roomier shop. */
@media (min-aspect-ratio: 5/4) {
  .title-panel { width: min(100%, 760px); display: grid; grid-template-columns: 1fr 1.25fr; gap: 0 22px; align-items: center; }
  .title-panel .setup .lbl:first-child { margin-top: 0; }
  .mascot { width: 96px; height: 88px; }
  .logo { font-size: clamp(34px, 6vmin, 54px); }
}
@media (max-height: 480px) {
  .panel { padding: 12px 14px; }
  .mascot { width: 56px; height: 50px; }
  .logo { font-size: 30px; }
  .tag { margin-top: 6px; font-size: 13px; }
  .lbl { margin: 8px 0 4px; }
  .map { padding: 5px 3px; }
  .map svg { width: 30px; height: 24px; }
  .seg button { min-height: 30px; }
  .toggles { margin-top: 8px; }
  .toggle { min-height: 32px; }
  .cta { margin-top: 10px; min-height: 42px; padding: 8px; font-size: 17px; }
  .help { margin-top: 6px; }
  .panel h2 { font-size: 22px; }
  .stats { margin-top: 8px; }
  .stats div { padding: 4px 2px; }
  .actions { margin-top: 10px; }
  .btn { min-height: 40px; padding: 6px 10px; }
  .big-ico { width: 72px; height: 44px; }
  .shop-panel { padding: 10px 12px; }
  .shop-head h2 { font-size: 20px; }
  .shop-head .sub { display: none; }
  .items { margin-top: 6px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .item { padding: 6px; row-gap: 4px; }
  .item .txt small { font-size: 11px; }
  .item .price { min-height: 24px; }
  .shop-foot { margin-top: 6px; }
  .shop-foot .cta { min-height: 40px; }
  .chip { height: 30px; font-size: 14px; }
  .hbtn { height: 30px; }
  .wslot { height: 42px; width: 58px; padding: 3px 2px 4px; }
  .wslot svg { height: 16px; }
  .act { width: 48px; height: 48px; }
  .acts { gap: 8px; transform: translateY(-40%); }
  .prompt { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 52px); }
}
@media (max-height: 640px) and (max-aspect-ratio: 5/4) {
  .mascot { width: 46px; height: 42px; }
  .logo { font-size: 28px; }
  .tag { margin-top: 6px; font-size: 12.5px; line-height: 1.3; }
  .lbl { margin: 8px 0 5px; }
  .map { padding: 6px 3px 5px; gap: 2px; }
  .map svg { width: 28px; height: 24px; }
  .seg button { min-height: 32px; }
  .toggles { margin-top: 8px; }
  .toggle { min-height: 32px; }
  .cta { margin-top: 10px; min-height: 44px; padding: 8px; }
  .help { margin-top: 8px; font-size: 11px; }
}
@media (max-height: 400px) and (min-aspect-ratio: 5/4) {
  .map { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 6px; row-gap: 0; padding: 5px 6px; text-align: left; align-items: center; }
  .map svg { grid-row: span 2; width: 26px; height: 22px; }
  .map b { font-size: 12px; }
  .map small { font-size: 10px; }
  .help { font-size: 11px; line-height: 1.3; }
  .lbl { margin: 6px 0 4px; }
}
@media (max-height: 360px) { .shop-foot .tip { display: none; } .shop-foot { justify-content: flex-end; } }
@media (min-width: 620px) {
  .hud { grid-template-columns: auto minmax(150px, 250px) auto minmax(0, 1fr) auto auto; grid-template-areas: "pause hp wave . coins score"; }
  #wave-chip, #score-chip { height: 36px; font-size: 16px; }
  .bossbar { top: calc(max(6px, env(safe-area-inset-top)) + 46px); }
}
@media (min-width: 620px) and (max-height: 480px) { #wave-chip, #score-chip { height: 30px; font-size: 14px; } .bossbar { top: calc(max(6px, env(safe-area-inset-top)) + 38px); } }
/* Touch, portrait: the weapon row sits under the HUD so both thumbs stay free. */
@media (max-aspect-ratio: 1/1) {
  html.touch .weapons { position: static; grid-column: 1 / -1; transform: none; justify-self: center; }
  html.touch .wslot { width: 58px; height: 42px; }
  html.touch .wslot svg { height: 16px; }
  html.touch .bossbar { top: calc(max(6px, env(safe-area-inset-top)) + 130px); }
}
@media (max-width: 380px) {
  .chip { padding: 0 8px; gap: 4px; }
  .hud { gap: 5px; }
  .hbtn { width: 36px; }
  .panel { padding: 14px 12px 12px; }
  .wslot { width: 54px; }
  .items { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .item { grid-template-columns: 28px minmax(0, 1fr); column-gap: 6px; padding: 6px; }
  .item .ico { width: 28px; height: 28px; }
  .item .ico svg { width: 22px; height: 14px; }
  .item .ico svg.sq { width: 18px; height: 18px; }
  .item .txt b { font-size: 13px; }
  .item .txt small { font-size: 11px; }
  .shop-foot { flex-direction: column; align-items: stretch; }

    const pad = 16, top = view.top + 10, bottom = view.h - view.bottom - 10;
    let n = 0;
    for (const z of zombies) {
      const sx = (z.x - ox) * view.zoom, sy = (z.y - 20 - oy) * view.zoom;
      if (sx > 0 && sx < view.w && sy > top && sy < bottom) continue;
      if (Math.hypot(z.x - P.x, z.y - P.y) > 700 && z.type !== 'boss') continue;
      if (++n > 14) break;
      const cx = view.w / 2, cy = (top + bottom) / 2, dx = sx - cx, dy = sy - cy;
      const k = Math.min((view.w / 2 - pad) / Math.abs(dx || 1e-3), ((bottom - top) / 2 - pad) / Math.abs(dy || 1e-3));
      const ix = cx + dx * k, iy = cy + dy * k, a = Math.atan2(dy, dx), boss = z.type === 'boss', r = boss ? 11 : 7;
      ctx.save(); ctx.translate(ix, iy); ctx.rotate(a);
      ctx.fillStyle = boss ? '#ffd36b' : '#ff6f9c'; ctx.strokeStyle = '#1d1a2b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(-r * 0.8, -r * 0.8); ctx.lineTo(-r * 0.4, 0); ctx.lineTo(-r * 0.8, r * 0.8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(view.w / 2, view.h / 2, Math.min(view.w, view.h) * 0.35, view.w / 2, view.h / 2, Math.max(view.w, view.h) * 0.7);
    const pulse = P.hurtT > 0 ? 0.45 : 0.18 + 0.1 * Math.sin(clock * 5);
    g.addColorStop(0, 'rgba(255,111,156,0)'); g.addColorStop(1, `rgba(255,111,156,${pulse})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, view.w, view.h);
  }
  function drawSticks() {
    if (!isTouch()) return;
    const R = 46;
    const drawStick = (s, color, ghost) => {
      ctx.globalAlpha = ghost ? 0.18 : 0.5;
      ctx.fillStyle = '#1d1a2b'; ctx.beginPath(); ctx.arc(s.ox, s.oy, R, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.globalAlpha = ghost ? 0.3 : 0.85;
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(s.ox + (s.dx || 0) * R, s.oy + (s.dy || 0) * R, 20, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    };
    const by = view.h - Math.max(70, view.h * 0.16);
    drawStick(input.move || { ox: Math.max(70, view.w * 0.14), oy: by }, '#ffffff', !input.move);
    if (input.aim) drawStick({ ox: input.aim.ox, oy: input.aim.oy, dx: input.aim.dx, dy: input.aim.dy }, input.aim.on ? '#a6f04a' : '#ffffff', false);
    else if (!autoAimOn()) drawStick({ ox: view.w - Math.max(110, view.w * 0.2), oy: by }, '#a6f04a', true);
  }
  function updateFx(dt) {
    for (const p of particles) {
      p.life -= dt;
      if (p.k === 0) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; }
      else if (p.k === 1 || p.k === 2) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; if (p.rot !== undefined) p.rot += p.vr * dt; }
      else if (p.k === 3) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.rot += p.vr * dt; }
    }
    particles = particles.filter(p => p.life > 0);
    if (particles.length > 600) particles.splice(0, particles.length - 600);
    for (const tx of texts) { tx.y -= 26 * dt; tx.life -= dt; }
    texts = texts.filter(tx => tx.life > 0);
  }

  // ---------- menu world ----------
  function menuStep(dt) {
    if (!world) return;
    if (zombies.length < 7) {
      const s = world.spawns[zombies.length % world.spawns.length];
      const types = ['walker', 'walker', 'runner', 'tank', 'spitter', 'walker', 'boss'];
      const z = { id: ++zid, type: types[zombies.length % types.length], x: s.x, y: s.y, vx: 0, vy: 0, kx: 0, ky: 0, r: 0, hp: 1, maxHp: 1, flash: 0, facing: 1, phase: Math.random() * TAU, born: 1, wanderT: 0 };
      z.r = ZT[z.type].r;
      zombies.push(z);
    }
    for (const z of zombies) {
      z.wanderT -= dt; z.phase += dt * 7;
      if (z.wanderT <= 0) { const a = rand(0, TAU), v = ZT[z.type].speed * 0.6; z.vx = Math.cos(a) * v; z.vy = Math.sin(a) * v; z.wanderT = rand(1.5, 3.5); if (z.vx) z.facing = z.vx > 0 ? 1 : -1; }
      z.x += z.vx * dt; z.y += z.vy * dt;
      collideTiles(z, z.r, true);
    }
  }

  // ---------- flow / overlays ----------
  const overlays = ['title-ov', 'shop-ov', 'pause-ov', 'over-ov', 'win-ov'].map($);
  function hideOverlays() { for (const o of overlays) o.hidden = true; }
  function showOverlay(el) { hideOverlays(); el.hidden = false; }
  function setMode(m) {
    mode = m;
    $('app').classList.toggle('menu', m === 'menu');
    $('app').classList.toggle('play', m === 'play' || m === 'clear');
    if (m !== 'play' && m !== 'clear') { releaseAll(); }
    requestAnimationFrame(measureHud);
  }
  function openMenu() {
    if (run && run.score > 0 && mode !== 'over') saveRecord(run.rescued);
    setMode('menu');
    paused = false;
    run = null; P = null;
    zombies = []; bullets = []; pickups = []; goos = []; puddles = []; nades = []; particles = []; texts = [];
    if (!world || world.mapIdx !== settings.map) loadWorld(settings.map); else setPlanks(BASE_PLANKS, true);
    renderTitle();
    showOverlay($('title-ov'));
    $('play-btn').focus({ preventScroll: true });
  }
  function renderTitle() {
    const maps = $('maps');
    maps.innerHTML = '';
    MAPS.forEach((m, i) => {
      const rec = records[m.key];
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'map'; b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(i === settings.map));
      b.tabIndex = i === settings.map ? 0 : -1;
      b.innerHTML = `${MAP_ICONS[i]}<b>${t.maps[i]}</b><small>${rec && rec.wave ? t.bestLine(rec.wave, fmt(rec.score)) : t.noBest}</small>${rec && rec.rescued ? `<span class="star" title="${t.rescued}" aria-label="${t.rescued}">★</span>` : ''}`;
      b.addEventListener('click', () => pickMap(i));
      b.addEventListener('keydown', e => radioKeys(e, i, 3, pickMap, '#maps .map'));
      maps.appendChild(b);
    });
    const diffs = $('diffs');
    diffs.innerHTML = '';
    t.diffs.forEach((name, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.setAttribute('role', 'radio'); b.textContent = name;
      b.setAttribute('aria-checked', String(i === settings.diff));
      b.tabIndex = i === settings.diff ? 0 : -1;
      b.addEventListener('click', () => pickDiff(i));
      b.addEventListener('keydown', e => radioKeys(e, i, 3, pickDiff, '#diffs button'));
      diffs.appendChild(b);
    });
    $('help').textContent = isTouch() ? t.helpTouch : t.helpKeys;
    syncToggles();
  }
  function radioKeys(e, i, n, pick, sel) {
    const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!d) return;
    e.preventDefault();
    const j = (i + d + n) % n;
    pick(j);
    const el = document.querySelectorAll(sel)[j];
    if (el) el.focus();
  }
  function pickMap(i) {
    settings.map = i; store.set('map', i);
    zombies = [];
    loadWorld(i);
    renderTitle();
    const el = document.querySelectorAll('#maps .map')[i];
    if (el) el.focus({ preventScroll: true });
  }
  function pickDiff(i) {
    settings.diff = i; store.set('diff', i);
    renderTitle();
    const el = document.querySelectorAll('#diffs button')[i];
    if (el) el.focus({ preventScroll: true });
  }
  function syncToggles() {
    for (const id of ['aim-1', 'aim-2']) { $(id).setAttribute('aria-pressed', String(autoAimOn())); $(id).querySelector('b').textContent = autoAimOn() ? t.on : t.off; }
    for (const id of ['sound-1', 'sound-2']) { $(id).setAttribute('aria-pressed', String(sfx.on)); $(id).querySelector('b').textContent = sfx.on ? t.on : t.off; }
  }
  function toggleAim() { settings.autoAim = !autoAimOn(); store.set('autoAim', settings.autoAim); aimTarget = null; syncToggles(); }
  function pause() {
    if (paused || (mode !== 'play' && mode !== 'clear')) return;
    paused = true;
    releaseAll();
    $('pause-sub').textContent = t.pauseSub(run.wave, t.maps[run.map]);
    syncToggles();
    $('pause-ov').hidden = false;
    $('resume-btn').focus({ preventScroll: true });
  }
  function resume() {
    if (!paused) return;
    paused = false;
    $('pause-ov').hidden = true;
    last = performance.now();
    canvas.focus({ preventScroll: true });
  }

  // ---------- input ----------
  function releaseAll() {
    input.up = input.down = input.left = input.right = input.fire = input.mouseDown = input.repair = false;
    input.move = null; input.aim = null;
    touches.clear();
    $('act-repair').classList.remove('on');
  }
  const active = () => (mode === 'play' || mode === 'clear') && !paused;
  const MOVE_KEYS = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return;
    if (!active()) {
      if ((e.code === 'KeyP') && paused) { e.preventDefault(); resume(); }
      return;
    }
    if (e.target && e.target.closest && e.target.closest('.overlay')) return;
    const mk = MOVE_KEYS[e.code];
    if (mk) { input[mk] = true; e.preventDefault(); return; }
    switch (e.code) {
      case 'Space': input.fire = true; e.preventDefault(); break;
      case 'KeyR': startReload(); e.preventDefault(); break;
      case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': selectWeapon(Number(e.code.slice(5)) - 1); e.preventDefault(); break;
      case 'KeyQ': cycleWeapon(1); e.preventDefault(); break;
      case 'KeyG': if (!e.repeat) throwNade(); e.preventDefault(); break;
      case 'KeyE': input.repair = true; e.preventDefault(); break;
      case 'KeyP': pause(); e.preventDefault(); break;
      default:
    }
    sfx.unlock();
  });
  document.addEventListener('keyup', e => {
    const mk = MOVE_KEYS[e.code];
    if (mk) input[mk] = false;
    if (e.code === 'Space') input.fire = false;
    if (e.code === 'KeyE') input.repair = false;
  });

  const touches = new Map();
  function setTouchMode(on) {
    const was = isTouch();
    document.documentElement.classList.toggle('touch', on);
    if (was !== on) { if (mode === 'menu') renderTitle(); requestAnimationFrame(measureHud); }
  }
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    sfx.unlock();
    if (e.pointerType === 'mouse') {
      setTouchMode(false);
      input.mouse = { x: e.clientX, y: e.clientY }; input.mouseT = clock; input.overCanvas = true;
      if (!active()) return;
      if (e.button === 2) throwNade(); else if (e.button === 0) input.mouseDown = true;
      canvas.focus({ preventScroll: true });
      try { canvas.setPointerCapture(e.pointerId); } catch {}
      return;
    }
    setTouchMode(true);
    if (!active()) return;
    e.preventDefault();
    const left = e.clientX < view.w / 2;
    if (left && !input.move) { input.move = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 }; touches.set(e.pointerId, 'move'); }
    else if (!left && !input.aim) { input.aim = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0, on: false, a: P.aim }; touches.set(e.pointerId, 'aim'); }
    try { canvas.setPointerCapture(e.pointerId); } catch {}
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') { input.mouse = { x: e.clientX, y: e.clientY }; input.mouseT = clock; input.overCanvas = true; return; }
    const role = touches.get(e.pointerId);
    if (!role) return;
    const s = input[role];
    if (!s) return;
    const R = 46;
    let dx = (e.clientX - s.ox) / R, dy = (e.clientY - s.oy) / R;
    const l = Math.hypot(dx, dy);
    // The base follows the thumb when it drifts too far, so the stick never feels stuck.
    if (l > 1.3) { s.ox += (dx / l) * (l - 1.3) * R; s.oy += (dy / l) * (l - 1.3) * R; dx = dx / l * 1.3; dy = dy / l * 1.3; }
    const m = Math.min(1, Math.hypot(dx, dy));
    const k = m > 0 ? m / Math.hypot(dx, dy) : 0;
    s.dx = dx * k; s.dy = dy * k;
    if (role === 'aim') { s.on = m > 0.3; if (s.on) s.a = Math.atan2(dy, dx); }
  });
  const endPointer = e => {
    if (e.pointerType === 'mouse') { input.mouseDown = false; return; }
    const role = touches.get(e.pointerId);
    if (!role) return;
    touches.delete(e.pointerId);
    input[role] = null;
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') input.overCanvas = false; });
  canvas.addEventListener('wheel', e => { if (!active()) return; e.preventDefault(); cycleWeapon(e.deltaY > 0 ? 1 : -1); }, { passive: false });

  const holdBtn = (el, on, off) => {
    el.addEventListener('pointerdown', e => { e.preventDefault(); setTouchMode(e.pointerType !== 'mouse'); el.classList.add('on'); on(); try { el.setPointerCapture(e.pointerId); } catch {} });
    const end = () => { el.classList.remove('on'); off(); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); on(); } });
    el.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') off(); });
  };
  holdBtn($('act-repair'), () => { input.repair = true; }, () => { input.repair = false; });
  holdBtn($('act-nade'), () => { if (active()) throwNade(); }, () => {});
  holdBtn($('act-reload'), () => { if (active()) startReload(); }, () => {});

  $('play-btn').addEventListener('click', startRun);
  $('next-btn').addEventListener('click', () => { hideOverlays(); nextWave(); canvas.focus({ preventScroll: true }); });
  $('pause-btn').addEventListener('click', () => { if (paused) resume(); else pause(); });
  $('resume-btn').addEventListener('click', resume);
  $('restart-btn').addEventListener('click', () => { paused = false; startRun(); });
  $('pause-menu').addEventListener('click', openMenu);
  $('again-btn').addEventListener('click', startRun);
  $('over-menu').addEventListener('click', openMenu);
  $('keep-btn').addEventListener('click', openShop);
  $('win-menu').addEventListener('click', openMenu);
  for (const id of ['aim-1', 'aim-2']) $(id).addEventListener('click', toggleAim);
  for (const id of ['sound-1', 'sound-2']) $(id).addEventListener('click', () => { sfx.toggle(); syncToggles(); });
  window.addEventListener('blur', () => { releaseAll(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); last = performance.now(); });

  // ---------- main loop ----------
  let last = performance.now(), acc = 0, timeScale = 1;
  function frame(now) {
    // Clamp dt so a stalled frame (tab switch, slow device) never teleports anything.
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    const live = (mode === 'play' || mode === 'clear') && !paused;
    if (live) {
      clock += dt;
      acc += dt * timeScale;
      while (acc >= STEP) { step(STEP); acc -= STEP; if (mode !== 'play' && mode !== 'clear') { acc = 0; break; } }
    } else acc = 0;
    if (mode === 'menu') { clock += dt; menuStep(dt); }
    if (!paused && mode !== 'shop') updateFx(dt);
    updateCamera(paused ? 0 : dt);
    render();
    syncHud();
    requestAnimationFrame(frame);
  }

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__zombieSurvival = {
    state: () => ({
      mode, paused, map: settings.map, diff: settings.diff, wave: run && run.wave, coins: run && run.coins, score: run && run.score, kills: run && run.kills, rescued: run && run.rescued,
      hp: P && P.hp, maxHp: P && P.maxHp, armor: P && P.armor, x: P && P.x, y: P && P.y, weapon: P && P.weapon, owned: P && P.owned.slice(), mag: P && P.mag.slice(), res: P && P.res.map(v => (v === Infinity ? -1 : v)), nades: P && P.nades,
      zombies: zombies.length, queue: queue.length, types: zombies.map(z => z.type), barricades: world ? world.groups.map(g => g.hp) : [], autoAim: autoAimOn(), up: run && { ...run.up },
      hazards: puddles.map(q => ({ x: q.x, y: q.y })).concat(goos.map(g => ({ x: g.tx, y: g.ty }))), start: world && world.start,
      overlay: (overlays.find(o => !o.hidden) || {}).id || null, cam: { x: cam.x, y: cam.y, zoom: view.zoom },
    }),
    map: () => world && { W: MW, H: MH, tile: TILE, grid: Array.from(world.grid), spawns: world.spawns, start: world.start, groups: world.groups.map(g => ({ x: g.x, y: g.y, tiles: g.tiles.slice() })) },
    zombies: () => zombies.map(z => ({ type: z.type, x: z.x, y: z.y, hp: z.hp })),
    toScreen: (wx, wy) => { const r = canvas.getBoundingClientRect(); return { x: r.left + (wx - cam.x) * view.zoom + view.w / 2, y: r.top + (wy - cam.y) * view.zoom + view.h / 2 }; },
    flowReach: () => { if (!P) return null; computeFlow(); return world.spawns.map(s => dist[Math.floor(s.y / TILE) * MW + Math.floor(s.x / TILE)]); },
    // Test-only shortcuts so a long endless run can be checked quickly.
    debug: {
      setWave: n => { if (run) { run.wave = n - 1; queue = []; zombies = []; nextWave(); } },
      clearWave: () => { if (run) { queue = []; for (const z of zombies.slice()) killZombie(z); zombies = []; } },
      hurt: n => { if (P) { P.inv = 0; hurtPlayer(n, null); } },
      addCoins: n => { if (run) run.coins += n; },
      spawn: (type, x, y) => run && !!spawnZombie(type, x === undefined ? undefined : { x, y }),
      timeScale: k => { timeScale = k; },
    },
  };

  new ResizeObserver(resize).observe($('app'));
  resize();
  openMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
