<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahjong Solitaire</title>
<style>
:root {
  --bg: #121a36;
  --bg-2: #22336a;
  --text: #eef2ff;
  --muted: #a8b6dd;
  --jade: #23a983;
  --jade-dark: #137257;
  --gold: #f5c859;
  --gold-dark: #c99630;
  --red: #d8463a;
  --paper: #fff8ea;
  --ink: #1f2645;
  --ink-muted: #66708f;
  --chip: #0b112640;
  --side: clamp(168px, 19vw, 262px);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(45deg, #ffffff06 0 1px, transparent 1px 22px),
    repeating-linear-gradient(-45deg, #ffffff06 0 1px, transparent 1px 22px),
    radial-gradient(120% 90% at 50% 30%, var(--bg-2), var(--bg) 70%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button, a { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app {
  height: 100%; max-width: 780px; margin: auto;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "hud" "stage" "tools";
  gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}
.top { grid-area: top; display: flex; align-items: center; gap: 8px; min-width: 0; }
.title { flex: 1; min-width: 0; }
h1 { font-size: clamp(20px, 6.2vw, 28px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; white-space: nowrap; }
h1 span { color: var(--gold); }
.sub { margin-top: 2px; font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { flex: 0 0 auto; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff1a; }
.icon-btn svg, .tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:active, .tool:active:not(:disabled) { transform: translateY(2px); }

.hud { grid-area: hud; display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 4px 6px 5px; border-radius: 12px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff12; text-align: center; }
.stat small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat.warn strong { color: #ff9b8f; }
.bar { grid-area: bar; display: none; height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--jade), var(--gold)); transition: width .3s; }

.stage { grid-area: stage; position: relative; min-height: 0; min-width: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; border-radius: 12px; }
.stage canvas:focus { outline: none; }
.stage canvas:focus-visible { outline: 2px solid #f5c85966; outline-offset: -2px; }
.toast { position: absolute; left: 50%; bottom: 8px; translate: -50% 0; max-width: 92%; padding: 7px 14px; border-radius: 99px; background: #070b1ccc; font-size: 13px; font-weight: 700; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

.tools { grid-area: tools; display: flex; gap: 6px; }
.tool { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; padding: 5px 4px; border-radius: 14px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff14; font-size: 12px; font-weight: 800; }
.tool > span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool:disabled { opacity: .4; cursor: default; }
.tool.primary { background: var(--jade); box-shadow: 0 3px 0 var(--jade-dark); }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: #080d22b8; }
.overlay.light { background: #080d2266; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; overscroll-behavior: contain; background: var(--paper); color: var(--ink); border-radius: 26px; padding: 22px 20px; text-align: center; box-shadow: 0 22px 54px #0009; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 27px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.panel h2 span { color: var(--jade-dark); }
.panel .text { margin-top: 8px; color: var(--ink-muted); font-size: 14.5px; line-height: 1.45; }
.panel .emoji { font-size: 42px; line-height: 1.15; }
.panel :focus-visible { outline-color: var(--jade-dark); }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.cta { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 13px 10px; border-radius: 18px; background: var(--jade); color: #fff; font-size: 18px; font-weight: 900; line-height: 1.15; box-shadow: 0 5px 0 var(--jade-dark); }
.cta small, .daily small { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; opacity: .85; }
.cta:active, .daily:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--jade-dark); }
.ghost { width: 100%; padding: 11px; border-radius: 16px; color: var(--ink); font-size: 15px; font-weight: 800; box-shadow: inset 0 0 0 2px #1f264526; }
.ghost:disabled { opacity: .4; cursor: default; }
.ghost[hidden], .cta[hidden] { display: none; }

.panel.menu { width: min(100%, 760px); padding: 18px; text-align: left; }
.phead { display: flex; align-items: center; gap: 12px; }
.logo { flex: 0 0 auto; width: 46px; height: 58px; }
.phead .text { margin-top: 3px; }
.rules { font-size: 13.5px; }
.go { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.daily { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 13px 10px; border-radius: 18px; background: var(--gold); color: #3b2a05; font-size: 17px; font-weight: 900; line-height: 1.15; box-shadow: 0 5px 0 var(--gold-dark); text-align: center; }
.daily.done { background: #f3ecdb; color: var(--ink); box-shadow: 0 5px 0 #ddd1b3; }
.menu h3 { margin-top: 16px; font-size: 12px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-muted); }
.layouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; margin-top: 8px; }
.lay { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 8px 9px 7px; border-radius: 14px; background: #f3ecdb; text-align: left; box-shadow: 0 3px 0 #e2d7bb; }
.lay svg { display: block; width: 100%; height: 50px; margin-bottom: 4px; }
.lay b { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay small { font-size: 11.5px; font-weight: 700; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay .best { color: #8a6a12; }
.lay .best em { font-style: normal; color: var(--gold-dark); letter-spacing: 1px; }
.lay[aria-current="true"] { box-shadow: inset 0 0 0 2.5px var(--jade), 0 3px 0 #e2d7bb; }
.lay:active { transform: translateY(2px); box-shadow: 0 1px 0 #e2d7bb; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; margin-top: 14px; padding: 9px 12px; border-radius: 14px; background: #f3ecdb; font-size: 14px; font-weight: 800; text-align: left; }
.toggle i { position: relative; flex: 0 0 auto; width: 42px; height: 24px; border-radius: 99px; background: #c9c0aa; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px #0004; }
.toggle[aria-pressed="true"] i { background: var(--jade); }
.toggle[aria-pressed="true"] i::after { transform: translateX(18px); }
.keys { margin-top: 10px; font-size: 12px; color: var(--ink-muted); }

.stars { margin-top: 6px; font-size: 30px; letter-spacing: 5px; color: #e4d9bf; min-height: 1.25em; }
.stars b { color: var(--gold); text-shadow: 0 2px 0 var(--gold-dark); display: inline-block; animation: star .4s calc(var(--i) * 150ms + .2s) both cubic-bezier(.3, 1.6, .5, 1); }
@keyframes star { from { transform: scale(0) rotate(-40deg); } }
.big-time { margin-top: 2px; font-size: 32px; font-weight: 900; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; margin-top: 8px; padding: 5px 14px; border-radius: 99px; background: var(--gold); color: #3b2a05; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.fine { margin-top: 10px; font-size: 12px; color: var(--ink-muted); line-height: 1.4; }
.store-link { display: inline-block; margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--jade-dark); text-underline-offset: 4px; line-height: 1.4; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 380px) {
  .app { gap: 6px; padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
  h1 { font-size: 20px; }
  .stat { padding: 3px 3px 4px; }
  .stat small { font-size: 10px; letter-spacing: 0; }
  .stat strong { font-size: 16px; }
  .tool { min-height: 46px; font-size: 11px; }
  .tool svg { width: 20px; height: 20px; }
  .icon-btn { width: 40px; height: 40px; }
  .panel.menu { padding: 14px 12px; }
  .go { gap: 8px; }
  .cta, .daily { padding: 11px 6px; font-size: 16px; }
  .layouts { grid-template-columns: 1fr 1fr; gap: 6px; }
}
@media (max-height: 600px) and (max-aspect-ratio: 5/4) and (min-width: 400px) {
  .tool { min-height: 44px; flex-direction: row; gap: 5px; }
}
@media (max-height: 560px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 16px; border-radius: 22px; }
  .panel h2 { font-size: 23px; }
  .panel .text { margin-top: 5px; font-size: 13.5px; line-height: 1.35; }
  .panel .emoji { font-size: 32px; }
  .stars { font-size: 24px; margin-top: 2px; }
  .big-time { font-size: 26px; }
  .actions { margin-top: 10px; gap: 8px; }
  .cta, .daily { padding: 10px 8px; }
  .ghost { padding: 8px; }
  .store-link { margin-top: 8px; }
  .lay svg { height: 40px; }
}

/* Wide frames: the board takes the full height on the left, HUD and tools move to a side column */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: none; grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto auto auto minmax(0, 1fr); grid-template-areas: "stage top" "stage hud" "stage bar" "stage tools" "stage ."; column-gap: 16px; row-gap: 10px; }
  h1 { white-space: normal; font-size: clamp(20px, 2.3vw, 30px); }
  .sub { font-size: 13px; }
  .top { align-items: flex-start; }
  .hud { flex-direction: column; gap: 6px; }
  .stat { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 7px 12px; text-align: left; }
  .stat small { font-size: 11px; }
  .stat strong { font-size: 20px; }
  .bar { display: block; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tool { min-height: 62px; font-size: 13px; }
  .tool svg { width: 24px; height: 24px; }
  .panel.menu { width: min(100%, 860px); }
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  .app { --side: clamp(160px, 26vw, 220px); row-gap: 6px; column-gap: 10px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  h1 { font-size: 19px; }
  .sub { font-size: 11.5px; margin-top: 1px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 12px; }
  .icon-btn svg { width: 20px; height: 20px; }
  .hud { gap: 4px; }
  .stat { padding: 3px 9px; }
  .stat small { font-size: 10px; letter-spacing: .02em; }
  .stat strong { font-size: 16px; }
  .bar { height: 5px; }
  .tools { gap: 5px; }
  .tool { min-height: 36px; flex-direction: row; gap: 4px; font-size: 11.5px; padding: 3px 4px; border-radius: 11px; }
  .tool svg { width: 18px; height: 18px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px) and (max-width: 700px) {
  .tool svg { display: none; }
  .tool { font-size: 11.5px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 360px) {
  .sub { display: none; }
  .tool > span { font-size: 10.5px; }
}
@media (max-height: 420px) {
  .panel.menu { padding: 10px 14px; }
  .phead .logo { width: 34px; height: 44px; }
  .rules { display: none; }
  .go { margin-top: 8px; }
  .cta, .daily { padding: 8px 6px; font-size: 16px; }
  .menu h3 { margin-top: 10px; }
  .toggle { margin-top: 10px; padding: 6px 10px; }
  .keys { display: none; }
  .panel .emoji { font-size: 26px; }
  .panel h2 { font-size: 21px; }
  .fine { margin-top: 6px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div class="title">
      <h1>Mahjong <span>Solitaire</span></h1>
      <p class="sub" id="layout-name"></p>
    </div>
    <button type="button" class="icon-btn" id="menu" data-i18n-label="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg></button>
  </header>
  <div class="hud">
    <div class="stat"><small data-i18n="time"></small><strong id="time">0:00</strong></div>
    <div class="stat"><small data-i18n="left"></small><strong id="left">0</strong></div>
    <div class="stat" id="pairs-stat"><small data-i18n="pairs"></small><strong id="pairs">0</strong></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div class="stage" id="stage">
    <canvas id="board" tabindex="0" role="application" data-i18n-label="board"></canvas>
    <p class="toast" id="toast" aria-hidden="true"></p>
  </div>
  <div class="tools">
    <button type="button" class="tool" id="undo" aria-keyshortcuts="U"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="undo"></span></button>
    <button type="button" class="tool" id="hint" aria-keyshortcuts="H"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2h5c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3Z"/></svg><span data-i18n="hint"></span></button>
    <button type="button" class="tool" id="shuffle" aria-keyshortcuts="S"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg><span data-i18n="shuffle"></span></button>
    <button type="button" class="tool" id="reset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span data-i18n="restart"></span></button>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel menu" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <div class="phead">
      <svg class="logo" viewBox="0 0 46 58" aria-hidden="true"><rect x="1" y="7" width="38" height="50" rx="7" fill="#137257"/><rect x="4" y="4" width="38" height="50" rx="7" fill="#e6dcc3"/><rect x="7" y="1" width="38" height="50" rx="7" fill="#fffaf0" stroke="#d8ccae"/><text x="26" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#cf2f2f" font-family="'Songti SC','STSong','SimSun','Noto Serif CJK SC','Hiragino Mincho ProN','Yu Mincho',serif">中</text></svg>
      <div>
        <h2 id="start-title">Mahjong <span>Solitaire</span></h2>
        <p class="text" data-i18n="tagline"></p>
      </div>
    </div>
    <p class="text rules" data-i18n="rules"></p>
    <div class="go">
      <button type="button" class="cta" id="play"><span id="play-label"></span><small id="play-sub"></small></button>
      <button type="button" class="daily" id="daily"><span data-i18n="daily"></span><small id="daily-sub"></small></button>
    </div>
    <h3 data-i18n="layouts"></h3>
    <div class="layouts" id="layouts"></div>
    <button type="button" class="toggle" id="dim" aria-pressed="true"><span data-i18n="dim"></span><i aria-hidden="true"></i></button>
    <p class="keys" data-i18n="keys"></p>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🎉</p>
    <h2 id="win-title" data-i18n="won"></h2>
    <p class="stars" id="win-stars" role="img"></p>
    <p class="big-time" id="win-time"></p>
    <p class="text" id="win-detail"></p>
    <p class="badge" id="win-record" data-i18n="record" hidden></p>
    <p class="fine" id="win-rule"></p>
    <div class="actions">
      <button type="button" class="cta" id="next" data-i18n="next"></button>
      <button type="button" class="ghost" id="again"></button>
      <button type="button" class="ghost" id="to-menu" data-i18n="toMenu"></button>
    </div>
    <a class="store-link" href="https://play.google.com/store/apps/details?id=dev.lamian.games.tilematchpuzzle" target="_blank" rel="noopener noreferrer"><span data-i18n="full"></span> ↗</a>
  </div>
</div>

<div class="overlay light" id="stuck" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="stuck-title">
    <p class="emoji" aria-hidden="true">🀄</p>
    <h2 id="stuck-title" data-i18n="stuck"></h2>
    <p class="text" data-i18n="stuckText"></p>
    <div class="actions">
      <button type="button" class="cta" id="stuck-shuffle" data-i18n="shuffle"></button>
      <button type="button" class="ghost" id="stuck-undo" data-i18n="undo"></button>
      <button type="button" class="ghost" id="stuck-reset" data-i18n="restart"></button>
    </div>
  </div>
</div>

<script>
(() => {
  const CN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  const I18N = {
    en: {
      tagline: 'Match pairs of free tiles until the whole stack is cleared.',
      rules: 'A tile is free when nothing lies on top of it and its left or right side is open. Any two flowers match each other, and so do any two seasons.',
      keys: 'Keys: arrows + Enter to pick tiles · H hint · U undo · S shuffle',
      time: 'Time', left: 'Tiles', pairs: 'Free pairs', undo: 'Undo', hint: 'Hint', shuffle: 'Shuffle', restart: 'Restart', menu: 'Layouts',
      play: 'Play', resume: 'Continue', daily: 'Daily puzzle', dailyNew: 'A new layout every day', dailyDone: s => `Solved today · ${s}`,
      layouts: 'Choose a layout', tilesN: n => `${n} tiles`, best: s => `Best ${s}`, noBest: 'Not played yet', dim: 'Dim blocked tiles',
      won: 'Board cleared!', record: 'New best time!', result: (h, s) => `${h} hint${h === 1 ? '' : 's'} · ${s} shuffle${s === 1 ? '' : 's'}`,
      starRule: tm => `★★★ = under ${tm}, no shuffles and at most 3 hints`,
      next: 'Next layout', again: 'New deal', replay: 'Play again', toMenu: 'All layouts',
      stuck: 'No more moves', stuckText: 'There are no free pairs left. Shuffle the remaining tiles or undo a few moves.',
      full: 'Get Mochi Tiles on Google Play',
      dealt: (name, n) => `${name}: ${n} tiles. Match the free pairs.`, matched: n => `Pair removed. ${n} tiles left.`, blocked: 'That tile is blocked.',
      selected: name => `${name} selected.`, hintMsg: (a, b) => `Hint: ${a} and ${b}.`, shuffled: 'Tiles shuffled.', undone: 'Move undone.', restarted: 'Deal restarted.',
      starsLabel: n => `${n} of 3 stars`, board: 'Mahjong board. Arrow keys move between free tiles, Enter or Space selects.', dailyName: name => `Daily · ${name}`,

  // ---- Layouts (tile units; .5 steps allowed). A tile covers 1×1 at layer z. ----
  const R = (x, y, w, h, z) => { const out = []; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) out.push([x + i, y + j, z]); return out; };
  const P = (x, y, z) => [[x, y, z]];
  const LAYOUTS = [
    { id: 'garden', cells: () => [...R(0, 0, 6, 4, 0), ...R(1, 0.5, 4, 3, 1)] },
    { id: 'dragon', cells: () => [...P(-1, 0.5, 0), ...R(0, 0, 4, 2, 0), ...R(3, 2, 3, 2, 0), ...R(5, 4, 4, 2, 0), ...R(8, 2, 3, 2, 0), ...R(10, 0, 4, 2, 0),
      ...R(0.5, 0.5, 3, 1, 1), ...R(3.5, 2.5, 2, 1, 1), ...R(5.5, 4.5, 3, 1, 1), ...R(8.5, 2.5, 2, 1, 1), ...R(10.5, 0.5, 3, 1, 1),
      ...R(1, 0.5, 2, 1, 2), ...R(6, 4.5, 2, 1, 2), ...R(11, 0.5, 2, 1, 2)] },
    { id: 'flower', cells: () => [...R(4, 2, 4, 4, 0), ...R(5, 0, 2, 2, 0), ...R(5, 6, 2, 2, 0), ...R(1, 3, 3, 2, 0), ...R(8, 3, 3, 2, 0),
      ...R(2, 0.5, 2, 2, 0), ...R(8, 0.5, 2, 2, 0), ...R(2, 5.5, 2, 2, 0), ...R(8, 5.5, 2, 2, 0),
      ...R(4.5, 2.5, 3, 3, 1), ...R(1.5, 3.5, 2, 1, 1), ...R(8.5, 3.5, 2, 1, 1), ...P(5.5, 0.5, 1), ...P(5.5, 6.5, 1), ...R(5, 3, 2, 2, 2), ...P(5.5, 3.5, 3)] },
    { id: 'diamond', cells: () => [
      ...[4, 6, 8, 10, 8, 6, 4].flatMap((w, j) => R((10 - w) / 2, j, w, 1, 0)),
      ...[2, 4, 6, 4, 2].flatMap((w, j) => R((10 - w) / 2, j + 1, w, 1, 1)),
      ...[2, 4, 2].flatMap((w, j) => R((10 - w) / 2, j + 2, w, 1, 2)), ...R(4, 3, 2, 1, 3)] },
    { id: 'crab', cells: () => [...R(3, 2, 6, 4, 0), ...R(0, 0, 3, 2, 0), ...R(9, 0, 3, 2, 0), ...R(0, 3, 2, 1, 0), ...R(0, 4.5, 2, 1, 0), ...R(10, 3, 2, 1, 0), ...R(10, 4.5, 2, 1, 0), ...P(4, 1, 0), ...P(7, 1, 0),
      ...R(3.5, 2.5, 5, 3, 1), ...R(0.5, 0.5, 2, 1, 1), ...R(9.5, 0.5, 2, 1, 1), ...R(4.5, 3, 3, 2, 2), ...R(5, 3.5, 2, 1, 3), ...P(5.5, 3.5, 4)] },
    { id: 'arena', cells: () => [...R(2, 0, 8, 1, 0), ...R(2, 6, 8, 1, 0), ...R(1, 1, 2, 1, 0), ...R(9, 1, 2, 1, 0), ...R(1, 5, 2, 1, 0), ...R(9, 5, 2, 1, 0), ...R(0, 2, 2, 3, 0), ...R(10, 2, 2, 3, 0), ...R(4, 2, 4, 3, 0),
      ...R(3, 0, 6, 1, 1), ...R(3, 6, 6, 1, 1), ...R(0, 2, 1, 3, 1), ...R(11, 2, 1, 3, 1), ...R(4.5, 2.5, 3, 2, 1), ...R(4, 0, 4, 1, 2), ...R(4, 6, 4, 1, 2), ...R(5, 3, 2, 1, 2)] },
    { id: 'bridge', cells: () => [...R(0, 0, 3, 6, 0), ...R(10, 0, 3, 6, 0), ...R(3, 2, 7, 2, 0), ...R(0.5, 0.5, 2, 5, 1), ...R(10.5, 0.5, 2, 5, 1), ...R(3, 2.5, 7, 1, 1),
      ...R(1, 1.5, 1, 3, 2), ...R(11, 1.5, 1, 3, 2), ...R(4, 2.5, 5, 1, 2)] },
    { id: 'butterfly', cells: () => [...R(0, 0, 5, 3, 0), ...R(0.5, 3, 4, 3, 0), ...R(7, 0, 5, 3, 0), ...R(7.5, 3, 4, 3, 0), ...R(5, 0.5, 2, 6, 0),
      ...R(1, 0.5, 3, 2, 1), ...R(1.5, 3.5, 2, 2, 1), ...R(8, 0.5, 3, 2, 1), ...R(8.5, 3.5, 2, 2, 1), ...R(5.5, 1, 1, 5, 1),
      ...R(1.5, 1, 2, 1, 2), ...R(8.5, 1, 2, 1, 2), ...R(5.5, 1.5, 1, 4, 2), ...P(5.5, 3, 3)] },
    { id: 'cross', cells: () => [...R(4, 0, 4, 8, 0), ...R(0, 2, 4, 4, 0), ...R(8, 2, 4, 4, 0), ...R(1, 3, 10, 2, 1), ...R(5, 1, 2, 2, 1), ...R(5, 5, 2, 2, 1),
      ...R(3, 3, 6, 2, 2), ...R(5, 2, 2, 1, 2), ...R(5, 5, 2, 1, 2), ...R(5, 3, 2, 2, 3)] },
    { id: 'fortress', cells: () => [...R(0, 0, 12, 2, 0), ...R(0, 5, 12, 2, 0), ...R(0, 2, 2, 3, 0), ...R(10, 2, 2, 3, 0), ...R(4, 2.5, 4, 2, 0),
      ...R(0, 0, 2, 2, 1), ...R(10, 0, 2, 2, 1), ...R(0, 5, 2, 2, 1), ...R(10, 5, 2, 2, 1), ...R(3, 0, 6, 1, 1), ...R(3, 6, 6, 1, 1), ...R(4, 2.5, 4, 2, 1),
      ...P(0.5, 0.5, 2), ...P(10.5, 0.5, 2), ...P(0.5, 5.5, 2), ...P(10.5, 5.5, 2), ...R(5, 3, 2, 1, 2), ...P(0.5, 0.5, 3), ...P(10.5, 0.5, 3), ...P(0.5, 5.5, 3), ...P(10.5, 5.5, 3)] },
    { id: 'pyramid', cells: () => [...R(0, 0, 10, 6, 0), ...R(1, 1, 8, 4, 1), ...R(2, 1.5, 6, 3, 2), ...R(3, 2, 4, 2, 3), ...R(4, 2.5, 2, 1, 4)] },
    { id: 'towers', cells: () => [...R(0, 0, 4, 6, 0), ...R(8, 0, 4, 6, 0), ...R(4, 2, 4, 2, 0), ...R(0.5, 0.5, 3, 5, 1), ...R(8.5, 0.5, 3, 5, 1), ...R(4, 2.5, 4, 1, 1),
      ...R(1, 1, 2, 4, 2), ...R(9, 1, 2, 4, 2), ...R(1, 1.5, 2, 3, 3), ...R(9, 1.5, 2, 3, 3), ...R(1.5, 2, 1, 2, 4), ...R(9.5, 2, 1, 2, 4)] },
    { id: 'stairs', cells: () => [...R(0, 0, 10, 5, 0), ...R(2, 0, 8, 5, 1), ...R(4, 0, 6, 5, 2), ...R(6, 0, 4, 5, 3)] },
    { id: 'turtle', cells: () => [...R(1, 0, 12, 1, 0), ...R(3, 1, 8, 1, 0), ...R(2, 2, 10, 1, 0), ...R(1, 3, 12, 2, 0), ...R(2, 5, 10, 1, 0), ...R(3, 6, 8, 1, 0), ...R(1, 7, 12, 1, 0),
      ...P(0, 3.5, 0), ...P(13, 3.5, 0), ...P(14, 3.5, 0), ...R(4, 1, 6, 6, 1), ...R(5, 2, 4, 4, 2), ...R(6, 3, 2, 2, 3), ...P(6.5, 3.5, 4)] },
  ];
  const prepared = new Map();

  // Positions in half-tile units; neighbour lists make the "free tile" test cheap.
  function prepare(index) {
    if (prepared.has(index)) return prepared.get(index);
    const def = LAYOUTS[index];
    const raw = def.cells().map(([x, y, z]) => ({ x: Math.round(x * 2), y: Math.round(y * 2), z }));
    const minX = Math.min(...raw.map(p => p.x)), minY = Math.min(...raw.map(p => p.y));
    const pos = raw.map(p => ({ x: p.x - minX, y: p.y - minY, z: p.z }));
    const n = pos.length, idx = [...pos.keys()];
    const overlaps = (a, b) => Math.abs(a.x - b.x) < 2 && Math.abs(a.y - b.y) < 2;
    const L = {
      index, id: def.id, pos, n,
      left: pos.map(p => idx.filter(j => pos[j].z === p.z && pos[j].x === p.x - 2 && Math.abs(pos[j].y - p.y) < 2)),
      right: pos.map(p => idx.filter(j => pos[j].z === p.z && pos[j].x === p.x + 2 && Math.abs(pos[j].y - p.y) < 2)),
      above: pos.map(p => idx.filter(j => pos[j].z > p.z && overlaps(pos[j], p))),
      below: pos.map(p => pos.filter(q => q.z < p.z && overlaps(q, p)).length),
      spanX: Math.max(...pos.map(p => p.x)) + 2, spanY: Math.max(...pos.map(p => p.y)) + 2, maxZ: Math.max(...pos.map(p => p.z)),

    L.order = idx.slice().sort((a, b) => pos[a].z - pos[b].z || (pos[a].y - pos[a].x) - (pos[b].y - pos[b].x) || pos[a].y - pos[b].y);
    L.rank = new Int32Array(n); L.order.forEach((i, r) => { L.rank[i] = r; });
    prepared.set(index, L);

  }

  // ---- Tiles: 0–8 dots, 9–17 bamboo, 18–26 characters, 27–30 winds, 31–33 dragons, 34–37 flowers, 38–41 seasons ----
  const groupOf = k => (k < 34 ? k : k < 38 ? 34 : 38);
  function tileName(k) {
    if (k < 9) return t.dots(k + 1);
    if (k < 18) return t.bamboo(k - 8);
    if (k < 27) return t.chars(k - 17);
    if (k < 31) return t.winds[k - 27];
    if (k < 34) return t.dragons[k - 31];
    if (k < 38) return t.flowers[k - 34];
    return t.seasons[k - 38];
  }

  // Whole sets of four first, so smaller layouts still feel like real mahjong.
  function pairPool(count, rng) {
    const groups = [];
    for (let k = 0; k < 34; k++) groups.push([[k, k], [k, k]]);
    const fl = shuffleArr([34, 35, 36, 37], rng), se = shuffleArr([38, 39, 40, 41], rng);
    groups.push([[fl[0], fl[1]], [fl[2], fl[3]]], [[se[0], se[1]], [se[2], se[3]]]);
    shuffleArr(groups, rng);
    const pairs = [];
    for (const g of groups) for (const p of g) if (pairs.length < count) pairs.push(p);
    return pairs;
  }

  // Reverse placement: repeatedly take two tiles that are free at the same moment. Playing those pairs in
  // that order always clears the board, so every deal (and every successful shuffle) is solvable.
  function removalPlan(L, alive, rng) {
    for (let attempt = 0; attempt < 80; attempt++) {
      const live = alive.slice(); let count = live.reduce((a, b) => a + b, 0); const plan = [];
      const isFree = i => !L.above[i].some(j => live[j]) && (!L.left[i].some(j => live[j]) || !L.right[i].some(j => live[j]));

      if (!count) return plan;
    }
    return null;
  }

  function deal(L, rng) {
    const plan = removalPlan(L, new Uint8Array(L.n).fill(1), rng);
    const pairs = pairPool(L.n / 2, rng), faces = new Array(L.n).fill(0);
    plan.forEach(([a, b], i) => { const [f1, f2] = pairs[i]; const flip = rng() < 0.5; faces[a] = flip ? f2 : f1; faces[b] = flip ? f1 : f2; });
    return { faces, plan };
  }

  // ---- Game state ----
  let G = null;
  let dimBlocked = read(STORE.dim, true) !== false;
  let keyboardMode = false;
  const par = n => n * 4000;

  function makeGame(index, faces, daily) {
    const L = prepare(index);
    return { L, daily, init: faces.slice(), faces: faces.slice(), alive: new Uint8Array(L.n).fill(1), free: new Uint8Array(L.n), left: L.n, pairCount: 0, hist: [], sel: -1, hint: null, hintAt: 0, cursor: -1, elapsed: 0, started: false, over: false, hints: 0, shuffles: 0, dealAt: performance.now(), plan: null, fx: [], shake: null };
  }

  function dailyIndex(key) {
    const pool = LAYOUTS.map((_, i) => i).filter(i => prepare(i).n >= 72);
    return pool[hashStr('layout-' + key) % pool.length];
  }

  function newGame(index, daily = null) {
    const L = prepare(index);
    const rng = mulberry32(daily ? hashStr('mahjong-' + daily) : (Math.random() * 4294967296) >>> 0);
    const { faces, plan } = deal(L, rng);
    G = makeGame(index, faces, daily);
    G.plan = plan; G.plan0 = plan;
    write(STORE.last, L.id);
    afterDeal();
    els.announcer.textContent = t.dealt(layoutTitle(), L.n);
  }

  function restartGame() {
    if (!G) return;
    const { L, init, daily, plan0 } = G;
    G = makeGame(L.index, init, daily);
    G.plan = G.plan0 = plan0;
    afterDeal();
    els.announcer.textContent = t.restarted;
  }

  function afterDeal() {
    hideOverlays();
    refreshState();
    layoutView();
    saveGame();
    requestDraw();
  }

  const layoutTitle = () => (G.daily ? t.dailyName(t.layoutNames[G.L.index]) : t.layoutNames[G.L.index]);

  function isFree(i) {
    const { L, alive } = G;
    return !L.above[i].some(j => alive[j]) && (!L.left[i].some(j => alive[j]) || !L.right[i].some(j => alive[j]));
  }

  function freeByGroup() {
    const groups = new Map();
    for (let i = 0; i < G.L.n; i++) if (G.alive[i] && G.free[i]) { const g = groupOf(G.faces[i]); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(i); }
    return groups;
  }

  function refreshState() {
    for (let i = 0; i < G.L.n; i++) G.free[i] = G.alive[i] && isFree(i) ? 1 : 0;
    let pairs = 0;
    for (const list of freeByGroup().values()) pairs += list.length * (list.length - 1) / 2;
    G.pairCount = pairs;
    if (G.cursor >= 0 && !(G.alive[G.cursor] && G.free[G.cursor])) G.cursor = nearestFree(G.cursor);
    updateHud();
  }

  function updateHud() {
    els.left.textContent = String(G.left);
    els.pairs.textContent = String(G.pairCount);
    els.pairsStat.classList.toggle('warn', G.left > 0 && G.pairCount <= 1);
    els.bar.style.width = `${(1 - G.left / G.L.n) * 100}%`;
    els.layoutName.textContent = `${layoutTitle()} · ${t.tilesN(G.L.n)}`;
    els.undo.disabled = !G.hist.length || G.over;
    els.hint.disabled = els.shuffle.disabled = G.over || !G.left;
    renderTime();
  }

  function renderTime() { els.time.textContent = fmt(G ? G.elapsed : 0); }

  // ---- Moves ----
  function onTile(i) {
    if (!G || G.over || overlayOpen()) return;
    G.started = true;
    if (!G.free[i]) {
      G.shake = { i, at: performance.now() };
      toast(t.blocked);
      els.announcer.textContent = t.blocked;
      requestDraw();
      return;
    }
    if (G.sel === i) { G.sel = -1; requestDraw(); return; }
    if (G.sel >= 0 && groupOf(G.faces[G.sel]) === groupOf(G.faces[i])) { removePair(G.sel, i); return; }
    G.sel = i;
    els.announcer.textContent = t.selected(tileName(G.faces[i]));
    requestDraw();
  }

  function removePair(a, b) {
    const now = performance.now();
    for (const i of [a, b]) { G.alive[i] = 0; G.fx.push({ type: 'vanish', i, face: G.faces[i], at: now }); burst(i, now); }
    G.left -= 2;
    G.hist.push([a, b]);
    G.sel = -1; G.hint = null;
    if (G.plan) G.plan = G.plan[0] && ((G.plan[0][0] === a && G.plan[0][1] === b) || (G.plan[0][0] === b && G.plan[0][1] === a)) ? G.plan.slice(1) : null;
    refreshState();
    saveGame();
    requestDraw();
    if (!G.left) return win();
    els.announcer.textContent = t.matched(G.left);
    if (!G.pairCount) setTimeout(() => { if (G && !G.over && !G.pairCount && !overlayOpen()) showStuck(); }, reducedMotion.matches ? 0 : 420);
  }

  function undo() {
    if (!G || G.over || !G.hist.length) return;
    const step = G.hist.pop();
    if (Array.isArray(step)) { for (const i of step) G.alive[i] = 1; G.left += 2; }
    else G.faces = step.faces;
    G.plan = null; G.sel = -1; G.hint = null; G.fx = [];
    els.stuck.hidden = true;
    refreshState();
    saveGame();
    requestDraw();
    els.announcer.textContent = t.undone;
    toast(t.undone);
  }

  function shuffleTiles() {
    if (!G || G.over || G.left < 2) return;
    G.started = true;
    const live = []; for (let i = 0; i < G.L.n; i++) if (G.alive[i]) live.push(i);
    const rng = Math.random;
    const byGroup = new Map();
    for (const i of live) { const f = G.faces[i], g = groupOf(f); if (!byGroup.has(g)) byGroup.set(g, []); byGroup.get(g).push(f); }
    const pairs = [];
    for (const list of byGroup.values()) { shuffleArr(list, rng); for (let k = 0; k + 1 < list.length; k += 2) pairs.push([list[k], list[k + 1]]); }
    shuffleArr(pairs, rng);
    G.hist.push({ faces: G.faces.slice() });
    const plan = removalPlan(G.L, G.alive, rng);
    const faces = G.faces.slice();
    if (plan) plan.forEach(([a, b], k) => { faces[a] = pairs[k][0]; faces[b] = pairs[k][1]; });
    else { const pool = shuffleArr(live.map(i => G.faces[i]), rng); live.forEach((i, k) => { faces[i] = pool[k]; }); }
    G.faces = faces; G.plan = plan; G.shuffles += 1; G.sel = -1; G.hint = null;
    G.fx.push({ type: 'shuffle', at: performance.now() });
    els.stuck.hidden = true;
    refreshState();
    saveGame();
    requestDraw();
    els.announcer.textContent = t.shuffled;
    toast(t.shuffled);
    if (!G.pairCount) setTimeout(() => { if (G && !G.over && !G.pairCount && !overlayOpen()) showStuck(); }, 500);
  }

  // Hint: a pair that keeps the board solvable when a short search can prove it, otherwise the best-looking pair.
  function candidateMoves(alive, free, faces, L) {
    const groups = new Map(), remain = new Map();
    for (let i = 0; i < L.n; i++) {
      if (!alive[i]) continue;
      const g = groupOf(faces[i]);
      remain.set(g, (remain.get(g) || 0) + 1);
      if (free[i]) { if (!groups.has(g)) groups.set(g, []); groups.get(g).push(i); }
    }
    const moves = [];
    for (const [g, list] of groups) {
      if (list.length < 2) continue;
      const all = list.length === remain.get(g);
      if (all && list.length % 2 === 0) { moves.push({ a: list[0], b: list[1], score: 1000 }); continue; }
      for (let x = 0; x < list.length; x++) for (let y = x + 1; y < list.length; y++) {
        const a = list[x], b = list[y];
        const unblock = L.below[a] + L.below[b] + (L.left[a].length + L.right[a].length + L.left[b].length + L.right[b].length) * 0.5;
        moves.push({ a, b, score: unblock * 10 + L.pos[a].z + L.pos[b].z });
      }
    }
    return moves.sort((m, n) => n.score - m.score);
  }

  function searchHint(budget) {
    const L = G.L, alive = G.alive.slice(), faces = G.faces;
    const free = new Uint8Array(L.n);
    const freeOf = i => !L.above[i].some(j => alive[j]) && (!L.left[i].some(j => alive[j]) || !L.right[i].some(j => alive[j]));
    const dead = new Set();
    let nodes = 0;
    const solve = count => {
      if (!count) return true;
      if (++nodes > budget) throw new Error('budget');
      const key = alive.join('');
      if (dead.has(key)) return false;
      for (let i = 0; i < L.n; i++) free[i] = alive[i] && freeOf(i) ? 1 : 0;
      for (const m of candidateMoves(alive, free, faces, L)) {
        alive[m.a] = alive[m.b] = 0;
        const ok = solve(count - 2);
        alive[m.a] = alive[m.b] = 1;
        if (ok) return true;
      }
      dead.add(key);
      return false;
    };
    try {
      for (let i = 0; i < L.n; i++) free[i] = alive[i] && freeOf(i) ? 1 : 0;
      for (const m of candidateMoves(alive, free.slice(), faces, L)) {
        alive[m.a] = alive[m.b] = 0;
        const ok = solve(G.left - 2);
        alive[m.a] = alive[m.b] = 1;
        if (ok) return m;
      }
    } catch { /* search budget exhausted */ }
    return null;
  }

  function showHint() {
    if (!G || G.over || !G.left) return;
    if (!G.pairCount) { showStuck(); return; }
    let move = null;
    if (G.plan && G.plan.length) { const [a, b] = G.plan[0]; move = { a, b }; }
    if (!move) move = searchHint(G.left > 90 ? 1500 : 4000);
    if (!move) move = candidateMoves(G.alive, G.free, G.faces, G.L)[0];
    G.started = true;
    G.hints += 1;

    }
    if (k < 38) return drawFlower(x, k - 34);
    return drawSeason(x, k - 38);
  }

  // ---- Frame loop (only runs while something animates) ----
  let rafId = 0, lastFrame = 0;
  const particles = [];
  function requestDraw() { if (!rafId) rafId = requestAnimationFrame(frame); }
  function frame(now) {
    rafId = 0;
    const dt = Math.min(50, lastFrame ? now - lastFrame : 16);
    lastFrame = now;
    for (const p of particles) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.rot += p.spin * dt; }
    for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
    draw(now);
    if (busyAnimating(now)) requestDraw(); else lastFrame = 0;
  }
  const dealMs = () => (reducedMotion.matches ? 0 : Math.min(5, 700 / G.L.n) * G.L.n + 280);
  function busyAnimating(now) {
    if (!G) return false;
    G.fx = G.fx.filter(f => now - f.at < 360);
    if (G.shake && now - G.shake.at > 320) G.shake = null;
    return particles.length > 0 || G.fx.length > 0 || !!G.shake || (G.hint && !reducedMotion.matches) || now - G.dealAt < dealMs();
  }

  function burst(i, now) {
    if (reducedMotion.matches) return;
    const [fx, fy] = facePos(i);
    const cx = fx + V.fw / 2, cy = fy + V.fh / 2;
    for (let k = 0; k < 9; k++) {
      const a = Math.random() * Math.PI * 2, sp = (0.08 + Math.random() * 0.16) * V.dpr;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.05 * V.dpr, g: 0.0004 * V.dpr, life: 420 + Math.random() * 200, max: 620, size: (2 + Math.random() * 2.5) * V.dpr, color: k % 3 ? '#f5c859' : '#7ff0c8', rot: 0, spin: 0, at: now });
    }
  }
  function confetti() {
    if (reducedMotion.matches) return;
    const colors = ['#f5c859', '#23a983', '#d8463a', '#5b8cff', '#f29bb6'];
    for (let k = 0; k < 110; k++) {
      particles.push({ x: Math.random() * V.cw, y: -Math.random() * V.ch * 0.4, vx: (Math.random() - 0.5) * 0.12 * V.dpr, vy: (0.1 + Math.random() * 0.15) * V.dpr, g: 0.00012 * V.dpr, life: 1800 + Math.random() * 900, max: 2700, size: (4 + Math.random() * 4) * V.dpr, color: colors[k % colors.length], rot: Math.random() * 6, spin: (Math.random() - 0.5) * 0.02, rect: true });
    }
    requestDraw();
  }

  function drawTile(i, fx, fy, face) {
    ctx.drawImage(V.body.c, fx - V.t - V.body.pad, fy - V.body.pad);
    ctx.drawImage(V.faces[face], fx, fy);
  }

  function draw(now = performance.now()) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, V.cw, V.ch);
    if (!G || !V.body) return;
    const { L } = G;
    const spread = reducedMotion.matches ? 0 : Math.min(5, 700 / L.n);
    const sinceDeal = now - G.dealAt;
    const pulse = reducedMotion.matches ? 1 : 0.55 + 0.45 * Math.sin((now - G.hintAt) / 170);
    const showCursor = keyboardMode && document.activeElement === els.canvas;
    for (const i of L.order) {
      if (!G.alive[i]) continue;
      let [fx, fy] = facePos(i);
      let alpha = 1;
      if (spread) {
        const d = sinceDeal - L.rank[i] * spread;
        if (d < 0) continue;
        if (d < 260) { const p = d / 260; alpha = p; fy -= (1 - p) * (1 - p) * V.H * 0.5; }
      }
      if (G.shake && G.shake.i === i) fx += Math.sin((now - G.shake.at) / 22) * V.W * 0.07 * Math.max(0, 1 - (now - G.shake.at) / 320);
      ctx.globalAlpha = alpha;
      drawTile(i, fx, fy, G.faces[i]);
      const blocked = !G.free[i];
      if (blocked && dimBlocked) { rr(ctx, fx, fy, V.fw, V.fh, V.r); ctx.fillStyle = 'rgba(16, 24, 56, .3)'; ctx.fill(); }
      if (G.hint && G.hint.includes(i)) {
        rr(ctx, fx, fy, V.fw, V.fh, V.r);
        ctx.fillStyle = `rgba(35, 169, 131, ${0.22 * pulse})`; ctx.fill();
        ctx.lineWidth = Math.max(2, V.W * 0.07); ctx.strokeStyle = `rgba(28, 200, 150, ${0.5 + 0.5 * pulse})`; ctx.stroke();
      }
      if (G.sel === i) {
        rr(ctx, fx, fy, V.fw, V.fh, V.r);
        ctx.fillStyle = 'rgba(255, 196, 64, .36)'; ctx.fill();
        ctx.lineWidth = Math.max(2, V.W * 0.08); ctx.strokeStyle = '#f2a516'; ctx.stroke();
      }
      if (showCursor && G.cursor === i) {
        const lw = Math.max(2, V.W * 0.07);
        rr(ctx, fx - lw / 2, fy - lw / 2, V.fw + lw, V.fh + lw, V.r + lw / 2);
        ctx.lineWidth = lw; ctx.strokeStyle = '#4f8dff'; ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    for (const f of G.fx) {
      const p = Math.min(1, (now - f.at) / 340);
      if (f.type === 'vanish') {
        const [fx, fy] = facePos(f.i);
        const sc = 1 + p * 0.25, cx = fx + V.fw / 2, cy = fy + V.fh / 2 - p * V.H * 0.35;
        ctx.save(); ctx.globalAlpha = 1 - p; ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-V.fw / 2, -V.fh / 2);
        drawTile(f.i, 0, 0, f.face);
        rr(ctx, 0, 0, V.fw, V.fh, V.r); ctx.fillStyle = 'rgba(255, 220, 120, .45)'; ctx.fill();
        ctx.restore();
      } else if (f.type === 'shuffle') {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.25 * (1 - p)})`; ctx.fillRect(0, 0, V.cw, V.ch);
      }
    }
    for (const q of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, q.life / 300));
      ctx.fillStyle = q.color;
      if (q.rect) { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.size / 2, -q.size / 4, q.size, q.size / 2); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  // Topmost tile under a point (device pixels), including its visible side.
  function hitTest(px, py) {
    if (!G) return -1;
    const order = G.L.order;
    for (let k = order.length - 1; k >= 0; k--) {
      const i = order[k];
      if (!G.alive[i]) continue;
      const [fx, fy] = facePos(i);
      if (px >= fx - V.t && px <= fx + V.fw && py >= fy && py <= fy + V.fh + V.t) return i;
    }
    return -1;
  }

  // ---- Keyboard cursor ----
  function nearestFree(from) {
    const list = []; for (let i = 0; i < G.L.n; i++) if (G.alive[i] && G.free[i]) list.push(i);
    if (!list.length) return -1;
    const ref = from >= 0 ? G.L.pos[from] : { x: G.L.spanX / 2, y: G.L.spanY / 2 };
    return list.reduce((best, i) => { const p = G.L.pos[i], q = G.L.pos[best]; return (p.x - ref.x) ** 2 + (p.y - ref.y) ** 2 < (q.x - ref.x) ** 2 + (q.y - ref.y) ** 2 ? i : best; }, list[0]);
  }
  function moveCursor(dx, dy) {
    if (G.cursor < 0 || !G.free[G.cursor]) { G.cursor = nearestFree(G.cursor); announceCursor(); return; }
    const cur = G.L.pos[G.cursor];
    let best = -1, bestScore = Infinity;
    for (let i = 0; i < G.L.n; i++) {
      if (!G.alive[i] || !G.free[i] || i === G.cursor) continue;
      const p = G.L.pos[i], ddx = p.x - cur.x + (p.z - cur.z) * 0.3, ddy = p.y - cur.y - (p.z - cur.z) * 0.3;
      const along = ddx * dx + ddy * dy;
      if (along <= 0.2) continue;
      const score = along + Math.abs(ddx * dy + ddy * dx) * 2.2;
      if (score < bestScore) { bestScore = score; best = i; }
    }
    if (best >= 0) { G.cursor = best; announceCursor(); }
  }
  function announceCursor() {
    if (G.cursor >= 0) els.announcer.textContent = tileName(G.faces[G.cursor]);
    requestDraw();
  }

  // ---- UI ----
  let toastTimer = 0;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1400);
  }
  const overlays = () => [els.start, els.win, els.stuck];
  const overlayOpen = () => overlays().some(o => !o.hidden);
  function hideOverlays() { for (const o of overlays()) o.hidden = true; }

  function previewSvg(L) {
    const h = L.maxZ * 0.5;
    const rects = L.order.map(i => {
      const p = L.pos[i];
      const fill = ['#e2d6b6', '#efe5ca', '#f8f1df', '#fffaf0', '#ffffff'][Math.min(4, p.z)];
      return `<rect x="${(p.x * 1.5 + p.z * 0.5).toFixed(1)}" y="${(p.y * 2 - p.z * 0.5 + h).toFixed(1)}" width="2.8" height="3.8" rx=".5" fill="${fill}" stroke="#137257" stroke-width=".3"/>`;
    }).join('');
    return `<svg viewBox="-.2 -.2 ${(L.spanX * 1.5 + (L.maxZ + 1) * 0.5).toFixed(1)} ${(L.spanY * 2 + (L.maxZ + 1) * 0.5).toFixed(1)}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${rects}</svg>`;
  }

  function buildMenu() {
    els.layouts.innerHTML = '';
    LAYOUTS.forEach((def, index) => {
      const L = prepare(index);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'lay'; b.dataset.index = String(index);
      b.innerHTML = `${previewSvg(L)}<b></b><small class="count"></small><small class="best"></small>`;
      b.querySelector('b').textContent = t.layoutNames[index];
      b.querySelector('.count').textContent = t.tilesN(L.n);
      b.addEventListener('click', () => { newGame(index); focusBoard(); });
      els.layouts.append(b);
    });
  }

  function renderMenu() {
    const stats = read(STORE.stats, {});
    for (const b of els.layouts.children) {
      const index = +b.dataset.index, st = stats[LAYOUTS[index].id];
      const best = b.querySelector('.best');
      if (st && st.wins) best.innerHTML = `<em>${'★'.repeat(st.stars)}${'☆'.repeat(3 - st.stars)}</em> ${t.best(fmt(st.best))}`;
      else best.textContent = t.noBest;
      b.setAttribute('aria-label', `${t.layoutNames[index]}, ${t.tilesN(prepare(index).n)}, ${st && st.wins ? `${t.starsLabel(st.stars)}, ${t.best(fmt(st.best))}` : t.noBest}`);
      b.setAttribute('aria-current', String(!!G && !G.daily && G.L.index === index));
    }
    const key = todayKey(), day = read(STORE.daily, {})[key];
    const dName = t.layoutNames[dailyIndex(key)];
    els.daily.classList.toggle('done', !!day);
    els.dailySub.textContent = day ? t.dailyDone(fmt(day.best)) : `${dName} · ${t.dailyNew}`;
    const resumable = G && !G.over && (G.hist.length || G.elapsed > 0);
    els.playLabel.textContent = resumable ? t.resume : t.play;
    els.playSub.textContent = G ? `${layoutTitle()} · ${t.tilesN(G.L.n)}` : '';
    els.dim.setAttribute('aria-pressed', String(dimBlocked));
  }

  function showMenu() {
    renderMenu();
    els.win.hidden = els.stuck.hidden = true;
    els.start.hidden = false;
    saveNow();
    els.play.focus({ preventScroll: true });
  }

  function focusBoard() { els.canvas.focus({ preventScroll: true }); }

  function nextLayout() {
    const index = (G.L.index + 1) % LAYOUTS.length;
    newGame(index);
    focusBoard();
  }

  // ---- Timer ----
  let lastTick = performance.now();
  function tick() {
    const now = performance.now();
    const dt = Math.min(1000, now - lastTick);
    lastTick = now;
    if (G && G.started && !G.over && !document.hidden && !overlayOpen()) {
      G.elapsed += dt;
      renderTime();
      if (Math.floor(G.elapsed / 5000) !== Math.floor((G.elapsed - dt) / 5000)) saveGame();
    }
  }
  setInterval(tick, 250);
  document.addEventListener('visibilitychange', () => { lastTick = performance.now(); if (document.hidden) saveNow(); });
  window.addEventListener('pagehide', saveNow);

  // ---- Input ----
  els.canvas.addEventListener('pointerdown', event => {
    keyboardMode = false;
    if (!G || overlayOpen()) return;
    const rect = els.canvas.getBoundingClientRect();
    const i = hitTest((event.clientX - rect.left) * V.dpr, (event.clientY - rect.top) * V.dpr);
    if (i >= 0) onTile(i);
    else if (G.sel >= 0) { G.sel = -1; requestDraw(); }
  });
  document.addEventListener('pointerdown', () => { keyboardMode = false; }, true);
  els.canvas.addEventListener('focus', () => { if (G && keyboardMode && G.cursor < 0) G.cursor = nearestFree(-1); requestDraw(); });
  els.canvas.addEventListener('blur', () => requestDraw());

  const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const HOTKEYS = { h: showHint, u: undo, z: undo, s: shuffleTiles };
  document.addEventListener('keydown', event => {
    keyboardMode = true;
    if (!G || overlayOpen() || event.altKey) return;
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); undo(); return; }
    if (event.ctrlKey || event.metaKey) return;
    if (ARROWS[event.key]) {
      event.preventDefault();
      if (document.activeElement !== els.canvas) focusBoard();
      moveCursor(...ARROWS[event.key]);
      return;
    }
    if ((event.key === 'Enter' || event.key === ' ') && document.activeElement === els.canvas) {
      event.preventDefault();
      if (G.cursor < 0) G.cursor = nearestFree(-1);
      if (G.cursor >= 0) onTile(G.cursor);
      return;
    }
    const action = HOTKEYS[event.key.toLowerCase()];
    if (action) { event.preventDefault(); action(); }
  });

  els.undo.addEventListener('click', undo);
  els.hint.addEventListener('click', showHint);
  els.shuffle.addEventListener('click', shuffleTiles);
  els.restart.addEventListener('click', restartGame);
  els.menu.addEventListener('click', showMenu);
  els.play.addEventListener('click', () => {
    if (!G || G.over) { newGame(G ? G.L.index : LAYOUTS.length - 1); }
    hideOverlays();
    requestDraw();
    if (G && !G.pairCount && G.left) showStuck();
    else focusBoard();
  });
  els.daily.addEventListener('click', () => { const key = todayKey(); newGame(dailyIndex(key), key); focusBoard(); });
  els.dim.addEventListener('click', () => { dimBlocked = !dimBlocked; write(STORE.dim, dimBlocked); els.dim.setAttribute('aria-pressed', String(dimBlocked)); requestDraw(); });
  els.next.addEventListener('click', nextLayout);
  els.again.addEventListener('click', () => { if (G.daily) restartGame(); else newGame(G.L.index); focusBoard(); });
  els.toMenu.addEventListener('click', showMenu);
  els.stuckShuffle.addEventListener('click', () => { els.stuck.hidden = true; shuffleTiles(); focusBoard(); });
  els.stuckUndo.addEventListener('click', () => { els.stuck.hidden = true; undo(); focusBoard(); });
  els.stuckRestart.addEventListener('click', () => { els.stuck.hidden = true; restartGame(); focusBoard(); });

  new ResizeObserver(() => { layoutView(); requestDraw(); }).observe(els.stage);

  // Read-only hooks for automated tests.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__mahjong = {
    state: () => G && { layout: G.L.id, daily: G.daily, left: G.left, total: G.L.n, pairs: G.pairCount, elapsed: G.elapsed, hints: G.hints, shuffles: G.shuffles, over: G.over, sel: G.sel, started: G.started, history: G.hist.length, overlay: overlays().find(o => !o.hidden)?.id || null, tile: V.W / V.dpr },
    layouts: () => LAYOUTS.map((d, i) => { const L = prepare(i); return { id: d.id, n: L.n, spanX: L.spanX / 2, spanY: L.spanY / 2, maxZ: L.maxZ }; }),
    plan: () => (G && G.plan ? G.plan.map(p => p.slice()) : null),
    freePairs: () => { if (!G) return []; const out = []; for (const list of freeByGroup().values()) for (let a = 0; a < list.length; a++) for (let b = a + 1; b < list.length; b++) out.push([list[a], list[b]]); return out; },
    point: i => { const [fx, fy] = facePos(i); const r = els.canvas.getBoundingClientRect(); return { x: r.left + (fx + V.fw / 2) / V.dpr, y: r.top + (fy + V.fh / 2) / V.dpr }; },
    pos: () => G && G.L.pos.map(p => ({ ...p })),
    hit: (x, y) => { const r = els.canvas.getBoundingClientRect(); return hitTest((x - r.left) * V.dpr, (y - r.top) * V.dpr); },
    faces: () => G && G.faces.slice(),
    alive: () => G && Array.from(G.alive),
    free: () => G && Array.from(G.free),
    verify: (index, seeds = 20) => {
      const L = prepare(index); let ok = 0;
      for (let s = 1; s <= seeds; s++) {
        const { faces, plan } = deal(L, mulberry32(s * 7919));
        const alive = new Uint8Array(L.n).fill(1);
        const free = i => !L.above[i].some(j => alive[j]) && (!L.left[i].some(j => alive[j]) || !L.right[i].some(j => alive[j]));
        let good = !!plan && plan.length * 2 === L.n;
        for (const [a, b] of plan || []) { if (!free(a) || !free(b) || groupOf(faces[a]) !== groupOf(faces[b])) { good = false; break; } alive[a] = alive[b] = 0; }
        const counts = new Map(); faces.forEach(f => counts.set(groupOf(f), (counts.get(groupOf(f)) || 0) + 1));
        if ([...counts.values()].some(c => c % 2)) good = false;
        if (good) ok += 1;
      }
      return ok;
    },
  };

  buildMenu();
  if (!restoreGame()) {
    const last = LAYOUTS.findIndex(l => l.id === read(STORE.last, 'turtle'));
    newGame(last >= 0 ? last : LAYOUTS.length - 1);
  } else {
    G.dealAt = performance.now();
    layoutView();
  }
  showMenu();
  requestDraw();
})();
</script>
</body>
</html>
