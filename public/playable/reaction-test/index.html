<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reaction Test</title>
<style>
:root {
  --bg: #15132c;
  --panel: #221f45;
  --panel-2: #2c2858;
  --text: #f6f4ff;
  --muted: #a9a4cf;
  --accent: #ffd23f;
  --blue: #4c6ef5;
  --red: #ef4b5b;
  --green: #2fc77e;
  --orange: #ff9a3c;
  --purple: #9b6bff;
  --teal: #25c2c9;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: radial-gradient(ellipse at top, #2a2560, var(--bg) 65%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 10px; min-height: 40px; }
h1 { flex: 1; min-width: 0; font-size: clamp(24px, 7vw, 32px); font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
h1 span { color: var(--accent); }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: var(--panel-2); font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 #0d0b20; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0d0b20; }

.hub { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.tagline { font-size: 15px; color: var(--muted); line-height: 1.45; text-align: center; margin-bottom: 4px; }
.card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: var(--panel); text-align: left; box-shadow: 0 5px 0 #0d0b20; border: 2px solid transparent; }
.card:hover { border-color: #ffffff1c; }
.card:active { transform: translateY(3px); box-shadow: 0 2px 0 #0d0b20; }
.card .ico { flex: 0 0 auto; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 18px; font-size: 28px; }
.card[data-test="reaction"] .ico { background: linear-gradient(145deg, #3ee08f, #1f9e62); }
.card[data-test="aim"] .ico { background: linear-gradient(145deg, #b38bff, #6d3fe0); }
.card[data-test="sequence"] .ico { background: linear-gradient(145deg, #4fe0e6, #178c93); }
.card div { min-width: 0; flex: 1; }
.card strong { display: block; font-size: 18px; font-weight: 900; }
.card p { margin-top: 2px; font-size: 13px; color: var(--muted); line-height: 1.35; }
.card small { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 99px; background: #ffffff12; font-size: 12px; font-weight: 800; color: var(--accent); }
.card small.none { color: var(--muted); }
.card .go { flex: 0 0 auto; font-size: 22px; color: var(--muted); }

.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.view-head h2 { font-size: 20px; font-weight: 900; }
.view-head p { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Reaction time */
.tries { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tries span { padding: 7px 2px; border-radius: 12px; background: var(--panel); text-align: center; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; overflow: hidden; }
.tries span.done { color: var(--text); background: var(--panel-2); }
.tries span.now { box-shadow: inset 0 0 0 2px var(--accent); }
.tries span em { font-style: normal; color: var(--orange); font-size: 11px; }
.pad { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; border-radius: 28px; text-align: center; background: var(--blue); touch-action: none; box-shadow: inset 0 -6px 0 #0002; }
.pad[data-state="wait"] { background: var(--red); }
.pad[data-state="go"] { background: var(--green); }
.pad[data-state="early"] { background: var(--orange); }
.pad .big { font-size: clamp(40px, 13vw, 64px); line-height: 1; }
.pad h3 { font-size: clamp(28px, 9vw, 48px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pad p { max-width: 340px; font-size: 15px; font-weight: 700; line-height: 1.45; opacity: .9; }
.pad .key { font-size: 12px; opacity: .75; }
.pad .key kbd { padding: 1px 7px; border-radius: 6px; background: #0003; font: inherit; font-weight: 800; }

/* Aim trainer */
.arena { position: relative; flex: 1; min-height: 0; border-radius: 26px; background-color: var(--panel); background-image: radial-gradient(#ffffff10 1.5px, transparent 2px); background-size: 22px 22px; container-type: size; touch-action: none; overflow: hidden; cursor: crosshair; }
.target { --s: clamp(46px, 14cqmin, 86px); position: absolute; left: calc((100% - var(--s)) * var(--x)); top: calc((100% - var(--s)) * var(--y)); width: var(--s); height: var(--s); border-radius: 50%; background: radial-gradient(circle closest-side, #fff 0 17%, var(--purple) 18% 40%, #fff 41% 60%, var(--purple) 61% 84%, #fff 85% 99%, transparent); box-shadow: 0 0 0 3px #ffffff30, 0 8px 22px #0007; cursor: crosshair; }
.target.spawn { animation: pop .16s ease-out; }
@keyframes pop { from { transform: scale(.3); opacity: .2; } }
.target.first { --s: clamp(70px, 22cqmin, 120px); }
.burst { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 3px solid var(--accent); pointer-events: none; animation: burst .35s ease-out forwards; }
.burst.miss { border-color: var(--red); }
@keyframes burst { to { transform: scale(6); opacity: 0; } }
.arena-hint { position: absolute; left: 0; right: 0; bottom: 16px; padding: 0 16px; text-align: center; font-size: 14px; font-weight: 700; color: var(--muted); pointer-events: none; }

/* Sequence memory */
.seq-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.grid { --size: min(100cqw, 100cqh); width: var(--size); height: var(--size); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: calc(var(--size) * .04); padding: calc(var(--size) * .04); border-radius: calc(var(--size) * .07); background: var(--panel); }
.grid.fail { animation: shake .35s; background: #4a1c35; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.tile { border-radius: calc(var(--size) * .045); background: var(--panel-2); box-shadow: inset 0 -5px 0 #0003; transition: background .12s, transform .12s; }
.grid.locked .tile { cursor: default; }
.tile.lit { background: var(--teal); box-shadow: 0 0 24px #25c2c9aa, inset 0 -5px 0 #0002; transform: scale(1.03); transition: none; }
.tile.tap { background: #e7fbfc; transition: none; }
.tile.wrong { background: var(--red); }
.seq-bar { min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 17px; font-weight: 800; }
.seq-bar.good { color: var(--green); }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: #0b0a1ccc; }
.panel { width: min(100%, 400px); max-height: 100%; overflow: auto; background: var(--panel); border-radius: 28px; padding: 20px 20px 18px; text-align: center; box-shadow: 0 20px 50px #0009, inset 0 0 0 1px #ffffff12; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel .emoji { font-size: 38px; line-height: 1.2; }
.panel h2 { font-size: 19px; font-weight: 900; color: var(--muted); }
.score { margin-top: 4px; font-size: clamp(40px, 12vw, 54px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; }
.sub { margin-top: 4px; font-size: 14px; color: var(--muted); }
.hist { display: block; width: 100%; height: auto; max-height: 150px; margin-top: 12px; }
.hist .bar { fill: #ffffff26; }
.hist .bar.you { fill: var(--accent); }
.hist .axis { stroke: #ffffff40; stroke-width: 1; }
.hist .mark { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 3 3; }
.hist text { fill: var(--muted); font-size: 11px; font-weight: 700; font-family: var(--font); }
.hist .you-label { fill: var(--accent); font-weight: 900; }
.compare { margin-top: 6px; font-size: 15px; font-weight: 800; line-height: 1.4; }
.note { margin-top: 2px; font-size: 11px; color: var(--muted); }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: var(--accent); color: #2b2200; font-size: 14px; font-weight: 800; }
.cta { margin-top: 16px; width: 100%; padding: 14px; border-radius: 18px; background: var(--accent); color: #2b2200; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 #b38f17; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #b38f17; }
.ghost-btn { margin-top: 10px; width: 100%; padding: 12px; border-radius: 16px; background: var(--panel-2); font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #0d0b20; }
.start-btn { padding: 12px 34px; border-radius: 16px; background: var(--teal); color: #062a2c; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 #127a80; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 640px) { .card { padding: 11px 14px; } .card .ico { width: 46px; height: 46px; font-size: 23px; } .card p { font-size: 12px; } .hub { gap: 8px; } }
@media (max-height: 700px) { .hist { max-height: 110px; margin-top: 8px; } .panel .emoji { display: none; } .cta { margin-top: 12px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <button type="button" class="icon-btn" id="home" data-i18n-label="allTests" hidden>←</button>
    <h1>Reaction <span>Test</span></h1>
  </header>

  <section class="hub" id="hub">
    <p class="tagline" data-i18n="tagline"></p>
    <button type="button" class="card" data-test="reaction"><span class="ico" aria-hidden="true">⚡</span><div><strong data-i18n="reactionName"></strong><p data-i18n="reactionDesc"></p><small id="best-reaction"></small></div><span class="go" aria-hidden="true">›</span></button>
    <button type="button" class="card" data-test="aim"><span class="ico" aria-hidden="true">🎯</span><div><strong data-i18n="aimName"></strong><p data-i18n="aimDesc"></p><small id="best-aim"></small></div><span class="go" aria-hidden="true">›</span></button>
    <button type="button" class="card" data-test="sequence"><span class="ico" aria-hidden="true">🧠</span><div><strong data-i18n="sequenceName"></strong><p data-i18n="sequenceDesc"></p><small id="best-sequence"></small></div><span class="go" aria-hidden="true">›</span></button>
  </section>

  <section class="view" id="view-reaction" hidden>
    <div class="view-head"><h2 data-i18n="reactionName"></h2><p id="r-progress"></p></div>
    <div class="tries" id="tries" aria-hidden="true"></div>
    <button type="button" class="pad" id="pad" data-state="idle">
      <span class="big" id="pad-icon" aria-hidden="true">⚡</span>
      <h3 id="pad-title"></h3>
      <p id="pad-text"></p>
      <span class="key" id="pad-key"></span>
    </button>
  </section>

  <section class="view" id="view-aim" hidden>
    <div class="view-head"><h2 data-i18n="aimName"></h2><p id="a-progress"></p></div>
    <div class="arena" id="arena">
      <button type="button" class="target first" id="target" style="--x: .5; --y: .5"></button>
      <p class="arena-hint" id="arena-hint"></p>
    </div>
  </section>

  <section class="view" id="view-sequence" hidden>
    <div class="view-head"><h2 data-i18n="sequenceName"></h2><p id="s-progress"></p></div>
    <div class="seq-wrap"><div class="grid locked" id="grid" role="group" data-i18n-label="sequenceName"></div></div>
    <div class="seq-bar" id="seq-bar"><button type="button" class="start-btn" id="seq-start" data-i18n="start"></button></div>
  </section>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="result" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <p class="emoji" id="result-emoji" aria-hidden="true"></p>
    <h2 id="result-title"></h2>
    <p class="score" id="result-score"></p>
    <p class="sub" id="result-sub"></p>
    <svg class="hist" id="hist" viewBox="0 0 320 132" role="img"></svg>
    <p class="compare" id="result-compare"></p>
    <p class="note" data-i18n="approx"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="again" data-i18n="again"></button>
    <button type="button" class="ghost-btn" id="to-hub" data-i18n="allTests"></button>
  </div>
</div>

    if (S.seq[S.input] !== i) {
      S.phase = 'over';
      tile.classList.add('wrong');
      tiles[S.seq[S.input]].classList.add('lit');
      els.grid.classList.add('fail', 'locked');
      later(() => showResult('sequence', S.seq.length - 1, t.longest), 900);
      return;
    }
    tile.classList.remove('tap');
    void tile.offsetWidth;
    tile.classList.add('tap');
    later(() => tile.classList.remove('tap'), 160);
    S.input += 1;
    if (S.input === S.seq.length) {
      S.phase = 'show';
      els.grid.classList.add('locked');
      setSeqBar(t.correct, true);
      later(seqNext, 750);
    }
  }

  els.seqStart.addEventListener('click', () => {
    S.seq = [];
    els.grid.classList.remove('fail');
    seqNext();
  });

  // ---- Results ----------------------------------------------------------------------------
  function erf(x) {
    const s = Math.sign(x), a = Math.abs(x), k = 1 / (1 + 0.3275911 * a);
    return s * (1 - ((((1.061405429 * k - 1.453152027) * k + 1.421413741) * k - 0.284496736) * k + 0.254829592) * k * Math.exp(-a * a));
  }
  const cdf = (x, n) => 0.5 * (1 + erf((x - n.mean) / (n.sd * Math.SQRT2)));

  function percentBetter(test, v) {
    const n = NORMS[test];
    const p = n.lowerBetter ? 1 - cdf(v, n) : cdf(v - 0.5, n);
    return Math.max(1, Math.min(99, Math.round(p * 100)));
  }

  function drawHistogram(test, value) {
    const n = NORMS[test];
    const W = 320, base = 104, top = 22;
    const count = Math.round((n.max - n.min) / n.step);
    const dens = Array.from({ length: count }, (_, i) => { const z = (n.min + (i + 0.5) * n.step - n.mean) / n.sd; return Math.exp(-z * z / 2); });
    const peak = Math.max(...dens);
    const bw = W / count;
    const clamped = Math.max(n.min, Math.min(n.max - 1e-6, value));
    const youIdx = Math.floor((clamped - n.min) / n.step);
    const xOf = v => (v - n.min) / (n.max - n.min) * W;
    const ns = 'http://www.w3.org/2000/svg';
    const node = (tag, attrs, text) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
    const parts = dens.map((d, i) => {
      const h = Math.max(2, d / peak * (base - top));
      return node('rect', { class: i === youIdx ? 'bar you' : 'bar', x: (i * bw + 1.5).toFixed(1), y: (base - h).toFixed(1), width: (bw - 3).toFixed(1), height: h.toFixed(1), rx: 2 });
    });
    parts.push(node('line', { class: 'axis', x1: 0, x2: W, y1: base + 0.5, y2: base + 0.5 }));
    const mx = Math.max(14, Math.min(W - 14, xOf(clamped)));
    parts.push(node('line', { class: 'mark', x1: mx, x2: mx, y1: 14, y2: base }));
    parts.push(node('text', { class: 'you-label', x: mx, y: 11, 'text-anchor': mx < 40 ? 'start' : mx > W - 40 ? 'end' : 'middle' }, t.you));
    n.ticks.forEach((v, i) => parts.push(node('text', { x: xOf(v), y: base + 15, 'text-anchor': i === 0 ? 'start' : i === n.ticks.length - 1 ? 'end' : 'middle' }, String(v))));
    parts.push(node('text', { x: test === 'sequence' ? W : 0, y: base + 28, 'text-anchor': test === 'sequence' ? 'end' : 'start' }, test === 'sequence' ? t.longer : t.faster));
    if (test !== 'sequence') parts.push(node('text', { x: W, y: base + 28, 'text-anchor': 'end' }, 'ms'));
    els.hist.replaceChildren(...parts);
  }

  function showResult(test, value, sub) {
    const n = NORMS[test];
    const old = best[test];
    const improved = !Number.isFinite(old) || (n.lowerBetter ? value < old : value > old);
    if (improved && (test !== 'sequence' || value > 0)) { best[test] = value; writeBest(best); }
    const better = percentBetter(test, value);
    const name = t[`${test}Name`];
    els.resultEmoji.textContent = { reaction: '⚡', aim: '🎯', sequence: '🧠' }[test];
    els.resultTitle.textContent = name;
    els.resultScore.textContent = formatValue(test, value);
    els.resultSub.textContent = sub;
    els.compare.textContent = `${t.typical(formatValue(test, n.mean))} · ${t.better(better)}`;
    els.hist.setAttribute('aria-label', t.better(better));
    drawHistogram(test, value);
    els.newBest.hidden = !(improved && (test !== 'sequence' || value > 0));
    els.result.hidden = false;
    els.again.focus({ preventScroll: true });
    announce(t.summary(name, formatValue(test, value), better) + (els.newBest.hidden ? '' : ` ${t.newBest}`));
  }

  // ---- Global input -----------------------------------------------------------------------
  for (const card of document.querySelectorAll('.card')) card.addEventListener('click', () => openTest(card.dataset.test));
  els.home.addEventListener('click', showHub);
  $('to-hub').addEventListener('click', showHub);
  els.again.addEventListener('click', () => openTest(current));

  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || !els.result.hidden) return;
    const otherButton = document.activeElement instanceof HTMLButtonElement && document.activeElement !== els.pad;
    if (current === 'reaction' && (event.key === ' ' || (event.key === 'Enter' && !otherButton))) {
      event.preventDefault();
      if (!event.repeat) reactionAct(event.timeStamp);
    } else if (current === 'sequence' && /^[1-9]$/.test(event.key)) {
      event.preventDefault();
      seqTap(Number(event.key) - 1);
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      if (current === 'sequence' && S.phase === 'paused') playback();
      return;
    }
    // Hidden tabs would distort timing, so the attempt in progress is reset rather than counted.
    if (current === 'reaction' && (R.state === 'wait' || R.state === 'go')) { clearTimeout(R.timer); setPad('paused'); }
    if (current === 'aim' && A.running) { aimReset(); els.arenaHint.textContent = t.aimPaused; }
    if (current === 'sequence' && S.phase === 'show' && S.seq.length) { seqClearTimers(); S.phase = 'paused'; setSeqBar(t.seqPaused); }
  });

  renderHub();
  document.querySelector('.card').focus({ preventScroll: true });
})();
</script>
</body>
</html>
