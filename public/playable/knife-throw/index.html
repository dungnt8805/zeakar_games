<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knife Throw</title>
<style>
:root {
  --bg: #1d1328;
  --ink: #2b1d36;
  --text: #ffffff;
  --muted: #7a6a86;
  --accent: #ffb238;
  --accent-dark: #d98a10;
  --apple: #ff4b5c;
  --paper: #fff8ef;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(ellipse at top, #3c2448, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.hud { display: flex; gap: 6px; width: 100%; }
.stat { flex: 1; min-width: 0; padding: 5px 6px; border-radius: 12px; background: #ffffff14; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #c9b8d4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.stage { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
.frame { position: relative; container-type: size; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px #ffffff18, 0 20px 44px #0009; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
canvas:focus-visible { outline: none; }
.frame:has(canvas:focus-visible) { outline: 3px solid #ffb23888; outline-offset: 3px; }

.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 5cqh 6cqw 5cqh; text-align: center; pointer-events: none; }
.overlay[hidden] { display: none; }
.overlay button { pointer-events: auto; }
.scrim { background: linear-gradient(#1d132800 40%, #1d1328cc 75%); }
.title { font-size: min(15cqw, 8.5cqh); font-weight: 900; letter-spacing: -.03em; line-height: 1; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 8px 24px #0008; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.title span { color: var(--accent); }
.tagline { margin-top: 1.6cqh; max-width: 30em; font-size: max(13px, min(4cqw, 2.4cqh)); font-weight: 700; line-height: 1.4; color: var(--ink); background: #ffffffe0; padding: 6px 12px; border-radius: 12px; }
.spacer { flex: 1; }
.skins-title { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #f1e4f7; text-shadow: 0 1px 4px #000; }
.skins { display: flex; gap: min(8px, 2cqw); margin: 1cqh 0 2.4cqh; }
.skin { pointer-events: auto; position: relative; width: min(50px, 13cqw); height: min(70px, 11cqh); border-radius: 14px; background: #ffffff22; box-shadow: inset 0 0 0 2px #ffffff30; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 7%; }
.skin .blade { width: 7px; height: 42%; border-radius: 6px 6px 1px 1px; background: var(--blade); }
.skin .grip { width: 9px; height: 26%; margin-top: 2px; border-radius: 3px; background: var(--handle); box-shadow: 0 -3px 0 -1px #00000040; }
.skin small { position: absolute; bottom: 3px; left: 0; right: 0; font-size: 10px; font-weight: 800; color: #fff; }
.skin.locked .blade, .skin.locked .grip { opacity: .45; }
.skin.on { background: #ffb23855; box-shadow: inset 0 0 0 3px var(--accent); }
.cta { padding: 14px 34px; border-radius: 99px; background: var(--accent); color: var(--ink); font-size: max(17px, min(5.4cqw, 3.2cqh)); font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark), 0 10px 24px #0004; animation: pulse 1.4s ease-in-out infinite; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
@keyframes pulse { 50% { transform: scale(1.05); } }
.small { margin-top: 1.4cqh; font-size: max(12px, min(3.6cqw, 2.1cqh)); font-weight: 700; color: var(--ink); background: #ffffffd0; padding: 4px 10px; border-radius: 99px; }
.small:empty { display: none; }
.note { min-height: 1.4em; margin-top: 1cqh; font-size: 13px; font-weight: 800; color: #ffd27a; text-shadow: 0 1px 4px #000; }

.center { justify-content: center; }
.panel { pointer-events: auto; width: min(100%, 310px); padding: 20px 18px; border-radius: 24px; background: var(--paper); color: var(--ink); box-shadow: 0 8px 0 #dcc8b4, 0 20px 50px #0007; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
.panel .emoji { font-size: 40px; line-height: 1.1; }
.results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.results div { padding: 10px 6px; border-radius: 16px; background: #f4e6d6; }
.results small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results strong { display: block; font-size: 30px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.results em { display: block; font-style: normal; font-size: 12px; font-weight: 700; color: var(--muted); }
.earned { margin-top: 10px; font-size: 14px; font-weight: 800; color: #c2364a; }
.badge { display: inline-block; margin-top: 12px; padding: 4px 12px; border-radius: 99px; background: var(--apple); color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.panel .again { display: block; width: 100%; margin-top: 16px; padding: 14px; border-radius: 16px; background: var(--accent); color: var(--ink); font-size: 19px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark); }
.panel .again:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.panel .hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<main class="app">
  <div class="hud" id="hud">
    <div class="stat"><small data-i18n="score"></small><strong id="score">0</strong></div>
    <div class="stat"><small data-i18n="bestStage"></small><strong id="best">0</strong></div>
    <div class="stat"><small data-i18n="apples"></small><strong id="coins">0</strong></div>
  </div>
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
      <div class="overlay scrim" id="start">
        <h1 class="title">Knife <span>Throw</span></h1>
        <p class="tagline" data-i18n="tagline"></p>
        <div class="spacer"></div>
        <p class="skins-title" id="skins-title" data-i18n="knives"></p>
        <div class="skins" id="skins" role="group" aria-labelledby="skins-title"></div>
        <button type="button" class="cta" id="play" data-i18n="start"></button>
        <p class="small" data-i18n="controls"></p>
        <p class="small" id="start-best"></p>
        <p class="note" id="note" aria-hidden="true"></p>
      </div>
      <div class="overlay center" id="paused" hidden>
        <div class="panel" role="dialog" aria-modal="true" aria-labelledby="paused-title">
          <h2 id="paused-title" data-i18n="paused"></h2>
          <button type="button" class="again" id="resume" data-i18n="resume"></button>
        </div>
      </div>
      <div class="overlay center" id="over" hidden>
        <div class="panel" role="dialog" aria-modal="true" aria-labelledby="over-title">
          <p class="emoji" aria-hidden="true">💥</p>
          <h2 id="over-title" data-i18n="over"></h2>
          <div class="results">
            <div><small data-i18n="stage"></small><strong id="final-stage">1</strong><em id="best-stage"></em></div>
            <div><small data-i18n="score"></small><strong id="final-score">0</strong><em id="best-score"></em></div>
          </div>
          <p class="earned" id="earned"></p>
          <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
          <button type="button" class="again" id="again" data-i18n="again"></button>
          <p class="hint" data-i18n="restartHint"></p>
        </div>
      </div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (const a of [0.6, 2.5, 4.3]) { ctx.moveTo(Math.cos(a) * 12, Math.sin(a) * 12); ctx.lineTo(Math.cos(a + 0.12) * (r - 16), Math.sin(a + 0.12) * (r - 16)); }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#7a4522';
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(0, 0, r - 3.5, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#8f5428';
    circle(1.5, -1, 5);
  }

  function drawBackground() {
    const g = ctx.createRadialGradient(CX, CY, 20, CX, CY + 80, 520);
    g.addColorStop(0, '#5d3456');
    g.addColorStop(1, '#1d1328');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff08';
    for (let i = 0; i < 14; i++) circle((i * 83) % W, (i * 149) % H, 30 + (i % 4) * 14);
    ctx.fillStyle = '#ffd27a10';
    circle(CX, CY, 140);
  }

  function drawStageHud() {
    const s = game.stage;
    ctx.font = `900 21px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = s.boss ? '#ff6b7d' : '#ffffff';
    ctx.fillText(s.boss ? t.bossTitle(t.bosses[s.boss]) : t.stageN(s.n), CX, 38, W - 40);
    const slot = (s.n - 1) % BOSS_EVERY;
    for (let i = 0; i < BOSS_EVERY; i++) {
      const x = CX + (i - 2) * 24, y = 68, boss = i === BOSS_EVERY - 1;
      ctx.fillStyle = i < slot ? '#ffb238' : i === slot ? '#ffffff' : '#ffffff33';
      if (boss) ctx.fillStyle = i <= slot ? '#ff4b5c' : '#ff4b5c66';
      circle(x, y, i === slot ? 7 : 5.5);
      if (boss) {
        ctx.fillStyle = '#ffd27a';
        ctx.beginPath(); ctx.moveTo(x - 6, y - 7); ctx.lineTo(x - 6, y - 13); ctx.lineTo(x - 3, y - 10); ctx.lineTo(x, y - 14); ctx.lineTo(x + 3, y - 10); ctx.lineTo(x + 6, y - 13); ctx.lineTo(x + 6, y - 7); ctx.fill();
      }
    }
    // Remaining knives, bottom-left: bright = still to throw.
    const left = s.needed - game.thrown;
    for (let i = 0; i < s.needed; i++) {
      ctx.save();
      ctx.translate(20, 606 - i * 25);
      ctx.rotate(Math.PI / 4);
      ctx.scale(0.3, 0.3);
      ctx.globalAlpha = i < left ? 1 : 0.2;
      drawKnife(store.skin);
      ctx.restore();
    }
  }

  function outlinedText(text, x, y, size, fill) {
    ctx.font = `900 ${size}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.2;
    ctx.strokeStyle = '#2b1d36';
    ctx.strokeText(text, x, y, W - 30);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y, W - 30);
  }

  function draw() {
    if (!game) return;
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    drawBackground();
    ctx.save();
    if (game.shake > 0) ctx.translate((Math.random() - 0.5) * game.shake * 12, (Math.random() - 0.5) * game.shake * 12);
    const s = game.stage, r = logRadius();
    const showLog = game.state !== 'clearing';
    const popScale = reducedMotion ? 1 : 1 - (1 - game.pop) ** 3;
    const ly = CY - game.nudge * 5;
    if (showLog) {
      ctx.save();
      ctx.translate(CX, ly);
      ctx.scale(popScale, popScale);
      ctx.translate(-CX, -ly);
      // Stuck knives go under the log so their embedded tips stay hidden.
      for (const k of game.knives) {
        const angle = k.a + game.rot + Math.sin(game.time * 60) * 0.03 * k.wob;
        const [dx, dy] = dirOf(angle);
        placeKnife(CX + dx * (r - EMBED), ly + dy * (r - EMBED), angle - Math.PI / 2);
      }
      ctx.fillStyle = '#00000033';
      circle(CX + 4, ly + 8, r);
      ctx.save();
      ctx.translate(CX, ly);
      ctx.rotate(game.rot);
      drawLogFace(s.boss, r);
      ctx.restore();
      if (game.hitFlash > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${game.hitFlash * 0.25})`; circle(CX, ly, r); }
      for (const apple of game.apples) { const [x, y] = applePos(apple); drawApple(x, y - (CY - ly), apple.a + game.rot + Math.PI / 2); }
      ctx.restore();
    }
    for (const c of game.chunks) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, c.r, c.a0, c.a0 + Math.PI / 2); ctx.closePath(); ctx.clip();
      drawLogFace(c.type, c.r);
      ctx.restore();
    }
    for (const l of game.loose) {
      if (l.type === 'knife') {
        ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot); ctx.translate(0, -KNIFE / 2); drawKnife(store.skin); ctx.restore();
      } else drawApple(l.x, l.y, l.rot, l.type === 'half' ? l.side : 0);
    }
    if (game.flying) placeKnife(CX, game.flying.y, 0);
    else if (game.state === 'play' && game.thrown < s.needed) placeKnife(CX, HAND_Y + (1 - game.hand) * 70, 0);
    const b = game.bounce;
    if (b) { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.translate(0, -KNIFE / 2); drawKnife(store.skin); ctx.restore(); }
    for (const p of game.particles) { ctx.globalAlpha = clamp01(p.life * 2); ctx.fillStyle = p.color; circle(p.x, p.y, p.r); }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (game.state !== 'ready') drawStageHud();
    for (const p of game.popups) {
      ctx.globalAlpha = 1 - clamp01((p.t - 0.5) / 0.4);
      outlinedText(p.text, p.x, p.y - p.t * 30, 16, '#ffffff');
    }
    ctx.globalAlpha = 1;
    if (game.banner && game.state !== 'ready') {
      const k = game.banner.t;
      ctx.globalAlpha = 1 - clamp01((k - 1.1) / 0.3);
      const y = game.banner.clear ? CY : 400;
      outlinedText(game.banner.text, CX, y, game.banner.boss || game.banner.clear ? 26 : 24, game.banner.boss ? '#ff8a96' : game.banner.clear ? '#ffd27a' : '#ffffff');
      ctx.globalAlpha = 1;
    }
    if (game.flash > 0) { ctx.fillStyle = `rgba(255, 60, 80, ${game.flash * 0.3})`; ctx.fillRect(0, 0, W, H); }
  }

  function resize() {
    const stage = $('stage').getBoundingClientRect();
    scale = Math.min(stage.width / W, stage.height / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    els.frame.style.width = `${W * scale}px`;
    els.frame.style.height = `${H * scale}px`;
    els.hud.style.width = `${Math.min(stage.width, Math.max(W * scale, 320))}px`;
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    draw();
  }

  function frame(time) {
    // Clamp dt so a stalled frame never advances the log more than 50 ms.
    const dt = Math.min(0.05, Math.max(0, (time - last) / 1000));
    last = time;
    if (!document.hidden) {
      if (game.state !== 'paused') {
        acc += dt;
        while (acc >= STEP) { step(STEP); acc -= STEP; }
      }
      draw();
    }
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointerdown', event => {
    event.preventDefault();
    act();
  });
  document.addEventListener('keydown', event => {
    if ((event.target instanceof Element && event.target.closest('button')) || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key !== ' ' && event.key !== 'Enter' && event.key !== 'ArrowUp') return;
    event.preventDefault();
    if (!event.repeat) act();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pause();
    last = performance.now();
    acc = 0;
  });
  els.play.addEventListener('click', () => { if (game.state === 'ready') begin(); });
  els.resume.addEventListener('click', resume);
  els.again.addEventListener('click', restart);

  reset();
  new ResizeObserver(resize).observe($('stage'));
  canvas.focus({ preventScroll: true });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
