<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lights Out</title>
<style>
:root {
  --bg: #17123a;
  --bg2: #241c58;
  --ink: #f4efff;
  --muted: #b3a8dc;
  --cell: #312a6e;
  --cell-hi: #3d3585;
  --on: #ffc93c;
  --on-glow: #ffc93c99;
  --two: #ff6fae;
  --two-glow: #ff6fae99;
  --accent: #7c5cff;
  --accent-dark: #5638d6;
  --paper: #2a2263;
  --chip: #ffffff14;
  --star: #ffc93c;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); color: var(--ink);
  background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%);
  overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid #a996ff; outline-offset: 3px; }

.app {
  height: 100%; max-width: 540px; margin: auto; display: grid;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  grid-template-areas: "head" "hud" "tools" "board" "note"; gap: 9px;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
header { grid-area: head; text-align: center; }
h1 { font-size: clamp(22px, 7vw, 30px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
h1 span, .logo span { color: var(--on); text-shadow: 0 0 14px var(--on-glow); }
.sub { margin-top: 2px; font-size: 13px; font-weight: 700; color: var(--muted); }
.hud { grid-area: hud; display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 6px 4px; border-radius: 14px; background: var(--chip); text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.tools { grid-area: tools; display: flex; gap: 6px; }
.tool { flex: 1; min-height: 40px; border-radius: 14px; background: var(--paper); box-shadow: 0 4px 0 #120d33; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 6px; }
.tool b { font-size: 18px; }
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 #120d33; }
.tool:disabled { opacity: .45; cursor: default; }
.tool span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.board-wrap { grid-area: board; position: relative; min-height: 0; min-width: 0; }
.board { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.board.wrap-mode { outline: 2px dashed #8f80d6; outline-offset: 6px; border-radius: 10px; }
.cell { position: absolute; border-radius: 18%; background: var(--cell); box-shadow: inset 0 -4px 0 #0003; transition: background .15s, box-shadow .15s, transform .12s; }
.cell.hex { border-radius: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.cell:hover { background: var(--cell-hi); }
.cell.s1 { background: var(--on); box-shadow: inset 0 -4px 0 #0002, 0 0 18px var(--on-glow); }
.cell.s2 { background: var(--two); box-shadow: inset 0 -4px 0 #0002, 0 0 18px var(--two-glow); }
.cell.preview::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: #ffffff55; }
.cell.hex.preview::after { inset: 34%; }
.cell.hinted { animation: hint 0.8s ease-in-out 3; }
.cell.hinted::before { content: "💡"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 50%; }
.cell:active { transform: scale(.94); }
.cell:focus-visible { outline: 3px solid #fff; outline-offset: 1px; z-index: 2; }
@keyframes hint { 50% { transform: scale(1.12); } }
.board.won .cell { pointer-events: none; animation: glow .9s ease-out var(--d) both; }
@keyframes glow { 40% { background: var(--on); box-shadow: 0 0 22px var(--on-glow); } }

.note { grid-area: note; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: #0b0820b0; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 400px); max-height: calc(100% - 8px); overflow-y: auto; background: var(--paper); border-radius: 26px; padding: 22px 20px; text-align: center; box-shadow: 0 20px 50px #0008; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 24px; font-weight: 900; line-height: 1.2; }
.logo { font-size: 32px !important; letter-spacing: -.02em; }
.panel p { margin-top: 8px; color: var(--muted); line-height: 1.45; }
.panel .emoji { font-size: 40px; margin: 0; }
.modes { display: grid; gap: 8px; margin-top: 14px; }
.mode-btn { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 16px; background: #ffffff10; box-shadow: 0 3px 0 #120d33; }
.mode-btn .ic { font-size: 26px; text-align: center; }
.mode-btn strong { display: block; font-size: 16px; }
.mode-btn small { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
.mode-btn em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--star); white-space: nowrap; }
.mode-btn.current { background: #7c5cff44; }
.stars { margin-top: 6px; font-size: 38px; letter-spacing: 4px; color: #4a4290; }
.stars b { color: var(--star); text-shadow: 0 0 12px var(--on-glow); }
.result { font-size: 18px; font-weight: 700; color: var(--ink) !important; }
.badge { display: inline-block; margin-top: 10px; padding: 5px 14px; border-radius: 99px; background: var(--star); color: #2a1d00 !important; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 18px; width: 100%; padding: 14px; border-radius: 18px; background: var(--accent); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--accent-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
.cta[hidden] { display: none; }
.secondary { margin-top: 10px; width: 100%; padding: 11px; border-radius: 16px; border: 2px solid #4a4290; font-weight: 800; }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-top: 14px; }
.level-btn { aspect-ratio: 1; display: grid; place-content: center; gap: 1px; border-radius: 12px; background: #ffffff12; box-shadow: 0 3px 0 #120d33; font-size: 16px; font-weight: 900; }
.level-btn small { font-size: 9px; letter-spacing: 1px; color: var(--star); min-height: 10px; }
.level-btn.current { background: var(--accent); }
.level-btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 400px) {
  .stat small { letter-spacing: 0; }
  .stat strong { font-size: 17px; }
  .tool { font-size: 12px; }
  .tool span { display: none; }
}
@media (max-height: 600px) { .sub, .note { display: none; } }
@media (max-height: 520px) {
  .overlay { padding: 8px; }
  .panel { width: min(100%, 560px); padding: 12px 16px; border-radius: 20px; }
  .panel h2 { font-size: 20px; }
  .logo { font-size: 26px !important; }
  .panel .emoji { display: none; }
  .panel p { margin-top: 4px; line-height: 1.35; }
  .modes { gap: 6px; margin-top: 8px; }
  .mode-btn { padding: 6px 10px; grid-template-columns: 30px 1fr auto; }
  .mode-btn .ic { font-size: 20px; }
  .mode-btn small { display: none; }
  .stars { margin-top: 0; font-size: 30px; }
  .cta { margin-top: 10px; padding: 10px; font-size: 17px; }
  .secondary { margin-top: 6px; padding: 7px; }
  .level-grid { grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 8px; }
  .level-btn { font-size: 14px; border-radius: 9px; }
}
@media (max-height: 520px) and (min-width: 460px) { .modes { grid-template-columns: 1fr 1fr; } }
/* Wide / landscape: title, HUD and tools move to a side column; the board takes the full height. */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: 1240px; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); grid-template-rows: auto auto auto 1fr auto; grid-template-areas: "head board" "hud board" "tools board" ". board" "note board"; gap: 12px 22px; align-content: stretch; }
  header { text-align: left; }
  .hud { flex-wrap: wrap; }
  .hud .stat { flex: 1 1 calc(50% - 3px); }
  .tools { flex-wrap: wrap; }
  .tool { flex: 1 1 calc(50% - 3px); min-height: 44px; }
  .tool span { display: inline; }
  .note { text-align: left; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 480px) {
  .app { grid-template-columns: minmax(170px, 250px) minmax(0, 1fr); gap: 7px 16px; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; }
  .stat { padding: 3px 4px; }
  .stat strong { font-size: 16px; }
  .tool { min-height: 34px; font-size: 12px; }
  .tool b { font-size: 15px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 340px) { .tool span { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">

    <h2 id="win-title"></h2>
    <p class="stars" id="stars"></p>
    <p class="result" id="result"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="next" data-i18n="next"></button>
    <button type="button" class="secondary" id="replay" data-i18n="replay"></button>
    <button type="button" class="secondary" id="win-levels" data-i18n="chooseLevel"></button>
  </div>
</div>

    const opt = optimalTaps(game.L.cells, game.state, game.mode.p);
    if (!opt) return;
    const i = opt.taps.findIndex(v => v > 0);
    if (i < 0) return;
    game.hintUsed = true;
    clearHint();
    const b = els.board.children[i];
    b.classList.add('hinted');
    setFocus(i);
    const c = game.L.cells[i];
    say(t.hintSay(c.row, c.col));
    hintTimer = setTimeout(clearHint, 2600);
  }

  function starsFor(moves, par, hintUsed) {
    const s = moves <= par ? 3 : moves <= Math.ceil(par * 1.5) + 1 ? 2 : 1;
    return hintUsed ? Math.min(2, s) : s;
  }

  function finish() {
    game.done = true;
    clearPreview();
    const { mode, n } = game;
    const moves = game.history.length, par = game.L.par;
    const stars = starsFor(moves, par, game.hintUsed);
    const key = keyOf(mode, n);
    const isBest = !progress.best[key] || moves < progress.best[key];
    if (isBest) progress.best[key] = moves;
    progress.stars[key] = Math.max(progress.stars[key] || 0, stars);
    progress.unlocked[mode.id] = Math.max(unlockedIn(mode), Math.min(mode.levels.length, n + 1));
    if (n < mode.levels.length) progress.last = { mode: mode.id, level: n + 1 };
    saveProgress();
    render();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    [...els.board.children].forEach((b, i) => b.style.setProperty('--d', `${(game.L.cells[i].x + game.L.cells[i].y) * 40}ms`));
    els.board.classList.add('won');
    const last = n === mode.levels.length;
    els.winTitle.textContent = last ? t.allDone(t.modes[mode.id][0]) : t.won(n);
    els.stars.innerHTML = starText(stars);
    els.stars.setAttribute('aria-label', t.starsLabel(stars));
    els.result.textContent = t.result(moves, par) + (game.hintUsed ? ` · ${t.hintCap}` : '');
    els.newBest.hidden = !(isBest && progress.best[key] !== undefined && moves <= par);
    els.next.hidden = last;
    say(t.solvedSay(moves, par, stars));
    winTimer = setTimeout(() => { els.win.hidden = false; (last ? $('replay') : els.next).focus({ preventScroll: true }); }, reduce ? 150 : 900);
  }

  function setFocus(i) {
    const kids = els.board.children;
    if (!kids[i]) return;
    for (const b of kids) b.tabIndex = -1;
    kids[i].tabIndex = 0;
    focusIndex = i;
    kids[i].focus({ preventScroll: true });
  }

  // Arrow keys move to the nearest cell in that direction (works for square and hex boards alike).
  function moveFocus(dx, dy) {
    const cells = game.L.cells, from = cells[focusIndex];
    const hex = game.mode.shape === 'hex';
    let best = -1, bestScore = Infinity;
    cells.forEach((c, i) => {
      const vx = c.x - from.x, vy = c.y - from.y;
      const along = vx * dx + vy * dy;
      if (along <= 0.01) return;
      const across = Math.abs(vx * dy - vy * dx);
      if (!hex && across > 0.01) return;
      const score = along + across * 2;
      if (score < bestScore) { bestScore = score; best = i; }
    });
    if (best < 0 && game.mode.shape === 'torus') {
      const n = game.L.size, r = from.row - 1, c = from.col - 1;
      best = ((r + dy + n) % n) * n + (c + dx + n) % n;
    }
    if (best >= 0) setFocus(best);
  }

  function renderModes() {
    els.modes.innerHTML = '';
    for (const mode of MODES) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mode-btn' + (progress.last.mode === mode.id ? ' current' : '');
      const [name, desc] = t.modes[mode.id];
      b.innerHTML = `<span class="ic" aria-hidden="true">${mode.icon}</span><span><strong></strong><small></small></span><em></em>`;
      b.querySelector('strong').textContent = name;
      b.querySelector('small').textContent = desc;
      b.querySelector('em').textContent = t.progress(starsIn(mode), mode.levels.length * 3);
      b.addEventListener('click', () => openLevels(mode));
      els.modes.appendChild(b);
    }
    const last = modeById(progress.last.mode);
    els.play.textContent = starsIn(last) || progress.last.level > 1 ? t.resume(t.modes[last.id][0], progress.last.level) : t.play;
  }

  function openStart() {
    renderModes();
    els.levels.hidden = true;
    els.win.hidden = true;
    els.start.hidden = false;
    els.play.focus({ preventScroll: true });
  }

  function openLevels(mode) {
    mode = mode || game.mode;
    els.levelsTitle.textContent = `${mode.icon} ${t.modes[mode.id][0]}`;
    els.levelGrid.innerHTML = '';
    const open = unlockedIn(mode);
    let focusBtn = null;
    mode.levels.forEach((_, i) => {
      const n = i + 1, s = progress.stars[keyOf(mode, n)] || 0;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'level-btn' + (game && game.mode === mode && game.n === n ? ' current' : '');
      b.disabled = n > open;
      b.innerHTML = `${n}<small>${'★'.repeat(s)}</small>`;
      b.setAttribute('aria-label', n > open ? `${t.levelLabel(n, 0)}, ${t.locked}` : t.levelLabel(n, s));
      b.addEventListener('click', () => { startLevel(mode, n); setFocus(focusIndex); });
      els.levelGrid.appendChild(b);
      if (n === open || (game && game.mode === mode && game.n === n)) focusBtn = b;
    });
    els.start.hidden = true;
    els.win.hidden = true;
    els.levels.hidden = false;
    (focusBtn || els.levelGrid.firstChild).focus({ preventScroll: true });
  }

  els.board.addEventListener('click', e => {
    const b = e.target.closest('.cell');
    if (!b) return;
    const i = Number(b.dataset.i);
    for (const k of els.board.children) k.tabIndex = -1;
    b.tabIndex = 0;
    focusIndex = i;
    tap(i);
  });
  els.board.addEventListener('pointerover', e => { const b = e.target.closest('.cell'); if (b) showPreview(Number(b.dataset.i)); });
  els.board.addEventListener('pointerleave', clearPreview);
  els.board.addEventListener('focusin', e => { const b = e.target.closest('.cell'); if (b) focusIndex = Number(b.dataset.i); });

  document.addEventListener('keydown', e => {
    if (!game || e.ctrlKey || e.metaKey || e.altKey) return;
    const panelOpen = !els.start.hidden || !els.levels.hidden || !els.win.hidden;
    if (panelOpen) return;
    const dirs = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
    if (dirs[e.key]) {
      e.preventDefault();
      if (!els.board.contains(document.activeElement)) setFocus(focusIndex); else moveFocus(...dirs[e.key]);
    } else if ((e.key === ' ' || e.key === 'Enter') && els.board.contains(document.activeElement)) {
      e.preventDefault();
      tap(focusIndex);
    } else if (e.key === 'u' || e.key === 'U' || (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); }
    else if (e.key === 'h' || e.key === 'H') { e.preventDefault(); hint(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startLevel(game.mode, game.n); setFocus(focusIndex); }
  });

  $('menu-btn').addEventListener('click', () => openLevels());
  els.undo.addEventListener('click', undo);
  els.hint.addEventListener('click', hint);
  $('restart-btn').addEventListener('click', () => { startLevel(game.mode, game.n); });
  els.play.addEventListener('click', () => { const m = modeById(progress.last.mode); startLevel(m, Math.min(progress.last.level, unlockedIn(m))); setFocus(focusIndex); });
  $('levels-modes').addEventListener('click', openStart);
  $('levels-close').addEventListener('click', () => { els.levels.hidden = true; if (game.done) els.win.hidden = false; else setFocus(focusIndex); });
  els.next.addEventListener('click', () => { startLevel(game.mode, game.n + 1); setFocus(focusIndex); });
  $('replay').addEventListener('click', () => { startLevel(game.mode, game.n); setFocus(focusIndex); });
  $('win-levels').addEventListener('click', () => openLevels());

  new ResizeObserver(layout).observe(els.wrap);

  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__lightsOut = {
    state: () => game && { mode: game.mode.id, level: game.n, p: game.mode.p, size: game.L.size, cells: game.L.cells.map(c => c.affects.slice()), state: game.state.slice(), par: game.L.par, moves: game.history.length, done: game.done, hintUsed: game.hintUsed, overlay: [els.start, els.levels, els.win].find(o => !o.hidden)?.id || null },
    modes: () => MODES.map(m => ({ id: m.id, count: m.levels.length })),
    level: (id, n) => { const L = getLevel(modeById(id), n); return L && { start: L.start.slice(), par: L.par, cells: L.cells.map(c => c.affects.slice()) }; },
    cellCenter: i => { const r = els.board.children[i].getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; },
  };

  const m0 = modeById(progress.last.mode);
  startLevel(m0, Math.min(progress.last.level || 1, unlockedIn(m0)));
  openStart();
})();
</script>
</body>
</html>
