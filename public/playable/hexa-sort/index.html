<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hexa Sort</title>
<style>
:root {
  --bg: #1b1233;
  --bg-2: #3b2569;
  --text: #f7f1ff;
  --muted: #bfb2e4;
  --mint: #3fe0b2;
  --mint-dark: #1c9f7b;
  --gold: #ffcf4d;
  --gold-dark: #cf9515;
  --coral: #ff6f86;
  --coral-dark: #c94560;
  --paper: #fcf8ff;
  --ink: #2b1d4a;
  --ink-muted: #6d6090;
  --chip: #0c061c59;
  --side: clamp(180px, 20vw, 268px);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background-color: var(--bg);
  background-image: radial-gradient(#ffffff0b 1.4px, transparent 2px), radial-gradient(110% 90% at 50% 18%, var(--bg-2), var(--bg) 72%);
  background-size: 26px 26px, auto;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button, a { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app {
  height: 100%; max-width: 560px; margin: auto;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "hud" "stage" "tools";
  gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}
.top { grid-area: top; display: flex; align-items: center; gap: 8px; min-width: 0; }
.title { flex: 1; min-width: 0; }
h1 { font-size: clamp(20px, 6.4vw, 28px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; white-space: nowrap; }
h1 span { color: var(--mint); }
.sub { margin-top: 2px; font-size: 12.5px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { flex: 0 0 auto; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff1a; }
.icon-btn svg, .tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:active, .tool:active:not(:disabled) { transform: translateY(2px); }

.hud { grid-area: hud; display: flex; gap: 6px; min-width: 0; }
.goal { flex: 1 1 auto; min-width: 0; padding: 4px 8px 5px; border-radius: 12px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff12; }
.goal small, .stat small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; align-items: center; gap: 8px; min-width: 0; margin-top: 1px; }
.chip { display: flex; align-items: center; gap: 3px; min-width: 0; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.chip svg { flex: 0 0 auto; width: 18px; height: 18px; }
.chip.done { color: var(--mint); }
.chip.done b::after { content: " ✓"; }
.chip b { font-weight: 900; }
.gbar { height: 4px; margin-top: 3px; border-radius: 99px; background: #ffffff14; overflow: hidden; }
.gbar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--mint), var(--gold)); transition: width .3s; }
.stat { flex: 0 0 auto; min-width: 64px; padding: 4px 8px 5px; border-radius: 12px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff12; text-align: center; }
.stat[hidden] { display: none; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.mini { display: block; font-size: 10px; line-height: 1; letter-spacing: 1px; color: var(--gold); }
.mini[hidden] { display: none; }
.mini i { font-style: normal; }
.mini i.off { color: #ffffff2e; }

.stage { grid-area: stage; position: relative; min-height: 0; min-width: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; border-radius: 14px; }
.stage canvas:focus { outline: none; }
.stage canvas:focus-visible { outline: 2px solid #ffcf4d77; outline-offset: -2px; }
.toast { position: absolute; left: 50%; top: 6px; translate: -50% 0; max-width: 92%; padding: 7px 14px; border-radius: 99px; background: #0c0620d9; box-shadow: 0 0 0 1px #ffffff1c; font-size: 13px; font-weight: 800; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

.tools { grid-area: tools; display: flex; gap: 6px; }
.tool { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; padding: 5px 4px; border-radius: 14px; background: var(--chip); box-shadow: inset 0 0 0 1px #ffffff14; font-size: 12px; font-weight: 800; }
.tool > span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .count { position: absolute; top: 4px; right: 6px; min-width: 20px; padding: 1px 5px; border-radius: 99px; background: var(--gold); color: #3b2a05; font-size: 11.5px; font-weight: 900; line-height: 1.35; }
.tool.empty .count { background: #ffffff26; color: var(--muted); }
.tool.empty { opacity: .6; }
.tool[aria-pressed="true"] { background: var(--mint); color: #08392b; box-shadow: 0 3px 0 var(--mint-dark); }
.tool:disabled { opacity: .4; cursor: default; }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: #0b0619b8; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; overscroll-behavior: contain; background: var(--paper); color: var(--ink); border-radius: 26px; padding: 22px 20px; text-align: center; box-shadow: 0 22px 54px #0009; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 27px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.panel h2 span { color: var(--mint-dark); }
.panel .text { margin-top: 8px; color: var(--ink-muted); font-size: 14.5px; line-height: 1.45; }
.panel .text[hidden], .panel .result[hidden], .panel .fine[hidden] { display: none; }
.panel :focus-visible { outline-color: #7a4dd8; }
.result { margin-top: 8px; font-size: 19px; font-weight: 900; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cta { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 13px 10px; border-radius: 18px; background: var(--mint); color: #073a2c; font-size: 18px; font-weight: 900; line-height: 1.15; box-shadow: 0 5px 0 var(--mint-dark); }
.cta.alt { background: var(--coral); color: #fff; box-shadow: 0 5px 0 var(--coral-dark); }
.cta small, .endless small { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; opacity: .85; }
.cta:active, .endless:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--mint-dark); }
.cta[hidden], .ghost[hidden] { display: none; }
.ghost { width: 100%; padding: 11px; border-radius: 16px; color: var(--ink); font-size: 15px; font-weight: 800; box-shadow: inset 0 0 0 2px #2b1d4a26; }

.panel.menu { width: min(100%, 760px); padding: 18px; text-align: left; }
.phead { display: flex; align-items: center; gap: 12px; }
.logo { flex: 0 0 auto; width: 48px; height: 56px; }
.phead .text { margin-top: 3px; }
.rules { font-size: 13.5px; }
.go { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.endless { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 13px 10px; border-radius: 18px; background: var(--gold); color: #3b2a05; font-size: 17px; font-weight: 900; line-height: 1.15; box-shadow: 0 5px 0 var(--gold-dark); text-align: center; }
.menu h3 { margin-top: 16px; font-size: 12px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-muted); }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; margin-top: 8px; }
.lv { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 48px; padding: 4px 2px; border-radius: 12px; background: #efe7fb; box-shadow: 0 3px 0 #dccdf2; }
.lv b { font-size: 16px; font-weight: 900; line-height: 1.1; }
.lv small { font-size: 10px; letter-spacing: 1px; color: #d8cbea; line-height: 1.2; }
.lv small i { font-style: normal; }
.lv small i.on { color: var(--gold-dark); }
.lv:disabled { opacity: .45; cursor: default; box-shadow: none; }
.lv[aria-current="true"] { background: var(--mint); box-shadow: 0 3px 0 var(--mint-dark); }
.lv[aria-current="true"] small { color: #1c7a5c; }
.lv[aria-current="true"] small i.on { color: #3b2a05; }
.lv:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #dccdf2; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; margin-top: 14px; padding: 9px 12px; border-radius: 14px; background: #efe7fb; font-size: 14px; font-weight: 800; text-align: left; }
.toggle i { position: relative; flex: 0 0 auto; width: 42px; height: 24px; border-radius: 99px; background: #c8bcdc; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px #0004; }
.toggle[aria-pressed="true"] i { background: var(--mint-dark); }
.toggle[aria-pressed="true"] i::after { transform: translateX(18px); }
.keys { margin-top: 10px; font-size: 12px; color: var(--ink-muted); }

.stars { margin-top: 6px; font-size: 32px; letter-spacing: 5px; color: #e3d8f1; min-height: 1.25em; }
.stars b { color: var(--gold); text-shadow: 0 2px 0 var(--gold-dark); display: inline-block; animation: star .4s calc(var(--i) * 150ms + .2s) both cubic-bezier(.3, 1.6, .5, 1); }
@keyframes star { from { transform: scale(0) rotate(-40deg); } }
.badge { display: inline-block; margin-top: 8px; padding: 5px 14px; border-radius: 99px; background: var(--gold); color: #3b2a05; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.fine { margin-top: 6px; font-size: 12.5px; color: var(--ink-muted); line-height: 1.4; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 380px) {
  .app { gap: 6px; padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
  h1 { font-size: 20px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; }
  .goal, .stat { padding: 3px 6px 4px; }
  .goal small, .stat small { font-size: 10px; letter-spacing: 0; }
  .chips { gap: 6px; }
  .chip { font-size: 13px; }
  .chip svg { width: 15px; height: 15px; }
  .stat { min-width: 54px; }
  .stat strong { font-size: 16px; }
  .tool { min-height: 46px; font-size: 11px; }
  .tool svg { width: 20px; height: 20px; }
  .panel.menu { padding: 14px 12px; }
  .go { gap: 8px; }
  .cta, .endless { padding: 11px 6px; font-size: 16px; }
}
@media (max-height: 600px) and (max-aspect-ratio: 5/4) and (min-width: 400px) {
  .tool { min-height: 42px; flex-direction: row; gap: 5px; }
  .tool .count { position: static; }
}
@media (max-height: 560px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 16px; border-radius: 22px; }
  .panel h2 { font-size: 23px; }
  .panel .text { margin-top: 5px; font-size: 13.5px; line-height: 1.35; }
  .stars { font-size: 26px; margin-top: 2px; }
  .result { margin-top: 4px; font-size: 17px; }
  .actions { margin-top: 10px; gap: 8px; }
  .cta, .endless { padding: 10px 8px; }
  .ghost { padding: 8px; }
}

/* Wide frames: the board and tray use the full height on the left; HUD and boosters move to a side column */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: none; grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto auto minmax(0, 1fr); grid-template-areas: "stage top" "stage hud" "stage tools" "stage ."; column-gap: 16px; row-gap: 10px; }
  h1 { white-space: normal; font-size: clamp(20px, 2.3vw, 30px); }
  .sub { font-size: 13px; }
  .top { align-items: flex-start; }
  .hud { flex-direction: column; gap: 6px; }
  .goal { flex: none; padding: 7px 12px 8px; }
  .chips { flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
  .chip { font-size: 17px; }
  .chip svg { width: 20px; height: 20px; }
  .gbar { height: 6px; margin-top: 6px; }
  .stat { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 7px 12px; text-align: left; flex-wrap: wrap; }
  .stat small { font-size: 11px; }
  .stat strong { font-size: 20px; }
  .mini { flex: 1 0 100%; font-size: 12px; text-align: right; }
  .tools { flex-direction: column; gap: 8px; }
  .tool { flex: none; flex-direction: row; justify-content: flex-start; gap: 10px; min-height: 52px; padding: 0 14px; font-size: 14px; }
  .tool .count { position: static; margin-left: auto; font-size: 12.5px; }
  .tool svg { width: 24px; height: 24px; }
  .panel.menu { width: min(100%, 860px); }
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  .app { --side: clamp(160px, 26vw, 220px); row-gap: 6px; column-gap: 10px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  h1 { font-size: 19px; }
  .sub { font-size: 11.5px; margin-top: 1px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 11px; }
  .icon-btn svg { width: 19px; height: 19px; }
  .hud { gap: 4px; }
  .goal { padding: 3px 9px 4px; }
  .goal small, .stat small { font-size: 10px; letter-spacing: .02em; }
  .chips { margin-top: 1px; gap: 2px 8px; }
  .chip { font-size: 14px; }
  .chip svg { width: 16px; height: 16px; }
  .gbar { height: 4px; margin-top: 3px; }
  .stat { padding: 3px 9px; }
  .stat strong { font-size: 16px; }
  .mini { flex: 0 0 auto; font-size: 10px; }
  .tools { flex-direction: row; gap: 5px; }
  .tool { flex: 1; flex-direction: column; justify-content: center; gap: 1px; min-height: 44px; padding: 3px 2px; font-size: 10.5px; border-radius: 11px; }
  .tool svg { width: 18px; height: 18px; }
  .tool .count { position: absolute; top: 2px; right: 3px; margin: 0; min-width: 16px; padding: 0 4px; font-size: 10px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 360px) {
  .sub { display: none; }
  .tool > span { display: none; }
  .tool { min-height: 38px; }
  .tool svg { width: 20px; height: 20px; }
}
@media (max-height: 420px) {
  .panel.menu { padding: 10px 14px; }
  .phead .logo { width: 34px; height: 40px; }
  .rules { display: none; }
  .go { margin-top: 8px; }
  .cta, .endless { padding: 8px 6px; font-size: 16px; }
  .menu h3 { margin-top: 10px; }
  .toggle { margin-top: 10px; padding: 6px 10px; }
  .keys { display: none; }
  .panel h2 { font-size: 21px; }
  .stars { font-size: 22px; }
  .actions .row { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div class="title">
      <h1>Hexa <span>Sort</span></h1>
      <p class="sub" id="mode-name"></p>
    </div>
    <button type="button" class="icon-btn" id="restart" data-i18n-label="restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button type="button" class="icon-btn" id="menu" data-i18n-label="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5 12 5.8v4.6L8 12.7 4 10.4V5.8z"/><path d="M16 3.5l4 2.3v4.6l-4 2.3-4-2.3V5.8z"/><path d="M12 11.3l4 2.3v4.6l-4 2.3-4-2.3v-4.6z"/></svg></button>
  </header>
  <div class="hud">
    <div class="goal" id="goal-box">
      <small id="goal-label"></small>
      <div class="chips" id="chips"></div>
      <div class="gbar" aria-hidden="true"><i id="gbar"></i></div>
    </div>
    <div class="stat" id="stat-a"><small id="stat-a-label"></small><strong id="stat-a-val">0</strong><span class="mini" id="mini" aria-hidden="true"><i>★</i><i>★</i><i>★</i></span></div>
    <div class="stat" id="stat-b" hidden><small id="stat-b-label"></small><strong id="stat-b-val">0</strong></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="board" tabindex="0" role="application" aria-describedby="keys-hint"></canvas>
    <p class="toast" id="toast" aria-hidden="true"></p>
  </div>
  <div class="tools">
    <button type="button" class="tool" id="b-hammer" aria-keyshortcuts="H" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13.5 3.5 7 7-2.8 2.8-7-7z"/><path d="m12.4 8.8-8.6 8.6a1.9 1.9 0 0 0 2.7 2.7l8.6-8.6"/></svg><span data-i18n="hammer"></span><b class="count" id="c-hammer">0</b></button>
    <button type="button" class="tool" id="b-swap" aria-keyshortcuts="S" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg><span data-i18n="swap"></span><b class="count" id="c-swap">0</b></button>
    <button type="button" class="tool" id="b-shuffle" aria-keyshortcuts="R"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg><span data-i18n="shuffle"></span><b class="count" id="c-shuffle">0</b></button>
  </div>
  <p class="sr-only" id="keys-hint" data-i18n="keys"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel menu" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <div class="phead">
      <svg class="logo" viewBox="0 0 48 56" aria-hidden="true"><path d="M24 30 42 40v6L24 56 6 46v-6z" fill="#3f6ae6"/><path d="M24 30l18 10-18 10L6 40z" fill="#6f97ff"/><path d="M24 20l18 10v6L24 46 6 36v-6z" fill="#f0bd1d"/><path d="M24 20l18 10-18 10L6 30z" fill="#ffe066"/><path d="M24 10l18 10v6L24 36 6 26v-6z" fill="#e2435f"/><path d="M24 2l18 10v8L24 30 6 20v-8z" fill="#e2435f"/><path d="M24 2l18 10-18 10L6 12z" fill="#ff7088"/></svg>
      <div>
        <h2 id="start-title">Hexa <span>Sort</span></h2>
        <p class="text" data-i18n="tagline"></p>
      </div>
    </div>
    <p class="text rules" data-i18n="rules"></p>
    <div class="go">
      <button type="button" class="cta" id="go-level"><span id="go-level-text"></span><small id="go-level-sub"></small></button>
      <button type="button" class="endless" id="go-endless"><span data-i18n="endless"></span><small id="endless-sub"></small></button>
    </div>
    <h3 data-i18n="levels"></h3>
    <div class="levels" id="levels"></div>
    <button type="button" class="toggle" id="symbols" aria-pressed="false"><span data-i18n="symbols"></span><i aria-hidden="true"></i></button>
    <p class="keys" data-i18n="keys"></p>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <h2 id="win-title" data-i18n="winTitle"></h2>
    <p class="text" id="win-level"></p>
    <p class="stars" id="win-stars" aria-hidden="true"></p>
    <p class="result" id="win-moves"></p>
    <p class="fine" id="win-par"></p>
    <p class="badge" id="win-reward" hidden></p>
    <p class="text" id="win-all" data-i18n="allDone" hidden></p>
    <div class="actions">
      <button type="button" class="cta" id="win-next"></button>
      <div class="row"><button type="button" class="ghost" id="win-replay" data-i18n="replay"></button><button type="button" class="ghost" id="win-menu" data-i18n="toMenu"></button></div>
    </div>
  </div>
</div>

<div class="overlay" id="lose" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="lose-title">

  // Moves matching top runs together across the connected group, deepest stacks first, then clears runs of 10+.

  // ---------- Drawing ----------
  function hexPath(g, x, y, r) {

    const r = V.R * TRAY_S;
    V.slots.forEach((s, i) => {
      const lifted = drag && drag.moved && drag.slot === i;
      sideBand(g, s.x, s.y, r * 1.05, r * 0.22, '#170d2e', '#22143f');
      hexPath(g, s.x, s.y, r * 1.05); g.fillStyle = '#2f2157'; g.fill();
      if (selected === i && D.tray[i] && !mode) { g.strokeStyle = '#3fe0b2'; g.lineWidth = Math.max(2, r * 0.09); hexPath(g, s.x, s.y, r * 1.05); g.stroke(); }
      if (V.R > 22) {
        g.font = `800 ${Math.max(10, r * 0.3)}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = '#bfb2e488'; g.fillText(String(i + 1), s.x - r * 1.0, s.y + r * K * 0.95);
      }
      const st = D.tray[i];
      if (!st || lifted) return;
      const k = ease((clock - trayT0 - i * 70 * SPEED) / (260 * SPEED));
      if (k <= 0) return;
      const bob = selected === i && !mode ? r * 0.12 : 0;
      g.save(); g.translate(s.x, s.y - bob); g.scale(k, k);
      drawStack(g, 0, 0, st, r); g.restore();
    });
  }

  function spawnParticles(x, y, col, n) {
    if (reduced) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260;
      FX.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.7 - 260, col, age: 0, life: 550 + Math.random() * 350, size: V.R * (0.12 + Math.random() * 0.14), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12 });
    }
  }

  // ---------- HUD ----------
  const hexIcon = (fill, glyph) => `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5 17.4 5.75v8.5L10 18.5 2.6 14.25v-8.5z" fill="${fill}"/>${glyph != null && symbols ? `<path d="${GLYPHS[glyph]}" fill="#fff" transform="translate(5 5)"/>` : ''}</svg>`;
  const stackIcon = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 11 17 15 10 19 3 15z" fill="#6f97ff"/><path d="M10 6.5 17 10.5 10 14.5 3 10.5z" fill="#ffe066"/><path d="M10 2 17 6 10 10 3 6z" fill="#ff7088"/></svg>';

  function goalText(def) {
    if (def.goals) return t.goalColors(def.goals.map(([c, n]) => t.goalPart(n, colorWord(c, n))).join(t.join));
    return t.goalTiles(def.tiles);
  }

  function buildHud() {
    const endless = G.def.endless;
    els.modeName.textContent = endless ? t.endlessName : t.levelName(G.def.li + 1);
    els.goalLabel.textContent = endless ? t.cleared : t.goal;
    els.statALabel.textContent = endless ? t.score : t.moves;
    els.mini.hidden = endless;
    els.statB.hidden = !endless;
    els.statBLabel.textContent = t.best;
    els.chips.innerHTML = '';
    if (!endless && G.def.goals) {
      for (const [c] of G.def.goals) { const chip = document.createElement('span'); chip.className = 'chip'; chip.dataset.color = c; chip.innerHTML = `${hexIcon(COLORS[c].side, c)}<b></b>`; els.chips.append(chip); }
    } else {
      const chip = document.createElement('span'); chip.className = 'chip'; chip.innerHTML = `${stackIcon}<b></b>`; els.chips.append(chip);
    }
    renderHud();
  }

  function renderHud() {
    if (!G || !D) return;
    const endless = G.def.endless;
    const chips = [...els.chips.children];
    let frac = 0;
    if (endless) {
      chips[0].querySelector('b').textContent = String(D.cleared);
      chips[0].setAttribute('aria-label', `${t.cleared}: ${D.cleared}`);
      frac = (D.score % 1000) / 1000;
      els.statAVal.textContent = String(D.score);
      els.statBVal.textContent = String(Math.max(best, D.score));
    } else if (G.def.goals) {
      let sum = 0;
      chips.forEach((chip, k) => {
        const [c, n] = G.def.goals[k], d = Math.min(n, D.byColor[c]);
        sum += d;
        chip.querySelector('b').textContent = `${d}/${n}`;
        chip.classList.toggle('done', d >= n);
        chip.setAttribute('aria-label', t.chipLabel(colorTitle(c), d, n));
      });
      frac = sum / G.def.total;
    } else {
      const d = Math.min(G.def.tiles, D.cleared);
      chips[0].querySelector('b').textContent = `${d}/${G.def.tiles}`;
      chips[0].classList.toggle('done', d >= G.def.tiles);
      chips[0].setAttribute('aria-label', `${t.goalTiles(G.def.tiles)}: ${d}`);
      frac = d / G.def.tiles;
    }
    els.gbar.style.width = `${Math.round(frac * 100)}%`;
    if (!endless) {
      els.statAVal.textContent = String(G.moves);
      const stars = starsFor(Math.max(G.moves, 0));
      [...els.mini.children].forEach((el, k) => el.classList.toggle('off', k >= stars));
    }
    for (const kind of KINDS) {
      const n = boosterCount(kind);
      boosterCounts[kind].textContent = String(n);
      boosterBtns[kind].classList.toggle('empty', n <= 0);
      boosterBtns[kind].setAttribute('aria-label', t.boosterLabel(t[kind], n));
      if (kind !== 'shuffle') boosterBtns[kind].setAttribute('aria-pressed', String(mode === kind));
    }
    const filled = G.stacks.filter(s => s.length).length;
    canvas.setAttribute('aria-label', t.boardLabel(filled, G.locks.filter(l => !l).length));
  }

  let toastTimer = 0;
  function toast(text, ms = 1800) {
    els.toast.textContent = text;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), ms);
  }
  function announce(text) { els.announcer.textContent = ''; requestAnimationFrame(() => { els.announcer.textContent = text; }); }

  // ---------- Flow ----------
  function startGame(S) {
    timers.length = 0;
    for (const k of Object.keys(FX)) FX[k] = [];
    G = S; busy = false; mode = null; swapFirst = null; drag = null; press = null; hover = null;
    startBest = best;
    syncDisplay();
    selected = G.tray.findIndex(s => s);
    cursor = Math.floor(board().cells.length / 2);
    trayT0 = clock;
    layoutView();
    buildHud();
    for (const o of overlays()) o.hidden = true;
    saveGame();
    requestDraw();
  }
  function startLevel(li) {
    startGame(createState(levelDef(li), (Math.random() * 2 ** 32) >>> 0));
    const msg = t.intro(li + 1, goalText(G.def));
    toast(msg, 2600); announce(msg);
    canvas.focus({ preventScroll: true });
  }
  function startEndless() {
    startGame(createState(endlessDef(), (Math.random() * 2 ** 32) >>> 0));
    toast(t.endlessName, 2000); announce(t.endlessName);
    canvas.focus({ preventScroll: true });
  }
  function restartCurrent() { if (G.def.endless) startEndless(); else startLevel(G.def.li); }

  function cellDesc(i) {
    if (G.locks[i]) return t.lockCell(Math.max(0, G.locks[i] - G.cleared));
    const s = G.stacks[i];
    return s.length ? t.stackDesc(s.length, topRun(s), colorWord(topOf(s), topRun(s))) : t.cellEmpty;
  }
  const slotDesc = i => (G.tray[i] ? t.slotDesc(i + 1, t.stackDesc(G.tray[i].length, topRun(G.tray[i]), colorWord(topOf(G.tray[i]), topRun(G.tray[i])))) : t.slotUsed(i + 1));

  function ensureSelection() { if (!G.tray[selected]) selected = Math.max(0, G.tray.findIndex(s => s)); }

  // Logic first (so progress is safe), then the animation catches the screen up.
  async function doPlace(slot, cell, from) {
    if (busy || !G || G.won || mode || !G.tray[slot] || G.locks[cell] || G.stacks[cell].length) return false;
    const stack = G.tray[slot].slice();
    const out = [];
    logicPlace(G, slot, cell, out);
    afterLogic();
    busy = true;
    D.tray[slot] = null;
    await animDrop(stack, from || slotFrom(slot), cell);
    await playEvents(out);
    finishTurn(out);
    return true;
  }
  const slotFrom = i => ({ x: V.slots[i].x, y: V.slots[i].y, s: TRAY_S, arc: 0.7 });

  function afterLogic() {
    if (!G.def.endless && !G.won && goalMet(G)) {
      G.won = true;
      const li = G.def.li, stars = starsFor(G.moves), prev = P.stars[li] || 0;
      G.stars = stars;
      G.rewards = [];
      if (!prev) { const kind = KINDS[li % 3]; INV[kind]++; G.rewards.push(kind); }
      if (stars === 3 && prev < 3) { const kind = KINDS[(li + 1) % 3]; INV[kind]++; G.rewards.push(kind); }
      P.stars[li] = Math.max(prev, stars);
      P.unlocked = Math.max(P.unlocked, Math.min(LEVELS.length, li + 2));
      write(STORE.progress, P); write(STORE.boosters, INV);
    }
    if (G.def.endless && G.score > best) { best = G.score; write(STORE.best, best); }
    saveGame();
  }

  async function animDrop(stack, from, cell) {
    const fx = { stack, x0: from.x, y0: from.y, s0: from.s, arc: from.arc, cell, t0: clock, dur: 230 * SPEED };
    FX.drops.push(fx);
    await wait(fx.dur);
    FX.drops.splice(FX.drops.indexOf(fx), 1);
    D.stacks[cell] = stack.slice();
  }

  async function playEvents(out) {
    const msgs = [];
    for (const e of out) {
      if (e.t === 'move') { msgs.push(t.merged(e.n, colorWord(e.col, e.n))); await animMove(e); }
      else if (e.t === 'clear') { msgs.push(t.clearedMsg(e.n, colorWord(e.col, e.n), e.pts) + (e.chain > 1 ? ` ${t.combo(e.chain)}` : '')); await animClear(e); }
      else if (e.t === 'unlock') { msgs.push(t.unlocked); await animUnlock(e); }
      else if (e.t === 'refill') { D.tray = e.tray.map(s => s.slice()); trayT0 = clock; msgs.push(t.newStacks); await wait(120 * SPEED); }
      else if (e.t === 'bonus') { const m = t.bonus(t[e.kind]); msgs.push(m); toast(m); }
      else if (e.t === 'colors') { msgs.push(t.moreColors); toast(t.moreColors); }
    }
    const big = out.filter(e => e.t === 'move' || e.t === 'clear');
    if (msgs.length) announce(msgs.filter((m, i) => i < 6 || !big.length).join(' '));
  }

  async function animMove(e) {
    const stagger = Math.min(55, 380 / e.n) * SPEED, dur = 250 * SPEED;
    const inflight = cell => FX.flights.filter(f => f.b.cell === cell).length;
    for (let k = 0; k < e.n; k++) {
      const col = D.stacks[e.from].pop();
      const fl = { col, a: { cell: e.from, layer: D.stacks[e.from].length }, b: { cell: e.to, layer: D.stacks[e.to].length + inflight(e.to) }, t0: clock, dur };
      FX.flights.push(fl);
      wait(dur).then(() => { const i = FX.flights.indexOf(fl); if (i >= 0) { FX.flights.splice(i, 1); D.stacks[e.to].push(col); } });
      if (k < e.n - 1) await wait(stagger);
    }
    await wait(dur + 30 * SPEED);
  }

  async function animClear(e) {
    const s = D.stacks[e.cell], start = s.length - e.n, R = V.R;
    for (let k = 0; k < e.n; k++) FX.pops.push({ col: s[s.length - 1 - k], cell: e.cell, layer: s.length - 1 - k, t0: clock + k * 30 * SPEED, dur: 260 * SPEED });
    s.length = Math.max(0, start);
    spawnParticles(X(e.cell), Y(e.cell) - (start + e.n * 0.6) * TH * R, e.col, 22);
    FX.floats.push({ cell: e.cell, h: (start + 2) * TH * R, text: `+${e.pts}`, sub: e.chain > 1 ? t.combo(e.chain) : '', t0: clock, dur: 1100 });
    D.cleared += e.n; D.byColor[e.col] += e.n; D.score += e.pts;
    renderHud();
    await wait((e.n * 30 + 260) * SPEED);
  }

  async function animUnlock(e) {
    FX.rings.push({ cell: e.cell, t0: clock, dur: 600 });
    D.locks[e.cell] = 0;
    toast(t.unlocked);
    await wait(240 * SPEED);
  }

  function finishTurn() {
    syncDisplay();
    busy = false;
    ensureSelection();
    renderHud();
    requestDraw();
    checkEnd();
  }

  function checkEnd() {
    if (!G || busy || !els.start.hidden) return;
    if (G.won) { showWin(); return; }
    if (isLost() && !mode) showLose();
  }

  function showOverlay(el, focusEl) {
    for (const o of overlays()) o.hidden = o !== el;
    keyboardMode = false;
    requestDraw();
    if (focusEl) focusEl.focus({ preventScroll: true });
  }

  function showWin() {
    const li = G.def.li, last = li >= LEVELS.length - 1;
    els.winLevel.textContent = t.levelName(li + 1);
    els.winStars.innerHTML = [0, 1, 2].map(i => (i < G.stars ? `<b style="--i:${i}">★</b>` : '★')).join('');
    els.winMoves.textContent = t.winText(G.moves);
    els.winPar.textContent = t.parLine(G.def.par, G.def.par2);
    els.winReward.hidden = !G.rewards.length;
    els.winReward.textContent = G.rewards.length ? t.reward(KINDS.filter(k => G.rewards.includes(k)).map(k => `+${G.rewards.filter(r => r === k).length} ${t[k]}`).join(' · ')) : '';
    els.winAll.hidden = !last;
    els.winNext.textContent = last ? t.playEndless : t.next;
    announce(`${t.won(li + 1)} ${t.winText(G.moves)}. ${'★'.repeat(G.stars)}`);
    if (!reduced) for (let i = 0; i < 4; i++) spawnParticles(V.W * (0.2 + 0.2 * i), V.H * 0.45, Math.floor(Math.random() * 8), 14);
    showOverlay(els.win, els.winNext);
  }

  function showLose() {
    const endless = G.def.endless, hammers = boosterCount('hammer');
    els.loseTitle.textContent = hammers > 0 || !endless ? t.loseTitle : t.overTitle;
    els.loseText.textContent = hammers > 0 ? t.loseText : t.loseTextNo;
    els.loseHammer.hidden = hammers <= 0;
    els.loseHammer.textContent = t.useHammer(hammers);
    els.loseRetry.textContent = endless ? t.again : t.tryAgain;
    els.loseScore.hidden = els.loseBest.hidden = !endless;
    els.loseNewBest.hidden = !(endless && G.score > startBest && G.score > 0);
    if (endless) { els.loseScore.textContent = t.finalScore(G.score); els.loseBest.textContent = t.bestLine(best); }
    announce(`${els.loseTitle.textContent} ${els.loseText.textContent}${endless ? ` ${t.finalScore(G.score)}` : ''}`);
    showOverlay(els.lose, hammers > 0 ? els.loseHammer : els.loseRetry);
  }

  // ---------- Boosters ----------
  function spend(kind) {
    if (G.def.endless) G.boost[kind]--; else { INV[kind]--; write(STORE.boosters, INV); }
    G.used++;
  }
  function toggleBooster(kind) {
    if (!G || busy || G.won || anyOverlay()) return;
    if (boosterCount(kind) <= 0) { toast(t.noBooster); announce(t.noBooster); return; }
    if (kind === 'shuffle') { useShuffle(); return; }
    swapFirst = null;
    if (mode === kind) { mode = null; toast(t.cancelled); announce(t.cancelled); renderHud(); requestDraw(); checkEnd(); return; }
    mode = kind;
    const tip = kind === 'hammer' ? t.hammerTip : t.swapTip;
    toast(tip, 2600); announce(tip);
    renderHud(); requestDraw();
  }
  function useShuffle() {
    spend('shuffle');
    refillTray(G);
    saveGame();
    D.tray = G.tray.map(s => s.slice());
    trayT0 = clock; selected = 0;
    toast(t.shuffled); announce(t.shuffled);
    renderHud(); requestDraw();
  }
  async function useHammer(cell) {
    if (busy || G.locks[cell] || !G.stacks[cell].length) return;
    spend('hammer');
    const s = D.stacks[cell];
    G.stacks[cell] = [];
    mode = null;
    saveGame();
    busy = true;
    for (let k = 0; k < s.length; k++) FX.pops.push({ col: s[s.length - 1 - k], cell, layer: s.length - 1 - k, t0: clock + k * 20 * SPEED, dur: 220 * SPEED });
    spawnParticles(X(cell), Y(cell) - s.length * TH * V.R * 0.5, s[0], 20);
    D.stacks[cell] = [];
    toast(t.smashed); announce(t.smashed);
    renderHud();
    await wait((s.length * 20 + 220) * SPEED);
    finishTurn();
  }
  async function swapPick(cell) {
    if (busy || G.locks[cell]) return;
    if (swapFirst == null) {
      if (!G.stacks[cell].length) return;
      swapFirst = cell; toast(t.swapTip2, 2400); announce(t.swapTip2); requestDraw(); return;
    }
    if (cell === swapFirst) { swapFirst = null; requestDraw(); return; }
    const a = swapFirst, b = cell, sa = G.stacks[a].slice(), sb = G.stacks[b].slice();
    swapFirst = null; mode = null;
    spend('swap');
    const out = [];
    logicSwap(G, a, b, out);
    afterLogic();
    busy = true;
    D.stacks[a] = []; D.stacks[b] = [];
    const flyA = sa.length ? animDrop(sa, { x: X(a), y: Y(a), s: 1, arc: 0.9 }, b) : null;
    const flyB = sb.length ? animDrop(sb, { x: X(b), y: Y(b), s: 1, arc: 0.5 }, a) : null;
    renderHud();
    await Promise.all([flyA, flyB]);
    announce(t.swapped);
    await playEvents(out);
    finishTurn();
  }

  // ---------- Input ----------
  function local(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function slotAt(pt) { return V.slots.findIndex(s => Math.abs(pt.x - s.x) < s.w / 2 && pt.y > s.top - V.R * 0.3 && pt.y < s.top + s.h + V.R * 0.2); }
  function cellAt(pt) {
    const cells = board().cells, R = V.R;
    for (let i = cells.length - 1; i >= 0; i--) {
      const n = D.stacks[i].length;
      if (!n) continue;
      const x = X(i), y = Y(i);
      if (Math.abs(pt.x - x) < R * 0.8 && pt.y < y + R * K && pt.y > y - n * TH * R - R * K * 0.9) return i;
    }
    let bestI = -1, bestD = 0.9;
    for (let i = 0; i < cells.length; i++) { const dx = (pt.x - X(i)) / R, dy = (pt.y - Y(i)) / (R * K); const d = Math.hypot(dx, dy); if (d < bestD) { bestD = d; bestI = i; } }
    return bestI;
  }
  function dropTarget(x, y) {
    let bestI = null, bestD = 1.1;
    for (let i = 0; i < board().cells.length; i++) {
      if (G.locks[i] || G.stacks[i].length) continue;
      const d = Math.hypot((x - X(i)) / V.R, (y - Y(i)) / (V.R * K));
      if (d < bestD) { bestD = d; bestI = i; }
    }
    return bestI;
  }

  canvas.addEventListener('pointerdown', e => {
    if (e.button > 0 || anyOverlay() || !G) return;
    const pt = local(e);
    keyboardMode = false;
    const slot = mode ? -1 : slotAt(pt);
    if (slot >= 0) {
      if (busy || !G.tray[slot]) return;
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch {}
      press = { kind: 'slot', slot, id: e.pointerId, x0: pt.x, y0: pt.y, touch: e.pointerType !== 'mouse' };
      selected = slot;
      requestDraw();
      return;
    }
    press = { kind: 'board', cell: cellAt(pt), id: e.pointerId, x0: pt.x, y0: pt.y };
  });
  canvas.addEventListener('pointermove', e => {
    if (!G) return;
    const pt = local(e);
    if (press && press.kind === 'slot' && e.pointerId === press.id) {
      if (!drag && Math.hypot(pt.x - press.x0, pt.y - press.y0) < 6) return;
      const st = G.tray[press.slot];
      if (!st) return;
      // On touch the stack floats above the finger so it is never hidden under it.
      const lift = press.touch ? st.length * TH * V.R + V.R * 1.3 : -V.R * 0.2;
      drag = drag || { slot: press.slot, moved: true, target: null };
      drag.x = pt.x; drag.y = pt.y - lift;
      drag.target = dropTarget(drag.x, drag.y);
      requestDraw();
      return;
    }
    if (e.pointerType === 'mouse' && !press) {
      const c = cellAt(pt);
      const h = c >= 0 ? c : null;
      if (h !== hover) { hover = h; requestDraw(); }
    }
  });
  canvas.addEventListener('pointerleave', () => { if (hover != null && !drag) { hover = null; requestDraw(); } });
  canvas.addEventListener('pointerup', e => {
    if (!press || e.pointerId !== press.id) return;
    const p = press;
    press = null;
    if (drag) {
      const d = drag;
      drag = null;
      if (d.target != null && !busy) doPlace(d.slot, d.target, { x: d.x, y: d.y, s: 1, arc: 0 });
      requestDraw();
      return;
    }
    if (p.kind === 'slot') { selected = p.slot; announce(slotDesc(p.slot)); requestDraw(); return; }
    if (p.cell < 0) return;
    boardAction(p.cell);
  });
  canvas.addEventListener('pointercancel', () => { press = null; drag = null; requestDraw(); });
  window.addEventListener('blur', () => { press = null; drag = null; requestDraw(); });

  function boardAction(cell) {
    if (!G || busy || G.won) return;
    if (mode === 'hammer') { if (G.stacks[cell].length && !G.locks[cell]) useHammer(cell); return; }
    if (mode === 'swap') { swapPick(cell); return; }
    if (G.locks[cell]) { announce(t.cellAt(board().cells[cell].row, board().cells[cell].col, cellDesc(cell))); return; }
    if (G.stacks[cell].length) { announce(t.cellAt(board().cells[cell].row, board().cells[cell].col, cellDesc(cell))); return; }
    ensureSelection();
    if (G.tray[selected]) doPlace(selected, cell);
  }

  function moveCursor(key) {
    const cells = board().cells, c = cells[cursor];
    let bestI = cursor, bestScore = Infinity;
    cells.forEach((d, i) => {
      if (i === cursor) return;
      const dp = d.p - c.p, dr = d.r - c.r;
      let score = Infinity;
      if (key === 'ArrowLeft' && dr === 0 && dp < 0) score = -dp;
      if (key === 'ArrowRight' && dr === 0 && dp > 0) score = dp;
      if (key === 'ArrowUp' && dr < 0) score = -dr * 10 + Math.abs(dp) + (dp < 0 ? 0.5 : 0);
      if (key === 'ArrowDown' && dr > 0) score = dr * 10 + Math.abs(dp) + (dp < 0 ? 0.5 : 0);
      if (score < bestScore) { bestScore = score; bestI = i; }
    });
    cursor = bestI;
    announce(t.cellAt(cells[cursor].row, cells[cursor].col, cellDesc(cursor)));
  }

  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || !G || anyOverlay()) return;
    const k = e.key;
    const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if (k === '1' || k === '2' || k === '3') {
      e.preventDefault();
      const i = Number(k) - 1;
      keyboardMode = true;
      if (G.tray[i] && !mode) selected = i;
      announce(slotDesc(i));
      requestDraw();
    } else if (k.startsWith('Arrow')) {
      e.preventDefault();
      if (keyboardMode) moveCursor(k); else { keyboardMode = true; announce(t.cellAt(board().cells[cursor].row, board().cells[cursor].col, cellDesc(cursor))); }
      if (document.activeElement !== canvas) canvas.focus({ preventScroll: true });
      requestDraw();
    } else if ((k === 'Enter' || k === ' ') && !onButton) {
      e.preventDefault();
      if (!keyboardMode) { keyboardMode = true; requestDraw(); return; }
      boardAction(cursor);
    } else if (k === 'h' || k === 'H') { e.preventDefault(); keyboardMode = true; toggleBooster('hammer'); }
    else if (k === 's' || k === 'S') { e.preventDefault(); keyboardMode = true; toggleBooster('swap'); }
    else if (k === 'r' || k === 'R') { e.preventDefault(); toggleBooster('shuffle'); }
  });

  for (const kind of KINDS) boosterBtns[kind].addEventListener('click', () => toggleBooster(kind));
  $('restart').addEventListener('click', () => { if (G && !busy) restartCurrent(); });
  $('menu').addEventListener('click', () => openMenu());

  // ---------- Menu ----------
  const levelBtns = [];
  function buildMenu() {
    for (let i = 0; i < LEVELS.length; i++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'lv';
      b.addEventListener('click', () => startLevel(i));
      levelBtns.push(b); els.levels.append(b);
    }
  }
  function refreshMenu() {
    levelBtns.forEach((b, i) => {
      const open = i < P.unlocked, s = P.stars[i] || 0;
      b.disabled = !open;
      b.innerHTML = `<b>${open ? i + 1 : '🔒'}</b><small aria-hidden="true">${[0, 1, 2].map(k => `<i class="${k < s ? 'on' : ''}">★</i>`).join('')}</small>`;
      b.setAttribute('aria-label', open ? t.levelBtn(i + 1, s) : t.levelLocked(i + 1));
      b.setAttribute('aria-current', String(!!G && !G.def.endless && G.def.li === i));
    });
    const inProgress = G && !G.won && G.moves > 0 && !isLost();
    if (inProgress) {
      els.goLevelText.textContent = G.def.endless ? t.resumeEndless : t.resume(G.def.li + 1);
      els.goLevelSub.textContent = t.resumeSub(G.moves);
    } else {
      const n = nextLevel();
      els.goLevelText.textContent = t.playLevel(n + 1);
      els.goLevelSub.textContent = goalText(levelDef(n));
    }
    els.endlessSub.textContent = t.endlessSub(best);
    els.symbols.setAttribute('aria-pressed', String(symbols));
  }
  function openMenu() {
    mode = null; swapFirst = null; drag = null; press = null;
    refreshMenu();
    showOverlay(els.start, els.goLevel);
    renderHud();
  }
  els.goLevel.addEventListener('click', () => {
    const inProgress = G && !G.won && G.moves > 0 && !isLost();
    if (inProgress) { els.start.hidden = true; canvas.focus({ preventScroll: true }); requestDraw(); checkEnd(); }
    else startLevel(nextLevel());
  });
  els.goEndless.addEventListener('click', () => {
    if (G && G.def.endless && !isLost() && G.moves > 0) { els.start.hidden = true; canvas.focus({ preventScroll: true }); requestDraw(); return; }
    startEndless();
  });
  els.symbols.addEventListener('click', () => { symbols = !symbols; write(STORE.symbols, symbols); els.symbols.setAttribute('aria-pressed', String(symbols)); if (G) buildHud(); requestDraw(); });
  els.winNext.addEventListener('click', () => { const li = G.def.li; if (li >= LEVELS.length - 1) startEndless(); else startLevel(li + 1); });
  els.winReplay.addEventListener('click', () => startLevel(G.def.li));
  els.winMenu.addEventListener('click', openMenu);
  els.loseHammer.addEventListener('click', () => { els.lose.hidden = true; mode = 'hammer'; toast(t.hammerTip, 2600); announce(t.hammerTip); renderHud(); canvas.focus({ preventScroll: true }); requestDraw(); });
  els.loseRetry.addEventListener('click', () => { forget(STORE.save); restartCurrent(); });
  els.loseMenu.addEventListener('click', () => { if (G && isLost()) forget(STORE.save); openMenu(); });

  new ResizeObserver(() => { layoutView(); requestDraw(); }).observe(els.stage);
  document.addEventListener('visibilitychange', () => { last = 0; });

  // Read-only hooks for automated tests, plus a pure simulator that never touches the live game.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__hexaSort = {
    state: () => G && {
      endless: !!G.def.endless, level: G.def.li + 1, moves: G.moves, cleared: G.cleared, byColor: G.byColor.slice(), score: G.score, won: G.won, lost: isLost(), busy, mode, swapFirst, selected,
      stacks: G.stacks.map(s => s.slice()), locks: G.locks.slice(), tray: G.tray.map(s => s && s.slice()), goals: G.def.goals, tiles: G.def.tiles, par: G.def.par, par2: G.def.par2, stars: G.stars || 0,
      boosters: { hammer: boosterCount('hammer'), swap: boosterCount('swap'), shuffle: boosterCount('shuffle') }, overlay: overlays().find(o => !o.hidden)?.id || null,
      unlocked: P.unlocked, levelStars: P.stars.slice(), best, R: V.R, side: V.side, displaySynced: JSON.stringify(D.stacks) === JSON.stringify(G.stacks),
    },
    neighbours: i => board().cells[i].nb.slice(),
    cellPoint: i => { const r = canvas.getBoundingClientRect(); return { x: r.left + X(i), y: r.top + Y(i) }; },
    slotPoint: i => { const r = canvas.getBoundingClientRect(), s = V.slots[i]; return { x: r.left + s.x, y: r.top + s.y - V.R * TRAY_S * 0.3 }; },
    levels: () => LEVELS.map((l, i) => { const d = levelDef(i); return { board: d.board, cells: BOARDS[d.board].cells.length, colors: d.colors.length, total: d.total, goals: d.goals, locks: d.locks, pre: d.pre, par: d.par, par2: d.par2 }; }),
    sim: {
      create: (li, seed) => createState(li < 0 ? endlessDef() : levelDef(li), seed),
      fromGame: () => G && cloneState(G),
      clone: S => cloneState(S),
      place: (S, slot, cell) => { const out = []; logicPlace(S, slot, cell, out); return { events: out.length, clears: out.filter(e => e.t === 'clear').length, won: goalMet(S), full: !freeCells(S).length }; },
      free: S => freeCells(S),
      neighbours: (S, i) => BOARDS[S.def.board].cells[i].nb.slice(),
      goalMet: S => goalMet(S),
    },
  };

  buildMenu();
  const restored = restoreGame();
  if (restored) startGame(restored);
  else startGame(createState(levelDef(nextLevel()), (Math.random() * 2 ** 32) >>> 0));
  openMenu();
})();
</script>
</body>
</html>
