<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess</title>
<style>
:root {
  --bg: #141824;
  --text: #f3efe6;
  --muted: #a5adbe;
  --accent: #f2b544;
  --accent-dark: #b77d17;
  --panel: #fff8ea;
  --ink: #252932;
  --ink-muted: #6c7180;
  --line: #e8dcc2;
  --light: #efd9b3;
  --dark: #b4855a;
  --good: #3fae74;
  --bad: #e2574c;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(120% 90% at 50% 18%, #2b3349, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; opacity: .38; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Portrait: cards above and below a full-width board; the move feed takes whatever height is left. */
.app { --bs: min(100vw - 16px, 704px, 100dvh - 216px); position: fixed; inset: 0; width: 100%; max-width: calc(var(--bs) + 16px); margin: 0 auto; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto var(--bs) auto minmax(36px, 1fr) auto; grid-template-areas: "top" "board" "bot" "feed" "actions"; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.card { min-width: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 12px; background: #ffffff0d; box-shadow: inset 0 0 0 1px #ffffff17; transition: background .2s, box-shadow .2s; }
.card.on { background: #f2b5441f; box-shadow: inset 0 0 0 2px var(--accent); }
#card-top { grid-area: top; }
#card-bot { grid-area: bot; }
.av { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 9px; background: #ffffff16; display: grid; place-items: center; }
.av svg { width: 28px; height: 28px; }
.who { flex: 1; min-width: 0; }
.nm { display: block; font-size: 14px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { display: flex; align-items: center; min-height: 16px; font-size: 12px; font-weight: 800; color: var(--muted); line-height: 1.2; white-space: nowrap; overflow: hidden; }
.sub svg { flex: 0 0 auto; width: 16px; height: 16px; margin-right: -6px; }
.sub .adv { margin-left: 9px; }
.sub .txt { overflow: hidden; text-overflow: ellipsis; }
.clock { flex: 0 0 auto; min-width: 58px; padding: 4px 8px; border-radius: 9px; background: #00000047; font-size: 18px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
.clock.run { background: var(--accent); color: #241703; }
.clock.low { background: var(--bad); color: #fff; }

.stage { grid-area: board; position: relative; min-width: 0; min-height: 0; container-type: size; display: grid; place-items: center; }
.board { --s: min(100cqw, 100cqh); --pad: calc(var(--s) * .02); position: relative; width: var(--s); height: var(--s); border-radius: calc(var(--s) * .022); background: linear-gradient(145deg, #74502f, #4a2f1b); box-shadow: 0 calc(var(--s) * .012) 0 #2f1e11, 0 14px 34px #0009, inset 0 0 0 1px #ffffff26; }
.grid, .pieces, .arrows, .coords { position: absolute; inset: var(--pad); }
.grid { display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border-radius: calc(var(--s) * .008); overflow: hidden; touch-action: none; }
.sq { position: relative; background: var(--light); border-radius: 0; cursor: pointer; }
.sq.dk { background: var(--dark); }
.sq::before, .sq::after { content: ""; position: absolute; pointer-events: none; }
.sq.last::before { inset: 0; background: #f5d66b5e; }
.sq.sel::before { inset: 0; background: #f6c94499; }
.sq.hint::before { inset: 0; background: #52d08f7a; }
.sq.check::before { inset: 0; background: radial-gradient(circle, #ff3a2c 0 22%, #ff3a2ca6 42%, transparent 70%); }
.sq.dot::after { left: 35%; top: 35%; width: 30%; height: 30%; border-radius: 50%; background: #20372a57; }
.sq.cap::after { inset: 3%; border-radius: 50%; box-shadow: inset 0 0 0 calc(var(--s) * .009) #20372a5c; }
.sq.over { box-shadow: inset 0 0 0 calc(var(--s) * .007) #fffc; }
.sq.cur::before { inset: 0; box-shadow: inset 0 0 0 calc(var(--s) * .006) var(--accent); }
.sq:focus-visible { outline: none; box-shadow: inset 0 0 0 calc(var(--s) * .008) var(--accent); z-index: 2; }
.coords { display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); pointer-events: none; z-index: 3; }
.coords i { position: relative; }
.cr, .cf { position: absolute; font-size: max(9px, calc(var(--s) * .026)); font-style: normal; font-weight: 900; line-height: 1; color: #8a6038; }
.coords .dk b { color: #f7e6c6; }
.cr { left: 4%; top: 4%; }
.cf { right: 5%; bottom: 3%; }
.pieces { pointer-events: none; }
.pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; transform: translate(calc(var(--x) * 100%), calc(var(--y) * 100%)); transition: transform .2s ease-out, opacity .2s; }
.pc svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 calc(var(--s) * .004) calc(var(--s) * .004) #0006); }
.pc.drag { z-index: 6; transition: none; }
.pc.drag svg { transform: scale(1.14); filter: drop-shadow(0 calc(var(--s) * .014) calc(var(--s) * .012) #0007); }
.pc.gone { opacity: 0; }
.instant .pc { transition: none; }
.arrows { pointer-events: none; z-index: 4; }
.promo { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; border-radius: inherit; background: #0b0e16a8; }
.promo .box { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border-radius: 16px; background: var(--panel); color: var(--ink); box-shadow: 0 10px 30px #000a; }
.promo p { font-size: 14px; font-weight: 900; }
.promo .row { display: flex; gap: 6px; }
.promo .row button { width: clamp(46px, calc(var(--s) * .15), 92px); aspect-ratio: 1; border-radius: 12px; background: #efe5cc; display: grid; place-items: center; }
.promo .row button svg { width: 88%; height: 88%; }
.promo .x { font-size: 13px; font-weight: 800; color: var(--ink-muted); padding: 4px 10px; }
.toast { position: absolute; left: 50%; top: 8px; z-index: 9; transform: translate(-50%, -6px); max-width: calc(100% - 16px); width: max-content; padding: 7px 14px; border-radius: 99px; background: #10141ee8; color: #fff; font-size: 14px; font-weight: 800; text-align: center; line-height: 1.3; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; box-shadow: 0 6px 20px #0008, inset 0 0 0 1px #ffffff1f; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: #1f7a4cf0; }
.toast.bad { background: #b23a2ff0; }

.feed { grid-area: feed; min-height: 0; display: flex; flex-direction: column; gap: 3px; }
.status { flex: 0 0 auto; font-size: 14px; font-weight: 800; line-height: 1.3; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.alert { color: #ff9384; }
.status.over { color: var(--accent); }
.moves { flex: 1 1 auto; min-height: 0; overflow-y: auto; list-style: none; padding: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 10px; font-size: 13px; font-weight: 700; color: var(--muted); scrollbar-width: thin; scrollbar-color: #ffffff33 transparent; }
.moves li { display: flex; gap: 4px; white-space: nowrap; }
.moves .n { color: #ffffff66; font-variant-numeric: tabular-nums; }
.moves .m { color: var(--text); padding: 0 3px; border-radius: 5px; }
.moves .m.cur { background: var(--accent); color: #241703; }
.moves .n + .m, .moves .m + .m { justify-self: start; }
.moves .empty { color: #ffffff59; font-weight: 700; }

.actions { grid-area: actions; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 5px; }
.act { min-width: 0; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 11px; background: #ffffff12; box-shadow: inset 0 0 0 1px #ffffff1a; }
.act:active:not(:disabled) { transform: translateY(1px); background: #ffffff20; }
.act svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.act .half { font-size: 17px; font-weight: 900; line-height: 21px; }
.act .lb { display: none; max-width: 100%; padding: 0 3px; font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Wide screens: the board fills the height on the left, players, moves and buttons sit in a column on the right. */
@media (min-aspect-ratio: 5/4) {
  .app { --side: clamp(214px, calc(100vw - 100dvh - 24px), 400px); max-width: none; width: min(100%, calc(100dvh + var(--side) + 16px)); grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "board top" "board feed" "board bot" "board actions"; column-gap: 12px; }
  .stage { justify-items: end; }
  .card { height: 52px; }
  .feed { padding: 8px 10px; border-radius: 12px; background: #00000033; box-shadow: inset 0 0 0 1px #ffffff12; gap: 6px; }
  .status { font-size: 15px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .moves { display: grid; grid-template-columns: 2.6em repeat(2, minmax(0, 6.5em)); gap: 2px 6px; align-content: start; font-size: 14px; }
  .moves li { display: contents; }
  .moves .m { padding: 1px 5px; }
  .actions { grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .act { height: 50px; }
  .act .lb { display: block; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 560px) {
  .actions { grid-auto-flow: column; grid-template-columns: none; gap: 4px; }
  .act { height: 36px; }
  .act .lb { display: none; }
  .card { height: 44px; }
  .feed { padding: 5px 8px; }
  .status { font-size: 14px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 360px) {
  .app { gap: 5px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .card { height: 40px; }
  .av { width: 28px; height: 28px; }
  .av svg { width: 24px; height: 24px; }
  .clock { min-width: 50px; font-size: 16px; padding: 3px 6px; }
  .act { height: 32px; }
  .moves { font-size: 13px; }
}
@media (max-width: 360px) {
  .card { gap: 6px; padding: 4px 6px; }
  .clock { min-width: 50px; font-size: 16px; padding: 3px 6px; }
  .act { height: 38px; }
}

.ov { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #0a0d15cc; }
.ov.light { background: #0a0d1566; }
.panel { width: min(100%, 390px); max-height: calc(100dvh - 16px); overflow-y: auto; overscroll-behavior: contain; padding: 18px 16px; border-radius: 22px; background: var(--panel); color: var(--ink); text-align: center; box-shadow: 0 7px 0 #d9cba8, 0 24px 60px #000b; animation: rise .28s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 25px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
.logo { display: flex; align-items: center; justify-content: center; gap: 8px; }
.logo svg { width: 46px; height: 46px; }
.logo h1 { font-size: 38px; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.tagline { margin-top: 8px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--ink-muted); }
.modes { margin-top: 14px; display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 1px 10px; padding: 9px 12px; border-radius: 16px; background: #fff; text-align: left; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode.hot { box-shadow: 0 3px 0 var(--accent-dark), inset 0 0 0 2px var(--accent); }
.mode .ic { grid-row: span 2; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--c, #efe5cc); }
.mode .ic svg { width: 34px; height: 34px; }
.mode strong { font-size: 16px; font-weight: 900; line-height: 1.2; }
.mode small { font-size: 12px; font-weight: 700; color: var(--ink-muted); line-height: 1.3; }
.small { margin-top: 10px; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--ink-muted); }
.field { margin-top: 14px; text-align: left; }
.label { margin-bottom: 6px; font-size: 12px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #efe5cc; }
.seg button { flex: 1; min-width: 0; min-height: 36px; padding: 7px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--ink-muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #d9cba8; }
.levels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.lv { position: relative; height: 46px; border-radius: 12px; background: #fff; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); display: grid; place-content: center; gap: 1px; }
.lv strong { font-size: 18px; font-weight: 900; line-height: 1; }
.lv small { min-height: 12px; font-size: 11px; font-weight: 900; line-height: 1; color: var(--good); }
.lv small.star { color: #e09a10; }
.lv[aria-checked="true"] { background: var(--accent); box-shadow: 0 3px 0 var(--accent-dark); }
.lv[aria-checked="true"] small { color: #241703; }
.lvinfo { margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 15px; font-weight: 900; }
.lvinfo span { color: var(--ink-muted); font-size: 13px; }
.cta { display: block; width: 100%; margin-top: 16px; padding: 13px; border-radius: 16px; background: var(--accent); color: #241703; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 14px; background: #efe5cc; color: var(--ink); font-size: 15px; font-weight: 800; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 10px; padding: 9px 12px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); text-align: left; font-size: 15px; font-weight: 800; }
.sw { flex: 0 0 auto; width: 42px; height: 24px; border-radius: 99px; background: #d6ccb2; position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .2s; }
.toggle[aria-checked="true"] .sw { background: var(--good); }
.toggle[aria-checked="true"] .sw::after { transform: translateX(18px); }
.pz-group { margin-top: 14px; text-align: left; }
.pz-group h3 { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 900; }
.pz-group h3 span { font-size: 12px; color: var(--ink-muted); }
.pz-grid { margin-top: 6px; display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.pz { position: relative; height: 40px; border-radius: 11px; background: #fff; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); font-size: 15px; font-weight: 900; }
.pz.done { background: #d9f2e2; box-shadow: 0 3px 0 #a9d8bb, inset 0 0 0 1px #a9d8bb; color: #17633b; }
.pz.done::after { content: "✓"; position: absolute; right: 4px; top: 2px; font-size: 10px; }
.big { font-size: 46px; line-height: 1.1; }
.reason { margin-top: 6px; font-size: 15px; font-weight: 700; line-height: 1.4; color: var(--ink-muted); }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: var(--accent); color: #3c2800; font-size: 14px; font-weight: 900; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 520px) {
  .panel { padding: 12px 14px; border-radius: 18px; }
  .logo h1 { font-size: 30px; }
  .logo svg { width: 36px; height: 36px; }
  .tagline { display: none; }
  .modes { margin-top: 10px; gap: 6px; }
  .mode { padding: 6px 10px; }
  .field { margin-top: 10px; }
  .cta { margin-top: 12px; padding: 10px; font-size: 17px; }
  .ghost { margin-top: 8px; padding: 9px; }
  .big { font-size: 36px; }
}
@media (max-height: 520px) and (min-width: 540px) {
  .panel.wide { width: min(100%, 660px); }
  .panel.wide .modes { grid-template-columns: 1fr 1fr; }
  .panel.split { width: min(100%, 700px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; align-items: start; }
  .panel.split > h2 { grid-column: 1 / -1; }
  .panel.split .col1 { grid-column: 1; grid-row: 2 / span 5; }
  .panel.split > :not(h2):not(.col1) { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="pg-w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#dccdb1"/></linearGradient>
  <linearGradient id="pg-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f5a62"/><stop offset="1" stop-color="#1b191d"/></linearGradient>
</defs></svg>
<main class="app" id="app">
  <div class="card" id="card-top"><span class="av" id="av-top" aria-hidden="true"></span><div class="who"><span class="nm" id="nm-top"></span><span class="sub" id="sub-top"></span></div><span class="clock" id="clock-top" hidden></span></div>
  <div class="stage" id="stage">
    <div class="board" id="board">
      <div class="grid" id="grid" role="grid" data-i18n-label="board"></div>
      <div class="pieces" id="pieces" aria-hidden="true"></div>
      <div class="coords" id="coords" aria-hidden="true"></div>
      <svg class="arrows" id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
      <div class="promo" id="promo" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="promo-title"><p id="promo-title" data-i18n="promote"></p><div class="row" id="promo-row"></div><button type="button" class="x" id="promo-cancel" data-i18n="cancel"></button></div></div>
    </div>
    <div class="toast" id="toast" aria-hidden="true"></div>
  </div>
  <div class="card" id="card-bot"><span class="av" id="av-bot" aria-hidden="true"></span><div class="who"><span class="nm" id="nm-bot"></span><span class="sub" id="sub-bot"></span></div><span class="clock" id="clock-bot" hidden></span></div>
  <section class="feed" id="feed"><p class="status" id="status"></p><ol class="moves" id="moves" data-i18n-label="moveList"></ol></section>
  <nav class="actions" id="actions">
    <button type="button" class="act" id="b-undo" data-i18n-label="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="lb" data-i18n="undo"></span></button>
    <button type="button" class="act" id="b-hint" data-i18n-label="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span class="lb" data-i18n="hint"></span></button>
    <button type="button" class="act" id="b-retry" data-i18n-label="retry" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6"/><path d="M4 3.5v5.1h5.1"/></svg><span class="lb" data-i18n="retry"></span></button>

    const g = game;
    if (!g || g.over) return;
    if (g.mode === 'puzzle') return puzzleHint();
    if (!canAct() || g.clock || els.hint.classList.contains('busy')) return;
    g.helped = true;
    const token = g.token, ply = g.moves.length;
    els.hint.classList.add('busy');
    runSearch(g.pos, { depth: 14, time: 800 }, result => {
      els.hint.classList.remove('busy');
      if (game !== g || g.token !== token || g.moves.length !== ply || g.over) return;
      showHint(result.move, 2);
    });
  }

  function showHint(m, level) {
    const g = game, f = Engine.from(m), to = Engine.to(m);
    g.hint = level > 1 ? [f, to] : [f];
    if (level > 1) drawArrow(f, to);
    render();
    announce(level > 1 ? t.hintSaid(sqName(f), sqName(to)) : `${t.hint}: ${sqName(f)}`);
  }

  function offerDraw() {
    const g = game;
    if (!g || g.over || g.mode === 'puzzle' || g.mode === 'idle' || overlayOpen()) return;
    const side = g.pos.side;
    if (g.mode === 'pvp') return confirmBox(t.drawQ(colorName(side)), t.drawAsk(colorName(side ^ 1)), t.accept, t.decline, () => endGame('1/2', 'agreed'));
    if (!canAct() || g.moves.length < g.drawBlock) return;
    const e = g.evalCp;
    if (e !== null && (e <= -150 || (Math.abs(e) <= 25 && g.moves.length >= 60))) return endGame('1/2', 'agreed');
    g.drawBlock = g.moves.length + 10;
    toast(t.drawDeclined);
    announce(t.drawDeclined);
    render();
  }

  function resign() {
    const g = game;
    if (!g || g.over || g.mode === 'puzzle' || g.mode === 'idle' || overlayOpen()) return;
    const side = g.mode === 'cpu' ? g.human : g.pos.side;
    confirmBox(g.mode === 'cpu' ? t.resignQ : t.resignQOf(colorName(side)), '', t.resignYes, t.cancel, () => endGame(side === WHITE ? '0-1' : '1-0', 'resign', side));
  }

  function flagFall(side) {
    if (Engine.canMate(game.pos, side ^ 1)) endGame(side === WHITE ? '0-1' : '1-0', 'timeout', side);
    else endGame('1/2', 'timeoutDraw', side);
  }

  // ---- Puzzles ----------------------------------------------------------------------------
  function puzzleMove(m, dragged) {
    const g = game, pz = g.puzzle;
    const expected = pz.line[pz.step];
    const outcome = applyMove(m, dragged);
    const mate = outcome?.reason === 'mate';
    g.legal = [];
    if (Engine.uci(m) !== expected && !mate) {
      g.busy = true;
      render();
      play('error');
      toast(t.wrong, 'bad');
      announce(t.wrong);
      g.timer = setTimeout(() => {
        if (game !== g) return;
        g.busy = false;
        Engine.unmakeMove(g.pos);
        g.moves.pop();
        const prev = g.moves[g.moves.length - 1];
        g.last = prev ? [Engine.from(prev.m), Engine.to(prev.m)] : null;
        rebuildPieces();
        nextTurn();
      }, reducedMotion.matches ? 500 : 900);
      return;
    }
    pz.step++;
    if (mate || pz.step >= pz.line.length) return puzzleSolved();
    g.busy = true;
    render();
    toast(t.correct, 'good');
    g.timer = setTimeout(() => {
      if (game !== g) return;
      g.busy = false;
      g.legal = Engine.legalMoves(g.pos);
      applyMove(Engine.moveFromUci(g.pos, pz.line[pz.step]));
      pz.step++;
      nextTurn();
    }, reducedMotion.matches ? 300 : 650);
  }

  function puzzleHint() {
    const g = game, pz = g.puzzle;
    if (!canAct()) return;
    g.hintLevel = Math.min(2, g.hintLevel + 1);
    showHint(Engine.moveFromUci(g.pos, pz.line[pz.step]), g.hintLevel);
  }

  function puzzleSolved() {
    const g = game, i = g.puzzle.i;
    g.over = true;
    g.legal = [];
    solved.add(i);
    write(STORE.puzzles, [...solved]);
    play('win');
    const done = solved.size === PUZZLES.length;
    g.title = t.solved;
    render();
    announce(`${t.solved} ${t.solvedCount(solved.size, PUZZLES.length)}`);
    els.resultEmoji.textContent = done ? '🏆' : '🎯';
    els.resultTitle.textContent = t.solved;
    els.resultReason.textContent = done ? t.allDone : t.solvedCount(solved.size, PUZZLES.length);
    els.resultBadge.hidden = true;
    els.resultMain.textContent = t.nextPuzzle;
    els.resultReview.textContent = t.list;
    g.timer = setTimeout(() => { if (game === g) show('result'); }, reducedMotion.matches ? 300 : 800);
  }

  function nextPuzzleIndex(from) {
    for (let k = 1; k <= PUZZLES.length; k++) { const i = (from + k) % PUZZLES.length; if (!solved.has(i)) return i; }
    return (from + 1) % PUZZLES.length;
  }

  // ---- Clock ------------------------------------------------------------------------------
  let lastTick = performance.now();
  function tick(now) {
    const dt = Math.min(now - lastTick, 50);
    lastTick = now;
    const g = game;
    if (g && g.clock && g.clock.running && !g.over && !overlayOpen() && !document.hidden) {
      const side = g.pos.side;
      g.clock.ms[side] = Math.max(0, g.clock.ms[side] - dt);
      if (g.clock.ms[side] === 0) flagFall(side);
      renderClocks();
    }
    requestAnimationFrame(tick);
  }

  const fmtClock = ms => {
    if (ms < 10000) return (Math.ceil(ms / 100) / 10).toFixed(1);
    const s = Math.ceil(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };

  function renderClocks() {
    const g = game, bottom = g.flipped ? BLACK : WHITE;
    for (const [slot, side] of [['top', bottom ^ 1], ['bot', bottom]]) {
      const el = $(`clock-${slot}`);
      el.hidden = !g.clock;
      if (!g.clock) continue;
      const text = fmtClock(g.clock.ms[side]);
      if (el.textContent !== text) el.textContent = text;
      el.classList.toggle('run', g.clock.running && !g.over && g.pos.side === side);
      el.classList.toggle('low', g.clock.ms[side] < 20000);
    }
  }

  // ---- Saving -----------------------------------------------------------------------------
  function save() {
    const g = game;
    if (!g || g.over || (g.mode !== 'cpu' && g.mode !== 'pvp')) return;
    write(STORE.game, { v: 1, mode: g.mode, level: g.level, human: g.human, fen: g.startFen, moves: g.moves.map(x => x.uci), clock: g.clock && { tc: g.clock.tc, ms: g.clock.ms }, flipped: g.flipped, helped: g.helped, autoFlip: g.autoFlip });
  }

  function savedGame() {
    const s = read(STORE.game, null);
    return s && s.v === 1 && (s.mode === 'cpu' || s.mode === 'pvp') && Array.isArray(s.moves) ? s : null;
  }

  function restore(s) {
    const g = createGame(s.mode, { fen: s.fen, human: s.human === BLACK ? BLACK : WHITE, level: Math.min(10, Math.max(1, s.level | 0 || 1)), clock: s.clock?.tc, autoFlip: s.autoFlip });
    for (const u of s.moves) {
      const m = Engine.moveFromUci(g.pos, u);
      if (!m) break;
      g.moves.push({ m, san: Engine.san(g.pos, m), uci: u });
      Engine.makeMove(g.pos, m);
    }
    const prev = g.moves[g.moves.length - 1];
    g.last = prev ? [Engine.from(prev.m), Engine.to(prev.m)] : null;
    if (g.clock && Array.isArray(s.clock?.ms)) { g.clock.ms = s.clock.ms.map(Number); g.clock.running = g.moves.length > 0; }
    g.flipped = !!s.flipped;
    g.helped = !!s.helped;
    return g;
  }

  // ---- Board rendering --------------------------------------------------------------------
  const displayToSq = i => game.flipped ? (i >> 3) * 16 + 7 - (i & 7) : (7 - (i >> 3)) * 16 + (i & 7);
  const sqToDisplay = sq => game.flipped ? (sq >> 4) * 8 + 7 - (sq & 7) : (7 - (sq >> 4)) * 8 + (sq & 7);

  function buildGrid() {
    const rows = [];
    for (let r = 0; r < 8; r++) {
      const row = document.createElement('div');
      row.setAttribute('role', 'row');
      row.style.display = 'contents';
      for (let c = 0; c < 8; c++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'sq';
        b.setAttribute('role', 'gridcell');
        b.tabIndex = -1;
        b.dataset.i = r * 8 + c;
        b.addEventListener('focus', () => { cursor = Number(b.dataset.i); syncTabStops(); });
        squares.push(b);
        row.append(b);
      }
      rows.push(row);
    }
    els.grid.replaceChildren(...rows);
  }

  // Coordinates live in their own layer above the pieces so they stay readable.
  function layoutBoard() {
    let coords = '';
    squares.forEach((b, i) => {
      const sq = displayToSq(i), dark = ((sq >> 4) + (sq & 7)) % 2 === 0;
      b.dataset.sq = sq;
      b.classList.toggle('dk', dark);
      if ((i & 7) && (i >> 3) !== 7) return;
      let labels = '';
      if ((i & 7) === 0) labels += `<b class="cr">${(sq >> 4) + 1}</b>`;
      if ((i >> 3) === 7) labels += `<b class="cf">${'abcdefgh'[sq & 7]}</b>`;
      coords += `<i class="${dark ? 'dk' : ''}" style="grid-area:${(i >> 3) + 1}/${(i & 7) + 1}">${labels}</i>`;
    });
    $('coords').innerHTML = coords;
  }

  function setFlipped(flipped) {
    game.flipped = flipped;
    layoutBoard();
    rebuildPieces();
    if (game.hint?.length === 2) drawArrow(game.hint[0], game.hint[1]);
  }

  function place(el, sq) {
    const i = sqToDisplay(sq);
    el.style.setProperty('--x', i & 7);
    el.style.setProperty('--y', i >> 3);
  }

  function makePiece(pc, sq) {
    const el = document.createElement('div');
    el.className = 'pc';
    el.dataset.pc = pc;
    el.innerHTML = pieceSVG(pc);
    place(el, sq);
    return el;
  }

  function rebuildPieces() {
    els.pieces.classList.add('instant');
    pieceEls = new Map();
    const nodes = [];
    for (let sq = 0; sq < 120; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const pc = game.pos.b[sq];
      if (!pc) continue;
      const el = makePiece(pc, sq);
      pieceEls.set(sq, el);
      nodes.push(el);
    }
    els.pieces.replaceChildren(...nodes);
    void els.pieces.offsetWidth;
    els.pieces.classList.remove('instant');
  }

  // Rebuilds the piece layer if it ever drifts from the engine board (e.g. after an unusual sequence of events).
  function ensurePieces() {
    let ok = true, count = 0;
    for (let sq = 0; sq < 120 && ok; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const pc = game.pos.b[sq];
      if (!pc) continue;
      count++;
      if (Number(pieceEls.get(sq)?.dataset.pc) !== pc) ok = false;
    }
    if (!ok || count !== pieceEls.size) rebuildPieces();
  }

  function animateMove(m, dragged) {
    const p = game.pos, f = Engine.from(m), to = Engine.to(m), flag = Engine.flagOf(m), side = p.side;
    const capSq = flag & Engine.EP ? to + (side ? 16 : -16) : to;
    const victim = pieceEls.get(capSq);
    if (victim && capSq !== f) {
      pieceEls.delete(capSq);
      victim.classList.add('gone');
      setTimeout(() => victim.remove(), 230);
    }
    const el = pieceEls.get(f);
    if (el) {
      pieceEls.delete(f);
      pieceEls.set(to, el);
      el.classList.remove('drag');
      if (dragged) el.style.transform = '';
      el.style.zIndex = 3;
      place(el, to);
      setTimeout(() => { el.style.zIndex = ''; }, 260);
      const promo = Engine.promoOf(m);
      if (promo) { el.dataset.pc = code(side, promo); el.innerHTML = pieceSVG(code(side, promo)); }
    }
    if (flag & Engine.CASTLE) {
      const rf = to > f ? to + 1 : to - 2, rt = to > f ? to - 1 : to + 1, rook = pieceEls.get(rf);
      if (rook) { pieceEls.delete(rf); pieceEls.set(rt, rook); place(rook, rt); }
    }
  }

  function clearArrows() { els.arrows.replaceChildren(); }

  function drawArrow(a, b) {
    const ia = sqToDisplay(a), ib = sqToDisplay(b);
    const x1 = (ia & 7) + .5, y1 = (ia >> 3) + .5, x2 = (ib & 7) + .5, y2 = (ib >> 3) + .5;
    const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len, nx = -uy, ny = ux;
    const tipX = x2 - ux * .12, tipY = y2 - uy * .12, baseX = tipX - ux * .42, baseY = tipY - uy * .42, w = .085, hw = .25;
    const pts = [[x1 + nx * w, y1 + ny * w], [baseX + nx * w, baseY + ny * w], [baseX + nx * hw, baseY + ny * hw], [tipX, tipY], [baseX - nx * hw, baseY - ny * hw], [baseX - nx * w, baseY - ny * w], [x1 - nx * w, y1 - ny * w]];
    els.arrows.innerHTML = `<polygon points="${pts.map(([x, y]) => `${x.toFixed(3)},${y.toFixed(3)}`).join(' ')}" fill="#3fbf7fd9" stroke="#145c37" stroke-width=".03" stroke-linejoin="round"/>`;
  }

  function syncTabStops() {
    squares.forEach((b, i) => { b.tabIndex = i === cursor ? 0 : -1; });
  }

  function focusCursor() {
    syncTabStops();
    squares[cursor]?.focus({ preventScroll: true });
  }

  function render() {
    const g = game;
    if (!g) return;
    const targets = new Set(), p = g.pos;
    if (g.sel >= 0) for (const m of g.legal) if (Engine.from(m) === g.sel) targets.add(Engine.to(m));
    const checkSq = (!g.over || g.reason === 'mate') && Engine.inCheck(p) ? p.kings[p.side] : -1;
    for (const b of squares) {
      const sq = Number(b.dataset.sq), pc = p.b[sq], target = targets.has(sq);
      const capture = target && (pc || (p.ep === sq && (p.b[g.sel] & 7) === PAWN));
      b.classList.toggle('sel', sq === g.sel);
      b.classList.toggle('last', !!g.last && (g.last[0] === sq || g.last[1] === sq));
      b.classList.toggle('check', sq === checkSq);
      b.classList.toggle('dot', target && !capture);
      b.classList.toggle('cap', !!capture);
      b.classList.toggle('hint', !!g.hint && g.hint.includes(sq));
      let label = `${sqName(sq)}, ${pc ? t.pieceOf(pc >> 3, pc & 7) : t.empty}`;
      if (sq === g.sel) label += `, ${t.selected}`;
      if (target) label += `, ${t.legal}`;
      b.setAttribute('aria-label', label);
    }
    syncTabStops();
    renderCards();
    renderClocks();
    renderFeed();
    renderActions();
  }

  function renderCards() {
    const g = game, bottom = g.flipped ? BLACK : WHITE, counts = countPieces(g.pos);
    for (const [slot, side] of [['top', bottom ^ 1], ['bot', bottom]]) {
      $(`av-${slot}`).innerHTML = pieceSVG(code(side, KING));
      let name = colorName(side);
      if (g.mode === 'cpu') name = side === g.human ? `${t.you} · ${colorName(side)}` : t.cpuName(g.level);
      else if (g.mode === 'puzzle') name = side === g.human ? `${t.you} · ${colorName(side)}` : t.puzzleN(g.puzzle.i + 1);
      $(`nm-${slot}`).textContent = name;
      const sub = $(`sub-${slot}`);
      if (g.mode === 'puzzle' && side !== g.human) sub.innerHTML = `<span class="txt">${t.groups[GROUPS.indexOf(g.puzzle.type)]}</span>`;
      else {
        const opp = side ^ 1;
        let html = '', diff = 0;
        for (const type of [5, 4, 3, 2, 1]) {
          const lost = Math.max(0, g.base[opp][type] - counts[opp][type]);
          for (let k = 0; k < lost; k++) html += pieceSVG(code(opp, type));
          diff += VALUE[type] * (counts[side][type] - counts[opp][type]);
        }
        if (diff > 0) html += `<span class="adv">+${diff}</span>`;
        sub.innerHTML = html;
      }
      $(`card-${slot}`).classList.toggle('on', !g.over && g.mode !== 'idle' && g.pos.side === side);
    }
  }

  function renderFeed() {
    const g = game;
    let text = '', cls = '';
    const check = Engine.inCheck(g.pos);
    if (g.mode === 'idle') text = '';
    else if (g.over) { text = g.title || ''; cls = 'over'; }
    else if (g.mode === 'puzzle') text = `${t.toPlay(colorName(g.human))} · ${t.goal[g.puzzle.type]}`;
    else if (g.thinking) text = t.thinking;
    else if (g.mode === 'cpu') { text = check ? t.checkYou : t.yourMove; cls = check ? 'alert' : ''; }
    else { text = check ? t.inCheck(colorName(g.pos.side)) : t.toMove(colorName(g.pos.side)); cls = check ? 'alert' : ''; }
    els.status.textContent = text;
    els.status.className = `status ${cls}`;
    if (movesShown === g.moves.length) return;
    movesShown = g.moves.length;
    const items = [];
    let li = null;
    g.moves.forEach((x, i) => {
      const side = plySide(g, i), num = g.firstFull + ((g.firstSide + i) >> 1);
      if (side === WHITE || !li) {
        li = document.createElement('li');
        li.innerHTML = `<span class="n">${num}.</span>${side === BLACK ? '<span class="m" aria-hidden="true">…</span>' : ''}`;
        items.push(li);
      }
      const s = document.createElement('span');
      s.className = 'm';
      s.textContent = x.san;
      if (i === g.moves.length - 1) s.classList.add('cur');
      li.append(s);
    });
    if (!items.length) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = g.mode === 'idle' ? '' : t.noMoves;
      items.push(empty);
    }
    els.moves.replaceChildren(...items);
    els.moves.scrollTop = els.moves.scrollHeight;
  }

  function renderActions() {
    const g = game, puzzle = g.mode === 'puzzle', idle = g.mode === 'idle';
    els.undo.hidden = puzzle;
    els.draw.hidden = puzzle;
    els.resign.hidden = puzzle;
    els.retry.hidden = !puzzle;
    els.list.hidden = !puzzle;
    els.undo.disabled = !canUndo();
    els.hint.disabled = idle || g.over || !!g.clock || g.busy || (g.mode === 'cpu' && g.pos.side !== g.human);
    els.draw.disabled = idle || g.over || (g.mode === 'cpu' && (g.pos.side !== g.human || g.moves.length < g.drawBlock || g.thinking));
    els.resign.disabled = idle || g.over;
    els.retry.disabled = g.busy;
    const label = settings.sound ? t.soundOn : t.soundOff;
    els.sound.setAttribute('aria-label', label);
    els.sound.setAttribute('aria-pressed', String(settings.sound));
    $('snd-lb').textContent = label;
    $('snd-wave').style.display = settings.sound ? '' : 'none';
    $('snd-off').style.display = settings.sound ? 'none' : '';
  }

  function toast(text, kind = '') {
    els.toast.textContent = text;
    els.toast.className = `toast show ${kind}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { els.toast.className = `toast ${kind}`; }, 1800);
  }

  const announce = text => { els.announcer.textContent = text; };

  // ---- Overlays ---------------------------------------------------------------------------
  function show(name) {
    for (const [key, el] of Object.entries(overlays)) el.hidden = key !== name;
    if (name === 'menu') renderMenu();
    if (name === 'cpu') renderCpuSetup();
    if (name === 'pvp') renderPvpSetup();
    if (name === 'puzzles') renderPuzzleList();
    const first = overlays[name].querySelector('.mode:not([hidden])') || overlays[name].querySelector('.cta') || overlays[name].querySelector('button');
    first?.focus({ preventScroll: true });
  }

  function closeOverlays() {
    for (const el of Object.values(overlays)) el.hidden = true;
  }

  function resumePlay() {
    closeOverlays();
    render();
    if (isCpuTurn() && !game.thinking) cpuMove();
    focusCursor();
  }

  function confirmBox(title, text, yes, no, onYes) {
    els.confirmTitle.textContent = title;
    els.confirmText.textContent = text;
    els.confirmText.hidden = !text;
    els.confirmYes.textContent = yes;
    els.confirmNo.textContent = no;
    els.confirmYes.onclick = () => { closeOverlays(); onYes(); };
    els.confirmNo.onclick = resumePlay;
    show('confirm');
  }

  function renderMenu() {
    const live = game && !game.over && game.live;
    const saved = !live && savedGame();
    const target = live ? game : saved;
    const resume = $('m-resume');
    resume.hidden = !target;
    if (target) {
      $('resume-title').textContent = live ? t.resumeT : t.continueT;
      const what = target.mode === 'cpu' ? t.vsLevel(target.level) : target.mode === 'puzzle' ? t.puzzleN(target.puzzle.i + 1) : t.twoP;
      $('resume-sub').textContent = target.mode === 'puzzle' ? `${what} · ${t.goal[target.puzzle.type]}` : t.resumeSub(what, Math.floor(target.moves.length / 2) + 1);
    }
    $('cpu-sub').textContent = t.cpuSub(settings.level, Object.keys(beaten).length);
    $('puzzle-sub').textContent = t.puzzleSub(solved.size, PUZZLES.length);
    $('menu-sound').setAttribute('aria-checked', String(settings.sound));
  }

  function renderCpuSetup() {
    const wrap = $('levels');
    if (!wrap.children.length) {
      for (let n = 1; n <= 10; n++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'lv';
        b.setAttribute('role', 'radio');
        b.dataset.level = n;
        b.innerHTML = `<strong>${n}</strong><small></small>`;
        b.addEventListener('click', () => { settings.level = n; renderCpuSetup(); });
        wrap.append(b);
      }
    }
    for (const b of wrap.children) {
      const n = Number(b.dataset.level), mark = beaten[n] || 0;
      b.setAttribute('aria-checked', String(n === settings.level));
      b.tabIndex = n === settings.level ? 0 : -1;
      const small = b.querySelector('small');
      small.textContent = mark === 2 ? '★' : mark === 1 ? '✓' : '';
      small.className = mark === 2 ? 'star' : '';
      b.setAttribute('aria-label', `${t.level} ${n}, ${t.levelNames[n - 1]}${mark ? `, ${mark === 2 ? '★' : '✓'}` : ''}`);
    }
    $('lv-name').textContent = `${t.level} ${settings.level} · ${t.levelNames[settings.level - 1]}`;
    $('lv-rating').textContent = t.rating(RATINGS[settings.level - 1]);
    renderSegs();
  }

  function renderPvpSetup() {
    $('auto-flip').setAttribute('aria-checked', String(settings.autoFlip));
    renderSegs();
  }

  function renderSegs() {
    for (const group of document.querySelectorAll('.seg')) {
      for (const b of group.children) b.setAttribute('aria-pressed', String(settings[group.dataset.key] === b.dataset.v));
    }
  }

  function renderPuzzleList() {
    $('pz-progress').textContent = t.solvedCount(solved.size, PUZZLES.length);
    const wrap = $('pz-groups');
    if (!wrap.children.length) {
      GROUPS.forEach((type, gi) => {
        const section = document.createElement('section');
        section.className = 'pz-group';
        section.innerHTML = `<h3>${t.groups[gi]}<span>${t.diff[gi]}</span></h3><div class="pz-grid"></div>`;
        const grid = section.lastChild;
        PUZZLES.forEach(([kind], i) => {
          if (kind !== type) return;
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'pz';
          b.dataset.i = i;
          b.textContent = i + 1;
          b.addEventListener('click', () => startPuzzle(i));
          grid.append(b);
        });
        wrap.append(section);
      });
    }
    for (const b of wrap.querySelectorAll('.pz')) {
      const i = Number(b.dataset.i), done = solved.has(i);
      b.classList.toggle('done', done);
      b.setAttribute('aria-label', `${t.puzzleN(i + 1)}${done ? ', ✓' : ''}`);
    }
  }

  // ---- Sound ------------------------------------------------------------------------------
  let actx = null, noise = null;
  function audio() {
    if (!settings.sound) return null;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      if (!noise) {
        noise = actx.createBuffer(1, actx.sampleRate * .2, actx.sampleRate);
        const data = noise.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
    } catch { actx = null; }
    return actx;
  }

  function knock(ac, at, freq, gain) {
    const src = ac.createBufferSource(), filter = ac.createBiquadFilter(), env = ac.createGain();
    src.buffer = noise;
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = 1.4;
    env.gain.setValueAtTime(gain, at);
    env.gain.exponentialRampToValueAtTime(.001, at + .09);
    src.connect(filter).connect(env).connect(ac.destination);
    src.start(at);
    src.stop(at + .1);
  }

  function beep(ac, at, freq, dur, gain, type = 'sine') {
    const osc = ac.createOscillator(), env = ac.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    env.gain.setValueAtTime(.0001, at);
    env.gain.exponentialRampToValueAtTime(gain, at + .015);
    env.gain.exponentialRampToValueAtTime(.0001, at + dur);
    osc.connect(env).connect(ac.destination);
    osc.start(at);
    osc.stop(at + dur + .02);
  }

  function play(name) {
    const ac = audio();
    if (!ac) return;
    const now = ac.currentTime;
    if (name === 'move') { knock(ac, now, 1500, .6); beep(ac, now, 190, .06, .08); }
    else if (name === 'capture') { knock(ac, now, 900, .9); knock(ac, now + .05, 1700, .45); }
    else if (name === 'check') { knock(ac, now, 1300, .6); beep(ac, now + .03, 880, .16, .09, 'triangle'); }
    else if (name === 'error') beep(ac, now, 170, .18, .07, 'square');
    else if (name === 'win') [523, 659, 784, 1047].forEach((f, i) => beep(ac, now + i * .11, f, .3, .1, 'triangle'));
    else if (name === 'lose') [392, 330, 262].forEach((f, i) => beep(ac, now + i * .16, f, .35, .09, 'triangle'));
    else if (name === 'draw') [440, 440].forEach((f, i) => beep(ac, now + i * .18, f, .25, .08, 'triangle'));
  }

  function toggleSound() {
    settings.sound = !settings.sound;
    saveSettings();
    renderActions();
    renderMenu();
    if (settings.sound) play('move');
  }

  // ---- Input ------------------------------------------------------------------------------
  function sqFromPoint(x, y) {
    const r = els.grid.getBoundingClientRect();
    const c = Math.floor((x - r.left) / r.width * 8), row = Math.floor((y - r.top) / r.height * 8);
    return c < 0 || c > 7 || row < 0 || row > 7 ? -1 : displayToSq(row * 8 + c);
  }

  function tapSquare(sq) {
    if (!canAct()) return;
    const g = game, pc = g.pos.b[sq];
    if (g.sel >= 0 && g.sel !== sq && tryMove(g.sel, sq, false)) return;
    if (pc && (pc >> 3) === g.pos.side && g.sel !== sq) {
      g.sel = sq;
    } else g.sel = -1;
    render();
  }

  els.grid.addEventListener('click', event => {
    const b = event.target.closest('.sq');
    if (suppressClick) { suppressClick = false; return; }
    if (b) tapSquare(Number(b.dataset.sq));
  });

  els.grid.addEventListener('pointerdown', event => {
    if (event.button > 0 || !canAct()) return;
    const sq = sqFromPoint(event.clientX, event.clientY);
    const pc = sq >= 0 ? game.pos.b[sq] : 0;
    if (!pc || (pc >> 3) !== game.pos.side || !pieceEls.get(sq)) return;
    drag = { id: event.pointerId, sq, el: pieceEls.get(sq), x: event.clientX, y: event.clientY, moved: false, over: null };
  });

  els.grid.addEventListener('pointermove', event => {
    if (!drag || drag.id !== event.pointerId) return;
    if (!drag.moved) {
      if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 6) return;
      drag.moved = true;
      // Capture only once it is a real drag so a plain tap still produces a click on the square.
      els.grid.setPointerCapture(event.pointerId);
      game.sel = drag.sq;
      render();
      drag.el.classList.add('drag');
    }
    const r = els.pieces.getBoundingClientRect(), cell = r.width / 8;
    drag.el.style.transform = `translate(${event.clientX - r.left - cell / 2}px, ${event.clientY - r.top - cell / 2}px)`;
    const over = sqFromPoint(event.clientX, event.clientY);
    if (over !== drag.over) {
      squares.forEach(b => b.classList.toggle('over', Number(b.dataset.sq) === over && over !== drag.sq));
      drag.over = over;
    }
  });

  function endDrag(event, cancelled) {
    if (!drag || drag.id !== event.pointerId) return;
    const { el, moved, sq } = drag;
    drag = null;
    squares.forEach(b => b.classList.remove('over'));
    if (!moved) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
    const target = sqFromPoint(event.clientX, event.clientY);
    if (!cancelled && game && target >= 0 && target !== sq && tryMove(sq, target, true)) return;
    el.classList.remove('drag');
    el.style.transform = '';
    render();
  }
  els.grid.addEventListener('pointerup', event => endDrag(event, false));
  els.grid.addEventListener('pointercancel', event => endDrag(event, true));

  const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || !game || overlayOpen() || !els.promo.hidden) return;
    const dir = ARROWS[event.key];
    if (dir) {
      event.preventDefault();
      if (els.grid.contains(document.activeElement)) {
        const r = Math.min(7, Math.max(0, (cursor >> 3) + dir[0])), c = Math.min(7, Math.max(0, (cursor & 7) + dir[1]));
        cursor = r * 8 + c;
      }
      focusCursor();
      return;
    }
    const key = event.key.toLowerCase();
    const actions = { u: undo, h: hint, f: flip };
    if (actions[key] && !event.repeat) { event.preventDefault(); actions[key](); }
  });

  function flip() {
    if (!game || overlayOpen()) return;
    setFlipped(!game.flipped);
    render();
    save();
  }

  els.undo.addEventListener('click', undo);
  els.hint.addEventListener('click', hint);
  els.flip.addEventListener('click', flip);
  els.draw.addEventListener('click', offerDraw);
  els.resign.addEventListener('click', resign);
  els.sound.addEventListener('click', toggleSound);
  els.menu.addEventListener('click', () => show('menu'));
  els.retry.addEventListener('click', () => { if (game?.puzzle) startPuzzle(game.puzzle.i); });
  els.list.addEventListener('click', () => show('puzzles'));
  $('promo-cancel').addEventListener('click', closePromo);
  $('menu-sound').addEventListener('click', toggleSound);
  $('m-resume').addEventListener('click', () => {
    if (game && !game.over && game.live) return resumePlay();
    const s = savedGame();
    if (!s) return;
    const g = restore(s);
    g.live = true;
    Engine.clearMemory();
    begin(g);
    const outcome = Engine.outcome(g.pos);
    if (outcome) endGame(outcome.result, outcome.reason, outcome.reason === 'mate' ? g.pos.side : -1);
  });
  $('m-cpu').addEventListener('click', () => show('cpu'));
  $('m-pvp').addEventListener('click', () => show('pvp'));
  $('m-puzzle').addEventListener('click', () => show('puzzles'));
  $('start-cpu').addEventListener('click', () => { saveSettings(); startCpu(); game.live = true; });
  $('start-pvp').addEventListener('click', () => { saveSettings(); startPvp(); game.live = true; });
  $('auto-flip').addEventListener('click', () => { settings.autoFlip = !settings.autoFlip; renderPvpSetup(); });
  for (const b of document.querySelectorAll('[data-back]')) b.addEventListener('click', () => show('menu'));
  for (const group of document.querySelectorAll('.seg')) {
    group.addEventListener('click', event => {
      const b = event.target.closest('button');
      if (!b) return;
      settings[group.dataset.key] = b.dataset.v;
      renderSegs();
    });
  }
  $('levels').addEventListener('keydown', event => {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
    if (!step) return;
    event.preventDefault();
    settings.level = Math.min(10, Math.max(1, settings.level + step));
    renderCpuSetup();
    $('levels').children[settings.level - 1].focus({ preventScroll: true });
  });
  els.resultMain.addEventListener('click', () => {
    const g = game;
    if (g.mode === 'puzzle') return startPuzzle(nextPuzzleIndex(g.puzzle.i));
    if (g.mode === 'cpu') { startCpu(); game.live = true; }
    else { startPvp(); game.live = true; }
  });
  els.resultReview.addEventListener('click', () => {
    if (game.mode === 'puzzle') return show('puzzles');
    closeOverlays();
    render();
  });
  $('result-menu').addEventListener('click', () => show('menu'));

  document.addEventListener('visibilitychange', () => { lastTick = performance.now(); });

  // ---- Boot -------------------------------------------------------------------------------
  $('logo-ic').innerHTML = pieceSVG(code(WHITE, KING));
  $('ic-resume').innerHTML = pieceSVG(code(WHITE, PAWN));
  $('ic-cpu').innerHTML = pieceSVG(code(BLACK, 2));
  $('ic-pvp').innerHTML = pieceSVG(code(WHITE, 5));
  $('ic-puzzle').innerHTML = pieceSVG(code(BLACK, 4));
  buildGrid();
  const saved = savedGame();
  game = saved ? restore(saved) : createGame('idle');
  if (!saved) game.over = true;
  layoutBoard();
  rebuildPieces();
  render();
  show('menu');
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
