<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screw Puzzle</title>
<style>
:root {
  --bg: #22304a;
  --text: #fdf8ef;
  --muted: #b9c5da;
  --accent: #ffcf4a;
  --accent-dark: #d6a21d;
  --chip: #ffffff17;
  --panel: #fffaf0;
  --ink: #2a2f3d;
  --ink-muted: #6d6a78;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: radial-gradient(ellipse at top, #3b5683, var(--bg) 70%);
  background-color: var(--bg);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.app { height: 100%; max-width: 520px; margin: auto; overflow: clip; display: flex; flex-direction: column; gap: 10px; padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 7px; }
h1 { flex: 1; min-width: 0; font-size: clamp(21px, 6.4vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
h1 span { color: var(--accent); }
.stat { min-width: 62px; padding: 5px 9px; border-radius: 14px; background: var(--chip); text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.icon-btn { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 14px; background: var(--chip); font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 #0003; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0003; }

/* Screw heads: a coloured dome with a cross slot. */
.head { position: relative; display: block; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #ffffffb0 0 14%, transparent 30%), radial-gradient(circle at 50% 60%, var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000) 100%); box-shadow: 0 0 0 1.5px #0005, 0 2px 3px #0006; }
.head::before, .head::after { content: ""; position: absolute; left: 50%; top: 50%; width: 52%; height: 12%; border-radius: 99px; background: color-mix(in srgb, var(--c) 45%, #000); transform: translate(-50%, -50%) rotate(45deg); box-shadow: 0 1px 0 #fff5; }
.head::after { transform: translate(-50%, -50%) rotate(-45deg); }

.rack { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 8px; }
.boxes-row { display: flex; gap: 10px; align-items: center; }
.boxes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.box-slot { position: relative; height: 54px; border-radius: 16px; }
.box-slot.empty { border: 2px dashed #ffffff30; }
.box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-evenly; border-radius: 16px; background: linear-gradient(color-mix(in srgb, var(--c) 32%, #fff8ec), color-mix(in srgb, var(--c) 52%, #fff8ec)); border: 3px solid color-mix(in srgb, var(--c) 85%, #000); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 55%, #000); }
.box .hole { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: #0000002e; box-shadow: inset 0 2px 4px #0005; }
.box .head, .tray .head { width: 28px; height: 28px; }
.box.enter { animation: box-in .32s cubic-bezier(.3, 1.3, .5, 1); }
@keyframes box-in { from { transform: translateX(70%) scale(.8); opacity: 0; } }
.box.leave { animation: box-out .3s ease-in forwards; }
@keyframes box-out { 30% { transform: scale(1.08); } to { transform: translateY(-50%) scale(.7); opacity: 0; } }
.queue { flex: 0 0 auto; min-width: 46px; height: 54px; display: grid; place-content: center; border-radius: 16px; background: var(--chip); text-align: center; font-weight: 900; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.queue small { font-size: 16px; }
.queue.done { opacity: .35; }
.tray { display: flex; justify-content: center; gap: 6px; padding: 6px 10px; border-radius: 18px; background: #00000030; box-shadow: inset 0 2px 6px #0004; transition: background .2s, box-shadow .2s; }
.tray .slot { flex: 0 1 40px; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: #ffffff12; box-shadow: inset 0 2px 4px #0005; }
.tray.warn { background: #ff5a5a33; box-shadow: inset 0 2px 6px #0004, 0 0 0 2px #ff7b7b88; }
.flying { position: relative; z-index: 50; }

.board-wrap { position: relative; z-index: 1; flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.board {
  --u: calc(min(100cqw, 80cqh) / 100);
  --r: 4.6;
  position: relative; width: calc(var(--u) * 100); height: calc(var(--u) * 125);
  border-radius: calc(var(--u) * 5);
  background: radial-gradient(circle, #8a5a2c40 14%, transparent 17%) 0 0 / calc(var(--u) * 6.25) calc(var(--u) * 6.25), linear-gradient(160deg, #ecc38e, #d39b5f);
  box-shadow: inset 0 0 0 calc(var(--u) * 1) #b97f45, inset 0 calc(var(--u) * 1.6) 0 calc(var(--u) * 1) #f6d7ad66, 0 14px 30px #0007;
}
.board.won { animation: glow 1s ease-in-out 2; }
@keyframes glow { 50% { box-shadow: inset 0 0 0 calc(var(--u) * 1) #b97f45, 0 0 40px #ffcf4acc; } }
.plate {
  position: absolute; z-index: var(--z);
  left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(var(--w) * var(--u)); height: calc(var(--h) * var(--u));
  border-radius: calc(var(--u) * 3.6);
  background: color-mix(in srgb, var(--tint) 80%, transparent);
  border: calc(var(--u) * .6) solid color-mix(in srgb, var(--tint) 55%, #1a1020);
  box-shadow: inset 0 calc(var(--u) * .9) 0 #ffffff70, inset 0 calc(var(--u) * -.8) 0 #0000001c, 0 calc(var(--u) * .8) calc(var(--u) * 1.8) #0005;
  pointer-events: none;
}
.plate.circle { border-radius: 50%; }
.plate.deal { animation: deal .35s calc(var(--z) * 35ms) both cubic-bezier(.3, 1.3, .5, 1); }
@keyframes deal { from { transform: translateY(-12%) scale(.85); opacity: 0; } }
.plate.fall { animation: fall .75s ease-in forwards; }
@keyframes fall { 18% { transform: translateY(-2%) rotate(var(--rot)); } to { transform: translateY(calc(var(--u) * 90)) rotate(calc(var(--rot) * 5)); opacity: 0; } }
.plate.gone { display: none; }
.plate .hole { position: absolute; left: calc((var(--sx) - 3.4) * var(--u)); top: calc((var(--sy) - 3.4) * var(--u)); width: calc(var(--u) * 6.8); height: calc(var(--u) * 6.8); border-radius: 50%; background: #2b1a1066; box-shadow: inset 0 calc(var(--u) * .7) calc(var(--u) * 1) #0008; }
.screw { position: absolute; left: calc((var(--sx) - var(--r)) * var(--u)); top: calc((var(--sy) - var(--r)) * var(--u)); width: calc(var(--r) * 2 * var(--u)); height: calc(var(--r) * 2 * var(--u)); padding: 0; border-radius: 50%; pointer-events: auto; transition: transform .12s; }
.screw .head { width: 100%; height: 100%; }
.screw.gone { visibility: hidden; }
.screw.blocked { cursor: default; }
.screw.blocked .head { filter: brightness(.8) saturate(.7); }
@media (hover: hover) { .screw:not(.blocked):hover { transform: scale(1.1); } }
.screw:focus-visible { outline-offset: 2px; }
.screw.nope { animation: nope .3s; }
@keyframes nope { 25% { transform: translateX(-12%) rotate(-20deg); } 75% { transform: translateX(12%) rotate(20deg); } }

.tools { display: flex; align-items: center; gap: 12px; }
.hint { flex: 1; font-size: 12px; color: var(--muted); line-height: 1.35; }
.booster { position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 16px; background: var(--accent); color: #2a210b; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 var(--accent-dark); }
.booster:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
.booster:disabled { opacity: .45; cursor: default; transform: none; box-shadow: 0 4px 0 var(--accent-dark); }
.booster b { min-width: 22px; padding: 1px 6px; border-radius: 99px; background: #2a210b; color: var(--accent); font-size: 13px; text-align: center; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #0d142299; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; background: var(--panel); color: var(--ink); border-radius: 28px; padding: 26px 22px; text-align: center; box-shadow: 0 20px 50px #0007; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 27px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
.panel h2 span { color: var(--accent-dark); }
.panel .emoji { font-size: 44px; line-height: 1.2; }
.panel .text { margin-top: 8px; font-size: 15px; color: var(--ink-muted); line-height: 1.45; }
.demo { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.demo .head { width: 30px; height: 30px; }
.stars { margin-top: 6px; font-size: 38px; letter-spacing: 4px; color: #e5dcc3; }
.stars b { color: #f2a93b; }
.cta { margin-top: 18px; width: 100%; padding: 15px; border-radius: 18px; background: var(--accent); color: #2a210b; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--accent-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
.cta[hidden], .secondary[hidden] { display: none; }
.secondary { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; border: 2px solid #e6dcc0; font-weight: 800; }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 16px; }
.level-btn { aspect-ratio: 1; display: grid; place-content: center; gap: 1px; border-radius: 14px; background: #fff1c9; box-shadow: 0 3px 0 #e6c66a; font-size: 17px; font-weight: 900; }
.level-btn small { font-size: 9px; letter-spacing: 1px; color: #f2a93b; min-height: 11px; }
.level-btn.current { background: #3b5683; color: #fff; box-shadow: 0 3px 0 #22304a; }
.level-btn:disabled { opacity: .45; cursor: default; box-shadow: none; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 600px) { .box-slot, .queue { height: 46px; } .box .hole { width: 28px; height: 28px; } .box .head, .tray .head { width: 24px; height: 24px; } .tray .slot { flex-basis: 34px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Responsive: short screens get compact, scrollable panels. */
@media (max-height: 520px) {
  .overlay { padding: 8px; }
  .panel { width: min(100%, 480px); padding: 14px 18px; border-radius: 22px; }
  .panel h2 { font-size: 23px; }
  .panel .emoji { font-size: 30px; }
  .panel .text { margin-top: 4px; font-size: 14px; line-height: 1.38; }
  .demo { margin-top: 8px; }
  .demo .head { width: 24px; height: 24px; }
  .stars { margin-top: 0; font-size: 30px; }
  .cta { margin-top: 10px; padding: 10px; font-size: 18px; }
  .secondary { margin-top: 8px; padding: 8px; }
}
@media (max-height: 400px) {
  .panel .emoji { display: none; }
}
@media (max-height: 520px) and (min-width: 460px) {
  .level-grid { grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 10px; }
  .level-btn { border-radius: 10px; font-size: 15px; }
}
/* Landscape / short: header, boxes, tray and tools move to a side column; the board uses the full height. */
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .app { max-width: 860px; display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "top board" "rack board" ". board" "tools board"; gap: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .top { grid-area: top; flex-wrap: wrap; row-gap: 6px; }
  .top h1 { flex: 1 0 100%; font-size: 26px; }
  .top .stat { margin-right: auto; display: flex; align-items: baseline; gap: 6px; padding: 6px 10px; }
  .rack { grid-area: rack; }
  .board-wrap { grid-area: board; }
  .board { --u: calc(min(100cqw, 80cqh) / 100); }
  .tools { grid-area: tools; }
}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>Screw <span>Puzzle</span></h1>
    <div class="stat"><small data-i18n="level"></small><strong id="level">1</strong></div>
    <button type="button" class="icon-btn" id="open-levels" data-i18n-label="levels">☰</button>
    <button type="button" class="icon-btn" id="restart" data-i18n-label="restart">↻</button>
  </div>
  <section class="rack">
    <div class="boxes-row">
      <div class="boxes" id="boxes" role="group" data-i18n-label="boxes"></div>
      <div class="queue" id="queue" role="img"></div>
    </div>
    <div class="tray" id="tray" role="img"></div>
  </section>
  <div class="board-wrap"><div class="board" id="board" role="group" data-i18n-label="board"></div></div>
  <div class="tools">
    <p class="hint" data-i18n="hint"></p>
    <button type="button" class="booster" id="undo"><span aria-hidden="true">↶</span><span data-i18n="undo"></span><b id="undo-count" aria-hidden="true">3</b></button>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <h2 id="start-title">Screw <span>Puzzle</span></h2>
    <div class="demo" aria-hidden="true"><i class="head" style="--c:#ef4444"></i><i class="head" style="--c:#3b82f6"></i><i class="head" style="--c:#fbbf24"></i><i class="head" style="--c:#22c55e"></i></div>
    <p class="text" data-i18n="howTo"></p>
    <button type="button" class="cta" id="play"></button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🎉</p>
    <h2 id="win-title"></h2>
    <p class="stars" id="stars"></p>
    <p class="text" id="result"></p>
    <button type="button" class="cta" id="next" data-i18n="next"></button>
    <button type="button" class="secondary" id="replay" data-i18n="replay"></button>
  </div>
</div>

<div class="overlay" id="lose" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="lose-title">
    <p class="emoji" aria-hidden="true">🔩</p>
    <h2 id="lose-title" data-i18n="lost"></h2>
    <p class="text" data-i18n="lostText"></p>
    <button type="button" class="cta" id="rescue"></button>
    <button type="button" class="secondary" id="retry" data-i18n="retry"></button>
  </div>
</div>

<div class="overlay" id="levels" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="levels-title">
    <h2 id="levels-title" data-i18n="chooseLevel"></h2>
    <div class="level-grid" id="level-grid"></div>
    <button type="button" class="secondary" id="close-levels" data-i18n="close"></button>
  </div>
</div>

<script>
(() => {

  function solvable(lv, cap = 8000) {

  // How often a careless player (box moves first, otherwise a random free screw) still wins.

      while (remaining > 0) {

  /* ---------- Level generation ---------- */

  function levelConfig(n) {

      const index = plates.length;

      plates.push({ ...shape, x, y, tint: tints[Math.floor(rand() * tints.length)], rot: Math.round(between(rand, -6, 6)) });

      const p = many[Math.floor(rand() * many.length)];

    }
    const colorOrder = shuffle([...Array(COLORS.length).keys()], rand).slice(0, cfg.colors);
    const queue = shuffle(Array.from({ length: cfg.boxes }, (_, k) => colorOrder[k % cfg.colors]), rand);
    const screwColors = shuffle(queue.flatMap(c => [c, c, c]), rand);
    screws.forEach((s, i) => {
      s.c = screwColors[i];
      s.covers = [];
      for (let q = s.plate + 1; q < plates.length; q++) if (overlaps(plates[q], s.x, s.y, R * 0.8)) s.covers.push(q);
    });
    return { plates, screws, queue };
  }

  const levelCache = {};
  function generate(n) {
    if (levelCache[n]) return levelCache[n];
    let cfg = levelConfig(n), best = null;
    for (let attempt = 0; attempt < 400; attempt++) {
      const rand = seeded(n * 7919 + attempt * 104729 + 17);
      const lv = buildLevel(rand, cfg);
      if (!lv || !solvable(lv)) continue;
      // Aim for a target win rate of careless play, so later levels need real planning without becoming brutal.
      const miss = Math.abs(easiness(lv, rand, 10) - cfg.target);
      if (!best || miss < best.miss) best = { lv, miss };
      if (miss <= 0.1 || attempt > 24) break;
      // Very crowded layouts can fail to place; relax the box count rather than loop forever.
      if (attempt % 100 === 99) cfg = { ...cfg, boxes: Math.max(cfg.colors, cfg.boxes - 1) };
    }
    levelCache[n] = best.lv;
    return best.lv;
  }

  /* ---------- Game ---------- */

  let progress = readProgress();
  let game = null, plateEls = [], screwEls = [];

  function screwLabel(i) {
    const free = isFree(game.lv, game.st, i);
    return t.screw(t.colors[game.lv.screws[i].c], free);
  }

  function buildBoard() {
    const { lv } = game;
    plateEls = lv.plates.map((p, index) => {
      const el = document.createElement('div');
      el.className = `plate ${p.shape} deal`;
      el.style.cssText = `--x:${p.x};--y:${p.y};--w:${p.w};--h:${p.h};--z:${index + 1};--tint:${p.tint};--rot:${p.rot}deg`;
      return el;
    });
    screwEls = lv.screws.map((s, i) => {
      const p = lv.plates[s.plate];
      // Children sit inside the plate's border, so offset by its width (0.6 units).
      const pos = `--sx:${s.x - p.x - 0.6};--sy:${s.y - p.y - 0.6}`;
      const hole = document.createElement('i');
      hole.className = 'hole';
      hole.style.cssText = pos;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'screw';
      btn.style.cssText = `${pos};--c:${COLORS[s.c]}`;
      btn.innerHTML = '<i class="head" aria-hidden="true"></i>';
      btn.addEventListener('click', () => tap(i));
      plateEls[s.plate].append(hole, btn);
      return btn;
    });
    els.board.replaceChildren(...plateEls);
    setTimeout(() => plateEls.forEach(el => el.classList.remove('deal')), 1200);
  }

  function syncBoard() {
    const { lv, st } = game;
    plateEls.forEach((el, p) => {
      if (st.left[p] > 0) el.classList.remove('gone', 'fall');
      else if (!el.classList.contains('fall')) el.classList.add('gone');
    });
    screwEls.forEach((el, i) => {
      const free = isFree(lv, st, i);
      el.classList.toggle('gone', st.taken[i]);
      el.classList.toggle('blocked', !free);
      el.tabIndex = free ? 0 : -1;
      el.setAttribute('aria-disabled', String(!free));
      if (!st.taken[i]) el.setAttribute('aria-label', screwLabel(i));
    });
  }

  function head(color) {
    const el = document.createElement('i');
    el.className = 'head';
    el.style.setProperty('--c', COLORS[color]);
    return el;
  }

  function renderRack(enterSlot = -1) {
    const { lv, st } = game;
    els.boxes.replaceChildren(...st.boxes.map((b, slot) => {
      const wrap = document.createElement('div');
      wrap.className = 'box-slot';
      if (!b) { wrap.classList.add('empty'); wrap.setAttribute('role', 'img'); wrap.setAttribute('aria-label', t.noBox); return wrap; }
      const box = document.createElement('div');
      box.className = `box${slot === enterSlot ? ' enter' : ''}`;
      box.style.setProperty('--c', COLORS[b.c]);
      box.setAttribute('role', 'img');
      box.setAttribute('aria-label', t.box(t.colors[b.c], b.n));
      for (let k = 0; k < BOX; k++) {
        const hole = document.createElement('span');
        hole.className = 'hole';
        if (k < b.n) hole.append(head(b.c));
        box.append(hole);
      }
      wrap.append(box);
      return wrap;
    }));
    const left = lv.queue.length - st.q;
    els.queue.innerHTML = `<small aria-hidden="true">📦</small>+${left}`;
    els.queue.classList.toggle('done', left === 0);
    els.queue.setAttribute('aria-label', t.queue(left));
    els.tray.replaceChildren(...Array.from({ length: TRAY }, (_, k) => {
      const slot = document.createElement('span');
      slot.className = 'slot';
      if (k < st.tray.length) slot.append(head(st.tray[k]));
      return slot;
    }));
    els.tray.classList.toggle('warn', st.tray.length >= TRAY - 1);
    els.tray.setAttribute('aria-label', t.tray(st.tray.length));
    els.undo.disabled = !game.history.length || game.undos <= 0;
    els.undoCount.textContent = String(game.undos);
    els.undo.setAttribute('aria-label', t.undoLabel(game.undos));
  }

  // Animate an element from where something used to be on screen to where it now sits.
  function fly(el, from) {
    if (!el || !from || reduced) return;
    const to = el.getBoundingClientRect();
    const dx = from.left + from.width / 2 - (to.left + to.width / 2), dy = from.top + from.height / 2 - (to.top + to.height / 2);
    el.classList.add('flying');
    const anim = el.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${from.width / to.width})` }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.25, .8, .35, 1)' });
    anim.onfinish = () => el.classList.remove('flying');
  }

  function startLevel(number) {
    const lv = generate(number);
    game = { level: number, lv, st: freshState(lv), history: [], undos: UNDOS, used: 0, busy: false, over: false };
    progress.level = number;
    saveProgress();
    els.level.textContent = `${number}/${LEVEL_COUNT}`;
    els.board.classList.remove('won');
    buildBoard();
    syncBoard();
    renderRack();
    for (const overlay of [els.win, els.lose, els.levels]) overlay.hidden = true;
    // Build the next level while the player is busy so moving on is instant.
    if (number < LEVEL_COUNT) setTimeout(() => generate(number + 1), 1500);
  }

  function focusNear(x, y) {
    let best = -1, bestD = Infinity;
    game.lv.screws.forEach((s, i) => {
      if (!isFree(game.lv, game.st, i)) return;
      const d = Math.hypot(s.x - x, s.y - y);
      if (d < bestD) { bestD = d; best = i; }
    });
    if (best >= 0) screwEls[best].focus({ preventScroll: true });
  }

  function nope(i, message) {
    const el = screwEls[i];
    el.classList.remove('nope');
    void el.offsetWidth;
    el.classList.add('nope');
    announce(message);
  }

  function tap(i) {
    if (!game || game.busy || game.over) return;
    const { lv, st } = game;
    if (!isFree(lv, st, i)) return nope(i, t.covered);
    const s = lv.screws[i];
    if (boxFor(st, s.c) < 0 && st.tray.length >= TRAY) return nope(i, t.trayFull);
    const hadFocus = document.activeElement === screwEls[i];
    const from = screwEls[i].getBoundingClientRect();
    game.history.push(cloneState(st));
    const dest = take(lv, st, i);
    if (st.left[s.plate] === 0) { plateEls[s.plate].classList.add('fall'); announce(t.plateDrop); }
    renderRack();
    syncBoard();
    const target = dest.kind === 'box' ? els.boxes.children[dest.slot].querySelectorAll('.hole')[dest.index].firstChild : els.tray.children[dest.index].firstChild;
    fly(target, from);
    if (hadFocus) focusNear(s.x, s.y);
    if (fullSlot(st) < 0) return checkEnd();
    game.busy = true;
    els.undo.disabled = true;
    const current = game;
    resolveBoxes(current, () => { current.busy = false; renderRack(); checkEnd(); });
  }

  // Full boxes slide away one at a time; each new box pulls matching screws out of the tray.
  function resolveBoxes(current, done) {
    const slot = fullSlot(current.st);
    if (slot < 0) return done();
    setTimeout(() => {
      if (game !== current) return;
      els.boxes.children[slot].firstChild.classList.add('leave');
      announce(t.boxDone(t.colors[current.st.boxes[slot].c]));
      setTimeout(() => {
        if (game !== current) return;
        const trayRects = [...els.tray.children].map(el => el.getBoundingClientRect());
        const pulled = advance(current.lv, current.st, slot);
        renderRack(slot);
        els.undo.disabled = true;
        const holes = els.boxes.children[slot].querySelectorAll('.hole');
        pulled.forEach((from, k) => fly(holes[k].firstChild, trayRects[from]));
        setTimeout(() => { if (game === current) resolveBoxes(current, done); }, wait(pulled.length ? 340 : 120));
      }, wait(290));
    }, wait(300));
  }

  function checkEnd() {
    const { lv, st } = game;
    if (st.taken.every(Boolean)) return win();
    if (st.tray.length >= TRAY && !boxMoves(lv, st).length) lose();
  }

  function win() {
    game.over = true;
    const stars = game.used === 0 ? 3 : game.used === 1 ? 2 : 1;
    const key = String(game.level);
    progress.stars[key] = Math.max(progress.stars[key] ?? 0, stars);
    progress.unlocked = Math.min(LEVEL_COUNT, Math.max(progress.unlocked, game.level + 1));
    if (game.level < LEVEL_COUNT) progress.level = game.level + 1;
    saveProgress();
    const last = game.level === LEVEL_COUNT;
    els.winTitle.textContent = last ? t.allDone : t.won(game.level);
    els.stars.innerHTML = starText(stars);
    els.stars.setAttribute('aria-label', t.starsLabel(stars));
    els.result.textContent = t.result(game.used);
    els.next.hidden = last;
    announce(`${els.winTitle.textContent} ${t.starsLabel(stars)}`);
    els.board.classList.add('won');
    const current = game;
    setTimeout(() => { if (game !== current) return; els.win.hidden = false; (last ? $('replay') : els.next).focus({ preventScroll: true }); }, wait(900));
  }

  function lose() {
    game.over = true;
    els.rescue.hidden = game.undos <= 0;
    els.rescue.textContent = t.rescue(game.undos);
    announce(`${t.lost} ${t.lostText}`);
    const current = game;
    setTimeout(() => { if (game !== current) return; els.lose.hidden = false; (game.undos > 0 ? els.rescue : $('retry')).focus({ preventScroll: true }); }, wait(450));
  }

  function undo() {
    if (!game || game.busy || !game.history.length || game.undos <= 0) return;
    game.st = game.history.pop();
    game.undos -= 1;
    game.used += 1;
    game.over = false;
    els.lose.hidden = true;
    syncBoard();
    renderRack();
    announce(t.undone);
    if (!screwEls.includes(document.activeElement)) focusNear(W / 2, H / 2);
  }

  function openLevels() {
    els.levelGrid.replaceChildren(...Array.from({ length: LEVEL_COUNT }, (_, index) => {
      const number = index + 1;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `level-btn${number === game.level ? ' current' : ''}`;
      const locked = number > progress.unlocked;
      button.disabled = locked;
      const stars = progress.stars[number] ?? 0;
      button.innerHTML = `<span>${locked ? '🔒' : number}</span><small>${'★'.repeat(stars)}</small>`;
      button.setAttribute('aria-label', `${t.level} ${number}${locked ? `, ${t.locked}` : `, ${t.starsLabel(stars)}`}`);
      button.addEventListener('click', () => { startLevel(number); focusNear(W / 2, H / 2); });
      return button;
    }));
    els.levels.hidden = false;
    els.levelGrid.querySelector('.current')?.focus({ preventScroll: true });
  }

  const overlayOpen = () => [els.start, els.win, els.lose, els.levels].some(el => !el.hidden);
  const DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

  // Arrow keys hop between free screws in the pressed direction.
  els.board.addEventListener('keydown', event => {
    const dir = DIRS[event.key];
    if (!dir || !game) return;
    event.preventDefault();
    const current = screwEls.indexOf(document.activeElement);
    if (current < 0) return focusNear(W / 2, H / 2);
    const from = game.lv.screws[current];
    let best = -1, bestScore = Infinity;
    game.lv.screws.forEach((s, i) => {
      if (i === current || !isFree(game.lv, game.st, i)) return;
      const dx = s.x - from.x, dy = s.y - from.y;
      const along = dx * dir[0] + dy * dir[1], across = Math.abs(dx * dir[1] - dy * dir[0]);
      if (along <= 1) return;
      const score = along + across * 2;
      if (score < bestScore) { bestScore = score; best = i; }
    });
    if (best >= 0) screwEls[best].focus();
  });
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || (event.key !== 'u' && event.key !== 'U')) return;
    if (overlayOpen() && els.lose.hidden) return;
    event.preventDefault();
    undo();
  });

  els.undo.addEventListener('click', undo);
  els.rescue.addEventListener('click', undo);
  $('restart').addEventListener('click', () => { startLevel(game.level); focusNear(W / 2, H / 2); });
  $('retry').addEventListener('click', () => { startLevel(game.level); focusNear(W / 2, H / 2); });
  $('replay').addEventListener('click', () => { startLevel(game.level); focusNear(W / 2, H / 2); });
  els.next.addEventListener('click', () => { startLevel(game.level + 1); focusNear(W / 2, H / 2); });
  $('open-levels').addEventListener('click', openLevels);
  $('close-levels').addEventListener('click', () => { els.levels.hidden = true; });
  els.play.addEventListener('click', () => { els.start.hidden = true; focusNear(W / 2, H / 2); });

  const first = Math.min(Math.max(1, progress.level || 1), progress.unlocked, LEVEL_COUNT);
  els.play.textContent = t.play(first);
  startLevel(first);
  els.play.focus({ preventScroll: true });
})();
</script>
</body>
</html>
