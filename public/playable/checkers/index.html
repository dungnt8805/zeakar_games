<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkers</title>
<style>
:root {
  --ink: #3a2618;
  --muted: #86684f;
  --bg: #f6ead2;
  --paper: #fffaf0;
  --light: #f4dfb5;
  --dark: #9a6440;
  --frame: #6e4227;
  --frame-dark: #4f2d18;
  --red: #e5483f;
  --red-dark: #a92a24;
  --white: #fbf5e8;
  --white-dark: #c9b99c;
  --green: #2f9b6c;
  --green-dark: #1f7550;
  --gold: #ffc542;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: repeating-linear-gradient(45deg, #f1e2c4 0 14px, transparent 14px 28px);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 3px solid var(--green-dark); outline-offset: 3px; }
svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 9px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; min-width: 0; font-size: clamp(24px, 7vw, 32px); font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
h1 span { color: var(--red); }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: var(--paper); font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 #dcc7a2; }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #dcc7a2; }

.scores { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; }
.side { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 16px; background: #fffaf0d0; box-shadow: 0 3px 0 #e2cfab; transition: box-shadow .2s; }
.side.top-side { flex-direction: row-reverse; text-align: right; }
.side .dot { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; }
.dot.red { background: radial-gradient(circle at 35% 30%, #ff8f86, var(--red) 60%, var(--red-dark)); }
.dot.white { background: radial-gradient(circle at 35% 30%, #fff, var(--white) 55%, var(--white-dark)); box-shadow: inset 0 0 0 1px #0000001a; }
.side div { min-width: 0; flex: 1; }
.side small, .draws small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--muted); }
.side strong, .draws strong { display: block; font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.side.turn { box-shadow: 0 0 0 3px var(--green), 0 3px 0 #e2cfab; }
.draws { align-self: center; min-width: 52px; text-align: center; }
.status { min-height: 1.3em; text-align: center; font-size: 15px; font-weight: 800; }
.status.alert { color: var(--red-dark); }

.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.board { --size: min(100cqw, 100cqh); --pad: calc(var(--size) * .035); position: relative; width: var(--size); height: var(--size); border-radius: calc(var(--size) * .035); background: linear-gradient(145deg, #87542f, var(--frame)); box-shadow: inset 0 0 0 2px #ffffff22, 0 calc(var(--size) * .018) 0 var(--frame-dark), 0 18px 40px #4f2d1840; }
.squares, .pieces { position: absolute; inset: var(--pad); }
.squares { display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border-radius: calc(var(--size) * .012); overflow: hidden; touch-action: none; }
.squares i { background: var(--light); }
.sq { position: relative; background: var(--dark); border-radius: 0; }
.sq:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; z-index: 1; }
.sq.last { background: #b17a4d; }
.sq.sel { background: #3f8a63; }
.sq.can::after { content: ''; position: absolute; inset: 6%; border-radius: 50%; box-shadow: 0 0 0 calc(var(--size) * .006) var(--gold), 0 0 calc(var(--size) * .02) var(--gold); animation: pulse 1.2s ease-in-out infinite alternate; }
.sq.target::before { content: ''; position: absolute; inset: 34%; border-radius: 50%; background: #8ff0c2; box-shadow: 0 0 0 calc(var(--size) * .006) #1f7550aa; }
.sq.target { cursor: pointer; }
@keyframes pulse { to { opacity: .45; } }
.pieces { pointer-events: none; }
.piece { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; padding: 1.4%; transform: translate(calc(var(--c) * 100%), calc(var(--r) * 100%)); transition: transform .16s ease-in-out, opacity .25s; }
.piece b { position: relative; display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; }
.piece.red b { background: radial-gradient(circle at 50% 50%, transparent 0 52%, #ffffff2a 53% 57%, transparent 58%), radial-gradient(circle at 35% 28%, #ff9b92, var(--red) 55%, var(--red-dark)); box-shadow: 0 calc(var(--size) * .007) 0 #7d1d18, 0 calc(var(--size) * .012) calc(var(--size) * .012) #0005; }
.piece.white b { background: radial-gradient(circle at 50% 50%, transparent 0 52%, #00000012 53% 57%, transparent 58%), radial-gradient(circle at 35% 28%, #fff, var(--white) 55%, var(--white-dark)); box-shadow: 0 calc(var(--size) * .007) 0 #9e8c6c, 0 calc(var(--size) * .012) calc(var(--size) * .012) #0005; }
.piece svg { width: 56%; height: 56%; fill: var(--gold); stroke: #8a5d00; stroke-width: 1.4; opacity: 0; transform: scale(.3); transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.piece.king svg { opacity: 1; transform: none; }
.piece.drag { z-index: 5; transition: none; }
.piece.drag b { transform: scale(1.12); box-shadow: 0 calc(var(--size) * .03) calc(var(--size) * .03) #0006; }
.piece.taken { opacity: .3; }
.piece.gone { opacity: 0; transform: translate(calc(var(--c) * 100%), calc(var(--r) * 100%)) scale(.4); transition: opacity .25s, transform .25s; }
.board.done .piece.loser { opacity: .45; }
.foot { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.5; }
.foot strong { color: var(--ink); }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #3a261866; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 390px); max-height: 100%; overflow: auto; background: var(--paper); border-radius: 28px; padding: 22px 20px; text-align: center; box-shadow: 0 20px 50px #3a261855; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 27px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: var(--red); }
.logo { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
.logo i { width: 22px; height: 22px; border-radius: 50%; background: var(--red); box-shadow: inset 0 -3px 0 #0002; }
.logo i:nth-child(even) { background: var(--white); box-shadow: inset 0 -3px 0 #0002, 0 0 0 1px #0000001a; }
.text { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.field { margin-top: 12px; text-align: left; }
.field[hidden] { display: none; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #f1e3c7; }
.seg button { flex: 1; min-width: 0; padding: 9px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #dcc7a2; }
.note { margin-top: 5px; font-size: 12px; color: var(--muted); }
.emoji { font-size: 44px; line-height: 1.2; }
.result-score { margin-top: 10px; font-size: 17px; font-weight: 800; }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: var(--gold); color: #4a3500; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 18px; width: 100%; padding: 15px; border-radius: 18px; background: var(--green); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--green-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-dark); }
.ghost-btn { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; background: #f1e3c7; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #dcc7a2; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 600px) { .app { gap: 6px; } .foot { display: none; } .side { padding: 4px 8px; } }
@media (max-height: 700px) { .panel { padding: 16px 16px; } .field { margin-top: 9px; } .cta { margin-top: 14px; padding: 12px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<main class="app">
  <header class="top">
    <h1>Check<span>ers</span></h1>
    <button type="button" class="icon-btn" id="undo" data-i18n-label="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>

    <button type="button" class="icon-btn" id="restart" data-i18n-label="newRound">↻</button>
  </header>
  <div class="scores">
    <div class="side" id="side-bottom"><i class="dot" id="dot-bottom" aria-hidden="true"></i><div><small id="name-bottom"></small><strong id="score-bottom">0</strong></div></div>
    <div class="draws"><small data-i18n="draws"></small><strong id="score-d">0</strong></div>
    <div class="side top-side" id="side-top"><i class="dot" id="dot-top" aria-hidden="true"></i><div><small id="name-top"></small><strong id="score-top">0</strong></div></div>
  </div>
  <p class="status" id="status"></p>
  <div class="board-wrap">
    <div class="board" id="board">
      <div class="squares" id="squares" role="grid" data-i18n-label="board"></div>
      <div class="pieces" id="pieces" aria-hidden="true"></div>
    </div>
  </div>
  <p class="foot"><strong id="hard-wins"></strong><br><span data-i18n="hint"></span></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="setup">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h2 id="setup-title">Check<span>ers</span></h2>
    <p class="text" data-i18n="tagline"></p>
    <div class="field"><p class="label" id="mode-label" data-i18n="mode"></p><div class="seg" role="group" aria-labelledby="mode-label" data-key="mode"><button type="button" data-value="cpu" data-i18n="vsCpu"></button><button type="button" data-value="pvp" data-i18n="twoP"></button></div></div>
    <div class="field" id="level-field"><p class="label" id="level-label" data-i18n="difficulty"></p><div class="seg" role="group" aria-labelledby="level-label" data-key="level"><button type="button" data-value="easy" data-i18n="easy"></button><button type="button" data-value="normal" data-i18n="normal"></button><button type="button" data-value="hard" data-i18n="hard"></button></div></div>
    <div class="field" id="side-field"><p class="label" id="side-label" data-i18n="playAs"></p><div class="seg" role="group" aria-labelledby="side-label" data-key="side"><button type="button" data-value="red" data-i18n="red"></button><button type="button" data-value="white" data-i18n="white"></button></div><p class="note" data-i18n="redFirst"></p></div>
    <div class="field"><p class="label" id="forced-label" data-i18n="forced"></p><div class="seg" role="group" aria-labelledby="forced-label" data-key="forced"><button type="button" data-value="on" data-i18n="on"></button><button type="button" data-value="off" data-i18n="off"></button></div></div>
    <button type="button" class="cta" id="start" data-i18n="start"></button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <p class="emoji" id="result-emoji" aria-hidden="true"></p>
    <h2 id="result-title"></h2>
    <p class="text" id="result-text"></p>
    <p class="result-score" id="result-score"></p>
    <p class="badge" id="new-best" hidden></p>
    <button type="button" class="cta" id="next-round" data-i18n="nextRound"></button>
    <button type="button" class="ghost-btn" id="change" data-i18n="change"></button>
  </div>
</div>

    els.announcer.textContent = t.moved(nameOf(side), coord(m.path[0]), coord(m.path[m.path.length - 1]), m.caps.length) + (m.crown ? ` ${t.crowned}` : '');
    const replies = genMoves(game.board, game.turn, forced());
    if (!replies.length) return endRound(side, DARK.some(sq => game.board[sq] * game.turn > 0) ? t.reasonBlocked : t.reasonPieces);
    if (seen >= 3) return endRound(null, t.reasonRep);
    if (game.quiet >= 80) return endRound(null, t.reason40);
    nextTurn();
  }

  function endRound(winner, reason) {
    game.over = true;
    game.legal = [];
    tally[winner ?? 'd'] += 1;
    els.board.classList.add('done');
    for (const [sq, el] of pieceEls) el.classList.toggle('loser', winner !== null && game.board[sq] * winner < 0);
    let newBest = false;
    if (settings.mode === 'cpu' && settings.level === 'hard' && winner === humanSide()) {
      hardWins += 1;
      newBest = true;
      write(STORE.hardWins, hardWins);
    }
    let title, emoji;
    if (winner === null) { title = t.draw; emoji = '🤝'; }
    else if (settings.mode === 'cpu') { title = winner === humanSide() ? t.youWin : t.cpuWins; emoji = winner === humanSide() ? '🏆' : '🤖'; }
    else { title = t.wins(colorName(winner)); emoji = '👑'; }
    els.resultEmoji.textContent = emoji;
    els.resultTitle.textContent = title;
    els.resultText.textContent = reason;
    els.resultScore.textContent = tallyLine();
    els.newBest.textContent = t.newHardWin(hardWins);
    els.newBest.hidden = !newBest;
    render();
    els.status.textContent = title;
    els.announcer.textContent = `${title} ${reason} ${els.resultScore.textContent}`;
    const at = game.round;
    game.timer = setTimeout(() => {
      if (game.round !== at) return;
      els.result.hidden = false;
      els.nextRound.focus({ preventScroll: true });
    }, reducedMotion.matches ? 500 : 1200);
  }

  function tallyLine() {
    const bottom = flip ? WHITE : RED;
    return t.tally(tally[bottom], nameOf(bottom), tally[-bottom], nameOf(-bottom), tally.d);
  }

  function canUndo() {
    if (!game || game.over || game.busy || game.sel?.prefix.length > 1) return false;
    return game.history.some(snap => settings.mode !== 'cpu' || snap.turn === humanSide());
  }

  function undo() {
    if (!canUndo()) return;
    clearTimeout(game.timer);
    game.round = ++round;
    let snap;
    do snap = game.history.pop(); while (settings.mode === 'cpu' && snap.turn !== humanSide());
    Object.assign(game, { board: snap.board, turn: snap.turn, quiet: snap.quiet, positions: snap.positions, last: snap.last });
    buildPieces();
    nextTurn();
    els.announcer.textContent = t.undo;
  }

  // ---- Rendering --------------------------------------------------------------------------
  const displayIndex = sq => flip ? 63 - sq : sq;
  const fromDisplay = i => flip ? 63 - i : i;

  function place(el, sq) {
    const i = displayIndex(Number(sq));
    el.style.setProperty('--r', i >> 3);
    el.style.setProperty('--c', i & 7);
  }

  function buildSquares() {
    squareEls = [];
    const rows = [];
    for (let dr = 0; dr < 8; dr++) {
      const row = document.createElement('div');
      row.setAttribute('role', 'row');
      row.style.display = 'contents';
      for (let dc = 0; dc < 8; dc++) {
        const i = dr * 8 + dc;
        if ((dr + dc) % 2 === 0) { const cell = document.createElement('i'); cell.setAttribute('role', 'presentation'); row.append(cell); continue; }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sq';
        btn.setAttribute('role', 'gridcell');
        btn.dataset.sq = fromDisplay(i);
        btn.tabIndex = -1;
        btn.addEventListener('focus', () => { cursor = i; syncTabStops(); });
        squareEls[fromDisplay(i)] = btn;
        row.append(btn);
      }
      rows.push(row);
    }
    els.squares.replaceChildren(...rows);
  }

  function buildPieces() {
    pieceEls = new Map();
    const nodes = [];
    for (const sq of DARK) {
      const v = game.board[sq];
      if (!v) continue;
      const el = document.createElement('div');
      el.className = `piece ${v > 0 ? 'red' : 'white'}${Math.abs(v) === 2 ? ' king' : ''}`;
      el.innerHTML = `<b>${CROWN}</b>`;
      el.dataset.sq = sq;
      place(el, sq);
      pieceEls.set(sq, el);
      nodes.push(el);
    }
    els.pieces.replaceChildren(...nodes);
  }

  function syncTabStops() {
    for (const btn of squareEls) if (btn) btn.tabIndex = displayIndex(Number(btn.dataset.sq)) === cursor ? 0 : -1;
  }

  function render() {
    const human = humanTurn();
    const targets = human && game.sel ? nextTargets() : [];
    const selAt = game.sel ? game.sel.prefix[game.sel.prefix.length - 1] : -1;
    for (const btn of squareEls) {
      if (!btn) continue;
      const sq = Number(btn.dataset.sq);
      const can = human && !game.sel && movableFrom(sq);
      const target = targets.includes(sq);
      btn.classList.toggle('can', can);
      btn.classList.toggle('sel', sq === selAt);
      btn.classList.toggle('target', target);
      btn.classList.toggle('last', !!game.last && (game.last[0] === sq || game.last[game.last.length - 1] === sq));
      const v = game.board[sq];
      const shown = game.sel && sq === game.sel.prefix[0] && selAt !== sq ? 0 : v;
      let label = `${coord(sq)}, ${shown ? t.piece[shown] : t.empty}`;
      if (sq === selAt) label += `, ${t.selected}`;
      else if (can) label += `, ${t.canMove}`;
      if (target) label += `, ${t.moveHere}`;
      btn.setAttribute('aria-label', label);
    }
    syncTabStops();

    const bottom = flip ? WHITE : RED;
    for (const [slot, side] of [['bottom', bottom], ['top', -bottom]]) {
      $(`name-${slot}`).textContent = nameOf(side);
      $(`score-${slot}`).textContent = String(tally[side]);
      $(`dot-${slot}`).className = `dot ${side === RED ? 'red' : 'white'}`;
      $(`side-${slot}`).classList.toggle('turn', !game.over && game.turn === side);
    }
    $('score-d').textContent = String(tally.d);

    let status = '', alert = false;
    if (game.over) status = els.resultTitle.textContent;
    else if (isCpu(game.turn)) status = t.thinking;
    else if (game.sel?.prefix.length > 1) { status = t.keepJumping; alert = true; }
    else if (forced() && game.legal[0]?.caps.length) { status = settings.mode === 'cpu' ? t.mustCapture : t.mustCaptureOf(colorName(game.turn)); alert = true; }
    else if (game.quiet >= 60) status = t.noProgress(Math.ceil((80 - game.quiet) / 2));
    else status = settings.mode === 'cpu' ? t.yourTurn : t.turnOf(colorName(game.turn));
    els.status.textContent = status;
    els.status.classList.toggle('alert', alert);
    els.undo.disabled = !canUndo();
    els.hardWins.textContent = t.hardWins(hardWins);
  }

  function renderSetup() {
    for (const group of document.querySelectorAll('.seg')) {
      for (const btn of group.children) btn.setAttribute('aria-pressed', String(settings[group.dataset.key] === btn.dataset.value));
    }
    els.levelField.hidden = settings.mode !== 'cpu';
    els.sideField.hidden = settings.mode !== 'cpu';
  }

  function openSetup() {
    clearTimeout(game?.timer);
    if (game && !game.over) game.round = ++round;
    renderSetup();
    els.result.hidden = true;
    els.setup.hidden = false;
    els.start.focus({ preventScroll: true });
  }

  // ---- Input ------------------------------------------------------------------------------
  els.squares.addEventListener('click', event => {
    const btn = event.target.closest('.sq');
    if (suppressClick) { suppressClick = false; return; }
    if (btn) tapSquare(Number(btn.dataset.sq));
  });

  function squareAt(x, y) {
    const rect = els.squares.getBoundingClientRect();
    const dc = Math.floor((x - rect.left) / rect.width * 8), dr = Math.floor((y - rect.top) / rect.height * 8);
    if (dc < 0 || dc > 7 || dr < 0 || dr > 7 || (dr + dc) % 2 === 0) return -1;
    return fromDisplay(dr * 8 + dc);
  }

  els.squares.addEventListener('pointerdown', event => {
    if (!humanTurn() || event.button > 0) return;
    const sq = squareAt(event.clientX, event.clientY);
    const selAt = game.sel ? game.sel.prefix[game.sel.prefix.length - 1] : -1;
    const fresh = !game.sel || game.sel.prefix.length === 1;
    if (!(sq === selAt || (fresh && movableFrom(sq)))) return;
    const el = pieceEls.get(game.sel ? game.sel.prefix[0] : sq);
    if (!el) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY, sq, el, moved: false };
  });

  els.squares.addEventListener('pointermove', event => {
    if (!drag || drag.id !== event.pointerId) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 8) return;
      drag.moved = true;
      // Capture only once it is a real drag; capturing earlier would retarget the plain tap's click away from the square.
      els.squares.setPointerCapture(event.pointerId);
      if (!game.sel) select(drag.sq);
      drag.el.classList.add('drag');
    }
    const rect = els.pieces.getBoundingClientRect();
    const cell = rect.width / 8;
    drag.el.style.transform = `translate(${event.clientX - rect.left - cell / 2}px, ${event.clientY - rect.top - cell / 2}px)`;
  });

  function endDrag(event, cancelled) {
    if (!drag || drag.id !== event.pointerId) return;
    const { el, moved } = drag;
    drag = null;
    if (!moved) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
    el.classList.remove('drag');
    el.style.transform = '';
    if (cancelled || !humanTurn() || !game.sel) return;
    const sq = squareAt(event.clientX, event.clientY);
    const prefix = game.sel.prefix;
    // Dropping on any later square of a jump chain plays every hop up to it.
    const route = candidates().find(m => m.path.indexOf(sq, prefix.length) >= 0);
    if (!route) return;
    const steps = route.path.slice(prefix.length, route.path.indexOf(sq, prefix.length) + 1);
    for (const s of steps) { if (!game.sel || game.busy) break; stepTo(s); }
  }
  els.squares.addEventListener('pointerup', event => endDrag(event, false));
  els.squares.addEventListener('pointercancel', event => endDrag(event, true));

  function moveCursor(dr, dc) {
    let r = cursor >> 3, c = cursor & 7;
    if (dc) { if (c + dc * 2 >= 0 && c + dc * 2 < 8) c += dc * 2; }
    else if (r + dr >= 0 && r + dr < 8) { r += dr; c = c - 1 >= 0 ? c - 1 : c + 1; if ((r + c) % 2 === 0) c += 2; if (c > 7) c -= 2; }
    cursor = r * 8 + c;
    syncTabStops();
    squareEls[fromDisplay(cursor)]?.focus({ preventScroll: true });
  }

  const KEYS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  const overlayOpen = () => !els.setup.hidden || !els.result.hidden;
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || !game || overlayOpen()) return;
    const dir = KEYS[event.key];
    if (dir) {
      event.preventDefault();
      if (!els.squares.contains(document.activeElement)) { syncTabStops(); squareEls[fromDisplay(cursor)]?.focus({ preventScroll: true }); }
      else moveCursor(dir[0], dir[1]);
    } else if (event.key === 'u' || event.key === 'U') {
      event.preventDefault();
      undo();
    }
  });

  for (const group of document.querySelectorAll('.seg')) {
    group.addEventListener('click', event => {
      const btn = event.target.closest('button');
      if (!btn) return;
      settings[group.dataset.key] = btn.dataset.value;
      renderSetup();
    });
  }

  els.start.addEventListener('click', () => {
    const key = `${settings.mode}/${settings.level}/${settings.side}`;
    if (key !== els.start.dataset.key) tally = { 1: 0, '-1': 0, d: 0 };
    els.start.dataset.key = key;
    write(STORE.settings, settings);
    newRound();
  });
  els.nextRound.addEventListener('click', newRound);
  els.undo.addEventListener('click', undo);
  $('change').addEventListener('click', openSetup);
  $('settings').addEventListener('click', openSetup);
  $('restart').addEventListener('click', newRound);

  renderSetup();
  els.start.dataset.key = `${settings.mode}/${settings.level}/${settings.side}`;
  const board = initialBoard();
  game = { board, turn: RED, quiet: 0, positions: new Map(), history: [], legal: [], sel: null, last: null, over: false, busy: false, timer: 0, round };
  buildSquares();
  buildPieces();
  render();
  els.start.focus({ preventScroll: true });
})();
</script>
</body>
</html>
