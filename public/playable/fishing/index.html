<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fishing Frenzy</title>
<style>
:root { --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --ink:#0b2a45; --muted:#4d6a80; --cream:#fff8ec; --sun:#ffc93c; --sun-d:#b8690a; --coral:#ff6a4d; --teal:#1fb7c6; --navy:#08304f; --pad:8px; --gap:8px; }
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { font-family:var(--font); color:var(--cream); background:linear-gradient(180deg,#106b9d,#073657 55%,#031a33); overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; touch-action:manipulation; }
h1,h2,h3,p,ol,ul,dl,dd { margin:0; }
ol,ul { padding:0; list-style:none; }
:focus-visible { outline:3px solid #ffe37a; outline-offset:3px; }
[hidden] { display:none !important; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.coin { display:inline-block; flex:none; width:1em; height:1em; border-radius:50%; background:radial-gradient(circle at 35% 32%,#fff7c4,#ffd23f 42%,#e29a00 100%); box-shadow:inset 0 0 0 .09em #a86b00; vertical-align:-.14em; }

/* Portrait: brand bar, ocean, dock. */
.app { height:100%; display:grid; grid-template-columns:100%; grid-template-rows:auto minmax(0,1fr) auto; grid-template-areas:"brand" "stage" "dock"; gap:var(--gap); padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left)); }
.brand { grid-area:brand; display:flex; align-items:center; gap:8px; min-width:0; }
.logo { flex:none; width:34px; height:34px; }
.game-name { flex:1; min-width:0; font-size:clamp(17px,5.2vw,24px); font-weight:900; line-height:1.05; letter-spacing:.01em; color:var(--sun); text-shadow:0 2px #7a3f00,0 0 10px #0006; }
.coins { flex:none; display:flex; align-items:center; gap:6px; padding:5px 12px 5px 8px; border-radius:99px; background:#04223dcc; border:2px solid #2f80b0; font-size:17px; font-weight:900; font-variant-numeric:tabular-nums; }
.coins.bump { animation:bump .35s ease-out; }
@keyframes bump { 40% { transform:scale(1.14); } }
.icon-btn { flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:#0a3a62; border:2px solid #2f80b0; }
.icon-btn svg { width:22px; height:22px; }
.icon-btn[aria-pressed="false"] .wave { display:none; }
.icon-btn[aria-pressed="true"] .cross { display:none; }
.info { grid-area:info; display:none; }
.stage { grid-area:stage; position:relative; min-height:0; min-width:0; display:grid; place-items:center; }
canvas#canvas { display:block; border-radius:16px; touch-action:none; box-shadow:0 0 0 3px #0b4a74,0 0 0 5px #5fc6e0,0 10px 26px #0008; cursor:pointer; }
.dock { grid-area:dock; display:flex; align-items:stretch; gap:8px; min-width:0; }
.act { flex:1; min-width:0; min-height:54px; padding:6px 10px; border-radius:16px; font-size:clamp(16px,5vw,21px); font-weight:900; line-height:1.1; color:#4a2000; background:linear-gradient(#ffe68a,#ffbd38 58%,#f29a1c); border:3px solid #fff1b8; box-shadow:inset 0 -4px #c9700a77,0 5px #8d4a06,0 8px 16px #0006; transition:transform .08s; }
.act:active:not(:disabled) { transform:translateY(4px); box-shadow:0 1px #8d4a06; }
.act:disabled { filter:saturate(.4) brightness(.85); cursor:default; }
.tool { position:relative; flex:none; width:52px; min-height:54px; border-radius:14px; display:grid; place-items:center; background:linear-gradient(#0e4b7a,#0a3a62); border:2px solid #2f80b0; box-shadow:0 4px #04223d; }
.tool svg { width:26px; height:26px; flex:none; }
.tool .lbl { display:none; }
.tool:disabled { opacity:.45; cursor:default; }
.tool:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px #04223d; }
.dot { position:absolute; top:5px; right:5px; width:11px; height:11px; border-radius:50%; background:var(--coral); box-shadow:0 0 0 2px #0a3a62; animation:blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { transform:scale(1.3); } }
.hint { display:none; }

/* Side panels (wide only). */
.stats { display:grid; gap:6px; }
.stats > div { display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:7px 12px; border-radius:12px; background:#04223daa; border:1px solid #2f80b066; }
.stats dt { font-size:clamp(11px,.4vw + 8px,14px); font-weight:800; color:#a9dcf0; }
.stats dd { font-size:clamp(15px,.6vw + 10px,22px); font-weight:900; font-variant-numeric:tabular-nums; white-space:nowrap; }
.orders-box { min-height:0; display:flex; flex-direction:column; gap:6px; padding:10px; border-radius:14px; background:#fff8ec; color:var(--ink); overflow:auto; }
.orders-box h2 { font-size:13px; font-weight:900; letter-spacing:.04em; color:#a24a10; }
.orders { display:grid; gap:7px; }
.order { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:3px 8px; padding:7px 9px; border-radius:10px; background:#eef6fa; text-align:left; }
.order b { font-size:13px; font-weight:800; line-height:1.25; }
.order .rw { display:flex; align-items:center; gap:3px; font-size:13px; font-weight:900; color:#8a5200; white-space:nowrap; }
.order .bar { grid-column:1/-1; height:7px; border-radius:9px; background:#cfe2ec; overflow:hidden; }
.order .bar i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--teal),#3fd28f); }
.order small { grid-column:1/-1; font-size:11px; font-weight:700; color:var(--muted); }

@media (max-width:360px) { .tool { width:44px; } .dock { gap:6px; } .coins { font-size:15px; padding:4px 10px 4px 7px; } .logo { width:28px; height:28px; } .icon-btn { width:36px; height:36px; } }
@media (max-height:560px) and (max-aspect-ratio:5/4) { .act, .tool { min-height:46px; } .logo { display:none; } }

/* Wide: ocean at full height in the middle, info left, controls right. */
@media (min-aspect-ratio:5/4) {
  :root { --side:clamp(140px,22vw,340px); --gap:clamp(8px,1.3vw,18px); }
  .app { grid-template-columns:minmax(0,1fr) min(calc((100vh - 2 * var(--pad)) * 1), calc(100vw - 2 * var(--side) - 2 * var(--gap) - 2 * var(--pad))) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); grid-template-areas:"brand stage dock" "info stage dock"; }
  .brand { flex-wrap:wrap; align-content:flex-start; gap:8px; }
  .game-name { flex:1 1 100%; order:-1; font-size:clamp(16px,1.2vw + 8px,30px); }
  .brand .coins { flex:1; justify-content:center; font-size:clamp(16px,.8vw + 10px,24px); }
  .info { display:flex; flex-direction:column; gap:10px; min-height:0; }
  .dock { flex-direction:column; justify-content:center; gap:clamp(8px,1.6vh,14px); }
  .act { flex:none; min-height:clamp(56px,18vh,120px); font-size:clamp(16px,.9vw + 9px,28px); }
  .tool { width:auto; display:flex; align-items:center; justify-content:flex-start; gap:10px; min-height:clamp(42px,8vh,58px); padding:6px 12px; text-align:left; }
  .tool .lbl { display:block; min-width:0; font-size:clamp(12px,.5vw + 8px,17px); font-weight:800; line-height:1.15; }
  #btn-orders { display:none; }
  .hint { display:block; font-size:clamp(10px,.3vw + 8px,13px); line-height:1.35; color:#a9dcf0; text-align:center; }
}
@media (min-aspect-ratio:5/4) and (max-height:520px) {
  .orders-box { display:none; }
  #btn-orders { display:flex; }
  .stats > div { padding:4px 10px; }
  .act { min-height:48px; }
  .tool { min-height:36px; padding:3px 10px; }
  .tool svg { width:22px; height:22px; }
  .hint { display:none; }
  .logo { width:26px; height:26px; }
}
@media (min-aspect-ratio:5/4) and (max-height:360px) { .stats > div:nth-child(3) { display:none; } .icon-btn { width:34px; height:34px; } .dock { gap:6px; } }
@media (min-aspect-ratio:5/4) and (max-width:700px) { .tool { justify-content:center; padding:3px; } .tool .lbl { display:none; } .stats dt { font-size:11px; } .stats > div { flex-direction:column; align-items:flex-start; gap:0; padding:4px 8px; } }

/* Overlays */
.overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom)); background:#021426b8; }
.panel { position:relative; width:min(100%,430px); max-height:calc(100vh - 16px); display:flex; flex-direction:column; border-radius:22px; background:var(--cream); color:var(--ink); text-align:center; box-shadow:0 0 0 3px #5fc6e0,0 18px 50px #000a; overflow:hidden; animation:rise .25s ease-out; }
.panel.wide { width:min(100%,860px); }
@keyframes rise { from { transform:translateY(14px); opacity:0; } }
.panel-body { min-height:0; overflow:auto; padding:20px 18px 18px; }
.panel-head { flex:none; display:flex; align-items:center; gap:10px; padding:12px 12px 10px 18px; background:linear-gradient(#0e5585,#0a3f66); color:var(--cream); }
.panel-head h2 { flex:1; min-width:0; text-align:left; font-size:clamp(19px,4.6vw,26px); font-weight:900; color:var(--sun); text-shadow:0 2px #00000055; }
.panel-head .coins { font-size:16px; }
.x-btn { flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:#ffffff1f; font-size:22px; font-weight:900; line-height:1; }
.kicker { font-size:11px; font-weight:900; letter-spacing:.16em; color:#d0571c; }
.big-title { margin-top:2px; font-size:clamp(30px,9vw,42px); font-weight:900; line-height:1.05; color:#0a4d7c; letter-spacing:-.01em; }
.big-title span { color:var(--coral); }
.panel p { line-height:1.45; }
.tagline { margin-top:8px; font-size:15px; color:var(--muted); }
.hero { display:block; width:150px; height:84px; margin:0 auto 4px; }
.steps { display:grid; gap:8px; margin-top:14px; text-align:left; }
.steps li { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; background:#e9f5fa; font-size:13.5px; line-height:1.35; }
.steps li i { flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-weight:900; color:#fff; background:var(--teal); }
.steps li:nth-child(2) i { background:var(--coral); }
.steps li:nth-child(3) i { background:#f2a41c; }
.small { margin-top:10px; font-size:12.5px; color:var(--muted); }
.btn-main { display:block; width:100%; margin-top:16px; min-height:52px; padding:10px 14px; border-radius:14px; font-size:19px; font-weight:900; color:#4a2000; background:linear-gradient(#ffe68a,#ffbd38 58%,#f29a1c); border:2px solid #fff1b8; box-shadow:0 5px #8d4a06,0 8px 16px #0003; }
.btn-main:active { transform:translateY(4px); box-shadow:0 1px #8d4a06; }
.btn-main:disabled { filter:saturate(.3); opacity:.7; cursor:default; transform:none; box-shadow:0 5px #8d4a06; }
.actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.actions .btn-main { flex:1 1 100%; margin:0; }
.btn-alt { flex:1 1 110px; min-height:48px; padding:8px 12px; border-radius:14px; font-size:16px; font-weight:800; color:var(--cream); background:linear-gradient(#11609a,#0a426e); box-shadow:0 4px #052a48; }
.btn-alt:active { transform:translateY(3px); box-shadow:0 1px #052a48; }

/* Results */
.res-title { font-size:clamp(26px,7vw,36px); font-weight:900; color:#0a4d7c; }
.res-sub { margin-top:4px; font-size:14px; font-weight:700; color:var(--muted); }
.res-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:6px; margin-top:12px; text-align:left; }
.res-list li { display:flex; align-items:center; gap:8px; padding:4px 10px 4px 4px; border-radius:12px; background:#eaf4f9; font-size:14px; font-weight:700; }
.res-list li.new { background:#fff1c9; box-shadow:inset 0 0 0 2px #ffc93c; }
.res-list canvas { flex:none; width:54px; height:34px; }
.res-list .nm { flex:1; min-width:0; line-height:1.2; }
.res-list .nm small { display:block; font-size:11px; font-weight:800; color:#c46a00; }
.res-list .v { flex:none; display:flex; align-items:center; gap:3px; font-weight:900; font-variant-numeric:tabular-nums; }
.sum { display:grid; gap:3px; margin:12px auto 0; max-width:360px; font-size:14px; font-weight:700; }
.sum div { display:flex; justify-content:space-between; gap:12px; }
.sum .tot { margin-top:4px; padding-top:6px; border-top:2px dashed #b9d4e2; font-size:22px; font-weight:900; color:#0a4d7c; }
.sum .tot span:last-child { display:flex; align-items:center; gap:5px; }
.badges { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:10px; }
.badges span { padding:4px 12px; border-radius:99px; background:var(--sun); color:#4a2000; font-size:13px; font-weight:900; }
.badges span.order { background:#3fd28f; color:#063a22; }
.none-text { margin-top:12px; font-size:14px; color:var(--muted); }

/* Shop */
.shop-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; text-align:left; }
.up-card { display:grid; grid-template-columns:52px minmax(0,1fr); gap:4px 12px; padding:12px; border-radius:16px; background:#eaf4f9; border:2px solid #cfe2ec; }
.up-card canvas { grid-row:span 3; width:52px; height:52px; align-self:start; }
.up-card h3 { font-size:17px; font-weight:900; line-height:1.15; }
.up-card h3 small { margin-left:6px; font-size:12px; font-weight:800; color:#1b8796; white-space:nowrap; }
.up-card p { font-size:13px; color:var(--muted); line-height:1.35; }
.pips { display:flex; gap:3px; }
.pips i { width:12px; height:6px; border-radius:3px; background:#c8dbe5; }
.pips i.on { background:var(--teal); }
.up-row { grid-column:1/-1; display:flex; align-items:center; gap:8px; margin-top:4px; }
.up-row .eff { flex:1; min-width:0; font-size:14px; font-weight:800; color:#0a4d7c; }
.buy { flex:none; display:flex; align-items:center; gap:5px; min-height:42px; padding:6px 14px; border-radius:12px; font-size:16px; font-weight:900; color:#4a2000; background:linear-gradient(#ffe68a,#ffbd38); box-shadow:0 4px #8d4a06; font-variant-numeric:tabular-nums; }
.buy:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px #8d4a06; }
.buy.poor { color:#7a2a1a; background:#ffd9cc; box-shadow:0 4px #b8826f; }
.buy:disabled { color:#2c6a38; background:#d8f5dc; box-shadow:none; cursor:default; }
.shop-msg { min-height:1.4em; margin-top:10px; font-size:14px; font-weight:800; color:#c0461c; }

/* Book */
.book-progress { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:800; color:var(--muted); }
.book-progress .bar { flex:1; height:10px; border-radius:9px; background:#cfe2ec; overflow:hidden; }
.book-progress .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--teal),#3fd28f); }
.zone { margin-top:14px; text-align:left; }
.zone h3 { display:flex; align-items:baseline; gap:8px; font-size:15px; font-weight:900; color:#0a4d7c; }
.zone h3 small { font-size:12px; font-weight:800; color:var(--muted); }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:7px; margin-top:6px; }
.card { display:grid; justify-items:center; gap:2px; padding:6px 4px 7px; border-radius:12px; background:#e3f0f6; text-align:center; }
.card canvas { width:84px; height:52px; }
.card b { font-size:12px; font-weight:800; line-height:1.15; min-height:2.3em; display:grid; place-items:center; }
.card small { min-height:1.2em; display:flex; align-items:center; gap:3px; font-size:11.5px; font-weight:800; color:var(--muted); }
.card.rare { background:linear-gradient(#fff3cf,#ffe6a0); }
.card.unknown b { color:#7b93a5; }
.tag-rare { display:inline-block; padding:0 6px; border-radius:6px; background:#ffb52e; color:#4a2000; font-size:10px; font-weight:900; }

/* Daily */
.days { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:14px; }
.days li { display:grid; justify-items:center; gap:3px; padding:8px 4px; border-radius:12px; background:#e3f0f6; font-size:12px; font-weight:800; color:var(--muted); }
.days li b { display:flex; align-items:center; gap:3px; font-size:15px; color:var(--ink); }
.days li.done { background:#d8f5dc; color:#2c6a38; }
.days li.today { background:#fff1c9; box-shadow:inset 0 0 0 3px var(--sun); color:#8a4a00; }
.days li:last-child { grid-column:span 2; }

@media (max-height:560px) { .hero { display:none; } .tagline { font-size:13.5px; margin-top:6px; } }
#play { position:sticky; bottom:0; }
@media (max-height:640px) { .panel-body { padding:14px 14px 14px; } .hero { width:120px; height:66px; } .steps { margin-top:10px; gap:6px; } .steps li { padding:6px 8px; } .btn-main { margin-top:12px; min-height:46px; } }
@media (max-height:460px) { .hero, .kicker, .tagline { display:none; } .big-title { font-size:26px; } .steps { grid-template-columns:repeat(3,1fr); } .steps li { flex-direction:column; align-items:flex-start; gap:4px; font-size:12px; } .steps li i { width:22px; height:22px; font-size:12px; } .small { margin-top:6px; font-size:11.5px; } .btn-main { margin-top:8px; min-height:42px; font-size:17px; } .panel { max-height:calc(100vh - 8px); } .panel.start { width:min(100%,640px); } .panel-head { padding:6px 8px 6px 14px; } .x-btn { width:34px; height:34px; } .res-title { font-size:24px; } .res-list li { padding:2px 8px 2px 2px; } .res-list canvas { width:44px; height:28px; } .sum { font-size:13px; } .sum .tot { font-size:18px; } .actions { margin-top:8px; } .btn-alt { min-height:40px; } .days { grid-template-columns:repeat(7,1fr); } .days li:last-child { grid-column:auto; } .panel:not(.wide) { width:min(100%,620px); } .up-card { padding:8px; } }
@media (max-width:380px) { .panel-body { padding:14px 12px; } .steps li { font-size:12.5px; } .shop-grid { grid-template-columns:100%; } .cards { grid-template-columns:repeat(3,1fr); } .card canvas { width:72px; height:44px; } .res-list { grid-template-columns:100%; } }
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0e5585" stroke="#5fc6e0" stroke-width="2"/><path d="M6 25q7-5 14 0t14 0v9a17 17 0 0 1-28 0z" fill="#1fb7c6"/><path d="M12 19q6-7 13-1l4-4v11l-4-4q-7 6-13-2z" fill="#ff7a3d" stroke="#7a2a00" stroke-width="1.2"/><circle cx="15.5" cy="18.5" r="1.4" fill="#10202c"/><path d="M27 4v8a3 3 0 0 1-6 0" fill="none" stroke="#fff8ec" stroke-width="2" stroke-linecap="round"/></svg>
    <h1 class="game-name" id="game-name">Fishing Frenzy</h1>
    <p class="coins" id="coins-box"><i class="coin" aria-hidden="true"></i><span class="sr-only" data-i18n="coins"></span><b id="coins">0</b></p>
    <button type="button" class="icon-btn" id="mute" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff8ec" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff8ec"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="cross" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
  </header>
  <aside class="info" id="info">
    <dl class="stats">
      <div><dt data-i18n="deepest"></dt><dd id="st-depth">0</dd></div>
      <div><dt data-i18n="bestHaul"></dt><dd id="st-haul">0</dd></div>
      <div><dt data-i18n="species"></dt><dd id="st-book">0</dd></div>
    </dl>
    <section class="orders-box"><h2 data-i18n="ordersTitle"></h2><ol class="orders" id="orders-side"></ol></section>
  </aside>
  <div class="stage" id="stage"><canvas id="canvas" tabindex="0" role="img"></canvas></div>
  <nav class="dock" id="dock">

      game.fx.push({ x, y, vx: Math.cos(a) * sp, vy: kind === 'drop' ? -rand(150, 360) : Math.sin(a) * sp, life: rand(0.4, 0.9), max: 0.9, r: kind === 'bubble' ? rand(1.5, 4) : rand(2, 4), kind, color });
    }
  }

  // ---------- Cast flow ----------
  function startCast(x) {
    if (game.phase !== 'idle' || openPanel()) return;
    audio.unlock();
    const run = {
      maxU: lineMeters() * M, cap: UPS.cap.vals[save.up.cap], guard: UPS.guard.vals[save.up.guard],
      caught: [], reached: 0, stun: 0, zone: 0, netted: 0, full: false, shocked: false,
    };
    game.run = run;
    game.ents = buildWorld(run.maxU);
    game.flyers = []; game.toasts = []; game.pops = [];
    game.castFrom = rodTip();
    game.castTo = clamp(Number.isFinite(x) ? x : W * 0.55, 50, W - 50);
    game.targetX = game.castTo;
    game.phase = 'cast'; game.t = 0;
    audio.play('cast');
    updateUI();
  }
  function beginUp() {
    if (game.phase !== 'down') return;
    game.phase = 'up'; game.t = 0;
    updateUI();
  }
  function reelNow() {
    if (game.phase !== 'down' || game.run.stun > 0) return;
    toast(t.reel); beginUp();
  }
  function catchEnt(e, onDescent) {
    const run = game.run;
    e.gone = true;
    if (e.k === 'junk') {
      run.caught.push({ k: 'junk', kind: e.kind });
      toast(t.junkHit, '#ffd0b0'); audio.play('junk');
    } else {
      run.caught.push({ k: 'fish', sp: e.sp });
      const s = SPECIES[e.sp];
      pop(e.x, e.y - 14, `+${fmt(s.val)}`);
      audio.play(onDescent ? 'bite' : 'catch', run.caught.length);
      if (onDescent) toast(t.bite, '#ffe27a');
      particles(e.x, e.y, 6, 'bubble', '#dff8ff');
    }
    if (!onDescent && run.caught.length >= run.cap) { run.full = true; toast(t.full, '#7dffb0'); audio.play('full'); announce(t.full); }
  }
  function jellyHit(e) {
    const run = game.run;
    e.cool = 1.5;

      run.guard -= 1; e.zap = 0.3;

      particles(game.hook.x, game.hook.y, 10, 'bubble', '#bff4ff');
      return;
    }
    e.zap = 0.6; run.stun = 0.6; run.shocked = true; game.shake = 0.35;
    audio.play('shock');
    let lost = 0;
    if (game.phase === 'up') {
      for (let i = run.caught.length - 1; i >= 0 && lost < 2; i--) {
        const c = run.caught[i];
        run.caught.splice(i, 1); lost++;
        if (c.k === 'fish') {
          const f = makeFish(c.sp, game.hook.x + rand(-10, 10), game.hook.y + 20 + lost * 12, Math.random() < 0.5 ? -1 : 1, SPECIES[c.sp].spd * 2);
          f.cool = 2; game.ents.push(f);
        }
      }
      run.full = run.caught.length >= run.cap;
    }
    toast(lost ? `${t.shock} ${t.lost(lost)}` : t.shock, '#fff36a');
    announce(lost ? t.lost(lost) : t.shock);
  }
  // On the way down only a solid touch counts (k < 1), so grazing a fin is forgiven.
  function hits(e, x, y, r, k = 1) {
    const dx = x - e.x, dy = y - e.y, rx = e.rx * k + r, ry = e.ry * k + r;
    return dx * dx / (rx * rx) + dy * dy / (ry * ry) < 1;
  }
  function collide(onDescent) {
    const h = game.hook, run = game.run, r = onDescent ? 6 : 14 + ROD.reach[save.up.rod], k = onDescent ? 0.72 : 1;
    for (const e of game.ents) {
      if (e.gone || e.cool > 0 || Math.abs(e.y - h.y) > 140 || !hits(e, h.x, h.y, r, e.k === 'jelly' ? 0.85 : k)) continue;

  function steer(dt) {
    const h = game.hook;

    const sp = ROD.steer[save.up.rod], d = game.targetX - h.x;
    const step = clamp(d, -sp * dt, sp * dt);
    h.x = clamp(h.x + step, 14, W - 14);
    h.vx = dt > 0 ? step / dt : 0;
  }
  function updateDown(dt) {
    const run = game.run, h = game.hook;
    if (run.stun > 0) { run.stun -= dt; if (run.stun <= 0) beginUp(); return; }
    const m = h.y / M;
    h.y += (110 + Math.min(120, m * 0.35)) * dt;
    steer(dt);
    const z = zoneAt(h.y / M);
    if (z > run.zone) { run.zone = z; toast(t.zones[z], '#9ff6ff'); announce(t.zones[z]); }

  }
  function updateUp(dt) {
    const run = game.run, h = game.hook;

  }

  // ---------- Frenzy at the surface ----------
  const isGlow = f => f.state === 'fly' && Math.abs(f.vy) < f.vy0 * 0.42;
  function startFrenzy() {
    const run = game.run;
    game.phase = 'frenzy'; game.t = 0; game.endT = 0;
    particles(game.hook.x, 0, 14, 'drop', '#c8f2ff');
    audio.play('splash');
    const fish = run.caught.filter(c => c.k === 'fish');
    const air = Math.max(150, frenzyAir() - 70);

      const x0 = clamp(game.hook.x + rand(-30, 30), 50, W - 50), h = air * rand(0.6, 0.95), vy = Math.sqrt(2 * G * h), T = 2 * vy / G, land = rand(60, W - 60);

  function netFlyer(f) {

  }
  function netAt(x, y) {
    let best = null, bd = Infinity;

  }
  function netByKey() {
    if (game.netCool > 0) return;

  function updateFrenzy(dt) {
    let busy = false;

      busy = true;
      f.x += f.vx * dt; f.y += f.vy * dt; f.vy += G * dt; f.rot += f.spin * dt;
      if (f.y > 6 && f.vy > 0) { f.state = 'done'; particles(f.x, 0, 6, 'drop', '#c8f2ff'); }
    }
    if (!busy) { game.endT += dt; if (game.endT > 0.7) finishCast(); }
  }

  // ---------- End of cast ----------
  function finishCast() {
    const run = game.run;
    const fish = run.caught.filter(c => c.k === 'fish'), junk = run.caught.length - fish.length;
    const base = fish.reduce((a, c) => a + SPECIES[c.sp].val, 0);
    const frenzy = fish.reduce((a, c) => a + (c.netted ? Math.max(1, Math.round(SPECIES[c.sp].val * 0.5)) : 0), 0);
    const perfect = fish.length >= 3 && run.netted === fish.length ? Math.round(base * 0.25) : 0;
    const total = base + frenzy + perfect;
    const depth = Math.round(run.reached / M);
    const fresh = [];
    for (const c of fish) { const id = SPECIES[c.sp].id; if (!save.book[id] && !fresh.includes(c.sp)) fresh.push(c.sp); save.book[id] = (save.book[id] || 0) + 1; }
    const newDepth = depth > save.bestDepth, newHaul = total > save.bestHaul && total > 0;
    save.bestDepth = Math.max(save.bestDepth, depth); save.bestHaul = Math.max(save.bestHaul, total);
    save.casts += 1; save.fish += fish.length; save.coins += total;
    save.ema = save.ema ? Math.round(save.ema * 0.7 + total * 0.3) : total;
    const done = checkOrders({ fish, depth, total, netted: run.netted });
    persist();
    game.phase = 'idle'; game.t = 0; game.run = null; game.flyers = []; game.ents = [];
    showResults({ fish, junk, base, frenzy, perfect, total, depth, fresh, newDepth, newHaul, done, perfectRun: perfect > 0 });
    updateUI();
  }

  // ---------- Orders ----------
  function makeOrder(taken) {
    const lineM = lineMeters(), zMax = zoneAt(lineM - 1);
    const types = ['catch', 'catch', 'depth', 'haul', 'frenzy'].filter(ty => ty === 'catch' ? taken.filter(o => o.type === 'catch').length < 2 : !taken.some(o => o.type === ty));
    const type = pick(types);
    if (type === 'catch') {
      const pool = SPECIES.filter(s => !s.rare && s.z <= zMax && s.z >= zMax - 1 && ZONE_DEPTH[s.z][0] < lineM - 5 && !taken.some(o => o.type === 'catch' && o.sp === s.idx));
      const s = pick(pool.length ? pool : SPECIES.filter(q => q.z === 0 && !q.rare));
      const n = randInt(2, s.z < 2 ? 4 : 3);
      return { type, sp: s.idx, n, prog: 0, reward: round5(s.val * n * 2.5 + 20) };
    }
    if (type === 'depth') {
      const lo = Math.min(lineM, Math.max(20, save.bestDepth * 0.8));
      const n = clamp(Math.round(rand(lo, lineM) / 10) * 10, 10, lineM);
      return { type, n, prog: 0, reward: round5(n * 1.4 + 20) };
    }
    if (type === 'haul') {
      const n = niceRound(Math.max(20, (save.ema || 15) * 1.25));
      return { type, n, prog: 0, reward: round5(n * 0.35 + 15) };
    }
    const cap = UPS.cap.vals[save.up.cap];
    const n = clamp(randInt(3, Math.max(3, Math.ceil(cap * 0.7))), 3, cap);
    return { type: 'frenzy', n, prog: 0, reward: round5(20 + n * 6 * (1 + zMax)) };
  }
  function fillOrders() { while (save.orders.length < 3) save.orders.push(makeOrder(save.orders)); }
  function orderText(o) {
    if (o.type === 'catch') return t.oCatch(t.fish[o.sp], o.n);
    if (o.type === 'depth') return t.oDepth(fmt(o.n));
    if (o.type === 'haul') return t.oHaul(fmt(o.n));
    return t.oFrenzy(o.n);
  }
  function checkOrders(r) {
    const done = [];
    save.orders.forEach(o => {
      if (o.type === 'catch') o.prog = Math.min(o.n, o.prog + r.fish.filter(c => c.sp === o.sp).length);
      else if ((o.type === 'depth' && r.depth >= o.n) || (o.type === 'haul' && r.total >= o.n) || (o.type === 'frenzy' && r.netted >= o.n)) o.prog = o.n;
      if (o.prog >= o.n) { done.push(o); save.coins += o.reward; }
    });
    save.orders = save.orders.filter(o => !done.includes(o));
    fillOrders();
    return done;
  }

  // ---------- Daily bonus ----------
  const DAILY = [50, 75, 100, 150, 200, 300, 500];
  const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const dailyReward = day => round5(DAILY[day - 1] * (1 + save.up.line * 0.6));
  function dailyInfo() {
    const today = dayKey(new Date()), y = new Date();
    y.setDate(y.getDate() - 1);
    const ready = save.daily.last !== today;
    const day = ready ? (save.daily.last === dayKey(y) ? save.daily.streak % 7 + 1 : 1) : Math.max(1, save.daily.streak);
    return { ready, day, today };
  }
  function claimDaily() {
    const info = dailyInfo();
    if (!info.ready) return;
    const c = dailyReward(info.day);
    save.coins += c; save.daily = { last: info.today, streak: info.day };
    persist();
    audio.play('fanfare');
    announce(t.dailyGot(fmt(c)));
    renderDaily(); updateUI(true);
  }

  // ---------- Update loop ----------
  function camTarget() {
    switch (game.phase) {
      case 'down': return game.hook.y - VH * 0.32;
      case 'up': return game.hook.y - VH * 0.64;
      case 'frenzy': return -frenzyAir();
      default: return -idleAir();
    }
  }
  function update(dt) {
    game.time += dt; game.t += dt;
    game.netCool = Math.max(0, (game.netCool || 0) - dt);
    game.shake = Math.max(0, game.shake - dt);
    const h = game.hook;
    if (game.phase === 'idle') {
      const tip = rodTip();
      h.x = tip.x + Math.sin(game.time * 1.3) * 3; h.y = tip.y + 76;
    } else if (game.phase === 'cast') {
      const k = Math.min(1, game.t / 0.55), from = game.castFrom;
      h.x = from.x + (game.castTo - from.x) * k;
      h.y = from.y + (0 - from.y) * k - Math.sin(k * Math.PI) * 110;
      if (k >= 1) { h.y = 0; game.phase = 'down'; game.t = 0; particles(h.x, 0, 12, 'drop', '#c8f2ff'); audio.play('splash'); updateUI(); }

        e.face += clamp(e.dir - e.face, -dt * 5, dt * 5);
        if (e.k === 'junk') e.rot += e.spin * dt;
      }
    }

    }

    game.pops = game.pops.filter(q => q.t < 1.1);
    for (const q of game.toasts) q.t += dt;
    game.toasts = game.toasts.filter(q => q.t < 1.8);
    const target = camTarget();

  }

  // ---------- Rendering ----------
  const WATER = [[0, '#2cc2df'], [40, '#1a9ccc'], [120, '#136fa8'], [220, '#0d467f'], [350, '#08275a'], [480, '#05163a'], [640, '#030c22']].map(([m, c]) => [m, hexRGB(c)]);
  function waterAt(m) {
    if (m <= 0) return `rgb(${WATER[0][1]})`;
    for (let i = 1; i < WATER.length; i++) {
      if (m <= WATER[i][0]) {
        const [m0, a] = WATER[i - 1], [m1, b] = WATER[i], k = (m - m0) / (m1 - m0);
        return `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * k)).join(',')})`;
      }
    }
    return `rgb(${WATER[WATER.length - 1][1]})`;
  }
  const SNOW = Array.from({ length: 46 }, (_, i) => ({ x: (i * 197) % W, y: ((i * 131) % 97) / 97, r: 0.8 + (i % 4) * 0.5, s: 0.3 + (i % 5) * 0.15 }));

  function wallW(y, side) { return 12 + 9 * Math.sin(y * 0.011 + side * 3.1) + 5 * Math.sin(y * 0.037 + side); }

  function drawBackdrop(g, cam) {
    const top = clamp(-cam, 0, VH);
    if (top > 0) {
      const sky = g.createLinearGradient(0, 0, 0, top);
      sky.addColorStop(0, '#58bfee'); sky.addColorStop(1, '#d8f4ff');
      g.fillStyle = sky; g.fillRect(0, 0, W, top);
      const sunY = -cam - 300;
      if (sunY > -60) { const rg = g.createRadialGradient(W * 0.82, sunY, 8, W * 0.82, sunY, 90); rg.addColorStop(0, '#fff7c8'); rg.addColorStop(0.3, '#ffe9887a'); rg.addColorStop(1, '#ffe98800'); g.fillStyle = rg; g.fillRect(W * 0.82 - 90, sunY - 90, 180, 180); ell(g, W * 0.82, sunY, 26, 26, '#fff3b0'); }
      for (let i = 0; i < 3; i++) {
        const cx = ((i * 190 + game.time * (6 + i * 3)) % (W + 160)) - 80, cy = -cam - 250 + i * 55;
        if (cy < -40 || cy > top) continue;
        ell(g, cx, cy, 34, 12, '#ffffffcc'); ell(g, cx + 22, cy - 7, 22, 12, '#ffffffcc'); ell(g, cx - 20, cy - 4, 18, 9, '#ffffffcc');
      }
    }
    if (top < VH) {
      const water = g.createLinearGradient(0, top, 0, VH);
      for (let k = 0; k <= 4; k++) water.addColorStop(k / 4, waterAt((cam + top + (VH - top) * k / 4) / M));
      g.fillStyle = water; g.fillRect(0, top, W, VH - top);
      const camM = Math.max(0, cam / M);
      if (camM < 110) {
        g.save(); g.globalAlpha = 0.09 * (1 - camM / 110); g.fillStyle = '#ffffff';
        for (let i = 0; i < 5; i++) {
          const x0 = 20 + i * W / 4.6 + (reduceMotion ? 0 : Math.sin(game.time * 0.3 + i) * 18);
          g.beginPath(); g.moveTo(x0, top); g.lineTo(x0 + 34, top); g.lineTo(x0 + 120, VH); g.lineTo(x0 + 40, VH); g.closePath(); g.fill();
        }
        g.restore();

      const deepK = clamp((camM - 120) / 200, 0, 1);
      for (const [i, p] of SNOW.entries()) {
        const yy = ((p.y * VH - cam * p.s - game.time * 8 * p.s) % VH + VH) % VH;
        if (yy < top) continue;
        g.globalAlpha = 0.25 + deepK * 0.35;

      }

  }
  function drawWalls(g, cam) {
    const y0 = Math.max(0, Math.floor(cam / 24) * 24), y1 = cam + VH + 24;
    if (y1 <= 0) return;
    for (const side of [0, 1]) {
      g.beginPath();
      const xe = y => side ? W - wallW(y, side) : wallW(y, side);
      g.moveTo(side ? W : 0, y0);

    }
    // Kelp in the shallows, coral on the reef.

      const y = k * 70, m = y / M, side = hash(k) > 0.5 ? 1 : 0, x = side ? W - wallW(y, side) + 2 : wallW(y, side) - 2;
      if (m < 4 || m > 160 || hash(k + 7) < 0.45) continue;
      if (m < 60) {
        g.strokeStyle = '#2f9a5a'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y);
        for (let j = 1; j <= 5; j++) g.lineTo(x + (side ? -1 : 1) * (j * 5 + Math.sin(game.time + k + j) * 4), y - j * 12);
        g.stroke();
      } else {
        const c = ['#ff7f6e', '#ffb34d', '#d36ad6', '#ff5f8a'][Math.floor(hash(k + 3) * 4)];

      }
    }
  }
  function drawSeabed(g, cam) {
    const yb = SEABED * M;
    if (cam + VH < yb - 30) return;

    setText('res-sub', `${t.reached(fmt(r.depth))} · ${t.fishCount(n)}`);

    const list = $('res-list'); list.textContent = '';

      const li = document.createElement('li'), s = SPECIES[sp];

  function renderShop(msg = '') {

    const names = { line: t.upLine, rod: t.upRod, cap: t.upCap, guard: t.upGuard };
    const descs = { line: t.descLine, rod: t.descRod, cap: t.descCap, guard: t.descGuard };
    const eff = (key, lv) => key === 'line' ? t.meters(fmt(UPS.line.vals[lv])) : key === 'rod' ? t.effRod(Math.round((ROD.steer[lv] / ROD.steer[0] - 1) * 100)) : key === 'cap' ? t.effCap(UPS.cap.vals[lv]) : t.effGuard(UPS.guard.vals[lv]);

    if (lv >= UPS[key].vals.length - 1) return;
    const cost = UPS[key].cost[lv + 1];
    const names = { line: t.upLine, rod: t.upRod, cap: t.upCap, guard: t.upGuard };
    if (save.coins < cost) { audio.play('deny'); renderShop(t.poor); focusBuy(key); return; }
    save.coins -= cost; save.up[key] = lv + 1;
    persist(); audio.play('coin');
    renderShop(t.upgraded(names[key]));
    focusBuy(key);
    updateUI(true);
  }
  function focusBuy(key) {
    const b = $('shop-grid').querySelector(`.buy[data-key="${key}"]`);
    (b && !b.disabled ? b : $('shop').querySelector('[data-close]')).focus({ preventScroll: true });
  }

  function renderBook() {
    const body = $('book-body'); body.textContent = '';
    const found = SPECIES.filter(s => save.book[s.id]).length;
    const prog = document.createElement('div'); prog.className = 'book-progress';
    const lbl = document.createElement('span'); lbl.textContent = t.bookProgress(found, SPECIES.length);
    const bar = document.createElement('div'); bar.className = 'bar'; const fill = document.createElement('i'); fill.style.width = `${found / SPECIES.length * 100}%`; bar.append(fill);
    prog.append(lbl, bar); body.append(prog);
    ZONE_DEPTH.forEach(([a, b], z) => {
      const sec = document.createElement('section'); sec.className = 'zone';
      const h3 = document.createElement('h3'); h3.textContent = t.zones[z];
      const sm = document.createElement('small'); sm.textContent = `${fmt(a)}–${t.meters(fmt(b))}`; h3.append(sm);
      const ul = document.createElement('ul'); ul.className = 'cards';
      SPECIES.filter(s => s.z === z).forEach(s => {
        const n = save.book[s.id] || 0, li = document.createElement('li');
        li.className = `card${s.rare ? ' rare' : ''}${n ? '' : ' unknown'}`;
        const name = document.createElement('b'); name.textContent = n ? t.fish[s.idx] : t.unknown;
        const info = document.createElement('small');
        if (n) { info.append(`×${fmt(n)} · `, Object.assign(document.createElement('i'), { className: 'coin' }), fmt(s.val)); }
        const tag = document.createElement('span'); tag.className = 'tag-rare'; tag.textContent = t.rare;
        li.setAttribute('aria-label', n ? `${t.fish[s.idx]}, ×${n}, ${fmt(s.val)} ${t.coins}` : t.notFound);
        li.append(speciesIcon(s.idx, 84, 52, n > 0), name, info);
        if (s.rare) li.append(tag);
        ul.append(li);
      });
      sec.append(h3, ul); body.append(sec);
    });
  }

  function renderOrders(list) {
    list.textContent = '';
    save.orders.forEach(o => {
      const li = document.createElement('li'); li.className = 'order';
      const b = document.createElement('b'); b.textContent = orderText(o);
      const rw = document.createElement('span'); rw.className = 'rw'; rw.append(Object.assign(document.createElement('i'), { className: 'coin' }), `+${fmt(o.reward)}`);
      const bar = document.createElement('div'); bar.className = 'bar'; bar.setAttribute('aria-hidden', 'true');
      const fill = document.createElement('i'); fill.style.width = `${o.prog / o.n * 100}%`; bar.append(fill);
      const sm = document.createElement('small'); sm.textContent = `${fmt(o.prog)}/${fmt(o.n)}`;
      li.append(b, rw, bar);
      if (o.type === 'catch') li.append(sm);
      list.append(li);
    });
  }

  function renderDaily() {
    const info = dailyInfo(), list = $('days'); list.textContent = '';
    for (let d = 1; d <= 7; d++) {
      const li = document.createElement('li');
      const doneDay = info.ready ? d < info.day : d <= info.day;
      li.className = (info.ready && d === info.day) ? 'today' : doneDay ? 'done' : '';
      const b = document.createElement('b'); b.append(Object.assign(document.createElement('i'), { className: 'coin' }), fmt(dailyReward(d)));
      li.append(t.day(d), b);
      list.append(li);
    }
    const btn = $('claim');
    btn.disabled = !info.ready;
    btn.textContent = info.ready ? `${t.claim} · ${t.dailyGot(fmt(dailyReward(info.day)))}` : t.claimed;
  }

  // ---------- HUD in the DOM ----------
  let shownCoins = save.coins;
  function updateUI(bump = false) {
    if (save.coins !== shownCoins) { if (bump || save.coins > shownCoins) { $('coins-box').classList.remove('bump'); void $('coins-box').offsetWidth; $('coins-box').classList.add('bump'); } shownCoins = save.coins; }
    setText('coins', fmt(save.coins));
    setText('st-depth', t.meters(fmt(save.bestDepth)));
    setText('st-haul', fmt(save.bestHaul));
    setText('st-book', `${SPECIES.filter(s => save.book[s.id]).length}/${SPECIES.length}`);
    renderOrders($('orders-side'));
    $('daily-dot').hidden = !dailyInfo().ready;
    const idle = game.phase === 'idle', act = $('act');
    const label = idle ? t.cast : game.phase === 'down' ? t.reel : game.phase === 'frenzy' && game.flyers.length ? t.net : t.reeling;
    setText('act-label', label);
    act.disabled = !(idle || game.phase === 'down' || (game.phase === 'frenzy' && game.flyers.length));
    ['btn-shop', 'btn-book', 'btn-orders', 'btn-daily'].forEach(id => { $(id).disabled = !idle; });
  }

  // ---------- Input ----------
  function act() {
    if (openPanel()) return;
    audio.unlock();
    if (game.phase === 'idle') startCast();
    else if (game.phase === 'down') reelNow();
    else if (game.phase === 'frenzy') netByKey();
  }
  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * VH + game.camY };
  }
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    audio.unlock();
    const p = toWorld(e);
    if (game.phase === 'idle') { startCast(p.x); return; }
    if (game.phase === 'frenzy') { netAt(p.x, p.y); return; }
    if (game.phase === 'down' || game.phase === 'up') {
      if (e.pointerType === 'mouse') game.targetX = clamp(p.x, 14, W - 14);
      else { drag = { id: e.pointerId, x: e.clientX }; game.targetX = game.hook.x; try { canvas.setPointerCapture(e.pointerId); } catch {} }
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (drag && e.pointerId === drag.id) {
      const r = canvas.getBoundingClientRect();
      game.targetX = clamp(game.targetX + (e.clientX - drag.x) / r.width * W * 1.3, 14, W - 14);
      drag.x = e.clientX;
    } else if (e.pointerType === 'mouse' && (game.phase === 'down' || game.phase === 'up')) game.targetX = clamp(toWorld(e).x, 14, W - 14);
  });
  const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  document.addEventListener('keydown', e => {
    if (openPanel()) return;
    const k = e.key, onBtn = e.target instanceof Element && e.target.closest('button');
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = 1; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = 1; e.preventDefault(); }
    else if ((k === ' ' || k === 'Enter') && !onBtn) { e.preventDefault(); if (!e.repeat) act(); }
    else if ((k === 'ArrowUp' || k === 'w' || k === 'W') && game.phase === 'down') { e.preventDefault(); reelNow(); }
    else if ((k === 'ArrowDown' || k === 's' || k === 'S') && game.phase === 'idle') { e.preventDefault(); act(); }
  });
  document.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = 0;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = 0;
    else return;
    if (!keys.left && !keys.right) game.targetX = game.hook.x;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = 0; drag = null; });

  $('act').addEventListener('click', act);
  $('play').addEventListener('click', () => { audio.unlock(); if (dailyInfo().ready) { renderDaily(); showPanel('daily'); } else closePanels(); });
  $('res-again').addEventListener('click', () => { closePanels(); startCast(); });
  $('res-shop').addEventListener('click', () => { renderShop(); showPanel('shop'); });
  $('res-book').addEventListener('click', () => { renderBook(); showPanel('book'); });
  $('btn-shop').addEventListener('click', () => { renderShop(); showPanel('shop'); });
  $('btn-book').addEventListener('click', () => { renderBook(); showPanel('book'); });
  $('btn-orders').addEventListener('click', () => { renderOrders($('orders-list')); showPanel('orders'); });
  $('btn-daily').addEventListener('click', () => { renderDaily(); showPanel('daily'); });
  $('claim').addEventListener('click', () => { claimDaily(); $('daily').querySelector('[data-close]').focus({ preventScroll: true }); });
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closePanels));
  const muteBtn = $('mute');
  muteBtn.setAttribute('aria-pressed', String(!audio.muted));
  muteBtn.addEventListener('click', () => { muteBtn.setAttribute('aria-pressed', String(!audio.toggle())); });

  fillOrders(); persist();
  new ResizeObserver(resize).observe(stage);
  resize();
  game.camY = -idleAir();
  updateUI();
  $('play').focus({ preventScroll: true });

  let last = performance.now();
  function frame(now) {
    // Clamp dt so a hidden or stalled tab never teleports the hook.
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!document.hidden) {
      const prev = game.phase;
      update(dt);
      if (game.phase !== prev) updateUI();
      draw();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Read-only snapshot for automated tests (no state changes possible through it).
  window.__fishing = Object.freeze({
    state: () => {
      const run = game.run;
      return {
        phase: game.phase, coins: save.coins, up: { ...save.up }, depth: Math.round(game.hook.y / M), hookX: game.hook.x, hookY: game.hook.y, camY: game.camY, vh: VH,
        maxDepth: run ? run.maxU / M : lineMeters(), cap: run ? run.cap : UPS.cap.vals[save.up.cap], guard: run ? run.guard : UPS.guard.vals[save.up.guard],
        caught: run ? run.caught.map(c => c.k === 'fish' ? SPECIES[c.sp].id : 'junk') : [], full: !!(run && run.full), stun: run ? run.stun : 0, netted: run ? run.netted : 0, shocked: !!(run && run.shocked),
        book: { ...save.book }, bestDepth: save.bestDepth, bestHaul: save.bestHaul, casts: save.casts, orders: save.orders.map(o => ({ ...o })), daily: { ...save.daily }, panel: openPanel(),
      };
    },
    ents: (range = 700) => game.ents.filter(e => !e.gone && Math.abs(e.y - game.hook.y) < range).map(e => ({ k: e.k, id: e.k === 'fish' ? SPECIES[e.sp].id : e.k, x: e.x, y: e.y, rx: e.rx, ry: e.ry, dir: e.dir, spd: e.spd, cool: e.cool })),
    flyers: () => game.flyers.filter(f => f.state === 'fly').map(f => ({ x: f.x, y: f.y, vy: f.vy, glow: isGlow(f) })),
    toClient: (x, y) => { const r = canvas.getBoundingClientRect(); return { x: r.left + x / W * r.width, y: r.top + (y - game.camY) / VH * r.height }; },
  });
})();
</script>
</body>
</html>
