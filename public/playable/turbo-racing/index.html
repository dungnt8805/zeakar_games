<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turbo Racing</title>
<style>
:root {
  --ink: #1b1e3a;
  --muted: #676d93;
  --paper: #ffffff;
  --accent: #ff5a36;
  --accent-dark: #cf3a17;
  --gold: #ffcc33;
  --gold-dark: #d29a00;
  --teal: #16b9aa;
  --teal-dark: #0d8a7e;
  --hud: #12162fd6;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: #1b1e3a; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#game:focus-visible { outline: none; }

/* ---------- HUD ---------- */
.hud { position: fixed; inset: 0; pointer-events: none; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.hud[hidden], .controls[hidden] { display: none; }
.hud-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 6px; }
.hud-left { display: grid; gap: 6px; justify-items: start; }
.hud-left .row { display: flex; gap: 6px; }
.hud-right { display: grid; gap: 6px; justify-items: end; }
.chip { min-width: 54px; padding: 4px 10px 6px; border-radius: 12px; background: var(--hud); color: #fff; text-align: center; box-shadow: 0 4px 14px #0003; }
.chip small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #a9b2ea; white-space: nowrap; }
.chip b { display: block; font-size: 22px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip b i { font-style: normal; font-size: 14px; opacity: .65; }
.chip.time { min-width: 108px; }
.chip.time b.low { color: #ff8e7a; }
.chip .sub { display: block; font-size: 11px; font-weight: 700; color: #ffd76a; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip .sub:empty { display: none; }
.cp { height: 5px; margin-top: 4px; border-radius: 9px; background: #ffffff26; overflow: hidden; }
.cp[hidden] { display: none; }
.cp i { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--gold), var(--accent)); transform-origin: left; transform: scaleX(0); }
.speedo { display: flex; align-items: baseline; gap: 4px; min-width: 116px; padding: 4px 10px 7px; flex-wrap: wrap; text-align: start; }
.speedo b { font-size: 24px; min-width: 2.2em; text-align: end; }
.speedo small { display: inline; }
.nitro-bar { flex: 1 0 100%; height: 7px; border-radius: 9px; background: #ffffff26; overflow: hidden; }
.nitro-bar i { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, #38d9ff, #7c5cff); transform-origin: left; transform: scaleX(0); }
.nitro-bar.full i { background: linear-gradient(90deg, #ffd23f, #ff5a36); }
.pause { pointer-events: auto; width: 42px; height: 42px; border-radius: 13px; background: var(--hud); display: grid; place-items: center; box-shadow: 0 4px 14px #0003; }
.pause svg { width: 15px; height: 15px; fill: #fff; }
#minimap { width: 92px; height: 92px; border-radius: 14px; background: #12162f99; }
#minimap[hidden] { display: none; }
.big { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font-size: clamp(54px, 15vmin, 120px); font-weight: 900; color: #fff; text-shadow: 0 6px 0 #0005, 0 0 30px #ff5a3699; pointer-events: none; }
.big[hidden] { display: none; }
.big.pop { animation: pop .9s ease-out both; }
@keyframes pop { 0% { opacity: 0; transform: scale(1.8); } 20% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.85); } }
.toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); padding: 7px 16px; border-radius: 99px; background: #12162fe0; color: #fff; font-size: 16px; font-weight: 900; white-space: nowrap; pointer-events: none; opacity: 0; }
.toast.show { animation: toast 1.3s ease-out both; }
.toast.gold { background: var(--gold); color: #3a2a00; }
.toast.teal { background: var(--teal); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.9); } 12%, 72% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -10px); } }

/* ---------- Touch / mouse controls ---------- */
.controls { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 max(10px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); pointer-events: none; }
.pad { display: grid; gap: 9px; pointer-events: auto; }
.pad.steer { grid-auto-flow: column; }
.pad.act { grid-template-areas: "nitro nitro" "brake gas"; }
.pad.act.auto { grid-template-areas: "nitro" "brake"; }
.ctl { width: 70px; height: 66px; border-radius: 20px; background: #12162f80; border: 2px solid #ffffff5c; color: #fff; display: grid; place-items: center; align-content: center; gap: 1px; touch-action: none; box-shadow: 0 4px 12px #0003; }
.ctl svg { width: 26px; height: 26px; fill: currentColor; }
.ctl small { font-size: 10px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; line-height: 1; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctl.on { background: #ffffff59; transform: scale(.95); }
.ctl.brake { grid-area: brake; }
.ctl.gas { grid-area: gas; }
.ctl.gas[hidden] { display: none; }
.ctl.nitro { grid-area: nitro; justify-self: stretch; width: auto; height: 52px; position: relative; overflow: hidden; }
.ctl.nitro::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #38d9ffaa, #7c5cffaa); transform-origin: left; transform: scaleX(var(--n, 0)); }
.ctl.nitro.ready::before { background: linear-gradient(90deg, #ffd23fcc, #ff5a36cc); }
.ctl.nitro > * { position: relative; }
.ctl.nitro b { font-size: 18px; line-height: 1; }
.fine .ctl { width: 58px; height: 54px; opacity: .78; }
.fine .ctl.nitro { width: auto; height: 44px; }

/* ---------- Panels ---------- */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: #0d102466; }
.overlay[hidden] { display: none; }
.overlay.soft { background: linear-gradient(#0d102400 20%, #0d102488); }
.panel { width: min(100%, 410px); max-height: 100%; overflow: auto; padding: 20px 18px 18px; border-radius: 26px; background: var(--paper); text-align: center; box-shadow: 0 24px 60px #0a0c2066; animation: rise .3s ease-out; overscroll-behavior: contain; }
.panel.wide { width: min(100%, 860px); }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.logo { display: block; width: 150px; height: 64px; margin: 0 auto 2px; }
.panel h1 { font-size: clamp(32px, 10vw, 44px); font-weight: 900; letter-spacing: -.04em; line-height: 1.02; font-style: italic; }
.panel h1 span { color: var(--accent); }
.panel h2 { font-size: 25px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
.panel p { margin-top: 8px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.panel .small { font-size: 12px; }
.panel h3 { margin: 14px 0 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: start; }
.wallet { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 5px 14px; border-radius: 99px; background: #fff3cc; color: #5a4300; font-weight: 900; font-variant-numeric: tabular-nums; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.mode { display: grid; justify-items: center; align-content: center; gap: 1px; min-width: 0; min-height: 84px; padding: 10px 6px; border-radius: 18px; background: var(--accent); color: #fff; box-shadow: 0 5px 0 var(--accent-dark); }
.mode .ico { font-size: 24px; line-height: 1.1; }
.mode b { font-size: 16px; font-weight: 900; line-height: 1.15; }
.mode small { font-size: 11.5px; font-weight: 700; opacity: .92; line-height: 1.2; }
.mode.trial { background: var(--teal); box-shadow: 0 5px 0 var(--teal-dark); }
.mode.endless { background: #7c5cff; box-shadow: 0 5px 0 #5838d6; }
.mode.garage { background: var(--gold); color: #3a2a00; box-shadow: 0 5px 0 var(--gold-dark); }
.mode:active, .btn:active, .card-btn:active { transform: translateY(3px); box-shadow: none; }
.toggles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border-radius: 99px; background: #f0f1f9; font-size: 13px; font-weight: 800; }
.toggle b { padding: 2px 8px; border-radius: 99px; background: #d8dbea; color: var(--muted); font-size: 11px; }
.toggle[aria-pressed="true"] b { background: var(--teal); color: #fff; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { flex: 1 1 120px; min-height: 46px; padding: 11px 10px; border-radius: 15px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 900; box-shadow: 0 4px 0 var(--accent-dark); }
.btn.alt { background: var(--teal); box-shadow: 0 4px 0 var(--teal-dark); }
.btn.ghost { background: #f0f1f9; color: var(--ink); box-shadow: 0 4px 0 #d6d9ea; }
.btn[hidden] { display: none; }
.cups { display: grid; gap: 10px; margin-top: 14px; }
.cup { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; padding: 12px; border-radius: 18px; background: #f3f4fb; text-align: start; }
.cup .tro { grid-row: span 3; font-size: 34px; width: 44px; text-align: center; }
.cup strong { font-size: 17px; font-weight: 900; }
.cup span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.cup .card-btn { grid-column: 2; justify-self: start; }
.cup.locked { opacity: .62; }
.card-btn { min-height: 38px; padding: 8px 14px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 900; box-shadow: 0 3px 0 var(--accent-dark); }
.card-btn:disabled { background: #c9ccdc; box-shadow: none; cursor: default; }
.card-btn.alt { background: var(--gold); color: #3a2a00; box-shadow: 0 3px 0 var(--gold-dark); }
.tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.track { position: relative; display: grid; gap: 1px; justify-items: start; min-width: 0; padding: 9px 10px 9px 44px; border-radius: 14px; background: #f3f4fb; text-align: start; box-shadow: 0 3px 0 #dfe1ee; }
.track .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 22px; }
.track b { font-size: 14px; font-weight: 900; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.track:disabled { opacity: .5; cursor: default; box-shadow: none; }
.cars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.car { display: grid; gap: 4px; padding: 8px 8px 10px; border-radius: 16px; background: #f3f4fb; border: 2px solid transparent; min-width: 0; }
.car.sel { border-color: var(--accent); background: #fff1ec; }
.car canvas { width: 100%; height: auto; aspect-ratio: 220 / 130; display: block; }
.car strong { font-size: 15px; font-weight: 900; }
.stat { display: grid; grid-template-columns: minmax(0, 1fr) 38%; align-items: center; gap: 6px; font-size: 10.5px; color: var(--muted); text-align: start; }
.stat span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat i { display: block; height: 6px; border-radius: 9px; background: #dfe1ee; overflow: hidden; }
.stat i::after { content: ""; display: block; height: 100%; width: var(--v); background: var(--accent); border-radius: inherit; }
.car .card-btn { margin-top: 4px; }
.ups { display: grid; gap: 8px; }
.up { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: #f3f4fb; text-align: start; }
.up .ico { font-size: 24px; }
.up strong { display: block; font-size: 14px; }
.up span { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.up .dots { color: var(--accent); letter-spacing: 2px; font-size: 12px; }
.results { list-style: none; padding: 0; margin-top: 12px; display: grid; gap: 3px; text-align: start; }
.results li { display: grid; grid-template-columns: 26px 12px 1fr auto auto; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 11px; background: #f4f5fb; font-size: 14px; }
.results li .p { font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; }
.results li i { width: 12px; height: 12px; border-radius: 50%; }
.results li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.results li em { font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.results li b { font-variant-numeric: tabular-nums; min-width: 2.4em; text-align: end; }
.results li.you { background: #fff1ec; outline: 2px solid var(--accent); }
.res-grid { display: grid; gap: 4px 16px; }
.res-grid h3 { margin-bottom: 0; }
.big-emoji { font-size: 44px; line-height: 1.1; }
.stats-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 10px; font-size: 14px; font-weight: 800; }
.stats-line span { white-space: nowrap; }
.earned { font-size: 22px; font-weight: 900; color: var(--gold-dark) !important; }
.badge { display: inline-block; margin-top: 8px !important; padding: 4px 14px; border-radius: 99px; background: var(--gold); color: #3a2a00 !important; font-size: 13px !important; font-weight: 800; }
.badge[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Wide frames: bigger HUD, side-by-side panel content. */
@media (min-width: 700px) and (min-height: 500px) {
  .chip b { font-size: 28px; }
  .chip small { font-size: 11px; }
  .chip.time { min-width: 140px; }
  .speedo b { font-size: 30px; }
  .speedo { min-width: 146px; }
  #minimap { width: 132px; height: 132px; }
  .toast { font-size: 19px; }
}
@media (min-aspect-ratio: 5/4) {
  .panel.menu { width: min(100%, 640px); }
  .modes { grid-template-columns: repeat(4, 1fr); }
  .cups { grid-template-columns: repeat(3, 1fr); }
  .cup { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .cup .tro { grid-row: auto; }
  .cup .card-btn { grid-column: auto; justify-self: center; }
  .tracks { grid-template-columns: repeat(4, 1fr); }
  .cars { grid-template-columns: repeat(4, 1fr); }
  .ups { grid-template-columns: repeat(3, 1fr); }
  .up { grid-template-columns: auto 1fr; }
  .up .card-btn { grid-column: span 2; }
  .res-grid.two { grid-template-columns: 1fr 1fr; }
}
/* Short screens (phone held sideways). */
@media (max-height: 480px) {
  .logo, .menu .tagline { display: none; }
  .panel { padding: 12px 14px 14px; border-radius: 20px; }
  .panel h1 { font-size: 30px; }
  .panel h2 { font-size: 21px; }
  .panel p { margin-top: 4px; }
  .mode { min-height: 70px; padding: 8px 4px; }
  .modes, .cups, .tracks { margin-top: 10px; }
  .toggles { margin-top: 10px; }
  .actions { margin-top: 10px; }
  .btn { min-height: 40px; padding: 8px 10px; }
  .big-emoji { font-size: 32px; }
  .chip { padding: 3px 8px 4px; }
  .chip b { font-size: 18px; }
  .chip small { font-size: 9.5px; }
  .chip .sub { font-size: 10px; }
  .chip.time { min-width: 92px; }
  .speedo { min-width: 98px; }
  .speedo b { font-size: 19px; }
  .pause { width: 36px; height: 36px; }
  #minimap { width: 70px; height: 70px; }
  .ctl { width: 60px; height: 54px; border-radius: 17px; }
  .ctl.nitro { height: 42px; }
  .pad { gap: 7px; }
  .toast { top: 26%; font-size: 14px; }
  .results li { padding: 3px 10px; font-size: 13px; }
}
@media (max-width: 360px) {
  .ctl { width: 62px; height: 60px; }
  .chip { min-width: 48px; padding: 4px 8px 5px; }
  .chip.time { min-width: 92px; }
  .mode b { font-size: 14px; }
  .tracks { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .toast.show { opacity: 1; } }
</style>
</head>
<body>
<canvas id="game" tabindex="0" role="img"></canvas>

<div class="hud" id="hud" hidden>
  <div class="hud-top">
    <div class="hud-left">
      <div class="row">
        <div class="chip"><small id="lbl-a"></small><b id="val-a"></b></div>
        <div class="chip"><small id="lbl-b"></small><b id="val-b"></b></div>
      </div>
      <div class="chip speedo"><b id="speed">0</b><small data-i18n="kmh"></small><div class="nitro-bar" id="nitro-bar"><i id="nitro-fill"></i></div></div>
    </div>
    <div class="chip time"><small id="lbl-c"></small><b id="val-c"></b><span class="sub" id="val-d"></span><div class="cp" id="cp" hidden><i id="cp-fill"></i></div></div>
    <div class="hud-right">
      <button type="button" class="pause" id="pause-btn" data-i18n-label="pause"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.6" height="12" rx="1.2"/><rect x="8.4" y="1" width="3.6" height="12" rx="1.2"/></svg></button>
      <canvas id="minimap" aria-hidden="true"></canvas>
    </div>
  </div>
</div>
<div class="big" id="big" aria-hidden="true" hidden></div>
<div class="toast" id="toast" aria-hidden="true"></div>

<div class="controls" id="controls" hidden>
  <div class="pad steer">
    <button type="button" class="ctl" id="c-left" data-k="left" data-i18n-label="steerL"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3.5v17L4.5 12z"/></svg></button>
    <button type="button" class="ctl" id="c-right" data-k="right" data-i18n-label="steerR"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5v17L19.5 12z"/></svg></button>
  </div>
  <div class="pad act" id="act-pad">
    <button type="button" class="ctl nitro" id="c-nitro" data-k="nitro" data-i18n-label="nitro"><b aria-hidden="true">🔥</b><small data-i18n="nitro"></small></button>
    <button type="button" class="ctl brake" id="c-brake" data-k="brake" data-i18n-label="brake"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"/></svg><small data-i18n="brake"></small></button>
    <button type="button" class="ctl gas" id="c-gas" data-k="gas" data-i18n-label="gas" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 21 18H3z"/></svg><small data-i18n="gas"></small></button>
  </div>
</div>
<p class="sr-only" id="announcer" aria-live="polite"></p>

<div class="overlay soft" id="menu" hidden>
  <div class="panel menu" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <svg class="logo" viewBox="0 0 150 64" aria-hidden="true">
      <path d="M4 40h26M0 48h22M8 32h18" stroke="#ffcc33" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="88" cy="58" rx="54" ry="5" fill="#1b1e3a22"/>
      <path d="M40 50c0-12 4-18 12-20l10-14c3-4 6-5 11-5h28c5 0 8 1 11 5l10 14c8 2 12 8 12 20z" fill="#ff5a36"/>
      <path d="M62 30l8-12c2-2 3-3 6-3h24c3 0 4 1 6 3l8 12z" fill="#2b3557"/>
      <path d="M70 26l5-7h11l-4 7z" fill="#ffffff55"/>
      <rect x="46" y="34" width="20" height="7" rx="3" fill="#ffd23f"/><rect x="110" y="34" width="20" height="7" rx="3" fill="#ffd23f"/>
      <rect x="78" y="40" width="20" height="7" rx="2" fill="#fff"/>
      <rect x="42" y="48" width="18" height="10" rx="3" fill="#1b1e3a"/><rect x="116" y="48" width="18" height="10" rx="3" fill="#1b1e3a"/>
    </svg>
    <h1 id="menu-title">Turbo <span>Racing</span></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <p class="wallet"><span aria-hidden="true">🪙</span><span id="menu-coins">0</span></p>
    <div class="modes">

  // ---------- Session state ----------
  const S = { screen: 'menu', mode: 'demo', phase: 'idle', paused: false, time: 0, clock: 0, countdown: 0, trackIdx: 0, cup: 0, race: 0, theme: TRACKS[0].theme, endTimer: 0, stage: 0, timeLeft: 0, speedMul: 1, nearMisses: 0, results: null, auto: false, stats: null, lastBeep: 0 };
  let track = null;
  const player = { dist: 0, x: 0, speed: 0, steer: 0, nitro: 0, boosting: false, spin: 0, lap: 1, lapStart: 0, bestLap: 0, lastLap: 0, finished: false, finishTime: 0, driftT: 0, draftT: 0, offroad: false, style: 'hatch', color: '#ff4b3a', name: '', isPlayer: true };
  let cars = [];
  const ghost = { on: false, data: null, dist: 0, x: 0, style: 'hatch', color: '#ffffff', isGhost: true, w: CAR_W };
  const REC_MAX = 3000;

  const ctl = { steer: 0, gas: false, brake: false, nitro: false };
  const themeAt = abs => (track && track.endless ? ENDLESS_THEMES[Math.floor(Math.max(0, abs) / STAGE) % ENDLESS_THEMES.length] : S.theme);

  function makeAI(r, i, cupIdx) {
    const top = BASE_SPEED * CUP_SPEED[cupIdx] * r.skill * (0.985 + Math.random() * 0.03);
    return { name: r.name, color: r.color, style: r.style, idx: i + 1, dist: 0, x: 0, tx: 0, line: (Math.random() * 2 - 1) * 0.45, speed: 0, top, acc: top / 4.4, laneT: 0, spin: 0, prevRel: 0, finished: false, finishTime: 0, bestLap: 0, lapStart: 0, lap: 1, w: CAR_W, hitCd: 0 };
  }
  function makeTraffic() {
    const styles = ['sedan', 'van', 'truck', 'sedan', 'hatch'], colors = ['#e9ecf2', '#3d6ee8', '#2a9d6e', '#d9483b', '#f2b134', '#8d95a8', '#5a4fcf', '#1c1f2b'];

  function laneX(l) { const lanes = track.lanes; return -1 + (2 * l + 1) / lanes; }

  // ---------- Race setup ----------
  function resetPlayer() {
    S.stats = playerStats();
    Object.assign(player, { laps: [], dist: 0, x: 0, speed: 0, steer: 0, nitro: 0.35, boosting: false, spin: 0, lap: 1, lapStart: 0, bestLap: 0, lastLap: 0, finished: false, finishTime: 0, driftT: 0, draftT: 0, offroad: false, style: S.stats.style, color: S.stats.color, name: t.you });
  }
  function setupRace(mode, idx) {
    S.mode = mode; S.trackIdx = idx;
    track = getTrack(mode === 'endless' ? -1 : idx);
    S.theme = mode === 'endless' ? ENDLESS_THEMES[0] : TRACKS[idx].theme;
    resetPlayer();
    cars = [];
    ghost.on = false;
    Object.assign(S, { screen: 'race', phase: 'countdown', paused: false, time: 0, countdown: 3.2, endTimer: 0, stage: 0, timeLeft: 40, speedMul: 1, nearMisses: 0, results: null, lastBeep: 4, distance: 0, lapRecord: false });
    if (mode === 'champ') {
      // Grid: two columns behind the start line; the player starts fifth.
      const order = [5, 4, 3, 2, 1, 0];
      const grid = [];
      RIVALS.forEach((r, i) => grid.push(makeAI(r, i, S.cup)));
      const slots = [];
      for (let k = 0; k < 7; k++) slots.push({ dist: -CAR_LEN * 1.4 - Math.floor(k / 2) * 900, x: k % 2 ? 0.42 : -0.42 });
      let s = 0;
      for (let k = 0; k < 7; k++) {
        const slot = slots[k];
        if (k === 4) { player.dist = slot.dist; player.x = slot.x; continue; }
        const c = grid[order[s++]];
        c.dist = slot.dist; c.x = c.tx = c.line = slot.x;

      player.dist = 0;
      const g = readJSON(`ghost.${idx}`);
      if (g && Array.isArray(g.z) && g.z.length > 10) { ghost.data = g; ghost.on = true; ghost.style = g.s || 'hatch'; ghost.color = g.c || '#ffffff'; }

  }

  // ---------- Simulation ----------
  function readControls() {
    if (S.auto || S.phase === 'done' || S.screen !== 'race') { autopilot(); return; }
    const right = keys.right || btn.right, left = keys.left || btn.left;
    ctl.steer = clamp((right ? 1 : 0) - (left ? 1 : 0) + zone, -1, 1);
    ctl.brake = keys.brake || btn.brake;
    ctl.gas = !ctl.brake && (keys.gas || btn.gas || settings.auto);
    ctl.nitro = keys.nitro || btn.nitro;
  }
  // Follows the road and weaves around cars; drives the menu demo, the finish cool-down and the test hook.
  function autopilot() {
    const seg = segAt(player.dist), st = S.stats, pct = player.speed / st.top;
    let tx = S.mode === 'endless' ? player.x : clamp(player.x, -0.5, 0.5) * 0.9;
    let threat = null, best = 1e9;
    for (const c of cars) {
      const rel = wrapRel(c.dist - player.dist);
      if (rel > -CAR_LEN && rel < 5200 && rel < best && Math.abs(c.x - player.x) < 0.5 && (c.speed < player.speed || rel < CAR_LEN * 2)) { threat = c; best = rel; }
    }
    if (threat) {
      const room = side => { let x = threat.x + side * 0.62; if (Math.abs(x) > 0.82) return null; for (const c of cars) { const rel = wrapRel(c.dist - player.dist); if (c !== threat && rel > -CAR_LEN * 2 && rel < 4000 && Math.abs(c.x - x) < 0.38) return null; } return x; };
      const a = room(threat.x > player.x ? -1 : 1), b = room(threat.x > player.x ? 1 : -1);
      tx = a !== null ? a : b !== null ? b : tx;
    }
    const ff = (pct * segAt(player.dist + 800).curve * CENT) / (st.hand * st.grip);
    ctl.steer = clamp(ff + (tx - player.x) * 3, -1, 1);
    ctl.gas = S.phase !== 'done' || S.mode !== 'endless';
    ctl.brake = S.phase === 'done' && S.mode === 'endless';
    ctl.nitro = S.screen === 'race' && S.phase === 'race' && player.nitro > 0.5 && Math.abs(seg.curve) < 2.5 && !threat;
    if (S.screen !== 'race') { ctl.gas = player.speed < BASE_SPEED * 0.62; ctl.nitro = false; }
  }

  function playerStep(dt) {
    const st = S.stats, seg = segAt(player.dist);
    const top = st.top * (S.mode === 'endless' ? S.speedMul : 1);
    const pct = clamp(player.speed / top, 0, 1.4);
    player.steer += (ctl.steer - player.steer) * Math.min(1, dt * 12);
    const turn = dt * 2.4 * Math.min(1, 0.2 + pct * 1.2) * st.hand;
    if (player.spin <= 0) player.x += player.steer * turn;
    player.x -= (dt * 2 * pct * pct * seg.curve * CENT) / st.grip;
    // Nitro burns while held; it needs a little charge to light.
    const wantBoost = ctl.nitro && player.spin <= 0 && player.nitro > (player.boosting ? 0.01 : 0.12);
    if (wantBoost && !player.boosting) sfx('nitro');
    player.boosting = wantBoost;
    if (player.boosting) player.nitro = Math.max(0, player.nitro - st.drain * dt);
    const cap = top * (player.boosting ? 1.3 : 1) * (player.draftT > 0.2 ? 1.04 : 1);
    const accel = st.acc * (1 - 0.55 * Math.min(1, player.speed / top));
    if (player.spin > 0) { player.spin -= dt; player.speed -= top * 0.7 * dt; }
    else if (ctl.brake) player.speed -= top * 1.1 * dt;
    else if (ctl.gas || player.boosting) player.speed += accel * dt * (player.boosting ? 2.2 : 1);
    else player.speed -= top * 0.2 * dt;
    if (player.speed > cap) player.speed = Math.max(cap, player.speed - top * 0.45 * dt);

    player.x = clamp(player.x, -2.4, 2.4);

      if (s.sp) for (const sp of s.sp) {
        const spr = spriteFor(th, sp.s, Math.sign(sp.o));
        if (!spr.cw) continue;
        const cx = sp.o * rw + (0.5 - spr.ax) * spr.ww * sp.k;

  function crash(side) {

  function aiStep(c, dt, i) {
    const L = track.len, segI = mod(Math.floor(c.dist / SEG), track.n);
    const ahead = track.segs[(segI + 40) % track.n].curve;
    let target = c.top * (1 - 0.03 * Math.abs(ahead));
    // Mild rubber band keeps the pack within reach without teleporting anyone.
    const gap = c.dist - player.dist;
    if (!player.finished && S.mode === 'champ') target *= gap > 2500 ? 0.965 : gap < -6000 ? 1.04 : 1;
    if (c.finished) target = c.top * 0.55;

    for (let j = -1; j < cars.length; j++) {
      const o = j < 0 ? player : cars[j];

      const rel = wrapRel(o.dist - c.dist);

  function trafficStep(c, dt) {

  // Contacts between the player and every other car: rear-end, side swipe, plus near-miss and drafting checks.
  function contacts() {
    const st = S.stats, rw = track.rw;

      const rel = wrapRel(c.dist - player.dist), dx = c.x - player.x, adx = Math.abs(dx);

          player.dist += rel - CAR_LEN;
          player.speed = c.speed * 0.88;
          if (!c.traffic) c.speed += diff * 0.3;

          player.speed *= 0.97;

  function nearMiss() {

    toast(S.mode === 'endless' ? t.nearMissT : t.nearMiss, 'gold');
    sfx('near');
  }

  function step(dt) {
    S.clock += dt;

      readControls(); playerStep(dt); advanceBackdrop(dt);
      return;
    }
    if (S.screen !== 'race' || S.paused) return;
    if (S.phase === 'countdown') {
      S.countdown -= dt;
      const n = Math.ceil(S.countdown);
      if (n < S.lastBeep && n >= 1 && n <= 3) { S.lastBeep = n; showBig(String(n)); sfx('beep'); }
      if (S.countdown <= 0) { S.phase = 'race'; showBig(t.go); sfx('go'); announce(t.go); }

    S.time += dt;

    if (S.phase === 'done') {

    }
    engineUpdate();
  }

  function lapStep() {
    const L = track.len;
    if (S.mode === 'trial' && !player.finished) recordGhost();
    const lap = Math.floor(Math.max(0, player.dist) / L) + 1;
    if (lap > player.lap && !player.finished) {
      const lt = S.time - player.lapStart;
      player.lastLap = lt;
      player.laps.push(lt);
      const isBest = !player.bestLap || lt < player.bestLap;
      if (isBest) player.bestLap = lt;
      if (S.mode === 'trial') lapGhost(lt);
      player.lapStart = S.time; player.lap = lap;
      if (lap > LAPS) { finishRace(); return; }
      const msg = lap === LAPS ? t.finalLap : t.lapBanner(lap, LAPS);
      toast(msg, lap === LAPS ? 'gold' : '');
      announce(msg);
      sfx('lap');
    }
    if (ghost.on) {
      const g = ghost.data, k = (S.time - player.lapStart) / 0.1, i = Math.floor(k);
      if (i < g.z.length - 1) { const f = k - i; ghost.dist = (player.lap - 1) * L + lerp(g.z[i], g.z[i + 1], f); ghost.x = lerp(g.x[i], g.x[i + 1], f) / 100; ghost.vis = true; }
      else ghost.vis = false;
    }
  }
  function recordGhost() {
    const lt = S.time - player.lapStart;
    while (rec.n < REC_MAX && rec.n * 0.1 <= lt) { rec.z[rec.n] = player.dist - (player.lap - 1) * track.len; rec.x[rec.n] = player.x; rec.n++; }
  }
  function lapGhost(lt) {
    const prev = save.tt[S.trackIdx];
    const best = prev && prev.lap;
    if (!best || lt < best) {
      S.lapRecord = true;
      const z = [], x = [];
      for (let i = 0; i < rec.n; i++) { z.push(Math.round(rec.z[i])); x.push(Math.round(rec.x[i] * 100)); }
      z.push(track.len); x.push(Math.round(player.x * 100));

      writeJSON(`ghost.${S.trackIdx}`, g);
      if (!ghost.on) { ghost.data = g; ghost.on = true; ghost.style = g.s; ghost.color = g.c; }
      save.tt[S.trackIdx] = { ...(prev || {}), lap: lt };
      persist();
    }
    rec.n = 0;
  }
  function finishRace() {
    player.finished = true;
    player.finishTime = S.time;
    S.phase = 'done'; S.endTimer = 0;
    player.boosting = false;
    showBig(t.finished);
    sfx('finish');
  }

  function endlessStep(dt) {
    S.distance = player.dist / SEG;
    if (S.phase === 'race') {
      S.timeLeft -= dt;
      const stage = Math.floor(player.dist / (STAGE * SEG));
      if (stage > S.stage) {
        S.stage = stage;
        const bonus = Math.max(18, 30 - stage * 1.5);
        S.timeLeft += bonus;
        S.speedMul = Math.min(1.45, 1 + stage * 0.045);
        toast(t.checkpoint(Math.round(bonus)), 'gold');
        announce(t.checkpoint(Math.round(bonus)));
        sfx('check');
        if (stage % 2 === 0 && cars.length < 16) { const c = makeTraffic(); cars.push(c); respawnTraffic(c, DRAW * SEG); }
      }
      if (S.timeLeft <= 0) {
        S.timeLeft = 0; S.phase = 'done'; S.endTimer = 0; player.boosting = false;
        showBig(t.timeUp); sfx('over'); announce(t.timeUp);
      }
    }
  }

  // Ranking: finished cars by finish time, the rest by distance covered.
  const order = [];
  function ranking() {
    order.length = 0;
    order.push(player);
    for (const c of cars) order.push(c);
    for (let i = 1; i < order.length; i++) {
      const a = order[i];
      let j = i - 1;
      while (j >= 0 && ahead(a, order[j])) { order[j + 1] = order[j]; j--; }
      order[j + 1] = a;
    }
    return order;
  }
  const ahead = (a, b) => (a.finished && b.finished ? a.finishTime < b.finishTime : a.finished !== b.finished ? a.finished : a.dist > b.dist);

  // ---------- View: camera height and focal length adapt to the frame's aspect ----------
  const $ = id => document.getElementById(id);
  const canvas = $('game'), ctx = canvas.getContext('2d');

  function cupFinal() {
    const cup = save.cup, i = cup.i, stand = standings(cup), place = stand.findIndex(r => r.you) + 1, mult = 1 + i * 0.5;
    const listA = $('res-list-a'); listA.textContent = ''; $('res-list-b').textContent = '';
    stand.forEach((e, k) => resultRow(listA, String(k + 1), e.color, e.name, '', t.pts(e.pts), e.you));
    let coins = 0, sub = t.cupFailHint, badge = '';
    if (place <= 3) {
      coins = Math.round(CUP_BONUS[place - 1] * mult);
      if (!save.trophies[i] || place < save.trophies[i]) save.trophies[i] = place;
      if (save.cups < i + 2 && i < 2) { save.cups = i + 2; badge = t.cupUnlocked(cupName(i + 1)); }
      sub = t.trophy(place);
    }
    save.cup = null;
    award(coins);
    const next = place <= 3 && i < 2;
    setResults({
      emoji: place <= 3 ? TROPHY[place] : '🏁', title: place <= 3 ? t.cupWin(cupName(i), place) : t.cupOver(place), sub, ha: t.standings, coins, badge,
      primary: next ? [t.nextCup, () => startCup(i + 1)] : [t.playAgain, () => startCup(i)],
    });
    if (place <= 3) sfx('finish');
  }
  function trialResults(listA) {
    const rec = save.tt[S.trackIdx] || {}, total = player.finishTime;
    const newTotal = !rec.total || total < rec.total;
    const newLap = S.lapRecord;
    if (newTotal) { rec.total = total; save.tt[S.trackIdx] = rec; }
    const coins = 30 + (newTotal ? 50 : 0);
    award(coins);
    const bestK = player.laps.indexOf(Math.min(...player.laps));
    player.laps.forEach((lt, k) => resultRow(listA, String(k + 1), k === bestK ? '#ffcc33' : '#c9ccdc', t.lapN(k + 1), '', fmtTime2(lt), k === bestK));
    setResults({
      emoji: newTotal || newLap ? '🏆' : '⏱️', title: t.trialDone, sub: t.tracks[S.trackIdx], ha: t.lapTimes, coins,
      stats: [`${t.time}: ${fmtTime2(total)}`, `${t.bestLap}: ${fmtTime2(player.bestLap)}`, `${t.record}: ${fmtTime2(rec.total)}`],
      badge: newTotal ? t.newRecord : newLap ? t.newLapRecord : '',
      primary: [t.retry, restartRace], secondary: [t.tracksBtn, () => { showMenu(); renderTracks(); openPanel(els.trial); }],
    });
  }
  function endlessResults() {
    const m = Math.floor(S.distance || 0), best = m > save.endless;
    if (best) save.endless = m;
    const coins = Math.floor(m / 25) + S.nearMisses * 3;
    award(coins);
    setResults({
      emoji: '🛣️', title: t.timeUp, sub: t.endless, coins, badge: best ? t.newRecord : '',
      stats: [`${t.distance}: ${fmtDist(m)}`, `${t.bestDistShort}: ${fmtDist(save.endless)}`, t.nearCount(S.nearMisses), t.checkpoints(S.stage)],
      primary: [t.playAgain, () => begin('endless', -1)],
    });
  }

  // ---------- Input ----------
  const keys = { left: false, right: false, gas: false, brake: false, nitro: false };
  const btn = { left: false, right: false, gas: false, brake: false, nitro: false };
  let zone = 0;
  const zonePtr = new Map();
  function releaseAll() {
    for (const k in keys) { keys[k] = false; btn[k] = false; }
    zonePtr.clear(); zone = 0;
    for (const b of document.querySelectorAll('.ctl.on')) b.classList.remove('on');
  }
  const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'gas', w: 'gas', W: 'gas', ArrowDown: 'brake', s: 'brake', S: 'brake', ' ': 'nitro', Shift: 'nitro' };
  const racing = () => S.screen === 'race' && !S.paused && !S.results;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return;
    unlockAudio();
    const k = KEYMAP[e.key];
    if (k && racing()) { keys[k] = true; e.preventDefault(); }
    if ((e.key === 'p' || e.key === 'P') && S.screen === 'race' && !S.results) { e.preventDefault(); S.paused ? resumeGame() : pauseGame(); }
  });
  document.addEventListener('keyup', e => {
    const k = KEYMAP[e.key];
    if (k) { keys[k] = false; if (racing()) e.preventDefault(); }
  });
  for (const b of document.querySelectorAll('.ctl')) {
    const k = b.dataset.k;
    const up = () => { btn[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); unlockAudio();
      btn[k] = true; b.classList.add('on');
      try { b.setPointerCapture(e.pointerId); } catch {}
    });
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
  function updateZone() { let z = 0; for (const x of zonePtr.values()) z += x < W / 2 ? -1 : 1; zone = clamp(z, -1, 1); }
  canvas.addEventListener('pointerdown', e => {
    unlockAudio();
    if (!racing()) return;
    zonePtr.set(e.pointerId, e.clientX);
    try { canvas.setPointerCapture(e.pointerId); } catch {}
    updateZone();
  });
  canvas.addEventListener('pointermove', e => { if (zonePtr.has(e.pointerId)) { zonePtr.set(e.pointerId, e.clientX); updateZone(); } });
  const endZone = e => { if (zonePtr.delete(e.pointerId)) updateZone(); };
  canvas.addEventListener('pointerup', endZone); canvas.addEventListener('pointercancel', endZone);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pauseGame(); if (audio.ctx) audio.ctx.suspend().catch(() => {}); }
    else if (!settings.muted && audio.ctx) audio.ctx.resume().catch(() => {});
    lastTime = performance.now();
  });

  for (const b of document.querySelectorAll('.t-sound')) b.addEventListener('click', () => setMuted(!settings.muted));
  for (const b of document.querySelectorAll('.t-auto')) b.addEventListener('click', () => { settings.auto = !settings.auto; persistSettings(); syncToggles(); });
  $('go-champ').addEventListener('click', () => { renderCups(); openPanel(els.cups, $('cup-list').querySelector('.card-btn.alt') || undefined); });
  $('go-trial').addEventListener('click', () => { renderTracks(); openPanel(els.trial); });
  $('go-endless').addEventListener('click', () => begin('endless', -1));
  $('go-garage').addEventListener('click', () => { renderGarage(); openPanel(els.garage); });
  $('cups-back').addEventListener('click', () => openPanel(els.menu, $('go-champ')));
  $('trial-back').addEventListener('click', () => { $('menu-coins').textContent = String(save.coins); openPanel(els.menu, $('go-trial')); });
  $('garage-back').addEventListener('click', () => { $('menu-coins').textContent = String(save.coins); openPanel(els.menu, $('go-garage')); });
  $('pause-btn').addEventListener('click', pauseGame);
  $('resume').addEventListener('click', resumeGame);
  $('restart').addEventListener('click', restartRace);
  $('quit').addEventListener('click', showMenu);
  $('res-primary').addEventListener('click', () => resAction.primary && resAction.primary());
  $('res-secondary').addEventListener('click', () => resAction.secondary && resAction.secondary());
  $('res-menu').addEventListener('click', showMenu);

  // ---------- Main loop: fixed 60 Hz simulation, render every frame ----------
  let lastTime = performance.now(), acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    if (document.hidden) return;
    if (!S.paused) {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 4) { step(STEP); acc -= STEP; n++; }
      if (n === 4) acc = 0;
    }
    render(S.paused ? 0 : dt);
    updateHud();
  }

  canvas.setAttribute('aria-label', t.canvas);
  buildSprites();
  makeBanners();
  addEventListener('resize', resize);
  resize();
  showMenu();
  requestAnimationFrame(frame);

  // Hook for automated tests: read state, let the built-in driver steer, or fast-forward the simulation.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__turboRacing = {
    state: () => ({
      screen: S.screen, mode: S.mode, phase: S.phase, paused: S.paused, results: !!S.results, track: S.trackIdx, lap: player.lap, laps: LAPS,
      pos: S.mode === 'endless' ? 0 : ranking().indexOf(player) + 1, field: cars.length + 1, kmh: Math.round(player.speed * KMH), x: +player.x.toFixed(3), dist: Math.round(player.dist),
      nitro: +player.nitro.toFixed(2), time: +S.time.toFixed(2), timeLeft: +S.timeLeft.toFixed(2), distance: Math.round(S.distance || 0), stage: S.stage, nearMisses: S.nearMisses,
      ghost: ghost.on && ghost.vis ? Math.round(ghost.dist - player.dist) : null, finished: player.finished, offroad: player.offroad, spin: player.spin > 0, coins: save.coins, cups: save.cups, cup: save.cup, bestLap: player.bestLap,
    }),
    autopilot: on => { S.auto = !!on; },
    sim: sec => { for (let i = 0, n = Math.round(sec * 60); i < n; i++) step(STEP); },
    save: () => JSON.parse(JSON.stringify(save)),
  };
})();
</script>
</body>
</html>
