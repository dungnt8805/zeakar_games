<!DOCTYPE html>

<title>Xiangqi</title>
<style>
:root {
  --bg: #2a0d0e;
  --bg-hi: #64201d;
  --text: #fbefe1;
  --muted: #d7b8a2;
  --accent: #f2c14e;
  --accent-dark: #b4840f;
  --panel: #fff6e6;
  --ink: #2c1d15;
  --ink-muted: #7b6252;
  --line: #ecd9bb;
  --wood: #efcf95;
  --wood-dark: #dcac62;
  --grid: #5e3418;
  --red: #c3261c;
  --blk: #1d2126;
  --good: #3fae74;
  --bad: #e2574c;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; opacity: .38; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Portrait: player cards above and below the board; the move feed takes whatever height is left. The board is 960 × 1120. */
.app { --bw: min(100vw - 16px, 620px, (100dvh - 214px) * .8571); position: fixed; inset: 0; width: 100%; max-width: max(calc(var(--bw) + 16px), min(100vw, 400px)); margin: 0 auto; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto calc(var(--bw) / .8571) auto minmax(34px, 1fr) auto; grid-template-areas: "top" "board" "bot" "feed" "actions"; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.card { min-width: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 12px; background: #ffffff0f; box-shadow: inset 0 0 0 1px #ffffff1c; transition: background .2s, box-shadow .2s; }
.card.on { background: #f2c14e24; box-shadow: inset 0 0 0 2px var(--accent); }
#card-top { grid-area: top; }
#card-bot { grid-area: bot; }
.av { flex: 0 0 auto; width: 34px; height: 34px; display: grid; place-items: center; }
.av svg { width: 34px; height: 34px; }
.who { flex: 1; min-width: 0; }
.nm { display: block; font-size: 14px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { display: flex; align-items: center; min-height: 16px; font-size: 12px; font-weight: 800; color: var(--muted); line-height: 1.2; white-space: nowrap; overflow: hidden; }
.sub svg { flex: 0 0 auto; width: 16px; height: 16px; margin-right: -3px; }

.sub .txt { overflow: hidden; text-overflow: ellipsis; }
.tag { flex: 0 0 auto; padding: 3px 8px; border-radius: 99px; background: #00000040; font-size: 12px; font-weight: 900; color: var(--muted); white-space: nowrap; }
.tag.alert { background: var(--bad); color: #fff; }

.stage { grid-area: board; position: relative; min-width: 0; min-height: 0; container-type: size; display: grid; place-items: center; }
.board { --s: min(100cqw, 100cqh * .8571); position: relative; width: var(--s); height: calc(var(--s) / .8571); border-radius: calc(var(--s) * .028); background: linear-gradient(150deg, #f6dca8, var(--wood) 45%, var(--wood-dark)); box-shadow: 0 0 0 calc(var(--s) * .014) #7a3c1c, 0 0 0 calc(var(--s) * .02) #4a200d, 0 14px 34px #0009; }
.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.grid, .pieces, .arrows { position: absolute; left: 3.125%; top: 5.357%; width: 93.75%; height: 89.286%; }
.grid { display: grid; grid-template: repeat(10, 1fr) / repeat(9, 1fr); touch-action: none; }
.sq { position: relative; border-radius: 50%; cursor: pointer; }
.sq::before, .sq::after { content: ""; position: absolute; pointer-events: none; }
.sq.last::before { inset: 2%; --mk: #2f74c8; background: linear-gradient(var(--mk) 0 0) 0 0 / 26% 6% no-repeat, linear-gradient(var(--mk) 0 0) 0 0 / 6% 26% no-repeat, linear-gradient(var(--mk) 0 0) 100% 0 / 26% 6% no-repeat, linear-gradient(var(--mk) 0 0) 100% 0 / 6% 26% no-repeat, linear-gradient(var(--mk) 0 0) 0 100% / 26% 6% no-repeat, linear-gradient(var(--mk) 0 0) 0 100% / 6% 26% no-repeat, linear-gradient(var(--mk) 0 0) 100% 100% / 26% 6% no-repeat, linear-gradient(var(--mk) 0 0) 100% 100% / 6% 26% no-repeat; }
.sq.hint::before { inset: 4%; border-radius: 50%; background: #3fbf7f59; box-shadow: 0 0 0 calc(var(--s) * .006) #1f8a52; }
.sq.dot::after { left: 36%; top: 36%; width: 28%; height: 28%; border-radius: 50%; background: #1f8a52d0; box-shadow: 0 0 0 calc(var(--s) * .004) #fff9; }
.sq.cap::after { inset: 1%; border-radius: 50%; box-shadow: 0 0 0 calc(var(--s) * .007) #e2574c, inset 0 0 0 calc(var(--s) * .004) #fff8; }
.sq.over::after { inset: 2%; border-radius: 50%; box-shadow: 0 0 0 calc(var(--s) * .007) #fff; }
.sq:focus-visible { outline: none; box-shadow: 0 0 0 calc(var(--s) * .007) var(--accent), inset 0 0 0 calc(var(--s) * .004) #fff; z-index: 2; }
.pieces { pointer-events: none; }
.pc { position: absolute; left: 0; top: 0; width: 11.111%; height: 10%; padding: .5%; transform: translate(calc(var(--x) * 100%), calc(var(--y) * 100%)); transition: transform .22s ease-out, opacity .2s; }
.pc svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 calc(var(--s) * .004) calc(var(--s) * .004) #0007); transition: transform .15s; }
.pc.sel svg { transform: scale(1.1) translateY(-3%); filter: drop-shadow(0 0 calc(var(--s) * .008) var(--accent)) drop-shadow(0 calc(var(--s) * .012) calc(var(--s) * .01) #0007); }
.pc.check svg { filter: drop-shadow(0 0 calc(var(--s) * .012) #ff2a1a) drop-shadow(0 0 calc(var(--s) * .006) #ff2a1a); }
.pc.drag { z-index: 6; transition: none; }
.pc.drag svg { transform: scale(1.16); filter: drop-shadow(0 calc(var(--s) * .016) calc(var(--s) * .012) #0007); }
.pc.gone { opacity: 0; }
.instant .pc { transition: none; }
.arrows { pointer-events: none; z-index: 4; }
.glyph { font-family: var(--cjk); font-size: 52px; font-weight: 700; }
.river { font-family: var(--cjk); font-weight: 700; letter-spacing: .1em; }
.files { font-family: var(--font); }
.toast { position: absolute; left: 50%; top: 8px; z-index: 9; transform: translate(-50%, -6px); max-width: calc(100% - 16px); width: max-content; padding: 7px 14px; border-radius: 99px; background: #1c0f0ce8; color: #fff; font-size: 14px; font-weight: 800; text-align: center; line-height: 1.3; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; box-shadow: 0 6px 20px #0008; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: #1f7a4cf0; }
.toast.bad { background: #b23a2ff0; }

.feed { grid-area: feed; min-height: 0; display: flex; flex-direction: column; gap: 3px; }
.status { flex: 0 0 auto; font-size: 14px; font-weight: 800; line-height: 1.3; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.alert { color: #ff9a8b; }
.status.good { color: #8be3b0; }
.moves { flex: 1 1 auto; min-height: 0; overflow-y: auto; list-style: none; padding: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 10px; font-size: 13px; font-weight: 700; color: var(--muted); scrollbar-width: thin; scrollbar-color: #ffffff33 transparent; }
.moves li { display: flex; gap: 4px; white-space: nowrap; }
.moves .n { color: #ffffff70; font-variant-numeric: tabular-nums; }
.moves .m { padding: 0 3px; border-radius: 5px; }
.moves .m.r { color: #ffb4a8; }
.moves .m.b { color: var(--text); }
.moves .m.cur { background: var(--accent); color: #2a1a02; }
.moves .empty { color: #ffffff66; }

.actions { grid-area: actions; display: grid; grid-template-columns: repeat(auto-fit, minmax(38px, 1fr)); gap: 5px; }
.act { min-width: 0; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 11px; background: #ffffff14; box-shadow: inset 0 0 0 1px #ffffff1f; }
.act:active:not(:disabled) { transform: translateY(1px); background: #ffffff24; }
.act svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.act .lb { display: none; max-width: 100%; padding: 0 3px; font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Wide screens: the board fills the height on the left; players, moves and buttons sit in a column on the right. */
@media (min-aspect-ratio: 5/4) {
  .app { --side: clamp(214px, calc(100vw - 100dvh * .8571 - 24px), 400px); max-width: none; width: min(100%, calc(100dvh * .8571 + var(--side) + 20px)); grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "board top" "board feed" "board bot" "board actions"; column-gap: 14px; }
  .stage { justify-items: end; padding: 1.2% 1.4%; }
  .card { height: 52px; }
  .av, .av svg { width: 40px; height: 40px; }
  .feed { padding: 8px 10px; border-radius: 12px; background: #00000038; box-shadow: inset 0 0 0 1px #ffffff14; gap: 6px; }
  .status { font-size: 15px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .moves { display: grid; grid-template-columns: 2.4em 1fr 1fr; gap: 2px 4px; align-content: start; font-size: 14px; }
  .moves li { display: contents; }
  .moves .m { padding: 1px 5px; }
  .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .act { height: 50px; }
  .act .lb { display: block; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 560px) {
  .actions { grid-template-columns: repeat(auto-fit, minmax(32px, 1fr)); }
  .act { height: 36px; }
  .act .lb { display: none; }
  .card { height: 44px; }
  .av, .av svg { width: 32px; height: 32px; }
  .feed { padding: 5px 8px; }
  .status { font-size: 14px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 360px) {
  .app { gap: 5px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .card { height: 40px; }
  .av, .av svg { width: 28px; height: 28px; }
  .act { height: 32px; }
  .moves { font-size: 13px; }
}
/* Short portrait frames: slimmer cards and buttons so the board keeps as much height as possible. */
@media (max-aspect-ratio: 5/4) and (max-height: 600px) {
  .app { --bw: min(100vw - 16px, 620px, (100dvh - 176px) * .8571); gap: 5px; grid-template-rows: auto calc(var(--bw) / .8571) auto minmax(22px, 1fr) auto; }
  .card { height: 38px; padding: 3px 8px; }
  .av, .av svg { width: 30px; height: 30px; }
  .act { height: 36px; }
  .feed { flex-direction: row; align-items: center; gap: 10px; }
  .status { flex: 0 1 auto; min-width: 0; }
  .moves { flex: 1 1 0; min-width: 50px; flex-wrap: nowrap; overflow: auto hidden; align-content: center; scrollbar-width: none; }
}
@media (max-width: 360px) {
  .row2 { grid-template-columns: 1fr; gap: 6px; }
  .card { gap: 6px; padding: 4px 6px; }
  .act { height: 38px; }
}

.ov { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #1a0707cc; }
.ov.light { background: #1a070766; }
.panel { width: min(100%, 390px); max-height: calc(100dvh - 16px); overflow-y: auto; overscroll-behavior: contain; padding: 18px 16px; border-radius: 22px; background: var(--panel); color: var(--ink); text-align: center; box-shadow: 0 7px 0 #dcc6a0, 0 24px 60px #000b; animation: rise .28s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 25px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
.logo { display: flex; align-items: center; justify-content: center; gap: 10px; }
.logo svg { width: 50px; height: 50px; }
.logo h1 { font-size: 38px; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.logo small { display: block; font-family: var(--cjk); font-size: 17px; font-weight: 700; letter-spacing: .2em; color: var(--red); text-align: left; }
.tagline { margin-top: 8px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--ink-muted); }
.modes { margin-top: 14px; display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 1px 10px; padding: 9px 12px; border-radius: 16px; background: #fff; text-align: left; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px var(--line); }
.mode.hot { box-shadow: 0 3px 0 var(--accent-dark), inset 0 0 0 2px var(--accent); }
.mode .ic { grid-row: span 2; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--c, #f3e4c8); }
.mode .ic svg { width: 36px; height: 36px; }
.mode strong { font-size: 16px; font-weight: 900; line-height: 1.2; }
.mode small { font-size: 12px; font-weight: 700; color: var(--ink-muted); line-height: 1.3; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.row2 .toggle { margin-top: 0; }
.small { margin-top: 10px; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--ink-muted); }
.field { margin-top: 14px; text-align: left; }
.label { margin-bottom: 6px; font-size: 12px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #f1e2c6; }
.seg button { flex: 1; min-width: 0; min-height: 36px; padding: 7px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--ink-muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #dcc6a0; }
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.lv { position: relative; height: 46px; border-radius: 12px; background: #fff; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); display: grid; place-content: center; gap: 1px; }
.lv strong { font-size: 18px; font-weight: 900; line-height: 1; }
.lv small { min-height: 12px; font-size: 11px; font-weight: 900; line-height: 1; color: var(--good); }
.lv small.star { color: #d58a0a; }
.lv[aria-checked="true"] { background: var(--accent); box-shadow: 0 3px 0 var(--accent-dark); }
.lv[aria-checked="true"] small { color: #2a1a02; }
.lvinfo { margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 15px; font-weight: 900; }
.lvinfo span { color: var(--ink-muted); font-size: 13px; }
.cta { display: block; width: 100%; margin-top: 16px; padding: 13px; border-radius: 16px; background: var(--red); color: #fff; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 #861710; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #861710; }
.ghost { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 14px; background: #f1e2c6; color: var(--ink); font-size: 15px; font-weight: 800; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 10px; padding: 9px 12px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); text-align: left; font-size: 14px; font-weight: 800; line-height: 1.25; }
.sw { flex: 0 0 auto; width: 42px; height: 24px; border-radius: 99px; background: #d9cbb0; position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .2s; }
.toggle[aria-checked="true"] .sw { background: var(--good); }
.toggle[aria-checked="true"] .sw::after { transform: translateX(18px); }
.pz-group { margin-top: 14px; text-align: left; }
.pz-group h3 { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 900; }
.pz-group h3 span { font-size: 12px; color: var(--ink-muted); }
.pz-grid { margin-top: 6px; display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.pz { position: relative; height: 40px; border-radius: 11px; background: #fff; box-shadow: 0 3px 0 var(--line), inset 0 0 0 1px var(--line); font-size: 15px; font-weight: 900; }
.pz.bk { background: #3a3f46; color: #fff; box-shadow: 0 3px 0 #1d2126; }
.pz.done { background: #d9f2e2; box-shadow: 0 3px 0 #a9d8bb, inset 0 0 0 1px #a9d8bb; color: #17633b; }
.pz.done::after { content: "✓"; position: absolute; right: 4px; top: 2px; font-size: 10px; }
.panel.rulesp { width: min(100%, 520px); }
@media (min-width: 820px) and (min-aspect-ratio: 5/4) { .panel.rulesp { width: min(100%, 860px); } .panel.rulesp .rules { columns: 2; column-gap: 28px; } .panel.rulesp .rules li { break-inside: avoid; } }
.rules { margin-top: 10px; padding-left: 20px; text-align: left; font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--ink); }
.rules li + li { margin-top: 6px; }
.rules b { color: var(--red); }
.big { font-size: 46px; line-height: 1.1; }
.reason { margin-top: 6px; font-size: 15px; font-weight: 700; line-height: 1.4; color: var(--ink-muted); }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: var(--accent); color: #3c2800; font-size: 14px; font-weight: 900; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 520px) {
  .panel { padding: 12px 14px; border-radius: 18px; }
  .logo h1 { font-size: 30px; }
  .logo svg { width: 38px; height: 38px; }
  .tagline { display: none; }
  .modes { margin-top: 10px; gap: 6px; }
  .mode { padding: 6px 10px; }
  .field { margin-top: 10px; }
  .cta { margin-top: 12px; padding: 10px; font-size: 17px; }

  .rules { font-size: 13px; }

@media (max-height: 520px) and (min-width: 540px) {
  .panel.wide { width: min(100%, 660px); }
  .panel.wide .modes { grid-template-columns: 1fr 1fr; }
  .panel.split { width: min(100%, 700px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; align-items: start; }
  .panel.split > h2 { grid-column: 1 / -1; }
  .panel.split .col1 { grid-column: 1; grid-row: 2 / span 4; }
  .panel.split > :not(h2):not(.col1) { grid-column: 2; }
  .panel.rulesp { width: min(100%, 720px); }
  .panel.rulesp .rules { columns: 2; column-gap: 28px; }
  .panel.rulesp .rules li { break-inside: avoid; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

  const overlays = { menu: $('ov-menu'), cpu: $('ov-cpu'), pvp: $('ov-pvp'), puzzles: $('ov-puzzles'), rules: $('ov-rules'), result: $('ov-result'), confirm: $('ov-confirm') };

  const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
  const write = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };
  const forget = key => { try { localStorage.removeItem(key); } catch {} };

  const settings = { level: 3, color: 'r', autoFlip: false, sound: true, western: false, lastPuzzle: 0, ...read(STORE.settings, {}) };
  settings.level = Math.min(8, Math.max(1, settings.level | 0 || 3));
  const beaten = read(STORE.levels, {}) || {};
  const solved = new Set(read(STORE.puzzles, []));
  const saveSettings = () => write(STORE.settings, settings);

  // ---- Piece artwork: wooden discs with the traditional characters, or simple icons ----------
  const CHARS = [['', '帥', '仕', '相', '傌', '俥', '炮', '兵'], ['', '將', '士', '象', '馬', '車', '砲', '卒']];
  const LIGHT = '#f6e3b8';
  const ICONS = [null,
    `<path d="M29 66 26 38l12 11 12-17 12 17 12-11-3 28z"/><rect x="29" y="69" width="42" height="7" rx="2"/>`,
    `<path d="M50 25 71 33v15c0 13-9 21-21 27-12-6-21-14-21-27V33z"/><path d="M50 35v30M38 47h24" stroke="${LIGHT}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
    `<circle cx="50" cy="24" r="4.5"/><path d="M50 27c9 8 15 16 15 26 0 8-6 13-15 13s-15-5-15-13c0-10 6-18 15-26z"/><path d="M55 39 46 51" stroke="${LIGHT}" stroke-width="4" stroke-linecap="round"/><rect x="33" y="68" width="34" height="8" rx="3"/>`,
    `<path d="M36 76c-2-10 1-17 9-23-6 2-11 3-15 1-3-2-3-6-1-9 5-7 10-12 15-16l2-6 5 5c11 3 19 15 19 29 0 9-2 15-4 19z"/><circle cx="45" cy="38" r="3" fill="${LIGHT}"/>`,
    `<path d="M31 27h8v6h7v-6h8v6h7v-6h8v15l-6 5v18l5 7H32l5-7V47l-6-5z"/>`,
    `<path d="M26 60 64 36a6 6 0 0 1 8 2l1 2a6 6 0 0 1-2 8L33 71z"/><circle cx="38" cy="66" r="11"/><circle cx="38" cy="66" r="4" fill="${LIGHT}"/>`,
    `<circle cx="50" cy="34" r="9"/><path d="M39 70c0-11 5-19 11-24 6 5 11 13 11 24z"/><rect x="33" y="68" width="34" height="8" rx="3"/>`,
  ];
  const svgCache = new Map();
  function pieceSVG(pc, western = settings.western) {
    const key = `${pc}${western ? 'w' : 'c'}`;
    if (svgCache.has(key)) return svgCache.get(key);
    const side = pc & 16 ? BLACK : RED, type = pc & 7, ink = side ? '#1d2126' : '#c3261c';
    const face = western ? `<g fill="${ink}">${ICONS[type]}</g>` : `<text class="glyph" x="50" y="52" text-anchor="middle" dominant-baseline="central" fill="${ink}">${CHARS[side][type]}</text>`;
    const svg = `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="54" r="45" fill="#8c5524"/><circle cx="50" cy="50" r="45" fill="url(#disc)"/><circle cx="50" cy="50" r="38" fill="none" stroke="${ink}" stroke-width="3"/>${face}</svg>`;
    svgCache.set(key, svg);
    return svg;
  }

  // ---- Move notation (WXF letters, Vietnamese, or Chinese characters) ------------------------
  const NOTATION = {
    wxf: { names: ['', 'K', 'A', 'E', 'H', 'R', 'C', 'P'], ops: ['+', '-', '='], tags: ['+', '-', '.'] },
    vi: { names: ['', 'Tg', 'S', 'T', 'M', 'X', 'P', 'B'], ops: ['.', '/', '-'], tags: ['t', 's', 'g'] },
    zh: { names: [['', '帅', '仕', '相', '马', '车', '炮', '兵'], ['', '将', '士', '象', '马', '车', '炮', '卒']], ops: ['进', '退', '平'], tags: ['前', '后', '中'], cjk: true },
    ja: { names: [['', '帥', '仕', '相', '傌', '俥', '炮', '兵'], ['', '將', '士', '象', '馬', '車', '砲', '卒']], ops: ['進', '退', '平'], tags: ['前', '後', '中'], cjk: true },
  };
  const NOTE = NOTATION[{ vi: 'vi', zh: 'zh', ja: 'ja' }[lang] || 'wxf'];
  const RED_NUM = '一二三四五六七八九', BLACK_NUM = '１２３４５６７８９';

  // Files are counted from each player's own right; "forward" is towards the opponent.
  function notate(p, m) {
    const f = Engine.from(m), to = Engine.to(m), pc = p.b[f], side = pc & 16 ? BLACK : RED, type = pc & 7;
    const num = n => NOTE.cjk ? (side === RED ? RED_NUM : BLACK_NUM)[n - 1] : String(n);
    const file = c => side === RED ? 9 - c : c + 1;
    const name = NOTE.cjk ? NOTE.names[side][type] : NOTE.names[type];
    let head = name + num(file(COL[f]));
    if (type >= HORSE) {
      const rows = [];
      for (let r = 0; r < 10; r++) if (p.b[r * 9 + COL[f]] === pc) rows.push(r);
      if (rows.length > 1) {
        const order = side === RED ? rows : rows.reverse(), i = order.indexOf(ROW[f]);
        const tag = rows.length === 2 ? NOTE.tags[i] : rows.length === 3 ? NOTE.tags[[0, 2, 1][i]] : num(i + 1);
        head = NOTE.cjk ? tag + name : name + tag;
      }
    }
    const ahead = side === RED ? ROW[f] - ROW[to] : ROW[to] - ROW[f];
    if (!ahead) return head + NOTE.ops[2] + num(file(COL[to]));
    const diagonal = type === HORSE || type === ELEPHANT || type === ADVISOR;
    return head + NOTE.ops[ahead > 0 ? 0 : 1] + num(diagonal ? file(COL[to]) : Math.abs(ahead));
  }

  // ---- Game state ---------------------------------------------------------------------------
  let game = null, squares = [], pieceEls = new Map(), cursor = 0, drag = null, suppressClick = false, movesShown = -1, toastTimer = 0;
  const colorName = side => side === RED ? t.red : t.black;
  const sqName = sq => Engine.sqName(sq);
  const overlayOpen = () => Object.values(overlays).some(el => !el.hidden);
  const isCpuTurn = () => !!game && !game.over && game.mode === 'cpu' && game.pos.side !== game.human;
  const canAct = () => !!game && !game.over && !game.busy && !overlayOpen() && (game.mode === 'pvp' || game.pos.side === game.human);

  function countPieces(pos) {
    const n = [new Array(8).fill(0), new Array(8).fill(0)];
    for (let sq = 0; sq < 90; sq++) { const pc = pos.b[sq]; if (pc) n[pc & 16 ? 1 : 0][pc & 7]++; }
    return n;
  }

  function createGame(mode, opts = {}) {
    const fen = opts.fen || START_FEN;
    const pos = Engine.fromFEN(fen);
    const g = {
      mode, pos, startFen: fen, firstSide: pos.side, moves: [], legal: [], sel: -1, last: null, hint: null, hintLevel: 0, human: opts.human ?? RED, level: opts.level || 1,
      flipped: false, over: false, winner: -1, reason: '', thinking: false, busy: false, helped: false, token: 0, timer: 0,
      puzzle: opts.puzzle || null, base: countPieces(pos), autoFlip: !!opts.autoFlip, live: false,
    };
    g.flipped = mode !== 'pvp' && g.human === BLACK;
    return g;
  }

  function stopGame() {
    if (!game) return;
    game.token++;
    game.thinking = false;
    clearTimeout(game.timer);
    cancelSearch();
    els.hint.classList.remove('busy');
  }

  function begin(g) {
    stopGame();
    game = g;
    movesShown = -1;
    closeOverlays();
    layoutBoard();
    rebuildPieces();
    clearArrows();
    nextTurn();
  }

  function startCpu() {
    const human = settings.color === 'x' ? (Math.random() < .5 ? RED : BLACK) : settings.color === 'b' ? BLACK : RED;
    Engine.clearMemory();
    begin(createGame('cpu', { human, level: settings.level }));
    game.live = true;
    save();
  }

  function startPvp() {
    begin(createGame('pvp', { autoFlip: settings.autoFlip }));
    game.live = true;
    save();
  }

  function startPuzzle(i) {
    const [group, fen, line] = PUZZLES[i];
    const g = createGame('puzzle', { fen, puzzle: { i, group, line: line.split(' '), step: 0 } });
    g.human = g.pos.side;
    g.flipped = g.human === BLACK;
    g.live = true;
    settings.lastPuzzle = i;
    saveSettings();
    begin(g);
    toast(goalText(g));
  }

  const goalText = g => t.goal(colorName(g.human), (g.puzzle.line.length + 1) >> 1);

  function nextTurn() {
    const g = game;
    g.legal = g.over ? [] : Engine.legalMoves(g.pos);
    g.sel = -1;
    g.hint = null;
    g.hintLevel = 0;
    clearArrows();
    if (g.mode === 'pvp' && g.autoFlip && g.flipped !== (g.pos.side === BLACK)) setFlipped(g.pos.side === BLACK);
    ensurePieces();
    render();
    if (isCpuTurn() && !overlayOpen()) cpuMove();
  }

  // ---- Moves ------------------------------------------------------------------------------
  // Shows a move on the board and plays it on the engine position; returns the game result if it ended the game.
  function applyMove(m, dragged = false) {
    const g = game, p = g.pos;
    const note = notate(p, m);
    const f = Engine.from(m), to = Engine.to(m), side = p.side, moved = p.b[f], captured = p.b[to];
    animateMove(m, dragged);
    Engine.makeMove(p, m);
    Engine.markCheck(p);
    g.moves.push({ m, note, iccs: Engine.iccs(m) });
    g.last = [f, to];
    g.sel = -1;
    g.hint = null;
    clearArrows();
    els.hint.classList.remove('busy');
    const check = Engine.inCheck(p), outcome = Engine.outcome(p);
    play(check ? 'check' : captured ? 'capture' : 'move');
    let said = t.said(colorName(side), t.pn[moved & 7], note);
    if (captured) said += `, ${t.takes(t.pn[captured & 7])}`;
    if (check) said += `, ${outcome?.reason === 'mate' ? t.mateWord : t.checkWord}`;
    announce(said);
    return outcome;
  }

  function playMove(m, dragged) {
    const outcome = applyMove(m, dragged);
    if (outcome) return endGame(outcome.winner, outcome.reason);
    save();
    nextTurn();
  }

  function cpuMove() {
    const g = game, token = g.token, started = performance.now();
    const cfg = Engine.LEVELS[g.level - 1];
    g.thinking = true;
    render();
    const finish = m => {
      const wait = Math.max(0, (reducedMotion.matches ? 150 : 450) - (performance.now() - started));
      g.timer = setTimeout(() => {
        if (game !== g || g.token !== token || g.over) return;
        g.thinking = false;
        playMove(m);
      }, wait);
    };
    if (cfg.book && g.startFen === START_FEN && Math.random() < cfg.book) {
      const u = Engine.bookMove(g.moves.map(x => x.iccs), Math.random);
      const m = u && g.legal.find(x => Engine.iccs(x) === u);
      if (m) return finish(m);
    }
    runSearch(g.pos, { depth: cfg.depth, time: cfg.time, margin: cfg.margin }, result => {
      if (game !== g || g.token !== token || g.over) return;
      finish(Engine.pickMove(result, g.level, g.legal, Math.random));
    });
  }

  // The engine search is a generator; it runs in ~10 ms slices posted through a MessageChannel so the page never freezes.
  const channel = new MessageChannel();
  let pending = null, searchId = 0;
  channel.port1.onmessage = () => { const step = pending; pending = null; if (step) step(); };
  function runSearch(pos, opts, done) {
    const id = ++searchId, it = Engine.think(pos, opts);
    const step = () => {
      if (id !== searchId) return;
      Engine.setSlice(10);
      const r = it.next();
      if (r.done) done(r.value);
      else { pending = step; channel.port2.postMessage(0); }
    };
    pending = step;
    channel.port2.postMessage(0);
  }
  function cancelSearch() { searchId++; pending = null; }

  function tryMove(from, to, dragged) {
    if (!canAct()) return false;
    const m = game.legal.find(x => Engine.from(x) === from && Engine.to(x) === to);
    if (!m) return false;
    if (game.mode === 'puzzle') puzzleMove(m, dragged);
    else playMove(m, dragged);
    return true;
  }

  function endGame(winner, reason) {
    const g = game;
    stopGame();
    g.over = true;
    g.winner = winner;
    g.reason = reason;
    g.legal = [];
    forget(STORE.game);
    let title, emoji, badge = '';
    if (g.mode === 'cpu') {
      if (winner === g.human) {
        title = t.youWin; emoji = '🏆';
        const grade = g.helped ? 1 : 2;
        if (grade > (beaten[g.level] || 0)) { beaten[g.level] = grade; write(STORE.levels, beaten); }
        badge = grade === 2 ? t.beatClean(g.level) : t.beatLevel(g.level);
        play('win');
      } else if (winner < 0) { title = t.draw; emoji = '🤝'; play('draw'); }
      else { title = t.youLose; emoji = '🤖'; play('lose'); }
    } else {
      title = winner < 0 ? t.draw : t.wins(colorName(winner));
      emoji = winner < 0 ? '🤝' : '👑';
      play(winner < 0 ? 'draw' : 'win');
    }
    const why = reasonText(reason, winner);
    g.title = title;
    render();
    announce(`${title} ${why}`);
    els.resultEmoji.textContent = emoji;
    els.resultTitle.textContent = title;
    els.resultReason.textContent = why;
    els.resultBadge.textContent = badge;
    els.resultBadge.hidden = !badge;
    els.resultMain.textContent = t.again;
    els.resultReview.textContent = t.review;
    g.timer = setTimeout(() => { if (game === g) show('result'); }, reducedMotion.matches ? 400 : 1100);
  }

  function reasonText(reason, winner) {
    const loser = winner >= 0 ? colorName(winner ^ 1) : '';
    return { mate: t.rMate, stalemate: t.rStale, repetition: t.rRep, perpetual: t.rPerp(loser), limit: t.rLimit, material: t.rMaterial, resign: t.rResign(loser) }[reason] || '';
  }

  function canUndo() {
    const g = game;
    if (!g || g.over || g.busy || g.mode === 'puzzle' || g.mode === 'idle' || !g.moves.length) return false;
    return g.mode !== 'cpu' || g.moves.some((x, i) => ((g.firstSide + i) & 1) === g.human);
  }

  function undo() {
    if (!canUndo() || overlayOpen()) return;
    const g = game;
    stopGame();
    do { Engine.unmakeMove(g.pos); g.moves.pop(); } while (g.mode === 'cpu' && g.moves.length && g.pos.side !== g.human);
    const prev = g.moves[g.moves.length - 1];
    g.last = prev ? [Engine.from(prev.m), Engine.to(prev.m)] : null;
    g.helped = true;
    rebuildPieces();
    save();
    nextTurn();
    announce(t.undone);
  }

  function hint() {
    const g = game;
    if (!g || g.over) return;
    if (g.mode === 'puzzle') return puzzleHint();
    if (!canAct() || els.hint.classList.contains('busy')) return;
    g.helped = true;
    const token = g.token, ply = g.moves.length;
    els.hint.classList.add('busy');
    runSearch(g.pos, { depth: 14, time: 900 }, result => {
      els.hint.classList.remove('busy');
      if (game !== g || g.token !== token || g.moves.length !== ply || g.over) return;
      showHint(result.move, 2);
    });
  }

  function showHint(m, level) {
    const g = game, f = Engine.from(m), to = Engine.to(m);
    g.hint = level > 1 ? [f, to] : [f];
    if (level > 1) drawArrow(f, to);
    render();
    announce(level > 1 ? t.hintSaid(sqName(f), sqName(to)) : `${t.hint}: ${sqName(f)}`);
  }

  function resign() {
    const g = game;
    if (!g || g.over || g.mode === 'puzzle' || g.mode === 'idle' || overlayOpen()) return;
    const side = g.mode === 'cpu' ? g.human : g.pos.side;
    confirmBox(t.resignQ, '', t.resignYes, t.keepPlaying, () => endGame(side ^ 1, 'resign'));
  }

  // ---- Puzzles ----------------------------------------------------------------------------
  function puzzleMove(m, dragged) {
    const g = game, pz = g.puzzle;
    const expected = pz.line[pz.step];
    const outcome = applyMove(m, dragged);
    const mate = !!outcome && outcome.winner === g.human && (outcome.reason === 'mate' || outcome.reason === 'stalemate');
    g.legal = [];
    if (Engine.iccs(m) !== expected && !mate) {
      g.busy = true;
      render();
      play('error');
      toast(t.wrong, 'bad');
      announce(t.wrong);
      g.timer = setTimeout(() => {
        if (game !== g) return;
        g.busy = false;
        Engine.unmakeMove(g.pos);
        g.moves.pop();
        const prev = g.moves[g.moves.length - 1];
        g.last = prev ? [Engine.from(prev.m), Engine.to(prev.m)] : null;
        rebuildPieces();
        nextTurn();
      }, reducedMotion.matches ? 500 : 900);
      return;
    }
    pz.step++;
    if (mate || pz.step >= pz.line.length) return puzzleSolved();
    g.busy = true;
    render();
    toast(t.good, 'good');
    g.timer = setTimeout(() => {
      if (game !== g) return;
      g.busy = false;
      g.legal = Engine.legalMoves(g.pos);
      applyMove(Engine.moveFromIccs(g.pos, pz.line[pz.step]));
      pz.step++;
      nextTurn();
    }, reducedMotion.matches ? 300 : 650);
  }

  function puzzleHint() {
    const g = game, pz = g.puzzle;
    if (!canAct()) return;
    g.hintLevel = Math.min(2, g.hintLevel + 1);
    showHint(Engine.moveFromIccs(g.pos, pz.line[pz.step]), g.hintLevel);
  }

  function puzzleSolved() {
    const g = game, i = g.puzzle.i;
    g.over = true;
    g.winner = g.human;
    g.reason = 'mate';
    g.legal = [];
    solved.add(i);
    write(STORE.puzzles, [...solved]);
    play('win');
    g.title = t.solved;
    render();
    announce(`${t.solved} ${t.pzProgress(solved.size, PUZZLES.length)}`);
    els.resultEmoji.textContent = solved.size === PUZZLES.length ? '🏆' : '🎯';
    els.resultTitle.textContent = t.solved;
    els.resultReason.textContent = `${t.solvedText} ${t.pzProgress(solved.size, PUZZLES.length)}`;
    els.resultBadge.hidden = true;
    els.resultMain.textContent = t.nextPuzzle;
    els.resultReview.textContent = t.allPuzzles;
    g.timer = setTimeout(() => { if (game === g) show('result'); }, reducedMotion.matches ? 300 : 800);
  }

  function nextPuzzleIndex(from) {
    for (let k = 1; k <= PUZZLES.length; k++) { const i = (from + k) % PUZZLES.length; if (!solved.has(i)) return i; }
    return (from + 1) % PUZZLES.length;
  }

  // ---- Saving -----------------------------------------------------------------------------
  function save() {
    const g = game;
    if (!g || g.over || (g.mode !== 'cpu' && g.mode !== 'pvp')) return;
    write(STORE.game, { v: 1, mode: g.mode, level: g.level, human: g.human, fen: g.startFen, moves: g.moves.map(x => x.iccs), flipped: g.flipped, helped: g.helped, autoFlip: g.autoFlip });
  }

  function savedGame() {
    const s = read(STORE.game, null);
    return s && s.v === 1 && (s.mode === 'cpu' || s.mode === 'pvp') && Array.isArray(s.moves) ? s : null;
  }

  function restore(s) {
    let g;
    try { g = createGame(s.mode, { fen: s.fen, human: s.human === BLACK ? BLACK : RED, level: Math.min(8, Math.max(1, s.level | 0 || 1)), autoFlip: s.autoFlip }); }
    catch { g = createGame(s.mode, { human: RED, level: 1 }); }
    for (const u of s.moves) {
      const m = Engine.moveFromIccs(g.pos, u);
      if (!m) break;
      g.moves.push({ m, note: notate(g.pos, m), iccs: u });
      Engine.makeMove(g.pos, m);
      Engine.markCheck(g.pos);
    }
    const prev = g.moves[g.moves.length - 1];
    g.last = prev ? [Engine.from(prev.m), Engine.to(prev.m)] : null;
    g.flipped = !!s.flipped;
    g.helped = !!s.helped;
    return g;
  }

  // ---- Board rendering --------------------------------------------------------------------
  // Display cell i (row-major, 9 wide) maps to an engine square; flipping turns the board 180°.
  const displayToSq = i => game.flipped ? 89 - i : i;
  const sqToDisplay = sq => game.flipped ? 89 - sq : sq;

  function buildGrid() {
    const rows = [];
    for (let r = 0; r < 10; r++) {
      const row = document.createElement('div');
      row.setAttribute('role', 'row');
      row.style.display = 'contents';
      for (let c = 0; c < 9; c++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'sq';
        b.setAttribute('role', 'gridcell');
        b.tabIndex = -1;
        b.dataset.i = r * 9 + c;
        b.addEventListener('focus', () => { cursor = Number(b.dataset.i); syncTabStops(); });
        squares.push(b);
        row.append(b);
      }
      rows.push(row);
    }
    els.grid.replaceChildren(...rows);
  }

  // Board lines, palace, river and the file numbers of each side drawn in a 960 × 1120 box (intersections 100 apart).
  function boardSVG(flipped) {
    const X = c => 80 + 100 * c, Y = r => 110 + 100 * r;
    let d = '';
    for (let r = 0; r < 10; r++) d += `M${X(0)} ${Y(r)}H${X(8)}`;
    d += `M${X(0)} ${Y(0)}V${Y(9)}M${X(8)} ${Y(0)}V${Y(9)}`;
    for (let c = 1; c < 8; c++) d += `M${X(c)} ${Y(0)}V${Y(4)}M${X(c)} ${Y(5)}V${Y(9)}`;
    d += `M${X(3)} ${Y(0)}L${X(5)} ${Y(2)}M${X(5)} ${Y(0)}L${X(3)} ${Y(2)}M${X(3)} ${Y(7)}L${X(5)} ${Y(9)}M${X(5)} ${Y(7)}L${X(3)} ${Y(9)}`;
    let marks = '';
    const spots = [[2, 1], [2, 7], [7, 1], [7, 7]];
    for (const r of [3, 6]) for (const c of [0, 2, 4, 6, 8]) spots.push([r, c]);
    for (const [r, c] of spots) for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      if (c + sx < 0 || c + sx > 8) continue;
      marks += `M${X(c) + sx * 9} ${Y(r) + sy * 29}V${Y(r) + sy * 9}H${X(c) + sx * 29}`;
    }
    const cjk = lang === 'zh' || lang === 'ja';
    let labels = '';
    for (let v = 0; v < 9; v++) {
      const c = flipped ? 8 - v : v;
      const top = flipped ? 9 - c : c + 1, bottom = flipped ? c + 1 : 9 - c;
      const topRed = flipped, txt = (n, red) => cjk && red ? RED_NUM[n - 1] : String(n);
      labels += `<text x="${X(v)}" y="34">${txt(top, topRed)}</text><text x="${X(v)}" y="1087">${txt(bottom, !topRed)}</text>`;
    }
    return `<rect x="66" y="96" width="828" height="928" fill="none" stroke="var(--grid)" stroke-width="7"/>
      <path d="${d}" fill="none" stroke="var(--grid)" stroke-width="3.2" stroke-linecap="square"/>
      <path d="${marks}" fill="none" stroke="var(--grid)" stroke-width="3"/>
      <g class="river" fill="#7a4a24" font-size="56" text-anchor="middle" dominant-baseline="central"><text x="${X(2)}" y="560">楚 河</text><text x="${X(6)}" y="560">漢 界</text></g>
      <g class="files" fill="#6b3f1d" font-size="30" font-weight="800" text-anchor="middle" dominant-baseline="central">${labels}</g>`;
  }

  function layoutBoard() {
    squares.forEach((b, i) => { b.dataset.sq = displayToSq(i); });
    els.lines.innerHTML = boardSVG(game.flipped);
  }

  function setFlipped(flipped) {
    game.flipped = flipped;
    layoutBoard();
    rebuildPieces();
    if (game.hint?.length === 2) drawArrow(game.hint[0], game.hint[1]);
  }

  function place(el, sq) {
    const i = sqToDisplay(sq);
    el.style.setProperty('--x', i % 9);
    el.style.setProperty('--y', (i / 9) | 0);
  }

  function makePiece(pc, sq) {
    const el = document.createElement('div');
    el.className = 'pc';
    el.dataset.pc = pc;
    el.innerHTML = pieceSVG(pc);
    place(el, sq);
    return el;
  }

  function rebuildPieces() {
    els.pieces.classList.add('instant');
    pieceEls = new Map();
    const nodes = [];
    for (let sq = 0; sq < 90; sq++) {
      const pc = game.pos.b[sq];
      if (!pc) continue;
      const el = makePiece(pc, sq);
      pieceEls.set(sq, el);
      nodes.push(el);
    }
    els.pieces.replaceChildren(...nodes);
    void els.pieces.offsetWidth;
    els.pieces.classList.remove('instant');
  }

  // Rebuilds the piece layer if it ever drifts from the engine board.
  function ensurePieces() {
    let ok = true, count = 0;
    for (let sq = 0; sq < 90 && ok; sq++) {
      const pc = game.pos.b[sq];
      if (!pc) continue;
      count++;
      if (Number(pieceEls.get(sq)?.dataset.pc) !== pc) ok = false;
    }
    if (!ok || count !== pieceEls.size) rebuildPieces();
  }

  function animateMove(m, dragged) {
    const f = Engine.from(m), to = Engine.to(m);
    const victim = pieceEls.get(to);
    if (victim) {
      pieceEls.delete(to);
      victim.classList.add('gone');
      setTimeout(() => victim.remove(), 230);
    }
    const el = pieceEls.get(f);
    if (!el) return;
    pieceEls.delete(f);
    pieceEls.set(to, el);
    el.classList.remove('drag');
    if (dragged) el.style.transform = '';
    el.style.zIndex = 3;
    place(el, to);
    setTimeout(() => { el.style.zIndex = ''; }, 260);
  }

  function clearArrows() { els.arrows.replaceChildren(); }

  function drawArrow(a, b) {
    const ia = sqToDisplay(a), ib = sqToDisplay(b);
    const x1 = ia % 9 + .5, y1 = ((ia / 9) | 0) + .5, x2 = ib % 9 + .5, y2 = ((ib / 9) | 0) + .5;
    const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len, nx = -uy, ny = ux;
    const tipX = x2 - ux * .2, tipY = y2 - uy * .2, baseX = tipX - ux * .42, baseY = tipY - uy * .42, w = .085, hw = .25;
    const pts = [[x1 + nx * w, y1 + ny * w], [baseX + nx * w, baseY + ny * w], [baseX + nx * hw, baseY + ny * hw], [tipX, tipY], [baseX - nx * hw, baseY - ny * hw], [baseX - nx * w, baseY - ny * w], [x1 - nx * w, y1 - ny * w]];
    els.arrows.innerHTML = `<polygon points="${pts.map(([x, y]) => `${x.toFixed(3)},${y.toFixed(3)}`).join(' ')}" fill="#3fbf7fd9" stroke="#145c37" stroke-width=".03" stroke-linejoin="round"/>`;
  }

  function syncTabStops() {
    squares.forEach((b, i) => { b.tabIndex = i === cursor ? 0 : -1; });
  }

  function focusCursor() {
    syncTabStops();
    squares[cursor]?.focus({ preventScroll: true });
  }

  function render() {
    const g = game;
    if (!g) return;
    const targets = new Set(), p = g.pos;
    if (g.sel >= 0) for (const m of g.legal) if (Engine.from(m) === g.sel) targets.add(Engine.to(m));
    const checkSq = (!g.over || g.reason === 'mate') && g.mode !== 'idle' && Engine.inCheck(p) ? p.kings[p.side] : -1;
    for (const b of squares) {
      const sq = Number(b.dataset.sq), pc = p.b[sq], target = targets.has(sq);
      b.classList.toggle('last', !!g.last && (g.last[0] === sq || g.last[1] === sq));
      b.classList.toggle('dot', target && !pc);
      b.classList.toggle('cap', target && !!pc);
      b.classList.toggle('hint', !!g.hint && g.hint.includes(sq));
      let label = `${sqName(sq)}, ${pc ? `${colorName(pc & 16 ? BLACK : RED)} ${t.pn[pc & 7]}` : t.empty}`;
      if (sq === g.sel) label += `, ${t.selected}`;
      if (target) label += `, ${pc ? t.captureHere : t.moveHere}`;
      b.setAttribute('aria-label', label);
    }
    for (const [sq, el] of pieceEls) {
      el.classList.toggle('sel', sq === g.sel);
      el.classList.toggle('check', sq === checkSq);
    }
    syncTabStops();
    renderCards();
    renderFeed();
    renderActions();
  }

  function renderCards() {
    const g = game, bottom = g.flipped ? BLACK : RED, counts = countPieces(g.pos);
    for (const [slot, side] of [['top', bottom ^ 1], ['bot', bottom]]) {
      $(`av-${slot}`).innerHTML = pieceSVG(code(side, KING));
      let name = colorName(side);
      if (g.mode === 'cpu') name = side === g.human ? `${t.you} · ${colorName(side)}` : t.cpuLv(g.level);
      else if (g.mode === 'puzzle') name = side === g.human ? `${t.you} · ${colorName(side)}` : t.puzzleN(g.puzzle.i + 1);
      $(`nm-${slot}`).textContent = name;
      const sub = $(`sub-${slot}`);
      if (g.mode === 'puzzle' && side !== g.human) sub.innerHTML = `<span class="txt">${t.groups[g.puzzle.group]}</span>`;
      else {
        const opp = side ^ 1;
        let html = '', diff = 0;
        for (const type of [ROOK, CANNON, HORSE, ELEPHANT, ADVISOR, PAWN]) {
          const lost = Math.max(0, g.base[opp][type] - counts[opp][type]);
          for (let k = 0; k < lost; k++) html += pieceSVG(code(opp, type));
          diff += VALUE[type] * (counts[side][type] - counts[opp][type]);
        }
        if (diff > 0) html += `<span class="adv">+${diff}</span>`;
        sub.innerHTML = html;
      }
      const tag = $(`tag-${slot}`);
      const inCheck = !g.over && g.mode !== 'idle' && g.pos.side === side && Engine.inCheck(g.pos);
      tag.hidden = !inCheck;
      tag.textContent = t.inCheck;
      tag.classList.toggle('alert', inCheck);
      $(`card-${slot}`).classList.toggle('on', !g.over && g.mode !== 'idle' && g.pos.side === side);
    }
  }

  function renderFeed() {
    const g = game;
    let text = '', cls = '';
    const check = g.mode !== 'idle' && Engine.inCheck(g.pos);
    if (g.mode === 'idle') text = '';
    else if (g.over) text = g.title || '';
    else if (g.mode === 'puzzle') text = goalText(g);
    else if (g.thinking) text = t.thinking;
    else if (g.mode === 'cpu') { text = check ? t.youInCheck : t.yourTurn; cls = check ? 'alert' : ''; }
    else { text = check ? `${t.toMove(colorName(g.pos.side))} · ${t.inCheck}` : t.toMove(colorName(g.pos.side)); cls = check ? 'alert' : ''; }
    if (!g.over && g.mode !== 'idle' && g.mode !== 'puzzle' && g.pos.half >= Engine.LIMIT - 20) text += ` · ${t.limitNear(Math.ceil((Engine.LIMIT - g.pos.half) / 2))}`;
    els.status.textContent = text;
    els.status.className = `status ${cls}`;
    if (movesShown === g.moves.length) return;
    movesShown = g.moves.length;
    const items = [];
    let li = null;
    g.moves.forEach((x, i) => {
      const side = (g.firstSide + i) & 1, num = ((g.firstSide + i) >> 1) + 1;
      if (side === RED || !li) {
        li = document.createElement('li');
        li.innerHTML = `<span class="n">${num}.</span>${side === BLACK ? '<span class="m" aria-hidden="true">…</span>' : ''}`;
        items.push(li);
      }
      const s = document.createElement('span');
      s.className = `m ${side === RED ? 'r' : 'b'}`;
      s.textContent = x.note;
      if (i === g.moves.length - 1) s.classList.add('cur');
      li.append(s);
    });
    if (!items.length) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = g.mode === 'idle' ? '' : t.noMoves;
      items.push(empty);
    }
    els.moves.replaceChildren(...items);
    els.moves.scrollTop = els.moves.scrollHeight;
    els.moves.scrollLeft = els.moves.scrollWidth;
  }

  function renderActions() {
    const g = game, puzzle = g.mode === 'puzzle', idle = g.mode === 'idle';
    els.undo.hidden = puzzle;
    els.resign.hidden = puzzle;
    els.retry.hidden = !puzzle;
    els.list.hidden = !puzzle;
    els.undo.disabled = !canUndo();
    els.hint.disabled = idle || g.over || g.busy || (g.mode === 'cpu' && g.pos.side !== g.human);
    els.resign.disabled = idle || g.over;
    els.retry.disabled = g.busy;
    els.flip.disabled = idle;
    const label = settings.sound ? t.soundOn : t.soundOff;
    els.sound.setAttribute('aria-label', label);
    els.sound.setAttribute('aria-pressed', String(settings.sound));
    $('snd-lb').textContent = label;
    $('snd-wave').style.display = settings.sound ? '' : 'none';
    $('snd-off').style.display = settings.sound ? 'none' : '';
  }

  function toast(text, kind = '') {
    els.toast.textContent = text;
    els.toast.className = `toast show ${kind}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { els.toast.className = `toast ${kind}`; }, 1800);
  }

  const announce = text => { els.announcer.textContent = text; };

  // ---- Overlays ---------------------------------------------------------------------------
  function show(name) {
    for (const [key, el] of Object.entries(overlays)) el.hidden = key !== name;
    if (name === 'menu') renderMenu();
    if (name === 'cpu') renderCpuSetup();
    if (name === 'pvp') renderPvpSetup();
    if (name === 'puzzles') renderPuzzleList();
    const first = overlays[name].querySelector('.mode:not([hidden])') || overlays[name].querySelector('.cta') || overlays[name].querySelector('button');
    first?.focus({ preventScroll: true });
  }

  function closeOverlays() {
    for (const el of Object.values(overlays)) el.hidden = true;
  }

  function resumePlay() {
    closeOverlays();
    render();
    if (isCpuTurn() && !game.thinking) cpuMove();
    focusCursor();
  }

  function confirmBox(title, text, yes, no, onYes) {
    els.confirmTitle.textContent = title;
    els.confirmText.textContent = text;
    els.confirmText.hidden = !text;
    els.confirmYes.textContent = yes;
    els.confirmNo.textContent = no;
    els.confirmYes.onclick = () => { closeOverlays(); onYes(); };
    els.confirmNo.onclick = resumePlay;
    show('confirm');
  }

  function renderMenu() {
    const live = game && !game.over && game.live;
    const saved = !live && savedGame();
    const target = live ? game : saved;
    const resume = $('m-resume');
    resume.hidden = !target;
    if (target) {
      $('resume-title').textContent = live ? t.resumeT : t.continueT;
      const what = target.mode === 'cpu' ? t.vsLevel(target.level) : target.mode === 'puzzle' ? t.puzzleN(target.puzzle.i + 1) : t.twoP;
      $('resume-sub').textContent = target.mode === 'puzzle' ? `${what} · ${t.groups[target.puzzle.group]}` : t.resumeSub(what, Math.floor(target.moves.length / 2) + 1);
    }
    $('cpu-sub').textContent = t.cpuSub(settings.level, t.levelNames[settings.level - 1]);
    $('puzzle-sub').textContent = t.puzzleSub(solved.size, PUZZLES.length);
    $('menu-sound').setAttribute('aria-checked', String(settings.sound));
    $('menu-western').setAttribute('aria-checked', String(settings.western));
  }

  function renderCpuSetup() {
    const wrap = $('levels');
    if (!wrap.children.length) {
      for (let n = 1; n <= Engine.LEVELS.length; n++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'lv';
        b.setAttribute('role', 'radio');
        b.dataset.level = n;
        b.innerHTML = `<strong>${n}</strong><small></small>`;
        b.addEventListener('click', () => { settings.level = n; renderCpuSetup(); });
        wrap.append(b);
      }
    }
    for (const b of wrap.children) {
      const n = Number(b.dataset.level), mark = beaten[n] || 0;
      b.setAttribute('aria-checked', String(n === settings.level));
      b.tabIndex = n === settings.level ? 0 : -1;
      const small = b.querySelector('small');
      small.textContent = mark === 2 ? '★' : mark === 1 ? '✓' : '';
      small.className = mark === 2 ? 'star' : '';
      b.setAttribute('aria-label', `${t.level} ${n}, ${t.levelNames[n - 1]}${mark ? `, ${mark === 2 ? '★' : '✓'}` : ''}`);
    }
    $('lv-name').textContent = `${t.level} ${settings.level} · ${t.levelNames[settings.level - 1]}`;
    $('lv-note').textContent = '★'.repeat(Math.ceil(settings.level / 2));
    renderSegs();
  }

  function renderPvpSetup() {
    $('auto-flip').setAttribute('aria-checked', String(settings.autoFlip));
  }

  function renderSegs() {
    for (const group of document.querySelectorAll('.seg')) {
      for (const b of group.children) b.setAttribute('aria-pressed', String(settings[group.dataset.key] === b.dataset.v));
    }
  }

  function renderPuzzleList() {
    $('pz-progress').textContent = t.pzProgress(solved.size, PUZZLES.length);
    const wrap = $('pz-groups');
    if (!wrap.children.length) {
      for (const group of GROUPS) {
        const section = document.createElement('section');
        section.className = 'pz-group';
        section.innerHTML = '<h3><span></span><span></span></h3><div class="pz-grid"></div>';
        section.firstChild.firstChild.textContent = t.groups[group];
        section.dataset.group = group;
        const grid = section.lastChild;
        PUZZLES.forEach(([kind, fen], i) => {
          if (kind !== group) return;
          const b = document.createElement('button');
          b.type = 'button';
          b.className = `pz${fen.includes(' b ') ? ' bk' : ''}`;
          b.dataset.i = i;
          b.textContent = i + 1;
          b.addEventListener('click', () => startPuzzle(i));
          grid.append(b);
        });
        wrap.append(section);
      }
    }
    for (const section of wrap.children) {
      const ids = PUZZLES.map((x, i) => x[0] === section.dataset.group ? i : -1).filter(i => i >= 0);
      section.firstChild.lastChild.textContent = `${ids.filter(i => solved.has(i)).length}/${ids.length}`;
    }
    for (const b of wrap.querySelectorAll('.pz')) {
      const i = Number(b.dataset.i), done = solved.has(i);
      b.classList.toggle('done', done);
      b.setAttribute('aria-label', `${t.puzzleN(i + 1)}, ${colorName(PUZZLES[i][1].includes(' b ') ? BLACK : RED)}${done ? ', ✓' : ''}`);
    }
  }

  function renderRules() {
    $('rules-list').innerHTML = t.rulesList.map(x => `<li>${x}</li>`).join('');
  }

  // ---- Sound ------------------------------------------------------------------------------
  let actx = null, noise = null;
  function audio() {
    if (!settings.sound) return null;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      if (!noise) {
        noise = actx.createBuffer(1, actx.sampleRate * .2, actx.sampleRate);
        const data = noise.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
    } catch { actx = null; }
    return actx;
  }

  // A short band-passed noise burst sounds like a wooden disc set down on the board.
  function knock(ac, at, freq, gain) {
    const src = ac.createBufferSource(), filter = ac.createBiquadFilter(), env = ac.createGain();
    src.buffer = noise;
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = 1.6;
    env.gain.setValueAtTime(gain, at);
    env.gain.exponentialRampToValueAtTime(.001, at + .08);
    src.connect(filter).connect(env).connect(ac.destination);
    src.start(at);
    src.stop(at + .1);
  }

  function beep(ac, at, freq, dur, gain, type = 'sine') {
    const osc = ac.createOscillator(), env = ac.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    env.gain.setValueAtTime(.0001, at);
    env.gain.exponentialRampToValueAtTime(gain, at + .015);
    env.gain.exponentialRampToValueAtTime(.0001, at + dur);
    osc.connect(env).connect(ac.destination);
    osc.start(at);
    osc.stop(at + dur + .02);
  }

  function play(name) {
    const ac = audio();
    if (!ac) return;
    const now = ac.currentTime;
    if (name === 'move') { knock(ac, now, 1100, .7); beep(ac, now, 240, .05, .07); }
    else if (name === 'capture') { knock(ac, now, 700, 1); knock(ac, now + .05, 1500, .5); }
    else if (name === 'check') { knock(ac, now, 1100, .7); beep(ac, now + .03, 660, .12, .08, 'triangle'); beep(ac, now + .14, 880, .16, .08, 'triangle'); }
    else if (name === 'pick') knock(ac, now, 2400, .22);
    else if (name === 'error') beep(ac, now, 170, .18, .07, 'square');
    else if (name === 'win') [523, 659, 784, 1047].forEach((f, i) => beep(ac, now + i * .11, f, .3, .1, 'triangle'));
    else if (name === 'lose') [392, 330, 262].forEach((f, i) => beep(ac, now + i * .16, f, .35, .09, 'triangle'));
    else if (name === 'draw') [440, 440].forEach((f, i) => beep(ac, now + i * .18, f, .25, .08, 'triangle'));
  }

  function toggleSound() {
    settings.sound = !settings.sound;
    saveSettings();
    renderActions();
    renderMenu();
    if (settings.sound) play('move');
  }

  function toggleWestern() {
    settings.western = !settings.western;
    saveSettings();
    renderMenu();
    renderIcons();
    if (game) { rebuildPieces(); render(); }
  }

  function renderIcons() {
    $('logo-ic').innerHTML = pieceSVG(code(RED, KING));
    $('ic-resume').innerHTML = pieceSVG(code(RED, PAWN));
    $('ic-cpu').innerHTML = pieceSVG(code(BLACK, CANNON));
    $('ic-pvp').innerHTML = pieceSVG(code(RED, ROOK));
    $('ic-puzzle').innerHTML = pieceSVG(code(BLACK, HORSE));
  }

  // ---- Input ------------------------------------------------------------------------------
  function sqFromPoint(x, y) {
    const r = els.grid.getBoundingClientRect();
    const c = Math.floor((x - r.left) / r.width * 9), row = Math.floor((y - r.top) / r.height * 10);
    return c < 0 || c > 8 || row < 0 || row > 9 ? -1 : displayToSq(row * 9 + c);
  }

  const mine = pc => !!pc && (pc & 16 ? BLACK : RED) === game.pos.side;

  function tapSquare(sq) {
    if (!canAct()) return;
    const g = game, pc = g.pos.b[sq];
    if (g.sel >= 0 && g.sel !== sq && tryMove(g.sel, sq, false)) return;
    g.sel = mine(pc) && g.sel !== sq ? sq : -1;
    if (g.sel >= 0) play('pick');
    render();
  }

  els.grid.addEventListener('click', event => {
    const b = event.target.closest('.sq');
    if (suppressClick) { suppressClick = false; return; }
    if (b) tapSquare(Number(b.dataset.sq));
  });

  els.grid.addEventListener('pointerdown', event => {
    if (event.button > 0 || !canAct()) return;
    const sq = sqFromPoint(event.clientX, event.clientY);
    const pc = sq >= 0 ? game.pos.b[sq] : 0;
    if (!mine(pc) || !pieceEls.get(sq)) return;
    drag = { id: event.pointerId, sq, el: pieceEls.get(sq), x: event.clientX, y: event.clientY, moved: false, over: null };
  });

  els.grid.addEventListener('pointermove', event => {
    if (!drag || drag.id !== event.pointerId) return;
    if (!drag.moved) {
      if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 6) return;
      drag.moved = true;
      // Capture only once it is a real drag so a plain tap still produces a click on the square.
      els.grid.setPointerCapture(event.pointerId);
      game.sel = drag.sq;
      render();
      drag.el.classList.add('drag');
    }
    const r = els.pieces.getBoundingClientRect(), cw = r.width / 9, ch = r.height / 10;
    drag.el.style.transform = `translate(${event.clientX - r.left - cw / 2}px, ${event.clientY - r.top - ch / 2}px)`;
    const over = sqFromPoint(event.clientX, event.clientY);
    if (over !== drag.over) {
      squares.forEach(b => b.classList.toggle('over', Number(b.dataset.sq) === over && over !== drag.sq));
      drag.over = over;
    }
  });

  function endDrag(event, cancelled) {
    if (!drag || drag.id !== event.pointerId) return;
    const { el, moved, sq } = drag;
    drag = null;
    squares.forEach(b => b.classList.remove('over'));
    if (!moved) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
    const target = sqFromPoint(event.clientX, event.clientY);
    if (!cancelled && game && target >= 0 && target !== sq && tryMove(sq, target, true)) return;
    el.classList.remove('drag');
    el.style.transform = '';
    render();
  }
  els.grid.addEventListener('pointerup', event => endDrag(event, false));
  els.grid.addEventListener('pointercancel', event => endDrag(event, true));

  const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || !game || overlayOpen()) return;
    const dir = ARROWS[event.key];
    if (dir) {
      event.preventDefault();
      if (els.grid.contains(document.activeElement)) {
        const r = Math.min(9, Math.max(0, ((cursor / 9) | 0) + dir[0])), c = Math.min(8, Math.max(0, cursor % 9 + dir[1]));
        cursor = r * 9 + c;
      }
      focusCursor();
      return;
    }
    const key = event.key.toLowerCase();
    const actions = { u: undo, h: hint, f: flip };
    if (actions[key] && !event.repeat) { event.preventDefault(); actions[key](); }
  });

  function flip() {
    if (!game || game.mode === 'idle' || overlayOpen()) return;
    setFlipped(!game.flipped);
    render();
    save();
  }

  els.undo.addEventListener('click', undo);
  els.hint.addEventListener('click', hint);
  els.flip.addEventListener('click', flip);
  els.resign.addEventListener('click', resign);
  els.sound.addEventListener('click', toggleSound);
  els.menu.addEventListener('click', () => show('menu'));
  els.retry.addEventListener('click', () => { if (game?.puzzle) startPuzzle(game.puzzle.i); });
  els.list.addEventListener('click', () => show('puzzles'));
  $('menu-sound').addEventListener('click', toggleSound);
  $('menu-western').addEventListener('click', toggleWestern);
  $('m-rules').addEventListener('click', () => { renderRules(); show('rules'); });
  $('rules-ok').addEventListener('click', () => show('menu'));
  $('m-resume').addEventListener('click', () => {
    if (game && !game.over && game.live) return resumePlay();
    const s = savedGame();
    if (!s) return;
    const g = restore(s);
    g.live = true;
    Engine.clearMemory();
    begin(g);
    const outcome = Engine.outcome(g.pos);
    if (outcome) endGame(outcome.winner, outcome.reason);
  });
  $('m-cpu').addEventListener('click', () => show('cpu'));
  $('m-pvp').addEventListener('click', () => show('pvp'));
  $('m-puzzle').addEventListener('click', () => show('puzzles'));
  $('start-cpu').addEventListener('click', () => { saveSettings(); startCpu(); });
  $('start-pvp').addEventListener('click', () => { saveSettings(); startPvp(); });
  $('auto-flip').addEventListener('click', () => { settings.autoFlip = !settings.autoFlip; renderPvpSetup(); });
  for (const b of document.querySelectorAll('[data-back]')) b.addEventListener('click', () => show('menu'));
  for (const group of document.querySelectorAll('.seg')) {
    group.addEventListener('click', event => {
      const b = event.target.closest('button');
      if (!b) return;
      settings[group.dataset.key] = b.dataset.v;
      renderSegs();
    });
  }
  $('levels').addEventListener('keydown', event => {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
    if (!step) return;
    event.preventDefault();
    settings.level = Math.min(Engine.LEVELS.length, Math.max(1, settings.level + step));
    renderCpuSetup();
    $('levels').children[settings.level - 1].focus({ preventScroll: true });
  });
  els.resultMain.addEventListener('click', () => {
    const g = game;
    if (g.mode === 'puzzle') return startPuzzle(nextPuzzleIndex(g.puzzle.i));
    if (g.mode === 'cpu') startCpu();
    else startPvp();
  });
  els.resultReview.addEventListener('click', () => {
    if (game.mode === 'puzzle') return show('puzzles');
    closeOverlays();
    render();
  });
  $('result-menu').addEventListener('click', () => show('menu'));

  // ---- Boot -------------------------------------------------------------------------------
  renderIcons();
  buildGrid();
  const saved = savedGame();
  game = saved ? restore(saved) : createGame('idle');
  if (!saved) game.over = true;
  layoutBoard();
  rebuildPieces();
  render();
  show('menu');
})();
</script>
</body>
</html>
