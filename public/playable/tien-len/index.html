<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiến Lên</title>
<style>
:root {
  --bg: #16070a;
  --felt: #8e1f2c;
  --felt-dark: #4f0b16;
  --rail: #3b1a10;
  --rail-light: #c8973f;
  --text: #fff4e6;
  --muted: #eebcaa;
  --gold: #f7c64f;
  --gold-dark: #b5831c;
  --jade: #3fd29d;
  --jade-dark: #12795a;
  --lose: #ff7a6b;
  --red: #d11f3a;
  --ink: #1f1a24;
  --plate: linear-gradient(#5d1722, #33090f);
  --back: radial-gradient(circle at 50% 50%, #f7c64f 0 10%, transparent 11%), repeating-linear-gradient(45deg, #ffffff24 0 2px, transparent 2px 6px), repeating-linear-gradient(-45deg, #ffffff24 0 2px, transparent 2px 6px), linear-gradient(160deg, #27b083, #0c5a45);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: radial-gradient(120% 80% at 50% 0%, #3d0d17, var(--bg) 70%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.sr-only { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; max-width: 720px; margin: auto; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; min-width: 0; font-size: clamp(21px, 6.4vw, 28px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; color: var(--gold); text-shadow: 0 2px 0 #0006; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; background: #00000040; font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.pill:hover, .icon:hover { color: var(--gold); }
.pill svg { width: 16px; height: 16px; flex-shrink: 0; }
.icon { width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; background: #00000040; font-size: 16px; font-weight: 900; color: var(--muted); }
.icon svg { width: 18px; height: 18px; }

.hud { display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 4px 4px 5px; border-radius: 12px; background: #00000038; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.me strong { color: var(--gold); }
.stat.bump strong { animation: bump .35s; }
@keyframes bump { 40% { scale: 1.18; } }

/* The table: three opponents around a centre pile, your hand along the bottom edge. Card sizes come from layout(). */
.felt { --cw: 48px; --pw: 42px; --sw: 70px; --bw: 18px; flex: 1; min-height: 0; position: relative; display: grid; grid-template-columns: var(--sw) minmax(0, 1fr) var(--sw); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top top top" "left pile right" "mine mine mine"; gap: 4px; padding: 6px; border-radius: 26px; border: 6px solid var(--rail); background: radial-gradient(#ffffff08 1px, transparent 1.5px) 0 0 / 6px 6px, radial-gradient(100% 75% at 50% 42%, #b12d3d, var(--felt) 48%, var(--felt-dark)); box-shadow: inset 0 0 0 2px #00000030, inset 0 0 50px #0008, 0 0 0 2px var(--rail-light), 0 12px 28px #0009; }
.felt::before { content: ""; position: absolute; inset: 9% 7%; border-radius: 999px; border: 1.5px solid #f7c64f26; pointer-events: none; }

.card { position: relative; flex: none; width: var(--cw); height: calc(var(--cw) * 1.4); padding: 0; border-radius: calc(var(--cw) * .1); background: linear-gradient(#fffdf8, #f4ebdc); color: var(--ink); box-shadow: 0 1px 3px #0008, 0 0 0 .5px #0003; text-align: left; transition: translate .15s, box-shadow .15s, filter .2s; }
.card.red { color: var(--red); }
.card.two { box-shadow: inset 0 0 0 calc(var(--cw) * .035) #e2b23f, 0 1px 3px #0008; }
.ix { position: absolute; left: 6%; top: 4%; display: flex; flex-direction: column; align-items: center; font-weight: 900; font-size: calc(var(--cw) * .3); line-height: .95; letter-spacing: -.07em; pointer-events: none; }
.ix i { font-style: normal; font-size: .8em; letter-spacing: 0; }
.pip { position: absolute; right: 9%; bottom: 6%; font-size: calc(var(--cw) * .5); line-height: 1; pointer-events: none; }
.card.deal { animation: deal .32s cubic-bezier(.2, .8, .3, 1) backwards; }
@keyframes deal { from { opacity: 0; transform: translateY(-70%) rotate(-8deg) scale(.6); } }

.seat { position: relative; z-index: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: opacity .3s; }
.seat.s1 { grid-area: right; align-self: center; }
.seat.s3 { grid-area: left; align-self: center; }
.seat.s2 { grid-area: top; justify-self: center; flex-direction: row; gap: 8px; }
.backs { position: relative; display: flex; height: calc(var(--bw) * 1.4); }
.backs i { width: var(--bw); height: calc(var(--bw) * 1.4); border-radius: calc(var(--bw) * .14); background: var(--back); box-shadow: inset 0 0 0 1.5px #fff, 0 1px 3px #0008; }
.backs i:first-child { rotate: -8deg; }
.backs i + i { margin-left: calc(var(--bw) * -.55); rotate: 8deg; }
.backs .cnt { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; font-variant-numeric: tabular-nums; }
.backs.none { visibility: hidden; }
.plate { position: relative; width: var(--sw); min-height: 34px; display: flex; align-items: center; gap: 5px; padding: 4px 6px 4px 4px; border-radius: 12px; background: var(--plate); box-shadow: 0 0 0 1.5px #ffffff22, 0 4px 10px #0007; transition: box-shadow .2s, opacity .3s; }
.seat.s2 .plate { width: auto; min-width: var(--sw); max-width: 170px; }
.av { width: 26px; height: 26px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: #ffffff1c; font-size: 16px; line-height: 1; }
.who { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.18; }
.who .nm { font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who b { font-size: 12px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { position: absolute; left: 50%; top: -10px; z-index: 2; translate: -50% 0; padding: 1px 7px; border-radius: 99px; background: #dfe6ee; color: var(--ink); font-size: 10px; font-weight: 900; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; animation: pop .3s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.tag:empty { display: none; }
.tag.pass { background: #5e5059; color: #f1e4e8; }
.tag.p0 { background: var(--gold); color: #2b1f04; }
.tag.p1 { background: #e6edf3; }
.tag.p2 { background: #e2a46d; color: #2b1404; }
.tag.p3 { background: #7a6a72; color: #fff; }
.tag.frozen { background: #8fd3ff; color: #062033; }
.plate .tag { top: auto; bottom: -10px; }
.dots { position: absolute; right: 4px; top: -8px; display: none; gap: 3px; padding: 4px 6px; border-radius: 99px; background: var(--gold); }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: #2b1f04; animation: dot 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 30% { translate: 0 -3px; opacity: .5; } }
.seat.thinking .dots { display: flex; }
.seat.turn .plate { box-shadow: 0 0 0 2px var(--gold), 0 0 16px #f7c64f88; }
.seat.done .plate { opacity: .75; }
.felt.big .plate { min-height: 46px; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 14px; }
.felt.big .av { width: 34px; height: 34px; font-size: 21px; }
.felt.big .who .nm { font-size: 14px; }
.felt.big .who b { font-size: 14px; }
.felt.big .backs .cnt { font-size: 16px; }
.felt.big .plbl { font-size: 14px; line-height: 20px; padding: 3px 14px; }
.felt:not(.wide) .seat.s1 .plate, .felt:not(.wide) .seat.s3 .plate { flex-direction: column; gap: 2px; padding: 6px 4px 5px; text-align: center; }
.felt:not(.wide) .seat.s1 .who, .felt:not(.wide) .seat.s3 .who { width: 100%; align-items: center; }

.pile { grid-area: pile; position: relative; z-index: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.stack { display: grid; place-items: center; max-width: 100%; }
.stack > * { grid-area: 1 / 1; }
.prow { display: flex; justify-content: center; }
.prow .card { --cw: var(--pw); }
.prow .card + .card { margin-left: calc(var(--pstep, 20px) - var(--pw)); }
.prow.under { translate: 0 calc(var(--pw) * -.28); scale: .86; filter: brightness(.55) saturate(.6); }
.prow.fly .card { animation: fly .32s cubic-bezier(.2, .8, .3, 1) backwards; }
@keyframes fly { from { transform: translate(var(--fx, 0), var(--fy, 0)) scale(.6); opacity: .3; } }
.slot { width: var(--pw); height: calc(var(--pw) * 1.4); border-radius: calc(var(--pw) * .1); border: 1.5px dashed #ffffff30; display: none; }
.pile.empty .slot { display: block; }
.plbl { max-width: 100%; min-height: 20px; padding: 2px 10px; border-radius: 99px; background: #00000047; font-size: 12px; font-weight: 800; line-height: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plbl:empty { visibility: hidden; }
.pile.empty .plbl { background: none; color: var(--muted); }
.boom { position: absolute; left: 50%; top: 50%; z-index: 9; translate: -50% -50%; font-size: clamp(26px, 9vw, 46px); font-weight: 900; color: var(--gold); white-space: nowrap; text-shadow: 0 3px 0 #000a, 0 0 22px #ff5a3c; pointer-events: none; animation: boom 1s ease-out forwards; }
@keyframes boom { 0% { scale: .3; opacity: 0; } 18% { scale: 1.25; opacity: 1; rotate: -6deg; } 30% { scale: 1; rotate: 3deg; } 75% { opacity: 1; } 100% { opacity: 0; scale: 1.1; } }

.mine { grid-area: mine; position: relative; z-index: 2; min-width: 0; }
.hand { display: flex; justify-content: center; padding-top: calc(var(--cw) * .26); touch-action: none; }
.hand .card { margin-left: calc(var(--step, 30px) - var(--cw)); cursor: pointer; }
.hand .card:first-child { margin-left: 0; }
.hand .card.g { margin-left: calc(var(--step, 30px) - var(--cw) + var(--gap, 0px)); }
.hand .card.sel { translate: 0 calc(var(--cw) * -.24); box-shadow: 0 0 0 2px var(--gold), 0 0 14px #f7c64faa, 0 4px 10px #0009; }
.hand .card:focus-visible { outline-offset: 1px; z-index: 1; }
.mine.off .card { filter: brightness(.82); }
.mine.turn::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -3px; height: 3px; border-radius: 3px; background: var(--gold); box-shadow: 0 0 12px var(--gold); }
.mytag { position: absolute; left: 50%; top: -6px; z-index: 3; translate: -50% 0; }
.mytag:empty { display: none; }

.msg { flex-shrink: 0; min-height: 20px; font-size: 14px; font-weight: 800; text-align: center; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.good { color: var(--jade); }
.msg.bad { color: var(--lose); }

.controls { flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr 1.15fr 1.45fr; gap: 6px; }
.btn { height: 46px; min-width: 0; padding: 0 6px; border-radius: 12px; font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(#ffd877, var(--gold)); color: #2b1f04; box-shadow: 0 3px 0 var(--gold-dark); }
.btn.alt { background: linear-gradient(#fff7ee, #ead9c8); color: var(--ink); box-shadow: 0 3px 0 #a88f7b; }
.btn.pass { background: linear-gradient(#7c3a49, #5b2131); color: #fff; box-shadow: 0 3px 0 #33101a; }
.btn:not(:disabled):active { translate: 0 2px; box-shadow: none; }
.btn:disabled { opacity: .38; }
.btn.armed { animation: pulse .9s infinite; }
.btn.nudge { animation: pulse .9s 3; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--gold), 0 0 18px var(--gold); } }

.log { display: none; min-height: 0; margin: 0; padding: 8px 10px; list-style: none; flex-direction: column; gap: 4px; overflow: hidden; border-radius: 14px; background: #00000030; box-shadow: inset 0 0 0 1px #ffffff12; font-size: 12.5px; font-weight: 700; color: var(--muted); -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.log li { display: flex; align-items: center; gap: 6px; line-height: 1.3; }
.log .lav { flex-shrink: 0; width: 20px; text-align: center; }
.log b { font-weight: 900; color: var(--text); }
.log b.r { color: #ff8796; }
.log li.hot { color: var(--gold); }
.log li.good { color: var(--jade); }
.log li.sep { justify-content: center; padding-top: 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .75; }

.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: #12040ac4; }
.overlay[hidden] { display: none; }
.panel { width: min(420px, 100%); max-height: calc(100% - 16px); overflow-y: auto; padding: 20px 18px; border-radius: 20px; background: linear-gradient(#5a1824, #2c0a12); box-shadow: 0 0 0 1px #ffffff1c, 0 20px 50px #000a; text-align: center; animation: pop .3s; }
@keyframes pop { from { scale: .3; opacity: 0; } }
.panel h2 { font-size: 22px; font-weight: 900; color: var(--gold); }
.panel .sub { margin-top: 2px; font-size: 13px; font-weight: 800; color: var(--text); }
.panel p { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.panel .btn { width: 100%; margin-top: 16px; }
.panel .btn + .btn { margin-top: 10px; }
.panel .lbl { margin-top: 14px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fan { --cw: 40px; display: flex; justify-content: center; height: 60px; margin-bottom: 6px; }
.fan .card:nth-child(1) { rotate: -14deg; translate: 6px 6px; }
.fan .card:nth-child(3) { rotate: 14deg; translate: -6px 6px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: #00000040; }
.seg button { flex: 1; min-width: 0; padding: 8px 4px; border-radius: 9px; font-size: 13.5px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #2b1f04; }
.panel > .seg { margin-top: 8px; }
.toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #00000038; font-size: 13.5px; font-weight: 800; text-align: left; }
.toggle::after { content: ""; flex-shrink: 0; width: 38px; height: 22px; border-radius: 99px; background: #ffffff2a radial-gradient(circle at 11px 50%, #fff 8px, transparent 8.5px); transition: background .2s; }
.toggle[aria-pressed="true"]::after { background: var(--jade-dark) radial-gradient(circle at 27px 50%, #fff 8px, transparent 8.5px); }
.speedrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 6px 6px 6px 12px; border-radius: 12px; background: #00000038; font-size: 14px; font-weight: 800; text-align: left; }
.speedrow .seg button { flex: none; padding: 5px 9px; font-size: 12.5px; }
.warn { font-size: 12.5px !important; color: #ffb27a !important; }
.warn[hidden] { display: none; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 14px; }
.grid > div { padding: 6px; border-radius: 10px; background: #00000038; }
.grid small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); }
.grid strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.panel ul { margin-top: 12px; padding-left: 18px; text-align: left; font-size: 13px; line-height: 1.55; color: var(--muted); }
.panel li + li { margin-top: 6px; }
.panel .link { margin-top: 12px; font-size: 13px; font-weight: 800; color: var(--muted); text-decoration: underline; }
.big { font-size: 44px; line-height: 1.1; }
.rows { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; text-align: left; }
.rrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; align-items: center; column-gap: 8px; padding: 6px 8px; border-radius: 12px; background: #00000038; }
.rrow.me { box-shadow: inset 0 0 0 1.5px #f7c64f66; }
.rrow .av { width: 28px; height: 28px; }
.rrow .rn { min-width: 0; font-size: 13.5px; font-weight: 900; line-height: 1.25; }
.rrow .rn span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .rn small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); white-space: normal; }
.rrow .rp { padding: 2px 8px; border-radius: 99px; background: #ffffff1c; font-size: 11px; font-weight: 900; white-space: nowrap; }
.rrow .rp.p0 { background: var(--gold); color: #2b1f04; }
.rrow .rd { min-width: 44px; text-align: right; font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
.rrow .rd.up { color: var(--jade); }
.rrow .rd.down { color: var(--lose); }
.rrow .rd small { display: block; font-size: 10.5px; font-weight: 800; color: var(--muted); }
.left { --cw: 22px; grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
.left:empty { display: none; }
.left .card { box-shadow: 0 0 0 .5px #0005; }
.left .ix { font-size: 9px; letter-spacing: -.04em; }
.left .pip { display: none; }

@media (max-height: 620px) {
  .btn { height: 42px; }
}
/* Small portrait frames: slimmer header, HUD and controls so the table keeps its height. */
@media (max-height: 560px) and (max-aspect-ratio: 5/4) {
  .app { gap: 6px; }
  .pill, .icon { height: 30px; }
  .icon { width: 30px; }
  .stat { padding: 2px 3px 3px; }
  .stat strong { font-size: 14px; }
  .msg { min-height: 17px; font-size: 12.5px; }
  .btn { height: 38px; font-size: 14px; }
}
@media (max-width: 360px) {
  .stat small { letter-spacing: 0; }
  .btn { padding: 0 3px; font-size: 13.5px; }
  .controls { gap: 5px; }
}
/* Wide frames: the table takes the full height on the left; HUD, play log and buttons move to a side column. */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: 1680px; display: grid; grid-template-columns: minmax(0, 1fr) clamp(220px, 26vw, 330px); grid-template-rows: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "felt top" "felt hud" "felt log" "felt msg" "felt controls"; column-gap: 12px; row-gap: 8px; }
  .top { grid-area: top; }
  .hud { grid-area: hud; }
  .felt { grid-area: felt; }
  .log { grid-area: log; display: flex; }
  .msg { grid-area: msg; min-height: 36px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; line-height: 1.3; font-size: 13.5px; }
  .controls { grid-area: controls; grid-template-columns: 1fr 1fr; grid-template-areas: "pass play" "sort hint"; }
  #passBtn { grid-area: pass; }
  #playBtn { grid-area: play; }
  #sortBtn { grid-area: sort; }
  #hintBtn { grid-area: hint; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 480px) {
  .app { row-gap: 6px; column-gap: 10px; }
  .top h1 { font-size: 19px; }
  .pill, .icon { height: 30px; }
  .icon { width: 30px; }
  .stat { padding: 2px 3px 3px; }
  .stat strong { font-size: 14px; }
  .msg { min-height: 0; font-size: 12.5px; }
  .btn { height: 36px; font-size: 14px; }
  .log { padding: 6px 8px; font-size: 11.5px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 360px) {
  .top h1 { display: none; }
  .top .pill { margin-right: auto; }
}
/* Short screens: compact panels so the main button stays reachable. */
@media (max-height: 560px) {
  .overlay { padding: 8px; }
  .panel { width: min(540px, 100%); padding: 12px 16px; border-radius: 16px; }
  .panel .big, .panel .fan { display: none; }
  .panel h2 { font-size: 19px; }
  .panel p { margin-top: 4px; font-size: 13px; line-height: 1.4; }
  .panel .lbl { margin-top: 8px; }
  .seg button { padding: 6px 4px; }
  .panel .btn { height: 38px; margin-top: 10px; }
  .panel .btn + .btn { margin-top: 8px; }
  .panel > .btn:last-child { position: sticky; bottom: 0; }
  .toggle, .speedrow { margin-top: 6px; padding-top: 7px; padding-bottom: 7px; }

  // ---------- computer players ----------
  // Best split of a hand into combinations (rank counts only). Lower cost = fewer, stronger combinations; 2s and bombs are worth keeping.
  const splitMemo = new Map();

  // What the unseen cards could do against a combination: best top per kind, and the biggest bombs.
  function threatOf(cards, maxN) {

    if ((c.type === 'pair' && two) || (c.type === 'pairs' && c.len === 3)) return th.quad || th.pr >= 4;
    if (c.type === 'quad') return th.pr >= 4;

  // Only public information plus the player's own hand: cards played, hand sizes, passes.
  function viewFor(S, p) {

  function easyPick(v) {
    const moves = legalMoves(v.hand, v.table, v.opening);

    if (v.table) {
      if (Math.random() < 0.2) return null;
      moves.sort((a, b) => (isBomb(a.c) - isBomb(b.c)) || a.c.top - b.c.top);
      const m = moves[0];
      if (rk(m.c.top) === TWO && Math.random() < 0.5) return null;
      return m.cards;
    }
    const low = v.hand[0];
    if (Math.random() < 0.45) return [low];

    withLow.sort((a, b) => b.c.n - a.c.n || a.c.top - b.c.top);

  // Per-level play style. Normal forgets played cards and blocks only late; Hard tracks every card and defends earlier.
  const AI = {
    1: { memory: false, spend: [0.3, 0.06], danger: 2, urgent: 2, press: 1.5, noise: 0.05 },
    2: { memory: true, spend: [0.15, 0.05], danger: 4, urgent: 13, press: 1.5, noise: 0 },
  };
  // Scores every legal play (lower is better) plus the value of passing.
  function evaluate(v, level) {

    const me = v.me;

    const spend = cfg.spend[0] + cfg.spend[1] * oppMin;

      if (c.n === v.hand.length) { scored.push({ m, val: -100 }); continue; }

      const sub = splitCost(cnt);
      for (const x of m.cards) cnt[rk(x)]++;

      else if (rk(c.top) === TWO) val += spend * c.n;

  // ---------- stats & settings ----------

  // ---------- table state ----------

  async function runGame() {

  function nextGame() {

  }

  function play() {

    const r = resolveHuman;
    resolveHuman = null;
    r(cards);
  }

    resolveHuman = null;

  }

  function nudge(el) {

  }

  function selInfo() {
    if (!S || !selected.size) return null;
    const cards = [...selected].sort(byNum);

    if (!c) return { ok: false, msg: t.selInvalid };
    if (S.opening && !cards.includes(0)) return { ok: false, msg: t.selNeed3 };
    if (S.table && !beats(c, S.table)) return { ok: false, msg: t.selWeak };
    return { ok: true, c, msg: t.selOk(t.combo(c.type, c.len)) };

  // ---------- events → table effects ----------
  function cardsHtml(cards) {

  }
  function log(p, html, cls = '') {

  function showEvents(ev) {

        log(e.p, `${t.combo(e.combo.type, e.combo.len)} ${cardsHtml(e.combo.cards)}`);

  function boom(text) {

  function bump(id) {

    void el.offsetWidth;
    el.classList.add('bump');
  }

  // ---------- rendering ----------
  function cardEl(c, asButton = false) {
    const el = document.createElement(asButton ? 'button' : 'div');
    el.className = `card${su(c) >= 2 ? ' red' : ''}${rk(c) === TWO ? ' two' : ''}`;
    el.innerHTML = `<span class="ix">${RANKS[rk(c)]}<i>${SUITS[su(c)]}</i></span><span class="pip">${SUITS[su(c)]}</span>`;
    if (asButton) {

    return ['', ''];
  }
  function renderSeats() {
    for (let p = 1; p < 4; p++) {
      const el = SEATS[p];
      const n = S ? S.hands[p].length : 13;
      const pts = match ? match.totals[p] : 0;
      el.querySelector('.cnt').textContent = n;
      el.querySelector('.backs').classList.toggle('none', n === 0);
      el.querySelector('.pts').textContent = sgn(pts);
      const [txt, cls] = tagFor(p);
      const tag = el.querySelector('.tag');
      if (tag.textContent !== txt) { tag.textContent = txt; tag.className = `tag ${cls}`; }
      const active = !!S && !S.over && S.turn === p && phase === 'ai';
      el.classList.toggle('turn', active);
      el.classList.toggle('thinking', active);
      el.classList.toggle('done', !!S && S.out[p]);
      el.setAttribute('aria-label', t.seatAria(NAMES[p], n, pts));
    }
  }
  function renderHud() {
    $('hudPts').textContent = match ? sgn(match.totals[0]) : '0';
    $('hudGame').textContent = match ? `${match.gameNo}/${match.games}` : '–';
    let lead = '–';
    if (match && match.totals.some(x => x)) {
      const top = Math.max(...match.totals);
      const who = [0, 1, 2, 3].filter(p => match.totals[p] === top);
      lead = who.length === 1 ? NAMES[who[0]] : '–';
    }
    $('hudLead').textContent = lead;
    $('matchLbl').textContent = t.levels[match ? match.level : settings.level];
  }
  function renderControls() {
    const you = phase === 'you';
    const info = selInfo();
    const ok = you && !!info && info.ok;
    $('playBtn').disabled = !ok;
    $('playBtn').classList.toggle('armed', ok);
    $('passBtn').disabled = !(you && S && S.table);
    $('hintBtn').disabled = !you;
    $('sortBtn').disabled = !S || !S.hands[0].length;
    const mine = $('mine');
    mine.classList.toggle('turn', you);
    mine.classList.toggle('off', !!S && (S.out[0] || (S.passed[0] && !!S.table)));
    const [txt, cls] = tagFor(0);
    const tag = $('myTag');
    if (tag.textContent !== txt) { tag.textContent = txt; tag.className = `tag mytag ${cls}`; }
  }
  function setMsg(text, cls = '') {
    const m = $('msg');
    m.textContent = text;
    m.className = `msg ${cls}`;
  }
  function updateMsg() {
    if (!S || S.over || phase === 'deal') { setMsg(''); return; }
    if (phase === 'you') {
      const info = selInfo();
      if (info) { setMsg(info.msg, info.ok ? 'good' : 'bad'); return; }
      if (!S.table) { setMsg(S.opening ? t.leadFirst : t.yourLead); return; }
      const can = legalMoves(S.hands[0], S.table, false).length > 0;
      setMsg(can ? t.beatOr(t.combo(S.table.type, S.table.len)) : t.cantBeat, can ? '' : 'bad');
      return;
    }
    if (S.frozen.includes(0)) setMsg(t.youFrozen, 'bad');
    else if (S.out[0]) setMsg(t.youOut(t.places[S.order.indexOf(0)]), 'good');
    else if (S.passed[0] && S.table) setMsg(t.youPassed);
    else if (phase === 'ai') setMsg(t.thinking(NAMES[S.turn]));
  }
  function render(deal = false) {
    renderSeats();
    renderHud();
    renderPile();
    renderHand(deal);
    renderControls();
    updateMsg();
  }

  function layout() {
    const W = felt.clientWidth, H = felt.clientHeight;
    if (!W || !H) return;
    const wide = W / H > 1.25;
    const short = H < 360;
    felt.classList.toggle('wide', wide);
    felt.classList.toggle('big', W >= 640 && H >= 520);
    const sw = wide ? clamp(W * 0.13, 92, 170) : clamp(W * 0.2, 62, 120);
    cwNow = Math.round(clamp(Math.min((W - 20) / 6.4, (H * (short ? 0.3 : 0.25)) / 1.4), 30, 104));
    felt.style.setProperty('--sw', `${Math.round(sw)}px`);
    felt.style.setProperty('--cw', `${cwNow}px`);
    felt.style.setProperty('--pw', `${Math.round(clamp(cwNow * 0.9, 30, 94))}px`);
    felt.style.setProperty('--bw', `${Math.round(clamp(cwNow * 0.36, 15, 32))}px`);
    spaceHand();
    spacePile();
  }

  // ---------- panels ----------
  let panelReturn = null;
  function openPanel(id) {
    if (!$(id).hidden) return;
    panelReturn = document.activeElement;
    if (id === 'statsPanel') fillStats();
    if (id === 'lobbyPanel') fillLobby();
    $(id).hidden = false;
    const target = id === 'lobbyPanel' ? $('startBtn') : $(id).querySelector('.btn') || $(id).querySelector('button');
    target.focus({ preventScroll: true });
  }
  function closePanel(el) {
    el.hidden = true;
    if (panelReturn && panelReturn.focus && document.contains(panelReturn)) panelReturn.focus({ preventScroll: true });
  }
  const running = () => !!match && phase !== 'over';
  const lobby = { level: settings.level, games: settings.games, instant: settings.instant };
  function fillLobby() {
    Object.assign(lobby, { level: settings.level, games: settings.games, instant: settings.instant });
    paintLobby();
    $('leaveWarn').hidden = !running();
    $('cancelBtn').hidden = !running();
  }
  function paintLobby() {
    $('lvlSeg').innerHTML = [0, 1, 2].map(l => `<button type="button" data-level="${l}" aria-pressed="${l === lobby.level}">${t.levels[l]}</button>`).join('');
    $('gamesSeg').innerHTML = MATCH_SIZES.map(n => `<button type="button" data-games="${n}" aria-pressed="${n === lobby.games}">${t.gamesN(n)}</button>`).join('');
    $('instantToggle').setAttribute('aria-pressed', String(lobby.instant));
  }
  function fillStats() {
    const rows = [['sMatches', stats.matches], ['sMatchWins', stats.matchWins], ['sGames', stats.games], ['sFirsts', stats.firsts], ['sChops', stats.chops], ['sInstant', stats.instants]];
    let html = rows.map(([k, v]) => `<div><small>${t[k]}</small><strong>${v}</strong></div>`).join('');
    html += `<div><small>${t.sBest}</small><strong>${stats.best == null ? t.none : sgn(stats.best)}</strong></div>`;
    html += `<div><small>${t.sFirsts} %</small><strong>${stats.games ? Math.round((stats.firsts / stats.games) * 100) : 0}%</strong></div>`;
    $('statsGrid').innerHTML = html;
    $('speedSeg').innerHTML = Object.keys(SPEEDS).map(k => `<button type="button" data-speed="${k}" aria-pressed="${k === settings.speed}">${t.speeds[k]}</button>`).join('');
  }
  function whyText(why) {
    return ['place', 'chop', 'frozen', 'stuck', 'instant'].filter(k => why[k]).map(k => `${t.why[k]} ${sgn(why[k])}`).join(' · ');
  }
  function resultRow(p, placeHtml, delta, sub, total, leftCards) {
    const dcls = delta > 0 ? 'up' : delta < 0 ? 'down' : '';
    return `<div class="rrow${p === 0 ? ' me' : ''}"><span class="av">${AVATARS[p]}</span><div class="rn"><span>${NAMES[p]}</span><small>${sub}</small></div>${placeHtml}<b class="rd ${dcls}">${sgn(delta)}<small>${t.total} ${sgn(total)}</small></b><div class="left" data-left="${leftCards.join(',')}"></div></div>`;
  }
  function fillLeft(box) {
    box.querySelectorAll('[data-left]').forEach(el => {
      const cards = el.dataset.left ? el.dataset.left.split(',').map(Number) : [];
      el.replaceChildren(...cards.map(c => cardEl(c)));
    });
  }
  function showResult(res) {
    const myPlace = S.order.indexOf(0);
    const inst = S.instant;
    $('resIcon').textContent = inst ? '⚡' : ['🏆', '🥈', '🥉', '🃏'][myPlace];
    $('resTitle').textContent = inst ? t.resInstant(NAMES[inst.p], t.instantKinds[inst.kind]) : myPlace === 0 ? t.resWin : t.resPlace(t.places[myPlace]);
    $('resText').textContent = t.resText(match.gameNo, match.games);
    $('resRows').innerHTML = S.order.map((p, i) => {
      const label = S.frozen.includes(p) ? t.tagFrozen : inst && i ? '' : t.places[i];
      const placeHtml = label ? `<span class="rp${i === 0 ? ' p0' : ''}">${label}</span>` : '<span></span>';
      const shown = inst && p === inst.p ? S.hands[p] : p === 0 ? [] : S.hands[p];
      return resultRow(p, placeHtml, res.d[p], whyText(res.why[p]), match.totals[p], shown);
    }).join('');
    fillLeft($('resRows'));
    $('nextBtn').textContent = match.gameNo < match.games ? t.next : t.finalBtn;
    announce(`${$('resTitle').textContent} ${sgn(res.d[0])}`);
    openPanel('resPanel');
  }
  function showMatchOver() {
    phase = 'over';
    const tot = match.totals;
    const ranking = [0, 1, 2, 3].sort((a, b) => tot[b] - tot[a] || a - b);
    const placeOf = p => [0, 1, 2, 3].filter(q => tot[q] > tot[p]).length;
    const mine = placeOf(0);
    const win = mine === 0;
    stats.matches++;
    if (win) stats.matchWins++;
    stats.best = stats.best == null ? tot[0] : Math.max(stats.best, tot[0]);
    save();
    $('overIcon').textContent = win ? '🏆' : ['', '🥈', '🥉', '🃏'][mine];
    $('overTitle').textContent = win ? t.matchWin : t.matchLose(t.places[mine]);
    $('overText').textContent = t.matchText(sgn(tot[0]), match.games);
    $('overRows').innerHTML = ranking.map(p => {
      const i = placeOf(p);
      const dcls = tot[p] > 0 ? 'up' : tot[p] < 0 ? 'down' : '';
      return `<div class="rrow${p === 0 ? ' me' : ''}"><span class="av">${AVATARS[p]}</span><div class="rn"><span>${NAMES[p]}</span></div><span class="rp${i === 0 ? ' p0' : ''}">${t.places[i]}</span><b class="rd ${dcls}">${sgn(tot[p])}</b></div>`;
    }).join('');
    announce(`${$('overTitle').textContent} ${$('overText').textContent}`);
    render();
    openPanel('overPanel');
  }

  // ---------- input ----------
  function setSelected(c, on) {
    if (on) selected.add(c); else selected.delete(c);
    const el = handEl.querySelector(`[data-c="${c}"]`);
    if (el) { el.classList.toggle('sel', on); el.setAttribute('aria-pressed', String(on)); }
    hints = hints && phase === 'you' ? hints : null;
    renderControls();
    updateMsg();
  }
  function cardIndex(el) { return [...handEl.children].indexOf(el); }
  function setFocus(i) {
    const n = handEl.children.length;
    if (!n) return;
    focusIdx = clamp(i, 0, n - 1);
    [...handEl.children].forEach((el, k) => { el.tabIndex = k === focusIdx ? 0 : -1; });
    handEl.children[focusIdx].focus({ preventScroll: true });
  }
  let drag = null;
  handEl.addEventListener('pointerdown', e => {
    const el = e.target.closest('.card');
    if (!el || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    const c = Number(el.dataset.c);
    const on = !selected.has(c);
    focusIdx = cardIndex(el);
    [...handEl.children].forEach((x, k) => { x.tabIndex = k === focusIdx ? 0 : -1; });
    setSelected(c, on);
    drag = { id: e.pointerId, on, last: c };
    try { handEl.setPointerCapture(e.pointerId); } catch {}
  });
  handEl.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const el = hit && hit.closest && hit.closest('#hand .card');
    if (!el) return;
    const c = Number(el.dataset.c);
    if (c === drag.last) return;
    drag.last = c;
    if (selected.has(c) !== drag.on) setSelected(c, drag.on);
  });
  const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
  handEl.addEventListener('pointerup', endDrag);
  handEl.addEventListener('pointercancel', endDrag);
  handEl.addEventListener('click', e => { if (e.detail === 0) e.preventDefault(); });
  handEl.addEventListener('focusin', e => { const el = e.target.closest('.card'); if (el) focusIdx = cardIndex(el); });

  $('playBtn').addEventListener('click', play);
  $('passBtn').addEventListener('click', pass);
  $('hintBtn').addEventListener('click', hint);
  $('sortBtn').addEventListener('click', toggleSort);
  $('matchBtn').addEventListener('click', () => openPanel('lobbyPanel'));
  $('statsBtn').addEventListener('click', () => openPanel('statsPanel'));
  $('helpBtn').addEventListener('click', () => openPanel('helpPanel'));
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closePanel(b.closest('.overlay'))));
  $('lvlSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-level]');
    if (!b) return;
    lobby.level = Number(b.dataset.level);
    paintLobby();
    $('lvlSeg').querySelector(`[data-level="${lobby.level}"]`).focus({ preventScroll: true });
  });
  $('gamesSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-games]');
    if (!b) return;
    lobby.games = Number(b.dataset.games);
    paintLobby();
    $('gamesSeg').querySelector(`[data-games="${lobby.games}"]`).focus({ preventScroll: true });
  });
  $('instantToggle').addEventListener('click', () => { lobby.instant = !lobby.instant; paintLobby(); });
  $('startBtn').addEventListener('click', () => {
    Object.assign(settings, lobby);
    saveSettings();
    $('lobbyPanel').hidden = true;
    startMatch();
    $('playBtn').focus({ preventScroll: true });
  });
  $('cancelBtn').addEventListener('click', () => closePanel($('lobbyPanel')));
  $('nextBtn').addEventListener('click', nextGame);
  $('againBtn').addEventListener('click', () => { $('overPanel').hidden = true; openPanel('lobbyPanel'); });
  $('speedSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-speed]');
    if (!b) return;
    settings.speed = b.dataset.speed;
    saveSettings();
    fillStats();
    $('speedSeg').querySelector(`[data-speed="${settings.speed}"]`).focus({ preventScroll: true });
  });
  $('resetStats').addEventListener('click', () => {
    Object.assign(stats, defaultStats());
    save();
    fillStats();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector('.overlay:not([hidden])')) return;
    const key = e.key.toLowerCase();
    const onCard = !!(e.target.closest && e.target.closest('#hand .card'));
    const onButton = e.target instanceof HTMLButtonElement && !onCard;
    const focusedCard = handEl.children[focusIdx];
    if (key === 'arrowleft' || key === 'arrowright') {
      if (!handEl.children.length) return;
      e.preventDefault();
      setFocus(onCard ? focusIdx + (key === 'arrowright' ? 1 : -1) : focusIdx);
    } else if ((key === 'arrowup' || key === 'arrowdown') && onCard) {
      e.preventDefault();
      setSelected(Number(focusedCard.dataset.c), key === 'arrowup');
    } else if (key === ' ' && onCard) {
      e.preventDefault();
      setSelected(Number(focusedCard.dataset.c), !selected.has(Number(focusedCard.dataset.c)));
    } else if (key === 'enter' && !onButton) {
      if (phase === 'you') { e.preventDefault(); play(); }
    } else if (key === 'p') { e.preventDefault(); pass(); }
    else if (key === 'h') { e.preventDefault(); hint(); }
    else if (key === 's') { e.preventDefault(); if (S && S.hands[0].length) toggleSort(); }
  });

  for (let p = 1; p < 4; p++) {
    SEATS[p].innerHTML = `<div class="backs" aria-hidden="true"><i></i><i></i><b class="cnt">13</b></div><div class="plate"><span class="av" aria-hidden="true">${AVATARS[p]}</span><span class="who"><span class="nm">${NAMES[p]}</span><b class="pts">0</b></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="tag"></span></div>`;
  }
  $('fan').replaceChildren(...[0, 51, 46].map(c => cardEl(c)));

  new ResizeObserver(() => { layout(); }).observe(felt);
  layout();
  render();
  openPanel('lobbyPanel');

  // Test hook: lets automated checks rig deals, speed up timers, auto-play your seat and run engine-only simulations; harmless for players.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__tl = {
    get S() { return S; }, get phase() { return phase; }, get match() { return match; }, get stats() { return stats; }, get selected() { return [...selected]; },
    get lastRes() { return lastRes; },
    classify: cards => classify(cards.slice().sort(byNum)), beats, isChop, chopValue, stuckValue, instantOf, genMoves, legalMoves,
    makeState, applyMove, scoreGame, viewFor, aiChoose, evaluate, findInstant, applyInstant,
    tune(level, cfg) { AI[level] = Object.assign({}, AI[level], cfg); },
    rig(hands) { rigHands = hands; }, speed(x) { delayScale = x; }, autoHuman(level) {
      humanAuto = level;
      if (level != null && resolveHuman) { const r = resolveHuman; resolveHuman = null; selected.clear(); r(aiChoose(viewFor(S, 0), level)); }
    },
    select(cards) { selected.clear(); cards.forEach(c => selected.add(c)); renderHand(); renderControls(); updateMsg(); },
    play, pass, hint, next: nextGame, start: startMatch,
    simulate(levels, games, instant = false) {
      const res = { pts: [0, 0, 0, 0], firsts: [0, 0, 0, 0], lasts: [0, 0, 0, 0], chops: 0, frozen: 0, instants: 0, moves: 0, stuck: 0, maxMs: 0 };
      let leader = -1;
      for (let g = 0; g < games; g++) {
        const deck = shuffle([...Array(52).keys()]);
        const hands = [0, 1, 2, 3].map(i => deck.slice(i * 13, i * 13 + 13));
        const st = makeState(hands, leader < 0 ? hands.findIndex(h => h.includes(0)) : leader, leader < 0);
        const w = instant ? findInstant(st) : null;
        if (w) { applyInstant(st, w); res.instants++; }
        let guard = 0;
        while (!st.over && guard++ < 400) {
          const t0 = performance.now();
          const mv = aiChoose(viewFor(st, st.turn), levels[st.turn]);
          res.maxMs = Math.max(res.maxMs, performance.now() - t0);
          applyMove(st, st.turn, mv);
          res.moves++;
        }
        if (!st.over) { res.stuck++; continue; }
        const sc = scoreGame(st);
        for (let p = 0; p < 4; p++) res.pts[p] += sc.d[p];
        res.firsts[st.order[0]]++;
        res.lasts[st.order[3]]++;
        res.chops += st.chops.length;
        res.frozen += st.frozen.length;
        leader = st.order[0];
      }
      return res;
    },
  };
})();
</script>
</body>
</html>
