<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Shooter</title>
<style>
:root {
  --bg: #1a1030;
  --panel: #2c1a4cf2;
  --text: #fbf3ff;
  --muted: #c7b4e3;
  --accent: #ff7eb6;
  --accent-dark: #c94a86;
  --lemon: #ffd84d;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(ellipse at top, #3a2160, var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lemon); outline-offset: 3px; }

.app { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.hud { display: flex; align-items: center; gap: 6px; max-width: 440px; width: 100%; margin: 0 auto; }
.stat { flex: 1; min-width: 0; padding: 5px 10px; border-radius: 12px; background: #ffffff12; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.25; }
.stat .pink { color: var(--accent); }
.restart { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; background: #ffffff1c; font-size: 22px; font-weight: 900; }
.restart:active { transform: translateY(2px); }
.stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
canvas { display: block; border-radius: 18px; touch-action: none; box-shadow: 0 0 0 1px #ffffff14, 0 20px 44px #0009; }
canvas:focus-visible { outline: 2px solid #ffd84d88; outline-offset: 3px; }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 330px); padding: 24px 20px; border-radius: 24px; background: var(--panel); border: 2px solid #ff7eb655; text-align: center; box-shadow: 0 20px 50px #000a; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.panel h1, .panel h2 { font-size: clamp(30px, 9vw, 40px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; }
.panel h1 span { color: var(--accent); }
.panel h2 { font-size: 28px; }
.panel p { margin-top: 10px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.panel .big { font-size: 20px; font-weight: 800; color: var(--text); }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
.dots i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 12%, var(--c) 45%, color-mix(in srgb, var(--c), #000 35%)); }
.panel button { display: block; margin-top: 16px; width: 100%; padding: 14px; border-radius: 16px; background: var(--accent); color: #2a0d24; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark); }
.panel button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.panel button.ghost { margin-top: 10px; background: transparent; color: var(--text); border: 2px solid #ffffff38; box-shadow: none; font-size: 15px; padding: 11px; }
.panel button[hidden] { display: none; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--lemon); color: #3a2400 !important; font-weight: 800; }
.badge[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="hud">
    <div class="stat"><small data-i18n="score"></small><strong class="pink" id="score">0</strong></div>
    <div class="stat"><small data-i18n="level"></small><strong id="level">1</strong></div>
    <div class="stat"><small data-i18n="best"></small><strong id="best">0</strong></div>
    <button type="button" class="restart" id="restart" data-i18n-label="restart">↻</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
    <div class="overlay" id="start">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <h1 id="start-title">Bubble <span>Shooter</span></h1>
        <div class="dots" aria-hidden="true"><i style="--c:#ff4f7b"></i><i style="--c:#ff9a3d"></i><i style="--c:#ffd84d"></i><i style="--c:#3ee0a1"></i><i style="--c:#45b8ff"></i><i style="--c:#b67cff"></i></div>
        <p data-i18n="tagline"></p>
        <p data-i18n="controls"></p>
        <p id="reached" hidden></p>
        <button type="button" id="play" data-i18n="play"></button>
        <button type="button" class="ghost" id="resume" hidden></button>
      </div>
    </div>
    <div class="overlay" id="clear" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="clear-title">
        <h2 id="clear-title" data-i18n="cleared"></h2>
        <p class="big" id="bonus"></p>
        <p id="clear-score"></p>
        <button type="button" id="next-level"></button>
      </div>
    </div>
    <div class="overlay" id="over" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="over-title">
        <h2 id="over-title" data-i18n="over"></h2>
        <p data-i18n="overText"></p>
        <p class="big" id="final"></p>
        <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
        <button type="button" id="again" data-i18n="again"></button>
      </div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

    els.reached.textContent = t.reached(reached);
    els.resume.hidden = reached < 2;
    els.resume.textContent = t.resume(reached);
    els.resume.dataset.level = String(reached);
    for (const el of [els.clear, els.over]) el.hidden = true;
    els.start.hidden = false;
    updateHud();
    els.play.focus({ preventScroll: true });
  }

  function updateHud() {
    if (game.score > game.best) { game.best = game.score; write(STORE.best, game.best); }
    els.score.textContent = String(game.score);
    els.level.textContent = String(game.level);
    els.best.textContent = String(game.best);
  }

  function setAim(x, y) {
    const dy = Math.min(y, SHOOTER_Y - 8) - SHOOTER_Y;
    game.angle = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, Math.atan2(x - SHOOTER_X, -dy)));
  }

  function canShoot() { return game.state === 'play' && !game.shot && Math.abs(game.viewTop - game.top) < 1; }

  function shoot() {
    if (!canShoot()) return;
    game.shot = { x: SHOOTER_X, y: SHOOTER_Y, vx: Math.sin(game.angle) * SHOT_SPEED, vy: -Math.cos(game.angle) * SHOT_SPEED, color: game.current };
    game.current = game.next;
    game.next = pickColor();
  }

  function swap() {
    if (game.state !== 'play') return;
    [game.current, game.next] = [game.next, game.current];
    game.swapAnim = 1;
    announce(t.loaded(t.colors[game.current]));
  }

  function touching(x, y) {
    const r0 = Math.floor((y - game.top - R) / ROW_H);
    for (let r = Math.max(0, r0 - 1); r <= Math.min(MAX_ROWS - 1, r0 + 2); r++) {
      for (let c = 0; c < rowCols(r); c++) {
        if (game.grid[r][c] >= 0 && Math.hypot(cellX(r, c) - x, cellY(r) - y) < HIT_DIST) return true;
      }
    }
    return false;
  }

  function snapCell(x, y) {
    const guess = Math.max(0, Math.round((y - game.top - R) / ROW_H));
    let best = null, bestDist = Infinity;
    for (let spread = 1; !best && spread < MAX_ROWS; spread += 3) {
      for (let r = Math.max(0, guess - spread); r <= Math.min(MAX_ROWS - 1, guess + spread); r++) {
        for (let c = 0; c < rowCols(r); c++) {
          if (game.grid[r][c] >= 0) continue;
          if (r > 0 && !neighbors(r, c).some(([nr, nc]) => game.grid[nr][nc] >= 0)) continue;
          const dist = Math.hypot(cellX(r, c) - x, cellY(r) - y);
          if (dist < bestDist) { bestDist = dist; best = [r, c]; }
        }
      }
    }
    return best;
  }

  function sameColorGroup(r, c) {
    const color = game.grid[r][c], seen = new Set([`${r},${c}`]), stack = [[r, c]], group = [];
    while (stack.length) {
      const [cr, cc] = stack.pop();
      group.push([cr, cc]);
      for (const [nr, nc] of neighbors(cr, cc)) {
        const key = `${nr},${nc}`;
        if (!seen.has(key) && game.grid[nr][nc] === color) { seen.add(key); stack.push([nr, nc]); }
      }
    }
    return group;
  }

  function removeFloating(animate = true) {
    const seen = new Set(), stack = [];
    for (let c = 0; c < COLS; c++) if (game.grid[0][c] >= 0) { seen.add(`0,${c}`); stack.push([0, c]); }
    while (stack.length) {
      const [r, c] = stack.pop();
      for (const [nr, nc] of neighbors(r, c)) {
        const key = `${nr},${nc}`;
        if (!seen.has(key) && game.grid[nr][nc] >= 0) { seen.add(key); stack.push([nr, nc]); }
      }
    }
    let dropped = 0;
    eachBubble((r, c, color) => {
      if (seen.has(`${r},${c}`)) return;
      if (animate) game.falls.push({ x: cellX(r, c), y: cellY(r), vx: (Math.random() - 0.5) * 80, vy: -60 - Math.random() * 120, color });
      game.grid[r][c] = -1;
      dropped++;
    });
    return dropped;
  }

  function burst(x, y, color) {
    game.pops.push({ x, y, color, t: 0 });
    const count = reducedMotion ? 2 : 6;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 140;
      game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, color: COLORS[color] });
    }
  }

  function floatText(x, y, text) { game.texts.push({ x, y, text, t: 0 }); }

  function land(shot) {
    game.shot = null;
    const cell = snapCell(shot.x, shot.y);
    if (!cell) return lose();
    const [r, c] = cell;
    game.grid[r][c] = shot.color;
    const group = sameColorGroup(r, c);
    if (group.length >= 3) {
      for (const [gr, gc] of group) { burst(cellX(gr, gc), cellY(gr), game.grid[gr][gc]); game.grid[gr][gc] = -1; }
      const dropped = removeFloating();
      const gained = group.length * 10 + dropped * (dropped >= 5 ? 40 : 20);
      game.score += gained;
      floatText(cellX(r, c), cellY(r), `+${gained}`);
      announce(t.popMsg(group.length, dropped));
      updateHud();
    } else {
      game.misses++;
    }
    if (!presentColors().length) return levelClear();
    const limit = missLimit(game.level);
    if (game.misses >= limit) dropCeiling();
    else if (game.misses === limit - 1 && group.length < 3) announce(t.warn);
    if (crossedLine()) return lose();
    refreshColors();
  }

  function dropCeiling() {
    game.misses = 0;
    game.top += ROW_H;
    game.shake = reducedMotion ? 0 : 0.35;
    announce(t.dropped);
  }

  function crossedLine() {
    let crossed = false;
    eachBubble(r => { if (cellY(r) + R > DANGER_Y) crossed = true; });
    return crossed;
  }

  function levelClear() {
    game.state = 'clear';
    const bonus = 200 + game.level * 100;
    game.score += bonus;
    updateHud();
    write(STORE.level, Math.max(read(STORE.level), game.level + 1));
    els.bonus.textContent = t.bonus(bonus);
    els.clearScore.textContent = t.clearScore(game.score);
    els.nextLevel.textContent = t.nextLevel(game.level + 1);
    announce(`${t.cleared} ${t.bonus(bonus)}`);
    setTimeout(() => { if (game.state !== 'clear') return; els.clear.hidden = false; els.nextLevel.focus({ preventScroll: true }); }, 900);
  }

  function lose() {
    game.state = 'over';
    game.shot = null;
    eachBubble((r, c, color) => { game.falls.push({ x: cellX(r, c), y: cellY(r), vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 200 - r * 8, color }); game.grid[r][c] = -1; });
    const isBest = game.score > 0 && game.score >= game.best && game.score > game.startBest;
    els.final.textContent = t.final(game.score, game.level);
    els.newBest.hidden = !isBest;
    announce(`${t.over}. ${t.final(game.score, game.level)}`);
    setTimeout(() => { if (game.state !== 'over') return; els.over.hidden = false; els.again.focus({ preventScroll: true }); }, 1000);
  }

  function stepShot(dt) {
    const s = game.shot;
    const steps = Math.ceil(SHOT_SPEED * dt / 4);
    for (let i = 0; i < steps; i++) {
      s.x += s.vx * dt / steps;
      s.y += s.vy * dt / steps;
      if (s.x < R) { s.x = R; s.vx = Math.abs(s.vx); }
      if (s.x > W - R) { s.x = W - R; s.vx = -Math.abs(s.vx); }
      if (s.y <= game.top + R || touching(s.x, s.y)) { land(s); return; }
    }
  }

  function update(dt) {
    if (game.state === 'play') {
      const turn = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (turn) game.angle = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, game.angle + turn * AIM_SPEED * dt));
      if (game.shot) stepShot(dt);
    }
    // The ceiling slides down visually instead of snapping a whole row at once.
    if (game.viewTop < game.top) game.viewTop = Math.min(game.top, game.viewTop + ROW_H * 5 * dt);
    else game.viewTop = game.top;
    game.shake = Math.max(0, game.shake - dt);
    game.levelBanner = Math.max(0, game.levelBanner - dt);
    game.swapAnim = Math.max(0, game.swapAnim - dt * 6);
    for (const p of game.pops) p.t += dt;
    game.pops = game.pops.filter(p => p.t < 0.2);
    for (const f of game.falls) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 1400 * dt; }
    game.falls = game.falls.filter(f => f.y < H + D);
    for (const p of game.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
    game.particles = game.particles.filter(p => p.life > 0);
    for (const tx of game.texts) tx.t += dt;
    game.texts = game.texts.filter(tx => tx.t < 0.9);
  }

  // Bubbles are pre-rendered once per colour (and per scale) so each frame is just drawImage calls.
  const SPRITE_PAD = 2;
  function shade(hex, amount) {
    const n = parseInt(hex.slice(1), 16);
    const mix = ch => Math.round(amount >= 0 ? ch + (255 - ch) * amount : ch * (1 + amount));
    return `rgb(${mix(n >> 16)}, ${mix((n >> 8) & 255)}, ${mix(n & 255)})`;
  }

  function glyph(g, i, s) {
    g.beginPath();
    if (i === 0) { g.moveTo(0, s * 0.8); g.bezierCurveTo(-s * 1.4, -s * 0.2, -s * 0.5, -s * 1.1, 0, -s * 0.35); g.bezierCurveTo(s * 0.5, -s * 1.1, s * 1.4, -s * 0.2, 0, s * 0.8); }
    else if (i === 1) { for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? s * 0.45 : s; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } }
    else if (i === 2) g.arc(0, 0, s * 0.7, 0, Math.PI * 2);
    else if (i === 3) { g.moveTo(0, -s * 0.85); g.lineTo(s * 0.85, s * 0.6); g.lineTo(-s * 0.85, s * 0.6); }
    else if (i === 4) { g.moveTo(0, -s); g.lineTo(s * 0.75, 0); g.lineTo(0, s); g.lineTo(-s * 0.75, 0); }
    else g.roundRect(-s * 0.65, -s * 0.65, s * 1.3, s * 1.3, s * 0.25);
    g.closePath();
    g.fill();
  }

  function buildSprites() {
    const px = scale * dpr, size = Math.ceil((D + SPRITE_PAD * 2) * px);
    sprites = COLORS.map((color, i) => {
      const sprite = document.createElement('canvas');
      sprite.width = sprite.height = size;
      const g = sprite.getContext('2d');
      g.scale(px, px);
      g.translate(R + SPRITE_PAD, R + SPRITE_PAD);
      const body = g.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R);
      body.addColorStop(0, shade(color, 0.55));
      body.addColorStop(0.45, color);
      body.addColorStop(1, shade(color, -0.35));
      g.fillStyle = body;
      g.beginPath(); g.arc(0, 0, R - 0.5, 0, Math.PI * 2); g.fill();
      g.strokeStyle = shade(color, -0.45); g.lineWidth = 1; g.stroke();
      g.fillStyle = '#ffffff40';
      glyph(g, i, R * 0.32);
      g.fillStyle = '#ffffffc0';
      g.beginPath(); g.ellipse(-R * 0.38, -R * 0.45, R * 0.28, R * 0.16, -0.6, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffffff55';
      g.beginPath(); g.arc(R * 0.42, R * 0.38, R * 0.09, 0, Math.PI * 2); g.fill();
      return sprite;
    });
  }

  function bubble(x, y, color, size = 1, alpha = 1) {
    const s = (D + SPRITE_PAD * 2) * size;
    ctx.globalAlpha = alpha;
    ctx.drawImage(sprites[color], x - s / 2, y - s / 2, s, s);
    ctx.globalAlpha = 1;
  }

  const STARS = Array.from({ length: 34 }, (_, i) => { const rnd = seeded(i + 99); return { x: rnd() * W, y: rnd() * H * 0.8, r: 0.6 + rnd() * 1.2, p: rnd() * 6 }; });

  function drawBackground(time) {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#22134a');
    sky.addColorStop(0.55, '#4a2470');
    sky.addColorStop(1, '#8a3f7c');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    const glow = ctx.createRadialGradient(W / 2, H + 40, 20, W / 2, H + 40, 300);
    glow.addColorStop(0, '#ffb08a66');
    glow.addColorStop(1, '#ffb08a00');
    ctx.fillStyle = glow;
    ctx.fillRect(0, H - 300, W, 300);
    for (const s of STARS) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time / 900 + s.p);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawCeiling(offsetX) {
    const y = game.viewTop;
    ctx.fillStyle = '#1b0f33';
    ctx.fillRect(0, 0, W, y);
    ctx.fillStyle = '#ff7eb6';
    ctx.fillRect(0, y - 4, W, 4);
    ctx.fillStyle = '#ffd84d';
    for (let x = -20 + (offsetX % 20); x < W; x += 20) ctx.fillRect(x, y - 4, 8, 4);
  }

  function aimPath() {
    let x = SHOOTER_X, y = SHOOTER_Y, vx = Math.sin(game.angle), vy = -Math.cos(game.angle), bounced = false;
    const dots = [];
    for (let i = 1; i < 400; i++) {
      x += vx * 4; y += vy * 4;
      if (x < R || x > W - R) {
        if (bounced) break;
        bounced = true; vx = -vx; x = Math.max(R, Math.min(W - R, x));
      }
      if (y <= game.top + R || touching(x, y)) return { dots, end: snapCell(x, y) };
      if (i % 4 === 0 && i > 8) dots.push(x, y);
    }
    return { dots, end: null };
  }

  function drawShooter(time) {
    const pulse = game.state === 'play' && canShoot();
    if (pulse) {
      const { dots, end } = aimPath();
      ctx.fillStyle = COLORS[game.current];
      for (let i = 0; i < dots.length; i += 2) {
        ctx.globalAlpha = 0.9 - (i / dots.length) * 0.6;
        ctx.beginPath(); ctx.arc(dots[i], dots[i + 1], 2.8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (end) {
        ctx.strokeStyle = '#ffffff88';
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cellX(end[0], end[1]), cellY(end[0]), R - 2, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    // Launcher base and barrel.
    ctx.save();
    ctx.translate(SHOOTER_X, SHOOTER_Y);
    ctx.rotate(game.angle);
    const barrel = ctx.createLinearGradient(-9, 0, 9, 0);
    barrel.addColorStop(0, '#c94a86'); barrel.addColorStop(0.5, '#ff9ccb'); barrel.addColorStop(1, '#c94a86');
    ctx.fillStyle = barrel;
    ctx.beginPath(); ctx.roundRect(-9, -50, 18, 46, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#2a1745';
    ctx.beginPath(); ctx.arc(SHOOTER_X, SHOOTER_Y, R + 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ff7eb6'; ctx.lineWidth = 3; ctx.stroke();
    if (!game.shot || game.state !== 'play') bubble(SHOOTER_X, SHOOTER_Y, game.current, 1 - game.swapAnim * 0.3);

    // Next bubble, tappable to swap.
    ctx.fillStyle = '#ffffff14';
    ctx.beginPath(); ctx.arc(NEXT_X, NEXT_Y, R + 6, 0, Math.PI * 2); ctx.fill();
    bubble(NEXT_X, NEXT_Y, game.next, 0.82);
    ctx.fillStyle = '#c7b4e3';
    ctx.font = '800 11px ui-rounded, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`⇄ ${t.next}`, NEXT_X, NEXT_Y + R + 15);

    // Shots left before the ceiling drops.
    const limit = missLimit(game.level), left = limit - game.misses;
    for (let i = 0; i < limit; i++) {
      const x = SHOOTER_X + 62 + (i % 4) * 14, y = SHOOTER_Y + 4 + Math.floor(i / 4) * 14;
      ctx.fillStyle = i < left ? (left === 1 ? `rgba(255, 79, 123, ${0.6 + 0.4 * Math.sin(time / 120)})` : '#ffd84d') : '#ffffff22';
      ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw(time = performance.now()) {
    if (!game || !sprites.length) return;
    ctx.save();
    const shakeX = game.shake > 0 ? Math.sin(time / 18) * 4 * game.shake / 0.35 : 0;
    drawBackground(time);

    // Danger line glows when the wall gets close.
    let lowest = 0;
    eachBubble(r => { lowest = Math.max(lowest, r); });
    const near = cellY(lowest, game.viewTop) + R > DANGER_Y - ROW_H * 2;
    ctx.strokeStyle = near ? `rgba(255, 79, 123, ${0.55 + 0.35 * Math.sin(time / 150)})` : '#ff7eb640';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
    ctx.setLineDash([]);

    ctx.translate(shakeX, 0);
    drawCeiling(time / 60);
    eachBubble((r, c, color) => bubble(cellX(r, c), cellY(r, game.viewTop), color));
    ctx.restore();

    for (const p of game.pops) bubble(p.x, p.y, p.color, 1 + p.t * 2.5, 1 - p.t / 0.2);
    for (const f of game.falls) bubble(f.x, f.y, f.color, 1, 0.9);
    for (const p of game.particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (game.shot) bubble(game.shot.x, game.shot.y, game.shot.color);
    drawShooter(time);

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const tx of game.texts) {
      ctx.globalAlpha = 1 - tx.t / 0.9;
      ctx.font = '900 18px ui-rounded, system-ui, sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = '#2a0d24'; ctx.strokeText(tx.text, tx.x, tx.y - tx.t * 40);
      ctx.fillStyle = '#ffd84d'; ctx.fillText(tx.text, tx.x, tx.y - tx.t * 40);
    }
    ctx.globalAlpha = 1;
    if (game.levelBanner > 0 && game.state === 'play') {
      ctx.globalAlpha = Math.min(1, game.levelBanner * 2);
      ctx.font = '900 34px ui-rounded, system-ui, sans-serif';
      ctx.lineWidth = 6; ctx.strokeStyle = '#2a0d24'; ctx.strokeText(t.levelStart(game.level), W / 2, H * 0.62);
      ctx.fillStyle = '#fff'; ctx.fillText(t.levelStart(game.level), W / 2, H * 0.62);
      ctx.globalAlpha = 1;
    }
  }

  function resize() {
    const stage = $('stage').getBoundingClientRect();
    scale = Math.min(stage.width / W, stage.height / H);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = `${W * scale}px`;
    canvas.style.height = `${H * scale}px`;
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    buildSprites();
    draw();
  }

  let last = performance.now();
  function frame(time) {
    // Clamp dt so a stalled frame or a hidden tab never teleports the shot.
    const dt = Math.min(0.05, Math.max(0, (time - last) / 1000));
    last = time;
    if (!document.hidden) { update(dt); draw(time); }
    requestAnimationFrame(frame);
  }

  function toWorld(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left) / scale, y: (event.clientY - rect.top) / scale };
  }

  canvas.addEventListener('pointerdown', event => {
    if (game.state !== 'play') return;
    const p = toWorld(event);
    if (Math.hypot(p.x - NEXT_X, p.y - NEXT_Y) < R + 14) return swap();
    canvas.setPointerCapture(event.pointerId);
    game.aiming = true;
    setAim(p.x, p.y);
  });
  canvas.addEventListener('pointermove', event => {
    if (game.state !== 'play') return;
    const p = toWorld(event);
    if (game.aiming || (event.pointerType === 'mouse' && p.y < SHOOTER_Y - 8)) setAim(p.x, p.y);
  });
  canvas.addEventListener('pointerup', event => {
    if (!game.aiming) return;
    game.aiming = false;
    // Releasing below the launcher cancels the shot.
    if (toWorld(event).y < SHOOTER_Y - 8) shoot();
  });
  canvas.addEventListener('pointercancel', () => { game.aiming = false; });

  const KEY_DIRS = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
  document.addEventListener('keydown', event => {
    if (game.state !== 'play' || (event.target instanceof Element && event.target.closest('button')) || event.altKey || event.ctrlKey || event.metaKey) return;
    if (KEY_DIRS[event.key]) { keys[KEY_DIRS[event.key]] = true; event.preventDefault(); }
    else if (event.key === ' ' || event.key === 'ArrowUp') { event.preventDefault(); if (!event.repeat) shoot(); }
    else if (event.key === 'x' || event.key === 'X') { event.preventDefault(); swap(); }
  });
  document.addEventListener('keyup', event => { if (KEY_DIRS[event.key]) keys[KEY_DIRS[event.key]] = false; });
  window.addEventListener('blur', () => { keys.left = keys.right = false; });
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  function newRun(level) { game.startBest = read(STORE.best); game.best = game.startBest; startLevel(level, 0); }
  els.play.addEventListener('click', () => newRun(1));
  els.resume.addEventListener('click', () => newRun(Number(els.resume.dataset.level) || 1));
  els.nextLevel.addEventListener('click', () => startLevel(game.level + 1, game.score));
  els.again.addEventListener('click', () => newRun(1));
  $('restart').addEventListener('click', showStart);

  showStart();
  new ResizeObserver(resize).observe($('stage'));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
