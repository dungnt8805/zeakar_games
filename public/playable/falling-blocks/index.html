<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falling Blocks</title>
<style>
:root {
  --bg: #071419;
  --bg2: #0f3a44;
  --panel: #0f2a33;
  --panel2: #16404b;
  --edge: #04100f;
  --text: #eefcf8;
  --muted: #8db8b2;
  --accent: #ffd166;
  --accent-dark: #c99a2e;
  --mint: #4ff3c6;
  --mint-dark: #1fae8a;
  --danger: #ff5d73;
  --cell: 20px;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* ---------- Layout: portrait stacks HUD over [hold | well | next]; wide frames use side columns ---------- */
.app { position: relative; height: 100%; max-width: 620px; margin: auto; display: grid; gap: 8px;
  grid-template-columns: minmax(0, 1fr) var(--wellw, 60%) minmax(0, 1fr);
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "hud hud hud" "hold well next" "extra well next" "pad pad pad";
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.top { grid-area: top; display: flex; align-items: center; gap: 8px; min-width: 0; }
h1 { flex: 1; min-width: 0; font-size: clamp(20px, 6.6vw, 28px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; white-space: nowrap; }
h1 span { color: var(--mint); }
.mode-chip { flex: 0 1 auto; min-width: 0; padding: 5px 10px; border-radius: 99px; background: var(--panel2); color: var(--accent); font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 13px; background: var(--panel); display: grid; place-items: center; box-shadow: 0 3px 0 var(--edge); }
.icon-btn svg { width: 16px; height: 16px; fill: var(--text); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }

.hud { grid-area: hud; display: grid; grid-template-columns: 1.3fr 1fr .9fr 1.2fr; gap: 6px; }
.stat { min-width: 0; padding: 5px 6px; border-radius: 12px; background: var(--panel); text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.stat strong { display: block; font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }

.cap { display: block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.hold { grid-area: hold; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 0; }
.hold .fill { position: relative; width: 100%; height: 40px; }
.hold canvas { position: absolute; top: 0; right: 0; }
.next { grid-area: next; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; min-height: 0; }
.next .fill { position: relative; flex: 1; width: 100%; min-height: 0; }
.next canvas { position: absolute; top: 0; left: 0; }
.keys { display: none; font-size: 12px; line-height: 1.5; color: var(--muted); }
.extra { grid-area: extra; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 0; min-height: 0; overflow: hidden; text-align: right; }
.extra .row { display: none; }
.extra .row.always { display: block; }
.extra .row b { display: block; font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; }
.extra .row .cap { white-space: normal; }

.well-wrap { grid-area: well; position: relative; min-height: 0; min-width: 0; overflow: hidden; display: grid; place-items: center; touch-action: none; cursor: pointer; }
#well { display: block; border-radius: 10px; }
#well:focus, #well:focus-visible { outline: none; }
.callout { position: absolute; left: 0; right: 0; top: 24%; display: grid; justify-items: center; gap: 2px; text-align: center; pointer-events: none; opacity: 0; }
.callout b { max-width: 96%; padding: 2px 8px; font-size: max(15px, calc(var(--cell) * .95)); font-weight: 900; line-height: 1.1; color: #fff; text-shadow: 0 2px 0 #0009, 0 0 16px var(--glow, #4ff3c6); }
.callout b.gold { color: var(--accent); }
.callout span { font-size: max(13px, calc(var(--cell) * .75)); font-weight: 900; color: var(--accent); text-shadow: 0 2px 0 #0009; }
.callout.show { animation: callout 1.3s ease-out forwards; }
@keyframes callout { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.06); } 22% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
.count { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: max(30px, calc(var(--cell) * 2.1)); font-weight: 900; letter-spacing: -.02em; color: #fff; text-shadow: 0 4px 0 #0008, 0 0 24px #4ff3c6aa; }
.count[hidden] { display: none; }
.count.pop { animation: count .55s ease-out both; }
@keyframes count { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: scale(1); } }

.pad { grid-area: pad; display: flex; justify-content: center; gap: 6px; }
.grp { display: contents; }
.grp.act > :first-child { margin-left: 8px; }
.pbtn { flex: 1 1 0; min-width: 0; max-width: 64px; height: 46px; border-radius: 14px; background: var(--panel2); color: var(--text); display: grid; place-items: center; box-shadow: 0 3px 0 var(--edge); touch-action: none; }
.pbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.pbtn.hard { background: var(--mint-dark); }
.pbtn.on { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); filter: brightness(1.25); }
.app.no-pad .pad { display: none; }

/* ---------- Panels ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); background: #04101499; backdrop-filter: blur(2px); }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 400px); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 22px 18px 18px; border-radius: 24px; background: var(--panel); text-align: center; box-shadow: 0 0 0 1px #ffffff17, 0 22px 50px #000b; animation: pop-in .28s ease-out; }
@keyframes pop-in { from { transform: translateY(16px); opacity: 0; } }
.logo-blocks { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; }
.logo-blocks i { width: 16px; height: 16px; border-radius: 4px; background: var(--c); box-shadow: inset 0 -3px 0 #0004, inset 0 2px 0 #fff6; }
.logo-blocks i:nth-child(2n) { transform: translateY(-5px); }
.panel h2 { font-size: clamp(26px, 8vw, 34px); font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
.panel h2 span { color: var(--mint); }
.panel p { margin-top: 8px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.panel .small { font-size: 12px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.mode { display: grid; justify-items: center; align-content: center; gap: 1px; min-width: 0; min-height: 78px; padding: 9px 6px; border-radius: 16px; background: var(--c); color: #082028; box-shadow: 0 4px 0 var(--d); }
.mode b { font-size: 17px; font-weight: 900; line-height: 1.15; }
.mode small { font-size: 11.5px; font-weight: 700; line-height: 1.2; opacity: .85; }
.mode em { margin-top: 3px; padding: 1px 8px; border-radius: 99px; background: #0000001f; font-style: normal; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mode:active, .cta:active, .btn:active { transform: translateY(3px); box-shadow: none; }
.lvl { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; font-size: 14px; font-weight: 800; color: var(--muted); }
.step { width: 36px; height: 36px; border-radius: 11px; background: var(--panel2); color: var(--text); font-size: 20px; font-weight: 900; line-height: 1; }
.step:disabled { opacity: .35; cursor: default; }
.lvl output { min-width: 28px; font-size: 20px; font-weight: 900; color: var(--text); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.cta { flex: 1 1 100%; min-height: 48px; padding: 12px; border-radius: 16px; background: var(--accent); color: #2a1c02; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark); }
.btn { flex: 1 1 120px; min-height: 42px; padding: 9px 10px; border-radius: 14px; background: var(--panel2); color: var(--text); font-size: 15px; font-weight: 800; box-shadow: 0 4px 0 var(--edge); }
.btn[hidden], .cta[hidden] { display: none; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 14px; border-radius: 99px; background: var(--accent); color: #2a1c02 !important; font-size: 13px !important; font-weight: 800; }
.badge[hidden] { display: none; }
.result { color: var(--text) !important; font-size: 24px !important; font-weight: 900; font-variant-numeric: tabular-nums; }
.sum { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.sum div { padding: 6px 8px; border-radius: 12px; background: #ffffff0d; text-align: left; min-width: 0; }
.sum dt { font-size: 10.5px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.sum dd { font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
.set { display: grid; gap: 10px; margin-top: 14px; text-align: left; }
.set label, .set .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; font-weight: 800; }
.set output { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.set input[type=range] { width: 100%; margin-top: 4px; accent-color: var(--mint); height: 26px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 5px; }
.seg button, .tog { min-height: 34px; border-radius: 10px; background: var(--panel2); font-size: 13px; font-weight: 800; }
.seg button[aria-pressed="true"] { background: var(--mint); color: #062018; }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 6px 12px; text-align: left; }
.tog b { flex: 0 0 auto; padding: 2px 9px; border-radius: 99px; background: #ffffff1c; color: var(--muted); font-size: 11.5px; }
.tog[aria-pressed="true"] b { background: var(--mint); color: #062018; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 360px) {
  .hud { gap: 4px; }
  .stat { padding: 4px 4px; }
  .stat strong { font-size: 16px; }
  .stat small { letter-spacing: 0; }
}
@media (max-height: 560px) {
  .panel { padding: 16px 16px 14px; }
  .panel h2 { font-size: 26px; }
  .logo-blocks { display: none; }
  .panel p { font-size: 13px; }
  .modes { margin-top: 10px; }
  .mode { min-height: 64px; padding: 6px; }
  .cta { min-height: 42px; padding: 9px; }
}

/* ---------- Wide frames: well at full height in the middle, side panels for HUD ---------- */
@media (min-aspect-ratio: 1/1) {
  .app { max-width: none; column-gap: clamp(12px, 2.4vw, 32px); row-gap: 10px;
    grid-template-columns: minmax(0, 1fr) var(--wellw, 46vh) minmax(0, 1fr);
    grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    grid-template-areas: "top well next" "hud well next" "hold well next" "extra well next" "pmove well pact"; }
  .top, .hud, .hold, .extra, .grp.move { justify-self: end; width: min(100%, 320px); }
  .next, .grp.act { justify-self: start; width: min(100%, 320px); }
  .top { flex-wrap: wrap; row-gap: 6px; }
  h1 { flex: 1 0 100%; font-size: clamp(22px, 4.2vh, 36px); }
  .mode-chip { flex: 0 1 auto; margin-right: auto; }
  .hud { grid-template-columns: 1fr 1fr; }
  .stat { text-align: left; padding: 6px 10px; }
  .stat strong { font-size: clamp(18px, 3vh, 26px); }
  .hold { align-items: flex-start; }
  .hold canvas { left: 0; right: auto; }
  .extra { align-items: stretch; text-align: left; gap: 0; padding: 4px 0; }
  .extra .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 2px; border-bottom: 1px solid #ffffff12; }
  .extra .row .cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .extra .row b { font-size: 15px; }
  .keys { display: block; }
  .pad { display: contents; }
  .grp { display: flex; gap: 8px; }
  .grp.move { grid-area: pmove; }
  .grp.act { grid-area: pact; }
  .grp.act > :first-child { margin-left: 0; }
  .pbtn { height: 52px; max-width: 72px; }
  .panel.wide-ok { width: min(100%, 640px); }
  .panel.wide-ok .modes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .panel.wide-ok .sum { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (min-aspect-ratio: 1/1) and (max-height: 500px) {
  .extra .row:not(.always) { display: none; }
  .keys { font-size: 11px; line-height: 1.4; }
}
@media (min-aspect-ratio: 1/1) and (max-height: 460px) {
  .app { row-gap: 6px; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; flex: 1 1 auto; }
  .top { flex-wrap: nowrap; }
  .mode-chip { flex: 0 1 auto; padding: 4px 8px; font-size: 11px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 11px; }
  .hud { gap: 4px; }
  .stat { padding: 3px 8px; }
  .stat strong { font-size: 16px; line-height: 1.15; }
  .extra .row { padding: 2px; }
  .extra .row b { font-size: 13px; }
  .keys { display: none; }
  .pbtn { height: 44px; }
  .overlay { padding: 6px; }
  .panel { padding: 12px 14px; border-radius: 18px; }
  .panel h2 { font-size: 22px; }
  .panel p { margin-top: 4px; font-size: 13px; }
  .logo-blocks { display: none; }
  .modes { margin-top: 8px; }
  .mode { min-height: 56px; }
  .mode small { font-size: 11px; }
  .lvl { margin-top: 8px; }
  .actions { margin-top: 8px; }
  .set { gap: 6px; margin-top: 8px; }
  .cta { flex: 2 1 160px; min-height: 40px; font-size: 16px; }
  .btn { min-height: 40px; padding: 7px 10px; }
  .result { font-size: 20px !important; }
  .badge { margin-top: 4px; }
  .sum { gap: 4px; margin-top: 6px; }
  .sum div { padding: 3px 8px; }
  .sum dd { font-size: 14px; }
  #settings .panel { width: min(100%, 640px); }
  .set { grid-template-columns: 1fr 1fr; column-gap: 16px; }
  .seg button, .tog { min-height: 32px; }
}
@media (min-aspect-ratio: 1/1) and (max-height: 460px) and (max-width: 700px) {
  .mode-chip { display: none; }
}
@media (min-aspect-ratio: 1/1) and (max-height: 340px) {
  .extra { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .callout.show { opacity: 1; } }
</style>
</head>
<body>
<main class="app" id="app">
  <div class="top">
    <h1>Falling <span>Blocks</span></h1>
    <span class="mode-chip" id="mode-chip"></span>
    <button type="button" class="icon-btn" id="pause-btn" data-i18n-label="pause"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.6" height="12" rx="1.2"/><rect x="9.4" y="2" width="3.6" height="12" rx="1.2"/></svg></button>
  </div>
  <div class="hud">
    <div class="stat"><small data-i18n="score"></small><strong id="v-score">0</strong></div>
    <div class="stat"><small id="l-lines" data-i18n="lines"></small><strong id="v-lines">0</strong></div>
    <div class="stat"><small data-i18n="level"></small><strong id="v-level">1</strong></div>
    <div class="stat"><small data-i18n="time"></small><strong id="v-time">0:00</strong></div>
  </div>
  <div class="hold"><span class="cap" data-i18n="hold"></span><div class="fill" id="hold-fill"><canvas id="hold-cv" role="img"></canvas></div></div>
  <div class="extra" id="extra">
    <div class="row always"><span class="cap" data-i18n="best"></span><b id="x-best">—</b></div>
    <div class="row"><span class="cap" data-i18n="pieces"></span><b id="x-pieces">0</b></div>
    <div class="row"><span class="cap" data-i18n="pps"></span><b id="x-pps">0.00</b></div>
    <div class="row"><span class="cap" data-i18n="tspins"></span><b id="x-tspins">0</b></div>
    <div class="row"><span class="cap" data-i18n="quads"></span><b id="x-quads">0</b></div>
    <div class="row"><span class="cap" data-i18n="maxCombo"></span><b id="x-combo">0</b></div>
  </div>
  <div class="well-wrap" id="wrap">
    <canvas id="well" tabindex="0" role="img" data-i18n-label="well"></canvas>
    <div class="callout" id="callout" aria-hidden="true"></div>
    <div class="count" id="count" aria-hidden="true" hidden></div>
  </div>
  <div class="next"><span class="cap" data-i18n="next"></span><div class="fill" id="next-fill"><canvas id="next-cv" role="img"></canvas></div><p class="keys" data-i18n="keys"></p></div>
  <div class="pad" id="pad">
    <div class="grp move">
      <button type="button" class="pbtn" data-act="left" data-i18n-label="mvL"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="pbtn" data-act="down" data-i18n-label="soft"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
      <button type="button" class="pbtn" data-act="right" data-i18n-label="mvR"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="grp act">
      <button type="button" class="pbtn" data-act="hold" data-i18n-label="holdBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="13" rx="3"/><path d="M8 3h8"/></svg></button>
      <button type="button" class="pbtn" data-act="ccw" data-i18n-label="rotL"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4L4 8l4 4"/><path d="M4 8h9a6 6 0 1 1-6 6"/></svg></button>
      <button type="button" class="pbtn" data-act="cw" data-i18n-label="rotR"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4l4 4-4 4"/><path d="M20 8h-9a6 6 0 1 0 6 6"/></svg></button>
      <button type="button" class="pbtn hard" data-act="hard" data-i18n-label="hard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l6 6 6-6"/><path d="M6 12l6 6 6-6"/></svg></button>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="menu">
  <div class="panel wide-ok" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="logo-blocks" aria-hidden="true"><i style="--c:#38d6f2"></i><i style="--c:#ffd23f"></i><i style="--c:#b36df2"></i><i style="--c:#55d46c"></i><i style="--c:#ff5468"></i><i style="--c:#4d7cff"></i><i style="--c:#ff9a3c"></i></div>
    <h2 id="menu-title">Falling <span>Blocks</span></h2>
    <p data-i18n="tagline"></p>
    <div class="modes">
      <button type="button" class="mode" id="play-marathon" data-mode="marathon" style="--c:#4ff3c6;--d:#1fae8a"><b data-i18n="marathon"></b><small data-i18n="marathonD"></small><em></em></button>
      <button type="button" class="mode" id="play-sprint" data-mode="sprint" style="--c:#ffd166;--d:#c99a2e"><b data-i18n="sprint"></b><small data-i18n="sprintD"></small><em></em></button>
      <button type="button" class="mode" id="play-ultra" data-mode="ultra" style="--c:#ff8fa3;--d:#d0566c"><b data-i18n="ultra"></b><small data-i18n="ultraD"></small><em></em></button>
      <button type="button" class="mode" id="play-zen" data-mode="zen" style="--c:#9fb8ff;--d:#6380d6"><b data-i18n="zen"></b><small data-i18n="zenD"></small><em></em></button>
    </div>
    <div class="lvl"><span data-i18n="startLevel"></span><button type="button" class="step" id="lvl-down" data-i18n-label="lvlDown">−</button><output id="lvl-out">1</output><button type="button" class="step" id="lvl-up" data-i18n-label="lvlUp">+</button></div>
    <div class="actions"><button type="button" class="btn" id="menu-settings" data-i18n="settings"></button></div>
    <p class="small" id="menu-help"></p>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <h2 id="pause-title" data-i18n="paused"></h2>
    <p class="small" id="pause-help"></p>

    if (inp.dir !== dir) return;
    const other = dir < 0 ? inp.right : inp.left;
    inp.dir = other ? -dir : 0; inp.das = 0; inp.arr = 0; inp.charged = false;
  }
  function releaseAll() { inp.left = inp.right = inp.down = false; inp.dir = 0; inp.das = 0; inp.charged = false; touch.id = null; for (const b of document.querySelectorAll('.pbtn.on')) b.classList.remove('on'); }
  const active = () => G && !G.paused && !overlayOpen() && ['ready', 'play', 'clear'].includes(G.phase);

  function act(name, down) {
    if (name === 'left' || name === 'right') { const d = name === 'left' ? -1 : 1; if (down) press(d); else release(d); return; }
    if (name === 'down') { inp.down = down; if (down && G) G.acc = Math.max(G.acc, softInterval()); return; }
    if (!down) return;
    if (name === 'pause') { if (G && G.paused) resumeGame(); else pauseGame(); return; }
    if (name === 'restart') { if (G) startGame(G.mode); return; }

    else if (name === 'ccw') rotate(-1);

  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down', ArrowUp: 'cw', x: 'cw', X: 'cw', z: 'ccw', Z: 'ccw', Control: 'ccw', ' ': 'hard', c: 'hold', C: 'hold', Shift: 'hold', p: 'pause', P: 'pause', r: 'restart', R: 'restart' };

    const name = KEYS[event.key];
    if (!name || event.altKey || event.metaKey || (event.ctrlKey && event.key !== 'Control')) return;
    if (name === 'pause' && G && G.paused && !els.pause.hidden) { event.preventDefault(); resumeGame(); return; }
    if (!active()) return;
    if (event.target instanceof HTMLButtonElement && !event.target.dataset.act && (event.key === ' ' || event.key === 'Enter')) return;

  });
  document.addEventListener('keyup', event => {

  for (const btn of document.querySelectorAll('[data-act]')) {

      try { btn.setPointerCapture(event.pointerId); } catch {}

    btn.addEventListener('pointercancel', up);
    btn.addEventListener('lostpointercapture', up);

  }

  // Touch / mouse gestures on the well: drag to move, drag down to soft drop, flick down to hard drop, swipe up to hold, tap to rotate.
  const touch = { id: null };
  els.wrap.addEventListener('pointerdown', event => {
    if (!active() || touch.id !== null) return;

  });
  const velocity = () => { const h = touch.hist, a = h[0], b = h[h.length - 1]; const dt = b.t - a.t; return dt > 0 ? { vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt } : { vx: 0, vy: 0 }; };

    if (event.pointerId !== touch.id || touch.done || !active()) return;

    const step = clamp(view.cell * 0.95, 14, 30);
    while (event.clientX - touch.ax >= step) { touch.ax += step; shift(1); touch.moved = true; }
    while (event.clientX - touch.ax <= -step) { touch.ax -= step; shift(-1); touch.moved = true; }

    const { vy } = velocity();
    if (!touch.moved && Math.hypot(dx, dy) < 12 && performance.now() - touch.t0 < 400) {

  els.wrap.addEventListener('pointercancel', event => endTouch(event, true));

  document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAll(); pauseGame(); } last = performance.now(); });

  // ---------- Update ----------
  const softInterval = () => { const g = gravityMs(G.level); return settings.sdf === 0 ? 0 : Math.min(g, g / settings.sdf); };

  function autoShift(dt) {
    if (!inp.dir) return;
    inp.das += dt;
    if (inp.das < settings.das) return;
    if (G.phase !== 'play' || !G.cur) { inp.das = settings.das; return; }
    if (settings.arr === 0) { while (shift(inp.dir)); return; }
    if (!inp.charged) { inp.charged = true; inp.arr = settings.arr; } else inp.arr += dt;
    while (inp.arr >= settings.arr) { inp.arr -= settings.arr; if (!shift(inp.dir)) { inp.arr = 0; break; } }
  }

  function update(dt) {
    for (const f of G.fx) f.life -= dt / (f.kind === 'wipe' ? 600 : f.kind === 'trail' ? 220 : 160);
    G.fx = G.fx.filter(f => f.life > 0);
    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt / 180);
    if (G.phase === 'over') { G.overT += dt; return; }
    if (G.phase === 'menu' || G.paused || overlayOpen()) return;
    autoShift(dt);
    if (G.phase === 'ready') {
      G.phaseT += dt;
      if (G.phaseT >= READY_MS) { G.phase = 'play'; showCount(t.go); setTimeout(() => { if (els.count.textContent === t.go) els.count.hidden = true; }, 520); spawn(); }
      return;
    }
    if (!G.pending) G.time += dt;
    if (G.mode === 'ultra' && G.time >= ULTRA_MS) { G.time = ULTRA_MS; finish('time'); return; }
    if (G.phase === 'clear') {
      G.phaseT -= dt;
      if (G.phaseT <= 0) collapse();
      return;
    }
    const p = G.cur;
    if (!p) return;
    const soft = inp.down;
    const interval = soft ? softInterval() : gravityMs(G.level);
    if (interval <= 0) { while (stepDown()) G.score += 1; }
    else {
      G.acc += dt;
      while (G.acc >= interval) {
        G.acc -= interval;
        if (stepDown()) { if (soft) G.score += 1; } else { G.acc = 0; break; }
      }
    }
    if (grounded()) {
      G.lockT += dt;
      if (G.lockT >= LOCK_MS || G.resets >= MAX_RESETS) lock();
    } else G.lockT = 0;
  }

  // ---------- HUD ----------
  let hudCache = {};
  function setText(key, el, value) { if (hudCache[key] !== value) { hudCache[key] = value; el.textContent = value; } }
  function updateHud(force) {
    if (force) hudCache = {};
    if (!G) return;
    setText('score', els.score, String(G.score));
    setText('lines', els.lines, String(G.mode === 'sprint' ? Math.max(0, SPRINT_LINES - G.lines) : G.lines));
    setText('level', els.level, String(G.level));
    const time = G.mode === 'ultra' ? fmtTime(ULTRA_MS - G.time + 999) : G.mode === 'sprint' ? fmtTime(G.time, true).slice(0, -1) : fmtTime(G.time);
    setText('time', els.time, time);
    setText('best', els.best, G.phase === 'menu' ? '—' : bestText(G.mode));
    setText('pieces', els.pieces, String(G.pieces));
    setText('pps', els.pps, pps());
    setText('tspins', els.tspins, String(G.tspins));
    setText('quads', els.quads, String(G.quads));
    setText('combo', els.combo, String(Math.max(0, G.maxCombo)));
  }

  let calloutTimer = 0;
  function callout(parts, gain) {
    els.callout.innerHTML = parts.map(([text, cls]) => `<b class="${cls}">${text}</b>`).join('') + (gain ? `<span>+${fmt(gain)}</span>` : '');
    els.callout.classList.remove('show'); void els.callout.offsetWidth; els.callout.classList.add('show');
    clearTimeout(calloutTimer);
    if (reduced) calloutTimer = setTimeout(() => { els.callout.classList.remove('show'); }, 1300);
  }

  // ---------- Rendering ----------
  const view = { cell: 20, bw: 4, W: 208, H: 428, dpr: 1, sprites: {} };

  function layout() {
    const app = els.app;
    const cs = getComputedStyle(app);
    const wide = WIDE.matches;
    const innerW = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const gap = parseFloat(cs.columnGap) || 8;
    const wrapH = els.wrap.clientHeight;
    const minSide = wide ? Math.min(230, innerW * 0.24) : 56;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let cell = Math.min(wrapH / 21.4, (innerW - 2 * minSide - 2 * gap) / 10.4);
    cell = Math.max(6, Math.floor(cell * dpr) / dpr);
    const bw = Math.max(2, Math.round(cell * 0.2 * dpr) / dpr);
    view.cell = cell; view.bw = bw; view.dpr = dpr;
    view.W = cell * 10 + bw * 2; view.H = cell * 21 + bw * 2;
    app.style.setProperty('--wellw', `${Math.ceil(view.W)}px`);
    app.style.setProperty('--cell', `${cell}px`);
    sizeCanvas(els.well, ctx, view.W, view.H);
    buildSprites();

    const sideW = Math.max(40, (innerW - view.W - 2 * gap) / 2);
    const capW = wide ? Math.min(sideW, 320) : sideW;
    const holdCell = Math.max(6, Math.min(cell * (wide ? 1 : 0.8), capW / 4.8));
    els.holdFill.style.height = `${Math.ceil(holdCell * 2.9)}px`;
    view.hold = { c: holdCell, W: holdCell * 4.8, H: holdCell * 2.9 };
    sizeCanvas(els.holdCv, hctx, view.hold.W, view.hold.H);
    const nf = els.nextFill.getBoundingClientRect();
    const nextCell = Math.max(5, Math.min(cell * (wide ? 1 : 0.8), capW / 4.8, nf.height / 10.6));
    view.next = { c: nextCell, W: nextCell * 4.8, H: nextCell * 10.6 };
    sizeCanvas(els.nextCv, nctx, view.next.W, view.next.H);
    draw();
    drawSide();
  }

  function sizeCanvas(cv, c, w, h) {
    const dpr = view.dpr;
    cv.style.width = `${w}px`;
    cv.style.height = `${h}px`;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

  function paintBlock(g, x, y, s, color) {

  }

  function buildSprites() {
    const s = view.cell, dpr = view.dpr;
    view.sprites = {};

      cv.width = Math.ceil(s * dpr); cv.height = Math.ceil(s * dpr);

  const cellX = x => view.bw + x * view.cell;

  function drawCell(x, y, key, alpha = 1) {
    if (y < HIDDEN - 1) return;

    ctx.globalAlpha = alpha * (y < HIDDEN ? 0.55 : 1);

  function draw() {

    for (let y = 0; y < ROWS; y++) if (G.board[y].some(Boolean)) { top = y; break; }
    const danger = G.phase !== 'over' && G.phase !== 'menu' && top < HIDDEN + 4;

    ctx.fillStyle = '#061015';
    rr(ctx, bw, s + bw, s * 10, s * 20, bw * 1.2); ctx.fill();

      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 1; x < COLS; x++) { const px = Math.round((bw + x * s) * view.dpr) / view.dpr + 0.5 / view.dpr; ctx.moveTo(px, s + bw); ctx.lineTo(px, s + bw + 20 * s); }
      for (let y = 1; y < 20; y++) { const py = Math.round((s + bw + y * s) * view.dpr) / view.dpr + 0.5 / view.dpr; ctx.moveTo(bw, py); ctx.lineTo(bw + 10 * s, py); }

    for (let y = HIDDEN - 1; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {

        if (v) drawCell(x, y, y >= greyFrom ? 'G' : v);

    }
    // Clearing rows flash, then shrink toward the centre.
    if (G.phase === 'clear') {
      const p = 1 - G.phaseT / CLEAR_MS;
      for (const y of G.clearRows) {
        const yy = cellY(y);

        const shrink = p > 0.45 ? (p - 0.45) / 0.55 : 0;

        ctx.fillRect(bw + (s * 10 - w) / 2, yy, w, s);
      }
    }
    // Ghost and active piece.
    const p = G.cur;
    if (p && G.phase === 'play') {
      if (settings.ghost) {
        const gy = ghostY();
        if (gy !== p.y) {
          ctx.strokeStyle = COLORS[p.type];
          ctx.lineWidth = Math.max(1.5, s * 0.08);
          ctx.globalAlpha = 0.55;
          for (const [cx, cy] of SHAPES[p.type][p.rot]) {
            const y = gy + cy; if (y < HIDDEN) continue;

    for (const f of G.fx) {

        for (const [x, y] of f.cells) if (y >= HIDDEN) { rr(ctx, cellX(x) + 1, cellY(y) + 1, s - 2, s - 2, s * 0.2); ctx.fill(); }
      } else if (f.kind === 'trail') {
        const cols = new Map();

          grad.addColorStop(1, `${f.color}${Math.round(f.life * 110).toString(16).padStart(2, '0')}`);
          ctx.fillStyle = grad;
          ctx.fillRect(cellX(x) + s * 0.2, y0, s * 0.6, y1 - y0);
        }
      } else if (f.kind === 'wipe') {
        ctx.fillStyle = `rgba(79,243,198,${f.life * 0.35})`;
        rr(ctx, bw, s + bw, s * 10, s * 20, bw); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawMini(g, type, cx, cy, c, alpha) {
    const cells = SHAPES[type][0];
    const xs = cells.map(([x]) => x), ys = cells.map(([, y]) => y);
    const w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1;
    const ox = cx - (w * c) / 2 - Math.min(...xs) * c, oy = cy - (h * c) / 2 - Math.min(...ys) * c;
    g.globalAlpha = alpha;
    for (const [x, y] of cells) paintBlock(g, ox + x * c, oy + y * c, c, COLORS[type]);
    g.globalAlpha = 1;
  }

  function drawSide() {
    if (!G || !view.hold) return;
    const h = view.hold;
    hctx.clearRect(0, 0, h.W, h.H);
    hctx.fillStyle = '#0f2a33';
    rr(hctx, 0, 0, h.W, h.H, h.c * 0.6); hctx.fill();
    if (G.hold) drawMini(hctx, G.hold, h.W / 2, h.H / 2, h.c, G.holdUsed ? 0.35 : 1);
    els.holdCv.setAttribute('aria-label', `${t.hold}: ${G.hold || '—'}`);
    const n = view.next;
    nctx.clearRect(0, 0, n.W, n.H);
    nctx.fillStyle = '#0f2a33';
    rr(nctx, 0, 0, n.W, n.H, n.c * 0.6); nctx.fill();
    const list = G.queue.slice(0, 5);
    if (G.phase === 'menu') list.length = 0;
    let y = n.c * 0.4;
    list.forEach((type, i) => {
      const c = i === 0 ? n.c : n.c * 0.72;
      const slot = i === 0 ? n.c * 2.6 : c * 2.5;
      if (i === 0) { nctx.fillStyle = 'rgba(255,255,255,.05)'; rr(nctx, n.c * 0.2, y - n.c * 0.2, n.W - n.c * 0.4, slot, n.c * 0.4); nctx.fill(); }
      drawMini(nctx, type, n.W / 2, y + slot / 2 - (i === 0 ? n.c * 0.2 : 0), c, 1);
      y += slot + (i === 0 ? n.c * 0.2 : 0);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last);
    last = now;
    if (G) {

      updateHud();
      draw();
    }
    requestAnimationFrame(frame);
  }

  // ---------- Wiring ----------
  for (const btn of document.querySelectorAll('.mode')) btn.addEventListener('click', () => startGame(btn.dataset.mode));
  $('lvl-down').addEventListener('click', () => { startLevel = Math.max(1, startLevel - 1); save('startLevel', startLevel); showMenuLevel(); });
  $('lvl-up').addEventListener('click', () => { startLevel = Math.min(15, startLevel + 1); save('startLevel', startLevel); showMenuLevel(); });
  function showMenuLevel() { $('lvl-out').textContent = startLevel; $('lvl-down').disabled = startLevel <= 1; $('lvl-up').disabled = startLevel >= 15; }
  $('menu-settings').addEventListener('click', () => openSettings('menu'));
  $('p-settings').addEventListener('click', () => openSettings('pause'));
  $('s-done').addEventListener('click', () => { if (settingsReturn === 'pause') showOverlay(els.pause, $('resume')); else showMenu(); });
  $('s-reset').addEventListener('click', () => { Object.assign(settings, DEFAULTS); syncSettings(); });
  $('s-das').addEventListener('input', event => { settings.das = Number(event.target.value); syncSettings(); });
  $('s-arr').addEventListener('input', event => { settings.arr = Number(event.target.value); syncSettings(); });
  for (const b of document.querySelectorAll('[data-sdf]')) b.addEventListener('click', () => { settings.sdf = Number(b.dataset.sdf); syncSettings(); });
  for (const [id, key] of [['t-ghost', 'ghost'], ['t-pad', 'pad'], ['t-grid', 'grid']]) $(id).addEventListener('click', () => { settings[key] = !settings[key]; syncSettings(); });
  $('pause-btn').addEventListener('click', () => { if (G && G.paused) resumeGame(); else pauseGame(); });
  $('resume').addEventListener('click', resumeGame);
  $('p-restart').addEventListener('click', () => startGame(G.mode));
  $('p-modes').addEventListener('click', toMenu);
  $('p-end').addEventListener('click', () => { G.paused = false; hideAll(); finish('zen'); });
  $('again').addEventListener('click', () => startGame(G.mode));
  $('o-modes').addEventListener('click', toMenu);

  function toMenu() {
    const mode = G ? G.mode : 'marathon';
    G = makeGame(mode);
    G.phase = 'menu';
    decorate();
    els.chip.textContent = t[mode];
    els.linesLabel.textContent = t.lines;
    els.count.hidden = true;
    updateHud(true);
    drawSide();
    showMenu();
  }

  // A friendly half-built stack behind the start menu.
  function decorate() {
    const rows = ['IIII.TTTOO', 'JJJ..TSSOO', 'J.LLL.SSZZ', 'ZZ.LOO.ZZI', 'SZZ.OOT..I'];
    rows.reverse().forEach((r, i) => { const y = ROWS - 1 - i; [...r].forEach((ch, x) => { G.board[y][x] = ch === '.' ? '' : ch; }); });
    G.board[ROWS - 1] = [...'LLL.SSJJJI'].map(ch => (ch === '.' ? '' : ch));
  }

  // Read-only state for automated tests, plus a board loader used to verify T-spin and all-clear scoring.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__fallingBlocks = {
    state: () => G && {
      mode: G.mode, phase: G.phase, paused: G.paused, result: G.result, score: G.score, lines: G.lines, level: G.level, time: G.time,
      pieces: G.pieces, combo: G.combo, b2b: G.b2b, tspins: G.tspins, quads: G.quads, hold: G.hold, holdUsed: G.holdUsed,
      cur: G.cur && { ...G.cur }, queue: G.queue.slice(0, 5), board: G.board.map(r => r.map(v => v || '.').join('')), overlay: overlays().find(o => !o.hidden)?.id || null,
    },
    load: (rows, queue) => {
      G.board = emptyBoard();
      rows.slice().reverse().forEach((r, i) => { [...r].forEach((ch, x) => { G.board[ROWS - 1 - i][x] = ch === '.' ? '' : 'G'; }); });
      G.queue = [...queue]; refillQueue(); G.cur = null; spawn();
    },
    patch: values => { Object.assign(G, values); },
  };

  new ResizeObserver(layout).observe(els.app);
  WIDE.addEventListener('change', layout);
  syncSettings();
  toMenu();
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
