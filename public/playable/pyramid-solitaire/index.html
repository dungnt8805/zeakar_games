<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pyramid Solitaire</title>
<style>
:root {
  --night: #142a52;
  --night-hi: #24467f;
  --night-dark: #08142c;
  --text: #fbf5e6;
  --muted: #b9c6e4;
  --gold: #f4c34f;
  --gold-dark: #b8861c;
  --sand: #ead7a8;
  --coral: #ef6f4f;
  --coral-dark: #a8402a;
  --mint: #74e3c4;
  --red: #d8323f;
  --black: #1b2238;
  --paper: #fffcf4;
  --chip: #00000036;
  --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background-color: var(--night);
  background-image: radial-gradient(#ffffff14 1px, transparent 1.6px), radial-gradient(120% 90% at 50% 0%, var(--night-hi), var(--night) 50%, var(--night-dark));
  background-size: 23px 19px, 100% 100%;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
.sr { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  height: 100%; max-width: 720px; margin: auto;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "hud" "table" "tools";
  gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}
.top { grid-area: top; display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { flex: 0 0 auto; width: 38px; height: 38px; }
.title { flex: 1; min-width: 0; }
h1 { font-size: clamp(19px, 6vw, 27px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h1 span { color: var(--gold); }
.sub { margin-top: 2px; font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub b { color: var(--gold); }
.hud { grid-area: hud; display: flex; gap: 6px; }
.stat { flex: 1; min-width: 0; padding: 4px 4px 5px; border-radius: 12px; background: var(--chip); text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }

.table { grid-area: table; min-height: 0; min-width: 0; position: relative; isolation: isolate; touch-action: manipulation; }
.slot, .card { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border-radius: var(--r); }
.slot { display: grid; place-items: center; background: #0000002e; box-shadow: inset 0 0 0 1.5px #f4c34f40; color: #f4c34f88; font-size: calc(var(--cw) * .36); font-weight: 900; }
.slot.stock { cursor: pointer; }
.slot small { position: absolute; bottom: -16px; left: 0; right: 0; text-align: center; font-size: 11px; line-height: 14px; color: var(--muted); font-weight: 800; white-space: nowrap; }
.card { padding: 0; background: var(--paper); color: var(--black); box-shadow: 0 1px 2px #00000080, 0 0 0 .5px #00000030; transition: transform .25s cubic-bezier(.25, .8, .35, 1), opacity .25s, box-shadow .15s; will-change: transform; overflow: hidden; cursor: default; }
.card.red { color: var(--red); }
.card.live { cursor: pointer; }
.idx { position: absolute; left: 7%; top: 2%; display: flex; flex-direction: column; align-items: center; font-size: calc(var(--cw) * .36); font-weight: 900; line-height: 1.02; letter-spacing: -.06em; }
.idx svg { width: calc(var(--cw) * .26); height: calc(var(--cw) * .26); }
.big { position: absolute; right: 8%; bottom: 7%; width: 52%; height: auto; }
.face .big { width: 40%; right: 6%; bottom: 5%; }
.face .letter { position: absolute; left: 30%; top: 22%; font-family: Georgia, "Times New Roman", serif; font-size: calc(var(--cw) * .62); font-weight: 700; line-height: 1; }
.back { position: absolute; inset: 0; display: none; border-radius: inherit; background: repeating-linear-gradient(45deg, #ef6f4f 0 3px, #d65a3c 3px 6px); box-shadow: inset 0 0 0 calc(var(--cw) * .06) #fffcf4; }
.back::after { content: ""; position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1; translate: -50% -50%; background: var(--gold); clip-path: polygon(50% 8%, 96% 88%, 4% 88%); opacity: .9; }
.card.down .back { display: block; }
.card.sel { box-shadow: 0 0 0 3px var(--gold), 0 8px 18px #000a; }
.card.hint, .slot.hint { box-shadow: 0 0 0 3px var(--mint), 0 0 18px var(--mint); }
.card.gone { opacity: 0; pointer-events: none; }
.card.shake { animation: shake .3s; }
@keyframes shake { 20%, 60% { translate: -4px 0; } 40%, 80% { translate: 4px 0; } }
.table.instant .card { transition: none; }
.toast { position: absolute; left: 50%; top: 4px; z-index: 3100; translate: -50% 0; max-width: 92%; padding: 7px 14px; border-radius: 99px; background: #000000c0; font-size: 13px; font-weight: 700; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }
.toast.big { color: var(--gold); font-size: 15px; }

.tools { grid-area: tools; display: flex; gap: 6px; }
.tool { flex: 1; min-width: 0; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 5px 4px 6px; border-radius: 12px; background: var(--chip); font-size: 11.5px; font-weight: 800; }
.tool > span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .icon { font-size: 18px; line-height: 1.15; }
.tool:disabled { opacity: .4; cursor: default; }
.tool:active:not(:disabled) { transform: translateY(2px); }
.tool.hint-btn { background: #74e3c422; box-shadow: inset 0 0 0 1.5px #74e3c455; }

.stats-card { grid-area: stats; display: none; padding: 10px 12px; border-radius: 14px; background: var(--chip); align-self: start; }
.stats-card h2 { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.stats-card dl, .panel dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin-top: 6px; font-size: 13px; }
.stats-card dt, .panel dt { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.stats-card dt { color: var(--muted); }
.stats-card dd, .panel dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }

.confetti { position: fixed; inset: 0; z-index: 9; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall 2.4s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: #050c1cb8; }
.overlay[hidden], .panel[hidden] { display: none; }
.panel { width: min(100%, 400px); max-height: calc(100% - 16px); overflow: auto; background: #fffaf0; color: #1f2a44; border-radius: 26px; padding: 20px 20px; text-align: center; box-shadow: 0 20px 50px #0008; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: var(--coral); }
.panel p { margin-top: 8px; color: #4f5a75; font-size: 15px; line-height: 1.45; }
.panel .emoji { font-size: 42px; line-height: 1.1; margin-bottom: 4px; }
.panel .head-logo { width: 52px; height: 52px; margin: 0 auto 4px; display: block; }
.panel .pick { margin-top: 12px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #8590aa; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.choice { min-width: 0; padding: 10px 6px; border-radius: 18px; background: #e9edf7; color: #1f2a44; font-size: 17px; font-weight: 900; line-height: 1.15; box-shadow: 0 4px 0 #c5cde0; overflow-wrap: anywhere; }
.choice small { display: block; margin-top: 3px; font-size: 12px; font-weight: 700; color: #5d6884; }
.choice .ic { display: block; font-size: 22px; line-height: 1.2; }
.choice[aria-pressed="true"] { background: var(--night); color: #fff; box-shadow: 0 4px 0 var(--night-dark), inset 0 0 0 2px var(--gold); }
.choice[aria-pressed="true"] small { color: var(--sand); }
.rules { margin-top: 8px; font-size: 13px !important; line-height: 1.4 !important; }
.opts { display: grid; gap: 6px; margin-top: 12px; text-align: left; }
.opt { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 4px 6px 4px 12px; border-radius: 14px; background: #eef1f8; font-size: 14px; font-weight: 800; }
.opt > span { flex: 1; min-width: 0; }
.seg { display: flex; gap: 3px; }
.seg button { min-width: 34px; height: 30px; padding: 0 8px; border-radius: 10px; background: #fff; font-weight: 900; box-shadow: inset 0 0 0 1.5px #d3d9e8; }
.seg button[aria-pressed="true"] { background: var(--night); color: #fff; box-shadow: none; }
.tog { width: 48px; height: 28px; border-radius: 99px; background: #c9d0e0; position: relative; flex: 0 0 auto; }
.tog::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px #0004; }
.tog[aria-checked="true"] { background: #2fae8c; }
.tog[aria-checked="true"]::after { transform: translateX(20px); }
.actions { display: grid; gap: 8px; margin-top: 14px; }
.actions.two { grid-template-columns: 1fr 1fr; }
.cta { width: 100%; padding: 13px; border-radius: 18px; background: var(--coral); color: #fff; font-size: 17px; font-weight: 800; box-shadow: 0 5px 0 var(--coral-dark); }
.cta.gold { background: var(--gold); color: #3a2a05; box-shadow: 0 5px 0 var(--gold-dark); }
.cta:active, .choice:active { transform: translateY(3px); }
.cta:disabled { opacity: .55; cursor: default; }
.ghost { width: 100%; padding: 10px; border-radius: 16px; background: #e9edf7; color: #1f2a44; font-size: 15px; font-weight: 800; }
.panel dl { font-size: 15px; gap: 6px 12px; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: #eef1f8; }
.panel dt { color: #4f5a75; }
.tabs { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }

@media (max-width: 360px) {
  .logo { width: 32px; height: 32px; }
  .stat strong { font-size: 15px; }
  .stat small { letter-spacing: 0; }
  .tool { font-size: 10.5px; }
  .panel { padding: 16px 13px; }
  .opt { font-size: 13px; }
}
@media (max-height: 600px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 16px; border-radius: 22px; }
  .panel h2 { font-size: 22px; }
  .panel p { margin-top: 6px; font-size: 14px; line-height: 1.35; }
  .panel .emoji { font-size: 32px; }
  .panel .head-logo { display: none; }
  .choice { padding: 7px 6px; font-size: 16px; }
  .choice .ic { font-size: 18px; }
  .opts { margin-top: 8px; gap: 5px; }
  .opt { min-height: 34px; }
  .actions { margin-top: 10px; }
  .cta { padding: 10px; }
  .ghost { padding: 8px; }
}

/* Wide frames: the table fills the height, title, HUD, tools and stats move to a side column */
@media (min-aspect-ratio: 5/4) {
  .app { max-width: none; --side: clamp(190px, 21vw, 290px); grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto auto auto minmax(0, 1fr); grid-template-areas: "table top" "table hud" "table tools" "table stats" "table ."; column-gap: 16px; row-gap: 10px; }
  .top { align-items: flex-start; }
  h1 { white-space: normal; font-size: clamp(20px, 2.2vw, 30px); }
  .sub { white-space: normal; }
  .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { padding: 6px 8px 7px; }
  .stat strong { font-size: 20px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tool { min-height: 56px; font-size: 13px; }
  .stats-card { display: block; }
  .panel.menu { width: min(100%, 620px); }
  .panel.menu .opts { grid-template-columns: 1fr 1fr; }
  .panel.menu .opt.wide { grid-column: span 2; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  .app { --side: clamp(160px, 25vw, 220px); row-gap: 6px; column-gap: 10px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .logo { width: 30px; height: 30px; }
  h1 { font-size: 18px; }
  .sub { font-size: 11px; margin-top: 1px; }
  .hud { gap: 4px; }
  .stat { padding: 2px 6px 3px; }
  .stat strong { font-size: 15px; }
  .tools { gap: 5px; }
  .tool { min-height: 36px; flex-direction: row; gap: 4px; font-size: 11.5px; padding: 3px 4px; border-radius: 11px; }
  .tool .icon { font-size: 15px; }
  .stats-card { padding: 6px 10px; }
  .stats-card dl { font-size: 11.5px; gap: 1px 8px; margin-top: 3px; }
  .stats-card h2 { font-size: 10.5px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 400px) {
  .stats-card, .logo, .sub { display: none; }
}
@media (max-height: 460px) {
  .panel .rules, .panel .emoji { display: none; }
  .panel h2 { font-size: 20px; }
  .choice small { display: none; }
  .choice .ic { display: inline; font-size: 15px; margin-right: 4px; }
  .choice { padding: 6px; font-size: 15px; }
  .cta { padding: 8px; font-size: 15px; }
  .ghost { padding: 6px; font-size: 14px; }
  .opt { min-height: 32px; font-size: 13px; }
  .seg button { height: 26px; }
  .panel dl { margin-top: 6px; padding: 8px 12px; gap: 2px 10px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s0" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C9 7 3 9.5 3 14a4.5 4.5 0 0 0 8 2.8L10 22h4l-1-5.2A4.5 4.5 0 0 0 21 14c0-4.5-6-7-9-12z"/></symbol>
  <symbol id="s1" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-8.5-5.3-8.5-11.2A4.7 4.7 0 0 1 12 7a4.7 4.7 0 0 1 8.5 2.8C20.5 15.7 12 21 12 21z"/></symbol>
  <symbol id="s2" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l7.5 10L12 22 4.5 12z"/></symbol>
  <symbol id="s3" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5a4.3 4.3 0 0 0-3.6 6.7A4.3 4.3 0 1 0 10.8 17L10 22h4l-.8-5a4.3 4.3 0 1 0 2.4-7.8A4.3 4.3 0 0 0 12 2.5z"/></symbol>
  <symbol id="logo" viewBox="0 0 48 48"><path d="M24 5 45 41H3z" fill="#f4c34f"/><path d="M24 5 45 41H24z" fill="#d79e2a"/><path d="M14 30h20M10 36h28M18 23h12" stroke="#8a5d10" stroke-width="2" opacity=".45"/><circle cx="38" cy="10" r="4" fill="#fbf5e6"/></symbol>
</svg>
<div class="app">
  <header class="top">
    <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
    <div class="title">
      <h1>Pyramid <span>Solitaire</span></h1>
      <p class="sub" id="sub"></p>

  </header>
  <div class="hud">
    <div class="stat"><small data-i18n="score"></small><strong id="score">0</strong></div>
    <div class="stat"><small data-i18n="deal"></small><strong id="dealno">–</strong></div>
    <div class="stat"><small id="stockLbl" data-i18n="stock"></small><strong id="stockNo">24</strong></div>
    <div class="stat"><small data-i18n="time"></small><strong id="time">0:00</strong></div>

  <div class="table" id="table" role="group"><div class="toast" id="toast" aria-hidden="true"></div></div>
  <div class="tools">
    <button class="tool" id="undoBtn" type="button"><span class="icon" aria-hidden="true">↶</span><span data-i18n="undo"></span></button>
    <button class="tool hint-btn" id="hintBtn" type="button"><span class="icon" aria-hidden="true">💡</span><span data-i18n="hint"></span></button>

      <button class="choice" type="button" id="modeTri"><span class="ic" aria-hidden="true">⛰️</span><span data-i18n="tri"></span><small data-i18n="triDesc"></small></button>
    </div>
    <p class="rules" id="rules"></p>
    <div class="opts">
      <div class="opt" id="passOpt"><span id="passLbl" data-i18n="optPasses"></span><div class="seg" role="group" aria-labelledby="passLbl" id="passSeg"></div></div>
      <div class="opt" id="wrapOpt"><span id="wrapLbl" data-i18n="optWrap"></span><button class="tog" type="button" role="switch" id="wrapTog" aria-labelledby="wrapLbl"></button></div>
      <div class="opt"><span id="winLbl" data-i18n="optWin"></span><button class="tog" type="button" role="switch" id="winTog" aria-labelledby="winLbl"></button></div>

    <div class="actions">
      <button class="cta" type="button" id="retryBtn" data-i18n="retry"></button>

        <button class="ghost" type="button" id="overNewBtn" data-i18n="next"></button>
        <button class="ghost" type="button" id="overUndoBtn" data-i18n="undo"></button>

<script>
(() => {
  'use strict';
  // ---- core (pure rules + solvers) ----
  const Core = (() => {
    const rankOf = c => (c % 13) + 1;
    function rng(seed) {
      let a = seed >>> 0;
      return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    function shuffle(seed, salt) {

    place(el, xy, z);
    el.classList.toggle('down', !up);
    el.classList.toggle('live', live);
    el.classList.toggle('gone', gone);
    el.classList.toggle('sel', !!(sel && sel.c === c));
    el.tabIndex = live ? 0 : -1;
    el.disabled = false;
    el.setAttribute('aria-label', up ? cardName(c) : T.down);
    if (live) el.removeAttribute('aria-disabled'); else el.setAttribute('aria-disabled', 'true');
    el.toggleAttribute('aria-hidden', gone);
  }

  function render(instant) {
    if (!G || !measure()) return;
    if (instant) table.classList.add('instant');
    const s = G.s, g = geo;
    let stockLeft = 0;
    if (G.mode === 'pyr') {
      for (let j = 0; j < 28; j++) {
        const c = dl.table[j], r = rowOf(j);
        if (s.pm >> j & 1) setCard(c, g.discard, 5, { gone: true });
        else setCard(c, g.pos[j], 10 + r * 10 + j, { live: Core.open(Core.PYR_COVER, s.pm, j) });
      }
      const w = Core.wasteTop(s.dm, s.sp);
      for (let k = 0; k < 24; k++) {
        const c = dl.stock[k];
        if (s.dm >> k & 1) setCard(c, g.discard, 5, { gone: true });
        else if (k >= s.sp) { setCard(c, g.stock, 200 - k, { up: false }); stockLeft++; }
        else setCard(c, g.pile, 300 + k, { live: k === w });
      }
      const canRecycle = Core.nextStock(s.dm, s.sp) < 0 && w >= 0 && (!G.passes || s.pass < G.passes - 1);
      stockSlot.firstChild.textContent = stockLeft ? '' : canRecycle ? '↻' : '✕';
      els.stockLbl.textContent = T.pass;
      els.stockNo.textContent = G.passes ? `${s.pass + 1}/${G.passes}` : `${s.pass + 1}`;
      els.sub.innerHTML = T.subPyr;
    } else {
      for (let j = 0; j < 28; j++) {
        if (s.tm >> j & 1) continue;
        const up = Core.open(Core.TRI_COVER, s.tm, j);
        setCard(dl.table[j], g.pos[j], 10 + Core.TRI_ROW[j] * 20 + j, { up, live: up });
      }
      G.fp.forEach((c, i) => setCard(c, g.pile, 300 + i, {}));
      for (let k = s.sp; k < 24; k++) { setCard(dl.stock[k], g.stock, 200 - k, { up: false }); stockLeft++; }
      stockSlot.firstChild.textContent = stockLeft ? '' : '✕';
      els.stockLbl.textContent = T.stock;
      els.stockNo.textContent = stockLeft;
      els.sub.innerHTML = T.subTri;
    }
    place(stockSlot, g.stock, 250);
    stockSlot.style.background = stockLeft ? 'transparent' : '';
    stockSlot.lastChild.textContent = stockLeft;
    stockSlot.setAttribute('aria-label', stockLeft ? T.stockAria(stockLeft) : T.emptyStock);
    place(pileSlot, g.pile, 1);
    pileSlot.setAttribute('aria-label', T.pileAria);
    updateHud();
    if (instant) { void table.offsetWidth; table.classList.remove('instant'); }
  }
  function rowOf(j) { let r = 0; while ((r + 1) * (r + 2) / 2 <= j) r++; return r; }

  function updateHud() {
    if (!G) return;
    els.score.textContent = G.score;
    els.dealno.textContent = G.daily ? T.dailyLbl : '#' + G.seed;
    els.time.textContent = fmtTime(G.elapsed);
    $('undoBtn').disabled = !undoStack.length || busy;
  }
  const fmtTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  function statRows(mode) {
    const st = stats[mode];
    const rate = st.p ? Math.round(st.w / st.p * 100) + '%' : '–';
    return [[T.played, st.p], [T.won, st.w], [T.rate, rate], [T.best, st.b || '–'], [T.streak, st.s], [T.bestStreak, st.bs]]
      .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  }
  function updateStats() { $('sideStats').innerHTML = statRows(G ? G.mode : opts.mode); }

  // ---- feedback ----
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let toastTimer = 0;
  function toast(msg, big) {
    els.toast.textContent = msg;
    els.toast.classList.toggle('big', !!big);
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1800);
  }
  function shake(c) { const el = cardEls[c]; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  function announce(msg) { els.announcer.textContent = ''; setTimeout(() => { els.announcer.textContent = msg; }, 30); }
  function confetti() {
    if (reduceMotion) return;
    const colors = ['#f4c34f', '#ef6f4f', '#74e3c4', '#fbf5e6', '#8fb3ff'];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = Math.random() * .6 + 's';
      els.confetti.appendChild(p);
    }
    setTimeout(() => { els.confetti.innerHTML = ''; }, 3200);
  }

  // ---- deals ----
  const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  function dailySeed(key, mode) {
    let h = mode === 'tri' ? 7 : 3;
    for (const ch of key) h = (h * 131 + ch.charCodeAt(0)) % 99991;
    return h + 1;
  }
  const solvable = (mode, seed, settings, budget) => mode === 'pyr' ? Core.solvePyr(Core.deal('pyr', seed), settings.passes, budget) : Core.solveTri(Core.deal('tri', seed), settings.wrap, budget);
  // Tries consecutive seeds until the solver proves one winnable; work is sliced so the page stays responsive.
  function findDeal(mode, start, settings, done) {
    let seed = start, tries = 0;
    busy = true;
    toast(T.finding);
    const tick = () => {
      const t0 = performance.now();
      while (performance.now() - t0 < 30) {
        if (solvable(mode, seed, settings, 20000) === true) { busy = false; done(seed, true); return; }
        seed = seed % 99999 + 1;
        if (++tries > 600) { busy = false; toast(T.noFind); done(start, false); return; }
      }
      setTimeout(tick, 0);
    };
    setTimeout(tick, 30);
  }
  function startDeal() {
    const mode = opts.mode, settings = { passes: opts.passes, wrap: opts.wrap };
    const seed = 1 + Math.floor(Math.random() * 99999);
    closeOverlay();
    if (!opts.winnable) { newGame(mode, seed, null, settings); toast(T.dealNo(seed)); return; }
    findDeal(mode, seed, settings, s => { newGame(mode, s, null, settings); });
  }
  function startDaily() {
    const mode = opts.mode, key = todayKey(), settings = { passes: 3, wrap: true };
    closeOverlay();
    findDeal(mode, dailySeed(key, mode), settings, s => newGame(mode, s, key, settings));
  }
  function replay() {
    const { mode, seed, daily, passes, wrap } = G;
    newGame(mode, seed, daily, { passes, wrap });
  }

  // ---- menu / panels ----
  function openPanel(name) {
    ['menu', 'win', 'over', 'stats'].forEach(n => { els[n].hidden = n !== name; });
    els.overlay.hidden = false;
    const first = els[name].querySelector('button:not([hidden]):not(:disabled)');
    if (first) first.focus({ preventScroll: true });
  }
  function closeOverlay() { els.overlay.hidden = true; }
  function openMenu() { syncMenu(); openPanel('menu'); }
  function syncMenu() {
    $('modePyr').setAttribute('aria-pressed', opts.mode === 'pyr');
    $('modeTri').setAttribute('aria-pressed', opts.mode === 'tri');
    $('rules').textContent = opts.mode === 'pyr' ? T.rulesPyr : T.rulesTri;
    $('passOpt').hidden = opts.mode !== 'pyr';
    $('wrapOpt').hidden = opts.mode !== 'tri';
    $('passOpt').style.display = opts.mode === 'pyr' ? '' : 'none';
    $('wrapOpt').style.display = opts.mode === 'tri' ? '' : 'none';
    $('passSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === opts.passes));
    $('wrapTog').setAttribute('aria-checked', opts.wrap);
    $('winTog').setAttribute('aria-checked', opts.winnable);
    const resumable = G && !G.done && !G.lost && G.started;
    $('contBtn').hidden = !resumable;
    $('dailyBtn').textContent = dailyDone[opts.mode] === todayKey() ? T.dailyDone : T.daily;
    write('opts', opts);
  }
  [1, 2, 3, 0].forEach(v => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.v = v; b.textContent = v ? v : '∞';
    b.addEventListener('click', () => { opts.passes = v; syncMenu(); });
    $('passSeg').appendChild(b);
  });
  $('modePyr').addEventListener('click', () => { opts.mode = 'pyr'; syncMenu(); });
  $('modeTri').addEventListener('click', () => { opts.mode = 'tri'; syncMenu(); });
  $('wrapTog').addEventListener('click', () => { opts.wrap = !opts.wrap; syncMenu(); });
  $('winTog').addEventListener('click', () => { opts.winnable = !opts.winnable; syncMenu(); });
  $('contBtn').addEventListener('click', () => { closeOverlay(); render(true); });
  $('playBtn').addEventListener('click', startDeal);
  $('dailyBtn').addEventListener('click', startDaily);
  $('nextBtn').addEventListener('click', startDeal);
  $('overNewBtn').addEventListener('click', startDeal);
  $('replayBtn').addEventListener('click', replay);
  $('retryBtn').addEventListener('click', replay);
  $('overUndoBtn').addEventListener('click', undo);
  $('winMenuBtn').addEventListener('click', openMenu);
  $('menuBtn').addEventListener('click', openMenu);
  $('undoBtn').addEventListener('click', undo);
  $('hintBtn').addEventListener('click', hint);
  let statTab = 'pyr';
  function showStats(mode) {
    statTab = mode;
    $('statTabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === mode));
    $('statsList').innerHTML = statRows(mode);
  }
  $('statsBtn').addEventListener('click', () => { showStats(G ? G.mode : opts.mode); openPanel('stats'); });
  $('statTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showStats(b.dataset.m); });
  $('resetBtn').addEventListener('click', () => { stats[statTab] = blankStats(); write('stats', stats); showStats(statTab); updateStats(); });
  $('closeStats').addEventListener('click', () => { if (G) closeOverlay(); else openMenu(); });

  // ---- keyboard ----
  document.addEventListener('keydown', e => {
    if (!els.overlay.hidden || e.altKey) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey) return;
    if (k === 'd') { e.preventDefault(); draw(); }
    else if (k === 'h') { e.preventDefault(); hint(); }
    else if (k === 'u') { e.preventDefault(); undo(); }
    else if (e.key.startsWith('Arrow')) {
      const live = [...cardEls.filter(el => el.classList.contains('live')), stockSlot];
      const pos = el => { const r = el.getBoundingClientRect(); return [r.left, r.top]; };
      live.sort((a, b) => pos(a)[0] - pos(b)[0] || pos(a)[1] - pos(b)[1]);
      const i = live.indexOf(document.activeElement);
      const d = e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1;
      e.preventDefault();
      live[(i < 0 ? 0 : i + d + live.length) % live.length].focus();
    }
  });

  // ---- timer ----
  let last = performance.now();
  setInterval(() => {
    const now = performance.now(), dt = Math.min(now - last, 1000);
    last = now;
    if (!G || !G.started || G.done || G.lost || document.hidden || !els.overlay.hidden) return;
    G.elapsed += dt;
    els.time.textContent = fmtTime(G.elapsed);
  }, 250);
  document.addEventListener('visibilitychange', () => { last = performance.now(); if (document.hidden) save(); });
  window.addEventListener('pagehide', save);

  new ResizeObserver(() => render(true)).observe(table);

  if (navigator.webdriver) window.__pyramidSolitaire = {
    state: () => G && ({ mode: G.mode, seed: G.seed, daily: G.daily, passes: G.passes, wrap: G.wrap, s: { ...G.s }, score: G.score, moves: G.moves, done: G.done, lost: G.lost, busy, undo: undoStack.length, sel: sel && sel.c,
      table: dl.table.slice(), stock: dl.stock.slice(), pile: G.fp && G.fp.slice(), overlay: ['menu', 'win', 'over', 'stats'].find(n => !els.overlay.hidden && !els[n].hidden) || null, cw: geo && geo.cw }),
    stats: () => JSON.parse(JSON.stringify(stats)),
    point: c => { const r = cardEls[c].getBoundingClientRect(); return { x: r.left + r.width * .3, y: r.top + r.height * .2 }; },
    stockPoint: () => { const r = stockSlot.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; },
    moves: () => G.mode === 'pyr' ? Core.pyrMoves(dl, G.s, G.passes) : Core.triMoves(dl, G.s, G.wrap),
    solve: (budget = 200000) => G.mode === 'pyr' ? Core.solvePyr(dl, G.passes, budget, G.s) : null,
    newGame: (mode, seed, passes = 3, wrap = true) => newGame(mode, seed, null, { passes, wrap }),
    solvable: (mode, seed, passes = 3, wrap = true) => solvable(mode, seed, { passes, wrap }, 200000),
    dailySeed: (key, mode) => dailySeed(key, mode),
  };

  buildCards();
  const saved = read('game', null);
  if (saved && saved.G && saved.G.s) {
    G = saved.G;
    dl = Core.deal(G.mode, G.seed);
    undoStack = saved.undo || [];
    render(true);
  } else {
    const settings = { passes: opts.passes, wrap: opts.wrap };
    dl = Core.deal(opts.mode, 1);
    G = { mode: opts.mode, seed: 1, daily: null, passes: settings.passes, wrap: settings.wrap, s: opts.mode === 'pyr' ? { pm: 0, dm: 0, sp: 0, pass: 0 } : Core.triStart(dl), fp: opts.mode === 'tri' ? [dl.stock[0]] : null, score: 0, moves: 0, elapsed: 0, streak: 0, longest: 0, started: false, done: false, lost: false };
    render(true);
  }
  updateStats();
  openMenu();
})();
</script>
</body>
</html>
