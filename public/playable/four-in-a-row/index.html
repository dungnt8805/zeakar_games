<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four in a Row</title>
<style>
:root {
  --ink: #1f2d55;
  --muted: #6a7597;
  --bg: #eaf1ff;
  --blue: #4a78ef;
  --blue-dark: #2f57c4;
  --hole: #dfe8fd;
  --red: #ff5d6c;
  --red-dark: #d93a4c;
  --yellow: #ffc93d;
  --yellow-dark: #e3a514;
  --paper: #fbfcff;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(#d7e3fd 2px, transparent 2.5px), linear-gradient(#eef3ff, #f3efff);
  background-size: 26px 26px, 100% 100%;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue-dark); outline-offset: 3px; }
svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; min-width: 0; font-size: clamp(22px, 6.6vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
h1 span { color: var(--blue); }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: var(--paper); font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 #cdd9f6; }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #cdd9f6; }

.scores { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; }
.side { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 16px; background: #ffffffc8; box-shadow: 0 3px 0 #d3def8; transition: box-shadow .2s, transform .2s; }
.side.p1 { flex-direction: row-reverse; text-align: right; }
.side .dot { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; }
.side.p0 .dot { background: radial-gradient(circle at 35% 30%, #ff9aa3, var(--red) 60%, var(--red-dark)); }
.side.p1 .dot { background: radial-gradient(circle at 35% 30%, #ffe9a6, var(--yellow) 60%, var(--yellow-dark)); }
.side div { min-width: 0; flex: 1; }
.side small, .draws small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--muted); }
.side strong, .draws strong { display: block; font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.side.turn.p0 { box-shadow: 0 0 0 3px var(--red), 0 3px 0 #d3def8; }
.side.turn.p1 { box-shadow: 0 0 0 3px var(--yellow), 0 3px 0 #d3def8; }
.draws { align-self: center; min-width: 52px; text-align: center; }
.status { min-height: 1.3em; text-align: center; font-size: 15px; font-weight: 800; }

.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.game { --cell: min(100cqw / 7.3, 100cqh / 7.3); --pad: calc(var(--cell) * .15); position: relative; width: calc(var(--cell) * 7); height: calc(var(--cell) * 7 + var(--pad) * 2); }
.preview { position: relative; height: var(--cell); }
.grid { position: relative; height: calc(var(--cell) * 6); margin-top: var(--pad); background: linear-gradient(#e8efff, #d6e2fc); border-radius: calc(var(--cell) * .2); }
.discs { position: absolute; inset: 0; }
.disc { position: absolute; width: var(--cell); height: var(--cell); padding: calc(var(--cell) * .09); }
.disc b { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 0 calc(var(--cell) * .07) #00000014, inset 0 calc(var(--cell) * -.05) calc(var(--cell) * .08) #0000001f; }
.disc.p0 b { background: radial-gradient(circle at 35% 30%, #ff9aa3, var(--red) 55%, var(--red-dark)); }
.disc.p1 b { background: radial-gradient(circle at 35% 30%, #ffe9a6, var(--yellow) 55%, var(--yellow-dark)); }
.ghost { opacity: .5; top: 0; transition: left .12s ease, opacity .15s; }
.ghost[hidden] { display: block; opacity: 0; }
.discs.done .disc:not(.win) { opacity: .45; transition: opacity .4s; }
.disc.win b { animation: glow .7s ease-in-out infinite alternate; }
@keyframes glow { to { transform: scale(.88); box-shadow: inset 0 0 0 calc(var(--cell) * .09) #fff, 0 0 0 #0000; } }
.frame { position: absolute; z-index: 2; inset: calc(var(--pad) * -1); display: grid; grid-template: repeat(6, 1fr) / repeat(7, 1fr); border: var(--pad) solid var(--blue); border-radius: calc(var(--cell) * .28); box-shadow: 0 calc(var(--cell) * .12) 0 var(--blue-dark), 0 18px 40px #2f57c440; pointer-events: none; }
.frame i { background: radial-gradient(circle at 50% 50%, transparent 0 calc(var(--cell) * .385), #2f57c4 calc(var(--cell) * .39) calc(var(--cell) * .415), var(--blue) calc(var(--cell) * .42)); }
.cols { position: absolute; z-index: 3; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); touch-action: manipulation; }
.cols button { height: 100%; border-radius: calc(var(--cell) * .2); }
.cols button:focus-visible { outline: 3px solid var(--ink); outline-offset: -2px; }
.cols.locked button { cursor: default; }
.foot { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.5; }
.foot strong { color: var(--ink); }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #1f2d5559; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 380px); max-height: 100%; overflow: auto; background: var(--paper); border-radius: 28px; padding: 24px 20px; text-align: center; box-shadow: 0 20px 50px #1f2d5555; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 27px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: var(--blue); }
.logo { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
.logo i { width: 22px; height: 22px; border-radius: 50%; background: var(--red); box-shadow: inset 0 -3px 0 #0002; }
.logo i:nth-child(even) { background: var(--yellow); }
.text { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.field { margin-top: 14px; text-align: left; }
.field[hidden] { display: none; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #e6edfc; }
.seg button { flex: 1; min-width: 0; padding: 9px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #c9d6f5; }
.emoji { font-size: 44px; line-height: 1.2; }
.result-score { margin-top: 10px; font-size: 17px; font-weight: 800; }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: var(--yellow); color: #4a3500; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 20px; width: 100%; padding: 15px; border-radius: 18px; background: var(--blue); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--blue-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-dark); }
.ghost-btn { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; background: #e6edfc; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #c9d6f5; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 560px) { .app { gap: 6px; } .foot { display: none; } }
@media (max-width: 380px), (max-height: 480px) { .side { padding: 6px 8px; gap: 6px; } .side small, .draws small { letter-spacing: 0; } .draws { min-width: 44px; } }
@media (max-height: 560px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 16px; border-radius: 22px; }
  .logo { margin-bottom: 4px; }
  .logo i { width: 16px; height: 16px; }
  .panel h2 { font-size: 22px; }
  .text { margin-top: 4px; font-size: 13px; line-height: 1.35; }
  .field { margin-top: 8px; }
  .label { font-size: 11px; margin-bottom: 4px; }
  .seg button { padding: 6px 4px; min-height: 32px; }
  .emoji { font-size: 32px; }
  .result-score { margin-top: 6px; }
  .cta { margin-top: 12px; padding: 11px; font-size: 18px; }
  .ghost-btn { margin-top: 8px; padding: 9px; }
}
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .app { max-width: 920px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 290px); grid-template-rows: auto auto auto 1fr auto; grid-template-areas: "board top" "board scores" "board status" "board ." "board foot"; column-gap: 18px; row-gap: 8px; }
  .top { grid-area: top; }
  .scores { grid-area: scores; }
  .status { grid-area: status; }
  .board-wrap { grid-area: board; }
  .foot { grid-area: foot; }
  #setup .panel { width: min(100%, 620px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; align-items: end; }
  #setup .logo, #setup h2, #setup .text { grid-column: 1 / -1; }
  #setup .cta { margin-top: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<main class="app">
  <header class="top">
    <h1>Four <span>in a Row</span></h1>
    <button type="button" class="icon-btn" id="settings" data-i18n-label="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
    <button type="button" class="icon-btn" id="restart" data-i18n-label="newRound">↻</button>
  </header>
  <div class="scores">
    <div class="side p0" id="side-0"><i class="dot" aria-hidden="true"></i><div><small id="name-0"></small><strong id="score-0">0</strong></div></div>
    <div class="draws"><small data-i18n="draws"></small><strong id="score-d">0</strong></div>
    <div class="side p1" id="side-1"><i class="dot" aria-hidden="true"></i><div><small id="name-1"></small><strong id="score-1">0</strong></div></div>
  </div>
  <p class="status" id="status"></p>
  <div class="board-wrap">
    <div class="game" id="game">
      <div class="preview" aria-hidden="true"><span class="disc ghost p0" id="ghost" hidden><b></b></span></div>
      <div class="grid">
        <div class="discs" id="discs" aria-hidden="true"></div>
        <div class="frame" id="frame" aria-hidden="true"></div>
      </div>
      <div class="cols" id="cols" role="group" data-i18n-label="board"></div>
    </div>
  </div>
  <p class="foot"><span id="streak"></span><br><span data-i18n="hint"></span></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="setup">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h2 id="setup-title">Four <span>in a Row</span></h2>
    <p class="text" data-i18n="tagline"></p>
    <div class="field"><p class="label" id="mode-label" data-i18n="mode"></p><div class="seg" role="group" aria-labelledby="mode-label" data-key="mode"><button type="button" data-value="cpu" data-i18n="vsCpu"></button><button type="button" data-value="pvp" data-i18n="twoP"></button></div></div>
    <div class="field" id="level-field"><p class="label" id="level-label" data-i18n="difficulty"></p><div class="seg" role="group" aria-labelledby="level-label" data-key="level"><button type="button" data-value="easy" data-i18n="easy"></button><button type="button" data-value="medium" data-i18n="medium"></button><button type="button" data-value="hard" data-i18n="hard"></button></div></div>
    <div class="field"><p class="label" id="first-label" data-i18n="first"></p><div class="seg" role="group" aria-labelledby="first-label" data-key="first"><button type="button" data-value="p0" id="first-p0"></button><button type="button" data-value="p1" id="first-p1"></button><button type="button" data-value="alt" data-i18n="alternate"></button></div></div>
    <button type="button" class="cta" id="start" data-i18n="start"></button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <p class="emoji" id="result-emoji" aria-hidden="true"></p>
    <h2 id="result-title"></h2>
    <p class="text" id="result-text"></p>
    <p class="result-score" id="result-score"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="next-round" data-i18n="nextRound"></button>
    <button type="button" class="ghost-btn" id="change" data-i18n="change"></button>
  </div>
</div>

    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      setCursor(cursor + (event.key === 'ArrowLeft' ? -1 : 1));
      if (inCols) els.cols.children[cursor].focus({ preventScroll: true });
    } else if (/^[1-7]$/.test(event.key)) {
      event.preventDefault();
      setCursor(Number(event.key) - 1);
      humanMove(cursor);
    } else if ((event.key === 'Enter' || event.key === ' ') && !(document.activeElement instanceof HTMLButtonElement)) {
      // Focused column buttons activate natively; this covers play with nothing focused.
      event.preventDefault();
      humanMove(cursor);
    }
  });

  buildBoard();
  renderSetup();
  els.start.dataset.key = `${settings.mode}/${settings.level}`;
  game = { cells: new Int8Array(COLS * ROWS).fill(EMPTY), heights: new Int8Array(COLS), moves: 0, turn: 0, busy: false, over: false, timer: 0, round };
  renderAll();
  els.start.focus({ preventScroll: true });
})();
</script>
</body>
</html>
