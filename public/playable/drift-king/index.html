<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift King</title>
<style>
:root {
  --bg: #1f1840;
  --ink: #241a45;
  --muted: #6d6390;
  --hot: #ff4f7b;
  --hot-dark: #c92f58;
  --gold: #ffc93c;
  --paper: #fff9f4;
  --soft: #f1ebfa;
  --soft-edge: #d3c7ea;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { position: relative; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
canvas:focus-visible { outline: none; }

.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); pointer-events: none; }
.app.menu .hud, .app.menu .hint { visibility: hidden; }
.chip { min-width: 58px; padding: 4px 10px; border-radius: 12px; background: #fff9f4e0; box-shadow: 0 2px 0 #00000040; text-align: center; }
.chip small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.chip strong { display: block; font-size: 17px; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.pow { min-width: 0; font-size: 15px; font-weight: 900; padding: 8px 10px; }
.chip[hidden] { display: none; }
.hud .grow { flex: 1; }
.iconbtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 12px; background: #fff9f4e0; box-shadow: 0 2px 0 #00000040; font-size: 16px; font-weight: 900; display: grid; place-items: center; }

.toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); padding: 6px 14px; border-radius: 99px; background: var(--hot); color: #fff; font-weight: 900; font-size: 18px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }
.hint { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); padding: 6px 14px; border-radius: 99px; background: #00000059; color: #fff; font-size: 13px; font-weight: 800; text-align: center; pointer-events: none; transition: opacity .4s; }
.hint.gone { opacity: 0; }

.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8px; background: #120c2a66; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 380px); max-height: calc(100% - 8px); overflow-y: auto; padding: 18px 16px; border-radius: 22px; background: var(--paper); box-shadow: 0 7px 0 var(--soft-edge), 0 20px 50px #0007; text-align: center; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.title { font-size: clamp(36px, 12vw, 56px); font-weight: 900; letter-spacing: -.02em; line-height: 1; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); font-style: italic; }
.title span { color: var(--hot); }
.tagline { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--muted); }
.stats { display: flex; justify-content: center; gap: 22px; margin-top: 12px; }
.stats small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.stats strong { display: block; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; margin-top: 14px; }
.btn { flex: 1; padding: 12px; border-radius: 14px; background: var(--soft); box-shadow: 0 3px 0 var(--soft-edge); font-size: 16px; font-weight: 900; }
.btn.primary { background: var(--hot); color: #fff; box-shadow: 0 4px 0 var(--hot-dark); }
.btn:active { transform: translateY(2px); }
.big { display: block; width: 100%; margin-top: 14px; padding: 14px; font-size: 20px; }
.seg { display: flex; margin-top: 12px; padding: 4px; gap: 4px; border-radius: 14px; background: var(--soft); }
.seg button { flex: 1; padding: 8px 6px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 var(--soft-edge); }
.segl { margin-top: 12px; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.help { margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.4; }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.01em; }
.wallet { margin-top: 4px; font-size: 15px; font-weight: 900; color: var(--muted); }
.cars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.car { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; border-radius: 16px; background: var(--soft); box-shadow: 0 3px 0 var(--soft-edge); }
.car canvas { position: static; width: 72px; height: 40px; pointer-events: none; }
.car b { font-size: 15px; font-weight: 900; }
.car span { font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.25; min-height: 2.5em; }
.car i { font-style: normal; font-size: 13px; font-weight: 900; padding: 2px 10px; border-radius: 99px; background: #fff; }
.car.sel { box-shadow: 0 0 0 3px var(--hot), 0 3px 0 var(--soft-edge); }
.car.sel i { background: var(--hot); color: #fff; }
.car.poor i { color: var(--muted); }
.score { font-size: 56px; font-weight: 900; line-height: 1.05; margin-top: 4px; font-variant-numeric: tabular-nums; color: var(--hot); }
.sub { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); line-height: 1.35; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; background: var(--gold); color: var(--ink); font-size: 14px; font-weight: 900; }
.badge[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 480px) {
  .panel { padding: 10px 14px; }
  .title { font-size: 34px; }
  .tagline { display: none; }
  .stats { margin-top: 6px; }
  .stats strong { font-size: 20px; }
  .big { margin-top: 8px; padding: 10px; font-size: 18px; }
  .row { margin-top: 8px; }
  .btn { padding: 9px; }
  .seg, .segl { margin-top: 6px; }
  .help { display: none; }
  .panel h2 { font-size: 20px; }
  .score { font-size: 40px; }
  .cars { margin-top: 6px; gap: 6px; }
  .car { padding: 5px; }
  .car span { min-height: 0; }
}
@media (min-aspect-ratio: 4/3) {
  .panel.wide { width: min(100%, 680px); }
  .panel.wide .cars { grid-template-columns: repeat(3, 1fr); }
}
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .panel.menuw { width: min(100%, 560px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; align-items: center; }
  .panel.menuw .colA, .panel.menuw .colB { min-width: 0; }
  .panel.wide .cars { grid-template-columns: repeat(6, 1fr); }
  .car canvas { width: 56px; height: 32px; }
  .car span { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app menu" id="app">
  <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
  <div class="hud" id="hud">
    <div class="chip"><small data-i18n="score"></small><strong id="hs">0</strong></div>
    <div class="chip"><small data-i18n="coins"></small><strong id="hc">0</strong></div>
    <div class="chip"><small data-i18n="best"></small><strong id="hb">0</strong></div>
    <div class="chip pow" id="hsh" hidden>🛡️</div>
    <div class="chip pow" id="hdb" hidden>×2</div>
    <div class="grow"></div>
    <button type="button" class="iconbtn" id="pause" data-i18n-label="pause">II</button>
  </div>
  <div class="toast" id="toast" aria-hidden="true"></div>
  <p class="hint" id="hint"></p>

  <div class="overlay" id="menu">
    <div class="panel menuw" role="dialog" aria-labelledby="menu-title">
      <div class="colA">
        <h1 class="title" id="menu-title">Drift <span>King</span></h1>
        <p class="tagline" data-i18n="tagline"></p>
        <div class="stats">
          <div><small data-i18n="best"></small><strong id="mbest">0</strong></div>
          <div><small data-i18n="coins"></small><strong id="mcoins">0</strong></div>
        </div>
      </div>
      <div class="colB">
        <button type="button" class="btn primary big" id="play" data-i18n="play"></button>
        <p class="segl" id="ctl-label" data-i18n="controls"></p>
        <div class="seg" role="group" aria-labelledby="ctl-label">
          <button type="button" id="ctl-tap" data-i18n="ctlTap"></button>
          <button type="button" id="ctl-hold" data-i18n="ctlHold"></button>
        </div>
        <div class="row"><button type="button" class="btn" id="garage" data-i18n="garage"></button></div>
        <p class="help" id="help"></p>
      </div>
    </div>
  </div>

  <div class="overlay" id="shop" hidden>
    <div class="panel wide" role="dialog" aria-labelledby="shop-title">
      <h2 id="shop-title" data-i18n="garage"></h2>
      <p class="wallet" id="wallet"></p>
      <div class="cars" id="cars"></div>
      <div class="row"><button type="button" class="btn" id="sback" data-i18n="back"></button><button type="button" class="btn primary" id="splay" data-i18n="play"></button></div>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="panel" role="dialog" aria-labelledby="paused-title">
      <h2 id="paused-title" data-i18n="paused"></h2>
      <div class="row"><button type="button" class="btn" id="quit" data-i18n="menu"></button><button type="button" class="btn primary" id="resume" data-i18n="resume"></button></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel" role="dialog" aria-labelledby="over-title">
      <h2 id="over-title" data-i18n="fell"></h2>
      <p class="score" id="oscore">0</p>
      <p class="sub" id="osub"></p>
      <p class="badge" id="newbest" data-i18n="newBest" hidden></p>
      <div class="row"><button type="button" class="btn" id="omenu" data-i18n="menu"></button><button type="button" class="btn" id="ogarage" data-i18n="garage"></button></div>
      <button type="button" class="btn primary big" id="oretry" data-i18n="retry"></button>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

    for (let i = 1; i < skids.length; i++) {
      const a = skids[i - 1], b = skids[i]; if (!a || !b) continue;
      ctx.strokeStyle = `rgba(20,14,40,${0.35 * b.a})`;
      ctx.beginPath(); ctx.moveTo(...scr(a.ax, a.ay, 0)); ctx.lineTo(...scr(b.ax, b.ay, 0)); ctx.moveTo(...scr(a.bx, a.by, 0)); ctx.lineTo(...scr(b.bx, b.by, 0)); ctx.stroke();
    }
    const bob = Math.sin(performance.now() / 250) * 0.08;
    for (const it of items) {
      const [x, y] = scr(it.x, it.y, 0.35 + bob), r = view.z * (it.kind === 'coin' ? 0.2 : 0.32);
      if (y < -20 || y > view.vh + 20) continue;
      if (it.kind === 'coin') {
        ctx.fillStyle = '#c98a12'; ctx.beginPath(); ctx.ellipse(x + 1.5, y, r * 0.75, r, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.ellipse(x, y, r * 0.75, r, 0, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = it.kind === 'shield' ? '#4cc3ff' : '#ff4f7b'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = `900 ${Math.round(r * 1.05)}px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(it.kind === 'shield' ? '◆' : '×2', x, y + 1);
      }
    }
    if (!(falling && car.z < -0.6)) {
      if (car.inv > 0 && Math.floor(car.inv * 10) % 2) ctx.globalAlpha = 0.5;
      drawCarAt(scr, car.x, car.y, car.z, car.h, car.def, 1);
      ctx.globalAlpha = 1;
      if (car.shield) { const [x, y] = scr(car.x, car.y, 0.25); ctx.strokeStyle = '#7ad7ffcc'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(x, y, view.z * 0.75, view.z * 0.5, 0, 0, 7); ctx.stroke(); }
    }
    for (const p of parts) {
      const [x, y] = scr(p.x, p.y, p.z); ctx.globalAlpha = Math.max(0, p.life / p.max) * 0.8;
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(x, y, view.z * p.r * (p.col === '#ffffff' ? 1.6 - p.life / p.max : 1), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Menu backdrop: a short road with a car looping a drift.
  function drawMenuScene() {
    const save0 = cam.x, save1 = cam.y;
    const pts = [[-4, 0, 0, 7], [3, 0, 1, 5], [3, 5, 0, 5]];
    cam.x = proj(2, 2, 0).x; cam.y = proj(2, 2, 0).y;
    for (let i = pts.length - 1; i >= 0; i--) { const [x0, y0, ax, len] = pts[i]; const s = { x0, y0, ax, len, i }; s.r = rectOf(s); drawSeg(s); }
    const h = Math.sin(menuT * 1.6) * 0.5 + Math.PI / 4;
    drawCarAt(scr, 3, 1.2, 0, h, CARS[save.car], 1.2);
    cam.x = save0; cam.y = save1;
  }

  // ---------- HUD / UI ----------
  let toastT = 0;
  function toast(msg) { $('toast').textContent = msg; $('toast').classList.add('show'); toastT = 1; }
  function announce(msg) { $('announcer').textContent = ''; setTimeout(() => { $('announcer').textContent = msg; }, 30); }
  function updateHud() {
    $('hs').textContent = S.score;
    $('hc').textContent = save.coins + S.runCoins;
    $('hb').textContent = Math.max(save.best, S.score);
    $('hsh').hidden = !(car && car.shield);
    $('hdb').hidden = !(car && car.dbl > 0);
    if (car && car.dbl > 0) $('hdb').textContent = `×2 ${Math.ceil(car.dbl)}`;
  }
  function hideAll() { for (const id of ['menu', 'shop', 'paused', 'over']) $(id).hidden = true; }
  function showMenu() {
    S.state = 'menu'; car = null; app.classList.add('menu'); hideAll(); $('menu').hidden = false;
    $('mbest').textContent = save.best; $('mcoins').textContent = save.coins;
    $('ctl-tap').setAttribute('aria-pressed', save.control === 'tap'); $('ctl-hold').setAttribute('aria-pressed', save.control === 'hold');
    $('help').textContent = save.control === 'tap' ? t.helpTap : t.helpHold;
    $('play').focus();
  }
  function setControl(c) { save.control = c; store('control', c); showMenu(); $(c === 'tap' ? 'ctl-tap' : 'ctl-hold').focus(); }
  function showShop(focusIdx) {
    S.state = 'menu'; car = null; app.classList.add('menu'); hideAll(); $('shop').hidden = false;
    $('wallet').textContent = t.wallet(save.coins);
    const list = $('cars'); list.textContent = '';
    CARS.forEach((def, i) => {
      const own = save.owned.includes(i), b = document.createElement('button');
      b.type = 'button'; b.className = 'car' + (save.car === i ? ' sel' : '') + (!own && save.coins < def.price ? ' poor' : '');
      const cv = document.createElement('canvas'); cv.width = 144; cv.height = 80;
      const nm = document.createElement('b'); nm.textContent = t.cars[i];
      const pk = document.createElement('span'); pk.textContent = t.perks[i];
      const tag = document.createElement('i'); tag.textContent = save.car === i ? t.selected : own ? t.select : t.buy(def.price);
      b.append(cv, nm, pk, tag);
      b.setAttribute('aria-label', `${t.cars[i]} — ${t.perks[i]} — ${tag.textContent}`);
      b.addEventListener('click', () => pickCar(i));
      list.appendChild(b);
      preview(cv, def);
      if (i === focusIdx) setTimeout(() => b.focus(), 0);
    });
  }
  function preview(cv, def) {
    const c2 = cv.getContext('2d'), z = 46;
    const pr = (x, y, zz) => { const p = proj(x, y, zz); return [p.x * z + 72, p.y * z + 50]; };
    const old = ctx; ctx = c2; drawCarAt(pr, 0, 0, 0, 0.35, def, 1); ctx = old;
  }
  function pickCar(i) {
    const def = CARS[i];
    if (!save.owned.includes(i)) {
      if (save.coins < def.price) return;
      save.coins -= def.price; save.owned.push(i); store('coins', save.coins); store('owned', save.owned);
      announce(t.bought(t.cars[i]));
    }
    save.car = i; store('car', i);
    showShop(i);
  }
  function pause() { if (S.state !== 'play' && S.state !== 'falling') return; S.prev = S.state; S.state = 'paused'; $('paused').hidden = false; $('resume').focus(); }
  function resume() { if (S.state !== 'paused') return; S.state = S.prev; $('paused').hidden = true; last = performance.now(); S.held = false; if (save.control === 'hold' && car) car.tgt = 0; canvas.focus({ preventScroll: true }); }

  $('play').addEventListener('click', reset);
  $('splay').addEventListener('click', reset);
  $('garage').addEventListener('click', () => showShop(save.car));
  $('ogarage').addEventListener('click', () => showShop(save.car));
  $('sback').addEventListener('click', showMenu);
  $('ctl-tap').addEventListener('click', () => setControl('tap'));
  $('ctl-hold').addEventListener('click', () => setControl('hold'));
  $('pause').addEventListener('click', pause);
  $('resume').addEventListener('click', resume);
  $('quit').addEventListener('click', () => { bank(); showMenu(); });
  $('omenu').addEventListener('click', showMenu);
  $('oretry').addEventListener('click', reset);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  addEventListener('keydown', e => {
    if (e.code === 'KeyP' && ['play', 'falling', 'paused'].includes(S.state)) { S.state === 'paused' ? resume() : pause(); e.preventDefault(); return; }
    if (S.state !== 'play') return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { if (!e.repeat) press(); e.preventDefault(); }
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { steer('l'); e.preventDefault(); }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') { steer('r'); e.preventDefault(); }
  });
  addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release(); });
  addEventListener('blur', release);
  canvas.addEventListener('pointerdown', e => { if (S.state !== 'play') return; press(); e.preventDefault(); });
  addEventListener('pointerup', release); addEventListener('pointercancel', release);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- loop ----------
  let last = performance.now(), acc = 0, hudT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (document.hidden) { requestAnimationFrame(frame); return; }
    if (S.state === 'play' || S.state === 'falling') { acc += dt; while (acc >= STEP && (S.state === 'play' || S.state === 'falling')) { step(STEP); acc -= STEP; } } else acc = 0;
    if (S.state !== 'paused') for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= 6 * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    if (car) {
      const p = proj(car.x, car.y, 0), k = Math.min(1, dt * 5);
      cam.x += (p.x - cam.x) * k; cam.y += (p.y - cam.y) * k;
    } else menuT += dt;
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
    hudT -= dt; if (hudT <= 0) { updateHud(); hudT = 0.1; }
    draw();
    requestAnimationFrame(frame);
  }

  new ResizeObserver(resize).observe(app);
  resize();
  showMenu();
  requestAnimationFrame(frame);

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__driftKing = {
    state: () => ({ state: S.state, score: S.score, runCoins: S.runCoins, held: S.held, car: car && { x: car.x, y: car.y, h: car.h, vd: car.vd, tgt: car.tgt, v: car.v, seg: car.seg, shield: car.shield, dbl: car.dbl, z: car.z }, save: JSON.parse(JSON.stringify(save)) }),
    segs: () => segs.map(s => ({ i: s.i, ax: s.ax, x0: s.x0, y0: s.y0, len: s.len })),
    items: () => items.map(i => ({ kind: i.kind, x: i.x, y: i.y, seg: i.seg })),
    press, release,
    consts: () => ({ TURN, GRIP, W, handling: car ? car.def.handling : 1 }),
    seed: n => { let a = n >>> 0; rng = () => { a = (a + 0x6D2B79F5) >>> 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x ^= x + Math.imul(x ^ (x >>> 7), 61 | x); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; },
    // Advance the fixed-step simulation synchronously (deterministic bot runs).
    tick: (sec, policy) => { const n = Math.round(sec / STEP); for (let i = 0; i < n && (S.state === 'play' || S.state === 'falling'); i++) { if (policy) policy(); step(STEP); } return S.state; },
    start: () => reset(),
    addCoins: n => { save.coins += n; store('coins', save.coins); },
  };
})();
</script>
</body>
</html>
