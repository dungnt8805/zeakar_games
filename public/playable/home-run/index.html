<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Run</title>
<style>
:root {
  --bg: #0b1730;
  --panel: #12223f;
  --text: #f4f7ff;
  --muted: #a3b3cc;
  --accent: #ffd23f;
  --accent-dark: #c79a0c;
  --good: #4ee08a;
  --bad: #ff6b5a;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { position: fixed; inset: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.hud[hidden] { display: none; }
.hud { position: absolute; z-index: 2; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
.chip { pointer-events: auto; padding: 5px 10px; border-radius: 14px; background: #061024b8; box-shadow: inset 0 0 0 1px #ffffff1c; min-width: 0; }
.chip small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip strong { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.goal { flex: 1 1 auto; max-width: 340px; }
.chip.goal strong { font-size: 14px; display: block; white-space: normal; line-height: 1.25; }
.outs { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; max-width: 130px; }
.outs i { width: 10px; height: 10px; border-radius: 50%; background: #ffffff2a; }
.outs i.on { background: var(--bad); }
.spacer { flex: 1; }
.icon-btn { pointer-events: auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: #061024b8; box-shadow: inset 0 0 0 1px #ffffff1c; font-size: 17px; font-weight: 900; }
.call { position: absolute; z-index: 2; left: 50%; top: 30%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; text-shadow: 0 3px 12px #000a; opacity: 0; transition: opacity .2s; }
.call.show { opacity: 1; }
.call b { display: block; font-size: clamp(30px, 8vw, 64px); font-weight: 900; letter-spacing: .02em; }
.call span { display: block; font-size: clamp(16px, 4vw, 24px); font-weight: 800; color: var(--accent); }
.call.hr b { color: var(--accent); }
.call.bad b { color: #ffd0c8; }
.tip { position: absolute; z-index: 2; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); text-align: center; font-size: 12px; font-weight: 700; color: #e6eefc; text-shadow: 0 1px 4px #000; padding: 0 16px; pointer-events: none; }
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: #040a18b0; overflow-y: auto; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 420px); padding: 20px 20px; border-radius: 24px; background: linear-gradient(180deg, #1a3260, var(--panel)); box-shadow: 0 0 0 1px #ffffff1f, 0 20px 50px #000a; text-align: center; }
.logo { font-size: 40px; line-height: 1; }
.panel h2 { font-size: 30px; font-weight: 900; margin-top: 4px; }
.panel h2 span { color: var(--accent); }
.text { font-size: 14px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.field { margin-top: 12px; text-align: left; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #00000033; }
.seg button { flex: 1; min-width: 0; padding: 9px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #3a2600; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.levels button { padding: 8px 0; border-radius: 10px; background: #ffffff10; font-weight: 900; font-size: 15px; }
.levels button.done { background: #4ee08a33; color: #c9ffe0; }
.levels button[aria-pressed="true"] { background: var(--accent); color: #3a2600; }
.levels button:disabled { opacity: .35; cursor: not-allowed; }
.hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.45; }
.goal-line { margin-top: 8px; font-size: 14px; font-weight: 800; color: var(--text); }
.stats { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stats div { padding: 8px 4px; border-radius: 12px; background: #ffffff0d; }
.stats b { display: block; font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); }
.stats small { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.cta { margin-top: 14px; width: 100%; padding: 14px; border-radius: 18px; background: var(--accent); color: #3a2600; font-size: 19px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost-btn { margin-top: 10px; width: 100%; padding: 11px; border-radius: 16px; background: #ffffff12; font-size: 16px; font-weight: 800; box-shadow: inset 0 0 0 1px #ffffff1c; }
.ghost-btn[hidden], .cta[hidden], .field[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 520px) {
  .panel { padding: 12px 14px; border-radius: 18px; }
  .panel h2 { font-size: 22px; }
  .logo { display: none; }
  .text { font-size: 13px; margin-top: 2px; }
  .field { margin-top: 7px; }
  .seg button, .levels button { padding: 6px 4px; }
  .cta { margin-top: 10px; padding: 10px; font-size: 17px; }
  .ghost-btn { margin-top: 6px; padding: 8px; }
  .stats b { font-size: 20px; }
}
@media (max-height: 520px) and (min-aspect-ratio: 4/3) {
  #setup .panel { width: min(100%, 720px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; text-align: left; }
  #setup .panel > .head { grid-column: 1 / -1; text-align: center; }
  .levels { grid-template-columns: repeat(8, 1fr); }
}
@media (max-height: 420px) { #setup .text, #hint { display: none; } .chip strong { font-size: 17px; } .tip { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="chip"><small id="hud-a-label"></small><strong id="hud-a">0</strong></div>
    <div class="chip"><small data-i18n="outsLabel"></small><div class="outs" id="outs"></div></div>
    <div class="chip goal" id="goal-chip"><small id="goal-label"></small><strong id="goal"></strong></div>
    <div class="spacer"></div>
    <button type="button" class="icon-btn" id="mute" aria-pressed="false" data-i18n-label="mute">🔊</button>
    <button type="button" class="icon-btn" id="pause-btn" data-i18n-label="pause">II</button>
  </div>
  <div class="call" id="call" aria-hidden="true"><b id="call-main"></b><span id="call-sub"></span></div>
  <p class="tip" id="tip"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="setup">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <div class="head">
      <div class="logo" aria-hidden="true">⚾</div>
      <h2 id="setup-title">Home <span>Run</span></h2>
      <p class="text" data-i18n="tagline"></p>
    </div>
    <div>
      <div class="field"><p class="label" id="mode-label" data-i18n="mode"></p><div class="seg" role="group" aria-labelledby="mode-label" data-key="mode"><button type="button" data-value="derby" data-i18n="derby"></button><button type="button" data-value="challenge" data-i18n="challenge"></button></div></div>
      <div class="field"><p class="label" id="aim-label" data-i18n="aim"></p><div class="seg" role="group" aria-labelledby="aim-label" data-key="aim"><button type="button" data-value="auto" data-i18n="aimAuto"></button><button type="button" data-value="manual" data-i18n="aimManual"></button></div></div>
    </div>
    <div>
      <div class="field" id="level-field"><p class="label" id="lv-label" data-i18n="levels"></p><div class="levels" id="levels" role="group" aria-labelledby="lv-label"></div><p class="goal-line" id="lv-goal"></p></div>
      <p class="hint" id="hint"></p>
      <p class="hint" id="record"></p>
      <button type="button" class="cta" id="start" data-i18n="start"></button>
    </div>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="logo" aria-hidden="true" id="result-logo">🏆</div>
    <h2 id="result-title"></h2>
    <p class="text" id="result-text"></p>
    <div class="stats"><div><b id="st-hr">0</b><small data-i18n="homers"></small></div><div><b id="st-total">0</b><small data-i18n="total"></small></div><div><b id="st-long">0</b><small data-i18n="longest"></small></div></div>
    <p class="hint" id="result-record"></p>
    <button type="button" class="cta" id="next" data-i18n="nextLevel" hidden></button>
    <button type="button" class="cta" id="again" data-i18n="again"></button>
    <button type="button" class="ghost-btn" id="to-menu" data-i18n="menu"></button>
  </div>
</div>

<div class="overlay" id="paused" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <h2 id="pause-title" data-i18n="paused"></h2>
    <p class="hint" id="pause-hint"></p>
    <button type="button" class="cta" id="resume" data-i18n="resume"></button>
    <button type="button" class="ghost-btn" id="quit" data-i18n="quit"></button>
  </div>
</div>

    const ramp = game.lv ? game.lv.spd : 0.9 + Math.min(0.25, game.count * 0.012);
    const strike = Math.random() < (game.lv ? 0.86 : 0.8);
    const tx = strike ? rand(-ZONE.x + 0.04, ZONE.x - 0.04) : (Math.random() < 0.5 ? -1 : 1) * rand(ZONE.x + 0.08, ZONE.x + 0.3);
    const ty = strike ? rand(ZONE.lo + 0.06, ZONE.hi - 0.06) : (Math.random() < 0.5 ? rand(0.2, ZONE.lo - 0.08) : rand(ZONE.hi + 0.08, 1.35));
    game.count++;
    return { def, k, T: def.dur / ramp, t: 0, tx, ty, kmh: Math.round(152 * ramp * 0.82 / def.dur * 1.0) };
  }
  function pitchPos(p, time) {
    const s = time / p.T;
    const [bx, by] = p.def.brk;
    const ex = p.tx - bx, ey = p.ty - by;
    const x = RELEASE.x + (ex - RELEASE.x) * s + bx * s * s;
    const y = RELEASE.y + (ey - RELEASE.y) * s + by * s * s + p.def.arc * 4 * s * (1 - s) * (s < 1 ? 1 : 0);
    const z = RELEASE.z * (1 - s);
    return { x, y, z };
  }
  const inZone = (x, y) => Math.abs(x) <= ZONE.x + 0.04 && y >= ZONE.lo - 0.04 && y <= ZONE.hi + 0.04;

  function swing() {
    if (!game || paused || game.over) return;
    initAudio();
    if (game.state === 'flight' || game.state === 'result') { if (game.state === 'flight') skipFlight(); return; }
    if (game.swing) return;
    if (game.state !== 'pitch') return;
    game.swing = { at: game.pitch.t, anim: 0, done: false };
  }

  function resolveSwing() {
    const p = game.pitch, sw = game.swing;
    const e = sw.at + SWING_LEAD - p.T;
    const end = pitchPos(p, p.T);
    let aim;
    if (settings.aim === 'manual') aim = { x: aimPt.x, y: aimPt.y };
    else aim = { x: end.x + gauss() * 0.06, y: end.y + gauss() * 0.075 };
    const dx = aim.x - end.x, dy = aim.y - end.y;
    sw.done = true;
    if (Math.abs(e) > WINDOW || Math.abs(dx) > 0.3 || Math.abs(dy) > 0.24) {
      return outcome('whiff', { early: e < 0 });
    }
    const q = 1 - Math.pow(Math.abs(e) / WINDOW, 1.6);
    const dyN = clamp(dy / 0.14, -1.7, 1.7);
    const launch = 28 - dyN * 26 + rand(-4, 4);
    const spray = (e / WINDOW) * 58 + dx * 25 + rand(-4, 4);
    const v = 31 + 19 * q - 6 * Math.abs(dyN) - Math.abs(dx) * 18 + (p.k === 'F' ? 2 : 0) + rand(-1.5, 1.5);
    const a = launch * Math.PI / 180;
    let dist = v * v * Math.sin(2 * clamp(a, 0.02, 1.5)) / 9.8 * 0.62;
    if (launch > 45) dist *= 1 - (launch - 45) / 45;
    if (launch < 6) dist = clamp(dist * 0.4, 8, 45);
    dist = Math.max(4, dist);
    const phi = spray * Math.PI / 180;
    const fenceAt = fenceR(phi);
    let kind;
    if (Math.abs(spray) > 45) kind = 'foul';
    else if (launch < 8) kind = 'grounder';
    else if (dist >= fenceAt + 1) kind = 'homer';
    else if (launch > 52) kind = 'popup';
    else if (launch < 18) kind = 'liner';
    else kind = 'flyout';
    const contact = { x: end.x, y: end.y, z: 0 };
    const tf = kind === 'grounder' ? 1.1 : clamp(dist / 34, 0.8, 3.6) * (launch > 50 ? 1.4 : 1);
    const apex = kind === 'grounder' ? 0.4 : Math.max(2, dist * Math.tan(clamp(a, 0.05, 1.3)) / 4);
    game.hit = { kind, dist: Math.round(dist), phi, launch, q, e, start: contact, t: 0, tf, apex, trail: [] };
    if (kind === 'foul') sfx.foul(); else sfx.crack(q);
    shake = kind === 'homer' ? 0.35 : 0.15;
    game.state = 'flight';
    game.ball = null;
    if (kind === 'homer') { cheer = 1; sfx.cheer(); }
    else if (q > 0.6) setCrowd(0.22, 0.2);
  }

  function skipFlight() { if (game.hit) game.hit.t = game.hit.tf; }

  function outcome(kind, info = {}) {
    const isOut = kind !== 'homer' && kind !== 'ball';
    let main = t[kind] || kind, sub = '';
    if (kind === 'whiff') { sfx.whiff(); sub = info.early !== undefined ? '' : ''; }
    if (kind === 'strike') sfx.mitt();
    if (kind === 'ball') sfx.mitt();
    if (kind === 'homer') {
      game.hrs++; game.total += game.hit.dist; game.longest = Math.max(game.longest, game.hit.dist);
      game.streak++; game.bestStreak = Math.max(game.bestStreak, game.streak);
      sub = t.meters(game.hit.dist);
      burst();
    } else if (kind !== 'ball') {
      game.streak = 0;
      if (game.hit && kind !== 'foul') sub = t.meters(game.hit.dist);
      if (game.hit && kind === 'foul') sub = Math.abs(game.hit.e) > 0.01 ? (game.hit.e < 0 ? t.early : t.late) : '';
      if (kind !== 'whiff' && kind !== 'strike' && kind !== 'foul') sfx.groan();
    }
    if (isOut) game.outs++;
    showCall(main, sub, kind === 'homer' ? 'hr' : isOut ? 'bad' : '');
    announce([main, sub, isOut ? `${t.out} ${game.outs}/${game.maxOuts}` : ''].filter(Boolean).join('. '));
    renderHud();
    game.state = 'result';
    game.timer = kind === 'homer' ? 1.6 : 1.1;
    game.lastKind = kind;
  }

  function checkEnd() {
    const lv = game.lv;
    if (lv) {
      const met = lv.goal === 'hr' ? game.hrs >= lv.n : lv.goal === 'far' ? game.longest >= lv.n : game.bestStreak >= lv.n;
      if (met) return finish(true);
    }
    if (game.outs >= game.maxOuts) return finish(!lv);
    return false;
  }

  function finish(won) {
    game.over = true; game.won = won; game.state = 'end';
    let rec = '', isBest = false;
    if (game.mode === 'derby') {
      if (game.total > best.dist || (game.hrs > best.hr)) isBest = game.total > best.dist;
      best.hr = Math.max(best.hr, game.hrs); best.long = Math.max(best.long, game.longest);
      if (game.total > best.dist) best.dist = game.total;
      write('best', best);
      $('result-title').textContent = t.derbyOver; $('result-logo').textContent = '🏆';
      $('result-text').textContent = t.derbyText(game.hrs, game.total);
      rec = (isBest ? t.newBest + ' ' : '') + t.bestDerby(best.hr, best.dist);
      $('next').hidden = true; $('again').textContent = t.again; $('again').className = 'cta';
      sfx.win();
    } else {
      if (won && !cleared.includes(game.level)) { cleared.push(game.level); write('cleared', cleared); }
      $('result-title').textContent = won ? t.cleared : t.failed;
      $('result-logo').textContent = won ? '⭐' : '⚾';
      $('result-text').textContent = `${t.levelN(game.level + 1)} · ${goalText(game.lv)}`;
      rec = cleared.length >= LEVELS.length ? t.cleared15 : t.progress(cleared.length, LEVELS.length);
      $('next').hidden = !won || game.level >= LEVELS.length - 1;
      $('again').textContent = won ? t.again : t.retry;
      $('again').className = $('next').hidden ? 'cta' : 'ghost-btn';
      won ? sfx.win() : sfx.lose();
    }
    $('st-hr').textContent = game.hrs; $('st-total').textContent = game.total; $('st-long').textContent = game.longest;
    $('result-record').textContent = rec;
    setTimeout(() => {
      if (!game || game.state !== 'end') return;
      $('result').hidden = false;
      ($('next').hidden ? $('again') : $('next')).focus({ preventScroll: true });
    }, 700);
    announce(`${$('result-title').textContent} ${$('result-text').textContent}`);
    return true;
  }

  function goalText(lv) { return lv.goal === 'hr' ? t.goalHr(lv.n) : lv.goal === 'far' ? t.goalFar(lv.n) : t.goalStreak(lv.n); }

  function showCall(main, sub, cls) {
    const c = $('call');
    $('call-main').textContent = main; $('call-sub').textContent = sub;
    c.className = 'call show ' + cls;
  }

  function burst() {
    if (reducedMotion.matches) return;
    const cols = ['#ffd23f', '#ff5a5a', '#5ab8ff', '#ffffff', '#7be08a'];
    for (let k = 0; k < 3; k++) {
      const cx = W * rand(0.2, 0.8), cy = (HZ) * rand(0.25, 0.7);
      for (let i = 0; i < 34; i++) {
        const a = Math.random() * 6.28, sp = rand(60, 220);
        particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.9, 1.5), max: 1.5, c: cols[(i + k) % cols.length], delay: k * 0.25 });
      }
    }
  }

  // ---------- update ----------
  function update(dt) {
    if (!game || paused) return;
    cheer = Math.max(0, cheer - dt * 0.35);
    flash = Math.max(0, flash - dt * 3);
    shake = Math.max(0, shake - dt);
    for (const p of particles) { if (p.delay > 0) { p.delay -= dt; continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    if (game.swing) game.swing.anim += dt;
    let lt = 0;
    switch (game.state) {
      case 'wait':
        game.timer -= dt;
        if (game.timer <= 0) { game.state = 'windup'; game.timer = 0.85; game.swing = null; game.hit = null; game.pitch = pickPitch(); $('call').classList.remove('show'); }
        break;
      case 'windup':
        game.timer -= dt;
        if (game.timer <= 0) { game.state = 'pitch'; sfx.release(); }
        break;
      case 'pitch': {
        const p = game.pitch;
        p.t += dt;
        const sw = game.swing;
        if (sw && !sw.done && p.t >= Math.min(sw.at + SWING_LEAD, p.T + WINDOW)) { resolveSwing(); break; }
        if (p.t >= p.T + 0.09) {
          if (sw && !sw.done) { resolveSwing(); break; }
          if (!sw) {
            const end = pitchPos(p, p.T);
            outcome(inZone(end.x, end.y) ? 'strike' : 'ball');
          } else if (game.state === 'pitch') { game.state = 'result'; }
        }
        break;
      }
      case 'flight': {
        const h = game.hit;
        h.t += dt;
        const pos = hitPos(h);
        if (!reducedMotion.matches) { h.trail.push(pos); if (h.trail.length > 18) h.trail.shift(); }
        const sp = P(pos.x, pos.y, pos.z);
        if (sp && pos.y > 3) lt = clamp(H * 0.14 - (sp.y - lift), 0, H * 0.4);
        if (h.t >= h.tf) outcome(h.kind);
        break;
      }
      case 'result':
        game.timer -= dt;
        if (game.hit && game.hit.t < game.hit.tf + 1.5) game.hit.t += dt;
        else if (game.pitch && game.pitch.t < game.pitch.T * 1.06) game.pitch.t += dt;
        if (game.timer <= 0) { if (!checkEnd()) { game.state = 'wait'; game.timer = 0.45; } }
        break;
    }
    if (game.state === 'result' && game.hit && game.hit.kind === 'homer') lt = liftTarget;
    liftTarget = reducedMotion.matches ? 0 : lt;
    lift += (liftTarget - lift) * Math.min(1, dt * 4);
  }

  function hitPos(h) {
    const s = clamp(h.t / h.tf, 0, 1);
    const r = h.dist * (h.kind === 'grounder' ? 1 - (1 - s) * (1 - s) : s);
    let y;
    if (h.kind === 'grounder') y = h.start.y * (1 - s) + Math.abs(Math.sin(s * 9)) * h.apex * (1 - s);
    else y = h.start.y * (1 - s) + 4 * h.apex * s * (1 - s);
    return { x: h.start.x + r * Math.sin(h.phi), y: Math.max(0.05, y), z: r * Math.cos(h.phi) };
  }

  // ---------- drawing ----------
  function poly(pts, fill) {
    const sp = pts.map(p => P(p[0], p[1], p[2])).filter(Boolean);
    if (sp.length < 3) return;
    ctx.beginPath(); ctx.moveTo(sp[0].x, sp[0].y);
    for (const p of sp) ctx.lineTo(p.x, p.y);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }
  function arcPts(r, a0, a1, y = 0, n = 40, cx = 0, cz = 0) {
    const out = [];
    for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; out.push([cx + r * Math.sin(a), y, cz + r * Math.cos(a)]); }
    return out;
  }
  function drawField(now) {
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, HZ + lift);
    sky.addColorStop(0, '#0c1c44'); sky.addColorStop(0.6, '#22417c'); sky.addColorStop(1, '#3d6aa6');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, HZ + lift + 2);
    // stadium lights
    for (const lx of [-0.42, 0.42]) {
      const p = P(lx * 240, 40, 160);
      if (!p) continue;
      ctx.fillStyle = '#fff8d8'; ctx.fillRect(p.x - 6 * p.s, p.y - 2 * p.s, 12 * p.s, 3 * p.s);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 70 * p.s);
      g.addColorStop(0, '#fff6c855'); g.addColorStop(1, '#fff6c800');
      ctx.fillStyle = g; ctx.fillRect(p.x - 70 * p.s, p.y - 70 * p.s, 140 * p.s, 140 * p.s);
    }
    // grass base
    ctx.fillStyle = '#2f8a3e'; ctx.fillRect(0, HZ + lift, W, H);
    // stands behind the fence
    const A = 0.86;
    const standBack = arcPts(1, -A, A, 0, 48).map(([x, , z]) => { const a = Math.atan2(x, z); const R = fenceR(a) + 34; return [R * Math.sin(a), 17, R * Math.cos(a)]; });
    const fenceTop = arcPts(1, A, -A, 0, 48).map(([x, , z]) => { const a = Math.atan2(x, z); const R = fenceR(a) + 2; return [R * Math.sin(a), 3.4, R * Math.cos(a)]; });
    poly([...standBack, ...fenceTop], '#1a2540');
    // crowd
    const ex = cheer;
    for (const c of crowd) {
      const R = fenceR(c.phi) + 5 + c.row * 3.6;
      const bob = reducedMotion.matches ? 0 : Math.max(0, Math.sin(now / 1000 * (4 + ex * 8) + c.ph)) * (0.25 + ex * 1.4);
      const p = P(R * Math.sin(c.phi), 4.6 + c.row * 1.6 + bob, R * Math.cos(c.phi));
      if (!p) continue;
      ctx.fillStyle = c.c; ctx.beginPath(); ctx.arc(p.x, p.y, 0.55 * p.s, 0, 6.28); ctx.fill();
    }
    // outfield grass with mowing stripes
    const wallBase = arcPts(1, A, -A, 0, 48).map(([x, , z]) => { const a = Math.atan2(x, z); const R = fenceR(a); return [R * Math.sin(a), 0, R * Math.cos(a)]; });
    poly([[0, 0, 0], ...wallBase.reverse()], '#3c9d4a');
    for (let i = 0; i < 9; i += 2) {
      const r0 = 14 + i * 11, r1 = r0 + 11;
      poly([...arcPts(r0, -0.785, 0.785, 0, 20), ...arcPts(r1, 0.785, -0.785, 0, 20)], '#45a853');
    }
    // fence wall
    const wallTop = wallBase.map(([x, , z]) => [x, 3.2, z]);
    poly([...wallBase, ...wallTop.slice().reverse()], '#123e2a');
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.beginPath();
    wallTop.forEach((q, i) => { const p = P(...q); if (p) i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }); ctx.stroke();
    // distance markers
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const a of [-0.6, -0.25, 0.25, 0.6]) {
      const R = fenceR(a), p = P(R * Math.sin(a), 1.6, R * Math.cos(a));
      if (p) { ctx.font = `800 ${Math.max(9, 1.8 * p.s)}px ${getComputedStyle(document.body).fontFamily}`; ctx.fillText(`${Math.round(R)}`, p.x, p.y); }
    }
    // infield dirt
    poly([[0, 0, -3], ...arcPts(29, -0.95, 0.95, 0, 30), [0, 0, -3]], '#b98352');
    poly([[0, 0, 0.6], [18.6, 0, 19.4], [0, 0, 38.2], [-18.6, 0, 19.4]], '#3f9f4c');
    // foul lines
    ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 2;
    for (const sg of [-1, 1]) {
      const a = P(0.3 * sg, 0, 0.3), b = P(sg * 98 * Math.SQRT1_2, 0, 98 * Math.SQRT1_2);
      if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    // bases
    for (const [x, z] of [[19.2, 19.4], [0, 38.6], [-19.2, 19.4]]) poly([[x - 0.3, 0.02, z], [x, 0.02, z - 0.3], [x + 0.3, 0.02, z], [x, 0.02, z + 0.3]], '#fff');
    // mound
    poly(arcPts(2.7, -3.14, 3.14, 0, 24, 0, 18.4), '#c48d5b');
    poly([[-0.3, 0.26, 18.3], [0.3, 0.26, 18.3], [0.3, 0.26, 18.45], [-0.3, 0.26, 18.45]], '#fff');
    // home plate area
    poly(arcPts(3.2, -3.14, 3.14, 0, 32, 0, 0), '#b98352');
    for (const sg of [-1, 1]) { // batter's boxes
      const pts = [[sg * 0.35, 0.01, -0.9], [sg * 1.55, 0.01, -0.9], [sg * 1.55, 0.01, 0.9], [sg * 0.35, 0.01, 0.9]].map(q => P(...q)).filter(Boolean);
      if (pts.length === 4) { ctx.strokeStyle = '#ffffffb0'; ctx.lineWidth = 2; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.stroke(); }
    }
    poly([[-0.22, 0.02, 0.22], [0.22, 0.02, 0.22], [0.22, 0.02, 0], [0, 0.02, -0.22], [-0.22, 0.02, 0]], '#fafafa');
  }

  function drawPitcher() {
    const base = P(0, 0.26, 18.4);
    if (!base) return;
    const s = base.s;
    let arm = 0, lean = 0;
    if (game && game.state === 'windup') { const k = 1 - game.timer / 0.85; arm = k; lean = Math.sin(k * Math.PI) * -0.15; }
    else if (game && game.state === 'pitch' && game.pitch.t < 0.35) { arm = 1 + game.pitch.t / 0.35; lean = 0.2 * (1 - game.pitch.t / 0.35); }
    else arm = 0;
    ctx.save(); ctx.translate(base.x, base.y);
    ctx.fillStyle = '#00000040'; ctx.beginPath(); ctx.ellipse(0, 0, 0.6 * s, 0.15 * s, 0, 0, 6.28); ctx.fill();
    ctx.rotate(lean);
    ctx.fillStyle = '#e8e8ee'; // legs
    ctx.fillRect(-0.28 * s, -0.95 * s, 0.22 * s, 0.95 * s); ctx.fillRect(0.06 * s, -0.95 * s, 0.22 * s, 0.95 * s);
    ctx.fillStyle = '#c0283a'; ctx.fillRect(-0.32 * s, -1.6 * s, 0.64 * s, 0.7 * s); // jersey
    ctx.fillStyle = '#e0b088'; ctx.beginPath(); ctx.arc(0, -1.75 * s, 0.17 * s, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#1b2a5a'; ctx.beginPath(); ctx.arc(0, -1.8 * s, 0.18 * s, Math.PI, 0); ctx.fill(); ctx.fillRect(-0.05 * s, -1.82 * s, 0.3 * s, 0.06 * s);
    // throwing arm (right side of screen as seen)
    const ang = arm < 1 ? -0.4 - arm * 2.4 : -2.8 + (arm - 1) * 3.6;
    ctx.save(); ctx.translate(0.3 * s, -1.5 * s); ctx.rotate(ang);
    ctx.fillStyle = '#c0283a'; ctx.fillRect(-0.07 * s, 0, 0.14 * s, 0.6 * s);
    if (game && (game.state === 'windup' || (game.state === 'pitch' && game.pitch.t < 0.02))) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0.65 * s, 0.06 * s + 0.6, 0, 6.28); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = '#7a4a22'; ctx.beginPath(); ctx.arc(-0.38 * s, -1.25 * s, 0.13 * s, 0, 6.28); ctx.fill(); // glove
    ctx.restore();
  }

  function drawZone() {
    const a = P(-ZONE.x, ZONE.hi, 0), b = P(ZONE.x, ZONE.lo, 0);
    if (!a || !b) return;
    ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]);
    ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y); ctx.setLineDash([]);
    if (settings.aim === 'manual' && game && !game.over) {
      const p = P(aimPt.x, aimPt.y, 0);
      ctx.strokeStyle = '#ffd23fd0'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, 0.09 * p.s, 0, 6.28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x - 0.16 * p.s, p.y); ctx.lineTo(p.x + 0.16 * p.s, p.y); ctx.stroke();
    }
  }

  function drawBallAt(pos, color) {
    const p = P(pos.x, pos.y, pos.z), g = P(pos.x, 0, pos.z);
    if (!p) return;
    const r = Math.max(2, 0.075 * p.s);
    if (g) { ctx.fillStyle = '#0000003a'; ctx.beginPath(); ctx.ellipse(g.x, g.y, r * 1.1, r * 0.35, 0, 0, 6.28); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.28); ctx.fill();
    if (r > 4) { ctx.strokeStyle = color || '#d33'; ctx.lineWidth = Math.max(1, r * 0.12); ctx.beginPath(); ctx.arc(p.x - r * 0.9, p.y, r * 0.75, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(p.x + r * 0.9, p.y, r * 0.75, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke(); }
  }

  function drawPitchBall() {
    if (!game || game.state !== 'pitch' && !(game.state === 'result' && game.lastKind && ['strike', 'ball', 'whiff'].includes(game.lastKind))) return;
    const p = game.pitch;
    if (!p) return;
    const tt = Math.min(p.t, p.T * 1.06);
    // faint trail so the break is readable
    if (!reducedMotion.matches) {
      ctx.strokeStyle = p.def.col + '66'; ctx.lineWidth = 2; ctx.beginPath();
      let started = false;
      for (let k = Math.max(0, tt - 0.25); k <= tt; k += 0.02) { const q = pitchPos(p, k), s = P(q.x, q.y, q.z); if (!s) continue; started ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); started = true; }
      ctx.stroke();
    }
    drawBallAt(pitchPos(p, tt));
  }

  function drawHitBall() {
    if (!game || !game.hit) return;
    const h = game.hit;
    if (h.trail.length > 1) {
      ctx.strokeStyle = h.kind === 'homer' ? '#ffd23f99' : '#ffffff66'; ctx.lineWidth = 3; ctx.beginPath();
      let st = false;
      for (const q of h.trail) { const s = P(q.x, q.y, q.z); if (!s) continue; st ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); st = true; }
      ctx.stroke();
    }
    const pos = hitPos(h);
    const p = P(pos.x, pos.y, pos.z);
    drawBallAt(pos);
    if (p && p.y < 4) { // off the top: arrow marker
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(p.x, 6); ctx.lineTo(p.x - 7, 18); ctx.lineTo(p.x + 7, 18); ctx.fill();
    }
    if (game.state === 'flight' && p) {
      const r = Math.round(Math.hypot(pos.x, pos.z));
      ctx.font = `900 14px ${getComputedStyle(document.body).fontFamily}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.fillText(t.meters(r), clamp(p.x, 40, W - 40), clamp(p.y - 16, 80, H - 20));
    }
  }

  function drawBatter() {
    // Right-handed batter standing in the left box, seen from behind.
    const feet = P(-1.0, 0, 0.1);
    if (!feet) return;
    const s = feet.s;
    const hands = { x: feet.x + 0.12 * s, y: feet.y - 1.25 * s };
    ctx.save();
    // body
    ctx.fillStyle = '#00000030'; ctx.beginPath(); ctx.ellipse(feet.x, feet.y, 0.5 * s, 0.12 * s, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#d8dce8';
    ctx.fillRect(feet.x - 0.3 * s, feet.y - 0.9 * s, 0.2 * s, 0.9 * s); ctx.fillRect(feet.x + 0.08 * s, feet.y - 0.9 * s, 0.2 * s, 0.9 * s);
    let twist = 0, ang = -2.3;
    const sw = game && game.swing;
    if (sw) {
      const k = clamp(sw.anim / 0.22, 0, 1);
      const ease = 1 - (1 - k) * (1 - k);
      ang = -2.3 + ease * 2.7; twist = ease;
    }
    ctx.fillStyle = '#1b3f8f'; ctx.fillRect(feet.x - 0.32 * s + twist * 0.06 * s, feet.y - 1.55 * s, 0.62 * s, 0.7 * s);
    ctx.fillStyle = '#ffffff'; ctx.font = `900 ${0.32 * s}px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (twist < 0.5) ctx.fillText('7', feet.x, feet.y - 1.25 * s);
    // helmet
    ctx.fillStyle = '#1b3f8f'; ctx.beginPath(); ctx.arc(feet.x, feet.y - 1.73 * s, 0.19 * s, 0, 6.28); ctx.fill();
    // bat
    ctx.translate(hands.x, hands.y);
    ctx.rotate(ang);
    ctx.fillStyle = '#d9a35c';
    ctx.beginPath(); ctx.moveTo(0, -0.025 * s); ctx.lineTo(0.85 * s, -0.045 * s); ctx.quadraticCurveTo(0.9 * s, 0, 0.85 * s, 0.045 * s); ctx.lineTo(0, 0.025 * s); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#1b3f8f'; ctx.beginPath(); ctx.arc(hands.x, hands.y, 0.07 * s, 0, 6.28); ctx.fill();
  }

  function drawCatcher() {
    const c = P(0.05, 0, -0.95);
    if (!c) return;
    const s = c.s;
    ctx.fillStyle = '#2a2f3a'; ctx.beginPath(); ctx.ellipse(c.x, c.y - 0.45 * s, 0.38 * s, 0.4 * s, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#3a3f4c'; ctx.beginPath(); ctx.arc(c.x, c.y - 0.95 * s, 0.16 * s, 0, 6.28); ctx.fill();
  }

  function drawPitchLabel() {
    if (!game || !game.pitch || !(game.state === 'pitch' || game.state === 'result' || game.state === 'flight')) return;
    if (game.state === 'pitch' && game.pitch.t < game.pitch.T * 0.45) return;
    const p = game.pitch;
    ctx.font = `800 13px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const txt = `${t[p.def.id]} · ${p.kmh} km/h`;
    const x = 12, y = H - 40;
    ctx.fillStyle = '#061024b8'; const w = ctx.measureText(txt).width + 16; ctx.fillRect(x, y - 16, w, 22);
    ctx.fillStyle = p.def.col; ctx.fillText(txt, x + 8, y);
  }

  function render(now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.save();
    if (shake > 0 && !reducedMotion.matches) ctx.translate(rand(-1, 1) * shake * 12, rand(-1, 1) * shake * 12);
    drawField(now);
    drawPitcher();
    drawHitBall();
    drawZone();
    drawPitchBall();
    drawBatter();
    ctx.restore();
    for (const p of particles) { if (p.delay > 0) continue; ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    drawPitchLabel();
  }

  // ---------- HUD ----------
  function renderHud() {
    if (!game) return;
    const o = $('outs');
    if (o.children.length !== game.maxOuts) { o.textContent = ''; for (let i = 0; i < game.maxOuts; i++) o.append(document.createElement('i')); }
    [...o.children].forEach((el, i) => el.classList.toggle('on', i < game.outs));
    o.setAttribute('aria-label', `${game.outs}/${game.maxOuts}`);
    if (game.lv) {
      const lv = game.lv;
      $('hud-a-label').textContent = t.levelN(game.level + 1);
      $('hud-a').textContent = `${game.hrs} HR`;
      $('goal-label').textContent = t.goalLabel;
      $('goal').textContent = lv.goal === 'hr' ? t.progHr(game.hrs, lv.n) : lv.goal === 'far' ? t.progFar(game.longest, lv.n) : t.progStreak(game.streak, lv.n);
    } else {
      $('hud-a-label').textContent = t.homers;
      $('hud-a').textContent = String(game.hrs);
      $('goal-label').textContent = t.total;
      $('goal').textContent = t.meters(game.total);
    }
  }
  function updateTip() {
    const touch = document.body.classList.contains('touch');
    $('tip').textContent = (touch ? t.ctrlTouch : '') + ' ' + (settings.aim === 'manual' ? t.tipManual : t.tipAuto);
  }

  // ---------- input ----------
  addEventListener('touchstart', () => { if (!document.body.classList.contains('touch')) { document.body.classList.add('touch'); updateTip(); } }, { passive: true, capture: true });
  if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
  function setAimFromEvent(e) {
    const r = canvas.getBoundingClientRect();
    const u = unproject(e.clientX - r.left, e.clientY - r.top);
    aimPt.x = clamp(u.x, -0.6, 0.6); aimPt.y = clamp(u.y, 0.1, 1.5);
  }
  canvas.addEventListener('pointermove', e => { if (settings.aim === 'manual' && e.pointerType === 'mouse') setAimFromEvent(e); });
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    canvas.focus({ preventScroll: true });
    if (settings.aim === 'manual') setAimFromEvent(e);
    swing();
  });
  addEventListener('keydown', e => {
    if (!$('setup').hidden || !$('result').hidden) return;
    if (!$('paused').hidden) { if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { e.preventDefault(); resume(); } return; }
    if (e.key === ' ' || e.key === 'Enter') { if (e.target === $('mute') || e.target === $('pause-btn')) return; e.preventDefault(); if (!e.repeat) swing(); }
    else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { e.preventDefault(); pause(); }
    else if (e.key === 'm' || e.key === 'M') $('mute').click();
    else if (settings.aim === 'manual' && e.key.startsWith('Arrow')) {
      e.preventDefault();
      const st = 0.05;
      if (e.key === 'ArrowLeft') aimPt.x -= st; if (e.key === 'ArrowRight') aimPt.x += st;
      if (e.key === 'ArrowUp') aimPt.y += st; if (e.key === 'ArrowDown') aimPt.y -= st;
      aimPt.x = clamp(aimPt.x, -0.6, 0.6); aimPt.y = clamp(aimPt.y, 0.1, 1.5);
    }
  });

  // ---------- pause ----------
  function pause() {
    if (!game || game.over || paused) return;
    paused = true;
    $('pause-hint').textContent = document.body.classList.contains('touch') ? t.ctrlTouch : t.ctrlKeys;
    $('paused').hidden = false; $('resume').focus({ preventScroll: true });
    setCrowd(0.02);
  }
  function resume() { paused = false; $('paused').hidden = true; canvas.focus({ preventScroll: true }); last = performance.now(); setCrowd(0.06); }
  $('pause-btn').addEventListener('click', pause);
  $('resume').addEventListener('click', resume);
  $('quit').addEventListener('click', () => { paused = false; $('paused').hidden = true; if (game) { game.over = true; game.state = 'end'; } openSetup(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // ---------- setup ----------
  function buildLevels() {
    const box = $('levels'); box.textContent = '';
    const unlocked = Math.min(LEVELS.length - 1, cleared.length ? Math.max(...cleared) + 1 : 0);
    LEVELS.forEach((lv, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = i + 1;
      b.disabled = i > unlocked;
      b.classList.toggle('done', cleared.includes(i));
      b.setAttribute('aria-pressed', String(settings.level === i));
      b.setAttribute('aria-label', `${t.levelN(i + 1)}: ${b.disabled ? t.locked : goalText(lv)}`);
      b.addEventListener('click', () => { settings.level = i; write('settings', settings); syncSetup(); });
      box.append(b);
    });
    if (settings.level > unlocked) settings.level = unlocked;
  }
  function syncSetup() {
    for (const seg of document.querySelectorAll('.seg[data-key]')) for (const b of seg.children) b.setAttribute('aria-pressed', String(settings[seg.dataset.key] === b.dataset.value));
    const ch = settings.mode === 'challenge';
    $('level-field').hidden = !ch;
    if (ch) {
      buildLevels();
      const lv = LEVELS[settings.level];
      const kinds = [...new Set(lv.types)].map(k => t[PITCHES[k].id]).join(', ');
      $('lv-goal').textContent = `${goalText(lv)} · ${t.outsLeft(lv.outs)} · ${kinds}`;
    }
    $('hint').textContent = (document.body.classList.contains('touch') ? t.ctrlTouch : t.ctrlKeys);
    $('record').textContent = ch ? t.progress(cleared.length, LEVELS.length) : t.bestDerby(best.hr, best.dist);
  }
  for (const seg of document.querySelectorAll('.seg[data-key]')) seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    settings[seg.dataset.key] = b.dataset.value; write('settings', settings); syncSetup();
  });
  function openSetup() {
    for (const id of ['result', 'paused']) $(id).hidden = true;
    syncSetup(); $('setup').hidden = false; $('start').focus({ preventScroll: true });
    setCrowd(0.03);
  }
  function start(level) {
    initAudio();
    for (const id of ['setup', 'result', 'paused']) $(id).hidden = true;
    paused = false; particles = [];
    newGame(settings.mode, level ?? settings.level);
    $('hud').hidden = false;
    canvas.focus({ preventScroll: true });
    last = performance.now();
    announce(settings.mode === 'challenge' ? `${t.levelN(game.level + 1)}. ${goalText(game.lv)}` : t.derby);
  }
  $('start').addEventListener('click', () => start());
  $('again').addEventListener('click', () => start(game ? game.level : settings.level));
  $('next').addEventListener('click', () => { settings.level = Math.min(LEVELS.length - 1, game.level + 1); write('settings', settings); start(settings.level); });
  $('to-menu').addEventListener('click', openSetup);

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    render(now);
    requestAnimationFrame(frame);
  }
  resize(); syncMute();
  game = null;
  openSetup();
  updateTip();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
