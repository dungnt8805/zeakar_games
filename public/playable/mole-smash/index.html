<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mole Smash</title>
<style>
:root {
  --ink: #2f3a1c;
  --muted: #5f6d47;
  --grass: #79c450;
  --grass-dark: #5aa236;
  --soil: #8d5b34;
  --accent: #ff7a2f;
  --accent-dark: #d4561a;
  --gold: #ffc531;
  --bad: #e5484d;
  --paper: #fffbef;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: linear-gradient(180deg, #bfe7ff 0%, #d9f2c4 38%, #b5e08f 100%); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }

.app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.hud { display: flex; align-items: stretch; gap: 6px; width: 100%; max-width: 520px; margin: 0 auto; }
.stat { flex: 1; min-width: 0; padding: 5px 6px; border-radius: 14px; background: #ffffffb8; text-align: center; box-shadow: 0 3px 0 #8fc26a66; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.stat strong.low { color: var(--bad); }
.stat strong .mult { font-size: 13px; color: var(--accent-dark); margin-left: 2px; }
.icon-btn { flex: 0 0 auto; width: 46px; border-radius: 14px; background: var(--paper); color: var(--accent-dark); box-shadow: 0 4px 0 #c7b48a; display: grid; place-items: center; }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c7b48a; }
.icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
.timebar { width: 100%; max-width: 520px; margin: 0 auto; height: 8px; border-radius: 99px; background: #ffffff8c; overflow: hidden; flex: 0 0 auto; }
.timebar i { display: block; height: 100%; width: 100%; border-radius: inherit; background: var(--grass-dark); transform-origin: left; }
.timebar.low i { background: var(--bad); }

.field { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; container-type: size; }
.board { --cols: 3; --rows: 3; --aspect: 1; --max: 520px; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); gap: 1.5%; width: min(100cqw, calc(100cqh * var(--aspect)), var(--max)); padding: 2.5%; border-radius: 26px; background: repeating-linear-gradient(135deg, var(--grass) 0 18px, #72bd49 18px 36px); box-shadow: inset 0 0 0 4px #ffffff40, 0 8px 0 var(--grass-dark), 0 18px 30px #3b6a1f40; touch-action: manipulation; }
.board:focus { outline: none; }
.board.shake { animation: shake .3s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

.hole { position: relative; width: 100%; height: 100%; min-width: 0; min-height: 0; border-radius: 22%; container-type: size; cursor: pointer; touch-action: manipulation; }
.hole:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
.pit { position: absolute; left: 9%; right: 9%; bottom: 12%; height: 28%; border-radius: 50%; background: radial-gradient(ellipse at 50% 30%, #1e1009 50%, #3d2414 80%); box-shadow: 0 0 0 4cqw #7a4a28, 0 0 0 5.5cqw #6a3f22; }
.win { position: absolute; left: 11%; right: 11%; top: 0; bottom: 26%; overflow: hidden; pointer-events: none; }
.critter { position: absolute; inset: 0; transform: translateY(102%); transition: transform .13s ease-out; }
.hole.up .critter { transform: translateY(0); }
.hole.down .critter { transition-duration: .17s; transition-timing-function: ease-in; }
.critter svg { display: block; width: 100%; height: 100%; }
.mound { position: absolute; left: 4%; right: 4%; bottom: 4%; height: 22%; border-radius: 0 0 50% 50% / 0 0 100% 100%; background: linear-gradient(#a06a3d, #7a4a28); box-shadow: inset 0 3cqw 0 #b97d4a; pointer-events: none; }
.hammer { position: absolute; left: 44%; top: -4%; width: 56%; height: 62%; transform-origin: 50% 95%; opacity: 0; pointer-events: none; z-index: 3; }
.hammer svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 2px #0004); }
.hammer.swing { animation: swing .24s ease-out; }
@keyframes swing { 0% { opacity: 1; transform: rotate(30deg); } 40% { opacity: 1; transform: rotate(-62deg); } 75% { opacity: 1; transform: rotate(-56deg); } 100% { opacity: 0; transform: rotate(-56deg); } }
.hat { position: absolute; left: 22%; top: 4%; width: 56%; height: 40%; opacity: 0; pointer-events: none; z-index: 2; }
.hat svg { width: 100%; height: 100%; }
.hat.fly { animation: fly .6s ease-out; }
@keyframes fly { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(40%, -70%) rotate(70deg); } }
.pop { position: absolute; left: 0; right: 0; top: 8%; text-align: center; font-size: 19cqw; font-weight: 900; color: #fff; text-shadow: 0 2px 0 var(--accent-dark), 0 0 8px #0005; opacity: 0; pointer-events: none; z-index: 4; white-space: nowrap; }
.pop.bad { text-shadow: 0 2px 0 #8a1c20, 0 0 8px #0005; color: #ffd6d6; }
.pop.gold { color: #fff4b8; text-shadow: 0 2px 0 #b07800, 0 0 10px #ffc53199; }
.pop.show { animation: rise-pop .7s ease-out; }
@keyframes rise-pop { 0% { opacity: 1; transform: translateY(10%) scale(.8); } 30% { opacity: 1; transform: translateY(-10%) scale(1.1); } 100% { opacity: 0; transform: translateY(-60%) scale(1); } }
.key { position: absolute; left: 7%; top: 7%; min-width: 15cqw; padding: 1cqw 2.5cqw; border-radius: 3cqw; background: #ffffffa8; color: var(--muted); font-size: 10cqw; font-weight: 800; line-height: 1.2; pointer-events: none; }
@media (hover: none), (pointer: coarse) { .key { display: none; } }

.banner { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; z-index: 6; }
.banner[hidden] { display: none; }
.banner strong { font-size: clamp(30px, 10vw, 54px); font-weight: 900; letter-spacing: -.02em; color: #fff; text-shadow: 0 4px 0 var(--accent-dark), 0 0 24px #0006; animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: #2f3a1c55; backdrop-filter: blur(2px); }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 380px); max-height: 100%; overflow: auto; padding: 22px 20px; border-radius: 28px; background: var(--paper); text-align: center; box-shadow: 0 20px 50px #2f3a1c55; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel .emoji { font-size: 44px; line-height: 1; }
.panel h1 { font-size: clamp(36px, 11vw, 46px); font-weight: 900; letter-spacing: -.04em; line-height: 1.05; }
.panel h1 span { color: var(--accent); }
.panel h2 { font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
.panel p { margin-top: 8px; font-size: 15px; line-height: 1.45; color: var(--muted); }
.panel .small { font-size: 12px; }
@media (hover: none), (pointer: coarse) { .panel .keys-hint { display: none; } }
.legend { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
.legend div { display: grid; justify-items: center; align-content: start; gap: 2px; padding: 6px 2px; border-radius: 14px; background: #eef7dc; }
.legend div.bad { background: #fde8e6; }
.legend svg { width: 40px; height: 44px; }
.legend b { font-size: 14px; font-weight: 900; }
.legend .bad b { color: var(--bad); }
.legend span { font-size: 10.5px; font-weight: 700; line-height: 1.2; color: var(--muted); }
.result { margin-top: 10px; font-size: 22px !important; font-weight: 900; color: var(--ink) !important; }
.badge { display: inline-block; margin-top: 12px !important; padding: 5px 14px; border-radius: 99px; background: var(--gold); color: #4a3600 !important; font-size: 13px !important; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 18px; width: 100%; padding: 15px; border-radius: 18px; background: var(--accent); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 5px 0 var(--accent-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost { margin-top: 10px; width: 100%; padding: 12px; border-radius: 16px; background: #eef7dc; color: var(--grass-dark); font-size: 16px; font-weight: 800; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 600px) { .panel { padding: 14px 16px; } .panel .emoji { display: none; } .legend { margin-top: 8px; } .cta { margin-top: 12px; } }
.key { font-size: max(10px, 10cqw); }
@media (max-width: 400px) { .hud { gap: 5px; } .stat { padding: 5px 3px; } .stat small { letter-spacing: 0; white-space: normal; line-height: 1.15; } .icon-btn { width: 40px; } }
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .app { display: grid; grid-template-columns: 156px minmax(0, 1fr); grid-template-rows: auto auto 1fr; column-gap: 14px; row-gap: 8px; }
  .hud { grid-column: 1; grid-row: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: none; margin: 0; }
  .icon-btn { grid-column: 1 / -1; height: 40px; width: auto; }
  .timebar { grid-column: 1; grid-row: 2; max-width: none; }
  .field { grid-column: 2; grid-row: 1 / -1; }
  .banner strong { font-size: 40px; }
}
@media (max-height: 420px) {
  .overlay { padding: 8px; }
  .panel { padding: 12px 16px; }
  .panel h1 { font-size: 32px; }
  .panel h2 { font-size: 24px; }
  .panel p { margin-top: 4px; font-size: 14px; line-height: 1.35; }
  .legend { gap: 5px; }
  .legend div { padding: 4px 2px; }
  .legend svg { width: 30px; height: 32px; }
  .cta { margin-top: 10px; padding: 10px; font-size: 18px; }
  .ghost { margin-top: 8px; padding: 9px; }
  .result { margin-top: 6px; font-size: 19px !important; }
}
@media (max-height: 420px) and (min-width: 560px) { .panel { width: min(100%, 640px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .hammer.swing { opacity: 1; transform: rotate(-56deg); } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="sprites"></defs></svg>
<main class="app">
  <div class="hud">
    <div class="stat"><small data-i18n="score"></small><strong id="score">0</strong></div>
    <div class="stat"><small data-i18n="time"></small><strong id="time">60</strong></div>
    <div class="stat"><small data-i18n="combo"></small><strong id="combo">0</strong></div>
    <div class="stat"><small data-i18n="best"></small><strong id="best">0</strong></div>
    <button type="button" class="icon-btn" id="pause" data-i18n-label="pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  </div>
  <div class="timebar" id="timebar"><i id="timefill"></i></div>
  <div class="field" id="field">
    <div class="board" id="board" role="group" tabindex="-1" data-i18n-label="field"></div>
    <div class="banner" id="banner" hidden><strong id="banner-text"></strong></div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <p class="emoji" aria-hidden="true">🔨</p>
    <h1 id="start-title">Mole <span>Smash</span></h1>
    <p data-i18n="tagline"></p>
    <div class="legend">
      <div><svg viewBox="0 0 100 110" aria-hidden="true"><use href="#s-mole"/></svg><b>+10</b><span data-i18n="legMole"></span></div>
      <div><svg viewBox="0 0 100 110" aria-hidden="true"><use href="#s-gold"/></svg><b>+50</b><span data-i18n="legGold"></span></div>
      <div><svg viewBox="0 0 100 110" aria-hidden="true"><use href="#s-helmet"/></svg><b>+25</b><span data-i18n="legHelmet"></span></div>
      <div class="bad"><svg viewBox="0 0 100 110" aria-hidden="true"><use href="#s-bunny"/></svg><b>−20</b><span data-i18n="legBunny"></span></div>
      <div class="bad"><svg viewBox="0 0 100 110" aria-hidden="true"><use href="#s-bomb"/></svg><b>−30</b><span data-i18n="legBomb"></span></div>
    </div>
    <button type="button" class="cta" id="play" data-i18n="play"></button>
    <p class="result" id="start-best"></p>
    <p class="small keys-hint" data-i18n="controls"></p>
  </div>
</div>

<div class="overlay" id="paused" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="paused-title">
    <h2 id="paused-title" data-i18n="paused"></h2>
    <p class="result" id="paused-score"></p>
    <button type="button" class="cta" id="resume" data-i18n="resume"></button>
    <button type="button" class="ghost" data-action="menu" data-i18n="menu"></button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <p class="emoji" aria-hidden="true">⏱️</p>
    <h2 id="over-title" data-i18n="timeUp"></h2>
    <p class="result" id="final"></p>
    <p id="stats"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="again" data-i18n="again"></button>
    <button type="button" class="ghost" data-action="menu" data-i18n="menu"></button>
  </div>
</div>

    hole.kind = null;
    hole.el.classList.remove('up', 'down');
    labelHole(hole);
  }

  function restartAnim(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function popText(hole, text, tone = '') {
    hole.pop.textContent = text;
    hole.pop.className = `pop ${tone}`;
    restartAnim(hole.pop, 'show');
  }

  function bonk(hole) {
    if (game.state !== 'play') return;
    restartAnim(hole.hammer, 'swing');
    if (hole.phase !== 'up') {
      game.whiffs += 1;
      breakCombo();
      return updateHud();
    }
    const kind = hole.kind;
    if (DECOYS.has(kind)) {
      addScore(POINTS[kind]);
      popText(hole, String(POINTS[kind]).replace('-', '−'), 'bad');
      hole.use.setAttribute('href', `#s-${kind}-hit`);
      breakCombo();
      sink(hole, 0.45);
      if (!reducedMotion) restartAnim(els.board, 'shake');
      announce(kind === 'bomb' ? t.bombHit : t.bunnyHit);
      return updateHud();
    }
    game.hits += 1;
    game.combo += 1;
    game.bestCombo = Math.max(game.bestCombo, game.combo);
    const m = multiplier();
    if (m > 1 && game.combo === [0, 0, 5, 12, 24][m]) showBanner(t.multi(m), 800);
    if (kind === 'helmet' && hole.hp > 1) {
      hole.hp -= 1;
      hole.kind = 'bare';
      hole.use.setAttribute('href', '#s-mole');
      hole.t = Math.max(hole.t, 0.55);
      restartAnim(hole.hat, 'fly');
      addScore(POINTS.helmetHit * m);
      popText(hole, `+${POINTS.helmetHit * m}`);
      return updateHud();
    }
    const base = kind === 'bare' ? POINTS.helmet : POINTS[kind];
    addScore(base * m);
    popText(hole, `+${base * m}`, kind === 'gold' ? 'gold' : '');
    if (kind === 'gold') announce(t.goldHit);
    hole.use.setAttribute('href', `#s-${kind === 'gold' ? 'gold' : 'mole'}-hit`);
    sink(hole, 0.32);
    updateHud();
  }

  function breakCombo() { game.combo = 0; }

  function addScore(points) {
    game.score = Math.max(0, game.score + points);
    if (game.score >= game.nextMilestone) {
      while (game.score >= game.nextMilestone) game.nextMilestone += MILESTONE;
      announce(t.milestone(game.score));
    }
  }

  function update(dt) {
    if (game.state === 'ready') {
      game.readyT -= dt;
      if (game.readyT <= 0) { game.state = 'play'; showBanner(t.go, 600); }
      return;
    }
    game.elapsed += dt;
    game.timeLeft = Math.max(0, game.timeLeft - dt);
    if (!game.warned && game.timeLeft <= 10) { game.warned = true; announce(t.tenLeft); }
    game.spawnT -= dt;
    if (game.spawnT <= 0) {
      spawn();
      const p = progress();
      game.spawnT = lerp(0.85, 0.36, p) * rand(0.7, 1.3);
    }
    for (const hole of holes) {
      if (hole.phase === 'empty') continue;
      hole.t -= dt;
      if (hole.t > 0) continue;
      if (hole.phase === 'up') {
        // A real mole that gets away breaks the combo; decoys simply leave.
        if (!DECOYS.has(hole.kind) && game.combo > 0) breakCombo();
        sink(hole);
      } else if (hole.phase === 'hit') sink(hole);
      else clearHole(hole);
    }
    updateHud();
    if (game.timeLeft <= 0) endGame();
  }

  function endGame() {
    game.state = 'over';
    for (const hole of holes) clearHole(hole);
    const isBest = game.score > game.best;
    if (isBest) writeBest(game.score);
    const swings = game.hits + game.whiffs;
    const accuracy = swings ? Math.round(game.hits / swings * 100) : 0;
    els.final.textContent = t.final(game.score);
    els.stats.textContent = t.stats(game.hits, accuracy, game.bestCombo);
    els.newBest.hidden = !isBest;
    els.over.hidden = false;
    els.banner.hidden = true;
    updateHud();
    announce(`${t.timeUp} ${t.final(game.score)}. ${isBest ? t.newBest : ''}`);
    els.again.focus({ preventScroll: true });
  }

  function showMenu() {
    if (game.state === 'paused' || game.state === 'play' || game.state === 'ready') for (const hole of holes) clearHole(hole);
    game = { state: 'start', score: 0, best: readBest(), timeLeft: ROUND, combo: 0 };
    els.over.hidden = true;
    els.paused.hidden = true;
    els.start.hidden = false;
    els.startBest.textContent = t.bestLine(game.best);
    els.banner.hidden = true;
    updateHud();
    els.play.focus({ preventScroll: true });
  }

  function pause() {
    if (game.state !== 'play' && game.state !== 'ready') return;
    game.resumeTo = game.state;
    game.state = 'paused';
    els.pausedScore.textContent = t.final(game.score);
    els.paused.hidden = false;
    els.resume.focus({ preventScroll: true });
  }

  function resume() {
    if (game.state !== 'paused') return;
    game.state = game.resumeTo;
    els.paused.hidden = true;
    els.board.focus({ preventScroll: true });
    loop();
  }

  function updateHud() {
    const secs = Math.ceil(game.timeLeft);
    els.score.textContent = String(game.score);
    els.time.textContent = String(secs);
    els.time.classList.toggle('low', secs <= 10 && game.state !== 'start');
    els.timebar.classList.toggle('low', secs <= 10 && game.state !== 'start');
    els.timefill.style.transform = `scaleX(${game.timeLeft / ROUND})`;
    const m = game.combo ? multiplier() : 1;
    els.combo.innerHTML = m > 1 ? `${game.combo}<span class="mult">×${m}</span>` : String(game.combo);
    els.best.textContent = String(Math.max(game.best, game.score));
  }

  function showBanner(text, ms = 900) {
    els.bannerText.textContent = text;
    els.banner.hidden = false;
    announce(text);
    clearTimeout(showBanner.timer);
    showBanner.timer = setTimeout(() => { els.banner.hidden = true; }, ms);
  }

  function announce(text) { els.announcer.textContent = text; }

  function loop() {
    cancelAnimationFrame(loop.frame);
    game.last = performance.now();
    const tick = time => {
      // Clamp dt so a stalled frame never burns the round clock.
      const dt = Math.min(0.05, Math.max(0, (time - game.last) / 1000));
      game.last = time;
      if (game.state === 'ready' || game.state === 'play') {
        update(dt);
        loop.frame = requestAnimationFrame(tick);
      }
    };
    loop.frame = requestAnimationFrame(tick);
  }

  // ---------- Input ----------
  function holeForCode(code) {
    for (let r = 0; r < ROWS; r++) {
      const c = KEYS[cols][r].indexOf(code);
      if (c >= 0) return holes[r * cols + c];
      const n = NUMPAD[r].indexOf(code);
      if (n >= 0 && n < cols) return holes[r * cols + n];
    }
    return null;
  }

  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.key === 'p' || event.key === 'P') {
      if (game.state === 'play' || game.state === 'ready') { event.preventDefault(); return pause(); }
      if (game.state === 'paused') { event.preventDefault(); return resume(); }
    }
    if (game.state !== 'play' && game.state !== 'ready') return;
    const hole = holeForCode(event.code);
    if (!hole) return;
    event.preventDefault();
    if (!event.repeat) bonk(hole);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  els.play.addEventListener('click', newGame);
  els.again.addEventListener('click', newGame);
  els.resume.addEventListener('click', resume);
  els.pause.addEventListener('click', pause);
  for (const button of document.querySelectorAll('[data-action="menu"]')) button.addEventListener('click', showMenu);

  buildBoard(3);
  new ResizeObserver(fitBoard).observe(els.field);
  if (navigator.keyboard && navigator.keyboard.getLayoutMap) {
    navigator.keyboard.getLayoutMap().then(map => {
      keyLabels = map;
      for (const hole of holes) { hole.el.querySelector('.key').textContent = keyName(hole.code); labelHole(hole); }
    }).catch(() => {});
  }
  showMenu();
})();
</script>
</body>
</html>
