<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water Sort</title>
<style>
:root {
  --ink: #233462;
  --muted: #6a77a0;
  --bg: #e4f1ff;
  --accent: #4f7cff;
  --accent-dark: #3559d4;
  --mint: #3cc6a8;
  --mint-dark: #25a185;
  --cream: #fbfdff;
  --edge: #c9d9f7;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(circle at 20% 30%, #ffffff99 0 3px, transparent 4px), radial-gradient(circle at 70% 80%, #ffffff80 0 2px, transparent 3px), linear-gradient(170deg, #e8f6ff, #e6e2ff);
  background-size: 46px 46px, 34px 34px, 100% 100%;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button, a { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }
.icon { fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 520px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 7px; }
h1 { flex: 1; min-width: 0; font-size: clamp(21px, 6.4vw, 30px); font-weight: 900; letter-spacing: -.03em; white-space: nowrap; line-height: 1; }
h1 span, .panel h2 span { color: var(--accent); }
.stat { min-width: 56px; padding: 5px 8px; border-radius: 14px; background: #ffffffc4; text-align: center; box-shadow: 0 3px 0 var(--edge); }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.stat strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 14px; background: var(--cream); font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 var(--edge); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.icon-btn svg { width: 20px; height: 20px; vertical-align: middle; }
.hint { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.3; }

.board-wrap { flex: 1; min-height: 0; position: relative; }
.board { position: absolute; inset: 0; --w: 40px; --h: 150px; --lh: 32px; --bw: 3px; }
.tube { position: absolute; left: 0; top: 0; z-index: 2; width: var(--w); height: var(--h); transition: transform .18s ease, left .3s ease, top .3s ease; touch-action: manipulation; }
.tube:focus-visible { outline: none; }
.tube:focus-visible .glass { outline: 3px solid var(--accent-dark); outline-offset: 4px; }
.tube::before { content: ""; position: absolute; z-index: 3; left: -14%; right: -14%; top: calc(var(--bw) * -1); height: calc(var(--w) * .16); border-radius: 99px; background: #fffffff0; box-shadow: 0 2px 4px #3559d433; }
.glass { position: absolute; inset: 0; overflow: hidden; border: var(--bw) solid #ffffffd9; border-top: 0; border-radius: 0 0 calc(var(--w) / 2) calc(var(--w) / 2); background: linear-gradient(90deg, #ffffff66, #ffffff1a 35%, #ffffff1a 65%, #ffffff73); box-shadow: inset 0 0 0 1px #8fb0f055, 0 8px 16px #3559d42b; transition: box-shadow .2s; }
.glass::after { content: ""; position: absolute; z-index: 2; left: 16%; top: 10%; bottom: 16%; width: 13%; border-radius: 99px; background: #ffffff70; pointer-events: none; }
.liquid { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column-reverse; }
.layer { position: relative; flex: none; height: var(--lh); display: grid; place-items: center; overflow: hidden; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 80%, #000) 0%, var(--c) 28%, color-mix(in srgb, var(--c) 78%, #fff) 72%, var(--c) 100%); }
.layer:last-child::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(var(--lh) * .13); background: color-mix(in srgb, var(--c) 55%, #fff); }
.layer svg { width: calc(var(--lh) * .42); height: calc(var(--lh) * .42); fill: var(--s); }
.tube.selected { transform: translateY(calc(var(--w) * -.42)); }
.tube.selected .glass { box-shadow: inset 0 0 0 1px #8fb0f055, 0 0 0 3px #ffffffcc, 0 0 22px #4f7cff88; }
.tube.target .glass { box-shadow: inset 0 0 0 1px #8fb0f055, 0 0 0 2px #3cc6a8aa, 0 8px 16px #3559d42b; }
.tube.pouring { z-index: 5; }
.tube.nope { animation: nope .3s; }
@keyframes nope { 25% { transform: translateX(-10%); } 75% { transform: translateX(10%); } }
.cap { position: absolute; z-index: 4; left: 4%; right: 4%; top: calc(var(--w) * -.24); height: calc(var(--w) * .36); border-radius: 30% 30% 18% 18% / 45% 45% 25% 25%; background: linear-gradient(90deg, #c98d5c, #ecc49b 40%, #d39a68); box-shadow: inset 0 -3px 0 #a86f43, 0 2px 4px #0003; display: none; }
.tube.done .cap { display: block; animation: cap .45s cubic-bezier(.3, 1.6, .5, 1); }
.tube.done .glass { box-shadow: inset 0 0 0 1px #8fb0f055, 0 0 18px #fff6, 0 8px 16px #3559d42b; }
@keyframes cap { from { transform: translateY(-120%) rotate(-12deg); opacity: 0; } }
.stream { position: absolute; z-index: 1; width: calc(var(--w) * .17); border-radius: 99px; background: var(--c); transform-origin: 50% 0; pointer-events: none; }
.spark { position: absolute; z-index: 6; font-size: calc(var(--w) * .42); line-height: 1; color: #fff3a6; text-shadow: 0 0 6px #ffd84d; pointer-events: none; animation: spark .75s ease-out forwards; }
@keyframes spark { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(70deg); opacity: 0; } }

.boosters { display: flex; gap: 10px; justify-content: center; }
.booster { position: relative; flex: 1; max-width: 160px; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 6px; border-radius: 16px; background: var(--cream); box-shadow: 0 4px 0 var(--edge); font-size: 14px; font-weight: 800; }
.booster svg { flex: 0 0 auto; width: 20px; height: 20px; color: var(--accent); }
.booster span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.booster:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.booster:disabled { opacity: .45; cursor: default; }
.count { position: absolute; top: -7px; right: -5px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 99px; background: var(--mint-dark); color: #fff; font-size: 12px; font-weight: 900; line-height: 22px; text-align: center; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #23346255; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: 100%; overflow: auto; background: var(--cream); border-radius: 28px; padding: 26px 22px; text-align: center; box-shadow: 0 20px 50px #23346255; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
.panel .emoji { font-size: 44px; line-height: 1.2; }
.panel .text { margin-top: 8px; font-size: 15px; color: var(--muted); line-height: 1.45; }
.picker { margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 14px; }
.picker strong { min-width: 120px; font-size: 20px; }
.picker button { width: 42px; height: 42px; border-radius: 50%; background: #e3ecff; font-size: 22px; font-weight: 900; }
.picker button:disabled { opacity: .35; cursor: default; }
.result { margin-top: 10px; font-size: 17px; font-weight: 700; }
.cta { margin-top: 20px; width: 100%; padding: 15px; border-radius: 18px; background: var(--accent); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 6px 0 var(--accent-dark); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost { margin-top: 12px; width: 100%; padding: 12px; border-radius: 16px; background: #e3f7f1; color: #1f7c66; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #bfe9dc; }
.ghost[hidden] { display: none; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-aspect-ratio: 4/3) { .app { max-width: 860px; } }
@media (max-height: 560px) { .app { gap: 6px; } .booster { padding: 7px 6px; } .hint { display: none; } }
@media (max-width: 400px) {
  .top { flex-wrap: wrap; row-gap: 6px; }
  .top::after { content: ""; order: -1; flex: 0 0 100%; }
  h1 { order: -2; }
  .icon-btn { order: -1; }
  .stat { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 3px 8px; }
  .stat strong { font-size: 16px; }
}
@media (max-height: 520px) {
  .overlay { padding: 8px; }
  .panel { padding: 14px 18px; border-radius: 22px; }
  .panel .emoji { font-size: 30px; line-height: 1.1; }
  .panel h2 { font-size: 23px; }
  .panel .text { margin-top: 4px; font-size: 14px; line-height: 1.35; }
  .picker { margin-top: 8px; }
  .picker button { width: 36px; height: 36px; }
  .result { margin-top: 6px; }
  .cta { margin-top: 10px; padding: 11px; font-size: 18px; }
  .ghost { margin-top: 8px; padding: 9px; }
}
@media (max-height: 360px) { .panel .emoji { display: none; } }
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .app { max-width: 1000px; display: grid; grid-template-columns: minmax(0, 1fr) 224px; grid-template-rows: auto 1fr auto; grid-template-areas: "board top" "board ." "board boost"; column-gap: 14px; row-gap: 8px; }
  .top { grid-area: top; flex-wrap: wrap; row-gap: 8px; }
  h1 { flex: 1 0 100%; font-size: 26px; }
  .stat { flex: 1; }
  .hint { display: none; }
  .board-wrap { grid-area: board; }
  .boosters { grid-area: boost; flex-direction: column; gap: 12px; }
  .booster { max-width: none; flex: 0 0 auto; padding: 9px 6px; }
  .panel { width: min(100%, 560px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <h1>Water <span>Sort</span></h1>
    <div class="stat"><small data-i18n="level"></small><strong id="level">1</strong></div>
    <div class="stat"><small data-i18n="moves"></small><strong id="moves">0</strong></div>
    <button type="button" class="icon-btn" id="menu" data-i18n-label="levels"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg></button>
    <button type="button" class="icon-btn" id="restart" data-i18n-label="restart">↻</button>
  </header>
  <p class="hint" data-i18n="hint"></p>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board" role="group" data-i18n-label="board"></div>
  </div>
  <div class="boosters">
    <button type="button" class="booster" id="undo" aria-keyshortcuts="U"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="undo"></span><b class="count" id="undo-count" aria-hidden="true"></b></button>
    <button type="button" class="booster" id="extra" aria-keyshortcuts="T"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v14a4 4 0 0 0 8 0V3"/><path d="M6 3h12"/><path d="M12 8v6M9 11h6"/></svg><span data-i18n="extra"></span><b class="count" id="extra-count" aria-hidden="true"></b></button>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <p class="emoji" aria-hidden="true">🧪</p>
    <h2 id="start-title">Water <span>Sort</span></h2>
    <p class="text" data-i18n="tagline"></p>
    <p class="text" data-i18n="how"></p>
    <div class="picker">
      <button type="button" id="prev" data-i18n-label="prev">‹</button>
      <strong id="pick-level" aria-live="polite"></strong>
      <button type="button" id="next" data-i18n-label="next">›</button>
    </div>
    <button type="button" class="cta" id="play" data-i18n="play"></button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🎉</p>
    <h2 id="win-title"></h2>
    <p class="result" id="result"></p>
    <button type="button" class="cta" id="next-level" data-i18n="next"></button>
    <button type="button" class="ghost" id="replay" data-i18n="replay"></button>
  </div>
</div>

<div class="overlay" id="stuck" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="stuck-title">
    <p class="emoji" aria-hidden="true">🫙</p>
    <h2 id="stuck-title" data-i18n="stuck"></h2>
    <p class="text" data-i18n="stuckText"></p>
    <button type="button" class="cta" id="retry" data-i18n="retry"></button>
    <button type="button" class="ghost" id="stuck-undo" data-i18n="undo"></button>
    <button type="button" class="ghost" id="stuck-extra" data-i18n="extraName"></button>
  </div>
</div>

    stream.style.setProperty('--c', COLORS[color][0]);
    const bottom = pb.y + h - bw - before * lh;
    stream.style.left = `${lip.x - w * 0.085}px`;
    stream.style.top = `${lip.y}px`;
    stream.style.height = `${Math.max(4, bottom - lip.y)}px`;
    els.board.append(stream);
    await stream.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 110, easing: 'ease-in' }).finished;

    const duration = 220 + n * 90;
    const layers = [...srcEl.querySelectorAll('.layer')].slice(-n);
    layers.forEach(layer => layer.animate([{ height: `${lh}px` }, { height: '0px' }], { duration, fill: 'forwards' }));
    const liquid = dstEl.querySelector('.liquid');
    const incoming = Array.from({ length: n }, () => layerEl(color));
    incoming.forEach(layer => { layer.style.height = '0px'; liquid.append(layer); layer.animate([{ height: '0px' }, { height: `${lh}px` }], { duration, fill: 'forwards' }); });
    await wait(duration);

    stream.animate([{ transform: 'translateY(0) scaleY(1)' }, { transform: `translateY(${bottom - lip.y}px) scaleY(0)` }], { duration: 120, fill: 'forwards' }).finished.then(() => stream.remove());
    await srcEl.animate([{ transform: posed }, { transform: 'translate(0px, 0px) rotate(0deg)' }], { duration: 240, easing: 'ease-in-out' }).finished;
    srcEl.getAnimations().forEach(anim => anim.cancel());
    srcEl.classList.remove('pouring');
  }

  function sparkle(i) {
    if (reducedMotion.matches) return;
    const { w } = game.size;
    const p = game.pos[i];
    for (let k = 0; k < 7; k++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.textContent = '✦';
      const angle = (k / 7) * Math.PI * 2 - Math.PI / 2;
      s.style.left = `${p.x + w / 2}px`;
      s.style.top = `${p.y + w * 0.2}px`;
      s.style.setProperty('--dx', `${Math.cos(angle) * w * 1.1}px`);
      s.style.setProperty('--dy', `${Math.sin(angle) * w * 1.1}px`);
      s.addEventListener('animationend', () => s.remove());
      els.board.append(s);
    }
  }

  function checkEnd() {
    if (game.busy.size || game.over) return;
    if (solved(game.tubes)) return win();
    if (!hasMove(game.tubes)) stuck();
  }

  function win() {
    game.over = true;
    refresh();
    if (game.level >= highest) { highest = game.level + 1; write(STORE, highest); }
    els.winTitle.textContent = t.won(game.level);
    els.result.textContent = t.result(game.moves);
    els.announcer.textContent = `${t.won(game.level)} ${t.result(game.moves)}`;
    setTimeout(() => { els.win.hidden = false; $('next-level').focus({ preventScroll: true }); }, reducedMotion.matches ? 0 : 750);
  }

  function stuck() {
    els.stuckUndo.hidden = !game.undos || !game.history.length;
    els.stuckExtra.hidden = !game.extras;
    els.announcer.textContent = `${t.stuck}. ${t.stuckText}`;
    setTimeout(() => { if (game.over || game.busy.size || hasMove(game.tubes)) return; els.stuck.hidden = false; $('retry').focus({ preventScroll: true }); }, 400);
  }

  function undo() {
    if (!game || game.over || game.busy.size || !game.undos || !game.history.length) return;
    const { a, b, n } = game.history.pop();
    const src = game.tubes[a], dst = game.tubes[b];
    src.push(...dst.splice(dst.length - n, n));
    game.undos -= 1;
    game.moves -= 1;
    game.selected = -1;
    game.els.forEach((_, i) => renderTube(i));
    refresh();
    els.stuck.hidden = true;
    els.announcer.textContent = t.undone;
  }

  function addTube() {
    if (!game || game.over || !game.extras) return;
    game.extras -= 1;
    game.tubes.push([]);
    addTubeEl(game.tubes.length - 1);
    layout();
    refresh();
    els.stuck.hidden = true;
    els.announcer.textContent = t.added;
  }

  function showPicker() {
    pickLevel = Math.min(pickLevel, highest);
    els.pickLevel.textContent = t.levelN(pickLevel);
    els.prev.disabled = pickLevel <= 1;
    els.next.disabled = pickLevel >= highest;
  }

  function openStart() {
    pickLevel = game ? game.level : highest;
    showPicker();
    els.start.hidden = false;
    $('play').focus({ preventScroll: true });
  }

  // Arrow keys walk between tubes; up/down jump to the nearest tube in the next row.
  els.board.addEventListener('keydown', event => {
    const i = game ? game.els.indexOf(document.activeElement) : -1;
    if (i < 0 || event.altKey || event.ctrlKey || event.metaKey) return;
    let next = -1;
    if (event.key === 'ArrowLeft') next = i - 1;
    else if (event.key === 'ArrowRight') next = i + 1;
    else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
      const row = game.pos[i].row + (event.key === 'ArrowUp' ? -1 : 1);
      let bestDist = Infinity;
      game.pos.forEach((p, j) => { const d = Math.abs(p.x - game.pos[i].x); if (p.row === row && d < bestDist) { bestDist = d; next = j; } });
    } else return;
    event.preventDefault();
    if (next >= 0 && next < game.els.length) game.els[next].focus({ preventScroll: true });
  });
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || !els.start.hidden || !els.win.hidden) return;
    const key = event.key.toLowerCase();
    if (key === 'u') { event.preventDefault(); undo(); }
    else if (key === 't') { event.preventDefault(); addTube(); }
  });

  els.undo.addEventListener('click', undo);
  els.extra.addEventListener('click', addTube);
  els.stuckUndo.addEventListener('click', undo);
  els.stuckExtra.addEventListener('click', addTube);
  $('restart').addEventListener('click', () => startLevel(game.level));
  $('retry').addEventListener('click', () => startLevel(game.level));
  $('menu').addEventListener('click', openStart);
  els.prev.addEventListener('click', () => { pickLevel -= 1; showPicker(); });
  els.next.addEventListener('click', () => { pickLevel += 1; showPicker(); });
  $('play').addEventListener('click', () => startLevel(pickLevel));
  $('next-level').addEventListener('click', () => startLevel(game.level + 1));
  $('replay').addEventListener('click', () => startLevel(game.level));
  new ResizeObserver(layout).observe(els.wrap);

  startLevel(highest);
  openStart();
})();
</script>
</body>
</html>
