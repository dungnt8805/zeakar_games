<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typing Speed</title>
<style>
:root {
  --bg: #f4f1e8;
  --paper: #fffdf7;
  --ink: #283044;
  --muted: #8a8f9e;
  --faint: #b3b6c2;
  --line: #e4dfd1;
  --accent: #3d6bf0;
  --accent-dark: #2a50c4;
  --caret: #ff7a2f;
  --bad: #e0435a;
  --extra: #a8324a;
  --good: #24a26b;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: linear-gradient(#ebe6d8 1px, transparent 1px);
  background-size: 100% 32px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }

.app { height: 100%; max-width: 560px; margin: auto; display: flex; flex-direction: column; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; min-width: 0; font-size: clamp(24px, 7vw, 32px); font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
h1 span { color: var(--accent); }
.lang-note { flex: 0 1 auto; min-width: 0; padding: 5px 10px; border-radius: 99px; background: #e8e3d4; font-size: 12px; font-weight: 800; color: #6c6556; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.modes { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: flex; gap: 3px; padding: 3px; border-radius: 13px; background: #e8e3d4; }
.seg button { min-width: 40px; padding: 7px 10px; border-radius: 10px; font-size: 14px; font-weight: 800; color: #6c6556; line-height: 1.2; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 #d6cfbd; }
.seg.amount { margin-left: auto; }

.stats { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 6px; }
.stat { min-width: 0; padding: 6px 8px; border-radius: 14px; background: var(--paper); text-align: center; box-shadow: 0 3px 0 var(--line); }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 20px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.stat.main strong { color: var(--accent); }

.text-box { --fs: clamp(21px, 5.6vw, 30px); position: relative; padding: 16px 18px; border-radius: 22px; background: var(--paper); box-shadow: 0 4px 0 var(--line), 0 14px 30px #28304414; }
.viewport { position: relative; height: calc(var(--fs) * 1.65 * 3); overflow: hidden; font-size: var(--fs); line-height: 1.65; }
.words { position: relative; transition: transform .15s ease-out; }
.word { display: inline-block; margin-right: .42em; color: var(--faint); white-space: nowrap; border-bottom: 2px solid transparent; line-height: 1.5; vertical-align: top; margin-top: .075em; margin-bottom: .075em; }
.word span.ok { color: var(--ink); }
.word span.bad { color: var(--bad); }
.word span.extra { color: var(--extra); opacity: .75; }
.word.error { border-bottom-color: #e0435a88; }
.caret { position: absolute; left: 0; top: 0; width: 3px; height: 1.15em; margin-left: -1px; border-radius: 2px; background: var(--caret); transition: transform .08s linear; }
.caret.idle { animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.text-box.blurred .words { filter: blur(5px); opacity: .55; }
.text-box.blurred .caret { opacity: 0; }
.focus-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; font-size: 16px; font-weight: 800; color: var(--ink); pointer-events: none; }
.text-box:not(.blurred) .focus-msg { display: none; }
#input { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; padding: 0; border: 0; outline: 0; opacity: 0; font-size: 16px; color: transparent; caret-color: transparent; background: transparent; cursor: text; -webkit-user-select: text; user-select: text; }

.bar { display: flex; align-items: center; justify-content: center; gap: 12px; }
.restart { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 14px; background: var(--paper); font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.restart:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.hint { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.5; }
.hint kbd { padding: 1px 6px; border-radius: 6px; background: #e8e3d4; font: inherit; font-weight: 800; color: #6c6556; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: #28304466; }
.panel { width: min(100%, 440px); max-height: 100%; overflow: auto; background: var(--paper); border-radius: 28px; padding: 20px; text-align: center; box-shadow: 0 20px 50px #28304455; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel .mode-label { font-size: 13px; font-weight: 800; color: var(--muted); }
.big { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-top: 2px; }
.big strong { font-size: clamp(50px, 15vw, 64px); font-weight: 900; letter-spacing: -.04em; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.big span { font-size: 18px; font-weight: 900; color: var(--muted); }
.res-grid { display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr; gap: 6px; margin-top: 12px; }
.res-grid div { min-width: 0; padding: 7px 4px; border-radius: 12px; background: #f1ede1; }
.res-grid small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res-grid strong { display: block; font-size: clamp(14px, 4.2vw, 17px); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chars-hint { margin-top: 4px; font-size: 11px; color: var(--muted); }
.chart { display: block; width: 100%; height: auto; max-height: 160px; margin-top: 10px; }
.chart .grid-line { stroke: #e7e2d3; stroke-width: 1; }
.chart .raw { fill: none; stroke: var(--faint); stroke-width: 2; stroke-linejoin: round; }
.chart .wpm { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: #3d6bf01a; }
.chart .err { stroke: var(--bad); stroke-width: 2; stroke-linecap: round; }
.chart text { fill: var(--muted); font-size: 10px; font-weight: 700; font-family: var(--font); }
.legend { display: flex; justify-content: center; gap: 14px; margin-top: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; margin-right: 5px; vertical-align: middle; border-radius: 2px; background: var(--accent); }
.legend i.raw { background: var(--faint); }
.legend i.err { width: 8px; height: 8px; background: none; border-radius: 0; background-image: linear-gradient(45deg, transparent 40%, var(--bad) 40% 60%, transparent 60%), linear-gradient(-45deg, transparent 40%, var(--bad) 40% 60%, transparent 60%); }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: #ffd76a; color: #4a3500; font-size: 14px; font-weight: 800; }
.best-line { margin-top: 10px; font-size: 13px; font-weight: 800; color: var(--muted); }
.cta { margin-top: 14px; width: 100%; padding: 14px; border-radius: 18px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 800; box-shadow: 0 5px 0 var(--accent-dark); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost-btn { margin-top: 10px; width: 100%; padding: 11px; border-radius: 16px; background: #ece7d9; font-size: 15px; font-weight: 800; box-shadow: 0 4px 0 #d6cfbd; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-width: 900px) and (min-height: 600px) { .app { max-width: 780px; gap: 16px; } .text-box { padding: 22px 26px; } }
@media (max-height: 700px) { .chart { max-height: 120px; } .cta { margin-top: 10px; padding: 12px; } .res-grid { margin-top: 8px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Typing <span>Speed</span></h1>
    <p class="lang-note" data-i18n="englishNote"></p>
  </header>
  <div class="modes">
    <div class="seg" role="group" data-i18n-label="mode" id="kind-seg"><button type="button" data-kind="time" data-i18n="time"></button><button type="button" data-kind="words" data-i18n="words"></button></div>
    <div class="seg" role="group" data-i18n-label="extras"><button type="button" id="punct" data-i18n-label="punctuation">@ !</button><button type="button" id="nums" data-i18n-label="numbers"># 9</button></div>
    <div class="seg amount" role="group" id="amount-seg"></div>
  </div>
  <div class="stats">
    <div class="stat main"><small id="main-label"></small><strong id="main-value">30</strong></div>
    <div class="stat"><small data-i18n="wpm"></small><strong id="live-wpm">–</strong></div>
    <div class="stat"><small data-i18n="accuracy"></small><strong id="live-acc">–</strong></div>
    <div class="stat"><small data-i18n="best"></small><strong id="mode-best">–</strong></div>
  </div>
  <div class="text-box blurred" id="text-box">
    <div class="viewport" aria-hidden="true"><div class="words" id="words"><i class="caret idle" id="caret"></i></div></div>
    <p class="focus-msg" id="focus-msg"></p>
    <input id="input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" enterkeyhint="next" data-i18n-label="typeHere">
  </div>
  <p class="sr-only" id="target-text"></p>
  <div class="bar"><button type="button" class="restart" id="restart"><span aria-hidden="true">↻</span><span data-i18n="restart"></span></button></div>
  <p class="hint" id="hint"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="result" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="res-wpm-label">
    <p class="mode-label" id="res-mode"></p>
    <div class="big"><strong id="res-wpm">0</strong><span id="res-wpm-label" data-i18n="wpm"></span></div>
    <div class="res-grid">
      <div><small data-i18n="accuracy"></small><strong id="res-acc"></strong></div>
      <div><small data-i18n="raw"></small><strong id="res-raw"></strong></div>
      <div><small data-i18n="characters"></small><strong id="res-chars"></strong></div>
      <div><small data-i18n="time"></small><strong id="res-time"></strong></div>
    </div>
    <p class="chars-hint" data-i18n="charsHint"></p>
    <svg class="chart" id="chart" viewBox="0 0 340 150" role="img" data-i18n-label="chartLabel"></svg>
    <p class="legend" aria-hidden="true"><span><i></i><span data-i18n="wpm"></span></span><span><i class="raw"></i><span data-i18n="raw"></span></span><span><i class="err"></i><span data-i18n="errors"></span></span></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <p class="best-line" id="best-line" hidden></p>
    <button type="button" class="cta" id="next" data-i18n="next"></button>
    <button type="button" class="ghost-btn" id="repeat" data-i18n="repeat"></button>
  </div>
</div>

  new ResizeObserver(() => { if (run) placeCaret(); }).observe(els.box);
  document.addEventListener('visibilitychange', () => { lastFrame = performance.now(); });

  renderModes();
  newRun(false);
  syncFocus();
  if (!touch) focusInput();
})();
</script>
</body>
</html>
