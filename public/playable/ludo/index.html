<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ludo</title>
<style>
:root {
  --ink: #2b2445;
  --muted: #7a7092;
  --bg: #1c2244;
  --bg2: #2f2a6a;
  --paper: #fffaf1;
  --line: #eadfca;
  --c0: #ec4d4d; --c0d: #b23230; --c0l: #ffd4d0;
  --c1: #22b06c; --c1d: #157f4d; --c1l: #c9f1dc;
  --c2: #ffbf2e; --c2d: #d18f12; --c2l: #ffefc2;
  --c3: #3b84f4; --c3d: #2160c4; --c3l: #d3e4ff;
  --accent: #8a5cf6;
  --accent-d: #6a3dd6;
  --gold: #ffd257;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: #fff;
  background-color: var(--bg);
  background-image: radial-gradient(circle at 50% 40%, #3a3480 0, transparent 70%), repeating-linear-gradient(45deg, #ffffff06 0 2px, transparent 2px 22px), repeating-linear-gradient(-45deg, #ffffff06 0 2px, transparent 2px 22px);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.ic { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 600px; margin: auto; display: flex; flex-direction: column; gap: 9px; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; }
h1 { flex: 1; min-width: 0; font-size: clamp(24px, 7vw, 32px); font-weight: 900; letter-spacing: -.02em; line-height: 1; white-space: nowrap; }
.word span:nth-child(1) { color: var(--c0); } .word span:nth-child(2) { color: var(--c1); } .word span:nth-child(3) { color: var(--c2); } .word span:nth-child(4) { color: var(--c3); }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: #ffffff1c; box-shadow: inset 0 0 0 1px #ffffff22, 0 3px 0 #0003; }
.icon-btn:active { transform: translateY(2px); }
.icon-btn[aria-pressed="true"] { background: var(--gold); color: #4a3500; }

.players { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; }
.pl { min-width: 0; display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 14px; background: #ffffff14; box-shadow: inset 0 0 0 1px #ffffff1a; transition: box-shadow .2s, background .2s; }
.pl .dot { font-style: normal; flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 #0004; }
.pl div { min-width: 0; flex: 1; }
.pl b, .pl small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl b { font-size: 13px; line-height: 1.2; }
.pl small { font-size: 10.5px; color: #ffffffa8; font-weight: 700; }
.pl.turn { background: #ffffff2e; box-shadow: inset 0 0 0 2px var(--pc), 0 0 14px -2px var(--pc); }
.pl.done { opacity: .65; }
.pl .medal { font-size: 14px; }

.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.board { --size: min(100cqw, 100cqh); position: relative; width: var(--size); height: var(--size); padding: calc(var(--size) * .022); border-radius: calc(var(--size) * .04); background: linear-gradient(150deg, #6b4fd8, #4a32a8); box-shadow: inset 0 0 0 2px #ffffff26, 0 calc(var(--size) * .016) 0 #2e1f75, 0 18px 40px #0007; }
.field { position: relative; width: 100%; height: 100%; touch-action: manipulation; cursor: default; }
.field svg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: calc(var(--size) * .025); transition: transform .5s; }
.glow { position: absolute; width: 40%; height: 40%; border-radius: calc(var(--size) * .03); box-shadow: 0 0 0 calc(var(--size) * .008) #fff, 0 0 calc(var(--size) * .04) calc(var(--size) * .006) var(--pc); pointer-events: none; animation: breathe 1.4s ease-in-out infinite alternate; }
.glow[hidden] { display: none; }
@keyframes breathe { to { opacity: .45; } }
.layer { position: absolute; inset: 0; }
.mark { position: absolute; width: calc(100% / 15 * .78); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: calc(var(--size) * .005) dashed var(--pc); background: color-mix(in srgb, var(--pc) 28%, transparent); pointer-events: auto; cursor: pointer; animation: breathe .9s ease-in-out infinite alternate; }
.tok { position: absolute; left: calc(var(--x) * 100% / 15); top: calc(var(--y) * 100% / 15); width: calc(100% / 15 * .86); aspect-ratio: 1; transform: translate(-50%, -50%) scale(var(--s, 1)); border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 36% 30%, var(--tl) 0, var(--tc) 52%, var(--td) 100%); box-shadow: 0 calc(var(--size) * .005) 0 var(--td), 0 calc(var(--size) * .009) calc(var(--size) * .012) #0006; transition: left .13s ease-out, top .13s ease-out, transform .2s; z-index: 2; cursor: default; }
.tok b { width: 62%; height: 62%; border-radius: 50%; display: grid; place-items: center; background: #ffffff38; box-shadow: inset 0 0 0 calc(var(--size) * .0035) #ffffffd0; color: #fff; font-size: max(9px, calc(var(--size) * .026)); font-weight: 900; line-height: 1; text-shadow: 0 1px 0 #0005; }
.tok.c0 { --tc: var(--c0); --td: var(--c0d); --tl: #ff9d96; }
.tok.c1 { --tc: var(--c1); --td: var(--c1d); --tl: #8ff0bd; }
.tok.c2 { --tc: var(--c2); --td: var(--c2d); --tl: #fff0a8; }
.tok.c2 b { color: #6a4700; text-shadow: none; }
.tok.c3 { --tc: var(--c3); --td: var(--c3d); --tl: #a7cbff; }
.tok.can { z-index: 4; cursor: pointer; }
.tok.can::after { content: ''; position: absolute; inset: -16%; border-radius: 50%; border: calc(var(--size) * .006) solid #fff; box-shadow: 0 0 calc(var(--size) * .012) #fff; animation: breathe .7s ease-in-out infinite alternate; }
.tok.sel { z-index: 5; transform: translate(-50%, -50%) scale(calc(var(--s, 1) * 1.15)); }
.tok.sel::after { border-color: var(--gold); box-shadow: 0 0 calc(var(--size) * .02) var(--gold); animation: none; }
.tok.hop { animation: hop .13s ease-out; }
.tok.hop2 { animation: hop2 .13s ease-out; }
@keyframes hop { 50% { transform: translate(-50%, -62%) scale(calc(var(--s, 1) * 1.2)); } }
@keyframes hop2 { 50% { transform: translate(-50%, -62%) scale(calc(var(--s, 1) * 1.2)); } }
.tok.fly { transition: left .45s cubic-bezier(.3, .1, .3, 1), top .45s cubic-bezier(.3, .1, .3, 1), transform .2s; z-index: 6; }
.tok.out { opacity: .55; }
.tok:focus-visible { outline: calc(var(--size) * .006) solid var(--gold); outline-offset: 2px; }

.ctrl { display: flex; align-items: center; gap: 10px; min-height: 64px; }
.roll { --pc: var(--c3); --pcd: var(--c3d); flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 20px; background: var(--paper); color: var(--ink); box-shadow: 0 5px 0 var(--pcd), inset 0 0 0 3px var(--pc); font-size: 17px; font-weight: 900; }
.roll:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--pcd), inset 0 0 0 3px var(--pc); }
.roll:disabled { box-shadow: 0 5px 0 #0003, inset 0 0 0 3px #d9d0e6; }
.roll:disabled .roll-label { opacity: .45; }
.roll.ready { animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 0%, 70%, 100% { transform: none; } 80% { transform: rotate(-4deg); } 90% { transform: rotate(4deg); } }
.die { width: 48px; height: 48px; border-radius: 12px; background: #fff; box-shadow: inset 0 -4px 0 #0000001c, inset 0 0 0 2px var(--pc); display: block; }
.die svg { width: 100%; height: 100%; display: block; }
.die circle { fill: var(--ink); }
.die.spin { animation: spin .52s ease-out; }
@keyframes spin { 0% { transform: rotate(0) scale(1); } 40% { transform: rotate(200deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
.msg { flex: 1; min-width: 0; }
.status { font-size: 16px; font-weight: 800; line-height: 1.25; }
.sub { margin-top: 2px; font-size: 12px; color: #ffffffa8; font-weight: 700; line-height: 1.3; min-height: 1.3em; }
.sub.flash { color: var(--gold); }
.log { display: none; list-style: none; }
.foot { text-align: center; font-size: 12px; color: #ffffff99; line-height: 1.45; }
.foot strong { color: #fff; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: #120f2ccc; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 400px); max-height: calc(100dvh - 16px); overflow-y: auto; overscroll-behavior: contain; background: var(--paper); color: var(--ink); border-radius: 26px; padding: 20px 18px; text-align: center; box-shadow: 0 8px 0 #d8c9ec, 0 24px 60px #000a; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.panel h2 { font-size: 30px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.logo { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
.logo i { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 -3px 0 #0002; }
.text { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.field-row { margin-top: 12px; text-align: left; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.seats { display: grid; gap: 6px; }
.seat { display: grid; grid-template-columns: minmax(84px, 36%) 1fr; align-items: center; gap: 8px; }
.seat-name { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; min-width: 0; }
.seat-name span { overflow-wrap: anywhere; line-height: 1.1; }
.seat-name i { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 -3px 0 #0002; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #efe6f6; }
.seg button { flex: 1; min-width: 0; min-height: 34px; padding: 6px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1.15; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #d9cce9; }
.seat .seg { padding: 3px; }
.seat .seg button { min-height: 32px; padding: 4px 3px; font-size: 13px; }
.note { margin-top: 5px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.warn { margin-top: 8px; font-size: 13px; font-weight: 800; color: var(--c0d); }
.warn[hidden] { display: none; }
.rules-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; align-items: end; }
.rules-grid .done-row, .rules-grid .wide-row { grid-column: 1 / -1; }
.rules-grid .field-row { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.emoji { font-size: 44px; line-height: 1.2; }
.rank { margin-top: 10px; display: grid; gap: 5px; list-style: none; text-align: left; }
.rank li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; background: #f3ecf9; font-weight: 800; font-size: 15px; }
.rank li b { flex: 0 0 auto; width: 1.3em; text-align: center; }
.rank li i { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; }
.rank li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank li span::first-letter { text-transform: uppercase; }
.rank li small { font-size: 12px; color: var(--muted); }
.result-score { margin-top: 10px; font-size: 14px; font-weight: 800; color: var(--muted); }
.badge { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 99px; background: var(--gold); color: #4a3500; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 16px; width: 100%; padding: 14px; border-radius: 18px; background: var(--accent); color: #fff; font-size: 19px; font-weight: 900; box-shadow: 0 6px 0 var(--accent-d); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-d); }
.ghost-btn { margin-top: 10px; width: 100%; padding: 11px; border-radius: 16px; background: #efe6f6; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #d9cce9; }
.ghost-btn[hidden] { display: none; }
.ghost-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9cce9; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-row .ghost-btn { margin-top: 10px; }
.sw0 { background: var(--c0); } .sw1 { background: var(--c1); } .sw2 { background: var(--c2); } .sw3 { background: var(--c3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Narrow and short portrait */
@media (max-width: 400px) { .pl { flex-direction: column; padding: 4px 2px; gap: 2px; text-align: center; } .pl div { width: 100%; } .pl small { display: none; } .pl .dot { width: 20px; height: 20px; font-size: 11px; } .pl b { font-size: 12px; } }
.pl small .h { display: none; }
@media (max-height: 700px) { .foot { display: none; } .panel { padding: 16px 16px; } .field-row { margin-top: 9px; } .cta { margin-top: 12px; padding: 12px; } }
@media (max-height: 560px) {
  .app { gap: 6px; }
  .ctrl { min-height: 54px; }
  .die { width: 40px; height: 40px; }
  .roll { padding: 4px 12px 4px 4px; font-size: 15px; }
  .status { font-size: 14px; }
  .icon-btn { width: 36px; height: 36px; }
  .logo { display: none; }
  .panel h2 { font-size: 24px; }
  .text { font-size: 13px; line-height: 1.35; margin-top: 4px; }
  .label { font-size: 11px; margin-bottom: 4px; }
  .seat .seg button, .seg button { min-height: 30px; padding: 3px; }
  .emoji { font-size: 32px; }
  .rank li { padding: 4px 8px; font-size: 14px; }
  #setup .text, .rules-grid .note { display: none; }
}

/* Wide frames: board at full height on the left, everything else in a side column */
@media (min-aspect-ratio: 5/4) {
  .app { --side: clamp(214px, calc(100vw - 100dvh - 24px), 360px); max-width: none; width: min(100%, calc(100dvh + var(--side) + 12px)); display: grid; grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-areas: "board top" "board players" "board ctrl" "board log" "board foot"; column-gap: 16px; row-gap: 10px; }
  .top { grid-area: top; }
  .players { grid-area: players; grid-template-columns: 1fr; gap: 5px; }
  .pl { padding: 6px 10px; }
  .pl small { display: block; }
  .pl small .h { display: inline; }
  .board-wrap { grid-area: board; }
  .ctrl { grid-area: ctrl; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; border-radius: 18px; background: #00000026; box-shadow: inset 0 0 0 1px #ffffff14; }
  .roll { justify-content: center; padding: 8px 16px 8px 8px; font-size: 20px; }
  .die { width: 58px; height: 58px; border-radius: 14px; }
  .msg { text-align: center; }
  .log { grid-area: log; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; overflow: hidden; font-size: 13px; font-weight: 700; color: #ffffffb8; min-height: 0; }
  .log li { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 6px; border-radius: 8px; }
  .log li:last-child { background: #ffffff12; color: #fff; }
  .log li i { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; }
  .foot { grid-area: foot; text-align: left; }
}
@media (min-aspect-ratio: 5/4) and (min-height: 700px) { .foot { display: block; } }
@media (min-aspect-ratio: 5/4) and (max-height: 620px) {
  .players { grid-template-columns: 1fr 1fr; }
  .pl small { display: none; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 480px) {
  .app { row-gap: 6px; column-gap: 12px; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  h1 { font-size: 24px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 12px; }
  .pl { padding: 3px 6px; }
  .pl .dot { width: 20px; height: 20px; font-size: 10px; }
  .pl b { font-size: 12px; }
  .ctrl { flex-direction: row; padding: 6px; gap: 8px; }
  .roll { padding: 4px 10px 4px 4px; font-size: 15px; }
  .die { width: 42px; height: 42px; border-radius: 11px; }
  .msg { text-align: left; }
  .status { font-size: 13px; }
  .sub { font-size: 11px; }
  .log { font-size: 12px; }
  .overlay { padding: 6px; }
  .panel { max-height: calc(100dvh - 12px); padding: 10px 14px; border-radius: 20px; }
  .panel h2 { font-size: 21px; }
  .text { display: none; }
  #setup .panel { width: min(100%, 700px); display: grid; grid-template-columns: 1.25fr 1fr; column-gap: 16px; align-items: start; text-align: left; }
  #setup h2, #setup .warn { grid-column: 1 / -1; }
  #setup h2 { text-align: center; }
  #setup .seat-field { grid-row: span 3; }
  #rules .panel { width: min(100%, 760px); }
  #rules .rules-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #rules .done-row { grid-column: auto; }
  #result .panel { width: min(100%, 560px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; align-items: center; }
  #result .panel > * { grid-column: 2; }
  #result .rank { grid-column: 1; grid-row: 1 / span 6; margin-top: 0; }
  #rules .rules-grid .wide-row { grid-column: auto; }
  .note { font-size: 11px; }
  .field-row { margin-top: 6px; }
  .cta { margin-top: 8px; padding: 9px; font-size: 17px; }
  .ghost-btn { margin-top: 6px; padding: 7px; font-size: 15px; }
  .emoji { font-size: 28px; }
  .result-score, .badge { margin-top: 4px; }
}
@media (min-aspect-ratio: 5/4) and (max-height: 360px) {
  .log { display: none; }
  .players { gap: 4px; }
}
@media (max-height: 480px) and (max-aspect-ratio: 5/4) { .panel .text { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="word" aria-label="Ludo"><span>L</span><span>u</span><span>d</span><span>o</span></h1>
    <button type="button" class="icon-btn" id="speed" aria-pressed="false" data-i18n-label="speed"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l7 6-7 6zM13 6l7 6-7 6z"/></svg></button>
    <button type="button" class="icon-btn" id="menu" data-i18n-label="menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
  </header>
  <section class="players" id="players"></section>
  <div class="board-wrap">
    <div class="board" id="board">
      <div class="field" id="field" role="group" data-i18n-label="board">
        <svg id="board-svg" viewBox="0 0 15 15" aria-hidden="true"></svg>
        <div class="glow" id="glow" hidden></div>
        <div class="layer" id="marks"></div>
        <div class="layer" id="tokens"></div>
      </div>
    </div>
  </div>
  <div class="ctrl">
    <button type="button" class="roll" id="roll" data-i18n-label="rollAria"><span class="die" id="die"></span><span class="roll-label" data-i18n="roll"></span></button>
    <div class="msg"><p class="status" id="status"></p><p class="sub" id="sub"></p></div>
  </div>
  <ol class="log" id="log" aria-hidden="true"></ol>
  <p class="foot"><strong id="stats-line"></strong><br><span data-i18n="hintKeys"></span></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="setup">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <div class="logo" aria-hidden="true"><i class="sw0"></i><i class="sw1"></i><i class="sw2"></i><i class="sw3"></i></div>
    <h2 id="setup-title" class="word"><span>L</span><span>u</span><span>d</span><span>o</span></h2>

    layout();
  }

  const tokEl = (c, i) => game.toks.find(tk => tk.c === c && tk.i === i).el;

  function startTurn() {
    game.phase = 'roll';
    game.moves = [];
    game.choices = [];
    game.sel = -1;
    render();
    if (isCpu(game.turn)) {
      setStatus(t.rolling(nameOf(game.turn)));
      later(roll, 520);
    } else {
      setStatus(humans() === 1 ? t.yourRoll : t.rollOf(nameOf(game.turn)));
      if (humans() > 1) announce(t.rollOf(nameOf(game.turn)));
    }
  }

  function nextDie() { return rigged.length ? rigged.shift() : 1 + Math.floor(Math.random() * 6); }

  function roll() {
    if (!game || game.phase !== 'roll') return;
    game.phase = 'rolling';
    const d = nextDie();
    render();
    if (reducedMotion.matches || testPace === 0) { drawDie(d); return later(() => afterRoll(d), 120); }
    els.die.classList.remove('spin');
    void els.die.offsetWidth;
    els.die.classList.add('spin');
    let k = 0;
    const tumble = () => {
      if (++k < 6) { drawDie(1 + Math.floor(Math.random() * 6)); later(tumble, 75); }
      else { drawDie(d); afterRoll(d); }
    };
    tumble();
  }

  function afterRoll(d) {
    const c = game.turn;
    game.dice = d;
    game.sixes = d === 6 ? game.sixes + 1 : 0;
    if (game.rules.three && game.sixes === 3) {
      setStatus(t.lost); announce(`${t.rolled(nameOf(c), d)}. ${t.lost}`); addLog(c, `${nameOf(c)} 6·6·6 ✕`);
      game.phase = 'wait'; render();
      return later(nextPlayer, 1100);
    }
    game.moves = legalMoves(game.tokens, c, d, game.rules);
    if (!game.moves.length) {
      setStatus(isCpu(c) || humans() > 1 ? `${nameOf(c)}: ${t.noMove(d)}` : t.noMove(d)); announce(`${t.rolled(nameOf(c), d)}. ${t.noMove(d)}`); addLog(c, t.logNone(nameOf(c), d));
      game.phase = 'wait'; render();
      return later(d === 6 ? bonusTurn : nextPlayer, 950);
    }
    // Moves that start and end on the same squares (tokens waiting in base) are one choice.
    const seen = new Set();
    game.choices = game.moves.filter(m => { const k = `${m.from}>${m.to}`; if (seen.has(k)) return false; seen.add(k); return true; });
    game.phase = 'choose';
    if (isCpu(c)) {
      setStatus(t.rolled(nameOf(c), d));
      render();
      return later(() => play(aiChoose(game.tokens, game.moves, game.level, game.rules)), 420);
    }
    game.sel = 0;
    setStatus(humans() === 1 ? t.pick(d) : t.pickOf(nameOf(c), d));
    announce(humans() === 1 ? t.pick(d) : t.pickOf(nameOf(c), d));
    render();
    if (game.choices.length === 1) later(() => { if (game.phase === 'choose') play(game.choices[0]); }, 380);
  }

  function play(m) {
    if (!game || game.phase !== 'choose') return;
    game.phase = 'moving';
    game.sel = -1;
    render();
    const el = tokEl(m.c, m.i);
    const steps = [];
    if (m.from < 0) steps.push(0); else for (let p = m.from + 1; p <= m.to; p++) steps.push(p);
    const stepMs = reducedMotion.matches ? 0 : 135;
    let k = 0;
    const step = () => {
      game.tokens[m.c][m.i] = steps[k];
      layout();
      if (stepMs) { el.classList.toggle('hop', k % 2 === 0); el.classList.toggle('hop2', k % 2 === 1); }
      if (++k < steps.length) later(step, stepMs);
      else later(() => { el.classList.remove('hop', 'hop2'); land(m); }, stepMs ? 150 : 30);
    };
    step();
  }

  function land(m) {
    const c = m.c, name = nameOf(c);
    let msg = `${name}: ${t.token(t.colors[c], m.i + 1)}`;
    addLog(c, `${name} ${game.dice} → #${m.i + 1}`);
    if (m.caps.length) {
      const victims = [...new Set(m.caps.map(([cc]) => cc))];
      for (const [cc, ii] of m.caps) {
        const v = tokEl(cc, ii);
        v.classList.add('fly');
        setTimeout(() => v.classList.remove('fly'), 600);
      }
      applyMove(game.tokens, m);
      layout();
      const text = t.captured(name, victims.map(nameOf).join(', '));
      msg = text;
      flash(text);
      addLog(c, `${name} ✕ ${victims.map(nameOf).join(', ')}`);
    }
    let finishedNow = false;
    if (m.to === FINISH) {
      flash(t.home(name));
      msg = t.home(name);
      addLog(c, `${name} 🏠 #${m.i + 1}`);
      if (allHome(game.tokens[c])) {
        game.places.push(c);
        finishedNow = true;
        msg = t.finished(name, t.ord(game.places.length));
        flash(msg);
      }
    }
    announce(msg);
    render();
    if (finishedNow && gameDecided()) return endGame();
    let extra = game.dice === 6 || (game.rules.bonus && (m.caps.length > 0 || m.to === FINISH));
    if (finishedNow) extra = false;
    game.phase = 'wait';
    later(extra ? bonusTurn : nextPlayer, m.caps.length ? 650 : 320);
  }

  function bonusTurn() {
    flash(t.extra);
    announce(t.extra);
    startTurn();
  }

  function unfinished() { return game.active.filter(c => !game.places.includes(c)); }

  function gameDecided() {
    if (!game.rules.all) return true;
    const left = unfinished();
    if (left.length < 2) return true;
    return humans() > 0 && !left.some(c => game.seats[c] === 'human');
  }

  function nextPlayer() {
    game.sixes = 0;
    const order = game.active;
    let k = order.indexOf(game.turn);
    do k = (k + 1) % order.length; while (game.places.includes(order[k]));
    game.turn = order[k];
    startTurn();
  }

  function ranking() {
    const rest = unfinished().sort((a, b) => progressOf(game.tokens[b]) - progressOf(game.tokens[a]));
    return [...game.places, ...rest];
  }

  function endGame() {
    game.over = true;
    game.phase = 'over';
    render();
    const order = ranking();
    const winner = order[0];
    const mixed = humans() > 0 && game.active.some(isCpu);
    let newBest = false;
    if (mixed) {
      stats.played += 1;
      if (game.seats[winner] === 'human') {
        stats.wins += 1;
        if (game.level === 'hard') { stats.hardWins += 1; newBest = true; }
      }
      write(STORE.stats, stats);
    }
    const humanWon = game.seats[winner] === 'human';
    let title;
    if (humanWon && humans() === 1) title = t.youWin;
    else title = t.wins(nameOf(winner));
    els.resultEmoji.textContent = humanWon ? '🏆' : humans() ? '🎲' : '👑';
    els.resultTitle.textContent = title;
    const me = humans() === 1 ? game.active.find(c => game.seats[c] === 'human') : -1;
    els.resultText.textContent = me >= 0 && !humanWon ? t.youPlaced(t.ord(order.indexOf(me) + 1)) : '';
    els.resultText.hidden = !els.resultText.textContent;
    const medals = ['🥇', '🥈', '🥉', ''];
    els.rank.replaceChildren(...order.map((c, k) => {
      const li = document.createElement('li');
      const home = game.tokens[c].filter(p => p === FINISH).length;
      li.innerHTML = `<b aria-hidden="true">${medals[k]}</b><i class="sw${c}"></i><span></span><small></small>`;
      li.querySelector('span').textContent = `${t.ord(k + 1)} · ${nameOf(c)}`;
      li.querySelector('small').textContent = t.homeCount(home, game.rules.tokens);
      return li;
    }));
    els.resultScore.textContent = mixed ? t.stats(stats.wins, stats.played) : '';
    els.newBest.textContent = t.hardWin(stats.hardWins);
    els.newBest.hidden = !newBest;
    setStatus(title);
    announce(`${title} ${els.resultText.textContent}`);
    const g = game;
    setTimeout(() => {
      if (game !== g) return;
      els.result.hidden = false;
      els.again.focus({ preventScroll: true });
    }, testPace === 0 ? 0 : 1100);
  }

  // ---- Rendering ----------------------------------------------------------------------------
  function setStatus(text) { els.status.textContent = text; }
  function flash(text) {
    els.sub.textContent = text;
    els.sub.classList.add('flash');
    clearTimeout(flash.timer);
    flash.timer = setTimeout(() => { els.sub.classList.remove('flash'); }, 1600);
  }
  function announce(text) { els.announcer.textContent = text; }

  function addLog(c, text) {
    const li = document.createElement('li');
    li.innerHTML = `<i class="sw${c}"></i><span></span>`;
    li.querySelector('span').textContent = text;
    els.log.append(li);
    while (els.log.children.length > 14) els.log.firstChild.remove();
  }

  const choosing = () => game && game.phase === 'choose' && !isCpu(game.turn);

  function render() {
    const c = game.turn;
    // Players
    const chips = game.active.map(pc => {
      const div = document.createElement('div');
      const place = game.places.indexOf(pc);
      div.className = `pl${pc === c && !game.over ? ' turn' : ''}${place >= 0 ? ' done' : ''}`;
      div.style.setProperty('--pc', HEX[pc]);
      const home = game.tokens[pc].filter(p => p === FINISH).length;
      const kind = game.seats[pc] === 'cpu' ? `${t.cpu} · ${t[game.level]}` : t.human;
      div.innerHTML = `<i class="dot sw${pc}"></i><div><b></b><small><span></span><span class="h"></span></small></div>`;
      div.querySelector('.dot').textContent = place >= 0 ? ['🥇', '🥈', '🥉', '4'][place] : `${home}`;
      div.querySelector('b').textContent = nameOf(pc);
      div.querySelector('small span').textContent = kind;
      div.querySelector('small .h').textContent = ` · ${t.homeCount(home, game.rules.tokens)}`;
      div.setAttribute('aria-label', `${nameOf(pc)}, ${kind}, ${t.homeCount(home, game.rules.tokens)}`);
      return div;
    });
    els.players.replaceChildren(...chips);
    els.players.style.setProperty('--n', game.active.length);

    // Roll button
    const canRoll = game.phase === 'roll' && !isCpu(c) && !game.over;
    els.roll.disabled = !canRoll;
    els.roll.classList.toggle('ready', canRoll);
    els.roll.style.setProperty('--pc', HEX[c]);
    els.roll.style.setProperty('--pcd', DARK[c]);

    // Turn glow on the mover's base
    const [bx, by] = rot([BASE[c][0] + 3, BASE[c][1] + 3]);
    els.glow.hidden = game.over;
    els.glow.style.left = `${(bx - 3) / 15 * 100}%`;
    els.glow.style.top = `${(by - 3) / 15 * 100}%`;
    els.glow.style.setProperty('--pc', HEX[c]);

    // Movable tokens and target marks
    const human = choosing();
    const movable = new Set(human ? game.moves.map(m => `${m.c},${m.i}`) : []);
    const selMove = human ? game.choices[game.sel] : null;
    for (const tk of game.toks) {
      const can = movable.has(`${tk.c},${tk.i}`);
      tk.el.classList.toggle('can', can);
      tk.el.classList.toggle('sel', !!selMove && selMove.c === tk.c && selMove.i === tk.i);
      tk.el.tabIndex = can ? 0 : -1;
      const p = game.tokens[tk.c][tk.i];
      const where = p < 0 ? t.inBase : p === FINISH ? t.tokHome : t.toGo(FINISH - p);
      tk.el.setAttribute('aria-label', `${t.token(t.colors[tk.c], tk.i + 1)}, ${where}${can ? `, ${t.canMove}` : ''}`);
    }
    const marks = [];
    if (human) {
      for (const m of game.choices) {
        const el = document.createElement('div');
        el.className = 'mark';
        const [x, y] = rot(rawPos(m.c, m.i, m.to));
        el.style.left = `${x / 15 * 100}%`;
        el.style.top = `${y / 15 * 100}%`;
        el.style.setProperty('--pc', HEX[m.c]);
        el.dataset.k = game.choices.indexOf(m);
        el.setAttribute('aria-hidden', 'true');
        marks.push(el);
      }
    }
    els.marks.replaceChildren(...marks);
    els.statsLine.textContent = stats.played ? t.stats(stats.wins, stats.played) : '';
    if (human && !els.sub.classList.contains('flash')) els.sub.textContent = t.hintTap;
  }

  // ---- Input --------------------------------------------------------------------------------
  function moveForToken(c, i) {
    const m = game.moves.find(x => x.c === c && x.i === i);
    return m || null;
  }

  els.field.addEventListener('click', event => {
    if (!choosing()) return;
    const tok = event.target.closest('.tok');
    if (tok) { const m = moveForToken(+tok.dataset.c, +tok.dataset.i); if (m) return play(m); }
    const mark = event.target.closest('.mark');
    if (mark) return play(game.choices[+mark.dataset.k]);
    // Small boards: take the nearest movable token or target to the tap.
    const rect = els.field.getBoundingClientRect();
    const fx = (event.clientX - rect.left) / rect.width * 15, fy = (event.clientY - rect.top) / rect.height * 15;
    let pick = null, bestD = 1.7;
    for (const m of game.choices) {
      const cands = [rot(rawPos(m.c, m.i, m.to))];
      for (const x of game.moves) if (x.from === m.from && x.to === m.to) cands.push(game.toks.find(tk => tk.c === x.c && tk.i === x.i).pos);
      for (const [x, y] of cands) { const dd = Math.hypot(x - fx, y - fy); if (dd < bestD) { bestD = dd; pick = m; } }
    }
    if (!pick) {
      // A tap anywhere in your base brings a token out.
      const [bx, by] = rot([BASE[game.turn][0] + 3, BASE[game.turn][1] + 3]);
      if (Math.abs(fx - bx) < 3 && Math.abs(fy - by) < 3) pick = game.choices.find(m => m.from < 0) || null;
    }
    if (pick) play(pick);
  });

  function cycle(dir) {
    if (!choosing()) return;
    const n = game.choices.length;
    game.sel = ((game.sel < 0 ? 0 : game.sel + dir) % n + n) % n;
    render();
    const m = game.choices[game.sel];
    tokEl(m.c, m.i).focus({ preventScroll: true });
  }

  const overlayOpen = () => !els.setup.hidden || !els.rules.hidden || !els.result.hidden;
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || !game || overlayOpen()) return;
    const k = event.key;
    const onButton = event.target.closest && event.target.closest('button');
    if (k === ' ' || k === 'Enter') {
      // Let a focused control (menu, roll, a token) handle its own activation.
      if (onButton && onButton !== els.roll && !onButton.classList.contains('tok')) return;
      if (onButton && onButton.classList.contains('tok') && choosing()) {
        event.preventDefault();
        const m = moveForToken(+onButton.dataset.c, +onButton.dataset.i);
        return play(m || game.choices[Math.max(0, game.sel)]);
      }
      event.preventDefault();
      if (game.phase === 'roll' && !isCpu(game.turn)) roll();
      else if (choosing()) play(game.choices[Math.max(0, game.sel)]);
    } else if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowUp') {
      if (!choosing()) return;
      event.preventDefault();
      cycle(k === 'ArrowRight' || k === 'ArrowDown' ? 1 : -1);
    } else if (/^[1-4]$/.test(k)) {
      if (!choosing()) return;
      const m = moveForToken(game.turn, Number(k) - 1);
      if (!m) return;
      event.preventDefault();
      play(m);
    }
  });

  els.roll.addEventListener('click', () => { if (game && game.phase === 'roll' && !isCpu(game.turn)) roll(); });

  // ---- Setup panels -------------------------------------------------------------------------
  function renderSeats() {
    els.seats.replaceChildren(...[0, 1, 2, 3].map(c => {
      const row = document.createElement('div');
      row.className = 'seat';
      row.innerHTML = `<p class="seat-name" id="seat-${c}"><i class="sw${c}"></i><span></span></p><div class="seg" role="group" aria-labelledby="seat-${c}">${['human', 'cpu', 'off'].map(v => `<button type="button" data-value="${v}" aria-pressed="${settings.seats[c] === v}"></button>`).join('')}</div>`;
      row.querySelector('span').textContent = t.colors[c];
      const btns = row.querySelectorAll('button');
      btns[0].textContent = t.human; btns[1].textContent = t.cpu; btns[2].textContent = t.off;
      row.querySelector('.seg').addEventListener('click', event => {
        const b = event.target.closest('button');
        if (!b) return;
        settings.seats[c] = b.dataset.value;
        renderSetup();
        row.querySelector(`[data-value="${b.dataset.value}"]`)?.focus({ preventScroll: true });
      });
      return row;
    }));
  }

  function renderSetup() {
    renderSeats();
    for (const btn of document.querySelectorAll('[data-key="level"] button')) btn.setAttribute('aria-pressed', String(settings.level === btn.dataset.value));
    const enough = settings.seats.filter(s => s !== 'off').length >= 2;
    els.warn.hidden = enough;
    els.start.disabled = !enough;
    els.start.style.opacity = enough ? '' : '.5';
    els.resume.hidden = !(game && !game.over && game.phase !== 'idle');
    for (const group of document.querySelectorAll('[data-rule]')) {
      const key = group.dataset.rule;
      const val = key === 'tokens' ? String(settings.rules.tokens) : settings.rules[key] ? '1' : '0';
      for (const btn of group.children) btn.setAttribute('aria-pressed', String(btn.dataset.value === val));
    }
  }

  for (const group of document.querySelectorAll('[data-rule]')) {
    group.addEventListener('click', event => {
      const btn = event.target.closest('button');
      if (!btn) return;
      const key = group.dataset.rule;
      settings.rules[key] = key === 'tokens' ? Number(btn.dataset.value) : btn.dataset.value === '1';
      renderSetup();
    });
  }
  document.querySelector('[data-key="level"]').addEventListener('click', event => {
    const btn = event.target.closest('button');
    if (!btn) return;
    settings.level = btn.dataset.value;
    renderSetup();
  });

  // A focused button inside a panel that just closed would otherwise keep catching Space/Enter.
  function closePanels() {
    const focused = document.activeElement;
    els.setup.hidden = true;
    els.rules.hidden = true;
    els.result.hidden = true;
    if (focused && focused.closest && focused.closest('.overlay')) focused.blur();
  }

  function openSetup() {
    renderSetup();
    els.result.hidden = true;
    els.rules.hidden = true;
    els.setup.hidden = false;
    (els.resume.hidden ? els.start : els.resume).focus({ preventScroll: true });
  }

  els.start.addEventListener('click', () => {
    if (settings.seats.filter(s => s !== 'off').length < 2) return;
    write(STORE.settings, settings);
    newGame();
  });
  els.resume.addEventListener('click', closePanels);
  $('open-rules').addEventListener('click', () => { renderSetup(); els.setup.hidden = true; els.rules.hidden = false; $('rules-done').focus({ preventScroll: true }); });
  $('rules-done').addEventListener('click', () => { write(STORE.settings, settings); els.rules.hidden = true; openSetup(); });
  els.again.addEventListener('click', newGame);
  $('change').addEventListener('click', openSetup);
  $('menu').addEventListener('click', openSetup);
  els.speed.addEventListener('click', () => {
    settings.fast = !settings.fast;
    if (game) game.fast = settings.fast;
    els.speed.setAttribute('aria-pressed', String(settings.fast));
    write(STORE.settings, settings);
  });

  // Test hook: lets automated checks rig the die, set up positions, run headless games and skip animations; harmless for players.
  // Test hook: only automated browsers (Playwright) get it, so players cannot script the game from the console.
  if (navigator.webdriver) window.__ludo = {
    get game() { return game; }, get stats() { return stats; }, settings,
    rig(list) { rigged.push(...list); }, pace(v) { testPace = v; },
    set(tokens, turn) { tokens.forEach((l, c) => { if (game.tokens[c] && l) game.tokens[c] = l.slice(); }); if (turn != null) game.turn = turn; game.sixes = 0; game.gen += 1; layout(); startTurn(); },
    legalMoves, applyMove, aiChoose, simulate, danger, newGame,
  };

  // Idle board behind the start panel.
  els.speed.setAttribute('aria-pressed', String(settings.fast));
  game = { seats: settings.seats.slice(), rules: { ...settings.rules }, active: [0, 1, 2, 3], level: settings.level, fast: settings.fast, tokens: [0, 1, 2, 3].map(() => Array(settings.rules.tokens).fill(-1)), turn: 3, phase: 'idle', moves: [], choices: [], sel: -1, places: [], over: false, toks: [], rot: 0, gen: 0 };
  game.seats = game.seats.map(s => s === 'off' ? 'cpu' : s);
  drawBoard(game.rules);
  buildTokens();
  drawDie(6);
  render();
  game.over = true;
  els.glow.hidden = true;
  els.roll.disabled = true;
  renderSetup();
  els.resume.hidden = true;
  els.start.focus({ preventScroll: true });
})();
</script>
</body>
</html>
