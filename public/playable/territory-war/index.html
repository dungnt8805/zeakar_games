<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Territory War</title>
<style>
:root {
  --ink: #1b2742;
  --muted: #64708b;
  --accent: #2f7cf6;
  --accent-dark: #1a55c4;
  --red: #ef4444;
  --red-dark: #b42424;
  --gold: #ffc53d;
  --gold-dark: #d29600;
  --green: #1fae5b;
  --green-dark: #138442;
  --hud: #0f2647d9;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: #2386c2; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
canvas:focus-visible { outline: none; }
.safe { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); visibility: hidden; pointer-events: none; }

.hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); height: 38px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.hud.off { visibility: hidden; }
.chip { height: 38px; display: flex; align-items: center; padding: 0 12px; border-radius: 13px; background: var(--hud); color: #fff; font-size: 15px; font-weight: 800; white-space: nowrap; box-shadow: 0 4px 12px #0a1a3540; }
.chip.label { max-width: 34%; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 38px; }
.clock { font-variant-numeric: tabular-nums; min-width: 62px; justify-content: center; }
.icon-btn { flex: none; width: 38px; height: 38px; border-radius: 13px; background: var(--hud); display: grid; place-items: center; pointer-events: auto; box-shadow: 0 4px 12px #0a1a3540; }
.icon-btn svg { width: 14px; height: 14px; fill: #fff; }
.bar { flex: 1; min-width: 40px; height: 14px; display: flex; border-radius: 99px; overflow: hidden; background: #0f2647; box-shadow: 0 0 0 3px var(--hud), 0 4px 12px #0a1a3540; }
.bar span { flex: 0 0 0; min-width: 0; transition: flex-grow .35s; }
.bar span + span { box-shadow: inset 1px 0 #ffffff80; }

.toast { position: fixed; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 50px); transform: translateX(-50%); max-width: calc(100% - 24px); padding: 7px 16px; border-radius: 99px; background: var(--hud); color: #fff; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; opacity: 0; }
.toast.show { animation: toast 1.8s ease-out both; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.9); } 12%, 78% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -8px); } }
.notice { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(calc(100% - 32px), 360px); padding: 14px 18px 16px; border-radius: 20px; background: #0f2647e6; color: #fff; text-align: center; pointer-events: none; box-shadow: 0 16px 40px #0a1a3566; animation: rise .3s ease-out; }
.notice[hidden] { display: none; }
.notice strong { display: block; font-size: 22px; font-weight: 900; letter-spacing: -.01em; }
.notice span { display: block; margin-top: 4px; font-size: 15px; line-height: 1.4; color: #cfe0ff; }
.notice em { display: block; margin-top: 6px; font-style: normal; font-size: 14px; font-weight: 800; color: var(--gold); }
.notice em:empty { display: none; }

.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #0b1f3d59; overflow: hidden; }
.overlay[hidden] { display: none; }
.panel { position: relative; width: min(100%, 380px); max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior: contain; padding: 20px 18px 18px; border-radius: 26px; background: #fff; text-align: center; box-shadow: 0 24px 60px #0b1f3d66; animation: rise .3s ease-out; }
.panel.wide { width: min(100%, 460px); }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.logo { display: block; width: 120px; height: 64px; margin: 0 auto 4px; }
.panel h1 { font-size: clamp(30px, 9.5vw, 40px); font-weight: 900; letter-spacing: -.04em; line-height: 1.05; }
.panel h1 span { color: var(--accent); }
.panel h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
.panel p { margin-top: 8px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.panel .small { font-size: 12px; }
.panel h3 { margin: 14px 0 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.wallet { position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 5px; padding: 4px 10px 4px 6px; border-radius: 99px; background: #fff6dc; font-weight: 900; font-size: 14px; color: #6b4b00; font-variant-numeric: tabular-nums; }
.wallet.inline { position: static; display: inline-flex; margin-top: 8px; }
.coin { flex: none; display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff1b0, #ffc53d 55%, #e3a400); box-shadow: inset 0 0 0 2px #d29600; vertical-align: -3px; }

.play { width: 100%; margin-top: 16px; padding: 13px 10px 12px; border-radius: 18px; background: var(--accent); color: #fff; box-shadow: 0 5px 0 var(--accent-dark); display: grid; gap: 1px; }
.play b { font-size: 22px; font-weight: 900; }
.play small { font-size: 13px; font-weight: 700; opacity: .92; }
.modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
.mode { padding: 10px 6px 9px; border-radius: 16px; display: grid; gap: 1px; min-width: 0; background: #eef3fb; box-shadow: 0 4px 0 #d3dceb; }
.mode b { font-size: 16px; font-weight: 900; overflow-wrap: anywhere; }
.mode small { font-size: 12px; font-weight: 700; color: var(--muted); }
.mode .ico { font-size: 20px; line-height: 1.2; }
.play:active, .mode:active, .btn:active, .lvl:active { transform: translateY(3px); box-shadow: none; }
.help { margin-top: 12px !important; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 7px; margin-top: 12px; }
.lvl { position: relative; padding: 7px 2px 5px; border-radius: 13px; background: #eaf1ff; box-shadow: 0 3px 0 #c9d8f5; display: grid; gap: 1px; min-width: 0; }
.lvl b { font-size: 18px; font-weight: 900; color: var(--accent-dark); line-height: 1.1; }
.lvl small { font-size: 11px; letter-spacing: 1px; color: #c4cada; white-space: nowrap; }
.lvl small i { font-style: normal; color: var(--gold-dark); }
.lvl.current { background: var(--accent); box-shadow: 0 3px 0 var(--accent-dark); }
.lvl.current b { color: #fff; }
.lvl.current small { color: #ffffff88; }
.lvl.locked { background: #f1f3f7; box-shadow: 0 3px 0 #dfe3ea; cursor: not-allowed; }
.lvl.locked b { color: #b4bccb; }

.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #eef2f9; }
.seg button { flex: 1; min-width: 0; min-height: 36px; padding: 7px 4px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); overflow-wrap: anywhere; }
.seg button[aria-checked="true"] { background: var(--accent); color: #fff; box-shadow: 0 2px 6px #2f7cf655; }
.seg.dots button[aria-checked="true"] { background: var(--red); box-shadow: 0 2px 6px #ef444455; }

.ups { display: grid; gap: 8px; margin-top: 14px; }
.up { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border-radius: 16px; background: #f3f6fb; text-align: left; }
.up .ico { font-size: 26px; line-height: 1; text-align: center; }
.up b { display: block; font-size: 15px; font-weight: 900; }
.up small { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
.pips { display: flex; gap: 3px; margin-top: 4px; }
.pips i { width: 14px; height: 6px; border-radius: 3px; background: #d6deeb; }
.pips i.on { background: var(--green); }
.buy { display: flex; align-items: center; gap: 5px; min-height: 38px; padding: 8px 12px; border-radius: 12px; background: var(--green); color: #fff; font-weight: 900; font-variant-numeric: tabular-nums; box-shadow: 0 3px 0 var(--green-dark); white-space: nowrap; }
.buy:disabled { background: #cfd6e2; box-shadow: 0 3px 0 #b8c1d1; cursor: not-allowed; color: #fff; }
.buy:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }

.emblem { font-size: 46px; line-height: 1.1; }
.stars { margin-top: 6px; font-size: 40px; letter-spacing: 6px; line-height: 1.1; color: #dbe0ea; }
.stars[hidden] { display: none; }
.stars .on { color: var(--gold); text-shadow: 0 2px 0 var(--gold-dark); }
.earn { display: inline-flex !important; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; background: #fff6dc; color: #6b4b00 !important; font-weight: 900; font-size: 15px !important; }
.earn[hidden] { display: none !important; }
.badge { display: inline-block; margin: 8px 4px 0 !important; padding: 5px 14px; border-radius: 99px; background: var(--gold); color: #3a2a00 !important; font-weight: 800; font-size: 13px !important; }
.badge[hidden] { display: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { flex: 1 1 110px; min-height: 44px; padding: 12px 10px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 var(--accent-dark); }
.btn.alt { background: var(--gold); color: #3a2a00; box-shadow: 0 4px 0 var(--gold-dark); }
.btn.ghost { background: #eef2f9; color: var(--ink); box-shadow: 0 4px 0 #d3dceb; }
.btn[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 640px) { .logo { display: none; } .panel { padding-top: 16px; } }
@media (max-width: 360px) { .wallet:not(.inline) { position: static; display: inline-flex; margin-bottom: 6px; } .up { grid-template-columns: 1fr auto; } .up .ico { display: none; } }
@media (max-height: 540px) and (max-aspect-ratio: 4/3) { .help { display: none; } }
@media (max-height: 480px) {
  .hud { top: max(6px, env(safe-area-inset-top)); height: 32px; }
  .chip, .icon-btn { height: 32px; font-size: 14px; }
  .chip.label { line-height: 32px; }
  .icon-btn { width: 32px; }
  .toast { top: calc(max(6px, env(safe-area-inset-top)) + 40px); font-size: 14px; padding: 5px 14px; }
  .notice { padding: 8px 14px 10px; width: min(calc(100% - 32px), 420px); }
  .notice strong { font-size: 19px; }
  .notice span { font-size: 14px; }
}
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .panel { width: min(100%, 560px); }
  .panel.wide { width: min(100%, 680px); }
  .modes { grid-template-columns: repeat(4, 1fr); }
  .ups { grid-template-columns: repeat(3, 1fr); }
  .up { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 4px; padding: 8px; }
  .up .ico { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); }
}
@media (max-height: 420px) {
  .panel { padding: 12px 14px; border-radius: 20px; }
  .panel h1 { font-size: 26px; }
  .panel h2 { font-size: 21px; }
  .panel p { margin-top: 4px; font-size: 13px; }
  .panel h3 { margin: 8px 0 4px; }
  .wallet { top: 8px; right: 8px; }
  .play { margin-top: 8px; padding: 8px 10px 7px; }
  .play b { font-size: 18px; }
  .modes { margin-top: 10px; gap: 8px; }
  .mode { padding: 6px 4px 5px; }
  .mode .ico { display: none; }
  .help { display: none; }
  .emblem { font-size: 30px; }
  .stars { font-size: 28px; margin-top: 0; }
  .actions { margin-top: 10px; }
  .btn { min-height: 38px; padding: 8px 10px; font-size: 15px; }
  .grid { gap: 5px; margin-top: 8px; }
  .lvl { padding: 4px 2px 3px; }
  .lvl b { font-size: 16px; }
  .ups { margin-top: 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .toast.show { opacity: 1; } }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" role="application"></canvas>
<div class="safe" id="safe" aria-hidden="true"></div>

<div class="hud off" id="hud">
  <button type="button" class="icon-btn" id="pause-btn" data-i18n-label="pause"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.6" height="12" rx="1.2"/><rect x="8.4" y="1" width="3.6" height="12" rx="1.2"/></svg></button>
  <div class="chip label" id="hud-label"></div>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <div class="chip clock" id="clock">0:00</div>
</div>
<div class="toast" id="toast" aria-hidden="true"></div>
<div class="notice" id="notice" hidden><strong id="notice-title"></strong><span id="notice-text"></span><em id="notice-goal"></em></div>

<div class="overlay" id="menu">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="wallet" id="menu-wallet"><span class="coin" aria-hidden="true"></span><span class="num"></span></div>
    <svg class="logo" viewBox="0 0 120 64" aria-hidden="true">
      <path d="M8 40 Q6 22 24 17 Q38 8 54 15 L60 39 Q44 54 26 52 Q10 50 8 40Z" fill="#8ab8ff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M54 15 Q72 5 92 12 Q112 19 110 35 L60 39Z" fill="#ff9e94" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M60 39 L110 35 Q110 52 90 57 Q70 61 60 39Z" fill="#ffd866" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="31" cy="35" r="9" fill="#2f7cf6" stroke="#fff" stroke-width="2.5"/>
      <circle cx="86" cy="24" r="8" fill="#ef4444" stroke="#fff" stroke-width="2.5"/>
      <circle cx="87" cy="47" r="7" fill="#f2b705" stroke="#fff" stroke-width="2.5"/>
      <path d="M31 33 V8" stroke="#1b2742" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M32 8 H46 L42 13 L46 18 H32Z" fill="#2f7cf6" stroke="#1b2742" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="44" cy="35" r="2.6" fill="#2f7cf6"/><circle cx="52" cy="33" r="2.6" fill="#2f7cf6"/><circle cx="60" cy="31" r="2.6" fill="#2f7cf6"/><circle cx="68" cy="29" r="2.6" fill="#2f7cf6"/>
    </svg>
    <h1 id="menu-title">Territory <span>War</span></h1>
    <p data-i18n="tagline"></p>
    <button type="button" class="play" id="play"><b data-i18n="play"></b><small id="play-info"></small></button>
    <div class="modes">
      <button type="button" class="mode" id="go-levels"><span class="ico" aria-hidden="true">🗺️</span><b data-i18n="levels"></b><small id="levels-info"></small></button>
      <button type="button" class="mode" id="go-skirmish"><span class="ico" aria-hidden="true">⚔️</span><b data-i18n="skirmish"></b><small data-i18n="skirmishInfo"></small></button>
      <button type="button" class="mode" id="go-daily"><span class="ico" aria-hidden="true">📅</span><b data-i18n="daily"></b><small id="daily-info"></small></button>
      <button type="button" class="mode" id="go-shop"><span class="ico" aria-hidden="true">🛡️</span><b data-i18n="upgrades"></b><small data-i18n="upgradesInfo"></small></button>
    </div>
    <p class="small help" data-i18n="help"></p>
  </div>
</div>

<div class="overlay" id="levels" hidden>
  <div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="levels-title">
    <h2 id="levels-title" data-i18n="levelsTitle"></h2>
    <p class="small" id="levels-sub"></p>
    <div class="grid" id="level-grid"></div>
    <div class="actions"><button type="button" class="btn ghost" data-back data-i18n="back"></button></div>
  </div>
</div>

<div class="overlay" id="skirmish" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="skirmish-title">
    <h2 id="skirmish-title" data-i18n="skirmish"></h2>
    <h3 id="size-h" data-i18n="mapSize"></h3>
    <div class="seg" id="seg-size" role="radiogroup" aria-labelledby="size-h"></div>
    <h3 id="rivals-h" data-i18n="rivals"></h3>
    <div class="seg dots" id="seg-rivals" role="radiogroup" aria-labelledby="rivals-h"></div>
    <h3 id="diff-h" data-i18n="difficulty"></h3>
    <div class="seg" id="seg-diff" role="radiogroup" aria-labelledby="diff-h"></div>
    <div class="actions">
      <button type="button" class="btn ghost" data-back data-i18n="back"></button>
      <button type="button" class="btn" id="start-skirmish" data-i18n="start"></button>
    </div>
  </div>
</div>

<div class="overlay" id="shop" hidden>
  <div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="shop-title">
    <h2 id="shop-title" data-i18n="shopTitle"></h2>
    <div class="wallet inline" id="shop-wallet"><span class="coin" aria-hidden="true"></span><span class="num"></span></div>
    <div class="ups" id="ups"></div>
    <p class="small" data-i18n="shopNote"></p>
    <div class="actions"><button type="button" class="btn ghost" data-back data-i18n="back"></button></div>
  </div>
</div>

<div class="overlay" id="paused" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="paused-title">
    <h2 id="paused-title" data-i18n="paused"></h2>
    <div class="actions">
      <button type="button" class="btn" id="resume" data-i18n="resume"></button>
      <button type="button" class="btn alt" id="restart" data-i18n="restart"></button>
      <button type="button" class="btn ghost" id="quit" data-i18n="menu"></button>
    </div>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="emblem" id="result-emblem" aria-hidden="true"></div>
    <h2 id="result-title"></h2>
    <div class="stars" id="result-stars" aria-hidden="true"></div>
    <p id="result-sub"></p>
    <p class="small" id="result-note"></p>
    <p class="earn" id="result-coins"><span class="coin" aria-hidden="true"></span><span></span></p>
    <p class="badge" id="result-best" data-i18n="newBest" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="result-next" data-i18n="next"></button>
      <button type="button" class="btn alt" id="result-retry"></button>
      <button type="button" class="btn ghost" id="result-menu" data-i18n="menu"></button>
    </div>
  </div>
</div>
<p class="sr-only" id="announcer" aria-live="polite"></p>

<script>
(() => {
  const I18N = {
    en: {
      tagline: 'Send your troops, capture every region and paint the map blue!', play: 'Play', playInfo: l => `Campaign · Level ${l}`, levels: 'Levels', levelsInfo: s => `${s}★ earned`,
      skirmish: 'Skirmish', skirmishInfo: '1–5 rivals, your rules', daily: 'Daily map', dailyInfo: b => b ? `Today’s best ${b}` : 'A new map every day', upgrades: 'Upgrades', upgradesInfo: 'Boost your army',
      help: 'Drag from your blue regions to any other region to attack. Keyboard: arrows to move, Space to select, Enter to send.',
      coins: n => `${n} coins`, back: 'Back', levelsTitle: 'Campaign', levelsSub: (s, m) => `${s} of ${m} stars`, levelLabel: (n, s) => `Level ${n}, ${s} of 3 stars`, levelLocked: n => `Level ${n}, locked`,
      mapSize: 'Map size', sizes: ['Small', 'Medium', 'Large'], rivals: 'Rivals', difficulty: 'Difficulty', diffs: ['Easy', 'Normal', 'Hard'], start: 'Start battle',
      shopTitle: 'Upgrades', shopNote: 'Win battles to earn coins. Upgrades work in every mode.',
      upStart: 'Starting troops', upStartInfo: n => `+${n} troops in your first region`, upGrowth: 'Growth speed', upGrowthInfo: n => `+${n}% troop growth`, upMarch: 'March speed', upMarchInfo: n => `+${n}% marching speed`,
      max: 'Max', buyLabel: (name, c) => `Upgrade ${name} for ${c} coins`, bought: name => `${name} upgraded`,
      pause: 'Pause', paused: 'Paused', resume: 'Resume', restart: 'Restart', menu: 'Menu',
      hudLevel: n => `Level ${n}`, hudSkirmish: 'Skirmish', hudDaily: 'Daily map',
      win: 'Victory!', lose: 'Defeated', winSub: tm => `Map conquered in ${tm}`, loseSub: 'Your last region has fallen.', coinsEarned: n => `+${n} coins`,
      next: 'Next level', retry: 'Try again', playAgain: 'Play again', newBest: 'New best time!', starGoal: tm => `★★★ for a win under ${tm}`,
      intro: n => n === 1 ? '1 rival — conquer every region!' : `${n} rivals — conquer every region!`,
      factions: ['Blue', 'Red', 'Gold', 'Green', 'Purple', 'Orange'], you: 'You', neutral: 'Neutral', out: name => `${name} is out!`,

  // ---------- Simulation ----------
  function send(src, tgt, n) {

  const LANES = [0, -5, 5, -2.5, 2.5];

  function capture(r, o) {

  function arrive(r, o) {
    if (r.owner === o) { r.troops += 1; return; }
    r.troops -= 1;
    r.pop = Math.max(r.pop, 0.35);
    if (r.troops < 0) capture(r, o);
  }

  function burst(x, y, color, n) {
    if (reduced) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 30 + Math.random() * 90;
      run.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, color });
    }
  }

  // Opposing units that touch annihilate one-for-one (spatial hash keeps it linear).
  function fight() {
    const C = 10, grid = new Map(), units = run.units;
    const key = (cx, cy) => (cx + 500) * 2048 + cy + 500;
    for (const u of units) {
      const k = key(Math.floor(u.x / C), Math.floor(u.y / C));
      const list = grid.get(k);
      if (list) list.push(u); else grid.set(k, [u]);
    }
    const R2 = (UNIT_R * 2 + 1) ** 2;
    for (const u of units) {
      if (u.dead) continue;
      const cx = Math.floor(u.x / C), cy = Math.floor(u.y / C);
      search: for (let ix = -1; ix <= 1; ix++) for (let iy = -1; iy <= 1; iy++) {
        const list = grid.get(key(cx + ix, cy + iy));
        if (!list) continue;
        for (const v of list) {
          if (v.dead || v.o === u.o || (v.x - u.x) ** 2 + (v.y - u.y) ** 2 > R2) continue;
          u.dead = v.dead = true;
          if (!reduced && Math.random() < 0.5) run.fx.push({ x: (u.x + v.x) / 2, y: (u.y + v.y) / 2, vx: 0, vy: -20, life: 0.3, color: '#fff' });
          break search;
        }
      }
    }
  }

  function towers(dt) {
    for (const r of run.regions) {
      if (r.kind !== 'tower') continue;
      r.cd -= dt;
      if (r.cd > 0) continue;
      let pick = null, pd = TOWER_RANGE * TOWER_RANGE;
      for (const u of run.units) {
        if (u.dead || u.o === r.owner) continue;
        const d = (u.x - r.x) ** 2 + (u.y - r.y) ** 2;
        if (d < pd) { pd = d; pick = u; }
      }
      if (!pick) { r.cd = 0.1; continue; }
      pick.dead = true;
      r.cd = TOWER_RATE;
      run.tracers.push({ x1: r.x, y1: r.y - 6, x2: pick.x, y2: pick.y, life: 0.14 });
    }
  }

  function update(dt) {
    run.time += run.over ? 0 : dt;
    for (const r of run.regions) {
      if (r.owner !== NEUTRAL) {
        const g = r.grow * run.factions[r.owner].gMul;
        if (r.troops < r.cap) r.troops = Math.min(r.cap, r.troops + g * dt);
        else r.troops = Math.max(r.cap, r.troops - 1.5 * dt);
      }
      if (r.anim) { r.anim.t += dt / 0.55; if (r.anim.t >= 1) r.anim = null; }
      if (r.pop > 0) r.pop = Math.max(0, r.pop - dt * 3);
    }
    for (const s of run.streams) emit(s, dt);
    run.streams = run.streams.filter(s => s.left > 0);
    for (const u of run.units) {
      if (u.dead) continue;
      const dx = u.t.x - u.x, dy = u.t.y - u.y, d = Math.hypot(dx, dy);
      if (d < BASE_R * 0.8) { u.dead = true; arrive(u.t, u.o); continue; }
      const st = Math.min(d, u.sp * dt);
      u.x += dx / d * st; u.y += dy / d * st;
    }
    fight();
    towers(dt);
    let w = 0;
    for (const u of run.units) if (!u.dead) run.units[w++] = u;
    run.units.length = w;
    for (const f of run.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; f.life -= dt; }
    run.fx = run.fx.filter(f => f.life > 0);
    for (const tr of run.tracers) tr.life -= dt;
    run.tracers = run.tracers.filter(tr => tr.life > 0);
    if (run.over) return;
    for (const f of run.factions) {
      if (f.id === PLAYER || !f.alive) continue;
      f.cd -= dt;
      if (f.cd <= 0) { f.cd = f.interval * (0.7 + Math.random() * 0.6); aiThink(f); }
    }
    run.checkT -= dt;
    if (run.checkT <= 0) { run.checkT = 0.25; checkFactions(); updateBar(); }
  }

  function checkFactions() {
    const has = run.factions.map(() => false);
    for (const r of run.regions) if (r.owner >= 0) has[r.owner] = true;
    for (const u of run.units) has[u.o] = true;
    for (const s of run.streams) has[s.o] = true;
    for (const f of run.factions) {
      if (!f.alive || has[f.id]) continue;
      f.alive = false;
      if (f.id === PLAYER) { finish(false); return; }
      toast(t.out(t.factions[f.id]));
      announce(t.out(t.factions[f.id]));
    }
    if (run.factions.every(f => f.id === PLAYER || !f.alive)) finish(true);
  }

  // ---------- AI ----------
  function incoming() {
    if (run.incT === run.time) return run.inc;
    const n = run.factions.length + 1;
    const inc = run.regions.map(() => new Float32Array(n));
    for (const u of run.units) inc[u.t.id][u.o + 1] += 1;
    for (const s of run.streams) inc[s.tgt.id][s.o + 1] += s.left;
    run.incT = run.time; run.inc = inc;
    return inc;
  }

  // Expected losses to enemy towers along a straight march.
  function towerCost(a, b, fid, speed) {
    let cost = 0;
    const dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy || 1;
    for (const tw of run.regions) {
      if (tw.kind !== 'tower' || tw.owner === fid || tw === b) continue;
      const s = clamp(((tw.x - a.x) * dx + (tw.y - a.y) * dy) / len2, 0, 1);
      const d = Math.hypot(a.x + dx * s - tw.x, a.y + dy * s - tw.y);
      if (d < TOWER_RANGE) cost += 2 * Math.sqrt(TOWER_RANGE * TOWER_RANGE - d * d) / speed / TOWER_RATE;
    }
    return cost;
  }

  function aiThink(f) {
    const mine = run.regions.filter(r => r.owner === f.id);
    if (!mine.length) return;
    const inc = incoming();
    const threat = r => { let s = 0; const a = inc[r.id]; for (let o = 0; o < a.length; o++) if (o !== f.id + 1) s += a[o]; return s - a[f.id + 1]; };
    const keep = f.pers === 'turtle' ? 10 : f.pers === 'opportunist' ? 4 : 2;
    const avail = r => Math.max(0, Math.floor(r.troops - keep - Math.max(0, threat(r))));
    const speed = UNIT_SPEED * f.speed;
    // 1) Rescue a region that is about to fall.
    for (const r of mine) {
      const need = threat(r) - r.troops;
      if (need <= 0) continue;
      const helper = mine.filter(m => m !== r && avail(m) > 4).sort((a, b) => dist(a, r) - dist(b, r))[0];
      if (helper && dist(helper, r) / speed < 6) { send(helper, r, Math.min(avail(helper), need + 4)); return; }
    }
    // 2) Pick a target that suits the personality and can be taken.
    const counts = run.factions.map(() => 0);
    for (const r of run.regions) if (r.owner >= 0) counts[r.owner]++;
    let leader = -1;
    counts.forEach((c, i) => { if (i !== f.id && (leader < 0 || c > counts[leader])) leader = i; });
    const cands = [];
    for (const tr of run.regions) {
      if (tr.owner === f.id) continue;
      let near = mine[0], nd = Infinity;
      for (const m of mine) { const d = dist(m, tr); if (d < nd) { nd = d; near = m; } }
      const eta = nd / speed;
      let need = tr.troops + 2;
      if (tr.owner !== NEUTRAL) need += tr.grow * run.factions[tr.owner].gMul * eta * f.foresight;
      const a = inc[tr.id];
      for (let o = 0; o < a.length; o++) {
        if (o === tr.owner + 1) need += a[o];
        else if (o === f.id + 1) need -= a[o];
        else need -= a[o] * 0.5;
      }
      need += towerCost(near, tr, f.id, speed);
      if (need <= 0) continue;
      const neutral = tr.owner === NEUTRAL;
      let score;
      if (f.pers === 'expander') score = -nd / 70 - need / 14 + (neutral ? 1.6 : 0) + (tr.kind ? 0.8 : 0);
      else if (f.pers === 'turtle') score = -need / 7 - nd / 90 + (neutral ? 1 : 0) + (tr.kind === 'capital' ? 1 : 0);
      else score = -need / 5 - nd / 140 + (tr.troops < 6 ? 2 : 0) + (tr.owner === leader ? 1.2 : 0);
      // Gentle rivals leave the player alone for a while and prefer free land.
      if (tr.owner === PLAYER) score -= (1 - f.skill) * 2.2 * Math.max(0, 1 - run.time / 150);
      cands.push({ tr, need, score });
    }
    cands.sort((a, b) => b.score - a.score);
    for (const c of cands.slice(0, 6)) {
      const want = c.need * f.margin * (f.pers === 'turtle' ? 1.25 : 1);
      const srcs = mine.filter(m => avail(m) > 0).sort((a, b) => dist(a, c.tr) - dist(b, c.tr)).slice(0, 4);
      let sum = 0;
      const pick = [];
      for (const s of srcs) { if (sum >= want) break; pick.push(s); sum += avail(s); }
      if (sum < want) continue;
      let left = Math.ceil(want) + (f.pers === 'expander' ? 3 : 6);
      for (const s of pick) { const n = Math.min(avail(s), left); left -= send(s, c.tr, n); }
      return;
    }
    // 3) Nothing to take: move surplus from safe rear regions to the front.
    if (mine.length > 1) {
      const enemyDist = r => Math.min(...run.regions.filter(o => o.owner !== f.id).map(o => dist(o, r)));
      const front = mine.reduce((a, b) => enemyDist(a) <= enemyDist(b) ? a : b);
      const rear = mine.find(m => m !== front && m.troops > m.cap * 0.8 && avail(m) > 8);
      if (rear) send(rear, front, avail(rear));
    }
  }

  // ---------- Rendering ----------
  const ICONS = {
    capital: new Path2D('M-5.5 3.5 L-5.5 -3 L-2.7 0 L0 -4.5 L2.7 0 L5.5 -3 L5.5 3.5 Z'),
    speed: new Path2D('M1.5 -5.5 L-3.5 1 L-0.2 1 L-1.5 5.5 L3.5 -1 L0.2 -1 Z'),
    tower: new Path2D('M-4.5 4.5 L-4.5 -4.5 L-2.6 -4.5 L-2.6 -2.7 L-0.9 -2.7 L-0.9 -4.5 L0.9 -4.5 L0.9 -2.7 L2.6 -2.7 L2.6 -4.5 L4.5 -4.5 L4.5 4.5 Z'),
  };
  const ICON_COLOR = { capital: '#e3a400', speed: '#ff7a00', tower: '#4b5468' };

  function resize() {
    measure();
    canvas.width = Math.round(view.w * view.dpr);
    canvas.height = Math.round(view.h * view.dpr);
    const st = run || preview;
    if (st) fit(st.map);
    renderBackground();
    if (!run || run.paused || run.over) render();
  }

  function renderBackground() {
    bg.width = canvas.width; bg.height = canvas.height;
    const g = bgCtx, d = view.dpr;
    g.setTransform(1, 0, 0, 1, 0, 0);
    const grad = g.createLinearGradient(0, 0, 0, bg.height);
    grad.addColorStop(0, '#2f9bd8'); grad.addColorStop(1, '#1d76b2');
    g.fillStyle = grad; g.fillRect(0, 0, bg.width, bg.height);
    const r = mulberry(42);
    g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = 2 * d; g.lineCap = 'round';
    for (let i = 0, n = Math.round(view.w * view.h / 7000); i < n; i++) {
      const x = r() * bg.width, y = r() * bg.height, s = (5 + r() * 5) * d;
      g.beginPath(); g.moveTo(x - s, y); g.quadraticCurveTo(x - s / 2, y - s / 2, x, y); g.quadraticCurveTo(x + s / 2, y + s / 2, x + s, y); g.stroke();
    }
    const st = run || preview;
    if (!st) return;
    g.setTransform(d * view.s, 0, 0, d * view.s, d * view.x0, d * view.y0);
    g.lineJoin = 'round';
    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 26;
    for (const reg of st.regions) g.stroke(reg.path);
    g.save(); g.translate(0, 7);
    g.fillStyle = g.strokeStyle = '#155a8a'; g.lineWidth = 10;
    for (const reg of st.regions) { g.fill(reg.path); g.stroke(reg.path); }
    g.restore();
    g.fillStyle = g.strokeStyle = '#f5e6bd'; g.lineWidth = 10;
    for (const reg of st.regions) { g.fill(reg.path); g.stroke(reg.path); }
  }

  function render() {
    const st = run || preview;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    if (!st) return;
    const s = view.s, d = view.dpr;
    ctx.setTransform(d * s, 0, 0, d * s, d * view.x0, d * view.y0);
    const time = run ? run.time : 0;
    for (const r of st.regions) {
      const c = colorOf(r.owner);
      if (r.anim) {
        ctx.fillStyle = colorOf(r.anim.from).fill; ctx.fill(r.path);
        ctx.save(); ctx.clip(r.path);
        const e = 1 - (1 - r.anim.t) ** 3;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.reach * e + 1, 0, TAU); ctx.fillStyle = c.fill; ctx.fill();
        ctx.restore();
      } else { ctx.fillStyle = c.fill; ctx.fill(r.path); }
    }
    // Highlight selected regions and the current drag/keyboard target.
    const target = run && !run.over ? currentTarget() : null;
    if (run) {
      ctx.fillStyle = 'rgba(255,255,255,0.32)';
      for (const r of run.sel) ctx.fill(r.path);
      if (target) { ctx.fillStyle = target.owner === PLAYER ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.4)'; ctx.fill(target.path); }
      else if (hover && !ptr && !run.sel.has(hover)) { ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill(hover.path); }
    }
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = Math.max(1.4, 1.3 / s);
    for (const r of st.regions) ctx.stroke(r.path);
    if (target) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.2 / s; ctx.stroke(target.path); }
    // Tower ranges.
    ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5 / s;
    for (const r of st.regions) {
      if (r.kind !== 'tower') continue;
      ctx.strokeStyle = r.owner === NEUTRAL ? 'rgba(60,68,88,0.35)' : colorOf(r.owner).dark + '80';
      ctx.beginPath(); ctx.arc(r.x, r.y, TOWER_RANGE, 0, TAU); ctx.stroke();
    }
    ctx.setLineDash([]);
    if (run) {
      drawOrders(target);
      drawUnits();
      ctx.strokeStyle = '#fff6c2'; ctx.lineWidth = 2 / s; ctx.lineCap = 'round';
      for (const tr of run.tracers) { ctx.globalAlpha = tr.life / 0.14; ctx.beginPath(); ctx.moveTo(tr.x1, tr.y1); ctx.lineTo(tr.x2, tr.y2); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
    for (const r of st.regions) drawBase(r, time);
    if (run) {
      for (const f of run.fx) { ctx.globalAlpha = Math.min(1, f.life * 2); ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, 2.2, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1;
      if (kbMode && run.focus && !run.over) {
        const r = run.focus, R = baseR() + 7;
        ctx.strokeStyle = '#ffc53d'; ctx.lineWidth = 3 / s; ctx.setLineDash([6 / s, 4 / s]);
        ctx.beginPath(); ctx.arc(r.x, r.y, R, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }

  const baseR = () => clamp(13 / view.s, BASE_R, 24);

  function drawBase(r, time) {
    const c = colorOf(r.owner), s = view.s;
    const R = baseR() * (1 + r.pop * 0.22) * (r.kind === 'capital' ? 1.12 : 1);
    ctx.fillStyle = 'rgba(10,30,60,0.22)';
    ctx.beginPath(); ctx.ellipse(r.x, r.y + R * 0.35, R * 1.05, R * 0.8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(r.x, r.y, R + 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = c.base;
    ctx.beginPath(); ctx.arc(r.x, r.y, R, 0, TAU); ctx.fill();
    if (run && run.sel.has(r)) {
      const pulse = reduced ? 0 : Math.sin(time * 8) * 1.5;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3 / s;
      ctx.beginPath(); ctx.arc(r.x, r.y, R + 6 + pulse, 0, TAU); ctx.stroke();
    }
    const n = Math.floor(r.troops);
    const fs = clamp(11.5 / s, 12.5, 20) * (n >= 100 ? 0.86 : 1);
    ctx.font = `900 ${fs}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(String(n), r.x, r.y + fs * 0.06);
    if (r.kind) {
      const bx = r.x + R * 0.78, by = r.y - R * 0.78, k = clamp(1 / s, 0.75, 1.3);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(bx, by, 7.6 * k, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(bx, by); ctx.scale(k, k);
      ctx.fillStyle = ICON_COLOR[r.kind]; ctx.fill(ICONS[r.kind]);
      ctx.restore();
    }
  }

  function drawUnits() {
    const byOwner = new Map();
    for (const u of run.units) { const l = byOwner.get(u.o); if (l) l.push(u); else byOwner.set(u.o, [u]); }
    for (const [o, list] of byOwner) {
      const c = COLORS[o];
      for (const [color, rad] of [[c.dark, UNIT_R + 0.9], [c.base, UNIT_R]]) {
        ctx.fillStyle = color; ctx.beginPath();
        for (const u of list) { ctx.moveTo(u.x + rad, u.y); ctx.arc(u.x, u.y, rad, 0, TAU); }
        ctx.fill();
      }
    }
  }

  function drawOrders(target) {
    const s = view.s;
    let end = null;
    if (ptr && ptr.moved) end = target || { x: ptr.x, y: ptr.y };
    else if (kbMode && run.sel.size && run.focus && !run.sel.has(run.focus)) end = run.focus;
    if (!end) return;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.fillStyle = '#fff'; ctx.lineWidth = 3.4 / s; ctx.lineCap = 'round';
    ctx.setLineDash([9 / s, 7 / s]);
    ctx.lineDashOffset = reduced ? 0 : -run.time * 40 / s;
    for (const r of run.sel) {
      if (r === end) continue;
      const dx = end.x - r.x, dy = end.y - r.y, len = Math.hypot(dx, dy);
      if (len < 4) continue;
      const stop = end === target || end === run.focus ? baseR() + 6 : 0;
      const ex = end.x - dx / len * stop, ey = end.y - dy / len * stop;
      ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(ex, ey); ctx.stroke();
      const a = Math.atan2(dy, dx), h = 10 / s;
      ctx.save(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(a - 0.5) * h, ey - Math.sin(a - 0.5) * h); ctx.lineTo(ex - Math.cos(a + 0.5) * h, ey - Math.sin(a + 0.5) * h); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }

  // ---------- HUD ----------
  function buildBar() {
    const owners = run.factions.map(f => f.id).concat(NEUTRAL);
    $('bar').replaceChildren(...owners.map(o => { const sp = document.createElement('span'); sp.style.background = colorOf(o).base; sp.dataset.o = o; return sp; }));
    updateBar();
  }
  function updateBar() {
    const counts = new Map();
    for (const r of run.regions) counts.set(r.owner, (counts.get(r.owner) || 0) + 1);
    for (const sp of $('bar').children) sp.style.flexGrow = String(counts.get(Number(sp.dataset.o)) || 0);
    const c = fmt(run.time);
    if ($('clock').textContent !== c) $('clock').textContent = c;
  }
  function toast(text) {
    const el = $('toast');
    el.textContent = text;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }
  function announce(text) { const a = $('announcer'); a.textContent = ''; setTimeout(() => { a.textContent = text; }, 30); }

  // ---------- Input ----------
  function toWorld(cx, cy) { return { x: (cx - view.x0) / view.s, y: (cy - view.y0) / view.s }; }
  function regionAt(cx, cy) {
    if (!run) return null;
    const w = toWorld(cx, cy);
    let best = null, bd = Math.max(BASE_R * 1.4, 22 / view.s) ** 2;
    for (const r of run.regions) { const d = (r.x - w.x) ** 2 + (r.y - w.y) ** 2; if (d < bd) { bd = d; best = r; } }
    if (best) return best;
    let bi = -1, bs = Infinity;
    run.map.sites.forEach((p, i) => { const d = (p.x - w.x) ** 2 + (p.y - w.y) ** 2; if (d < bs) { bs = d; bi = i; } });
    const ri = bi >= 0 ? run.map.siteRegion[bi] : -1;
    return ri >= 0 ? run.regions[ri] : null;
  }
  function currentTarget() {
    if (ptr && ptr.moved) return ptr.over;
    return null;
  }
  const playing = () => run && !run.over && !run.paused;

  function order(target) {
    const srcs = [...run.sel].filter(r => r !== target && r.owner === PLAYER);
    run.sel.clear();
    if (!target || !srcs.length) return;
    let total = 0;
    for (const r of srcs) total += send(r, target, r.troops);
    if (total) { hideNotice(); if (kbMode) announce(t.sent(total)); }
  }

  canvas.addEventListener('pointerdown', event => {
    if (!playing()) return;
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    canvas.focus({ preventScroll: true });
    kbMode = false;
    hideNotice();
    try { canvas.setPointerCapture(event.pointerId); } catch {}
    const r = regionAt(event.clientX, event.clientY), w = toWorld(event.clientX, event.clientY);
    ptr = { id: event.pointerId, sx: event.clientX, sy: event.clientY, x: w.x, y: w.y, moved: false, start: r, over: r };
  });
  canvas.addEventListener('pointermove', event => {
    if (!run) return;
    const r = regionAt(event.clientX, event.clientY);
    if (!ptr || ptr.id !== event.pointerId) {
      hover = playing() && event.pointerType === 'mouse' ? r : null;
      canvas.style.cursor = hover && hover.owner === PLAYER ? 'pointer' : '';
      return;
    }
    const w = toWorld(event.clientX, event.clientY);
    ptr.x = w.x; ptr.y = w.y; ptr.over = r;
    if (!ptr.moved && Math.hypot(event.clientX - ptr.sx, event.clientY - ptr.sy) > 9) {
      ptr.moved = true;
      if (ptr.start && ptr.start.owner === PLAYER) run.sel.add(ptr.start);
    }
    // Sweeping across your own regions adds them to the attack group.
    if (ptr.moved && r && r.owner === PLAYER && run.sel.size) run.sel.add(r);
  });
  canvas.addEventListener('pointerup', event => {
    if (!ptr || ptr.id !== event.pointerId) return;
    const p = ptr;
    ptr = null;
    if (!playing()) return;
    const r = regionAt(event.clientX, event.clientY);
    if (p.moved) { if (run.sel.size) order(r); return; }
    tap(r);
  });
  canvas.addEventListener('pointercancel', () => { ptr = null; });
  canvas.addEventListener('pointerleave', () => { hover = null; });

  function tap(r) {
    if (!r) { run.sel.clear(); return; }
    if (r.owner === PLAYER) {
      if (run.sel.has(r)) run.sel.delete(r);
      else if (run.sel.size) order(r);
      else run.sel.add(r);
    } else if (run.sel.size) order(r);
  }

  function describe(r) {
    const owner = r.owner === PLAYER ? t.you : r.owner === NEUTRAL ? t.neutral : t.factions[r.owner];
    return t.baseDesc(owner, Math.floor(r.troops), r.kind ? t.kinds[r.kind] : '') + (run.sel.has(r) ? `, ${t.selectedWord}` : '');
  }
  function moveFocus(dx, dy) {
    const from = run.focus || run.regions.find(r => r.owner === PLAYER) || run.regions[0];
    let best = null, bs = Infinity;
    for (const r of run.regions) {
      if (r === from) continue;
      const vx = r.x - from.x, vy = r.y - from.y, len = Math.hypot(vx, vy);
      const cos = (vx * dx + vy * dy) / len;
      if (cos < 0.45) continue;
      const sc = len * (2.2 - cos * 1.2);
      if (sc < bs) { bs = sc; best = r; }
    }
    if (best) setFocus(best);
  }
  function setFocus(r) { run.focus = r; announce(describe(r)); }

  canvas.addEventListener('keydown', event => {
    if (!playing() || event.altKey || event.ctrlKey || event.metaKey) return;
    const k = event.key;
    const dirs = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
    if (dirs[k]) { event.preventDefault(); kbMode = true; moveFocus(...dirs[k]); return; }
    if (k === 'Tab') {
      // Tab cycles through your own regions, then lets focus leave the map.
      const own = run.regions.filter(r => r.owner === PLAYER).sort((a, b) => a.y - b.y || a.x - b.x);
      const i = own.indexOf(run.focus), next = own[event.shiftKey ? i - 1 : i + 1];
      if (next && (i >= 0 || !event.shiftKey)) { event.preventDefault(); kbMode = true; setFocus(next); }
      return;
    }
    if (k === ' ' || k === 'Spacebar') {
      event.preventDefault(); kbMode = true;
      const r = run.focus;
      if (r && r.owner === PLAYER) { if (run.sel.has(r)) run.sel.delete(r); else run.sel.add(r); announce(describe(r)); }
      return;
    }
    if (k === 'Enter') {
      event.preventDefault(); kbMode = true;
      const r = run.focus;
      if (!r) return;
      if ([...run.sel].some(s => s !== r)) order(r);
      else if (r.owner === PLAYER) { run.sel.add(r); announce(describe(r)); }
    }
  });
  canvas.addEventListener('focus', () => { if (playing() && !run.focus) run.focus = run.regions.find(r => r.owner === PLAYER); });
  document.addEventListener('keydown', event => {
    if ((event.key === 'p' || event.key === 'P') && run && !run.over && !event.altKey && !event.ctrlKey && !event.metaKey) {
      event.preventDefault();
      run.paused ? resume() : pause();
    }
  });

  // ---------- Flow ----------
  const OVERLAYS = ['menu', 'levels', 'skirmish', 'shop', 'paused', 'result'];
  let lastPanel = 'menu';
  function show(id, focusEl) {
    for (const o of OVERLAYS) $(o).hidden = o !== id;
    if (id) {
      if (id !== 'paused' && id !== 'result') lastPanel = id;
      const f = focusEl || $(id).querySelector('button:not([disabled])');
      if (f) f.focus({ preventScroll: true });
    }
  }
  const unlocked = () => { const i = stars.findIndex(s => !s); return i < 0 ? LEVELS : i + 1; };
  const totalStars = () => stars.reduce((a, b) => a + b, 0);
  function setWallet() {
    for (const id of ['menu-wallet', 'shop-wallet']) { const w = $(id); w.querySelector('.num').textContent = String(coins); w.setAttribute('aria-label', t.coins(coins)); }
  }
  function todayBest() { return daily && daily.d === todayKey() && daily.best ? daily.best : 0; }

  function showMenu() {
    stopRun();
    $('hud').classList.add('off');
    $('play-info').textContent = t.playInfo(unlocked());
    $('levels-info').textContent = t.levelsInfo(totalStars());
    const b = todayBest();
    $('daily-info').textContent = t.dailyInfo(b ? fmt(b) : '');
    setWallet();
    makePreview();
    show('menu', $('play'));
  }

  function makePreview() {
    measure();
    const seed = (Math.random() * 2 ** 31) >>> 0;
    const map = genMap(seed, 24, play.w / play.h);
    const rnd = mulberry(seed);
    const regions = map.regions;
    // Paint a few colourful empires with a flood fill so the menu backdrop looks like a live war.
    const starts = placeStarts(regions, 4, play.w / play.h, rnd);
    const queue = [];
    starts.forEach((r, i) => { r.owner = i; queue.push(r); });
    let grown = starts.length;
    while (queue.length && grown < regions.length * 0.75) {
      const r = queue.splice(Math.floor(rnd() * queue.length), 1)[0];
      for (const j of r.nb) { const o = regions[j]; if (o.owner === NEUTRAL && rnd() < 0.75) { o.owner = r.owner; queue.push(o); grown++; } }
    }
    for (const r of regions) { setKind(r, rnd() < 0.08 ? 'tower' : ''); r.troops = 5 + Math.floor(rnd() * 40); }
    preview = { map, regions };
    fit(map);
    renderBackground();
    render();
  }

  function buildLevels() {
    const open = unlocked();
    $('levels-sub').textContent = t.levelsSub(totalStars(), LEVELS * 3);
    $('level-grid').replaceChildren(...Array.from({ length: LEVELS }, (_, i) => {
      const n = i + 1, b = document.createElement('button');
      b.type = 'button'; b.className = 'lvl';
      const s = stars[i];
      if (n > open) {
        b.classList.add('locked'); b.setAttribute('aria-disabled', 'true');
        b.innerHTML = '<b></b><small aria-hidden="true">🔒</small>';
        b.setAttribute('aria-label', t.levelLocked(n));
      } else {
        if (n === open && !s) b.classList.add('current');
        b.innerHTML = '<b></b><small aria-hidden="true"><i></i></small>';
        b.querySelector('i').textContent = '★'.repeat(s);
        b.querySelector('small').append('★'.repeat(3 - s));
        b.setAttribute('aria-label', t.levelLabel(n, s));
        b.addEventListener('click', () => startRun('campaign', n));
      }
      b.querySelector('b').textContent = String(n);
      return b;
    }));
    show('levels');
    const cur = $('level-grid').querySelector('.current') || $('level-grid').children[Math.min(open, LEVELS) - 1];
    if (cur) { cur.focus({ preventScroll: true }); cur.scrollIntoView({ block: 'nearest' }); }
  }

  function seg(el, labels, value, onPick) {
    el.replaceChildren(...labels.map((txt, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.setAttribute('role', 'radio'); b.textContent = txt;
      b.setAttribute('aria-checked', String(i === value));
      b.addEventListener('click', () => { onPick(i); for (const c of el.children) c.setAttribute('aria-checked', String(c === b)); });
      return b;
    }));
  }
  function buildSkirmish() {
    seg($('seg-size'), t.sizes, skirm.size, i => { skirm.size = i; save('skirmish', skirm); });
    seg($('seg-rivals'), ['1', '2', '3', '4', '5'], skirm.rivals - 1, i => { skirm.rivals = i + 1; save('skirmish', skirm); });
    seg($('seg-diff'), t.diffs, skirm.diff, i => { skirm.diff = i; save('skirmish', skirm); });
    show('skirmish', $('start-skirmish'));
  }

  function buildShop(focusKey) {
    setWallet();
    $('ups').replaceChildren(...UPGRADES.map(u => {
      const lvl = upg[u.key], row = document.createElement('div');
      row.className = 'up';
      row.innerHTML = '<span class="ico" aria-hidden="true"></span><div><b></b><small></small><div class="pips" aria-hidden="true"></div></div><button type="button" class="buy"></button>';
      row.querySelector('.ico').textContent = u.ico;
      row.querySelector('b').textContent = t[u.name];
      row.querySelector('small').textContent = t[u.info](Math.min(lvl + 1, UPG_COST.length) * u.per);
      row.querySelector('.pips').replaceChildren(...UPG_COST.map((_, i) => { const p = document.createElement('i'); if (i < lvl) p.className = 'on'; return p; }));
      const btn = row.querySelector('.buy');
      btn.dataset.key = u.key;
      if (lvl >= UPG_COST.length) { btn.textContent = t.max; btn.disabled = true; }
      else {
        const cost = UPG_COST[lvl];
        btn.innerHTML = '<span class="coin" aria-hidden="true"></span><span></span>';
        btn.lastChild.textContent = String(cost);
        btn.setAttribute('aria-label', t.buyLabel(t[u.name], cost));
        btn.disabled = coins < cost;
        btn.addEventListener('click', () => {
          if (coins < cost || upg[u.key] >= UPG_COST.length) return;
          coins -= cost; upg[u.key]++;
          save('coins', coins); save('upgrades', upg);
          announce(t.bought(t[u.name]));
          buildShop(u.key);
        });
      }
      return row;
    }));
    if (focusKey) {
      const b = $('ups').querySelector(`.buy[data-key="${focusKey}"]`);
      (b && !b.disabled ? b : $('shop').querySelector('[data-back]')).focus({ preventScroll: true });
    }
  }

  function startRun(mode, level = 0) {
    stopRun();
    clearTimeout(pendingResult);
    show(null);
    $('hud').classList.remove('off');
    run = newRun(mode, level);
    preview = null;
    fit(run.map);
    renderBackground();
    $('hud-label').textContent = mode === 'campaign' ? t.hudLevel(level) : mode === 'daily' ? t.hudDaily : t.hudSkirmish;
    $('clock').textContent = '0:00';
    buildBar();
    const title = $('hud-label').textContent;
    showNotice(title, [t.intro(run.p.ais), run.p.tip ? t[run.p.tip] : ''].filter(Boolean).join(' '), mode === 'campaign' ? t.starGoal(fmt(run.p.t3)) : '');
    announce(`${title}. ${t.intro(run.p.ais)}`);
    canvas.focus({ preventScroll: true });
    lastTime = performance.now(); acc = 0;
    rafId = requestAnimationFrame(frame);
  }

  function stopRun() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    run = null; ptr = null; hover = null;
    hideNotice();
  }

  function showNotice(title, text, goal) {
    $('notice-title').textContent = title;
    $('notice-text').textContent = text;
    $('notice-goal').textContent = goal;
    $('notice').hidden = false;
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(hideNotice, run && run.p.tip === 'tipFirst' ? 6000 : 3200);
  }
  function hideNotice() { clearTimeout(noticeTimer); $('notice').hidden = true; }

  function finish(win) {
    run.over = true; run.win = win;
    run.sel.clear(); ptr = null;
    hideNotice();
    const p = run.p, tm = run.time;
    let got = 0, earned = 0, best = false;
    if (win) {
      if (run.mode === 'campaign') {
        got = tm <= p.t3 ? 3 : tm <= p.t2 ? 2 : 1;
        const prev = stars[run.level - 1];
        earned = prev ? 4 + got * 2 : 10 + run.level + got * 5;
        if (got > prev) { stars[run.level - 1] = got; save('stars', stars); }
      } else if (run.mode === 'daily') {
        const today = todayKey();
        if (!daily || daily.d !== today) daily = { d: today, best: 0, wins: 0 };
        earned = daily.wins ? 6 : 30;
        best = !daily.best || tm < daily.best;
        if (best) daily.best = Math.round(tm * 10) / 10;
        daily.wins++;
        save('daily', daily);
      } else earned = Math.round((6 + p.ais * 4) * (1 + skirm.diff * 0.5));
    } else earned = run.mode === 'campaign' ? 0 : 2;
    coins += earned;
    save('coins', coins);
    updateBar();
    run.result = { got, earned, best };
    pendingResult = setTimeout(showResult, reduced ? 200 : 1100);
  }

  function showResult() {
    if (!run || !run.over) return;
    cancelAnimationFrame(rafId); rafId = 0;
    render();
    const { got, earned, best } = run.result, win = run.win;
    $('result-emblem').textContent = win ? '🏆' : '🏳️';
    $('result-title').textContent = win ? t.win : t.lose;
    $('result-sub').textContent = win ? t.winSub(fmt(run.time)) : t.loseSub;
    const st = $('result-stars');
    st.replaceChildren();
    st.hidden = !(win && run.mode === 'campaign');
    for (let i = 0; i < 3; i++) { const s = document.createElement('span'); s.textContent = '★'; if (i < got) s.className = 'on'; st.append(s); }
    $('result-note').textContent = win && run.mode === 'campaign' && got < 3 ? t.starGoal(fmt(run.p.t3)) : '';
    $('result-coins').hidden = !earned;
    $('result-coins').lastChild.textContent = t.coinsEarned(earned);
    $('result-best').hidden = !best;
    const hasNext = win && run.mode === 'campaign' && run.level < LEVELS;
    $('result-next').hidden = !hasNext;
    $('result-retry').textContent = win ? t.playAgain : t.retry;
    show('result', hasNext ? $('result-next') : $('result-retry'));
    announce([$('result-title').textContent, $('result-sub').textContent, win && run.mode === 'campaign' ? `${got}/3 ★` : '', earned ? t.coinsEarned(earned) : ''].filter(Boolean).join(' '));
  }

  function frame(time) {
    rafId = 0;
    if (!run || run.paused) return;
    // Fixed simulation step; a stalled frame is clamped so nothing teleports.
    acc += Math.min(0.05, Math.max(0, (time - lastTime) / 1000));
    lastTime = time;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    render();
    rafId = requestAnimationFrame(frame);
  }

  function pause() {
    if (!run || run.over || run.paused) return;
    run.paused = true; ptr = null;
    cancelAnimationFrame(rafId); rafId = 0;
    hideNotice();
    show('paused', $('resume'));
    announce(t.paused);
  }
  function resume() {
    if (!run || run.over) return;
    run.paused = false;
    show(null);
    lastTime = performance.now(); acc = 0;
    if (!rafId) rafId = requestAnimationFrame(frame);
    canvas.focus({ preventScroll: true });
  }

  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', () => { ptr = null; });
  $('pause-btn').addEventListener('click', pause);
  $('resume').addEventListener('click', resume);
  $('restart').addEventListener('click', () => { const r = run; startRun(r.mode, r.level); });
  $('quit').addEventListener('click', showMenu);
  $('play').addEventListener('click', () => startRun('campaign', unlocked()));
  $('go-levels').addEventListener('click', buildLevels);
  $('go-skirmish').addEventListener('click', buildSkirmish);
  $('go-daily').addEventListener('click', () => startRun('daily'));
  $('go-shop').addEventListener('click', () => { buildShop(); show('shop'); });
  $('start-skirmish').addEventListener('click', () => startRun('skirmish'));
  for (const b of document.querySelectorAll('[data-back]')) b.addEventListener('click', showMenu);
  $('result-menu').addEventListener('click', showMenu);
  $('result-retry').addEventListener('click', () => startRun(run.mode, run.level));
  $('result-next').addEventListener('click', () => startRun('campaign', Math.min(LEVELS, run.level + 1)));

  window.addEventListener('resize', resize);
  // Read-only snapshot for automated checks.
  window.__territoryWar = () => run && {
    mode: run.mode, level: run.level, time: run.time, over: run.over, win: run.win, paused: run.paused, t3: run.p.t3,
    units: run.units.length, alive: run.factions.map(f => f.alive),
    regions: run.regions.map(r => ({ id: r.id, owner: r.owner, troops: Math.floor(r.troops), kind: r.kind, sx: view.x0 + r.x * view.s, sy: view.y0 + r.y * view.s })),
  };
  resize();
  showMenu();
})();
</script>
</body>
</html>
