<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mancala</title>
<style>
:root {
  --bg: #1d130c;
  --bg2: #2c1d12;
  --ink: #fff6ea;
  --muted: #d9c3a5;
  --wood: #a8652f;
  --wood-hi: #c98446;
  --wood-dk: #6b3c18;
  --pit: #4a2a12;
  --gold: #ffcf5a;
  --p1: #4fd1a5;
  --p2: #ff8a65;
  --paper: #2e2016;
  --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg) 70%); background-color: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); }
.hud .grow { flex: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; background: #00000044; border: 1px solid #ffffff22; font-size: 16px; font-weight: 900; display: grid; place-items: center; }
.chip { padding: 4px 10px; border-radius: 12px; background: #00000044; border: 1px solid #ffffff22; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.app.menu .hud, .app.menu .stage { visibility: hidden; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
.who { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; padding: 6px 14px; border-radius: 99px; background: #00000033; border: 2px solid transparent; transition: border-color .2s, background .2s; }
.who .dot { width: 12px; height: 12px; border-radius: 50%; }
.who.p1 .dot { background: var(--p1); } .who.p2 .dot { background: var(--p2); }
.who.on.p1 { border-color: var(--p1); background: #4fd1a522; }
.who.on.p2 { border-color: var(--p2); background: #ff8a6522; }
.who.top { transform: none; }
.status { min-height: 22px; font-size: 15px; font-weight: 800; color: var(--gold); text-align: center; }

.board { --pw: min(10.5vw, 96px); display: grid; grid-template-columns: calc(var(--pw) * 1.05) repeat(6, var(--pw)) calc(var(--pw) * 1.05); grid-template-rows: var(--pw) var(--pw); gap: calc(var(--pw) * .12); padding: calc(var(--pw) * .18); border-radius: calc(var(--pw) * .5); background: linear-gradient(180deg, var(--wood-hi), var(--wood) 45%, var(--wood-dk)); box-shadow: inset 0 2px 0 #ffffff33, inset 0 -4px 0 #0004, 0 18px 40px #0009; }
.pit { position: relative; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #2a160822, #00000000 60%), var(--pit); box-shadow: inset 0 6px 10px #000a, 0 1px 0 #ffffff33; overflow: visible; transition: box-shadow .15s, transform .15s; }
.pit.store { border-radius: calc(var(--pw) * .5); grid-row: 1 / 3; }
.pit .seeds { position: absolute; inset: 12%; pointer-events: none; }
.seed { position: absolute; width: 22%; height: 22%; margin: -11% 0 0 -11%; border-radius: 50%; box-shadow: inset -2px -3px 3px #0006, inset 2px 2px 2px #fff8; }
.store .seed { width: 20%; height: 9%; margin: -10% 0 0 -10%; }
.pit .n { position: absolute; left: 50%; transform: translateX(-50%); font-size: clamp(11px, calc(var(--pw) * .2), 18px); font-weight: 900; font-variant-numeric: tabular-nums; color: var(--ink); text-shadow: 0 1px 2px #000; pointer-events: none; }
.pit.bot .n { bottom: calc(var(--pw) * -.36); }
.pit.top .n { top: calc(var(--pw) * -.36); }
.pit.store .n { top: 50%; transform: translate(-50%, -50%); font-size: clamp(16px, calc(var(--pw) * .34), 30px); background: #0007; border-radius: 10px; padding: 0 6px; }
.board { margin: 18px 0; }
.pit.can { cursor: pointer; box-shadow: inset 0 6px 10px #000a, 0 0 0 3px var(--gold); }
.pit.can:hover, .pit.can:focus-visible { transform: scale(1.05); outline: none; box-shadow: inset 0 6px 10px #000a, 0 0 0 4px #fff, 0 0 18px var(--gold); }
.pit.hit { animation: hit .3s; }
.pit.cap { animation: cap .6s; }
@keyframes hit { 40% { box-shadow: inset 0 6px 10px #000a, 0 0 0 4px var(--gold), 0 0 22px var(--gold); } }
@keyframes cap { 30% { box-shadow: inset 0 6px 10px #000a, 0 0 0 5px #ff4d4d, 0 0 26px #ff4d4d; } }
.store.s1 { box-shadow: inset 0 6px 10px #000a, 0 0 0 2px var(--p1); }
.store.s2 { box-shadow: inset 0 6px 10px #000a, 0 0 0 2px var(--p2); }
.fly { position: fixed; z-index: 5; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; pointer-events: none; box-shadow: inset -2px -3px 3px #0006, inset 2px 2px 2px #fff8, 0 4px 6px #0007; transition: left .16s ease-in-out, top .16s ease-in-out; }

/* phone portrait: rotate layout vertical */
@media (max-aspect-ratio: 4/5) {
  .board { --pw: min(19vw, 8.6vh, 96px); grid-template-columns: var(--pw) var(--pw); grid-template-rows: calc(var(--pw) * 1.05) repeat(6, var(--pw)) calc(var(--pw) * 1.05); margin: 0 30px; }
  .pit.store { grid-row: auto; grid-column: 1 / 3; }
  .pit.bot .n { bottom: auto; top: 50%; left: calc(var(--pw) * -.3); transform: translate(-50%, -50%); }
  .pit.top .n { top: 50%; left: auto; right: calc(var(--pw) * -.3); transform: translate(50%, -50%); }
  .store .seed { width: 9%; height: 20%; }
  .stage { gap: 6px; }
}

.toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); padding: 8px 18px; border-radius: 99px; background: var(--gold); color: #3a2208; font-weight: 900; font-size: 20px; white-space: nowrap; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 6; box-shadow: 0 8px 20px #0008; }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

.overlay { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 8px; background: #120a0599; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 390px); max-height: calc(100% - 8px); overflow-y: auto; padding: 18px 16px; border-radius: 22px; background: var(--paper); border: 2px solid #ffcf5a55; box-shadow: 0 20px 50px #000a; text-align: center; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.title { font-size: clamp(38px, 12vw, 58px); font-weight: 900; letter-spacing: -.02em; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 var(--wood-dk); }
.tagline { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--muted); }
.label { margin-top: 14px; font-size: 11px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin-top: 6px; }
.seg button { padding: 10px 6px; border-radius: 14px; background: #463224; box-shadow: 0 3px 0 #1a100a; font-weight: 900; font-size: 15px; line-height: 1.2; }
.seg button small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--gold); color: #3a2208; box-shadow: 0 3px 0 #a87a14; }
.seg button[aria-pressed="true"] small { color: #3a2208; opacity: .8; }
.seg[hidden] { display: none; }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.45; }
.panel h2 { font-size: 26px; font-weight: 900; }
.sub { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
.scores { display: flex; justify-content: center; gap: 26px; margin-top: 12px; }
.scores small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.scores strong { display: block; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; margin-top: 14px; }
.btn { flex: 1; padding: 12px; border-radius: 14px; background: #463224; box-shadow: 0 3px 0 #1a100a; font-size: 16px; font-weight: 900; }
.btn.primary { background: var(--gold); color: #3a2208; box-shadow: 0 4px 0 #a87a14; }
.btn:active, .seg button:active { transform: translateY(2px); }
.record { margin-top: 10px; font-size: 12px; font-weight: 800; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 520px) {
  .panel { padding: 10px 14px; }
  .title { font-size: 32px; }
  .tagline { display: none; }
  .label { margin-top: 8px; }
  .seg button { padding: 7px 6px; }
  .help { margin-top: 6px; }
  .board { --pw: min(10.5vw, 22vh, 96px); margin: 14px 0; }
  .who { padding: 3px 12px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app menu" id="app">
  <div class="hud">
    <span class="chip" id="modechip"></span>
    <div class="grow"></div>
    <button type="button" class="iconbtn" id="pause" data-i18n-label="pause">II</button>
  </div>
  <div class="stage">
    <div class="who p2 top" id="who2"><span class="dot"></span><span id="name2"></span></div>
    <div class="board" id="board" role="group" data-i18n-label="board"></div>
    <div class="who p1" id="who1"><span class="dot"></span><span id="name1"></span></div>
    <p class="status" id="status" aria-hidden="true"></p>
  </div>
  <div class="toast" id="toast" aria-hidden="true"></div>

  <div class="overlay" id="menu">
    <div class="panel" role="dialog" aria-labelledby="menu-title">
      <h1 class="title" id="menu-title">Mancala</h1>
      <p class="tagline" data-i18n="tagline"></p>
      <p class="label" data-i18n="opponent"></p>
      <div class="seg" id="seg-mode">
        <button type="button" data-mode="ai" aria-pressed="true"><span data-i18n="vsAI"></span><small data-i18n="vsAIDesc"></small></button>
        <button type="button" data-mode="pvp" aria-pressed="false"><span data-i18n="twoP"></span><small data-i18n="twoPDesc"></small></button>
      </div>
      <p class="label" id="lvl-label" data-i18n="level"></p>
      <div class="seg" id="seg-lvl">
        <button type="button" data-lvl="0" aria-pressed="false" data-i18n="easy"></button>
        <button type="button" data-lvl="1" aria-pressed="true" data-i18n="normal"></button>
        <button type="button" data-lvl="2" aria-pressed="false" data-i18n="hard"></button>
      </div>
      <div class="row"><button type="button" class="btn primary" id="start" data-i18n="start"></button></div>
      <p class="record" id="record"></p>
      <p class="help" id="help"></p>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="panel" role="dialog" aria-labelledby="paused-title">
      <h2 id="paused-title" data-i18n="paused"></h2>
      <p class="help" data-i18n="rules"></p>
      <div class="row"><button type="button" class="btn" id="quit" data-i18n="menu"></button><button type="button" class="btn primary" id="resume" data-i18n="resume"></button></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel" role="dialog" aria-labelledby="over-title">
      <h2 id="over-title"></h2>
      <p class="sub" id="osub"></p>
      <div class="scores">
        <div><small id="ol1"></small><strong id="os1">0</strong></div>
        <div><small id="ol2"></small><strong id="os2">0</strong></div>
      </div>
      <p class="record" id="orecord"></p>
      <div class="row"><button type="button" class="btn" id="omenu" data-i18n="menu"></button><button type="button" class="btn primary" id="oretry" data-i18n="retry"></button></div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

    for (const bt of $('seg-mode').children) bt.setAttribute('aria-pressed', String(bt.dataset.mode === settings.mode));
    for (const bt of $('seg-lvl').children) bt.setAttribute('aria-pressed', String(+bt.dataset.lvl === settings.lvl));
    $('seg-lvl').hidden = $('lvl-label').hidden = settings.mode !== 'ai';
  }
  $('seg-mode').addEventListener('click', e => { const bt = e.target.closest('button'); if (!bt) return; settings.mode = bt.dataset.mode; store('settings', settings); syncMenu(); });
  $('seg-lvl').addEventListener('click', e => { const bt = e.target.closest('button'); if (!bt) return; settings.lvl = +bt.dataset.lvl; store('settings', settings); syncMenu(); });
  $('start').addEventListener('click', start);
  $('oretry').addEventListener('click', start);
  $('omenu').addEventListener('click', toMenu);
  $('quit').addEventListener('click', toMenu);
  $('resume').addEventListener('click', () => setPause(false));
  $('pause').addEventListener('click', () => setPause(!S.paused));

  addEventListener('keydown', e => {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { if (!$('menu').hidden || !$('over').hidden) return; e.preventDefault(); setPause(!S.paused); return; }
    if (S.over || S.paused || S.busy || (S.ai && S.turn === 1)) return;
    const ms = moves(S.b, S.turn);
    if (/^[1-6]$/.test(e.key)) { const i = (S.turn === 0 ? 0 : 7) + +e.key - 1; if (canClick(i)) { e.preventDefault(); play(i); } return; }
    let d = 0;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') d = 1; else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') d = -1;
    if (d && ms.length) {
      e.preventDefault();
      if (S.turn === 1) d = -d; // player 2's row runs right-to-left on screen
      let k = ms.indexOf(S.focus); k = k < 0 ? 0 : (k + d + ms.length) % ms.length;
      S.focus = ms[k]; pitEls[S.focus].focus();
    } else if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && !document.activeElement.classList.contains('pit') && canClick(S.focus)) { e.preventDefault(); play(S.focus); }
  });
  addEventListener('blur', () => { if (!S.over && !S.paused) setPause(true); });
  addEventListener('resize', () => { layout(); for (const el of pitEls) el._n = -1; if (S.b.length) render(); });

  $('help').textContent = coarse ? t.helpTouch : t.helpKeys;
  buildBoard();
  S.b = [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0]; render();
  toMenu();
  if (new URLSearchParams(location.search).has('demo')) {
    // screenshot helper: jump into a mid-game position
    settings.mode = 'ai'; start(); S.b = [0, 6, 2, 7, 5, 1, 9, 3, 5, 0, 6, 4, 2, 6]; S.turn = 0; for (const el of pitEls) el._n = -1; render(); setStatus(turnText());
  }
})();
</script>
</body>
</html>
