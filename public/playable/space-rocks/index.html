<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Rocks</title>
<style>
:root {
  --bg: #04060f;
  --text: #eef6ff;
  --muted: #8ea3c4;
  --accent: #ffb547;
  --accent-dark: #c47a12;
  --cyan: #4ff0ff;
  --pink: #ff5fa2;
  --panel: #0b1226;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.app { position: fixed; inset: 0; }
.stage { position: absolute; inset: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; background: radial-gradient(ellipse at 50% 40%, #0d1636 0%, #060a1a 55%, #03040b 100%); }
canvas:focus-visible { outline: none; }

.hud { position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); display: flex; align-items: flex-start; gap: 10px; pointer-events: none; z-index: 2; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.stat strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.2; text-shadow: 0 0 10px #4ff0ff66; }
.stat.score strong { color: var(--cyan); }
.lives { color: var(--accent); letter-spacing: 2px; font-size: 15px !important; text-shadow: 0 0 8px #ffb54788 !important; }
.spacer { flex: 1; }
.hud .icon { pointer-events: auto; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: #ffffff10; box-shadow: inset 0 0 0 1px #ffffff22; font-size: 16px; }
.hud .icon:active { background: #ffffff22; }
.hud .icon[hidden] { display: none; }
.stat[hidden] { display: none; }

.touch { position: absolute; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; padding: 0 max(10px, env(safe-area-inset-left)) 0 max(10px, env(safe-area-inset-right)); pointer-events: none; z-index: 2; }
.touch[hidden] { display: none; }
.pad { display: flex; gap: 10px; align-items: flex-end; }
.tb { pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: #ffffff12; box-shadow: inset 0 0 0 2px #4ff0ff55, 0 0 16px #4ff0ff22; color: var(--cyan); touch-action: none; }
.tb svg { width: 28px; height: 28px; }
.tb.on { background: #4ff0ff33; }
.tb.fire { width: 76px; height: 76px; color: var(--accent); box-shadow: inset 0 0 0 2px #ffb54777, 0 0 18px #ffb54733; }
.tb.fire.on { background: #ffb54733; }
.tb.small { width: 46px; height: 46px; color: var(--pink); box-shadow: inset 0 0 0 2px #ff5fa266; }
.tb.small svg { width: 22px; height: 22px; }
@media (max-width: 380px) { .pad { gap: 8px; } .tb { width: 52px; height: 52px; } .tb.fire { width: 60px; height: 60px; } .tb.small { width: 40px; height: 40px; } .tb svg { width: 24px; height: 24px; } }
@media (max-height: 420px) { .tb { width: 54px; height: 54px; } .tb.fire { width: 64px; height: 64px; } .tb.small { width: 42px; height: 42px; } .stat strong { font-size: 17px; } }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; background: #02040ca0; z-index: 3; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 360px); max-height: calc(100% - 8px); overflow-y: auto; padding: 22px 20px; border-radius: 24px; text-align: center; background: #0b1226ee; box-shadow: 0 0 0 1px #4ff0ff40, 0 0 40px #4ff0ff22, 0 24px 48px #000a; animation: rise .35s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.panel h1, .panel h2 { font-size: clamp(28px, 9vw, 40px); font-weight: 900; letter-spacing: -.02em; line-height: 1.05; }
.panel h1 span { color: var(--accent); text-shadow: 0 0 16px #ffb54788; }
.panel h1 { color: var(--cyan); text-shadow: 0 0 16px #4ff0ff77; }
.panel p { margin-top: 8px; color: #d4def0; font-size: 15px; line-height: 1.4; }
.panel .small { font-size: 12px; color: var(--muted); }
.opt { margin-top: 12px; text-align: left; }
.opt > small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 36px; padding: 6px 4px; border-radius: 12px; background: #ffffff0d; box-shadow: inset 0 0 0 1px #ffffff1f; font-size: 14px; font-weight: 800; color: #c9d6ee; }
.seg button[aria-pressed="true"] { background: #4ff0ff26; box-shadow: inset 0 0 0 2px var(--cyan); color: #fff; }
.cta { margin-top: 16px; width: 100%; padding: 14px; border-radius: 16px; background: var(--accent); color: #2a1600; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-dark), 0 0 24px #ffb54755; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
.ghost { margin-top: 10px; width: 100%; padding: 11px; border-radius: 14px; background: #ffffff0d; box-shadow: inset 0 0 0 1px #ffffff24; font-weight: 800; }
.badge { display: inline-block; margin-top: 10px; padding: 5px 14px; border-radius: 99px; background: var(--pink); color: #2b0518 !important; font-weight: 800; font-size: 13px !important; }
.badge[hidden] { display: none; }
.banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 2; }
.banner[hidden] { display: none; }
.banner h2 { font-size: clamp(26px, 7vw, 44px); font-weight: 900; color: var(--text); text-shadow: 0 0 18px #4ff0ff, 0 4px 20px #000; text-align: center; padding: 0 16px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-height: 460px) {
  .panel { padding: 12px 16px; width: min(100%, 560px); }
  .panel h1, .panel h2 { font-size: 26px; }
  .panel p { font-size: 13px; margin-top: 4px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .opt { margin-top: 8px; }
  .seg button { min-height: 32px; font-size: 13px; }
  .cta { margin-top: 10px; padding: 10px; font-size: 16px; }
  .ghost { margin-top: 6px; padding: 8px; }
  .hide-short { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="stage" id="stage">
    <canvas id="canvas" tabindex="0" role="img" data-i18n-label="canvas"></canvas>
    <div class="hud">
      <div class="stat score"><small data-i18n="score"></small><strong id="score">0</strong></div>
      <div class="stat"><small data-i18n="wave"></small><strong id="wave">1</strong></div>

      <div class="stat" id="lives-box"><small data-i18n="lives"></small><strong class="lives" id="lives"></strong></div>
      <div class="spacer"></div>
      <div class="stat"><small data-i18n="best"></small><strong id="best">0</strong></div>
      <button type="button" class="icon" id="sound" data-i18n-label="sound">🔊</button>
      <button type="button" class="icon" id="pause" data-i18n-label="pause" hidden>❚❚</button>
    </div>
    <div class="touch" id="touch" hidden>
      <div class="pad">
        <button type="button" class="tb" id="t-left" data-i18n-label="rotL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 4 10l5 5"/><path d="M4 10h9a7 7 0 0 1 0 14"/></svg></button>
        <button type="button" class="tb" id="t-right" data-i18n-label="rotR"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 5 5-5 5"/><path d="M20 10h-9a7 7 0 0 0 0 14"/></svg></button>
      </div>
      <div class="pad">
        <button type="button" class="tb small" id="t-hyper" data-i18n-label="hyper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></svg></button>
        <button type="button" class="tb" id="t-thrust" data-i18n-label="thrust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 20l7-4 7 4z"/></svg></button>
        <button type="button" class="tb fire" id="t-fire" data-i18n-label="fire"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      </div>
    </div>
    <div class="banner" id="banner" hidden><h2 id="banner-text"></h2></div>

    <div class="overlay" id="intro">
      <div class="panel" role="dialog" aria-labelledby="intro-title">
        <h1 id="intro-title">Space <span>Rocks</span></h1>
        <p data-i18n="tagline"></p>
        <div class="opts">
          <div class="opt"><small data-i18n="mode"></small><div class="seg" id="seg-mode">
            <button type="button" data-v="classic" data-i18n="classic"></button><button type="button" data-v="time" data-i18n="timeAttack"></button></div></div>
          <div class="opt"><small data-i18n="difficulty"></small><div class="seg" id="seg-diff">
            <button type="button" data-v="easy" data-i18n="easy"></button><button type="button" data-v="normal" data-i18n="normal"></button><button type="button" data-v="hard" data-i18n="hard"></button></div></div>
          <div class="opt"><small data-i18n="autoFire"></small><div class="seg" id="seg-auto">
            <button type="button" data-v="off" data-i18n="off"></button><button type="button" data-v="on" data-i18n="on"></button></div></div>
        </div>
        <p class="small" id="mode-help"></p>
        <p class="small hide-short" id="controls"></p>
        <button type="button" class="cta" id="play" data-i18n="play"></button>
      </div>
    </div>
    <div class="overlay" id="paused" hidden>
      <div class="panel" role="dialog" aria-labelledby="paused-title">
        <h2 id="paused-title" data-i18n="paused"></h2>
        <button type="button" class="cta" id="resume" data-i18n="resume"></button>
        <button type="button" class="ghost" id="quit" data-i18n="menu"></button>
      </div>
    </div>
    <div class="overlay" id="over" hidden>
      <div class="panel" role="dialog" aria-labelledby="over-title">
        <h2 id="over-title"></h2>
        <p id="final"></p>
        <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
        <button type="button" class="cta" id="again" data-i18n="again"></button>
        <button type="button" class="ghost" id="to-menu" data-i18n="menu"></button>
      </div>
    </div>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

  // ---- Game state ----

  const bestKey = () => `best.${settings.mode}.${settings.diff}`;

  function makeShip() { return { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, alive: true, invuln: 2.2, hyper: 0, cool: 0, flame: 0 }; }

  function makeRock(size, x, y, speedMul) {

  }

  function spawnWave() {
    const d = DIFF[game.diff];
    const count = Math.min(d.startRocks + game.wave - 1, 12);

      while (Math.hypot(x - game.ship.x, y - game.ship.y) < 180);
      game.rocks.push(makeRock(3, x, y, speedMul));
    }
    game.ufoTimer = rand(14, 22) * d.ufoGap;
    game.beatGap = 1;
    game.waveStart = clock;
  }

  function newGame() {
    initAudio();
    if (audio && audio.state === 'suspended') audio.resume().catch(() => {});
    const d = DIFF[settings.diff];
    game = { mode: settings.mode, diff: settings.diff, auto: settings.auto === 'on', score: 0, wave: 1, lives: settings.mode === 'time' ? Infinity : d.lives,
      best: store.get(bestKey(), 0), nextLife: EXTRA_LIFE_EVERY, timeLeft: TIME_LIMIT, state: 'play', respawn: 0, ship: makeShip(),
      rocks: [], bullets: [], ufoShots: [], particles: [], debris: [], texts: [], ufo: null, ufoTimer: 15, beatTimer: 1, beatHi: false, beatGap: 1, waveTimer: 0, firePrev: false, hyperPrev: false };

  }

  function updateHud() {
    if (!game) { els.best.textContent = String(store.get(bestKey(), 0)); return; }

  }

  function step(dt) {

    for (const b of game.ufoShots) {

    }

    if (s.alive && s.hyper <= 0 && s.invuln <= 0 && game.state === 'play') {
      for (const r of game.rocks) if (!r.dead && near(s, r, r.r + 9)) { splitRock(r, true); killShip(); break; }
      if (s.alive && game.ufo && near(s, game.ufo, game.ufo.r + 10)) { destroyUfo(true); killShip(); }
      if (s.alive) for (const b of game.ufoShots) if (b.life > 0 && near(s, b, 11)) { b.life = 0; killShip(); break; }
    }
    game.rocks = game.rocks.filter(r => !r.dead);
    game.bullets = game.bullets.filter(b => b.life > 0);
    game.ufoShots = game.ufoShots.filter(b => b.life > 0);

    for (const p of game.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; p.life -= dt; }
    game.particles = game.particles.filter(p => p.life > 0);
    for (const d of game.debris) { d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.spin * dt; d.life -= dt; }
    game.debris = game.debris.filter(d => d.life > 0);
    for (const tx of game.texts) { tx.y -= 30 * dt; tx.life -= dt; }
    game.texts = game.texts.filter(tx => tx.life > 0);

    // The classic two-note heartbeat speeds up as the wave thins out.
    if (game.state === 'play' && game.rocks.length) {
      game.beatTimer -= dt;
      if (game.beatTimer <= 0) {
        const left = game.rocks.reduce((n, r) => n + r.size, 0);
        game.beatGap = Math.max(0.28, Math.min(1, 0.25 + left * 0.03, 1 - (clock - game.waveStart) * 0.006));
        game.beatTimer = game.beatGap;
        game.beatHi = !game.beatHi;
        sfx.beat(game.beatHi);
      }
    }

    if (game.state === 'play' && !game.rocks.length && !game.ufo) {
      if (game.waveTimer <= 0) { game.waveTimer = 2.2; showBanner(t.cleared(game.wave), 1100); addScore(0); }
      game.waveTimer -= dt;
      if (game.waveTimer <= 0.0001) { game.wave += 1; updateHud(); spawnWave(); game.waveTimer = 0; showBanner(t.waveUp(game.wave)); }
    }
    if (game.state === 'ending') { game.endTimer -= dt; if (game.endTimer <= 0) endGame(false); }
  }

  function endGame(timeUp) {
    game.state = 'over';
    running = false;
    els.pause.hidden = true;
    const isBest = game.score > game.best;
    if (isBest) store.set(bestKey(), game.score);
    els.overTitle.textContent = timeUp ? t.timeUp : t.over;
    els.final.textContent = t.final(game.score, game.wave);
    els.newBest.hidden = !isBest || game.score === 0;
    els.over.hidden = false;
    updateHud();
    els.announcer.textContent = `${els.overTitle.textContent} ${els.final.textContent}`;
    setTimeout(() => $('again').focus({ preventScroll: true }), 50);
  }

  function setPaused(p) {
    if (!game || game.state === 'over') return;
    if (p === !running) return;
    running = !p;
    els.paused.hidden = !p;
    for (const k in input) input[k] = false;
    if (p) $('resume').focus({ preventScroll: true }); else canvas.focus({ preventScroll: true });
  }

  // ---- Rendering ----
  function drawWrapped(o, r, fn) {
    // Draw an object up to 4 times so it shows seamlessly across screen edges.
    const xs = [o.x], ys = [o.y];
    if (o.x < r) xs.push(o.x + W); else if (o.x > W - r) xs.push(o.x - W);
    if (o.y < r) ys.push(o.y + H); else if (o.y > H - r) ys.push(o.y - H);
    for (const x of xs) for (const y of ys) fn(x, y);
  }

  function glow(color, blur) { ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = blur; }

  function drawShipShape(x, y, a, sz, flame) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(sz, sz);
    ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-10, -9); ctx.lineTo(-6, 0); ctx.lineTo(-10, 9); ctx.closePath(); ctx.stroke();
    if (flame) {
      ctx.strokeStyle = '#ffb547'; ctx.shadowColor = '#ffb547';
      ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(-14 - Math.random() * 8, 0); ctx.lineTo(-7, 4); ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    for (const st of stars) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(clock * 1.5 + st.phase);
      ctx.fillStyle = '#cfe6ff';
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
    ctx.globalAlpha = 1;
    if (!game) { drawAttract(); return; }
    ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    for (const r of game.rocks) {
      glow(`hsl(${r.hue} 100% 66%)`, 10);
      drawWrapped(r, r.r * 1.15, (x, y) => {
        ctx.beginPath();
        r.shape.forEach((m, i) => { const ang = r.a + i / r.shape.length * TAU; const px = x + Math.cos(ang) * r.r * m, py = y + Math.sin(ang) * r.r * m; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
        ctx.closePath(); ctx.stroke();
      });
    }

    const u = game.ufo;
    if (u) {
      glow('#7dff6a', 12);
      const k = u.r / 20;
      ctx.beginPath();
      ctx.moveTo(u.x - 20 * k, u.y); ctx.lineTo(u.x - 9 * k, u.y - 6 * k); ctx.lineTo(u.x + 9 * k, u.y - 6 * k); ctx.lineTo(u.x + 20 * k, u.y);
      ctx.lineTo(u.x + 9 * k, u.y + 7 * k); ctx.lineTo(u.x - 9 * k, u.y + 7 * k); ctx.closePath();
      ctx.moveTo(u.x - 20 * k, u.y); ctx.lineTo(u.x + 20 * k, u.y);
      ctx.moveTo(u.x - 6 * k, u.y - 6 * k); ctx.lineTo(u.x - 4 * k, u.y - 12 * k); ctx.lineTo(u.x + 4 * k, u.y - 12 * k); ctx.lineTo(u.x + 6 * k, u.y - 6 * k);
      ctx.stroke();
    }

    ctx.shadowBlur = 8;
    ctx.fillStyle = ctx.shadowColor = '#ffffff';
    for (const b of game.bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 2.2, 0, TAU); ctx.fill(); }
    ctx.fillStyle = ctx.shadowColor = '#7dff6a';
    for (const b of game.ufoShots) { ctx.beginPath(); ctx.arc(b.x, b.y, 2.6, 0, TAU); ctx.fill(); }

    const s = game.ship;
    if (s.alive && s.hyper <= 0 && game.state !== 'over') {
      const blink = s.invuln > 0 && Math.floor(clock * 10) % 2 === 0;
      glow('#4ff0ff', 12);
      ctx.globalAlpha = blink ? 0.35 : 1;
      drawWrapped(s, 18, (x, y) => drawShipShape(x, y, s.a, 1, input.thrust && game.state === 'play'));
      ctx.globalAlpha = 1;
    }
    glow('#ffb547', 8);
    for (const d of game.debris) {
      ctx.globalAlpha = Math.min(1, d.life);
      ctx.beginPath(); ctx.moveTo(d.x - Math.cos(d.a) * d.len / 2, d.y - Math.sin(d.a) * d.len / 2); ctx.lineTo(d.x + Math.cos(d.a) * d.len / 2, d.y + Math.sin(d.a) * d.len / 2); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    for (const p of game.particles) { ctx.globalAlpha = Math.min(1, p.life / 0.5); ctx.fillStyle = p.color; ctx.fillRect(p.x - 1, p.y - 1, 2, 2); }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.font = '800 18px ui-rounded, system-ui, sans-serif';
    for (const tx of game.texts) { ctx.globalAlpha = Math.min(1, tx.life); ctx.fillStyle = tx.color; ctx.fillText(tx.text, tx.x, tx.y); }
    ctx.globalAlpha = 1;
  }

  // Menu background: a few rocks drifting by.
  const attract = Array.from({ length: 7 }, () => ({ x: Math.random(), y: Math.random(), vx: rand(-0.02, 0.02), vy: rand(-0.02, 0.02), r: [46, 24, 12][Math.floor(Math.random() * 3)], a: Math.random() * TAU, spin: rand(-0.6, 0.6), shape: Array.from({ length: 10 }, () => rand(0.72, 1.12)), hue: [190, 285, 35][Math.floor(Math.random() * 3)] }));
  function drawAttract() {
    ctx.lineWidth = 2;
    for (const r of attract) {
      glow(`hsl(${r.hue} 100% 66%)`, 10);
      const x = ((r.x + r.vx * clock) % 1 + 1) % 1 * W, y = ((r.y + r.vy * clock) % 1 + 1) % 1 * H, a = r.a + r.spin * clock;
      ctx.beginPath();
      r.shape.forEach((m, i) => { const ang = a + i / r.shape.length * TAU; const px = x + Math.cos(ang) * r.r * m, py = y + Math.sin(ang) * r.r * m; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.closePath(); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  // ---- Loop ----
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (document.hidden) { requestAnimationFrame(frame); return; }
    if (game && running) {
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; if (!running) break; }
    } else { clock += dt; acc = 0; }
    draw();
    requestAnimationFrame(frame);
  }

  // ---- Input ----
  const KEYS = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'thrust', KeyW: 'thrust', Space: 'fire', KeyJ: 'fire', ArrowDown: 'hyper', KeyS: 'hyper', KeyH: 'hyper', ShiftLeft: 'hyper', ShiftRight: 'hyper' };
  addEventListener('keydown', e => {
    if (e.key === 'Escape') return;
    if (game && game.state !== 'over' && e.code === 'KeyP') { e.preventDefault(); setPaused(running); return; }
    const k = KEYS[e.code];
    if (k && game && running) { e.preventDefault(); input[k] = true; return; }
    if ((e.code === 'Enter') && !els.intro.hidden && document.activeElement === document.body) { e.preventDefault(); newGame(); }
  });
  addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) input[k] = false; });
  addEventListener('blur', () => { for (const k in input) input[k] = false; });

  function bindHold(id, key) {
    const el = $(id);
    const on = e => { e.preventDefault(); initAudio(); input[key] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch {} };
    const off = () => { input[key] = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('lostpointercapture', off);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindHold('t-left', 'left'); bindHold('t-right', 'right'); bindHold('t-thrust', 'thrust'); bindHold('t-fire', 'fire'); bindHold('t-hyper', 'hyper');

  // Show on-screen controls for touch devices (or the first time someone touches the screen).
  const coarse = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  let touchUsed = coarse;
  const syncTouch = () => { els.touch.hidden = !touchUsed; $('controls').textContent = touchUsed ? t.touchKeys : t.keys; };
  addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && !touchUsed) { touchUsed = true; syncTouch(); } }, true);

  function bindSeg(id, key) {
    const seg = $(id);
    const sync = () => { for (const b of seg.children) b.setAttribute('aria-pressed', String(b.dataset.v === settings[key])); $('mode-help').textContent = settings.mode === 'time' ? t.helpTime : t.helpClassic; updateHud(); };
    seg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings[key] = b.dataset.v; store.set('settings', settings); sync(); });
    sync();
  }
  bindSeg('seg-mode', 'mode'); bindSeg('seg-diff', 'diff'); bindSeg('seg-auto', 'auto');

  const syncSound = () => { els.sound.textContent = settings.sound ? '🔊' : '🔇'; els.sound.setAttribute('aria-pressed', String(settings.sound)); };
  els.sound.addEventListener('click', () => { settings.sound = !settings.sound; store.set('settings', settings); if (settings.sound) { initAudio(); if (audio) audio.resume().catch(() => {}); } syncSound(); canvas.focus({ preventScroll: true }); });
  els.pause.addEventListener('click', () => setPaused(true));
  $('play').addEventListener('click', newGame);
  $('again').addEventListener('click', newGame);
  $('resume').addEventListener('click', () => setPaused(false));
  const toMenu = () => { game = null; running = false; els.over.hidden = els.paused.hidden = true; els.pause.hidden = true; els.intro.hidden = false; els.timeBox.hidden = true; els.livesBox.hidden = false; els.score.textContent = '0'; els.wave.textContent = '1'; els.lives.textContent = ''; updateHud(); $('play').focus({ preventScroll: true }); };
  $('quit').addEventListener('click', toMenu);
  $('to-menu').addEventListener('click', toMenu);
  document.addEventListener('visibilitychange', () => { if (document.hidden && game && running) setPaused(true); });

  syncTouch(); syncSound(); updateHud();
  new ResizeObserver(resize).observe($('stage'));
  resize();
  requestAnimationFrame(frame);

  if (navigator.webdriver) window.__spaceRocks = {
    state: () => game && { state: game.state, running, mode: game.mode, diff: game.diff, score: game.score, wave: game.wave, lives: game.lives, timeLeft: game.timeLeft, rocks: game.rocks.map(r => ({ size: r.size, x: r.x, y: r.y })), ufo: game.ufo && { small: game.ufo.small }, bullets: game.bullets.length, ship: { x: game.ship.x, y: game.ship.y, a: game.ship.a, alive: game.ship.alive, invuln: game.ship.invuln }, W, H },
    // Test helpers: put the nearest rock right in front of the ship, or force a crash / saucer.
    placeRockAhead() { const s = game.ship, r = game.rocks[0]; if (!r) return false; r.x = s.x + Math.cos(s.a) * 90; r.y = s.y + Math.sin(s.a) * 90; r.vx = r.vy = 0; return true; },
    crash() { game.ship.invuln = 0; killShip(); },
    spawnUfo() { spawnUfo(); },
    clearRocks() { game.rocks = []; },
  };
})();
</script>
</body>
</html>
