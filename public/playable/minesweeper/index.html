<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minesweeper</title>
<style>
:root {
  --bg: #1d3427;
  --bg-2: #2a4a37;
  --text: #f7f3e6;
  --muted: #b9cbbd;
  --accent: #ffcf4d;
  --accent-dark: #d9a520;
  --grass: #8fd16a;
  --grass-2: #83c75e;
  --soil: #f3e3c4;
  --soil-2: #e9d6b1;
  --danger: #ef5a4c;
  --paper: #fffaf0;
  --ink: #2a3a2f;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background-color: var(--bg);
  background-image: radial-gradient(ellipse at top, var(--bg-2), transparent 70%), radial-gradient(#ffffff0a 1.5px, transparent 2px);
  background-size: 100% 100%, 22px 22px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 1000px; margin: auto; display: flex; flex-direction: column; gap: 10px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.narrow { width: 100%; max-width: 520px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 8px; }
h1 { font-size: clamp(22px, 6.6vw, 30px); font-weight: 900; letter-spacing: -.03em; line-height: 1; }
h1 span { color: var(--accent); }
.chip { padding: 4px 10px; border-radius: 99px; background: #ffffff1f; color: var(--accent); font-size: 12px; font-weight: 800; white-space: nowrap; }
.chip:empty { display: none; }
.spacer { flex: 1; }
.new { flex-shrink: 0; padding: 9px 13px; border-radius: 12px; background: var(--accent); color: #2a2208; font-size: 14px; font-weight: 800; box-shadow: 0 3px 0 var(--accent-dark); }
.new:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }

.hud { display: flex; gap: 8px; align-items: stretch; }
.stat { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 14px; background: #00000033; text-align: center; }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat strong { display: block; font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.25; }
.face { flex: 0 0 auto; width: 54px; border-radius: 14px; background: var(--paper); font-size: 26px; line-height: 1; box-shadow: 0 3px 0 #c9bb98; }
.face:active { transform: translateY(2px); box-shadow: 0 1px 0 #c9bb98; }

.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
.board { --cell: 32px; display: grid; grid-template-columns: repeat(var(--vc), var(--cell)); grid-template-rows: repeat(var(--vr), var(--cell)); border-radius: 12px; overflow: hidden; touch-action: none; box-shadow: 0 0 0 4px #2f553f, 0 16px 34px #0007; }
.cell { position: relative; display: grid; place-items: center; width: var(--cell); height: var(--cell); padding: 0; font-size: calc(var(--cell) * .56); font-weight: 900; line-height: 1; background: var(--grass); }
.cell.alt { background: var(--grass-2); }
.cell.hidden:hover { filter: brightness(1.08); }
.cell.open { background: var(--soil); cursor: default; }
.cell.open.alt { background: var(--soil-2); }
.cell.open.n1, .cell.open.n2, .cell.open.n3, .cell.open.n4, .cell.open.n5, .cell.open.n6, .cell.open.n7, .cell.open.n8 { cursor: pointer; }
.cell:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
.cell.reveal { animation: dig .22s ease-out; }
@keyframes dig { from { transform: scale(.6); opacity: .4; } }
.n1 { color: #1f6fd1; } .n2 { color: #2e8b3e; } .n3 { color: #d93a32; } .n4 { color: #7a3fb0; }
.n5 { color: #d97a00; } .n6 { color: #0f8f99; } .n7 { color: #3a3a3a; } .n8 { color: #8a8a8a; }
.cell .icon { font-size: calc(var(--cell) * .58); line-height: 1; }
.cell.flag .icon { animation: plant .2s ease-out; }
@keyframes plant { from { transform: translateY(-40%) scale(1.3); opacity: 0; } }
.cell.mine { background: #f5c6bd; }
.cell.mine.alt { background: #efb9ae; }
.cell.mine .icon { animation: pop .3s var(--delay, 0ms) both; }
@keyframes pop { from { transform: scale(0); } 60% { transform: scale(1.25); } }
.cell.boom { background: var(--danger) !important; }
.cell.wrongflag::after { content: ''; position: absolute; inset: 18%; background: linear-gradient(45deg, transparent 44%, var(--danger) 44% 56%, transparent 56%), linear-gradient(-45deg, transparent 44%, var(--danger) 44% 56%, transparent 56%); }
.cell.press { filter: brightness(1.2); }
.board.lost { animation: quake .4s; }
@keyframes quake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, -1px); } 80% { transform: translate(2px, 1px); } }

.controls { display: flex; align-items: center; gap: 10px; }
.mode { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: #00000033; }
.mode button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 8px; border-radius: 12px; font-size: 15px; font-weight: 800; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 #c9bb98; }
.mode .ico { font-size: 18px; }
.tip { text-align: center; font-size: 12px; line-height: 1.35; color: var(--muted); }
@media (max-height: 720px) { .tip { display: none; } .app { gap: 8px; } }

.overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); background: #0c1a1199; overflow: auto; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 380px); background: var(--paper); color: var(--ink); border-radius: 26px; padding: 24px 20px; text-align: center; box-shadow: 0 20px 50px #0006; animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.panel h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
.panel h2 span { color: #4f9b35; }
.panel .emoji { font-size: 44px; line-height: 1.2; }
.panel p { margin-top: 8px; color: #6b6a5c; font-size: 15px; line-height: 1.4; }
.panel .result { color: var(--ink); font-size: 18px; font-weight: 800; }
.levels { margin-top: 18px; display: grid; gap: 10px; }
.level { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #eef5e4; border: 2px solid transparent; text-align: left; }
.level .ico { font-size: 26px; }
.level strong { display: block; font-size: 17px; font-weight: 900; color: #2e6b1f; }
.level small { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; color: #6b6a5c; }
.level em { font-style: normal; font-size: 12px; font-weight: 800; color: #6b6a5c; font-variant-numeric: tabular-nums; text-align: right; }
.level:hover { border-color: #b9dca2; }
.level.current { border-color: #4f9b35; }
.badge { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 99px; background: #f2a93b; color: #fff; font-size: 14px; font-weight: 800; }
.badge[hidden] { display: none; }
.cta { margin-top: 20px; width: 100%; padding: 15px; border-radius: 16px; background: #4f9b35; color: #fff; font-size: 18px; font-weight: 800; box-shadow: 0 5px 0 #367322; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #367322; }
.secondary { margin-top: 10px; width: 100%; padding: 12px; border-radius: 14px; border: 2px solid #dcd3bb; color: #2e6b1f; font-weight: 800; }
.secondary[hidden] { display: none; }
.panel .keys { margin-top: 14px; font-size: 12px; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="top narrow">
    <h1>Mine<span>sweeper</span></h1>
    <span class="chip" id="chip"></span>
    <span class="spacer"></span>
    <button type="button" class="new" id="new" data-i18n="newGame"></button>
  </div>
  <div class="hud narrow">
    <div class="stat"><small data-i18n="mines"></small><strong id="mines">0</strong></div>
    <div class="stat"><small data-i18n="time"></small><strong id="time">0:00</strong></div>
    <button type="button" class="face" id="face" data-i18n-label="restart"><span aria-hidden="true" id="face-icon">🙂</span></button>
    <div class="stat"><small data-i18n="best"></small><strong id="best">—</strong></div>
  </div>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board" role="grid" data-i18n-label="board"></div>
  </div>
  <div class="controls narrow">
    <div class="mode" role="group" data-i18n-label="mode">
      <button type="button" id="mode-dig" aria-pressed="true"><span class="ico" aria-hidden="true">⛏️</span><span data-i18n="dig"></span></button>
      <button type="button" id="mode-flag" aria-pressed="false"><span class="ico" aria-hidden="true">🚩</span><span data-i18n="flag"></span></button>
    </div>
  </div>
  <p class="tip narrow" data-i18n="hint"></p>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</main>

<div class="overlay" id="start" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <p class="emoji" aria-hidden="true">💣</p>
    <h2 id="start-title">Mine<span>sweeper</span></h2>
    <p data-i18n="tagline"></p>
    <div class="levels" id="levels" role="group" data-i18n-label="choose"></div>
    <button type="button" class="secondary" id="back" data-i18n="back" hidden></button>
    <p class="keys"><span data-i18n="hint"></span><br><span data-i18n="keys"></span></p>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="emoji" aria-hidden="true">🎉</p>
    <h2 id="win-title" data-i18n="won"></h2>
    <p class="result" id="win-result"></p>
    <p class="badge" id="new-best" data-i18n="newBest" hidden></p>
    <button type="button" class="cta" id="again" data-i18n="again"></button>
    <button type="button" class="secondary" id="win-change" data-i18n="change"></button>
  </div>
</div>

<div class="overlay" id="lost" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="lost-title">
    <p class="emoji" aria-hidden="true">💥</p>
    <h2 id="lost-title" data-i18n="lost"></h2>
    <p data-i18n="lostText"></p>
    <button type="button" class="cta" id="retry" data-i18n="retry"></button>
    <button type="button" class="secondary" id="lost-change" data-i18n="change"></button>
    <button type="button" class="secondary" id="review" data-i18n="review"></button>
  </div>
</div>

    ko: { tagline: '지뢰를 하나도 밟지 않고 지뢰밭을 모두 열어 보세요.', newGame: '새 게임', mines: '지뢰', time: '시간', best: '최고', dig: '파기', flag: '깃발', mode: '탭 동작', hint: '길게 누르거나 우클릭으로 깃발 · 숫자를 탭하면 주변 칸이 열려요', board: '지뢰밭', levels: { easy: '쉬움', medium: '보통', hard: '어려움' }, size: (c, r, m) => `${c}×${r} · 지뢰 ${m}개`, choose: '난이도를 선택하세요', keys: '키: 방향키 이동 · Space/Enter 파기 · F 깃발', back: '게임으로 돌아가기', won: '지뢰밭 클리어!', result: (level, time) => `${level} · ${time}`, newBest: '최고 기록!', again: '다시 하기', change: '난이도 변경', lost: '쾅!', lostText: '지뢰를 밟았어요. 모든 지뢰 위치를 보여 드릴게요.', retry: '다시 도전', review: '보드 보기', cell: (r, c) => `${r}행 ${c}열`, covered: '닫힘', flagged: '깃발', empty: '빈칸', near: n => `주변 지뢰 ${n}개`, mine: '지뢰', wrongFlag: '잘못된 깃발', bestTime: s => `최고 ${s}`, noBest: '기록 없음', restart: '다시 시작', flagsLeft: n => `지뢰 ${n}개 남음`, flagMode: '깃발 모드', digMode: '파기 모드' },
  };
  const requested = new URLSearchParams(location.search).get('lang');
  const lang = I18N[requested] ? requested : 'en';
  const t = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t[el.dataset.i18n];
  for (const el of document.querySelectorAll('[data-i18n-label]')) el.setAttribute('aria-label', t[el.dataset.i18nLabel]);

  // Sizes are portrait (cols × rows); the board turns sideways when that gives bigger cells.
  const LEVELS = {
    easy: { cols: 9, rows: 9, mines: 10, icon: '🌱' },
    medium: { cols: 10, rows: 14, mines: 24, icon: '🌿' },
    hard: { cols: 12, rows: 18, mines: 40, icon: '🌳' },
  };
  const STORAGE_KEY = 'milaan.minesweeper.best';
  const LONG_PRESS_MS = 380;
  const MAX_CELL = 60;
  const HIDDEN = 0, OPEN = 1, FLAG = 2;

  const $ = id => document.getElementById(id);
  const els = { wrap: $('wrap'), board: $('board'), chip: $('chip'), mines: $('mines'), time: $('time'), best: $('best'), faceIcon: $('face-icon'), dig: $('mode-dig'), flag: $('mode-flag'), levels: $('levels'), back: $('back'), winResult: $('win-result'), newBest: $('new-best'), announcer: $('announcer') };
  const overlays = { start: $('start'), win: $('win'), lost: $('lost') };

  const readBest = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } };
  const writeBest = value => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); } catch {} };
  const formatTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const announce = text => { els.announcer.textContent = text; };
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

  let game = null;
  let modal = null;
  let lastLevel = 'easy';
  let flagMode = false;
  let rotated = false;
  let cellEls = [];

  const rc = i => [Math.floor(i / game.cols), i % game.cols];
  function neighbours(i) {
    const [r, c] = rc(i), list = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if ((dr || dc) && nr >= 0 && nr < game.rows && nc >= 0 && nc < game.cols) list.push(nr * game.cols + nc);
    }
    return list;
  }
  // Visual row/column, which swap when the board is drawn sideways.
  const visual = i => { const [r, c] = rc(i); return rotated ? [c, r] : [r, c]; };
  const fromVisual = (vr, vc) => (rotated ? vc * game.cols + vr : vr * game.cols + vc);

  function newGame(level) {
    lastLevel = level;
    const { cols, rows, mines } = LEVELS[level];
    const total = cols * rows;
    game = { level, cols, rows, mines, total, mine: new Uint8Array(total), adj: new Uint8Array(total), state: new Uint8Array(total), status: 'ready', opened: 0, flags: 0, elapsed: 0, cursor: Math.floor(rows / 2) * cols + Math.floor(cols / 2), exploded: -1 };
    els.board.className = 'board';
    els.board.replaceChildren();
    cellEls = [];
    for (let i = 0; i < total; i++) {
      const el = document.createElement('button');
      el.type = 'button';
      el.setAttribute('role', 'gridcell');
      el.tabIndex = -1;
      el.dataset.i = i;
      cellEls.push(el);
      els.board.append(el);
    }
    els.chip.textContent = t.levels[level];
    els.time.textContent = '0:00';
    hideOverlays();
    layout(true);
    render();
    cellEls[game.cursor].focus({ preventScroll: true });
  }

  function placeMines(safe) {
    const keepClear = new Set([safe, ...neighbours(safe)]);
    const spots = [];
    for (let i = 0; i < game.total; i++) if (!keepClear.has(i)) spots.push(i);
    for (let k = 0; k < game.mines; k++) {
      const j = k + Math.floor(Math.random() * (spots.length - k));
      [spots[k], spots[j]] = [spots[j], spots[k]];
      game.mine[spots[k]] = 1;
    }
    for (let i = 0; i < game.total; i++) game.adj[i] = neighbours(i).reduce((n, j) => n + game.mine[j], 0);
  }

  function layout(force) {
    if (!game) return;
    const box = els.wrap.getBoundingClientRect();
    const upright = Math.min(box.width / game.cols, box.height / game.rows);
    const sideways = Math.min(box.width / game.rows, box.height / game.cols);
    // Small margin so the board does not flip back and forth around a square frame.
    const nextRotated = game.cols !== game.rows && sideways > upright * 1.08;
    const changed = nextRotated !== rotated;
    rotated = nextRotated;
    const [vc, vr] = rotated ? [game.rows, game.cols] : [game.cols, game.rows];
    const cell = Math.max(14, Math.floor(Math.min(MAX_CELL, rotated ? sideways : upright)));
    els.board.style.setProperty('--vc', vc);
    els.board.style.setProperty('--vr', vr);
    els.board.style.setProperty('--cell', `${cell}px`);
    if (changed || force) {
      cellEls.forEach((el, i) => { const [r, c] = visual(i); el.style.gridRow = r + 1; el.style.gridColumn = c + 1; });
      if (!force) render();
    }
  }

  function cellLabel(i) {
    const [r, c] = visual(i);
    const s = game.state[i];
    let text;
    if (game.status === 'lost' && game.mine[i] && s !== FLAG) text = t.mine;
    else if (game.status === 'lost' && s === FLAG && !game.mine[i]) text = t.wrongFlag;
    else if (s === FLAG) text = t.flagged;
    else if (s === HIDDEN) text = t.covered;
    else text = game.adj[i] ? t.near(game.adj[i]) : t.empty;
    return `${t.cell(r + 1, c + 1)}: ${text}`;
  }

  function render(fresh = []) {
    const lost = game.status === 'lost';
    const freshSet = new Set(fresh);
    const [er, ec] = game.exploded >= 0 ? visual(game.exploded) : [0, 0];
    for (let i = 0; i < game.total; i++) {
      const el = cellEls[i];
      const s = game.state[i];
      const [r, c] = rc(i);
      let cls = `cell${(r + c) % 2 ? ' alt' : ''}`;
      let html = '';
      if (s === OPEN) {
        cls += ` open${game.adj[i] ? ` n${game.adj[i]}` : ''}${freshSet.has(i) && !reducedMotion.matches ? ' reveal' : ''}`;
        if (game.adj[i]) html = String(game.adj[i]);
      } else if (lost && game.mine[i] && s !== FLAG) {
        cls += ` mine${i === game.exploded ? ' boom' : ''}`;
        const [vr, vc] = visual(i);
        el.style.setProperty('--delay', `${Math.round(Math.hypot(vr - er, vc - ec) * 45)}ms`);
        html = '<span class="icon">💣</span>';
      } else if (s === FLAG) {
        cls += ` hidden flag${lost && !game.mine[i] ? ' wrongflag' : ''}`;
        html = '<span class="icon">🚩</span>';
      } else cls += ' hidden';
      if (el.className !== cls) el.className = cls;
      if (el.innerHTML !== html) el.innerHTML = html;
      el.setAttribute('aria-label', cellLabel(i));
      el.tabIndex = i === game.cursor ? 0 : -1;
    }
    els.mines.textContent = String(game.mines - game.flags);
    els.faceIcon.textContent = game.status === 'won' ? '😎' : lost ? '😵' : '🙂';
    const best = readBest()[game.level];
    els.best.textContent = best ? formatTime(best) : '—';
  }

  // Opens a cell and, for blank cells, the whole connected blank region and its border.
  function flood(start) {
    const opened = [];
    const stack = [start];
    while (stack.length) {
      const i = stack.pop();
      if (game.state[i] !== HIDDEN) continue;
      game.state[i] = OPEN;
      game.opened++;
      opened.push(i);
      if (!game.adj[i]) for (const j of neighbours(i)) if (game.state[j] === HIDDEN) stack.push(j);
    }
    return opened;
  }

  function reveal(i) {
    if (!['ready', 'play'].includes(game.status) || game.state[i] !== HIDDEN) return;
    if (game.status === 'ready') {
      placeMines(i);
      game.status = 'play';
      startClock();
    }
    if (game.mine[i]) return lose(i);
    const opened = flood(i);
    render(opened);
    if (!checkWin() && opened.length > 1) announce(t.flagsLeft(game.mines - game.flags));
  }

  function chord(i) {
    if (game.status !== 'play' || game.state[i] !== OPEN || !game.adj[i]) return;
    const around = neighbours(i);
    const flagged = around.filter(j => game.state[j] === FLAG).length;
    const covered = around.filter(j => game.state[j] === HIDDEN);
    if (!covered.length) return;
    if (flagged !== game.adj[i]) {
      // Not enough flags yet: briefly light up the covered neighbours as a nudge.
      covered.forEach(j => cellEls[j].classList.add('press'));
      setTimeout(() => covered.forEach(j => cellEls[j].classList.remove('press')), 160);
      return;
    }
    const hit = covered.find(j => game.mine[j]);
    if (hit !== undefined) return lose(hit);
    const opened = covered.flatMap(j => flood(j));
    render(opened);
    checkWin();
  }

  function toggleFlag(i) {
    if (!['ready', 'play'].includes(game.status) || game.state[i] === OPEN) return;
    const flagging = game.state[i] === HIDDEN;
    game.state[i] = flagging ? FLAG : HIDDEN;
    game.flags += flagging ? 1 : -1;
    render();
    announce(`${cellLabel(i)}. ${t.flagsLeft(game.mines - game.flags)}`);
  }

  function tap(i) {
    if (modal || !game) return;
    game.cursor = i;
    if (game.state[i] === OPEN) chord(i);
    else if (flagMode) toggleFlag(i);
    else reveal(i);
  }

  function checkWin() {
    if (game.opened !== game.total - game.mines) return false;
    game.status = 'won';
    for (let i = 0; i < game.total; i++) if (game.mine[i]) game.state[i] = FLAG;
    game.flags = game.mines;
    const all = readBest();
    const isBest = !all[game.level] || game.elapsed < all[game.level];
    if (isBest) { all[game.level] = Math.round(game.elapsed); writeBest(all); }
    render();
    els.time.textContent = formatTime(game.elapsed);
    els.winResult.textContent = t.result(t.levels[game.level], formatTime(game.elapsed));
    els.newBest.hidden = !isBest;
    announce(`${t.won} ${els.winResult.textContent}`);
    setTimeout(() => showOverlay('win', $('again')), 700);
    return true;
  }

  function lose(i) {
    game.status = 'lost';
    game.exploded = i;
    render();
    els.board.classList.add('lost');
    announce(`${t.lost} ${t.lostText}`);
    setTimeout(() => showOverlay('lost', $('retry')), reducedMotion.matches ? 500 : 1300);
  }

  // The clock runs on animation frames with a clamped step, so a hidden tab never adds time.
  let lastFrame = 0, frameId = 0;
  function startClock() {
    cancelAnimationFrame(frameId);
    lastFrame = performance.now();
    const tick = now => {
      const dt = Math.min(50, now - lastFrame);
      lastFrame = now;
      if (game.status !== 'play') return;
      if (!modal && !document.hidden) {
        const before = Math.floor(game.elapsed / 1000);
        game.elapsed += dt;
        if (Math.floor(game.elapsed / 1000) !== before) els.time.textContent = formatTime(game.elapsed);
      }
      frameId = requestAnimationFrame(tick);
    };
    frameId = requestAnimationFrame(tick);
  }

  function showOverlay(name, focusEl) {
    for (const [key, el] of Object.entries(overlays)) el.hidden = key !== name;
    modal = name;
    if (focusEl) setTimeout(() => focusEl.focus({ preventScroll: true }), 30);
  }

  function hideOverlays() {
    for (const el of Object.values(overlays)) el.hidden = true;
    modal = null;
  }

  function openStart() {
    lastLevel = game?.level || lastLevel;
    const best = readBest();
    els.levels.replaceChildren();
    for (const [level, cfg] of Object.entries(LEVELS)) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `level${level === lastLevel ? ' current' : ''}`;
      btn.innerHTML = '<span class="ico" aria-hidden="true"></span><span><strong></strong><small></small></span><em></em>';
      btn.querySelector('.ico').textContent = cfg.icon;
      btn.querySelector('strong').textContent = t.levels[level];
      btn.querySelector('small').textContent = t.size(cfg.cols, cfg.rows, cfg.mines);
      btn.querySelector('em').textContent = best[level] ? t.bestTime(formatTime(best[level])) : t.noBest;
      btn.dataset.level = level;
      btn.addEventListener('click', () => newGame(level));
      els.levels.append(btn);
    }
    els.back.hidden = !(game && game.status === 'play');
    showOverlay('start', els.levels.querySelector('.current'));
  }

  function setFlagMode(on) {
    flagMode = on;
    els.dig.setAttribute('aria-pressed', String(!on));
    els.flag.setAttribute('aria-pressed', String(on));
    announce(on ? t.flagMode : t.digMode);
  }

  function focusCell(i) {
    game.cursor = i;
    for (const el of cellEls) el.tabIndex = -1;
    cellEls[i].tabIndex = 0;
    cellEls[i].focus({ preventScroll: true });
  }

  // Pointer handling: tap = current mode, long-press (touch/pen) or right-click = flag.
  let press = null;
  let suppressClick = false;
  let lastPointer = 'mouse';
  const cellIndex = target => { const el = target.closest?.('.cell'); return el ? Number(el.dataset.i) : -1; };

  els.board.addEventListener('pointerdown', event => {
    lastPointer = event.pointerType;
    suppressClick = false;
    const i = cellIndex(event.target);
    if (i < 0 || event.pointerType === 'mouse') return;
    clearTimeout(press?.timer);
    press = { i, x: event.clientX, y: event.clientY, timer: setTimeout(() => {
      suppressClick = true;
      press = null;
      game.cursor = i;
      if (game.state[i] !== OPEN) { toggleFlag(i); try { navigator.vibrate?.(15); } catch {} }
    }, LONG_PRESS_MS) };
  });
  const cancelPress = () => { clearTimeout(press?.timer); press = null; };
  els.board.addEventListener('pointermove', event => { if (press && Math.hypot(event.clientX - press.x, event.clientY - press.y) > 10) cancelPress(); });
  els.board.addEventListener('pointerup', cancelPress);
  els.board.addEventListener('pointercancel', cancelPress);
  els.board.addEventListener('click', event => {
    const i = cellIndex(event.target);
    // detail 0 means the click came from the keyboard, which the keydown handler already covers.
    if (i < 0 || event.detail === 0) return;
    if (suppressClick) { suppressClick = false; return; }
    tap(i);
  });
  els.board.addEventListener('contextmenu', event => {
    event.preventDefault();
    const i = cellIndex(event.target);
    if (i < 0 || lastPointer !== 'mouse' || modal) return;
    game.cursor = i;
    toggleFlag(i);
  });

  const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  document.addEventListener('keydown', event => {
    if (!game || modal || event.altKey || event.ctrlKey || event.metaKey) return;
    const inBoard = els.board.contains(document.activeElement);
    const key = event.key;
    if (ARROWS[key]) {
      event.preventDefault();
      if (!inBoard) return focusCell(game.cursor);
      const [vr, vc] = visual(game.cursor);
      const [maxR, maxC] = rotated ? [game.cols, game.rows] : [game.rows, game.cols];
      const nr = Math.max(0, Math.min(maxR - 1, vr + ARROWS[key][0]));
      const nc = Math.max(0, Math.min(maxC - 1, vc + ARROWS[key][1]));
      focusCell(fromVisual(nr, nc));
    } else if (inBoard && (key === ' ' || key === 'Enter')) {
      event.preventDefault();
      const i = game.cursor;
      if (game.state[i] === OPEN) chord(i); else reveal(i);
    } else if (inBoard && (key === 'f' || key === 'F')) {
      event.preventDefault();
      toggleFlag(game.cursor);
    }
  });
  els.board.addEventListener('focusin', event => { const i = cellIndex(event.target); if (i >= 0) game.cursor = i; });

  $('new').addEventListener('click', openStart);
  $('face').addEventListener('click', () => newGame(game?.level || lastLevel));
  els.dig.addEventListener('click', () => setFlagMode(false));
  els.flag.addEventListener('click', () => setFlagMode(true));
  els.back.addEventListener('click', () => { hideOverlays(); focusCell(game.cursor); });
  $('again').addEventListener('click', () => newGame(game.level));
  $('retry').addEventListener('click', () => newGame(game.level));
  $('win-change').addEventListener('click', openStart);
  $('lost-change').addEventListener('click', openStart);
  $('review').addEventListener('click', () => { hideOverlays(); $('face').focus({ preventScroll: true }); });

  new ResizeObserver(() => layout(false)).observe(els.wrap);
  newGame(lastLevel);
  openStart();
})();
</script>
