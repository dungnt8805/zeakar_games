<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moto Stunts</title>
<style>
:root {
  --bg: #1b1410;
  --ink: #2a1a12;
  --muted: #7a6152;
  --paper: #fff4e6;
  --paper-2: #ffe0b8;
  --orange: #ff7a1a;
  --orange-dark: #c4520a;
  --teal: #19c2b0;
  --teal-dark: #0e8a7d;
  --gold: #ffc93c;
  --hud: #1b1410cc;
  --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--paper); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app { position: fixed; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.view { position: relative; min-height: 0; overflow: hidden; background: #000; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#game:focus-visible { outline: none; }

.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); pointer-events: none; }
.app.menu .hud { visibility: hidden; }
.chip { display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff22; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.lvl { color: var(--gold); }
.chip.bonus { color: var(--teal); }
.chip.bonus:empty { display: none; }
.hud .grow { flex: 1; }
.hbtn { pointer-events: auto; width: 40px; height: 34px; border-radius: 10px; background: var(--hud); box-shadow: inset 0 0 0 2px #ffffff22; display: grid; place-items: center; }
.hbtn svg { width: 15px; height: 15px; fill: #fff; }
.banner { position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%); max-width: calc(100% - 24px); padding: 6px 16px; border-radius: 12px; background: #1b1410cc; font-size: clamp(16px, 4.6vmin, 30px); font-weight: 900; text-align: center; color: var(--gold); text-shadow: 0 3px 0 #000; pointer-events: none; opacity: 0; white-space: nowrap; }
.banner.show { animation: banner 1.6s ease-out both; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.9); } 12%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%); } }
.hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 14px; border-radius: 10px; background: var(--hud); font-size: 14px; font-weight: 800; white-space: nowrap; pointer-events: none; }
.hint[hidden] { display: none; }

.pad { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: linear-gradient(#2e2018, #1b1410); box-shadow: inset 0 3px 0 #3d2b20; touch-action: none; }
.app.menu .pad { display: none; }
.grp { display: flex; gap: 10px; touch-action: none; }
.key { width: clamp(60px, 20vw, 92px); height: clamp(56px, 11vh, 80px); border-radius: 16px; background: #3d2b20; box-shadow: inset 0 0 0 2px #ffffff22, 0 5px 0 #0c0806; color: #fff; display: grid; place-items: center; touch-action: none; }
.key svg { width: 46%; height: 46%; fill: currentColor; pointer-events: none; }
.key.gas { background: var(--orange); box-shadow: inset 0 0 0 2px #ffffff40, 0 5px 0 var(--orange-dark); }
.key.on { transform: translateY(4px); box-shadow: inset 0 0 0 2px #ffffff40, 0 1px 0 #0c0806; filter: brightness(1.15); }

.overlay { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: #120c0899; }
.overlay[hidden] { display: none; }
.panel { width: min(100%, 400px); max-height: calc(100% - 16px); overflow: auto; overscroll-behavior: contain; padding: 20px 18px 18px; border-radius: 16px; background: var(--paper); color: var(--ink); text-align: center; border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink), 0 22px 50px #0008; animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.logo { font-size: clamp(34px, 10.5vw, 54px); font-weight: 900; line-height: .95; color: var(--orange); text-transform: uppercase; font-style: italic; text-shadow: 3px 3px 0 var(--ink); }
.logo span { display: block; color: var(--teal); }
.mascot { display: block; width: 120px; height: 70px; margin: 0 auto 6px; }
.tag { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.45; color: var(--muted); }
.total { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 12px; border-radius: 8px; background: var(--ink); color: var(--gold); font-size: 14px; font-weight: 900; }
.total:empty { display: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { flex: 1 1 130px; min-height: 46px; padding: 10px 12px; border-radius: 12px; background: var(--paper-2); color: var(--ink); font-size: 16px; font-weight: 900; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn.primary { background: var(--orange); color: #fff; text-shadow: 0 2px 0 #0004; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.help { margin-top: 12px; font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; margin-top: 12px; padding: 4px 12px; border-radius: 8px; background: #f2dcc0; color: var(--ink); font-size: 13px; font-weight: 800; }
.toggle b { padding: 1px 8px; border-radius: 6px; background: #d9bc98; font-size: 12px; }
.toggle[aria-pressed="true"] b { background: var(--teal); color: #fff; }
.panel h2 { font-size: 26px; font-weight: 900; line-height: 1.15; }
.panel .sub { margin-top: 4px; font-size: 14px; font-weight: 800; color: var(--muted); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.tab { min-width: 0; min-height: 44px; padding: 4px; border-radius: 10px; border: 3px solid var(--ink); background: #f2dcc0; font-size: 13px; font-weight: 900; line-height: 1.1; }
.tab small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--gold); box-shadow: 0 3px 0 var(--ink); }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-top: 12px; }
.lv { position: relative; min-width: 0; min-height: 58px; padding: 5px 2px; border-radius: 10px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; align-content: center; gap: 2px; }
.lv b { font-size: 18px; font-weight: 900; line-height: 1; }
.lv .st { font-size: 11px; letter-spacing: -1px; color: #d8c6ad; line-height: 1; white-space: nowrap; }
.lv .st i { font-style: normal; color: var(--orange); }
.lv.done { background: #fff1dc; }
.lv:disabled { background: #e6d5bd; box-shadow: 0 2px 0 var(--ink); color: #a08d76; cursor: default; }
.lv:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.stars { display: flex; justify-content: center; gap: 10px; margin-top: 12px; font-size: 38px; line-height: 1; color: #e3cfb3; }
.stars i { font-style: normal; text-shadow: 0 3px 0 #0002; }
.stars i.on { color: var(--gold); text-shadow: 0 3px 0 var(--orange-dark); animation: pop .4s ease-out both; }
.stars i:nth-child(2) { animation-delay: .15s; }
.stars i:nth-child(3) { animation-delay: .3s; }
@keyframes pop { 0% { transform: scale(.2); } 70% { transform: scale(1.25); } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; }
.stats div { min-width: 0; padding: 6px 2px; border-radius: 8px; background: #f7e4ca; }
.stats small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats strong { display: block; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal { margin-top: 10px; font-size: 13px; font-weight: 800; color: var(--muted); }
.badge { display: inline-block; margin-top: 10px; padding: 3px 12px; border-radius: 8px; background: var(--gold); font-size: 13px; font-weight: 900; }
.badge[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (min-aspect-ratio: 1/1) {
  .app { grid-template-rows: minmax(0, 1fr); }
  .pad { position: absolute; left: 0; right: 0; bottom: 0; background: none; box-shadow: none; pointer-events: none; padding-top: 0; }
  .grp { pointer-events: auto; }
  .key { width: clamp(56px, 14vh, 88px); height: clamp(50px, 13vh, 80px); background: #1b14108c; box-shadow: inset 0 0 0 2px #ffffff55, 0 4px 0 #0006; }
  .key.gas { background: #ff7a1aa6; }
  html:not(.touch) .pad { display: none; }
  .levels-panel { width: min(100%, 560px); }
  .hint { bottom: auto; top: 50px; }
}
@media (min-aspect-ratio: 1/1) and (pointer: coarse) { html .pad { display: flex; } }
@media (max-height: 480px) and (min-aspect-ratio: 4/3) {
  .panel { padding: 12px 16px; }
  .logo { font-size: 34px; }
  .mascot { width: 80px; height: 46px; margin-bottom: 2px; }
  .tag { margin-top: 6px; font-size: 13px; }
  .actions { margin-top: 10px; }
  .btn { min-height: 40px; padding: 6px 10px; }
  .help { margin-top: 8px; }
  .panel h2 { font-size: 21px; }
  .lv { min-height: 44px; }
  .grid { gap: 6px; margin-top: 8px; grid-template-columns: repeat(10, 1fr); }
  .levels-panel { width: min(100%, 680px); }
  .stars { font-size: 28px; margin-top: 6px; }
  .stats { margin-top: 8px; }
}
@media (max-height: 360px) { .mascot { display: none; } .tag { display: none; } }
@media (max-width: 340px) { .chip { padding: 0 7px; font-size: 14px; } .hbtn { width: 36px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app menu" id="app">
  <div class="view" id="view">
    <canvas id="game" tabindex="0" role="img" data-i18n-aria="canvas"></canvas>
    <div class="hud">
      <div class="chip lvl" id="hudLevel">1-1</div>
      <div class="chip" id="hudTime">0.00</div>
      <div class="chip bonus" id="hudBonus"></div>
      <div class="grow"></div>
      <button class="hbtn" id="btnRestart" data-i18n-aria="restart"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.4 5h3.1A5 5 0 1 0 12 7v3L7 5.5 12 1z"/></svg></button>
      <button class="hbtn" id="btnPause" data-i18n-aria="pause"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="hint" id="hint" hidden data-i18n="hint"></div>

    <div class="overlay" id="ovTitle">
      <div class="panel">
        <svg class="mascot" viewBox="0 0 120 70" aria-hidden="true">
          <circle cx="26" cy="52" r="15" fill="#2a1a12"/><circle cx="26" cy="52" r="7" fill="#d9bc98"/>
          <circle cx="94" cy="52" r="15" fill="#2a1a12"/><circle cx="94" cy="52" r="7" fill="#d9bc98"/>
          <path d="M26 52 L52 38 L80 36 L94 52" stroke="#2a1a12" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M44 36 Q60 26 82 32 L76 42 L48 44 Z" fill="#ff7a1a" stroke="#2a1a12" stroke-width="3"/>
          <path d="M56 32 L50 14 L66 10" stroke="#19c2b0" stroke-width="8" fill="none" stroke-linecap="round"/>
          <circle cx="54" cy="8" r="8" fill="#ffc93c" stroke="#2a1a12" stroke-width="3"/>
        </svg>
        <div class="logo">Moto<span>Stunts</span></div>
        <p class="tag" data-i18n="tagline"></p>
        <div class="total" id="titleTotal"></div>
        <div class="actions"><button class="btn primary" id="btnPlay" data-i18n="play"></button></div>
        <button class="toggle" id="btnSound" aria-pressed="true"><span data-i18n="sound"></span><b id="soundState"></b></button>
        <p class="help" data-i18n="help"></p>
      </div>
    </div>

    <div class="overlay" id="ovLevels" hidden>
      <div class="panel levels-panel">
        <h2 data-i18n="chooseLevel"></h2>
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="grid" id="grid"></div>
        <div class="actions"><button class="btn" id="btnBackTitle" data-i18n="back"></button></div>
      </div>
    </div>

    <div class="overlay" id="ovPause" hidden>
      <div class="panel">
        <h2 data-i18n="paused"></h2>
        <p class="goal" id="pauseGoal"></p>
        <div class="actions">
          <button class="btn primary" id="btnResume" data-i18n="resume"></button>
          <button class="btn" id="btnPauseRestart" data-i18n="restart"></button>
          <button class="btn" id="btnPauseLevels" data-i18n="levels"></button>
        </div>
        <button class="toggle" id="btnSound2" aria-pressed="true"><span data-i18n="sound"></span><b id="soundState2"></b></button>
      </div>
    </div>

    <div class="overlay" id="ovCrash" hidden>
      <div class="panel">
        <h2 data-i18n="crashed"></h2>
        <p class="sub" id="crashWhy"></p>
        <div class="actions">
          <button class="btn primary" id="btnRetry" data-i18n="retry"></button>
          <button class="btn" id="btnCrashLevels" data-i18n="levels"></button>
        </div>
      </div>
    </div>

    <div class="overlay" id="ovClear" hidden>
      <div class="panel">
        <h2 data-i18n="finished"></h2>
        <div class="stars" id="clearStars"><i>★</i><i>★</i><i>★</i></div>
        <span class="badge" id="clearBest" hidden data-i18n="newBest"></span>
        <div class="stats">
          <div><small data-i18n="time"></small><strong id="clTime"></strong></div>
          <div><small data-i18n="flips"></small><strong id="clFlips"></strong></div>
          <div><small data-i18n="best"></small><strong id="clBestT"></strong></div>
        </div>
        <p class="goal" id="clGoal"></p>
        <div class="actions">
          <button class="btn primary" id="btnNext" data-i18n="next"></button>
          <button class="btn" id="btnClearRetry" data-i18n="retry"></button>
          <button class="btn" id="btnClearLevels" data-i18n="levels"></button>
        </div>
      </div>
    </div>
  </div>
  <div class="pad" id="pad">
    <div class="grp">
      <button class="key" data-k="back" data-i18n-aria="leanBack"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-3a6 6 0 1 1-6-6v3l5-4.5L12 0z" transform="scale(-1 1) translate(-24 0)"/></svg></button>
      <button class="key" data-k="fwd" data-i18n-aria="leanFwd"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-3a6 6 0 1 1-6-6v3l5-4.5L12 0z"/></svg></button>
    </div>
    <div class="grp">
      <button class="key" data-k="brake" data-i18n-aria="brake"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/></svg></button>
      <button class="key gas" data-k="gas" data-i18n-aria="gas"><svg viewBox="0 0 24 24"><path d="M6 3l14 9-14 9z"/></svg></button>
    </div>
  </div>
</div>
<div class="sr-only" aria-live="polite" id="announcer"></div>

    [523, 659, 784, 1046].forEach((f, k) => setTimeout(() => tone(f, 0.18, 'triangle', 0.09), k * 110));
  }
  function crashLevel() {
    mode = 'end'; engineSound(false, 0, false);
    $('crashWhy').textContent = sim.crashed === 'head' ? T.whyHead : sim.crashed === 'boom' ? T.whyBoom : T.whyFall;
    show('ovCrash'); announce(T.sayCrash);
  }
  function banner(text) {
    const b = $('banner'); b.textContent = text; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  }
  function handleEvents() {
    for (const e of sim.events) {
      if (e.type === 'flip') { banner(T.flip(e.n, e.back)); announce(T.flip(e.n, e.back)); tone(880, 0.12, 'triangle', 0.08); setTimeout(() => tone(1320, 0.16, 'triangle', 0.08), 90); }
      else if (e.type === 'crash') { if (e.why !== 'boom') { noise(0.35, 0.25); tone(160, 0.3, 'sawtooth', 0.06, 50); } }
      else if (e.type === 'boom') { noise(0.8, 0.5); tone(90, 0.6, 'sawtooth', 0.1, 30); }
      else if (e.type === 'finish') tone(988, 0.2, 'triangle', 0.08);
    }
  }
  function updateHud() {
    if (!sim) return;
    $('hudTime').textContent = fmt(sim.done ? sim.final : sim.t);
    $('hudBonus').textContent = sim.bonus ? `−${sim.bonus}s` : '';
    if (sim.started) $('hint').hidden = true;
  }
  function readInput() {
    if (autoplay) return autoplay(sim);
    return { gas: keys.gas || touchKeys.gas, brake: keys.brake || touchKeys.brake, back: keys.back || touchKeys.back, fwd: keys.fwd || touchKeys.fwd };
  }

  // ---------- input ----------
  const KEYMAP = { ArrowUp: 'gas', KeyW: 'gas', ArrowDown: 'brake', KeyS: 'brake', ArrowLeft: 'back', KeyA: 'back', ArrowRight: 'fwd', KeyD: 'fwd' };
  addEventListener('keydown', e => {
    const k = KEYMAP[e.code];
    if (k && mode === 'play') { keys[k] = true; e.preventDefault(); return; }
    if (e.code === 'KeyR' && (mode === 'play' || mode === 'pause' || mode === 'end') && sim) { startLevel(levelIdx); e.preventDefault(); }
    else if (e.code === 'KeyP') { if (mode === 'play') pause(); else if (mode === 'pause') resume(); e.preventDefault(); }
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
  addEventListener('blur', () => { Object.keys(keys).forEach(k => { keys[k] = false; touchKeys[k] = false; }); document.querySelectorAll('.key.on').forEach(b => b.classList.remove('on')); });
  document.querySelectorAll('.key').forEach(btn => {
    const k = btn.dataset.k;
    const set = v => { touchKeys[k] = v; btn.classList.toggle('on', v); if (v) audio(); };
    btn.addEventListener('pointerdown', e => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ } set(true); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, () => set(false)));
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { set(true); e.preventDefault(); } });
    btn.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') set(false); });
  });
  // Tapping the canvas halves also drives (left = lean back/forward, right = gas) for mouse players without keys.
  const canvasPtr = new Map();
  canvas.addEventListener('pointerdown', e => {
    if (mode !== 'play') return;
    const r = canvas.getBoundingClientRect(), right = e.clientX - r.left > r.width / 2;
    const k = right ? 'gas' : (e.clientY - r.top > r.height / 2 ? 'fwd' : 'back');
    canvasPtr.set(e.pointerId, k); touchKeys[k] = true; audio();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => canvas.addEventListener(ev, e => { const k = canvasPtr.get(e.pointerId); if (k) { touchKeys[k] = false; canvasPtr.delete(e.pointerId); } }));

  $('btnPlay').onclick = () => { audio(); openLevels(); };
  $('btnBackTitle').onclick = openTitle;
  $('btnSound').onclick = toggleSound; $('btnSound2').onclick = toggleSound;
  $('btnPause').onclick = () => (mode === 'pause' ? resume() : pause());
  $('btnRestart').onclick = () => { if (sim && mode !== 'menu') startLevel(levelIdx); };
  $('btnResume').onclick = resume;
  $('btnPauseRestart').onclick = () => startLevel(levelIdx);
  $('btnPauseLevels').onclick = openLevels;
  $('btnRetry').onclick = () => startLevel(levelIdx);
  $('btnCrashLevels').onclick = openLevels;
  $('btnNext').onclick = () => startLevel(Math.min(levelIdx + 1, LEVEL_DEFS.length - 1));
  $('btnClearRetry').onclick = () => startLevel(levelIdx);
  $('btnClearLevels').onclick = openLevels;
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (mode === 'play') pause(); engineSound(false, 0, false); } });
  setSoundUi();

  // ---------- rendering ----------
  let vw = 1, vh = 1, dpr = 1;
  function resize() {
    const r = view.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = Math.max(1, r.width); vh = Math.max(1, r.height);
    canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
    const worldW = Math.max(440, Math.min(640, vw / vh * 360));
    cam.zoom = Math.min(vw / worldW, vh / 300);
  }
  function snapCam() { if (!sim) return; cam.x = sim.ch.x + 60; cam.y = sim.ch.y - 30 - vh / cam.zoom * 0.08; }
  function updateCamera(dt) {
    if (!sim) return;
    const tx = sim.ch.x + Math.max(-80, Math.min(200, sim.ch.vx * 0.25)) + 60, ty = sim.ch.y - 30 - vh / cam.zoom * 0.08;
    const k = Math.min(1, dt * 5);
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  }
  const hillCache = {};
  function hills(seed, n) {
    if (hillCache[seed]) return hillCache[seed];
    const a = []; let r = seed;
    for (let i = 0; i < n; i++) { r = (r * 16807) % 2147483647; a.push(r / 2147483647); }
    return (hillCache[seed] = a);
  }
  function drawBackground(th) {
    const g = ctx.createLinearGradient(0, 0, 0, vh);
    g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
    ctx.fillStyle = th.sun; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(vw * 0.78, vh * 0.22, Math.min(vw, vh) * 0.09, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    if (th.deco === 'tower') {
      const st = hills(7, 60); ctx.fillStyle = '#ffffffaa';
      for (let i = 0; i < 40; i++) ctx.fillRect(st[i] * vw, st[i + 20] * vh * 0.5, 2, 2);
    }
    const layer = (par, color, base, amp, seed, kind) => {
      const off = cam.x * par, rnd = hills(seed, 64), W = 160;
      ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, vh);
      const i0 = Math.floor(off / W) - 1;
      for (let i = i0; i <= i0 + Math.ceil(vw / W) + 2; i++) {
        const x = i * W - off, h = rnd[((i % 64) + 64) % 64];
        if (kind === 'tower') { const y = base - amp * (0.3 + h); ctx.lineTo(x, base); ctx.lineTo(x, y); ctx.lineTo(x + W * 0.7, y); ctx.lineTo(x + W * 0.7, base); }
        else if (kind === 'pine') { const y = base - amp * (0.4 + h * 0.6); ctx.lineTo(x, base); ctx.lineTo(x + W * 0.25, y); ctx.lineTo(x + W * 0.5, base); ctx.lineTo(x + W * 0.55, base - amp * 0.5 * (0.6 + h)); ctx.lineTo(x + W * 0.8, base); }
        else ctx.lineTo(x, base - amp * h);
      }
      ctx.lineTo(vw, vh); ctx.closePath(); ctx.fill();
    };
    layer(0.12, th.far, vh * 0.72, vh * 0.28, 11, th.deco === 'tower' ? 'tower' : 'hill');
    layer(0.3, th.mid, vh * 0.86, vh * 0.3, 23, th.deco === 'pine' ? 'pine' : th.deco === 'tower' ? 'tower' : 'hill');
  }
  function drawWorld(s, th) {
    const L = s.L, z = cam.zoom, x0 = cam.x - vw / 2 / z, x1 = cam.x + vw / 2 / z, bottom = cam.y + vh / 2 / z + 50;
    // loops (behind)
    L.objs.loops.forEach(lp => {
      ctx.lineWidth = 14; ctx.strokeStyle = th.ground[0];
      ctx.beginPath(); ctx.arc(lp.cx, lp.cy, lp.R + 7, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 4; ctx.strokeStyle = th.edge;
      ctx.beginPath(); ctx.arc(lp.cx, lp.cy, lp.R + 1, 0, Math.PI * 2); ctx.stroke();
    });
    // ground
    const g = ctx.createLinearGradient(0, cam.y - 100, 0, cam.y + 500);
    g.addColorStop(0, th.ground[0]); g.addColorStop(1, th.ground[1]);
    for (const l of L.lines) {
      if (l[l.length - 1][0] < x0 - 50 || l[0][0] > x1 + 50) continue;
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(l[0][0], Math.max(bottom, l[0][1]));
      for (const p of l) ctx.lineTo(p[0], p[1]);
      ctx.lineTo(l[l.length - 1][0], Math.max(bottom, l[l.length - 1][1])); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = th.edge; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.beginPath();
      l.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke();
    }
    // lifts and ferries
    ctx.lineWidth = 3;
    for (const f of L.objs.lifts) {
      const y = liftY(f, s.t);
      ctx.strokeStyle = '#0006'; ctx.beginPath(); ctx.moveTo((f.x0 + f.x1) / 2, y); ctx.lineTo((f.x0 + f.x1) / 2, f.bot + 400); ctx.stroke();
      plate(f.x0, y, f.x1 - f.x0, 14, th);
    }
    for (const m of L.objs.movers) plate(moverX(m, s.t), m.y, m.w, 18, th);
    // seesaws
    L.objs.seesaws.forEach((q, i) => {
      const st = s.seesaws[i];
      ctx.fillStyle = '#4a3428'; ctx.beginPath(); ctx.moveTo(q.px, q.py); ctx.lineTo(q.px - 24, q.py + 34); ctx.lineTo(q.px + 24, q.py + 34); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.translate(q.px, q.py); ctx.rotate(st.th);
      ctx.fillStyle = '#c98a4b'; ctx.fillRect(-q.half, -6, q.half * 2, 12);
      ctx.fillStyle = '#8a5a2e'; for (let k = -q.half + 20; k < q.half; k += 40) ctx.fillRect(k, -6, 3, 12);
      ctx.restore();
      ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.arc(q.px, q.py, 5, 0, Math.PI * 2); ctx.fill();
    });
    // barrels
    for (const b of s.barrels) {
      if (!b.alive) continue;
      ctx.fillStyle = '#d8342c'; ctx.fillRect(b.x - 12, b.y - BARREL_R, 24, BARREL_R * 2);
      ctx.fillStyle = '#ffc93c'; ctx.fillRect(b.x - 12, b.y - 4, 24, 8);
      ctx.fillStyle = '#7d1712'; ctx.fillRect(b.x - 12, b.y - BARREL_R, 24, 3); ctx.fillRect(b.x - 12, b.y + BARREL_R - 3, 24, 3);
      ctx.fillStyle = '#2a1a12'; ctx.beginPath(); ctx.moveTo(b.x, b.y - 3); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x + 4, b.y + 3); ctx.closePath(); ctx.fill();
    }
    // start and finish
    ctx.fillStyle = '#ffffffaa'; ctx.fillRect(196, -60, 4, 60);
    const fx = L.finishX, fy = groundYAt(L, fx);
    ctx.fillStyle = '#2a1a12'; ctx.fillRect(fx - 2, fy - 110, 5, 110);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) { ctx.fillStyle = (r + c) % 2 ? '#2a1a12' : '#fff'; ctx.fillRect(fx + 3 + c * 10, fy - 110 + r * 10, 10, 10); }
    // explosions
    for (const b of s.boom) {
      if (b.t > 0.8) continue;
      const k = b.t / 0.8, r = 20 + k * 90;
      ctx.globalAlpha = 1 - k; ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.55, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  function plate(x, y, w, h, th) {
    ctx.fillStyle = '#5d6b78'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = th.edge; ctx.fillRect(x, y, w, 4);
    ctx.fillStyle = '#ffc93c'; for (let k = x + 8; k < x + w - 8; k += 24) ctx.fillRect(k, y + h - 5, 12, 3);
  }
  function groundYAt(L, x) {
    for (const l of L.lines) for (let i = 1; i < l.length; i++) if (l[i - 1][0] <= x && l[i][0] >= x && l[i][0] > l[i - 1][0]) return l[i - 1][1] + (l[i][1] - l[i - 1][1]) * (x - l[i - 1][0]) / (l[i][0] - l[i - 1][0]);
    return 0;
  }
  function drawWheel(w) {
    ctx.save(); ctx.translate(w.x, w.y); ctx.rotate(w.spin);
    ctx.fillStyle = '#1d1512'; ctx.beginPath(); ctx.arc(0, 0, WR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#cfc4b8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, WR - 5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; ctx.moveTo(Math.cos(a) * (WR - 5), Math.sin(a) * (WR - 5)); ctx.lineTo(-Math.cos(a) * (WR - 5), -Math.sin(a) * (WR - 5)); } ctx.stroke();
    ctx.restore();
  }
  function drawBike(s) {
    const ch = s.ch;
    s.wheels.forEach(drawWheel);
    // swingarms in world space
    ctx.strokeStyle = '#3b2c24'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    s.wheels.forEach((w, i) => { const [rx, ry] = rot(ch.a, MOUNTS[i][0] * 0.6, MOUNTS[i][1] - 10); ctx.beginPath(); ctx.moveTo(ch.x + rx, ch.y + ry); ctx.lineTo(w.x, w.y); ctx.stroke(); });
    ctx.save(); ctx.translate(ch.x, ch.y); ctx.rotate(ch.a);
    // frame and body
    ctx.fillStyle = '#ff7a1a'; ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-24, -4); ctx.lineTo(-6, -14); ctx.lineTo(18, -14); ctx.lineTo(26, -6); ctx.lineTo(14, 6); ctx.lineTo(-14, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2a1a12'; ctx.fillRect(-26, -9, 20, 5);
    ctx.strokeStyle = '#3b2c24'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(24, -8); ctx.lineTo(20, -24); ctx.stroke();
    if (!s.rider) drawRider(s.lean);
    ctx.restore();
    if (s.rider) {
      const r = s.rider; ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.a); ctx.translate(4, 26); drawRider(0); ctx.restore();
    }
  }
  function drawRider(lean) {
    const lx = lean * 7, hip = [-10 + lx * 0.4, -12], sh = [-2 + lx, -32], hand = [20, -24], head = [HEAD[0] + lx, HEAD[1]];
    ctx.lineCap = 'round'; ctx.strokeStyle = '#13786d'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(4, -4); ctx.lineTo(6, 4); ctx.stroke();
    ctx.strokeStyle = '#19c2b0'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(sh[0], sh[1]); ctx.stroke();
    ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo((sh[0] + hand[0]) / 2 + 2, -22); ctx.lineTo(hand[0], hand[1]); ctx.stroke();
    ctx.fillStyle = '#ffc93c'; ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(head[0], head[1], HEAD_R + 1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2a1a12'; ctx.beginPath(); ctx.moveTo(head[0] + 2, head[1] - 3); ctx.lineTo(head[0] + 10, head[1] - 2); ctx.lineTo(head[0] + 9, head[1] + 4); ctx.lineTo(head[0] + 2, head[1] + 3); ctx.closePath(); ctx.fill();
  }
  function render() {
    if (!sim) return;
    const th = THEMES[worldOf(levelIdx)];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground(th);
    ctx.setTransform(dpr * cam.zoom, 0, 0, dpr * cam.zoom, dpr * (vw / 2 - cam.x * cam.zoom), dpr * (vh / 2 - cam.y * cam.zoom));
    drawWorld(sim, th);
    drawBike(sim);
  }

  // ---------- main loop ----------
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!document.hidden && sim) {
      if (mode === 'play') {
        acc += dt;
        let n = 0;
        const inp = readInput();
        while (acc >= STEP && n < 14) { stepSim(sim, inp); handleEvents(); acc -= STEP; n++; }
        if ((sim.crashed || sim.done) && !endAt) endAt = now;
        if (endAt && now - endAt > (sim.done ? 900 : 1300)) { endAt = 0; if (sim.done) finishLevel(); else crashLevel(); }
        engineSound(!sim.crashed && !sim.done, sim.speed, inp.gas);
        updateHud();
      }
      updateCamera(reduceMotion ? 1 : dt);
      render();
    }
    requestAnimationFrame(frame);
  }

  // Test hook: automated browsers only (navigator.webdriver), so players cannot script the game from the console.
  if (navigator.webdriver) window.__motoStunts = {
    state: () => sim && { mode, level: levelIdx, t: sim.t, x: sim.ch.x, y: sim.ch.y, a: sim.ch.a, crashed: sim.crashed, done: sim.done, final: sim.final, flips: sim.flips, finishX: sim.L.finishX, overlay: overlays.find(o => !o.hidden)?.id || null, progress: JSON.parse(JSON.stringify(progress)) },
    count: LEVEL_DEFS.length,
    stars: i => LEVEL_DEFS[i].t,
    marks: i => getLevel(i).marks,
    sim: { create: i => createSim(getLevel(i)), step: (s, inp) => stepSim(s, inp), STEP },
    // Drives the live game with a controller function (sim → input) instead of keys.
    autoplay: fn => { autoplay = fn; },
    start: i => startLevel(i),
    show: (i, s) => { levelIdx = i; sim = s; mode = 'end'; show(null); app.classList.remove('menu'); snapCam(); render(); },
  };

  openTitle();
  new ResizeObserver(resize).observe(view);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
